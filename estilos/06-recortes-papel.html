'use strict';
// ---------------------------------------------------------------------------
// Diorama de papel recortado, animado "a pasos" (12 fps, como stop-motion).
// Todo se dibuja en un marco de 1080x1920 con Canvas 2D: cada pieza de papel
// es un Path2D cortado "a mano" (bordes con leve ondulación), con textura de
// fibras procedural, sombra suave según su altura y un filo de luz.
// ---------------------------------------------------------------------------
const DUR = 10, FPS = 12, NF = DUR * FPS, W = 1080, H = 1920;
const TAU = Math.PI * 2, PI = Math.PI, D2R = PI / 180;
const CAPTURA = /captura/.test(location.search);
const cv = document.getElementById('c');
const main = cv.getContext('2d');
let g = main, S = 1, OX = 0, OY = 0, F = 0, lastF = -1, back = null, front = null, title = null;

const C = {
  bg: '#0d1327', sky: '#111a33', ring1: '#162043', ring2: '#1b284f', ring3: '#21305c',
  frame: '#090e1e', ivory: '#f1e5c7', ivory2: '#e3d3aa', ivory3: '#d6c393', ink: '#1a2342',
  gold: '#e2ad47', goldD: '#b7832f', goldL: '#f3cf77', coral: '#d8634a', coralD: '#a94832',
  mustard: '#dca443', teal: '#2a6a7c', teal2: '#4d8d99', sage: '#95af7f', sageD: '#7d9a69',
  moonDark: '#2b3967', backing: '#1e2b55', skin: '#efd0ad',
};
const MX = 540, MY = 835, MR = 152;          // Luna / átomo
const EX = 540, EY = 1292, ER = 156, EB = 284; // Tierra (radio del océano y del disco de soporte)
const TX = 866, TY = 690;                    // etiqueta colgante (agujero)

// ---------- utilidades ----------
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hsh(a, b) { let h = Math.imul(a + 0x9e3779b9 | 0, 0x85ebca6b) ^ Math.imul(b + 0x7f4a7c15 | 0, 0xc2b2ae35); h = Math.imul(h ^ h >>> 15, 0x2c1b3c6d); h = Math.imul(h ^ h >>> 12, 0x297a2d39); h ^= h >>> 15; return (h >>> 0) / 4294967296; }
const cl = (x) => x < 0 ? 0 : x > 1 ? 1 : x;
const seg = (t, a, b) => cl((t - a) / (b - a));
const eio = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eout = (x) => 1 - Math.pow(1 - x, 3);
const ein = (x) => x * x * x;
const eback = (x, c1 = 1.4) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, u) => a + (b - a) * u;
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }

// ---------- textura de papel (mosaico continuo) ----------
let TEXA, TEXB;
function makeTextures() {
  const N = 512, r = rng(1234);
  const oct = [[4, .5], [8, .32], [16, .2], [32, .13], [128, .09]].map(([gg, a]) => {
    const L = new Float32Array(gg * gg); for (let i = 0; i < L.length; i++) L[i] = r() * 2 - 1; return { gg, a, L };
  });
  const A = mk(N, N), a = A.getContext('2d'), ia = a.createImageData(N, N);
  const B = mk(N, N), b = B.getContext('2d'), ib = b.createImageData(N, N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let s = 0;
    for (const o of oct) {
      const fx = x / N * o.gg, fy = y / N * o.gg, x0 = fx | 0, y0 = fy | 0;
      let tx = fx - x0, ty = fy - y0; tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
      const x1 = (x0 + 1) % o.gg, y1 = (y0 + 1) % o.gg, L = o.L, q = o.gg;
      const p = L[y0 * q + x0], qq = L[y0 * q + x1], m = L[y1 * q + x0], n = L[y1 * q + x1];
      const top = p + (qq - p) * tx, bot = m + (n - m) * tx;
      s += o.a * (top + (bot - top) * ty);
    }
    const gr = r() * 2 - 1, i = (y * N + x) * 4;
    const v = 239 + 13 * s + 6 * gr;
    ia.data[i] = v; ia.data[i + 1] = v - 1.5; ia.data[i + 2] = v - 4; ia.data[i + 3] = 255;
    const w = Math.max(0, 16 * s + 4 * gr);
    ib.data[i] = w; ib.data[i + 1] = w * 0.97; ib.data[i + 2] = w * 0.9; ib.data[i + 3] = 255;
  }
  a.putImageData(ia, 0, 0); b.putImageData(ib, 0, 0);
  // fibras: trazos finos curvados, claros y oscuros, repetidos para que el mosaico encaje
  for (let k = 0; k < 900; k++) {
    const light = r() < 0.6, cx = light ? b : a;
    const pts = []; let px = r() * N, py = r() * N, an = r() * TAU; const len = 5 + Math.pow(r(), 1.6) * 34;
    for (let s = 0; s <= 6; s++) { pts.push([px, py]); an += (r() - 0.5) * 0.8; px += Math.cos(an) * len / 6; py += Math.sin(an) * len / 6; }
    cx.lineWidth = 0.35 + r() * 0.85; cx.lineCap = 'round';
    cx.strokeStyle = light ? `rgba(255,246,228,${0.18 + r() * 0.4})` : `rgba(96,78,60,${0.06 + r() * 0.13})`;
    for (const ox of [-N, 0, N]) for (const oy of [-N, 0, N]) {
      cx.beginPath(); cx.moveTo(pts[0][0] + ox, pts[0][1] + oy);
      for (let s = 1; s < pts.length; s++) cx.lineTo(pts[s][0] + ox, pts[s][1] + oy);
      cx.stroke();
    }
  }
  // motas (inclusiones) muy pequeñas
  for (let k = 0; k < 160; k++) {
    const x = r() * N, y = r() * N, rr = 0.4 + r() * 0.9;
    a.fillStyle = `rgba(80,64,50,${0.1 + r() * 0.15})`; a.beginPath(); a.arc(x, y, rr, 0, TAU); a.fill();
  }
  TEXA = A; TEXB = B;
}
function pats(c) {
  if (!c.__pa) { c.__pa = c.createPattern(TEXA, 'repeat'); c.__pb = c.createPattern(TEXB, 'repeat'); }
  return c;
}

// ---------- pieza de papel ----------
function noShadow() { g.shadowColor = 'rgba(0,0,0,0)'; g.shadowBlur = 0; g.shadowOffsetX = 0; g.shadowOffsetY = 0; }
function setShadow(d, a = 0.55) {
  g.shadowColor = `rgba(3,5,14,${a})`; g.shadowBlur = (1.5 + d * 2.1) * S;
  g.shadowOffsetX = d * 0.62 * S; g.shadowOffsetY = d * 1.08 * S;
}
function tex(path, seed, ta, tb, rule) {
  pats(g);
  const M = new DOMMatrix([1, 0, 0, 1, (seed * 137.31) % 512, (seed * 91.77) % 512]);
  g.save();
  if (ta > 0) { g.__pa.setTransform(M); g.globalCompositeOperation = 'multiply'; g.globalAlpha = ta; g.fillStyle = g.__pa; g.fill(path, rule); }
  if (tb > 0) { g.__pb.setTransform(M); g.globalCompositeOperation = 'screen'; g.globalAlpha = tb; g.fillStyle = g.__pb; g.fill(path, rule); }
  g.restore();
}
// filo de luz en los bordes que miran a la lámpara (arriba-izquierda): la sombra de lo
// que rodea a la pieza, desplazada, cae dentro de la pieza.
function rim(path, bb, a) {
  const m = g.getTransform(), X = 30000;
  g.save(); g.clip(path);
  const p = new Path2D(); p.rect(-bb, -bb, 2 * bb, 2 * bb); p.addPath(path);
  g.translate(X, 0);
  g.shadowColor = `rgba(255,236,205,${a})`; g.shadowBlur = 2.2 * S;
  g.shadowOffsetX = -m.a * X + 1.3 * S; g.shadowOffsetY = -m.b * X + 2.1 * S;
  g.fillStyle = '#000'; g.fill(p, 'evenodd');
  g.restore();
}
function paper(path, col, o = {}) {
  const d = o.d ?? 3, rule = o.rule || 'nonzero';
  g.fillStyle = col;
  if (d > 0) {
    setShadow(d, o.sa ?? 0.5); g.fill(path, rule);
    g.shadowColor = 'rgba(3,5,14,0.45)'; g.shadowBlur = 1.1 * S;
    g.shadowOffsetX = Math.min(d, 2.5) * 0.35 * S; g.shadowOffsetY = Math.min(d, 2.5) * 0.65 * S;
    g.fill(path, rule); noShadow();
  } else g.fill(path, rule);
  if (o.print) { g.save(); g.clip(path, rule); o.print(); g.restore(); }
  tex(path, o.seed ?? 0, o.ta ?? 1, o.tb ?? 0.55, rule);
  if (o.rim) rim(path, o.bb ?? 200, o.rim);
}
function jit(id, amp = 0.6, ra = 0.0035) {
  g.translate((hsh(F, id * 3 + 1) - 0.5) * 2 * amp, (hsh(F, id * 3 + 2) - 0.5) * 2 * amp);
  g.rotate((hsh(F, id * 3 + 3) - 0.5) * 2 * ra);
}

// ---------- geometría "cortada a mano" ----------
function wob(seed, amp, n = 5) {
  const r = rng(seed), hs = [];
  for (let i = 0; i < n; i++) hs.push([2 + Math.floor(r() * 7) + i * 2, r() * TAU, amp * (0.5 + r() * 0.5) / (1 + i * 0.7)]);
  return (th) => { let s = 0; for (const [k, p, a] of hs) s += a * Math.sin(k * th + p); return s; };
}
function circ(R, seed, amp = 0.006, scal = 0, sn = 0) {
  const w = wob(seed, amp), n = Math.max(40, Math.round(R * 0.9)), p = new Path2D();
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU; let r = R * (1 + w(th));
    if (scal) r += scal * (Math.pow(Math.abs(Math.sin(sn * th / 2)), 0.55) - 0.75);
    i ? p.lineTo(r * Math.cos(th), r * Math.sin(th)) : p.moveTo(r * Math.cos(th), r * Math.sin(th));
  }
  p.closePath(); return p;
}
// fase lunar: lado iluminado hacia +x (side=1) o -x (side=-1); k=1 nueva, 0 cuarto, -1 llena
function phase(R, k, side, seed) {
  const w = wob(seed, 0.006), n = Math.max(24, Math.round(R * 0.5)), p = new Path2D();
  for (let i = 0; i <= n; i++) { const th = -PI / 2 + i / n * PI, r = R * (1 + w(th)); const x = side * r * Math.cos(th), y = r * Math.sin(th); i ? p.lineTo(x, y) : p.moveTo(x, y); }
  for (let i = 0; i <= n; i++) { const th = PI / 2 - i / n * PI; p.lineTo(side * k * R * Math.cos(th) * (1 + w(th + 2) * 0.6), R * Math.sin(th)); }
  p.closePath(); return p;
}
function smooth(pts) { // curva cerrada suave por los puntos medios
  const p = new Path2D(), n = pts.length;
  const mid = (i) => [(pts[i % n][0] + pts[(i + 1) % n][0]) / 2, (pts[i % n][1] + pts[(i + 1) % n][1]) / 2];
  const m0 = mid(n - 1); p.moveTo(m0[0], m0[1]);
  for (let i = 0; i < n; i++) { const m = mid(i); p.quadraticCurveTo(pts[i][0], pts[i][1], m[0], m[1]); }
  p.closePath(); return p;
}
function blob(R, seed, amp = 0.18, n = 9) {
  const r = rng(seed), pts = [];
  for (let i = 0; i < n; i++) { const th = i / n * TAU + (r() - 0.5) * 0.3, rr = R * (1 + (r() - 0.5) * 2 * amp); pts.push([rr * Math.cos(th), rr * Math.sin(th) * 0.85]); }
  return smooth(pts);
}
function star(R, ri, nPts = 5, rot = -PI / 2, seed = 1) {
  const r = rng(seed), p = new Path2D();
  for (let i = 0; i < nPts * 2; i++) {
    const th = rot + i / (nPts * 2) * TAU, rr = (i % 2 ? ri : R) * (1 + (r() - 0.5) * 0.06);
    i ? p.lineTo(rr * Math.cos(th), rr * Math.sin(th)) : p.moveTo(rr * Math.cos(th), rr * Math.sin(th));

function rrect(x, y, w, h, r) { const p = new Path2D(); p.roundRect ? p.roundRect(x, y, w, h, r) : p.rect(x, y, w, h); return p; }
// contorno de rectángulo redondeado con pequeña ondulación de tijera
function wobRect(x, y, w, h, rad, seed, amp = 1.2) {
  const pts = [], st = 6, wv = wob(seed, 1, 6);
  const per = 2 * (w + h - 4 * rad) + TAU * rad; const n = Math.round(per / st);
  const P = (s) => { // s en [0, per)
    const sides = [w - 2 * rad, PI / 2 * rad, h - 2 * rad, PI / 2 * rad, w - 2 * rad, PI / 2 * rad, h - 2 * rad, PI / 2 * rad];
    let k = 0; while (s > sides[k] && k < 7) { s -= sides[k]; k++; }
    const cs = [[x + rad, y], [x + w - rad, y + rad], [x + w, y + rad], [x + w - rad, y + h - rad], [x + w - rad, y + h], [x + rad, y + h - rad], [x, y + h - rad], [x + rad, y + rad]];
    switch (k) {
      case 0: return [x + rad + s, y, 0, -1];
      case 1: { const a = -PI / 2 + s / rad; return [x + w - rad + rad * Math.cos(a), y + rad + rad * Math.sin(a), Math.cos(a), Math.sin(a)]; }
      case 2: return [x + w, y + rad + s, 1, 0];
      case 3: { const a = s / rad; return [x + w - rad + rad * Math.cos(a), y + h - rad + rad * Math.sin(a), Math.cos(a), Math.sin(a)]; }
      case 4: return [x + w - rad - s, y + h, 0, 1];
      case 5: { const a = PI / 2 + s / rad; return [x + rad + rad * Math.cos(a), y + h - rad + rad * Math.sin(a), Math.cos(a), Math.sin(a)]; }
      case 6: return [x, y + h - rad - s, -1, 0];
      default: { const a = PI + s / rad; return [x + rad + rad * Math.cos(a), y + rad + rad * Math.sin(a), Math.cos(a), Math.sin(a)]; }
    }
  };
  const p = new Path2D();
  for (let i = 0; i < n; i++) { const [px, py, nx, ny] = P(i / n * per); const o = wv(i / n * TAU) * amp; i ? p.lineTo(px + nx * o, py + ny * o) : p.moveTo(px + nx * o, py + ny * o); }
  p.closePath(); return p;
}

  if (t < 2.55) { const u = eout(seg(t, 2.15, 2.55)); s.crL = 1.2 * (1 - u); s.crX = -70 * (1 - u); s.crY = -90 * (1 - u); s.crR = -0.3 * (1 - u); }
  else if (t >= 7.55) { const u = ein(seg(t, 7.55, 7.9)); s.crL = 1.4 * u; s.crX = 80 * u; s.crY = -120 * u; s.crR = 0.35 * u; }
  else { s.crL = 0; s.crX = 0; s.crY = 0; s.crR = 0; }
  s.pinVis = t >= 3.0 && t < 7.0;
  s.rot = PI * eio(seg(t, 4.3, 5.6));
  s.erot = s.rot + PI * eio(seg(t, 8.35, 9.6));
  s.tagVis = t >= 2.55 && t < 7.45;
  if (t < 3.25) s.tagY = -780 * (1 - eback(seg(t, 2.55, 3.25), 0.9));
  else if (t >= 6.95) s.tagY = -800 * ein(seg(t, 6.95, 7.45));
  else s.tagY = 0;
  s.tagSw = (t >= 3.25 ? 0.05 * Math.exp(-(t - 3.25) * 2.4) * Math.sin((t - 3.25) * 8) : 0) + 0.014 * Math.sin(TAU * t * 3 / DUR);
  s.tagSpin = PI * eio(seg(t, 4.65, 5.35));
  s.armN = eio(seg(t, 3.0, 3.4)) * (1 - eio(seg(t, 4.1, 4.4)));
  s.armS = eio(seg(t, 5.65, 6.05)) * (1 - eio(seg(t, 7.2, 7.6)));
  return s;
}

function drawAtomMoon(t, s) {
  g.save(); g.translate(MX, MY);
  const ph = TAU * (8 * t / DUR);
  // átomo: mitades traseras de las órbitas, núcleo, mitades delanteras (las órbitas se entrelazan)
  const orbitPart = (front) => {
    if (s.orb <= 0.02) return;
    P.orb.forEach((o, i) => {
      g.save(); jit(10 + i + (front ? 5 : 0), 0.5, 0.004); g.rotate(o.ang); g.scale(s.orb, s.orb);
      g.save(); g.scale(1 / s.orb, 1 / s.orb); g.restore();
      paper(o[front ? 'front' : 'back'], C.ivory, { d: 2.2 + 6 * s.orbL, seed: 12 + i, ta: 1, tb: 0.4 });
      // electrón en esta mitad
      const e = ph + i * TAU / 3 + i * 0.7, sy = Math.sin(e);
      if ((sy >= 0) === front) {
        g.save(); g.translate(o.a * Math.cos(e), o.b * sy); g.rotate(-o.ang); g.scale(1 / Math.max(s.orb, 0.3), 1 / Math.max(s.orb, 0.3)); g.scale(Math.max(s.orb, 0.3), Math.max(s.orb, 0.3));
        jit(20 + i, 0.5);
        paper(P.electron, C.gold, { d: 3 + 6 * s.orbL, seed: 20 + i, rim: 0.3, bb: 22 });
        g.translate(-2.2, -2.6); paper(P.electronHi, C.goldL, { d: 0.8, seed: 25 + i });
        g.restore();
      }
      g.restore();
    });
  };
  if (s.nucVis) {
    orbitPart(false);
    g.save(); jit(30, 0.5, 0.004); g.scale(s.nucS, s.nucS);
    P.nuc.forEach((n, i) => {
      g.save(); g.translate(n.x, n.y); jit(31 + i, 0.35);
      paper(n.p, n.k ? C.ivory : C.coral, { d: 2 + 7 * s.nucL, seed: 31 + i, rim: 0.28, bb: 26 });
      g.restore();
    });
    g.restore();
    orbitPart(true);
  }
  if (s.discVis) {
    g.save(); jit(40, 0.5, 0.003); g.rotate(s.rot); g.scale(s.discS, s.discS);
    paper(P.moonDisc, C.moonDark, { d: 3.5 + 8 * s.discL, seed: 41, rim: 0.22, bb: MR + 16, tb: 0.6 });
    g.restore();
    if (s.crVis) {
      g.save(); g.translate(s.crX, s.crY); jit(42, 0.5, 0.003); g.rotate(s.rot + s.crR); const sc = 1 + 0.05 * s.crL; g.scale(sc, sc);
      paper(P.cres, C.ivory2, { d: 2.2 + 9 * s.crL, seed: 43, rim: 0.35, bb: MR + 16 });
      paper(P.cresHi, C.ivory, { d: 1.4, seed: 44, ta: 0.9 });
      // cráteres y mares: se colocan uno por fotograma y se retiran igual
      g.save(); g.clip(P.cres);
      const items = [...P.maria.map((m) => ({ m })), ...P.craters.map((c) => ({ c }))];
      items.forEach((it, i) => {
        const a = 2.6 + i / FPS, rm = 7.5 - i / FPS;
        if (t < a || t >= rm) return;
        const L = Math.max(1 - seg(t, a, a + 2 / FPS), seg(t, rm - 2 / FPS, rm));
        g.save(); const o = it.m || it.c; g.translate(o.x - 6 * L, o.y - 8 * L); jit(50 + i, 0.4, 0.01); g.scale(1 + 0.08 * L, 1 + 0.08 * L);
        if (it.m) paper(it.m.p, '#ddcb9f', { d: 1 + 5 * L, seed: 60 + i, ta: 1, tb: 0.3 });
        else {
          paper(it.c.base, '#d6c290', { d: 1.2 + 5 * L, seed: 60 + i });
          g.translate(o.base ? 0 : 0, 0);
          g.save(); g.translate(1.6, 2.2); paper(it.c.inner, '#ebdcb6', { d: 0.6, seed: 70 + i, tb: 0.3 }); g.restore();
        }
        g.restore();
      });
      g.restore();
      g.restore();
    }
    if (s.pinVis) pin(45);
  }
  g.restore();
}

function drawTag(t, s) {
  if (!s.tagVis) return;
  const hy = TY + s.tagY;
  const sw = s.tagSw, len = hy + 20;
  const hx = TX + Math.sin(sw) * len * 0.15;
  thread(TX, -20, hx, hy);
  g.save(); g.translate(hx, hy); jit(90, 0.5, 0.004); g.rotate(sw);
  const c = Math.cos(s.tagSpin), backSide = c < 0, sx = Math.max(Math.abs(c), 0.04);
  g.scale(sx, 1); g.translate(0, -22);
  const shade = 1 - sx;
  paper(P.tag, backSide ? '#ece0c2' : C.ivory, { d: 5, seed: backSide ? 91 : 92, rim: 0.3, bb: 260, print: () => {
    g.save(); g.translate(0, 0);
    g.fillStyle = C.coral; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.font = 'italic 600 27px Fraunces'; g.fillText('parece una', 0, 78);
    g.fillStyle = C.ink; g.font = '900 150px Fraunces'; g.fillText(backSide ? 'C' : 'D', 0, 204);
    g.strokeStyle = 'rgba(26,35,66,0.25)'; g.lineWidth = 1.2; g.setLineDash([5, 5]);
    g.strokeRect(-72, 44, 144, 176); g.setLineDash([]);
    g.restore();
    if (shade > 0.01) { g.fillStyle = `rgba(20,24,40,${shade * 0.35})`; g.fillRect(-100, -10, 200, 260); }
  } });
  // refuerzo del agujero
  g.save(); g.translate(0, 22); paper(P.tagRing, C.mustard, { d: 1.2, seed: 93 });
  g.fillStyle = '#1a213b'; g.fill(P.tagHole); g.restore();
  g.restore();
}

function observer(coat, arm, id) {
  g.save(); g.scale(1.12, 1.12);
  paper(P.legs, C.ink, { d: 1.6, seed: id });
  // brazo trasero (colgando)
  g.save(); g.translate(-8.5, -46); g.rotate(0.28); paper(P.arm, coat === C.coral ? C.coralD : '#b9862f', { d: 1.4, seed: id + 1 }); g.restore();
  paper(P.coat, coat, { d: 1.8, seed: id + 2, rim: 0.3, bb: 70 });
  g.save(); g.translate(0, -61); g.rotate(-0.12 * arm); paper(P.head, C.skin, { d: 1.6, seed: id + 3 });
  paper(P.hat, C.ink, { d: 1, seed: id + 4 }); g.restore();
  // brazo que señala a la Luna
  g.save(); g.translate(8.2, -46); g.rotate(lerp(-0.3, -2.72, arm)); paper(P.arm, coat, { d: 1.6, seed: id + 5, rim: 0.25, bb: 30 }); g.restore();
  g.restore();
}

function arcText(str, r, center, size, col) {
  g.font = `700 ${size}px Fraunces`; g.fillStyle = col; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  const sp = size * 0.24, chars = [...str], ws = chars.map((c) => g.measureText(c).width);
  const total = ws.reduce((a, b) => a + b, 0) + sp * (chars.length - 1);
  let acc = 0;
  chars.forEach((c, i) => {
    const th = center - total / 2 / r + (acc + ws[i] / 2) / r;
    g.save(); g.translate(r * Math.cos(th), r * Math.sin(th)); g.rotate(th + PI / 2); g.fillText(c, 0, 0); g.restore();
    acc += ws[i] + sp;
  });
}

function drawEarth(t, s) {
  g.save(); g.translate(EX, EY); jit(100, 0.45, 0.002); g.rotate(s.erot);
  paper(P.backing, C.backing, { d: 5, seed: 101, rim: 0.2, bb: EB + 14, tb: 0.55, print: () => {
    g.strokeStyle = 'rgba(236,224,196,0.55)'; g.lineWidth = 1.3;
    for (let i = 0; i < 72; i++) {
      const a = i / 72 * TAU, l = i % 6 === 0 ? 12 : 6;
      g.beginPath(); g.moveTo((EB - 8) * Math.cos(a), (EB - 8) * Math.sin(a)); g.lineTo((EB - 8 - l) * Math.cos(a), (EB - 8 - l) * Math.sin(a)); g.stroke();
    }
    g.beginPath(); g.arc(0, 0, EB - 26, 0, TAU); g.strokeStyle = 'rgba(236,224,196,0.22)'; g.stroke();
    arcText('HEMISFERIO NORTE', EB - 50, -PI / 2, 27, C.ivory);
    arcText('HEMISFERIO SUR', EB - 50, PI / 2, 27, C.ivory);
  } });
  paper(P.atmo, C.teal2, { d: 2.5, seed: 102, rim: 0.25, bb: ER + 26 });
  paper(P.ocean, C.teal, { d: 2, seed: 103, rim: 0.2, bb: ER + 16, tb: 0.5 });
  g.save(); g.clip(P.ocean);
  P.land.forEach((p, i) => { g.save(); jit(110 + i, 0.3, 0.002); paper(p, C.sage, { d: 1.6, seed: 110 + i, rim: 0.25, bb: ER + 10 }); g.restore(); });
  P.desert.forEach((p, i) => { g.save(); jit(120 + i, 0.3, 0.002); paper(p, '#d9b46a', { d: 1, seed: 120 + i }); g.restore(); });
  P.ice.forEach((p, i) => { g.save(); jit(125 + i, 0.3, 0.002); paper(p, '#eee6d4', { d: 1.4, seed: 125 + i }); g.restore(); });
  // ecuador cosido con hilo
  g.save(); g.setLineDash([9, 7]); g.lineDashOffset = 0; g.lineCap = 'round';
  setShadow(1.2, 0.5); g.strokeStyle = 'rgba(246,236,214,0.95)'; g.lineWidth = 2.2;
  g.beginPath(); g.moveTo(-ER, 0); g.lineTo(ER, 0); g.stroke(); noShadow(); g.restore();
  g.fillStyle = 'rgba(10,25,32,0.55)';
  for (let x = -ER + 4; x < ER; x += 16) { g.beginPath(); g.arc(x - 1.5, 0, 1.3, 0, TAU); g.arc(x + 10.5, 0, 1.3, 0, TAU); g.fill(); }
  g.restore();
  pin(105);
  // observadores: uno de pie arriba (norte) y otro "boca abajo" abajo (sur)
  g.save(); g.translate(0, -ER + 1); jit(130, 0.5, 0.01); observer(C.coral, s.armN, 131); g.restore();
  g.save(); g.rotate(PI); g.translate(0, -ER + 1); jit(140, 0.5, 0.01); observer(C.mustard, s.armS, 141); g.restore();
  g.restore();
}

const STARS = [
  { x: 205, len: 262, R: 17, k: 'flat', a: 0.05, kk: 2, tw: 0, id: 300 },
  { x: 902, len: 214, R: 15, k: 'flat', a: 0.06, kk: 3, tw: 1, id: 301 },
  { x: 980, len: 528, R: 15, k: 'flat', a: 0.04, kk: 2, tw: 0.3, id: 302 },
  { x: 104, len: 1020, R: 18, k: 'flat', a: 0.03, kk: 1, tw: 2, id: 303 },
  { x: 960, len: 1520, R: 16, k: 'flat', a: 0.03, kk: 2, tw: 0.5, id: 304 },
];
const STARS_FRONT = [
  { x: 158, len: 668, R: 40, k: 'fold', a: 0.035, kk: 1, tw: 0.4, id: 310 },
  { x: 936, len: 1078, R: 35, k: 'fold', a: 0.03, kk: 2, tw: 1.1, id: 311 },
  { x: 128, len: 1460, R: 29, k: 'fold', a: 0.03, kk: 1, tw: 2.2, id: 312 },
];
function drawStars(list, t) {
  list.forEach((st, i) => {
    const sway = st.a * Math.sin(TAU * st.kk * t / DUR + st.id);
    const twist = st.id === 301 ? TAU * t / DUR + st.tw : 0.55 * Math.sin(TAU * (st.kk) * t / DUR + st.tw);
    hangingStar(st.x, st.len, st.R, sway, twist, st.k, st.id);
  });
}

// ---------- fotograma ----------
function draw(Fi) {
  F = Fi; const t = Fi / FPS, s = tl(t);
  g = main;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  g.fillStyle = C.bg; g.fillRect(0, 0, cv.width, cv.height);
  g.drawImage(back, OX, OY);
  g.setTransform(S, 0, 0, S, OX, OY);
  g.save(); g.beginPath(); g.rect(0, 0, W, H); g.clip();
  drawGarland(t);
  drawStars(STARS, t);
  drawTitle(t);
  drawAtomMoon(t, s);
  drawTag(t, s);
  drawEarth(t, s);
  drawStars(STARS_FRONT, t);
  g.restore();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(front, OX, OY);
  // parpadeo de exposición, como en la fotografía fotograma a fotograma
  const fl = hsh(Fi, 999) - 0.5;
  g.fillStyle = fl > 0 ? `rgba(255,238,210,${fl * 0.03})` : `rgba(0,0,8,${-fl * 0.05})`;
  g.fillRect(OX, OY, W * S, H * S);
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.round(window.innerWidth * dpr), ch = Math.round(window.innerHeight * dpr);
  if (cv.width === cw && cv.height === ch && back) return;
  cv.width = cw; cv.height = ch;
  S = Math.min(cw / W, ch / H); OX = Math.round((cw - W * S) / 2); OY = Math.round((ch - H * S) / 2);
  main.__pa = null;
  buildBack(); buildFront(); buildTitle();
  lastF = -1;
}

async function init() {
  if (document.readyState !== 'complete') await new Promise((r) => window.addEventListener('load', r, { once: true }));
  try {
    await Promise.all([
      document.fonts.load('900 116px Fraunces', 'LA LUNA AL REVÉS DC'),
      document.fonts.load('700 27px Fraunces', 'HEMISFERIO NORTE SUR'),
      document.fonts.load('italic 600 27px Fraunces', 'parece una'),
    ]);
    await document.fonts.ready;
  } catch (e) { /* si la fuente no llega se usa la de respaldo */ }
  makeTextures(); buildPaths(); resize();
  window.__frame = (t) => {
    resize();
    const Fi = ((Math.floor(t * FPS + 1e-6) % NF) + NF) % NF;
    if (Fi === lastF) return;
    lastF = Fi; draw(Fi);
  };
  window.__frame(0);
  window.__listo = true;
  if (!CAPTURA) {
    const t0 = performance.now();
    const loop = (now) => { window.__frame(((now - t0) / 1000) % DUR); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
    window.addEventListener('resize', () => { lastF = -1; });
  }
}
init();
})();
</script>
