<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recortes de papel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600..900;1,9..144,500..700&display=block">

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
// ---------------------------------------------------------------------------
// Diorama de papel recortado (16:9), animado "a pasos" a 12 fps como un stop-motion.
// Marco de diseño 1920x1080, Canvas 2D. Cada pieza es un Path2D cortado "a mano"
// (bordes con leve ondulación) con textura de fibras procedural, sombra según su
// altura sobre el fondo y un filo de luz / sombra fijo respecto a la lámpara.
// Izquierda: lo que ve el hemisferio norte (D). Derecha: el disco del hemisferio sur,
// que empieza boca abajo y gira 180° para ponerse "de pie": la Luna pasa a ser una C.
// Centro: el átomo narrador se convierte en la Luna sobre una Tierra de papel.
// ---------------------------------------------------------------------------
const DUR = 10, FPS = 12, NF = DUR * FPS, W = 1920, H = 1080;
const TAU = Math.PI * 2, PI = Math.PI, D2R = PI / 180;
const CAPTURA = /captura/.test(location.search);
const cv = document.getElementById('c');
const main = cv.getContext('2d');
let g = main, S = 1, OX = 0, OY = 0, F = 0, lastF = -1;
let back = null, cardsL = null, front = null, title = null, earthSpr = null, discN = null;

const C = {
  bg: '#0b1027', sky: '#111933', ring1: '#141e40', ring2: '#19264c', ring3: '#1f2d58',
  cloud1: '#111a3a', cloud2: '#0b112a', frame: '#080c1b',
  ivory: '#f1e5c7', ivory2: '#e4d4ab', ivory3: '#d6c393', card: '#ebdfc0', ink: '#1a2342',
  gold: '#e2ad47', goldD: '#b7832f', goldL: '#f3cf77', coral: '#d6624a', coralD: '#a64733',
  mustard: '#dfa743', mustardD: '#b07f2c', teal: '#2a6a7c', teal2: '#4d8d99', sage: '#95af7f',
  moonDark: '#2b3967', backing: '#1d2a54', skin: '#efd0ad',
  dsky: '#1a2652', hillA: '#2b3d6c', hillB: '#285462', hillC: '#3d7364', tree: '#1d4250',
};
// geometría de la escena
const CARDS = [
  { x: 372, y: 530, rot: -0.014, side: 1, seed: 500, label: 'hemisferio norte', coat: '#d6624a', coatD: '#a64733' },
  { x: 1548, y: 530, rot: 0.012, side: -1, seed: 520, label: 'hemisferio sur', coat: '#dfa743', coatD: '#b07f2c' },
];
const CW = 452, CH = 566, WIN_DY = -72, WIN_R = 178, DISC_R = 204;
const MX = 960, MY = 370, MR = 98;            // átomo / Luna
const EX = 960, EY = 702, ER = 118, EB = 166; // Tierra
const MOON_D = { x: 64, y: -78, r: 56 };      // Luna dentro de los discos (lado norte)
const OBS_X = -86, OBS_S = 1.42;              // observador dentro de los discos

// ---------- utilidades ----------
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hsh(a, b) { let h = Math.imul(a + 0x9e3779b9 | 0, 0x85ebca6b) ^ Math.imul(b + 0x7f4a7c15 | 0, 0xc2b2ae35); h = Math.imul(h ^ h >>> 15, 0x2c1b3c6d); h = Math.imul(h ^ h >>> 12, 0x297a2d39); h ^= h >>> 15; return (h >>> 0) / 4294967296; }
const cl = (x) => x < 0 ? 0 : x > 1 ? 1 : x;
const seg = (t, a, b) => cl((t - a) / (b - a));
const eio = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eout = (x) => 1 - Math.pow(1 - x, 3);
const ein = (x) => x * x * x;
const eback = (x, c1 = 1.4) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const eiob = (x) => { const c2 = 1.2 * 1.525; return x < 0.5 ? (Math.pow(2 * x, 2) * ((c2 + 1) * 2 * x - c2)) / 2 : (Math.pow(2 * x - 2, 2) * ((c2 + 1) * (x * 2 - 2) + c2) + 2) / 2; };
const lerp = (a, b, u) => a + (b - a) * u;
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }

// ---------- textura de papel (mosaico continuo) ----------
let TEXA, TEXB;
function makeTextures() {
  const N = 512, r = rng(1234);
  const oct = [[4, .5], [8, .32], [16, .2], [32, .13], [128, .09]].map(([gg, a]) => {
    const L = new Float32Array(gg * gg); for (let i = 0; i < L.length; i++) L[i] = r() * 2 - 1; return { gg, a, L };
  });
  const A = mk(N, N), a = A.getContext('2d'), ia = a.createImageData(N, N);
  const B = mk(N, N), b = B.getContext('2d'), ib = b.createImageData(N, N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let s = 0;
    for (const o of oct) {
      const fx = x / N * o.gg, fy = y / N * o.gg, x0 = fx | 0, y0 = fy | 0;
      let tx = fx - x0, ty = fy - y0; tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
      const x1 = (x0 + 1) % o.gg, y1 = (y0 + 1) % o.gg, L = o.L, q = o.gg;
      const p = L[y0 * q + x0], qq = L[y0 * q + x1], m = L[y1 * q + x0], n = L[y1 * q + x1];
      const top = p + (qq - p) * tx, bot = m + (n - m) * tx;
      s += o.a * (top + (bot - top) * ty);
    }
    const gr = r() * 2 - 1, i = (y * N + x) * 4;
    const v = 239 + 13 * s + 6 * gr;
    ia.data[i] = v; ia.data[i + 1] = v - 1.5; ia.data[i + 2] = v - 4; ia.data[i + 3] = 255;
    const w = Math.max(0, 16 * s + 4 * gr);
    ib.data[i] = w; ib.data[i + 1] = w * 0.97; ib.data[i + 2] = w * 0.9; ib.data[i + 3] = 255;
  }
  a.putImageData(ia, 0, 0); b.putImageData(ib, 0, 0);
  // fibras: trazos finos curvados, claros y oscuros, repetidos para que el mosaico encaje
  for (let k = 0; k < 900; k++) {
    const light = r() < 0.6, cx = light ? b : a;
    const pts = []; let px = r() * N, py = r() * N, an = r() * TAU; const len = 5 + Math.pow(r(), 1.6) * 34;
    for (let s = 0; s <= 6; s++) { pts.push([px, py]); an += (r() - 0.5) * 0.8; px += Math.cos(an) * len / 6; py += Math.sin(an) * len / 6; }
    cx.lineWidth = 0.35 + r() * 0.85; cx.lineCap = 'round';
    cx.strokeStyle = light ? `rgba(255,246,228,${0.18 + r() * 0.4})` : `rgba(96,78,60,${0.06 + r() * 0.13})`;
    for (const ox of [-N, 0, N]) for (const oy of [-N, 0, N]) {
      cx.beginPath(); cx.moveTo(pts[0][0] + ox, pts[0][1] + oy);
      for (let s = 1; s < pts.length; s++) cx.lineTo(pts[s][0] + ox, pts[s][1] + oy);
      cx.stroke();
    }
  }
  for (let k = 0; k < 160; k++) {
    const x = r() * N, y = r() * N, rr = 0.4 + r() * 0.9;
    a.fillStyle = `rgba(80,64,50,${0.1 + r() * 0.15})`; a.beginPath(); a.arc(x, y, rr, 0, TAU); a.fill();
  }
  TEXA = A; TEXB = B;
}
function pats(c) {
  if (!c.__pa) { c.__pa = c.createPattern(TEXA, 'repeat'); c.__pb = c.createPattern(TEXB, 'repeat'); }
  return c;
}

// ---------- pieza de papel ----------
function noShadow() { g.shadowColor = 'rgba(0,0,0,0)'; g.shadowBlur = 0; g.shadowOffsetX = 0; g.shadowOffsetY = 0; }
function setShadow(d, a = 0.55) {
  g.shadowColor = `rgba(3,5,14,${a})`; g.shadowBlur = (1.5 + d * 2.1) * S;
  g.shadowOffsetX = d * 0.6 * S; g.shadowOffsetY = d * 1.05 * S;
}
function tex(path, seed, ta, tb, rule) {
  pats(g);
  const M = new DOMMatrix([1, 0, 0, 1, (seed * 137.31) % 512, (seed * 91.77) % 512]);
  g.save();
  if (ta > 0) { g.__pa.setTransform(M); g.globalCompositeOperation = 'multiply'; g.globalAlpha = ta; g.fillStyle = g.__pa; g.fill(path, rule); }
  if (tb > 0) { g.__pb.setTransform(M); g.globalCompositeOperation = 'screen'; g.globalAlpha = tb; g.fillStyle = g.__pb; g.fill(path, rule); }
  g.restore();
}
// filo de luz arriba-izquierda y filo oscuro abajo-derecha: la pieza menos una copia
// desplazada (en píxeles de pantalla, así la luz no gira con la pieza).
// (rectángulo del tamaño de la pieza menos la pieza desplazada, recortado a la pieza)
function edge(path, rule, a) {
  const bb = path.bb; if (!bb) return;
  const m = g.getTransform(), det = m.a * m.d - m.b * m.c, sc = Math.sqrt(Math.abs(det)) || 1;
  const loc = (dx, dy) => [(m.d * dx - m.c * dy) / det, (-m.b * dx + m.a * dy) / det];
  const k = Math.max(S, 0.6), mg = 4 / sc;
  g.save(); g.clip(path, rule);
  const band = (dx, dy, col) => {
    const [lx, ly] = loc(dx * k, dy * k), ex = mg + Math.abs(lx), ey = mg + Math.abs(ly), p = new Path2D();
    p.rect(bb[0] - ex, bb[1] - ey, bb[2] - bb[0] + 2 * ex, bb[3] - bb[1] + 2 * ey);
    p.addPath(path, new DOMMatrix([1, 0, 0, 1, lx, ly]));
    g.fillStyle = col; g.fill(p, 'evenodd');
  };
  band(1.15, 1.7, `rgba(255,244,222,${0.4 * a})`);
  band(-0.8, -1.2, `rgba(16,10,6,${0.32 * a})`);
  g.restore();
}
function paper(path, col, o = {}) {
  const d = o.d ?? 3, rule = o.rule || 'nonzero';
  g.fillStyle = col;
  if (d > 0) {
    setShadow(d, o.sa ?? 0.5); g.fill(path, rule);
    if (d > 1.2) {
      g.shadowColor = 'rgba(3,5,14,0.42)'; g.shadowBlur = 1.1 * S;
      g.shadowOffsetX = Math.min(d, 2.5) * 0.35 * S; g.shadowOffsetY = Math.min(d, 2.5) * 0.6 * S;
      g.fill(path, rule);
    }
    noShadow();
  } else g.fill(path, rule);
  if (o.print) { g.save(); g.clip(path, rule); o.print(); g.restore(); }
  tex(path, o.seed ?? 0, o.ta ?? 1, o.tb ?? 0.55, rule);
  const e = o.edge ?? 1;
  if (e > 0) edge(path, rule, e);
}
function jit(id, amp = 0.6, ra = 0.0035) {
  g.translate((hsh(F, id * 3 + 1) - 0.5) * 2 * amp, (hsh(F, id * 3 + 2) - 0.5) * 2 * amp);
  g.rotate((hsh(F, id * 3 + 3) - 0.5) * 2 * ra);
}

// ---------- geometría "cortada a mano" ----------
function wob(seed, amp, n = 5) {
  const r = rng(seed), hs = [];
  for (let i = 0; i < n; i++) hs.push([2 + Math.floor(r() * 7) + i * 2, r() * TAU, amp * (0.5 + r() * 0.5) / (1 + i * 0.7)]);
  return (th) => { let s = 0; for (const [k, p, a] of hs) s += a * Math.sin(k * th + p); return s; };
}
function circPts(R, seed, amp = 0.006, scal = 0, sn = 0) {
  const w = wob(seed, amp), n = Math.max(40, Math.round(R * 0.9)), pts = [];
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU; let r = R * (1 + w(th));
    if (scal) r += scal * (Math.pow(Math.abs(Math.sin(sn * th / 2)), 0.55) - 0.75);
    pts.push([r * Math.cos(th), r * Math.sin(th)]);
  }
  return pts;
}
function bbOf(pts, bb) {
  let [x0, y0, x1, y1] = bb || [1e9, 1e9, -1e9, -1e9];
  for (const [x, y] of pts) { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }
  return [x0, y0, x1, y1];
}
function poly(pts, p = new Path2D()) { pts.forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y)); p.closePath(); p.bb = bbOf(pts, p.bb); return p; }
function circ(R, seed, amp, scal, sn) { return poly(circPts(R, seed, amp, scal, sn)); }
function annulus(R1, R2, seed) { const p = poly(circPts(R2, seed, 0.003)); poly(circPts(R1, seed + 1, 0.003), p); return p; }
// fase lunar: lado iluminado hacia +x (side=1) o -x (side=-1); k=1 nueva, 0 cuarto, -1 llena
function phase(R, k, side, seed) {
  const w = wob(seed, 0.006), n = Math.max(24, Math.round(R * 0.5)), p = new Path2D();
  for (let i = 0; i <= n; i++) { const th = -PI / 2 + i / n * PI, r = R * (1 + w(th)); const x = side * r * Math.cos(th), y = r * Math.sin(th); i ? p.lineTo(x, y) : p.moveTo(x, y); }
  for (let i = 1; i < n; i++) { const th = PI / 2 - i / n * PI; p.lineTo(side * k * R * Math.cos(th) * (1 + w(th + 2) * 0.6), R * Math.sin(th)); }
  p.closePath(); p.bb = [-R * 1.05, -R * 1.05, R * 1.05, R * 1.05]; return p;
}
function smooth(pts) {
  const p = new Path2D(), n = pts.length;
  const mid = (i) => [(pts[i % n][0] + pts[(i + 1) % n][0]) / 2, (pts[i % n][1] + pts[(i + 1) % n][1]) / 2];
  const m0 = mid(n - 1); p.moveTo(m0[0], m0[1]);
  for (let i = 0; i < n; i++) { const m = mid(i); p.quadraticCurveTo(pts[i][0], pts[i][1], m[0], m[1]); }
  p.closePath(); p.bb = bbOf(pts); return p;
}
function blob(R, seed, amp = 0.18, n = 9) {
  const r = rng(seed), pts = [];
  for (let i = 0; i < n; i++) { const th = i / n * TAU + (r() - 0.5) * 0.3, rr = R * (1 + (r() - 0.5) * 2 * amp); pts.push([rr * Math.cos(th), rr * Math.sin(th) * 0.85]); }
  return smooth(pts);
}
function star(R, ri, nPts = 5, rot = -PI / 2, seed = 1) {
  const r = rng(seed), pts = [];
  for (let i = 0; i < nPts * 2; i++) {
    const th = rot + i / (nPts * 2) * TAU, rr = (i % 2 ? ri : R) * (1 + (r() - 0.5) * 0.06);
    pts.push([rr * Math.cos(th), rr * Math.sin(th)]);
  }
  return poly(pts);
}
function rrect(x, y, w, h, r) { const p = new Path2D(); p.roundRect(x, y, w, h, r); p.bb = [x, y, x + w, y + h]; return p; }
// rectángulo redondeado con pequeña ondulación de tijera (devuelve puntos)
function wobRectPts(x, y, w, h, rad, seed, amp = 1.2) {
  const st = 6, wv = wob(seed, 1, 6), pts = [];
  const per = 2 * (w + h - 4 * rad) + TAU * rad, n = Math.round(per / st);
  const sides = [w - 2 * rad, PI / 2 * rad, h - 2 * rad, PI / 2 * rad, w - 2 * rad, PI / 2 * rad, h - 2 * rad, PI / 2 * rad];
  const P = (s) => {
    let k = 0; while (s > sides[k] && k < 7) { s -= sides[k]; k++; }
    switch (k) {
      case 0: return [x + rad + s, y, 0, -1];
      case 1: { const a = -PI / 2 + s / rad; return [x + w - rad + rad * Math.cos(a), y + rad + rad * Math.sin(a), Math.cos(a), Math.sin(a)]; }
      case 2: return [x + w, y + rad + s, 1, 0];
      case 3: { const a = s / rad; return [x + w - rad + rad * Math.cos(a), y + h - rad + rad * Math.sin(a), Math.cos(a), Math.sin(a)]; }
      case 4: return [x + w - rad - s, y + h, 0, 1];
      case 5: { const a = PI / 2 + s / rad; return [x + rad + rad * Math.cos(a), y + h - rad + rad * Math.sin(a), Math.cos(a), Math.sin(a)]; }
      case 6: return [x, y + h - rad - s, -1, 0];
      default: { const a = PI + s / rad; return [x + rad + rad * Math.cos(a), y + rad + rad * Math.sin(a), Math.cos(a), Math.sin(a)]; }
    }
  };
  for (let i = 0; i < n; i++) { const [px, py, nx, ny] = P(i / n * per); const o = wv(i / n * TAU) * amp; pts.push([px + nx * o, py + ny * o]); }
  return pts;
}
// colinas: contorno superior ondulado; devuelve el trazado y la altura en cada x
function hill(seed, y0, amp, fr) {
  const r = rng(seed), p1 = r() * TAU, p2 = r() * TAU, p3 = r() * TAU;
  const f = (x) => y0 - amp * (0.62 * Math.sin(x * fr + p1) + 0.38 * Math.sin(x * fr * 2.3 + p2)) + 1.1 * Math.sin(x * 0.19 + p3);
  const pts = [[-240, 260]];
  for (let x = -240; x <= 240; x += 6) pts.push([x, f(x)]);
  pts.push([240, 260]);
  return { p: poly(pts), f };
}
// abeto de papel: un solo contorno (sin piezas solapadas)
function conifer(h, w, seed) {
  const r = rng(seed), L = [], tiers = 3;
  L.push([-w * 0.07, 0], [-w * 0.07, -h * 0.12]);
  for (let k = 0; k < tiers; k++) {
    const yb = -h * 0.12 - k * h * 0.25, ww = w / 2 * (1 - k * 0.24) * (1 + (r() - 0.5) * 0.1);
    L.push([-ww * 0.42, yb], [-ww, yb], [-ww * 0.5, yb - h * 0.17]);
  }
  L.push([0, -h]);
  const R = L.slice(1).reverse().map(([x, y]) => [-x, y]);
  return poly([...L, ...R]);
}

// ---------- Tierra: continentes en proyección ortográfica ----------

const LON0 = -22;
function proj(lon, lat, R) {
  const l = (lon - LON0) * D2R, p = lat * D2R;
  let x = Math.cos(p) * Math.sin(l), y = -Math.sin(p); const z = Math.cos(p) * Math.cos(l);
  if (z < 0) { const n = Math.hypot(x, y) || 1; x /= n; y /= n; }
  return [x * R, y * R];
}
function landPath(pts, R) {
  const dense = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    for (let k = 0; k < 3; k++) { const u = k / 3; dense.push(proj(a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, R)); }
  }
  return smooth(dense);
}

function hole(x, y, s, sparkle, r) {
  g.save(); g.translate(x, y);
  const R = 2 + s * 3.2, gr = g.createRadialGradient(0, 0, 0, 0, 0, R);
  gr.addColorStop(0, 'rgba(255,214,150,0.55)'); gr.addColorStop(0.35, 'rgba(255,200,130,0.2)'); gr.addColorStop(1, 'rgba(255,200,130,0)');
  g.fillStyle = gr; g.fillRect(-R, -R, 2 * R, 2 * R);
  g.fillStyle = '#fbe7b6';
  if (sparkle) { g.rotate(r * PI); g.fill(star(s * 3.2, s * 0.7, 4, 0, 3)); }
  else { g.beginPath(); g.arc(0, 0, s, 0, TAU); g.fill(); }
  g.restore();
}

function spaced(txt, x, y, sp, align = 'center') {
  const ws = [...txt].map((c) => g.measureText(c).width), tw = ws.reduce((a, b) => a + b, 0) + sp * (txt.length - 1);

  [...txt].forEach((c, i) => { g.fillText(c, cx, y); cx += ws[i] + sp; });
  g.textAlign = al; return tw;
}

  const s = {};

  s.nucVis = t < 1.9 || t >= 8.5;
  if (t >= 1.5 && t < 1.9) { const u = eout(seg(t, 1.5, 1.9)); s.nucS = 1 + 0.3 * u; s.nucL = u; }
  else if (t >= 8.5 && t < 8.8) { const u = eout(seg(t, 8.5, 8.8)); s.nucS = 1.3 - 0.3 * u; s.nucL = 1 - u; }
  else { s.nucS = 1; s.nucL = 0; }
  s.discVis = t >= 1.9 && t < 8.5;
  s.discS = t < 2.25 ? 0.5 + 0.5 * eback(seg(t, 1.9, 2.25), 1.6) : t >= 8.2 ? 1 - 0.5 * ein(seg(t, 8.2, 8.5)) : 1;
  s.discL = t < 2.25 ? 1 - seg(t, 1.9, 2.25) : t >= 8.2 ? seg(t, 8.2, 8.5) : 0;
  s.crVis = t >= 2.05 && t < 8.2;
  if (t < 2.45) { const u = eout(seg(t, 2.05, 2.45)); s.crL = 1.2 * (1 - u); s.crX = -70 * (1 - u); s.crY = -90 * (1 - u); s.crR = -0.3 * (1 - u); }
  else if (t >= 7.85) { const u = ein(seg(t, 7.85, 8.2)); s.crL = 1.4 * u; s.crX = 80 * u; s.crY = -110 * u; s.crR = 0.35 * u; }
  else { s.crL = 0; s.crX = 0; s.crY = 0; s.crR = 0; }
  // brazos que señalan, hilos que conectan, sellos y giro del disco sur
  s.armEN = eio(seg(t, 2.6, 3.0)) * (1 - eio(seg(t, 7.7, 8.1)));
  s.armDN = eio(seg(t, 2.7, 3.1)) * (1 - eio(seg(t, 7.8, 8.2)));
  s.armES = eio(seg(t, 5.0, 5.4)) * (1 - eio(seg(t, 7.8, 8.2)));
  s.armDS = eio(seg(t, 5.1, 5.5)) * (1 - eio(seg(t, 8.2, 8.6)));
  s.cN = [eio(seg(t, 7.6, 8.1)), eio(seg(t, 2.6, 3.2))];
  s.cS = [eio(seg(t, 7.7, 8.2)), eio(seg(t, 3.0, 3.6))];
  s.sealN = PI * eio(seg(t, 2.95, 3.45)) + PI * eio(seg(t, 8.0, 8.5));
  s.sealS = PI * eio(seg(t, 4.7, 5.2)) + PI * eio(seg(t, 8.3, 8.75));
  s.rotS = PI + PI * eiob(seg(t, 3.5, 4.8)) + PI * eiob(seg(t, 8.75, 9.75));
  s.arrow = eout(seg(t, 3.2, 3.55)) * (1 - ein(seg(t, 5.0, 5.3)));
  return s;
}

function drawAtomMoon(t, s) {
  const sway = 0.016 * Math.sin(TAU * 2 * t / DUR + 0.6), L = MY + 20;
  const cx = MX + Math.sin(sway) * L, cy = -20 + Math.cos(sway) * L;
  const topR = s.discVis ? MR * s.discS - 4 : 30 * s.nucS;
  thread(MX, -20, cx, cy - topR);
  g.save(); g.translate(cx, cy); g.rotate(-sway * 0.5);
  const ph = TAU * (8 * t / DUR);
  const orbitPart = (fr) => {
    if (s.orb <= 0.02) return;
    P.orb.forEach((o, i) => {
      g.save(); jit(10 + i + (fr ? 5 : 0), 0.5, 0.004); g.rotate(o.ang); g.scale(s.orb, s.orb);
      paper(o[fr ? 'front' : 'back'], C.ivory, { d: 2.2 + 6 * s.orbL, seed: 12 + i, tb: 0.4, edge: 0.7 });
      const e = ph + i * TAU / 3 + i * 0.7, sy = Math.sin(e);
      if ((sy >= 0) === fr) {
        g.save(); g.translate(o.a * Math.cos(e), o.b * sy); g.rotate(-o.ang); jit(20 + i, 0.5);
        paper(P.electron, C.gold, { d: 3 + 6 * s.orbL, seed: 20 + i });
        g.translate(-2.2, -2.6); paper(P.electronHi, C.goldL, { d: 0.6, seed: 25 + i, edge: 0 });
        g.restore();
      }
      g.restore();
    });
  };
  if (s.nucVis) {
    orbitPart(false);
    g.save(); jit(30, 0.5, 0.004); g.scale(s.nucS, s.nucS);
    P.nuc.forEach((n, i) => {
      g.save(); g.translate(n.x, n.y); jit(31 + i, 0.35);
      paper(n.p, n.k ? C.ivory : C.coral, { d: 2 + 7 * s.nucL, seed: 31 + i });
      g.restore();
    });
    g.restore();
    orbitPart(true);
  }
  if (s.discVis) {
    g.save(); jit(40, 0.5, 0.003); g.scale(s.discS, s.discS);
    paper(P.moonDisc, C.moonDark, { d: 3.5 + 8 * s.discL, seed: 41, tb: 0.6, edge: 0.7 });
    g.restore();
    if (s.crVis) {
      g.save(); g.translate(s.crX, s.crY); jit(42, 0.5, 0.003); g.rotate(s.crR); const sc = 1 + 0.05 * s.crL; g.scale(sc, sc);
      paper(P.cres, C.ivory2, { d: 2.2 + 9 * s.crL, seed: 43 });
      paper(P.cresHi, C.ivory, { d: 1.2, seed: 44, ta: 0.9, edge: 0.6 });
      g.save();
      const items = [...P.maria.map((m) => ({ m })), ...P.craters.map((c) => ({ c }))];
      items.forEach((it, i) => {
        const a = 2.5 + i / FPS, rm = 7.8 - i / FPS;
        if (t < a || t >= rm) return;
        const Lf = Math.max(1 - seg(t, a, a + 2 / FPS), seg(t, rm - 2 / FPS, rm));
        const o = it.m || it.c;
        g.save(); g.translate(o.x - 6 * Lf, o.y - 8 * Lf); jit(50 + i, 0.4, 0.01); g.scale(1 + 0.08 * Lf, 1 + 0.08 * Lf);
        if (it.m) paper(it.m.p, '#ddcb9f', { d: 1 + 5 * Lf, seed: 60 + i, tb: 0.3, edge: 0.6 });
        else {
          paper(it.c.base, '#d6c290', { d: 1.2 + 5 * Lf, seed: 60 + i, edge: 0.8 });
          g.save(); g.translate(1.5, 2); paper(it.c.inner, '#ebdcb6', { d: 0.6, seed: 70 + i, tb: 0.3, edge: 0.6 }); g.restore();
        }
        g.restore();
      });
      g.restore();
      g.restore();
    }
  }
  g.restore();
}

// hilos cosidos que unen cada observador de la Tierra con su tarjeta
const CONN = [
  { pts: [[942, 556], [842, 606], [716, 520], [604, 500]], col: [214, 98, 74], id: 700 },
  { pts: [[982, 852], [1110, 884], [1236, 612], [1318, 566]], col: [223, 167, 67], id: 710 },
].map((c) => {
  const [a, b, d, e] = c.pts, poly = [];
  for (let i = 0; i <= 80; i++) {
    const u = i / 80, v = 1 - u;
    poly.push([v * v * v * a[0] + 3 * v * v * u * b[0] + 3 * v * u * u * d[0] + u * u * u * e[0], v * v * v * a[1] + 3 * v * v * u * b[1] + 3 * v * u * u * d[1] + u * u * u * e[1]]);
  }
  return { ...c, poly };
});
function drawConnector(c, u0, u1) {
  if (u1 - u0 < 0.01) return;
  const n = c.poly.length - 1, i0 = Math.floor(u0 * n), i1 = Math.ceil(u1 * n);
  g.save(); g.lineCap = 'round'; g.setLineDash([11, 9]); g.lineDashOffset = 0;
  setShadow(1.8, 0.5); g.strokeStyle = `rgb(${c.col.join(',')})`; g.lineWidth = 3;
  g.beginPath(); for (let i = i0; i <= i1; i++) { const [x, y] = c.poly[i]; i === i0 ? g.moveTo(x, y) : g.lineTo(x, y); } g.stroke();
  noShadow(); g.restore();
  // nudos en los extremos
  const knot = (x, y) => { g.save(); setShadow(1.2, 0.5); g.fillStyle = `rgb(${c.col.join(',')})`; g.beginPath(); g.arc(x, y, 4.2, 0, TAU); g.fill(); noShadow(); g.restore(); };
  if (u0 < 0.02) knot(...c.poly[0]);
  if (u1 > 0.98) knot(...c.poly[n]);
}

function drawEarth(s) {
  g.save(); g.translate(EX, EY); jit(100, 0.45, 0.0015);
  const h = earthSpr.half; g.drawImage(earthSpr, -h, -h, 2 * h, 2 * h);
  // observadores: uno de pie arriba (norte) y otro "boca abajo" abajo (sur)
  g.save(); g.translate(0, -ER + 1); jit(130, 0.5, 0.01); observer(CARDS[0].coat, CARDS[0].coatD, lerp(-0.22, -2.85, s.armEN), 131); g.restore();
  g.save(); g.rotate(PI); g.translate(0, -ER + 1); jit(140, 0.5, 0.01); observer(CARDS[1].coat, CARDS[1].coatD, lerp(-0.22, -2.85, s.armES), 141); g.restore();
  g.restore();
}

const STARS = [
  { x: 1262, len: 238, R: 12, k: 'flat', a: 0.05, kk: 2, tw: 0, id: 300 },
  { x: 652, len: 742, R: 13, k: 'flat', a: 0.04, kk: 3, tw: 1, id: 301, spin: 1 },
  { x: 1856, len: 300, R: 11, k: 'flat', a: 0.05, kk: 2, tw: 0.3, id: 302 },
  { x: 66, len: 862, R: 12, k: 'flat', a: 0.03, kk: 1, tw: 2, id: 303 },
];
const STARS_FRONT = [
  { x: 690, len: 336, R: 30, k: 'fold', a: 0.03, kk: 1, tw: 0.4, id: 310 },
  { x: 1232, len: 424, R: 26, k: 'fold', a: 0.03, kk: 2, tw: 1.1, id: 311 },
  { x: 72, len: 560, R: 20, k: 'fold', a: 0.03, kk: 1, tw: 2.2, id: 312 },
  { x: 1850, len: 690, R: 22, k: 'fold', a: 0.03, kk: 2, tw: 0.8, id: 313 },
];
function drawStars(list, t) {
  list.forEach((st) => {
    const sway = st.a * Math.sin(TAU * st.kk * t / DUR + st.id);
    const twist = st.spin ? TAU * t / DUR + st.tw : 0.55 * Math.sin(TAU * st.kk * t / DUR + st.tw);
    hangingStar(st.x, st.len, st.R, sway, twist, st.k, st.id);
  });
}

// ---------- fotograma ----------
const FACES_N = [{ ch: '?', bg: C.coral, fg: C.ivory, line: 'rgba(255,240,220,0.55)' }, { ch: 'D', bg: C.coral, fg: C.ivory, line: 'rgba(255,240,220,0.55)' }];
const FACES_S = [{ ch: '?', bg: C.mustard, fg: C.ink, line: 'rgba(26,35,66,0.45)' }, { ch: 'C', bg: C.mustard, fg: C.ink, line: 'rgba(26,35,66,0.45)' }];
function draw(Fi) {
  F = Fi; const t = Fi / FPS, s = tl(t);
  g = main;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  g.drawImage(back, OX, OY);
  g.setTransform(S, 0, 0, S, OX, OY);
  g.save();
  drawDiscs(s);
  g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(cardsL, OX, OY); g.setTransform(S, 0, 0, S, OX, OY);
  drawGarlands(t);
  drawStars(STARS, t);
  drawTitle();
  drawAtomMoon(t, s);
  drawConnector(CONN[0], s.cN[0], s.cN[1]);
  drawConnector(CONN[1], s.cS[0], s.cS[1]);
  drawEarth(s);
  drawSeal(CARDS[0], s.sealN, FACES_N, 800);
  drawSeal(CARDS[1], s.sealS, FACES_S, 810);
  drawArrow(CARDS[1], s.arrow, 820);
  drawStars(STARS_FRONT, t);
  g.restore();
  g.setTransform(1, 0, 0, 1, 0, 0);
  // el marco solo ocupa los bordes: se pega en cuatro tiras
  const b = Math.ceil(84 * S), fw = front.width, fh = front.height;
  g.drawImage(front, 0, 0, fw, b, OX, OY, fw, b);
  g.drawImage(front, 0, fh - b, fw, b, OX, OY + fh - b, fw, b);
  g.drawImage(front, 0, b, b, fh - 2 * b, OX, OY + b, b, fh - 2 * b);
  g.drawImage(front, fw - b, b, b, fh - 2 * b, OX + fw - b, OY + b, b, fh - 2 * b);
  // parpadeo de exposición, como en la fotografía fotograma a fotograma
  const fl = hsh(Fi, 999) - 0.5;
  g.fillStyle = fl > 0 ? `rgba(255,238,210,${fl * 0.03})` : `rgba(0,0,8,${-fl * 0.05})`;
  g.fillRect(OX, OY, W * S, H * S);
  // bandas del letterbox (tapan lo que asome fuera del 16:9)
  g.fillStyle = C.bg;
  if (OX > 0) { g.fillRect(0, 0, OX, cv.height); g.fillRect(OX + back.width, 0, cv.width, cv.height); }
  if (OY > 0) { g.fillRect(0, 0, cv.width, OY); g.fillRect(0, OY + back.height, cv.width, cv.height); }
}

function resize() {
  const dpr = CAPTURA ? 1 : Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.round(window.innerWidth * dpr), ch = Math.round(window.innerHeight * dpr);
  if (cv.width === cw && cv.height === ch && back) return;
  cv.width = cw; cv.height = ch;
  S = Math.min(cw / W, ch / H); OX = Math.round((cw - W * S) / 2); OY = Math.round((ch - H * S) / 2);
  main.__pa = null;
  buildBack(); buildCards(); buildFront(); buildTitle(); buildKicker(); buildEarth(); buildDiscs();
  lastF = -1;
}

async function init() {
  if (document.readyState !== 'complete') await new Promise((r) => window.addEventListener('load', r, { once: true }));
  try {
    await Promise.all([
      document.fonts.load('900 80px Fraunces', 'LA LUNA AL REVÉS ?DC'),
      document.fonts.load('700 19px Fraunces', 'LO QUE NO TE EXPLICARON EN CLASE ASÍ SE VE DESDE EL'),
      document.fonts.load('italic 600 46px Fraunces', 'hemisferio norte sur'),
    ]);
    await document.fonts.ready;
  } catch (e) { /* si la fuente no llega se usa la de respaldo */ }
  makeTextures(); buildPaths(); resize();
  window.__frame = (t) => {
    resize();
    const Fi = ((Math.floor(t * FPS + 1e-6) % NF) + NF) % NF;
    if (Fi === lastF) return;
    lastF = Fi; draw(Fi);
  };
  window.__frame(0);
  try { main.getImageData(0, 0, 1, 1); } catch (e) { /* fuerza a terminar el primer dibujo */ }
  window.__listo = true;
  if (!CAPTURA) {
    const t0 = performance.now();
    const loop = (now) => { window.__frame(((now - t0) / 1000) % DUR); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
    window.addEventListener('resize', () => { lastF = -1; });
  }
}
init();
})();
