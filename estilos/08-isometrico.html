import * as THREE from 'three';

// =====================================================================
// Diorama isométrico (cámara ortográfica a 35,26° / 45°), 16:9.
// Izquierda: un planeta low-poly con un octante cortado (capas internas)
// y dos observadores con su pueblito: uno arriba (hemisferio norte) y otro
// cabeza abajo (hemisferio sur). Derecha: el átomo narrador, que se convierte
// en la Luna. Centro: dos paneles-pensamiento; la ventana del sur gira 180°
// y la D pasa a ser C. Todo depende solo de t (bucle de DUR s); el azar sale
// de un PRNG con semilla.
// =====================================================================
const DUR = 10, W = 1920, H = 1080, TAU = Math.PI * 2;
const CAPTURA = /captura/.test(location.search);

// ---------- utilidades ----------
const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eob = (x, s = 1.7) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2));
const eib = (x, s = 1.7) => (x <= 0 ? 0 : x >= 1 ? 1 : (s + 1) * x * x * x - s * x * x);
const sstep = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
function prng(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash3(x, y, z) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(z | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const L = (a, b, t) => a + (b - a) * t;
  const c = (dx, dy, dz) => hash3(xi + dx, yi + dy, zi + dz);
  return L(L(L(c(0, 0, 0), c(1, 0, 0), u), L(c(0, 1, 0), c(1, 1, 0), u), v),
           L(L(c(0, 0, 1), c(1, 0, 1), u), L(c(0, 1, 1), c(1, 1, 1), u), v), w);
}
const fbm = (x, y, z) => 0.72 * vnoise(x, y, z) + 0.28 * vnoise(x * 2.1 + 5, y * 2.1, z * 2.1);
const hex2v = (h) => { const c = new THREE.Color(h); c.convertLinearToSRGB(); return new THREE.Vector3(c.r, c.g, c.b); };

// ---------- paleta (pastel sobre oscuro) ----------
const P = {
  bgC: '#1c1f41', bgE: '#0b0d1f',
  floor: '#151834', line: '#21254b', line2: '#2d3266', ring: '#9a90e6',
  oceanD: '#4d7fb4', ocean: '#5e9dca', shallow: '#80c6d8', sand: '#f0dcae', land: '#a9d59a', land2: '#93c897', hill: '#79ae8f', ice: '#eef0fb', ice2: '#d6dbf2',
  crust: '#f3c6a9', mantle: '#ef9480', ocore: '#f6c46e', icore: '#fff3cc',
  moonLit: '#f7efdc', moonDark: '#34386c',
  lav: '#b6acf4', lav2: '#8f86dd', mint: '#8fdcc6', peach: '#f6ae92', coral: '#ee8778',
  cream: '#f5efe3', ink: '#272a4f',
  skin: '#f2cfb8', pants: '#3b3e72', shoe: '#23254a', tree: '#86bf93', tree2: '#6aa98a', trunk: '#9a7a83',
  wall: '#f6eee2', wall2: '#ece0d0', roofA: '#ee8778', roofB: '#a79de8', roofC: '#f2b880', glass: '#ffd98a', door: '#4a4470',

// ---------- ejes de pantalla en el mundo (cámara isométrica) ----------
const vR = new THREE.Vector3(1, 0, -1).normalize();   // derecha en pantalla
const vU = new THREE.Vector3(-1, 2, -1).normalize();  // arriba en pantalla

const S = (sx, sy, d = 0) => new THREE.Vector3().addScaledVector(vR, sx - W / 2).addScaledVector(vU, H / 2 - sy).addScaledVector(vW, d);

const scene = new THREE.Scene();
const bgScene = new THREE.Scene();
const hudScene = new THREE.Scene();

const lam = (c, extra = {}) => new THREE.MeshLambertMaterial({ color: c, flatShading: true, ...extra });
const basic = (c, extra = {}) => new THREE.MeshBasicMaterial({ color: c, ...extra });

function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(255,255,255,0.55)');
  g.addColorStop(0.6, 'rgba(255,255,255,0.12)'); g.addColorStop(1, 'rgba(255,255,255,0)');

}
const GLOW = glowTexture();
const glowSprite = (c, op) => new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: c, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false }));

// orienta un objeto: eje Y local -> up, eje Z local -> forward (ortogonalizado)
function orient(obj, up, fwd) {
  const u = up.clone().normalize();
  const f = fwd.clone().addScaledVector(u, -fwd.dot(u)).normalize();
  const r = new THREE.Vector3().crossVectors(u, f).normalize();
  obj.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(r, u, f));
}

// oclusión ambiental falsa: oscurece los vértices cerca de la base (y = 0 del grupo)
function bakeAO(root, k = 9, s = 0.38) {
  root.updateMatrixWorld(true);
  const inv = root.matrixWorld.clone().invert();
  const v = new THREE.Vector3();
  root.traverse((o) => {
    if (!o.isMesh) return;
    const geo = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    const p = geo.attributes.position;
    const m = new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld);
    const cols = new Float32Array(p.count * 3);
    for (let i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i).applyMatrix4(m);
      const a = 1 - s * Math.exp(-Math.max(v.y, 0) / k);
      cols[i * 3] = cols[i * 3 + 1] = cols[i * 3 + 2] = a;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
    o.geometry = geo;
    o.material = o.material.clone(); o.material.vertexColors = true;
  });
}

// =====================================================================
// FONDO: degradado + estrellas (pasada de pantalla)
// =====================================================================
{
  const m = new THREE.ShaderMaterial({
    uniforms: { c0: { value: hex2v(P.bgC) }, c1: { value: hex2v(P.bgE) } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `uniform vec3 c0; uniform vec3 c1; varying vec2 vUv;
      void main(){
        vec2 p = (vUv - vec2(0.42, 0.6)) * vec2(1.7778, 1.0);
        float d = length(p);
        vec3 col = mix(c0, c1, smoothstep(0.05, 1.2, d));
        float n = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
        col += (n - 0.5) / 255.0;
        gl_FragColor = vec4(col, 1.0);
      }`,
    depthWrite: false, depthTest: false,
  });
  const q = new THREE.Mesh(new THREE.PlaneGeometry(W, H), m);
  q.position.set(W / 2, -H / 2, -5);
  bgScene.add(q);
}
function starTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.18, 'rgba(255,255,255,0.5)'); g.addColorStop(0.5, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  x.fillStyle = 'rgba(255,255,255,0.9)';
  x.beginPath(); x.moveTo(32, 2); x.quadraticCurveTo(34, 30, 62, 32); x.quadraticCurveTo(34, 34, 32, 62); x.quadraticCurveTo(30, 34, 2, 32); x.quadraticCurveTo(30, 30, 32, 2); x.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const STARS = [];
{
  const rnd = prng(808);
  const geo = new THREE.PlaneGeometry(1, 1);
  const mat = new THREE.MeshBasicMaterial({ map: starTexture(), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false });
  const N = 80;
  const im = new THREE.InstancedMesh(geo, mat, N);
  const cols = ['#ffffff', '#cfc8ff', '#ffe6cf', '#c9f1e6'];
  for (let i = 0; i < N; i++) {
    let x, y, ok = false, k = 0;
    while (!ok && k++ < 60) {
      x = 40 + rnd() * (W - 80); y = 20 + rnd() * 620;
      ok = !(x > 1250 && y < 230); // libre detrás del título
    }
    const s = rnd() < 0.12 ? 14 + rnd() * 8 : 5 + rnd() * 6;
    STARS.push({ x, y, s, k: 1 + Math.floor(rnd() * 3), ph: rnd() * TAU });
    im.setColorAt(i, col(cols[Math.floor(rnd() * cols.length)]).multiplyScalar(0.5 + rnd() * 0.4));
  }
  im.instanceColor.needsUpdate = true;
  bgScene.add(im);
  STARS.mesh = im;
}

// =====================================================================
// SUELO: rejilla isométrica + sombras suaves (oclusión) + anillos
// =====================================================================
const FY = -300, SH = 24; // altura del suelo (mundo) y de las peanas
// uniformes compartidos por el suelo y las tapas de las peanas
const FU = {
  uLine: { value: hex2v(P.line) }, uLine2: { value: hex2v(P.line2) }, uRing: { value: hex2v(P.ring) },
  uFadeC: { value: new THREE.Vector2() }, uFadeR: { value: 1250 },
  uBlobs: { value: Array.from({ length: 6 }, () => new THREE.Vector4()) },
  uRings: { value: Array.from({ length: 3 }, () => new THREE.Vector4()) },
  uSlabs: { value: [new THREE.Vector3(), new THREE.Vector3()] },
};
function floorMaterial(base, top, self) {
  return new THREE.ShaderMaterial({
    transparent: !top, depthWrite: !!top,
    uniforms: { ...FU, uFloor: { value: hex2v(base) }, uTop: { value: top ? 1 : 0 }, uSelf: { value: self || new THREE.Vector3() } },
    vertexShader: 'varying vec3 vP; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',
    fragmentShader: `
      uniform vec3 uFloor, uLine, uLine2, uRing; uniform vec2 uFadeC; uniform float uFadeR, uTop;
      uniform vec4 uBlobs[6]; uniform vec4 uRings[3]; uniform vec3 uSlabs[2]; uniform vec3 uSelf;
      varying vec3 vP;
      float grid(vec2 p, float cell, float w){
        vec2 q = p / cell; vec2 fw = fwidth(q);
        vec2 g = abs(fract(q - 0.5) - 0.5) / fw;
        return 1.0 - min(min(g.x, g.y) / w, 1.0);
      }
      void main(){
        vec2 p = vP.xz;
        vec3 col = uFloor;
        col = mix(col, uLine, grid(p, 48.0, 1.0) * (0.7 - 0.35 * uTop));
        col = mix(col, uLine2, grid(p, 192.0, 1.3) * (0.9 - 0.5 * uTop));
        // cruces en las intersecciones mayores
        vec2 q = abs(fract(p / 192.0 + 0.5) - 0.5) * 192.0;
        float cross = (1.0 - smoothstep(0.0, 1.6, min(q.x, q.y))) * (1.0 - smoothstep(9.0, 11.0, max(q.x, q.y)));
        col = mix(col, uRing * 0.75, cross * 0.55 * (1.0 - uTop));
        float sh = 0.0;
        for (int i = 0; i < 6; i++) { vec4 b = uBlobs[i]; float d = length(p - b.xy) / max(b.z, 1.0); sh += b.w * exp(-d * d * 2.4); }
        if (uTop < 0.5) {
          // oclusión cuadrada alrededor de cada peana
          for (int i = 0; i < 2; i++) {
            vec3 s = uSlabs[i]; vec2 d = abs(p - s.xy) - vec2(s.z);
            float o = length(max(d, 0.0));
            sh += 0.5 * exp(-o / 34.0) * step(0.0, max(d.x, d.y));
          }
        }
        col *= 1.0 - clamp(sh, 0.0, 0.8);
        for (int i = 0; i < 3; i++) {
          vec4 r = uRings[i]; float L = length(p - r.xy); float fw = fwidth(L);
          float l = 1.0 - smoothstep(0.6, 0.6 + 1.6 * fw, abs(L - r.z));
          float dash = step(0.5, fract(atan(p.y - r.y, p.x - r.x) * 9.549));
          col = mix(col, uRing, l * r.w * mix(0.45, 1.0, dash));
        }
        float a = 1.0;
        if (uTop > 0.5) {
          // bisel claro en el borde y filete interior
          vec2 d = abs(p - uSelf.xy); float e = uSelf.z - max(d.x, d.y); float fe = fwidth(e);
          col = mix(col, uRing * 0.85, (1.0 - smoothstep(1.2, 1.2 + 1.5 * fe, e)) * 0.75);
          col = mix(col, uLine2 * 1.25, (1.0 - smoothstep(0.5, 0.5 + 1.5 * fe, abs(e - 16.0))) * 0.7);
        } else {
          a = smoothstep(uFadeR, uFadeR * 0.3, length(p - uFadeC));
        }
        gl_FragColor = vec4(col, a);
      }`,
  });
}
const floorMat = floorMaterial(P.floor, false);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(7000, 7000), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = FY;
floor.renderOrder = -1;
scene.add(floor);
// centro del desvanecido: el punto del suelo que se ve en (980, 760)
{ const a = S(980, 760); const s = (a.y - FY) / vW.y; const p = a.addScaledVector(vW, -s); FU.uFadeC.value.set(p.x, p.z); }
// peana isométrica (losa cuadrada alineada con la rejilla)
function makeSlab(cx, cz, a, i) {
  const g = new THREE.Group();
  const box = new THREE.Mesh(new THREE.BoxGeometry(2 * a, SH, 2 * a), new THREE.MeshLambertMaterial({ color: '#272b57' }));
  box.position.set(cx, FY + SH / 2 - 0.5, cz); g.add(box);
  const self = new THREE.Vector3(cx, cz, a);
  const top = new THREE.Mesh(new THREE.PlaneGeometry(2 * a, 2 * a), floorMaterial('#1d2146', true, self));
  top.rotation.x = -Math.PI / 2; top.position.set(cx, FY + SH, cz); g.add(top);
  FU.uSlabs.value[i].copy(self);
  scene.add(g);
  return g;
}

function dashLine(color, n, opacity = 0.9) {
  const im = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), basic(color, { transparent: true, opacity }), n);
  im.frustumCulled = false; scene.add(im);
  return { im, n };
}
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _v = new THREE.Vector3(), _s = new THREE.Vector3();
const XAX = new THREE.Vector3(1, 0, 0);
function setDashes(im, n, a, b, from, to, w, phase, endFade = true) {
  const dir = _v.subVectors(b, a); const len = dir.length(); dir.normalize();
  _q.setFromUnitVectors(XAX, dir);
  const step = len / n;
  for (let j = 0; j < n; j++) {
    const u = (j + phase) / n;
    let sc = (u >= from && u <= to) ? 1 : 0;
    if (endFade) sc *= sstep(0, 0.05, u) * sstep(1, 0.95, u);
    const p = a.clone().addScaledVector(dir, u * len);
    _s.set(Math.max(0.001, step * 0.5 * sc), Math.max(0.001, w * sc), Math.max(0.001, w * sc));
    _m4.compose(p, _q, _s);
    im.setMatrixAt(j, _m4);
  }
  im.instanceMatrix.needsUpdate = true;
}

// =====================================================================
// PLANETA low-poly (geodésico) con un octante cortado
// =====================================================================
const RE = 205;
const EARTH_C = S(545, 505, 0);
const earth = new THREE.Group();
scene.add(earth);
const LAT = 50 * Math.PI / 180;
const dirN = new THREE.Vector3().addScaledVector(vR, Math.cos(LAT)).addScaledVector(vU, Math.sin(LAT)).normalize();
const dirS = new THREE.Vector3().addScaledVector(vR, Math.cos(LAT)).addScaledVector(vU, -Math.sin(LAT)).normalize();
const clipPlanes = [new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0), new THREE.Plane(new THREE.Vector3(0, -1, 0), 0), new THREE.Plane(new THREE.Vector3(0, 0, -1), 0)];
const TL = 0.475, LAND_R = 1.024; // umbral de tierra, radio de la tierra firme
{
  const qSpin = new THREE.Quaternion().setFromAxisAngle(Y, 0.6);
  const qPole = new THREE.Quaternion().setFromUnitVectors(Y, vU);
  const qAll = qPole.clone().multiply(qSpin);
  const qInv = qAll.clone().invert();
  const locN = dirN.clone().applyQuaternion(qInv), locS = dirS.clone().applyQuaternion(qInv);
  const heightAt = (d) => {
    const n = fbm(d.x * 1.2 + 11.3, d.y * 1.2 + 3.1, d.z * 1.2 + 7.7);
    const w = Math.max(Math.exp(-Math.pow(d.distanceTo(locN) / 0.4, 2)), Math.exp(-Math.pow(d.distanceTo(locS) / 0.4, 2)));
    return n * (1 - w) + (TL + 0.06) * w;
  };
  const g = new THREE.IcosahedronGeometry(1, 7);
  const pos = g.attributes.position;
  const v = new THREE.Vector3(), q = new THREE.Vector3();
  const cache = new Map(), info = [];
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).normalize();
    const kx = Math.round(v.x * 2e4), ky = Math.round(v.y * 2e4), kz = Math.round(v.z * 2e4);
    const key = kx + ',' + ky + ',' + kz;
    let r = cache.get(key);
    if (!r) {
      q.set(kx, ky, kz).normalize();
      const h = heightAt(q);
      const ice = Math.abs(q.y) > 0.9;
      const d = ice ? 1.016 : h > TL + 0.1 ? 1.042 : h > TL ? LAND_R : 1.0;
      r = { h, ice, d, n: vnoise(q.x * 3.2 + 2, q.y * 3.2, q.z * 3.2 + 9) };
      cache.set(key, r);
    }
    info.push(r);
    pos.setXYZ(i, v.x * RE * r.d, v.y * RE * r.d, v.z * RE * r.d);
  }
  const colors = new Float32Array(pos.count * 3);
  const C = { oceanD: col(P.oceanD), ocean: col(P.ocean), shallow: col(P.shallow), sand: col(P.sand), land: col(P.land), land2: col(P.land2), hill: col(P.hill), ice: col(P.ice), ice2: col(P.ice2) };
  const rnd = prng(42);
  for (let i = 0; i < pos.count; i += 3) {
    const a = info[i], b = info[i + 1], c = info[i + 2];
    const nIce = a.ice + b.ice + c.ice;
    const nLand = (a.h > TL) + (b.h > TL) + (c.h > TL);
    const nHill = (a.h > TL + 0.1) + (b.h > TL + 0.1) + (c.h > TL + 0.1);
    const hm = (a.h + b.h + c.h) / 3;
    let cc;
    if (nIce === 3) cc = C.ice; else if (nIce > 0) cc = C.ice2;
    else if (nLand === 3) cc = nHill === 3 ? C.hill : (a.n + b.n + c.n > 1.5 ? C.land : C.land2);
    else if (nLand === 2) cc = (a.n + b.n + c.n > 1.5 ? C.land : C.land2);

    const L = Math.hypot(px, py); if (L > R2) { px *= R2 / L; py *= R2 / L; }

function makeCard(key) {

  const view = new THREE.Group(); view.position.set(HX, 0, 0); g.add(view);
  const content = new THREE.Group(); view.add(content);
  const sky = new THREE.Mesh(new THREE.CircleGeometry(HR + 4, 40), new THREE.MeshBasicMaterial({ map: SKY }));
  sky.position.z = -CT / 2 + 1; content.add(sky);
  const rnd = prng(key === 'N' ? 5 : 6);
  const far = new THREE.Mesh(hillsGeo(rnd, -34, 18, 7, HR + 3), basic('#4b4f8c')); far.position.z = -CT / 2 + 3; content.add(far);
  const near = new THREE.Mesh(hillsGeo(rnd, -52, 16, 6, HR + 3), basic('#272b5a')); near.position.z = -CT / 2 + 5; content.add(near);
  for (const [tx, ty, h] of [[-36, -44, 16], [-22, -48, 11], [42, -50, 13]]) {
    const tr = new THREE.Mesh(new THREE.ConeGeometry(h * 0.34, h, 5), basic('#1d2149'));

  const mg = new THREE.Group(); content.add(mg);
  const earthshine = new THREE.Mesh(new THREE.CircleGeometry(29, 28), basic('#3d4182', { transparent: true, opacity: 0.85 }));
  earthshine.position.z = -CT / 2 + 6.5; mg.add(earthshine);
  const halo = new THREE.Mesh(new THREE.CircleGeometry(56, 32), new THREE.MeshBasicMaterial({ map: GLOW, color: '#fff0c8', transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false }));
  halo.position.z = -CT / 2 + 6.2; mg.add(halo);
  const cres = new THREE.Mesh(crescentGeo(29, 0.28), new THREE.MeshLambertMaterial({ color: '#fff4dc', emissive: '#d8c8a8', flatShading: true }));
  cres.position.z = -CT / 2 + 7; mg.add(cres);
  if (key === 'N') mg.position.set(22, 20, 0);
  else { mg.position.set(-22, 20, 0); mg.rotation.z = Math.PI; }
  const lid = new THREE.Mesh(new THREE.CircleGeometry(HR, 40), new THREE.MeshBasicMaterial({ map: lidTexture(o), transparent: true }));
  lid.position.set(HX, 0, FRONT - 3.2); g.add(lid);
  const chipTex = { '?': chipTexture(o, '?'), L: chipTexture(o, o.letter) };
  const chip = new THREE.Mesh(new THREE.PlaneGeometry(CHIP, CHIP), new THREE.MeshBasicMaterial({ map: chipTex['?'], transparent: true }));
  chip.position.set(CW / 2 - 34 - CHIP / 2, CH / 2 - 199, FRONT + 0.6);

const cardN = makeCard('N'), cardS = makeCard('S');
const CARD_POS = { N: S(1030, 204, 80), S: S(1030, 752, 80) };
const BETA = { N: 10 * Math.PI / 180, S: -10 * Math.PI / 180 };
for (const [k, c] of [['N', cardN], ['S', cardS]]) {
  const b = Math.PI / 4 - BETA[k];
  orient(c.g, Y, new THREE.Vector3(Math.sin(b), 0, Math.cos(b)));
  scene.add(c.g);
}
// indicador de giro de 180° alrededor de la ventana del sur
const NARC = 44;
const arc = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), basic(CARD.S.accent), NARC);
arc.frustumCulled = false; cardS.g.add(arc);
const arcHead = new THREE.Mesh(new THREE.ConeGeometry(7, 13, 3), basic(CARD.S.accent));
cardS.g.add(arcHead);
const ZAX = new THREE.Vector3(0, 0, 1);

// burbujas de pensamiento y líneas de visión
const bubbleGeo = new THREE.IcosahedronGeometry(1, 1);
const bubbles = { N: [], S: [] };
for (const k of ['N', 'S']) for (let i = 0; i < 3; i++) {
  const m = new THREE.Mesh(bubbleGeo, lam(CARD[k].base)); scene.add(m); bubbles[k].push(m);
}
const NSIGHT = 34;
const sight = { N: dashLine('#ffc4b3', NSIGHT), S: dashLine('#a9eedb', NSIGHT) };
const drops = { E: dashLine(P.lav2, 30, 0.55), M: dashLine(P.lav2, 30, 0.55) };

// =====================================================================
// HUD: título (textura en pantalla) y etiquetas N / S
// =====================================================================
let titleMesh = null, titleK = 0;
const TW = 640, TH = 150;
function buildTitle(k) {
  if (Math.abs(k - titleK) < 0.01 && titleMesh) return;
  titleK = k;
  const c = document.createElement('canvas'); c.width = Math.ceil(TW * k); c.height = Math.ceil(TH * k);
  const x = c.getContext('2d'); x.scale(k, k);

  txt(x, 'LA LUNA AL REVÉS', '700 58px "Space Grotesk"', R + 1, 84, P.cream, '1px', 'right');

let callout = null;
const CO_W = 260, CO_H = 64;
function buildCallout(k) {

function tagSprite(letter) {

// =====================================================================
// ANIMACIÓN (función pura de t)
// =====================================================================
let tags = null;
const HEAD = RE * LAND_R + 72 * PS, EYE = RE * LAND_R + 62 * PS;
function update(t) {
  t = ((t % DUR) + DUR) % DUR;
  const ph = TAU * t / DUR;

  // estrellas que titilan (ciclos enteros por bucle)
  for (let i = 0; i < STARS.length; i++) {
    const s = STARS[i];
    const k = s.s * (0.55 + 0.45 * Math.sin(ph * s.k + s.ph));
    _m4.compose(_v.set(s.x, -s.y, 0), _q.identity(), _s.set(k, k, 1));
    STARS.mesh.setMatrixAt(i, _m4);
  }
  STARS.mesh.instanceMatrix.needsUpdate = true;

  // planeta flotando
  const ec = EARTH_C.clone().addScaledVector(vU, 5 * Math.sin(ph));
  earth.position.copy(ec);
  clipPlanes[0].constant = ec.x; clipPlanes[1].constant = ec.y; clipPlanes[2].constant = ec.z;
  tags.N.position.copy(ec).addScaledVector(vU, RE + 80);
  tags.S.position.copy(ec).addScaledVector(vU, -(RE + 80));

  // átomo <-> Luna
  const m = eio(seg(t, 1.1, 2.4)) * (1 - eio(seg(t, 8.6, 9.8)));
  const mc = MOON_C.clone().addScaledVector(vU, 7 * Math.sin(ph + 1.1));
  atom.position.copy(mc); moon.position.copy(mc);
  const ms = m < 0.5 ? 0 : eob((m - 0.5) / 0.5, 2.0);
  moon.visible = ms > 0.001;
  moon.scale.setScalar(Math.max(ms, 0.001));
  const ac = eio(clamp01(m / 0.62));
  const ringS = 1 - eio(clamp01(m / 0.55));
  const wob = new THREE.Quaternion().setFromAxisAngle(vU, 0.32 * Math.sin(ph));
  for (let i = 0; i < 3; i++) {
    const o = orbits[i];
    o.ring.visible = ringS > 0.002;
    o.ring.scale.setScalar(Math.max(ringS, 0.001));
    o.ring.material.opacity = 0.9 * Math.min(1, ringS * 1.6);
    const e = electrons[i];
    const th = e.ph + e.k * ph + 3 * Math.PI * ac * ac;
    const r = RO * Math.pow(1 - ac, 1.4);
    e.g.position.set(0, 0, 0).addScaledVector(o.a1, Math.cos(th) * r).addScaledVector(o.a2, Math.sin(th) * r);
    e.g.visible = ac < 0.995;
    e.g.scale.setScalar(1 - 0.6 * ac);
  }
  atom.quaternion.copy(wob);
  const ns = 1 - sstep(0.42, 0.78, m);
  nucleus.visible = ns > 0.002;
  nucleus.scale.setScalar(Math.max(ns, 0.001) * (1 + 0.04 * Math.sin(ph * 3)));
  nucleus.rotation.set(ph, ph * 2, 0);
  const fA = seg(t, 1.76, 2.5), fB = seg(t, 9.12, 9.8);
  const f = fA > 0 && fA < 1 ? fA : fB > 0 && fB < 1 ? fB : -1;
  flash.visible = f >= 0;
  if (f >= 0) { flash.position.copy(mc).addScaledVector(vW, 120); flash.scale.setScalar(80 + 200 * eo(f)); flash.material.opacity = 0.75 * Math.pow(1 - f, 2); }

  // tarjetas
  const cardPos = {};
  for (const [k, c, phs] of [['N', cardN, 0], ['S', cardS, 1.9]]) {
    c.g.position.copy(CARD_POS[k]).addScaledVector(vU, 5 * Math.sin(2 * ph + phs));
    cardPos[k] = c.g.position;
  }
  cardN.g.updateMatrixWorld(); cardS.g.updateMatrixWorld();

  // personajes: brazo que señala la Luna
  const point = eio(seg(t, 2.3, 2.95)) * (1 - eio(seg(t, 8.25, 8.8)));
  for (const k of ['N', 'S']) {
    const p = people[k];
    p.arms[1].rotation.x = -2.1 * point - 0.05 * Math.sin(ph * 2);
    p.arms[1].rotation.z = 0.12 + 0.25 * point;
    p.arms[0].rotation.x = 0.1 * Math.sin(ph * 2 + 1);
  }

  // líneas de visión: del ojo de cada observador a la Luna
  const grow = eio(seg(t, 2.4, 3.15)), shrink = eio(seg(t, 8.15, 8.8));
  const march = (t / DUR * 20) % 1;
  for (const k of ['N', 'S']) {
    const p = people[k];

    const toM = mc.clone().sub(eye); const L = toM.length(); toM.normalize();
    const end = eye.clone().addScaledVector(toM, L - RM * Math.max(ms, 0.3) - 16);

    const corner = c.g.localToWorld(new THREE.Vector3(-CW / 2 - 6, k === 'N' ? -CH / 2 + 34 : CH / 2 - 34, 0));
    for (let i = 0; i < 3; i++) {
      const u = [0.24, 0.5, 0.77][i];
      const pos = head.clone().lerp(corner, u).addScaledVector(vU, (k === 'N' ? 1 : -1) * 18 * Math.sin(u * Math.PI));
      const sIn = eob(seg(t, 2.9 + d0 + 0.13 * i, 3.25 + d0 + 0.13 * i), 2.2);
      const sOut = eib(seg(t, 8.2 + 0.07 * (2 - i), 8.5 + 0.07 * (2 - i)));

      bubbles[k][i].scale.setScalar(Math.max(sc, 0.001));
      bubbles[k][i].position.copy(pos);

  for (const [k, c, d0] of [['N', cardN, 0], ['S', cardS, 0.2]]) {

    let sc;
    if (has) sc = eob(seg(t, rev, rev + 0.42), 2.6);
    else if (t >= hide) sc = eob(seg(t, hide + 0.1, hide + 0.45), 2.2) * 1;
    else sc = 1 - eib(seg(t, rev - 0.16, rev), 1.2);
    if (t >= hide && t < hide + 0.1) sc = 0;
    c.chip.scale.setScalar(Math.max(0.001, sc));
  }
  // ventana del sur: primero "vista con la pantalla derecha" (patas arriba), luego gira 180°
  const rp = eio(seg(t, 4.55, 6.0));
  cardS.view.rotation.z = t < 9.0 ? Math.PI + Math.PI * rp : Math.PI;
  // indicador de giro
  const arcOut = eib(seg(t, 7.85, 8.2));
  const arcW = 1 - arcOut;
  const RA = HR + 17;
  for (let j = 0; j < NARC; j++) {
    const u = (j + 0.5) / NARC;
    const on = u <= rp && arcW > 0.01 && t < 8.3 ? 1 : 0;
    const a = Math.PI / 2 + Math.PI * u;
    _q.setFromAxisAngle(ZAX, a);
    _s.set(on ? 3.6 * arcW : 0.001, on ? (Math.PI * RA / NARC) * 0.62 : 0.001, on ? 2 : 0.001);
    _m4.compose(_v.set(HX + Math.cos(a) * RA, Math.sin(a) * RA, cardS.FRONT + 1), _q, _s);
    arc.setMatrixAt(j, _m4);
  }
  arc.instanceMatrix.needsUpdate = true;
  const ah = rp > 0.02 && t < 8.3 ? arcW * Math.min(1, rp * 6) : 0;
  arcHead.visible = ah > 0.01;
  const aE = Math.PI / 2 + Math.PI * rp;
  arcHead.position.set(HX + Math.cos(aE) * RA, Math.sin(aE) * RA, cardS.FRONT + 1.5);
  arcHead.rotation.set(0, 0, aE + Math.PI); // la punta del cono (eje +Y) apunta en el sentido del giro
  arcHead.scale.setScalar(Math.max(ah, 0.001));

  // líneas al suelo y sombras de contacto
  const eS = ec.clone().addScaledVector(vU, -(RE + 92));
  setDashes(drops.E.im, drops.E.n, eS, new THREE.Vector3(eS.x, FY + SH, eS.z), 0, 1, 1.6, (t / DUR * 10) % 1, false);
  const mB = mc.clone().addScaledVector(vU, -(RM + 34));

  const bl = U.uBlobs.value;
  bl[0].set(ec.x, ec.z, RE * 1.15, 0.55);

  bl[4].set(cardPos.S.x, cardPos.S.z, 210, 0.3);
  bl[5].set(0, 0, 1, 0);

  rg[0].set(EARTH_C.x, EARTH_C.z, ES - 34, 0.6);
  rg[1].set(MOON_C.x, MOON_C.z, MS - 30, 0.55);
  rg[2].set(EARTH_C.x, EARTH_C.z, ES - 70, 0.22);

  // rótulo "LA MISMA LUNA" sobre la Luna
  const co = sstep(2.75, 3.2, t) * (1 - sstep(8.0, 8.4, t));
  callout.visible = co > 0.003;
  callout.material.opacity = co;
  const msx = W / 2 + mc.dot(vR), msy = H / 2 - mc.dot(vU);
  callout.position.set(msx, -(msy - RM - 14 - CO_H / 2 - 10 * (1 - eo(co))), 0);
}

// =====================================================================
// tamaño, bucle y API de captura
// =====================================================================
let vp = { x: 0, y: 0, w: W, h: H }, lastKey = '';
function resize() {
  const dpr = CAPTURA ? 1 : Math.min(window.devicePixelRatio || 1, 2);
  const vw = window.innerWidth, vh = window.innerHeight;
  const key = vw + 'x' + vh + '@' + dpr;
  if (key === lastKey) return;
  lastKey = key;
  renderer.setPixelRatio(dpr);
  renderer.setSize(vw, vh);
  const s = Math.min(vw / W, vh / H);
  vp = { x: (vw - W * s) / 2, y: (vh - H * s) / 2, w: W * s, h: H * s };
  buildTitle(Math.min(2, s * dpr));
  buildCallout(Math.min(2, s * dpr));
}
function render() {
  const vw = window.innerWidth, vh = window.innerHeight;
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, vw, vh);
  renderer.clear(true, true, true);
  renderer.setViewport(vp.x, vp.y, vp.w, vp.h);
  renderer.setScissor(vp.x, vp.y, vp.w, vp.h);
  renderer.setScissorTest(true);
  renderer.render(bgScene, hudCam);
  renderer.clearDepth();
  renderer.render(scene, camera);
  renderer.clearDepth();
  renderer.render(hudScene, hudCam);
}

async function init() {
  try {
    await Promise.all([
      document.fonts.load('700 58px "Space Grotesk"', 'LA LUNA AL REVÉS NORTE SUR DC?'),
      document.fonts.load('500 15px "IBM Plex Mono"', 'LO QUE NO TE EXPLICARON EN CLASE EPISODIO 01'),
      document.fonts.load('600 16px "IBM Plex Mono"', 'HEMISFERIO VE UNA'),
    ]);
    await document.fonts.ready;
  } catch (e) { /* fuente de respaldo */ }
  // las texturas con texto se crean después de cargar las fuentes
  for (const c of [cardN, cardS]) {
    c.face.map = cardFaceTexture(c.o); c.face.needsUpdate = true;
    c.lid.material.map = lidTexture(c.o); c.lid.material.needsUpdate = true;
    c.chipTex['?'] = chipTexture(c.o, '?'); c.chipTex.L = chipTexture(c.o, c.o.letter); c.chip.material.map = c.chipTex['?'];
  }
  tags = { N: tagSprite('N'), S: tagSprite('S') };
  scene.add(tags.N, tags.S);
  resize();
  window.__frame = (t) => { resize(); update(t); render(); };
  window.__frame(0);
  renderer.getContext().finish();
  window.__listo = true;
  if (!CAPTURA) {
    const t0 = performance.now();
    const loop = (now) => { window.__frame(((now - t0) / 1000) % DUR); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
    window.addEventListener('resize', () => { lastKey = ''; });
  }
}
init();
