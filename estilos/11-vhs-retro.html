<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Luna al revés · cinta de 1994</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fuentes" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=VT323&family=Barlow+Condensed:ital,wght@1,800&display=block">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #000; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
(() => {
'use strict';
// ───────────────────────────── constantes ─────────────────────────────
const DUR = 10;                 // duración del bucle (s)
const FPS = 30;                 // la cinta va a 30 fotogramas: el ruido cambia por fotograma
const NF = DUR * FPS;
const CAPTURA = location.search.includes('captura');
const W = 1920, H = 1080;       // marco de diseño 16:9
const T_CG = 2.6;               // corte cartela → escena 3D
const T_TIT = 8.8;              // corte escena 3D → cartela

const F_TIT = '"Bungee", "Arial Black", sans-serif';
const F_OSD = '"VT323", "Courier New", monospace';
const F_SUB = '"Barlow Condensed", "Arial Narrow", sans-serif';

const INK = '#140a2e';
const ROSA = '#ff2f7d', CIAN = '#19d3e6', AMAR = '#ffd23f';

// ───────────────────────────── utilidades ─────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (x, a, b) => clamp((x - a) / (b - a));
const eOutCubic = (x) => 1 - Math.pow(1 - x, 3);
const eInOutCubic = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eOutBack = (x, s = 1.70158) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const TAU = Math.PI * 2;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(x, y) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function hash3(x, y, z) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(z | 0, 2147483647);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  let fx = x - xi, fy = y - yi;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return lerp(lerp(a, b, fx), lerp(c, d, fx), fy);
}
function fbm(x, y) {
  let s = 0, a = 0.5;
  for (let i = 0; i < 5; i++) { s += a * vnoise(x, y); x *= 2.03; y *= 2.03; a *= 0.5; }
  return s / 0.97;
}
function vnoise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  let fx = x - xi, fy = y - yi, fz = z - zi;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);
  const c = (i, j, k) => hash3(xi + i, yi + j, zi + k);
  return lerp(
    lerp(lerp(c(0, 0, 0), c(1, 0, 0), fx), lerp(c(0, 1, 0), c(1, 1, 0), fx), fy),
    lerp(lerp(c(0, 0, 1), c(1, 0, 1), fx), lerp(c(0, 1, 1), c(1, 1, 1), fx), fy), fz);
}
function fbm3(x, y, z) {
  let s = 0, a = 0.5;
  for (let i = 0; i < 4; i++) { s += a * vnoise3(x, y, z); x *= 2.1; y *= 2.1; z *= 2.1; a *= 0.5; }
  return s / 0.9375;
}

// ───────────────────────────── lienzos ─────────────────────────────
const cv = document.getElementById('c');
function fit() {
  const vw = window.innerWidth, vh = window.innerHeight;
  return vw / vh > 16 / 9 ? [vh * 16 / 9, vh] : [vw, vw * 9 / 16];
}
const dprNow = () => (CAPTURA ? 1 : Math.min(window.devicePixelRatio || 1, 2));
// resolución de la "señal grabada": la cinta es blanda de todos modos, así que la imagen se
// pinta a menos resolución que la pantalla (y aún menos en móviles)
const PEQ = !CAPTURA && fit()[1] * dprNow() < 800;
const SW = PEQ ? 960 : 1280, SH = PEQ ? 540 : 720;
const K = SW / W;
const src = document.createElement('canvas'); src.width = SW; src.height = SH;
const sx = src.getContext('2d');
const osd = document.createElement('canvas'); osd.width = W; osd.height = H;
const ox = osd.getContext('2d');

function layout() {
  const [w, h] = fit();
  const d = dprNow();
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.width = Math.max(2, Math.round(w * d)); cv.height = Math.max(2, Math.round(h * d));
}
layout();

// ───────────────────────────── Luna CG (precalculada) ─────────────────────────────
// Esfera con sombreado Phong de los 90: cráteres por relieve, brillo especular plástico,
// luz de borde azul y luz cenicienta. La luz viene de la derecha y algo de detrás → creciente en "D".
const MS = 480, MRS = 184;
let moonSprite = null;
function buildMoon() {
  const c = document.createElement('canvas'); c.width = c.height = MS;
  const g = c.getContext('2d');
  const img = g.createImageData(MS, MS);
  const D = img.data;
  const hgt = new Float32Array(MS * MS);
  const alb = new Float32Array(MS * MS);
  const cx = MS / 2, cy = MS / 2;
  for (let y = 0; y < MS; y++) {
    for (let x = 0; x < MS; x++) {
      const nx = (x - cx) / MRS, ny = (y - cy) / MRS;
      if (nx * nx + ny * ny > 1.02) continue;
      const m = fbm(nx * 1.6 + 3.1, ny * 1.6 + 7.4) + 0.07 * nx;
      const mar = clamp((m - 0.5) / 0.08);
      const fino = fbm(nx * 11 + 11, ny * 11 + 2);
      const moteado = vnoise(nx * 60 + 5, ny * 60 + 9);
      alb[y * MS + x] = 0.86 - 0.34 * mar * mar * (3 - 2 * mar) + (fino - 0.5) * 0.26 + (moteado - 0.5) * 0.08;
    }
  }
  const rnd = mulberry32(19940417);
  for (let i = 0; i < 150; i++) {
    const small = i >= 40;
    const a = rnd() * TAU, r = Math.sqrt(rnd()) * (small ? 0.97 : 0.88);
    const ccx = Math.cos(a) * r, ccy = Math.sin(a) * r;
    const nz = Math.sqrt(Math.max(0.05, 1 - r * r));
    const cr = small ? 0.006 + 0.012 * rnd() : (0.02 + 0.07 * Math.pow(rnd(), 2.2)) * (i < 4 ? 1.6 : 1);
    const ux = r > 1e-4 ? ccx / r : 1, uy = r > 1e-4 ? ccy / r : 0;
    const x0 = Math.floor(cx + (ccx - cr * 1.5) * MRS), x1 = Math.ceil(cx + (ccx + cr * 1.5) * MRS);
    const y0 = Math.floor(cy + (ccy - cr * 1.5) * MRS), y1 = Math.ceil(cy + (ccy + cr * 1.5) * MRS);
    for (let y = Math.max(0, y0); y < Math.min(MS, y1); y++) {
      for (let x = Math.max(0, x0); x < Math.min(MS, x1); x++) {
        const dx = (x - cx) / MRS - ccx, dy = (y - cy) / MRS - ccy;
        const dr = (dx * ux + dy * uy) / nz, dt = -dx * uy + dy * ux;
        const q = Math.sqrt(dr * dr + dt * dt) / cr;
        if (q > 1.5) continue;
        let h = 0;
        if (q < 1) h = (q * q - 1) * 0.55;
        h += 0.22 * Math.exp(-Math.pow((q - 1) / 0.16, 2));
        hgt[y * MS + x] += h * cr * (small ? 0.25 : 0.42);
        if (q < 0.9) alb[y * MS + x] -= 0.05 * (1 - q);
        else if (q < 1.4) alb[y * MS + x] += (small ? 0.12 : 0.07) * (1 - Math.abs(q - 1.08) / 0.32);
      }
    }
  }
  const nrm = (v) => { const n = Math.hypot(...v); return v.map((k) => k / n); };
  const L = nrm([0.86, -0.06, -0.36]);
  const Hh = nrm([L[0], L[1], L[2] + 1]);
  const L2 = Math.hypot(L[0], L[1]);
  for (let y = 0; y < MS; y++) {
    for (let x = 0; x < MS; x++) {
      const i = y * MS + x;
      const nx = (x + 0.5 - cx) / MRS, ny = (y + 0.5 - cy) / MRS;
      const d = Math.sqrt(nx * nx + ny * ny);
      let r = 0, gg = 0, b = 0, a = 0;
      if (d < 1.0 + 1.5 / MRS) {
        const nz = Math.sqrt(Math.max(0, 1 - d * d));
        const hx = x > 0 && x < MS - 1 ? (hgt[i + 1] - hgt[i - 1]) * 0.5 * MRS : 0;
        const hy = y > 0 && y < MS - 1 ? (hgt[i + MS] - hgt[i - MS]) * 0.5 * MRS : 0;
        let px = nx - hx * 0.75, py = ny - hy * 0.75, pz = nz;
        const pn = Math.hypot(px, py, pz) || 1; px /= pn; py /= pn; pz /= pn;
        const dif = Math.max(0, px * L[0] + py * L[1] + pz * L[2]);
        const dif0 = Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]);
        const mask = clamp((dif0 + 0.02) / 0.12); const msk = mask * mask * (3 - 2 * mask);
        const lit = Math.pow(dif, 0.6) * msk * 1.0;
        const spec = Math.pow(Math.max(0, px * Hh[0] + py * Hh[1] + pz * Hh[2]), 34) * 0.42 * msk;
        const al = alb[i];
        const rim = Math.pow(1 - nz, 3.5) * 0.55 * (1 - msk);
        const earth = al * 0.17 * (0.4 + 0.6 * nz) * (1 - msk);
        r = al * lit * 1.02 + spec + earth * 0.55 + rim * 0.22 + 0.02;
        gg = al * lit * 0.98 + spec + earth * 0.72 + rim * 0.45 + 0.024;
        b = al * lit * 0.88 + spec * 0.95 + earth * 1.3 + rim * 1.0 + 0.06;
        a = clamp((1 - d) * MRS + 0.5);
      }
      let ga = 0;
      if (d > 0.97) {
        const dir = Math.max(0, (nx * L[0] + ny * L[1]) / (d * L2));
        ga = Math.exp(-(d - 1) * 15) * 0.55 * Math.pow(dir, 2.5) + Math.exp(-(d - 1) * 26) * 0.16;
        ga = clamp(ga);
      }
      const outA = a + ga * (1 - a);
      if (outA > 0) {
        r = (r * a + 1.0 * ga * (1 - a)) / outA;
        gg = (gg * a + 0.93 * ga * (1 - a)) / outA;
        b = (b * a + 0.82 * ga * (1 - a)) / outA;
      }
      D[i * 4] = clamp(r) * 255; D[i * 4 + 1] = clamp(gg) * 255; D[i * 4 + 2] = clamp(b) * 255; D[i * 4 + 3] = outA * 255;
    }
  }
  g.putImageData(img, 0, 0);
  moonSprite = c;
}

// ───────────────────────────── la Tierra CG (gira por fotograma) ─────────────────────────────
const GW = 256, GH = 128;
let landMap = null;
function buildEarthMap() {
  landMap = new Float32Array(GW * GH * 2);
  for (let j = 0; j < GH; j++) {
    const lat = (j / (GH - 1) - 0.5) * Math.PI;
    for (let i = 0; i < GW; i++) {
      const lon = (i / GW) * TAU;
      const x = Math.cos(lat) * Math.cos(lon), y = Math.sin(lat), z = Math.cos(lat) * Math.sin(lon);
      const n = fbm3(x * 1.7 + 4.2, y * 1.7 + 1.3, z * 1.7 + 8.8);
      const dry = fbm3(x * 3.1 + 9, y * 3.1, z * 3.1 + 2);
      landMap[(j * GW + i) * 2] = clamp((n - 0.5) / 0.035);
      landMap[(j * GW + i) * 2 + 1] = dry;
    }
  }
}
const GRp = Math.round(74 * K * 1.3), GS = 2 * Math.ceil(GRp * 1.24) + 2;
const globeCv = document.createElement('canvas'); globeCv.width = globeCv.height = GS;
const globeCx = globeCv.getContext('2d');
const globeImg = globeCx.createImageData(GS, GS);
function renderEarth(spin) {
  const D = globeImg.data;
  const tilt = 0.2, ct = Math.cos(tilt), st = Math.sin(tilt);
  const L = [-0.5, -0.55, 0.67];
  const Hn = (() => { const v = [L[0], L[1], L[2] + 1]; const n = Math.hypot(...v); return v.map((k) => k / n); })();
  const c = GS / 2;
  for (let y = 0; y < GS; y++) {
    for (let x = 0; x < GS; x++) {
      const i = (y * GS + x) * 4;
      const nx = (x + 0.5 - c) / GRp, ny = (y + 0.5 - c) / GRp;
      const d2 = nx * nx + ny * ny, d = Math.sqrt(d2);
      if (d > 1.22) { D[i + 3] = 0; continue; }
      if (d >= 1) {
        // atmósfera
        const ga = Math.pow(clamp(1 - (d - 1) / 0.22), 2.2) * 0.75;
        D[i] = 90; D[i + 1] = 220; D[i + 2] = 255; D[i + 3] = ga * 255;
        continue;
      }
      const nz = Math.sqrt(1 - d2);
      // vista → mundo (el eje polar apunta hacia arriba de la pantalla)
      const wy = -ny * ct + nz * st;
      const wz = ny * st + nz * ct;
      const wx = nx;
      const lat = Math.asin(clamp(wy, -1, 1));
      let lon = Math.atan2(wz, wx) + spin;
      lon = ((lon % TAU) + TAU) % TAU;
      const mi = Math.floor((lon / TAU) * GW) % GW, mj = Math.round((lat / Math.PI + 0.5) * (GH - 1));
      const land = landMap[(mj * GW + mi) * 2], dry = landMap[(mj * GW + mi) * 2 + 1];
      const ice = clamp((Math.abs(lat) - 1.12) / 0.08);
      let r = lerp(0.07, 0.24, 1 - d * 0.6), g = lerp(0.25, 0.5, 1 - d * 0.6), b = lerp(0.75, 0.92, 1 - d * 0.5);
      const lr = lerp(0.26, 0.86, clamp((dry - 0.45) / 0.2)), lg = lerp(0.72, 0.68, clamp((dry - 0.45) / 0.2)), lb = lerp(0.22, 0.32, clamp((dry - 0.45) / 0.2));
      r = lerp(r, lr, land); g = lerp(g, lg, land); b = lerp(b, lb, land);
      r = lerp(r, 0.95, ice); g = lerp(g, 0.98, ice); b = lerp(b, 1.0, ice);
      const dif = Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]);
      const sh = 0.28 + 0.85 * dif;
      const spec = Math.pow(Math.max(0, nx * Hn[0] + ny * Hn[1] + nz * Hn[2]), 40) * (1 - land) * 0.9;
      // retícula de meridianos y paralelos (globo "de ordenador")
      const latDeg = lat / Math.PI * 180, lonDeg = lon / Math.PI * 180;
      const gl = Math.max(
        clamp(1 - Math.abs(((latDeg + 90) % 30) - 15 > 0 ? 30 - ((latDeg + 90) % 30) : ((latDeg + 90) % 30)) / 1.6),
        clamp(1 - Math.min(lonDeg % 30, 30 - (lonDeg % 30)) / (1.6 / Math.max(0.25, Math.cos(lat)))));
      const rim = Math.pow(1 - nz, 2.5);
      r = r * sh + spec + rim * 0.2 + gl * 0.1;
      g = g * sh + spec + rim * 0.55 + gl * 0.32;
      b = b * sh + spec + rim * 0.8 + gl * 0.38;
      D[i] = clamp(r) * 255; D[i + 1] = clamp(g) * 255; D[i + 2] = clamp(b) * 255;
      D[i + 3] = clamp((1 - d) * GRp + 0.5) * 255;
    }
  }
  globeCx.putImageData(globeImg, 0, 0);
}

// ───────────────────────────── estrellas ─────────────────────────────
function makeStars(seed, n, R) {
  const r = mulberry32(seed), out = [];
  for (let i = 0; i < n; i++) {
    const big = r() < 0.07;
    out.push({
      x: (r() * 2 - 1) * R, y: (r() * 2 - 1) * R,
      s: big ? 2.6 + r() * 1.6 : 0.9 + r() * 1.5,
      big, f: 1 + Math.floor(r() * 3), ph: r() * TAU,
      c: ['#ffffff', '#cfe3ff', '#fff1cc', '#ffd6f2'][Math.floor(r() * 4)],
    });
  }
  return out;
}
const winStars = makeStars(7741, 170, 560);
const bgStars = makeStars(2207, 130, 1000);

// ───────────────────────────── piezas de dibujo ─────────────────────────────
function glossy(g, x, y, r, base, dark, light) {
  const gr = g.createRadialGradient(x - r * 0.38, y - r * 0.42, r * 0.04, x, y, r * 1.02);
  gr.addColorStop(0, '#ffffff');
  gr.addColorStop(0.12, light);
  gr.addColorStop(0.55, base);
  gr.addColorStop(1, dark);
  g.fillStyle = gr;
  g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  g.save();
  g.globalAlpha = 0.55;
  g.fillStyle = '#ffffff';
  g.beginPath(); g.ellipse(x - r * 0.33, y - r * 0.45, r * 0.26, r * 0.13, -0.6, 0, TAU); g.fill();
  g.restore();
}

// Átomo narrador: núcleo de esferas brillantes + 3 electrones en órbitas inclinadas.
// tt avanza una vuelta entera de cada electrón por cada 2 s → el bucle de 10 s cierra.
function drawAtom(g, cx, cy, s, tt) {
  const rx = 225 * s, ry = 74 * s;
  const rots = [Math.PI / 2, Math.PI / 6, -Math.PI / 6];
  const w = TAU / 2;
  const els = rots.map((rot, k) => ({ rot, a: tt * w * (k === 1 ? 2 : 1) + k * 2.1 }));
  const tube = (rot, a0, a1) => {
    g.lineCap = 'butt';
    const st = (col, lw, oy) => { g.strokeStyle = col; g.lineWidth = lw; g.beginPath(); g.ellipse(cx, cy + oy, rx, ry, rot, a0, a1); g.stroke(); };
    st('rgba(90,230,255,0.16)', 30 * s, 0);
    st('rgba(10,6,40,0.95)', 15 * s, 0);
    st('#1b6fd6', 10 * s, 0);
    st('#46dcff', 6 * s, -1 * s);
    st('rgba(235,255,255,0.95)', 2.2 * s, -2.2 * s);
  };
  const elPos = (e, a) => {
    const lx = rx * Math.cos(a), ly = ry * Math.sin(a);
    return [cx + lx * Math.cos(e.rot) - ly * Math.sin(e.rot), cy + lx * Math.sin(e.rot) + ly * Math.cos(e.rot)];
  };
  const drawEl = (e) => {
    for (let k = 7; k >= 1; k--) {
      const [x, y] = elPos(e, e.a - k * 0.075);
      g.globalAlpha = 0.32 * (1 - k / 8);
      g.fillStyle = '#7ff6ff';
      g.beginPath(); g.arc(x, y, 15 * s * (1 - k / 11), 0, TAU); g.fill();
    }
    g.globalAlpha = 1;
    const [x, y] = elPos(e, e.a);
    const gl = g.createRadialGradient(x, y, 0, x, y, 44 * s);
    gl.addColorStop(0, 'rgba(140,250,255,0.55)'); gl.addColorStop(1, 'rgba(140,250,255,0)');
    g.fillStyle = gl; g.beginPath(); g.arc(x, y, 44 * s, 0, TAU); g.fill();
    glossy(g, x, y, 23 * s, '#20c8ff', '#063a8c', '#b9fbff');
  };
  for (const e of els) tube(e.rot, Math.PI, TAU);
  for (const e of els) if (Math.sin(e.a) < 0) drawEl(e);
  const pts = [[0, 0, 0]];
  const nN = 10;
  for (let i = 0; i < nN; i++) {
    const yv = 1 - (i + 0.5) * 2 / nN, rr = Math.sqrt(1 - yv * yv), th = i * 2.39996;
    pts.push([Math.cos(th) * rr, yv, Math.sin(th) * rr]);
  }
  const ay = tt * (TAU / 10), ax = 0.45;
  const P = pts.map((p, i) => {
    const [x, y, z] = p;
    const x1 = x * Math.cos(ay) + z * Math.sin(ay), z1 = -x * Math.sin(ay) + z * Math.cos(ay);
    const y2 = y * Math.cos(ax) - z1 * Math.sin(ax), z2 = y * Math.sin(ax) + z1 * Math.cos(ax);
    return { x: x1, y: y2, z: z2, pro: i % 2 === 0 };
  }).sort((a, b) => a.z - b.z);
  const nr = 40 * s;
  const halo = g.createRadialGradient(cx, cy, 0, cx, cy, 120 * s);
  halo.addColorStop(0, 'rgba(255,90,160,0.45)'); halo.addColorStop(1, 'rgba(255,90,160,0)');
  g.fillStyle = halo; g.beginPath(); g.arc(cx, cy, 120 * s, 0, TAU); g.fill();
  for (const p of P) {
    const r = 27 * s * (1 + p.z * 0.08);
    if (p.pro) glossy(g, cx + p.x * nr, cy + p.y * nr, r, '#ff2f6e', '#5a0328', '#ffb0c8');
    else glossy(g, cx + p.x * nr, cy + p.y * nr, r, '#ffc42e', '#7a3a00', '#fff2b8');
  }
  for (const e of els) tube(e.rot, 0, Math.PI);
  for (const e of els) if (Math.sin(e.a) >= 0) drawEl(e);
}

// Texto con extrusión 3D y contorno grueso (rotulación de TV de los 90)
function text3D(g, str, x, y, o) {
  g.save();
  g.translate(x, y);
  if (o.rot) g.rotate(o.rot);
  if (o.sx !== undefined || o.sy !== undefined) g.scale(o.sx ?? 1, o.sy ?? 1);
  g.font = o.font; g.textAlign = o.align || 'center'; g.textBaseline = 'alphabetic';
  g.lineJoin = 'round'; g.miterLimit = 2;
  const n = o.depth, dx = o.dx, dy = o.dy;
  g.strokeStyle = o.ink; g.lineWidth = o.stroke;
  for (let i = n; i >= 1; i--) g.strokeText(str, dx * i, dy * i);
  for (let i = n; i >= 1; i--) { g.fillStyle = o.side(i / n); g.fillText(str, dx * i, dy * i); }
  g.lineWidth = o.stroke; g.strokeStyle = o.ink; g.strokeText(str, 0, 0);
  g.fillStyle = o.face; g.fillText(str, 0, 0);
  if (o.shine) {
    g.lineWidth = Math.max(1.5, o.stroke * 0.22); g.strokeStyle = o.shine;
    g.strokeText(str, -o.stroke * 0.18, -o.stroke * 0.18);
    g.fillStyle = o.face; g.fillText(str, 0, 0);
  }
  g.restore();
}

function starburst(g, x, y, n, ro, ri) {
  g.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = (i / (n * 2)) * TAU - Math.PI / 2, r = i % 2 ? ri : ro;
    g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  g.closePath();
}

function sparkle(g, x, y, l) {
  if (l <= 0.5) return;
  g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = 'rgba(255,255,255,0.95)';
  const w = l * 0.13;
  g.beginPath(); g.moveTo(x - l, y); g.lineTo(x, y - w); g.lineTo(x + l, y); g.lineTo(x, y + w); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(x, y - l); g.lineTo(x - w, y); g.lineTo(x, y + l); g.lineTo(x + w, y); g.closePath(); g.fill();
  const gl = g.createRadialGradient(x, y, 0, x, y, l * 0.5);
  gl.addColorStop(0, 'rgba(255,255,255,0.8)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gl; g.beginPath(); g.arc(x, y, l * 0.5, 0, TAU); g.fill();
  g.restore();
}

// semitono en abanico desde una esquina
function halftone(g, cx, cy, R, col, rmax) {
  const st = 30;
  g.fillStyle = col;
  g.beginPath();
  for (let j = 0; j * st <= H + st; j++) {
    const y = j * st;
    if (Math.abs(y - cy) > R) continue;
    for (let i = -1; i * st <= W + st; i++) {
      const x = i * st + (j % 2) * st / 2;
      const d = Math.hypot(x - cx, y - cy) / R;
      if (d >= 1) continue;
      const r = (1 - d) * rmax;
      if (r < 0.6) continue;
      g.moveTo(x + r, y); g.arc(x, y, r, 0, TAU);
    }
  }
  g.fill();
}

// forma con sombra sólida desplazada (estilo Memphis)
function memphis(g, x, y, rot, path, fill, lw) {
  g.save(); g.translate(x, y); g.rotate(rot);
  g.lineJoin = 'round'; g.lineCap = 'round';
  g.save(); g.translate(7, 8); path(); if (lw) { g.strokeStyle = INK; g.lineWidth = lw + 12; g.stroke(); } else { g.fillStyle = INK; g.fill(); } g.restore();
  path();
  if (lw) { g.strokeStyle = INK; g.lineWidth = lw + 12; g.stroke(); g.strokeStyle = fill; g.lineWidth = lw; g.stroke(); }
  else { g.fillStyle = fill; g.fill(); g.strokeStyle = INK; g.lineWidth = 7; g.stroke(); }
  g.restore();
}

const WIN = [{ x: 120, y: 215, w: 720, h: 450 }, { x: 1080, y: 215, w: 720, h: 450 }];
const MR = 168;               // radio de la Luna en cada ventana
const HZ = 712;               // horizonte del suelo cuadriculado

function lensFlare(g, sxp, syp, a) {
  // coordenadas locales: la Luna está en (0,0); el destello gira con el cielo
  g.save();
  g.globalCompositeOperation = 'lighter';
  const core = g.createRadialGradient(sxp, syp, 0, sxp, syp, 300);
  core.addColorStop(0, `rgba(255,252,235,${0.9 * a})`); core.addColorStop(0.12, `rgba(255,220,150,${0.5 * a})`);
  core.addColorStop(0.42, `rgba(255,140,90,${0.13 * a})`); core.addColorStop(1, 'rgba(255,120,80,0)');
  g.fillStyle = core; g.beginPath(); g.arc(sxp, syp, 300, 0, TAU); g.fill();
  const ring = g.createRadialGradient(sxp, syp, 330, sxp, syp, 400);
  ring.addColorStop(0, 'rgba(255,60,60,0)'); ring.addColorStop(0.3, `rgba(255,80,60,${0.09 * a})`);
  ring.addColorStop(0.5, `rgba(90,255,120,${0.08 * a})`); ring.addColorStop(0.7, `rgba(80,120,255,${0.09 * a})`); ring.addColorStop(1, 'rgba(80,120,255,0)');
  g.fillStyle = ring; g.beginPath(); g.arc(sxp, syp, 400, 0, TAU); g.fill();
  const ghosts = [[0.55, 26, '255,210,120', 0.2, 0], [1.3, 46, '120,170,255', 0.12, 6],
    [1.5, 18, '255,120,200', 0.2, 0], [1.9, 80, '150,255,220', 0.07, 6], [2.2, 30, '255,170,90', 0.13, 6]];
  for (const [f, r, c, al, poly] of ghosts) {
    const x = sxp * (1 - f), y = syp * (1 - f);
    const gg = g.createRadialGradient(x, y, 0, x, y, r);
    gg.addColorStop(0, `rgba(${c},${al * 0.35 * a})`); gg.addColorStop(0.85, `rgba(${c},${al * a})`); gg.addColorStop(1, `rgba(${c},0)`);
    g.fillStyle = gg; g.beginPath();
    if (poly) for (let i = 0; i < poly; i++) { const an = i / poly * TAU + 0.3; g.lineTo(x + Math.cos(an) * r, y + Math.sin(an) * r); }
    else g.arc(x, y, r, 0, TAU);
    g.closePath(); g.fill();
  }
  g.restore();
}

function drawWindow(g, R, th, k, side, t, cols) {
  const cx = R.x + R.w / 2, cy = R.y + R.h / 2;
  g.save();
  // entrada tipo DVE: la ventana llega girando y escalando
  g.translate(cx, cy); g.rotate((1 - k) * (side ? 0.5 : -0.5)); g.scale(k, k); g.translate(-cx, -cy);
  // sombra sólida
  g.fillStyle = 'rgba(5,2,18,0.6)'; g.fillRect(R.x + 6, R.y + 10, R.w + 30, R.h + 30);
  // marco biselado del color del hemisferio (caja DVE de los 90)
  const B = 18;
  g.fillStyle = INK; g.fillRect(R.x - B - 5, R.y - B - 5, R.w + 2 * B + 10, R.h + 2 * B + 10);
  const fr = g.createLinearGradient(R.x, R.y - B, R.x + R.w * 0.35, R.y + R.h + B);
  fr.addColorStop(0, cols[2]); fr.addColorStop(0.3, cols[0]); fr.addColorStop(0.7, cols[1]); fr.addColorStop(1, cols[3]);
  g.fillStyle = fr; g.fillRect(R.x - B, R.y - B, R.w + 2 * B, R.h + 2 * B);
  // bisel: luz arriba-izquierda, sombra abajo-derecha
  g.fillStyle = 'rgba(255,255,255,0.3)';
  g.beginPath(); g.moveTo(R.x - B, R.y - B); g.lineTo(R.x + R.w + B, R.y - B); g.lineTo(R.x + R.w, R.y); g.lineTo(R.x, R.y); g.lineTo(R.x, R.y + R.h); g.lineTo(R.x - B, R.y + R.h + B); g.closePath(); g.fill();
  g.fillStyle = 'rgba(20,6,50,0.32)';
  g.beginPath(); g.moveTo(R.x + R.w + B, R.y + R.h + B); g.lineTo(R.x - B, R.y + R.h + B); g.lineTo(R.x, R.y + R.h); g.lineTo(R.x + R.w, R.y + R.h); g.lineTo(R.x + R.w, R.y); g.lineTo(R.x + R.w + B, R.y - B); g.closePath(); g.fill();
  g.fillStyle = INK; g.fillRect(R.x - 3, R.y - 3, R.w + 6, R.h + 6);
  // contenido
  g.save();
  g.beginPath(); g.rect(R.x, R.y, R.w, R.h); g.clip();
  const sky = g.createRadialGradient(cx, cy, 60, cx, cy + 120, 700);
  sky.addColorStop(0, '#22186a'); sky.addColorStop(0.5, '#110b44'); sky.addColorStop(1, '#05040f');
  g.fillStyle = sky; g.fillRect(R.x, R.y, R.w, R.h);
  g.translate(cx, cy); g.rotate(th);
  const neb = [[-300, 220, 330, '120,40,200', 0.34], [260, -260, 300, '20,140,190', 0.22], [180, 300, 260, '230,60,150', 0.16]];
  for (const [x, y, r, c, al] of neb) {
    const ng = g.createRadialGradient(x, y, 0, x, y, r);
    ng.addColorStop(0, `rgba(${c},${al})`); ng.addColorStop(1, `rgba(${c},0)`);
    g.fillStyle = ng; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  for (const s of winStars) {
    const tw = 0.7 + 0.3 * Math.sin(t * TAU * s.f / 5 + s.ph);
    g.globalAlpha = tw;
    g.fillStyle = s.c;
    g.beginPath(); g.arc(s.x, s.y, s.s, 0, TAU); g.fill();
    if (s.big) {
      const l = s.s * 6 * tw;
      g.globalAlpha = 0.7 * tw;
      g.fillRect(s.x - l, s.y - 1.1, l * 2, 2.2); g.fillRect(s.x - 1.1, s.y - l, 2.2, l * 2);
    }
  }
  g.globalAlpha = 1;
  lensFlare(g, 600, -150, 0.85);
  const f = MR / MRS;
  g.drawImage(moonSprite, -MS / 2 * f, -MS / 2 * f, MS * f, MS * f);
  g.restore();
  // reflejo de cristal (pantalla de los 90)
  const gl = g.createLinearGradient(R.x, R.y, R.x + R.w * 0.6, R.y + R.h);
  gl.addColorStop(0, 'rgba(255,255,255,0.10)'); gl.addColorStop(0.35, 'rgba(255,255,255,0.03)'); gl.addColorStop(0.36, 'rgba(255,255,255,0)');
  g.fillStyle = gl; g.fillRect(R.x, R.y, R.w, R.h);
  g.restore();
}

// figurita CG (observador): pies en (0,0), cabeza hacia -y local
function observer(g, x, y, ang, col, dark, light) {
  g.save(); g.translate(x, y); g.rotate(ang);
  g.lineCap = 'round'; g.lineJoin = 'round';
  const limb = (pts, w) => {
    for (const [c, lw] of [[INK, w + 7], [col, w]]) {
      g.strokeStyle = c; g.lineWidth = lw; g.beginPath();
      pts.forEach(([px, py], i) => (i ? g.lineTo(px, py) : g.moveTo(px, py))); g.stroke();
    }
  };
  limb([[-11, -1], [-5, -1], [-5, -18]], 7);
  limb([[11, -1], [5, -1], [5, -18]], 7);
  limb([[-5, -30], [-17, -42], [-24, -58]], 6);   // brazo señalando el cielo
  limb([[5, -30], [13, -18]], 6);
  // torso
  g.fillStyle = INK; g.beginPath(); g.ellipse(0, -27, 12.5, 15.5, 0, 0, TAU); g.fill();
  const tg = g.createLinearGradient(-10, -40, 10, -14);
  tg.addColorStop(0, light); tg.addColorStop(0.45, col); tg.addColorStop(1, dark);
  g.fillStyle = tg; g.beginPath(); g.ellipse(0, -27, 9, 12, 0, 0, TAU); g.fill();
  // cabeza
  g.fillStyle = INK; g.beginPath(); g.arc(0, -50, 11.5, 0, TAU); g.fill();
  glossy(g, 0, -50, 8.5, '#ffd9b8', '#a8613a', '#fff3e6');
  g.restore();
}

function drawCG(g, v, t) {
  // fondo: espacio índigo con suelo cuadriculado de render de los 90
  const bg = g.createLinearGradient(0, 0, 0, HZ);
  bg.addColorStop(0, '#05041a'); bg.addColorStop(0.7, '#160b48'); bg.addColorStop(1, '#3a137a');
  g.fillStyle = bg; g.fillRect(0, 0, W, HZ);
  for (const s of bgStars) {
    const x = 960 + s.x, y = 360 + s.y * 0.36;
    if (y > HZ - 20) continue;
    g.globalAlpha = 0.45 * (0.6 + 0.4 * Math.sin(t * TAU * s.f / 5 + s.ph));
    g.fillStyle = s.c; g.fillRect(x, y, s.s, s.s);
  }
  g.globalAlpha = 1;
  const fl = g.createLinearGradient(0, HZ, 0, H);
  fl.addColorStop(0, '#4a1580'); fl.addColorStop(0.25, '#230a52'); fl.addColorStop(1, '#0b0424');
  g.fillStyle = fl; g.fillRect(0, HZ, W, H - HZ);
  g.save();
  g.beginPath(); g.rect(0, HZ, W, H - HZ); g.clip();
  const gcol = g.createLinearGradient(0, HZ, 0, H);
  gcol.addColorStop(0, 'rgba(255,90,200,0)'); gcol.addColorStop(0.18, 'rgba(255,90,200,0.3)'); gcol.addColorStop(1, 'rgba(90,220,255,0.45)');
  g.strokeStyle = gcol; g.lineWidth = 2.2;
  g.beginPath();
  const ph = (t / 2.5) % 1;           // el suelo avanza: 4 casillas por bucle
  for (let kz = 0; kz < 26; kz++) {
    const d = kz + 1 - ph;
    const y = HZ + 300 / d;
    if (y > H + 4) continue;
    g.moveTo(0, y); g.lineTo(W, y);
  }
  for (let kx = -16; kx <= 16; kx++) {
    g.moveTo(960 + kx * 9, HZ); g.lineTo(960 + kx * 240, HZ + 600);
  }
  g.stroke();
  g.restore();
  const hg = g.createLinearGradient(0, HZ - 40, 0, HZ + 40);
  hg.addColorStop(0, 'rgba(255,80,190,0)'); hg.addColorStop(0.5, 'rgba(255,120,210,0.55)'); hg.addColorStop(1, 'rgba(255,80,190,0)');
  g.fillStyle = hg; g.fillRect(0, HZ - 40, W, 80);

  // ventanas: norte (izquierda) y sur (derecha)
  const kN = eOutBack(seg(v, 0.0, 0.6), 1.2), kS = eOutBack(seg(v, 0.12, 0.72), 1.2);
  const kr = eInOutCubic(seg(v, 1.75, 3.0));       // el observador del sur da media vuelta
  const thS = -Math.PI * kr;
  if (kN > 0.001) drawWindow(g, WIN[0], 0, kN, 0, t, [ROSA, '#ff7a2f', '#ffc2da', '#8a1240']);
  if (kS > 0.001) drawWindow(g, WIN[1], thS, kS, 1, t, [CIAN, '#2a7bff', '#d2fbff', '#0c3a8a']);

  // flechas de giro (icono clásico de "dar la vuelta") alrededor de la Luna del sur
  const ka = Math.min(seg(v, 1.5, 1.7), 1 - seg(v, 2.95, 3.2));
  if (ka > 0) {
    const mx = WIN[1].x + WIN[1].w / 2, my = WIN[1].y + WIN[1].h / 2;
    const rr = MR + 34;
    const grow = eOutCubic(seg(v, 1.5, 1.95));
    g.save();
    g.globalAlpha = ka;
    g.lineCap = 'round'; g.lineJoin = 'round';
    for (const c of [0, Math.PI]) {
      // el giro es antihorario: a la derecha la flecha sube, a la izquierda baja
      const tail = c + 0.85, head = tail - 1.7 * grow - 0.02;
      for (const [col, lw] of [[INK, 24], [AMAR, 12]]) {
        g.strokeStyle = col; g.lineWidth = lw;
        g.beginPath(); g.arc(mx, my, rr, head, tail); g.stroke();
      }
      const hx = mx + Math.cos(head) * rr, hy = my + Math.sin(head) * rr;
      g.save(); g.translate(hx, hy); g.rotate(head - Math.PI / 2);
      g.beginPath(); g.moveTo(32, 0); g.lineTo(-8, -27); g.lineTo(-8, 27); g.closePath();
      g.fillStyle = AMAR; g.fill(); g.strokeStyle = INK; g.lineWidth = 7; g.stroke();
      g.restore();
    }
    g.restore();
  }

  // rótulos
  label(g, WIN[0].x + 26, 160, 'HEMISFERIO NORTE', [ROSA, '#ff7a2f'], 1 - eOutCubic(seg(v, 0.4, 0.85)));
  label(g, WIN[1].x + 26, 160, 'HEMISFERIO SUR', [CIAN, '#2a7bff'], 1 - eOutCubic(seg(v, 0.52, 0.97)));

  // en medio: la Tierra, con un observador de pie en el norte y otro cabeza abajo en el sur
  const kg = eOutBack(seg(v, 0.45, 0.95), 1.6);
  if (kg > 0) {
    const gx = 960, gy = 440, gr = 74;
    g.save(); g.translate(gx, gy); g.scale(kg, kg);
    const glw = g.createRadialGradient(0, 0, gr * 0.8, 0, 0, gr * 2.4);
    glw.addColorStop(0, 'rgba(80,200,255,0.30)'); glw.addColorStop(1, 'rgba(80,200,255,0)');
    g.fillStyle = glw; g.beginPath(); g.arc(0, 0, gr * 2.4, 0, TAU); g.fill();
    g.fillStyle = INK; g.beginPath(); g.arc(0, 0, gr + 5, 0, TAU); g.fill();
    const f = gr / GRp;
    g.drawImage(globeCv, -GS / 2 * f, -GS / 2 * f, GS * f, GS * f);
    g.save(); g.translate(0, -gr - 2); g.scale(1.42, 1.42); observer(g, 0, 0, 0, ROSA, '#7a0838', '#ffc0d6'); g.restore();
    g.save(); g.translate(0, gr + 2); g.scale(1.42, 1.42); observer(g, 0, 0, Math.PI, CIAN, '#064a7a', '#c8fbff'); g.restore();
    g.restore();
  }

  // el narrador, pequeño, como mosca de cadena
  const kb = seg(v, 0.3, 0.8);
  if (kb > 0) {
    g.save(); g.globalAlpha = 0.95 * kb;
    drawAtom(g, 960, 170, 0.3, t);
    g.restore();
  }

  // filas de letras
  const kD = seg(v, 0.75, 1.2), kC = seg(v, 0.85, 1.3);
  const spin = seg(v, 2.05, 2.75);
  const sxs = spin > 0 && spin < 1 ? Math.abs(Math.cos(Math.PI * eInOutCubic(spin))) : 1;
  const glintN = Math.max(0, Math.sin((v - 3.3) * 2.6)) * seg(v, 3.3, 3.4);
  const glintS = Math.max(0, Math.sin((v - 3.0) * 2.6)) * seg(v, 3.0, 3.1);
  chromeRow(g, WIN[0].x + WIN[0].w / 2, 'D', 1, kD, glintN);
  chromeRow(g, WIN[1].x + WIN[1].w / 2, spin >= 0.5 ? 'C' : 'D', sxs, kC, glintS);

  // remate: es la misma Luna, lo que cambia es quién mira
  const km = seg(v, 3.15, 3.55);
  if (km > 0) {
    const sc = eOutBack(km, 2.4);
    g.save(); g.translate(960, 806); g.rotate(-0.05 + Math.sin(v * 2.4) * 0.012); g.scale(sc, sc);
    g.font = `italic 800 50px ${F_SUB}`;
    const tw = g.measureText('¡LA MISMA LUNA!').width;
    const bw = tw + 60, bh = 70, sk = 16;
    const tag = (o) => { g.beginPath(); g.moveTo(-bw / 2 + sk + o, -bh / 2 + o); g.lineTo(bw / 2 + sk + o, -bh / 2 + o); g.lineTo(bw / 2 - sk + o, bh / 2 + o); g.lineTo(-bw / 2 - sk + o, bh / 2 + o); g.closePath(); };
    tag(9); g.fillStyle = INK; g.fill();
    tag(0); g.fillStyle = AMAR; g.fill(); g.strokeStyle = INK; g.lineWidth = 6; g.lineJoin = 'round'; g.stroke();
    g.fillStyle = INK; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('¡LA MISMA LUNA!', 0, 3);
    g.restore();
  }
}

// OSD del vídeo (lo genera el magnetoscopio: limpio, encima de la imagen)

// ───────────────────────────── WebGL: la cinta ─────────────────────────────
const gl = cv.getContext('webgl', { preserveDrawingBuffer: true, antialias: false, alpha: false, premultipliedAlpha: false });
const VS = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const FSH = `
precision highp float;
uniform sampler2D uSrc, uOsd;
uniform vec2 uRes;
uniform float uFrame, uPhase, uGlitch, uBandY, uBandA, uBand2Y, uRoll, uScan;
const vec2 FR = vec2(1920., 1080.);

float h12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(h12(i), h12(i + vec2(1., 0.)), f.x), mix(h12(i + vec2(0., 1.)), h12(i + vec2(1., 1.)), f.x), f.y); }

vec3 S(vec2 p){
  vec2 uv = p / FR;
  float inside = step(0., uv.x) * step(uv.x, 1.);
  return texture2D(uSrc, clamp(uv, 0., 1.)).rgb * inside;
}
float Y(vec2 p){ return dot(S(p), vec3(.299, .587, .114)); }
float Yb(vec2 p){ return .25 * Y(p - vec2(1.6, 0.)) + .5 * Y(p) + .25 * Y(p + vec2(1.6, 0.)); }

void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / uRes * FR;
  float F = uFrame;
  // salto vertical (pérdida de sincronía en los cortes) con su franja de borrado
  float tot = FR.y + 40.;
  float q = mod(p.y + uRoll, tot);
  float vblank = step(FR.y, q);
  float line = floor(q / 2.25);

  // bandas de tracking
  float b1 = (q - uBandY) / 34.; b1 = exp(-b1 * b1);
  float b2 = (q - uBand2Y) / 90.; b2 = exp(-b2 * b2) * uGlitch;
  float band = clamp(b1 * uBandA + b2, 0., 1.);
  // conmutación de cabezas: últimas líneas desplazadas y sucias
  float hs = smoothstep(FR.y - 30., FR.y - 6., q);
  // arriba, la imagen se "dobla" un poco (flagging)
  float flag = smoothstep(26., 0., q);

  float dx = (h12(vec2(line, F)) - .5) * 1.4
           + sin(q * .016 + uPhase * 4.) * 1.5 + sin(q * .055 - uPhase * 7.) * .5
           + band * ((vn(vec2(line * .45, F * .9)) - .5) * 70. + 14.)
           + hs * (40. + 90. * hs * h12(vec2(line, F + 7.)))
           + flag * 10.
           + uGlitch * (vn(vec2(line * .06, F * 1.7)) - .5) * 110.;
  vec2 sp = vec2((p.x - dx - 960.) * 1.012 + 960., q);

  // luminancia: algo blanda, con realce (halo) y aberración cromática horizontal
  float yC = Yb(sp);
  float yR = Yb(sp + vec2(3.2, 0.));
  float yB = Yb(sp - vec2(3.2, 0.));
  float yW = .25 * (Y(sp - vec2(8., 0.)) + Y(sp - vec2(4., 0.)) + Y(sp + vec2(4., 0.)) + Y(sp + vec2(8., 0.)));
  float sharp = (yC - yW) * .55;

  // crominancia: ancho de banda mínimo → el color se corre hacia la derecha
  vec2 iq = vec2(0.); float ws = 0.;
  for (int k = 0; k < 10; k++) {
    float fk = float(k);
    float w = exp(-fk * .3);
    vec3 c = S(sp - vec2(4. + fk * 4.4, 0.));
    iq += vec2(dot(c, vec3(.596, -.274, -.322)), dot(c, vec3(.211, -.523, .312))) * w;
    ws += w;
  }
  iq /= ws;

  // ruido
  float grain = (h12(p + vec2(F * 17.31, F * 5.13)) - .5) * .6 + (vn(vec2(p.x / 5., q * .7 + F * 23.)) - .5) * .8;
  float lineN = h12(vec2(line * 1.7, F + 3.)) - .5;
  vec2 cn = vec2(vn(vec2(sp.x / 30., line * .9 + F * 11.)), vn(vec2(sp.x / 30. + 51., line * .9 + F * 11.))) - .5;
  float st = vn(vec2(sp.x * .045 + h12(vec2(line, 9.)) * 200., line * 3.1 + F * 19.));
  float streak = smoothstep(.6, .85, st) * band;
  float dl = h12(vec2(line * .713 + F * 1.37, F * .917 + 3.1));
  float dlen = 24. + 150. * h12(vec2(line, F + 11.));
  float drop = step(.9972, dl) * smoothstep(dlen, dlen * .4, abs(sp.x - 1920. * h12(vec2(F, line + 4.))));

  float yy = yC + sharp + grain * .055 + lineN * .02;
  yy = mix(yy, yy * .78 + .12, band * .7);
  yy += streak * .8 + drop * .65;
  yy += hs * ((h12(p + F) - .5) * .35 + smoothstep(.7, .95, vn(vec2(sp.x * .03, line * 2. + F * 7.))) * .3);
  iq += cn * .1 * (1. + band * 2.);
  iq *= 1. - clamp(streak + band * .35 + drop, 0., 1.) * .8;
  iq *= 1. - uGlitch * .55;

  float d = yy - yC;
  vec3 col = vec3(yR + d + .956 * iq.x + .621 * iq.y,
                  yy - .272 * iq.x - .647 * iq.y,
                  yB + d - 1.106 * iq.x + 1.703 * iq.y);
  // respuesta de la cinta: negros levantados, blancos comprimidos, tinte cálido
  col = col * .92 + .045;
  col *= vec3(1.0, .985, .955);
  col = mix(col, vec3(0.03) + step(.5, fract(p.x / 30.)) * step(abs(q - FR.y - 20.), 2.) * .45, vblank);

  // OSD del aparato (no pasa por la cinta: limpio, sólo un poco blando)
  vec2 ou = p / FR;
  vec2 o1 = vec2(1.5 / FR.x, 0.);
  vec4 o = texture2D(uOsd, ou) * .5 + texture2D(uOsd, ou + o1) * .25 + texture2D(uOsd, ou - o1) * .25;
  col = col * (1. - o.a) + o.rgb;

  // líneas de barrido y viñeta
  float fy = fract((gl_FragCoord.y - .5) / uScan);
  float s = sin(3.14159265 * (fy + .5 / uScan));
  col *= .74 + .34 * s * s;
  vec2 vc = (p / FR - .5) * vec2(.95, 1.0);
  col *= 1. - dot(vc, vc) * .55;
  gl_FragColor = vec4(clamp(col, 0., 1.), 1.);
}`;
function sh(type, s) {
  const o = gl.createShader(type); gl.shaderSource(o, s); gl.compileShader(o);
  if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o));
  return o;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FSH));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const aP = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(aP);
gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
const U = {};
for (const n of ['uSrc', 'uOsd', 'uRes', 'uFrame', 'uPhase', 'uGlitch', 'uBandY', 'uBandA', 'uBand2Y', 'uRoll', 'uScan']) U[n] = gl.getUniformLocation(prog, n);
function mkTex(unit) {
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
const texSrc = mkTex(0), texOsd = mkTex(1);
gl.uniform1i(U.uSrc, 0); gl.uniform1i(U.uOsd, 1);
function uploadOSD() {
  drawOSD();
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texOsd);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, osd);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
}

// ───────────────────────────── fotograma ─────────────────────────────
function cutGlitch(tq) {
  let best = { g: 0, d: 1e9 };
  for (const tc of [T_CG, T_TIT]) {
    const d = tq - tc;
    if (Math.abs(d) < 0.5) {
      const gv = Math.exp(-Math.pow(d / 0.15, 2));
      if (gv > best.g) best = { g: gv, d };
    }
  }
  return best;
}

let lastSpin = null;
function frame(tIn) {
  let t = ((tIn % DUR) + DUR) % DUR;
  if (t > DUR - 1e-6) t = 0;
  const F = Math.floor(t * FPS + 1e-4) % NF;
  const tq = F / FPS;

  // 1) la imagen grabada
  sx.setTransform(K, 0, 0, K, 0, 0);
  sx.globalAlpha = 1; sx.globalCompositeOperation = 'source-over';
  const enTitulo = t >= T_TIT || t < T_CG;
  if (enTitulo) drawTitle(sx, (t - T_TIT + DUR) % DUR);
  else {
    const spin = -(t / DUR) * TAU * 2;   // dos vueltas de la Tierra por bucle
    if (spin !== lastSpin) { renderEarth(spin); lastSpin = spin; }
    drawCG(sx, t - T_CG, t);
  }
  sx.setTransform(K, 0, 0, K, 0, 0);
  drawDateStamp(sx, t);

  // 2) subir la imagen
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texSrc);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);

  // 3) la cinta
  const gch = cutGlitch(tq);
  // banda de tracking: cruza la cartela de abajo arriba; durante la explicación se queda abajo, temblando
  let bandY, bandA;
  if (t < T_CG) { bandY = lerp(H + 140, -140, t / T_CG); bandA = 0.6; }
  else if (t < T_TIT) { bandY = 1040 + 9 * Math.sin((t - T_CG) * 2.1) + 5 * Math.sin((t - T_CG) * 7.3); bandA = 0.42; }
  else { bandY = H + 140; bandA = 0.6; }
  const band2Y = gch.g > 0 ? 540 + gch.d * 3000 : -9999;
  const jit = hash2(F, 77) < 0.18 ? 1.5 : 0;
  const roll = (Math.abs(gch.d) < 0.09 ? 180 * (1 - Math.abs(gch.d) / 0.09) : 0) + jit;
  gl.viewport(0, 0, cv.width, cv.height);
  gl.uniform2f(U.uRes, cv.width, cv.height);
  gl.uniform1f(U.uFrame, F);
  gl.uniform1f(U.uPhase, (t / DUR) * TAU);
  gl.uniform1f(U.uGlitch, gch.g);
  gl.uniform1f(U.uBandY, bandY);
  gl.uniform1f(U.uBandA, bandA);
  gl.uniform1f(U.uBand2Y, band2Y);
  gl.uniform1f(U.uRoll, roll);
  gl.uniform1f(U.uScan, Math.max(2, Math.round(cv.height / 360)));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

window.__frame = (t) => { frame(t); };

async function init() {

  try {
    await Promise.all([
      document.fonts.load(`150px ${F_TIT}`, 'LA LUNA AL REVÉS HEMISFERIO NORTE SUR DC1'),
      document.fonts.load(`92px ${F_OSD}`, 'PLAY SP 0123456789:.OCT'),
      document.fonts.load(`italic 800 60px ${F_SUB}`, 'Lo que no te explicaron en clase PARECE UNA EPISODIO ¡LA MISMA LUNA!'),
    ]);
    await document.fonts.ready;
  } catch (e) { /* si las fuentes fallan, se dibuja con las de reserva */ }
  buildMoon();
  buildEarthMap();
  uploadOSD();
  frame(0);
  window.__listo = true;
  if (!CAPTURA) {
    // la cinta es vídeo a 30 fotogramas: sólo se redibuja cuando cambia el fotograma
    const start = performance.now();
    let lastF = -1;
    const loop = (now) => {
      const t = ((now - start) / 1000) % DUR;
      const f = Math.floor(t * FPS);
      if (f !== lastF) { lastF = f; frame(t); }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
    window.addEventListener('resize', () => { layout(); lastF = -1; });
  }
}
init();
})();
</script>
</body>
</html>
