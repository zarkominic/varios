<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Luna al revés · metal líquido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  html, body { margin: 0; height: 100%; background: #05070b; overflow: hidden; }
  #escena { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #070a10; overflow: hidden; }
  #escena canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div id="escena"><canvas id="gl"></canvas><canvas id="txt"></canvas></div>
<script>
(() => {
'use strict';
const DUR = 10;                       // duración del bucle (s)
const W = 1080, H = 1920;             // marco de diseño
const CX = 540, CY = 920;             // centro del objeto (px de diseño, desde arriba)
const U = 400;                        // px de diseño por unidad de mundo
const CAPTURA = location.search.includes('captura');
const TAU = Math.PI * 2;

// ---------- utilidades de tiempo ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const mix = (a, b, x) => a + (b - a) * x;
const eInOut3 = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eIn3 = (x) => x * x * x;
const smooth = (x) => x * x * (3 - 2 * x);
const eOut3 = (x) => 1 - Math.pow(1 - x, 3);
const eInOut5 = (x) => (x < 0.5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2);
// salida con rebote viscoso (sobrepasa un poco y se asienta exactamente en 1)
const eOutBack = (x, c = 1.25) => 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2);
const eInOutBack = (x, c = 0.9) => {
  const c2 = c * 1.525;
  return x < 0.5
    ? (Math.pow(2 * x, 2) * ((c2 + 1) * 2 * x - c2)) / 2
    : (Math.pow(2 * x - 2, 2) * ((c2 + 1) * (x * 2 - 2) + c2) + 2) / 2;
};
// campana suave centrada en c (tiempo envuelto en el bucle)
const campana = (t, c, w) => {
  const d = ((t - c + DUR * 1.5) % DUR) - DUR / 2;
  const x = clamp(Math.abs(d) / w);
  return x >= 1 ? 0 : 0.5 + 0.5 * Math.cos(Math.PI * x);
};
const dRot = (f, t, h = 1 / 240) => (f(t + h) - f(t - h)) / (2 * h);

// ---------- guion de la animación ----------
// 0.0-1.5 átomo · 1.5-2.8 fusión · 2.7-3.7 luna (D) · 4.4-7.0 giro horario D → ◡ → C · 7.5-8.4 esfera · 8.3-9.4 átomo
const T_FUS = [1.5, 2.85], T_LUNA = [2.65, 3.75], T_G1 = [4.35, 5.25], T_G2 = [5.75, 6.75];
const T_VUELTA = [7.55, 8.45], T_EXP = [8.3, 9.45];

const radioOrbital = (t) => {
  if (t < T_FUS[0]) return 1;
  if (t < T_FUS[1]) return 1 - eIn3(lin(t, ...T_FUS));
  if (t < T_EXP[0]) return 0;
  return eOutBack(lin(t, ...T_EXP), 1.15);
};
const giroExtra = (t) => Math.PI * eIn3(lin(t, ...T_FUS)) + Math.PI * eOut3(lin(t, ...T_EXP));
const crecimiento = (t) => {           // 0 = núcleo de nucleones, 1 = gota única
  const a = eInOut3(lin(t, 2.0, 3.0));
  const b = eInOut3(lin(t, 8.25, 9.2));
  return a * (1 - b);
};
const luna = (t) => eInOut3(lin(t, ...T_LUNA)) * (1 - eInOut3(lin(t, ...T_VUELTA)));
// giro en el plano de la pantalla, como la aguja de un reloj (sentido horario)
const giro = (t) => -(Math.PI / 2) * (eInOutBack(lin(t, ...T_G1), 0.7) + eInOutBack(lin(t, ...T_G2), 0.7));
const kElectron = (t) => {
  const f = lin(t, T_FUS[0] + 0.35, T_FUS[1]);
  const e = lin(t, T_EXP[0], T_EXP[1]);
  if (t < T_EXP[0]) return mix(0.045, 0.32, f * f);
  return mix(0.34, 0.045, eOut3(e));
};
const ondulacion = (t) =>
  0.0035 + 0.016 * campana(t, 2.95, 0.75) + 0.010 * campana(t, 3.55, 0.6) +
  0.007 * campana(t, 5.05, 0.5) + 0.007 * campana(t, 6.5, 0.5) +
  0.012 * campana(t, 8.05, 0.6) + 0.012 * campana(t, 9.0, 0.7);

// ---------- geometría del átomo ----------
const R_ORB = 0.97, INCL = 0.33, R_E = 0.096, R_NUC = 0.158, R_GOTA = 0.78;
const orbitas = [90, 28, 152].map((g) => {
  const b = (g * Math.PI) / 180, se = INCL, ce = Math.sqrt(1 - se * se);
  return { u: [Math.cos(b), Math.sin(b), 0], v: [-Math.sin(b) * se, Math.cos(b) * se, ce] };
});
const fases = [0.3, 0.3 + TAU / 3, 0.3 + (2 * TAU) / 3];
// nucleones: 7 direcciones repartidas (espiral de Fibonacci)
const nucleones = [];
for (let i = 0; i < 7; i++) {
  const y = 1 - (2 * (i + 0.5)) / 7, r = Math.sqrt(1 - y * y), a = i * 2.39996;
  nucleones.push([Math.cos(a) * r, y, Math.sin(a) * r]);
}

// ---------- WebGL ----------
const cgl = document.getElementById('gl');
const ctxt = document.getElementById('txt');
const gl = cgl.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, alpha: false, premultipliedAlpha: false });
const g2 = ctxt.getContext('2d');

const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;

const FS = `#version 300 es
precision highp float;
out vec4 o;
uniform vec2 uRes;      // px del lienzo
uniform float uS;       // px de lienzo por px de diseño
uniform vec3 uN[7]; uniform float uNr, uKn;
uniform vec3 uE[3]; uniform float uEr, uKe;
uniform float uM, uCut, uRho, uTwist, uWob, uRip, uBob;
uniform vec3 uWph;
uniform vec3 uOA[3], uOB[3];
uniform float uOth[3];
uniform float uOr, uOal;

const float PI = 3.14159265, TAU = 6.2831853;

vec3 lin(vec3 c){ return pow(c, vec3(2.2)); }
float smin(float a, float b, float k){ float h = max(k - abs(a - b), 0.) / k; return min(a, b) - h * h * k * 0.25; }
float smax(float a, float b, float k){ return -smin(-a, -b, k); }
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }

float luna(vec3 p){
  // giro en el plano: las puntas se retrasan un poco (inercia del líquido)
  float a = uRho - uTwist * dot(p.xy, p.xy);
  vec3 q = p; q.xy = rot(-a) * q.xy;
  float dA = (length(q * vec3(1., 1., 1.15)) - 0.92) * 0.88;
  float dB = length(q.xy - vec2(uCut, 0.)) - 0.775;
  return smax(dA, -dB, 0.15);
}

float map(vec3 p){
  float d = 1e3;
  for (int i = 0; i < 7; i++) d = smin(d, length(p - uN[i]) - uNr, uKn);
  for (int i = 0; i < 3; i++) d = smin(d, length(p - uE[i]) - uEr, uKe);
  if (uM > 0.0005) d = mix(d, luna(p), uM);
  d += uWob * sin(3.3 * p.x + uWph.x) * sin(2.9 * p.y + uWph.y) * sin(2.6 * p.z + uWph.z);
  // rizado fino: la superficie nunca está quieta, los reflejos ondulan
  d += uRip * (sin(9.1 * p.x + 5.3 * p.z + uWph.y) * sin(8.3 * p.y - 6.1 * p.z + uWph.z) +
               0.6 * sin(13.7 * p.y + 7.9 * p.x - uWph.x) * sin(11.3 * p.z + uWph.y));
  return d;
}

vec3 normal(vec3 p){
  const vec2 k = vec2(1., -1.); const float h = 0.0012;
  return normalize(k.xyy * map(p + k.xyy * h) + k.yyx * map(p + k.yyx * h) +
                   k.yxy * map(p + k.yxy * h) + k.xxx * map(p + k.xxx * h));
}

float oclusion(vec3 p, vec3 n){
  float o = 0., s = 1.;
  for (int i = 1; i <= 4; i++){ float h = 0.035 * float(i); o += (h - map(p + n * h)) * s; s *= 0.65; }
  return clamp(1. - 2.2 * o, 0., 1.);
}

// caja de luz suave en coordenadas (acimut, elevación)
float caja(vec2 ae, vec2 c, vec2 m, float s){
  float da = mod(ae.x - c.x + PI, TAU) - PI;
  vec2 d = abs(vec2(da, ae.y - c.y)) - m;
  return (1. - smoothstep(-s, s, d.x)) * (1. - smoothstep(-s, s, d.y));
}

// estudio procedural que se refleja en el metal
vec3 entorno(vec3 r){
  vec2 ae = vec2(atan(r.x, r.z), asin(clamp(r.y, -1., 1.)));
  float y = r.y;
  // cielo de estudio: frío a la izquierda, cálido a la derecha
  vec3 tinte = mix(lin(vec3(0.70, 0.80, 1.00)), lin(vec3(1.00, 0.88, 0.76)), smoothstep(-0.9, 0.9, r.x));
  vec3 cielo = tinte * mix(0.16, 0.62, smoothstep(0.0, 0.95, y));
  // suelo: banda casi negra bajo el horizonte y rebote cálido más abajo
  vec3 suelo = mix(lin(vec3(0.016, 0.018, 0.026)), lin(vec3(0.17, 0.15, 0.14)), smoothstep(-0.18, -0.85, y));
  vec3 c = mix(suelo, cielo, smoothstep(-0.03, 0.035, y));
  c += lin(vec3(0.95, 0.96, 1.0)) * exp(-pow((y - 0.012) * 26., 2.)) * 0.9;        // línea de horizonte
  c += lin(vec3(1.00, 0.86, 0.70)) * 5.0 * caja(ae, vec2(0.78, 0.60), vec2(0.34, 0.19), 0.06);  // principal cálida
  c += lin(vec3(0.96, 0.97, 1.00)) * 3.2 * caja(ae, vec2(0.0, 1.30), vec2(1.6, 0.07), 0.04);    // tira cenital
  c += lin(vec3(0.58, 0.74, 1.00)) * 3.4 * caja(ae, vec2(-1.30, 0.14), vec2(0.07, 0.52), 0.05); // relleno frío
  c += lin(vec3(1.00, 0.80, 0.58)) * 3.0 * caja(ae, vec2(2.45, 0.22), vec2(0.10, 0.50), 0.06);  // contraluz cálido
  c += lin(vec3(0.62, 0.78, 1.00)) * 2.6 * caja(ae, vec2(-2.50, 0.28), vec2(0.10, 0.48), 0.06); // contraluz frío
  c += lin(vec3(1.00, 0.97, 0.92)) * 2.6 * caja(ae, vec2(0.36, 0.05), vec2(0.022, 0.42), 0.02); // tiras finas frontales
  c += lin(vec3(0.85, 0.92, 1.00)) * 1.8 * caja(ae, vec2(-0.42, 0.18), vec2(0.018, 0.36), 0.02);
  c *= 1. - 0.6 * caja(ae, vec2(-0.75, 0.48), vec2(0.18, 0.30), 0.12);                          // bandera negra
  return c;
}

vec3 fondo(vec2 f){                       // f en px de diseño (origen abajo)
  vec2 uv = f / vec2(1080., 1920.);
  vec3 c = mix(lin(vec3(0.016, 0.020, 0.030)), lin(vec3(0.043, 0.054, 0.080)), smoothstep(0.05, 1.0, uv.y));
  float d = length(f - vec2(540., 1000.)) / 620.;
  c += lin(vec3(0.115, 0.135, 0.185)) * exp(-d * d * 2.6);
  c *= 1. - 0.35 * smoothstep(0.55, 1.25, length((uv - 0.5) * vec2(1.25, 1.0)));
  return c;
}

vec3 sombrear(vec3 p, vec3 rd){
  vec3 n = normal(p);
  float ao = oclusion(p, n);
  vec3 r = reflect(rd, n);
  float nv = max(dot(n, -rd), 0.);
  float fr = pow(1. - nv, 5.);
  vec3 F0 = vec3(0.80, 0.82, 0.86);
  vec3 F = F0 + (1. - F0) * fr;
  vec3 c = entorno(r) * F;
  // refracción sutil con dispersión: el líquido deja ver el estudio de detrás, curvado
  vec3 tr = vec3(entorno(refract(rd, n, 0.70)).r, entorno(refract(rd, n, 0.725)).g, entorno(refract(rd, n, 0.75)).b);
  c = mix(c, tr * lin(vec3(0.70, 0.76, 0.86)), 0.12 * (1. - fr));
  // brillos especulares nítidos
  vec3 L1 = normalize(vec3(0.55, 0.62, 0.56)), L2 = normalize(vec3(-0.75, 0.25, 0.35));
  c += lin(vec3(1.0, 0.93, 0.84)) * pow(max(dot(r, L1), 0.), 260.) * 5.0;
  c += lin(vec3(0.78, 0.88, 1.0)) * pow(max(dot(r, L2), 0.), 120.) * 1.6;
  return c * mix(0.25, 1., ao);
}

float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

void main(){
  vec2 f = gl_FragCoord.xy / uS;                     // px de diseño
  vec2 w = (f - vec2(540., 1000.)) / 400.;            // mundo
  w.y -= uBob;
  float pxw = 1. / (400. * uS);                       // tamaño de un px de lienzo en el mundo
  vec3 col = fondo(f);

  // luz cenicienta: el resto del disco lunar, apenas insinuado
  float rr = length(w);
  if (uM > 0.001){
    float ring = 1. - smoothstep(0.6, 1.8, abs(rr - 0.925) / (pxw * uS));
    col += lin(vec3(0.42, 0.47, 0.58)) * ring * 0.16 * uM;
    col += lin(vec3(0.07, 0.08, 0.11)) * (1. - smoothstep(0.90, 0.93, rr)) * uM;
  }

  // trazado del líquido (cámara ortográfica)
  float BR = 1.3, cov = 0., zHit = -10.;
  vec3 obj = vec3(0.);
  if (rr < BR){
    float z0 = sqrt(BR * BR - rr * rr);
    vec3 ro = vec3(w, z0), rd = vec3(0., 0., -1.);
    float t = 0., dmin = 1e3, tmin = 0.;
    bool hit = false;
    for (int i = 0; i < 110; i++){
      float d = map(ro + rd * t);
      if (d < dmin){ dmin = d; tmin = t; }
      if (d < 0.0006){ hit = true; break; }
      t += d * 0.82;
      if (t > 2. * z0) break;
    }
    if (hit){ cov = 1.; obj = sombrear(ro + rd * t, rd); zHit = z0 - t; }
    else if (dmin < 1.6 * pxw){
      cov = 1. - smoothstep(0., 1.6 * pxw, dmin);
      obj = sombrear(ro + rd * tmin, rd); zHit = z0 - tmin;
    }
  }
  col = mix(col, obj, cov);

  // órbitas: elipses finísimas con estela tras cada electrón
  if (uOal > 0.004 && uOr > 0.04){
    for (int i = 0; i < 3; i++){
      vec3 A = uOA[i] * uOr, B = uOB[i] * uOr;
      mat2 Mi = inverse(mat2(A.xy, B.xy));
      vec2 q = Mi * w; float lq = length(q);
      vec2 g = transpose(Mi) * (q / max(lq, 1e-4));
      float dpx = abs(lq - 1.) / length(g) * 400.;      // distancia en px de diseño
      float ang = atan(q.y, q.x);
      float zl = (A * cos(ang) + B * sin(ang)).z;
      float vis = (cov > 0.5 && zl < zHit) ? 0. : 1.;
      float tras = mod(uOth[i] - ang, TAU);
      float estela = exp(-tras * 1.5);
      float nucleo = 1. - smoothstep(0.55, 1.7, dpx);
      float halo = exp(-dpx / 7.) * 0.22;
      col += lin(vec3(0.74, 0.82, 0.96)) * (nucleo + halo * estela) * (0.075 + 0.95 * estela) * uOal * vis;
    }
  }

  // tono, gamma y grano
  col *= 1.08;
  col = clamp((col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14), 0., 1.);
  col = pow(col, vec3(1. / 2.2));
  col += (hash(gl_FragCoord.xy) - 0.5) / 255.;
  o = vec4(col, 1.);
}`;

function compilar(tipo, src) {
  const s = gl.createShader(tipo);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compilar(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compilar(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const aP = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(aP);
gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
const loc = {};
for (const n of ['uRes', 'uS', 'uN', 'uNr', 'uKn', 'uE', 'uEr', 'uKe', 'uM', 'uCut', 'uRip', 'uRho', 'uTwist', 'uWob', 'uBob', 'uWph', 'uOA', 'uOB', 'uOth', 'uOr', 'uOal'])
  loc[n] = gl.getUniformLocation(prog, n);
gl.uniform3fv(loc.uOA, new Float32Array(orbitas.flatMap((o) => o.u.map((x) => x * R_ORB))));
gl.uniform3fv(loc.uOB, new Float32Array(orbitas.flatMap((o) => o.v.map((x) => x * R_ORB))));

// ---------- tamaño y letterbox 9:16 ----------
const escena = document.getElementById('escena');
let escalaTxt = 1;
let presupuesto = 460000;              // px de trazado de rayos en modo normal (se rebaja si va lento)
function ajustar() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const ancho = Math.min(vw, (vh * 9) / 16), alto = (ancho * 16) / 9;
  escena.style.width = ancho + 'px';
  escena.style.height = alto + 'px';
  const dpr = CAPTURA ? 1 : Math.min(window.devicePixelRatio || 1, 2);
  // texto a resolución completa; el trazado de rayos, rebajado en modo normal
  ctxt.width = Math.round(ancho * dpr);
  ctxt.height = Math.round(alto * dpr);
  escalaTxt = ctxt.width / W;
  let f = 1;
  if (!CAPTURA) f = Math.min(1, Math.sqrt(presupuesto / (ancho * dpr * alto * dpr)));
  cgl.width = Math.round(ancho * dpr * f);
  cgl.height = Math.round(alto * dpr * f);
  gl.viewport(0, 0, cgl.width, cgl.height);
}
ajustar();

// ---------- rótulos ----------
const SERIF = '"Instrument Serif", "Times New Roman", serif';
const SANS = 'Inter, "Helvetica Neue", Arial, sans-serif';
function texto(str, x, y, fuente, color, esp = 0, alpha = 1) {
  g2.font = fuente;
  g2.letterSpacing = esp + 'px';
  g2.fillStyle = color;
  g2.globalAlpha = alpha;
  // el espaciado añade un hueco tras la última letra: se compensa al centrar
  g2.textAlign = 'center';
  g2.fillText(str, x + esp / 2, y);
  g2.globalAlpha = 1;
}
const ETIQUETAS = [
  { txt: 'hemisferio norte', c: 4.05 },
  { txt: 'ecuador', c: 5.5 },
  { txt: 'hemisferio sur', c: 7.0 },
];
function rotulos(t) {
  g2.setTransform(1, 0, 0, 1, 0, 0);
  g2.clearRect(0, 0, ctxt.width, ctxt.height);
  g2.setTransform(escalaTxt, 0, 0, escalaTxt, 0, 0);
  g2.textBaseline = 'alphabetic';
  // cabecera
  texto('LO QUE NO TE EXPLICARON EN CLASE', CX, 338, `600 23px ${SANS}`, '#b9a27c', 6.5, 0.9);
  g2.font = `400 98px ${SERIF}`; g2.letterSpacing = '0px';
  const a = 'La Luna ', b = 'al revés';
  const wa = g2.measureText(a).width;
  g2.font = `italic 400 98px ${SERIF}`;
  const wb = g2.measureText(b).width;
  const x0 = CX - (wa + wb) / 2;
  g2.textAlign = 'left'; g2.fillStyle = '#ece8e0';
  g2.font = `400 98px ${SERIF}`; g2.fillText(a, x0, 438);
  g2.font = `italic 400 98px ${SERIF}`; g2.fillText(b, x0 + wa, 438);

  // pie: desde dónde se mira la Luna
  const vis = lin(t, 3.25, 3.85) * (1 - lin(t, 7.55, 8.05));
  if (vis > 0) {
    texto('LUNA CRECIENTE VISTA DESDE EL', CX, 1418, `600 21px ${SANS}`, '#8f9bb0', 6, 0.95 * vis);
    const lim = [0, 4.8, 6.25, 99];
    for (let i = 0; i < 3; i++) {
      const ent = i === 0 ? 1 : eOut3(lin(t, lim[i] - 0.02, lim[i] + 0.4));
      const sal = i === 2 ? 0 : eIn3(lin(t, lim[i + 1] - 0.34, lim[i + 1] - 0.02));
      const k = ent * (1 - sal);
      if (k <= 0.001) continue;
      const dy = (1 - ent) * 22 - sal * 16;
      texto(ETIQUETAS[i].txt, CX, 1494 + dy, `italic 400 66px ${SERIF}`, '#ece8e0', 0.5, k * vis);
    }
  }
}

// ---------- fotograma ----------
const nArr = new Float32Array(21), eArr = new Float32Array(9);
function dibujar(t) {
  t = ((t % DUR) + DUR) % DUR;
  const ph = TAU * t / DUR;
  // núcleo
  const cre = crecimiento(t);
  const rn = mix(R_NUC, R_GOTA, cre);
  const sep = 0.125 * (1 - cre);
  const ca = Math.cos(ph), sa = Math.sin(ph);
  for (let i = 0; i < 7; i++) {
    let [x, y, z] = nucleones[i];
    const resp = 1 + 0.07 * Math.sin(3 * ph + i * 1.7);
    // giro lento del núcleo alrededor de un eje inclinado (una vuelta por bucle)
    const x2 = x * ca + z * sa, z2 = -x * sa + z * ca;
    const y2 = y * 0.94 + z2 * 0.34, z3 = -y * 0.34 + z2 * 0.94;
    nArr[i * 3] = x2 * sep * resp; nArr[i * 3 + 1] = y2 * sep * resp; nArr[i * 3 + 2] = z3 * sep * resp;
  }
  // electrones
  const ro = radioOrbital(t);
  const th = [];
  for (let i = 0; i < 3; i++) {
    const a = fases[i] + 3 * ph + giroExtra(t);
    th.push(a);
    const { u, v } = orbitas[i];
    const c = Math.cos(a) * R_ORB * ro, s = Math.sin(a) * R_ORB * ro;
    eArr[i * 3] = u[0] * c + v[0] * s; eArr[i * 3 + 1] = u[1] * c + v[1] * s; eArr[i * 3 + 2] = u[2] * c + v[2] * s;
  }
  gl.uniform2f(loc.uRes, cgl.width, cgl.height);
  gl.uniform1f(loc.uS, cgl.width / W);
  gl.uniform3fv(loc.uN, nArr);
  gl.uniform1f(loc.uNr, rn);
  gl.uniform1f(loc.uKn, mix(0.11, 0.2, cre));
  gl.uniform3fv(loc.uE, eArr);
  gl.uniform1f(loc.uEr, R_E);
  gl.uniform1f(loc.uKe, kElectron(t));
  const m = luna(t);
  gl.uniform1f(loc.uM, smooth(clamp(m / 0.45)));
  // el hueco entra deslizándose desde fuera, como la sombra de una fase
  gl.uniform1f(loc.uCut, mix(-1.9, -0.465, smooth(lin(m, 0.08, 1))));
  gl.uniform1f(loc.uRho, giro(t));
  gl.uniform1f(loc.uTwist, 0.055 * dRot(giro, t));
  gl.uniform1f(loc.uWob, ondulacion(t));
  gl.uniform1f(loc.uRip, 0.0016 + 0.25 * (ondulacion(t) - 0.0035));
  gl.uniform3f(loc.uWph, 2 * ph + 0.4, -3 * ph + 1.3, 2 * ph + 2.1);
  gl.uniform1f(loc.uBob, 0.012 * Math.sin(2 * ph));
  gl.uniform1fv(loc.uOth, new Float32Array(th));
  gl.uniform1f(loc.uOr, ro);
  gl.uniform1f(loc.uOal, clamp(ro * 1.6 - 0.35));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  rotulos(t);
}
const pixel = new Uint8Array(4);
window.__frame = async (t) => {
  dibujar(t);
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);   // espera a que la GPU termine
};

// ---------- arranque ----------
async function fuentes() {
  const css = document.createElement('link');
  css.rel = 'stylesheet';
  css.href = 'https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@600&display=swap';
  const cargada = new Promise((r) => { css.onload = r; css.onerror = r; setTimeout(r, 8000); });
  document.head.appendChild(css);
  await cargada;
  const muestra = 'La Luna al revés LO QUE NO TE EXPLICARON hemisferio norte sur ecuador';
  await Promise.race([
    Promise.all([
      document.fonts.load(`400 98px "Instrument Serif"`, muestra),
      document.fonts.load(`italic 400 98px "Instrument Serif"`, muestra),
      document.fonts.load(`600 23px Inter`, muestra),
    ]),
    new Promise((r) => setTimeout(r, 10000)),
  ]);
}
fuentes().catch(() => {}).then(() => {
  dibujar(0);
  window.__listo = true;
  if (!CAPTURA) {
    window.addEventListener('resize', ajustar);
    const inicio = performance.now();
    let previo = 0, suma = 0, n = 0;
    const bucle = (now) => {
      dibujar(((now - inicio) / 1000) % DUR);
      // si el móvil no llega, se baja la resolución interna del trazado (el texto sigue nítido)
      if (previo) { suma += now - previo; n++; }
      previo = now;
      if (n === 45) {
        if (suma / n > 24 && presupuesto > 150000) { presupuesto *= 0.7; ajustar(); }
        suma = 0; n = 0;
      }
      requestAnimationFrame(bucle);
    };
    requestAnimationFrame(bucle);
  }
});
})();
