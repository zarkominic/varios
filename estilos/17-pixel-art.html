<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Luna al revés · píxel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #06071a; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script>
(() => {
'use strict';

// ─────────────────────────────────────────────────────────────────────────────
//  Escena de 180×320 píxeles reales, escalada ×6 (1080×1920) sin suavizado.
//  Todo se dibuja en un búfer de 32 bits con una paleta cerrada y tramado Bayer.
// ─────────────────────────────────────────────────────────────────────────────
const W = 180, H = 320;
const DUR = 10;            // duración del bucle (s)
const OFF = 3.2;           // desfase: t = 0 cae en plena pausa del norte
const MX = 90, MY = 130, MR = 26;   // Luna: centro y radio
const TAU = Math.PI * 2;
const captura = location.search.includes('captura');

const hex = (h) => { const n = parseInt(h.slice(1), 16); return (0xff000000 | ((n & 255) << 16) | (n & 0xff00) | (n >> 16)) >>> 0; };
const pal = (a) => a.map(hex);

// ── Paleta ───────────────────────────────────────────────────────────────────
const SKY = pal(['#06071a', '#0a0d24', '#0e1330', '#13193c', '#182048', '#1e2855', '#253162', '#2d3b6d', '#374678', '#425182', '#4f5d8d', '#5e6a97']);
const MOON = pal(['#7d6a62', '#b9996f', '#dcc18a', '#f1dfae', '#fff7df']);
const EARTH = pal(['#1c2349', '#252e5a', '#2f3968', '#3d4879']);
const STAR = pal(['#3c4a7e', '#5f6ea3', '#9fb2e0', '#dbe6ff', '#ffffff']);
const WARM = pal(['#7a6a7a', '#c9b08c', '#ffe6b8']);
const CLOUD = pal(['#222c5a', '#2c3868', '#3a4777', '#56628f', '#7a85ad']);
const FARC = pal(['#161d42', '#1d2650', '#28336a', '#4a5590', '#7781b4', '#a9b2da']);
const MIST = pal(['#33406f', '#425083']);
const MIDC = pal(['#0f1431', '#141a3b', '#232d5c', '#34427a']);
const FGC = pal(['#070818', '#0a0c20', '#0d1028', '#1c2550', '#33427a', '#5a6aa3']);
const OBS = pal(['#05060f', '#8e97c8', '#c94558', '#8a2c45', '#ff7d6e']);
const TITLE = pal(['#fffbe9', '#ffeaa8', '#ffd36a', '#f6a94f', '#e07b45']);
const TBACK = pal(['#d9ccf7', '#ae9fe0', '#8676c6', '#6656a8', '#4b3d8c']);
const INK = hex('#05060f'), SHADOW = hex('#2a1f55');
const UI = pal(['#05060f', '#0b0e24', '#131a3c', '#1d2650', '#9a8063', '#e4cf96', '#fff6dc', '#ffcf5a', '#8fb8ff', '#3a4a86']);
const ATOM = pal(['#ff7a5c', '#ffcf5a', '#fff3d0', '#2c4380', '#e8f4ff', '#7fa6f0', '#c94558']);

// ── Utilidades ───────────────────────────────────────────────────────────────
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(ix, iy) { let h = (Math.imul(ix | 0, 374761393) + Math.imul(iy | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
// ruido de valor 2D, opcionalmente periódico en x (periodo en celdas)
function vnoise(x, y, px) {
  const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  let a = x0, b = x0 + 1;
  if (px) { a = ((a % px) + px) % px; b = ((b % px) + px) % px; }
  const v00 = hash2(a, y0), v10 = hash2(b, y0), v01 = hash2(a, y0 + 1), v11 = hash2(b, y0 + 1);
  const top = v00 + (v10 - v00) * sx, bot = v01 + (v11 - v01) * sx;
  return top + (bot - top) * sy;
}
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const b4 = (x, y) => (B4[((y & 3) << 2) | (x & 3)] + 0.5) / 16;
const B2 = [0, 2, 3, 1];
const b2 = (x, y) => (B2[((y & 1) << 1) | (x & 1)] + 0.5) / 4;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = (a, b, v) => { const p = clamp((v - a) / (b - a), 0, 1); return p * p * (3 - 2 * p); };
const easeIO = (p) => p <= 0 ? 0 : p >= 1 ? 1 : p < 0.5 ? 4 * p * p * p : 1 - Math.pow(2 - 2 * p, 3) / 2;
const easeIOd = (p) => p <= 0 || p >= 1 ? 0 : p < 0.5 ? 12 * p * p : 3 * (2 - 2 * p) * (2 - 2 * p);
// cuantiza un nivel continuo con tramado 2×2 dentro de una rampa
const tone = (ramp, v, x, y) => { let l = Math.floor(v); if (v - l > b2(x, y)) l++; return ramp[clamp(l, 0, ramp.length - 1)]; };

// ── Búferes ──────────────────────────────────────────────────────────────────
const lienzo = document.getElementById('lienzo');
const ctx = lienzo.getContext('2d');
const bajo = document.createElement('canvas'); bajo.width = W; bajo.height = H;
const bctx = bajo.getContext('2d');
const imagen = bctx.createImageData(W, H);
const buf = new Uint32Array(imagen.data.buffer);
const pset = (x, y, c) => { if (x >= 0 && x < W && y >= 0 && y < H) buf[y * W + x] = c; };

// ── Guion del bucle ──────────────────────────────────────────────────────────
//  c ∈ [0,10):  0–1.5 giro al norte · 1.6 escribe · …5.0 giro al sur · 6.6 escribe · …10
const FL = 1.5, F_S = 5.0;
const TXT = [
  { label: 'HEMISFERIO NORTE', main: 'PARECE UNA D.', key: 11, start: FL + 0.15 },
  { label: 'HEMISFERIO SUR', main: 'PARECE UNA C.', key: 11, start: F_S + FL + 0.15 },
];
const CPS = 15, ERASE = 42;
function estado(t) {
  const c = (((t + OFF) % DUR) + DUR) % DUR;
  let th, om = 0, p = -1, sur;
  if (c < FL) { p = c / FL; th = Math.PI + Math.PI * easeIO(p); om = Math.PI * easeIOd(p) / FL; sur = 1 - smooth(0.38, 0.62, p); }
  else if (c < F_S) { th = 0; sur = 0; }
  else if (c < F_S + FL) { p = (c - F_S) / FL; th = Math.PI * easeIO(p); om = Math.PI * easeIOd(p) / FL; sur = smooth(0.38, 0.62, p); }
  else { th = Math.PI; sur = 1; }
  // texto visible
  let idx, n;
  if (c < F_S) {
    if (c < FL) { idx = 1; n = Math.max(0, TXT[1].main.length - Math.floor(c * ERASE)); }
    else { idx = 0; n = clamp(Math.floor((c - TXT[0].start) * CPS), 0, TXT[0].main.length); }
  } else {
    if (c < F_S + FL) { idx = 0; n = Math.max(0, TXT[0].main.length - Math.floor((c - F_S) * ERASE)); }
    else { idx = 1; n = clamp(Math.floor((c - TXT[1].start) * CPS), 0, TXT[1].main.length); }
  }
  const etiqueta = (p >= 0 ? (c < FL ? p < 0.5 : p >= 0.5) : c >= F_S) ? 1 : 0;
  const typing = n > 0 && n < TXT[idx].main.length && !(p >= 0);
  // giro del título (con un leve retraso respecto al cielo)
  let phi = 0;
  const q = c < F_S ? (c - 0.12) / (FL + 0.1) : (c - F_S - 0.12) / (FL + 0.1);
  if (q > 0 && q < 1) phi = TAU * easeIO(q);
  return { c, th, om, p, sur, idx, n, etiqueta, typing, phi };
}

// ── Cielo: gradiente + halo lunar + Vía Láctea (en coordenadas del cielo) ────
const SKY_ROWS = 192;
const SKY_BASE = new Float32Array(SKY_ROWS);
for (let y = 0; y < SKY_ROWS; y++) SKY_BASE[y] = 7.4 * Math.pow(y / 186, 1.55) + 0.15;
const HALO = new Float32Array(W * SKY_ROWS);
for (let y = 0; y < SKY_ROWS; y++) for (let x = 0; x < W; x++) {
  const dx = x + 0.5 - MX, dy = y + 0.5 - MY, d = Math.hypot(dx, dy), e = Math.max(0, d - MR);
  HALO[y * W + x] = 2.2 * Math.exp(-e / 8) + 1.4 * Math.exp(-e / 30);
}
const MWR = 222, MWS = MWR * 2;
const MWG = new Float32Array(MWS * MWS);
function milkyAt(fx, fy) {
  const s = (fx - 22) * 0.866 + (fy + 12) * 0.5;      // distancia a la banda
  const along = -(fx - 22) * 0.5 + (fy + 12) * 0.866;
  const n1 = vnoise(fx * 0.06 + 7, fy * 0.06 + 3), n2 = vnoise(fx * 0.15 + 1, fy * 0.15 + 9);
  const width = 24 + 8 * Math.sin(along * 0.025);
  let v = Math.exp(-(s * s) / (width * width)) * (0.45 + 0.75 * (0.65 * n1 + 0.35 * n2));
  v -= 0.55 * Math.exp(-((s - 5) * (s - 5)) / 30) * smooth(0.45, 0.7, n2);  // carril de polvo
  return Math.max(0, v);
}
for (let j = 0; j < MWS; j++) for (let i = 0; i < MWS; i++) MWG[j * MWS + i] = milkyAt(i - MWR, j - MWR);

function dibujarCielo(st) {
  const ct = Math.cos(st.th), sn = Math.sin(st.th);
  for (let y = 0; y < SKY_ROWS; y++) {
    const base = SKY_BASE[y], dy = y + 0.5 - MY;
    for (let x = 0; x < W; x++) {
      const dx = x + 0.5 - MX;
      const d = Math.sqrt(dx * dx + dy * dy) + 1e-6;
      const bias = 0.78 + 0.3 * (dx * ct + dy * sn) / d;
      let v = base + HALO[y * W + x] * bias;
      const fx = dx * ct + dy * sn, fy = -dx * sn + dy * ct;
      const gi = (fx + MWR) | 0, gj = (fy + MWR) | 0;
      if (gi >= 0 && gi < MWS && gj >= 0 && gj < MWS) v += 1.35 * MWG[gj * MWS + gi];
      let l = Math.floor(v); if (v - l > b2(x, y)) l++;
      buf[y * W + x] = SKY[l > 11 ? 11 : l];
    }
  }
}

// ── Estrellas (campo que gira alrededor de la Luna) ──────────────────────────
const stars = [];
{
  const rnd = mulberry32(20241017);
  let guard = 0;
  while (stars.length < 760 && guard++ < 60000) {
    const fx = (rnd() * 2 - 1) * 215, fy = (rnd() * 2 - 1) * 215;
    const r = Math.hypot(fx, fy);
    if (r > 215 || r < MR + 3) continue;
    const band = milkyAt(fx, fy);
    if (rnd() > 0.32 + 0.9 * band) continue;
    const q = rnd();
    const type = q < 0.66 ? 0 : q < 0.9 ? 1 : q < 0.985 ? 2 : 3;
    stars.push({ fx, fy, r, type, warm: rnd() < 0.18, k: 1 + Math.floor(rnd() * 4), ph: rnd() * TAU });
  }
  // Osa Mayor (visible en el norte, arriba a la izquierda)
  for (const [x, y, ty] of [[64, 17, 3], [66, 27, 2], [55, 30, 2], [53, 21, 2], [42, 19, 2], [31, 21, 3], [20, 27, 2]])
    stars.push({ fx: x - MX, fy: y - MY, r: Math.hypot(x - MX, y - MY), type: ty, warm: false, k: 2, ph: x, con: 1 });
  // Cruz del Sur + punteros (visibles en el sur, arriba a la derecha)
  for (const [x, y, ty] of [[143, 15, 3], [146, 36, 3], [135, 26, 2], [153, 24, 2], [149, 31, 1], [118, 38, 3], [124, 43, 2]])
    stars.push({ fx: MX - x, fy: MY - y, r: Math.hypot(x - MX, y - MY), type: ty, warm: ty === 3 && x === 118, k: 3, ph: y, con: 1 });
}
function dibujarEstrellas(st, t) {
  const ct = Math.cos(st.th), sn = Math.sin(st.th), om = st.om;
  for (const s of stars) {
    const sx = MX + s.fx * ct - s.fy * sn, sy = MY + s.fx * sn + s.fy * ct;
    const ix = Math.floor(sx), iy = Math.floor(sy);
    if (ix < -3 || ix > W + 2 || iy < -3 || iy > SKY_ROWS) continue;
    const tw = 0.5 + 0.5 * Math.sin(TAU * s.k * t / DUR + s.ph);
    // estela durante el giro
    if (om > 0.25) {
      const len = Math.min(34, s.r * om * (s.type ? 0.075 : 0.05));
      const steps = Math.floor(len);
      for (let j = steps; j >= 1; j--) {
        const a = st.th - j / s.r;
        const c2 = Math.cos(a), s2 = Math.sin(a);
        const tx = Math.floor(MX + s.fx * c2 - s.fy * s2), ty = Math.floor(MY + s.fx * s2 + s.fy * c2);
        const f = j / (steps + 1);
        const lvl = s.type === 0 ? 0 : (f < 0.35 ? s.type : f < 0.7 ? 1 : 0);
        if (ty < SKY_ROWS) pset(tx, ty, STAR[clamp(lvl, 0, 2)]);
      }
    }
    if (iy >= SKY_ROWS) continue;
    const warm = s.warm;
    switch (s.type) {
      case 0: if (tw > 0.2) pset(ix, iy, STAR[tw > 0.75 ? 1 : 0]); break;
      case 1: pset(ix, iy, warm ? WARM[tw > 0.5 ? 2 : 1] : STAR[tw > 0.6 ? 3 : 2]); break;
      case 2: {
        pset(ix, iy, warm ? WARM[2] : STAR[4]);
        if (tw > 0.45) { const g = warm ? WARM[0] : STAR[1]; pset(ix - 1, iy, g); pset(ix + 1, iy, g); pset(ix, iy - 1, g); pset(ix, iy + 1, g); }
        break;
      }
      case 3: {
        const arm = tw > 0.7 ? 2 : 1;
        pset(ix, iy, STAR[4]);
        const c1 = warm ? WARM[1] : STAR[2], c0 = warm ? WARM[0] : STAR[1];
        pset(ix - 1, iy, c1); pset(ix + 1, iy, c1); pset(ix, iy - 1, c1); pset(ix, iy + 1, c1);
        if (arm > 1) { pset(ix - 2, iy, c0); pset(ix + 2, iy, c0); pset(ix, iy - 2, c0); pset(ix, iy + 2, c0); }
        break;
      }
    }
  }
}
// estrella fugaz (una por ciclo, en la pausa del sur)
function dibujarFugaz(c) {
  const a = 8.15, d = 0.55;
  if (c < a || c > a + d + 0.25) return;
  const p = (c - a) / d;
  const x0 = 158, y0 = 18, x1 = 104, y1 = 44;
  const hp = Math.min(p, 1);
  const hx = x0 + (x1 - x0) * hp, hy = y0 + (y1 - y0) * hp;
  const fade = p > 1 ? 1 - (p - 1) / (0.25 / d) : 1;
  const len = 16 * Math.min(1, p * 3) * fade;
  const ux = (x0 - x1), uy = (y0 - y1), ul = Math.hypot(ux, uy);
  for (let j = Math.floor(len); j >= 0; j--) {
    const x = Math.round(hx + ux / ul * j), y = Math.round(hy + uy / ul * j);
    const f = j / (len + 1);
    pset(x, y, f < 0.15 ? STAR[4] : f < 0.45 ? STAR[3] : f < 0.75 ? STAR[2] : STAR[1]);
  }
  if (p <= 1) { pset(Math.round(hx) - 1, Math.round(hy), STAR[2]); pset(Math.round(hx), Math.round(hy) + 1, STAR[2]); }
}

// ── Luna: creciente procedural con luz cenicienta, mares y cráteres ──────────
const K = 0.30;  // posición del terminador (fase creciente ≈ 35 %)
const MARES = [[0.66, -0.30, 0.15, 0.12], [0.55, 0.16, 0.13, 0.19], [0.36, 0.36, 0.11, 0.10], [0.22, -0.06, 0.20, 0.17], [0.14, -0.40, 0.16, 0.14], [-0.32, -0.42, 0.26, 0.2], [-0.62, 0.02, 0.22, 0.42], [-0.14, 0.46, 0.17, 0.12]];
const CRATERES = [[0.80, 0.06, 1.6], [0.62, 0.50, 2.1], [0.47, -0.62, 1.7], [0.86, -0.42, 1.2], [0.72, 0.30, 1.1], [-0.08, 0.74, 1.8]];
function mareAt(u, w) {
  let m = 0;
  for (const [cu, cw, ru, rw] of MARES) { const a = (u - cu) / ru, b = (w - cw) / rw; m += Math.exp(-(a * a + b * b) * 1.6); }
  return m + 0.35 * (vnoise(u * 6 + 5, w * 6 + 2) - 0.5);
}
function dibujarLuna(st) {
  const ct = Math.cos(st.th), sn = Math.sin(st.th);
  for (let y = MY - MR - 1; y <= MY + MR + 1; y++) for (let x = MX - MR - 1; x <= MX + MR + 1; x++) {
    const dx = x + 0.5 - MX, dy = y + 0.5 - MY, r = Math.sqrt(dx * dx + dy * dy);
    if (r > MR - 0.15) continue;
    const fx = dx * ct + dy * sn, fy = -dx * sn + dy * ct;
    const u = fx / MR, w = fy / MR;
    const q = Math.sqrt(Math.max(0, 1 - w * w));
    const sp = (u - K * q) * MR;                 // distancia al terminador (px)
    const limb = r > MR - 1.1;
    const mar = mareAt(u, w);
    let cr = 0;
    for (const [cu, cw, rc] of CRATERES) {
      const ex = (u - cu) * MR, ey = (w - cw) * MR, dd = Math.hypot(ex, ey);
      if (dd < rc) cr += ex > 0 ? -1.3 : 0.35; else if (dd < rc + 0.9 && ex > 0.3) cr += 0.6;
    }
    const lit = sp > 1.2 || (sp > -1.0 && (sp + 1.0) / 2.2 > b4(x, y));
    if (lit) {
      const tl = clamp((u - K * q) / (q - K * q + 1e-3), 0, 1);
      let v = 0.75 + 3.4 * Math.pow(tl, 0.5) - 1.15 * smooth(0.45, 0.8, mar) + cr + 0.5 * (vnoise(u * 11 + 3, w * 11) - 0.5);
      if (limb) v = Math.min(v, 2.6);
      if (sp < 1.6) v = Math.min(v, 0.9);
      buf[y * W + x] = tone(MOON, v, x, y);
    } else {
      let v = 1.25 - 0.9 * smooth(0.5, 0.85, mar) + (cr > 0 ? 0.3 : cr < 0 ? -0.4 : 0);
      if (limb) v = 2.6;
      buf[y * W + x] = tone(EARTH, v, x, y);
    }
  }
}

// ── Capas del paisaje (precalculadas, con margen para el vaivén de cámara) ──
const PAD = 12, LW = W + PAD * 2;
const nuevaCapa = () => new Uint32Array(LW * H);
function blit(capa, shift) {
  for (let y = 0; y < H; y++) {
    const row = y * LW + PAD - shift, out = y * W;
    for (let x = 0; x < W; x++) { const c = capa[row + x]; if (c) buf[out + x] = c; }
  }
}
function blitMix(a, b, mix, shift) {
  for (let y = 0; y < H; y++) {
    const row = y * LW + PAD - shift, out = y * W;
    for (let x = 0; x < W; x++) {
      const c = (mix > b4(x, y)) ? b[row + x] : a[row + x];
      if (c) buf[out + x] = c;
    }
  }
}

// montañas lejanas con nieve
const FAR = nuevaCapa();
const farTop = new Int16Array(LW);
{
  const picos = [[-10, 167, 1.0, 0.9], [20, 171, 0.8, 1.1], [45, 161, 1.15, 0.95], [71, 170, 0.9, 0.8], [101, 163, 1.0, 1.2], [126, 170, 0.8, 0.9], [151, 159, 1.2, 1.0], [178, 168, 0.9, 1.0], [205, 164, 1, 1]];
  const raw = (x) => { let h = 999; for (const [px, py, sl, sr] of picos) h = Math.min(h, py + (x < px ? (px - x) * sl : (x - px) * sr)); return h; };
  for (let lx = 0; lx < LW; lx++) { const x = lx - PAD; farTop[lx] = Math.min(186, Math.round(raw(x) + (vnoise(x * 0.4, 3.3) - 0.5) * 3)); }
  for (let lx = 0; lx < LW; lx++) {
    const x = lx - PAD, top = farTop[lx];
    const sl = (farTop[Math.min(LW - 1, lx + 1)] - farTop[Math.max(0, lx - 1)]);
    const lit = x < MX ? sl < 0 : sl > 0;
    const flat = sl === 0;
    const snow = 168.5 + (vnoise(x * 0.3, 8) - 0.5) * 4;
    for (let y = top; y < H; y++) {
      let c;
      const depth = y - top;
      if (y < snow) {
        const tex = vnoise(x * 0.9, y * 0.35 + 4) > 0.62;
        c = lit ? (depth === 0 ? FARC[5] : tex ? FARC[3] : FARC[4]) : (depth === 0 && !flat ? FARC[4] : tex ? FARC[2] : FARC[3]);
        if (y > snow - 1.5 && b2(x, y) > 0.5) c = lit ? FARC[2] : FARC[1];
      } else {
        c = lit ? (depth < 2 ? FARC[3] : FARC[2]) : (depth === 0 ? FARC[2] : FARC[1]);
        if (!lit && depth > 1 && vnoise(x * 0.7, y * 0.5) > 0.7) c = FARC[0];
        if (lit && depth > 3 && vnoise(x * 0.8, y * 0.4 + 2) > 0.66) c = FARC[1];
      }
      // bruma en la base
      if (y > 179) { const hz = (y - 179) / 8; if (hz > b4(x, y)) c = hz > 0.6 + 0.4 * b2(x, y) ? MIST[0] : FARC[2]; }
      FAR[y * LW + lx] = c;
    }
  }
}

// colinas medias con pinos (norte) o araucarias (sur)
const midTop = (x) => Math.round(192 + 2.6 * Math.sin(x * 0.045 + 0.8) + 1.6 * Math.sin(x * 0.12 + 2));
function colinas(arboles) {

function dibujarTitulo(st) {
