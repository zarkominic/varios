<script type="module">
// WO-HIDROGENO (frases 7–8): ¿qué frecuencia escuchar? y la respuesta de 1959: la del hidrógeno. Seis planos:
// 1. (0) el cielo de noche sobre el campo, lleno de ruido: garabatos de radio de muchos colores caen de todas partes
//    a la antena de un radioaficionado con auriculares; gira el mando, la aguja salta y en «noise» pone mala cara;
//    la lechuza del poste gira la cabeza; en «Which frequency» suelta el mando y le sale un «?».
// 2. («In 1959», 4,92) el despacho de 1959: Cocconi entra con una revista; en «Giuseppe Cocconi» señala la pizarra;
//    Morrison, junto a ella con el puntero hacia el 1420, da un saltito y habla en «Philip Morrison» y en «proposed

// 3. («the frequency of hydrogen», 11,54) la pizarra de cerca (la misma tiza: átomo, onda, 1420 y 21): la mano de
//    Morrison subraya el 1420; en «the most common element» dibuja cuatro barras (la del hidrógeno, con su átomo,
//    llega arriba) y en «universe» la rodea; se va.

// 5. («about 1,420», 21,37) la radio antigua: la mano gira el sintonizador, la aguja va a la raya del 1420, se pasa,
//    vuelve y se queda; en «never changes channels» la mano la empuja y la aguja no se mueve; la mano se va.
// 6. («Anyone who studies the sky», 26,96) tres casas de escucha en tres sitios del mundo (nieve, mar, desierto),
//    abiertas como casas de muñecas: los tres sintonizan la misma raya y sonríen en «knows it»; en «if someone
//    wanted to be heard» se enciende una luz lejana en el cielo; en «good station» salen de ella ondas que llegan a
//    las tres casas una tras otra: al llegar, la raya de cada radio late y el que escucha se lleva la mano a la oreja.
import * as T from '/atomo/plato/escenas/wo-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('wo-hidrogeno');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const K = hex('#17151d'), BL = hex('#f6f2ea'), ease = (u) => Math.max(0, Math.min(1, u)) ** 2 * (3 - 2 * Math.max(0, Math.min(1, u)));

// una luz cálida que aclara lo que hay debajo (tramada hacia el borde)

const tranquila = (x, y) => (x >= 274 && y <= 48) || (x >= 16 && x <= 174 && y <= 22);
// un bocadillo blanco con un icono (?, !) que sale con un saltito
const globo = (x, y, ic, c, e = 1) => { if (e <= 0) return; const r = Math.round(6 * Math.min(1, e * 1.3)); R.disco(x, y, r + 1, K); R.disco(x, y, r, BL); R.pset(x - 4, y + r + 1, K); R.pset(x - 3, y + r, BL); R.pset(x - 3, y + r + 1, K); if (e > 0.6) R.icono(ic, x - (ic === '?' ? 2 : 1), y - 4, c, null, 1); };
// destello de cuatro puntas
const destello = (x, y, r, c = BL) => { x = Math.round(x); y = Math.round(y); for (let i = -r; i <= r; i++) { R.pset(x + i, y, c); R.pset(x, y + i, c); } };

const murcielago = (x, y, t, k) => { x = Math.round(x); y = Math.round(y); const ar = Math.sin(t * 22 + k * 2) > 0; const N = hex('#14121c');
  R.rect(x - 1, y, x + 1, y + 1, N); R.pset(x - 1, y - 1, N); R.pset(x + 1, y - 1, N);
  if (ar) { R.linea(x - 2, y, x - 5, y - 3, N); R.linea(x + 2, y, x + 5, y - 3, N); R.pset(x - 6, y - 2, N); R.pset(x + 6, y - 2, N); }
  else { R.linea(x - 2, y + 1, x - 6, y + 2, N); R.linea(x + 2, y + 1, x + 6, y + 2, N); } };
// una polilla que da vueltas a una luz
const polilla = (cx, cy, t, k, r = 6) => { const a = t * (5 + k) + k * 2.1, x = Math.round(cx + Math.cos(a) * r), y = Math.round(cy + Math.sin(a * 1.3) * r * 0.6); R.pset(x, y, hex('#e8dcc0')); if (Math.sin(t * 40 + k) > 0) { R.pset(x - 1, y - 1, hex('#bfb090')); R.pset(x + 1, y - 1, hex('#bfb090')); } };
// un ratón de campo (8 × 5 px) que anda (fase) o se para y mueve los bigotes; dir 1 mira a la derecha
const raton = (x, y, dir, fase, anda, t, s = 2) => { x = Math.round(x); y = Math.round(y);
  const G = hex('#a88060'), GL = hex('#d0a880'), GS = hex('#7a5a40'), P = hex('#f0a0a8');
  const px = (i, j, c) => { for (let a = 0; a < s; a++) for (let b = 0; b < s; b++) R.pset(x + (i * s + a) * dir, y + (j + 1) * s - 1 - b, c); };
  for (let i = -4; i <= 3; i++) for (let j = -4; j <= -1; j++) { const d = (i / 4.2) ** 2 + ((j + 2.5) / 2) ** 2; if (d <= 1.25) px(i, j, d > 0.95 ? K : j === -4 ? GL : j === -1 ? GS : G); }
  px(4, -3, G); px(5, -3, G); px(5, -2, K); px(6, -2, P); px(4, -2, G); px(3, -5, GL); px(2, -5, P);   // hocico, nariz y oreja
  px(4, -4, K);   // el ojo
  const b = Math.sin(t * 18) > 0 ? 0 : 1; px(6, -3 - b, hex('#d8d0c0')); px(7, -3 - b, hex('#d8d0c0'));   // bigotes
  for (let i = 1; i <= 6; i++) px(-4 - i, -2 + Math.round(Math.sin(i * 0.8 + t * 6) * 0.8), P);   // la cola
  const p = anda ? Math.floor(fase) % 2 : 0; px(-2, 0 - p, GS); px(2, 0 - (1 - p) * (anda ? 1 : 0), GS); };

const th = (s) => en('cocconi', (s - 0.9) / 14.403), te = (s) => en('emisora', (s - 16.969) / 15.928);
const P2 = th(4.92), P3 = th(11.54), P4 = te(16.969), P5 = te(21.37), P6 = te(26.96);
const CH = hex('#e4eae0'), CH2 = hex('#aebcae');
// ── 1 · el cielo lleno de ruido ───────────────────────────────────────────────────────────────────────────────────
const RUIDO = th(2.18), CUAL = th(3.04), DUDA = th(3.62);
const COLS = ['#ff7ad8', '#7ae8ff', '#ffe07a', '#9aff8a', '#ff9a5a', '#c8a0ff'].map(hex);
const LX = 50, CX = 72, CY = 148, ANT = [CX + 33, CY - 24];

  for (const yy of [y + 17, y + 21]) R.rect(x + 1, yy, x + 27, yy, hex('#6a4628'));

  R.rect(x + 2, y - 1, x + 26, y + 12, K); R.rect(x + 3, y, x + 25, y + 11, hex('#4e5a52')); R.rect(x + 3, y, x + 25, y, hex('#7e8a80')); R.rect(x + 3, y + 11, x + 25, y + 11, hex('#36403a'));
  R.rect(x + 5, y + 2, x + 14, y + 8, K); R.rect(x + 6, y + 3, x + 13, y + 7, hex('#f0e0a8'));
  for (let i = 0; i < 5; i++) R.pset(x + 7 + i * 1.5, y + 3, hex('#8a7a50'));
  R.linea(x + 9, y + 7, x + 9 + Math.round(Math.sin(ag) * 3), y + 4, hex('#c83a2a'));
  R.disco(x + 20, y + 6, 4, K); R.disco(x + 20, y + 6, 3, hex('#2a2a30')); R.pset(x + 20 + Math.round(Math.cos(giro) * 2), y + 6 + Math.round(Math.sin(giro) * 2), hex('#e8e8e8'));
  R.pset(x + 24, y + 2, Math.floor(t * 4) % 2 ? hex('#ff5a3a') : hex('#8a2a1a'));
  for (let i = 0; i < 6; i++) R.pset(x + 5 + i * 2, y + 10, hex('#26302a'));

  R.linea(x + 23, y - 1, ANT[0], ANT[1], hex('#c8c8d0')); R.pset(ANT[0], ANT[1], hex('#ff5a3a'));
};
const lechuza = (x, y, t, mira) => {   // en lo alto de un poste; mira -1..1 gira la cabeza
  R.rect(x - 2, y + 7, x + 2, 174, K); R.rect(x - 1, y + 7, x + 1, 174, hex('#5a4630')); for (let yy = y + 10; yy < 174; yy += 4) R.pset(x, yy, hex('#3a2c1e'));
  const C1 = hex('#a07848'), C2 = hex('#7a5a36'), CL = hex('#e8d8b0');
  R.disco(x, y + 2, 5, K); R.disco(x, y + 2, 4, C1); for (const [i, j] of [[-2, 3], [1, 4], [-1, 5], [2, 2]]) R.pset(x + i, y + j, C2);
  const hx = x + Math.round(mira * 1.5); R.disco(hx, y - 4, 4, K); R.disco(hx, y - 4, 3, C1); R.pset(hx - 3, y - 8, K); R.pset(hx + 3, y - 8, K);
  const parpa = Math.sin(t * 1.7) > 0.96; R.rect(hx - 2, y - 5, hx - 1, y - 4, parpa ? C2 : CL); R.rect(hx + 1, y - 5, hx + 2, y - 4, parpa ? C2 : CL);
  if (!parpa) { R.pset(hx - 1 + (mira > 0.3 ? 1 : 0), y - 5, K); R.pset(hx + 1 + (mira > 0.3 ? 1 : 0), y - 5, K); }
  R.pset(hx, y - 3, hex('#e8b030'));
};
const p1 = (t) => {
  const o = { encuadre: 'caminos' };
  T.cielo2(R, t, o);
  // el ruido: garabatos de radio de muchos colores que caen de todo el cielo a la antena (más y más)
  const lleno = ease(tramo(t, 0.2, RUIDO + 0.3));
  for (let k = 0; k < 46; k++) {
    if (hs(k, 3) > 0.15 + 0.85 * lleno) continue;
    const sx = 6 + hs(k, 1) * 300, sy = 26 + hs(k, 2) * 86; if (tranquila(sx, sy)) continue;
    const u = (t * (0.28 + hs(k, 5) * 0.2) + hs(k, 4)) % 1; if (u > 0.88) continue;
    const x = sx + (ANT[0] - sx) * u, y = sy + (ANT[1] - sy) * u, dx = ANT[0] - sx, dy = ANT[1] - sy, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    const c = COLS[k % COLS.length], lam = 1.2 + hs(k, 6) * 1.6;
    for (let i = -8; i <= 8; i++) { const w = Math.sin(i * lam + t * 9 + k) * 2.4; const X = Math.round(x + ux * i - uy * w), Y = Math.round(y + uy * i + ux * w); if (!tranquila(X, Y)) { R.pset(X, Y, c); if (Math.abs(i) < 5) R.pset(X + 1, Y, mez(c, K, 0.35)); } }
  }
  // chispas de estática alrededor de la antena
  if (lleno > 0.3) for (let k = 0; k < 8; k++) { const a = hs(k, Math.floor(t * 12)) * 6.28, r = 3 + hs(k, Math.floor(t * 12) + 9) * 7; R.pset(Math.round(ANT[0] + Math.cos(a) * r), Math.round(ANT[1] + Math.sin(a) * r), COLS[(k + Math.floor(t * 12)) % 6]); }
  // la cerca de alambre del prado
  for (let x = 136; x < 320; x++) { R.pset(x, 162 + ((x >> 3) % 2 ? 0 : 0), hex('#3a4a3a')); if (x % 9 === 0) R.pset(x, 162, hex('#8a9a8a')); R.pset(x, 168, hex('#2e3a2e')); }
  for (let x = 140; x < 320; x += 22) { R.rect(x, 157, x + 1, 174, K); R.pset(x, 157, hex('#6a5a40')); R.rect(x, 158, x, 173, hex('#5a4630')); }
  // la lechuza del poste mira el jaleo
  lechuza(250, 150, t, t < RUIDO ? Math.sin(t * 1.3) : -0.9 + Math.sin(t * 7) * 0.2);
  // el radioaficionado: gira el mando, pone mala cara con el ruido, lo suelta y duda
  const gira = t < CUAL, ag = Math.sin(t * (t > RUIDO ? 21 : 7)) * (0.5 + lleno), giro = gira ? t * 3 : CUAL * 3;
  receptor(t, ag, giro);

  const a = R.actor(EL.operadorRadio, LX, 174, t, { dir: 1, sostiene: gira ? [CX + 20, CY + 8] : false, dedo: !gira && t > DUDA - 0.2, enfado: t > RUIDO && t < CUAL + 0.4, sorpresa: t > CUAL + 0.4 && t < DUDA, salto: t > RUIDO && t < RUIDO + 0.25 ? 2 : 0,
    pal: { C: hex('#7a5a3a'), c: hex('#5a4228'), o: hex('#5a4228'), F: hex('#3a3a44'), G: hex('#5a4228') } });

// ── 2 · el despacho de 1959 ───────────────────────────────────────────────────────────────────────────────────────
const ENTRA = P2 + 0.15, COC = th(7.78), MOR = th(9.0), PROP = th(10.2), RESP = th(10.78);
const revista = (x, y) => { x = Math.round(x); y = Math.round(y); R.rect(x - 4, y - 6, x + 4, y + 4, K); R.rect(x - 3, y - 5, x + 3, y + 3, hex('#c8382c')); R.rect(x - 3, y - 2, x + 3, y, hex('#f0e8d0')); R.pset(x + 2, y - 4, hex('#f0e8d0')); };
const p2 = (t) => {
  const o = { encuadre: 'despacho' };
  T.hoy(R, t, o);
  // en «proposed an answer» el 1420 brilla (rayitas de tiza que salen)
  const br = tramo(t, PROP + 0.1, RESP + 0.9);
  if (br > 0 && br < 1) for (let k = 0; k < 8; k++) { const a = k * 0.785, r0 = 15 + br * 6, r1 = r0 + 4; R.linea(Math.round(170 + Math.cos(a) * r0 * 1.4), Math.round(78 + Math.sin(a) * r0 * 0.7), Math.round(170 + Math.cos(a) * r1 * 1.4), Math.round(78 + Math.sin(a) * r1 * 0.7), k % 2 ? hex('#f0f0c0') : BL); }
  // Cocconi entra por la izquierda con la revista bajo el brazo; en su nombre señala la pizarra
  const w = tramo(t, ENTRA, ENTRA + 1.9), cx = Math.round(lerp(14, 84, ease(w)));
  const senala = t > COC - 0.1 && t < MOR + 0.2;
  const c = R.actor(EL.cocconiWO, cx, 156, t, { dir: 1, anda: w > 0 && w < 1, dedo: senala, sostiene: senala ? false : [cx + 15, 138], habla: (t > COC && t < MOR) || (t > RESP + 0.3 && t < RESP + 1.0), sonrisa: t > PROP });
  if (c && c.mano && !senala) revista(c.mano[0], c.mano[1] - 2);

  const mx = 176, toque = t > PROP && t < RESP + 0.5 ? Math.max(0, Math.sin((t - PROP) * 11)) : 0;
  const m = R.actor(EL.morrisonWO, mx, 156, t, { dir: -1, sostiene: [mx - 2, 136], salto: t > MOR && t < MOR + 0.2 ? 1 : 0, habla: t > MOR && t < PROP, sonrisa: t > MOR });
  if (m && m.mano) {
    const [hx, hy] = m.mano, px = 170 + Math.round(toque * 2), py = 85 - Math.round(toque * 4);
    R.linea(hx, hy, px, py, K); R.linea(hx + 1, hy, px + 1, py, hex('#b07840')); R.pset(px, py, BL); R.pset(px + 1, py, BL);
    if (toque > 0.85) for (let k = 0; k < 5; k++) R.pset(px - 2 + k, py + 2 + (k % 2) + Math.round((t * 20) % 4), CH2);
  }
  T.hoyDelante(R, t, o);
};
// ── 3 · la pizarra de cerca ───────────────────────────────────────────────────────────────────────────────────────
const SUB0 = P3 + 0.15, SUB1 = th(12.6), BAR0 = th(13.2), BAR1 = th(14.55), CIR0 = th(14.64), CIR1 = th(15.5), VA = th(15.9);
const tiza = (x, y, c = CH) => { if (hs(x, y, 7) < 0.82) R.pset(x, y, c); else R.pset(x, y, CH2); };
const trazo = (x0, y0, x1, y1, u = 1) => { const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0))); for (let i = 0; i <= n * u; i++) tiza(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n)); };
const BARRAS = [[204, 222, 66], [232, 246, 120], [256, 268, 128], [278, 288, 131]];   // [x0, x1, techo]
const p3 = (t) => {
  const o = { encuadre: 'despacho', camara: 'pizarra', u: 0 };
  T.hoy(R, t, o);

  for (let x = 47; x <= 203; x++) { const y = Math.round(44 + Math.sin((x - 47) / 13.5 * Math.PI) * 13); tiza(x, y); tiza(x, y + 1, CH2); }

  R.numero('21', 75, 102, { tam: 16, color: CH, contorno: false, sombra: false });
  for (let x = 110; x <= 191; x += 4) { tiza(x, 98); tiza(x + 1, 98); }
  for (let y = 54; y < 104; y++) for (let x = 70; x < 166; x++) if (R.pget(x, y) === CH && hs(x, y, 3) < 0.18) R.pset(x, y, CH2);
  // la mano de Morrison: subraya el 1420, dibuja las barras y rodea la del hidrógeno
  const sub = tramo(t, SUB0 + 0.35, SUB1);
  trazo(100, 80, 164, 79, sub); if (sub >= 1) trazo(102, 82, 160, 82, 1);
  const ejes = tramo(t, BAR0, BAR0 + 0.35);
  trazo(198, 140, 198, 60, ejes); trazo(198, 140, 300, 140, ejes);
  let punta = [lerp(100, 164, sub), 80];
  BARRAS.forEach(([x0, x1, top], k) => {
    const u = tramo(t, BAR0 + 0.35 + k * 0.22, BAR0 + 0.57 + k * 0.22); if (u <= 0) return;
    const y = Math.round(lerp(140, top, ease(u)));
    trazo(x0, 140, x0, y); trazo(x1, 140, x1, y); trazo(x0, y, x1, y);
    for (let yy = y + 3; yy < 139; yy += 3) for (let xx = x0 + 2; xx < x1; xx += 2) if ((xx + yy) % 4 === 0) tiza(xx, yy, CH2);
    if (u < 1) punta = [x1, y];
    if (k === 0 && u >= 1) { R.anillo(213, 55, 6, CH); R.disco(213, 55, 1.5, CH); const a = t * 3; tiza(Math.round(213 + Math.cos(a) * 6), Math.round(55 + Math.sin(a) * 6), BL); }
  });
  if (t > BAR0 && t < BAR0 + 0.35) punta = [198, lerp(140, 60, ejes)];
  const cir = tramo(t, CIR0, CIR1);
  if (cir > 0) { const n = 60; for (let i = 0; i <= n * cir; i++) { const a = -1.2 + i / n * 6.6; tiza(Math.round(213 + Math.cos(a) * 17), Math.round(100 + Math.sin(a) * 44)); } if (cir < 1) { const a = -1.2 + cir * 6.6; punta = [213 + Math.cos(a) * 17, 100 + Math.sin(a) * 44]; } }
