<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drake · ep4</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// EP4-DRAKE (frases 38–41), cartela 1579.
//  drake   un galeón inglés con farol de popa entra en el mar de noche.
//  vuelta  sobre el pergamino del mundo, su estela punteada da la vuelta: Atlántico, estrecho de Magallanes, costa del
//          Pacífico, el Pacífico, el Índico, el cabo de Buena Esperanza y vuelta a casa.
//  peru    junto a un barco español hundido de tan cargado, cofres que saltan de uno a otro; la caja cuenta días.
//  cartas  en cubierta, un marinero inglés se lleva un rollo de cartas y a un piloto.
import { escena } from '/atomo/plato/escena.js';
import { crearRetro } from '/atomo/plato/kits/pixel-retro.js';
const E = await escena('ep4-drake', 'ep04');
const R = await crearRetro(document.getElementById('lienzo'));
const { PAL, tramo, lerp, clamp } = R;
const M = (k, d) => E.marca(k, d);
const m = { drake: M('drake', 1.5), vuelta: M('vuelta', 3.5), peru: M('peru', 10), cartas: M('cartas', 15) };

const entra = (t) => {
  R.cielo(t, { luna: [70, 36, 13], nubes: true });
  R.mar(t, { luzX: 70 });
  R.barco(lerp(-60, 170, tramo(t, m.drake - 0.5, m.drake + 1.6)), 138, t, { tipo: 'galeon', bandera: 'ingles', farol: true, esc: 1 });
};
// ruta de la vuelta al mundo (lon, lat)
const RUTA = [[-4, 50], [-20, 30], [-35, 0], [-45, -25], [-65, -45], [-70, -53], [-76, -45], [-73, -20], [-80, -5], [-90, 10], [-115, 30], [-125, 38], [-150, 20], [180, 10], [140, 5], [125, 0], [110, -8], [80, -15], [40, -30], [20, -36], [5, -10], [-15, 10], [-15, 35], [-4, 50]];
const vuelta = (t) => {
  R.mesa(t, { luz: [160, 10] });
  R.pergamino(14, 10, 306, 150, { luz: [160, 10], semilla: 31 });
  const pj = R.proyector(20, 16, 300, 144, -180, 180, -62, 72);
  R.recorte([20, 16, 300, 144]); R.mundo(pj, { tierra: 2.4 }); R.recorte(null);
  // la ruta: centrada en el meridiano 0 (el tramo del Pacífico cruza el borde)
  const p = tramo(t, m.vuelta + 0.3, m.peru - 0.6) * (RUTA.length - 1);
  let ult = null;
  for (let k = 0; k < Math.min(RUTA.length - 1, Math.ceil(p)); k++) {
    const f = Math.min(1, p - k);
    let [a1, b1] = RUTA[k], [a2, b2] = RUTA[k + 1];
    if (Math.abs(a2 - a1) > 180) { a2 = a2 > 0 ? a2 - 360 : a2 + 360; }
    const [x1, y1] = pj(a1, b1), [x2, y2] = pj(a1 + (a2 - a1) * f, b1 + (b2 - b1) * f);
    if (x2 < 20) { const [x3, y3] = pj(a1 + (a2 - a1) * f + 360, b1 + (b2 - b1) * f); R.linea(x3, y3, x3 - 4, y3, PAL.ROJO, 3); ult = [x3, y3]; }
    else { R.linea(x1, y1, x2, y2, PAL.ROJO, 3); ult = [x2, y2]; }
  }
  if (ult) R.barco(ult[0], ult[1] + 2, t, { tipo: 'galeon', esc: 0.16, espuma: false, bob: 0 });
  R.rosa(276, 128, 9);
};
const abordaje = (t) => {
  R.cielo(t, { luna: [260, 30, 11], semilla: 47 });
  R.mar(t, { luzX: 260 });
  R.barco(90, 140, t, { tipo: 'galeon', bandera: 'ingles', farol: true, esc: 0.85 });
  R.barco(230, 146, t, { tipo: 'galeon', bandera: 'espana', esc: 0.85, dir: -1, fase: 2, bob: 0.5 });  // hundido de peso
  // cofres que saltan del español al inglés
  for (let k = 0; k < 4; k++) {
    const f = ((t - m.peru) * 0.7 + k / 4) % 1;
    if (t < m.peru + 0.4) continue;
    const x = lerp(210, 110, f), y = 112 - 30 * Math.sin(Math.PI * f);
    R.rect(x - 3, y - 2, x + 3, y + 2, PAL.HULL[3]); R.rect(x - 3, y - 3, x + 3, y - 2, PAL.PLATA[2]); R.pset(x, y, PAL.ORO[4]);
  }
};
const llevar = (t) => {
  R.cielo(t, { luna: [60, 36, 10], hor: 140, semilla: 49 });
  R.mar(t, { hor: 140, luzX: 60 });
  for (let y = 148; y < R.H; y++) for (let x = 0; x < R.W; x++) R.pset(x, y, R.tone(PAL.HULL, 2.3 - (y - 148) * 0.05 + (x % 18 === 0 ? -1 : 0), x, y));
  R.rect(0, 140, R.W, 147, PAL.HULL[2]); R.rect(0, 140, R.W, 140, PAL.HULL[4]);
  const a = (t - m.cartas) * 6;
  const x = lerp(250, 120, tramo(t, m.cartas + 0.2, m.cartas + 3.4));
  R.figura(x, 148, 40, { sombrero: 'tricornio', faja: 2, objeto: 'pergamino', dir: -1, anda: a, brazoI: 'ofrece' });
  R.figura(x + 26, 148, 38, { sombrero: 'sombrero', dir: -1, anda: a + 2, pose: 'ofrece' });
};

E.iniciar((t) => {
  R.secuencia(t, [[0, (t) => R.cartela(t, '1579')], [1.2, entra], [m.vuelta - 0.2, vuelta], [m.peru - 0.2, abordaje], [m.cartas - 0.2, llevar]]);
  const e = E.energia(t);
  R.caja(t, t > m.peru && t < m.cartas - 0.2 ? tramo(t, m.peru + 0.6, m.peru + 1) : 0, (x, y) => {
    const d = 1 + Math.floor(clamp((t - m.peru - 1) / 0.6, 0, 5));
    R.numero(String(d), x + 6, y + 12); R.icono('luna', x + 22, y + 4, PAL.UI[5]);
  }, { energia: e });
  if (t > 1.3) R.companero(t, e);
  R.presentar();
});
</script>
</body>
</html>
