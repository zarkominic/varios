<script type="module">
// DD-VISIONQUEST (frases 9–10). Seis planos:
// 1. el salón de Atom: el calendario de noviembre (se rodea el 10); en la tele, el menú de la serie: el cursor llega al
//    último episodio («last episode») y se abre la imagen del sintezoide rojo con su gema; la mano con el mando;
// 2. otra habitación, de noche: un dormitorio con papel pintado, estantería de libros, reloj, ventana con lluvia y cortinas,
//    la tele pequeña sobre una cómoda de cajones y un sillón de perfil; corren los créditos y, en «Wundagore», un fogonazo y
//    la montaña en ruinas, que se acerca despacio; la luz de la tele parpadea en la pared y el gato del sillón se despereza;
// 3. un cine en 2022: el derrumbe de Wundagore en toda la pantalla curva (la Bruja Escarlata con su onda roja); telones,
//    paneles acolchados, apliques y un altavoz que vibra; la sala casi llena da un respingo y saltan las palomitas del cubo
//    de la fila de delante;
// 4. el piso de Ultron (hormigón con manchas, gotera en un cubo, estantería con la cabeza de robot, monitores vivos, cómoda):
//    se encienden dos apliques («two scenes»); entra Ultron, calvo y con gafas, coge la memoria USB de la mesa, va a la
//    ventana con la ciudad bajo la lluvia, se toca las gafas («new look») y la levanta hacia el cristal;
// 5. de cerca, en el alféizar: su mano (T.brazo) sostiene la memoria y la sube; la etiqueta rosa con la gema se ilumina
//    («Jocasta»); maceta, libros con gafas, destornillador y radiador; la ciudad con fachadas, nubes y neones;
// 6. Atom aparta esa imagen a un lado («belongs to the series») y queda la cumbre de Wundagore: en «second» late la luz
//    verde y la gente del pueblo la señala.
import * as T from '/atomo/plato/escenas/dd-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('dd-visionquest');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const K = hex('#141018');
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
const azar = (a, b = 0) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
const caja = (x0, y0, x1, y1, c, b = K) => { R.rect(x0, y0, x1, y1, b); R.rect(x0 + 1, y0 + 1, x1 - 1, y1 - 1, c); };
// oscurece (o aclara) una zona hacia un color, con un poco de trama: para dejar tranquila la esquina de Atom o la barra
const velo = (x0, y0, x1, y1, col, a) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) R.pset(x, y, mez(R.pget(x, y), col, a)); };
// la taza de café de Banner (5 × 5, con su asa), (x, y) arriba a la izquierda; humo: el vapor que sube
const taza = (x, y, t, humo = true) => { R.rect(x, y, x + 4, y + 5, K); R.rect(x + 1, y + 1, x + 3, y + 4, hex('#f2eee2')); R.pset(x + 1, y + 1, hex('#5a3a24')); R.pset(x + 2, y + 1, hex('#5a3a24')); R.pset(x + 3, y + 1, hex('#5a3a24'));
  R.pset(x + 5, y + 2, K); R.pset(x + 6, y + 3, K); R.pset(x + 5, y + 4, K); R.pset(x + 3, y + 4, hex('#c8c4bc'));
  if (humo) for (let k = 0; k < 3; k++) { const f = (t * 0.9 + k / 3) % 1; R.pset(Math.round(x + 2 + Math.sin(t * 3 + k * 2) * 1.2), Math.round(y - 1 - f * 7), f > 0.6 ? hex('#8a8a90') : hex('#c8c8d0')); } };
// un actor del reparto dibujado a escala (silueta en una pantalla): col(c) da el color de cada píxel
const BUFA = R.nuevo();
const actorT = (def, x, suelo, t, o, col, a) => escalado(def, x - 12, suelo - 40, 1, t, o, (c) => mez(c, col, a));
const escalado = (def, x0, y0, s, t, o, col, clip = null) => { R.recorte(null); const prev = R.usar(BUFA); BUFA.fill(0); R.actor(def, 20, 44, t, o); R.usar(prev);
  for (let j = 4; j < 46; j++) for (let i = 8; i < 44; i++) { const c = BUFA[j * 320 + i]; if (!c) continue; const cc = col ? col(c, i, j) : c; for (let a = 0; a < s; a++) for (let b = 0; b < s; b++) { const px = x0 + (i - 8) * s + a, py = y0 + (j - 4) * s + b; if (!clip || (px >= clip[0] && px <= clip[2] && py >= clip[1] && py <= clip[3])) R.pset(px, py, cc); } } };

const V = (f) => en('vision', f), U = (f) => en('ultron', f);
const P2 = V(0.367), P3 = V(0.725), P4 = U(-0.003), P5 = U(0.386), P6 = U(0.699);
const VERDE = hex('#3ae88a');
// el sintezoide de la serie: piel roja, traje verde y la gema amarilla (variante del héroe del 19)
const SINTE = { ...EL.steve, pal: { ...EL.steve.pal, H: hex('#c8303a'), h: hex('#a8202a'), S: hex('#d84a4a'), s: hex('#a83030'), C: hex('#3a7a4a'), c: hex('#2a5a38'), W: hex('#3a7a4a'), G: hex('#e8b830'), I: hex('#2a5a38'), F: hex('#3a7a4a'), n: hex('#2a5a38'), X: hex('#e8b830'), r: hex('#2a5a38') } };
// 1 · el salón de Atom: el calendario, el menú de la serie y el último episodio
const menu = (R, t, [x0, y0, x1, y1]) => {
  for (let y = y0; y <= y1; y++) R.linea(x0, y, x1, y, mez(hex('#0a0e2a'), hex('#1a1e4a'), (y - y0) / (y1 - y0)));
  const abre = tramo(t, V(0.207), V(0.207) + 0.5), sel = Math.min(4, Math.floor(tramo(t, 0.8, V(0.171)) * 4.999));
  // la cabecera: el sintezoide pequeño ante la gema que brilla
  const bx0 = x0 + 6, by0 = y0 + 5, bx1 = x1 - 6, by1 = y0 + 38;
  caja(bx0, by0, bx1, by1, hex('#2a1a3a'), hex('#5a4a8a')); for (let y = by0 + 1; y < by1; y++) R.linea(bx0 + 1, y, bx1 - 1, y, mez(hex('#3a1a3a'), hex('#e87a3a'), Math.max(0, (y - by0) / (by1 - by0) - 0.3)));
  R.disco(bx1 - 22, by0 + 14, 7, hex('#e8b830')); R.disco(bx1 - 22, by0 + 14, 4, hex('#fff0a0'));
  escalado(SINTE, bx0 + 10, by0 - 6, 1, t, { dir: 1, quieto: true }, null, [bx0 + 1, by0 + 1, bx1 - 1, by1 - 1]); R.recorte([x0, y0, x1, y1]);
  for (let k = 0; k < 3; k++) R.rect(bx0 + 40, by0 + 8 + k * 6, bx0 + 40 + [36, 26, 30][k], by0 + 10 + k * 6, k ? hex('#8a8ab8') : hex('#e8e8f8'));
  // la fila de episodios y el cursor que llega al último
  for (let k = 0; k < 5; k++) { const cx = x0 + 8 + k * 22, cy = y0 + 46; caja(cx, cy, cx + 19, cy + 14, [hex('#3a2a5a'), hex('#5a2a2a'), hex('#2a4a3a'), hex('#4a3a2a'), hex('#3a6a4a')][k], hex('#14141e'));
    R.disco(cx + 6 + k, cy + 7, 3, [hex('#e8b830'), hex('#c8303a'), hex('#5ae8a0'), hex('#e87a3a'), hex('#e8b830')][k]); R.rect(cx + 2, cy + 11, cx + 17, cy + 12, hex('#14141e'));
    if (k === sel && Math.floor(t * 4) % 4) { R.linea(cx - 1, cy - 1, cx + 20, cy - 1, hex('#ffffff')); R.linea(cx - 1, cy + 15, cx + 20, cy + 15, hex('#ffffff')); R.linea(cx - 1, cy - 1, cx - 1, cy + 15, hex('#ffffff')); R.linea(cx + 20, cy - 1, cx + 20, cy + 15, hex('#ffffff')); } }
  for (let k = 0; k < 5; k++) R.rect(x0 + 8 + k * 22, y0 + 64, x0 + 8 + k * 22 + 12, y0 + 65, hex('#5a5a8a'));
  // el último episodio se abre a toda la pantalla
  if (abre > 0) { const cx = x0 + 8 + 4 * 22, cy = y0 + 46, ax0 = Math.round(lerp(cx, x0, abre)), ay0 = Math.round(lerp(cy, y0, abre)), ax1 = Math.round(lerp(cx + 19, x1, abre)), ay1 = Math.round(lerp(cy + 14, y1, abre));
    for (let y = ay0; y <= ay1; y++) R.linea(ax0, y, ax1, y, mez(hex('#1a1030'), hex('#6a2a3a'), (y - ay0) / Math.max(1, ay1 - ay0)));
    for (let k = 0; k < 20; k++) R.pset(ax0 + Math.floor(azar(k, 1) * (ax1 - ax0)), ay0 + Math.floor(azar(k, 2) * (ay1 - ay0) * 0.6), Math.sin(t * 3 + k) > 0 ? hex('#ffffff') : hex('#8a8ab0'));
    if (abre >= 1) { R.halo(x0 + 60, y0 + 30, 22, [hex('#3a2a3a'), hex('#6a4a3a'), hex('#a87a3a')], 0.9); escalado(SINTE, x0 + 24, y0 + 6, 2, t, { dir: 1, sonrisa: true }, null, [x0, y0, x1, y1]); R.recorte([x0, y0, x1, y1]);
      const gx = x0 + 24 + (27 - 8) * 2, gy = y0 + 6 + (21 - 4) * 2; R.disco(gx, gy, 2, hex('#fff0a0')); if (Math.sin(t * 6) > 0) R.disco(gx, gy, 4, hex('#e8b830')); R.disco(gx, gy, 1.5, hex('#ffffff')); } }
};
const p1 = (t) => {
  const o = { encuadre: 'estudio', camara: 'tele', mes: 11, inicio: 0, diasMes: 30, tachados: [1, 2, 3, 4, 5, 6, 7, 8, 9], imagen: menu };
  T.estudio(R, t, o);
  // el 10 del calendario, rodeado a rotulador
  const ro = tramo(t, V(0.076), V(0.076) + 0.6); for (let s = 0; s < ro * 40; s++) { const a = -Math.PI / 2 + s / 40 * Math.PI * 2.1; R.rect(Math.round(57 + Math.cos(a) * 7), Math.round(67 + Math.sin(a) * 6), Math.round(57 + Math.cos(a) * 7), Math.round(67 + Math.sin(a) * 6), hex('#e83a3a')); }
  T.estudioDelante(R, t, o);
  // la mano con el mando: pulsa cada vez que el cursor avanza
  const pulsa = (t > 0.8 && t < V(0.2) && (t * 1.4) % 1 < 0.2) ? 2 : 0, sal = tramo(t, 0, 0.6) * (1 - tramo(t, P2 - 0.8, P2 - 0.1));
  const wx = Math.round(lerp(10, 42, sal)), wy = Math.round(lerp(200, 164, sal)) + pulsa;
  if (sal > 0.02) { T.brazo(R, 8, 194, wx, wy, '#3a4a6a', 1, {}); R.rect(wx + 7, wy - 9, wx + 11, wy + 1, K); R.rect(wx + 8, wy - 8, wx + 10, wy, hex('#2a2a34')); R.pset(wx + 9, wy - 7, pulsa ? hex('#ff5a4a') : hex('#c8303a')); R.pset(wx + 9, wy - 4, hex('#8a8a9a')); }
};
// ── utilidades de los planos 2–5 ──
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], b4 = (x, y) => (B4[((y & 3) << 2) | (x & 3)] + 0.5) / 16;
// un tono de la lista con trama ordenada entre dos vecinos (v 0–1)
const rampa = (cs, v, x, y) => { const f = Math.max(0, Math.min(0.999, v)) * (cs.length - 1), i = Math.floor(f); return (f - i > b4(x, y)) ? cs[i + 1] : cs[i]; };
// rectángulo que respeta R.recorte (R.rect no lo respeta)
const rc = (x0, y0, x1, y1, c) => { for (let y = y0; y <= y1; y++) R.linea(x0, y, x1, y, c); };
// luz que tiñe lo que ya hay (sin tapar la textura): disco de radio r con caída suave
const luzSobre = (cx, cy, r, col, a, ry = r) => { for (let y = Math.max(0, Math.round(cy - ry)); y <= Math.min(179, Math.round(cy + ry)); y++) for (let x = Math.max(0, Math.round(cx - r)); x <= Math.min(319, Math.round(cx + r)); x++) {
  const d = Math.hypot((x - cx) / r, (y - cy) / ry); if (d >= 1) continue; const f = a * (1 - d) * (1 - d); if (f > b4(x, y) * 0.06) R.pset(x, y, mez(R.pget(x, y), col, f)); } };

// la ciudad bajo la lluvia por una ventana, recortada a su hueco: cielo tramado con nubes de tres tonos a tres velocidades
// (iluminadas por debajo por la ciudad), tres términos de edificios (lejos con bruma; en medio con cornisa, cara en sombra,
// ventanas que se encienden y se apagan, depósitos de agua y antenas con su luz roja; de cerca, con s > 1, más grandes y con
// rótulos de neón en barras) y la lluvia. s: escala; quieto: [x0, y0, x1, y1] sin nada llamativo (la esquina de Atom)
const CIELO = ['#06081a', '#0a0e24', '#10142e', '#181a38', '#222242', '#2e2a4a'].map(hex);
const NUBE = [['#0c0e22', '#141630', '#1e1e3a'], ['#141630', '#22223e', '#34304e'], ['#1e1e3a', '#302c4a', '#4a3e5a']].map((l) => l.map(hex));
const lluviaCiudad = (t, x0, y0, x1, y1, s = 1, quieto = null) => {
  R.recorte([x0, y0, x1, y1]);
  const W = x1 - x0, Hh = y1 - y0, enQ = (x, y) => quieto && x >= quieto[0] - 6 && x <= quieto[2] && y <= quieto[3] + 6;
  for (let y = y0; y <= y1; y++) { const v = (y - y0) / Hh; for (let x = x0; x <= x1; x++) R.pset(x, y, rampa(CIELO, v * 0.92, x, y)); }
  // las nubes: tres capas, cada una a su velocidad; la de delante, la más clara
  for (let L = 0; L < 3; L++) for (let k = 0; k < 5; k++) {
    const cx = x0 + ((hh(k, L, 31) * (W + 80) + t * (1.2 + L * 1.8) * s) % (W + 80)) - 40, cy = y0 + Hh * (0.08 + hh(k, L, 32) * 0.32 + L * 0.06), r = (5 + hh(k, L, 33) * 6) * s;
    const tono = enQ(cx, cy) ? NUBE[0] : NUBE[L];
    for (let j = 0; j < 4; j++) { const dx = (j - 1.5) * r * 0.9, dy = (j % 2) * r * 0.25; R.disco(Math.round(cx + dx), Math.round(cy + dy + 1), r * 0.75, tono[0]); }
    for (let j = 0; j < 4; j++) { const dx = (j - 1.5) * r * 0.9, dy = (j % 2) * r * 0.25; R.disco(Math.round(cx + dx), Math.round(cy + dy - 1), r * 0.65, tono[1]); }
    for (let j = 1; j < 3; j++) { const dx = (j - 1.5) * r * 0.9; R.disco(Math.round(cx + dx), Math.round(cy - r * 0.35), r * 0.4, tono[2]); }
  }
  // los tres términos de edificios
  for (let L = 0; L < (s > 1.2 ? 3 : 2); L++) {
    let bx = x0 - 6 - Math.floor(hh(L, 1, 40) * 10);
    for (let k = 0; bx < x1 + 4; k++) {
      const w = Math.round((L === 0 ? 10 + hh(k, L, 41) * 12 : L === 1 ? 16 + hh(k, L, 41) * 14 : 30 + hh(k, L, 41) * 20) * s * (L === 2 ? 0.7 : 1));
      const bh = Math.round(Hh * (L === 0 ? 0.35 + hh(k, L, 42) * 0.3 : L === 1 ? 0.25 + hh(k, L, 42) * 0.38 : 0.18 + hh(k, L, 42) * 0.2)), top = y1 - bh;
      const cuerpo = hex(['#1a1c38', '#0e1128', '#080a18'][L]), luzC = hex(['#22264a', '#1c2242', '#141a30'][L]), sombra = hex(['#151732', '#080a1a', '#04050e'][L]);
      if (quieto && bx + w > quieto[0] - 4 && top < quieto[3] + 4) { bx += w + (L === 0 ? 1 : 3); continue; }   // nada alto detrás de Atom
      R.poligono([[bx, y1 + 1], [bx, top], [bx + w, top], [bx + w, y1 + 1]], cuerpo);
      const cara = Math.max(2, Math.round(w * 0.22)); R.poligono([[bx + w - cara, y1 + 1], [bx + w - cara, top + 1], [bx + w, top + 1], [bx + w, y1 + 1]], sombra);
      R.linea(bx, top, bx, y1, luzC); R.linea(bx - 1, top, bx + w + 1, top, luzC); R.linea(bx - 1, top - 1, bx + w + 1, top - 1, sombra);
      // el remate: depósito de agua, antena con luz roja o caseta
      const tipo = hh(k, L, 43);
      if (L > 0 && tipo > 0.62) { const dx = bx + Math.round(w * 0.3), dw = Math.round(5 * s); rc(dx, top - Math.round(6 * s), dx + dw, top - Math.round(3 * s), luzC); R.linea(dx, top - Math.round(6 * s), dx + dw, top - Math.round(6 * s), sombra); R.linea(dx + 1, top - Math.round(3 * s), dx + 1, top - 1, sombra); R.linea(dx + dw - 1, top - Math.round(3 * s), dx + dw - 1, top - 1, sombra); }
      else if (L > 0 && tipo > 0.35) { const ax = bx + Math.round(w * 0.6), ah = Math.round((6 + hh(k, L, 44) * 8) * s); R.linea(ax, top - ah, ax, top - 1, luzC); if (Math.sin(t * 3 + k) > 0.3) R.pset(ax, top - ah - 1, hex('#ff4a3a')); }
      // ventanas por plantas, con su marco; unas cálidas, otras frías, otras apagadas; alguna cambia
      const pw = Math.max(1, Math.round((L === 0 ? 1 : 2) * s)), ph = Math.max(1, Math.round((L === 0 ? 1 : 2) * s)), px = pw + Math.max(1, Math.round(s)) + (L === 2 ? 1 : 0), py = ph + Math.max(2, Math.round(2 * s));
      for (let wy = top + Math.round(3 * s), f = 0; wy < y1 - ph; wy += py, f++) {
        if (L > 0 && f % 4 === 3) R.linea(bx + 1, wy - 1, bx + w - cara, wy - 1, luzC);   // la cornisa de cada pocas plantas
        for (let wx = bx + 2, c = 0; wx < bx + w - cara - pw; wx += px, c++) {
          const r = hh(wx * 7 + k, wy, 45 + L) + (hh(c, f, 46 + k) > 0.92 ? Math.floor(t / 2.5 + c) % 2 * 0.5 : 0);
          const col = r > 0.86 ? hex('#8ac8e8') : r > 0.6 ? (L === 0 ? hex('#7a6a44') : hex('#e8c86a')) : r > 0.5 ? hex('#a87a3a') : (L === 0 ? null : hex('#0a0c1a'));
          if (col) for (let j = 0; j < ph; j++) for (let i = 0; i < pw; i++) R.pset(wx + i, wy + j, j === 0 && L > 0 && col !== hex('#0a0c1a') ? mez(col, 0xffffffff, 0.3) : col);
        }
      }
      // el rótulo de neón en barras (sin letras), de cerca
      if (L === 2 && hh(k, L, 47) > 0.4 && !enQ(bx + w / 2, top)) { const nx = bx + 4, ny = top + Math.round(8 * s), on = Math.sin(t * 6 + k * 2) > -0.7, nc = [hex('#ff5aa8'), hex('#5ae8e8'), hex('#e8e85a')][k % 3];
        for (let j = 0; j < 4; j++) R.linea(nx, ny + j * 4, nx + Math.round((6 + hh(j, k, 48) * 6) * s), ny + j * 4, on ? nc : mez(nc, 0xff000000, 0.6)); R.linea(nx - 2, ny - 2, nx - 2, ny + 14, mez(nc, 0xff000000, 0.4)); }
      bx += w + (L === 0 ? 1 : 2 + Math.floor(hh(k, L, 49) * 6));
    }
    // la bruma entre términos
    if (L === 0) for (let y = y1 - Math.round(Hh * 0.25); y <= y1; y++) for (let x = x0; x <= x1; x++) if (b4(x, y) < 0.25) R.pset(x, y, mez(R.pget(x, y), hex('#2a2a48'), 0.4));
  }
  // la lluvia en dos términos
  const n = Math.round(W * Hh / 260);
  for (let k = 0; k < n; k++) { const cerca = k % 3 === 0, lx = x0 + ((hh(k, 5) * W + t * 6) % W), ly = y0 + ((hh(k, 6) * Hh + t * (cerca ? 120 : 80)) % Hh), lg = cerca ? Math.round(5 * s) : 3;
    R.linea(Math.round(lx), Math.round(ly), Math.round(lx - 1), Math.round(ly + lg), cerca ? hex('#7a8ab8') : hex('#4a5680')); }
  R.recorte(null);
};
const destello = (t) => Math.floor(t * 0.7) % 5 === 0 && (t % 1.43) < 0.08;   // el relámpago de vez en cuando

// 2 · otra habitación, de noche: el dormitorio en penumbra con la tele pequeña sobre una cómoda de cajones; corren los
// créditos y, en «Wundagore», vuelve la montaña en ruinas (la imagen se acerca despacio); la luz de la tele parpadea en el
// papel pintado, llueve en la ventana de cortinas y el gato que dormía sobre el brazo del sillón se despereza y se sienta a mirar
const BUF2 = R.nuevo(), BUFT = R.nuevo(); let cuartoOK = false;
const TV = [104, 58, 196, 107];
