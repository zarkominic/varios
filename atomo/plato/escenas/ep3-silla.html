<script type="module">
// EPISODIO 3 · ep3-silla (frases 40–42, sin cartela). Plastilina adulta + kits/ep03-tocar.js (multitud, cucharilla,
// terrón, cajón, silla y chispas). Los electrones de la frontera son una pieza propia de esta página ('cuenta': cuentas
// de ámbar como las de Atom, una sola pieza con repetición, fotografiada al cargar y repetida en 2D).
//  0           (= último fotograma de ep3-casa) la persona de pie en el centro, «mirarse las manos» con fantasma 1, la
//              cabeza vuelta hacia Atom, que le da la palmadita en el brazo derecho; regla en 10⁻¹⁰
//  humanidad   GENERAL. Atom retira la mano y saca una cucharilla; detrás de ella y a sus lados brota la humanidad (una
//              multitud de figuritas que crecen del suelo; por encima de los subtítulos) mientras sus manos vuelven a ser
//              opacas (fantasma 1 → 0); ella mira la cucharilla; la multitud entera (en 3D) se levanta del suelo, se
//              inclina hacia la cámara girando como un remolino y se encoge por un arco hasta la cucharilla: un terrón
//              diminuto que destella
//  ½ humanidad DETALLE (corte, 3,0 s). Atom, la cucharilla con el terrón y debajo una cómoda de nogal con el cajón
//              abierto; Atom inclina la cucharilla, el terrón cae dentro y el cajón se cierra (a mitad de frase); Atom
//              vuelve a su sitio, abajo a la izquierda, y la cucharilla se encoge hasta desaparecer; hasta el final de la
//              frase («… cabría en un terrón de azúcar») la cámara se acerca despacio al cajón cerrado y por su rendija se
//              escapa una luz cálida
//  silla       GENERAL (corte en el silencio entre las frases 40 y 41). La persona de pie, de tres cuartos; la silla llega
//              deslizándose por detrás, ella se sienta (sentada en la marca) y aparece un «?» de arcilla encima de su
//              regazo, delante de ella, que ella mira
//  repelen     DETALLE: el «?» se va; empuje 2D hasta la frontera entre su muslo y el asiento, que se gira hasta quedar
//              en horizontal y se funde (entera y opaca, de una vez) con la vista atómica: arriba los átomos de la
//              persona (nubes caqui con sus electrones), abajo los de la silla (nubes de haya); el lado de arriba baja,
//              rebota y se queda a un hueco finísimo, con chispitas y un cojín de luz
//  ½ repelen   antes de la mitad, las capas de atrás se apagan y llegan electrones de atrás (con estela) que se meten
//              encima de los de la fila de delante: cada pareja se aplasta, tiembla y se pone al rojo; a mitad de frase se
//              apartan (uno se queda, el otro va a la segunda capa), como gente en un ascensor lleno; luego la cámara se
//              aparta (otro encuadre, más frontera) y todo se calma y queda quieto
// Coste: lo quieto es foto (la regla, la persona con la multitud y sin ella, la cómoda abierta y cerrada, la persona
// sentada, las cuentas y las nubes); en cada fotograma se dibuja vivo solo lo que se mueve. En el primer general, desde
// el fotograma 1, por capas: la foto del plató con la sombra de ella, la multitud viva (mientras brota y mientras
// vuela; radio 2,8), la foto de su cuerpo y su cabeza y sus manos vivas. La vista atómica es 2D con las fotos de las cuentas (8
// variantes que se alternan cada fotograma: «hierven») y las chispas del kit, vivas.
//
// CONTINUIDAD (cámara del plató de las pruebas: pos [0, 3,8, 15,5], mira [0, 2,3, 0], fov 28, sin recorte 2D)
//  · Fotograma 0: el último de ep3-casa (window.__fin de ep3-casa): PERSONA_F (pos [P.punto(950, 600, 2)[0], 3, 2],
//    escala 3, rot [0, 0,1, 0]) con su POSE_F ('mirarse las manos' de ep3-casa, fantasma 1, cabeza [−0,45, 0,25, 0,06] y
//    mirada [−0,6, −0,3]) y el halo frío de las manos; Atom en ATOMO_F (su hombro derecho − [1,12, 0,05, −0,6]), escala
//    0,4, con la mano del electrón 0 en el brazo de ella; regla REG (P.regla con e −9, ya 0,375, actual y marca −10,
//    lupa 0,5, pos P.punto(1668, 528, 0,4), escala 1,42, rot [0, −0,12, 0]). Los tiempos de ep3-casa salen de
//    marcas-ep03.json (con los de ahora si no se puede leer). Los rótulos de la regla se hornean con Jost cargada
//    (cargarFuenteCartela antes de crearPlato, como en las escenas con cartela).
//  · Último fotograma (ep3-gato empieza así): la vista atómica con Z = 240 px por distancia entre átomos, el hueco en
//    horizontal por el centro (y = 540 px; 0,32 de alto: 77 px entre las caras de las cuentas), los electrones de cada
//    lado en dos capas (la de delante cada 0,5 a ±0,26 del centro del hueco; la segunda, cada 1 y desplazada 0,25, a
//    ±0,62), nubes caqui arriba y de haya abajo, chispitas en el hueco; regla en 10⁻¹⁰; Atom en SITIO
//    (P.punto(230, 780, 1)), escala 0,37, con un velo oscuro detrás. window.__fin lo da en números.
import * as THREE from 'three';
import { escena } from '/atomo/plato/escena.js';
import { crearPlato, crearPost, cargarFuenteCartela, cl, mix, prog, ss, eio, eoc, eic, eob, azar, postura, mezclarPosturas, COLOR } from '/atomo/plato/kits/plastilina-adulta.js';
import { tiposTocar, multitud, cucharilla, terron, cajon, silla, sillaPara, chispas, foto, nubeElectrones, mundoPieza } from '/atomo/plato/kits/ep03-tocar.js';

const E = await escena('ep3-silla', 'ep03');
const D = E.duracion;
const M = (k) => E.marca(k);
const m = { h: M('humanidad'), hF: M('humanidad_fin'), s: M('silla'), sF: M('silla_fin'), r: M('repelen'), rF: M('repelen_fin') };
const QUIETO = D - 0.6;
window.__carga = [['inicio', Math.round(performance.now())]];
const W = 1920, H = 1080;

// tiempos de ep3-casa (para que el fotograma 0 sea su último)
let CASA = { duracion: 21.381, marcas: { tutambien: 15.886, tutambien_fin: 16.719 } };
try {
  const todas = await (await fetch('/atomo/plato/escenas/marcas-ep03.json')).json();
  if (todas['ep3-casa']?.marcas?.tutambien) CASA = todas['ep3-casa'];
} catch { /* se quedan los de arriba */ }

// ---------------------------------------------------------------- tiempos (todos salen de las marcas)
const mitad1 = m.h + 0.5 * (m.hF - m.h);       // «… la humanidad entera cabría…»: el terrón se guarda
const mitad3 = m.r + 0.5 * (m.rF - m.r);       // «… una regla cuántica…»: los electrones se apartan
const T = {
  suelta: [0.12, 0.95],                        // Atom retira la mano del brazo y la lleva a la cucharilla
  cuchara: [0.62, 0.95],                       // la cucharilla aparece en su mano
  multitud: [m.h - 0.2, m.h + 0.98],           // brota la humanidad
  fantasma: [m.h - 0.1, m.h + 0.95],           // las manos vuelven a ser opacas
  mirada1: [0.22, 0.75],                       // ella deja de mirar a Atom y mira la multitud
  mirada2: [m.h + 0.5, m.h + 0.98],            // … y la cucharilla
  lleno: m.h + 1.0,                            // desde aquí la persona y la multitud están quietas (foto)
  comprime: [m.h + 1.15, m.h + 2.05],          // la multitud entera se levanta girando y se encoge en la cucharilla
  terron: [m.h + 1.98, m.h + 2.16],            // el terrón aparece, con un destello
  corte1: mitad1 - 0.88,                       // DETALLE: la cucharilla y la cómoda
  acerca: [mitad1 - 0.84, mitad1 - 0.42],      // Atom lleva la cucharilla sobre el cajón
  inclina: [mitad1 - 0.5, mitad1 - 0.28],      // la inclina
  cae: [mitad1 - 0.32, mitad1 + 0.02],         // el terrón cae dentro (a mitad de frase)
  endereza: [mitad1 + 0.02, mitad1 + 0.35],
  cierra: [mitad1 + 0.02, mitad1 + 0.45],      // el cajón se cierra
  vuelve: [mitad1 + 0.5, mitad1 + 1.35],       // Atom vuelve a su sitio; la cucharilla se encoge
  // (el cajón cerrado se queda hasta el final de la frase 40: «… cabría en un terrón de azúcar»; la cámara se le
  // acerca despacio y por la rendija se escapa la luz cálida de la humanidad guardada)
  corte2: m.hF + 0.05,                         // GENERAL de la silla, en el silencio entre las frases 40 y 41
  sillaEntra: [m.s - 0.55, m.s - 0.3],         // la silla llega deslizándose por detrás de ella
  sienta: [m.s - 0.48, m.s - 0.04],            // se sienta (completa en la marca)
  interroga: [m.s - 0.04, m.s + 0.3],          // el «?», sobre su regazo
  miraInt: [m.s + 0.2, m.s + 0.65],            // ella lo mira
  interrogaFuera: [m.r - 1.05, m.r - 0.82],    // el «?» se va antes del empuje
  empuje: [m.r - 0.8, m.r - 0.05],             // empuje 2D hasta la frontera (completo en la marca)
  baja3: [m.r - 0.1, m.r + 0.8],               // el lado de la persona baja y rebota en el hueco
  amontona: [mitad3 - 1.0, mitad3 - 0.12],     // llegan electrones de atrás y se amontonan en la fila de delante
  aparta: [mitad3, mitad3 + 0.9],              // a mitad de frase se apartan para no amontonarse
  aleja: [mitad3 + 0.35, mitad3 + 1.45],       // otro encuadre: la cámara se aparta (y se ve más frontera)
  calma: [mitad3 + 0.5, mitad3 + 1.5],         // las capas de atrás vuelven a encenderse
};
T.fotoSentada = T.miraInt[1] + 0.1;            // desde aquí la persona sentada está quieta (foto)

// ---------------------------------------------------------------- la cuenta (electrón): pieza propia
// ocho cuentas de ámbar en fila (x = −3,5 … 3,5, radio 0,42), cada una con su relieve: las variantes de un electrón
const GLSL_CUENTA = /* glsl */`
const vec3 CE_ELEC = vec3(0.36, 0.095, 0.01);
float ceUna(vec3 p, float k) {
  float d = length(p) - 0.42;
  d += 0.022 * (vnoise(p * 4.5 + k * 7.31) - 0.5) + 0.009 * (vnoise(p * 12.0 + k * 3.7) - 0.5);
  return d;
}
float pz_cuenta(vec3 q, vec4 T, out float m) {
  m = 0.0;
  float k = clamp(floor(q.x + 4.0), 0.0, 7.0);
  float d = ceUna(q - vec3(k - 3.5, 0.0, 0.0), k);
  float k2 = clamp(k + (q.x + 4.0 - k > 0.5 ? 1.0 : -1.0), 0.0, 7.0);
  d = min(d, ceUna(q - vec3(k2 - 3.5, 0.0, 0.0), k2));
  return d * 0.9;
}
float pzc_cuenta(vec3 q, vec4 T) { return 1e5; }
vec3 pzcol_cuenta(vec3 q, vec4 T, float m) {
  gEm = CE_ELEC * 0.75; gBri = 1.97;
  return CE_ELEC * (0.95 + 0.1 * vnoise(q * 6.0));
}
`;
const CUENTA = { radio: 4.05, glifos: [], glsl: GLSL_CUENTA };

// ---------------------------------------------------------------- plató
// (los rótulos de la regla se hornean con Jost ya cargada, como en ep3-casa, que la carga con su cartela)
await cargarFuenteCartela();
const I = { REG: 0, FLE: 1, HUM: 2, MUL: 3, CUC: 4, TER: 5, CAJ: 6, SIL: 7, CH1: 8, CH2: 9, INT: 10, CUE: 11 };
const P = await crearPlato({
  piezas: ['reglaA', 'flecha', 'humano', 'multitud', 'cucharilla', 'terron', 'cajon', 'silla', 'chispas', 'chispas', 'glifo:?', 'cuenta'],
  tiposExtra: { ...tiposTocar(['multitud', 'cucharilla', 'terron', 'cajon', 'silla', 'chispas']), cuenta: CUENTA },
  alfa: true, post: false, mano: true,
  sombraFondo: ['p2', 'p6', 'p7'],   // la persona, la cómoda y la silla (Atom va en otra pasada, sin sombra, como en ep3-casa)
  camara: { pos: [0, 3.8, 15.5], mira: [0, 2.3, 0], fov: 28, desenfoque: 44 },
});
const POST = crearPost();
window.__carga.push(['plató', Math.round(performance.now())]);
const en = (sx, sy, z) => P.punto(sx, sy, z);
const pant = (p) => P.proyectar(p);
const pxPorUnidad = (z) => { const a = en(960, 540, z); return pant([a[0] + 1, a[1], z])[0] - pant(a)[0]; };
const sumar = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const restar = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mezclar3 = (a, b, u) => [mix(a[0], b[0], u), mix(a[1], b[1], u), mix(a[2], b[2], u)];
// punto del mundo del punto local l de una pieza colocada con { pos, escala, rot } (euler YXZ, como el kit)
const enPieza = (o, l) => mundoPieza(o, l);
// pos para que el punto local l de la pieza caiga en el punto del mundo w
const posPara = (o, l, w) => restar(w, mundoPieza({ ...o, pos: [0, 0, 0] }, l));

// regla (la de ep3-casa, en 10⁻¹⁰): una foto
const E_REG = 1.42, REG = en(1668, 528, 0.4);
const REGLA = { pieza: I.REG, flecha: I.FLE, pos: REG, escala: E_REG, rot: [0, -0.12, 0], e: -9, ya: 0.375, lupa: 0.5, actual: -10, marca: -10 };
// Atom: su sitio de presentador (abajo a la izquierda, ~180 px)
const A_Z = 1.0, A_ESC = 0.37, SITIO = en(230, 780, A_Z);

// ---------------------------------------------------------------- capa 2D
const cont = document.getElementById('escena');
const lienzoGL = P.renderer.domElement;
const capa = document.createElement('canvas');
capa.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;display:block';
cont.appendChild(capa);
const g = capa.getContext('2d');
function ajustarCapa() {
  if (capa.width !== lienzoGL.width || capa.height !== lienzoGL.height) { capa.width = lienzoGL.width; capa.height = lienzoGL.height; }
  const k = capa.width / W; g.setTransform(k, 0, 0, k, 0, 0);
}
const pegarGL = (alfa = 1) => { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = alfa; g.drawImage(lienzoGL, 0, 0); g.restore(); };
const pintar = (f) => g.drawImage(f, 0, 0, W, H);
function parpadeo(n) {
  const f = azar(n, 3) - 0.5;
  g.fillStyle = f > 0 ? `rgba(255,236,210,${f * 0.03})` : `rgba(0,0,6,${-f * 0.04})`; g.fillRect(0, 0, W, H);
}
function brillo(p, R, a, color = '255,190,110') {
  if (a <= 0.003 || !p) return;
  g.save(); g.globalCompositeOperation = 'lighter';
  const gr = g.createRadialGradient(p[0], p[1], 0, p[0], p[1], R);
  gr.addColorStop(0, `rgba(${color},${a})`); gr.addColorStop(0.35, `rgba(${color},${a * 0.32})`); gr.addColorStop(1, `rgba(${color},0)`);
  g.fillStyle = gr; g.fillRect(p[0] - R, p[1] - R, 2 * R, 2 * R);
  g.restore();
}
// un punto de luz pequeño, ya pintado (para muchas estelas sin crear degradados)
const CHISPA2D = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const gc = c.getContext('2d'), gr = gc.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,214,150,1)'); gr.addColorStop(0.3, 'rgba(250,170,90,0.35)'); gr.addColorStop(1, 'rgba(240,150,70,0)');
  gc.fillStyle = gr; gc.fillRect(0, 0, 64, 64);
  return c;
})();

// ---------------------------------------------------------------- la persona
// fotograma 0 = último de ep3-casa: su 'mirarse las manos' (las manos algo más altas y las palmas hacia la cara),
// fantasma 1, la cabeza y la mirada hacia Atom
const BRAZO_MIRAR = [0.87, 0.14, 0.38, 1.6, -1.25, -0.6];
const POSE_MANOS = { ...postura('manos'), cabeza: [0, 0.42, 0], brazoIzq: [...BRAZO_MIRAR], brazoDer: [...BRAZO_MIRAR] };
const PERSONA_F = { pos: [en(950, 600, 2)[0], 3.0, 2.0], escala: 3.0, rot: [0, 0.1, 0] };
const DC = CASA.duracion, QC = DC - 0.6, TSC = Math.floor((DC - 0.3) * 12 + 1e-6) / 12, TZC = Math.min(TSC, QC);
const MANO_C = 0.08 * Math.sin((TZC - CASA.marcas.tutambien) * 1.3) * ss(CASA.marcas.tutambien_fin, CASA.marcas.tutambien_fin + 0.6, TZC);
const POSE_0 = { ...POSE_MANOS, fantasma: 1, ojos: 1, cabeza: [-0.45, 0.25, 0.06], mirada: [-0.6, -0.3],
  brazoIzq: [...BRAZO_MIRAR], brazoDer: [...BRAZO_MIRAR] };
POSE_0.brazoIzq[4] += MANO_C; POSE_0.brazoDer[4] -= MANO_C;
const RESP_0 = 0.006 * Math.sin(TZC * 2.2);
// después mira la multitud (abajo) y luego la cucharilla de Atom (a su derecha, abajo)
const CABEZA_1 = [-0.05, 0.55, 0], MIRADA_1 = [0, -1];
const CABEZA_2 = [-0.62, 0.4, 0.06], MIRADA_2 = [-0.85, -0.55];
const mix3 = (a, b, u) => a.map((v, i) => mix(v, b[i], u));
function poseG1(ts) {
  const p = { ...POSE_0, brazoIzq: [...POSE_0.brazoIzq], brazoDer: [...POSE_0.brazoDer] };
  p.fantasma = 1 - ss(T.fantasma[0], T.fantasma[1], ts);
  const k1 = eio(prog(ts, T.mirada1[0], T.mirada1[1])), k2 = eio(prog(ts, T.mirada2[0], T.mirada2[1]));
  p.cabeza = mix3(mix3(POSE_0.cabeza, CABEZA_1, k1), CABEZA_2, k2);
  p.mirada = mix3(mix3(POSE_0.mirada, MIRADA_1, k1), MIRADA_2, k2);
  // parpadea una vez al mirar la cucharilla
  p.ojos = 1 - 0.9 * Math.max(0, 1 - Math.abs(ts - (T.mirada2[0] + 0.05)) / 0.09);
  return p;
}
const HUELLA = [0.37, 0.21, 0];
function personaG1(ts, partes = null) {
  // (coste) el cuerpo es una foto ('cuerpoG1') desde el fotograma 1: contiene la respiración (la del fotograma 0, el
  // último de ep3-casa) y solo se mueven la cabeza, la mirada y las manos (el fantasma); quieta desde T.lleno
  const tz = Math.min(ts, T.lleno);
  return P.pieza(I.HUM, { ...PERSONA_F, sq: [1, 1 + RESP_0, 1], postura: poseG1(tz), aspecto: 'adulto', t: TSC + tz, huellaFija: HUELLA, partes });
}
// el halo frío de las manos casi transparentes (el de ep3-casa en su plano general: × 1,9 de fuerza, × 1,35 de radio)
function haloManos(h, kf, ts) {
  if (kf <= 0.01) return;
  g.save(); g.globalCompositeOperation = 'lighter';
  for (const lado of ['Izq', 'Der']) {
    const pm = pant(h.punto('mano' + lado)), pw = pant(h.punto('muneca' + lado)), pd = pant(h.punto('dedos' + lado));
    const R = 1.5 * 1.35 * Math.hypot(pd[0] - pw[0], pd[1] - pw[1]);
    const pulso = 0.85 + 0.15 * Math.sin((QC + ts) * 2.6 + (lado === 'Izq' ? 0 : 1.7));
    const gr = g.createRadialGradient(pm[0], pm[1], 0, pm[0], pm[1], R);
    gr.addColorStop(0, `rgba(170,205,255,${0.16 * 1.9 * kf * pulso})`); gr.addColorStop(0.55, `rgba(140,180,240,${0.07 * 1.9 * kf * pulso})`); gr.addColorStop(1, 'rgba(120,160,230,0)');
    g.fillStyle = gr; g.fillRect(pm[0] - R, pm[1] - R, 2 * R, 2 * R);
  }
  g.restore();
}

// ---------------------------------------------------------------- Atom
// su reloj sigue el de ep3-casa (allí acabó parado): los electrones y el balanceo arrancan suaves
const calmaC = (t) => { const a = QC - 0.9; if (t <= a) return t; const u = Math.min(t - a, 0.9); return a + u - (u * u) / 1.8; };
const TZ_A0 = calmaC(TSC), TA_A0 = TZ_A0;   // (en ep3-casa, su reloj de electrones y el de balanceo valen lo mismo al final)
const DT = 1 / 240, RELOJ = [0];
const velA = (t) => ss(0.08, 0.8, t) * (1 - eio(prog(t, QUIETO - 0.9, QUIETO)));
for (let i = 1; i * DT <= D + 0.2; i++) RELOJ.push(RELOJ[i - 1] + velA((i - 0.5) * DT) * DT);
const reloj = (t) => { const x = t / DT, i = Math.min(RELOJ.length - 2, Math.floor(x)); return mix(RELOJ[i], RELOJ[i + 1], x - i); };
// dibuja Atom: pos, escala y la mano del electrón 0 (punto del mundo o null) con su mezcla
function atomo(ts, { pos, esc, mano = null, km = 0, energiaExtra = 0, roll = 0 }) {
  const r = reloj(ts), tz = TZ_A0 + r, ta = TA_A0 + r;
  const en0 = ts < QUIETO ? E.energia(ts) : 0;
  const bote = 0.025 * Math.sin(tz * 1.1);
  const electrones = [];
  if (mano && km > 0.001) electrones[0] = { mundo: restar(mano, pos), mezcla: eio(km), brazo: km, grosor: 0.055, mano: km, tamMano: 0.3 };
  P.atomo({ pos: [pos[0], pos[1] + bote, pos[2]], escala: esc, yaw: -0.15 + 0.08 * Math.sin(tz * 0.5), pitch: 0.06, roll,
    energia: Math.min(1, en0 + energiaExtra), ts: ta, electrones, toque: km > 0.05 });
  return [pos[0], pos[1] + bote, pos[2]];
}

    const bl = Math.min(10, Math.max(0, (s - 1.5) * 1.2));
    if (bl > 0.3) g.filter = `blur(${(bl / s).toFixed(2)}px)`;
    pintar(F('sentada'));
    g.filter = 'none';
    g.restore();
    alfa = ss(0.45, 0.9, up);
    Z = MI.Z4 * s / SMAX;
    O = q;
    if (alfa > 0.001) {
      // la vista atómica, entera y opaca en un lienzo aparte (con su giro), y fundida de una vez sobre la foto
      const c = lienzoAparte();
      c.translate(q[0], q[1]); c.rotate(giro * (1 - alfa)); c.translate(-q[0], -q[1]);
      vistaAtomica(c, n, ts, { O, Z });
      g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = alfa; g.drawImage(APARTE, 0, 0); g.restore();
    }
  } else {
    vistaAtomica(g, n, ts, { O, Z });
  }
  // chispas vivas en el hueco
  const fz = alfa * (0.55 + 0.45 * ss(T.baja3[0] + 0.25, T.baja3[0] + 0.5, ts)) * ss(T.empuje[1] - 0.25, T.empuje[1] + 0.1, ts);
  const yH = O[1] + caida(ts) * 0.5 * Z;
  if (fz > 0.01) {
    P.limpiar();
    ponerChispas(n, ts, yH, fz);
    P.render(n, { fondo: false });
    pegarGL();
    resplandor(yH, 120, fz);
  }
  // Atom, con un velo oscuro detrás (se lee sobre los electrones)
  const sa = pant(SITIO);
  g.save();
  const gr = g.createRadialGradient(sa[0], sa[1], 40, sa[0], sa[1], 230);
  gr.addColorStop(0, `rgba(8,6,5,${0.62 * alfa})`); gr.addColorStop(1, 'rgba(8,6,5,0)');
  g.fillStyle = gr; g.fillRect(sa[0] - 230, sa[1] - 230, 460, 460);
  g.restore();
  P.limpiar();
  atomo(ts, { pos: SITIO, esc: A_ESC });
  P.render(n, { fondo: false });
  pegarGL();
  parpadeo(n);
}

// ---------------------------------------------------------------- fotos
const HACER = {
  regla() { P.limpiar(); P.regla(REGLA); P.render(3010, { fondo: false }); return foto(P); },
  // el plató del general con la sombra de ella, sin dibujarla (partes: []; la persona entera sigue dando sombra), y su
  // cuerpo sin la cabeza ni las manos, sobre transparente (las dos, al cargar; en la postura del fotograma 0)
  fondoG1() { P.limpiar(); personaG1(0, []); P.render(3012); return foto(P); },
  cuerpoG1() { P.limpiar(); personaG1(0, ['cuerpo']); P.render(3012, { fondo: false }); return foto(P); },
  // la persona del general, quieta, con la multitud y sin ella: sobre 'fondoG1', como los fotogramas vivos
  lleno() { const base = F('fondoG1'); P.limpiar(); personaG1(T.lleno); multitud(P, I.MUL, { ...MULT, aparicion: 1 }); P.render(3012, { fondo: false }); return sobre(base); },
  personaG1() { const base = F('fondoG1'); P.limpiar(); personaG1(T.lleno); P.render(3012, { fondo: false }); return sobre(base); },
  // la cómoda, abierta y cerrada (con el fondo y su sombra)
  cajonAbierto() { P.limpiar(); cajon(P, I.CAJ, { ...CAJ2, abierto: 1 }); P.render(3013); return foto(P); },
  cajonCerrado() { P.limpiar(); cajon(P, I.CAJ, { ...CAJ2, abierto: 0 }); P.render(3014); return foto(P); },
  // la persona sentada con la silla (sin el «?» ni Atom)
  // las cuentas y las nubes de la vista atómica (fotos 2D)
  cuentas() { hacerCuentas(); return true; },
  nubes() { hacerNubes(); return true; },
  sentada() {
    P.limpiar();
    const tz = T.fotoSentada;
    P.pieza(I.HUM, { ...PERSONA_3, sq: [1, 1 + 0.006 * Math.sin(tz * 2.2), 1], postura: poseG3(tz), aspecto: 'adulto', t: tz, huellaFija: HUELLA });
    sillaG3(tz);
    P.render(4001);
    return foto(P);
  },
};
const FOTOS = {};
// una foto hecha encima de otra: la de abajo y lo que acaba de dibujar P.render(…, { fondo: false })
function sobre(base) {
  const c = document.createElement('canvas'); c.width = lienzoGL.width; c.height = lienzoGL.height;
  const gc = c.getContext('2d'); gc.drawImage(base, 0, 0, c.width, c.height); gc.drawImage(lienzoGL, 0, 0);
  return c;
}
let hechasAhora = 0;
function F(nombre) { if (!FOTOS[nombre]) { FOTOS[nombre] = HACER[nombre](); hechasAhora++; } return FOTOS[nombre]; }
// al cargar: la regla, la multitud, las cuentas y las nubes; el estreno de la persona y de Atom con su mano
P.fotograma(0);
F('regla');
window.__carga.push(['regla', Math.round(performance.now())]);
F('fondoG1'); F('cuerpoG1');
window.__carga.push(['fondo y cuerpo del general', Math.round(performance.now())]);
P.limpiar(); P.pieza(I.HUM, { pos: [0, 0.2, -2], escala: 0.2, postura: { ...POSE_0 }, aspecto: 'adulto' }); P.render(3020, { fondo: false });
P.limpiar(); P.atomo({ pos: [0, 0.3, -2], escala: 0.05, electrones: [{ pos: [2, 0, 0], mezcla: 1, brazo: 1, mano: 1 }] }); P.render(3021, { fondo: false });
window.__carga.push(['persona y Atom', Math.round(performance.now())]);
// (coste) el estreno de las piezas que salen vivas (multitud, cucharilla, terrón, silla, chispas y «?»): diminutas y
// fuera de cuadro, para que SwiftShader compile sus programas al cargar y no en su primer fotograma
P.limpiar();
multitud(P, I.MUL, { pos: [0, 0.2, -2], escala: 0.02, radio: MULT.radio, aparicion: 1, semilla: 3 });
cucharilla(P, I.CUC, { pos: [0.3, 0.3, -2], escala: 0.05 });
terron(P, I.TER, { pos: [0.6, 0.3, -2], escala: 0.05 });
silla(P, I.SIL, { pos: [-0.3, 0.3, -2], escala: 0.05 });
chispas(P, I.CH1, { pos: [-0.6, 0.3, -2], escala: 0.05, n: 8, semilla: 1 });
chispas(P, I.CH2, { pos: [-0.9, 0.3, -2], escala: 0.05, n: 8, semilla: 2 });
P.pieza(I.INT, { pos: [0.9, 0.3, -2], escala: 0.05, color: COLOR.MOSTAZA });
P.render(3022, { fondo: false });
P.limpiar();
window.__carga.push(['estreno de las piezas', Math.round(performance.now())]);

// (coste) las fotos que no se hacen al cargar se preparan en un fotograma barato poco antes de hacer falta (en orden,
// como renderiza render-escenas.mjs): [desde, foto, hasta]. Al final de cada fotograma que no haya tenido que hacer
// ninguna foto al pedirla, se hace como mucho UNA (va al lienzo de WebGL, que queda debajo de la capa 2D: no se ve)
const PREPARAR = [
  [0.05, 'personaG1', T.comprime[1]],
  [T.lleno + 0.05, 'cajonAbierto', T.cae[0]], [T.corte1 + 0.05, 'cajonCerrado', T.corte2],
  [T.fotoSentada + 0.05, 'cuentas', D], [T.fotoSentada + 0.05, 'nubes', D],
];

// ---------------------------------------------------------------- fotograma
function dibujar(t) {
  const n = P.fotograma(t, D), ts = n / 12;
  ajustarCapa();
  hechasAhora = 0;
  if (ts < T.corte1) planoG1(n, ts);
  else if (ts < T.corte2) planoD2(n, ts);
  else if (ts < T.empuje[0]) planoG3(n, ts);
  else planoMicro(n, ts);
  P.fotograma(t, D);
  pintar(F('regla'));
  POST.aplicar(g, n);
  if (!hechasAhora) {
    const pendiente = PREPARAR.find(([t0, nombre, t1]) => ts >= t0 && ts < t1 && !FOTOS[nombre]);
    if (pendiente) F(pendiente[1]);
  }
}
window.__fin = { Z: MI.Z5, O: [960, 540], HUECO: MI.HUECO, RE: MI.RE, Y_DEL, Y_SEG, Y_AT, SITIO, A_ESC, REGLA: { ...REGLA, pieza: undefined, flecha: undefined },
  ATOMO_F, PERSONA_F, POSE_0, PERSONA_3, SILLA3, CONTACTO, ANG_CONTACTO, T };
E.iniciar(dibujar, { paso: 1 / 12 });
</script>
