<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// EPISODIO 3 · ep3-silla (frases 40–42, sin cartela). Plastilina adulta + kits/ep03-tocar.js (multitud, cucharilla,
// terrón, cajón, silla y chispas). Los electrones de la frontera son una pieza propia de esta página ('cuenta': cuentas
// de ámbar como las de Atom, una sola pieza con repetición, fotografiada al cargar y repetida en 2D).
//  0           (= último fotograma de ep3-casa) la persona de pie en el centro, «mirarse las manos» con fantasma 1, la
//              cabeza vuelta hacia Atom, que le da la palmadita en el brazo derecho; regla en 10⁻¹⁰
//  humanidad   GENERAL. Atom retira la mano y saca una cucharilla; alrededor de la persona brota la humanidad (una
//              multitud de figuritas que crecen del suelo) mientras sus manos vuelven a ser opacas (fantasma 1 → 0);
//              ella mira la cucharilla; la multitud se levanta en remolino y se comprime en ella: un terrón diminuto
//              que destella
//  ½ humanidad DETALLE (corte). Atom, la cucharilla con el terrón y debajo una cómoda de nogal con el cajón abierto;
//              Atom inclina la cucharilla, el terrón cae dentro y el cajón se cierra (a mitad de frase); Atom vuelve
//              a su sitio, abajo a la izquierda, y la cucharilla se encoge hasta desaparecer
//  silla       GENERAL (corte). La persona de pie, de tres cuartos; una silla entra deslizándose por detrás, ella se
//              sienta (sentada completa en la marca) y aparece un «?» de arcilla junto al asiento, que ella mira
//  repelen     DETALLE: el «?» se va; empuje 2D hasta la frontera entre su muslo y el asiento, que se gira hasta quedar
//              en horizontal y se funde con la vista atómica: arriba los átomos de la persona (nubes caqui con sus
//              electrones), abajo los de la silla (nubes de haya); el lado de arriba baja, rebota y se queda a un hueco
//              finísimo, con chispitas y un cojín de luz
//  ½ repelen   otro encuadre (la cámara se aparta un poco): llegan electrones de las capas de atrás y se amontonan
//              junto al hueco; a mitad de frase se apartan (uno se queda, el otro va a la segunda capa), como gente en
//              un ascensor lleno; queda quieto
// Coste: lo quieto es foto (la regla, la multitud entera con la persona, la persona sola, la cómoda abierta y cerrada,
// la persona sentada, las cuentas y las nubes); en cada fotograma se dibuja vivo solo lo que se mueve. La vista atómica
// es 2D con las fotos de las cuentas (8 variantes que se alternan cada fotograma: «hierven») y las chispas del kit, vivas.
//
// CONTINUIDAD (cámara del plató de las pruebas: pos [0, 3,8, 15,5], mira [0, 2,3, 0], fov 28, sin recorte 2D)
//  · Fotograma 0: el último de ep3-casa (window.__fin de ep3-casa): PERSONA_F (pos [P.punto(950, 600, 2)[0], 3, 2],
//    escala 3, rot [0, 0,1, 0]) con su POSE_F ('mirarse las manos' de ep3-casa, fantasma 1, cabeza [−0,45, 0,25, 0,06] y
//    mirada [−0,6, −0,3]) y el halo frío de las manos; Atom en ATOMO_F (su hombro derecho − [1,12, 0,05, −0,6]), escala
//    0,4, con la mano del electrón 0 en el brazo de ella; regla REG (P.regla con e −9, ya 0,375, actual y marca −10,
//    lupa 0,5, pos P.punto(1668, 528, 0,4), escala 1,42, rot [0, −0,12, 0]). Los tiempos de ep3-casa salen de
//    marcas-ep03.json (con los de ahora si no se puede leer). Los rótulos de la regla se hornean con Jost cargada
//    (cargarFuenteCartela antes de crearPlato, como en las escenas con cartela).
//  · Último fotograma (ep3-gato empieza así): la vista atómica con Z = 240 px por distancia entre átomos, el hueco en
//    horizontal por el centro (y = 540 px; 0,32 de alto: 77 px entre las caras de las cuentas), los electrones de cada
//    lado en dos capas (la de delante cada 0,5 a ±0,26 del centro del hueco; la segunda, desplazada 0,25, a ±0,62),
//    nubes caqui arriba y de haya abajo, chispitas en el hueco; regla en 10⁻¹⁰; Atom en SITIO (P.punto(230, 780, 1)),
//    escala 0,37, con un velo oscuro detrás. window.__fin lo da en números.
import * as THREE from 'three';
import { escena } from '/atomo/plato/escena.js';
import { crearPlato, crearPost, cargarFuenteCartela, cl, mix, prog, ss, eio, eoc, eic, eob, azar, postura, mezclarPosturas, COLOR } from '/atomo/plato/kits/plastilina-adulta.js';
import { tiposTocar, multitud, cucharilla, terron, cajon, silla, sillaPara, chispas, foto, nubeElectrones, mundoPieza } from '/atomo/plato/kits/ep03-tocar.js';

const E = await escena('ep3-silla', 'ep03');
const D = E.duracion;
const M = (k) => E.marca(k);
const m = { h: M('humanidad'), hF: M('humanidad_fin'), s: M('silla'), sF: M('silla_fin'), r: M('repelen'), rF: M('repelen_fin') };
const QUIETO = D - 0.6;
window.__carga = [['inicio', Math.round(performance.now())]];
const W = 1920, H = 1080;

// tiempos de ep3-casa (para que el fotograma 0 sea su último)
let CASA = { duracion: 21.381, marcas: { tutambien: 15.886, tutambien_fin: 16.719 } };
try {
  const todas = await (await fetch('/atomo/plato/escenas/marcas-ep03.json')).json();
  if (todas['ep3-casa']?.marcas?.tutambien) CASA = todas['ep3-casa'];
} catch { /* se quedan los de arriba */ }

// ---------------------------------------------------------------- tiempos (todos salen de las marcas)
const mitad1 = m.h + 0.5 * (m.hF - m.h);       // «… la humanidad entera cabría…»: el terrón se guarda
const mitad3 = m.r + 0.5 * (m.rF - m.r);       // «… una regla cuántica…»: los electrones se apartan
const T = {
  suelta: [0.12, 0.95],                        // Atom retira la mano del brazo y la lleva a la cucharilla
  cuchara: [0.62, 0.95],                       // la cucharilla aparece en su mano
  multitud: [m.h - 0.2, m.h + 0.98],           // brota la humanidad
  fantasma: [m.h - 0.1, m.h + 0.95],           // las manos vuelven a ser opacas
  mirada1: [0.22, 0.75],                       // ella deja de mirar a Atom y mira la multitud
  mirada2: [m.h + 0.5, m.h + 0.98],            // … y la cucharilla
  lleno: m.h + 1.0,                            // desde aquí la persona y la multitud están quietas (foto)
  comprime: [m.h + 1.3, m.h + 2.1],            // la multitud se levanta en remolino y se comprime en la cucharilla
  terron: [m.h + 1.98, m.h + 2.16],            // el terrón aparece, con un destello
  corte1: mitad1 - 1.0,                        // DETALLE: la cucharilla y la cómoda
  acerca: [mitad1 - 0.9, mitad1 - 0.42],       // Atom lleva la cucharilla sobre el cajón
  inclina: [mitad1 - 0.5, mitad1 - 0.28],      // la inclina
  cae: [mitad1 - 0.32, mitad1 + 0.02],         // el terrón cae dentro (a mitad de frase)
  endereza: [mitad1 + 0.02, mitad1 + 0.35],
  cierra: [mitad1 + 0.02, mitad1 + 0.45],      // el cajón se cierra
  vuelve: [mitad1 + 0.5, mitad1 + 1.35],       // Atom vuelve a su sitio; la cucharilla se encoge
  corte2: mitad1 + 1.55,                       // GENERAL de la silla
  sillaEntra: [m.s - 1.85, m.s - 1.2],         // la silla entra deslizándose
  sienta: [m.s - 0.72, m.s - 0.04],            // se sienta (completa en la marca)
  interroga: [m.s - 0.04, m.s + 0.3],          // el «?»
  miraInt: [m.s + 0.35, m.s + 0.8],            // ella lo mira
  interrogaFuera: [m.r - 1.2, m.r - 0.85],     // el «?» se va antes del empuje
  empuje: [m.r - 0.8, m.r - 0.05],             // empuje 2D hasta la frontera (completo en la marca)
  baja3: [m.r - 0.1, m.r + 0.8],               // el lado de la persona baja y rebota en el hueco
  aleja: [mitad3 - 0.85, mitad3 - 0.3],        // otro encuadre: la cámara se aparta un poco
  amontona: [mitad3 - 0.62, mitad3 - 0.04],    // llegan electrones y se amontonan
  aparta: [mitad3, mitad3 + 1.25],             // se apartan para no amontonarse
};
T.fotoSentada = T.miraInt[1] + 0.1;            // desde aquí la persona sentada está quieta (foto)

// ---------------------------------------------------------------- la cuenta (electrón): pieza propia
// ocho cuentas de ámbar en fila (x = −3,5 … 3,5, radio 0,42), cada una con su relieve: las variantes de un electrón
const GLSL_CUENTA = /* glsl */`
const vec3 CE_ELEC = vec3(0.36, 0.095, 0.01);
float ceUna(vec3 p, float k) {
  float d = length(p) - 0.42;
  d += 0.022 * (vnoise(p * 4.5 + k * 7.31) - 0.5) + 0.009 * (vnoise(p * 12.0 + k * 3.7) - 0.5);
  return d;
}
float pz_cuenta(vec3 q, vec4 T, out float m) {
  m = 0.0;
  float k = clamp(floor(q.x + 4.0), 0.0, 7.0);
  float d = ceUna(q - vec3(k - 3.5, 0.0, 0.0), k);
  float k2 = clamp(k + (q.x + 4.0 - k > 0.5 ? 1.0 : -1.0), 0.0, 7.0);
  d = min(d, ceUna(q - vec3(k2 - 3.5, 0.0, 0.0), k2));
  return d * 0.9;
}
float pzc_cuenta(vec3 q, vec4 T) { return 1e5; }
vec3 pzcol_cuenta(vec3 q, vec4 T, float m) {
  gEm = CE_ELEC * 0.75; gBri = 1.97;
  return CE_ELEC * (0.95 + 0.1 * vnoise(q * 6.0));
}
`;
const CUENTA = { radio: 4.05, glifos: [], glsl: GLSL_CUENTA };

// ---------------------------------------------------------------- plató
// (los rótulos de la regla se hornean con Jost ya cargada, como en ep3-casa, que la carga con su cartela)
await cargarFuenteCartela();
const I = { REG: 0, FLE: 1, HUM: 2, MUL: 3, CUC: 4, TER: 5, CAJ: 6, SIL: 7, CH1: 8, CH2: 9, INT: 10, CUE: 11 };
const P = await crearPlato({
  piezas: ['reglaA', 'flecha', 'humano', 'multitud', 'cucharilla', 'terron', 'cajon', 'silla', 'chispas', 'chispas', 'glifo:?', 'cuenta'],
  tiposExtra: { ...tiposTocar(['multitud', 'cucharilla', 'terron', 'cajon', 'silla', 'chispas']), cuenta: CUENTA },
  alfa: true, post: false, mano: true,
  sombraFondo: ['p2', 'p6', 'p7'],   // la persona, la cómoda y la silla (Atom va en otra pasada, sin sombra, como en ep3-casa)
  camara: { pos: [0, 3.8, 15.5], mira: [0, 2.3, 0], fov: 28, desenfoque: 44 },
});
const POST = crearPost();
window.__carga.push(['plató', Math.round(performance.now())]);
const en = (sx, sy, z) => P.punto(sx, sy, z);
const pant = (p) => P.proyectar(p);
const pxPorUnidad = (z) => { const a = en(960, 540, z); return pant([a[0] + 1, a[1], z])[0] - pant(a)[0]; };
const sumar = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const restar = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mezclar3 = (a, b, u) => [mix(a[0], b[0], u), mix(a[1], b[1], u), mix(a[2], b[2], u)];
// punto del mundo del punto local l de una pieza colocada con { pos, escala, rot } (euler YXZ, como el kit)
const enPieza = (o, l) => mundoPieza(o, l);
// pos para que el punto local l de la pieza caiga en el punto del mundo w
const posPara = (o, l, w) => restar(w, mundoPieza({ ...o, pos: [0, 0, 0] }, l));

// regla (la de ep3-casa, en 10⁻¹⁰): una foto
const E_REG = 1.42, REG = en(1668, 528, 0.4);
const REGLA = { pieza: I.REG, flecha: I.FLE, pos: REG, escala: E_REG, rot: [0, -0.12, 0], e: -9, ya: 0.375, lupa: 0.5, actual: -10, marca: -10 };
// Atom: su sitio de presentador (abajo a la izquierda, ~180 px)
const A_Z = 1.0, A_ESC = 0.37, SITIO = en(230, 780, A_Z);

// ---------------------------------------------------------------- capa 2D
const cont = document.getElementById('escena');
const lienzoGL = P.renderer.domElement;
const capa = document.createElement('canvas');
capa.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;display:block';
cont.appendChild(capa);
const g = capa.getContext('2d');
function ajustarCapa() {
  if (capa.width !== lienzoGL.width || capa.height !== lienzoGL.height) { capa.width = lienzoGL.width; capa.height = lienzoGL.height; }
  const k = capa.width / W; g.setTransform(k, 0, 0, k, 0, 0);
}
const pegarGL = (alfa = 1) => { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = alfa; g.drawImage(lienzoGL, 0, 0); g.restore(); };
const pintar = (f) => g.drawImage(f, 0, 0, W, H);
function parpadeo(n) {
  const f = azar(n, 3) - 0.5;
  g.fillStyle = f > 0 ? `rgba(255,236,210,${f * 0.03})` : `rgba(0,0,6,${-f * 0.04})`; g.fillRect(0, 0, W, H);
}
function brillo(p, R, a, color = '255,190,110') {
  if (a <= 0.003 || !p) return;
  g.save(); g.globalCompositeOperation = 'lighter';
  const gr = g.createRadialGradient(p[0], p[1], 0, p[0], p[1], R);
  gr.addColorStop(0, `rgba(${color},${a})`); gr.addColorStop(0.35, `rgba(${color},${a * 0.32})`); gr.addColorStop(1, `rgba(${color},0)`);
  g.fillStyle = gr; g.fillRect(p[0] - R, p[1] - R, 2 * R, 2 * R);
  g.restore();
}
// un punto de luz pequeño, ya pintado (para muchas estelas sin crear degradados)
const CHISPA2D = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const gc = c.getContext('2d'), gr = gc.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,214,150,1)'); gr.addColorStop(0.3, 'rgba(250,170,90,0.35)'); gr.addColorStop(1, 'rgba(240,150,70,0)');
  gc.fillStyle = gr; gc.fillRect(0, 0, 64, 64);
  return c;
})();

// ---------------------------------------------------------------- la persona
// fotograma 0 = último de ep3-casa: su 'mirarse las manos' (las manos algo más altas y las palmas hacia la cara),
// fantasma 1, la cabeza y la mirada hacia Atom
const BRAZO_MIRAR = [0.87, 0.14, 0.38, 1.6, -1.25, -0.6];
const POSE_MANOS = { ...postura('manos'), cabeza: [0, 0.42, 0], brazoIzq: [...BRAZO_MIRAR], brazoDer: [...BRAZO_MIRAR] };
const PERSONA_F = { pos: [en(950, 600, 2)[0], 3.0, 2.0], escala: 3.0, rot: [0, 0.1, 0] };
const DC = CASA.duracion, QC = DC - 0.6, TSC = Math.floor((DC - 0.3) * 12 + 1e-6) / 12, TZC = Math.min(TSC, QC);
const MANO_C = 0.08 * Math.sin((TZC - CASA.marcas.tutambien) * 1.3) * ss(CASA.marcas.tutambien_fin, CASA.marcas.tutambien_fin + 0.6, TZC);
const POSE_0 = { ...POSE_MANOS, fantasma: 1, ojos: 1, cabeza: [-0.45, 0.25, 0.06], mirada: [-0.6, -0.3],
  brazoIzq: [...BRAZO_MIRAR], brazoDer: [...BRAZO_MIRAR] };
POSE_0.brazoIzq[4] += MANO_C; POSE_0.brazoDer[4] -= MANO_C;
const RESP_0 = 0.006 * Math.sin(TZC * 2.2);
// después mira la multitud (abajo) y luego la cucharilla de Atom (a su derecha, abajo)
const CABEZA_1 = [-0.05, 0.55, 0], MIRADA_1 = [0, -1];
const CABEZA_2 = [-0.62, 0.4, 0.06], MIRADA_2 = [-0.85, -0.55];
const mix3 = (a, b, u) => a.map((v, i) => mix(v, b[i], u));
function poseG1(ts) {
  const p = { ...POSE_0, brazoIzq: [...POSE_0.brazoIzq], brazoDer: [...POSE_0.brazoDer] };
  p.fantasma = 1 - ss(T.fantasma[0], T.fantasma[1], ts);
  const k1 = eio(prog(ts, T.mirada1[0], T.mirada1[1])), k2 = eio(prog(ts, T.mirada2[0], T.mirada2[1]));
  p.cabeza = mix3(mix3(POSE_0.cabeza, CABEZA_1, k1), CABEZA_2, k2);
  p.mirada = mix3(mix3(POSE_0.mirada, MIRADA_1, k1), MIRADA_2, k2);
  // parpadea una vez al mirar la cucharilla
  p.ojos = 1 - 0.9 * Math.max(0, 1 - Math.abs(ts - (T.mirada2[0] + 0.05)) / 0.09);
  return p;
}
const HUELLA = [0.37, 0.21, 0];
function personaG1(ts) {
  // respira (la fase sigue la de ep3-casa); quieta desde T.lleno (es foto)
  const tz = Math.min(ts, T.lleno);
  const resp = 0.006 * Math.sin((TZC + ss(0.1, 0.9, tz) * (tz - 0.1)) * 2.2);
  return P.pieza(I.HUM, { ...PERSONA_F, sq: [1, 1 + (ts < 0.1 ? RESP_0 : resp), 1], postura: poseG1(tz), aspecto: 'adulto', t: TSC + tz, huellaFija: HUELLA });
}
// el halo frío de las manos casi transparentes (el de ep3-casa en su plano general: × 1,9 de fuerza, × 1,35 de radio)
function haloManos(h, kf, ts) {
  if (kf <= 0.01) return;
  g.save(); g.globalCompositeOperation = 'lighter';
  for (const lado of ['Izq', 'Der']) {
    const pm = pant(h.punto('mano' + lado)), pw = pant(h.punto('muneca' + lado)), pd = pant(h.punto('dedos' + lado));
    const R = 1.5 * 1.35 * Math.hypot(pd[0] - pw[0], pd[1] - pw[1]);
    const pulso = 0.85 + 0.15 * Math.sin((QC + ts) * 2.6 + (lado === 'Izq' ? 0 : 1.7));
    const gr = g.createRadialGradient(pm[0], pm[1], 0, pm[0], pm[1], R);
    gr.addColorStop(0, `rgba(170,205,255,${0.16 * 1.9 * kf * pulso})`); gr.addColorStop(0.55, `rgba(140,180,240,${0.07 * 1.9 * kf * pulso})`); gr.addColorStop(1, 'rgba(120,160,230,0)');
    g.fillStyle = gr; g.fillRect(pm[0] - R, pm[1] - R, 2 * R, 2 * R);
  }
  g.restore();
}

// ---------------------------------------------------------------- Atom
// su reloj sigue el de ep3-casa (allí acabó parado): los electrones y el balanceo arrancan suaves
const calmaC = (t) => { const a = QC - 0.9; if (t <= a) return t; const u = Math.min(t - a, 0.9); return a + u - (u * u) / 1.8; };
const TZ_A0 = calmaC(TSC), TA_A0 = TZ_A0;   // (en ep3-casa, su reloj de electrones y el de balanceo valen lo mismo al final)
const DT = 1 / 240, RELOJ = [0];
const velA = (t) => ss(0.08, 0.8, t) * (1 - eio(prog(t, QUIETO - 0.9, QUIETO)));
for (let i = 1; i * DT <= D + 0.2; i++) RELOJ.push(RELOJ[i - 1] + velA((i - 0.5) * DT) * DT);
const reloj = (t) => { const x = t / DT, i = Math.min(RELOJ.length - 2, Math.floor(x)); return mix(RELOJ[i], RELOJ[i + 1], x - i); };
// dibuja Atom: pos, escala y la mano del electrón 0 (punto del mundo o null) con su mezcla
function atomo(ts, { pos, esc, mano = null, km = 0, energiaExtra = 0, roll = 0 }) {
  const r = reloj(ts), tz = TZ_A0 + r, ta = TA_A0 + r;
  const en0 = ts < QUIETO ? E.energia(ts) : 0;
  const bote = 0.025 * Math.sin(tz * 1.1);
  const electrones = [];
  if (mano && km > 0.001) electrones[0] = { mundo: restar(mano, pos), mezcla: eio(km), brazo: km, grosor: 0.055, mano: km, tamMano: 0.3 };
  P.atomo({ pos: [pos[0], pos[1] + bote, pos[2]], escala: esc, yaw: -0.15 + 0.08 * Math.sin(tz * 0.5), pitch: 0.06, roll,
    energia: Math.min(1, en0 + energiaExtra), ts: ta, electrones, toque: km > 0.05 });
  return [pos[0], pos[1] + bote, pos[2]];
}

// ---------------------------------------------------------------- GENERAL 1: la multitud y la cucharilla
let ATOMO_F = null, OBJ_F = null;      // Atom y el punto del brazo donde apoya la mano (fotograma 0)
{
  const h = P.pieza(I.HUM, { ...PERSONA_F, postura: POSE_0, aspecto: 'adulto' });
  const hom = h.punto('hombroDer');
  ATOMO_F = [hom[0] - 1.12, hom[1] - 0.05, hom[2] + 0.6];
  const h2 = P.pieza(I.HUM, { ...PERSONA_F, sq: [1, 1 + RESP_0, 1], postura: POSE_0, aspecto: 'adulto', t: TSC, huellaFija: HUELLA });
  const b = h2.punto('codoDer'), s = h2.punto('hombroDer');
  OBJ_F = [mix(s[0], b[0], 0.3) - 0.2, mix(s[1], b[1], 0.3) + 0.05, mix(s[2], b[2], 0.3) + 0.05];
  P.limpiar();
}
// la cucharilla de Atom (a la derecha de ella, que es la izquierda de la pantalla), con el mango hacia él; algo más
// grande que una de verdad para que se lea, pero diminuta junto a la persona
// (inclinada como mucho −0,3: más inclinada, el mango de la pieza del kit sale a trozos)
const CUC1 = { escala: 0.85, rot: [-0.25, Math.PI + 0.15, 0.04] };

// ---------------------------------------------------------------- DETALLE 2: la cucharilla y el cajón
const CAJ2 = { escala: 2.6, rot: [0, -0.15, 0] };

const DESDE = sumar(SOBRE, [-0.75, 0.3, 0.35]);          // de donde viene

// la cucharilla en reposo (sin inclinar) da el mango; la inclinada gira alrededor de él; dv: lo que se ha movido Atom

// ---------------------------------------------------------------- GENERAL 3: la silla

// la persona, abajo la silla. La vista: pantalla = O + Z·(p − C)
const MI = { Z4: 360, Z5: 240, HUECO: 0.32, RE: 0.1 };

for (const lado of [-1, 1]) for (let f = 0; f < 3; f++) for (let i = -8; i <= 8; i++) {
  const x = i + (f % 2) * 0.5 + (lado > 0 ? 0.27 : 0) + 0.12 * (azar(i + 40, f + 5 + (lado > 0 ? 9 : 0)) - 0.5);

for (const lado of [-1, 1]) {
  const dx = lado > 0 ? 0.13 : 0;
  for (let j = -18; j <= 17; j++) {
    const x = (j + 0.5) * 0.5 + dx;
    ELEC.push({ tipo: 'del', lado, x0: x, y0: lado * Y_DEL, sem: azar(j + 100, lado > 0 ? 1 : 2), j });
  }
  // uno de cada dos huecos recibe a uno que llega de atrás: se amontona encima del de delante y se aparta a la segunda capa
  for (let j = -18; j <= 17; j += 2) {
    const x = (j + 0.5) * 0.5 + dx;
    const r = azar(j + 300, lado > 0 ? 3 : 4);
    ELEC.push({ tipo: 'llega', lado, x0: x + 0.3 * (r - 0.5), y0: lado * (Y_AT + 0.86 + 0.2 * (r - 0.5)), xa: x + 0.06, ya: lado * (Y_DEL + 0.04),
      x1: x + 0.25, y1: lado * Y_SEG, sem: r, j });
  }
}
for (const a of ATOMOS) {
  if (a.f === 0) ELEC.push({ tipo: 'orbita', lado: a.lado, cx: a.x, cy: a.y, r: 0.3, fase: a.sem * 6.28, w: 0.35 + 0.2 * a.sem, f: 0, sem: a.sem });
  else for (let k = 0; k < 3; k++) ELEC.push({ tipo: 'orbita', lado: a.lado, cx: a.x, cy: a.y, r: 0.3 + 0.05 * k, fase: a.sem * 6.28 + k * 2.1, w: (0.3 + 0.2 * a.sem) * (k % 2 ? -1 : 1), f: a.f, sem: (a.sem + 0.37 * k) % 1 });
}
// el lado de la persona llega desde 0,45 más arriba, baja y rebota en el hueco
const caida = (ts) => -0.45 * (1 - eob(prog(ts, T.baja3[0], T.baja3[1]), 1.4));
// posición de cada electrón (unidades) en el instante ts, y su capa (0 delante … 2 atrás)
function posElectron(e, ts, n) {
  const tz = Math.min(ts, QUIETO), nz = Math.min(n, Math.floor(QUIETO * 12));
  const jit = (k) => 0.01 * (azar(nz, Math.floor(e.sem * 1000) + k) - 0.5);
  const caer = e.lado < 0 ? caida(ts) : 0;
  if (e.tipo === 'orbita') {
    const a = e.fase + e.w * tz;
    let y = e.cy + e.r * 0.85 * Math.sin(a);
    // el de la cara de delante va por el lado de fuera de su nube (lejos del hueco)
    if (e.f === 0) y = e.cy + e.lado * (Math.abs(e.r * 0.85 * Math.sin(a)) * 0.9 + 0.05);
    return { x: e.cx + e.r * Math.cos(a) + jit(1), y: y + caer + jit(2), f: e.f };
  }
  // empujan hacia el hueco, un poco, cada uno a su ritmo
  const empuja = 0.022 * Math.sin(tz * (3.1 + 2.3 * e.sem) + e.sem * 9) * e.lado;
  const retraso = 0.3 * cl(Math.abs(e.x0) / 4.5);
  if (e.tipo === 'del') {
    // al apartarse, los de delante se corren un poco hacia un lado para dejar sitio
    const ua = prog(ts, T.aparta[0] + retraso, T.aparta[0] + retraso + 0.75);
    const corre = -0.07 * Math.sin(Math.PI * ua) * (e.j % 2 === 0 ? 1 : -1);
    return { x: e.x0 + corre + jit(1), y: e.y0 + caer + empuja + jit(2), f: 0 };
  }
  // los que llegan: de su átomo de atrás al sitio del de delante (se amontonan) y luego a la segunda capa
  const ul = eio(prog(ts, T.amontona[0] + 0.15 * e.sem, T.amontona[1]));
  const ua = eio(prog(ts, T.aparta[0] + retraso, T.aparta[0] + retraso + 0.8));
  let x = mix(e.x0, e.xa, ul), y = mix(e.y0, e.ya, ul);
  x = mix(x, e.x1, ua); y = mix(y, e.y1, ua);
  // apretados: tiemblan
  const apretado = ul * (1 - ua);
  x += 0.035 * apretado * Math.sin(tz * 31 + e.sem * 7);
  return { x: x + jit(1), y: y + caer + jit(2), f: ul > 0.5 ? 0 : 1, apretado };
}

// fotos 2D al cargar: las cuentas (8 variantes de un electrón, nítidas y desenfocadas) y las nubes (3 por lado)
const CUENTAS = [[], [], []];
const PASO_CUENTA = 200, R_CUENTA = 0.42 * PASO_CUENTA;
function hacerCuentas() {
  const z = 6.0, esc = PASO_CUENTA / pxPorUnidad(z);
  const o = { pos: en(960, 540, z), escala: esc, rot: [0, 0, 0] };
  P.limpiar(); P.pieza(I.CUE, o); P.render(3001, { fondo: false });
  const f = foto(P), k = f.width / W;
  for (let i = 0; i < 8; i++) {
    const c = pant(mundoPieza(o, [i - 3.5, 0, 0]));
    const s = document.createElement('canvas'); s.width = s.height = Math.round(PASO_CUENTA * k);
    s.getContext('2d').drawImage(f, (c[0] - PASO_CUENTA / 2) * k, (c[1] - PASO_CUENTA / 2) * k, PASO_CUENTA * k, PASO_CUENTA * k, 0, 0, s.width, s.height);
    CUENTAS[0].push(s);
    // las de las capas de atrás: desenfocadas y más oscuras
    for (const [capaN, bl, osc] of [[1, 5, 0.3], [2, 10, 0.5]]) {
      const b = document.createElement('canvas'); b.width = b.height = s.width;
      const gb = b.getContext('2d');
      gb.filter = `blur(${(bl * k).toFixed(1)}px)`; gb.drawImage(s, 0, 0); gb.filter = 'none';
      gb.globalCompositeOperation = 'source-atop'; gb.fillStyle = `rgba(20,12,6,${osc})`; gb.fillRect(0, 0, b.width, b.height);
      CUENTAS[capaN].push(b);
    }
  }
  P.limpiar();
}
const NUBES = { '-1': [], '1': [] };
const R_NUBE = 200;      // radio de la nube en su foto (px)
function hacerNubes() {
  const tintes = { '-1': [118, 104, 78], '1': [150, 92, 50] };
  for (const lado of [-1, 1]) for (let s = 0; s < 3; s++) {
    const c = document.createElement('canvas'); c.width = c.height = 2 * R_NUBE + 60;
    const gc = c.getContext('2d');
    const C = R_NUBE + 30;
    nubeElectrones(gc, { centro: [C, C], ejeX: [R_NUBE * 0.95, 0], ejeY: [0, R_NUBE * 0.95], forma: 'bola', motas: 0, bocanadas: 120, fuerza: 1.15, semilla: 31 + s * 7 + (lado > 0 ? 50 : 0), desenfoque: 9 });
    // tinte: caqui (el pantalón) arriba, haya (la silla) abajo
    gc.globalCompositeOperation = 'source-atop';
    const [r, gg, b] = tintes[lado];
    gc.fillStyle = `rgba(${r},${gg},${b},0.55)`; gc.fillRect(0, 0, c.width, c.height);
    NUBES[lado].push(c);
  }
}
function cuenta(x, y, r, v, capaN, alfa) {
  const s = CUENTAS[capaN][v % 8], d = r * PASO_CUENTA / R_CUENTA;
  g.globalAlpha = alfa;
  g.drawImage(s, x - d / 2, y - d / 2, d, d);
}
function vistaAtomica(n, ts, { O, Z, Cx = 0, Cy = 0, alfa = 1 }) {
  if (alfa <= 0.001) return;
  F('cuentas'); F('nubes');
  const sx = (x) => O[0] + Z * (x - Cx), sy = (y) => O[1] + Z * (y - Cy);
  const caer = caida(ts), nz = Math.min(n, Math.floor(QUIETO * 12));
  g.save(); g.globalAlpha = alfa;
  // fondo: penumbra caqui arriba y de haya abajo
  const yh = sy(0);
  g.fillStyle = 'rgb(14,12,10)'; g.fillRect(-W, -H, 3 * W, H + yh);
  g.fillStyle = 'rgb(16,10,7)'; g.fillRect(-W, yh, 3 * W, 2 * H);
  let gr = g.createLinearGradient(0, yh - 3.2 * Z, 0, yh);
  gr.addColorStop(0, 'rgba(14,12,10,1)'); gr.addColorStop(1, 'rgba(46,41,31,1)');
  g.fillStyle = gr; g.fillRect(-W, yh - 3.2 * Z, 3 * W, 3.2 * Z);
  gr = g.createLinearGradient(0, yh, 0, yh + 3.2 * Z);
  gr.addColorStop(0, 'rgba(52,33,20,1)'); gr.addColorStop(1, 'rgba(16,10,7,1)');
  g.fillStyle = gr; g.fillRect(-W, yh, 3 * W, 3.2 * Z);
  // las nubes de los átomos y sus electrones, de atrás a delante (los de atrás, más oscuros y desenfocados)
  const xMin = Cx - (O[0] + 80) / Z - 1, xMax = Cx + (W - O[0] + 80) / Z + 1;
  const elec = ELEC.map((e) => [posElectron(e, ts, n), e]);
  for (let f = 2; f >= 0; f--) {
    for (const a of ATOMOS) {
      if (a.f !== f || a.x < xMin || a.x > xMax) continue;
      const y = a.y + (a.lado < 0 ? caer : 0);
      const R = Z * (0.6 + 0.04 * a.sem) * (1 - 0.06 * f);
      const nb = NUBES[a.lado][Math.floor(a.sem * 3)];
      g.globalAlpha = alfa * (f === 0 ? 0.95 : f === 1 ? 0.55 : 0.32);
      const s = R / R_NUBE;
      g.drawImage(nb, sx(a.x) - (R_NUBE + 30) * s, sy(y) - (R_NUBE + 30) * s, (2 * R_NUBE + 60) * s, (2 * R_NUBE + 60) * s);
      // el núcleo: un guisante de luz, diminuto
      if (f < 2) { g.globalAlpha = alfa * (f === 0 ? 0.85 : 0.4); g.fillStyle = 'rgb(255,205,150)'; g.beginPath(); g.arc(sx(a.x), sy(y), Math.max(1.3, 0.006 * Z), 0, 6.283); g.fill(); }
    }
    for (const [p, e] of elec) {
      if (p.f !== f || p.x < xMin || p.x > xMax) continue;
      const r = Z * MI.RE * (f === 0 ? 1 : f === 1 ? 0.82 : 0.68);
      const v = Math.floor(azar(nz, Math.floor((e.sem ?? 0.5) * 997) + 11) * 8);
      cuenta(sx(p.x), sy(p.y), r, v, f, alfa * (f === 0 ? 1 : f === 1 ? 0.8 : 0.55));
    }
  }
  g.restore();
  // brillo propio de los electrones de delante (como los de Atom)
  g.save(); g.globalCompositeOperation = 'lighter';
  for (const [p] of elec) {
    if (p.f !== 0 || p.x < xMin || p.x > xMax) continue;
    const R = Z * MI.RE * 2.4;
    g.globalAlpha = 0.13 * alfa;
    g.drawImage(CHISPA2D, sx(p.x) - R, sy(p.y) - R, 2 * R, 2 * R);
  }
  g.restore();
  // el cojín: una franja de luz fría muy suave en el hueco, que late con las chispas
  const hz = (MI.HUECO / 2) * Z;
  const k = alfa * (0.7 + 0.3 * azar(nz, 77)) * ss(T.baja3[0] + 0.3, T.baja3[1], ts);
  if (k > 0.01) {
    g.save(); g.globalCompositeOperation = 'lighter';
    const y0 = sy(0) + caer * 0.5 * Z;
    gr = g.createLinearGradient(0, y0 - hz * 1.2, 0, y0 + hz * 1.2);
    gr.addColorStop(0, 'rgba(150,185,240,0)'); gr.addColorStop(0.5, `rgba(165,195,250,${0.16 * k})`); gr.addColorStop(1, 'rgba(150,185,240,0)');
    g.fillStyle = gr; g.fillRect(0, y0 - hz * 1.2, W, 2.4 * hz);
    g.restore();
  }
}
// las chispas del kit, vivas: dos piezas a lo largo del hueco (centro en pantalla y), semilla por fotograma
const PX_CHISPA = 330;       // px por unidad local de la pieza (cada una cubre 660 px)
function ponerChispas(n, ts, y, fuerza) {
  if (fuerza <= 0.01) return;
  const z = 8.0, esc = PX_CHISPA / pxPorUnidad(z);
  const nz = Math.min(n, Math.floor(QUIETO * 12));
  chispas(P, I.CH1, { pos: en(940 - PX_CHISPA, y, z), escala: esc, n: 8, semilla: nz * 2 + 1, fuerza });
  chispas(P, I.CH2, { pos: en(940 + PX_CHISPA, y, z), escala: esc, n: 8, semilla: nz * 2 + 2, fuerza });
}
// resplandor de las chispas: la capa de WebGL (solo chispas) desenfocada y sumada, en la franja del hueco
function resplandor(y, alto, fuerza) {
  const k = lienzoGL.width / W;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'lighter';
  g.filter = `blur(${(14 * k).toFixed(1)}px)`; g.globalAlpha = 0.9 * fuerza;
  const y0 = Math.max(0, (y - alto) * k), h = Math.min(lienzoGL.height - y0, 2 * alto * k);
  g.drawImage(lienzoGL, 0, y0, lienzoGL.width, h, 0, y0, lienzoGL.width, h);
  g.filter = 'none'; g.restore();
}
// la frontera muslo–asiento en la foto de la persona sentada (px) y su inclinación
const SMAX = 12;
const CONTACTO = (() => { const a = pant(enPieza(SILLA3, [-0.2, 0.0, 0.17])), b = pant(enPieza(SILLA3, [-0.2, 0.0, -0.12])); return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2 - 4]; })();
const ANG_CONTACTO = (() => {
  const a = pant(enPieza(SILLA3, [-0.2, 0.0, 0.17])), b = pant(enPieza(SILLA3, [-0.2, 0.0, -0.12]));
  let an = Math.atan2(a[1] - b[1], a[0] - b[0]);
  if (an > Math.PI / 2) an -= Math.PI;
  if (an < -Math.PI / 2) an += Math.PI;
  return an;
})();
function planoMicro(n, ts) {
  const up = prog(ts, T.empuje[0], T.empuje[1]);
  // la cámara de la vista atómica: Z, y el punto de la pantalla donde queda el hueco
  const ual = eio(prog(ts, T.aleja[0], T.aleja[1]));
  let Z = mix(MI.Z4 * (1 + 0.04 * prog(ts, T.empuje[1], T.aleja[0])), MI.Z5, ual);
  let O = [960, 540], alfa = 1;
  if (up < 1) {
    // empuje 2D en la foto de la persona sentada, hacia la frontera muslo–asiento, que se gira hasta quedar en horizontal
    const ue = eic(up) * 0.55 + eio(up) * 0.45;
    const s = Math.exp(Math.log(SMAX) * ue);
    const q = [mix(CONTACTO[0], 960, eio(up)), mix(CONTACTO[1], 540, eio(up))];
    const giro = -ANG_CONTACTO * eio(up);
    g.save();
    g.translate(q[0], q[1]); g.rotate(giro); g.scale(s, s); g.translate(-CONTACTO[0], -CONTACTO[1]);
    const bl = Math.min(10, Math.max(0, (s - 1.5) * 1.2));
    if (bl > 0.3) g.filter = `blur(${(bl / s).toFixed(2)}px)`;
    pintar(F('sentada'));
    g.filter = 'none';
    g.restore();
    alfa = ss(0.45, 0.9, up);
    Z = MI.Z4 * s / SMAX;
    O = q;
    g.save(); g.translate(q[0], q[1]); g.rotate(giro * (1 - alfa)); g.translate(-q[0], -q[1]);
    vistaAtomica(n, ts, { O, Z, alfa });
    g.restore();
  } else {
    vistaAtomica(n, ts, { O, Z, alfa: 1 });
  }
  // chispas vivas en el hueco
  const fz = alfa * (0.55 + 0.45 * ss(T.baja3[0] + 0.25, T.baja3[0] + 0.5, ts)) * ss(T.empuje[1] - 0.25, T.empuje[1] + 0.1, ts);
  const yH = O[1] + caida(ts) * 0.5 * Z;
  if (fz > 0.01) {
    P.limpiar();
    ponerChispas(n, ts, yH, fz);
    P.render(n, { fondo: false });
    pegarGL();
    resplandor(yH, 120, fz);
  }
  // Atom, con un velo oscuro detrás (se lee sobre los electrones)
  const sa = pant(SITIO);
  g.save();
  const gr = g.createRadialGradient(sa[0], sa[1], 40, sa[0], sa[1], 230);
  gr.addColorStop(0, `rgba(8,6,5,${0.62 * alfa})`); gr.addColorStop(1, 'rgba(8,6,5,0)');
  g.fillStyle = gr; g.fillRect(sa[0] - 230, sa[1] - 230, 460, 460);
  g.restore();
  P.limpiar();
  atomo(ts, { pos: SITIO, esc: A_ESC });
  P.render(n, { fondo: false });
  pegarGL();
  parpadeo(n);
}

// ---------------------------------------------------------------- fotos
const HACER = {
  regla() { P.limpiar(); P.regla(REGLA); P.render(3010, { fondo: false }); return foto(P); },
  // la multitud entera, sola (para el remolino)
  mult() { P.limpiar(); multitud(P, I.MUL, { ...MULT, aparicion: 1 }); P.render(3011, { fondo: false }); return foto(P); },
  // la persona del general, quieta, con la multitud y sin ella (con el fondo y su sombra)
  lleno() { P.limpiar(); personaG1(T.lleno); multitud(P, I.MUL, { ...MULT, aparicion: 1 }); P.render(3012); return foto(P); },
  personaG1() { P.limpiar(); personaG1(T.lleno); P.render(3012); return foto(P); },
  personaSola() { P.limpiar(); personaG1(T.lleno); P.render(3012, { fondo: false }); return foto(P); },
  // la cómoda, abierta y cerrada (con el fondo y su sombra)
  cajonAbierto() { P.limpiar(); cajon(P, I.CAJ, { ...CAJ2, abierto: 1 }); P.render(3013); return foto(P); },
  cajonCerrado() { P.limpiar(); cajon(P, I.CAJ, { ...CAJ2, abierto: 0 }); P.render(3014); return foto(P); },
  // la persona sentada con la silla (sin el «?» ni Atom)
  // las cuentas y las nubes de la vista atómica (fotos 2D)
  cuentas() { hacerCuentas(); return true; },
  nubes() { hacerNubes(); return true; },
  sentada() {
    P.limpiar();
    const tz = T.fotoSentada;
    P.pieza(I.HUM, { ...PERSONA_3, sq: [1, 1 + 0.006 * Math.sin(tz * 2.2), 1], postura: poseG3(tz), aspecto: 'adulto', t: tz, huellaFija: HUELLA });
    sillaG3(tz);
    P.render(4001);
    return foto(P);
  },
};
const FOTOS = {};
let hechasAhora = 0;
function F(nombre) { if (!FOTOS[nombre]) { FOTOS[nombre] = HACER[nombre](); hechasAhora++; } return FOTOS[nombre]; }
// al cargar: la regla, la multitud, las cuentas y las nubes; el estreno de la persona y de Atom con su mano
P.fotograma(0);
F('regla');
window.__carga.push(['regla', Math.round(performance.now())]);
P.limpiar(); P.pieza(I.HUM, { pos: [0, 0.2, -2], escala: 0.2, postura: { ...POSE_0 }, aspecto: 'adulto' }); P.render(3020, { fondo: false });
P.limpiar(); P.atomo({ pos: [0, 0.3, -2], escala: 0.05, electrones: [{ pos: [2, 0, 0], mezcla: 1, brazo: 1, mano: 1 }] }); P.render(3021, { fondo: false });
window.__carga.push(['persona y Atom', Math.round(performance.now())]);

// (coste) las fotos que no se hacen al cargar se preparan en un fotograma barato poco antes de hacer falta (en orden,
// como renderiza render-escenas.mjs): [desde, foto, hasta]. Al final de cada fotograma que no haya tenido que hacer
// ninguna foto al pedirla, se hace como mucho UNA (va al lienzo de WebGL, que queda debajo de la capa 2D: no se ve)
const PREPARAR = [
  [0.05, 'personaG1', T.comprime[1]], [0.05, 'personaSola', T.comprime[1]], [T.lleno + 0.05, 'mult', T.comprime[1]],
  [T.lleno + 0.05, 'cajonAbierto', T.cae[0]], [T.corte1 + 0.05, 'cajonCerrado', T.corte2],
  [T.fotoSentada + 0.05, 'cuentas', D], [T.fotoSentada + 0.05, 'nubes', D],
];

// ---------------------------------------------------------------- fotograma
function dibujar(t) {
  const n = P.fotograma(t, D), ts = n / 12;
  ajustarCapa();
  hechasAhora = 0;
  if (ts < T.corte1) planoG1(n, ts);
  else if (ts < T.corte2) planoD2(n, ts);
  else if (ts < T.empuje[0]) planoG3(n, ts);
  else planoMicro(n, ts);
  P.fotograma(t, D);
  pintar(F('regla'));
  POST.aplicar(g, n);
  if (!hechasAhora) {
    const pendiente = PREPARAR.find(([t0, nombre, t1]) => ts >= t0 && ts < t1 && !FOTOS[nombre]);
    if (pendiente) F(pendiente[1]);
  }
}
window.__fin = { Z: MI.Z5, O: [960, 540], HUECO: MI.HUECO, RE: MI.RE, Y_DEL, Y_SEG, Y_AT, SITIO, A_ESC, REGLA: { ...REGLA, pieza: undefined, flecha: undefined },
  ATOMO_F, PERSONA_F, POSE_0, PERSONA_3, SILLA3, CONTACTO, ANG_CONTACTO, T };
E.iniciar(dibujar, { paso: 1 / 12 });
