<script type="module">
// TU-GANCHO (frases 1–2), sin cartela. Siete planos, cortados en la palabra inglesa:
// 1. (0) la pared norte pintada, de cerca: en el golpe de música asoma la RAYA recta del dintel (la pinta el decorado,
//    b_puertaFilo, con su filo de luz y su brillo); un turista entra, se
//    para debajo, se sorprende en «walls» y la señala en «chamber»;
// 2. («there could be rooms») el corte del monte: la tumba dentro y, en «rooms», salen las manchas; en «3,300» la cifra;
// 3. («And this year») la cumbre con la perforadora: la geofísica llega con el permiso y lo alza en «permission»; en
//    «drill» el motor hace un amago y el técnico lo señala; en «find out», la «?» de la espera;
// 4. («Along the way») inserto de la segunda puerta de 1922 MUY de cerca (otro encuadre que tu-vela): la pared de
//    sellos manda y el boquete, a la derecha, deja ver la antecámara a oscuras; la vela de Carter sube y la llama entra
//    en el labio del boquete en «hole»; en «candlelight» el oro de dentro se enciende; un geco huye de la luz;
// 5. («newspapers») la calle de El Cairo, 1923: el chaval alza el periódico de la pirámide y grita en «curse» (lo alza en «newspapers»);
// 6. («three radars») la pizarra de Atom: tres radares de mano dibujados uno a uno, ✓ ✗ ✗ (2015, 2016, 2018); sus
//    tres técnicos debajo levantan el dedo cuando sale su respuesta;
// 7. («scientists») la cumbre con la rejilla y el gravímetro: el geofísico llega al trípode, la geofísica lee el
//    portátil; en «hollow» la aguja tiembla y los dos se sorprenden.
import * as T from '/atomo/plato/escenas/tu-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('tu-gancho');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const TU = T.ELENCO_TU, PZ = T.PIEZAS_TU, PIEZAS_TU = T.PIEZAS_TU;
const wm = (s) => en('muro', (s - 0.5) / 15.75), wc = (s) => en('camino', (s - 17.781) / 12.08);
const ease = (u) => u * u * (3 - 2 * u);
const K = hex('#17151d'), BL = hex('#f6f2ea'), ROJO = hex('#d8402c');
// el globo del grito o de la duda (sin letras: «!» o «?»)
const globo = (x, y, ic = '!', c = ROJO) => { R.disco(x, y, 7, K); R.disco(x, y, 6, BL); R.pset(x - 5, y + 7, K); R.pset(x - 4, y + 6, BL); R.pset(x - 6, y + 8, K); R.icono(ic, x - (ic === '?' ? 2 : 1), y - 4, c, null, 1); };
const P2 = wm(6.5), P3 = wm(10.95), P4 = wc(17.45), P5 = wc(21.95), P6 = wc(24.45), P7 = wc(26.9);
// 1. la pared pintada: la raya sale con el golpe de música («muro», ~0,6 s) y el turista la descubre
const p1 = (t) => {
  const ry = ease(tramo(t, 0.2, 0.75));
  // la raya la pinta entera el decorado (b_puertaFilo: filo de luz, sombra fina y el brillo que la recorre)
  T.tumba(R, t, { encuadre: 'pintada', camara: 'pared', raya: ry });
  const u = tramo(t, 1.0, wm(3.5)), x = Math.round(lerp(-20, 118, ease(u)));
  R.actor(EL.turista1, x, 172, t, { dir: 1, anda: u > 0 && u < 1, sorpresa: t > wm(3.95) && t < wm(5.4), dedo: t > wm(5.6), sonrisa: t > wm(6.0) });
  const v = tramo(t, wm(4.3), wm(6.3)), x2 = Math.round(lerp(330, 236, ease(v)));
  R.actor(EL.turista2, x2, 172, t, { dir: -1, anda: v > 0 && v < 1, sorpresa: t > wm(6.2) });
  if (t > wm(3.95) && t < wm(5.0)) globo(x + 16, 136, '!');
  T.tumbaDelante(R, t, { encuadre: 'pintada', camara: 'pared' });
};
// 2. el corte del monte: las manchas salen en «rooms»; «3300» en «3,300»
const p2 = (t) => {
  T.ladera(R, t, { encuadre: 'corte', anomalias: ease(tramo(t, wm(7.1), wm(8.4))), broca: 0 });
  const n = tramo(t, wm(8.95), wm(9.35)); if (n > 0) R.numero('3300', 257, Math.round(lerp(150, 146, n)), { tam: 16, centro: true });
  T.laderaDelante(R, t, { encuadre: 'corte' });
};
// 3. la perforadora espera: el permiso, el amago del motor en «drill», la «?» en «find out»
const p3 = (t) => {
  const amago = 0.1 * (ease(tramo(t, wm(13.35), wm(13.75))) - ease(tramo(t, wm(14.9), wm(15.4))));
  T.ladera(R, t, { encuadre: 'perforadora', broca: amago });
  const u = tramo(t, P3 + 0.2, wm(12.3)), x = Math.round(lerp(-20, 64, ease(u))), alza = t > wm(12.7) && t < wm(14.2);
  const a = R.actor(TU.geofisica2TU, x, 146, t, { dir: 1, anda: u > 0 && u < 1, sostiene: alza ? [x + 18, 112] : true, habla: alza && Math.sin(t * 9) > 0 });
  const [mx, my] = a.mano; R.rect(mx - 4, my - 10, mx + 4, my + 1, K); R.rect(mx - 3, my - 9, mx + 3, my, BL);
  for (let j = 0; j < 3; j++) R.rect(mx - 2, my - 7 + j * 2, mx + 2, my - 7 + j * 2, hex('#9aa4b4'));
  R.actor(TU.geofisico1TU, 104, 146, t, { dir: 1, dedo: t > wm(13.4) && t < wm(14.6), habla: t > wm(15.0) && t < wm(15.6) && Math.sin(t * 9) > 0 });
  if (t > wm(15.6)) globo(116, 106, '?', hex('#3a6ac8'));

};
// 4. («Along the way») INSERTO NUEVO, no el de tu-vela: la segunda puerta MUY de cerca, a la altura del boquete. Manda la
//    pared: el enlucido sobre los bloques (manchas, llana, poros, churretes, el hollín de arriba), cuatro sellos grandes
//    del chacal (uno roto, otro partido por el boquete), la cuerda vieja cortada con su sello de barro y las grietas que
//    salen del borde. El boquete, a la derecha del centro (un tercio del ancho), a saltos, con el grueso del muro y el
//    mampuesto al aire; dentro, casi a oscuras, la antecámara (la vista 'antecamara' del decorado, en un búfer, vista
//    por el boquete). La vela de Carter (T.brazo desde abajo a la derecha) ya asoma al empezar, sube y llega al labio en
//    «hole» (la llama dentro del boquete); en «candlelight» el oro de dentro se enciende, con destellos que corren, y su
//    reflejo tiñe el borde. Vida: un geco que huye de la luz, arenilla que cae del labio de arriba y el aire de la tumba
//    que saca motas hacia la llama. La luz de la pared sale de la llama (una pasada); la de dentro, del decorado.
const HX4 = 206, HY4 = 88, RX4 = 42, RY4 = 28, DX4 = -56, DY4 = 6;   // el boquete y el corrimiento a la antecámara
const h4 = (x, y, k = 0) => { const q = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return q - Math.floor(q); };

const YE4 = ['#4e4434', '#6e604c', '#8c7c64', '#a8987a', '#c2b292', '#d8caa8', '#ece0c0'].map(hex);
const RO4 = ['#120d0a', '#2e231c', '#4a3a2c', '#6a5640', '#8a7356', '#a88e6a', '#c4a880'].map(hex);

// mordisco arriba
const ESQ4 = Array.from({ length: 13 }, (_, i) => [(i + (h4(i, 1, 40) - 0.5) * 0.45) / 13 * Math.PI * 2, i === 4 ? 1.22 : i === 10 ? 0.74 : 0.82 + h4(i, 2, 40) * 0.3]);
const radio4 = (a) => { a = (a + Math.PI * 4) % (Math.PI * 2);
  for (let i = 0; i < 13; i++) { const [a0, r0] = ESQ4[i], [a1r, r1] = ESQ4[(i + 1) % 13], a1 = i === 12 ? a1r + Math.PI * 2 : a1r; let aa = a; if (aa < a0) aa += Math.PI * 2; if (aa >= a0 && aa <= a1) return r0 + (r1 - r0) * (aa - a0) / (a1 - a0); }

const pintaMuro4 = () => {
  MURO4 = R.nuevo(); ANTE4 = R.nuevo(); MASK4 = new Uint8Array(320 * 180);
  const prev = R.usar(MURO4);
  // el enlucido sobre los bloques (de cerca, 54 × 42): bulto de cada bloque, manchas, pasadas de llana, poros, churretes
  // que bajan y el hollín de las velas encima del boquete

    const bulto = (ly < 6 ? 0.45 : ly > 36 ? -0.4 : 0) + (lx < 6 ? 0.3 : lx > 48 ? -0.25 : 0) + (lx < 2 || ly < 2 ? -0.7 : 0);
    const mancha = (h4(x >> 4, y >> 4, 40) - 0.5) * 0.9 + h4(x >> 3, y >> 3, 41) * 0.5 + h4(x >> 1, y >> 1, 42) * 0.4 + h4(x, y, 43) * 0.3;
    const llana = Math.sin(x * 0.13 + y * 0.06 + h4(x >> 4, y >> 4, 44) * 6) > 0.93 ? 0.35 : 0;
    const poro = h4(x, y, 45) > 0.986 ? -1.3 : 0;
    const churrete = h4(x >> 2, 0, 46) > 0.8 ? -0.55 * Math.min(1, Math.max(0, (y - 24 - h4(x >> 2, 1, 46) * 80) / 40)) : 0;
    const hollin = -0.8 * Math.max(0, 1 - Math.hypot((x - HX4) / 60, (y - 30) / 34));
    R.pset(x, y, tono4(YE4, 2.3 + bulto + mancha + llana + poro + churrete + hollin, x, y));
  }
  // desconchones del enlucido (se ve el yeso de debajo, con su canto claro arriba y la sombra abajo) y arañazos
  for (let i = 0; i < 26; i++) { const cx = Math.round(h4(i, 1, 57) * 320), cy = Math.round(26 + h4(i, 2, 57) * 152), w = 2 + Math.round(h4(i, 3, 57) * 5), hh = 1 + Math.round(h4(i, 4, 57) * 3);
    for (let y = cy - hh; y <= cy + hh; y++) for (let x = cx - w; x <= cx + w; x++) { const e = ((x - cx) / (w + 0.5)) ** 2 + ((y - cy) / (hh + 0.5)) ** 2 + (h4(x, y, 58) - 0.5) * 0.5; if (e < 1) R.pset(x, y, y === cy - hh || e > 0.75 && y < cy ? YE4[6] : e > 0.7 ? YE4[0] : YE4[1]); } }
  for (let i = 0; i < 14; i++) { const x0 = h4(i, 1, 59) * 320, y0 = 30 + h4(i, 2, 59) * 140, l = 4 + h4(i, 3, 59) * 8; R.linea(x0, y0, x0 + l, y0 + l * 0.4, YE4[1]); R.linea(x0, y0 + 1, x0 + l, y0 + 1 + l * 0.4, YE4[5]); }
  // los sellos grandes del chacal (de cerca, s 3): uno partido por el boquete y otro roto
  PIEZAS_TU.sello(R, 54, 76, { s: 3 }); PIEZAS_TU.sello(R, 150, 78, { s: 3 }); PIEZAS_TU.sello(R, 290, 98, { s: 3 }); PIEZAS_TU.sello(R, 96, 160, { s: 3, roto: true });
  // la cuerda vieja que cruzaba la puerta, cortada por el boquete (la punta deshilachada cuelga) con su sello de barro
  const cuerda = (x0, x1, y0, y1, comba) => { for (let x = x0; x <= x1; x++) { const u = (x - x0) / (x1 - x0), y = Math.round(y0 + (y1 - y0) * u + Math.sin(u * Math.PI) * comba);
    R.pset(x, y, hex('#5a4024')); R.pset(x, y + 1, hex('#2e2014')); if ((x + y) % 3 === 0) R.pset(x, y, hex('#9a7a48')); } };
  cuerda(0, 168, 96, 100, 6); cuerda(244, 319, 98, 92, 4);
  for (let j = 0; j < 9; j++) { R.pset(168 + (j % 3 === 2 ? 1 : 0), 100 + j, hex(j % 2 ? '#5a4024' : '#8a6a3c')); R.pset(166, 101 + (j >> 1), hex('#5a4024')); }
  R.disco(30, 103, 5, hex('#2e2014')); R.disco(30, 102, 4, hex('#6a4a30')); R.disco(29, 101, 2, hex('#8a6a48')); R.pset(31, 104, hex('#3a2818')); R.pset(28, 103, hex('#3a2818'));
  // el boquete: el hueco (máscara 1: ahí se ve la antecámara), el grueso del muro (el labio de abajo con luz, arriba
  // en sombra, con juntas), el mampuesto al aire donde saltó el enlucido y el canto roto
  for (let y = HY4 - 2 * RY4; y < HY4 + 2 * RY4; y++) for (let x = HX4 - 2 * RX4; x < Math.min(320, HX4 + 2 * RX4); x++) {
    const dx = (x - HX4) / RX4, dy = (y - HY4) / RY4, a = Math.atan2(dy, dx), r = radio4(a), d = Math.hypot(dx, dy) / r;
    const t1 = 1 + (dy > 0.25 ? 0.2 : dy < -0.25 ? 0.09 : 0.13), t2 = t1 + 0.12 + 0.22 * h4(Math.floor(a * 5 + 9), 3, 50);
    if (d < 1) { MASK4[y * 320 + x] = 1; R.pset(x, y, RO4[0]); }
    else if (d < t1) { const u = (d - 1) / (t1 - 1), junta = h4(Math.floor(a * 16), 4, 50) > 0.78 && u > 0.15;
      R.pset(x, y, tono4(RO4, dy > 0.25 ? 3.4 + u * 1.6 - (junta ? 1.4 : 0) : dy < -0.25 ? 1.0 + u * 0.7 : 1.8 + u * 1.3 - (junta ? 0.9 : 0), x, y)); }
    else if (d < t2) { const fy = Math.floor(y / 6), lx = (x + (fy % 2) * 5) % 10, ly = y % 6, cx = Math.floor((x + (fy % 2) * 5) / 10);
      R.pset(x, y, lx < 1 || ly < 1 ? RO4[1] : tono4(RO4, 2.8 + h4(cx, fy, 51) * 1.6 + (ly < 2 ? 0.5 : 0) - (ly > 4 ? 0.5 : 0) + (h4(x, y, 52) > 0.9 ? 0.8 : 0), x, y)); }
    else if (d < t2 + 0.07) R.pset(x, y, dy < 0.1 ? YE4[6] : YE4[0]);
  }
  // las grietas que salen del borde (con su filo claro), y las piedras sueltas y migas de yeso en el labio de abajo
  for (let i = 0; i < 8; i++) { const a = (i + h4(i, 1, 47) * 0.6) / 8 * Math.PI * 2, r = radio4(a); let x = HX4 + Math.cos(a) * RX4 * r * 1.35, y = HY4 + Math.sin(a) * RY4 * r * 1.35;
    for (let j = 0, n = 16 + h4(i, 2, 47) * 24; j < n; j++) { const px = Math.round(x), py = Math.round(y); if (py > 24 && !MASK4[py * 320 + px]) { R.pset(px, py, YE4[0]); if (j % 2) R.pset(px + 1, py + 1, YE4[5]); }
      x += Math.cos(a) * 0.9 + (h4(i, j, 48) - 0.5) * 1.5; y += Math.sin(a) * 0.9 + (h4(i, j, 49) - 0.5) * 1.5; } }
  for (const [a, w] of [[1.35, 4], [1.75, 3], [2.05, 5], [0.95, 2]]) { const r = radio4(a), x = Math.round(HX4 + Math.cos(a) * RX4 * r * 1.06), y = Math.round(HY4 + Math.sin(a) * RY4 * r * 1.04);
    R.rect(x - w, y - 2, x + w, y, RO4[4]); R.rect(x - w, y - 2, x + w, y - 2, RO4[6]); R.rect(x - w + 1, y + 1, x + w, y + 1, RO4[1]); R.pset(x + w + 2, y, YE4[5]); R.pset(x - w - 2, y - 1, YE4[4]); }

};
// la luz de la pared en una pasada: cada píxel va hacia la noche azul según lo lejos que esté de la llama (y, con el
// oro encendido, del reflejo que sale del boquete); dentro del boquete se copia la antecámara (ya con su luz) y el oro
// gana brillo con «candlelight»
const luz4 = (fx, fy, f, oro, osc) => {
  const B = R.buf, W = MURO4, A = ANTE4, rad = 165 * f, rr = 1 / (rad * rad), rr2 = 1 / (rad * rad * 0.72);
  for (let y = 0; y < 180; y++) { const fila = y * 320, fa = (y + DY4) * 320 + DX4;
    for (let x = 0; x < 320; x++) { const i = fila + x;
      if (MASK4[i] === 1) { let p = A[fa + x];
        if (osc < 1) p = (0xff000000 | (Math.round(((p >> 16) & 255) * osc + 8 * (1 - osc)) << 16) | (Math.round(((p >> 8) & 255) * osc) << 8) | Math.round((p & 255) * osc)) >>> 0;

        B[i] = p; continue; }
      let L = 0.25; const ex = x - fx, ey = y - fy, d2 = ex * ex * rr + ey * ey * rr2; if (d2 < 1) L += 0.95 * (1 - d2) * (1 - d2 * 0.5);
      if (oro > 0) { const gx = (x - HX4) / 80, gy = (y - HY4) / 60, g2 = gx * gx + gy * gy; if (g2 < 1) L += 0.42 * oro * (1 - g2); }
      const v = L * 6, fl = Math.floor(v), q = Math.min(7, fl + (v - fl > 0.5 + (BAY4[(y & 3) * 4 + (x & 3)] - 0.5) * 0.36 ? 1 : 0)) / 6, w = q > 1 ? 1 : q;

    } }

// una llama pequeña que tiembla, con la punta que se dobla y su halo (como la del decorado)
const llama4 = (x, y, t, s = 1, dobla = 0) => {
  const a = Math.round(Math.sin(t * 11) * 0.8 + dobla), alto = Math.round((5 + Math.sin(t * 17)) * s);

  for (let j = 0; j < alto; j++) { const u = j / alto, w = Math.max(0, Math.round((1 - u) * 1.6 * s - 0.2)), cx = x + Math.round(a * u * u);
    for (let i = -w; i <= w; i++) R.pset(cx + i, y - j, u < 0.25 ? hex('#ffe9a0') : Math.abs(i) < w || w === 0 ? (u < 0.6 ? hex('#fff4c8') : hex('#ffd27a')) : hex('#f08a28')); }
  R.pset(x, y + 1, hex('#3a2a20'));
};
const p4 = (t) => {
  if (!MURO4) pintaMuro4();
  // la vela ya asoma abajo a la derecha al empezar; sube y en «hole» (20,72) la llama entra en el labio del boquete
  const ac = ease(Math.min(1, Math.max(0, (t - P4 + 0.35) / (wc(20.8) - P4 + 0.35))) ** 1.6), meca = Math.sin(t * 1.9) * 1.3 * (1 - 0.5 * ac);
