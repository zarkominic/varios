<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>H4 · ep4</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// EP4-H4 (frases 63–65).
//  decadas  en el taller, cuatro relojes cada vez más pequeños aparecen uno tras otro (1, 2, 3, 4 en la caja), cada
//           uno con su prueba: olas, calor, frío y humedad en iconos que pasan por delante.
//  h4       un reloj de bolsillo grande abre su tapa: dentro, el mecanismo dorado late.
//  viaje    un barco cruza el Atlántico de noche; la caja cuenta los días y, al llegar, «-39» (segundos).
import { escena } from '/atomo/plato/escena.js';
import { crearAventura, PALA, ELENCO } from '/atomo/plato/kits/pixel-aventura.js';
const E = await escena('ep4-h4', 'ep04');
const R = await crearAventura(document.getElementById('lienzo'));
const { PAL, tramo, lerp, clamp, sale } = R;
const M = (k, d) => E.marca(k, d);
const m = { decadas: M('decadas', 0.5), h4: M('h4', 4.5), viaje: M('viaje', 8) };

const cajaReloj = (cx, base, w, h, t, k) => {
  R.rect(cx - w / 2, base - h, cx + w / 2, base, PAL.HULL[3]); R.rect(cx - w / 2 + 1, base - h + 1, cx + w / 2 - 1, base - 1, PAL.HULL[2]);
  R.rect(cx - w / 2, base - h, cx + w / 2, base - h, PAL.ORO[2]);
  const r = Math.min(w, h) * 0.32;
  R.esfera(cx, base - h / 2, r, t, { vel: 20 + k * 5 });
  for (let j = 0; j < 3; j++) R.disco(cx - w / 2 + 4 + j * 5, base - 4, 1.5, PAL.ORO[3]);
};
const relojes = (t) => {
  R.interior(t, { luces: [[160, 40]], tipo: 'madera', suelo: 136, radio: 170 });
  R.vela(30, 60, t);
  R.rect(20, 130, 300, 136, PAL.HULL[4]);
  const tam = [[60, 56, 76], [130, 44, 52], [190, 34, 38], [244, 24, 26]];
  const paso = (m.h4 - m.decadas - 0.4) / 4;
  tam.forEach(([x, w, h], k) => { if (t > m.decadas + 0.2 + k * paso) cajaReloj(x, 130, w, h, t, k); });
  // las pruebas: una ola, un sol, un copo y una gota pasan por delante
  const k = clamp(Math.floor((t - m.decadas - 0.2) / paso), 0, 3), f = ((t - m.decadas - 0.2) / paso) % 1;
  const x = lerp(30, 290, f), y = 40;
  if (k === 0) for (let i = -8; i <= 8; i++) R.pset(x + i, y + Math.round(3 * Math.sin(i * 0.6)), PAL.COOL[1]);
  if (k === 1) { R.disco(x, y, 5, PAL.FIRE[3]); for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; R.pset(x + Math.cos(a) * 8, y + Math.sin(a) * 8, PAL.FIRE[2]); } }
  if (k === 2) for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; R.linea(x, y, x + Math.cos(a) * 6, y + Math.sin(a) * 6, PAL.COOL[2]); }
  if (k === 3) { R.disco(x, y + 2, 3.5, PAL.COOL[1]); R.linea(x, y - 6, x - 3, y, PAL.COOL[1]); R.linea(x, y - 6, x + 3, y, PAL.COOL[1]); }
};
const bolsillo = (t) => {
  R.mesa(t, { luz: [160, 20] });
  R.vela(260, 40, t, { r: 24 });
  const cx = 150, cy = 92, r = 40;
  const abre = sale(tramo(t, m.h4 + 0.2, m.h4 + 1));
  // cadena
  for (let k = 0; k < 12; k++) R.anillo(cx - 4 + k * 0.5 + 0.5, cy - r - 8 - k * 4 + 0.5, 1.5, PAL.ORO[3]);
  R.disco(cx, cy, r + 3, PAL.ORO[2]); R.disco(cx, cy, r + 1, PAL.ORO[4]);
  // dentro: mecanismo dorado con volante que late
  R.disco(cx, cy, r - 2, (x, y, d) => R.tone(PAL.ORO, 3.2 - d * 1.8 + 0.6 * Math.sin(x * 0.6) * Math.sin(y * 0.6), x, y));
  const vol = Math.sin(t * 15) * 0.8;
  R.anillo(cx + 14, cy + 10, 9, PAL.ORO[5]); R.linea(cx + 14 - Math.cos(vol) * 9, cy + 10 - Math.sin(vol) * 9, cx + 14 + Math.cos(vol) * 9, cy + 10 + Math.sin(vol) * 9, PAL.ORO[5]);
  for (const [x, y, rr] of [[cx - 14, cy - 8, 10], [cx + 4, cy - 18, 7]]) { R.anillo(x, y, rr, PAL.ORO[1]); R.disco(x, y, 2, PAL.ROJO); }
  // la tapa (esfera) se abre hacia la izquierda: se estrecha como si girara
  const w = Math.round((r + 2) * (1 - abre));
  if (w > 1) { for (let y = -r - 2; y <= r + 2; y++) { const half = Math.round(Math.sqrt(Math.max(0, (r + 2) ** 2 - y * y)) * (1 - abre)); for (let x = -half; x <= half; x++) R.pset(cx - Math.round((r + 2) * abre) + x, cy + y, R.tone(PAL.MOON, 3.6 - Math.abs(x) / (r + 2), cx + x, cy + y)); } if (abre < 0.1) R.esfera(cx, cy, r - 4, t, { vel: 30 }); }
};
const viaje = (t) => {
  R.cielo(t, { luna: [70, 30, 10], semilla: 69 });
  R.mar(t, { luzX: 70 });
  const p = clamp((t - m.viaje) / ((E.marca('viaje_fin', m.viaje + 5) - m.viaje) * 0.8), 0, 1);
  R.barco(lerp(40, 280, p), 138, t, { tipo: 'galeon', esc: 0.75, farol: true, bandera: 'ingles' });
};

E.iniciar((t) => {
  R.secuencia(t, [[0, relojes], [m.h4 - 0.2, bolsillo], [m.viaje - 0.2, viaje]]);
  const e = E.energia(t);
  const paso = (m.h4 - m.decadas - 0.4) / 4;
  let enCaja = 0;
  if (t < m.h4 - 0.2) enCaja = tramo(t, m.decadas + 0.2, m.decadas + 0.6);
  else if (t > m.viaje) enCaja = tramo(t, m.viaje + 0.3, m.viaje + 0.7);
  R.caja(t, enCaja, (x, y) => {
    if (t < m.h4) R.numero(String(clamp(1 + Math.floor((t - m.decadas - 0.2) / paso), 1, 4)), x + 6, y + 12);
    else {
      const fin = E.marca('viaje_fin', m.viaje + 5);
      const d = Math.round(lerp(1, 47, clamp((t - m.viaje - 0.5) / Math.max(0.5, fin - m.viaje - 1.6), 0, 1)));
      if (d < 47) { R.numero(String(d), x + 6, y + 12); R.icono('luna', x + 30, y + 4, PAL.UI[5]); }
      else { R.numero('-39', x + 4, y + 12); R.icono('reloj', x + 36, y + 4, PAL.UI[5]); }
    }
  }, { energia: e });
  R.companero(t, e);
  R.presentar();
});
</script>
</body>
</html>
