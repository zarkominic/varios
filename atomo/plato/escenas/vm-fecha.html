// VM-FECHA (frase 16): la fecha tumba dos teorías. Cuatro planos:

//    «knocked down» las dos fichas de teoría se tambalean; en «Roger Bacon's» el colega la señala, la flecha roja mide
//    los 112 años y en «earlier» salta y le planta una X;
// 2. «and it was unlikely»: inserto local, el escritorio de Voynich en 1912 (papel pintado de damasco con cornisa,
//    moldura de cuadros, repisa con esfera y vela, aplique de gas y reloj de péndulo que se mueven): su mano entra corta
//    por abajo a la derecha, moja la pluma en el tintero del borde y en «forgery» cruza a la hoja e imita los signos; en
//    «unless» la otra mano, corta por abajo, pasa las hojas en blanco (todas nuevas, blancas), «?»; en «era» cae la X roja;
// 3. «The book»: el escriptorio del siglo XV (1420): tres escribas escriben; en «fifteenth» el del medio levanta la
//    hoja terminada;
// 4. «before Columbus»: fondo local, el mar de 1492: nubes de cuatro tonos a tres velocidades, cirros, gaviotas, la costa
//    lejana y otra nao de la flota en el horizonte, el arrecife con rompientes ante la isla, crestas a media distancia y
//    la ola de primer plano; la carabela navega hacia la isla sin parar hasta el final, el marinero señala la tierra en

const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const mez = (a, b, k) => { let r = 0; for (const s of [0, 8, 16]) r |= Math.round(((a >>> s) & 255) * (1 - k) + ((b >>> s) & 255) * k) << s; return (r | 0xff000000) >>> 0; };

};

const nube = (cx, cy, w) => {
  const bolas = [[0, 0, w * 0.32], [-w * 0.32, w * 0.06, w * 0.24], [w * 0.3, w * 0.05, w * 0.26], [-w * 0.1, -w * 0.12, w * 0.26], [w * 0.14, -w * 0.08, w * 0.22]];
  for (const [dx, dy, r] of bolas) R.disco(Math.round(cx + dx), Math.round(cy + dy + 1), Math.round(r), Q.nubeS2);
  for (const [dx, dy, r] of bolas) R.disco(Math.round(cx + dx), Math.round(cy + dy), Math.round(r), Q.nubeS);
  for (const [dx, dy, r] of bolas) R.disco(Math.round(cx + dx - 1), Math.round(cy + dy - 2), Math.round(r * 0.8), Q.nube);
  for (let x = Math.round(cx - w * 0.5); x <= cx + w * 0.5; x++) R.pset(x, Math.round(cy + w * 0.28), Q.nubeS2);
};
// las nubes en tres planos (lentas y pequeñas arriba, rápidas y grandes abajo) y una bandada; y0/y1: la franja del cielo
const nubes = (t, y0, y1, k = 0) => {
  for (const [v, w, n, yy] of [[1.2, 14, 3, 0.15], [2.6, 22, 3, 0.45], [4.4, 30, 2, 0.75]]) for (let i = 0; i < n; i++) {
    const x = ((i * 137 + k * 61 + t * v) % 420) - 50, y = Math.round(y0 + (y1 - y0) * (yy + hh(i, k, 3) * 0.12));
    nube(Math.round(x), y, Math.round(w * (0.85 + hh(i, k, 5) * 0.3)));
  }
  for (let i = 0; i < 4; i++) { const x = Math.round(((t * 14 + i * 9 + k * 40) % 380) - 30), y = Math.round(y0 + 6 + i % 2 * 4 + Math.sin(t * 2 + i) * 2), a = Math.sin(t * 10 + i * 2) > 0;
    R.pset(x, y, Q.k); R.pset(x - 1, y - (a ? 1 : 0), Q.k); R.pset(x + 1, y - (a ? 1 : 0), Q.k); R.pset(x - 2, y - (a ? 2 : 0), Q.k); R.pset(x + 2, y - (a ? 2 : 0), Q.k); }
};
// madera con vetas (tablas horizontales de alto h), con las juntas y nudos
const madera = (x0, y0, x1, y1, c, cL, cS, cD, h = 7, k = 0) => {
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const tb = Math.floor((y - y0) / h), j = (y - y0) % h, ve = Math.sin((x + tb * 37) * 0.09 + Math.sin(x * 0.03 + tb) * 2 + j * 0.9);
    let col = ve > 0.75 ? cS : ve < -0.85 ? cL : c;
    if (j === h - 1) col = cD; else if (j === 0) col = cL;
    if (((x + tb * 53) % 61) === 0 && j > 0 && j < h - 1) col = cD;
    if (hh(x, y, k) > 0.97) col = cS;
    R.pset(x, y, col);
  }
};
// ladrillo de tres tonos con sus juntas y algún ladrillo más oscuro
const ladrillo = (x0, y0, x1, y1, k = 0) => {
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const f = Math.floor((y - y0) / 5), j = (y - y0) % 5, o = (x - x0 + (f % 2) * 5) % 10, id = Math.floor((x - x0 + (f % 2) * 5) / 10);
    if (j === 4 || o === 9) { R.pset(x, y, hh(x, y, k) > 0.8 ? Q.piedraS : Q.junta); continue; }
    const v = hh(id, f, k + 9); let c = v < 0.18 ? Q.ladrS : v > 0.85 ? Q.ladrL : Q.ladr; if (v > 0.95) c = Q.ladrD;
    if (j === 0 && hh(x, y, k + 1) > 0.6) c = mez(c, Q.ladrL, 0.4);
    R.pset(x, y, c);
  }
};
// los signos del libro, inventados (bucles, rizos, «gallows»; nunca letras): 8 formas de 5 × 9 (la fila 6 es la línea)
// y cuatro variantes (punto, cola, raya), 32 en total
const GL = [
  ['.....', '.....', '.....', '.##..', '#..#.', '#..#.', '.##.#', '.....', '.....'],
  ['.#.#.', '.#.#.', '.###.', '##.##', '.#.#.', '.#.#.', '.#.#.', '.....', '.....'],
  ['.....', '.....', '.....', '.##..', '#..#.', '.###.', '...#.', '..#..', '.#...'],
  ['.....', '.....', '.....', '.....', '#.#..', '#.#..', '.#.#.', '.....', '.....'],
  ['.....', '.....', '.#...', '.....', '.##..', '#..#.', '...#.', '..#..', '.....'],
  ['#....', '.#...', '.#...', '.##..', '.#.#.', '.#.#.', '.##..', '.....', '.....'],
  ['.....', '.....', '.....', '.....', '.#.#.', '#.#..', '.#.#.', '.....', '.....'],
  ['..##.', '.#...', '..#..', '...#.', '.##..', '#..#.', '.##..', '.....', '.....'],
];
const GLW = GL.map((m) => Math.max(...m.map((f) => f.lastIndexOf('#') + 1)));
const anchoG = (id) => GLW[id % 8] + (((id >> 3) & 3) === 2 ? 1 : 0);
const glifo = (id, x, yb, esc, col) => {
  const g = id % 8, mod = (id >> 3) & 3, m = GL[g], w = GLW[g];
  const p = (i, j) => { const X = Math.round(x + i * esc), Y = Math.round(yb + (j - 6) * esc); for (let a = 0; a < esc; a++) for (let b = 0; b < esc; b++) R.pset(X + a, Y + b, col); };
  for (let j = 0; j < 9; j++) for (let i = 0; i < 5; i++) if (m[j][i] === '#') p(i, j);
  if (mod === 1) p(Math.max(0, w - 2), 1);
  if (mod === 2) { p(w, 5); p(w, 4); }
  if (mod === 3) for (let i = 0; i < w; i++) p(i, 2);
  return anchoG(id) * esc;
};
// un renglón de palabras de signos entre x0 y x1 (col: color o función (x, id, i)); con out, solo apunta las posiciones
const renglon = (x0, yb, x1, sem, col, esc = 1, out = null) => {
  let x = x0, i = 0;
  for (let p = 0; p < 60; p++) {
    const nw = 2 + Math.floor(hh(sem, p, 8) * 4), ids = []; let w = 0;
    for (let j = 0; j < nw; j++) { const id = Math.floor(hh(sem, i + j, 9) * 32); ids.push(id); w += (anchoG(id) + 1) * esc; }
    if (x + w > x1) break;
    for (const id of ids) { if (out) out.push({ x, y: yb, id, i }); else glifo(id, x, yb, esc, typeof col === 'function' ? col(x, id, i) : col); x += (anchoG(id) + 1) * esc; i++; }
    x += 3 * esc;
  }
  return i;
};
// una hoja de pergamino: moteado en tres tonos, poros, bordes irregulares oscurecidos, puntos de óxido y dos cercos de agua
const pergamino = (x0, y0, x1, y1, k = 0) => {
  for (let y = Math.max(0, y0); y <= Math.min(179, y1); y++) for (let x = Math.max(0, x0); x <= Math.min(319, x1); x++) {
    const d = Math.min(y - y0 - hh(x >> 2, k, 7) * 2, y1 - y - hh(x >> 2, k, 17) * 2, x - x0 - hh(y >> 2, k, 27) * 2, x1 - x - hh(y >> 2, k, 37) * 2);
    if (d < 0) continue;
    const n = hh(x >> 1, y >> 1, k + 1), m = hh(x >> 3, y >> 3, k + 2), m2 = hh(x >> 4, y >> 4, k + 12);
    let c = Q.perg;
    if (m < 0.3 && n < 0.6) c = Q.pergM;
    if (m2 < 0.2 && n < 0.4) c = Q.pergS;
    if (n > 0.93) c = Q.pergL;
    if (hh(x, y, k + 5) > 0.988) c = Q.pergS;
    if (d < 1.5) c = Q.pergD; else if (d < 4 && ((x + y) & 1)) c = Q.pergS; else if (d < 7 && (x + y) % 3 === 0) c = Q.pergM;
    if (hh(x >> 1, y >> 1, k + 9) > 0.996) c = Q.pergO;

  }
};
// el tapete verde de la mesa, con su trama
const tapete = (x0, y0, x1, y1) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const n = hh(x >> 1, y >> 1, 3); let c = n < 0.2 ? Q.tapS : n > 0.86 ? Q.tapL : Q.tap; if ((x + 2 * y) % 5 === 0 && n > 0.45) c = Q.tapS; if (hh(x, y, 13) > 0.985) c = Q.tapL; R.pset(x, y, c); } };
// ── lo propio del grupo S6 ──
Object.assign(Q, Object.fromEntries(Object.entries({

  cac: '#4e8a4a', cacL: '#7ab06a', cacS: '#36683a', cacD: '#22482a',
  arena: '#e0b884', arenaL: '#f0d0a0', arenaS: '#c49464', arenaD: '#9a6e46',

const degr = (x0, y0, x1, y1, cols) => { for (let y = y0; y <= y1; y++) { const v = (y - y0) / Math.max(1, y1 - y0) * (cols.length - 1), i = Math.floor(v), f = v - i; for (let x = x0; x <= x1; x++) { const d = ((x + y * 2) % 4) / 4 + (((x >> 1) + y) % 2) * 0.12; R.pset(x, y, cols[Math.min(cols.length - 1, f > d ? i + 1 : i)]); } } };

    for (let i = 0; i < 6; i++) R.pset(mx + i, yH(mx) - 14 - h + Math.round(Math.sin(t * 9 + i) * (i / 3)), Q.rojo);
  };
  mastil(cx - 34, 34, 7, 20); mastil(cx - 2, 52, 13, 30); mastil(cx + 26, 40, 9, 22);
  R.rect(cx - 6, yH(cx) - 64, cx + 2, yH(cx) - 61, Q.nogS); R.disco(cx - 2, yH(cx) - 66, 1, Q.piel);
  raya(cx + 50, yH(cx + 50) - 10, cx + 66, yH(cx + 66) - 24, Q.nogS, 0);
  for (const [a, b] of [[cx + 66, cx - 2], [cx - 52, cx - 34]]) R.linea(a, yH(a) - 24, b, yH(b) - 66 + (b === cx - 34 ? 18 : 0), Q.nogD);

  for (let i = 0; i < 40; i++) { const x = cx - 52 - i * 2, y = yH(cx) + 4 + Math.round(Math.sin(i * 0.7 + t * 6)); if (hh(i, Math.floor(t * 6), 94) > 0.4) R.pset(x, y, Q.espuma); }

// una nube de cuatro tonos (bajo azulado, sombra, cuerpo y luz arriba a la izquierda), para el cielo del mar
const NUBE4 = [hex('#9cb0d0'), hex('#c4d2e8'), hex('#e6eef8'), hex('#ffffff')];
const nubeMar = (cx, cy, w, k) => {
  const bolas = [[0, 0, 0.3], [-0.3, 0.07, 0.22], [0.3, 0.06, 0.24], [-0.1, -0.13, 0.25], [0.15, -0.09, 0.21], [0.45, 0.1, 0.14], [-0.45, 0.11, 0.13]];
  const B = bolas.map(([dx, dy, r]) => [Math.round(cx + dx * w), Math.round(cy + dy * w), Math.max(2, Math.round(r * w * (0.9 + hh(dx * 10, k, 6) * 0.2)))]);
  for (const [x, y, r] of B) R.disco(x, y + 2, r, NUBE4[0]);
  for (const [x, y, r] of B) R.disco(x, y + 1, r, NUBE4[1]);
  for (const [x, y, r] of B) R.disco(x - 1, y - 1, Math.max(1, r - 1), NUBE4[2]);
  for (const [x, y, r] of B) R.disco(x - 2, y - 2, Math.max(1, Math.round(r * 0.55)), NUBE4[3]);
  for (let x = Math.round(cx - w * 0.5); x <= cx + w * 0.55; x++) if (x & 1) R.pset(x, Math.round(cy + w * 0.22) + 1, NUBE4[0]);
};
// una gaviota de 9 px de envergadura que bate las alas
const gaviota = (x, y, t, k) => {
  x = Math.round(x); y = Math.round(y); const a = Math.sin(t * 9 + k * 2);
  const ala = a > 0.3 ? -2 : a < -0.3 ? 1 : -1;
  R.rect(x - 1, y, x + 1, y, Q.blanco); R.pset(x + 2, y, Q.amar); R.pset(x - 2, y, Q.grisL);
  for (const d of [-1, 1]) { R.pset(x + d * 2, y + ala, Q.grisL); R.pset(x + d * 3, y + ala, Q.grisL); R.pset(x + d * 4, y + ala + (ala < 0 ? 1 : 0), Q.grisS); R.pset(x + d, y - (ala < 0 ? 1 : 0), Q.blanco); }
};
// un delfín de 16 px orientado según su salto (ang: rumbo en radianes), lomo gris azulado, vientre claro, aleta y cola
const DEL = { k: hex('#1e2a3a'), s: hex('#3e5470'), c: hex('#5e7896'), l: hex('#8aa4c0'), b: hex('#dce6ee') };
const delfin = (x, y, ang) => {
  const ca = Math.cos(ang), sa = Math.sin(ang);
  for (let py = -12; py <= 12; py++) for (let px = -12; px <= 12; px++) {
    const u = (px * ca + py * sa) / 1.15, v = (-px * sa + py * ca) / 1.15;   // u: a lo largo (hocico +), v: hacia el vientre +
    let c = 0;
    const th = u > -7 && u < 7 ? 2.6 * Math.sqrt(Math.max(0, 1 - (u / 7.4) ** 2)) : 0;
    if (Math.abs(v) <= th) c = v < -th * 0.35 ? DEL.s : v > th * 0.4 ? DEL.b : DEL.c;
    if (Math.abs(v) <= th + 0.9 && Math.abs(v) > th && th > 0) c = DEL.k;
    if (u >= 7 && u < 9.5 && Math.abs(v - 0.4) < 0.9) c = u > 8.6 ? DEL.k : DEL.l;                     // el hocico
    if (u > -2.5 && u < 1.5 && v < -th && v > -th - 3.5 + (u + 2.5) * 0.7) c = v < -th - 1 ? DEL.s : DEL.c; // la aleta del lomo

    if (c) R.pset(Math.round(x + px), Math.round(y + py), c);
  }
  R.pset(Math.round(x + ca * 6 + sa * 0.6), Math.round(y + sa * 6 - ca * 0.6), DEL.k);   // el ojo
  R.pset(Math.round(x + ca * 2 - sa * -1.8), Math.round(y + sa * 2 - ca * 1.8), DEL.l);  // el brillo del lomo
};
// las salpicaduras de un delfín al salir y al entrar: gotas en parábola y un anillo de espuma
const salpica = (x, y, u, k) => {
  if (u <= 0 || u >= 1) return;
  for (let i = 0; i < 9; i++) { const vx = (hh(i, k, 7) - 0.5) * 18, vy = 10 + hh(i, k, 8) * 10, gx = x + vx * u, gy = y - vy * u + 26 * u * u; R.pset(Math.round(gx), Math.round(gy), i % 3 ? Q.espuma : Q.blanco); if (i % 2) R.pset(Math.round(gx), Math.round(gy) + 1, Q.aguaL); }
  const r = Math.round(3 + u * 9); for (let a = 0; a < 6.28; a += 0.3) if (hh(Math.round(a * 10), k, 9) > u * 0.6) R.pset(Math.round(x + Math.cos(a) * r), Math.round(y + Math.sin(a) * r * 0.3), Q.espuma);
};
// la nao lejana de la flota, en el horizonte: casco y dos velas, se mece despacio
const naoLejos = (x, y, t) => {
  x = Math.round(x); const b = Math.round(Math.sin(t * 1.2) * 0.6);
  R.rect(x - 9, y - 2 + b, x + 9, y + b, Q.lejosD); R.rect(x - 9, y - 4 + b, x - 6, y - 3 + b, Q.lejosD); R.rect(x - 8, y - 2 + b, x + 8, y - 2 + b, Q.lejosS);
  for (const [mx, h, w] of [[-3, 12, 3], [4, 9, 2]]) { R.rect(x + mx, y - 3 - h + b, x + mx, y - 3 + b, Q.lejosD); R.rect(x + mx - w, y - 1 - h + b, x + mx + w, y - 6 + b - (h > 10 ? 1 : 0), Q.lejosL); R.rect(x + mx + w, y - 1 - h + b, x + mx + w, y - 6 + b, Q.lejos); }
  R.pset(x - 3, y - 16 + b, Q.rojo); R.pset(x - 2, y - 16 + b + (Math.sin(t * 8) > 0 ? 0 : 1), Q.rojo);
  for (let i = 0; i < 6; i++) if (hh(i, Math.floor(t * 4), 95) > 0.4) R.pset(x - 10 - i * 2, y + 1, Q.espuma);
};
const p4 = (t) => {
  // el cielo tramado con cirros finos en el búfer
  fijo('cielo1492', () => { cieloFijo(104);
    for (const [x0, y0, w] of [[90, 12, 70], [180, 20, 50], [20, 58, 60], [150, 64, 40]]) for (let x = x0; x < x0 + w; x++) { const y = Math.round(y0 + Math.sin(x * 0.08) * 1.5); if (hh(x, y0, 96) > 0.3) R.pset(x, y, mez(R.pget(x, y), Q.c5, 0.6)); if (hh(x, y0, 97) > 0.6) R.pset(x + 3, y + 2, mez(R.pget(x + 3, y + 2), Q.c5, 0.4)); }
    // la costa lejana, azulada por la bruma, a la izquierda del horizonte
    for (let x = 60; x < 190; x++) { const y1 = Math.round(101 - Math.max(0, Math.sin((x - 60) * 0.03)) * 5 - Math.sin(x * 0.2) * 0.8); for (let y = y1; y < 105; y++) R.pset(x, y, y === y1 ? Q.lejosL : ((x + y) & 1) ? Q.lejos : Q.lejosL); }
  });
  // el sol con su halo que late
  { const hl = Math.round(Math.sin(t * 2) * 1); for (let y = 22; y < 59; y++) for (let x = 44; x < 81; x++) { const d = Math.hypot(x - 62, y - 40); if (d > 12 && d < 18 + hl && ((x + y) & 1)) tine(x, y, 0.25, Q.amarL); } }
  R.disco(62, 40, 12, mez(Q.c4, Q.amarL, 0.4)); R.disco(62, 40, 9, Q.amarL); R.disco(62, 40, 7, Q.blanco);
  // las nubes en tres planos a tres velocidades: pequeñas y lentas abajo (lejos), medianas, y grandes y rápidas arriba
  // (cada nube parte de su sitio y avanza lo suyo en el plano: las de arriba nunca llegan a la zona de Atom)
  for (const [v, w, y, k, xs] of [[1.2, 16, 86, 1, [4, 104, 176, 300]], [2.6, 24, 64, 2, [20, 128, 250]], [4.6, 34, 28, 3, [140, 222]]]) for (const [i, x0] of xs.entries()) {
    const x = x0 + (t - P4) * v; nubeMar(Math.round(x), y + Math.round(hh(i, k, 3) * 8), Math.round(w * (0.85 + hh(i, k, 5) * 0.3)), i + k * 5); }
  // la nao lejana de la flota y la isla con sus palmeras
  naoLejos(lerp(118, 134, tramo(t, P4, P4 + 4)), 104, t);
  isla();
  for (const [x, h, k] of [[226, 40, 0], [248, 52, 1], [268, 36, 2], [298, 48, 3]]) palmera(x, 106, h, t, k);
  // el loro que cruza
  { const v = tramo(t, P4 + 0.5, P4 + 3.5); if (v > 0 && v < 1) { const x = Math.round(lerp(310, 210, v)), y = Math.round(80 - Math.sin(v * 6) * 4), a = Math.sin(t * 14) > 0; R.rect(x, y, x + 3, y + 1, Q.rojo); R.pset(x - 1, y, Q.amar); R.pset(x + 1, y - (a ? 2 : -2), Q.azulTL); R.pset(x + 2, y - (a ? 1 : -1), Q.verde); } }
  // el mar: olas en filas que corren, más claras lejos, con el reflejo de la isla y el camino de brillos del sol
  for (let y = 105; y < 180; y++) { const z = (y - 100) / 80, sp = t * (6 + z * 18), anS = 3 + (y - 105) * 0.35; for (let x = 0; x < 320; x++) { const w = Math.sin((x + sp) * (0.25 - z * 0.15) + y * 1.7) + Math.sin(x * 0.07 - t + y); let c = z < 0.15 ? Q.marL : z < 0.5 ? Q.mar : Q.marS; if (w > 1.5) c = Q.marL; else if (w < -1.6) c = Q.marD; if (w > 1.85 && z > 0.2) c = Q.espuma;
    if (y < 116 && x > 206 && ((x + y) & 1) && w < 1.2) c = mez(c, Q.setoS, 0.45);
    if (Math.abs(x - 62 - Math.sin(y * 0.9 + t * 3) * 2) < anS && w > 0.9) c = w > 1.4 ? Q.blanco : Q.amarL;
    R.pset(x, y, c); } }
  // las crestas a media distancia: rizos de ola con su espuma, que corren hacia la derecha
  for (let i = 0; i < 14; i++) { const y = 118 + (i % 5) * 7 + (i > 9 ? 3 : 0), x = Math.round(((i * 71 + t * (8 + (y - 118) * 0.4)) % 360) - 20), w = 4 + Math.round((y - 110) / 8);
    for (let k = -w; k <= w; k++) { const yy = y - Math.round((1 - (k / w) ** 2) * 2); R.pset(x + k, yy, Q.marL); if (Math.abs(k) < w * 0.5) R.pset(x + k, yy - 1, Q.espuma); } R.rect(x - w, y + 1, x + w, y + 1, Q.marD); }
  // el arrecife ante la isla: rocas con musgo y las rompientes que saltan a ritmo distinto
  for (const [x, w, k] of [[210, 6, 0], [232, 4, 1], [252, 7, 2], [276, 5, 3], [298, 8, 4], [314, 4, 5]]) {
    const y = 114; R.poligono([[x - w, y + 2], [x - w + 2, y - 2], [x + 1, y - 3], [x + w, y + 2]], Q.k); R.poligono([[x - w + 1, y + 1], [x - w + 2, y - 1], [x + 1, y - 2], [x + w - 1, y + 1]], Q.grisS); R.pset(x, y - 1, Q.grisL); R.pset(x - 1, y - 1, Q.setoL);
    const sp = Math.max(0, Math.sin(t * 2.3 + k * 1.9)); if (sp > 0.05) for (let j = 0; j < 10; j++) { const a = -Math.PI / 2 + (hh(j, k, 98) - 0.5) * 2.4, r = sp * (3 + hh(j, k, 99) * 5); R.pset(Math.round(x + Math.cos(a) * r * 1.4), Math.round(y - 2 + Math.sin(a) * r), j % 3 ? Q.espuma : Q.blanco); }
    for (let i = -w - 2; i <= w + 2; i++) if (((i + Math.floor(t * 6)) & 1)) R.pset(x + i, y + 2, Q.espuma);
  }
  for (let x = 196; x < 320; x++) if (Math.sin(x * 0.3 + t * 3) > 0.2) R.pset(x, 108 + (Math.sin(x * 0.2 + t * 2) > 0 ? 0 : 1), Q.espuma);
  for (let i = 0; i < 6; i++) { const x = Math.round(70 + i * 9 + Math.sin(t * 2 + i) * 3), y = 107 + (i % 3); if (Math.sin(t * 5 + i * 2) > 0.3) R.pset(x, y, Q.blanco); }
  // las gaviotas que acompañan a la nave (fuera de la zona de Atom)
  for (let i = 0; i < 3; i++) { const x = ((t * (16 + i * 4) + i * 90) % 300) - 10, y = 52 + i * 9 + Math.sin(t * 1.3 + i * 2) * 4; gaviota(x, y, t, i); }
  // la carabela navega hacia la isla hasta el final del plano (sin frenar: el último tramo sigue avanzando)
  const u = tramo(t, P4 - 0.3, P4 + 4.4), cx = lerp(-50, 150, u * 0.72 + ease(u) * 0.28), wy = 140 + Math.round(Math.sin(t * 1.6) * 1.5);
  carabela(cx, wy, t);
  const mar = R.actor(EL.marinero, Math.round(cx + 30), wy - 14 - 2 + Math.round((cx + 30 - cx) * Math.sin(t * 1.6) * 0.04), t, { dir: 1, dedo: t > LLEGA - 0.1, sorpresa: t > LLEGA - 0.1 && t < LLEGA + 0.6, sonrisa: t > LLEGA + 0.6, habla: t > LLEGA && t < LLEGA + 1 && Math.sin(t * 8) > 0 });
  if (t > LLEGA && t < LLEGA + 1.0) globo(cx + 37, wy - 46, '!');
  // la borda tapa los pies del marinero
  for (let x = Math.round(cx + 26); x < Math.round(cx + 48); x++) { const y = Math.round(wy + (x - cx) * Math.sin(t * 1.6) * 0.04) - 14; R.rect(x, y, x, y + 2, (x & 3) ? Q.nog : Q.nogS); R.pset(x, y, Q.robleL); }
  // los delfines saltan en primer plano, en arco, con salpicadura al salir y al entrar (el tercero entra con el «chof»)
  const CH = en('fecha', 0.9726);
  for (const [k, t0, x0] of [[0, CH - 0.85, 214], [1, CH - 0.15, 248], [2, CH + 0.7, 270], [3, CH + 1.5, 226]]) {
    const dur = 0.85, d = tramo(t, t0, t0 + dur), y0 = 170;
    if (d > 0 && d < 1) { const x = x0 + d * 34, y = y0 - Math.sin(d * Math.PI) * 26, ang = Math.atan2(-Math.cos(d * Math.PI) * 26 * Math.PI, 34); delfin(x, y, ang); }
    salpica(x0 + 2, y0 - 2, tramo(t, t0 - 0.05, t0 + 0.45), k * 2); salpica(x0 + 32, y0 - 2, tramo(t, t0 + dur - 0.1, t0 + dur + 0.4), k * 2 + 1);
  }
  // la ola de primer plano con su espuma (tapa la entrada de los delfines)
  for (let x = 0; x < 320; x++) { const cr = Math.round(169 + Math.sin(x * 0.045 + t * 1.8) * 3 + Math.sin(x * 0.11 - t * 1.1) * 1.5);
    for (let y = cr; y < 180; y++) { let c = y - cr < 2 ? Q.marL : ((x * 3 + y * 7 + Math.floor(t * 4)) % 11 === 0) ? Q.mar : Q.marS; if (y - cr > 6 && ((x + y) & 1) && Math.sin(x * 0.2 + y - t * 3) > 0.6) c = Q.marD; R.pset(x, y, c); }
    const fo = Math.sin(x * 0.045 + t * 1.8); if (fo > -0.2) { R.pset(x, cr - 1, Q.espuma); if (fo > 0.4 && hh(x, Math.floor(t * 5), 90) > 0.3) R.pset(x, cr - 2, Q.blanco); if (hh(x, Math.floor(t * 3), 91) > 0.7) R.pset(x, cr, Q.blanco); } }
};

const año = (t) => t < P2 ? 2009 : t < P3 ? 1912 : t < P4 ? 1420 : 1492;
const efectos = [[TUMBA + 0.05, 'boing'], [PEGA + 0.2, 'pop'], [ANTES, 'palmada'], [P2 + 1.2, 'burbujas'], [FORJA + 0.1, 'lapiz'], [SALVO + 0.1, 'papel'], [ERA - 0.15, 'sello'], [SIGLO, 'papel'], [P4 + 0.2, 'ola'], [en('fecha', 0.9726), 'chof']];
T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3], [P4, p4]], { efectos, año });
