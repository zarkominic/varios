const vec3 OF_PAN = vec3(0.40, 0.19, 0.055);
const vec3 OF_MIGA = vec3(0.56, 0.47, 0.30);

const vec3 OF_BC = vec3(0.0, -0.45, -0.25);    // centro de la bandeja
float ofCil(vec3 p, float r, float h) { vec2 d = vec2(length(p.xy) - r, abs(p.z) - h); return min(max(d.x, d.y), 0.0) + length(max(d, 0.0)); }

vec3 ofPanQ(vec3 p) { vec3 b = p - vec3(-0.18, -0.28, -0.49); return vec3(b.y, b.x, b.z / 0.85); }

  float r = 0.214 + 0.014 * sin(b.y * 46.0 + 1.3 * sin(a * 3.0));

// ---------------------------------------------------------------- Atom
function atomo(ts) {
  const uv = eio(prog(ts, T.vuelo[0], T.vuelo[1]));

  const yaw = mix(-0.15 + 0.08 * Math.sin(0.5 * z0), -0.15 + 0.08 * Math.sin(0.5 * z1), uv);
  const bote = mix(0.006 * Math.sin(1.1 * z0), 0.025 * Math.sin(1.1 * z1), uv);
  const pos = [mix(SITIO[0], ATOMO_0[0], uv), mix(SITIO[1], ATOMO_0[1], uv) + 0.5 * Math.sin(Math.PI * uv) + bote, mix(SITIO[2], ATOMO_0[2], uv)];
  const salK = ss(T.saludo[0], T.saludo[1], ts);
  const fase = 2 * Math.PI * 1.25 * (z1 + 0.32);
  const electrones = [];
  if (salK > 0.001) {
    const a = 0.8 + 0.42 * Math.sin(fase);
    electrones[0] = { pos: [2.45 * Math.cos(a), 2.45 * Math.sin(a), 0.35], mezcla: eio(salK), brazo: ss(0.2, 0.7, salK), grosor: 0.042 };
  }
  P.atomo({
    pos, escala: mix(A_ESC, A_ESC_0, uv), yaw, pitch: 0.06, roll: -0.04 * Math.sin(fase) * salK,
    energia: ts < TQ ? E.energia(ts) : 0, ts: tOrb(ts), electrones, toque: salK > 0.05,
  });

}

// ---------------------------------------------------------------- la persona
// la cabeza hacia un punto del mundo: [giro, inclina] (giro + a su izquierda; inclina − hacia arriba)
function cabezaHacia(PER, obj) {
  const hp = aMundo(PER, LOC.cabeza);
  const dx = obj[0] - hp[0], dy = obj[1] - hp[1], dz = obj[2] - hp[2];
  const c = Math.cos(PER.rot[1]), s = Math.sin(PER.rot[1]);
  const lx = c * dx - s * dz, lz = s * dx + c * dz;
  return [Math.atan2(lx, lz), -Math.atan2(dy, Math.hypot(lx, lz))];
}
function poseLectura(ts, PER, obj) {
  const p = postura('sentada');
  const [gi, inc] = cabezaHacia(PER, obj);
  const nod = asentir(ts);
  p.cabeza = [0.62 * gi, 0.7 * inc + 0.07 * nod, 0.03 - 0.02 * nod];
  p.mirada = [cl(0.75 * gi, -0.8, 0.8), cl(-0.6 * inc - 0.25 * nod, -0.6, 0.6)];
  return p;
}
const HUELLA = [0.37, 0.21, 0];
function cabeza(ts, PER, obj) {
  return P.pieza(I.humano, { ...PER, postura: poseLectura(ts, PER, obj), aspecto: aspectoEn(edadEn(ts)), t: ts, partes: 'cabeza', huellaFija: HUELLA });
}
// el decorado de un plano: el plató, el sillón y el cuerpo con las manos (sin la cabeza, con su sombra entera)

// para atomo/herramientas/guias-humano.py (sentada: valen las líneas de la cabeza y los hombros): x de la cabeza,
// coronilla y la suela que tendría de pie (coronilla + H en px a la altura de la cabeza)
function guias(h, PER) {

}

// ---------------------------------------------------------------- 2D: sombras, luz del peldaño y transiciones
// la sombra de lo vivo en el telón (la luz viene de arriba a la izquierda): su silueta, desplazada y borrosa, solo en
// una franja de x (la de la hélice o la del calendario)
const SOMBRA_F = { dx: 115, dy: 42, blur: 24, alfa: 0.42, x0: 430, x1: 1580 };               // la de ep3-adn

function sombra(gx, src, S) {
  gx.save(); gx.beginPath(); gx.rect(S.x0, 0, S.x1 - S.x0, H); gx.clip();

const sRGB = (c) => Math.round(255 * Math.pow(cl(c), 1 / 2.2));
// una foto con los bordes fundidos (radial, alrededor de c), para encogerla sin que se vea su marco
const PLUMA = new Map();
function pluma(f, c) {
  if (PLUMA.has(f)) return PLUMA.get(f);
  const r = lienzo(), gr0 = r.getContext('2d'), k = r.width / W;
  gr0.drawImage(f, 0, 0);

// la cámara se aparta o se acerca: dos fotos alineadas por la hélice (centro c y px por unidad r de cada una); la que
// queda grande va debajo, entera; la que queda pequeña, encima, fundida por los bordes
function cambio(u, viejo, cV, rV, nuevo, cN, rN) {
  const e = eio(u), s = rN / rV, Z = Math.pow(s, e);
  const c = [mix(cV[0], cN[0], e), mix(cV[1], cN[1], e)];
  const pon = (f, z, cc, a) => { g.save(); g.globalAlpha = a; g.translate(c[0], c[1]); g.scale(z, z); g.translate(-cc[0], -cc[1]); g.drawImage(f, 0, 0, W, H); g.restore(); };
  if (s < 1) {
    // se aparta: la nueva (agrandada) debajo y la vieja encima, que se va
    pon(nuevo, Z / s, cN, 1);
    const a = 1 - ss(0.1, 0.85, u);
    if (a > 0.001) pon(pluma(viejo, cV), Z, cV, a);
  } else {
    // se acerca: la vieja (agrandada) debajo y la nueva encima, que llega
    pon(viejo, Z, cV, 1);
    const a = ss(0.05, 0.6, u);
    if (a > 0.001) pon(pluma(nuevo, cN), Z / s, cN, a * (1 - ss(0.7, 1, u)));

// lo vivo del plano general (sobre transparente, en lienzoGL): la hélice, la cabeza, el calendario y, si toca, Atom
function vivoA(ts, conAtomo = true) {
  P.fotograma(ts); P.limpiar();

}
// compone el plano general: el decorado, las sombras de lo vivo (hélice y calendario), lo vivo y la luz del peldaño;
// con la mano, si toca (C). En un lienzo nuevo (foto) o en g
function componerA(base, h, ts, conMano, gx = null) {
  const f = gx ? null : lienzo();
  const x = gx ?? ctx(f);
  x.drawImage(base, 0, 0, W, H);
  sombra(x, lienzoGL, SOMBRA_A);
  sombra(x, lienzoGL, SOMBRA_CAL);
  x.drawImage(lienzoGL, 0, 0, W, H);

}
// la luz del peldaño que se lee, en el lado de la cara que mira a la hélice (del color de sus dos bases)
function luzPeldanoX(x, h, ts, fuerza) {
  const r = resaltaEn(ts) * fuerza;
  if (r < 0.01 || !h) return;
  const par = secuenciaAdn(-Math.round(avanceEn(ts)), 0);
  const c = [0, 1, 2].map((i) => sRGB(1.9 * (BASES[par[0]][i] + BASES[par[1]][i]) / 2));
  const ojos = pant(h.punto('ojos')), cor = pant(h.punto('coronilla')), bar = pant(h.punto('barbilla'));
  const R = 1.25 * Math.hypot(cor[0] - bar[0], cor[1] - bar[1]);
  const p = [ojos[0] - 0.3 * R, ojos[1] + 0.1 * R];
  x.save(); x.globalCompositeOperation = 'lighter';
  const gr = x.createRadialGradient(p[0], p[1], 0, p[0], p[1], R);
  gr.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},${0.16 * r})`); gr.addColorStop(0.5, `rgba(${c[0]},${c[1]},${c[2]},${0.07 * r})`); gr.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);

  x.restore();
}
// la mano entra desde abajo a la derecha, se pasa un poco y se asienta (completa en la marca)

  const k = 1 - eob(u, 1.2);

// ---------------------------------------------------------------- fotograma

const PREPARAR = [
  [0.05, 'Aset', T.t4[0] + 0.3], [0.1, 'A05', T.t1[1]], [0.2, 'Bset', T.bc], [0.28, 'MANO', T.t4[1]],
  [T.ab + 0.1, 'HD', T.push[1]], [T.ab + 0.2, 'PEL', D + 1], [T.ab + 0.3, 'R1', D + 1],

function dibujar(t) {

  if (pl === 'S' || pl === 'T1' || pl === 'T4' || pl === 'HD' || pl === 'P' || pl === 'PEL') {
    if (pl === 'S') g.drawImage(FOTO.S0, 0, 0, W, H);
    else if (pl === 'T1') cambio(prog(ts, T.t1[0], T.t1[1]), FOTO.S0, C_HX_F, 262, F('A05'), C_HX_A, RA);
    else if (pl === 'T4') cambio(prog(ts, T.t4[0], T.t4[1]), F('C1'), C_HX_A, RA, F('HD'), C_HX_F, 262);
    else if (pl === 'HD') { g.drawImage(F('HD'), 0, 0, W, H); exposicion(azar(n, 3) - 0.5); }
    else if (pl === 'P') {
      // la cámara se acerca al peldaño K_FIN hasta que tiene el tamaño, el sitio y el giro del peldaño de bolitas
      const hd = F('HD'), pe = FOTO.HDpel, u = prog(ts, T.push[0], T.push[1]), e = eio(u);
      const pi = pant(mundoPel(-1)), pd = pant(mundoPel(1)), cp = pant(PELDANO.pos);
      const Zf = 1.1 * Math.hypot(pd[0] - pi[0], pd[1] - pi[1]) / Math.hypot(pe.der[0] - pe.izq[0], pe.der[1] - pe.izq[1]);
      const ang = Math.atan2(pd[1] - pi[1], pd[0] - pi[0]) - Math.atan2(pe.der[1] - pe.izq[1], pe.der[0] - pe.izq[0]);
      const Z = Math.pow(Zf, e), c = [mix(pe.c[0], cp[0], e), mix(pe.c[1], cp[1], e)];
      g.save(); g.translate(c[0], c[1]); g.rotate(ang * e); g.scale(Z, Z); g.translate(-pe.c[0], -pe.c[1]); g.drawImage(hd, 0, 0, W, H); g.restore();
      const a = ss(T.pel[0], T.pel[1], ts);
      if (a > 0.001) { g.save(); g.globalAlpha = a; g.drawImage(F('PEL'), 0, 0, W, H); g.restore(); }
      exposicion(azar(n, 3) - 0.5);
    } else {
      g.drawImage(F('PEL'), 0, 0, W, H);
      exposicion(azar(quieto ? 0 : n, 3) - 0.5);
    }
    // Atom, vivo
    P.fotograma(ts); P.limpiar(); atomo(ts); P.render(n, { fondo: false });
    g.drawImage(lienzoGL, 0, 0, W, H);
  } else if (pl === 'A' || pl === 'C') {
    const base = F('Aset');
    if (pl === 'C') F('MANO');
    h = vivoA(ts);
    componerA(base, h, ts, pl === 'C', g);
    guias(h, PER_A);
  } else {
    // B: el plano medio
    const base = F('Bset');
    P.fotograma(ts); P.limpiar();
    atomo(ts);
    h = cabeza(ts, PER_B, OBJ_A);
    calendario(P, I.calendario, { ...CAL_B, ...calEn(ts) });
    P.render(n, { fondo: false });
    g.drawImage(base, 0, 0, W, H);
    g.drawImage(lienzoGL, 0, 0, W, H);
    luzPeldanoX(g, h, ts, 1.1);
    guias(h, PER_B);
  }
  // la regla (quieta en 10⁻⁹), encima de todo
  g.drawImage(ts >= T.push[0] ? F('R1') : FOTO.R0, 0, 0, W, H);
  POST.aplicar(g, quieto ? 0 : n);
  if (!hechas.length) {
    const pend = PREPARAR.find(([t0, k, t1]) => ts >= t0 && ts < t1 && !FOTO[k]);
    if (pend) F(pend[1]);
  }
  window.__tiempos = hechas.length ? { fotos: hechas.join(',') } : null;
}
// el peldaño de bolitas: un punto de su eje x (local, ±1) en el mundo
function mundoPel(x) {
  const v = new THREE.Vector3(x, 0, 0).multiplyScalar(PELDANO.escala).applyEuler(new THREE.Euler(...PELDANO.rot, 'YXZ'));
  return [PELDANO.pos[0] + v.x, PELDANO.pos[1] + v.y, PELDANO.pos[2] + v.z];
}

window.__fin = {

  AV_FIN, K_FIN, ORBITAS: { ZA0, V_ORB, N_ORB },
};
window.__duracion = D;
window.__carga.push(['listo', Math.round(performance.now())]);
E.iniciar(dibujar, { paso: 1 / 12 });
