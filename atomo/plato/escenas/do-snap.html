<script type="module">
// DO-SNAP (frases 7–8), cartela «2019». Cinco planos:
// 1. el campo verde: Thanos llega andando con el guantelete y las seis gemas se encienden una a una («six stones»);
// 2. contraluz a ras de flores (el sol detrás de Thanos, el planeta grande, la cabaña lejos en lo alto del camino): alza
//    el puño y chasquea («snap»): destello con rayos, y la mitad de las flores (también las grandes de delante) y de la
//    bandada que cruza se deshace en polvo de luz («wiped out»); él sonríe y se va camino arriba;
// 3. el garaje-laboratorio («Five years later»): tres Vengadores en trajes blancos y rojos suben a la plataforma, Hulk
//    pulsa el mando y desaparecen en la columna de luz («into the past»);
// 4. la pizarra del laboratorio con cuatro relojes: Tony señala cada uno cuando la voz dice su año (2012, 2013, 2014 y,
//    sorpresa, 1970), y cada reloj se para y se enciende con su número;
// 5. 1970, un almacén militar: Steve entra de puntillas, saca el cubo azul de la vitrina («steal the stones») y se va;
//    el guardia baja el periódico y mira la vitrina vacía («before he can get them»).
import * as T from '/atomo/plato/escenas/do-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('do-snap');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], bay = (x, y) => (BAY[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
const KK = hex('#1a1014'), BL = 0xffffffff;
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
// fondos fijos en búferes: se pintan una vez (con prev = R.usar(b) y vuelta) y se copian enteros (fondo) o solo lo pintado (pegar)
const BUF = {};
const bufer = (clave, dibuja) => { if (!BUF[clave]) { const b = R.nuevo(), prev = R.usar(b); dibuja(); R.usar(prev); BUF[clave] = b; } return BUF[clave]; };
const fondo = (clave, dibuja) => R.copiar(bufer(clave, dibuja));
const pegar = (clave, dibuja) => { const b = bufer(clave, dibuja), B = R.buf; for (let i = 0; i < 57600; i++) { const c = b[i]; if (c) B[i] = c; } };
// rampa tramada de arriba abajo en [x0..x1]×[y0..y1]
const rampa = (x0, y0, x1, y1, cols) => { const n = cols.length - 1; for (let y = y0; y <= y1; y++) { const u = (y - y0) / Math.max(1, y1 - y0) * n, i = Math.min(n - 1, Math.floor(u)), f = u - i; for (let x = x0; x <= x1; x++) R.pset(x, y, cols[f > bay(x, y) ? i + 1 : i]); } };
// caja con contorno, cara, luz arriba-izquierda y sombra abajo-derecha
const caja = (x0, y0, x1, y1, c, cl, cs) => { R.rect(x0, y0, x1, y1, KK); R.rect(x0 + 1, y0 + 1, x1 - 1, y1 - 1, c); R.rect(x0 + 1, y0 + 1, x1 - 1, y0 + 1, cl); R.rect(x0 + 1, y0 + 1, x0 + 1, y1 - 1, cl); R.rect(x0 + 1, y1 - 1, x1 - 1, y1 - 1, cs); R.rect(x1 - 1, y0 + 1, x1 - 1, y1 - 1, cs); };
// gema facetada de radio s en (x, y); brillo > 0: destellos alrededor
const gema = (x, y, c, s = 3, brillo = 0) => { const cl = mez(c, BL, 0.5), cs = mez(c, KK, 0.45);
  for (let j = -s - 1; j <= s + 1; j++) for (let i = -s - 1; i <= s + 1; i++) { const d = Math.abs(i) + Math.abs(j); if (d > s + 1) continue; R.pset(x + i, y + j, d === s + 1 ? KK : (i + j < 0 ? cl : i + j > 1 ? cs : c)); }
  R.pset(x - 1, y - 1, BL); if (s > 3) R.pset(x - 2, y - 1, BL);
  if (brillo > 0) { const r = Math.round(s + 3 + brillo * 3); for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 + brillo; R.pset(Math.round(x + Math.cos(a) * r), Math.round(y + Math.sin(a) * r), k % 2 ? cl : BL); } } };
const CORA = ['.kk.kk.', 'k##k##k', 'k#h####k'.slice(0, 7), 'k#####k', '.k###k.', '..k#k..', '...k...'];
const corazon = (x, y, c, s = 1) => CORA.forEach((f, j) => { for (let i = 0; i < 7; i++) { const ch = f[i]; if (ch === '.') continue; R.rect(x - 3 * s + i * s, y - 3 * s + j * s, x - 3 * s + i * s + s - 1, y - 3 * s + j * s + s - 1, ch === 'k' ? KK : ch === 'h' ? mez(c, BL, 0.6) : c); } });
// los trajes cuánticos de los Vengadores: blanco con franjas rojas
const QS = { C: hex('#eeeae2'), c: hex('#b4b0a8'), W: hex('#eeeae2'), F: hex('#c8303a'), G: hex('#c8303a'), I: hex('#2a2430'), n: hex('#2a2430'), X: hex('#c8303a'), r: hex('#c8303a') };
// el maletín plateado (en la mano: (x, y) = el asa)
const maletin = (x, y) => { R.rect(x - 2, y - 1, x + 2, y - 1, KK); R.pset(x - 2, y, KK); R.pset(x + 2, y, KK); caja(x - 6, y, x + 6, y + 8, hex('#c0c4cc'), hex('#eef0f4'), hex('#7a7e88')); R.rect(x - 5, y + 3, x + 5, y + 3, hex('#8a8e98')); R.pset(x - 3, y + 2, hex('#e8b830')); R.pset(x + 3, y + 2, hex('#e8b830')); };
const GEMAS = ['#9a4ae8', '#3a8ae8', '#e83a3a', '#e8903a', '#3ac85a', '#f0e040'].map(hex);
// nube de atardecer de tres tonos
const nubeT = (cx, cy, w, s, b, l) => { const bolas = [[0, 0, w * 0.3], [-w * 0.3, w * 0.07, w * 0.22], [w * 0.28, w * 0.06, w * 0.24], [-w * 0.1, -w * 0.12, w * 0.24]];
  for (const [dx, dy, r] of bolas) R.disco(Math.round(cx + dx), Math.round(cy + dy + 1), Math.round(r), s);
  for (const [dx, dy, r] of bolas) R.disco(Math.round(cx + dx), Math.round(cy + dy - 1), Math.round(r * 0.9), b);
  for (const [dx, dy, r] of bolas) R.disco(Math.round(cx + dx + 1), Math.round(cy + dy + 1 + r * 0.35), Math.round(r * 0.55), l); };
// pájaro en uve que aletea (silueta)
const ave = (x, y, t, k, c) => { const a = Math.sin(t * 8 + k) > 0 ? 1 : 0; R.pset(x, y, c); R.pset(x - 1, y - a, c); R.pset(x - 2, y - 1 - a, c); R.pset(x + 1, y - a, c); R.pset(x + 2, y - 1 - a, c); };

const A = (f) => en('thanos', f), B = (f) => en('pasado', f);
const P2 = A(0.536), P3 = B(-0.03), P4 = B(0.355), P5 = B(0.787);
const gem0 = A(0.375), gem1 = A(0.451), snap = A(0.632), wiped = A(0.728), univ = A(0.933);
const llegan = B(0.137), boton = B(0.183), viaja = B(0.249), pasado = B(0.307);
const AÑOS = [[2012, B(0.388)], [2013, B(0.485)], [2014, B(0.587)], [1970, B(0.693)]];
const roba = B(0.825), cubo = B(0.861), antes = B(0.887), coge = B(0.947);

// 1 · el campo general: Thanos llega y se encienden las gemas
const p1 = (t) => {
  T.lago(R, t, { encuadre: 'campo' });
  const u = tramo(t, 1.4, A(0.33)), x = Math.round(lerp(-22, 112, u));
  const alza = tramo(t, gem0 - 0.3, gem0 + 0.2);
  const q = R.actor(EL.thanos, x, 160, t, { dir: 1, anda: u > 0 && u < 1, sostiene: alza > 0 ? [x + 17, Math.round(lerp(146, 128, alza))] : true, sonrisa: t > gem1 });
  const [mx, my] = q.mano; T.PIEZAS_DO.guantelete(R, mx + 2, my + 2, t);
  // las gemas se encienden una a una: un destello en cada una
  const n = Math.floor(tramo(t, gem0, gem1) * 6.99);
  if (t > gem0) { const g = GEMAS[Math.min(5, n)], r = 7 + Math.round(Math.abs(Math.sin(t * 9)) * 3);
    for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6 + t * 2; R.linea(Math.round(mx - 1 + Math.cos(a) * (r - 2)), Math.round(my - 6 + Math.sin(a) * (r - 2)), Math.round(mx - 1 + Math.cos(a) * r), Math.round(my - 6 + Math.sin(a) * r), k % 2 ? g : BL); } }
  if (t > gem1) for (let k = 0; k < 6; k++) R.pset(mx - 4 + k, my - 13 - Math.round(Math.abs(Math.sin(t * 6 + k))), GEMAS[k]);
};
// 2 · contraluz bajo desde las flores: el chasquido y el polvo de luz
// cámara a ras de hierba: mucho cielo con el sol detrás de Thanos, el planeta de anillos grande, montes y colinas lejos con
// la cabaña pequeña en lo alto del camino; flores grandes delante a los lados. Thanos (pies en 150) alza el puño, chasquea:
// destello, y la mitad de las flores (las grandes de delante también) y de la bandada que cruza se deshace en polvo de luz.
const SOL2 = [168, 58];
const monte2 = (x) => 100 - 13 * Math.abs(Math.sin(x * 0.021 + 0.7)) - 5 * Math.sin(x * 0.063) - 2 * Math.sin(x * 0.17);
const colina2 = (x) => Math.round(114 - 5 * Math.sin(x * 0.035 + 2) - 3 * Math.sin(x * 0.09));
const camino2 = (y) => { const u = (180 - y) / 66; return [70 + 188 * Math.pow(u, 0.8), 34 * (1 - u) + 2]; };
const campoBajo = () => {
  const CIE = ['#2e5cb8', '#3e6cc6', '#5a88d6', '#7ea6e2', '#a8c6ec', '#d2e0ee', '#f2e8c8'].map(hex), CAL = hex('#fff2c8');
  const PR = ['#86c04e', '#6aac44', '#509638', '#3e8030', '#2e6a2a'].map(hex);
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) {
    let c;
    if (y < 118) {  // el cielo tramado, más claro y cálido junto al sol y al horizonte
      const u = Math.min(1, y / 112) * 6, i = Math.min(5, Math.floor(u)), f = u - i; c = CIE[f > bay(x, y) ? i + 1 : i];
      const d = Math.hypot(x - SOL2[0], (y - SOL2[1]) * 1.1), a = Math.max(0, 1 - d / 58); if (a > 0) c = mez(c, CAL, Math.floor((a * a * 0.8) * 5 + bay(x, y)) / 5);
      const m = monte2(x);
      if (y >= m) { const pend = monte2(x + 1) - m, nieve = m < 92 && y < m + 3 + hh(x, 3) * 2;
        c = nieve ? (pend > 0 ? hex('#c8d0e8') : hex('#f2f4fa')) : pend > 0.15 ? hex('#7682b6') : pend < -0.15 ? hex('#a6b2da') : hex('#8e9aca');
        if (y > m + 4 && bay(x, y) < (y - 100) / 16) c = hex('#b8c6e4'); }  // la bruma al pie de los montes
    }
    const hc = colina2(x);
    if (y >= hc && y < 126) { c = y === hc ? hex('#d8e080') : y === hc + 1 ? hex('#a8c860') : (hh(x, y, 5) < 0.18 ? hex('#4e8a3e') : (x + y) % 5 === 0 ? hex('#6aa64c') : hex('#5c9a46')); }
    if (y >= 120) {  // el prado: claro y cálido lejos, oscuro delante (contraluz)
      if (y >= 124 || y >= hc) {
        const u = Math.min(1, (y - 120) / 60) * 4, i = Math.min(3, Math.floor(u)), f = u - i; if (y >= 124) c = PR[f > bay(x, y) ? i + 1 : i];
        const [cx, w] = camino2(y), dx = Math.abs(x - cx);
        if (y >= 116 && dx < w / 2) { c = dx > w / 2 - 1.5 ? hex('#8a7a48') : hh(x, y, 9) < 0.08 ? hex('#7a6a40') : hh(x, y, 9) > 0.9 ? hex('#f0dca8') : (x + 2 * y) % 7 === 0 ? hex('#b8985e') : hex('#d0b47a'); }
      }
    }
    R.pset(x, y, c);
  }
  // el planeta de anillos grande, con bandas y la cara de sombra hacia la izquierda; el anillo por detrás y por delante
  const [px, py, pr] = [58, 46, 16], anillo = (delante) => { for (let k = 0; k < 220; k++) { const a = k / 220 * Math.PI * 2; if ((Math.sin(a) > 0) !== delante) continue;
    for (const [rx, ry, c] of [[31, 7, '#e8dcc0'], [29, 6.4, '#c8b898'], [26, 5.6, '#e0d2b4']]) R.pset(Math.round(px + Math.cos(a) * rx), Math.round(py + Math.sin(a) * ry - Math.cos(a) * 4), hex(c)); } };
  anillo(false);
  for (let j = -pr; j <= pr; j++) for (let i = -pr; i <= pr; i++) { const d = Math.hypot(i, j); if (d > pr) continue;
    const b = ((Math.floor((j + 2 * Math.sin(i * 0.3) + pr) / 5) % 3) + 3) % 3, base = hex(['#c4aee0', '#a890cc', '#d6c6ec'][b]);
    let c = (i + j * 0.4) / pr < -0.35 + (bay(i + 64, j + 64) - 0.5) * 0.3 ? mez(base, hex('#5a4a8a'), 0.45) : base; if (d > pr - 1) c = hex('#6a5a96'); if (i > 4 && j < -6 && d < pr - 2) c = mez(c, BL, 0.4); R.pset(px + i, py + j, c); }
  anillo(true);
  // la luna pequeña con cráteres
  R.disco(112, 26, 5, hex('#c8ccdc')); R.disco(113, 25, 4, hex('#eceef6')); R.pset(110, 25, hex('#b4b8cc')); R.pset(114, 28, hex('#b4b8cc')); R.pset(115, 24, hex('#c8ccdc'));
  // arbolitos en las colinas y la cabaña pequeña en lo alto del camino (tejado de paja, chimenea)
  for (let k = 0; k < 16; k++) { const x = Math.round(8 + k * 19 + hh(k, 21) * 9); if (x > 236 && x < 280) continue; const y = colina2(x) + 1 + Math.round(hh(k, 22) * 4), r = 2 + Math.round(hh(k, 23) * 2);
    R.rect(x, y, x, y + 3, hex('#4a3420')); R.disco(x, y - r + 1, r, hex('#2e6a30')); R.disco(x + 1, y - r, r - 1, hex('#4a8a3c')); R.pset(x + 1, y - 2 * r + 2, hex('#d8e080')); }
  const cy = colina2(258);
  caja(248, cy - 9, 268, cy, hex('#8a5a32'), hex('#a8743e'), hex('#6a4224')); R.rect(251, cy - 6, 254, cy - 3, hex('#3a4a5a')); R.pset(251, cy - 6, hex('#ffe8a0')); R.rect(259, cy - 7, 262, cy - 1, hex('#4a2c18'));
  R.poligono([[245, cy - 9], [258, cy - 17], [271, cy - 9]], hex('#d8b858')); R.linea(245, cy - 9, 258, cy - 17, hex('#f0dc88')); R.linea(258, cy - 17, 271, cy - 9, hex('#a88838')); R.rect(264, cy - 19, 266, cy - 13, hex('#7a7a80'));
  // la valla de piedra lejana a la izquierda del camino
  for (let x = 20; x < 120; x += 5) { const y = 125 + Math.round((x - 20) * 0.04); caja(x, y - 3, x + 5, y + 1, hex('#9a9aa0'), hex('#c4c4c8'), hex('#6a6a72')); }
  // las hierbas del prado: tallos con la punta encendida por el sol de cara
  for (let k = 0; k < 1500; k++) { const y = Math.round(124 + Math.pow(hh(k, 31), 0.8) * 56), x = Math.round(hh(k, 32) * 320), L = 1 + Math.round((y - 124) / 12 + hh(k, 33) * 2);
    const [cx, w] = camino2(y); if (Math.abs(x - cx) < w / 2 + 1) continue;
    R.linea(x, y, x + (hh(k, 34) < 0.5 ? 0 : 1), y - L, y > 150 ? hex('#24502a') : hex('#3a7832')); R.pset(x + (hh(k, 34) < 0.5 ? 0 : 1), y - L, hh(k, 35) < 0.6 ? hex('#c8e070') : hex('#e8e8a0')); }
};
// el polvo de luz: n motas que salen de (x0, y0) desde t0, suben y se las lleva el viento a la derecha
const polvoLuz = (x0, y0, t0, n, sem, t, ab = 6) => { for (let k = 0; k < n; k++) { const e = t - t0 - hh(k, sem) * 0.35; if (e <= 0 || e > 1.9) continue;
  const x = Math.round(x0 + (hh(k, sem + 1) - 0.5) * ab + e * (14 + hh(k, sem + 2) * 16) + Math.sin(e * 6 + k) * 2), y = Math.round(y0 + (hh(k, sem + 3) - 0.5) * ab - e * (18 + hh(k, sem + 4) * 22));
  const v = 1 - e / 1.9; if (v > 0.45) R.disco(x, y, 1.6, y < 118 ? hex('#c05a18') : hex('#e08a20')); R.disco(x, y, v > 0.45 ? 1 : 0.6, v > 0.25 ? hex('#ffd860') : hex('#f0a040')); R.pset(x, y, v > 0.6 ? BL : hex('#fff4c8')); } };
const muere2 = (k) => hh(k, 7) < 0.5;
const tMuere2 = (k, d = 1.3) => wiped - 0.1 + hh(k, 8) * d;
// las flores del prado (detrás y delante de Thanos según su y)
const FLOR2 = Array.from({ length: 120 }, (_, k) => { const y = Math.round(126 + Math.pow(hh(k, 50), 0.9) * 52); let x = Math.round(hh(k, 51) * 320); const [cx, w] = camino2(y); if (Math.abs(x - cx) < w / 2 + 2) x = Math.round(cx + (x < cx ? -1 : 1) * (w / 2 + 3 + hh(k, 52) * 20)); return [x, y, hex(['#f4f0e8', '#e83a3a', '#9a5ae0', '#f0c830'][k % 4]), k]; });
const florP = (t, [x, y, c, k]) => { const s = 1 + (y - 126) / 26, m = muere2(k), td = tMuere2(k);
  if (m && t > td + 0.35) { polvoLuz(x, y - 2 * s, td, 3, 60, t, 4); return; }
  const sw = Math.round(Math.sin(t * 2 + x * 0.05) * s * 0.6), hy = Math.round(y - 2.5 * s);
  R.linea(x, y, x + sw, hy, hex('#2e6a2a')); const blanco = m && t > td && Math.floor(t * 20) % 2;
  R.disco(x + sw, hy, Math.max(0.8, s * 0.8), blanco ? hex('#fff4c8') : c); R.pset(x + sw, hy, blanco ? BL : hex('#f8d048'));
  if (m && t > td) polvoLuz(x, hy, td, 3, 60, t, 4); };
// las flores grandes de delante: [x, alto, color, fase]
const GRANDES2 = [[14, 70, '#e83a3a', 0], [42, 52, '#f4f0e8', 1], [72, 38, '#9a5ae0', 2], [254, 42, '#f0c830', 3], [284, 68, '#e83a3a', 4], [312, 50, '#f4f0e8', 5]];
const florG = (t, [x, h, col, f]) => { const c = hex(col), m = f % 2 === 0, td = wiped + 0.05 + f * 0.12, d = m ? tramo(t, td, td + 1.1) : 0;
  const sw = Math.sin(t * 1.6 + f) * 2 * h / 50, hx = Math.round(x + sw), hy = 180 - h;
  if (d < 0.75) { for (let j = 0; j <= h; j++) { const u = j / h, sx = Math.round(x + sw * u * u), y = 180 - j; if (d > 0.4 && hh(sx, y, f) < (d - 0.4) * 3) continue; R.pset(sx, y, hex('#1e4a22')); R.pset(sx + 1, y, j % 9 < 2 ? hex('#3a7832') : hex('#5a9a3a')); }
    for (const [dy, lado] of [[Math.round(h * 0.35), -1], [Math.round(h * 0.55), 1]]) { const bx = Math.round(x + sw * 0.2), by = 180 - dy; R.poligono([[bx, by], [bx + lado * 13, by - 7 + Math.round(sw)], [bx + lado * 7, by + 2]], hex('#2e6a2a')); R.linea(bx, by, bx + lado * 13, by - 7 + Math.round(sw), hex('#6aa64c')); } }
  // la corola: seis pétalos al trasluz que se van uno a uno en polvo
  for (let i = 0; i < 6; i++) { if (d > (i + 1) / 7) continue; const a = i * Math.PI / 3 + f + Math.sin(t * 1.3 + f) * 0.1, ex = Math.round(hx + Math.cos(a) * 7), ey = Math.round(hy + Math.sin(a) * 5.5);
    R.disco(ex, ey, 4.6, mez(c, KK, 0.35)); R.disco(ex, ey, 3.9, c); R.disco(ex + 1, ey + 1, 2, mez(c, KK, 0.15)); R.pset(ex - 1, ey - 1, mez(c, BL, 0.6)); for (let r = 2; r <= 4; r++) R.pset(Math.round(ex + Math.cos(a) * r), Math.round(ey + Math.sin(a) * r), mez(c, hex('#fff4c8'), 0.55)); }
  if (d < 0.9) { R.disco(hx, hy, 3.4, hex('#7a4a18')); R.disco(hx, hy, 2.5, hex('#f0c030')); R.pset(hx + 1, hy, hex('#c8901c')); R.pset(hx, hy + 1, hex('#c8901c')); R.pset(hx - 1, hy - 1, hex('#fff0a0')); }
