<title>Balanza · ep8</title>

<body>
<canvas id="lienzo"></canvas>
<script type="module">
// EG-BALANZA (frase 29). En la sala del juicio, la balanza con el corazón a un lado y la pluma al otro; el sacerdote
// chacal la mira, y el monstruo (cabeza de cocodrilo) espera abriendo la boca. El corazón pesa más y la balanza se
// inclina.
import { preparar, rodar, tumba, EL } from '/atomo/plato/escenas/eg-comun.js';
const { E, R, M } = await preparar('eg-balanza');
const m0 = M('balanza', 0.5), L = E.duracion - m0;
const plano = (t) => {
  const u = t - m0;
  tumba(R, t, { modo: 'juicio', inclina: -R.tramo(u, 0.55 * L, 0.75 * L) });
  R.actor(EL.chacal, 96, 145, t, {});
};
rodar(E, R, [[0, plano]], { año: -1300 });
</script>
</body>
