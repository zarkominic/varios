<title>Cobre · ep5</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// RM-COBRE (frases 59–60). El denario pierde brillo año a año hasta ser cobre con una cara bonita: la barra baja a «5%»
// y la caja cuenta los años. Luego, de la plata salen átomos que vuelan, uno a un anillo y otro a un teléfono.
import { preparar, rodar } from '/atomo/plato/escenas/rm-comun.js';
const { E, R, M } = await preparar('rm-cobre');
const { PALA, PR, tramo, lerp } = R;
const m = { cob: M('cobre', 0.5), pla: M('plata', 10) };
const cobre = (t) => {
  R.cieloR(t, 'tarde', { sol: [60, 140, 12], nubes: { n: 3 } });
  const plata = lerp(0.95, 0.04, tramo(t, m.cob + 2, m.cob + 7));
  R.denario(140, 86, 46, plata, t);
  R.barra(266, 150, 86, plata);
};
const atomos = (t) => {
  R.cieloR(t, 'tarde', { sol: [160, 150, 12], nubes: { n: 3 } });
  const u = t - m.pla;
  R.denario(160, 92, 30, 0.04, t, { brillo: false });
  // anillo (izquierda) y teléfono (derecha)
  R.anillo(70, 70, 10, PR.PLATA[3]); R.anillo(70, 70, 9, PR.PLATA[2]); R.disco(70, 59, 3, PALA.TURQUESA[3]);
  R.rect(236, 46, 262, 96, PALA.NEGRO[1]); R.rect(238, 50, 260, 90, PALA.AZUL[1]); R.disco(249, 70, 3, PALA.AZUL[3]);
  for (let k = 0; k < 6; k++) {
    const f = ((u * 0.3 + k / 6) % 1), lado = k % 2 ? 1 : -1, tx = lado > 0 ? 249 : 70, ty = 70;
    const x = lerp(160, tx, f), y = lerp(92, ty, f) - Math.sin(f * Math.PI) * 30;
    if (u > 0.5) R.atomo(Math.round(x), Math.round(y), t + k, { r: 4 });
  }
};
rodar(E, R, [[0, cobre], [m.pla - 0.2, atomos]], { caja: (t, e) => R.caja(t, t > m.cob + 1.6 && t < m.pla - 0.2 ? tramo(t, m.cob + 1.6, m.cob + 2) : 0, (x, y) => R.numero(String(Math.round(lerp(0, 270, tramo(t, m.cob + 2, m.cob + 7)))), x + 6, y + 12), { energia: e }) });
</script>
</body>
</html>
