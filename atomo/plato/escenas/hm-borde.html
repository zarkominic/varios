<script type="module">
// HM-BORDE (frases 24–25), Juegos 50 (75 en el plano 3), sin cartela; ánimo épico. Ocho planos; PAUSA 2 en 1–4:
// (sonido de las pausas: entra con «cuelga» —no hay receta de tape-stop— y sale con «interruptor», el clic, en cada
//  salida de la pausa (rampa de AT.pausa) y en cada vuelta a ella; un pop por cada cosa que sale a color)
// 1. PAUSA: el borde de lado de hm-arena CONGELADO en gris azulado; Atom sale a color de su luciérnaga, baja a la cima,
//    rodea con su órbita el piñón («notice this») y, en «idea», el punto del muro donde chocó (los hexágonos a color);
// 2. PAUSA, el gag, con su propio encuadre: el MISMO instante congelado visto desde la meseta (cámara general del
//    borde; los dos chicos quietos en las flores): Atom cruza hasta el filo y sigue por el aire («¿?»), empuja el muro
//    invisible con la mano (las ondas de hexágonos a color) y en «weapon» el muro se pone rojo y le devuelve el empujón
//    hasta la hierba; al final vuelve el color (clic);
// 3. Juegos 75: el holograma del reloj; Plutarch entra, sube los dos peldaños de la tarima de la consola y en «cage
//    works» toca con el dedo el filo del holograma (destello en la yema, ondas por el campo, el aro se enciende desde
//    su dedo y da la vuelta); en «no longer… a prisoner» el sinsajo (alas claras y contorno de luz) sale de la
//    cornucopia y vuela por encima de la selva verde hasta salir por la izquierda;
// 4. PAUSA: el borde congelado otra vez (entra en gris con el fundido); en «Katniss» sale ella a color al doble, en «aims» monta la flecha, en «arrow»
//    la flecha con su cable sube y en «sky» se clava en una cúpula de hexágonos que se agrieta con un rayo; vuelve el color;
// 5. el bosque de la arena, la rama grande: Haymitch vigila; en «birds» una bandada de pájaros rosas (siluetas con
//    alas que baten y contorno) baja en espiral por el claro y se mete en las copas; él la señala («!»), se echa atrás
//    hacia el tronco (la bandada pasa alta, por las copas) y en «just for her» se da la vuelta, triste, y se va rama abajo;
// 6. el borde de lejos, de tarde: Haymitch junto al filo; la chica del 1 llega por la izquierda («a girl from
//    District 1»), con las manos vacías (el hacha solo se ve en la maqueta), le señala y en «throws» alza los brazos:
//    una ráfaga de pétalos cruza y Haymitch se echa atrás; corte;
// 7. la sala de control: la maqueta holográfica con dos lucecitas, «12» y «1»; el hacha sale de la naranja, la dorada se
//    aparta en «dodges», el hacha choca con la cúpula en «hits» (destello y ondas), vuelve «the way it came» y la luz
//    ámbar se apaga; el contador baja de 2 a 1;
// 8. el plató: la pantalla grande con rayos que giran, focos que barren, chispas y la grada de la arena a contraluz
//    que bota; el «1» dorado con su laurel que crece y el retrato de Haymitch que entra deslizándose; Caesar cruza el
//    plató presentando, se planta y señala la pantalla y en «wins» salta con los brazos arriba; cae el confeti.
import * as T from '/atomo/plato/escenas/hm-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hm-borde');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const AT = T.AT, K = hex('#1a1424'), BL = hex('#ffffff');
const ri = Math.round, S3 = Math.sqrt(3);
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], bay = (x, y) => (B4[((y & 3) << 2) | (x & 3)] + 0.5) / 16;
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (ri(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (ri(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | ri(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
const tono = (x, y, c, u) => { x = ri(x); y = ri(y); if (u <= 0 || x < 0 || y < 0 || x > 319 || y > 179) return; R.pset(x, y, mez(R.pget(x, y), c, Math.min(1, u))); };
// un rectángulo que respeta R.recorte (R.rect no lo respeta)
const caja = (x0, y0, x1, y1, c) => { for (let y = ri(y0); y <= ri(y1); y++) for (let x = ri(x0); x <= ri(x1); x++) R.pset(x, y, c); };
// halo tramado (Bayer) que aclara hacia c
const halo = (cx, cy, r, c, f = 0.5) => { for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) { const g = 1 - Math.hypot(i, j) / r; if (g > 0 && g * f > bay(ri(cx + i), ri(cy + j))) tono(cx + i, cy + j, c, 0.5); } };
// un «pop»: 0 antes de a; sube con un rebote y se asienta en 1
const pop = (t, a, d = 0.3) => { const u = Math.max(0, Math.min(1, (t - a) / d)); return u <= 0 ? 0 : u < 1 ? 1 - Math.pow(1 - u, 3) * Math.cos(u * 7) : 1; };
// dibuja f a escala 1 en la esquina de arriba (con una marca) y lo pega en (X, Y) con escalas sx, sy (para voltear)
const MARCA = 0xff00ff01 >>> 0;
const pegar = (f, w, h, X, Y, sx, sy = sx) => {
  const B = R.buf, copia = B.slice(); for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) B[y * 320 + x] = MARCA;
  f(); const px = []; for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const c = B[y * 320 + x]; if (c !== MARCA) px.push([x, y, c]); }
  B.set(copia);
  for (const [x, y, c] of px) { const X0 = ri(X + x * sx), Y0 = ri(Y + y * sy), X1 = ri(X + (x + 1) * sx) - 1, Y1 = ri(Y + (y + 1) * sy) - 1; if (X1 >= X0 && Y1 >= Y0) R.rect(X0, Y0, X1, Y1, c); }
};
// el campo de fuerza a color: celdas hexagonales (radio a) en la caja [x0..x1, y0..y1], con una onda que sale de (cx, cy)
// a la distancia «ola» y un brillo cerca del toque; fuerza 0–1; col el color
const panal = (x0, x1, y0, y1, cx, cy, ola, fuerza, col, a = 6, base = 0, dentro = null) => {
  if (fuerza <= 0 && base <= 0) return;
  for (let y = Math.max(0, y0); y <= Math.min(179, y1); y++) for (let x = Math.max(0, x0); x <= Math.min(319, x1); x++) {
    if ((dentro && !dentro(x, y)) || (x >= 274 && y <= 47) || (x <= 172 && y <= 21)) continue;   // ni la zona de Atom ni la barra del año
    const d = Math.hypot(x - cx, y - cy), w = Math.max(0, fuerza) * (Math.exp(-((d - ola) ** 2) / 90) + Math.max(0, 1 - d / 34) * 0.7) + base;
    if (w < 0.06) continue;
    const q = (2 / 3 * x) / a, r = (-1 / 3 * x + S3 / 3 * y) / a, s = -q - r;
    let rq = Math.round(q), rr = Math.round(r), rs = Math.round(s);
    const dq = Math.abs(rq - q), dr = Math.abs(rr - r), ds = Math.abs(rs - s);
    if (dq > dr && dq > ds) rq = -rr - rs; else if (dr > ds) rr = -rq - rs; else rs = -rq - rr;
    const e = (Math.abs(q - rq) + Math.abs(r - rr) + Math.abs(s - rs)) / 2;
    if (e > 0.36) tono(x, y, col, w * 1.1); else if (e > 0.3) tono(x, y, col, w * 0.45); else if (w > 0.4 && bay(x, y) < 0.3) tono(x, y, col, w * 0.25);
  }
};
// el hacha: (x, y) el centro del mango, giro en radianes, s escala; mango de madera y hoja de acero con su filo
const hacha = (x, y, giro, s = 1, brillo = 0) => {
  const c = Math.cos(giro), sn = Math.sin(giro), P = (u, v) => [ri(x + (u * c - v * sn) * s), ri(y + (u * sn + v * c) * s)];
  const pinta = (f) => { for (let u = -5; u <= 6; u += 0.34) for (let v = -4; v <= 1.5; v += 0.34) { const col = f(u, v); if (col) { const [px, py] = P(u, v); R.pset(px, py, col); } } };
  pinta((u, v) => (Math.abs(v) < 1.3 && u <= 4.6) || (u > 2.2 && u < 5.9 && v > -4.2 && v < 1.4) ? K : 0);
  pinta((u, v) => Math.abs(v) < 0.5 && u < 4 ? (v < 0 ? hex('#b8804a') : hex('#7a4a22')) : u > 2.7 && u < 5.3 && v > -3.6 && v < 0.8 ? (v < -2.8 ? BL : u > 4.6 ? hex('#8a94a4') : hex('#c8d0dc')) : 0);
  if (brillo > 0) halo(P(4, -2)[0], P(4, -2)[1], 6, hex('#fff0b0'), brillo);
};
// la corona del vencedor (12 × 8): aro de oro con picos y tres gemas; (x, y) el centro de abajo
const corona = (x, y, s = 1) => pegar(() => {
  R.rect(0, 3, 11, 7, K); R.rect(1, 4, 10, 6, hex('#f0c040')); R.rect(1, 6, 10, 6, hex('#a87a18'));
  for (const i of [0, 4, 8]) { R.rect(i, 0, i + 3, 3, K); R.rect(i + 1, 1, i + 2, 3, hex('#f0c040')); R.pset(i + 1, 1, hex('#fff0a0')); }
  R.pset(2, 5, hex('#c8303a')); R.pset(6, 5, hex('#3a8ad8')); R.pset(9, 5, hex('#3ab05a')); R.pset(1, 4, hex('#fff0a0'));
}, 12, 8, ri(x - 6 * s), ri(y - 8 * s), s);
// confeti que cae (n papelitos de colores; semilla k)
const CONF = ['#f0c040', '#e86a9a', '#5ac8e8', '#9ae85a', '#ffffff', '#c86ae8'].map((c) => hex(c));
const confeti = (t, t0, n = 70, k = 0) => { if (t < t0) return; for (let i = 0; i < n; i++) { const h = Math.sin(i * 91.7 + k) * 43758.5; const f = h - Math.floor(h);
  const x = (f * 340 + Math.sin(t * 2 + i) * 6) % 330 - 5, y = -8 + (t - t0) * (40 + f * 50) - ((i * 37) % 120); if (y < -4 || y > 182) continue;
  const c = CONF[i % CONF.length]; R.pset(ri(x), ri(y), c); if (Math.sin(t * 9 + i) > 0) R.pset(ri(x) + 1, ri(y), c); else R.pset(ri(x), ri(y) + 1, mez(c, K, 0.3)); } };

const P2 = en('fijate2', 0.2215), P3 = en('fijate2', 0.432), P4 = en('fijate2', 0.6705), P5 = en('fijate2', 1.0082), P6 = en('hacha', 0.227), P7 = en('hacha', 0.4968), P8 = en('hacha', 0.8432);
const VOZ = ['fijate2', 'hacha'].map((k) => [en(k, 0), en(k, 1)]);
const habla = (t) => VOZ.some(([a, b]) => t > a && t < b) ? 1 : 0;

// ── el mundo congelado: el último fotograma de hm-arena (plano 14, borde/acantilado), en el reloj de hm-arena ──
const TA = 78.2, T0A = 72.557;   // su último instante y el lanzamiento del piñón (maysilee + 0,724 de la frase)
const OA = { encuadre: 'borde', camara: 'acantilado', luz: 'dia', rebote: [T0A, 144, 102], objeto: 'pinon' };
let HELADO = null, GA = null;
const helado = () => {
  if (!HELADO) {
    const b = R.nuevo(), prev = R.usar(b);
    const g = T.arena50(R, TA, OA); GA = g; const ti = g.rebote.impacto[0], tc = g.rebote.cae[0];
    R.actor(EL.haymitch, 128, g.suelo, TA, { dir: 1, brazos: TA > tc && TA < tc + 0.6, sorpresa: TA > ti && TA < tc + 1.2, habla: Math.sin(TA * 8) > 0 });
    R.actor(EL.maysilee, 98, g.suelo, TA, { dir: 1, sorpresa: TA > ti && TA < tc + 1.0, dedo: true, sonrisa: true });
    T.arena50Delante(R, TA, OA);
    R.usar(prev); HELADO = b;
  }
  R.copiar(HELADO); return GA;
};
// el MISMO instante congelado, visto desde la meseta (cámara general del borde): la pausa 2 tiene su propio encuadre
const OB = { encuadre: 'borde', camara: 'general', luz: 'dia' };
let HELADO2 = null, GB = null;
const helado2 = () => {
  if (!HELADO2) {
    const b = R.nuevo(), prev = R.usar(b);
    const g = T.arena50(R, TA, OB); GB = g;
    R.actor(EL.maysilee, 70, g.suelo, TA, { dir: 1, sorpresa: true, dedo: true, sonrisa: true });
    R.actor(EL.haymitch, 96, g.suelo, TA, { dir: 1, sorpresa: true });
    T.arena50Delante(R, TA, OB);
    R.usar(prev); HELADO2 = b;
  }
  R.copiar(HELADO2); return GB;
};
const CIAN = hex('#8ff0ff'), ROJO = hex('#ff6a3a'), ORO = hex('#ffd34a');

// ═══ 1 · PAUSA: Atom sale de la luciérnaga, señala el piñón y el punto del muro ═══
const p1 = (t) => {
  const g = helado(); AT.pausa(R, tramo(t, 0.04, 0.34));
  const [, ix, iy] = g.rebote.impacto, [, cx] = g.rebote.cae, cy = g.suelo - 2;
  // el piñón caído (a color, con su órbita) en «this», y el punto del muro en «idea»
  const u1 = tramo(t, en('fijate2', 0.0175), en('fijate2', 0.0451));
  if (u1 > 0) { halo(cx, cy, 7, ORO, 0.5 * u1); AT.anillo(R, cx, cy - 1, 9, 6, t, u1); }
  const u2 = tramo(t, en('fijate2', 0.1353), en('fijate2', 0.1704));
  if (u2 > 0) { panal(196, 319, 48, 170, ix, iy, Math.min(46, (t - en('fijate2', 0.1353)) * 60), 0.9 * u2 * (0.75 + Math.sin(t * 5) * 0.25), CIAN); AT.anillo(R, ix, iy, 15, 20, t, u2); }
  if (t < 0.85) { const v = tramo(t, 0.05, 0.85); AT.luciernaga(R, lerp(54, 52, v), lerp(74, 104, v) + Math.sin(t * 6) * 2, t, { dir: 1, cara: 'sorpresa' }); return; }
  const a = tramo(t, 1.0, 2.2), x = lerp(40, 58, a);
  const pose = a > 0 && a < 1 ? 'camina' : t > en('fijate2', 0.1303) ? 'senala' : t > en('fijate2', 0.0175) && t < en('fijate2', 0.0852) ? 'senala' : 'quieto';
  AT.atom(R, x, 121 - (t < 1.0 ? (1 - tramo(t, 0.85, 1.0)) * 6 : 0), t, { s: 2, pose, dir: 1, cara: t > en('fijate2', 0.1353) ? 'sonrisa' : t < 1.4 ? 'sorpresa' : 'normal', habla: habla(t) });
};

// ═══ 2 · PAUSA, el gag: Atom cruza el vacío, empuja el muro y el muro le devuelve el empujón ═══
const AIRE = en('fijate2', 0.2831), EMPUJA = en('fijate2', 0.3232), ARMA = en('fijate2', 0.3738);
const p2 = (t) => {
  const g = helado2(); AT.pausa(R, 1 - tramo(t, P3 - 0.42, P3 - 0.04));
  // de lejos, desde la meseta: Atom sale de junto a los dos chicos (congelados), cruza las flores hasta el filo, sigue
  // por el aire, empuja el muro y el muro le devuelve el empujón hasta la hierba
  // (el muro va unos px más allá del filo que en la cámara general de hm-arena, para que se vea a Atom andar sobre el vacío)
  const Y = g.suelo + 6, FILO = 212, MURO = 256, alto = (x, y2) => y2 > 56 + bay(x, y2) * 18 + Math.sin(x * 0.17) * 3;
  let x, y = Y, pose = 'camina', cara = 'normal', dir = 1;
  if (t < AIRE) { x = lerp(124, FILO, tramo(t, P2 + 0.15, AIRE)); }
  else if (t < AIRE + 0.5) { x = FILO + (t - AIRE) * 16; pose = 'quieto'; cara = 'sorpresa'; }   // ¡anda por el aire!
  else if (t < EMPUJA) { x = lerp(FILO + 8, MURO - 26, tramo(t, AIRE + 0.5, EMPUJA)); }
  else if (t < ARMA) { x = MURO - 26 + Math.sin((t - EMPUJA) * 9) * 1.2; pose = 'senala'; cara = t > ARMA - 0.4 ? 'sorpresa' : 'normal'; }
  else { const v = tramo(t, ARMA, ARMA + 0.55); x = lerp(MURO - 26, 140, 1 - (1 - v) * (1 - v)); y = Y - Math.sin(v * Math.PI) * 30; pose = v < 1 ? 'brazos' : 'quieto'; cara = v < 1 ? 'sorpresa' : t > ARMA + 1.0 ? 'triste' : 'sorpresa'; }
  // el muro: ondas a color desde la mano mientras empuja; en «weapon» se pone rojo y empuja
  const tx = MURO + 2, ty = Y - 22, M0 = MURO - 2;
  const muro = 0.42 * tramo(t, en('fijate2', 0.2255), en('fijate2', 0.2556)) * (t < ARMA ? 1 : 1 - tramo(t, ARMA + 0.4, ARMA + 1.2) * 0.4);
  if (t <= EMPUJA) panal(M0, 319, 30, 179, tx, ty, 0, 0, CIAN, 6, muro + Math.sin(t * 3) * 0.05, alto);
  if (t > EMPUJA && t < ARMA) panal(M0, 319, 30, 179, tx, ty, ((t - EMPUJA) * 50) % 60, 0.85 + 0.15 * Math.sin(t * 7), CIAN, 6, muro, alto);
  if (t >= ARMA) { const s = t - ARMA; panal(M0, 319, 30, 179, tx, ty, s * 140, Math.max(0, 1 - s / 1.0), s < 0.5 ? ROJO : CIAN, 6, s < 0.5 ? 0.55 : muro, alto); }
  if (t > ARMA + 0.55 && t < ARMA + 1.0) for (let i = 0; i < 6; i++) { const s = t - ARMA - 0.55, px = x + (i - 2.5) * 6 * (1 + s * 3), py = Y - s * 10 - (i % 2) * 3; R.pset(ri(px), ri(py), hex('#d8d0c0')); R.pset(ri(px) + 1, ri(py), hex('#b8b0a0')); }
  const r = AT.atom(R, x, y, t, { s: 2, pose, dir, cara, habla: habla(t) });
  if (t > AIRE && t < AIRE + 0.9) R.icono('?', ri(x) - 5, Y - 58 + ri(Math.sin(t * 8)), hex('#ffd34a'), K, 2);
  if (t > ARMA + 0.55 && t < ARMA + 1.2) for (let i = 0; i < 3; i++) { const p = t * 5 + i * 2.1; R.pset(ri(r.centro[0] + Math.cos(p) * 14), ri(r.centro[1] - 20 + Math.sin(p) * 4), ORO); }
};

// la tarima de la consola: dos peldaños de chapa estriada junto al aro proyector, con su barandilla y sus pilotos
const PELD = [[30, 52, 163], [52, 98, 151]];   // [x0, x1, y de arriba] de cada peldaño
const pieEn = (fx) => fx < PELD[0][0] + 3 ? 174 : fx < PELD[1][0] + 2 ? PELD[0][2] : PELD[1][2];
const tarima = (t) => {
  const M1 = hex('#4a5a78'), M2 = hex('#2e3a54'), M3 = hex('#7a8cb0'), FR = hex('#1a2236');
  for (const [x0, x1, y0] of PELD) {
    R.rect(x0, y0, x1, 175, K); R.rect(x0 + 1, y0 + 1, x1 - 1, 174, M2);
    R.rect(x0 + 1, y0 + 1, x1 - 1, y0 + 3, M1); R.linea(x0 + 1, y0 + 1, x1 - 1, y0 + 1, M3);   // la huella con su canto de luz
    for (let x = x0 + 3; x < x1 - 1; x += 4) { R.pset(x, y0 + 2, M3); R.pset(x + 1, y0 + 3, M2); }   // la chapa estriada
    for (let y = y0 + 6; y < 172; y += 5) for (let x = x0 + 3; x < x1 - 2; x += 6) R.pset(x + ((y >> 2) & 1) * 3, y, FR);   // la rejilla de ventilación
    R.pset(x0 + 2, y0 + 5, M3); R.pset(x1 - 2, y0 + 5, M3);   // remaches
  }
  // pilotos que parpadean en la contrahuella y la barandilla de tubo
  for (let k = 0; k < 5; k++) { const on = Math.sin(t * 3 + k * 1.7) > 0.2; R.pset(58 + k * 8, 168, on ? hex('#5af0ff') : hex('#1a4a5a')); }
  R.pset(36, 170, Math.sin(t * 5) > 0 ? hex('#ffb040') : hex('#5a3a1a'));
  R.linea(30, 139, 30, 163, K); R.linea(31, 139, 31, 163, M3); R.linea(30, 139, 52, 127, K); R.linea(31, 140, 52, 128, M3); R.linea(52, 127, 52, 151, K); R.linea(53, 128, 53, 151, M1);
  for (let x = 30; x <= 98; x++) R.pset(x, 175, hex('#0c1020'));   // la sombra sobre el suelo
};
// el sinsajo, claro y legible sobre el holograma: el del kit (s 1) con las alas grises aclaradas y un contorno de luz,
// pegado a escala s; (X, Y) el centro del pájaro
const SJ_OSC = hex('#3a3646'), SJ_ALA = hex('#d8dee8'), SJ_FILO = hex('#fff6dc');
const sinsajoClaro = (X, Y, s, dir, t) => {
  const B = R.buf, copia = B.slice(), w = 32, h = 28;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) B[y * 320 + x] = MARCA;
  T.PIEZAS_JH.sinsajo(R, 16, 16, { s: 1, dir, t });
  const px = [], hay = new Set();
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const c = B[y * 320 + x]; if (c !== MARCA) { px.push([x, y, c]); hay.add(y * w + x); } }
  B.set(copia); if (!px.length) return;
  let sx = 0, sy = 0; for (const [x, y] of px) { sx += x; sy += y; } sx /= px.length; sy /= px.length;

    for (let i = 0; i < nh; i++) { const a = Math.PI * (0.15 + i / 30), X = cx + 26 + Math.cos(a) * -22, Y = cy + 2 + Math.sin(a) * 22 * 0.8, c = i % 2 ? hex('#4aa04a') : hex('#7ad06a'); R.pset(ri(X), ri(Y), c); R.pset(ri(X) + 1, ri(Y) - 1, hex('#2a6a2a')); R.pset(ri(2 * (cx + 26) - X), ri(Y), c); R.pset(ri(2 * (cx + 26) - X) - 1, ri(Y) - 1, hex('#2a6a2a')); }

  // el retrato del vencedor: entra deslizándose desde la izquierda con su marco dorado; dentro, un cielo de la arena

};

};
