<html lang="es">
<head>

<title>Carter · ep36</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// TU-CARTER (frases 4–5), 1922, cartela «1922». Siete planos:
// 1. el Valle de los Reyes al sol: Carter entra y cava cuatro paladas junto a los montones al decir «digging» (la arena
//    vuela al montón), luego señala el valle; un obrero con su cesta en la cabeza llega por la derecha;
// 2. la casa de trabajo: Carter sale por la puerta con el plano enrollado y señala la mesa («looking for the tomb»);
//    detrás de la mesa, lord Carnarvon cuenta billetes al decir «money» y suspira, la mano en la frente, al oír su nombre;
// 3. la mesa desde arriba: la mano de Carnarvon entra por el borde de abajo y se lleva los billetes uno a uno («paying for
//    sand»: 3 → 2 → 1), la cuenta se cierra en un 0 rojo y, mientras la mano tamborilea junto al último billete, el
//    lápiz rojo rodea el 1922 del calendario («one last season»); sin la pluma del decorado (mano: false: la libreta y
//    el calendario quedan lejos de los bordes y un brazo hasta ellos sería largo);
// 4. las chozas de los obreros antiguos: dos obreros se llevan las piedras de los muretes («clearing … huts») y Carter
//    lo dirige y señala el suelo del medio; corta en «found»;
// 5. a ras de suelo: la mano (hombro fuera, por abajo) barre la arena y aparece el escalón tallado en la roca en perfil
//    (huella, canto con luz y tabica en sombra), con la brocha y el cazo apoyados en la huella; detrás, otros dos que
//    salen de la arena entre las paredes de la zanja («then another and another»), y cada canto destella al quedar a la
//    vista; al otro lado de la zanja Carter se sorprende y señala, un obrero levanta los brazos (los escalones, las
//    paredes, la brocha y el cazo los pinta el decorado; la escena ya no pinta rayas propias encima);
// 6. la puerta tapiada: la luz del farol de mano (o.foco del decorado) recorre las tres filas de sellos al decir «blocked
//    doorway with its seals» y se para en el intacto (164, 96), que brilla en «intact»; la esquina de Atom va desenfocada
//    y en calma; el farol se retira y una pala vuelca arena que sube por delante del enlucido («covered it up again»).
//    Efectos (~44 % del tiempo): las cuatro paladas, las piedras de la cesta, los tirones de cinta, el burro (cascos, masca);
// 7. el telégrafo (gag 2): la mano del telegrafista (antebrazo corto, desde abajo) tira de la cinta de puntos y rayas, que
//    no se acaba, corre cada vez más deprisa y sale por la puerta a la tierra de la calle; una salamanquesa cruza la
//    pared, las pilas de vidrio burbujean; fuera, recortado al hueco de la puerta, un burro chibi llega por la calle,
//    agacha la cabeza y se come la punta de la cinta («he would wait for him»; burro: 0 quita la cabeza grande del decorado).
import * as T from '/atomo/plato/escenas/tu-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('tu-carter');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const a = (f) => en('carter', f), b = (f) => en('escalon', f);
const P2 = a(0.35), P3 = a(0.76), P4 = b(0) - 0.15, P5 = b(0.255), P6 = b(0.468), P7 = b(0.68);
const N = (x) => Math.round(x);
const h3 = (x, y, k) => { const v = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return v - Math.floor(v); };
// una piedra de murete en la mano (o en el suelo)
const piedra = (x, y, k = 0) => {
  R.rect(x - 5, y - 4, x + 5, y + 3, hex('#2a2018')); R.rect(x - 4, y - 3, x + 4, y + 2, hex(k % 2 ? '#b89a72' : '#a88a64'));
  R.rect(x - 4, y - 3, x + 1, y - 3, hex('#e0caa4')); R.rect(x + 2, y + 1, x + 4, y + 2, hex('#7a6248')); R.pset(x - 1, y, hex('#8a7254'));
};
// polvo de arena que salta (u 0–1 desde el golpe)
const polvo = (x, y, u, k = 0) => {
  if (u <= 0 || u >= 1) return;
  for (let i = 0; i < 7; i++) { const ang = -Math.PI * (0.15 + 0.7 * ((i * 37 + k * 11) % 10) / 10), r = 2 + u * (5 + (i % 3) * 2);
    R.pset(N(x + Math.cos(ang) * r), N(y + Math.sin(ang) * r * 0.7 + u * u * 4), hex(i % 2 ? '#e8d4a8' : '#c8ac7c')); }
};

// 1 · el valle: Carter entra, pica la arena al decir «digging» y se queda mirando los montones
const golpes = [a(0.19), a(0.215), a(0.24), a(0.265)];
const p1 = (t) => {
  const geo = T.valle(R, t, { encuadre: 'valle', luz: 'dia', epoca: 1922 });
  const s = geo.suelo;
  // el obrero de la cesta cruza por la arena, de derecha a izquierda, por detrás de Carter
  const vo = tramo(t, 1.6, a(0.2)), xo = N(lerp(326, 268, vo));
  const ob = R.actor(T.ELENCO_TU.obrero2TU, xo, s - 4, t, { dir: -1, anda: vo > 0 && vo < 1, sostiene: [xo + 2, s - 32], sonrisa: t > a(0.3) });
  { const [mx, my] = ob.mano; R.rect(mx - 6, my - 6, mx + 6, my, hex('#2a1c10')); R.rect(mx - 5, my - 5, mx + 5, my - 1, hex('#b8925a'));
    for (let i = -4; i <= 4; i += 2) R.pset(mx + i, my - 3, hex('#8a6a3a')); R.rect(mx - 4, my - 7, mx + 4, my - 6, hex('#e8d4a8')); }
  // Carter: entra andando, cava cuatro paladas (la hoja entra, sube cargada y echa la arena al montón) y mira los montones
  const va = tramo(t, 1.4, a(0.16)), xc = N(lerp(150, 198, va));
  let fase = -1, k0 = 0; for (const [k, g] of golpes.entries()) { const u = (t - g + 0.15) / 0.62; if (u >= 0 && u < 1) { fase = u; k0 = k; } }
  const cava = t > a(0.165) && t < a(0.3);
  const hy = fase < 0 ? 0 : fase < 0.35 ? fase / 0.35 * 3 : fase < 0.7 ? 3 - (fase - 0.35) / 0.35 * 11 : -8 + (fase - 0.7) / 0.3 * 8;   // la hoja: hunde, sube, vuelve
  const hx = fase < 0.35 ? 0 : fase < 0.7 ? (fase - 0.35) / 0.35 * 5 : 5 - (fase - 0.7) / 0.3 * 5;
  const bx = xc + 26 + N(hx), by = s - 1 + N(hy);
  const cv = R.actor(T.ELENCO_TU.carterTU, xc, s, t, { dir: 1, anda: va > 0 && va < 1, sostiene: cava ? [xc + 18, s - 15 + N(hy * 0.5)] : null, sonrisa: t > a(0.31), dedo: t > a(0.31) && t < P2 - 0.1 });
  if (cava) {
    const [mx, my] = cv.mano;
    R.linea(mx - 2, my - 3, bx, by - 5, hex('#2a1a10')); R.linea(mx - 1, my - 3, bx + 1, by - 5, hex('#a87444')); R.linea(mx - 1, my - 4, bx, by - 6, hex('#d09a5c'));   // el mango
    R.rect(mx - 4, my - 5, mx, my - 3, hex('#2a1a10'));   // el puño del mango
    R.poligono([[bx - 3, by - 6], [bx + 4, by - 6], [bx + 3, by + 1], [bx, by + 3], [bx - 3, by + 1]], hex('#22222a'));
    R.poligono([[bx - 2, by - 5], [bx + 3, by - 5], [bx + 2, by], [bx, by + 2], [bx - 2, by]], hex('#8a8a96')); R.pset(bx - 1, by - 4, hex('#d8d8e4'));
    if (fase >= 0.35 && fase < 0.7) { R.rect(bx - 2, by - 8, bx + 3, by - 6, hex('#e0c48e')); R.pset(bx, by - 9, hex('#f0dcb0')); }   // la palada cargada
  }
  // la arena que vuela al montón y el polvo de cada palada
  for (const [i, g] of golpes.entries()) {
    const f = (t - g - 0.3) / 0.45; if (f > 0 && f < 1) for (let q = 0; q < 5; q++) { const x = N(xc + 30 + f * (18 + q * 3)), y = N(s - 14 - Math.sin(f * Math.PI) * (12 + q) + q); R.rect(x, y, x + 1, y + 1, hex(q % 2 ? '#e8d0a0' : '#c8a676')); }
    polvo(xc + 27, s - 1, (t - g) / 0.5, i); polvo(xc + 52, s - 6, (t - g - 0.75) / 0.5, i + 3);
  }
  T.valleDelante(R, t, { encuadre: 'valle', luz: 'dia', epoca: 1922 });
};

// 2 · la casa de trabajo: Carter sale con el plano; Carnarvon, detrás de la mesa, cuenta los billetes y suspira
const cuenta = [a(0.565), a(0.6), a(0.635), a(0.67)], suspira = a(0.7);
const p2 = (t) => {
  const bil = lerp(0.3, 0.7, tramo(t, a(0.56), a(0.74)));
  const geo = T.valle(R, t, { encuadre: 'tienda', luz: 'dia', billetes: bil });
  // Carnarvon detrás de la mesa: cuenta, luego suspira (triste) y se echa atrás
  const cuentaAhora = cuenta.some((c) => t > c && t < c + 0.22), triste = t > suspira;
  const cn = R.actor(T.ELENCO_TU.carnarvonTU, 150, geo.detras, t, { dir: 1, sostiene: t > a(0.55) && !triste ? [166, cuentaAhora ? 120 : 124] : triste && t < suspira + 1.4 ? [161, 108] : null, triste, habla: t > a(0.38) && t < a(0.5) && Math.sin(t * 8) > 0 });
  if (t > a(0.55) && !triste) { const [mx, my] = cn.mano; R.rect(mx - 1, my - 5, mx + 5, my - 1, hex('#1c2a18')); R.rect(mx, my - 4, mx + 4, my - 2, hex('#7aa86a')); R.pset(mx + 2, my - 3, hex('#3a5a2a')); }
  if (triste) { const u = tramo(t, suspira, suspira + 1.2); for (let i = 0; i < 3; i++) { const yy = N(108 - u * 10 - i * 3); if (u > i * 0.2 && u < 1) R.pset(150 + 14 + i * 2, yy, hex('#f4f0e8')); } }
  // Carter sale por la puerta con el plano enrollado, se para en la pared clara y lo explica señalando la mesa
  const vc = tramo(t, P2 + 0.1, P2 + 1.5), xc = N(lerp(220, 246, vc));
  const dedo = t > a(0.4) && t < a(0.5);
  const cv = R.actor(T.ELENCO_TU.carterTU, xc, geo.suelo, t, { dir: -1, anda: vc > 0 && vc < 1, dedo, habla: dedo && Math.sin(t * 7) > -0.2, sostiene: !dedo ? [xc - 3, geo.suelo - 14] : null, sonrisa: t > suspira });
  if (!dedo) { const [mx, my] = cv.mano; R.rect(mx - 2, my - 9, mx + 2, my + 3, hex('#3a2a18')); R.rect(mx - 1, my - 8, mx + 1, my + 2, hex('#e8dcc0')); R.pset(mx, my - 8, hex('#c8b08a')); }
  T.valleDelante(R, t, { encuadre: 'tienda', luz: 'dia', billetes: bil });
};

// 3 · la mesa desde arriba: la mano de Carnarvon, desde el borde de abajo, se lleva los billetes que quedan («paying for
// sand»); la cuenta se cierra en un 0 rojo y el lápiz rojo rodea el 1922 del calendario («one last season»).
// (La libreta y el calendario están a 60–100 px de cualquier borde: un brazo que llegue a ellos sería un brazo largo,
// así que la mano trabaja solo junto al borde, sobre los billetes; la pluma del decorado se quita con mano: false.)
const coge = [a(0.8), a(0.86)];
// un billete de una libra (como los del decorado: rayas, el sello claro y un 1, sin letras), algo ladeado en la mano
const billete = (x, y) => {
  R.rect(x - 15, y - 8, x + 15, y + 8, hex('#5a7a4a')); R.rect(x - 14, y - 7, x + 14, y + 7, hex('#c8dcb0')); R.rect(x - 12, y - 5, x + 12, y + 5, hex('#a8c494'));
  for (let i = -10; i <= 2; i += 3) R.rect(x + i, y - 2, x + i + 1, y + 3, hex('#7a9a68')); R.disco(x + 8, y, 4, hex('#e0ecd0')); R.numero('1', x + 6, y + 3, { sombra: false, color: hex('#3a5a2a') });
  R.rect(x - 14, y + 7, x + 14, y + 7, hex('#94b07e'));
};
const p3 = (t) => {
  const rodea = tramo(t, a(0.93), a(0.985));
  // los billetes que quedan bajan de golpe cuando la mano se lleva uno (3 → 2 → 1)
  const bil = t < coge[0] ? 0.58 : t < coge[1] ? 0.72 : 1;
  T.valle(R, t, { encuadre: 'tienda', camara: 'mesa', mano: false, billetes: bil, suma: lerp(0.86, 1, tramo(t, a(0.84), a(0.9))), rodea });
  // la mano entra desde abajo, coge el billete de encima por su canto y se lo lleva fuera del cuadro
  for (const [i, g] of coge.entries()) {
    const [bx, by] = i === 0 ? [117, 122] : [129, 122];   // el billete de encima en cada momento (como lo pone el decorado)
    const ida = tramo(t, g - 0.7, g), vuelta = tramo(t, g + 0.1, g + (i ? 0.55 : 0.85));
    if (ida <= 0 || vuelta >= 1) continue;
    const wx = N(lerp(bx + 6, bx + 2, ida)), wy = N(lerp(196, by + 13, ida) + vuelta * vuelta * 70);
    if (t >= g) billete(wx + 4, wy - 7 + N(vuelta * 2));
    T.brazo(R, wx + 8, wy + 50, wx, wy, '#3e3a4a', 1, { codo: [wx + 7, wy + 26] });
  }
  // y vuelve: la mano se apoya junto al último billete y tamborilea con los dedos (cansado de pagar) mientras se cierra la
  // cuenta y se rodea el 1922; luego se retira
  { const ida = tramo(t, coge[1] + 0.6, coge[1] + 1.05), vuelta = tramo(t, a(0.985), a(0.985) + 0.7);
    if (ida > 0 && vuelta < 1) { const tam = t > coge[1] + 1.05 && Math.floor(t * 7) % 3 === 0 ? 1 : 0;
      const wx = 133, wy = N(lerp(196, 136 + tam, ida) + vuelta * vuelta * 70);
      T.brazo(R, wx + 8, wy + 50, wx, wy, '#3e3a4a', 1, { codo: [wx + 7, wy + 26] }); } }
};

// 4 · las chozas: los obreros se llevan las piedras; Carter lo dirige
const p4 = (t) => {
  const limpio = tramo(t, b(0.07), b(0.24));
  const geo = T.valle(R, t, { encuadre: 'chozas', luz: 'dia', limpio, escalones: 0 });
  const s = geo.suelo;
  // dos obreros que van y vienen de los muretes a la cesta con una piedra
  for (const [k, def, x0, x1, fase] of [[0, T.ELENCO_TU.obrero1TU, 96, 262, 0], [1, T.ELENCO_TU.obrero2TU, 196, 270, 0.5]]) {
    const ciclo = ((t - P4) / 2.6 + fase) % 1, ida = ciclo < 0.5, u = ida ? ciclo * 2 : 2 - ciclo * 2;
    const anda = u > 0.08 && u < 0.92, xx = N(lerp(x0, x1, Math.min(1, Math.max(0, (u - 0.08) / 0.84))));
    const ac = R.actor(def, xx, s + k * 6, t, { dir: ida ? 1 : -1, anda, sostiene: ida ? [xx + (ida ? 12 : 2), s + k * 6 - 14] : null });
    if (ida && limpio < 1) piedra(ac.mano[0], ac.mano[1] - 2, k);
  }
  // Carter a la izquierda: señala los muretes y luego el suelo del medio («his team found»)
  R.actor(T.ELENCO_TU.carterTU, 46, s + 10, t, { dir: 1, dedo: (t > b(0.07) && t < b(0.15)) || t > b(0.23), habla: t > b(0.07) && t < b(0.15) && Math.sin(t * 7) > 0, sorpresa: t > b(0.24) });
  T.valleDelante(R, t, { encuadre: 'chozas', luz: 'dia', limpio, escalones: 0 });
};

// 5 · a ras de suelo: barre y sale el escalón; detrás, otro y otro. Al otro lado de la zanja, Carter y un obrero miran
const p5 = (t) => {
  // empieza ya con un palmo barrido (la brocha y el cazo apoyados en la huella) y la mano sigue barriendo
  const barre = lerp(0.22, 0.92, tramo(t, b(0.262), b(0.45))), esc = lerp(0, 2, tramo(t, b(0.38), b(0.43)));
  const geo = T.valle(R, t, { encuadre: 'chozas', camara: 'escalon', luz: 'dia', barre, escalones: esc, mano: false });
  // el escalón en perfil (huella, canto con luz, tabica en sombra), los dos de detrás que salen de la arena al decir
  // «another» y las paredes de la zanja: todo lo pinta el decorado (geo.escalones: el filo de cada canto)
  const xb = N(10 + barre * 290);
  // el brazo que barre: el hombro fuera, por abajo; se ve el antebrazo (~40 px) y la mano junto al caballón
  T.brazo(R, xb - 24, 192, xb - 2, 146, '#d8c8a8', 1, { codo: [xb - 16, 168] });
  // el canto de cada escalón destella al quedar a la vista: el primero bajo la mano, luego el segundo y el tercero
  const chispa = (x, y) => { R.pset(x, y - 1, hex('#ffffff')); R.pset(x - 1, y, hex('#fff6d8')); R.pset(x + 1, y, hex('#fff6d8')); R.pset(x, y, hex('#ffffff')); R.pset(x, y + 1, hex('#fff6d8')); };
  const [[, y1], [, y2], [, y3]] = geo.escalones;
  if (t > b(0.285) && t < b(0.285) + 0.5) for (const x of [60, 120, 180]) if (x < xb - 6) chispa(x, y1);
  for (const [k, y] of [[0, y2], [1, y3]]) { const tk = b(0.38) + (k + 0.6) * (b(0.43) - b(0.38)) / 2; if (t > tk && t < tk + 0.45) for (const x of [90, 170, 240]) chispa(x + k * 20, y); }
  // al otro lado de la zanja (el suelo del valle, y 92): Carter se asoma, se sorprende y señala los de detrás
  const vc = tramo(t, P5 + 0.1, b(0.28));
  R.actor(T.ELENCO_TU.carterTU, N(lerp(196, 222, vc)), 94, t, { dir: -1, anda: vc > 0 && vc < 1, sorpresa: t > b(0.29) && t < b(0.38), dedo: t > b(0.385), habla: t > b(0.385) && Math.sin(t * 8) > 0 });
  R.actor(T.ELENCO_TU.obrero1TU, 78, 94, t, { dir: 1, brazos: t > b(0.4) && t < b(0.44), sonrisa: t > b(0.3) });
};

// 6 · la puerta tapiada: la luz del farol recorre los sellos y se para en el intacto; luego la pala la vuelve a tapar
const tapa = [b(0.618), b(0.655)];
// la esquina de Atom, en calma: un desenfoque suave (sin bordes) de lo que haya detrás, con el filo fundido
const calma = () => {
  const B = R.buf, x0 = 262, y1 = 52, w = 320 - x0, cp = new Uint32Array(w * y1);
  for (let y = 0; y < y1; y++) for (let x = 0; x < w; x++) cp[y * w + x] = B[y * 320 + x0 + x];
  for (let y = 0; y < y1; y++) for (let x = 0; x < w; x++) { let r = 0, g = 0, bl = 0, n = 0;
    for (let j = -3; j <= 3; j++) for (let i = -3; i <= 3; i++) { const xx = x + i, yy = y + j; if (xx < 0 || yy < 0 || xx >= w || yy >= y1) continue; const v = cp[yy * w + xx]; r += v & 255; g += (v >>> 8) & 255; bl += (v >>> 16) & 255; n++; }
    const e = Math.min(1, x / 6, (y1 - 1 - y) / 6), v = cp[y * w + x], m = (k, d) => Math.round(((v >>> d) & 255) * (1 - e) + (k / n) * e);
    B[y * 320 + x0 + x] = (0xff000000 | (m(bl, 16) << 16) | (m(g, 8) << 8) | m(r, 0)) >>> 0; }
};
const p6 = (t) => {
  // la luz RECORRE los sellos (la fila de arriba, la de abajo, la del medio: o.foco del decorado) mientras la voz dice
  // «blocked doorway with its seals», y se para sobre el sello intacto (164, 96) en «intact»
  const foco = tramo(t, P6 - 0.1, b(0.553));
  const gs = T.valle(R, t, { encuadre: 'escalera', camara: 'sellos', foco });
  calma();
  // el sello intacto, señalado: un brillo que late cuando la luz llega a él («intact»)
  const br = tramo(t, b(0.553), b(0.553) + 0.25) - tramo(t, b(0.6), b(0.6) + 0.3);
  if (br > 0) for (let r = 2; r < 2 + br * 7; r++) { R.pset(164 + r, 92, hex('#fff8dc')); R.pset(164 - r, 92, hex('#fff8dc')); R.pset(164, 92 + N(r * 0.7), hex('#fff8dc')); R.pset(164, 92 - N(r * 0.7), hex('#fff8dc')); }
  // el farol de mano de Carter, abajo, que sigue a su luz (sube un poco cuando la luz va a la fila de arriba); se
  // retira cuando empieza a caer la arena
  { const fx = gs.farol[0], sal = tramo(t, tapa[0] - 0.7, tapa[0] - 0.2), fy = N(147 - Math.max(0, 100 - gs.farol[1]) * 0.2 + sal * 50), bal = N(Math.sin(t * 3) * 1);
    if (sal < 1) {
      for (let r = 14; r > 0; r -= 3) R.disco(fx + bal, fy + 9, r, hex(r > 10 ? '#5a4a30' : r > 6 ? '#8a7040' : '#c8a050'));
      R.linea(fx, fy, fx + bal, fy + 3, hex('#2a2a2a')); R.rect(fx - 4 + bal, fy + 3, fx + 4 + bal, fy + 4, hex('#2a2a32'));
      R.rect(fx - 4 + bal, fy + 5, fx + 4 + bal, fy + 14, hex('#1e1e24')); R.rect(fx - 3 + bal, fy + 6, fx + 3 + bal, fy + 13, hex('#ffd878')); R.rect(fx - 1 + bal, fy + 8, fx + 1 + bal, fy + 11, hex('#fff4d0'));
      R.rect(fx - 3 + bal, fy + 9, fx + 3 + bal, fy + 9, hex('#2a2a32')); R.rect(fx - 5 + bal, fy + 15, fx + 5 + bal, fy + 16, hex('#2a2a32'));
      T.brazo(R, fx - 12, fy + 42, fx - 2, fy + 1, '#3e3836', 1, { codo: [fx - 16, fy + 20] });
    } }
  const u = tramo(t, tapa[0], P7 + 0.2);   // «covered it up again»
  if (u <= 0 && t < tapa[0] - 0.6) return;
  // la pala que entra por arriba a la derecha y se vuelca dos veces
  let vuelca = 0; for (const g of tapa) { const v = (t - g + 0.15) / 0.5; if (v > 0 && v < 1) vuelca = Math.sin(v * Math.PI); }
  const entra = tramo(t, tapa[0] - 0.6, tapa[0] - 0.15), px = 226, py = N(lerp(-30, 46, entra)), ang = 0.15 + vuelca * 0.75;
  const nivel = N(lerp(181, 64, u ** 0.8));
  // el chorro de arena de la pala (granos que caen y se abren) hasta el nivel
  if (vuelca > 0.2) for (let y = py + 8; y < nivel; y++) { const w = 4 + N((y - py) * 0.06); for (let x = -w; x <= w; x++) if (h3(x + 400, y, N(t * 30)) < 0.7) R.pset(px - 10 + x + N(Math.sin(y * 0.2 + t * 9)), y, hex(h3(x, y, 1) < 0.5 ? '#e4cc9c' : '#c8a676')); }
  for (let k = 0; k < 24; k++) { const f = (t * 1.7 + k / 24) % 1, x = px - 22 + N(h3(k, 0, 2) * 30), y = N(lerp(py + 8, nivel, f)); if (u > 0 && y < nivel) R.pset(x, y, hex(k % 3 ? '#dcc092' : '#a8885c')); }
  // la arena que sube por delante del enlucido: granos de tres tonos, guijarros, el caballón de arriba y su sombra
  if (u > 0) for (let x = 0; x < 320; x++) {
    const top = nivel + N(Math.sin(x * 0.09 + 1.3) * 3 + Math.sin(x * 0.31) * 1.5 - Math.max(0, 14 - Math.abs(x - (px - 10)) * 0.6));
    for (let y = Math.max(0, top); y < 180; y++) { const q = h3(x, y, 3), d = y - top;
      R.pset(x, y, hex(d === 0 ? '#f6e4bc' : d < 3 ? '#ecd6a8' : q < 0.05 ? '#8a6a44' : q < 0.12 ? '#b8966a' : q < 0.4 ? '#d4b886' : q < 0.75 ? '#dcc294' : '#e6cea0')); }
    if (h3(x, 7, 4) < 0.08) { const y = top + 6 + N(h3(x, 8, 4) * 30); if (y < 178) { R.rect(x, y, x + 2, y + 1, hex('#8a7458')); R.pset(x, y, hex('#c8b08a')); } }
  }
  // el hierro de la pala (el mango sale por arriba) y su carga
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const P = (dx, dy) => [N(px + dx * ca - dy * sa), N(py + dx * sa + dy * ca)];
  R.linea(px + 8, py - 40, px + 2, py, hex('#3a2414')); R.linea(px + 9, py - 40, px + 3, py, hex('#9a6a3a')); R.linea(px + 10, py - 40, px + 4, py, hex('#c08a50'));
  R.poligono([P(-24, -3), P(5, -3), P(8, 12), P(-26, 14)], hex('#1e1e26')); R.poligono([P(-23, -2), P(4, -2), P(7, 11), P(-25, 13)], hex('#7a7a86'));
  R.poligono([P(-23, -2), P(4, -2), P(3, 2), P(-23, 2)], hex('#b8b8c4')); R.poligono([P(-25, 10), P(7, 9), P(7, 11), P(-25, 13)], hex('#55555f'));
  if (vuelca < 0.5) R.poligono([P(-21, -2), P(2, -2), P(-3, -9), P(-15, -9)], hex('#dcc092'));
};

// 7 · el telégrafo (gag 2): el telegrafista tira de la cinta, que no se acaba y sale por la puerta a la calle; fuera,
// un burro (a la escala de los personajes, recortado al hueco de la puerta) llega, agacha la cabeza y se la come
const tirones = [P7 + 0.4, b(0.73), b(0.765), b(0.8)];
const BUR = { a: '#8c8494', s: '#5e5866', l: '#b4acb8', m: '#e8e0e4', h: '#2a2430', n: '#3a3440' };
// el burro chibi (como el del decorado de la tienda, ~22 px de largo), mirando a la izquierda; o.baja agacha el cuello
const burroChibi = (x, suelo, t, o = {}) => {
  const X = (i) => N(x - i), Y = (j) => N(suelo - j), px = (i, j, n) => R.pset(X(i), Y(j), hex(BUR[n])), fila = (i0, i1, j, n) => { for (let i = i0; i <= i1; i++) px(i, j, n); };
  const masca = o.masca ? Math.floor(t * 7) % 2 : 0, oreja = Math.sin(t * 1.7) > 0.85 ? 1 : 0, cola = N(Math.sin(t * 2.3) * 1.5), bj = o.baja ?? 0;
  // la sombra en la tierra de la calle
  for (let i = -12; i <= 13; i++) R.pset(X(i), Y(-1), hex(i > -10 && i < 11 ? '#c8a478' : '#d8bc90'));
  for (let j = 9; j <= 15; j++) fila(-10, 4, j, j === 15 ? 'l' : j < 11 ? 's' : 'a');   // el cuerpo
  for (let j = 9; j <= 14; j++) { px(-11, j, 's'); px(5, j, 'a'); } fila(-9, 3, 9, 's'); px(-8, 11, 'm'); px(-7, 10, 'm');
  for (const [i, f] of [[-9, 0], [-6, 1], [1, 1], [4, 0]]) for (let j = 0; j <= 8; j++) px(i + (j < 3 && o.anda && (Math.floor(t * 6) % 2) === f ? 1 : 0), j, j < 1 ? 'h' : j < 3 ? 's' : 'a');
  for (let j = 9; j <= 13; j++) px(-12 + (j < 11 ? cola : 0), j, 'n'); px(-12 + cola, 8, 'h');
  // el cuello, la crin, la cabeza y el hocico (bajan bj píxeles al agachar la cabeza; el hocico se mueve al mascar)
  for (let j = 13 - bj; j <= 19 - bj; j++) fila(3, 6, j, 'a'); for (let j = 14 - bj; j <= 20 - bj; j++) px(3, j, 'n');
  for (let j = 13; j <= 15; j++) fila(3, 5, j, 'a');
  for (let j = 16; j <= 21; j++) fila(6, 10, j - bj, 'a'); fila(9, 12, 16 - bj - masca, 'm'); fila(9, 12, 17 - bj, 'm'); fila(10, 12, 18 - bj, 'l'); px(12, 18 - bj - masca, 'h'); px(11, 15 - bj - masca, 'h');
  px(8, 20 - bj, 'h'); px(7, 19 - bj, 'l');
  for (let j = 22; j <= 26; j++) { px(6 - (j > 24 ? oreja : 0), j - bj, j === 26 ? 'h' : 'a'); px(8, j - bj, j === 26 ? 'h' : 's'); } px(7, 22 - bj, 'a'); px(7, 23 - bj, 'm');
  return [X(11), Y(16 - bj)];   // la boca
};
// un tramo de cinta de puntos y rayas (blanca, con su canto en sombra) por una lista de puntos; fase: lo que corre
const cintaTramo = (pts, fase) => {
  let d = 0;
  for (let i = 0; i < pts.length - 1; i++) { const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0)));
    for (let k = 0; k < n; k++, d++) { const x = N(lerp(x0, x1, k / n)), y = N(lerp(y0, y1, k / n)), m = (d + N(fase)) % 9;
      R.pset(x, y + 1, hex('#8a8478')); R.pset(x, y, hex('#f8f6ee')); if (m === 1 || (m >= 4 && m <= 6)) R.pset(x, y, hex('#22222a')); } }
};
const p7 = (t) => {
  const llega = tramo(t, b(0.8), b(0.87)), come = t > b(0.88);
  // burro: 0 quita la cabeza grande del decorado (la cinta sale por la puerta y se queda en la tierra de la calle)
  T.valle(R, t, { encuadre: 'telegrafo', camara: 'cinta', corre: lerp(1, 2.6, tramo(t, P7, b(0.83))), burro: 0 });
  // los telegramas de la mañana, clavados en la pared, que se mecen con el aire de la puerta
  for (const [x, y, k] of [[164, 30, 0], [184, 34, 1], [204, 30, 2]]) {
    const dx = N(Math.sin(t * 2.2 + k) * 1.2); R.pset(x + 7, y - 2, hex('#3a3a44')); T.PIEZAS_TU.telegrama(R, x + dx, y, {});
  }
  // la balda con las pilas de vidrio (líquido verde azulado, placas de cobre) y sus cables al aparato
  R.rect(80, 58, 150, 61, hex('#3a2414')); R.rect(80, 58, 150, 58, hex('#9a6a3a')); R.rect(84, 62, 86, 68, hex('#3a2414')); R.rect(144, 62, 146, 68, hex('#3a2414'));
  for (const [k, x] of [[0, 104], [1, 118], [2, 132]]) { R.rect(x - 5, 42, x + 5, 57, hex('#2a3a3a')); R.rect(x - 4, 43, x + 4, 57, hex('#b8dcd8')); R.rect(x - 4, 48 + (k % 2), x + 4, 57, hex('#6ab0a8')); R.rect(x - 2, 40, x - 1, 54, hex('#c87a3a')); R.rect(x + 1, 40, x + 2, 54, hex('#8a8a96')); R.pset(x + 3, 44, hex('#ffffff'));
    if (h3(k, N(t * 3), 5) < 0.4) R.pset(x - 3 + (N(t * 7) % 6), 50 + (N(t * 11) % 6), hex('#e8fff8')); }
  R.linea(103, 40, 96, 34, hex('#1e1e22')); R.linea(96, 34, 88, 40, hex('#1e1e22')); R.linea(88, 40, 88, 76, hex('#1e1e22'));
  // una salamanquesa que cruza la pared
  { const g = tramo(t, P7 + 0.5, P7 + 6.2), gx = N(lerp(228, 156, g)), gy = 76 + N(Math.sin(g * 9) * 2), pie = Math.floor(t * 8) % 2;
    R.rect(gx, gy, gx + 7, gy + 1, hex('#8a9a6a')); R.rect(gx - 2, gy, gx - 1, gy + 1, hex('#6a7a4a')); R.rect(gx + 8, gy + 1, gx + 12, gy + 1, hex('#7a8a5a'));
    R.pset(gx + 1 + pie, gy - 1, hex('#6a7a4a')); R.pset(gx + 5 - pie, gy + 2, hex('#6a7a4a')); R.pset(gx + 5 - pie, gy - 1, hex('#6a7a4a')); R.pset(gx + 1 + pie, gy + 2, hex('#6a7a4a')); R.pset(gx - 2, gy, hex('#1a1a1a')); }
  // FUERA, por el hueco de la puerta: el burro llega por la calle, agacha la cabeza a la punta de la cinta y la masca;
  // la cinta sube de la tierra a su boca y corre hacia él (se la va comiendo)
  if (llega > 0) {
    R.recorte([253, 0, 319, 179]);
    const xb = N(lerp(340, 298, llega)), baja = come ? 3 : 0, boca = burroChibi(xb, 175, t, { anda: llega < 1, masca: come, baja });
    if (come) { const [bx, by] = boca, sw = N(Math.sin(t * 7)); cintaTramo([[272, 174], [280, 175], [bx - 4, by + 6 + sw], [bx, by + 1]], -t * 22); }
    R.recorte(null);
  }
  // la mano del telegrafista (manguito crema) tira de la cinta a tirones, cerca del borde de abajo (el hombro fuera del
  // cuadro, ~35 px de antebrazo); cuando llega el burro, la suelta y se aparta
  let tira = 0; for (const g of tirones) { const v = (t - g) / 0.35; if (v > 0 && v < 1) tira = Math.sin(v * Math.PI); }
  const fuera = tramo(t, b(0.8), b(0.83)), mx = N(224 - tira * 5), my = N(lerp(146 + tira * 6, 210, fuera));
  if (fuera < 1) T.brazo(R, mx - 14, my + 48, mx, my, '#e8e0d0', 1, { codo: [mx - 10, my + 24] });
};

T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3], [P4, p4], [P5, p5], [P6, p6], [P7, p7]], {
  cartela: '1922', año: 1922,
  efectos: [[golpes[0], 'golpecito'], [golpes[1], 'golpecito'], [golpes[2], 'golpecito'], [golpes[3], 'golpecito'], [cuenta[0], 'papel'], [cuenta[2], 'papel'], [coge[0], 'papel'], [coge[1], 'papel'], [a(0.94), 'lapiz'],
    [b(0.12), 'toc'], [P4 + 1.3, 'toc'], [b(0.19), 'toc'], [b(0.27), 'whoosh'], [b(0.29), 'brillo'], [b(0.386), 'pop'], [b(0.553), 'brillo'], [tapa[0], 'avalancha'], [tapa[1], 'chof'],
    [P7 + 0.15, 'maquina'], [tirones[0], 'papel'], [b(0.73), 'papel'], [b(0.765), 'papel'], [b(0.8), 'papel'], [b(0.82), 'toc'], [b(0.83), 'maquina'],
    [b(0.85), 'toc'], [b(0.92), 'masca'], [b(0.95), 'masca']],
});
