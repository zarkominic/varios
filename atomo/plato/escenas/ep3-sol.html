<title>El Sol por dentro</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<body>
<script type="module">
// EP3-SOL · episodio 3, frases 58–60 (sin cartela), plastilina adulta. Crea kits/ep03-estrellas.js y kits/ep03-tiempo.js.
//  0       el último fotograma de ep3-tierra: el Sol de crearMundo, enorme (721, 470, 376 px), con la Tierra como un punto
//          a su lado; la regla en 10⁹; Atom pequeño abajo a la izquierda (en el mismo estado en que lo deja ep3-tierra)
//  fusion  (completo en la marca) el Sol del mundo pasa a la pieza de arcilla de ep03-estrellas.js, igual, y se abre en
//          corte: se le quita un octante y gira para enseñarlo (núcleo, zona radiativa y de convección); flechas de arcilla
//          aprietan desde fuera (su peso) y el núcleo se encoge y se pone al rojo blanco. A mitad de frase la cámara entra
//          en el núcleo (detalle): núcleos de hidrógeno (el núcleo de Atom sin órbitas) se aprietan, chocan de dos en dos y
//          se funden en helio, con un destello por choque; uno, encajado entre dos, se deja aplastar y se ladea antes de
//          fundirse
//  rebota  vuelve el corte (plano medio, algo más cerca): un rayo de luz de alambre rebota dentro como una bola de pinball
//          mientras un calendario de arcilla pasa hojas de 1 a 120000 (años); a mitad de frase la luz sale por el borde, la
//          cámara la sigue (el Sol se queda a la izquierda) y viaja con un reloj que marca 8 minutos hasta la cara de una
//          persona de perfil, con los ojos cerrados al sol, que se ilumina al llegar
//  pequeno (completo en la marca) el Sol entero, otra vez en su sitio del mundo, se encoge entre un montón de estrellas de
//          arcilla y, al fondo, arriba a la derecha, entra una estrella mucho mayor y rojiza que empieza a apagarse;
//          quieto (termina_con: el cielo de ep03-estrellas.js con u = 1, CIELO)
// CONTINUIDAD (cámara del plató de las pruebas: pos [0, 3,8, 15,5], mira [0, 2,3, 0], fov 28)
//  · Fotograma 0 = el último de ep3-tierra (comprobado: la misma media de color en el Sol, la regla y Atom): el mundo de
//    ep03-cosmos.js con camara(9) y n = 931 (y su somA), la regla P.regla con e 9, ya 0, actual 9, lupa 0,5 en
//    P.punto(1655, 528, 0,4), escala 1,42, rot [0, −0,12, 0]; Atom en (230, 780) con su vaivén y sus electrones donde los
//    deja ep3-tierra (FIN_TIERRA, calculado con las marcas de ep3-tierra).
//  · Último fotograma (ep3-vuelta empieza así; window.__fin.final lo da en números): fondoCielo(mundo, 932, { somA:
//    [252, 810, 62, 0,42] }) sin viñeta; encima cielo(g, fotosCielo(P, …), { u: 1, apaga: CIELO.apaga }) de
//    ep03-estrellas.js (el Sol pequeño en (930, 470) con 62 px, la gigante en (1262, 236) con 150 px, los dos montones);
//    la misma regla; Atom en (230, 781,5) con tz 39,149 y electrones en ta 42,086 (escala 0,3326, yaw 0,182, pitch 0,256),
//    sin energía; después la viñeta y el grano de crearPost.
// Coste: todo se compone en 2D (crearPost al final). Lo quieto son fotos: el mundo (con y sin Sol), la regla, el corte del
// plano medio, la persona, los núcleos (sprites), el calor del núcleo y el cielo; las que no hacen falta en el primer
// fotograma se preparan en fotogramas baratos poco antes (PREPARAR) o al pedirlas. En vivo: Atom siempre; el Sol mientras
// se abre y se calienta; el calendario y el reloj mientras se mueven.
import * as THREE from 'three';
import { escena } from '/atomo/plato/escena.js';
import { crearPlato, crearPost, cargarFuenteCartela, cl, mix, prog, ss, eio, eoc, eic, eob, azar, muelle, mulberry32, brote } from '/atomo/plato/kits/plastilina-adulta.js';
import { crearMundo, camara, estadoMundo, fotoMundo, FINAL_TIERRA } from '/atomo/plato/kits/ep03-cosmos.js';
import { tiposEstrellas, uniformesEstrellas, sol, nucleo, halo, destello, brilloNucleo, solComoMundo, SOL_GIRO,
  fotoCielo, cielo, fondoCielo, CIELO, PARTES_CIELO } from '/atomo/plato/kits/ep03-estrellas.js';
import { tiposTiempo, uniformesTiempo, calendario, reloj, rayo, caminoRebotes, largoCamino, puntoEn, hojaEn } from '/atomo/plato/kits/ep03-tiempo.js';

const T0 = performance.now();
window.__carga = [];
const marcaCarga = (k) => window.__carga.push([k, Math.round(performance.now() - T0)]);
const E = await escena('ep3-sol', 'ep03');
marcaCarga('escena');
const M = (k) => E.marca(k);
const m = { fusion: M('fusion'), fusionFin: M('fusion_fin'), rebota: M('rebota'), rebotaFin: M('rebota_fin'), pequeno: M('pequeno'), pequenoFin: M('pequeno_fin') };
const D = E.duracion, QUIETO = D - 0.6;
const W = 1920, H = 1080;
const mitad = (a, b) => (a + b) / 2;

// ---------------------------------------------------------------- tiempos (todo sale de las marcas)
const T = {
  funde: [m.fusion - 0.42, m.fusion - 0.26],          // la foto del mundo da paso a la pieza (iguales)
  corte: [m.fusion - 0.28, m.fusion + 0.04],          // el octante se abre (completo en la marca)
  flechas: [m.fusion + 0.55, m.fusion + 1.0],         // llegan las flechas…
  aprieta: [m.fusion + 1.0, m.fusion + 2.4],          // … y aprietan
  calor: [m.fusion + 1.7, m.fusion + 3.4],            // el núcleo se pone al rojo blanco
  entra: [mitad(m.fusion, m.fusionFin) - 0.3, mitad(m.fusion, m.fusionFin) + 0.05],   // la cámara entra en el núcleo
  sale: [m.rebota - 0.28, m.rebota + 0.02],           // y vuelve al corte, en plano medio
  rayo: [m.rebota + 0.1, null],                        // el rayo rebota dentro…
  fuera: mitad(m.rebota, m.rebotaFin) - 0.05,          // … y sale por el borde (a mitad de frase)
  llega: m.rebotaFin - 0.7,                            // llega a la cara
  s5: m.pequeno - 0.22,                                // corte al Sol entero
  encoge: [m.pequeno - 0.1, m.pequeno + 1.8],          // el Sol se encoge entre las estrellas
  apaga: [m.pequeno + 1.9, Math.min(m.pequenoFin + 0.2, QUIETO - 0.15)],   // la gigante empieza a apagarse
};
T.rayo[1] = T.fuera;
T.pan = [T.fuera - 0.05, T.fuera + 0.7];               // la cámara sigue a la luz
const T_DET = T.entra[1];                              // el detalle empieza
// los choques del detalle (a partir de T_DET; acaban antes de volver)
const LDET = T.sale[0] - T_DET;
const CH = { a: T_DET + 0.20 * LDET, b: T_DET + 0.40 * LDET, aplasta: [T_DET + 0.50 * LDET, T_DET + 0.76 * LDET], c: T_DET + 0.82 * LDET };

// ---------------------------------------------------------------- el plató
// una flecha gorda de arcilla (pieza propia de la escena: el peso que aprieta): asta y punta a lo largo de +x, de −1 a 1
const FLECHA_GORDA = { radio: 1.05, glifos: [], glsl: /* glsl */`
float pz_flechagorda(vec3 q, vec4 T, out float m) {
  m = 0.0;
  float asta = sdCapsule(q, vec3(-0.92, 0.0, 0.0), vec3(0.15, 0.0, 0.0), 0.15);
  vec2 p = vec2(length(q.yz), q.x - 0.08);
  float h = 0.86, r = 0.36 * (1.0 - clamp(p.y / h, 0.0, 1.0));
  float punta = max(max(p.x - r, -p.y), p.y - h) * 0.82;
  return smin(asta, punta, 0.07) - 0.004 * bultos(q * 3.0);
}
float pzc_flechagorda(vec3 q, vec4 T) { return sdCapsule(q, vec3(-0.85, 0.0, 0.0), vec3(0.3, 0.0, 0.0), 0.12); }
vec3 pzcol_flechagorda(vec3 q, vec4 T, float m) { gEm = C_AMBAR * 0.04; return mix(C_TERRA, C_AMBAR, 0.35) * (0.94 + 0.12 * vnoise(q * 5.0)); }
` };
// (continuidad) la persona, la regla y su flecha en los mismos huecos que en ep3-tierra (0, 1 y 2): el hueco siembra las
// huellas, los bultos y el grano de la arcilla de cada pieza, y la regla tiene que salir igual que allí
const I = { PER: 0, REG: 1, FLE: 2, SOL: 3, NUC: 4, CAL: 5, REL: 6, EST: 7, GIG: 8, FG: 9 };
// (continuidad) los rótulos de la regla, en Jost como en ep3-tierra: crearPlato los hornea con cargarFuenteRotulos(), que
// pide la fuente en cuanto añade la hoja de estilos, antes de que llegue, y sin cartela se queda con la de respaldo (más
// fina). ep3-tierra tiene cartela, y su cargarFuenteCartela() espera a la hoja: aquí se hace lo mismo antes del plató
await cargarFuenteCartela();
marcaCarga('fuente');
const P = await crearPlato({
  piezas: ['humano', 'reglaA', 'flecha', 'sol', 'nucleo', 'calendario', 'reloj', 'estrellas', 'gigante', 'flechagorda'],
  tiposExtra: { ...tiposEstrellas(['sol', 'nucleo', 'estrellas', 'gigante']), ...tiposTiempo(['calendario', 'reloj']), flechagorda: FLECHA_GORDA },
  uniformes: { ...uniformesEstrellas(), ...uniformesTiempo() },
  alfa: true, post: false,
  sombraFondo: ['p0', 'p1'],
  camara: { pos: [0, 3.8, 15.5], mira: [0, 2.3, 0], fov: 28, desenfoque: 44 },
});
marcaCarga('plató');
const POST = crearPost();
const en = (sx, sy, z) => P.punto(sx, sy, z);
const pant = (p) => P.proyectar(p);
const pxU = (pos) => { const a = pant(pos), b = pant([pos[0] + 1, pos[1], pos[2]]); return Math.hypot(b[0] - a[0], b[1] - a[1]); };

// ---------------------------------------------------------------- capas: el mundo (oculto) y el lienzo 2D encima
const cont = document.getElementById('escena');
const mundo = crearMundo(cont, { captura: P.captura });
mundo.lienzo.style.visibility = 'hidden';
marcaCarga('mundo');
const lienzoGL = P.renderer.domElement;
const capa = document.createElement('canvas');
capa.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;display:block;z-index:3';
cont.appendChild(capa);
const g = capa.getContext('2d');
function ajustarCapa() {
  if (capa.width !== lienzoGL.width || capa.height !== lienzoGL.height) { capa.width = lienzoGL.width; capa.height = lienzoGL.height; }
  const k = capa.width / W; g.setTransform(k, 0, 0, k, 0, 0);
}
const pegarGL = (alfa = 1) => { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = alfa; g.drawImage(lienzoGL, 0, 0); g.restore(); };
const lienzo = (w = lienzoGL.width, h = lienzoGL.height) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const copiaGL = () => { const c = lienzo(); c.getContext('2d').drawImage(lienzoGL, 0, 0); return c; };
// una foto de 1920 × 1080 escalada s veces alrededor de (px, py), que queda en (qx, qy)
function pegarEscalada(f, s, [px, py], [qx, qy] = [px, py], alfa = 1) {
  if (alfa <= 0.002) return;
  g.save(); g.globalAlpha *= alfa;
  g.translate(qx, qy); g.scale(s, s); g.translate(-px, -py);
  g.drawImage(f, 0, 0, W, H);
  g.restore();
}
// el «parpadeo» de la luz del plató (como ep3-casa)
function parpadeo(n) {
  const fl = azar(n, 3) - 0.5;
  g.fillStyle = fl > 0 ? `rgba(255,236,210,${fl * 0.03})` : `rgba(0,0,6,${-fl * 0.04})`; g.fillRect(0, 0, W, H);
}
// la viñeta del mundo, quitada (crearPost la vuelve a poner al final, igual)
function sinVineta(c) {
  const gc = c.getContext('2d'), im = gc.getImageData(0, 0, c.width, c.height), d = im.data, k = W / c.width;
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
    const v = 1 - 0.42 * ss(0.42, 1.12, Math.hypot(((x + 0.5) * k - 960) / 1080, ((y + 0.5) * k - 540) / 1080));
    if (v > 0.999) continue;
    const o = (y * c.width + x) * 4; d[o] = Math.min(255, d[o] / v); d[o + 1] = Math.min(255, d[o + 1] / v); d[o + 2] = Math.min(255, d[o + 2] / v);
  }
  gc.putImageData(im, 0, 0);
  return c;
}

// ---------------------------------------------------------------- Atom: el de ep3-tierra, en el mismo estado
const A_Z = 1.0, ATOMO = [230, 780];
const A_ESC = 180 / (2 * (1.68 + 0.16) * pxU(en(...ATOMO, A_Z)));
const CAM = [0, 3.8, 15.5];
const gy = (p) => Math.atan2(CAM[0] - p[0], CAM[2] - p[2]), gp = (p) => Math.atan2(p[1] - CAM[1], Math.hypot(CAM[0] - p[0], CAM[2] - p[2]));
const A_W = en(...ATOMO, A_Z), A_REF = en(850, 330, A_Z);
const A_YAW = gy(A_W) - gy(A_REF), A_PITCH = gp(A_W) - gp(A_REF);
// el reloj de Atom al acabar ep3-tierra (su vaivén, tz, y sus electrones, ta), con sus marcas
const FIN_TIERRA = await (async () => {
  let mt = { duracion: 19.751, marcas: { tierra: 1.5, sol: 15.019 } };
  try { const j = await (await fetch('/atomo/plato/escenas/marcas-ep03.json')).json(); if (j['ep3-tierra']) mt = j['ep3-tierra']; } catch (e) { /* las de arriba */ }
  const Qt = mt.duracion - 0.6, mT = mt.marcas.tierra, mS = mt.marcas.sol;
  const vel = (t) => (1 + 1.1 * Math.exp(-Math.pow((t - mT) / 0.4, 2)) + 0.9 * Math.exp(-Math.pow((t - mS) / 0.4, 2))) * (1 - eio(prog(t, Qt - 0.9, Qt)));
  const dt = 1 / 240; let ta = 0, t = 0;
  for (; t + dt <= Qt + 1e-9; t += dt) ta += vel(t + dt / 2) * dt;
  // n: el número de fotograma con que ep3-tierra dibuja su último fotograma (el hervor y el parpadeo de la luz del plató)
  return { tz: Qt - 0.45, ta, n: Math.max(0, Math.floor(Qt * 12 + 1e-6)) };
})();
marcaCarga('fin tierra');
// el mío arranca quieto (como lo dejó) y coge su ritmo en medio segundo; al final se calma igual
const DT = 1 / 240, TA = [0], TZ = [0];
const velA = (t) => ss(0, 0.7, t) * (1 + 0.8 * Math.exp(-Math.pow((t - m.fusion) / 0.4, 2)) + 0.8 * Math.exp(-Math.pow((t - m.rebota) / 0.4, 2)) + 0.8 * Math.exp(-Math.pow((t - m.pequeno) / 0.4, 2))) * (1 - eio(prog(t, QUIETO - 0.9, QUIETO)));
const velZ = (t) => ss(0, 0.7, t) * (1 - eio(prog(t, QUIETO - 0.9, QUIETO)));
for (let i = 1; i * DT <= D + 0.2; i++) { TA.push(TA[i - 1] + velA((i - 0.5) * DT) * DT); TZ.push(TZ[i - 1] + velZ((i - 0.5) * DT) * DT); }
const tabla = (Tb, t) => { const x = t / DT, i = Math.min(Tb.length - 2, Math.max(0, Math.floor(x))); return mix(Tb[i], Tb[i + 1], x - i); };
function estadoAtom(ts) {
  const tz = FIN_TIERRA.tz + tabla(TZ, ts);
  const sx = ATOMO[0], sy = ATOMO[1] + 3 * Math.sin(tz * 1.3) + 2 * Math.sin(tz * 0.7 + 1.0);
  // al empezar cada frase, un brillo; y otro cuando salen los núcleos de hidrógeno («como el mío»)
  const brillo = Math.max(...[m.fusion, m.rebota, m.pequeno].map((t0) => Math.sin(Math.PI * prog(ts, t0 - 0.15, t0 + 0.6))),
    0.8 * Math.sin(Math.PI * prog(ts, T_DET + 0.1, T_DET + 1.0)));
  return { sx, sy, tz, brillo };
}
function atomo(ts, { claro = 0 } = {}) {
  const S = estadoAtom(ts);
  const en0 = ts < QUIETO ? E.energia(ts) : 0;
  P.atomo({
    pos: en(S.sx, S.sy, A_Z), escala: A_ESC, yaw: -0.15 + A_YAW + 0.08 * Math.sin(S.tz * 0.5), pitch: 0.06 - A_PITCH,
    energia: Math.min(1, en0 + 0.45 * S.brillo), ts: FIN_TIERRA.ta + tabla(TA, ts), halo: 1 - 0.55 * claro, velo: 0.1,
  });
  return S;
}
// sobre el plasma claro del detalle, una sombra cálida y redonda detrás de Atom (en 2D, antes de pegarlo) para que se lea
function sombraAtom(ts, k) {
  if (k <= 0.01) return;
  const S = estadoAtom(ts), R = 170;
  const gr = g.createRadialGradient(S.sx, S.sy, 0, S.sx, S.sy, R);
  gr.addColorStop(0, `rgba(70,30,10,${0.5 * k})`); gr.addColorStop(0.5, `rgba(70,30,10,${0.3 * k})`); gr.addColorStop(1, 'rgba(70,30,10,0)');
  g.fillStyle = gr; g.fillRect(S.sx - R, S.sy - R, 2 * R, 2 * R);
}

// ---------------------------------------------------------------- la regla (quieta en 10⁹: la de ep3-tierra al acabar)
const E_REG = 1.42, REG = en(1655, 528, 0.4);
const reglaEn = () => P.regla({ pieza: I.REG, flecha: I.FLE, pos: REG, escala: E_REG, rot: [0, -0.12, 0], e: 9, ya: 0, actual: 9, lupa: 0.5 });

// ---------------------------------------------------------------- fotos
// las del primer fotograma (el mundo con su Sol, el espacio sin él, la regla) se hacen ya; las demás, en PREPARAR o al pedirlas
const S0 = estadoAtom(0);
const SOM_A = [S0.sx + 22, S0.sy + 30, 62, 0.42];
const FOTOS = {};
const HACER = {
  // el último fotograma de ep3-tierra: el mundo a 10⁹ (la misma foto, n = 931: la del último fotograma de ep3-tierra)
  mundoSol: () => sinVineta(fotoMundo(mundo, estadoMundo(camara(9), 931, { somA: SOM_A }))),
  // el mismo espacio sin el Sol (con la Tierra como un punto), para el corte
  mundoSinSol: () => sinVineta(fotoMundo(mundo, estadoMundo(camara(9), 931, { somA: SOM_A, capas: { uSol: [0, 0, 1, 0] } }))),
  // el espacio sin Sol ni Tierra (el viaje de la luz y el cielo)
  espacio: () => sinVineta(fondoCielo(mundo, 932, { somA: SOM_A })),
  // el corte quieto del plano medio (rojo blanco y apretado): dos fotos que se alternan (el hervor)
  corte0: () => fotoCorte(5101), corte1: () => fotoCorte(5102),
  // el corte del final del primer plano (el mismo que el vivo al acabar de calentarse): para entrar en el núcleo
  corteS1: () => { P.limpiar(); sol(P, I.SOL, { ...SOL1, corte: 1, calor: 1, aprieta: 1 }); P.render(5103, { fondo: false }); return copiaGL(); },
  // los núcleos: hidrógeno (dos fotos) y helio (dos), de frente a ~150 px de radio, en el centro
  nucH0: () => fotoNucleo(false, 5201, [0.15, -0.35, 0.05]), nucH1: () => fotoNucleo(false, 5202, [0.15, -0.35, 0.05]),
  nucHe0: () => fotoNucleo(true, 5203, [0.1, 0.4, 0]), nucHe1: () => fotoNucleo(true, 5204, [0.1, 0.4, 0]),
  nucBlur: () => desenfocar(F('nucH0'), 7, 0.75),
  // el plasma del núcleo (fondo del detalle)
  plasma: () => hacerPlasma(),
  // la flecha de arcilla (sprite)
  flecha: () => { P.limpiar(); P.pieza(I.FG, { pos: en(960, 540, 2), escala: 120 / pxU(en(960, 540, 2)), rot: [0.5, 0, 0] }); P.render(5300, { fondo: false }); return recortar(copiaGL(), [820, 470, 1100, 610]); },
  // la persona de perfil, de cintura para arriba (dos fotos)
  persona0: () => fotoPersona(5401), persona1: () => fotoPersona(5402),
  // la persona a la sombra, antes de que llegue la luz (horneada: un filtro de lienzo en cada fotograma cuesta)
  personaSombra: () => { const c = F('persona0'), d = lienzo(c.width, c.height), gd = d.getContext('2d'); gd.filter = 'brightness(0.62) saturate(0.82)'; gd.drawImage(c, 0, 0); return d; },
  // el cielo (ep03-estrellas.js), en cinco fotos
  cielo: () => { for (const k of PARTES_CIELO) F('cielo/' + k); return CIELO_F; },
  ...Object.fromEntries(PARTES_CIELO.map((k) => ['cielo/' + k, () => fotoCielo(P, IDX_CIELO, k, CIELO_F)])),
};
function F(k) { if (!FOTOS[k]) FOTOS[k] = HACER[k](); return FOTOS[k]; }
const CIELO_F = {}, IDX_CIELO = { sol: I.SOL, estrellas: I.EST, gigante: I.GIG };
function recortar(c, [x0, y0, x1, y1]) {
  const k = c.width / W, r = lienzo(Math.round((x1 - x0) * k), Math.round((y1 - y0) * k));
  r.getContext('2d').drawImage(c, x0 * k, y0 * k, (x1 - x0) * k, (y1 - y0) * k, 0, 0, r.width, r.height);
  r.ref = [x0, y0, x1, y1];
  return r;
}
function desenfocar(c, px, brillo = 1) {
  const d = lienzo(c.width, c.height), gd = d.getContext('2d');
  gd.filter = `blur(${(px * c.width / W).toFixed(1)}px) brightness(${brillo})`;
  gd.drawImage(c, 0, 0);
  d.ref = c.ref;
  return d;
}

// ---------------------------------------------------------------- el Sol: del mundo a la pieza, el corte y el plano medio
const SOLM = solComoMundo(P, FINAL_TIERRA.sol, 0);                 // el Sol del mundo, en pieza (de frente: el mismo disco)
const SOL1 = SOLM;                                                  // primer plano del corte: en el mismo sitio
const [SX, SY, SR] = FINAL_TIERRA.sol;

const FLECHAS = 8;
function flechas(ts) {
  const ka = eoc(prog(ts, T.flechas[0], T.flechas[1]));
  if (ka <= 0.001) return;
  const kf = 1 - ss(T.calor[0] + 0.5, T.calor[1] - 0.3, ts);
  if (kf <= 0.001) return;
  const fl = F('flecha'), [x0, y0, x1, y1] = fl.ref;
  const up = prog(ts, T.aprieta[0], T.aprieta[1]), ap = eio(up);
  for (let i = 0; i < FLECHAS; i++) {
    const a = (i / FLECHAS) * 2 * Math.PI + 0.59;   // ninguna cae sobre Atom (abajo a la izquierda)
    // empujan dos veces hacia dentro (golpes del stop-motion) y se quedan apretando
    const golpe = up > 0 && up < 1 ? Math.max(0, Math.sin(Math.PI * 2 * up * 2)) : 0;
    const rr = SR * (1.0 - 0.035 * ap) + mix(340, 125, ka) - 34 * golpe - 22 * ap;
    const x = SX + Math.cos(a) * rr, y = SY + Math.sin(a) * rr;
    const L = 210;
    g.save(); g.globalAlpha = kf * ss(0, 0.35, ka);
    g.translate(x, y); g.rotate(a + Math.PI);   // la punta hacia el centro
    g.drawImage(fl, -L * 0.5, -L * 0.25, L, L * 0.5);
    g.restore();
  }
}
function tramo1(n, ts) {

  P.limpiar();
  const sq = 1 - 0.035 * ap;
  sol(P, I.SOL, { ...SOL1, escala: SOL1.escala * sq, corte: cl(corte, 0, 1.06), calor, aprieta: ap, toque: corte > 0 && corte < 1 });

}

  const r = mulberry32(31), out = [];
  const sitios = [[300, 220], [700, 160], [1150, 130], [1380, 760], [640, 600], [1180, 860], [420, 520], [1000, 600]];
  for (const [x, y] of sitios) out.push({ x: x + (r() - 0.5) * 60, y: y + (r() - 0.5) * 60, s: 0.26 + 0.14 * r(), ph: r() * 6.28, v: 8 + 10 * r(), rot: r() * 6.28 });

function spriteNucleo(f, [x, y], { s = 1, rot = 0, sq = [1, 1], alfa = 1, brillo = 0 } = {}) {

    g.restore();
    if (luz > 0.01) {
      const p = [DIANA[0] + per.dx + 30, DIANA[1] - 20];
      g.save(); g.globalCompositeOperation = 'soft-light';
      const R = 520;
      const gr = g.createRadialGradient(p[0], p[1], 0, p[0], p[1], R);
      gr.addColorStop(0, `rgba(255,190,110,${0.5 * luz})`); gr.addColorStop(1, 'rgba(255,170,90,0)');
      g.fillStyle = gr; g.fillRect(p[0] - R, p[1] - R, 2 * R, 2 * R);
      g.globalCompositeOperation = 'screen';
      const R2 = 220;
      const g2 = g.createRadialGradient(DIANA[0] + per.dx, DIANA[1], 0, DIANA[0] + per.dx, DIANA[1], R2);
      g2.addColorStop(0, `rgba(255,214,150,${0.2 * luz * (0.6 + 0.4 * Math.exp(-(ts - T.llega) / 0.4))})`); g2.addColorStop(1, 'rgba(255,190,110,0)');
      g.fillStyle = g2; g.fillRect(DIANA[0] + per.dx - R2, DIANA[1] - R2, 2 * R2, 2 * R2);
      g.restore();
    }
  }
  // el rayo: dentro, rebotando (a velocidad constante), y fuera, hasta la cara
  const dentroU = prog(ts, T.rayo[0], T.fuera);
  const camino = CAMINO3.map(tr);
  let punta = null;
  if (ts >= T.rayo[0]) {
    const s1 = L3 * dentroU;
    let pts = camino;
    let hasta = s1;
    if (ts > T.fuera) {
      // fuera: de la salida a la mejilla
      const diana = [DIANA[0] + per.dx, DIANA[1]];
      const uo = eio(prog(ts, T.fuera, T.llega));
      const exterior = Math.hypot(diana[0] - camino[camino.length - 1][0], diana[1] - camino[camino.length - 1][1]);
      pts = [...camino, diana];
      hasta = L3 * sTot + exterior * uo;
    }
    const r = rayo(g, pts, { hasta, grosor: 6.5 * Math.min(1.25, sTot), brillo: 1, cabeza: 1 - ss(T.llega - 0.05, T.llega + 0.25, ts) });
    punta = r?.punta;
    // un destellito en cada rebote, al pasar la punta
    if (ts < T.fuera + 0.2) for (const [sr, x, y] of REBOTES) {
      const v = s1 / L3 * L3 - sr;
      const k = v >= 0 && v < 70 ? Math.exp(-v / 22) : 0;
      if (k > 0.03) { const p = tr([x, y]); destello(g, p[0], p[1], 46 * sTot, 0.8 * k, { rayos: 4, giro: sr }); }
    }
  }
  // el calendario (vivo mientras pasan las hojas); se queda atrás con el pan
  const kc = (1 - ss(T.pan[0], T.pan[0] + 0.35, ts)) * ss(T.sale[0], T.sale[1], ts);
  // lo vivo: Atom, el calendario y el reloj
  P.limpiar();
  atomo(ts);
  if (kc > 0.01) {
    const h = hojaEn(ts, CLAVES_CAL, 0.17);
    // se queda atrás: se va hacia la izquierda y hacia abajo, encogiendo
    const ua = eic(prog(ts, T.pan[0], T.pan[0] + 0.35));
    const pc = en(CAL_X - 260 * ua, CAL_Y + 30 * (1 - ss(T.sale[0], T.sale[1], ts)) + 220 * ua, 1.2);
    calendario(P, I.CAL, { ...CAL3, escala: CAL3.escala * (1 - 0.6 * ua), pos: pc, ...h, toque: h.hoja > 0 || ua > 0 });
  }
  const kr = ss(T.pan[1] - 0.35, T.pan[1] + 0.1, ts);
  if (kr > 0.01 && punta) {
    // el reloj va con la luz, por encima, hasta que la luz se acerca a la cara (allí se queda)
    const xr = Math.min(Math.max(punta[0] - 30, 430), DIANA[0] + per.dx - 280), yr = cl(punta[1] - 175, 140, 400);
    const R = relojEn(ts);
    reloj(P, I.REL, { pos: en(xr, yr, 1.6), escala: 0.62 * eob(kr, 1.4), rot: [0.05, 0.15, 0], minutos: R.minutos, sector: R.sector, toque: kr < 1 });
  }
  P.render(n, { fondo: false });
  pegarGL();
}
function personaEn(ts, up) { return { k: ts >= T.pan[0] ? 1 : 0, dx: (PAN.de[0] - PAN.a[0]) * (1 - up) }; }
// S5: el cielo
function tramo5(n, ts) {
  g.drawImage(F('espacio'), 0, 0, W, H);
  const u = eio(prog(ts, T.encoge[0], T.encoge[1]));
  // titileo: la gigante parpadea un poco al apagarse
  const ua = eio(prog(ts, T.apaga[0], T.apaga[1]));
  const titila = 0.03 * Math.sin(ts * 9.0) * ua * (ts < QUIETO ? 1 : 0);
  cielo(g, F('cielo'), { u, apaga: CIELO.apaga * ua + titila, t: Math.min(ts, QUIETO) });
  P.limpiar(); atomo(ts); P.render(n, { fondo: false }); pegarGL();
}

// ---------------------------------------------------------------- fotograma
// (coste) cada foto pesada se hace en un fotograma barato poco antes de hacer falta (en orden, como renderiza
// render-escenas.mjs); si se pide un instante suelto, F() la hace al momento y el resultado es el mismo
const PREPARAR = [
  [0.08, 'flecha'],
  [1.0, 'plasma'], [1.25, 'nucH0'], [1.45, 'nucH1'], [1.65, 'nucHe0'], [1.85, 'nucHe1'], [2.05, 'nucBlur'], [T.entra[0] - 0.2, 'corteS1'],
  [T_DET + 0.3, 'corte0'], [T_DET + 0.55, 'corte1'], [T_DET + 0.8, 'persona0'], [T_DET + 1.15, 'persona1'], [T_DET + 1.3, 'personaSombra'], [T_DET + 1.45, 'espacio'],
  ...PARTES_CIELO.map((k, i) => [T_DET + 1.7 + 0.25 * i, 'cielo/' + k]),
];
function dibujar(t) {
  const ts = Math.min(t, QUIETO);
  const n = Math.floor(ts * 12 + 1e-6);
  ajustarCapa();
  for (const [t0, k] of PREPARAR) if (ts >= t0 && ts < t0 + 0.09) F(k);
  // el fotograma 0 es el último de ep3-tierra: su plató (Atom y la regla) se dibuja con el número de fotograma de allí
  const nP = ts < T.funde[0] ? FIN_TIERRA.n : n;
  if (ts < T.funde[0]) {
    // el último fotograma de ep3-tierra
    g.drawImage(F('mundoSol'), 0, 0, W, H);
    P.limpiar(); atomo(ts); P.render(nP, { fondo: false }); pegarGL();
  } else if (ts < T.entra[0]) {
    const uf = tramo1(n, ts);
    // el fundido de la foto del mundo a la pieza
    if (uf < 1) { g.save(); g.globalAlpha = 1 - uf; g.drawImage(F('mundoSol'), 0, 0, W, H); g.restore(); P.limpiar(); atomo(ts); P.render(n, { fondo: false }); pegarGL(); }
  } else if (ts < T.sale[0]) {
    // entrar en el núcleo: el corte caliente se agranda alrededor del núcleo mientras llega el detalle
    const ue = eio(prog(ts, T.entra[0], T.entra[1]));
    if (ue < 1) {
      g.drawImage(F('mundoSinSol'), 0, 0, W, H);
      const s = mix(1, 3.2, ue);
      halo(g, NUC1[0] + (SX - NUC1[0]) * s, NUC1[1] + (SY - NUC1[1]) * s, SR * s, 1, 'sol');
      pegarEscalada(F('corteS1'), s, NUC1, NUC1);
      brilloNucleo(g, NUC1[0], NUC1[1], 0.3 * SR * 0.84 * s, 0.85);
    }
    if (ue > 0) { g.save(); g.globalAlpha = ss(0.35, 1, ue); tramo2(n, ts); g.restore(); }
    sombraAtom(ts, ss(0.3, 1, ue));
    P.limpiar(); atomo(ts, { claro: ss(0.3, 1, ue) }); P.render(n, { fondo: false }); pegarGL();
  } else if (ts < T.s5) {
    // volver: el detalle se funde en el corte que se aleja desde el núcleo (en tramo34)
    tramo34(n, ts);
    const us = prog(ts, T.sale[0], T.sale[1]);
    if (us < 1) {
      g.save(); g.globalAlpha = 1 - ss(0, 0.7, us);
      g.translate(NUC3[0], NUC3[1]); g.scale(1 + 0.6 * us, 1 + 0.6 * us); g.translate(-NUC3[0], -NUC3[1]);
      tramo2(n, ts);
      g.restore();
      sombraAtom(ts, 1 - ss(0, 0.7, us));
      P.limpiar(); atomo(ts, { claro: 1 - ss(0, 0.7, us) }); P.render(n, { fondo: false }); pegarGL();
    }
  } else tramo5(n, ts);
  // encima de todo: la regla, en vivo y en cada fotograma, como en ep3-tierra (con su hervor); la viñeta y el grano
  P.limpiar(); reglaEn(); P.render(nP, { fondo: false }); pegarGL();
  if (ts >= T.funde[0]) parpadeo(n);
  POST.aplicar(g, n);
}
// para atomo/herramientas/guias-humano.py: la persona del plano del viaje (centro, coronilla y suela en px; la suela queda
// fuera de cuadro) y, con ?vista=guias, la misma persona y la misma postura entera, de pie en el plató
const guiasDe = (o) => { P.limpiar(); const h = P.pieza(I.PER, { ...o, postura: POSE_PER }); P.limpiar();
  const c = pant(h.mundo([0, 0.765, -0.01])), su = pant(h.mundo([0, -1, 0.05])), ce = pant(h.mundo([0, 0, 0]));
  return { x: Math.round(ce[0]), coronilla: Math.round(c[1]), suela: Math.round(su[1]) }; };
window.__guias = guiasDe(PER);
window.__fin = { CIELO, SOL3_PX, PER, DIANA, CARA, T, CH,
  // el último fotograma (el primero de ep3-vuelta): el fondo, el cielo y el estado de Atom
  final: { fondo: { n: 932, somA: SOM_A }, cielo: { u: 1, apaga: CIELO.apaga }, atomo: (() => { const S = estadoAtom(QUIETO); return { sx: S.sx, sy: S.sy, tz: S.tz, ta: FIN_TIERRA.ta + tabla(TA, QUIETO), escala: A_ESC, yaw: -0.15 + A_YAW + 0.08 * Math.sin(S.tz * 0.5), pitch: 0.06 - A_PITCH }; })() } };
if (new URLSearchParams(location.search).get('vista') === 'guias') {
  const o = { pos: [en(960, 600, 1)[0], 2.4, 1], escala: 2.4, rot: PER.rot };
  window.__guias = guiasDe(o);
  marcaCarga('listo');
  E.iniciar(() => { ajustarCapa(); P.limpiar(); P.pieza(I.PER, { ...o, postura: POSE_PER, huellaFija: [0.37, 0.21, 0] }); P.render(1); g.drawImage(lienzoGL, 0, 0, W, H); POST.aplicar(g, 1); }, { paso: 1 / 12 });
} else {
marcaCarga('listo');
E.iniciar(dibujar, { paso: 1 / 12 });
}
</script>
