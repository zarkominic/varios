<script type="module">
// EP3-SOL · episodio 3, frases 58–60 (sin cartela), plastilina adulta. Crea kits/ep03-estrellas.js y kits/ep03-tiempo.js.
//  0       el último fotograma de ep3-tierra: el Sol de crearMundo, enorme (721, 470, 376 px), con la Tierra como un punto
//          a su lado; la regla en 10⁹; Atom pequeño abajo a la izquierda (en el mismo estado en que lo deja ep3-tierra)
//  fusion  (completo en la marca) el Sol del mundo pasa a la pieza de arcilla de ep03-estrellas.js, igual, y se abre en
//          corte: se le quita un octante y gira para enseñarlo (núcleo, zona radiativa y de convección); flechas de arcilla
//          aprietan desde fuera (su peso) y el núcleo se encoge y se pone al rojo blanco. A mitad de frase la cámara entra
//          en el núcleo (detalle; la regla se apaga, es un inserto): núcleos de hidrógeno (el núcleo de Atom sin órbitas)
//          se aprietan, chocan de dos en dos y se funden en helio, con un destello por choque; uno, abajo, se deja
//          aplastar por otro que se le sienta encima: en 3D y en vivo, cede por arriba (sq [1,15, 0,7, 1,15]) y se ladea
//          (rot z 0,35), aguanta así y se funde con él
//  rebota  al acabar la frase 58 vuelve el corte, ahora en plano medio (completo en la marca): el Sol de 560 px llena el
//          cuadro y el núcleo queda en el centro; un rayo de luz de alambre rebota dentro como una bola de pinball mientras
//          un calendario de arcilla, en la esquina oscura de arriba a la izquierda, pasa hojas de 1 a 120000 (años); a mitad
//          de frase la luz sale por el borde, la cámara la sigue (el Sol se aleja arriba a la izquierda y la persona entra
//          por la derecha con el mismo movimiento) y viaja con un reloj que marca 8 minutos hasta la cara de una persona de
//          perfil, con los ojos cerrados al sol: el alambre se para justo antes de la piel y su luz cae en el pómulo
//  pequeno (completo en la marca) el Sol entero, otra vez en su sitio del mundo, se encoge entre un montón de estrellas de
//          arcilla y, al fondo, arriba a la derecha, entra una estrella mucho mayor y rojiza que empieza a apagarse;
//          quieto (termina_con: el cielo de ep03-estrellas.js con u = 1, CIELO)
// CONTINUIDAD (cámara del plató de las pruebas: pos [0, 3,8, 15,5], mira [0, 2,3, 0], fov 28)
//  · Fotograma 0 = el último de ep3-tierra (comprobado: la misma media de color en el Sol, la regla y Atom): el mundo de
//    ep03-cosmos.js con camara(9) y n = 931 (y su somA), la regla P.regla con e 9, ya 0, actual 9, lupa 0,5 en
//    P.punto(1655, 528, 0,4), escala 1,42, rot [0, −0,12, 0]; Atom en (230, 780) con su vaivén y sus electrones donde los
//    deja ep3-tierra (FIN_TIERRA, calculado con las marcas de ep3-tierra).
//  · Último fotograma (ep3-vuelta empieza así; window.__fin.final lo da en números): fondoCielo(mundo, 932, { somA:
//    [252, 810, 62, 0,42] }) sin viñeta; encima, el cielo de ep03-estrellas.js con u = 1 (cielo(g, fotosCielo(P, …), { u: 1,
//    apaga: CIELO.apaga }): el Sol pequeño en (930, 470) con 62 px, la gigante en (1262, 236) con 150 px, los dos
//    montones; aquí los montones se fotografían por bandas, idénticos píxel a píxel a los de fotosCielo); la misma regla;
//    Atom en (230, 781,5) con tz 39,149 y electrones en ta 42,086 (escala 0,3326, yaw 0,182, pitch 0,256), sin energía;
//    después la viñeta y el grano de crearPost.
// LAS ESTRELLAS DE CERCA AL EMPEZAR A ENCOGER: cielo() del kit agranda la foto del montón de cerca 3,6 veces en u = 0
// (CIELO.crece.cerca), y las cuentas grandes salían a escalones. El kit está congelado: aquí el cielo se compone igual que
// cielo() (lejos, cerca, gigante y Sol, en ese orden), pero el montón de cerca sale de dos fotos más del mismo montón con
// la cámara del plató acercada (uTanY/k; girada un poco hacia la ventana que hace falta): k 2,6 y 1,95. Cada una se usa
// mientras la pantalla entera cae dentro de ella (se agranda como mucho 1,4 veces) y se funde con la siguiente; desde
// u ≈ 0,5, la foto del kit (agrandada menos de 2 veces). En u = 1 es exactamente cielo() del kit.
// COSTE: todo se compone en 2D (crearPost al final). Lo quieto son fotos: el mundo (con y sin Sol), la regla (quieta en
// 10⁹: tres fotos que se alternan para el hervor), el corte del plano medio, la persona, los núcleos (sprites), el calor
// del núcleo y el cielo. Las fotos caras se hacen POR BANDAS (la tijera de WebGL: cada banda solo paga sus píxeles; sin
// ella, una pasada del montón de estrellas cuesta ~2,3 s de CPU aunque no dibuje nada), repartidas en fotogramas baratos
// (PREPARAR: un paso por fotograma, en tres tramos: el primer plano, el detalle y el viaje de la luz; cada paso lee un
// píxel de su lienzo para que el trabajo aplazado del lienzo 2D no caiga en el fotograma siguiente) para que ningún
// fotograma pase de ~5 s de CPU en este servidor. Al cargar: las fotos del fotograma 0 (el mundo con y sin el Sol, la
// regla), la del espacio sin Sol (otra foto del mundo, ~6 s de una vez), los estrenos de Atom y del Sol, y la
// compilación de las variantes de la persona en
// su encuadre, del calendario y del reloj (dibujándolos con una tijera de un píxel: solo compilan). En vivo: Atom siempre;
// el Sol mientras se abre y se calienta; el núcleo que se deja aplastar; el calendario y el reloj mientras se mueven.
import * as THREE from 'three';
import { escena } from '/atomo/plato/escena.js';
import { crearPlato, crearPost, cargarFuenteCartela, cl, mix, prog, ss, eio, eoc, eic, eob, azar, mulberry32, brote } from '/atomo/plato/kits/plastilina-adulta.js';
import { crearMundo, camara, estadoMundo, fotoMundo, FINAL_TIERRA } from '/atomo/plato/kits/ep03-cosmos.js';
import { tiposEstrellas, uniformesEstrellas, sol, nucleo, estrellas, halo, destello, brilloNucleo, solComoMundo,
  fotoCielo, cielo, estadoCielo, fondoCielo, CIELO } from '/atomo/plato/kits/ep03-estrellas.js';
import { tiposTiempo, uniformesTiempo, calendario, reloj, rayo, caminoRebotes, largoCamino, hojaEn } from '/atomo/plato/kits/ep03-tiempo.js';

const T0 = performance.now();
window.__carga = [];
const marcaCarga = (k) => window.__carga.push([k, Math.round(performance.now() - T0)]);
const E = await escena('ep3-sol', 'ep03');
marcaCarga('escena');
const M = (k) => E.marca(k);
const m = { fusion: M('fusion'), fusionFin: M('fusion_fin'), rebota: M('rebota'), rebotaFin: M('rebota_fin'), pequeno: M('pequeno'), pequenoFin: M('pequeno_fin') };
const D = E.duracion, QUIETO = D - 0.6;
const W = 1920, H = 1080;
const mitad = (a, b) => (a + b) / 2;

// ---------------------------------------------------------------- tiempos (todo sale de las marcas)
const T = {
  funde: [m.fusion - 0.42, m.fusion - 0.26],          // la foto del mundo da paso a la pieza (iguales)
  corte: [m.fusion - 0.3, m.fusion],                  // el octante se abre (completo en la marca)
  flechas: [m.fusion + 0.55, m.fusion + 1.0],         // llegan las flechas…
  aprieta: [m.fusion + 1.0, m.fusion + 2.4],          // … y aprietan
  calor: [m.fusion + 1.7, m.fusion + 3.4],            // el núcleo se pone al rojo blanco
  entra: [mitad(m.fusion, m.fusionFin) - 0.3, mitad(m.fusion, m.fusionFin) + 0.05],   // la cámara entra en el núcleo
  sale: [m.fusionFin - 0.05, m.rebota],               // al acabar la frase vuelve al corte, en plano medio (completo en la marca)
  rayo: [m.rebota + 0.1, null],                        // el rayo rebota dentro…
  fuera: mitad(m.rebota, m.rebotaFin) - 0.05,          // … y sale por el borde (a mitad de frase)
  llega: m.rebotaFin - 0.7,                            // llega a la cara
  s5: m.pequeno - 0.22,                                // corte al Sol entero
  encoge: [m.pequeno - 0.1, m.pequeno + 1.8],          // el Sol se encoge entre las estrellas
  apaga: [m.pequeno + 1.9, Math.min(m.pequenoFin + 0.2, QUIETO - 0.15)],   // la gigante empieza a apagarse
};
T.rayo[1] = T.fuera;
T.pan = [T.fuera - 0.05, T.fuera + 0.7];               // la cámara sigue a la luz
const T_DET = T.entra[1];                              // el detalle empieza
// los choques del detalle (a partir de T_DET; acaban antes de volver)
const LDET = T.sale[0] - T_DET;
const CH = { a: T_DET + 0.20 * LDET, b: T_DET + 0.40 * LDET, aplasta: [T_DET + 0.50 * LDET, T_DET + 0.76 * LDET], c: T_DET + 0.84 * LDET };
// el calendario salta al volver del núcleo cuando el detalle ya casi no se ve (opacidad < 0,1)
T.calendario = [mix(T.sale[0], T.sale[1], 0.58), T.sale[1] + 0.06];

// ---------------------------------------------------------------- el plató
// una flecha gorda de arcilla (pieza propia de la escena: el peso que aprieta): asta y punta a lo largo de +x, de −1 a 1
const FLECHA_GORDA = { radio: 1.05, glifos: [], glsl: /* glsl */`
float pz_flechagorda(vec3 q, vec4 T, out float m) {
  m = 0.0;
  float asta = sdCapsule(q, vec3(-0.92, 0.0, 0.0), vec3(0.15, 0.0, 0.0), 0.15);
  vec2 p = vec2(length(q.yz), q.x - 0.08);
  float h = 0.86, r = 0.36 * (1.0 - clamp(p.y / h, 0.0, 1.0));
  float punta = max(max(p.x - r, -p.y), p.y - h) * 0.82;
  return smin(asta, punta, 0.07) - 0.004 * bultos(q * 3.0);
}
float pzc_flechagorda(vec3 q, vec4 T) { return sdCapsule(q, vec3(-0.85, 0.0, 0.0), vec3(0.3, 0.0, 0.0), 0.12); }
vec3 pzcol_flechagorda(vec3 q, vec4 T, float m) { gEm = C_AMBAR * 0.04; return mix(C_TERRA, C_AMBAR, 0.35) * (0.94 + 0.12 * vnoise(q * 5.0)); }
` };
// (continuidad) la persona, la regla y su flecha en los mismos huecos que en ep3-tierra (0, 1 y 2): el hueco siembra las
// huellas, los bultos y el grano de la arcilla de cada pieza, y la regla tiene que salir igual que allí
const I = { PER: 0, REG: 1, FLE: 2, SOL: 3, NUC: 4, CAL: 5, REL: 6, EST: 7, GIG: 8, FG: 9 };
// (continuidad) los rótulos de la regla, en Jost como en ep3-tierra: crearPlato los hornea con cargarFuenteRotulos(), que
// pide la fuente en cuanto añade la hoja de estilos, antes de que llegue, y sin cartela se queda con la de respaldo (más
// fina). ep3-tierra tiene cartela, y su cargarFuenteCartela() espera a la hoja: aquí se hace lo mismo antes del plató
await cargarFuenteCartela();
marcaCarga('fuente');
const P = await crearPlato({
  piezas: ['humano', 'reglaA', 'flecha', 'sol', 'nucleo', 'calendario', 'reloj', 'estrellas', 'gigante', 'flechagorda'],
  tiposExtra: { ...tiposEstrellas(['sol', 'nucleo', 'estrellas', 'gigante']), ...tiposTiempo(['calendario', 'reloj']), flechagorda: FLECHA_GORDA },
  uniformes: { ...uniformesEstrellas(), ...uniformesTiempo() },
  alfa: true, post: false,
  sombraFondo: ['p0', 'p1'],
  camara: { pos: [0, 3.8, 15.5], mira: [0, 2.3, 0], fov: 28, desenfoque: 44 },
});
marcaCarga('plató');
const POST = crearPost();
const en = (sx, sy, z) => P.punto(sx, sy, z);
const pant = (p) => P.proyectar(p);
const pxU = (pos) => { const a = pant(pos), b = pant([pos[0] + 1, pos[1], pos[2]]); return Math.hypot(b[0] - a[0], b[1] - a[1]); };

// ---------------------------------------------------------------- capas: el mundo (oculto) y el lienzo 2D encima
const cont = document.getElementById('escena');
const mundo = crearMundo(cont, { captura: P.captura });
mundo.lienzo.style.visibility = 'hidden';
marcaCarga('mundo');
const lienzoGL = P.renderer.domElement;
const capa = document.createElement('canvas');
capa.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;display:block;z-index:3';
cont.appendChild(capa);
const g = capa.getContext('2d');
function ajustarCapa() {
  if (capa.width !== lienzoGL.width || capa.height !== lienzoGL.height) { capa.width = lienzoGL.width; capa.height = lienzoGL.height; }
  const k = capa.width / W; g.setTransform(k, 0, 0, k, 0, 0);
}
const pegarGL = (alfa = 1) => { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = alfa; g.drawImage(lienzoGL, 0, 0); g.restore(); };
const lienzo = (w = lienzoGL.width, h = lienzoGL.height) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const copiaGL = () => { const c = lienzo(); c.getContext('2d').drawImage(lienzoGL, 0, 0); return c; };
// una foto de 1920 × 1080 escalada s veces alrededor de (px, py), que queda en (qx, qy)
function pegarEscalada(f, s, [px, py], [qx, qy] = [px, py], alfa = 1, gg = g) {
  if (alfa <= 0.002) return;
  gg.save(); gg.globalAlpha *= alfa;
  gg.translate(qx, qy); gg.scale(s, s); gg.translate(-px, -py);
  gg.drawImage(f, 0, 0, W, H);
  gg.restore();
}
// el «parpadeo» de la luz del plató (como ep3-casa)
function parpadeo(n) {
  const fl = azar(n, 3) - 0.5;
  g.fillStyle = fl > 0 ? `rgba(255,236,210,${fl * 0.03})` : `rgba(0,0,6,${-fl * 0.04})`; g.fillRect(0, 0, W, H);
}
// la viñeta del mundo, quitada (crearPost la vuelve a poner al final, igual)
function sinVineta(c) {
  const gc = c.getContext('2d'), im = gc.getImageData(0, 0, c.width, c.height), d = im.data, k = W / c.width;
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
    const v = 1 - 0.42 * ss(0.42, 1.12, Math.hypot(((x + 0.5) * k - 960) / 1080, ((y + 0.5) * k - 540) / 1080));
    if (v > 0.999) continue;
    const o = (y * c.width + x) * 4; d[o] = Math.min(255, d[o] / v); d[o + 1] = Math.min(255, d[o + 1] / v); d[o + 2] = Math.min(255, d[o + 2] / v);
  }
  gc.putImageData(im, 0, 0);
  return c;
}

// ---------------------------------------------------------------- render por bandas (la tijera de WebGL)
// (coste) P.render con la tijera puesta solo dibuja (y solo paga) los píxeles de ese rectángulo: el resultado de cada
// banda es idéntico píxel a píxel al de la foto entera (comprobado). rect en px de diseño [x0, y0, x1, y1].
function conTijera(rect, fn) {
  const R = P.renderer, k = lienzoGL.width / W, pr = R.getPixelRatio(), Hd = lienzoGL.height;
  // un píxel de más por cada lado (redondeos de la vista previa); se copia solo el rectángulo
  const x0 = Math.max(0, Math.floor(rect[0] * k) - 1), x1 = Math.min(lienzoGL.width, Math.ceil(rect[2] * k) + 1);
  const y0 = Math.max(0, Math.floor(rect[1] * k) - 1), y1 = Math.min(Hd, Math.ceil(rect[3] * k) + 1);
  R.setScissorTest(true); R.setScissor(x0 / pr, (Hd - y1) / pr, (x1 - x0) / pr, (y1 - y0) / pr);
  try { fn(); } finally { R.setScissorTest(false); }
}
// la cámara del plató acercada k veces (uTanY/k: un zoom exacto alrededor de su eje) y girada hacia el píxel `mira` de
// la foto normal; fn dibuja con ella. Devuelve la función que lleva un píxel de la foto acercada a la foto normal.
function camaraZoom(k, mira) {
  const U = P.U, tan0 = U.uTanY.value, asp = U.uAsp.value;
  const d = new THREE.Vector3((2 * mira[0] / W - 1) * tan0 * asp, (1 - 2 * mira[1] / H) * tan0, -1).normalize();
  const f = d.clone().negate(), r = new THREE.Vector3(0, 1, 0).cross(f).normalize(), u = f.clone().cross(r);
  const Rs = new THREE.Matrix3().set(r.x, u.x, f.x, r.y, u.y, f.y, r.z, u.z, f.z);
  const aNormal = (hx, hy) => {
    const l = new THREE.Vector3((2 * hx / W - 1) * tan0 / k * asp, (1 - 2 * hy / H) * tan0 / k, -1).applyMatrix3(Rs);
    return [((l.x / -l.z) / (tan0 * asp) + 1) / 2 * W, (1 - (l.y / -l.z) / tan0) / 2 * H];
  };
  const usar = (fn) => {
    const rot0 = U.uCamRot.value, pix0 = U.uPix.value;
    U.uCamRot.value = rot0.clone().multiply(Rs); U.uTanY.value = tan0 / k; U.uPix.value = pix0 / k;
    try { fn(); } finally { U.uCamRot.value = rot0; U.uTanY.value = tan0; U.uPix.value = pix0; }
  };
  // la misma relación, como afín (centro y escala): el error en las esquinas va en __fin (≤ 1 px)
  const c0 = aNormal(960, 540), sx = (aNormal(1360, 540)[0] - aNormal(560, 540)[0]) / 800, sy = (aNormal(960, 840)[1] - aNormal(960, 240)[1]) / 600;
  const afin = { x0: c0, s: [sx, sy] };
  const err = Math.max(...[[0, 0], [W, 0], [0, H], [W, H]].map(([hx, hy]) => { const e = aNormal(hx, hy); return Math.hypot(e[0] - (c0[0] + sx * (hx - 960)), e[1] - (c0[1] + sy * (hy - 540))); }));
  return { k, mira, usar, aNormal, afin, err };
}
// trabajos por pasos: cada foto cara es una lista de pasos (una banda cada uno) que se reparten en fotogramas baratos
// (PREPARAR); F(clave) termina los que falten (si se pide un instante suelto, la foto sale igual)
const TRABAJOS = {};
function bandas(rect, nb) {
  const out = [];
  for (let b = 0; b < nb; b++) out.push([rect[0], Math.round(mix(rect[1], rect[3], b / nb)), rect[2], Math.round(mix(rect[1], rect[3], (b + 1) / nb))]);
  return out;
}
// pasos: [{ rect, capa: índice del lienzo, poner(): coloca las piezas (entre P.limpiar y P.render), n, zoom }]; fin(capas)
function trabajo(clave, pasos, fin) { TRABAJOS[clave] = { pasos, fin, capas: [], hechos: new Set() }; }
function hacerPaso(clave, i) {
  const t = TRABAJOS[clave];
  if (FOTOS[clave] || t.hechos.has(i)) return;
  const p = t.pasos[i], ci = p.capa ?? 0;
  const c = t.capas[ci] ?? (t.capas[ci] = lienzo());
  const dibujar = () => conTijera(p.rect, () => { P.limpiar(); p.poner(); P.render(p.n, { fondo: false }); });
  if (p.zoom) p.zoom.usar(dibujar); else dibujar();
  const k = lienzoGL.width / W, x0 = Math.floor(p.rect[0] * k), y0 = Math.floor(p.rect[1] * k), x1 = Math.ceil(p.rect[2] * k), y1 = Math.ceil(p.rect[3] * k);
  c.getContext('2d').drawImage(lienzoGL, x0, y0, x1 - x0, y1 - y0, x0, y0, x1 - x0, y1 - y0);
  c.getContext('2d').getImageData(x0, y0, 1, 1);      // (coste) hecho ya, en este fotograma (ver asentar)
  t.hechos.add(i);
}

// ---------------------------------------------------------------- Atom: el de ep3-tierra, en el mismo estado
const A_Z = 1.0, ATOMO = [230, 780];
const A_ESC = 180 / (2 * (1.68 + 0.16) * pxU(en(...ATOMO, A_Z)));
const CAM = [0, 3.8, 15.5];
const gy = (p) => Math.atan2(CAM[0] - p[0], CAM[2] - p[2]), gp = (p) => Math.atan2(p[1] - CAM[1], Math.hypot(CAM[0] - p[0], CAM[2] - p[2]));
const A_W = en(...ATOMO, A_Z), A_REF = en(850, 330, A_Z);
const A_YAW = gy(A_W) - gy(A_REF), A_PITCH = gp(A_W) - gp(A_REF);
// el reloj de Atom al acabar ep3-tierra (su vaivén, tz, y sus electrones, ta), con sus marcas
const FIN_TIERRA = await (async () => {
  let mt = { duracion: 19.751, marcas: { tierra: 1.5, sol: 15.019 } };
  try { const j = await (await fetch('/atomo/plato/escenas/marcas-ep03.json')).json(); if (j['ep3-tierra']) mt = j['ep3-tierra']; } catch (e) { /* las de arriba */ }
  const Qt = mt.duracion - 0.6, mT = mt.marcas.tierra, mS = mt.marcas.sol;
  const vel = (t) => (1 + 1.1 * Math.exp(-Math.pow((t - mT) / 0.4, 2)) + 0.9 * Math.exp(-Math.pow((t - mS) / 0.4, 2))) * (1 - eio(prog(t, Qt - 0.9, Qt)));
  const dt = 1 / 240; let ta = 0, t = 0;
  for (; t + dt <= Qt + 1e-9; t += dt) ta += vel(t + dt / 2) * dt;
  // n: el número de fotograma con que ep3-tierra dibuja su último fotograma (el hervor y el parpadeo de la luz del plató)
  return { tz: Qt - 0.45, ta, n: Math.max(0, Math.floor(Qt * 12 + 1e-6)) };
})();
marcaCarga('fin tierra');
// el mío arranca quieto (como lo dejó) y coge su ritmo en medio segundo; al final se calma igual
const DT = 1 / 240, TA = [0], TZ = [0];

    const { x0, s } = A.Z.afin, e = S * s[0];

      g.globalCompositeOperation = 'screen';
      const R2 = 200, q = [DIANA[0] + per.dx, DIANA[1]];
      const g2 = g.createRadialGradient(q[0], q[1], 0, q[0], q[1], R2);
      g2.addColorStop(0, `rgba(255,214,150,${0.26 * luz * (0.6 + 0.4 * Math.exp(-(ts - T.llega) / 0.4))})`); g2.addColorStop(1, 'rgba(255,190,110,0)');
      g.fillStyle = g2; g.fillRect(q[0] - R2, q[1] - R2, 2 * R2, 2 * R2);
      g.restore();
    }
  }
  // el rayo: dentro, rebotando (a velocidad constante), y fuera, hasta justo antes de la piel
  const dentroU = prog(ts, T.rayo[0], T.fuera);
  const camino = CAMINO3.map(tr);
  let punta = null;
  if (ts >= T.rayo[0]) {
    const s1 = L3 * dentroU;
    let pts = camino;
    let hasta = s1;
    let fin = null;
    if (ts > T.fuera) {
      // fuera: de la salida hasta la cara (el punto de contacto se calcula con el pan acabado; durante el pan se mueve
      // con la persona)
      const salida1 = (() => { const c1 = panXY(1, SOL3_PX), s1x = panS(1); return [c1[0] + (SALIDA3[0] - SOL3_PX[0]) * s1x, c1[1] + (SALIDA3[1] - SOL3_PX[1]) * s1x]; })();
      const C = contacto(salida1);
      fin = [C.punto[0] + per.dx, C.punto[1]];
      const uo = 1 - Math.pow(1 - prog(ts, T.fuera, T.llega), 1.25);   // la luz va casi a velocidad constante (el reloj, igual)
      const exterior = Math.hypot(fin[0] - camino[camino.length - 1][0], fin[1] - camino[camino.length - 1][1]);
      pts = [...camino, fin];
      hasta = L3 * sTot + exterior * uo;
    }
    // al llegar, la cuenta de la punta se apaga y su luz se abre sobre la cara: un final blando, no una aguja
    const r = rayo(g, pts, { hasta, grosor: 6.5 * Math.min(1.25, sTot), brillo: 1, cabeza: 1 - ss(T.llega - 0.12, T.llega + 0.2, ts) });
    punta = r?.punta;
    if (fin && luz > 0.001) {
      const q = fin, R = 90;
      g.save(); g.globalCompositeOperation = 'screen';
      const gq = g.createRadialGradient(q[0], q[1], 0, q[0], q[1], R);
      gq.addColorStop(0, `rgba(255,236,190,${0.55 * luz * (0.55 + 0.45 * Math.exp(-(ts - T.llega) / 0.35))})`); gq.addColorStop(0.4, `rgba(255,200,120,${0.22 * luz})`); gq.addColorStop(1, 'rgba(255,180,100,0)');
      g.fillStyle = gq; g.fillRect(q[0] - R, q[1] - R, 2 * R, 2 * R);
      g.restore();
    }
    // un destellito en cada rebote, al pasar la punta
    if (ts < T.fuera + 0.2) for (const [sr, x, y] of REBOTES) {
      const v = s1 - sr;
      const k = v >= 0 && v < 70 ? Math.exp(-v / 22) : 0;
      if (k > 0.03) { const p = tr([x, y]); destello(g, p[0], p[1], 46 * sTot, 0.8 * k, { rayos: 4, giro: sr }); }
    }
  }
  // (al volver del núcleo) el detalle que se va, debajo de lo vivo: el calendario y Atom quedan encima
  if (antesDeVivo) antesDeVivo();
  // el calendario (vivo mientras pasan las hojas); se queda atrás con el pan
  const kc = (1 - ss(T.pan[0], T.pan[0] + 0.35, ts)) * ss(T.calendario[0], T.calendario[0] + 0.05, ts);
  // lo vivo: Atom, el calendario y el reloj
  P.limpiar();
  atomo(ts, { claro });
  if (kc > 0.01) {
    const h = hojaEn(ts, CLAVES_CAL, 0.17);
    // se queda atrás: se va hacia la izquierda con el pan, encogiendo
    const ua = eic(prog(ts, T.pan[0], T.pan[0] + 0.35));
    const pc = en(CAL_X - (PAN.de[0] - PAN.a[0]) * up, CAL_Y + 30 * (1 - ss(T.calendario[0], T.calendario[1], ts)) + 60 * ua, 1.2);
    const kIn = eob(prog(ts, T.calendario[0], T.calendario[1]), 1.3);   // entra de un salto al volver del núcleo
    calendario(P, I.CAL, { ...CAL3, escala: CAL3.escala * (1 - 0.85 * ua) * Math.max(0.02, kIn), pos: pc, ...h, toque: h.hoja > 0 || ua > 0 || kIn < 1 });
  }
  const kr = ss(T.pan[1] - 0.35, T.pan[1] + 0.1, ts);
  if (kr > 0.01 && punta) {
    // el reloj va con la luz, por encima, hasta que la luz se acerca a la cara (allí se queda)
    const xr = Math.min(Math.max(punta[0] - 30, 430), DIANA[0] + per.dx - 300), yr = cl(punta[1] - 175, 140, 400);
    const R = relojEn(ts);
    reloj(P, I.REL, { pos: en(xr, yr, 1.6), escala: 0.62 * eob(kr, 1.4), rot: [0.05, 0.15, 0], minutos: R.minutos, sector: R.sector, toque: kr < 1 });
  }
  P.render(n, { fondo: false });
  pegarGL();
}
function personaEn(ts, up) { return { k: ts >= T.pan[0] ? 1 : 0, dx: DX_PER * (1 - up) }; }
// S5: el cielo
function tramo5(n, ts) {
  g.drawImage(F('espacio'), 0, 0, W, H);
  const u = eio(prog(ts, T.encoge[0], T.encoge[1]));
  // titileo: la gigante parpadea un poco al apagarse
  const ua = eio(prog(ts, T.apaga[0], T.apaga[1]));
  const titila = 0.03 * Math.sin(ts * 9.0) * ua * (ts < QUIETO ? 1 : 0);
  cieloPagina(u, CIELO.apaga * ua + titila, Math.min(ts, QUIETO));
  P.limpiar(); atomo(ts); P.render(n, { fondo: false }); pegarGL();
}

// ---------------------------------------------------------------- fotograma
// (coste) cada foto cara se hace por pasos (bandas) en fotogramas baratos poco antes de hacer falta, en orden, como
// renderiza render-escenas.mjs; si se pide un instante suelto, F() la hace al momento y el resultado es el mismo.
// [instante, clave] hace la foto entera (o termina la de pasos); [instante, clave, paso] hace solo ese paso.
// Cada paso va a un número de fotograma (entero: con instantes en coma flotante, alguno se saltaba y caía en otro).
const PREPARAR = [];
const prep = (t, ...a) => PREPARAR.push([Math.round(t * 12), ...a]);
{
  const pasosDe = (k) => TRABAJOS[k].pasos.map((_, i) => i);
  let t;
  const uno = (...a) => { prep(t, ...a); t += 1 / 12; };
  const dos = (...a) => { prep(t, ...a); t += 2 / 12; };
  const todo = (k, f = uno) => { for (const i of pasosDe(k)) f(k, i); f(k); };
  // A · el primer plano (el Sol vivo, ~2,5 s de CPU por fotograma; sobra sitio): un paso cada dos fotogramas, después
  // de que se abra el corte (esos fotogramas ya cuestan ~4 s); las regla del hervor, sin paso final (no hace nada)
  t = T.corte[1];
  dos('flecha');
  for (const k of ['reg1', 'reg2']) for (const i of pasosDe(k)) dos(k, i);
  N_HERVOR = PREPARAR[PREPARAR.length - 1][0] + 1;
  todo('plasmaBase', dos); dos('plasma');
  for (const k of ['nucH0', 'nucH1', 'nucHe0', 'nucHe1', 'nucBlur']) dos(k);
  todo('corteS1', dos);
  dos('regTenue');
  if (t > T.entra[0]) console.warn('ep3-sol: PREPARAR no cabe en el primer plano', t);
  // B · el detalle (sprites y un núcleo vivo, ~2,3 s): el plano medio, la persona y el montón de lejos
  t = T_DET + 0.1;
  for (const k of ['corte0', 'corte1', 'persona0', 'persona1']) todo(k);
  uno('personaSombra');
  todo('monton/lejos');
  // al final del detalle ya no hay núcleo vivo (~1,8 s): el Sol y la gigante del cielo (~3 s cada una), con hueco
  t += 1 / 12;
  dos('cielo/gigante'); dos('cielo/giganteApagada'); dos('cielo/sol');
  if (t > T.sale[0]) console.warn('ep3-sol: PREPARAR no cabe en el detalle', t);
  // C · el viaje de la luz (~2–2,5 s): las estrellas de cerca en alta y el montón de cerca
  t = T.fuera + 0.05;
  for (const A of ALTAS) todo(A.clave);
  todo('monton/cerca');
  if (t > T.s5 - 0.05) console.warn('ep3-sol: PREPARAR no cabe en el viaje', t);
}
function dibujar(t) {
  const ts = Math.min(t, QUIETO);
  const n = Math.floor(ts * 12 + 1e-6);
  ajustarCapa();
  for (const [n0, k, i] of PREPARAR) if (n === n0) { if (i === undefined) F(k); else hacerPaso(k, i); }
  // el fotograma 0 es el último de ep3-tierra: su plató (Atom y la regla) se dibuja con el número de fotograma de allí
  const nP = ts < T.funde[0] ? FIN_TIERRA.n : n;
  if (ts < T.funde[0]) {
    // el último fotograma de ep3-tierra
    g.drawImage(F('mundoSol'), 0, 0, W, H);
    P.limpiar(); atomo(ts); P.render(nP, { fondo: false }); pegarGL();
  } else if (ts < T.entra[0]) {
    const uf = tramo1(n, ts);
    // el fundido de la foto del mundo a la pieza
    if (uf < 1) { g.save(); g.globalAlpha = 1 - uf; g.drawImage(F('mundoSol'), 0, 0, W, H); g.restore(); P.limpiar(); atomo(ts); P.render(n, { fondo: false }); pegarGL(); }
  } else if (ts < T.sale[0]) {
    // entrar en el núcleo: el corte caliente se agranda alrededor del núcleo mientras llega el detalle
    const ue = eio(prog(ts, T.entra[0], T.entra[1]));
    if (ue < 1) {
      g.drawImage(F('mundoSinSol'), 0, 0, W, H);
      const s = mix(1, 3.2, ue);
      halo(g, NUC1[0] + (SX - NUC1[0]) * s, NUC1[1] + (SY - NUC1[1]) * s, SR * s, 1, 'sol');
      pegarEscalada(F('corteS1'), s, NUC1, NUC1);
      brilloNucleo(g, NUC1[0], NUC1[1], 0.3 * SR * 0.84 * s, 0.85);
    }
    if (ue > 0) { g.save(); g.globalAlpha = ss(0.35, 1, ue); tramo2(n, ts); g.restore(); }
    sombraAtom(ts, ss(0.3, 1, ue));
    P.limpiar(); atomo(ts, { claro: ss(0.3, 1, ue) }); P.render(n, { fondo: false }); pegarGL();
  } else if (ts < T.s5) {
    // volver: el detalle se funde en el corte que se aleja desde el núcleo, debajo de lo vivo (el calendario y Atom)
    const us = prog(ts, T.sale[0], T.sale[1]);
    const kd = 1 - ss(0, 0.7, us);
    tramo34(n, ts, {
      claro: kd,
      antesDeVivo: kd > 0.002 ? () => {
        g.save(); g.globalAlpha = kd;
        g.translate(NUC3[0], NUC3[1]); g.scale(1 + 0.6 * us, 1 + 0.6 * us); g.translate(-NUC3[0], -NUC3[1]);
        tramo2(n, ts, { vivo: false });
        g.restore();
        sombraAtom(ts, kd);
      } : null,
    });
  } else tramo5(n, ts);
  // encima de todo: la regla (su foto, con el hervor de tres fotos que se alternan; apagada durante el detalle); la
  // viñeta y el grano
  const kd = kDetalle(ts);
  const reg = F(ts < T.funde[0] ? 'reg0' : reglaDe(n));
  if (kd < 0.002) g.drawImage(reg, 0, 0, W, H);
  else {
    g.save(); g.globalAlpha = 1 - kd; g.drawImage(reg, 0, 0, W, H);
    g.globalAlpha = 0.5 * kd; g.drawImage(F('regTenue'), 0, 0, W, H); g.restore();
  }
  if (ts >= T.funde[0]) parpadeo(n);
  POST.aplicar(g, n);
}
// para atomo/herramientas/guias-humano.py: la persona del plano del viaje (centro, coronilla y suela en px; la suela queda
// fuera de cuadro) y, con ?vista=guias, la misma persona y la misma postura entera, de pie en el plató
const guiasDe = (o) => { P.limpiar(); const h = P.pieza(I.PER, { ...o, postura: POSE_PER }); P.limpiar();
  const c = pant(h.mundo([0, 0.765, -0.01])), su = pant(h.mundo([0, -1, 0.05])), ce = pant(h.mundo([0, 0, 0]));
  return { x: Math.round(ce[0]), coronilla: Math.round(c[1]), suela: Math.round(su[1]) }; };
window.__guias = guiasDe(PER);
// ?dbg: para medir el coste de cada parte desde fuera (no cambia nada del dibujo)
if (new URLSearchParams(location.search).has('dbg')) window.__dbg = { P, g, F, atomo, reglaEn, pegarGL, POST, ajustarCapa, FIN_TIERRA, TRABAJOS, hacerPaso, PREPARAR, ALTAS, conTijera, capaCerca, cieloPagina };
window.__fin = { CIELO, SOL3_PX, PER, DIANA, CARA, T, CH, NUC3, SALIDA3,
  altas: ALTAS.map((A) => ({ k: A.k, mira: A.Z.mira, x0: A.Z.afin.x0, s: A.Z.afin.s, errorAfin: A.Z.err })),
  preparar: PREPARAR.map(([n0, k, i]) => [n0, k, i]),
  // el último fotograma (el primero de ep3-vuelta): el fondo, el cielo y el estado de Atom
  final: { fondo: { n: 932, somA: SOM_A }, cielo: { u: 1, apaga: CIELO.apaga }, atomo: (() => { const S = estadoAtom(QUIETO); return { sx: S.sx, sy: S.sy, tz: S.tz, ta: FIN_TIERRA.ta + tabla(TA, QUIETO), escala: A_ESC, yaw: -0.15 + A_YAW + 0.08 * Math.sin(S.tz * 0.5), pitch: 0.06 - A_PITCH }; })() } };
if (new URLSearchParams(location.search).get('vista') === 'guias') {
  const o = { pos: [en(960, 600, 1)[0], 2.4, 1], escala: 2.4, rot: PER.rot };
  window.__guias = guiasDe(o);
  marcaCarga('listo');
  E.iniciar(() => { ajustarCapa(); P.limpiar(); P.pieza(I.PER, { ...o, postura: POSE_PER, huellaFija: [0.37, 0.21, 0] }); P.render(1); g.drawImage(lienzoGL, 0, 0, W, H); POST.aplicar(g, 1); }, { paso: 1 / 12 });
} else {
marcaCarga('listo');
E.iniciar(dibujar, { paso: 1 / 12 });
}
</script>
