<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Colón · ep4</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// EP4-COLON (frases 28–29), cartela 1492.
//  colon  tres carabelas de noche, rumbo oeste (hacia la izquierda), bajo la Luna.
//  plana  en la caja, una Tierra plana tachada; en una sala con velas, tres sabios alrededor de un globo redondo, y al
//         fondo, más pálido, un sabio griego (dos mil años antes) con el mismo globo dibujado en la arena.
import { escena } from '/atomo/plato/escena.js';
import { crearAventura, PALA, ELENCO } from '/atomo/plato/kits/pixel-aventura.js';
const E = await escena('ep4-colon', 'ep04');
const R = await crearAventura(document.getElementById('lienzo'));
const { PAL, tramo } = R;
const M = (k, d) => E.marca(k, d);
const m = { colon: M('colon', 1.5), plana: M('plana', 6) };

const carabelas = (t) => {
  R.cielo(t, { luna: [230, 40, 14], nubes: true });
  R.mar(t, { luzX: 230 });
  const dx = -(t - m.colon) * 3;
  R.barco(120 + dx, 136, t, { tipo: 'carabela', esc: 1.1, dir: -1, farol: false });
  R.barco(190 + dx, 128, t, { tipo: 'carabela', esc: 0.8, dir: -1, fase: 1.1 });
  R.barco(250 + dx, 124, t, { tipo: 'carabela', esc: 0.6, dir: -1, fase: 2.3 });
};
const sabios = (t) => {
  R.interior(t, { luces: [[160, 50]], suelo: 140, radio: 170 });
  R.estandarte(36, 16, 14, 44, PALA.ROJO, t); R.estandarte(270, 16, 14, 44, PALA.AZUL, t);
  R.vela(110, 70, t); R.vela(210, 70, t);
  // el griego del fondo (pálido): una silueta más clara dibujando un círculo en la arena con un palo
  const fantasma = tramo(t, m.plana + 2.2, m.plana + 3.2);
  if (fantasma > 0) {
    const B = R.nuevo(), prev = R.usar(B);
    R.personaje(270, 122, 30, { ...ELENCO.griego, t, pose: 'senala', dir: -1 });
    R.anillo(250, 118, 6, PAL.MOON[2]);
    R.usar(prev);
    for (let i = 0; i < B.length; i++) if (B[i] && R.hash2(i % R.W, (i / R.W) | 0) < fantasma) R.buf[i] = B[i];
  }
  R.rect(158, 112, 162, 140, PAL.ORO[1]); R.rect(148, 138, 172, 141, PAL.ORO[1]);
  R.globo(160, 86, 24, 60 + t * 20, { pergamino: true, meridianos: true });
  const asiente = Math.sin(t * 5) > 0 ? 1 : 0;
  R.personaje(100, 152, 46, { ...ELENCO.sabio1, t, pose: 'senala' });
  R.personaje(220, 152 + asiente, 46, { ...ELENCO.sabio2, t, dir: -1 });
  R.personaje(252, 152, 42, { ...ELENCO.sabio1, chaqueta: PALA.AZUL, colorSombrero: PALA.AZUL, t: t + 1, dir: -1, pose: 'manos_cintura' });
};

E.iniciar((t) => {
  R.secuencia(t, [[0, (t) => R.cartela(t, '1492')], [1.2, carabelas], [m.plana - 0.2, sabios]]);
  const e = E.energia(t);
  R.caja(t, t > m.plana ? tramo(t, m.plana + 0.2, m.plana + 0.6) : 0, (x, y) => {
    // una Tierra plana (disco de canto) tachada
    R.rect(x + 4, y + 9, x + 22, y + 11, PAL.EARTH[3]); R.rect(x + 6, y + 8, x + 20, y + 8, PAL.COOL[1]);
    R.icono('X', x + 11, y + 6, PAL.ROJO);
    R.icono('globo', x + 34, y + 4, PAL.UI[8]); R.icono('globo', x + 34, y + 4, PAL.UI[8]);
  }, { energia: e });
  if (t > 1.3) R.companero(t, e);
  R.presentar();
});
</script>
</body>
</html>
