const LIN2 = [[P2, 30, 140], [P2 + 0.6, 110, 150], [find - 0.2, 120, 130], [gato, 160, 142], [ran + 0.1, 160, 142], [micro + 0.5, 300, 146], [otra + 0.15, 280, 120], [otra + 0.4, 286, 92]];

  fijo2();
  // el haz de luna por la ventana (que no se ve): una franja de luz en el suelo con motas

    for (const q of [0.4, 0.7, 1]) { let px = null, py = null; for (let i = 0; i <= 4; i++) { const an = i / 4 * Math.PI / 2, x = Math.round(cx + dir * Math.cos(an) * r * q + m * q * Math.sin(an)), y = Math.round(cy + Math.sin(an) * r * q + q * 1.5 * Math.sin(i * 1.7)); if (px !== null) R.linea(px, py, x, y, col); px = x; py = y; } } };

  { const ay = Math.round(46 + Math.sin(t * 0.9) * 12); R.linea(96, 26, 96, ay, hex('#8a8494')); R.disco(96, ay + 2, 2, hex('#14101a')); R.pset(96, ay - 1, hex('#14101a')); R.pset(95, ay + 1, hex('#5a5064')); for (const d of [-1, 1]) for (let j = 0; j < 3; j++) { const pata = Math.round(Math.sin(t * 6 + j) * 0.6); R.linea(96 + d * 2, ay + j + 1, 96 + d * 4, ay + j * 2 - 1 + pata, hex('#14101a')); } }
