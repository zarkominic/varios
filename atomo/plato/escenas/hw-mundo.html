<title>Mundo · ep7</title>

<canvas id="lienzo"></canvas>
<script type="module">
// HW-MUNDO (frase 24). Un cine a oscuras: en la pantalla, una calabaza encendida; cabezas del público a contraluz. Luego
// el mapa del mundo se llena de calabazas que salen de Estados Unidos. Al final, Shibuya de noche: rascacielos con
// neones, el paso de cebra lleno de gente disfrazada, y una gran X roja.
import { preparar, rodar } from '/atomo/plato/escenas/hw-comun.js';
const { E, R, M } = await preparar('hw-mundo');
const { PALA, PR, ELENCO, NARANJA, tramo, lerp } = R;
const m0 = M('peliculas', 0.5), L = E.duracion - m0, T = (f) => m0 + f * L;
const cine = (t) => {
  for (let y = 0; y < R.H; y++) for (let x = 0; x < R.W; x++) R.pset(x, y, R.tone([PALA.CONTORNO, PALA.NEGRO[1], PALA.MORADO[0], PALA.MORADO[1]], 0.6 + 1.6 * Math.max(0, 1 - Math.hypot(x - 160, y - 60) / 160), x, y));
  for (let y = 0; y < 90; y++) { const w = y * 0.9; for (let x = Math.round(300 - y * 1.5 - w); x < 300 - y * 1.5 + w; x++) if (R.b4(x, y) < 0.2) R.pset(x, y + 10, PALA.BLANCO[1]); }
  R.rect(70, 20, 250, 110, PALA.BLANCO[1]); R.rect(72, 22, 248, 108, PALA.CONTORNO);
  R.recorte([72, 22, 248, 108]);
  for (let y = 22; y <= 108; y++) for (let x = 72; x <= 248; x++) R.pset(x, y, R.tone(PALA.MORADO, 0.6 + (y - 22) / 86 * 1.4, x, y));
  R.calabaza(160, 104, 3.2, t);
  R.murcielagos(t, { n: 3, y0: 28 });
  R.recorte(null);
  for (let k = 0; k < 15; k++) { const x = 10 + k * 21 + (k % 2) * 6, y = 160 + (k % 3) * 4; R.disco(x, y, 7, PALA.CONTORNO); R.rect(x - 11, y + 5, x + 11, R.H, PALA.CONTORNO); R.pset(x - 3, y - 6, PALA.NEGRO[2]); }
};
const ORIGEN = [-95, 38];
const SITIOS = [[-74, 40.7], [-118, 34], [-79, 43.7], [-99.1, 19.4], [-0.1, 51.5], [-3.7, 40.4], [2.3, 48.9], [13.4, 52.5], [-46.6, -23.5], [-58.4, -34.6], [139.7, 35.7], [127, 37.6], [151.2, -33.9], [121.5, 31.2], [77.2, 28.6], [28, -26.2], [-70.6, -33.4], [37.6, 55.8]];
const mundo = (t) => {
  const u = t - T(0.33);
  R.cielo(t, { hor: 180, semilla: 4, n: 120 });
  R.pergamino(18, 26, 302, 164, { semilla: 5 });
  const pj = R.proyector(26, 32, 294, 158, -170, 180, -56, 76);
  R.recorte([21, 29, 299, 161]); R.mundo(pj, { tierra: 2.4 }); R.recorte(null);
  const orden = SITIOS.map((p) => [Math.hypot(p[0] - ORIGEN[0], p[1] - ORIGEN[1]), p]).sort((a, b) => a[0] - b[0]);
  const n = Math.round(tramo(u, 0.2, 0.22 * L) * orden.length);
  for (let k = 0; k < n; k++) { const [x, y] = pj(...orden[k][1]).map(Math.round); R.halo(x, y, 9, [NARANJA[0], NARANJA[1]], 0.7); R.icono('calabaza', x - 3, y - 4, NARANJA[3], PALA.CONTORNO); }
};
const NEON = [PALA.ROJO, PALA.AZUL, PALA.MORADO, PALA.AMARILLO, PALA.VERDE];
const shibuya = (t) => {
  const u = t - T(0.58);
  R.cielo(t, { hor: 180, semilla: 21, n: 40 });
  for (let k = 0; k < 9; k++) { const x0 = k * 38 - 6, h = 70 + Math.round(R.hash2(k, 3) * 60); R.rect(x0, 130 - h, x0 + 34, 130, PALA.NEGRO[1]); for (let y = 130 - h + 6; y < 124; y += 7) for (let x = x0 + 4; x < x0 + 31; x += 6) if (R.hash2(x, y + k) > 0.35) R.rect(x, y, x + 2, y + 2, R.hash2(x, y) > 0.7 ? NEON[(k + y) % 5][3] : PALA.AMARILLO[2]); R.rect(x0 + 6, 130 - h + 10, x0 + 28, 130 - h + 16, NEON[k % 5][2 + (Math.sin(t * 4 + k) > 0 ? 1 : 0)]); }
  R.suelo(130, [PALA.CONTORNO, PALA.NEGRO[1], PALA.NEGRO[2], PALA.MORADO[1]], { luz: 1.2 });
  for (let k = 0; k < 10; k++) R.rect(10 + k * 32, 140, 26 + k * 32, 144, PALA.BLANCO[1]);
  const TIPOS = [ELENCO.bruja, ELENCO.vampiro, ELENCO.disfrazCalabaza, ELENCO.diablo, null];
  for (let f = 0; f < 3; f++) for (let k = 0; k < 15; k++) {
    const i = f * 15 + k, x = Math.round(((k * 23 + f * 11 + t * (f % 2 ? -6 : 6)) % 360 + 360) % 360 - 20), y = 150 + f * 11, el = TIPOS[i % 5];
    if (!el) R.fantasma(x, y - 2, 0.55, t + i); else R.personaje(x, y, 16, { ...el, t: t + i, anda: t * 6 + i, dir: f % 2 ? -1 : 1, sombra: false, luz: { lado: 1, color: NEON[i % 5][3] } });
  }
  if (u > 0.26 * L) for (const [dx, dy] of [[0, 0], [1, 0], [2, 0], [0, 1], [1, 1], [2, 1]]) R.equis(160 + dx, 88 + dy, 34, dx === 0 && dy === 0 ? PALA.ROJO[3] : PALA.ROJO[2]);
};
rodar(E, R, [[0, cine], [T(0.33), mundo], [T(0.58), shibuya]], { año: 2026 });
</script>
