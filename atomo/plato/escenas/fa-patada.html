<script type="module">
// FA-PATADA (frases 24–25), hoy. Cuatro planos:
// 1. el campo de entrenamiento: el quarterback lanza un pase en espiral al receptor, que lo atrapa («pass … game»);
//    el pateador, en primer término, calienta y mira; corta en «The other»;
// 2. el estadio cubierto de Las Vegas, de lado: el centro pasa el balón, el que sujeta lo planta, el pateador da sus pasos
//    («where the foot…») y al tocar el balón («hundredth») todo va a cámara lenta: el destello y «0.01» con el reloj;
//    corta en «In»;
// 3. inserto a ras de césped: la bota entra y aplasta el balón («the foot squashes»), el balón sale dando vueltas de
//    punta a punta («Launches»), saltan las bolitas de caucho y aparece «60» con las flechas de velocidad; corta en «and»;
// 4. el aula del laboratorio del giro: el físico va trazando en tiza la patada, con los balones que dan vueltas de punta
//    a punta, y en «Just as spin steadies a pass» se vuelve y rodea con tiza los balones del pase; la física asiente.
import * as T from '/atomo/plato/escenas/fa-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('fa-patada');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const ease = (u) => u * u * (3 - 2 * u), cl = (v, a, b) => Math.max(a, Math.min(b, v)), lin = (t, a, b) => cl((t - a) / (b - a), 0, 1);
const K = hex('#141420'), BL = hex('#f6f6ee'), BLS = hex('#c8c8c0');
const hx = (o) => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, hex(v)]));
const DENVER = hx({ X: '#8a2a3a', x: '#f2eee2', w: '#d87a8a', C: '#8a2a3a', c: '#f2eee2', F: '#f2eee2', W: '#8a2a3a', o: '#f2eee2' });

const FIJO = new Map();

const arrodillado = (def, x, suelo, t, o = {}) => {
  const g = []; for (let y = suelo - 2; y <= suelo + 7; y++) for (let i = -1; i <= 16; i++) g.push([x + i, y, R.pget(x + i, y)]);
  const r = R.actor(def, x, suelo + 6, t, o);
  for (const [px, py, c] of g) R.pset(px, py, c);
  const d = o.dir ?? 1, X = (i) => (d > 0 ? x + i : x + 14 - i), F = (o.pal && o.pal.F) || (def.pal && def.pal.F) || BL;
  for (let i = 2; i <= 13; i++) { R.pset(X(i), suelo - 3, K); R.pset(X(i), suelo - 2, F); R.pset(X(i), suelo - 1, i > 10 ? K : mezcla(F, K, 0.25)); R.pset(X(i), suelo, K); }
  R.pset(X(1), suelo - 2, K); R.pset(X(14), suelo - 2, K); R.pset(X(14), suelo - 1, K);
  for (let i = 0; i <= 3; i++) { R.pset(X(i), suelo - 1, K); R.pset(X(i), suelo, K); }
  for (let i = 1; i <= 13; i++) R.pset(X(i), suelo + 1, mezcla(R.pget(X(i), suelo + 1), K, 0.35));   // la sombra

// la pierna que patea: muslo y espinilla del color del pantalón y la media, y la bota negra con su brillo

  R.linea(cx - 1, cy, mx - 1, my, K); R.linea(mx - 1, my + 1, fx - 1, fy + 1, K);
  R.rect(fx - 1, fy, fx + 3, fy + 2, K); R.pset(fx + 1, fy, hex('#5a5a6a')); R.pset(fx + 4, fy + 1, K);
};
// un árbitro: el obrero con camisa blanca de rayas negras y gorra negra
const ARBI = hx({ C: '#f4f4f0', c: '#f4f4f0', F: '#1a1a20', W: '#f4f4f0', o: '#1a1a20', H: '#1a1a20', h: '#2a2a30' });

// la mano canónica (la de T.mano, 14 px) sin la manga recta, con su brazo en diagonal: sale del borde en (x0, y0) y llega
// al puño en (x1, y1), de 7 px que se estrechan a 5, con luz, sombra, dos pliegues y el puño; dir −1: los dedos a la izquierda
const MANO = ['.....kkkkkk...', '....kSSSSSSkk.', 'kkkkSSSSSSSSSk', 'MMMkSSSSSSSSSk', 'MMMkSSSSSSSssk', 'MMMkSSSSSSssk.', 'kkkkkSSSSskk..', '.....kkkkk....'];

  const M = hex(manga), ML = mezcla(M, BL, 0.35), MS = mezcla(M, K, 0.38), MSS = mezcla(M, K, 0.6), n = Math.ceil(Math.hypot(x1 - x0, y1 - y0)), ux = (x1 - x0) / n, uy = (y1 - y0) / n, nx = -uy, ny = ux;
  if (o.sombra !== false) for (let i = 0; i <= n; i++) { const w = 4 - 1.4 * i / n; for (let s = -w; s <= w; s += 0.5) { const px = Math.round(x0 + ux * i + nx * s + 3), py = Math.round(y0 + uy * i + ny * s + 6); R.pset(px, py, mezcla(R.pget(px, py), K, 0.3)); } }

    for (let s = -w; s <= w; s += 0.5) { const px = Math.round(cx + nx * s), py = Math.round(cy + ny * s), puno = i > n - 6 && i <= n - 3;
      R.pset(px, py, borde ? K : puno ? (s < 0 ? BL : BLS) : s < -w * 0.55 ? ML : s > w * 0.72 ? MSS : s > w * 0.3 ? MS : M); } }
  for (const u of [0.32, 0.58]) { const cx = x0 + (x1 - x0) * u, cy = y0 + (y1 - y0) * u; for (let s = -2.5; s <= 3; s += 0.5) { const b = Math.abs(s) * 0.7; R.pset(Math.round(cx + nx * s - ux * b), Math.round(cy + ny * s - uy * b), MSS); } }
  R.dibujo(MANO, Math.round(dir > 0 ? x1 - 1 : x1 - 13), Math.round(y1 - 4), dir, { k: K, S: hex('#f6c290'), s: hex('#d48a5a'), M: BL });
};
// el balón aplastado: T.balon con las volteretas «paradas» en el ángulo A y el largo Esc (0,62–1)
const balonEsc = (x, y, t, A, Esc, o = {}) => { const c = cl((Esc - 0.62) / 0.38, 0, 1), fase = Math.acos(c) - t * 3.4; T.balon(R, x, y, t, { ...o, volteretas: true, fase, ang: A - (t * 7.5 + fase) }); };
// un destello de cuatro puntas
const destello = (x, y, r, c = BL) => { for (let i = -r; i <= r; i++) { R.pset(x + i, y, c); R.pset(x, y + i, c); } R.pset(x - 1, y - 1, c); R.pset(x + 1, y + 1, c); R.pset(x + 1, y - 1, c); R.pset(x - 1, y + 1, c); };
// un balón de patada pequeño con su franja blanca y su número (no hay «K»: no hay letras)
const balonK = (x, y, t, n, o = {}) => { T.balon(R, x, y, t, { s: o.s ?? 1, ang: o.ang ?? 0 }); const s = o.s ?? 1;
  for (let j = -Math.round(3 * s); j <= Math.round(3 * s); j++) { R.pset(Math.round(x + 3 * s), y + j, BL); if (s > 1.5) R.pset(Math.round(x + 3 * s + 1), y + j, BLS); }

const P2 = en('patada', 0.311), P3 = en('contacto', 0.000), P4 = en('contacto', 0.469);
// ── 1 · el pase en el entreno
const LANZA = en('patada', 0.010), COGE = en('patada', 0.193);
const p1 = (t) => {

  // el pateador, en primer término, calienta a saltitos y mira el pase
  const px = 128, salt = t < LANZA - 0.2 ? Math.round(Math.abs(Math.sin(t * 5)) * 3) : 0;
  R.actor(EL.pateador, px, 176, t, { dir: 1, salto: salt, sorpresa: t > LANZA + 0.4 && t < COGE, sonrisa: t > COGE, dedo: t > COGE + 0.15 });
  const qx = 82, qs = 166, rx = Math.round(lerp(158, 232, ease(tramo(t, 0.2, LANZA + 0.9)))), rs = 162;
  const arma = t > LANZA - 0.45 && t < LANZA + 0.15;

  const corre = t > 0.2 && t < LANZA + 0.9;
  const rr = R.actor(EL.receptor, rx, rs - (t > COGE && t < COGE + 0.35 ? 3 : 0), t, { dir: corre ? 1 : -1, anda: corre, dedo: t > LANZA + 0.9 && t < COGE + 0.1, brazos: t > COGE + 0.35, sonrisa: t > COGE });
  // el balón: en la mano del quarterback, en el aire (espiral, con estela) y en las manos del receptor
  const u = tramo(t, LANZA, COGE), bx = 232 + 4, by = rs - 30;
  if (u <= 0) T.balon(R, qx + (arma ? 16 : 12), arma ? qs - 31 : qs - 12, t, { ang: arma ? -0.5 : 0 });
  else if (u < 1) { const ax = qx + 16, ay = qs - 31, x = lerp(ax, bx, u), y = lerp(ay, by, u) - Math.sin(Math.PI * u) * 46, ang = Math.atan2((by - ay) - Math.cos(Math.PI * u) * 46 * Math.PI, bx - ax);
    T.balon(R, Math.round(x), Math.round(y), t, { gira: 3, ang, estela: 0.7 }); }
  else T.balon(R, rr.cabeza[0] + (t > COGE + 0.35 ? 0 : 9), t > COGE + 0.35 ? rr.cabeza[1] - 6 : rs - 14, t, { ang: -0.3 });
};
// ── 2 · la patada en Las Vegas, con la cámara lenta del contacto
const SNAP = en('patada', 0.372), KICK = en('patada', 0.419), PASOS = en('patada', 0.516), TOCA = en('patada', 0.840);
const lento = (t) => (t < TOCA ? t : TOCA + (t - TOCA) * 0.1);

  arrodillado(EL.quarterback, 150, 145, ts, { dir: -1, pal: palH, habla: ts < snap - 0.3 && Math.sin(ts * 7) > 0.3, dedo: ts > snap - 0.15 && ts < sitio, sorpresa: ts > toca && ts < toca + 0.3 });

  if (swing > 0) { const fu = ts > toca ? Math.min(1, (ts - toca) * 5) : 0, fx = Math.round(lerp(lerp(kx - 3, 153, ease(swing)), kx + 22, fu)), fy = Math.round(lerp(lerp(145, 143, swing), 130, fu)); pierna(kx + 8, 140, fx, fy, F, (pal && pal.W) || hex('#1e8a8a')); }

  else { const d = ts - toca, bx = 156 + d * 150, by = 141 - d * 110 + d * d * 30; if (bx < 330) T.balon(R, Math.round(bx), Math.round(by), ts, { ang: -1.3 + d * 16, estela: 0.8 }); }
  if (linea) T.g_lineaPateo(R, ts, { empuje: tramo(ts, toca - 0.4, toca + 0.5) });

const p2 = (t) => {
  const ts = lento(t);

  jugada(t, ts, { toca: TOCA, pasos: PASOS, snap: SNAP, sitio: KICK + 0.25, linea: true });

    const e = tramo(t, TOCA + 0.1, TOCA + 0.45); if (e > 0) { const y = Math.round(lerp(100, 92, ease(e))); R.icono('reloj', 104, y - 13, BL, K, 2); R.numero('0.01', 172, y, { tam: 16, centro: true }); } }
};
// ── 3 · el inserto del aplastamiento, a ras de césped
const PIE = en('contacto', 0.115), APLASTA = en('contacto', 0.130), SALE = en('contacto', 0.249), SESENTA = en('contacto', 0.356);
const fondoInserto = () => fijo('insertoPatada', () => {

  for (let y = 0; y < 26; y++) for (let x = 0; x < 320; x++) R.pset(x, y, hh(x >> 1, y >> 1, 1) < 0.5 ? hex('#121828') : hex('#161e32'));

  for (const x of [64, 186]) { R.rect(x, 56, x + 14, 70, hex('#0a0e18')); R.rect(x, 56, x + 14, 56, hex('#3a4460')); R.rect(x + 3, 62, x + 11, 70, hex('#2a2418')); }
  for (let k = 0; k < 18; k++) { const x = Math.round(hh(k, 9, 4) * 300) + 10, y = 30 + Math.round(hh(k, 9, 5) * 38), r = 2 + Math.round(hh(k, 9, 6) * 4);

  // el muro acolchado y la banda de enfrente, desenfocada: banquillo, nevera, conos y gente
  R.rect(0, 76, 319, 85, hex('#146464')); for (let x = 0; x < 320; x += 22) R.rect(x, 76, x, 85, hex('#0e4a4a')); R.rect(0, 76, 319, 76, hex('#2aa8a8')); R.rect(0, 85, 319, 85, hex('#0a3434'));
  for (let y = 86; y < 98; y++) for (let x = 0; x < 320; x++) R.pset(x, y, hh(x, y, 5) < 0.5 ? hex('#3a6a32') : hex('#34622e'));
  for (let k = 0; k < 16; k++) { const x = 6 + k * 20 + Math.round(hh(k, 1, 6) * 8), c = hh(k, 2, 6) < 0.6 ? hex('#1e8a8a') : hex('#e8e4dc');

    const franja = Math.floor((x + (y - 98) * 1.8) / (40 + p * 40)) % 2, q = hh(x, y, 7);

  for (let y = 120; y < 180; y += 14) { const p = (y - 98) / 82, xc = Math.round(lerp(210, 250, p)); R.rect(xc, y, xc + Math.round(3 + p * 6), y + 1, hex('#e8ecdc')); }

// los linieros desenfocados de la línea, de espaldas: empujan cuando llega el pie
