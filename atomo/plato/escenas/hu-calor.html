<canvas id="lienzo"></canvas>
<script type="module">
// HU-CALOR (frases 6–7), sin año: el inserto de ciencia del mar caliente. Siete planos, cada uno con su cámara, su acción
// y vida de fondo:
// 1. el Atlántico tropical a mediodía (el decorado de la máquina de calor), con la boya y la lancha: el cielo en tres
//    términos (la fila de cúmulos lejanos sobre el horizonte, los de media altura y dos grandes cerca, cada fila a su
//    velocidad) y una bandada de fragatas; un pesquero con las perchas abiertas cruza en el término medio y un velero en
//    el horizonte; olas grandes con espuma en primer término; la calima fuerte que crece; a «warm ocean» el sol late y
//    suelta tres anillos de calor. La científica se seca la frente (saltan dos gotas de sudor) y se abanica con la
//    carpeta; su compañero bebe a morro (la botella se vacía), la pone boca abajo y solo cae la última gota (gag de la
//    botella), y suspira: la nubecilla del suspiro se aleja;
// 2. (corta en «when») el inserto de la boya, de cerca, con el mar desenfocado: el termómetro y el panel de cristal
//    líquido. En «heats» el panel pita dos veces (la luz de la antena, las ondas y el marco que brilla) y la cifra rueda de
//    «78°» a «79°»; en «80» pita largo, rueda a «80°» y parpadea mientras el líquido rojo llega a la marca. La gaviota se
//    posa encima, da un respingo con cada pitido y se asoma a la cifra; con el parpadeo se espanta y se va volando;
// 3. (corta en «The water») a ras de agua, otra cámara: el horizonte más alto y el sol a la izquierda; nubes en tres
//    términos a tres velocidades, fragatas, y en el horizonte un velero, un carguero con su humo, un pesquero y la boya.
//    La lancha navega despacio hacia la izquierda con su estela; su higrómetro (en un poste junto a la proa) sube de 64 %
//    a 99 % con el vapor; del agua sube el vapor en hebras, más fuerte a «fills», y a «invisible» se desvanece y solo
//    queda el temblor; una tortuga asoma, salta un pez volador y una gaviota pesca en picado en «so fast»; la científica
//    señala el agua a «evaporates»; el científico tantea el aire a «invisible» y no encuentra nada: «?»;
// 4. (corta en «The same») el baño de casa: el grifo echa vapor y el espejo se empaña de abajo arriba hasta «mirror»; la
//    mano canónica (con la manga del albornoz en plano hasta el borde derecho, y su sombrita en el cristal) entra y limpia una franja en la mitad derecha (se ve la puerta
//    reflejada), que se vuelve a empañar mientras el vapor sigue subiendo; el gato mira el chorro;
// 5. (corta en «and as it climbs») desde la popa de la lancha, cámara baja mirando arriba: la cubierta de teca, la regala,
//    los candeleros, el aro salvavidas, la nevera, el cabo, la caja de muestras y el fueraborda con su bandera; detrás,
//    la franja de mar con la boya y un carguero, las térmicas que suben y, en el centro, la torre que crece de cúmulo a
//    torre. En «climbs» sube del mar una burbuja de aire que en «cools» pasa de cálida a azul; en «drops of water» nacen
//    las gotas con sus chispas y empieza a llover; la gaviota del pasamanos se espanta; la científica señala y luego mira
//    con los prismáticos; el científico se hace visera;
// 6. (corta en «And here is the secret») dentro de la nube, de cerca: el fondo en nueve tonos, hondo y gris pizarra
//    abajo y en los lados, con volutas en tres capas que suben a tres velocidades (cada una con su filo de luz y su
//    sombra); la cortina de lluvia a lo lejos; cinco corrientes que trepan desde abajo con sus flechas y se tuercen hacia
//    el centro; racimos lejanos, medios y cercanos (los cercanos con la luz del claro); desde el principio, doce gotitas
//    que flotan y van en espiral hacia el centro y hebras de vapor que convergen donde nace la gota en «forms» (las
//    gotitas se funden en ella); en «gives back the heat» suelta una chispa con su anillo; en «the sun» se enciende el
//    camino de puntos desde el sol del claro (el claro, más a la izquierda, no llega a la zona de Atom); en «evaporating
//    it» nacen más gotas en cadena; pasa un vencejo por el claro;
// 7. (corta en «So») el plano más abierto y bajo: la torre enorme ocupa el cielo, que se oscurece a su alrededor; en
//    «warmer» se dispara hacia arriba con su yunque («rises faster»); en «pulls in» el mar entra en la base por tres
//    corrientes de galones, las nubes de los lados se acercan y el viento riza el mar; la lancha, pequeña abajo a la
//    izquierda: a la gorra roja del científico se la lleva el viento hacia la nube (gag) y él la persigue con los brazos
//    en alto mientras la científica se agarra a la consola; la boya a media distancia, un velero que huye, gaviotas que
//    escapan y, en el trueno, el relámpago que baja al mar.
import * as T from '/atomo/plato/escenas/hu-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
import { TOCADOS, P as PCH } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hu-calor');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);

const C = T.C;
const lin = (t, x, y) => Math.max(0, Math.min(1, (t - x) / (y - x)));
const entre = (t, x, y) => t >= x && t < y;
const suave = (u) => u * u * (3 - 2 * u);
const ruido = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const umbral = (x, y) => (B4[((y & 3) << 2) + (x & 3)] + 0.5) / 16;
// mezcla dos colores del lienzo (ABGR) y tiñe un píxel
const mezcla = (p, c, a) => { const r = p & 255, g = (p >> 8) & 255, b = (p >> 16) & 255; return (0xff000000 | (Math.round(b + (((c >> 16) & 255) - b) * a) << 16) | (Math.round(g + (((c >> 8) & 255) - g) * a) << 8) | Math.round(r + ((c & 255) - r) * a)) >>> 0; };
const tine = (x, y, c, a) => { x = Math.round(x); y = Math.round(y); if (x < 0 || x > 319 || y < 0 || y > 179) return; const B = R.buf, i = y * 320 + x; B[i] = mezcla(B[i], c, a); };
// la zona de Atom y la de la barra del año quedan como fondo tranquilo
const tranquilo = (x, y) => (x >= 274 && y <= 47) || (x <= 172 && y <= 15);
const destello = (x, y, r, c = C.blanco) => { for (let i = 0; i <= r; i++) { R.pset(x + i, y, c); R.pset(x - i, y, c); R.pset(x, y + i, c); R.pset(x, y - i, c); } };
// la calima: las filas de la caja tiemblan de lado, como el aire caliente que sube del mar
const FILA = new Uint32Array(320);
const calima = (x0, y0, x1, y1, t, a = 1, k = 0) => { const B = R.buf; for (let y = y0; y <= y1; y++) { const d = Math.round(Math.sin(y * 0.8 + t * 6 + k) * a * (0.55 + 0.45 * Math.sin(t * 1.7 + y * 0.21))); if (!d) continue; for (let x = x0; x <= x1; x++) FILA[x] = B[y * 320 + x]; for (let x = x0; x <= x1; x++) B[y * 320 + x] = FILA[Math.min(x1, Math.max(x0, x - d))]; } };
// el desenfoque del fondo de un inserto (caja de 3 × 3, n pasadas): da profundidad al objeto que va delante
const TMP = new Uint32Array(320 * 180);
const desenfoca = (n = 2, x0 = 0, y0 = 0, x1 = 319, y1 = 179) => {
  const B = R.buf;
  for (let p = 0; p < n; p++) for (const hor of [1, 0]) {
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const a = hor ? B[y * 320 + Math.max(x0, x - 1)] : B[Math.max(y0, y - 1) * 320 + x], m = B[y * 320 + x], b = hor ? B[y * 320 + Math.min(x1, x + 1)] : B[Math.min(y1, y + 1) * 320 + x];
      const r = ((a & 255) + 2 * (m & 255) + (b & 255)) >> 2, g = (((a >> 8) & 255) + 2 * ((m >> 8) & 255) + ((b >> 8) & 255)) >> 2, bb = (((a >> 16) & 255) + 2 * ((m >> 16) & 255) + ((b >> 16) & 255)) >> 2;
      TMP[y * 320 + x] = (0xff000000 | (bb << 16) | (g << 8) | r) >>> 0;
    }
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) B[y * 320 + x] = TMP[y * 320 + x];
  }
};
// el cuadro entero que tiembla (dx, dy px)
const sacude = (dx, dy) => { if (!dx && !dy) return; const B = R.buf; TMP.set(B); for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) B[y * 320 + x] = TMP[Math.min(179, Math.max(0, y - dy)) * 320 + Math.min(319, Math.max(0, x - dx))]; };
// la gaviota de cerca: de pie (x, y: entre las patas) o volando, con su contorno para que se lea sobre el cielo
const PAL_GAV = { k: C.k, W: hex('#f8f6f0'), w: hex('#d8dce4'), G: hex('#a8b0bc'), D: hex('#3a3e48'), Y: hex('#f0b030') };
const GAV_PIE = ['.......kkk..', '......kWWWk.', '......kWkWYY', '.....kWWWWk.', '.kkkkWWWWk..', 'kDGGGGWWWk..', '.kDGGGGwWk..', '..kkkkkkk...', '....Y..Y....', '....Y..Y....'];
const gaviotaPie = (x, y, dir = 1, salto = 0) => R.dibujo(GAV_PIE, Math.round(x - 6), Math.round(y - 10 - salto), dir, PAL_GAV);
const gaviotaVuela = (x, y, t, dir = 1) => {
  x = Math.round(x); y = Math.round(y); const al = Math.sin(t * 13) > 0 ? -1 : 1, P = [[-7, al * 3 - 1], [-3, -1], [0, 0], [3, -1], [7, al * 3 - 1]];
  for (let i = 1; i < P.length; i++) { R.linea(x + P[i - 1][0], y + P[i - 1][1] + 1, x + P[i][0], y + P[i][1] + 1, C.k); R.linea(x + P[i - 1][0], y + P[i - 1][1] - 1, x + P[i][0], y + P[i][1] - 1, C.k); }
  for (let i = 1; i < P.length; i++) R.linea(x + P[i - 1][0], y + P[i - 1][1], x + P[i][0], y + P[i][1], i === 1 || i === 4 ? PAL_GAV.G : PAL_GAV.W);
  R.pset(x - 7, y + al * 3 - 1, PAL_GAV.D); R.pset(x + 7, y + al * 3 - 1, PAL_GAV.D);
  R.rect(x - 2, y, x + 2, y + 2, C.k); R.rect(x - 1, y + 1, x + 1, y + 1, PAL_GAV.W); R.pset(x + dir * 3, y + 1, PAL_GAV.Y);
};

const a = (f) => en('oceano', f), b = (f) => en('secreto', f);
// los cortes: «when», «The water», «The same», «and (as it climbs)», «And (here is the secret)», «So»
const P2 = a(0.171), P3 = a(0.519), P4 = a(0.846), P5 = b(0.129), P6 = b(0.382), P7 = b(0.710);
const PICA = a(0.585);   // la gaviota entra en el agua (plano 3)
const calido = a(0.091), calienta = a(0.302), sobre = a(0.373), ochenta = a(0.394), evapora = a(0.544), llena = a(0.713), invisible = a(0.754), vaporT = a(0.783), empana = a(0.901), espejo = a(0.961);
const sube = b(0.076), trepa = b(0.154), enfria = b(0.180), vuelve = b(0.255), gotasT = b(0.307), gotaT = b(0.483), forma = b(0.515), devuelve = b(0.537), solT = b(0.612), evaporar = b(0.638), caliente = b(0.743), deprisa = b(0.815), aspiraT = b(0.873), masAire = b(0.926);
// la gorra roja del científico (el kit no la tiene en rojo: la misma gorra con su color)
TOCADOS.gorraRoja = [['...kkkkkkkk....', '..kXXXXXXXXk...', '.kXXXXXwXXXXk..', '.kkkkkkkkkkkkkk', '..........kkkk.'], -2];
const PALG = { X: hex('#d8463a'), w: hex('#f6f2ea') };
const gorra = (x, y, dir) => R.dibujo(TOCADOS.gorraRoja[0], Math.round(x), Math.round(y), dir, { ...PCH, ...EL.pronosticador.pal, ...PALG });
// la cubierta de la lancha: los dos científicos, de cara a la boya
const XA = 220, XB = 238;
// la botella de agua (de pie o inclinada al beber)
const botella = (x, y, bebe) => { if (bebe) { for (let i = 0; i < 7; i++) { R.rect(x + i, y + Math.round(i * 0.7) - 1, x + i, y + Math.round(i * 0.7) + 2, C.k); } for (let i = 1; i < 6; i++) { R.pset(x + i, y + Math.round(i * 0.7), hex('#bfe6fb')); R.pset(x + i, y + Math.round(i * 0.7) + 1, hex('#5aa8e8')); } R.pset(x + 6, y + 4, hex('#2a6ad0')); } else { R.rect(x, y, x + 3, y + 8, C.k); R.rect(x + 1, y + 2, x + 2, y + 7, hex('#7ac0f0')); R.rect(x + 1, y + 1, x + 2, y + 1, hex('#2a6ad0')); R.pset(x + 1, y + 3, C.blanco); R.pset(x + 1, y + 4, hex('#bfe6fb')); } };
// los prismáticos delante de los ojos (dir: hacia dónde mira)
const prismaticos = (x, y, dir) => { const X = dir > 0 ? x + 9 : x - 1; R.rect(X, y, X + 6, y + 3, C.k); R.pset(dir > 0 ? X + 6 : X, y + 1, hex('#8ac8f0')); R.pset(dir > 0 ? X + 6 : X, y + 2, hex('#4a8ac0')); R.pset(X + 3, y + 1, hex('#5a5e6a')); };

// ── lo común de los planos de fuera (cielos, nubes, barcos, pájaros, olas y la torre de nubes) ─────────────────────────
const CIELO = ['#2264be', '#2a72c8', '#3482d2', '#4294da', '#52a4e0', '#66b4e6', '#7ec2ea', '#98d0ee', '#b4dcef', '#cee6ec', '#e2ece6'].map(hex);
const MARP = ['#a2dce0', '#5ab8cc', '#38a2c2', '#2a94ba', '#2286b0', '#1c78a4', '#176a98', '#135e8a'].map(hex);
const NUBE3 = [hex('#9fb4cc'), hex('#d8e4f0'), hex('#ffffff')], NUBE3L = [hex('#b4cce0'), hex('#dce8f2'), hex('#f4f8fc')], NUBE3G = [hex('#7c8aa6'), hex('#a8b6cc'), hex('#d0dae6')];
// un disco que no pisa la zona de Atom ni la barra del año
const discoT = (cx, cy, r, c) => { cx = Math.round(cx); cy = Math.round(cy); r = Math.max(1, Math.round(r)); for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r - y * y) + 0.3); for (let x = -w; x <= w; x++) if (!tranquilo(cx + x, cy + y)) R.pset(cx + x, cy + y, c); } };
// cúmulo de tres tonos (sombra abajo, cuerpo, luz arriba a la derecha) con la base plana; las bolas hierven con t
let luzX = 1;   // de qué lado les da el sol a las nubes (1: por la derecha; −1: por la izquierda)
const cumulo = (cx, cy, w, sem, c, t = 0) => {
  const n = 3 + Math.round(w / 12), B = [];
  for (let i = 0; i < n; i++) { const u = (i + 0.5) / n - 0.5, r = w * (0.16 + 0.15 * Math.cos(u * Math.PI) + 0.07 * ruido(i, sem, 534)) + 0.4 * Math.sin(t * 0.8 + i * 1.9 + sem); B.push([cx + u * w * 0.86, cy - r * 0.5 + (ruido(i, sem, 535) - 0.5) * w * 0.08, r]); }
  for (const [x, y, r] of B) discoT(x, y + 1, r, c[0]);
  for (const [x, y, r] of B) discoT(x, y, r - 0.4, c[1]);
  for (const [x, y, r] of B) if (r > 2) discoT(x + luzX, y - 1.5, r * 0.62, c[2]);
  for (const [x, y, r] of B) if (r > 4) { const lx = Math.round(x + luzX * r * 0.45), ly = Math.round(y - r * 0.55); if (!tranquilo(lx, ly)) R.pset(lx, ly, C.blanco); }
  for (let x = Math.round(cx - w * 0.42); x <= Math.round(cx + w * 0.42); x++) if (!tranquilo(x, Math.round(cy + 1))) R.pset(x, Math.round(cy + 1), c[0]);
};
// una capa de cúmulos que deriva a su velocidad (px/s) y vuelve a entrar por el otro lado: L = [[x, y, ancho, semilla]]
const capaNubes = (t, L, vel, c) => { for (const [x0, y, w, s] of L) { const S = 320 + w * 2, x = (((x0 + w + t * vel) % S) + S) % S - w; cumulo(x, y, w, s, c, t); } };
// el cielo tramado de arriba abajo (luz: lo que aclara cada punto) y el mar en bandas tramadas con el mar de fondo que
// viene hacia nosotros (un solo recorrido por píxel)
const cieloMar = (H, t, luz, sx, oscuro = 0) => {
  const BF = R.buf, nc = CIELO.length - 1, nm = MARP.length - 1, CL = hex('#a6e6ee'), V = hex('#0f5878'), GRIS = hex('#5a6a86');
  for (let y = 0; y < H; y++) for (let x = 0; x < 320; x++) { let f = Math.pow(y / H, 1.25) * nc + (luz ? luz(x, y) : 0); f = f < 0 ? 0 : f > nc ? nc : f; const l = Math.floor(f) + (f - Math.floor(f) > umbral(x, y) ? 1 : 0); let c = CIELO[l > nc ? nc : l]; if (oscuro) { const o = oscuro(x, y); if (o > 0) c = mezcla(c, GRIS, Math.min(0.7, o * (0.75 + umbral(x, y) * 0.5))); } BF[y * 320 + x] = c; }
  for (let y = H; y < 180; y++) { const g = (y - H) / (180 - H), z = 1 / (g + 0.07), o = y * 320;
    for (let x = 0; x < 320; x++) { let f = Math.pow(g, 0.75) * nm; const d = 1 - Math.abs(x - sx) / (40 + (y - H) * 1.2); if (d > 0) f -= d * 1.1; f = f < 0 ? 0 : f > nm ? nm : f; const l = Math.floor(f) + (f - Math.floor(f) > umbral(x, y) ? 1 : 0); let c = MARP[l > nm ? nm : l];
      const s = Math.sin(z * 2.3 + t * 1.2 + x * 0.011 + Math.sin(x * 0.027 + z * 0.7) * 0.9); if (s > 0.5) { if (umbral(x, y) < (s - 0.5) * 1.5) c = mezcla(c, CL, 0.2); } else if (s < -0.55 && umbral(x, y) < (-s - 0.55) * 1.6) c = mezcla(c, V, 0.24);
      if (oscuro) { const q = oscuro(x, H - 1) * 0.6; if (q > 0) c = mezcla(c, GRIS, Math.min(0.4, q * 0.5)); }
      BF[o + x] = c; } }
  for (let x = 0; x < 320; x++) { tine(x, H, hex('#e4f4f2'), 0.5); if (x & 1) tine(x, H + 1, hex('#e4f4f2'), 0.3); }
};
// el sol con sus rayos que giran y el camino de destellos en el mar
const solMar = (sx, sy, H, t) => {
  for (let k = 0; k < 12; k++) { const an = k * Math.PI / 6 + t * 0.12, l = 15 + (k % 2) * 6 + Math.sin(t * 1.7 + k) * 1.5; for (let r = 12; r < l; r++) { const x = Math.round(sx + Math.cos(an) * r), y = Math.round(sy + Math.sin(an) * r); if (!tranquilo(x, y) && umbral(x, y) < 0.8 - (r - 12) / (l - 12) * 0.6) R.pset(x, y, hex('#fff0b8')); } }
  discoT(sx, sy, 10, hex('#ffe28a')); discoT(sx, sy, 9, hex('#fff4c8')); discoT(sx - 2, sy - 2, 5, C.blanco);
  for (let y = H + 1; y < 180; y += 2) { const f = (y - H) / (180 - H), w = 2 + f * 24; for (let k = 0; k < 2 + f * 6; k++) { const x = Math.round(sx + (ruido(k, y, Math.floor(t * 4)) - 0.5) * 2 * w); if (ruido(k, y, Math.floor(t * 6) + 9) < 0.55) { R.pset(x, y, hex('#fffbe8')); if (f > 0.35) R.pset(x + 1, y, hex('#a6e6ee')); } } }
};
// las crestas en perspectiva entre el horizonte H y y1 (lejos rayitas; cerca, olas con su labio y su espuma)
const crestasMar = (t, H, y1, filas = 16) => {
  const L = hex('#a6e6ee'), CR = hex('#62c8da'), V = hex('#0f5878'), VS = hex('#0c4a68');
  for (let r = 0; r < filas; r++) { const f = (r + 1) / filas, y0 = H + 2 + (y1 - H - 3) * f ** 1.6, paso = 7 + 38 * f, vel = 1 + 6 * f;
    for (let k = -1; k < 340 / paso + 1; k++) { const a = ruido(k, r, 541), b = ruido(k, r, 542); if (a < 0.36 + 0.1 * (1 - f)) continue;
      const xx = Math.round(k * paso + (b - 0.5) * paso * 0.9 + ((t * vel + r * 17) % paso)) - paso, yy = Math.round(y0 + (b - 0.5) * 6 * f + Math.sin(t * 1.3 + k * 1.7 + r) * (f > 0.4 ? 1 : 0)), w = Math.round((2 + 16 * f) * (0.35 + a * 0.95)), alto = Math.round(f * 2.6 * a);
      if (f < 0.3) { R.rect(xx, yy, xx + w, yy, ruido(k, r, 544) < 0.5 ? CR : L); continue; }
      for (let i = 0; i <= w; i++) { const p = i / w, s = p < 0.35 ? Math.sin(p / 0.35 * Math.PI / 2) : Math.cos((p - 0.35) / 0.65 * Math.PI / 2), yc = yy - Math.round(s * alto); R.pset(xx + i, yc, p < 0.5 ? L : CR); R.pset(xx + i, yc + 1, f > 0.6 ? VS : V); }
