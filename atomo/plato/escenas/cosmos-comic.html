<!doctype html>
<html lang="es">
<head>

<title>De ti a la galaxia · cómic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

<body>
<canvas id="c"></canvas>
<script type="module">
// De ti a la Vía Láctea · cómic (a partir de estilos/12-comic.html y de prueba-comic.html).
// Página impresa con dos viñetas: la grande cuenta el viaje y una estrecha a la derecha lleva la
// regla de potencias de diez. Tinta gruesa, tramas Ben-Day, planchas fuera de registro y papel.
// [tu] Atom señala a la persona con un electrón. [arriba] Atom sube, la persona mira arriba y
// señala; la regla se desliza y enseña las potencias positivas. [siete]→[tierra] siete saltos ×10
// hacia fuera: cada plano se encoge hasta quedar como una viñeta incrustada en el siguiente
// (persona → casa y calle → manzanas → barrio → ciudad → costa → continente → la Tierra), con
// líneas cinéticas y un golpe en cada llegada. [dos]→[sol] la Tierra se encoge, pasa la Luna y
// entra el Sol, enorme. [doce]→[galaxia] doce saltos cada vez más seguidos (órbitas, nube de
// cometas, estrellas vecinas, campo de estrellas), con las viñetas de cada salto metidas unas en
// otras; llegada con viñeta de impacto. [lactea] una flecha marca dónde estamos. Después todo se
// asienta y queda quieto.
// Los planos de la Tierra son dibujos vectoriales con su propia transformación: al ampliarse se
// redibujan nítidos y, al encogerse, se usan rasterizados. La costa, el continente y el globo
// salen de los mismos contornos (latitud y longitud) con un detalle fractal determinista.
import { escena } from '/atomo/plato/escena.js';

const E = await escena('cosmos-comic', 'cosmos');
const M = (k) => E.marca(k);
const DUR = E.duracion;
const W = 1920, H = 1080, TAU = Math.PI * 2, PI = Math.PI;
const cv = document.getElementById('c');
// Lienzos en memoria de CPU: en el servidor sin GPU, miles de puntos de trama por fotograma van
// mucho más rápido así que en el lienzo acelerado (que aquí emula la GPU por software).
const CTX2D = { willReadFrequently: true };
const ctx = cv.getContext('2d', CTX2D);
let S = 1, OX = 0, OY = 0, builtS = 0;

// Paleta de imprenta (la del demo) y tintas de esta historia.
const C = {
  paper: '#f1e5c9', white: '#fffaee', ink: '#17151b',
  yellow: '#f6cd2a', yellowL: '#fbe48c', orange: '#ef8f2c', red: '#de3a2e', redDk: '#9e1f2c',
  magenta: '#d8337f', cyan: '#1ea2d6', cyanL: '#9fd8ef', cyanP: '#cdebf5', blue: '#2b55a6',
  navy: '#1c2654', navyDk: '#0f1534', space: '#141b40',
  skin: '#f6c49b', skinL: '#fbdcc0', skinDk: '#e0754e', hair: '#8a4a22', hairDk: '#43200c', hairL: '#d48a45',
  wood: '#c97f38', woodDk: '#7d4519', stone: '#e7d3a8', stoneDk: '#b8915a',
  green: '#6fb043', greenL: '#b5d97a', greenDk: '#2f6a35', olive: '#9a9a3c',
  sand: '#f3d98e', roof: '#d9643a', roofL: '#ee9a62', grey: '#c9c4bb', greyDk: '#7d7a86',
  asphalt: '#5d6478', asphaltDk: '#363c52', sea: '#2f6fc0', seaDk: '#1d3f8a', ice: '#f4f7fb',
  moon: '#e6dfcc', moonDk: '#8f8a7a', sun: '#ffd23a',
};
const FT = "'Bangers', Impact, sans-serif";
const FM = "'Comic Neue', 'Comic Sans MS', sans-serif";      // la «m» (Bangers solo tiene mayúsculas)
const MIS = { x: 2.4, y: 1.6 };            // fuera de registro de las planchas de color

// ---------- página ----------
const PP = { x0: 40, y0: 40, x1: 1652, y1: 1040 };   // viñeta grande
const PR = { x0: 1676, y0: 40, x1: 1880, y1: 1040 }; // viñeta de la regla (estrecha)
const PC = { x: (PP.x0 + PP.x1) / 2, y: (PP.y0 + PP.y1) / 2 };
const PWd = PP.x1 - PP.x0, PHt = PP.y1 - PP.y0;

// ---------- tiempos (todo sale de las marcas) ----------
const T = {
  tu: M('tu'), tuF: M('tu_fin'), arriba: M('arriba'), arribaF: M('arriba_fin'),
  siete: M('siete'), desap: M('desaparecido'), tierra: M('tierra'), dos: M('dos'), sol: M('sol'),
  doce: M('doce'), galaxia: M('galaxia'), galaxiaF: M('galaxia_fin'), lactea: M('lactea'), lacteaF: M('lactea_fin'),
};
T.quieto = DUR - 0.6;                                 // a partir de aquí, nada se mueve
T.calma0 = T.quieto - 0.85;
// Los 21 saltos ×10. El salto j lleva del plano j al j+1.
//   1–7:  de [siete] a [tierra], repartidos por igual.
//   8–9:  empiezan un poco antes de [dos] y acaban en [sol].
//   10–21: empiezan un poco antes de [doce] y acaban en [galaxia], cada uno más corto que el anterior.
const SALTOS = [];
{
  const d = (T.tierra - T.siete) / 7;
  for (let j = 0; j < 7; j++) SALTOS.push({ t0: T.siete + j * d, t1: T.siete + (j + 1) * d });
  const a = T.dos - 0.2, d2 = (T.sol - a) / 2;
  for (let j = 0; j < 2; j++) SALTOS.push({ t0: a + j * d2, t1: a + (j + 1) * d2 });
  const b0 = T.doce - 0.15, r = 0.84, n = 12, d0 = (T.galaxia - b0) * (1 - r) / (1 - Math.pow(r, n));
  let t = b0;
  for (let j = 0; j < n; j++) { const dj = d0 * Math.pow(r, j); SALTOS.push({ t0: t, t1: j === n - 1 ? T.galaxia : t + dj }); t += dj; }
  // tras estos saltos la cámara descansa (y la viñeta incrustada se funde con el plano nuevo)
  for (const j of [6, 8, 20]) SALTOS[j].descanso = true;
}
// ---------- utilidades ----------
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hsh(a, b) { let h = Math.imul((a | 0) + 0x9e3779b9 | 0, 0x85ebca6b) ^ Math.imul((b | 0) + 0x7f4a7c15 | 0, 0xc2b2ae35); h = Math.imul(h ^ h >>> 15, 0x2c1b3c6d); h = Math.imul(h ^ h >>> 12, 0x297a2d39); h ^= h >>> 15; return (h >>> 0) / 4294967296; }
const cl = (x) => x < 0 ? 0 : x > 1 ? 1 : x;
const seg = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, u) => a + (b - a) * u;
const eio = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eout = (x) => 1 - Math.pow(1 - x, 3);
const ein = (x) => x * x * x;
const eback = (x, s = 1.70158) => { const c3 = s + 1; return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
const einb = (x, s = 0.6) => (s + 1) * x * x * x - s * x * x;       // anticipación y arranque
const sstep = (a, b, x) => { const u = cl((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const muelle = (tau, w = 16, k = 7) => tau < 0 ? 0 : Math.sin(tau * w) * Math.exp(-tau * k);
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
// Reloj que frena hasta pararse al final (todo lo que se mueve «solo» va con él).
function calma(t) { const a = T.calma0, b = T.quieto; if (t <= a) return t; const u = Math.min(1, (t - a) / (b - a)); return a + (b - a) * (u - u * u / 2); }

// Vista: escala (px de pantalla por unidad del nivel) y caja visible en unidades del nivel.
const VISTA0 = { s: 1, x0: -1e4, y0: -1e4, x1: 1e4, y1: 1e4 };
// Trama: puntos sobre una rejilla girada, recortada a lo visible. Si los puntos quedan por
// debajo de ~3 px en pantalla, la rejilla se hace más gruesa conservando la cobertura.
function dots(g, V, x0, y0, x1, y1, sp, ang, rf) {
  x0 = Math.max(x0, V.x0); y0 = Math.max(y0, V.y0); x1 = Math.min(x1, V.x1); y1 = Math.min(y1, V.y1);
  if (x1 <= x0 || y1 <= y0) return;
  const px = sp * V.s * S, k = px < 3.2 ? Math.ceil(3.2 / px) : 1, s2 = sp * k, rmin = 0.3 / (V.s * S);
  const c = Math.cos(ang), s = Math.sin(ang);
  let umin = Infinity, umax = -Infinity, vmin = Infinity, vmax = -Infinity;
  for (const [x, y] of [[x0, y0], [x1, y0], [x0, y1], [x1, y1]]) {
    const u = x * c + y * s, v = -x * s + y * c;
    umin = Math.min(umin, u); umax = Math.max(umax, u); vmin = Math.min(vmin, v); vmax = Math.max(vmax, v);
  }
  g.beginPath();
  for (let j = Math.floor(vmin / s2) - 1; j <= Math.ceil(vmax / s2) + 1; j++) {
    const v = j * s2;
    for (let i = Math.floor(umin / s2) - 1; i <= Math.ceil(umax / s2) + 1; i++) {
      const u = i * s2, x = u * c - v * s, y = u * s + v * c;
      if (x < x0 - s2 || x > x1 + s2 || y < y0 - s2 || y > y1 + s2) continue;
      const r = rf(x, y) * k;
      if (r < rmin) continue;
      g.moveTo(x + r, y); g.arc(x, y, r, 0, TAU);
    }
  }
  g.fill();
}
// Gradiente lineal de radio de punto: 0 en A, rmax en B.
const lin = (ax, ay, bx, by, rmax, pw = 1) => { const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy; return (x, y) => rmax * Math.pow(cl(((x - ax) * dx + (y - ay) * dy) / L2), pw); };

// Trazo de pincel: cinta de anchura variable a lo largo de una polilínea.
function ribbon(g, P, wf) {
  const n = P.length, L = [], R = [];
  for (let i = 0; i < n; i++) {
    const a = P[Math.max(0, i - 1)], b = P[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const w = wf(n > 1 ? i / (n - 1) : 0, P[i]);
    L.push([P[i][0] - dy * w, P[i][1] + dx * w]); R.push([P[i][0] + dy * w, P[i][1] - dx * w]);
  }
  g.beginPath(); g.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < n; i++) g.lineTo(L[i][0], L[i][1]);
  for (let i = n - 1; i >= 0; i--) g.lineTo(R[i][0], R[i][1]);
  g.closePath(); g.fill();
}
function ellPts(x, y, a, b, phi, th0, th1, n) {
  const c = Math.cos(phi), s = Math.sin(phi), P = [];
  for (let i = 0; i <= n; i++) { const th = th0 + (th1 - th0) * i / n, u = a * Math.cos(th), v = b * Math.sin(th); P.push([x + u * c - v * s, y + u * s + v * c, th]); }
  return P;
}
function quadPts(x0, y0, x1, y1, x2, y2, n = 16) {
  const P = [];
  for (let i = 0; i <= n; i++) { const u = i / n, a = (1 - u) * (1 - u), b = 2 * u * (1 - u), c = u * u; P.push([a * x0 + b * x1 + c * x2, a * y0 + b * y1 + c * y2]); }
  return P;
}
function poly(g, pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); }
function rectP(r) { const p = new Path2D(); p.rect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0); return p; }
// Pieza de cómic: color plano, trama de sombra recortada y tinta.
function pieza(g, V, path, base, bb, sombra, lw = 5) {
  if (base) { g.fillStyle = base; g.fill(path); }
  if (sombra) {
    g.save(); g.clip(path);
    for (const s of sombra) { g.fillStyle = s.col; g.globalAlpha = s.a ?? 1; dots(g, V, bb[0], bb[1], bb[2], bb[3], s.sp, s.ang ?? PI / 4, s.rf); }
    g.restore();
  }
  if (lw) { g.lineWidth = lw; g.strokeStyle = C.ink; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke(path); }
}
function trazo(g, pts, w, col = C.ink) { g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.stroke(); }
// Sprite pre-renderizado a la resolución del dispositivo.
function sprite(x0, y0, w, h, draw, q = 1) {
  const k = Math.min(S * q, 3), c = mk(w * k, h * k), g = c.getContext('2d', CTX2D);
  g.setTransform(k, 0, 0, k, -x0 * k, -y0 * k); draw(g);
  return { c, x0, y0, w, h };
}
function blit(g, sp, x, y, sc = 1) { g.drawImage(sp.c, x + sp.x0 * sc, y + sp.y0 * sc, sp.w * sc, sp.h * sc); }

// Esfera de cómic (del demo): color plano, trama de sombra, negro macizo y brillo duro.
const LIGHT = (() => { const v = [-0.52, -0.62, 0.59], n = Math.hypot(...v); return v.map((a) => a / n); })();
function sphere(g, x, y, r, base, sp) {
  const disk = new Path2D(); disk.arc(x, y, r, 0, TAU);
  g.save(); g.translate(MIS.x * 0.6, MIS.y * 0.6);
  g.fillStyle = base; g.fill(disk);
  g.save(); g.clip(disk); g.fillStyle = C.ink; g.globalAlpha = 0.85;
  dots(g, VISTA0, x - r, y - r, x + r, y + r, sp, PI / 4, (px, py) => {
    const dx = (px - x) / r, dy = (py - y) / r, nz = Math.sqrt(Math.max(0, 1 - dx * dx - dy * dy));
    const l = dx * LIGHT[0] + dy * LIGHT[1] + nz * LIGHT[2];
    return sp * 0.6 * Math.pow(cl((0.7 - l) / 0.75), 1.1);
  });
  g.restore(); g.restore();
  g.save(); g.clip(disk);
  g.beginPath(); g.rect(x - r - 4, y - r - 4, 2 * r + 8, 2 * r + 8); g.arc(x - 0.17 * r, y - 0.22 * r, r * 1.05, 0, TAU);
  g.fillStyle = C.ink; g.fill('evenodd');
  g.restore();
  g.save(); g.translate(x - 0.36 * r, y - 0.4 * r); g.rotate(-0.7);
  g.beginPath(); g.ellipse(0, 0, 0.25 * r, 0.12 * r, 0, 0, TAU); g.fillStyle = C.white; g.fill();
  g.restore();
  g.beginPath(); g.arc(x + 0.38 * r, y - 0.47 * r, 0.06 * r, 0, TAU); g.fillStyle = C.white; g.fill();
  g.lineWidth = Math.max(2.4, r * 0.1); g.strokeStyle = C.ink; g.stroke(disk);
}
// Estrella de impacto (polígono dentado) en coordenadas unitarias.
const estrella = (seed, n, kin) => { const r = rng(seed), P = []; for (let i = 0; i < n; i++) { const a = i / n * TAU + (r() - 0.5) * 0.1; const k = i % 2 ? kin + r() * 0.08 : 1 + r() * 0.28; P.push([Math.cos(a) * k, Math.sin(a) * k]); } return P; };
const STAR_A = estrella(4, 26, 0.62), STAR_B = estrella(9, 18, 0.55), STAR_C = estrella(21, 22, 0.66);
function impacto(g, V, x, y, rx, ry, P, fondo, trama) {
  if (rx <= 1) return;
  const Q = P.map(([a, b]) => [x + a * rx, y + b * ry]);
  poly(g, Q); g.fillStyle = fondo; g.fill();
  if (trama) { g.save(); g.clip(); g.fillStyle = trama; dots(g, V, x - rx * 1.4, y - ry * 1.4, x + rx * 1.4, y + ry * 1.4, 12, PI / 4, (xx, yy) => 4.8 * cl((Math.hypot((xx - x) / rx, (yy - y) / ry) - 0.5) / 0.6)); g.restore(); }
  poly(g, Q); g.lineJoin = 'miter'; g.miterLimit = 6; g.lineWidth = 5; g.strokeStyle = C.ink; g.stroke();
}
// Número con potencia de diez dibujado a mano (sin depender de los superíndices de la fuente).
// Devuelve el ancho. al = 'left' | 'center'.
function potencia(g, x, y, exp, size, conM, col, al = 'left', borde = 0) {
  g.save(); g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  const fb = `${size}px ${FT}`, fe = `${Math.round(size * 0.6)}px ${FT}`, fm = `italic 700 ${Math.round(size * 0.92)}px ${FM}`;
  g.font = fb; const w10 = g.measureText('10').width;
  g.font = fe; const sE = String(Math.abs(exp)), wE = g.measureText(sE).width;
  const wMin = exp < 0 ? size * 0.34 : 0, gap = size * 0.04;
  g.font = fm; const gapM = size * 0.16, wM = conM ? gapM + g.measureText('m').width : 0;
  const total = w10 + gap + wMin + wE + wM;
  let xx = al === 'center' ? x - total / 2 : x;
  const piezas = [];
  piezas.push(['10', fb, xx, y]); xx += w10 + gap;
  const ye = y - size * 0.42;
  if (exp < 0) { piezas.push(['-', null, xx, ye]); xx += wMin; }
  piezas.push([sE, fe, xx, ye]); xx += wE;
  if (conM) piezas.push(['m', fm, xx + gapM, y]);
  for (const pass of borde ? [0, 1] : [1]) {
    for (const [s, f, px, py] of piezas) {
      if (f === null) {   // signo menos: barra inclinada como el resto de la letra
        g.save(); g.translate(px + wMin * 0.5, py - size * 0.2); g.transform(1, 0, -0.18, 1, 0, 0);
        g.beginPath(); g.rect(-wMin * 0.42, -size * 0.06, wMin * 0.84, size * 0.12);
        if (pass === 0) { g.lineWidth = borde; g.strokeStyle = C.ink; g.lineJoin = 'round'; g.stroke(); } else { g.fillStyle = col; g.fill(); }
        g.restore(); continue;
      }
      g.font = f;
      if (pass === 0) { g.lineWidth = borde; g.strokeStyle = C.ink; g.lineJoin = 'round'; g.strokeText(s, px, py); } else { g.fillStyle = col; g.fillText(s, px, py); }
    }
  }
  g.restore();
  return total;
}
// A = { x, y, sc, en, mano (0..1), manoAng, vel (multiplicador de estelas) }
function atomo(g, t, A) {
  const sc = A.sc * (1 + 0.05 * A.en), a = 330 * sc, b = 104 * sc;
  const wk = Math.pow(A.sc, 0.55), mis = Math.max(0.45, wk);
  const fase = FASE(t);
  const els = ORB.map((o, i) => ({ o, i, th: o.th0 + TAU * o.dir * o.k * fase }));
  const orbitHalf = (o, front) => {
    const P = ellPts(A.x, A.y, a, b, o.phi, front ? -0.03 : PI - 0.03, front ? PI + 0.03 : TAU + 0.03, 60);
    const wf = (u, p) => wk * (1.6 + 3.4 * Math.pow((1 + Math.sin(p[2])) / 2, 1.5));
    // sobre fondos oscuros, un filo blanco para que se lea
    if (A.osc > 0.01) { g.save(); g.globalAlpha = A.osc; g.fillStyle = C.white; ribbon(g, P, (u, p) => wf(u, p) + 3.2); g.restore(); }
    g.save(); g.translate(MIS.x * mis, MIS.y * mis); g.fillStyle = C.cyan; ribbon(g, P, (u, p) => wf(u, p) + 1.5 * mis); g.restore();
    g.fillStyle = C.ink; ribbon(g, P, wf);
  };
  const posOrb = (e) => {
    const o = e.o, c = Math.cos(o.phi), s = Math.sin(o.phi), u = a * Math.cos(e.th), v = b * Math.sin(e.th);
    return [A.x + u * c - v * s, A.y + u * s + v * c];
  };
  const er = 23 * Math.pow(A.sc, 0.8) / 24;                // escala del sprite del electrón
  const electron = (e) => {
    const o = e.o, dir = o.dir;
    let [x, y] = posOrb(e);
    let es = er * (1 + 0.12 * Math.sin(e.th));
    const m = e.i === 2 ? A.mano : 0;
    if (m > 0.001) {
      // el electrón sale de su órbita y hace de mano: brazo de tinta, se balancea con líneas de movimiento
      const R = a * (A.alcance ?? 1.02), ang = A.manoAng;
      const hx = A.x + Math.cos(ang) * R, hy = A.y + Math.sin(ang) * R;
      x = lerp(x, hx, m); y = lerp(y, hy, m);
      const arm = [], u0 = 0.3; for (let i = 0; i <= 12; i++) { const u = u0 + (1 - u0) * i / 12; arm.push([lerp(A.x, x, u) - Math.sin(u * PI) * 10 * wk * Math.sin(ang), lerp(A.y, y, u) + Math.sin(u * PI) * 10 * wk * Math.cos(ang)]); }
      g.save(); g.globalAlpha = cl(m * 1.5);
      g.fillStyle = C.ink; ribbon(g, arm, (u) => wk * (6.5 - 2.5 * u));
      g.fillStyle = C.cyan; ribbon(g, arm.slice(2), (u) => wk * (2.6 - 1.2 * u));
      g.restore();

// Geografía: contornos en latitud y longitud, proyección del globo y detalle fractal
// =====================================================================================
// Las coordenadas «g» son las del plano 7 (el globo de radio 262,5 px centrado en PC). El plano k
// (3 ≤ k ≤ 6) es el mismo dibujo ampliado 10^(7−k) alrededor de su centro: así la costa, el
// continente y el globo coinciden en todos los saltos.
const RAD = PI / 180, GLOBO = { lat0: 22, lon0: -5, R: 262.5 };
function geoG(lat, lon) {
  const f = lat * RAD, l = (lon - GLOBO.lon0) * RAD, f0 = GLOBO.lat0 * RAD;
  const cosc = Math.sin(f0) * Math.sin(f) + Math.cos(f0) * Math.cos(f) * Math.cos(l);
  let x = Math.cos(f) * Math.sin(l), y = Math.cos(f0) * Math.sin(f) - Math.sin(f0) * Math.cos(f) * Math.cos(l);
  if (cosc < 0) { const n = Math.hypot(x, y) || 1; x /= n; y /= n; }     // detrás del globo: al borde
  return [PC.x + GLOBO.R * x, PC.y - GLOBO.R * y];
}
function gGeo(gx, gy) {        // inversa (solo para el hemisferio visible)
  const x = (gx - PC.x) / GLOBO.R, y = -(gy - PC.y) / GLOBO.R, r = Math.min(1, Math.hypot(x, y));
  const c = Math.asin(r), f0 = GLOBO.lat0 * RAD, sc = Math.sin(c), cc = Math.cos(c);
  const lat = r < 1e-9 ? GLOBO.lat0 : Math.asin(cc * Math.sin(f0) + y * sc * Math.cos(f0) / r) / RAD;
  const lon = GLOBO.lon0 + Math.atan2(x * sc, r * Math.cos(f0) * cc - y * Math.sin(f0) * sc) / RAD;
  return [lat, lon];
}

const UMET = 412 / 1e7;                        // unidades por metro
const UA = 1.496e11 * UMET, R_SOL = 6.96e8 * UMET, R_TIERRA = GLOBO.R, R_LUNA = 1.737e6 * UMET, D_LUNA = 3.844e8 * UMET;

const SOLW = [(SOL9.x - TIERRA9.x) * 100, (SOL9.y - TIERRA9.y) * 100];

const RG = 380e14;                              // radio de la galaxia (380 px en z = 21)
const SOL_GAL = { r: 0.56 * RG, a: 0.66 };      // el Sol, visto desde el centro de la galaxia
const GALW = [SOLW[0] - SOL_GAL.r * Math.cos(SOL_GAL.a), SOLW[1] - SOL_GAL.r * Math.sin(SOL_GAL.a)];
const F9 = { x: PC.x - C9[0] / 90, y: PC.y - C9[1] / 90 };

// Cámara del espacio: devuelve la posición en pantalla del origen (ax, ay) y la escala s.
function camEsp(z, pan = 0) {
  const s = Math.pow(10, 7 - z);
  if (z < 7) { const F = QS[7].F; return { ax: F.x + (PC.x - F.x) * s, ay: F.y + (PC.y - F.y) * s, s, c: [0, 0] }; }
  if (z <= 8) return { ax: PC.x, ay: PC.y, s, c: [0, 0] };
  if (z < 9) { const m = Math.pow(10, 9 - z); const ax = F9.x + (PC.x - C9[0] * 0.01 - F9.x) * m, ay = F9.y + (PC.y - C9[1] * 0.01 - F9.y) * m; return { ax, ay, s, c: [(PC.x - ax) / s, (PC.y - ay) / s] }; }
  const k = sstep(9.15, 10.6, z);
  let cx = lerp(C9[0], SOLW[0], k), cy = lerp(C9[1], SOLW[1], k);
  cx += (GALW[0] - SOLW[0]) * pan; cy += (GALW[1] - SOLW[1] + 20 / s) * pan;
  return { ax: PC.x - cx * s, ay: PC.y - cy * s, s, c: [cx, cy] };
}
// Dónde está la Tierra: junto al Sol hasta z ≈ 9,6 (licencia de cómic) y en su órbita real desde 10,6.
function posTierra(z) {
  if (z <= 10.1) return [0, 0];
  const d = Math.hypot(SOLW[0], SOLW[1]), ux = -SOLW[0] / d, uy = -SOLW[1] / d;
  return [SOLW[0] + ux * UA, SOLW[1] + uy * UA];
}

// Dibuja el globo de radio R con centro (cx, cy). V: caja visible en pantalla.
function globo(g, cx, cy, R, V) {

  const G = { k: k, vb: [PC.x + (V.x0 - cx) / k, PC.y + (V.y0 - cy) / k, PC.x + (V.x1 - cx) / k, PC.y + (V.y1 - cy) / k], n: (p) => [cx + (p[0] - PC.x) * k, cy + (p[1] - PC.y) * k] };
  const disco = new Path2D(); disco.arc(cx, cy, R, 0, TAU);
  // atmósfera
  g.save(); g.beginPath(); g.arc(cx, cy, R + Math.max(3, R * 0.045), 0, TAU); g.fillStyle = C.cyan; g.fill();
  g.beginPath(); g.arc(cx, cy, R + Math.max(1.5, R * 0.02), 0, TAU); g.fillStyle = C.cyanL; g.fill(); g.restore();

  tierraColor(g, V, G, Tp, k);
  g.save(); g.clip(Tp); cordilleras(g, V, G, k * 0.8, false); g.restore();
  g.fillStyle = C.sea; g.fill(Ap);
  g.lineWidth = Math.max(1.6, 2.6 * Math.min(1.4, k)); g.strokeStyle = C.ink; g.stroke(Tp); g.stroke(Ap);
  // nubes de cómic
  const nb = new Path2D(), cosOf = (la, lo) => { const f = la * RAD, l = (lo - GLOBO.lon0) * RAD, f0 = GLOBO.lat0 * RAD; return Math.sin(f0) * Math.sin(f) + Math.cos(f0) * Math.cos(f) * Math.cos(l); };
  for (const [la, lo, sz] of NUBES) {

  // sombra: trama de tinta hacia el lado oscuro, negro macizo y brillo
  g.fillStyle = C.ink; g.globalAlpha = 0.8;
  dots(g, V, cx - R, cy - R, cx + R, cy + R, Math.max(4, 8 * Math.min(1, k)), PI / 4, (px, py) => {
    const dx = (px - cx) / R, dy = (py - cy) / R, nz = Math.sqrt(Math.max(0, 1 - dx * dx - dy * dy));
    const l = dx * LIGHT[0] + dy * LIGHT[1] + nz * LIGHT[2];

  g.beginPath(); g.rect(cx - R - 4, cy - R - 4, 2 * R + 8, 2 * R + 8); g.arc(cx - 0.12 * R, cy - 0.16 * R, R * 1.06, 0, TAU);

  g.restore();
  g.beginPath(); g.arc(cx, cy, R * 0.9, PI * 1.08, PI * 1.38); g.lineWidth = Math.max(1.5, R * 0.022); g.lineCap = 'round'; g.strokeStyle = 'rgba(255,250,238,0.9)'; g.stroke();
  g.beginPath(); g.arc(cx, cy, R * 0.9, PI * 1.43, PI * 1.47); g.stroke();
  g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.lineWidth = Math.max(2.4, 6 * Math.min(1.5, k)); g.strokeStyle = C.ink; g.stroke();
}

  }

}

// ---------- planetas, cinturones y estrellas ----------
const PLANETAS = [
  { d: 0.387, col: C.grey, r: 5, a: 2.2 }, { d: 0.723, col: C.yellowL, r: 6, a: 4.0 },
  { d: 1.524, col: C.red, r: 5.5, a: 5.3 }, { d: 5.2, col: C.orange, r: 11, a: 0.9 }, { d: 9.58, col: C.sand, r: 9, a: 3.3, anillo: true },

const NEBULOSAS = (() => { const r = rng(55), L = []; for (let i = 0; i < 7; i++) { const d = Math.pow(10, 14.6 + r() * 1.2), a = r() * TAU; L.push({ x: SOLW[0] + d * Math.cos(a), y: SOLW[1] + d * Math.sin(a), R: d * (0.18 + r() * 0.2), col: [C.magenta, C.cyan, C.red, C.magenta][i % 4], f: r() }); } return L; })();

function espacio(g, z, t, cam) {

    const R = nb.R * s, x = X(nb.x), y = Y(nb.y), al = sstep(14, 60, R) * (1 - sstep(700, 1600, R)) * (1 - sstep(19.6, 20.4, z));

    dots(g, VISTA_PANTALLA, x - R, y - R, x + R, y + R, Math.max(5, R * 0.05), PI / 4, (px, py) => { const d = Math.hypot((px - x) / R, (py - y) / (R * 0.7)); return Math.max(5, R * 0.05) * 0.55 * Math.pow(cl(1 - d), 0.9) * (0.7 + 0.3 * Math.sin(px * 0.02 + nb.f * 9) * Math.cos(py * 0.017)); });

  for (const e of ESTRELLAS) {
    const x = X(e.x), y = Y(e.y), d = Math.hypot(x - sx, y - sy);
    const al = sstep(10, 40, d) * (1 - sstep(19.5, 20.3, z)) * sstep(14.8, 15.6, z);
    if (al < 0.03 || x < PP.x0 - 20 || x > PP.x1 + 20 || y < PP.y0 - 20 || y > PP.y1 + 20) continue;
    g.save(); g.globalAlpha = al;
    if (e.m > 0.9) { destello(g, x, y, 7 + 9 * (e.m - 0.9) / 0.1); g.fillStyle = e.col; g.fill(); g.lineWidth = 2; g.strokeStyle = C.ink; g.stroke(); }

    g.restore();
  }
  // nube de cometas
  { const al = sstep(14.0, 14.6, z) * (1 - sstep(16.6, 17.4, z));
    if (al > 0.02) { g.save(); g.globalAlpha = al; g.fillStyle = C.cyanL; for (const [wx, wy] of OORT) { const x = sx + wx * s, y = sy + wy * s; if (x < PP.x0 || x > PP.x1 || y < PP.y0 || y > PP.y1 || Math.hypot(x - sx, y - sy) < 8) continue; g.beginPath(); g.arc(x, y, 2.4, 0, TAU); g.fill(); } g.restore(); } }
  // burbuja del viento solar (heliosfera)
  { const R = 120 * UA * s, al = sstep(12.5, 12.9, z) * (1 - sstep(14.6, 15.3, z));
    if (al > 0.02 && R > 12) {
      g.save(); g.globalAlpha = al;

      g.fillStyle = C.cyan; dots(g, VISTA0, x0, y0, x1, y1, 8, PI / 4, (px, py) => { const d = Math.hypot((px - sx) / (R * 1.25), (py - sy) / R); return 3.4 * Math.pow(cl((d - 0.55) / 0.45), 2) * (d < 1 ? 1 : 0); });

    if (al > 0.02) { g.save(); g.globalAlpha = al; g.fillStyle = C.sand; for (const [d, a] of CINTO) { const R = d * UA * s; if (R < 6 || R > 2000) continue; g.beginPath(); g.arc(sx + Math.cos(a) * R, sy + Math.sin(a) * R, 1.6, 0, TAU); g.fill(); } g.restore(); } }
  // órbitas y planetas

    if (x > PP.x0 - 20 && x < PP.x1 + 20 && y > PP.y0 - 20 && y < PP.y1 + 20) { g.save(); g.globalAlpha = al; planeta(g, x, y, p.r, p.col, p.anillo); g.restore(); }

  const alLuna = sstep(7.6, 8.1, z) * (1 - sstep(9.5, 9.75, z));
  if (alLuna > 0.01) {
    g.save(); g.globalAlpha = alLuna;
    g.setLineDash([10, 9]); g.beginPath(); g.arc(tx, ty, D_LUNA * s, 0, TAU); g.lineWidth = 3.2; g.strokeStyle = C.cyanL; g.stroke(); g.setLineDash([]);

// ---------- la Vía Láctea ----------
// Espiral barrada vista desde fuera: dos brazos mayores que salen de la barra y dos menores; el
// Sol cae sobre uno menor. Todo se dibuja con trama sobre una función de densidad.
const GAL = { b: 0.3, r0: 0.16, brazos: [{ f: 0, w: 1, r1: 1.0 }, { f: PI, w: 1, r1: 1.0 }, { f: PI / 2, w: 0.55, r1: 0.86 }, { f: 3 * PI / 2, w: 0.55, r1: 0.86 }] };

const GAL_CB = Math.cos(GAL.rot), GAL_SB = Math.sin(GAL.rot);
function densGal(x, y) {     // x, y en unidades del radio de la galaxia, centrada en el origen
  const r = Math.hypot(x, y), th = Math.atan2(y, x);
  const xb = x * GAL_CB + y * GAL_SB, yb = -x * GAL_SB + y * GAL_CB;
  const barra = Math.exp(-((xb / 0.19) * (xb / 0.19) + (yb / 0.065) * (yb / 0.065)));
  const bulbo = Math.max(Math.exp(-(r / 0.09) * (r / 0.09)), barra * 0.85);
  const disco = Math.exp(-r / 0.34) * sstep(1.06, 0.7, r);
  let br = 0, polvo = 0;
  if (r > 0.07) {
    const lr = Math.log(r / GAL.r0) / GAL.b;
    for (const a of GAL.brazos) {
      let d = th - (lr + a.f + GAL.rot); d = ((d % TAU) + TAU + PI) % TAU - PI;
      const w = 0.07 + 0.11 * r, q = d * r / w;
      const fin = sstep(a.r1 + 0.06, a.r1 - 0.22, r) * sstep(0.1, 0.19, r);
      br = Math.max(br, a.w * Math.exp(-q * q) * fin);
      if (a.w > 0.8) polvo = Math.max(polvo, Math.exp(-(q + 1.05) * (q + 1.05) * 5) * fin * sstep(0.9, 0.35, r));
    }
  }
  return { disco, bulbo, br, polvo, r };
}
const GAL_HII = (() => { const r = rng(808), L = []; let n = 0; while (L.length < 110 && n++ < 20000) { const x = (r() * 2 - 1), y = (r() * 2 - 1); const D = densGal(x, y); if (D.br > 0.55 && D.r > 0.2 && r() < 0.6) L.push([x, y, 0.6 + r()]); } return L; })();
const GAL_CUM = (() => { const r = rng(909), L = []; let n = 0; while (L.length < 30 && n++ < 20000) { const x = (r() * 2 - 1), y = (r() * 2 - 1); const D = densGal(x, y); if (D.br > 0.7 && D.r > 0.25 && r() < 0.3) L.push([x, y, 0.5 + r()]); } return L; })();
const GAL_EST = (() => { const r = rng(919), L = []; let n = 0; while (L.length < 420 && n++ < 40000) { const x = (r() * 2 - 1), y = (r() * 2 - 1); const D = densGal(x, y); if (r() < D.disco * 0.8 + D.br * 0.5) L.push([x, y, 0.6 + r() * 1.2]); } return L; })();
function brazoPts(a, cx, cy, R, r0 = 0.16) {
  const P = []; for (let i = 0; i <= 70; i++) { const r = lerp(r0, a.r1, i / 70), th = Math.log(r / GAL.r0) / GAL.b + a.f + GAL.rot; P.push([cx + Math.cos(th) * r * R, cy + Math.sin(th) * r * R]); }
  return P;

function galaxia(g, cx, cy, R, V, alfa) {
  if (alfa <= 0.01) return;
  const x0 = Math.max(V.x0, cx - R * 1.08), x1 = Math.min(V.x1, cx + R * 1.08), y0 = Math.max(V.y0, cy - R * 1.08), y1 = Math.min(V.y1, cy + R * 1.08);

  g.fillStyle = C.cyan; dots(g, VISTA0, x0, y0, x1, y1, 7, PI * 5 / 12, (px, py) => { const d = D(px, py); return 3.9 * Math.pow(cl(d.br * (0.55 + d.disco * 1.7) + d.disco * 0.25), 0.65); });
  g.fillStyle = C.cyanL; dots(g, VISTA0, x0, y0, x1, y1, 6, PI / 4, (px, py) => { const d = D(px, py); return 3.2 * cl(d.br * (0.35 + d.disco * 2.4) - 0.15); });
  g.fillStyle = C.navyDk; dots(g, VISTA0, x0, y0, x1, y1, 5, PI / 12, (px, py) => { const d = D(px, py); return 2.6 * cl(d.polvo * 1.3 - 0.15) * cl(d.disco * 3); });
  g.fillStyle = C.orange; dots(g, VISTA0, x0, y0, x1, y1, 7, PI / 4, (px, py) => { const d = D(px, py); return 3.8 * Math.pow(d.bulbo, 0.45); });
  g.fillStyle = C.yellow; dots(g, VISTA0, x0, y0, x1, y1, 6, PI / 12, (px, py) => { const d = D(px, py); return 3.2 * Math.pow(d.bulbo, 0.8); });
  g.fillStyle = C.white; dots(g, VISTA0, x0, y0, x1, y1, 5, PI * 5 / 12, (px, py) => { const d = D(px, py); return 2.5 * cl(d.bulbo * 1.7 - 0.55) + 1.9 * cl(d.br * d.disco * 3.2 - 0.45); });
  // trazos de luz a lo largo de los brazos mayores
  for (const a of GAL.brazos) {
    if (a.w < 0.8) continue;
    const P = brazoPts(a, cx, cy, R, 0.17).slice(0, 52);
    g.fillStyle = 'rgba(255,250,238,0.8)'; ribbon(g, P, (u) => (R * 0.0055) * Math.sin(PI * u) + 0.2);
  }
  // estrellas sueltas por el disco
  g.fillStyle = 'rgba(255,250,238,0.9)';
  for (const [x, y, s] of GAL_EST) { const px = cx + x * R, py = cy + y * R; if (px < x0 || px > x1 || py < y0 || py > y1) continue; g.beginPath(); g.arc(px, py, Math.max(0.9, R * 0.0028 * s), 0, TAU); g.fill(); }

function mundo(g, z, t) {

  const j = saltoEn(t), vz = velZ(t), amt = cl(vz / 7);

function marcaAqui(g, t, info) {

}
