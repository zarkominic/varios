<script type="module">
// VM-GANCHO (frases 1–2), sin cartela. Seis planos:
// 1. (2026) la sala de libros raros de noche: la bibliotecaria entra con sus guantes y se para junto al atril; en «600»
//    el libro se enciende en oro bajo el foco; el estudiante da un respingo («!») y ella lo señala en «book»;
// 2. (corta en «nobody») el libro a pantalla completa: los signos de oro tiemblan y no se dejan leer bajo el dedo que los
//    recorre; en «plants» la mano señala la planta imposible; en «stars» la hoja pasa a la rueda de estrellas y salta un «?»;
// 3. (corta en «and it has beaten») la máquina de descifrar de cerca: el descifrador la teclea, la tira cruza el suelo, el
//    calendario salta de 1918 a 1944 en «both», y la tira acaba en un «?» en «wars»: los dos se miran, sin respuesta;
//    alrededor, pared de yeso con manchas y grietas, friso de paneles con veta y brillo, mapa de frentes, teléfono,
//    perchero con gabardina y sombrero, radiador con vapor y el cono de luz de la lámpara que se mece;
// 4. (corta en «recently») un ordenador de 2018 de noche: las manos teclean, la barra lee la página y escupe bloques; en
//    «intelligence» todo se deshace en un «?» rojo; la mano va al ratón, hace clic y el «?» vuelve a temblar;
// 5. (corta en «emperor») el tablero de detective: una mano clava el hilo a la moneda de la corona en «fortune» (destella),
//    otra da un golpecito en la foto del microscopio en «microscope»; el hilo de la etiqueta empieza a tenderse;
// 6. (corta en «and a book dealer», 1912) la villa: Voynich saca el libro de una caja y lo alza, orgulloso, en «name»;
//    en «They all had a clue» se le cae una carta de entre las hojas; en «None of them» le sale un «?» y se rasca la
//    cabeza; un mozo cruza al fondo con otra caja.
import * as T from '/atomo/plato/escenas/vm-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('vm-gancho');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const L = (f) => en('libro', f), Q = (f) => en('pistas', f);
const P2 = L(0.2366), P3 = L(0.606), P4 = L(0.8413), P5 = Q(0.0972), P6 = Q(0.6098);
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
const ruido = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const ORO = hex('#ffd860'), OROL = hex('#fff4b0'), ROJO = hex('#e04a3a'), ROJOS = hex('#7a1e1a'), K = hex('#141018');

// ── 1 · la sala: el libro se enciende ───────────────────────────────────────────────────────────────
const brilla1 = (t) => tramo(t, L(0.115), L(0.16));
const p1 = (t) => {
  T.biblioteca(R, t);
  // el halo de oro alrededor del atril (antes de los personajes: les da luz por detrás)
  const g = brilla1(t) * (0.85 + 0.15 * Math.sin(t * 6));
  if (g > 0) for (let y = 92; y <= 150; y++) for (let x = 112; x <= 208; x++) {
    const d = Math.hypot((x - 160) / 46, (y - 120) / 28); if (d >= 1) continue;
    const a = Math.min(0.92, (1 - d) * 1.1 * g); if (a > 0.04 && ruido(x, y) < 0.94) R.pset(x, y, mez(R.pget(x, y), d < 0.45 ? OROL : ORO, a));
  }
  // los rayos que salen del libro y giran despacio
  if (g > 0) for (let k = 0; k < 10; k++) { const an = k / 10 * Math.PI * 2 + t * 0.4, r0 = 14, r1 = 26 + 10 * Math.sin(t * 3 + k);
    for (let r = r0; r < r1; r += 1) { const x = Math.round(160 + Math.cos(an) * r * 1.6), y = Math.round(118 + Math.sin(an) * r * 0.9); if (y < 150) R.pset(x, y, mez(R.pget(x, y), OROL, 0.75 * g * (1 - (r - r0) / (r1 - r0)))); } }
  // la bibliotecaria entra por la derecha (pies en 152), se para junto al atril, se sorprende y lo señala en «book»
  const u = tramo(t, 0.25, 2.1), xb = Math.round(lerp(300, 194, u));
  const sorpBib = t > L(0.13) && t < L(0.18), señala = t > L(0.192);
  R.actor(EL.bibliotecaria, xb, 152, t, { dir: -1, anda: u > 0 && u < 1, sorpresa: sorpBib, dedo: señala, sonrisa: señala, habla: señala && Math.sin(t * 9) > 0.2 });
  // el estudiante lee a la izquierda, da un respingo cuando el libro brilla y luego no le quita ojo
  const resp = t > L(0.125) && t < L(0.16);
  R.actor(EL.estudiante, 112, 152, t, { dir: 1, sorpresa: t > L(0.125) && t < L(0.2), salto: resp ? 2 : 0, sonrisa: t > L(0.2) });
  if (t > L(0.125)) R.bocadillo(120, 118 - (resp ? 2 : 0), {});
  T.bibliotecaDelante(R, t, { brilla: brilla1(t) > 0.05 });
  // destellos sobre el libro (después del atril)
  if (brilla1(t) > 0) for (let k = 0; k < 5; k++) {
    const f = (t * 1.3 + k * 0.37) % 1, x = 146 + ((k * 11) % 30), y = 118 - Math.round(f * 14);
    if (f < 0.8) { R.pset(x, y, OROL); if (f > 0.2 && f < 0.5) { R.pset(x - 1, y, ORO); R.pset(x + 1, y, ORO); R.pset(x, y - 1, ORO); R.pset(x, y + 1, ORO); } }
  }
};

// ── 2 · la página: los signos no se dejan leer ──────────────────────────────────────────────────────
const MANGA = '#3a3450';
const p2 = (t) => {
  const pasa = tramo(t, L(0.468), L(0.505));
  T.biblioteca(R, t, { encuadre: 'pagina', pagina: 'planta', brilla: 0.55 + 0.45 * tramo(t, P2, P2 + 0.6), mueve: true, pasa, siguiente: 'estrellas' });
  // el dedo que recorre un renglón de la página derecha y no consigue leerlo (entra por la derecha)
  const e1 = tramo(t, P2 + 0.1, P2 + 0.5) - tramo(t, L(0.36), L(0.395));
  if (e1 > 0) {
    const r = tramo(t, P2 + 0.5, L(0.35)), wx = Math.round(lerp(352, 300, e1) - r * 30), wy = 64 + Math.round(Math.sin(r * 14) * 1) + (r > 0.45 ? 12 : 0);
    T.brazo(R, wx + 46, wy + 26, wx, wy, MANGA, -1);
  }
  // la mano que entra por abajo y señala la planta que no existe (en «plants»)
  const e2 = tramo(t, L(0.39), L(0.415)) - tramo(t, L(0.452), L(0.47));
  if (e2 > 0) { const wx = Math.round(lerp(-24, 30, e2)) + (Math.floor(t * 3) % 2); T.brazo(R, wx - 44, 140, wx, 118, MANGA, 1); }
  // en «don't add up» un «?» rojo late sobre la rueda de estrellas
  const q = tramo(t, L(0.565), L(0.585));
  if (q > 0) { const s = q < 1 ? 3 : 4; R.icono('?', 140 - Math.round(s * 3.5), 24 + (Math.sin(t * 8) > 0 ? 0 : 1), ROJO, ROJOS, s); }
};

// ── 3 · la máquina de descifrar: la tira acaba en «?» ───────────────────────────────────────────────
// lo que la escena añade al decorado de la máquina: la pared de yeso con manchas de humedad, grietas y la marca de un
// cuadro quitado; el friso de paneles de madera pintada con veta, moldura y brillo; el mapa de frentes con chinchetas,
// el teléfono de pared, el perchero con la gabardina y el sombrero, el radiador de hierro que suelta vapor, y el cono
// de luz de la lámpara que se mece (en la pared, el friso y un charco de luz en el suelo).
const OF = { pared: hex('#a6b698'), paredS: hex('#96a888'), paredL: hex('#b6c4a6'), mancha: hex('#9a9c78'), manchaS: hex('#868a68'),
  grieta: hex('#76866a'), zoc: hex('#6a7e64'), zocS: hex('#56684f'), zocL: hex('#7e9276'), zocD: hex('#48583f'), luz: hex('#fff2c8') };
let OF_PARED = null, OF_FRISO = null;
const ofTexturas = () => {
  if (OF_PARED) return;
  // valor suave (para las manchas grandes)
  const suave = (x, y, e, k) => { const fx = x / e, fy = y / e, ix = Math.floor(fx), iy = Math.floor(fy), ax = fx - ix, ay = fy - iy;
    const sx = ax * ax * (3 - 2 * ax), sy = ay * ay * (3 - 2 * ay), a = ruido(ix, iy, k), b = ruido(ix + 1, iy, k), c = ruido(ix, iy + 1, k), d = ruido(ix + 1, iy + 1, k);
    return lerp(lerp(a, b, sx), lerp(c, d, sx), sy); };
  OF_PARED = new Uint32Array(320 * 92);
  // las grietas: unas polilíneas finas que bajan desde el techo y desde el marco de la puerta
  const grietas = new Set(), luzG = new Set();
  for (const [x0, y0, n, dx, k] of [[96, 6, 22, 0.6, 1], [208, 10, 30, -0.5, 2], [8, 54, 0, 0, 3], [112, 84, 7, 0.9, 4]]) {
    let x = x0; for (let y = y0; y < y0 + n; y++) { x += dx * 0.4 + (ruido(y, k, 905) - 0.5) * 1.6; const xi = Math.round(x); grietas.add(y * 320 + xi); luzG.add((y + 1) * 320 + xi + 1);
      if (ruido(y, k, 906) > 0.82) { for (let j = 1; j < 4; j++) grietas.add((y + j) * 320 + xi - j); } } }
  for (let y = 5; y < 92; y++) for (let x = 0; x < 320; x++) {
    const n = ruido(x, y >> 1, 682); let c = n < 0.1 ? OF.paredS : n > 0.93 ? OF.paredL : OF.pared;
    // el yeso: grumos y llana (trazos cortos en diagonal)
    const g = ruido(x, y, 901); if (g < 0.05) c = OF.paredS; else if (g > 0.965) c = OF.paredL;
    if (((x + y * 2) % 23 === 0) && ruido(x >> 3, y >> 2, 902) > 0.6) c = mez(c, OF.paredL, 0.5);
    // manchas de humedad: bajan del techo y suben del friso, con el borde más oscuro y tramado
    const v = suave(x, y, 22, 903) * 0.7 + suave(x, y, 7, 904) * 0.3, arriba = Math.max(0, 1 - (y - 5) / 34), abajo = Math.max(0, (y - 66) / 26);
    const m = v * (0.4 + arriba * 0.9 + abajo * 0.8) - (x > 20 && x < 170 && y < 16 ? 0.3 : 0);
    if (m > 0.62) c = mez(c, OF.mancha, 0.55); else if (m > 0.58) c = (x + y) % 2 ? OF.manchaS : mez(c, OF.mancha, 0.4); else if (m > 0.55 && (x + y) % 2 === 0) c = mez(c, OF.mancha, 0.3);
    // la marca más clara de un cuadro que ya no está (entre la puerta y la tabla, con su clavo)
    if (x >= 86 && x <= 106 && y >= 56 && y <= 72) c = (x === 86 || x === 106 || y === 56 || y === 72) ? mez(c, OF.paredS, 0.4) : mez(c, OF.paredL, 0.45);
    if (x === 96 && y === 53) c = hex('#3a3a3a');
    if (grietas.has(y * 320 + x)) c = OF.grieta; else if (luzG.has(y * 320 + x)) c = mez(c, OF.paredL, 0.6);
    // la luz cálida de siempre hacia la tabla
    const k = Math.max(0, 1 - Math.abs(x - 120) / 110) * 0.12; if (k > 0) c = mez(c, hex('#fff8e0'), k);
    OF_PARED[y * 320 + x] = c;
  }
  // el friso: paneles de madera pintada (40 px) con moldura en bisel, veta, nudos, brillo en diagonal y rozaduras abajo
  OF_FRISO = new Uint32Array(320 * 41);
  for (let y = 95; y < 136; y++) for (let x = 0; x < 320; x++) {
    const x0 = Math.floor(x / 40) * 40, u = x - x0, w = y + Math.sin(x * 0.09 + x0) * 2.2 + Math.sin(x * 0.31) * 0.6;
    let c = OF.zoc;
    const enPanel = u >= 5 && u <= 35 && y >= 99 && y <= 130;
    if (!enPanel) {   // largueros y peinazos: veta vertical en los montantes, horizontal en los travesaños
      const vert = u < 5 || u > 35; const vv = vert ? Math.sin((x + Math.sin(y * 0.2 + x0) * 1.2) * 2.1) : Math.sin(w * 1.4);
      if (vv > 0.88) c = OF.zocS; if (u === 0) c = OF.zocD; if (u === 1) c = OF.zocL;
    } else {
      const b = u === 5 || y === 99, d = u === 35 || y === 130, b2 = u === 6 || y === 100, d2 = u === 34 || y === 129;
      if (b) c = OF.zocL; else if (d) c = OF.zocD; else if (b2) c = mez(OF.zoc, OF.zocL, 0.5); else if (d2) c = OF.zocS;
      else {
        const vv = Math.sin(w * 1.25 + x0); if (vv > 0.86) c = mez(OF.zoc, OF.zocS, 0.7); else if (vv < -0.93) c = mez(OF.zoc, OF.zocL, 0.4);
        // un nudo en algunos paneles
        const nx = x0 + 12 + Math.floor(ruido(x0, 1, 907) * 14), ny = 106 + Math.floor(ruido(x0, 2, 907) * 18), dn = Math.hypot((x - nx) * 0.7, y - ny);
        if (ruido(x0, 3, 907) > 0.4 && dn < 3.2) c = dn < 1.4 ? OF.zocD : (Math.round(dn * 2) % 2 ? OF.zocS : c);
        // el brillo del barniz en diagonal
        const s = (u - 6) + (y - 100) * 0.55; if (s > 7 && s < 9) c = mez(c, OF.zocL, 0.7); else if (s > 10 && s < 11) c = mez(c, OF.zocL, 0.4);
      }
    }
    // rozaduras de sillas y zapatos en lo bajo, y el polvo en la moldura
    if (y > 131 && ruido(x, y, 908) < 0.12) c = mez(c, hex('#8a8a70'), 0.5);
    if (y === 95 && ruido(x, 0, 909) < 0.3) c = OF.zocS;
    OF_FRISO[(y - 95) * 320 + x] = c;
  }
};
const p3Fondo = (t) => {
  const { rect, pset, disco, linea, poligono, pget } = R;
  ofTexturas();
  // 1) la pared y el friso texturados, solo sobre los píxeles que siguen siendo pared (la tira, la máquina y los muebles
  //    del decorado se quedan como están)
  for (let y = 5; y < 92; y++) for (let x = 0; x < 270; x++) {
    if (x >= 211 && x <= 267 && y >= 25) continue;
    const p = pget(x, y), r = p & 255, g = (p >>> 8) & 255, b = (p >>> 16) & 255;
    if (g > r && g > b && r >= 140 && g >= 165) pset(x, y, OF_PARED[y * 320 + x]);
  }
  for (let y = 95; y < 136; y++) for (let x = 0; x < 320; x++) {
    const p = pget(x, y); if (p === OF.zoc || p === OF.zocS || p === OF.zocL) pset(x, y, OF_FRISO[(y - 95) * 320 + x]);
  }
  // 2) el mapa de frentes, clavado arriba a la izquierda: costa, frentes en rojo y azul, chinchetas y un hilo
  rect(7, 17, 55, 47, hex('#4a3a28')); rect(8, 18, 54, 46, hex('#e8e0c4'));
  for (let y = 19; y < 46; y++) for (let x = 9; x < 54; x++) {
    const tierra = Math.sin(x * 0.22) * 4 + Math.sin(y * 0.3 + 1) * 3 + (x - 28) * 0.5 > (y - 30) * 0.7;
    let c = tierra ? (ruido(x, y, 910) < 0.15 ? hex('#c8b88a') : hex('#dccc9c')) : (ruido(x, y, 911) < 0.2 ? hex('#7a9aae') : hex('#8aaabe'));
    if ((x - 9) % 9 === 0 || (y - 19) % 7 === 0) c = mez(c, hex('#6a6a5a'), 0.35);
    pset(x, y, c);
  }
  for (let x = 12; x < 52; x++) { const y = Math.round(31 + Math.sin(x * 0.35) * 3 + (x - 12) * 0.08); pset(x, y, hex('#c03a2a')); if (x % 5 === 0) pset(x, y - 1, hex('#c03a2a')); }
  for (let x = 16; x < 50; x++) { const y = Math.round(39 + Math.sin(x * 0.28 + 2) * 2); pset(x, y, hex('#2a4a9a')); if (x % 5 === 2) pset(x, y + 1, hex('#2a4a9a')); }
  const fl = Math.floor(t * 2) % 3;
  for (const [x, y, c, k] of [[20, 30, '#d83a2a', 0], [33, 32, '#d83a2a', 1], [44, 34, '#e8c040', 2], [26, 40, '#3a6ad8', 1]]) { disco(x, y, 1.6, hex(c)); pset(x - 1, y - 1, k === fl ? hex('#ffffff') : hex('#f4f0e4')); }
  linea(20, 30, 44, 34, hex('#3a3a3a'));
  for (const [x, y] of [[8, 18], [54, 18], [8, 46], [54, 46]]) pset(x, y, hex('#c8a040'));
  for (let x = 8; x < 56; x++) pset(x, 48, mez(pget(x, 48), K, 0.25));
  // 3) el teléfono de pared bajo el calendario: caja de baquelita, horquilla, auricular y el cordón que se mece
  rect(90, 76, 103, 91, hex('#121216')); rect(91, 77, 102, 90, hex('#26262c')); rect(91, 77, 91, 90, hex('#3e3e48'));
  disco(96, 83, 3, hex('#3a3a44')); disco(96, 83, 1, hex('#d8d4c8')); for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2; pset(Math.round(96 + Math.cos(a) * 2.6), Math.round(83 + Math.sin(a) * 2.6), hex('#8a8a90')); }
  // el auricular colgado en su horquilla, al lado de la caja: auricular arriba, micrófono abajo
  rect(103, 79, 104, 80, hex('#3a3a44')); rect(105, 78, 106, 89, hex('#121216')); rect(105, 79, 105, 88, hex('#3e3e48'));
  rect(104, 77, 107, 79, hex('#121216')); rect(104, 87, 107, 90, hex('#121216')); pset(105, 77, hex('#5a5a66'));
  // el cordón, de la caja al auricular, en una curva que se mece un pelo
  { const sw = Math.sin(t * 1.6) * 0.6; for (let k = 0; k <= 6; k++) { const f = k / 6, xx = Math.round(102 + f * 4), yy = Math.round(90 + Math.sin(f * Math.PI) * (1.5 + sw)); pset(xx, yy, hex('#1a1a1e')); } }
  // 4) el perchero de madera con el sombrero (gancho izquierdo) y la gabardina (gancho derecho), que se mece con la corriente
  const px = 131, MD = hex('#5a4028'), ML = hex('#8a6a44'), MS = hex('#3a2818');
  for (let y = 140; y < 142; y++) for (let x = 118; x < 150; x++) pset(x, y, mez(pget(x, y), K, 0.35));   // su sombra en el suelo
  linea(px, 134, px - 9, 140, MS); linea(px, 134, px + 9, 140, MS); linea(px + 1, 134, px - 8, 140, MD); linea(px + 1, 134, px + 10, 140, MD);
  rect(px - 1, 136, px + 2, 140, MD); rect(px - 10, 140, px - 8, 140, MS); rect(px + 9, 140, px + 11, 140, MS);
  rect(px, 93, px + 1, 136, MD); rect(px, 93, px, 136, ML); for (const y of [104, 120]) rect(px - 1, y, px + 2, y + 1, MS);
  disco(px + 0.5, 92, 1.8, ML); pset(px, 91, hex('#c8a878'));
  linea(px, 97, px - 5, 94, MD); pset(px - 5, 93, MD); linea(px + 1, 97, px + 6, 94, MD); pset(px + 6, 93, MD);
  // el sombrero: copa con cinta y ala
  poligono([[px - 10, 98], [px - 9, 93], [px - 2, 93], [px - 1, 98]], hex('#5a5048')); rect(px - 9, 96, px - 2, 97, hex('#2a2420')); rect(px - 12, 98, px + 1, 99, hex('#4a4038')); rect(px - 12, 98, px + 1, 98, hex('#6a6058')); rect(px - 8, 93, px - 4, 93, hex('#6a6058'));
  // la gabardina: cuello, hombros, cinturón, botones, pliegues; el bajo se mece un pelo
  const ba = Math.sin(t * 1.3) * 1.3, GA = hex('#b89a64'), GS = hex('#8a7044'), GL = hex('#d4b884'), GD = hex('#5e4a2a');
  for (let y = 95; y <= 129; y++) { const f = (y - 95) / 34, cx = px + 7 + ba * f * f, hw = y < 99 ? 2 + (y - 95) : 6 + f * 2.2;
    const x0 = Math.round(cx - hw), x1 = Math.round(cx + hw);
    for (let x = x0; x <= x1; x++) { let c = GA; if (x === x0) c = GD; else if (x === x1) c = GD; else if (x === x0 + 1) c = GL; else if (x > x1 - 3) c = GS;
      if (((x - x0) === Math.round(hw * 0.7) || (x - x0) === Math.round(hw * 1.4)) && y > 113) c = GS;   // pliegues
      pset(x, y, c); } }
  rect(px + 2, 112, px + 12, 113, hex('#6e5632')); pset(px + 8, 112, hex('#c8a040'));   // el cinturón y su hebilla
  for (const y of [103, 108, 117]) pset(px + 6, y, GD);
  poligono([[px + 3, 95], [px + 7, 101], [px + 11, 95]], GS); linea(px + 7, 95, px + 7, 101, GD);   // el cuello
  rect(px + 1, 130, px + 13, 130, GD);
  // 5) el radiador de hierro colado entre la papelera y la puerta, con su llave, la tubería y el vapor del purgador
