//    nocturno sobre Giza: luna, Vía Láctea, siete nubes en tres términos y tres tonos a tres velocidades, murciélagos;
//    las pirámides con la cara derecha de luna y la izquierda en sombra, filo de luz en la arista; la arena con crestas,
//    matas, piedras y huellas, el recinto de estacas y cuerdas que se mecen y dos detectores con su cable que destellan;

const h = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };

const fijo = new Map();
