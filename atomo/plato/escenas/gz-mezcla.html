// 1. pantalla partida: la misma Keops de día dibujada dos veces; a la izquierda en plano azul con el satélite que barre,

//    vez más; el camellero, con su camello que rumia del ronzal, y dos turistas miran arriba; en «sky» el camello alza la
//    cabeza y en «all the time» la turista abre un paraguas que los muones atraviesan.
