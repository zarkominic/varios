// papel pintado de rayas con florecitas; más oscuro arriba; liso en las zonas tranquilas (Atom y el año)
function papelPintado(x0, y0, x1, y1, A, Bc, o = {}) {

// friso de cuarterones con su moldura y el rodapié
function friso(x0, y0, x1, y1, M, o = {}) {

// tarima: bandas que se ensanchan hacia delante, juntas escalonadas, veta y nudos

// una vela en su palmatoria con la base en (x, y); la llama tiembla

// paisaje de invierno (o pradera) que se ve por una ventana: cielo tramado, colinas, casas, árboles desnudos

  const duda = t > llega && t < TG.FINALLY + 0.45 ? Math.sin(t * 8) * 0.25 : 0;
  let obj = [x + 19, suelo - 6], ang = 1.1 + duda;
  if (sube > 0) { obj = [x + 14, ri(lerp(suelo - 6, suelo - 26, sube))]; ang = lerp(1.1, -1.9, sube) + (sube >= 1 ? Math.sin(t * 6) * 0.06 : 0); }
  if (cae > 0) { obj = [x + 20, ri(lerp(suelo - 26, suelo - 13, cae))]; ang = lerp(-1.9, -0.45, cae); }
  if (baja > 0) { obj = [x + 19, ri(lerp(suelo - 13, suelo - 6, baja))]; ang = lerp(-0.45, 1.1, baja); }
  const sm = R.actor(EL.morrissViejoBL, x, suelo, t, { dir: 1, anda, sostiene: obj, sorpresa: roto && t < golpe + 1, enfado: sube >= 1 && !roto, sonrisa: t > golpe + 1.2 });
  const [mx, my] = sm.mano;
  martillo(mx, my, ang, cae >= 1 && baja === 0 ? Math.max(12, Math.min(20, Math.hypot(kx - mx, ky - my) - 3)) : sube > 0 && baja === 0 ? 16 : 12);
  if (t > golpe && t < golpe + 0.6) { for (let k = 0; k < 14; k++) { const a = k / 14 * 6.28, r = (t - golpe) * 60; ps(kx + Math.cos(a) * r, ky + Math.sin(a) * r * 0.7, k % 2 ? DORL : DORADO); ps(kx + Math.cos(a) * r * 0.7, ky + Math.sin(a) * r * 0.5, 0xffffffff); } brillo(kx, ky, t, 1, DORL); }
  bocad(x + 8, 132, '!', tramo(t, golpe + 0.1, golpe + 0.3) * (t < golpe + 1.4 ? 1 : 0));
}

// 9. INSERTO, LA CAJA ABIERTA (despacho, de noche, 1845): la tapa se levanta; en «two letters» se iluminan las dos
//    cartas con su lacre; en «three sheets» suben las tres hojas de números; Atom asoma con su lupa en «numbers».
function c9(t) {
  const ab = tramo(t, TG.P9 - 0.1, TG.TWO);
  const g = T.lynchburg(R, t, { encuadre: 'despacho', camara: 'caja', abierta: ab, roto: true });
  if (g.hojas && t > TG.THREE - 0.1) g.hojas.forEach(([hx, hy], k) => { const a = tramo(t, TG.THREE - 0.1 + k * 0.15, TG.THREE + 0.2 + k * 0.15); if (a > 0) brillo(hx + 6, hy - 14, t + k, a * (t < TG.NUMBERS + 0.6 ? 0.7 : 0), DORL); });
  if (t > TG.TWO - 0.1 && t < TG.PLAIN + 0.4) { brillo(126, 98, t, 0.6, DORL); brillo(206, 98, t + 0.5, 0.6, DORL); }
  // Atom asoma por la derecha (zona libre x 220–300) con la lupa
  const au = tramo(t, TG.SHEETS - 0.4, TG.NUMBERS - 0.2), ax = lerp(330, 252, au);
  if (au > 0) { const A = AT.atom(R, ri(ax), 108, t, { dir: -1, pose: au < 1 ? 'camina' : 'sostiene', cara: 'sorpresa', s: 1 }); if (au >= 1) AT.lupa(R, A.mano[0], A.mano[1], 1, -1); }
}

// 10. INSERTO, LA LECTURA (la mesa de la salita): las manos viejas de Morriss sujetan las cartas por abajo; la derecha
//     coge la primera hoja por la esquina y la pasa a la izquierda (el aire mueve las tres hojas de números); «23» en
//     «twenty-three years»; los renglones de la segunda se encienden uno a uno («reads what Beale wanted to say»); la
//     llama del quinqué oscila y una polilla le da vueltas.
function dorso(x0, y0, x1, y1) {
  if (x1 - x0 < 1) return;
  relleno(x0, y0, x1, y1, PAPEL, (x, y) => 3.7 + (h2(x >> 1, y >> 1, 23) - 0.5) * 0.4 - (x - x0) / Math.max(1, x1 - x0) * 0.5);
  marco(x0, y0, x1, y1, PAPEL[1]);
  for (let k = 0; k < 11; k++) { const yy = ri(y0 + 5 + k * ((y1 - y0 - 8) / 11)); for (let x = x1 - 4; x > x1 - 4 - (x1 - x0 - 8) * 0.85; x--) if (h2(x, yy, 41) > 0.35 && (x1 - x) % 7) ps(x, yy, PAPEL[2]); }
  for (let x = x0 + 2; x <= x1 + 1; x++) sombrea(x, y1 + 1, 0.35);
}
function c10(t) {
  fijo('mesaLect', mesaLecturaFondo);
  quinque(300, 122, t);
  const ma = t * 3.1; ps(300 + Math.cos(ma) * 12, 78 + Math.sin(ma * 1.6) * 7, PAPEL[3]);
  // las hojas de números: el aire de la hoja que pasa las empuja un poco y las hace aletear
  const vuelta = tramo(t, TG.P10 + 0.22, TG.P10 + 1.0), aire = Math.sin(vuelta * Math.PI);
  for (let k = 0; k < 3; k++) T.d_hoja(R, 226 + k * 22 + ri(vuelta * (2 + k)), 126 + (k % 2) * 6 - ri(aire * (3 - k) * Math.abs(Math.sin(t * 18 + k))), { n: k + 1, escala: 1, t, ver: 1 });
  const xs = 128, w = 80, y0 = 62, y1 = 158;
  // la pila: el canto de la hoja de abajo y la segunda hoja (la que lee)
  relleno(xs + 2, y0 + 2, xs + w + 2, y1 + 2, PAPEL, () => 2.6);
  hojaPapel(xs, y0, xs + w, y1, { n: 11, ver: 1, k: 27 });
  const lee = tramo(t, TG.READS - 0.2, TG.SAY);
  for (let k = 0; k < Math.floor(lee * 11); k++) { const yy = ri(y0 + 5 + k * ((y1 - y0 - 8) / 11)); for (let x = xs + 4; x < xs + w - 4; x++) { aclara(x, yy - 1, DORL, 0.45); aclara(x, yy + 1, DORL, 0.3); if (R.pget(x, yy) === TINTA) ps(x, yy, hex('#8a5a10')); } }
  // la primera hoja: se levanta por la derecha, gira sobre el lomo y cae boca abajo a la izquierda
  const cv = Math.cos(vuelta * Math.PI), xe = ri(xs + w * cv), lev = ri(Math.sin(vuelta * Math.PI) * 4);
  if (cv >= 0) { if (xe > xs + 1) { hojaPapel(xs, y0 - lev, xe, y1 - lev, { n: 11, ver: 1, k: 41 }); if (vuelta > 0) for (let y = y0; y <= y1; y++) for (let i = 1; i <= 4; i++) sombrea(xe + i, y + 2, 0.3 * (1 - cv)); } }
  else dorso(xe, y0 - lev, xs, y1 - lev);
  // los brazos: el izquierdo sujeta la pila por la esquina; el derecho pasa la hoja y vuelve a su esquina
  const bal = Math.sin(t * 1.2);
  T.brazo(R, xs - 34, 206, xs + 2, ri(y1 - 6 + bal), '#5a2a32', 1, { codo: [xs - 24, 186], puno: '#f2eee2' });
  let wx = xs + w - 2, wy = y1 - 6 - bal;
  if (vuelta > 0 && vuelta < 1) { wx = xe + 12 * ease(vuelta); wy = y1 - 6 - lev - 10 * Math.sin(vuelta * Math.PI); }
  else if (vuelta >= 1) { const r = ease(tramo(t, TG.P10 + 1.0, TG.P10 + 1.6)); wx = lerp(xs - w + 12, xs + w - 2, r); wy = y1 - 6 - Math.sin(r * Math.PI) * 6 - (r >= 1 ? bal : 0); }
  T.brazo(R, ri(wx + 34), 206, ri(wx), ri(wy), '#5a2a32', -1, { codo: [ri(wx + 24), 186], puno: '#f2eee2' });
  const d23 = tramo(t, TG.Y23 - 0.15, TG.Y23 + 0.2); if (d23 > 0 && t < TG.READS) { R.numero('23', 168, ri(52 - d23 * 4), { tam: 16, centro: true }); }
  if (t > TG.BEALE2 - 0.2) brillo(168, 104, t, tramo(t, TG.BEALE2 - 0.2, TG.BEALE2 + 0.2), DORL);
}

const año = (t) => t < TG.P4 ? 1822 : t < TG.P5 ? anyoBuzon(t) : t < TG.P6 ? 1832 : t < TG.P7 ? anyoHogar(t) : 1845;
const efectos = [[0.3, 'puerta'], [0.8, 'pasos'], [1.2, 'papel'], [TG.DATED, 'sello'], [TG.Y1822 + 0.6, 'papel'],
  [TG.P2 + 0.2, 'papel'], [TG.BOX - 0.1, 'pop'], [TG.PAPERS, 'papel'], [TG.NOONE, 'pop'], [TG.KEY - 0.1, 'tic'],
  [TG.P3 + 0.3, 'papel'], [TG.KEY2 + 0.4, 'papel'], [TG.SEALED, 'sello'], [TG.ENVEL + 0.4, 'lapiz'],
  [TG.P4 + 0.3, 'whoosh'], [TG.P4 + 1.4, 'papel'], [TG.P4 + 2.4, 'viento'], [TG.Y1832 + 0.1, 'cerrojo'], [TG.Y1832 + 0.6, 'tic'], [TG.COMES, 'pasos'],
  [TG.P5 + 0.2, 'pasos'], [TG.WAITING, 'tic'], [TG.JUST, 'carro'], [TG.AGAIN, 'viento'],
  [TG.P6 + 0.3, 'golpecito'], [TG.WAITS, 'whoosh'], [TG.Y13, 'pop'], [TG.CASE, 'pop'],
  [TG.BREAK, 'whoosh'], [TG.BETRAY, 'pop'], [TG.Y1845, 'brillo'],
  [TG.P8 + 0.1, 'pasos'], [TG.MIND - 0.2, 'whoosh'], [TG.OPEN, 'boom'], [TG.OPEN + 0.25, 'cerrojo'],
  [TG.P9, 'puerta'], [TG.TWO, 'brillo'], [TG.THREE, 'papel'], [TG.NUMBERS, 'brillo'],
  [TG.P10 + 0.2, 'papel'], [TG.Y23, 'pop'], [TG.READS, 'brillo']];
T.rodar(E, R, [[0, c1], [TG.P2, c2], [TG.P3, c3], [TG.P4, c4], [TG.P5, c5], [TG.P6, c6], [TG.P7, c7], [TG.P8, c8], [TG.P9, c9], [TG.P10, c10]],
  { efectos, año });
</script>
