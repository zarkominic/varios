<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El cajón · pixel</title>
<style>
  html, body { margin: 0; height: 100%; background: #04030a; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// PX-EP3-CAJON · muestra de pixel art del episodio 3, escena 4 (frases 11–13, cartela «0»). Mismos golpes que ep3-cajon
// (guion.json), en el lienzo de 480 × 270 de kits/pixel-ep03.js (escalado ×4). Empieza en el último fotograma de
// px-ep3-promesa (window.__fin de esa escena: plató, persona, regla entera con el marcador en 10⁰, Atom con t = 0).
//  0 – 1,2 s   cartela «0» sobre el último fotograma de px-ep3-promesa (quieto).
//  cajon       (PLANO GENERAL → TRAVELLING, por corte 0,25 s antes) la misma persona en el mismo sitio, ahora en un pasillo
//              de noche (papel pintado, zócalo de nogal, apliques, puertas, alfombra), con una cinta métrica roja en la mano.
//              La cinta sale disparada, cae al suelo y corre por el pasillo; la cámara la sigue hasta la ventana abierta del
//              fondo (cortinas que se mecen, luna, tejados). La cinta trepa por la pared, pasa el alféizar, sale, se enreda en
//              bucles contra el cielo y se aleja hasta perderse en la noche.
//  ½ frase     (DETALLE; sin marca de palabra: al 42 % del intervalo de la frase 11, «porque…») dos montones de monedas casi
//              iguales en el suelo del plató y, flotando, un cerebro de perfil con un cajón de nogal en el costado. El cajón
//              se abre, las monedas de los dos montones vuelan en chorro y caen dentro del mismo cajón, que se cierra de golpe
//              (etiqueta con «!»: «muchísimo»); ya lleno, el cerebro flota hasta el centro del cuadro.
//  millon      (PLANO MEDIO, por corte) la persona, ahora niña, de medio cuerpo junto a un calendario de taco colgado en la
//              pared, solo con números: arranca once hojas, que salen volando y caen revoloteando, y la duodécima se queda
//              arrancada a medias (once días y medio).
//  milmillones (PLANO GENERAL, por corte; el encuadre del principio) la niña a la izquierda, con los dos montones de monedas
//              a sus pies; caen 32 calendarios, uno tras otro, y forman una pila en el borde derecho, en el sitio de la regla;
//              la niña crece con la pila (proporciones y tamaño, edad 0 → 1 del kit) y mira cómo sube.
// FINAL (termina_con): desde QUIETO = duración − 0,6 s, quieto: el plató del principio, la persona adulta de pie en su sitio
// (x 153, suela 214, 118 px) con los dos montones a sus pies, la pila de 32 calendarios en el sitio y con la altura de la
// regla (x 410–441, y 14–222) y Atom en PX.ATOM_SITIO. window.__fin lo resume.
// ?vista=guias&k=0|1 pone sola a la niña (0) o a la adulta (1), grande y de frente, para atomo/herramientas/guias-humano.py
// (window.__info: centro, coronilla y suela en píxeles de 1920).
// Coste: al cargar se pintan el pasillo, el cielo de la ventana, el cerebro, las monedas y las hojas; en cada fotograma se
// pegan capas y, en vivo, la cinta, las cortinas, la persona, el cajón, las monedas que vuelan, las hojas y la pila.
import { escena } from '/atomo/plato/escena.js';
import { crearPixel } from '/atomo/plato/kits/pixel-ep03.js';
import { PALO } from '/atomo/plato/kits/pixel-ep03-ojo.js';

const E = await escena('px-ep3-cajon', 'ep03px');
const c0 = performance.now();
const q = new URLSearchParams(location.search);
const PX = crearPixel(document.getElementById('lienzo'));
const { PAL, W, H, clamp, mezcla, suave, sale, entra, entraSale, paso, fot, tono, vnoise, fbm, hash2, b4, b8, mulberry32, rgb, hex, mezclaColor } = PX;
const TAU = Math.PI * 2;
const pal = (a) => a.map(hex);
const M = (k, d) => E.marca(k, d);
const m = {
  c: M('cajon', 1.5), cF: M('cajon_fin', 8.929), mi: M('millon', 9.479), miF: M('millon_fin', 12.554),
  mm: M('milmillones', 13.104), mmF: M('milmillones_fin', 15.856),
};
const D = E.duracion, QUIETO = D - 0.6;
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const energia = (t) => (t >= QUIETO ? 0 : E.energia(t));

// ───────────────────────────────────────────────────────────── tiempos (todo sale de las marcas)
// las palabras sueltas no tienen marca: «porque tu cerebro…» se toma al 42 % del intervalo de la frase 11
const porque = mezcla(m.c, m.cF, 0.42);
const T = {
  pasillo: m.c - 0.25,                    // corte al pasillo
  suelta: m.c - 0.08,                     // la cinta sale disparada
  pared: m.c + 1.42,                      // la punta llega a la pared, bajo la ventana
  fuera: m.c + 1.62,                      // pasa el alféizar y sale
  enredo: m.c + 2.25,                     // el enredo, completo
  cajon: porque - 0.2,                    // corte al cerebro (DETALLE)
};
T.perdido = T.cajon - 0.12;               // ya no se ve
T.abre0 = T.cajon + 0.3; T.abre1 = T.cajon + 0.62;
T.vuela0 = T.abre1 - 0.05; T.vuela1 = m.cF - 1.75;   // salen las monedas
T.cierra0 = m.cF - 1.08; T.cierra1 = T.cierra0 + 0.13;
T.calendario = m.mi - 0.25;               // corte a la niña y el calendario (PLANO MEDIO)
T.hoja0 = m.mi + 0.12; T.hojaDt = (m.miF - 0.55 - T.hoja0) / 10.6;   // once hojas…
T.media0 = T.hoja0 + 11 * T.hojaDt; T.media1 = T.media0 + 0.24;      // …y la duodécima, a medias
T.general = m.mm - 0.25;                  // corte al plano general
T.pila0 = m.mm - 0.05; T.pila1 = m.mmF - 0.45;                       // caen los 32 calendarios
T.vuelve0 = m.mmF - 0.35; T.vuelve1 = QUIETO - 0.05;                 // la persona vuelve a mirar a cámara

// ───────────────────────────────────────────────────────────── utilidades
const rr = (cx, cy, hw, hh, r) => (x, y) => { const qx = Math.abs(x - cx) - hw + r, qy = Math.abs(y - cy) - hh + r; return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r; };
const elip = (cx, cy, rx, ry) => (x, y) => (Math.hypot((x - cx) / rx, (y - cy) / ry) - 1) * Math.min(rx, ry);
const segSdf = (ax, ay, bx, by, r0, r1 = r0) => (x, y) => {
  const px = x - ax, py = y - ay, ex = bx - ax, ey = by - ay;
  const h = clamp((px * ex + py * ey) / (ex * ex + ey * ey), 0, 1);
  return Math.hypot(px - ex * h, py - ey * h) - mezcla(r0, r1, h);
};
const sunion = (k, ...fs) => (x, y) => { let d = fs[0](x, y); for (let i = 1; i < fs.length; i++) { const b = fs[i](x, y), h = clamp(0.5 + 0.5 * (b - d) / k, 0, 1); d = mezcla(b, d, h) - k * h * (1 - h); } return d; };
const smax = (a, b, k) => { const h = clamp(0.5 + 0.5 * (b - a) / k, 0, 1); return mezcla(a, b, h) + k * h * (1 - h); };
const smin = (a, b, k) => -smax(-a, -b, k);
function capaDe(w, h, fn) { const c = PX.nuevaCapa(w, h); PX.en(c, fn); return c; }
// pega una capa con transparencia (0) sin recorrer toda la pantalla
function blit(capa, dx, dy) {
  const Tt = PX.destino(); dx = Math.round(dx); dy = Math.round(dy);
  const x0 = Math.max(0, dx), x1 = Math.min(Tt.w, dx + capa.w), y0 = Math.max(0, dy), y1 = Math.min(Tt.h, dy + capa.h);
  for (let y = y0; y < y1; y++) {
    const fs = (y - dy) * capa.w - dx, fd = y * Tt.w;
    for (let x = x0; x < x1; x++) { const c = capa.buf[fs + x]; if (c) Tt.buf[fd + x] = c; }
  }
}
const sumarLuz = (x, y, r, c, f, p = 4) => PX.luz(x, y, r, typeof c === 'number' ? rgb(c) : c, f, p);

// ═════════════════════════════════════════════════════════════ PLANO 0: el final de px-ep3-promesa
const FINP = {
  plato: { ancho: 640, focoX: 240, focoY: 118, sueloY: 200, semilla: 11 }, camX: 80,
  persona: { x: 153, y: 214, altura: 118, pose: 'depie', vida: false, t: 0 },
  regla: { e: 0, entera: 1, actual: 0, marca: 0 },
};
let tFinPromesa = 15.775 - 0.6;   // px-ep3-promesa congela la regla en su QUIETO
try { const todas = await (await fetch('/atomo/plato/escenas/marcas-ep03px.json')).json(); if (todas['px-ep3-promesa']) tFinPromesa = todas['px-ep3-promesa'].duracion - 0.6; } catch { /* valor por defecto */ }
const PLATO = PX.crearPlato(FINP.plato);
const INICIO = capaDe(W, H, () => {
  PLATO.dibujar({ camX: FINP.camX, t: tFinPromesa, polvo: 0 });
  PX.regla({ ...FINP.regla, aparece: 1, t: tFinPromesa });
  PX.persona({ ...FINP.persona });
});

// ═════════════════════════════════════════════════════════════ PLANO 1: el pasillo (TRAVELLING)
const PW = 980, BASE = 202, CAMF = 470;
const VENT = { x0: 744, x1: 832, y0: 40, y1: 176 };                 // el cristal (por dentro del marco)
const ABIERTO = 112;                                                  // la hoja de abajo, subida: de aquí al alféizar no hay cristal
const APLIQUES = [214, 470];
const PUERTAS = [[286, 338], [560, 612]];
const PARED = pal(['#080c0f', '#0c1316', '#11191c', '#172124', '#1d292b', '#243233', '#2c3c3b', '#364744', '#41534e', '#4e6159', '#5d7067', '#6f8277']);
const PISO = pal(['#0c0807', '#150e0b', '#20150f', '#2c1d14', '#3a271a', '#4a3220', '#5c3f28', '#704e31', '#865e3b']);
const ALFOMBRA = pal(['#13070a', '#220b10', '#341016', '#47161c', '#5c1f23', '#74292b', '#8c3833']);
const CORTINA = pal(['#10060a', '#1e0a10', '#2f0f17', '#43151f', '#591c27', '#712630', '#8b333a']);
const FRIO = PALO.FRIO, NOGAL = PAL.NOGAL, LAT = PAL.LATON;
const lamparaV = (x, y) => {
  let v = 0;
  for (const lx of APLIQUES) {
    const dx = x - lx, dy = y - 92;
    v += 3.4 * Math.exp(-((dx / (8 + 0.62 * Math.abs(dy))) ** 2)) * Math.exp(-Math.abs(dy) / 75) + 1.5 * Math.exp(-(dx * dx + dy * dy) / (62 * 62));
  }
  return v;
};
const lunaV = (x, y) => 1.2 * Math.exp(-(((x - 788) / 70) ** 2) - (((y - 120) / 75) ** 2));
const PAS = PX.nuevaCapa(PW, H);
PX.en(PAS, () => {
  const rnd = mulberry32(77);
  // techo y moldura
  PX.degradado(0, 0, PW - 1, 14, NOGAL, (x, y) => 0.4 + y * 0.06 + 0.25 * lamparaV(x, 30), 1);
  for (let x = 0; x < PW; x++) { const l = 0.3 * lamparaV(x, 40); PX.pset(x, 15, tono(NOGAL, 4.2 + l, x, 15)); PX.pset(x, 16, tono(NOGAL, 3 + l, x, 16)); PX.pset(x, 17, tono(NOGAL, 1.6 + l, x, 17)); }
  // papel pintado: rayas finas y un rombo tramado; luz de los apliques en V y la luna junto a la ventana
  PX.degradado(0, 18, PW - 1, 126, PARED, (x, y) => {
    let v = 2.2 + 0.5 * (y - 18) / 108;
    v += ((x >> 3) & 1) ? 0.22 : 0;
    const dx = Math.abs(((x + 8) % 16) - 8), dy = Math.abs(((y + 4) % 22) - 11);
    if (dx + dy * 0.75 < 3.2) v += 0.55;
    v += 0.45 * (fbm(x * 0.05, y * 0.05) - 0.5);
    v -= 1.4 * Math.exp(-(y - 18) / 10);
    v += lamparaV(x, y) + lunaV(x, y);
    v -= 1.2 * suave(880, 980, x);
    return v;
  }, 1);
  for (const lx of APLIQUES) sumarLuz(lx, 92, 74, PAL.AMBAR[2], 0.42, 4);
  // moldura del zócalo
  for (let x = 0; x < PW; x++) { const l = 0.35 * lamparaV(x, 120); [4.6, 3.6, 2.8, 2.0, 1.0].forEach((v, k) => PX.pset(x, 127 + k, tono(NOGAL, v + l, x, 127 + k))); }
  // zócalo de nogal con cuarterones (bisel: arriba a la izquierda en sombra, abajo a la derecha con luz)
  PX.degradado(0, 132, PW - 1, 194, NOGAL, (x, y) => {
    const l = 0.38 * lamparaV(x, y - 30) + 0.4 * lunaV(x, y);
    const px = ((x + 20) % 64 + 64) % 64, enPanel = px >= 9 && px <= 58 && y >= 140 && y <= 187;
    let v = 2.5 + l + 0.35 * Math.sin(x * 0.7 + 4 * vnoise(x * 0.08, y * 0.03)) + 0.3 * (vnoise(x * 0.3, y * 0.05) - 0.5);
    if (enPanel) {
      v += 0.35;
      if (px === 9 || y === 140) v -= 1.6;
      else if (px === 58 || y === 187) v += 1.0;
      else if (px === 10 || y === 141) v -= 0.7;
    }
    return v - 1.2 * suave(880, 980, x);
  }, 1);
  // rodapié
  for (let x = 0; x < PW; x++) { const l = 0.3 * lamparaV(x, 160); [4.2, 3.0, 2.4, 2.2, 2.0, 1.6, 0.6].forEach((v, k) => PX.pset(x, 195 + k, tono(NOGAL, v + l - 0.8 * suave(880, 980, x), x, 195 + k))); }
  // suelo de tarima: tablas a lo largo, más estrechas hacia la pared
  const filas = [BASE]; for (let k = 1; k <= 10; k++) filas.push(BASE + Math.round(68 * (k / 10) ** 1.45));
  const juntas = filas.map(() => { const out = []; let x = -rnd() * 120; while (x < PW) { out.push(Math.round(x)); x += 95 + rnd() * 80; } return out; });
  for (let r = 0; r < filas.length - 1; r++) {
    const ya = filas[r], yb = filas[r + 1];
    for (let y = ya; y < yb && y < H; y++) for (let x = 0; x < PW; x++) {
      const tabla = juntas[r].filter((j) => j <= x).length;
      let v = 3.1 + 0.9 * (hash2(r, tabla) - 0.5) + 0.32 * Math.sin(x * 0.33 + r * 2 + 4 * vnoise(x * 0.02, r * 3.1)) + 0.3 * (vnoise(x * 0.12, y * 0.6 + r * 9) - 0.5);
      for (const lx of APLIQUES) v += 2.3 * Math.exp(-(((x - lx) / 62) ** 2) - (((y - 212) / 13) ** 2));
      v += 1.2 * Math.exp(-(((x - 335) / 26) ** 2) - (((y - 205) / 6) ** 2));             // la luz que sale bajo la puerta
      v -= 0.9 * (y - BASE) / 68;
      if (y === ya) v -= 1.7;
      if (juntas[r].includes(x)) v -= 1.5;
      v -= 1.2 * suave(880, 980, x);
      PX.pset(x, y, tono(PISO, v, x, y, 1));
    }
  }
  // la alfombra del pasillo: campo rojo oscuro con rombos y cenefa ocre
  PX.degradado(0, 228, PW - 1, 257, ALFOMBRA, (x, y) => {
    let v = 2.3 + 0.35 * (vnoise(x * 0.2, y * 0.4) - 0.5);
    for (const lx of APLIQUES) v += 1.4 * Math.exp(-(((x - lx) / 70) ** 2));
    const dx = Math.abs(((x + 14) % 28) - 14), dy = Math.abs(y - 243);
    const r = dx / 11 + dy / 8;
    if (r < 1 && r > 0.72) v += 1.4; else if (r < 0.35) v += 0.9;
    if (y === 228) v -= 1.3;
    if (y === 232 || y === 253) v += 1.6;
    return v - 1.2 * suave(880, 980, x);
  }, 1);
  for (let x = 0; x < PW; x++) for (const y of [230, 255]) PX.pset(x, y, tono(PAL.AMBAR, 1.3 + 0.6 * lamparaV(x, 120) * 0.3 + (((x >> 1) & 1) ? 0.3 : 0), x, y, 1));
  for (let x = 0; x < PW; x++) PX.pset(x, 258, ALFOMBRA[0]);
  // la luz de la luna en el suelo, delante de la ventana (con la sombra de la cruz del marco)
  for (let y = BASE + 1; y < 246; y++) {
    const off = (y - BASE) * 1.35, xa = VENT.x0 - 4 - off, xb = VENT.x1 + 2 - off;
    for (let x = Math.floor(xa); x <= xb; x++) {
      const borde = Math.min(x - xa, xb - x, 246 - y) / 5;
      const cruz = Math.abs(x - (xa + xb) / 2) < 1.6 || Math.abs(y - (BASE + 14)) < 1;
      const f = clamp(borde, 0, 1) * (cruz ? 0.25 : 1) * (1 - (y - BASE) / 60);
      const qv = Math.floor(f * 0.55 * 4 + b4(x, y)) / 4;
      if (qv > 0) { const p = PX.pget(x, y), [r, g, b] = rgb(p); PX.pset(x, y, PX.color(r + 70 * qv, g + 95 * qv, b + 140 * qv)); }
    }
  }
  // puertas: jamba, hoja con cuarterones, pomo de latón; bajo la primera, la luz de una habitación
  for (const [a, b] of PUERTAS) {
    PX.forma({ x0: a, y0: 60, x1: b, y1: BASE, sdf: rr((a + b) / 2, 131, (b - a) / 2, 71, 1), rampa: NOGAL, lo: 2.6, hi: 6, grosor: 2, plano: 0.75, k: 0.3,
      textura: (x, y, v) => v + 0.3 * lamparaV(x, y) * 0.5 + 0.25 * Math.sin(y * 0.8 + 3 * vnoise(x * 0.3, y * 0.04)) });
    PX.forma({ x0: a + 5, y0: 66, x1: b - 5, y1: BASE, sdf: rr((a + b) / 2, 134, (b - a) / 2 - 5, 68, 0), rampa: NOGAL, lo: 1.3, hi: 3.6, grosor: 2, plano: 0.85, k: 0.3,
      textura: (x, y, v) => {
        let w = v + 0.3 * lamparaV(x, y) * 0.4 + 0.25 * Math.sin(x * 0.9 + 3 * vnoise(x * 0.1, y * 0.02));
        const px = x - a - 5, py = y - 66, an = b - a - 10;
        const inX = (px >= 5 && px <= an / 2 - 3) || (px >= an / 2 + 3 && px <= an - 5), inY = (py >= 6 && py <= 58) || (py >= 66 && py <= 128);
        if (inX && inY) { w += 0.3; const e = [px - 5, an / 2 - 3 - px, px - an / 2 - 3, an - 5 - px].filter((d) => d >= 0); const de = Math.min(...e); if (de < 1 || py === 6 || py === 66) w -= 1.3; else if (py === 58 || py === 128) w += 0.9; }
        return w;
      } });
    PX.forma({ x0: b - 15, y0: 133, x1: b - 7, y1: 141, sdf: elip(b - 11, 137, 2.6, 2.6), rampa: LAT, lo: 1.6, hi: 6, grosor: 2 });
  }
  for (let x = PUERTAS[0][0] + 5; x <= PUERTAS[0][1] - 5; x++) { PX.pset(x, BASE - 1, PAL.AMBAR[4]); PX.pset(x, BASE - 2, PAL.AMBAR[2]); }
  // cuadro con un paisaje al atardecer (marco dorado) y espejo ovalado
  PX.forma({ x0: 376, y0: 46, x1: 432, y1: 90, sdf: rr(404, 68, 27, 21, 1), rampa: LAT, lo: 1.2, hi: 4.6, grosor: 3, k: 0.3 });
  PX.degradado(381, 51, 427, 85, PAL.TERRACOTA, (x, y) => 4.3 - (y - 51) * 0.09, 1);
  PX.disco(410, 70, 5, PAL.AMBAR[4]);
  PX.degradado(381, 66, 427, 85, NOGAL, (x, y) => { const h1 = 72 + 5 * Math.sin(x * 0.11 + 1) + 3 * Math.sin(x * 0.29), h2 = 77 + 3 * Math.sin(x * 0.17 + 2); return y > h2 ? 1.2 : y > h1 ? 2.6 : null; }, 1);
  PX.degradado(381, 81, 427, 85, PAL.TERRACOTA, (x, y) => ((x + y) & 3) === 0 ? 3.2 : null, 0);
  PX.oscurecer(381, 51, 427, 85, 0.25);
  PX.forma({ x0: 648, y0: 50, x1: 684, y1: 96, sdf: elip(666, 73, 16, 21), rampa: LAT, lo: 1.2, hi: 4.6, grosor: 3, k: 0.3 });
  PX.forma({ x0: 652, y0: 55, x1: 680, y1: 92, sdf: elip(666, 73, 12, 17), rampa: FRIO, lo: 0.4, hi: 1.8, grosor: 4, plano: 0.6, contorno: LAT[0],
    textura: (x, y, v) => v + (Math.abs(x - y * 0.5 - 625) < 2.5 ? 1.4 : 0) });
  // apliques: placa y brazo de latón, pantalla de tela que brilla
  for (const lx of APLIQUES) {
    PX.forma({ x0: lx - 4, y0: 98, x1: lx + 4, y1: 110, sdf: elip(lx, 104, 2.6, 5), rampa: LAT, lo: 1.5, hi: 5.5, grosor: 2 });
    PX.linea(lx, 98, lx, 96, LAT[3]);
    PX.forma({ x0: lx - 9, y0: 82, x1: lx + 9, y1: 97, sdf: (x, y) => { const k = (y - 84) / 11; const hw = mezcla(4.5, 7.5, clamp(k, 0, 1)); return Math.max(Math.abs(x - lx) - hw, 84 - y, y - 95); }, rampa: PAL.CREMA, lo: 3.4, hi: 5.4, grosor: 2, plano: 0.6, contorno: PAL.AMBAR[1] });
    sumarLuz(lx, 90, 16, PAL.AMBAR[4], 0.6, 4);

  montonesPies();
}

// ═════════════════════════════════════════════════════════════ dibujar(t)
function dibujar(t) {
  if (t < T.pasillo) PX.pegar(INICIO, 0, 0, { opaco: true });
  else if (t < T.cajon) planoPasillo(t);
  else if (t < T.calendario) planoCerebro(t);
  else if (t < T.general) planoCalendario(t);
  else planoGeneral(t);
  PX.atom({ ...PX.ATOM_SITIO, t, energia: energia(t) });
  PX.cartela(t, E.cartela);
  PX.presentar(t);
}
function guias(k) {
  PX.limpiar(PAL.TELON[3]);
  const a = PX.persona({ x: 240, y: 262, altura: 250, edad: k, pose: 'depie', vida: false, sombra: 0 });
  window.__info = { x: 240 * 4, coronilla: a.coronilla * 4, suela: a.suela * 4 };
  PX.presentar(0);
}
// calienta las cachés (la primera persona de cada plano)
{ const c = PX.nuevaCapa(W, H); PX.en(c, () => { planoPasillo(T.pasillo); planoCerebro(T.cajon); planoCalendario(T.calendario); planoGeneral(D); }); }
window.__tiempos = { ...T, D, QUIETO, porque, caja: CAJA, pared: CAMINO.pared, total: CAMINO.total };
window.__fin = { plato: FINP.plato, camX: FINP.camX, persona: { ...FINP.persona }, pila: { ...PILA, alto: ALTO_B }, monedas: MONT_PIES, atom: { ...PX.ATOM_SITIO }, desde: QUIETO };
window.__carga = Math.round(performance.now() - c0);
if (q.get('vista') === 'guias') { const k = Number(q.get('k') ?? 1); E.iniciar(() => guias(k)); }
else E.iniciar(dibujar);
