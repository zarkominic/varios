    cabra(xc, 172 - salta, t, (k1 > 0 && k1 < 1) || k2 > 0); }
  // el «?» sobre la loba: sale en «replaced», crece en «Lupercalia» y se deshace antes del corte
  if (t > PREG) { const esc = t > LUPER ? rebote(t, LUPER, 3) : rebote(t, PREG, 2), a = 1 - lin(t, BORRA0, P2 - 0.1); const w = 5 * esc; glifo('?', 160 - w / 2, (t > LUPER ? 40 : 48) + Math.round(Math.sin(t * 4) * 1.5), esc, H('#ffe08a'), a); if (t > LUPER) chispas(t, LUPER, 160, 52); }
};

// ── 2 · el gabinete de Chaucer: ningún documento; luego el amor y la pluma ──────────────────────────────────────
const NODOC = C9(0.3420), XX = C9(0.3829), AMOR = C9(0.4858), VA0 = C9(0.4574), VA1 = C9(0.5914), MOJA = C9(0.6437);
const p2 = (t) => {
  const o = { encuadre: 'chaucer' };
  T.amor(R, t, o);
  // la criada entra por la derecha, deja la jarra en el arcón (lejos del gato) y se va
  const JARRA = P2 + 1.3;
  { const ent = lin(t, P2 + 0.2, JARRA - 0.3), sal = lin(t, JARRA + 0.6, JARRA + 2.4), xc = Math.round(lerp(lerp(334, 298, ent), 334, sal)); const anda = (ent > 0 && ent < 1) || (sal > 0 && sal < 1);
    const a = R.actor(EL.criada, xc, 150, t, { dir: sal > 0 ? 1 : -1, anda, sonrisa: t > JARRA - 0.3 && t < JARRA + 1.0, sostiene: t < JARRA ? [xc - 2, 110 + (t > JARRA - 0.3 ? Math.round(lin(t, JARRA - 0.3, JARRA) * 5) : 0)] : undefined });
    if (t < JARRA) { const [mx, my] = a.mano; R.rect(mx - 2, my - 5, mx + 2, my, K); R.rect(mx - 1, my - 4, mx + 1, my - 1, H('#c8784a')); R.pset(mx - 1, my - 4, H('#e8a070')); } }
  if (t >= JARRA) { R.rect(292, 111, 296, 116, K); R.rect(293, 112, 295, 115, H('#c8784a')); R.pset(293, 112, H('#e8a070')); R.pset(297, 112, K); R.pset(297, 113, K); }
  // Chaucer: ante la librería con el códice, «X»; lo devuelve al estante, va al pupitre y escribe
  const kv = lin(t, VA0, VA1), xc = Math.round(lerp(28, 92, kv)), libro = t < VA0, guarda = lin(t, VA0 - 0.45, VA0 - 0.05);
  const sacude = t > XX && t < XX + 0.6;
  const a = R.actor(EL.chaucer, xc, 150, t, { dir: sacude ? (Math.floor(t * 8) % 2 ? 1 : -1) : kv >= 1 ? -1 : 1, anda: kv > 0 && kv < 1, triste: t > XX && t < VA0, sonrisa: t > AMOR, sostiene: libro ? [xc + 18 - Math.round(guarda * 4), 134 - Math.round(guarda * 14)] : kv >= 1 && t > MOJA ? [xc - 2, 138] : undefined });
  if (libro) {
    const [mx, my] = a.mano, abierto = t > NODOC && guarda === 0;
    if (!abierto) { R.rect(mx - 4, my - 6, mx + 3, my + 1, K); R.rect(mx - 3, my - 5, mx + 2, my, H('#7a3a2a')); R.rect(mx - 1, my - 4, mx, my - 3, H('#e8b830')); }
    else { R.rect(mx - 7, my - 5, mx + 6, my + 1, K); R.rect(mx - 6, my - 4, mx - 1, my, H('#f4ead0')); R.rect(mx, my - 4, mx + 5, my, H('#e8dcc0')); for (let k = 0; k < 3; k++) { R.linea(mx - 5, my - 3 + k * 1, mx - 2, my - 3 + k, H('#8a7a6a')); R.linea(mx + 1, my - 3 + k, mx + 4, my - 3 + k, H('#8a7a6a')); } if (Math.floor(t * 3) % 2 && t < XX) R.linea(mx, my - 6, mx + 3, my - 5, H('#f4ead0')); }
  }
  T.amorDelante(R, t, o);
  // la pluma y lo que escribe, encima del pupitre
  if (kv >= 1 && t > MOJA) { const w = lin(t, MOJA + 0.2, P3), px = Math.round(84 + (w * 40) % 40), py = 140 + Math.floor(w * 2); for (let r = 0; r < Math.floor(w * 2); r++) R.linea(80, 140 + r, 122, 140 + r, H('#3a2a2a')); R.linea(80, py, px, py, H('#3a2a2a')); R.linea(px, py, px + 5, py - 9, H('#f4f4ec')); R.linea(px + 1, py - 1, px + 6, py - 9, H('#c8c8c0')); R.pset(px, py, K); }
  // «no document»: la X; «love»: el corazón
  if (t > XX && t < VA0 + 0.4) glifo('X', 34, 100, rebote(t, XX, 2), H('#e8304a'), 1 - lin(t, VA0, VA0 + 0.4));
  if (t > AMOR && t < MOJA + 0.4) { glifo('corazon', xc, 98 + Math.round(Math.sin(t * 6) * 1.5), rebote(t, AMOR, 2), H('#e8304a'), 1 - lin(t, MOJA, MOJA + 0.4)); chispas(t, AMOR, xc + 7, 104, H('#ffb0c0')); }
};

// ── 3 · la ventana: los pájaros se emparejan en la rama ─────────────────────────────────────────────────────────
// un gorrión pequeño (x, y = patas) mirando a la derecha; pica: la cabeza abajo; vuela: las alas abiertas
const gorrion = (x, y, t, pica, vuela) => {
  const P = H('#8a5a34'), p = H('#5a3a20'), c = H('#e8d8b8');
  R.rect(x - 3, y - 4, x + 2, y - 1, K); R.rect(x - 2, y - 3, x + 1, y - 2, P); R.pset(x - 1, y - 2, c); R.pset(x, y - 2, c);
  R.pset(x - 4, y - 3, K); R.pset(x - 5, y - 4, p);
  const hy = pica ? y - 2 : y - 5; R.rect(x + 1, hy - 1, x + 4, hy + 1, K); R.pset(x + 2, hy, p); R.pset(x + 3, hy, K); R.pset(x + 5, hy + 1, H('#e8b830'));
  if (vuela) { const al = Math.floor(t * 14) % 2; R.linea(x - 2, y - 4, x - 5, y - 7 - al * 2, K); R.linea(x - 1, y - 4, x - 3, y - 8 + al * 2, p); }
  else { R.pset(x - 1, y, K); R.pset(x + 1, y, K); R.linea(x - 2, y - 3, x, y - 3, p); }
};
const ESCRIBE = C9(0.7733), PAREJA = C9(0.9721), ELIGE = C9(0.8948), VUELA = C9(0.8667), PICA = P3 + 0.55;
const p3 = (t) => {
  // el reloj del decorado se desplaza para que el pájaro que llega empiece su vuelo al abrir el plano
  const tt = t - P3 + 70;
  const o = { encuadre: 'chaucer', camara: 'ventana' };
  T.amor(R, tt, o);
  // Chaucer, a la izquierda, con su rollo: escribe; en «chose its mate» señala la rama y sonríe
  const señala = t > ELIGE && t < PAREJA + 0.6;
  const a = R.actor(EL.chaucer, 44, 166, t, { dir: 1, sostiene: señala ? undefined : [64, 150], dedo: señala, sonrisa: t > ELIGE, habla: t > PAREJA + 0.6 && Math.sin(t * 8) > 0.3 });
  if (!señala) {
    const [mx, my] = a.mano, w = lin(t, ESCRIBE, ELIGE);
    R.rect(mx - 5, my - 12, mx + 7, my + 1, K); R.rect(mx - 4, my - 11, mx + 6, my, H('#f4ead0')); R.rect(mx - 5, my - 13, mx + 7, my - 12, H('#c8a878')); R.rect(mx - 5, my + 1, mx + 7, my + 2, H('#c8a878'));
    const n = Math.floor(w * 5); for (let k = 0; k < n; k++) R.linea(mx - 3, my - 9 + k * 2, mx + 4 - (k % 2) * 2, my - 9 + k * 2, H('#3a2a2a'));
    if (t > ESCRIBE && t < ELIGE) { const px = Math.round(mx - 3 + ((t * 6) % 7)), py = my - 9 + n * 2; R.linea(px, py, px + 6, py - 10, H('#f4f4ec')); R.linea(px + 1, py, px + 7, py - 10, H('#c8c8c0')); R.pset(px, py, K); }
  }
  // el gorrión del alféizar: salta y picotea migas; en «every bird» vuela a la rama
  { const vuela = lin(t, VUELA, VUELA + 0.9), hop = lin(t, P3 + 0.3, VUELA), xg0 = Math.round(lerp(150, 176, hop)) + (Math.floor(t * 2.5) % 2);
    const pica = vuela === 0 && Math.sin(t * 9) > 0.4, salto = vuela === 0 && Math.abs(Math.sin(t * 5)) > 0.85 ? 2 : 0;
    const xg = Math.round(lerp(xg0, 214, vuela)), yg = Math.round(lerp(132 - salto, 84, vuela) - Math.sin(vuela * Math.PI) * 14);
    if (vuela > 0) R.recorte([96, 20, 224, 133]);
    gorrion(xg, yg + (vuela >= 1 ? 0 : 0), t, vuela >= 1 ? Math.sin(t * 3) > 0.7 : pica, vuela > 0 && vuela < 1);
    R.recorte(null);
    if (t < VUELA) for (const [mx, k] of [[160, 0], [166, 1], [171, 2], [178, 3]]) if (t < P3 + 0.8 + k * 0.9) R.pset(mx, 132, H('#e8d8a8')); }
  // en «chose its mate»: un corazón sobre cada pareja de la rama
  if (t > PAREJA - 0.2) for (const [hx, hy, d] of [[132, 60, 0], [166, 56, 0.12], [200, 54, 0.24]]) if (t > PAREJA - 0.2 + d) { glifo('corazon', hx, hy - Math.round(lin(t, PAREJA, PAREJA + 2) * 6), rebote(t, PAREJA - 0.2 + d, 2), H('#e8406a')); }
};

T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3]], {
  efectos: [[PALMADA, 'palmada'], [PREG, 'pop'], [LUPER, 'brillo'], [BORRA0 + 0.1, 'whoosh'],
    [NODOC, 'papel'], [P2 + 1.3, 'toc'], [AMOR, 'pop'], [MOJA + 0.2, 'lapiz'],
    [PICA, 'tic'], [ESCRIBE, 'lapiz'], [P3 + 3.15, 'brillo'], [VUELA + 0.1, 'whoosh'], [PAREJA - 0.2, 'pop']],
  año: (t) => (t < P2 ? 400 : 1380),
});
</script>
