<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<body>
<script type="module">
// HOJA DE PRUEBA del kit del episodio 3 kits/ep03-balanza.js (no es una escena del vídeo: lleva rótulos).
// Un fotograma por pieza y por variante (también las que no usa ep3-proton), con el plató, la luz y la cámara de las
// escenas de plastilina (pos [0, 3,8, 15,5], mira [0, 2,3, 0], fov 28).
//   __frame(0)  → la hoja entera (4 × 3 celdas de 480 × 360, con su rótulo)
//   __frame(k)  → la celda k (1…N) a tamaño completo, sin rótulo
// ?celda=k abre la celda k en la vista previa. window.__tiempos[k] da lo que tardó cada celda (ms).
import { crearPlato, crearPost } from '/atomo/plato/kits/plastilina-adulta.js';
import { tiposBalanza, balanza, caida, silueta, cielo, coches, arena, enPlato, BALANZA, COLORES_BALANZA } from '/atomo/plato/kits/ep03-balanza.js';
import { tiposNucleo, quarks, proton, QUARKS } from '/atomo/plato/kits/ep03-nucleo.js';
import { foto } from '/atomo/plato/kits/ep03-tocar.js';

const W = 1920, H = 1080;
const T = ['balanza', 'silueta', 'cielo', 'coches', 'arena', 'quarks', 'proton'];
const I = Object.fromEntries(T.map((t, i) => [t, i]));
const P = await crearPlato({
  piezas: T, tiposExtra: { ...tiposBalanza(), ...tiposNucleo(['quarks', 'proton']) }, atomo: false, alfa: true, post: false,
  sombraFondo: ['p0', 'p1', 'p2', 'p3', 'p4', 'p5', 'p6'],
  camara: { pos: [0, 3.8, 15.5], mira: [0, 2.3, 0], fov: 28, desenfoque: 44 },
});
const POST = crearPost();
const en = (sx, sy, z) => P.punto(sx, sy, z);

// la balanza de las celdas: de pie en el suelo, centrada, ~900 px de ancho
const EB = 2.3, ZB = 0.5;
const BAL = (angulo = 0, rotY = -0.12) => ({ pos: [en(960, 540, ZB)[0], -BALANZA.SUELO * EB, ZB], escala: EB, rot: [0, rotY, 0], angulo });
const C = [];
const cel = (rot, poner, o = {}) => C.push({ rot, poner, ...o });
cel('balanza nivelada (angulo 0)', () => balanza(P, I.balanza, BAL(0)));
cel('balanza angulo −A_MAX (baja la derecha)', () => balanza(P, I.balanza, BAL(-BALANZA.A_MAX)));
cel('silueta + cielo (ep3-promesa, gato, borde)', () => {
  const b = balanza(P, I.balanza, BAL(BALANZA.A_MAX));
  silueta(P, I.silueta, { pos: b.platoIzq, escala: 0.62 * EB, rot: [0, -0.12, 0], brillo: 0.5 });
  cielo(P, I.cielo, { pos: b.platoDer, escala: 0.62 * EB, rot: [0, -0.4, 0] });
});
cel('quarks + protón (ep3-proton)', () => {
  const b = balanza(P, I.balanza, BAL(-BALANZA.A_MAX * 0.97));
  const sq = 0.42 * EB;
  quarks(P, I.quarks, { pos: enPlato(b, 'izq', [0, QUARKS.RB * 0.42, 0]), escala: sq, rot: [-Math.PI / 2 + 0.15, 0.3, 0], bandas: 0, brillo: 0.3, separacion: 0.7 });
  proton(P, I.proton, { pos: enPlato(b, 'der', [0, 0.2, 0]), escala: 0.2 * EB });
});
cel('coches (der) y plato vacío, nivelada (ep3-neutrones)', () => {
  const b = balanza(P, I.balanza, BAL(0));
  coches(P, I.coches, { pos: b.platoDer, escala: 0.75 * EB, rot: [0, 0.3, 0] });
});
cel('arena (izq) + silueta (der), angulo −0,1 (ep3-borde)', () => {
  const b = balanza(P, I.balanza, BAL(-0.1));
  arena(P, I.arena, { pos: b.platoIzq, escala: 0.85 * EB });
  silueta(P, I.silueta, { pos: b.platoDer, escala: 0.62 * EB, rot: [0, -0.12, 0], brillo: 0.5 });
});
cel('silueta sola: ámbar, brillo 0,6', () => silueta(P, I.silueta, { pos: [en(960, 540, 1)[0], 0, 1], escala: 5.2, brillo: 0.6 }));
cel('silueta 2 colores (rojo/verde, mezcla 0,5), sin peana', () => silueta(P, I.silueta, { pos: en(960, 960, 1), escala: 5.2, colores: [COLORES_BALANZA.rojo, COLORES_BALANZA.verde], mezcla: 0.5, brillo: 0.35, peana: 0 }));
cel('cielo', () => cielo(P, I.cielo, { pos: [en(960, 540, 2)[0], 0.7, 2], escala: 2.6, rot: [0.15, 0, 0], brillo: 0.7 }));
cel('coches', () => coches(P, I.coches, { pos: [en(960, 540, 2)[0], 0.6, 2], escala: 2.6, rot: [0.05, 0.4, 0] }));
cel('arena', () => arena(P, I.arena, { pos: [en(960, 540, 2)[0], 1.0, 2], escala: 3.4, rot: [0.15, 0.2, 0] }));
cel('caida con rebote (t0 + dur + 0,12)', () => {
  const a = caida(0.82, { t0: 0, dur: 0.7, a: BALANZA.A_MAX });
  const b = balanza(P, I.balanza, BAL(a));
  silueta(P, I.silueta, { pos: b.platoIzq, escala: 0.62 * EB, rot: [0, -0.12, 0], brillo: 0.5 });
  cielo(P, I.cielo, { pos: b.platoDer, escala: 0.62 * EB, rot: [0, -0.4, 0] });
});

// ---------------------------------------------------------------- dibujo
const lienzoGL = P.renderer.domElement;
const cont = document.getElementById('escena');
const capa = document.createElement('canvas');
capa.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;display:block';
cont.appendChild(capa);
const g = capa.getContext('2d');
const cache = [];
window.__tiempos = [];
function celda(k) {
  if (cache[k]) return cache[k];
  const c = C[k];
  const a = performance.now();
  P.fotograma(0); P.limpiar();
  c.poner(P);
  P.render(k + 1);
  const f = foto(P);
  window.__tiempos[k] = Math.round(performance.now() - a);
  return (cache[k] = f);
}
function ajustarCapa() {
  if (capa.width !== lienzoGL.width || capa.height !== lienzoGL.height) { capa.width = lienzoGL.width; capa.height = lienzoGL.height; }
  g.setTransform(capa.width / W, 0, 0, capa.width / W, 0, 0);
}
const COL = 4, FIL = 3;
function dibujar(t) {
  ajustarCapa();
  const k = Math.round(t);
  if (k >= 1 && k <= C.length) {
    g.drawImage(celda(k - 1), 0, 0, W, H);
    POST.aplicar(g, k);
    return;
  }
  g.fillStyle = '#0b0c0f'; g.fillRect(0, 0, W, H);
  const cw = W / COL, ch = H / FIL;
  C.forEach((c, j) => {
    const x = (j % COL) * cw, y = Math.floor(j / COL) * ch;
    g.drawImage(celda(j), x, y, cw, ch);
    g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(x, y + ch - 26, cw, 26);
    g.fillStyle = '#e8dcc0'; g.font = '17px sans-serif'; g.fillText(`${j + 1}. ${c.rot}`, x + 8, y + ch - 8);
  });
}
const busq = new URLSearchParams(location.search);
window.ESCENA ??= { id: 'ep03-balanza-hoja', duracion: C.length + 1, marcas: {}, voz: [0, 0] };
window.__celdas = C.map((c) => c.rot);
window.__paso = 1;
window.__frame = async (t) => dibujar(t);
window.__listo = true;
if (!busq.has('captura')) dibujar(Number(busq.get('celda') ?? 0));
</script>
