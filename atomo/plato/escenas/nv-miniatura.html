<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Miniatura · ep22</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// NV-MINIATURA · la miniatura del episodio 22 (se captura en t = 1, 1920 × 1080). Partida en diagonal: a la izquierda,
// Canterbury nevado de noche en 1647, con el aviso del acebo tachado clavado en una puerta de roble; el alguacil puritano
// (sombrero de copa negro) le tiende una multa con un «5» enorme a Santa Claus, que levanta las manos con cara de
// sorpresa. A la derecha, el salón cálido de hoy con el árbol, y un gran «1647» dorado. Abajo a la derecha, la galleta de
// jengibre con ojos, asustada. Sin palabras.
import { crearRoma } from '/atomo/plato/kits/pixel-roma.js';
import { conChibi, ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
import { hex } from '/atomo/plato/kits/pixel-retro.js';
import * as T from '/atomo/plato/escenas/nv-comun.js';
const R = conChibi(await crearRoma(document.getElementById('lienzo')));
const izq = R.nuevo(), der = R.nuevo(), pj = R.nuevo(), tmp = R.nuevo(), VACIO = 0x01020304, K = hex('#0c0814');
const pon = (src, sx0, sx1, sy0, sy1, dx, dy, s = 2) => { for (let y = sy0; y <= sy1; y++) for (let x = sx0; x <= sx1; x++) { const c = src[y * 320 + x]; if (c === VACIO) continue; R.rect(dx + (x - sx0) * s, dy + (y - sy0) * s, dx + (x - sx0) * s + s - 1, dy + (y - sy0) * s + s - 1, c); } };
const contorno = (b, n = 1, c = K) => { for (let p = 0; p < n; p++) { const m = b.slice(); for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) { if (m[y * 320 + x] !== VACIO) continue; if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, d]) => { const X = x + a, Y = y + d; return X >= 0 && X < 320 && Y >= 0 && Y < 180 && m[Y * 320 + X] !== VACIO; })) b[y * 320 + x] = c; } } };
const vuelca = (b) => { for (let k = 0; k < 320 * 180; k++) if (b[k] !== VACIO) R.buf[k] = b[k]; };
const mezcla = (a, b, f) => { let r = 0; for (const sh of [0, 8, 16]) r |= (Math.round(((a >>> sh) & 255) * f + ((b >>> sh) & 255) * (1 - f)) & 255) << sh; return (0xff000000 | r) >>> 0; };
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
// un actor en su búfer, copiado a escala s con su contorno (filo de color c)
const actorGrande = (def, op, bx, dx, dy, s, filo, borra = []) => {
  R.usar(pj); pj.fill(VACIO); R.actor(def, 20, 70, 0.5, { quieto: true, ...op }); R.usar(tmp); tmp.fill(VACIO);
  for (const [x, y] of borra) pj[y * 320 + x] = VACIO;
  pon(pj, bx[0], bx[1], bx[2], bx[3], dx, dy, s); contorno(tmp, 1, filo); R.usar(null); vuelca(tmp);
};

// un brillo suave: aclara hacia el color c en un círculo de radio r
const brillo = (cx, cy, r, c, f = 0.5) => { for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++) { if (x < 0 || x > 319 || y < 0 || y > 179) continue; const d = Math.hypot(x - cx, y - cy) / r; if (d < 1) R.buf[y * 320 + x] = mezcla(c, R.buf[y * 320 + x], f * (1 - d) * (1 - d)); } };
// una elipse rellena (a resolución de lienzo)
const elipse = (cx, cy, rx, ry, c) => { for (let y = Math.floor(cy - ry); y <= cy + ry; y++) for (let x = Math.floor(cx - rx); x <= cx + rx; x++) if (((x + 0.5 - cx) / rx) ** 2 + ((y + 0.5 - cy) / ry) ** 2 <= 1) R.pset(x, y, c); };
// un trazo grueso de (x0, y0) a (x1, y1), de radio r
const trazo = (x0, y0, x1, y1, r, c) => { const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) * 2); for (let k = 0; k <= n; k++) { const u = k / n; elipse(x0 + (x1 - x0) * u, y0 + (y1 - y0) * u, r, r, c); } };

// ── la puerta de roble de Canterbury, con herrajes, y el aviso del acebo tachado clavado ──
const ROBLE = [hex('#6a4426'), hex('#4e3018'), hex('#36200e'), hex('#22140a')], HIERRO = hex('#2a2a34');
function puerta(x0, x1, y0, y1) {
  const cx = (x0 + x1) / 2, rx = (x1 - x0) / 2;
  // el marco de piedra y el arco
  for (let y = y0 - 6; y <= y1; y++) for (let x = x0 - 6; x <= x1 + 6; x++) {
    const arco = y < y0 + rx ? Math.hypot((x - cx) / (rx + 6), (y - y0 - rx) / (rx + 6)) <= 1 : true;
    if (!arco) continue;
    const dentro = y < y0 + rx ? Math.hypot((x - cx) / rx, (y - y0 - rx) / rx) <= 1 : x >= x0 && x <= x1;
    if (!dentro) { R.pset(x, y, (Math.floor(y / 6) + Math.floor(x / 9)) % 2 ? hex('#5a5e78') : hex('#4a4e68')); if ((y % 6) === 0) R.pset(x, y, hex('#2a2c40')); continue; }
    const tabla = Math.floor((x - x0) / 9), u = (x - x0) % 9;
    let c = u === 0 ? ROBLE[3] : u === 1 ? ROBLE[0] : hh(tabla, Math.floor(y / 3), 9) < 0.15 ? ROBLE[2] : ROBLE[1];
    R.pset(x, y, c);
  }
  // los herrajes: dos bisagras largas con clavos
  for (const yb of [y0 + rx + 10, y1 - 26]) { R.rect(x0, yb, x1 - 10, yb + 2, HIERRO); R.rect(x0, yb, x1 - 10, yb, hex('#5a5a6a')); for (let x = x0 + 3; x < x1 - 10; x += 7) R.pset(x, yb + 1, hex('#8a8a9a')); elipse(x1 - 10, yb + 1, 2.5, 2.5, HIERRO); }
  // la aldaba
  elipse(x1 - 9, y0 + rx + 52, 3, 3, HIERRO); R.pset(x1 - 10, y0 + rx + 51, hex('#8a8a9a'));
}
// el aviso, a escala grande y redibujado fino: pergamino clavado con el acebo y la cruz roja encima
function aviso(cx, y0, w, h) {
  const x0 = Math.round(cx - w / 2), x1 = x0 + w, y1 = y0 + h;
  // la sombra
  R.rect(x0 + 2, y0 + 2, x1 + 2, y1 + 2, hex('#140c08'));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const borde = x === x0 || x === x1 || y === y0 || y === y1;
    const curl = (x - x0 + y1 - y) < 5;
    if (curl) continue;
    R.pset(x, y, borde ? hex('#2a1a10') : hh(x >> 1, y >> 1, 3) < 0.12 ? hex('#e2d2a8') : y > y1 - 4 ? hex('#d8c494') : hex('#f4e8c6'));
  }
  // la esquina doblada
  for (let k = 0; k < 5; k++) for (let j = 0; j <= k; j++) R.pset(x0 + j, y1 - 4 + k - j + j, hex('#c8b080'));
  // el clavo
  elipse(cx, y0 + 3, 1.6, 1.6, hex('#4a4a5a')); R.pset(Math.round(cx) - 1, y0 + 2, hex('#c8c8d8'));
  // el acebo: dos hojas con pinchos y tres bayas
  const hy = y0 + h * 0.55;
  for (const lado of [-1, 1]) {
    for (let u = 0; u <= 1; u += 0.02) { const x = cx + lado * (2 + u * w * 0.36), y = hy - u * 5, r = Math.sin(u * Math.PI) * 5.5 + 0.6; for (let v = -r; v <= r; v += 0.5) { const yy = Math.round(y + v), xx = Math.round(x); R.pset(xx, yy, v < -r + 1.2 || v > r - 1.2 ? hex('#0e3a1a') : v < 0 ? hex('#3a9a4a') : hex('#1e6a32')); } }
    for (let k = 1; k <= 3; k++) { const u = k / 4, x = cx + lado * (2 + u * w * 0.36), y = hy - u * 5, r = Math.sin(u * Math.PI) * 5.5 + 1.8; R.pset(Math.round(x), Math.round(y - r), hex('#0e3a1a')); R.pset(Math.round(x), Math.round(y + r), hex('#0e3a1a')); }
  }
  for (const [i, j] of [[-2.5, 1.5], [2.5, 1.5], [0, -1.5]]) { elipse(cx + i, hy + j + 3, 2.6, 2.6, hex('#4a0a10')); elipse(cx + i, hy + j + 3, 2, 2, hex('#d8202a')); R.pset(Math.round(cx + i - 1), Math.round(hy + j + 2), hex('#ffb0a0')); }
  // la cruz roja que lo tacha
  const m = 5;
  for (const [c, r] of [[hex('#3a0608'), 2.6], [hex('#e8282a'), 1.6]]) { trazo(x0 + m, y0 + m + 3, x1 - m, y1 - m, r, c); trazo(x1 - m, y0 + m + 3, x0 + m, y1 - m, r, c); }
}

// ── la multa grande con su «5» ──
function multa(x0, y0, w, h) {
  const x1 = x0 + w, y1 = y0 + h;
  R.rect(x0 + 2, y0 + 2, x1 + 2, y1 + 2, hex('#140c08'));
  R.rect(x0 - 1, y0 - 1, x1 + 1, y1 + 1, K);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) R.pset(x, y, hh(x >> 1, y >> 1, 4) < 0.1 ? hex('#e8dcb8') : hex('#fbf4dc'));
  R.rect(x0 + 3, y0 + 3, x1 - 3, y0 + 3, hex('#9a8a6a')); R.rect(x0 + 3, y0 + 6, x1 - 8, y0 + 6, hex('#9a8a6a'));
  // el sello de lacre
  elipse(x1 - 6, y1 - 6, 4, 4, hex('#5a0a10')); elipse(x1 - 6, y1 - 6, 3, 3, hex('#c8202a')); R.pset(x1 - 7, y1 - 8, hex('#ff8a7a'));
}

const corte = (y) => 196 + Math.round((90 - y) * 0.16);
const SA = { s: 3, dx: 104, dy: 84, bx: [12, 42, 38, 70] }, AL = { s: 3, dx: 0, dy: 84, bx: [16, 42, 38, 70] };
const enSanta = (px, py) => [SA.dx + (px - SA.bx[0]) * SA.s, SA.dy + (py - SA.bx[2]) * SA.s];
const enAlg = (px, py) => [AL.dx + (px - AL.bx[0]) * AL.s, AL.dy + (py - AL.bx[2]) * AL.s];
const PIEL = hex('#f6c290'), PIELS = hex('#d8946a'), BARBA = [hex('#ffffff'), hex('#e6eaf4'), hex('#b8c0d4')], ROJO = [hex('#ff5a4a'), hex('#d8282a'), hex('#8a1420')];

// la cara de Santa a escala grande: ojos de sorpresa con su brillo, cejas blancas alzadas, mofletes, nariz redonda, el
// bigote y la boca abierta en O dentro de la barba
function caraSanta() {
  const [fx0, fy0] = enSanta(21, 49), [fx1, fy1] = enSanta(30, 54);
  // la piel limpia (quita los ojos y la boca de bloque)
  R.rect(fx0, fy0 + 1, fx1 - 1, fy1 - 1, PIEL); R.rect(fx1 - 1, fy0 + 1, fx1 + 2, fy1 - 1, PIELS);
  // la barba redondeada que cubre de la mejilla a la barbilla
  const bx = fx0 + 13, by = fy1 + 6;
  for (let y = fy1 - 4; y <= fy1 + 16; y++) for (let x = fx0 - 1; x <= fx1 + 8; x++) { const d = Math.hypot((x - bx) / 17, (y - by) / 11); if (d <= 1 && y >= fy1 - 2) R.pset(x, y, d > 0.88 ? BARBA[2] : (hh(x >> 1, y >> 1, 7) < 0.25 || (x + y * 2) % 7 === 0) ? BARBA[1] : BARBA[0]); }
  // los mofletes
  elipse(fx0 + 3, fy1 - 4, 3, 2, hex('#f0907a')); elipse(fx0 + 25, fy1 - 4, 3, 2, hex('#f0907a'));
  // los ojos muy abiertos, mirando a la izquierda (a la multa)
  for (const ex of [fx0 + 7, fx0 + 19]) { const ey = fy0 + 6;
    elipse(ex, ey, 3.4, 4.4, K); elipse(ex, ey, 2.5, 3.5, hex('#ffffff'));
    elipse(ex - 1, ey + 0.5, 1.5, 2.2, hex('#1a1424')); R.pset(Math.round(ex) - 1, Math.round(ey) - 1, hex('#ffffff')); }
  // las cejas blancas alzadas
  for (const ex of [fx0 + 7, fx0 + 19]) for (let i = -4; i <= 4; i++) { const y = fy0 - 1 - Math.round(Math.cos(i / 4 * 1.2) * 2); R.rect(ex + i, y, ex + i, y + 1, BARBA[0]); R.pset(ex + i, y + 2, BARBA[2]); }
  // la nariz redonda
  elipse(fx0 + 13, fy1 - 2, 3, 2.6, hex('#f09a80')); R.pset(fx0 + 12, fy1 - 4, hex('#ffd8c0'));
  // el bigote: dos mechones que se curvan
  for (const lado of [-1, 1]) for (let i = 0; i <= 9; i++) { const x = fx0 + 13 + lado * (2 + i), y = fy1 + 1 + Math.round(Math.sin(i / 9 * Math.PI) * -1.5 + i * 0.25); elipse(x, y, 1.6, 1.8, BARBA[0]); R.pset(x, y + 2, BARBA[2]); }
  // la boca abierta en O
  const mx = fx0 + 13, my = fy1 + 7;
  elipse(mx, my, 3.4, 4.2, K); elipse(mx, my, 2.5, 3.3, hex('#5a0e18')); elipse(mx, my + 1.6, 1.8, 1.4, hex('#d8485a'));
}
// los brazos de Santa, arriba, a resolución de lienzo: manga roja con su sombra, el puño de piel blanca y el guante
function brazoSanta(sx, sy, ex, ey, hx, hy, lado) {
  // la manga en dos tramos (hombro-codo y codo-muñeca), con su luz y su sombra
  for (const [a, b, c, d] of [[sx, sy, ex, ey], [ex, ey, hx, hy + 6]]) trazo(a, b, c, d, 5.4, K);
  for (const [a, b, c, d] of [[sx, sy, ex, ey], [ex, ey, hx, hy + 6]]) trazo(a, b, c, d, 4.3, ROJO[1]);
  for (const [a, b, c, d] of [[sx, sy, ex, ey], [ex, ey, hx, hy + 6]]) trazo(a + lado * 1.6, b - 1, c + lado * 1.6, d - 1, 1.3, ROJO[0]);
  for (const [a, b, c, d] of [[sx, sy, ex, ey], [ex, ey, hx, hy + 6]]) trazo(a - lado * 2.4, b + 1.5, c - lado * 2.4, d + 1, 1, ROJO[2]);
  // el puño de piel blanca
  elipse(hx, hy + 7, 6, 3.8, K); elipse(hx, hy + 7, 5, 2.8, BARBA[0]); R.rect(Math.round(hx) - 4, Math.round(hy) + 8, Math.round(hx) + 4, Math.round(hy) + 8, BARBA[2]);
  // el guante blanco con los dedos abiertos (palma hacia delante)
  const G = BARBA[0], g = BARBA[2];
  const dedos = [[-2.25, 6.5], [-1.85, 7.5], [-1.45, 7.5], [-1.05, 6.2]];
  for (const [a, l] of dedos) { const aa = lado > 0 ? a : -Math.PI - a; trazo(hx, hy, hx + Math.cos(aa) * l, hy + Math.sin(aa) * l, 1.9, K); }
  { const aa = lado > 0 ? -0.2 : Math.PI + 0.2; trazo(hx, hy + 1, hx + Math.cos(aa) * 6, hy + 1 + Math.sin(aa) * 6, 1.9, K); }
  elipse(hx, hy + 1, 4.6, 4.4, K);
  for (const [a, l] of dedos) { const aa = lado > 0 ? a : -Math.PI - a; trazo(hx, hy, hx + Math.cos(aa) * l, hy + Math.sin(aa) * l, 0.95, G); }
  { const aa = lado > 0 ? -0.2 : Math.PI + 0.2; trazo(hx, hy + 1, hx + Math.cos(aa) * 6, hy + 1 + Math.sin(aa) * 6, 0.95, G); }
  elipse(hx, hy + 1, 3.6, 3.4, G); R.pset(Math.round(hx) + lado, Math.round(hy) + 3, g); R.pset(Math.round(hx), Math.round(hy) + 3, g);
}
// la cara de la galleta a escala grande: ojos redondos de susto con su brillo y la boca en O
function caraGalleta(x, y, s) {
  const x0 = Math.round(x - 13 * s / 2), y0 = Math.round(y - 17 * s), J = hex('#c07a3a');
  // la cabeza, redonda de verdad, con su brillo
  const hx = x0 + 6.5 * s, hy = y0 + 4.2 * s;
  elipse(hx, hy, 3.9 * s + 1, 3.9 * s + 1, K); elipse(hx, hy, 3.9 * s, 3.9 * s, J);
  for (let y = Math.floor(hy - 3.9 * s); y <= hy + 3.9 * s; y++) for (let x = Math.floor(hx - 3.9 * s); x <= hx + 3.9 * s; x++) { const d = Math.hypot(x + 0.5 - hx, y + 0.5 - hy) / (3.9 * s); if (d <= 1 && d > 0.78 && (x - hx) + (y - hy) > 4) R.pset(x, y, hex('#8a4e22')); }
  R.rect(Math.round(hx) - 7, Math.round(hy) - 9, Math.round(hx) - 5, Math.round(hy) - 8, hex('#e0a060')); R.pset(Math.round(hx) - 8, Math.round(hy) - 7, hex('#e0a060'));
  // el glaseado de la cabeza: una raya ondulada arriba
  for (let i = -6; i <= 6; i++) R.pset(Math.round(hx) + i, Math.round(hy) - 8 + Math.round(Math.sin(i * 1.2)), hex('#f8f4ec'));
  for (const ex of [x0 + 4.9 * s, x0 + 8.1 * s]) { const ey = y0 + 3.6 * s; elipse(ex, ey, 3.3, 3.9, K); elipse(ex, ey, 2.4, 3, hex('#ffffff')); elipse(ex, ey + 0.8, 1.2, 1.6, K); }
  const mx = x0 + 6.5 * s, my = y0 + 6.3 * s; elipse(mx, my, 2.2, 2.8, K); elipse(mx, my + 0.4, 1.3, 1.8, hex('#7a2026'));
  elipse(x0 + 3.4 * s, y0 + 5.4 * s, 1.8, 1.1, hex('#e88a6a')); elipse(x0 + 9.6 * s, y0 + 5.4 * s, 1.8, 1.1, hex('#e88a6a'));
}
// la cara del alguacil: ojos pequeños y severos, cejas grises fruncidas, el bigote canoso y la boca torcida
function caraAlguacil() {
  const [fx0, fy0] = enAlg(24, 49), [fx1, fy1] = enAlg(33, 56);
  R.rect(fx0, fy0, fx1 - 1, fy1 - 4, PIEL);
  R.rect(fx0, fy0, fx1 - 1, fy0 + 1, hex('#e0a878'));
  for (const ex of [fx0 + 13, fx0 + 25]) { const ey = fy0 + 9;
    elipse(ex, ey, 1.8, 2.4, hex('#1a1424')); R.pset(ex, ey - 1, hex('#ffffff'));
    // la ceja gris, gruesa y fruncida hacia la nariz
    for (let i = -4; i <= 3; i++) { const y = ey - 5 + Math.round(i * 0.45); R.rect(ex + i, y, ex + i, y + 1, hex('#8c8ca0')); R.pset(ex + i, y - 1, hex('#5a5a6a')); } }
  // la nariz
  R.rect(fx0 + 28, fy0 + 11, fx0 + 30, fy0 + 14, PIELS); R.pset(fx0 + 30, fy0 + 15, PIELS);
  // el bigote canoso
  for (let i = 0; i <= 12; i++) { const x = fx0 + 18 + i, y = fy0 + 16 + Math.round(Math.abs(i - 7) * 0.3); elipse(x, y, 1.3, 1.5, hex('#a8acbc')); }
  R.rect(fx0 + 19, fy0 + 18, fx0 + 29, fy0 + 18, hex('#6a6a7a'));
  // la boca, una raya severa
  R.rect(fx0 + 21, fy0 + 20, fx0 + 27, fy0 + 20, hex('#7a3a2a'));
}

const dibujar = (t) => {
  // los dos decorados, cada uno en su búfer
  R.usar(izq); T.siglo17(R, t, { encuadre: 'canterbury', nieve: 0.6 });
  R.usar(der); T.hoy(R, t, { encuadre: 'salon' });
  R.usar(null);
  const B = R.buf, DXI = 40, DXD = -150;
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) {
    if (x < corte(y)) { const sx = Math.min(319, x + DXI); const c = izq[y * 320 + sx];
      // la noche de invierno: todo hacia el azul noche (más arriba), la nieve se queda clara y azulada
      const l = ((c & 255) + ((c >>> 8) & 255) + ((c >>> 16) & 255)) / 765;
      B[y * 320 + x] = l > 0.84 && y > 40 ? mezcla(hex('#b8c8ec'), c, 0.75) : mezcla(hex('#081030'), c, 0.5 + 0.35 * (1 - y / 180));
      continue; }
    const sx = x + DXD; B[y * 320 + x] = der[y * 320 + (sx < 0 ? -sx : sx)];
  }
  // las estrellas del cielo de noche
  for (let k = 0; k < 40; k++) { const x = Math.floor(hh(k, 1, 11) * 190), y = Math.floor(hh(k, 2, 11) * 70); if (x < corte(y) - 3 && B[y * 320 + x] !== undefined) { const c = B[y * 320 + x], l = ((c & 255) + ((c >>> 8) & 255) + ((c >>> 16) & 255)) / 765; if (l < 0.3) R.pset(x, y, k % 5 ? hex('#8a9ad8') : hex('#ffffff')); } }

  // la puerta de roble con el aviso, detrás del alguacil, y el farol que la alumbra
  puerta(8, 64, 26, 179);
  brillo(36, 60, 40, hex('#ffc870'), 0.35);
  aviso(36, 32, 44, 46);

  // el alguacil, al triple, sin el bastón, con su brazo tendiendo la multa
  actorGrande(EL.alguacil, { dir: 1, sinObjeto: true }, AL.bx, AL.dx, AL.dy, AL.s, hex('#a8b8e8'));
  caraAlguacil();
  // el brazo: hombro, codo y mano, con el filo claro del contorno, la manga de paño y el puño blanco
  const PANO = hex('#3a2e2a'), FILO = hex('#a8b8e8'), BR = [[57, 148, 71, 144], [71, 144, 84, 131]];
  for (const [a, b, c, d] of BR) trazo(a, b, c, d, 6, FILO);
