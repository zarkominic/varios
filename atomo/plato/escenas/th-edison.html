<script type="module">
// TH-EDISON (frase 9). Cuatro planos:
// 1. el rincón de I+D en penumbra, de cerca: la pared de ladrillo pintado de blanco con algún desconchón; la ventana de
//    hierro por la que entra la luz de la mañana de California (cielo con resol, una nube y dos pájaros que pasan, los
//    montes azulados, las colinas doradas con encinas, la carretera con dos coches, un eucalipto y una palmera que se
//    mecen) y deja un haz de sol con motas sobre el banco; la pizarra con los esquemas del invento sin letras (gota →
//    cartucho → caja → gráfica, la curva con un punto que no encaja y su «?»), notas adhesivas y rotuladores; las baldas
//    con archivadores, la caja de guantes, el estaño, el router con sus leds, cartuchos de prueba, el tarro de tornillos y
//    un poto que cuelga; el reloj; el tablero perforado con herramientas, rollos de cable, gafas y la regleta con su cable
//    del techo; en el banco de madera, el osciloscopio con su onda, la placa verde con su led, el prototipo desmontado
//    (el cabezal de la pipeta va de pocillo en pocillo y baja), el flexo rojo encendido sobre un cartucho abierto y la
//    taza de café que humea; debajo, en sombra, el ordenador con sus luces, la caja de piezas, la caja de herramientas,
//    la papelera y la regleta; por la puerta de cristal (con su señal de prohibido el paso) se ve el laboratorio grande
//    iluminado, donde alguien pequeño cruza al fondo. Una mano con bata tira de la sábana y descubre la caja Edison
//    («called the Edison»), cuya pantalla brilla en la penumbra; el aire de la sábana arranca una nota rosa de la pizarra,
//    que cae revoloteando por detrás de la caja; luego la mano tira de la cadenita de la bombilla de filamento que cuelga
//    encima y se enciende («light bulb»): destello, la sala se llena de luz cálida, la bombilla se mece, flotan motas,
//    llega una polilla y el del fondo se vuelve, se sorprende y lo celebra con los brazos arriba;
// 2. la sede de cristal: una técnica hace funcionar la máquina, que saca un papel; entra un curioso de fuera, ella se
//    asusta y le echa la sábana encima («nobody … sees it work»); al curioso le queda un «?», el guardia llega y le
//    señala la salida, y en «everything is secret» bajan las persianas de todas las salas;
// 3. la firma: una mano trajeada da un toque en la línea, la empleada firma («sign confidentiality agreements») y cae
//    el sello rojo con el candado; al lado, el café humea y el reloj corre;
// 4. dos empleados de departamentos distintos (cada uno con su color de tarjeta) se acercan con sus carpetas; cuando
//    él empieza a hablar, una mampara de cristal se cierra entre los dos con cerrojo («don't talk to each other»); se
//    encogen de hombros y se van; un guardia patrulla por delante y otro pasa por detrás del cristal («guards in the
//    hallways»).
import * as T from '/atomo/plato/escenas/th-comun.js';
import { motas } from '/atomo/plato/escenas/ov-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('th-edison');
const { tramo, lerp, hex, clamp } = R;
const C = T.C;
const en = (k, f) => T.momento(M, k, f);
const a = (f) => en('edison', f);
const P2 = a(0.28), P3 = a(0.52), P4 = a(0.75);
const lin = (t, x, y) => clamp((t - x) / (y - x), 0, 1);
const entre = (t, x, y) => t >= x && t < y;
const brillo = (x, y, c = C.oroL) => { R.pset(x, y, c); R.pset(x + 1, y, c); R.pset(x - 1, y, c); R.pset(x, y + 1, c); R.pset(x, y - 1, c); };
const reloj = (x, y, r, t) => { R.disco(x, y, r + 1, C.k); R.disco(x, y, r, C.blanco); for (let k = 0; k < 12; k++) { const g = k * Math.PI / 6; R.pset(Math.round(x + Math.cos(g) * (r - 2)), Math.round(y + Math.sin(g) * (r - 2)), k % 3 ? C.grisL : C.k); }
  const ag = (g, l, c) => R.linea(x, y, Math.round(x + Math.sin(g) * l), Math.round(y - Math.cos(g) * l), c); ag(1.9, r - 5, C.k); ag(t * 0.2, r - 3, C.k); ag(Math.floor(t) * Math.PI / 30, r - 2, C.rojo); };
const polilla = (x, y, t) => { const ala = Math.floor(t * 16) % 2; R.pset(x, y, hex('#a89880')); R.pset(x - 1, y - ala, hex('#e8dcc8')); R.pset(x + 1, y - ala, hex('#e8dcc8')); R.pset(x - 2, y - ala, hex('#e8dcc8')); R.pset(x + 2, y - ala, hex('#e8dcc8')); };

// ── 1 · la Edison y la bombilla ────────────────────────────────────────────────────────────────────────────────
const quita = a(0.05), descubre = a(0.09), cadena = a(0.19), luz = a(0.215);
const BX = 160, BY = 130, BS = 1.4;
// la trama ordenada 4 × 4 (bordes de los haces de luz y del halo, sin ruido) y un azar fijo por posición
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], b4 = (x, y) => (B4[((y & 3) << 2) | (x & 3)] + 0.5) / 16;
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const paleta = (o) => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, hex(v)]));
const RI = paleta({
  // el techo, la pared de ladrillo pintado y sus desconchones
  techo: '#d2cec6', techoS: '#bcb8b0', moldura: '#e6e2da', molduraS: '#c6c0b4',
  ladrillo: '#ebe4d6', ladrilloB: '#e2dacb', ladrilloL: '#f6f1e8', llaga: '#cfc5b4', desconchon: '#c26a4e', desconchonS: '#94493a',
  // la ventana de hierro, el alféizar con el cactus y el paisaje de fuera
  marco: '#34403f', marcoL: '#566461', alfeizar: '#ddd7cb', alfeizarS: '#b6ae9f', maceta: '#c06a44', macetaS: '#8e4a2e', cactus: '#4a9a5a', cactusL: '#7cc486',
  cielo1: '#7cbcec', cielo2: '#9ed0f0', cielo3: '#c8e4ee', cielo4: '#f2e2b8', resol: '#fff6dc', nube: '#fbfcfd', nubeM: '#e8f0f6', nubeS: '#cddcea',
  monte: '#a6aec6', monteS: '#8e96b2', colina: '#dcb064', colinaS: '#c2964a', colinaL: '#eec880', encina: '#5a7838', encinaS: '#3e5a28',
  carretera: '#a09a90', coche: '#d04a3a', cocheA: '#3a6ab8', cristalC: '#bfe0f0', seto: '#4a7a3a', setoL: '#6a9a4a',
  euca: '#8aa88e', eucaS: '#6a8a72', eucaT: '#e2dacb', eucaTS: '#b8ae9c', palma: '#5a9a3a', palmaS: '#3a7028', palmaT: '#a88e6e', palmaTS: '#7a6a52',
  pajaro: '#2a2a36', reflejo: '#eef8fc',
  // la pizarra blanca, los rotuladores y las notas adhesivas
  pizarra: '#f8f8f3', pizarraS: '#e8eae3', alu: '#bcc2cc', aluS: '#8e95a2', aluL: '#dde2e8',
  azul: '#2a58b8', rojo: '#d03a3a', negro: '#2a2a34', verde: '#2a9a5a', celeste: '#a8c8f0',
  notaA: '#f8e070', notaAS: '#d4b444', notaR: '#f890b8', notaRS: '#cc6890',
  // las baldas y lo que hay en ellas
  balda: '#a4acb8', baldaS: '#727a88', baldaL: '#ccd2dc', etiqueta: '#eeeae0', guantes: '#4a7ad0', guantesL: '#7aa0e8', guante: '#9a7ae0',
  estano: '#9aa2b0', cobre: '#c87a3a', router: '#2e3440', routerL: '#454c5a', cartucho: '#f2f2ee', tarro: '#cfe4ea', tornillo: '#7a808c',
  hoja: '#4a9a4a', hojaL: '#78c068', macetaC: '#b86a48',
  // el tablero perforado, las herramientas, los cables y la regleta
  tablero: '#b9895a', tableroS: '#9a6e44', tableroL: '#d0a272', agujero: '#6e4a2c', mango: '#d84a3a', mangoA: '#e8c040', mangoZ: '#3a6ad0',
  acero: '#b8c0cc', aceroS: '#7a8290', cableR: '#c83a3a', cableRS: '#8e2626', cableA: '#3a6ad0', cableAS: '#2a4a98', gafas: '#c4e2ee', gafasS: '#8ab4c8',
  regleta: '#eeeef0', regletaS: '#c4c4cc', cable: '#2c2c34', cableL: '#4a4a56',
  // el banco de madera maciza y lo de debajo, en sombra
  madera: '#cf9c62', maderaS: '#a87843', maderaL: '#e8bc82', maderaV: '#bd8b54',
  bajo: '#625660', bajoS: '#4e4450', bajoL: '#72666e', suelo: '#564c52', pata: '#3e3a42', pataL: '#5e5a64',
  pc: '#d6cebb', pcS: '#aea490', pcL: '#ebe5d4', caja: '#c49658', cajaS: '#9c7038', cajaL: '#dab276', herr: '#c43a2a', herrS: '#8a281c', papelera: '#6a6e7a', bola: '#e4e0d6',
  // los aparatos del banco: el osciloscopio, la placa, el prototipo, el flexo y la taza
  osc: '#cfcabd', oscS: '#a8a294', oscL: '#e4e0d4', oscP: '#14241a', oscR: '#22402c',
  base: '#8a929e', baseL: '#aab2be', perfil: '#c8d0da', perfilS: '#8a94a2', motor: '#3a3e48', cabezal: '#e4e6ea', punta: '#f4f0e0',
  pcb: '#2a7a4a', pcbS: '#1c5434', pcbL: '#5ab47a', chip: '#24242c', pocillo: '#c8ccd4', canal: '#d86a7a',
  flexo: '#d0503a', flexoS: '#963826', flexoL: '#ee7c5c', muelle: '#9aa2ae', taza: '#3a8aa8', tazaS: '#2a6a84', cafe: '#4a2c1c', vapor: '#e6eaee',
  // la puerta de cristal y el laboratorio grande, al otro lado
  puerta: '#aeb6c2', puertaS: '#808896', puertaL: '#d4dae2', fPared: '#e4eef0', fTecho: '#d4e0e4', fTubo: '#fbfeff', fBrillo: '#eef6f8',
  fMueble: '#eef4f6', fMuebleS: '#bccbd2', fMesa: '#9aaab2', fPant: '#4a8ab8', fPantL: '#8ac4e8', fSuelo: '#c4d2d6', fSueloS: '#b2c2c6', fSueloL: '#dae6ea',
  // lo que tiene luz propia y no se oscurece en la penumbra: los leds, la onda del osciloscopio, la bombilla del flexo
  ledV: '#6cff8a', ledR: '#ff5442', ledA: '#ffc23a', ledAz: '#5ab4ff', traza: '#8affb0', flexoLuz: '#fff3c4', mota: '#fff0c4',
});
const MANGA = '#f4f4f8', PUNO = hex('#d4d4dc');
// los colores que brillan solos (los leds, el osciloscopio, el flexo y, una vez descubierta, la pantalla de la Edison con su
// logotipo y su luz de estado) y los que se oscurecen aunque estén delante de un cristal (la mano con su manga, la sábana,
// los marcos, la barra y la señal de la puerta, el cactus del alféizar)
const BRILLAN = new Set([RI.ledV, RI.ledR, RI.ledA, RI.ledAz, RI.traza, RI.flexoLuz, hex('#3a6a8a'), hex('#4e86a8'), hex('#24425a'), hex('#2e5470'), hex('#6a9ab8'), hex('#8ad0f0'), C.tealT, C.tealTS, C.verdeT, C.verdeL, C.sangreL]);
const PARED = new Set([RI.ladrillo, RI.ladrilloB, RI.ladrilloL, RI.llaga, RI.tablero, RI.tableroS, RI.tableroL, RI.agujero, RI.alfeizar, RI.alfeizarS]);
const SE_OSCURECEN = new Set([hex(MANGA), PUNO, hex('#f6c290'), hex('#d48a5a'), C.k, hex('#ffffff'), hex('#f0f0f4'), hex('#dcdce6'), hex('#c8c8d4'),
  RI.marco, RI.marcoL, RI.puerta, RI.puertaS, RI.puertaL, C.rojo, C.blanco, RI.maceta, RI.macetaS, RI.cactus, RI.cactusL]);
// cifras diminutas de 3 × 5 (y el «?») para la pizarra
const DIG = { 0: ['###', '#.#', '#.#', '#.#', '###'], 1: ['.#.', '##.', '.#.', '.#.', '###'], 2: ['###', '..#', '###', '#..', '###'], 3: ['###', '..#', '.##', '..#', '###'],
  '%': ['#.#', '..#', '.#.', '#..', '#.#'], '?': ['##.', '..#', '.#.', '...', '.#.'] };
const cifras = (s, x, y, c) => { let cx = x; for (const ch of String(s)) { const g = DIG[ch]; if (g) for (let j = 0; j < 5; j++) for (let i = 0; i < 3; i++) if (g[j][i] === '#') R.pset(cx + i, y + j, c); cx += 4; } };

// las piezas del paisaje de la ventana (todas con pset y discos, así respetan el recorte del cristal)
const nubeV = (x, y, w) => { const B = [[0, 0, 0.3], [-0.3, 0.08, 0.22], [0.3, 0.06, 0.24], [-0.1, -0.14, 0.24]];
  for (const [dx, dy, r] of B) R.disco(x + dx * w, y + dy * w + 1, r * w, RI.nubeS); for (const [dx, dy, r] of B) R.disco(x + dx * w, y + dy * w, r * w, RI.nubeM); for (const [dx, dy, r] of B) R.disco(x + dx * w - 1, y + dy * w - 1, r * w * 0.7, RI.nube); };
const palmera = (x, suelo, alto, t) => { const m = Math.sin(t * 1.3) * 1.5;
  for (let j = 0; j <= alto; j++) { const u = j / alto, px = Math.round(x + Math.sin(u * 1.6) * 3 + m * u * u); R.pset(px, suelo - j, j % 3 ? RI.palmaT : RI.palmaTS); R.pset(px + 1, suelo - j, RI.palmaTS); }
  const tx = Math.round(x + Math.sin(1.6) * 3 + m), ty = suelo - alto;
  for (let f = 0; f < 7; f++) { const g = -Math.PI + f * Math.PI / 6 + Math.sin(t * 2 + f) * 0.1; for (let d = 1; d < 11; d++) R.pset(Math.round(tx + Math.cos(g) * d), Math.round(ty + Math.sin(g) * d * 0.6 + d * d / 20), d > 7 ? RI.palmaS : RI.palma); }
  R.disco(tx, ty + 1, 1.5, RI.palmaTS); };
const eucalipto = (x, suelo, t) => { const m = Math.round(Math.sin(t * 0.9));
  for (let j = 0; j < 24; j++) { const dx = j > 15 ? m : 0; R.pset(x + dx, suelo - j, RI.eucaT); R.pset(x + 1 + dx, suelo - j, RI.eucaTS); }
  R.linea(x, suelo - 14, x - 5, suelo - 20, RI.eucaTS); R.linea(x + 1, suelo - 17, x + 6, suelo - 24, RI.eucaTS);
  const copa = [[-5, -23, 5], [3, -28, 6], [-1, -34, 5], [7, -22, 4], [-8, -19, 3.5]];
  for (const [dx, dy, r] of copa) R.disco(x + dx + m, suelo + dy + 1, r, RI.eucaS); for (const [dx, dy, r] of copa) R.disco(x + dx + m - 0.6, suelo + dy - 0.6, r - 1.2, RI.euca);
  for (let k = 0; k < 6; k++) if (Math.sin(t * 3 + k * 1.9) > 0.4) R.pset(x - 6 + k * 3 + m, suelo - 26 - (k % 3) * 4, RI.nubeS); };
const coche = (x, y, col, dir) => { for (let i = 0; i < 6; i++) R.pset(x + i, y, col); for (let i = 1; i < 5; i++) R.pset(x + i, y - 1, col); R.pset(x + (dir > 0 ? 3 : 2), y - 1, RI.cristalC); R.pset(x + 1, y + 1, RI.pajaro); R.pset(x + 4, y + 1, RI.pajaro); };

// el rincón de I+D, de cerca: todo lo que no depende de la acción
const rincon = (t) => {
  const { rect, pset, disco, linea, poligono, anillo } = R;
  // el techo con su moldura y la pared de ladrillo pintado de blanco: hiladas de 6 px a soga, cada ladrillo con su tono y el
  // canto de arriba con luz; algún desconchón deja ver el ladrillo rojo
  rect(0, 0, 319, 179, RI.ladrillo);
  rect(0, 0, 319, 6, RI.techo); rect(0, 7, 319, 7, RI.techoS); rect(0, 8, 319, 9, RI.moldura); rect(0, 10, 319, 10, RI.molduraS);
  for (let f = 0; f < 13; f++) { const y = 11 + f * 6; rect(0, y + 5, 319, y + 5, RI.llaga);
    for (let x = (f % 2) * 8 - 8; x < 320; x += 16) { rect(x + 15, y, x + 15, y + 4, RI.llaga); const v = hh(x, f, 3); if (v > 0.62) rect(x, y, x + 14, y + 4, RI.ladrilloB); if (v < 0.3) rect(x + 1, y, x + 13, y, RI.ladrilloL); } }
  for (const [x, y] of [[164, 60], [202, 24], [248, 80]]) { rect(x + 1, y, x + 4, y, RI.desconchon); rect(x, y + 1, x + 5, y + 1, RI.desconchon); rect(x + 1, y + 2, x + 3, y + 2, RI.desconchon); pset(x + 2, y + 1, RI.desconchonS); pset(x + 4, y + 1, RI.llaga); rect(x + 1, y + 3, x + 3, y + 3, RI.ladrilloL); }

  // la ventana de hierro (tres por tres cristales) con la mañana de California: el cielo con el resol, una nube y dos
  // pájaros que pasan, los montes azulados de Santa Cruz, las colinas doradas con sus encinas, la carretera con un coche
  // en cada sentido, el seto, un eucalipto y una palmera que se mecen
  R.recorte([9, 25, 73, 77]);
  const banda = (y) => y < 36 ? RI.cielo1 : y < 45 ? RI.cielo2 : y < 52 ? RI.cielo3 : RI.cielo4;
  for (let y = 25; y <= 77; y++) rect(9, y, 73, y, banda(y));
  for (const yb of [36, 45, 52]) for (let x = 9 + (yb % 2); x <= 73; x += 2) pset(x, yb, banda(yb - 1));
  disco(9, 25, 6, RI.resol); for (let y = 25; y < 40; y++) for (let x = 9; x < 24; x++) { const d = Math.hypot(x - 9, y - 25); if (d > 6 && b4(x, y) < 0.55 * (1 - (d - 6) / 8)) pset(x, y, RI.resol); }
  nubeV(9 - 20 + ((t * 2.4 + 26) % 104), 34, 15);
  { const u = (t % 9) / 9, bx = Math.round(2 + u * 84), by = Math.round(32 + Math.sin(t * 1.5) * 2);
    for (const [ox, oy] of [[0, 0], [-6, 3]]) { const al = Math.sin(t * 12 + ox) > 0; pset(bx + ox, by + oy, RI.pajaro); pset(bx + ox - 1, by + oy - (al ? 1 : 0), RI.pajaro); pset(bx + ox + 1, by + oy - (al ? 1 : 0), RI.pajaro); } }
  poligono([[9, 55], [18, 50], [30, 53], [44, 48], [58, 52], [74, 49], [74, 78], [9, 78]], RI.monte);
  poligono([[44, 48], [58, 52], [74, 49], [74, 56], [56, 55]], RI.monteS); poligono([[9, 55], [18, 50], [24, 52], [12, 57]], RI.monteS);
  const lomas = [[9, 62], [22, 57], [38, 61], [54, 56], [74, 60]];
  poligono([...lomas, [74, 78], [9, 78]], RI.colina); poligono([[22, 57], [38, 61], [54, 56], [46, 62], [30, 64]], RI.colinaS); poligono([[54, 56], [74, 60], [74, 65], [62, 62]], RI.colinaS);
  for (let k = 0; k + 1 < lomas.length; k++) if (lomas[k + 1][1] < lomas[k][1]) linea(lomas[k][0], lomas[k][1], lomas[k + 1][0], lomas[k + 1][1], RI.colinaL);
  for (const [x, y] of [[14, 62], [19, 60], [33, 62], [47, 60], [51, 59], [64, 60], [28, 65], [58, 65], [42, 66], [69, 63]]) { disco(x, y + 0.6, 1.6, RI.encinaS); disco(x - 0.4, y, 1.1, RI.encina); }
  rect(9, 69, 73, 70, RI.carretera); for (let x = 11; x < 74; x += 6) pset(x, 69, RI.cielo4);
  coche(Math.round(-4 + (((t + 1) / 6) % 1) * 84), 68, RI.coche, 1); coche(Math.round(80 - (((t + 3.2) / 7.5) % 1) * 90), 70, RI.cocheA, -1);
  for (let x = 9; x <= 73; x++) { const hy = 73 + Math.round(Math.sin(x * 0.9) + hh(x, 1, 5)); for (let y = hy; y <= 77; y++) pset(x, y, y === hy ? RI.setoL : RI.seto); }
  eucalipto(16, 77, t); palmera(63, 77, 36, t);
  R.recorte(null);
  for (const [x0, y0, l] of [[56, 40, 10], [59, 41, 6], [33, 76, 8]]) linea(x0, y0, x0 + l, y0 - l, (x, y, k) => (k % 4 < 3 ? RI.reflejo : null));
  rect(6, 22, 76, 24, RI.marco); rect(6, 22, 8, 80, RI.marco); rect(74, 22, 76, 80, RI.marco); rect(6, 78, 76, 80, RI.marco);
  rect(30, 25, 31, 77, RI.marco); rect(52, 25, 53, 77, RI.marco); rect(9, 42, 73, 42, RI.marco); rect(9, 60, 73, 60, RI.marco);
  rect(6, 22, 76, 22, RI.marcoL); rect(6, 22, 6, 80, RI.marcoL); rect(31, 25, 31, 77, RI.marcoL); rect(53, 25, 53, 77, RI.marcoL); rect(40, 59, 43, 61, RI.marcoL); pset(41, 60, RI.marco);
