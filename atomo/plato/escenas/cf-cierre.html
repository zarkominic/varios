// CF-CIERRE (frase 30), sin cartela. Tres planos:
// 1. (1981) un parque al anochecer, con el estanque y la ciudad al fondo: el editor echa dos paladas de tierra con una
//    pala a su escala (abre con una palada ya cargada; la hoja entra en la tierra, sube cargada y la vuelca en el montón), se apoya en ella, sonríe en
//    «solved too quickly» y, en «He got his wish», se va hacia el sendero con la pala en la mano mientras las farolas
//    se encienden a su paso;
// 2. (hoy) el estudio: en «nine boxes» los puntos del mapa de la pared parpadean bajo un 9 con su «?»; Atom trae volando
//    su cofrecito desde la ventana y lo posa sobre el hoyo de la maceta; la pala de juguete sube de un salto a ayudar;

//    brilla la lupa; en «or an excavator» llega por la mesa una excavadora de juguete y levanta la cuchara; Atom mira a
//    un lado y a otro: ya no se acuerda de dónde lo ha puesto («?»).
import * as T from '/atomo/plato/escenas/cf-comun.js';

const luz = (x0, y0, x1, y1, col, f) => { for (let y = Math.max(0, y0); y <= Math.min(179, y1); y++) for (let x = Math.max(0, x0); x <= Math.min(319, x1); x++) { const a = f(x, y); if (a > 0) R.pset(x, y, mez(R.pget(x, y), col, Math.min(1, a))); } };
// lo fijo de un plano, pintado una vez en una capa (VAC = transparente) y pegado en cada fotograma (f: tinte por punto)
const CAPAS = {};

const pajaro = (x, y, t, k, c) => { const a = Math.sin(t * 9 + k * 2) > 0 ? 1 : 0; x = Math.round(x); y = Math.round(y); R.pset(x, y, c); R.pset(x - 1, y - a, c); R.pset(x + 1, y - a, c); R.pset(x - 2, y - 2 * a + 1, c); R.pset(x + 2, y - 2 * a + 1, c); };
// Atom cuando baja de su esquina: el resplandor tramado y el átomo

// las posturas de la pala: [t, dx y dy de la mano respecto al editor, ángulo, g, carga]
const POSES = [[0, -5, -10, 198, 4, 1], [0.45, -5, -10, 200, 4, 1], [0.51, -5, -10, 170, 4, 0], [palmada[0] - 0.09, -5, -11, 208, 4, 0], [palmada[0], -5, -9, 150, 4, 0], [palmada[0] + 0.08, -5, -9, 144, 4, 1], [vuelca[1], -5, -10, 200, 4, 1], [vuelca[1] + 0.07, -5, -10, 170, 4, 0],
  [palmada[1] - 0.13, -5, -11, 208, 4, 0], [palmada[1], -5, -9, 150, 4, 0], [palmada[1] + 0.08, -5, -9, 144, 4, 1], [vuelca[2], -5, -10, 200, 4, 1], [vuelca[2] + 0.07, -5, -10, 170, 4, 0],
  [sonrie - 0.32, -5, -9, 160, 4, 0], [sonrie - 0.181, -5, -9, 172, 4, 0], [sonrie - 0.18, 19, -8, 8, 4, 0], [sonrie + 0.05, 19, -8, 35, 7, 0], [sale - 0.05, 19, -8, 35, 7, 0], [sale + 0.22, 18, -7, 14, 7, 0], [99, 18, -7, 14, 7, 0]];
const p1 = (t) => {
  pegar(capa('c1', fondoC));
  // las nubes del ocaso, de tres tonos y a tres velocidades (lejos de la esquina de Atom y de la barra), y una bandada
  for (const [x0, y, w, v] of [[40, 34, 40, 1.4], [150, 28, 30, 1], [210, 58, 44, 2.2], [90, 62, 26, 2.8], [10, 80, 34, 1.8]]) { const x = ((x0 + t * v) % 330) - 30; if (!(x > 240 && y < 52)) nube(x, y, w, [C1.n0, C1.n1, C1.n2]); }
  for (let k = 0; k < 5; k++) pajaro(250 - ((t * 9 + k * 6) % 300) + (k % 2) * 4, 50 + Math.abs(k - 2) * 4 + Math.sin(t * 1.5 + k) * 1.5, t, k, C1.ciuS);
  // las primeras estrellas
  for (let k = 0; k < 14; k++) { const x = Math.floor(hh(k, 1, 101) * 270), y = 16 + Math.floor(hh(k, 2, 101) * 22); if (Math.sin(t * 2 + k * 1.9) > 0.2) R.pset(x, y, BL); }
  // el agua del estanque: destellos, ondas y dos patos
  for (let k = 0; k < 9; k++) { const x = 40 + ((hh(k, 1, 102) * 90 + t * (3 + k % 3)) % 90), y = 107 + Math.floor(hh(k, 2, 102) * 12); R.rect(Math.round(x), y, Math.round(x) + 2 + (k % 3), y, k % 2 ? C1.s6 : C1.n0); }
  for (let k = 0; k < 2; k++) { const x = Math.round(60 + k * 34 + Math.sin(t * 0.5 + k * 2) * 12), y = 114 + k * 3; R.rect(x - 3, y, x + 3, y + 1, C1.ciuS); R.rect(x + 2, y - 2, x + 4, y - 1, C1.ciuS); R.pset(x + 5, y - 1, C1.s5); R.rect(x - 6, y + 2, x + 6, y + 2, C1.n0); }
  // las ventanas de la ciudad, que se encienden, y las hojas que caen del árbol
  for (let k = 0; k < 16; k++) { const x = Math.floor(hh(k, 3, 103) * 190), y = 76 + Math.floor(hh(k, 4, 103) * 20); if (t * 4 > k && R.pget(x, y) !== C1.sol && (R.pget(x, y) === C1.ciu || R.pget(x, y) === C1.ciuS)) R.pset(x, y, C1.vent); }
  for (let k = 0; k < 5; k++) { const q = (t * 0.22 + k / 5) % 1; R.pset(Math.round(20 + k * 14 + Math.sin(q * 8 + k) * 6 + q * 10), Math.round(70 + q * 84), k % 2 ? C1.hojaL : C1.s5); }
  // el editor cava de verdad: tres paladas (la primera ya viene cargada; en las otras dos la hoja entra en la tierra en cada «palmada», sube cargada y la vuelca sobre
  // el montón), se apoya en la pala, sonríe y se va hacia el sendero con ella en la mano
  const va = tramo(t, sale, P2 + 0.2), y = Math.round(lerp(160, 134, va)), x = Math.round(lerp(155, senda(y)[0] - 7, ease(cl(va * 1.5))));
  // las farolas se encienden a su paso

  if (t > vuelca[1] + 0.26) { R.rect(130, 153, 133, 154, C1.tierra); R.rect(131, 152, 132, 152, C1.tierraL); R.pset(133, 154, C1.tierraS); }
  if (t > vuelca[2] + 0.26) { R.rect(133, 154, 137, 155, C1.tierra); R.rect(134, 153, 136, 153, C1.tierraL); R.pset(137, 155, C1.tierraS); R.pset(129, 154, C1.tierraL); }
  let i = 0; while (i < POSES.length - 2 && t >= POSES[i + 1][0]) i++;
  const k0 = POSES[i], k1 = POSES[i + 1], u = ease(cl((t - k0[0]) / Math.max(0.001, k1[0] - k0[0]))), q = (j) => lerp(k0[j], k1[j], u);

  const a = R.actor(EL.preiss, x, y, t, { dir, anda: va > 0 && va < 1, sonrisa: t > sonrie, sostiene: [x + Math.round(q(1)), y + Math.round(q(2)) + bob], habla: t > sonrie + 0.5 && t < sale - 0.2 && Math.sin(t * 9) > 0.3 });

  const [mx, my] = a.mano, puño = []; for (let j = -1; j <= 1; j++) for (let ii = -1; ii <= 1; ii++) puño.push(R.pget(mx + ii, my + j));

  for (let j = -1; j <= 1; j++) for (let ii = -1; ii <= 1; ii++) R.pset(mx + ii, my + j, puño[(j + 1) * 3 + ii + 1]);
  // la hoja clavada queda medio tapada por la tierra, que salta al entrar
  for (const p of palmada) { if (Math.abs(t - p - 0.02) < 0.09) for (let j = 157; j <= 160; j++) for (let ii = -4; ii <= 4; ii++) if (hh(ii, j, 107) < 0.75) R.pset(punta[0] + ii, j, hh(ii, j, 108) < 0.3 ? C1.tierraL : j > 158 ? C1.tierraS : C1.tierra);
    if (t > p && t < p + 0.22) for (let k = 0; k < 2; k++) terron(punta[0], 157, punta[0] + 5 + k * 4, 160, (t - p) / 0.22, 3 + k, C1.tierraL, C1.tierraS); }
  for (const v of vuelca) if (t > v && t < v + 0.28) for (let k = 0; k < 3; k++) terron(135, 146, 130 + k * 3, 154, (t - v) / 0.28, 3 + k, k % 2 ? C1.tierra : C1.tierraL, C1.tierraS);
  // en «He got his wish», unas notas de silbido salen tras él
  if (t > wish) for (let k = 0; k < 2; k++) { const q = ((t - wish) * 0.9 + k * 0.5) % 1, nx = Math.round(x - 6 - q * 14), ny = Math.round(y - 30 - q * 12 + Math.sin(q * 8) * 2); R.rect(nx, ny, nx + 1, ny + 1, BL); R.rect(nx + 2, ny - 4, nx + 2, ny + 1, BL); R.pset(nx + 3, ny - 4, BL); }
  // las luciérnagas del primer término
  for (let k = 0; k < 9; k++) { const fx = 180 + hh(k, 1, 104) * 136 + Math.sin(t * 0.8 + k) * 8, fy = 132 + hh(k, 2, 104) * 42 + Math.sin(t * 1.3 + k * 2) * 4; if (Math.sin(t * 3 + k * 1.9) > 0) { R.pset(Math.round(fx), Math.round(fy), hex('#f4ff9a')); R.pset(Math.round(fx) + 1, Math.round(fy), hex('#b8d868')); } }
};

// ── 2 · el estudio: Atom trae su cofrecito ───────────────────────────────────────────────────────────────────
const nueve = wc(4.71), posa0 = wc(7.9), posa1 = wc(8.7), palaSalta = wc(8.9);
const p2 = (t) => {
  const o = { encuadre: 'estudio', hoyo: true, llave: true, pala: false };
  const g = T.hoy(R, t, o), [mx0, my0, mx1, my1] = g.mapa, [tx, ty] = g.tierra, [px0, py0] = g.pala;
  // «nine boxes are still waiting»: nueve puntos del mapa parpadean y, debajo, un 9 con su «?»
  { const q = tramo(t, nueve, nueve + 0.3), fin = 1 - tramo(t, wc(6.5), wc(6.9)); if (q > 0 && fin > 0) { for (let k = 0; k < 9; k++) { const x = mx0 + 8 + Math.floor(hh(k, 1, 80) * (mx1 - mx0 - 16)), y = my0 + 8 + Math.floor(hh(k, 2, 80) * (my1 - my0 - 16)); if ((k + Math.floor(t * 5)) % 3) { R.pset(x, y, hex('#ff5a4a')); R.pset(x + 1, y, hex('#ff5a4a')); R.pset(x, y - 1, OROL); } }
      const cx = (mx0 + mx1) >> 1, by = my1 + 22 - Math.round(Math.sin(q * Math.PI) * 4); R.rect(cx - 17, by - 14, cx + 17, by + 4, K); R.rect(cx - 16, by - 13, cx + 16, by + 3, hex('#fff6d8')); R.poligono([[cx - 3, by - 14], [cx, by - 19], [cx + 3, by - 14]], K); R.poligono([[cx - 2, by - 13], [cx, by - 17], [cx + 2, by - 13]], hex('#fff6d8'));
      R.numero('9', cx - 9, by, { color: hex('#c83a3a'), sombra: false }); R.icono('?', cx + 3, by - 9, hex('#c83a3a'), hex('#e8d8a8'), 1); } }
  // la pala de juguete: clavada en la mesa y, cuando llega el cofre, salta al borde de la maceta
  { const s = ease(tramo(t, palaSalta, palaSalta + 0.5)), x = Math.round(lerp(px0, tx + 16, s)), y = Math.round(lerp(py0, ty + 2, s) - Math.sin(s * Math.PI) * 16); R.rect(px0 - 4, py0 + 1, px0 + 4, py0 + 1, hex('#6a4424')); PZ.palaJuguete(R, x, y, {}); }
  T.hoyDelante(R, t, o);

  const baja = ease(tramo(t, P2, P2 + 0.7)), lleva = ease(tramo(t, P2 + 0.9, posa0)), posa = ease(tramo(t, posa0, posa1)), sube = ease(tramo(t, posa1 + 0.1, posa1 + 0.6));
  const ax = lerp(lerp(297, 108, baja), tx + 2, lleva), ay = lerp(lerp(lerp(24, 126, baja), ty - 46, lleva), ty - 30, posa) - sube * 14 + Math.sin(t * 2.6) * 2 - Math.sin(lleva * Math.PI) * 10;
  // el cofrecito: espera en el suelo junto al sillón, cuelga de Atom y queda posado sobre el hoyo
  { const cx = baja < 1 ? 108 : Math.round(sube > 0 ? tx + 2 : ax), cy = baja < 1 ? 158 : Math.round(sube > 0 ? ty + 3 : lerp(158, ay + 36, Math.min(1, lleva * 8)));
    if (baja >= 1 && sube <= 0) for (let k = 0; k < 5; k++) if ((k + Math.floor(t * 8)) % 2) { R.pset(Math.round(ax - 6), Math.round(ay + 12 + k * 3), hex('#c8f0ff')); R.pset(Math.round(ax + 6), Math.round(ay + 12 + k * 3), hex('#c8f0ff')); }
    PZ.cofre(R, cx, cy, {}); if (baja < 1) R.rect(cx - 12, cy + 1, cx + 12, cy + 1, hex('#7a5430')); }
  atomAbajo(ax, ay, t, { r: 12, e: lleva > 0 && posa < 1 ? 0.8 : 0.4 });
  if (posa >= 1 && t < posa1 + 0.5) chispas(tx + 2, ty - 8, t, 16, 8, OROL);
};

// ── 3 · gag 8: el cofrecito baja, la pala lo tapa, llega la excavadora de juguete… y Atom ya no sabe dónde está ─────
const baja0 = P3 + 0.1, baja1 = wc(10.6), tapa1 = wc(11.3), ojo = wc(10.28), exca = wc(11.2), olvido = wc(12.5);
const p3 = (t) => {
  const cof = ease(tramo(t, baja0, baja1)), tapa = tramo(t, baja1, tapa1);
  const o = { encuadre: 'estudio', camara: 'maceta', hoyo: true, cofre: Math.max(0.04, cof), tapa, pala: false };
  const g = T.hoy(R, t, o), [hx, hy] = g.hoyo;
  // la pala de juguete da golpecitos sobre la tierra mientras tapa, y luego se queda clavada en su sitio
  { const dando = tapa > 0 && tapa < 1, vuelve = ease(tramo(t, tapa1, tapa1 + 0.4)), gp = dando ? Math.abs(Math.sin((t - baja1) * Math.PI * 3)) : 0;
    const px = Math.round(lerp(hx + 40, g.pala[0], vuelve) - (dando ? 30 * tapa : 0)), py = Math.round(lerp(hy + 3, g.pala[1], vuelve) - 6 + gp * 10 - Math.sin(vuelve * Math.PI) * 12);
    PZ.palaJuguete(R, px, py, { s: 2 }); if (dando && gp > 0.85) for (let k = 0; k < 3; k++) R.pset(px - 8 + k * 8, hy - 4 - k % 2 * 2, hex('#7a5434')); }
  // «or an excavator»: la excavadora de juguete llega por la mesa y levanta la cuchara
  { const u = ease(tramo(t, exca - 0.35, exca + 0.55)); if (u > 0) { const x = Math.round(lerp(362, 284, u)), cu = 0.25 + 0.75 * ease(tramo(t, exca + 0.6, exca + 1.1)) - (t > exca + 1.2 ? 0.08 * (Math.sin((t - exca) * 6) + 1) : 0);
      R.rect(x - 28, g.mesa + 1, x + 28, g.mesa + 1, hex('#6a4424')); PZ.excavadora(R, x, g.mesa + (u < 1 ? Math.round(Math.sin(t * 30)) : 0), { dir: -1, cuchara: cu, t }); } }

    if (olv) { R.icono('?', Math.round(244 + lado), 40 - Math.round(bote), ORO, K, 2); for (let k = 0; k < 3; k++) { const q = tramo(t, olvido + 0.25 + k * 0.25, olvido + 0.6 + k * 0.25); if (q > 0) R.icono('?', [108, 150, 206][k], Math.round(hy - 12 - q * 8 - Math.sin(t * 4 + k) * 2), hex('#fff0c0'), K, 1); } } }
};
const efectos = [[palmada[0], 'golpecito'], [palmada[1], 'golpecito'], [seVa + 0.5, 'interruptor'], [nueve + 0.05, 'pop'], [P2 + 0.8, 'whoosh'], [posa1, 'toc'], [palaSalta + 0.1, 'boing'],
  [baja1, 'toc'], [baja1 + 0.33, 'golpecito'], [ojo, 'brillo'], [exca - 0.2, 'motor'], [olvido, 'boing']];
T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3]], { efectos, año: (t) => (t < P2 ? 1981 : 2026) });
