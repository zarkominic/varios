<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radar · ep10</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// OV-RADAR (frases 17–18), julio de 1952, cartela «1952». Siete planos:
// 1. el aeropuerto de Washington de noche: la torre con su faro que gira, la pista y un avión que aterriza;
// 2. la torre por dentro: el reloj marca casi la medianoche; el controlador vigila el radar y se sobresalta;
// 3. el radar de cerca, con el mapa de la ciudad dibujado en el cristal: aparecen siete puntos, uno a uno, sobre la Casa
//    Blanca y el Capitolio;
// 4. la base: dos cazas despegan de noche con la postcombustión encendida;
// 5. la ciudad: siete luces en el cielo; cuando llegan los cazas se apagan y, cuando se van, vuelven (el escondite); el
//    radar pequeño en la esquina dice lo mismo;
// 6. el calendario de mesa: la hoja pasa del 19 al 26 de julio, una semana después;
// 7. el radar de cerca otra vez, con los puntos de vuelta: el dedo del controlador golpea el cristal (gag).
import { preparar, rodar, primerT, torre, torreFuera, torreDetalle, radarCerca, baseCazas, calendarioMesa, washington, caza52, radar, C } from '/atomo/plato/escenas/ov-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await preparar('ov-radar');
const { tramo, lerp } = R;
const m = { r: M('radar', 1.5), c: M('cazas', 15.3) };
const P2 = 3.9, P3 = 7.6, P4 = 14.6, P5 = 18.4, P6 = 25.6, P7 = 27.8, aparecen = 7.6, sobresalto = 7.2;
const PTS = Array.from({ length: 7 }, (_, k) => [-1.2 + k * 0.22 + Math.sin(k * 3) * 0.08, 0.25 + ((k * 37) % 10) / 30]);
const visibles = (t) => PTS.slice(0, Math.max(0, Math.min(7, Math.floor((t - aparecen) * 2.8))));
// 1 · el aeropuerto
const aeropuerto = (t) => torreFuera(R, t, { avion: tramo(t, 0.4, P2) });
// 2 · la torre por dentro
const dentro = (t) => {
  torre(R, t, []); torreDetalle(R, t, { hora: -20 + (t - P2) * 0.2 });
  R.actor(EL.controlador, 182, 172, t, { dir: 1, sorpresa: t > sobresalto, habla: t < sobresalto && Math.sin(t * 5) > 0.5 });
  R.actor(EL.oficial, 104, 172, t + 3, { dir: 1, quieto: t < sobresalto, anda: false, dedo: t > sobresalto + 0.2 });
};
// 3 · el radar de cerca
const pantalla = (t) => radarCerca(R, t, visibles(t));
// 4 · los cazas despegan
const despegue = (t) => baseCazas(R, t, { u: tramo(t, P4 + 0.3, P5 - 0.2) });
// 5 · el escondite sobre la ciudad
const pasada1 = (t) => tramo(t, P5 + 0.3, P5 + 2.6), pasada2 = (t) => tramo(t, P5 + 4.6, P6 - 0.2);
const cerca = (t) => { const p = Math.max(pasada1(t) > 0 && pasada1(t) < 1 ? 1 - Math.abs(pasada1(t) - 0.5) * 2 : 0, pasada2(t) > 0 && pasada2(t) < 1 ? 1 - Math.abs(pasada2(t) - 0.5) * 2 : 0); return p > 0.15; };
const ciudad = (t) => {
  washington(R, t);
  if (!cerca(t)) PTS.forEach(([a, d], k) => { const x = Math.round(150 + Math.cos(a) * d * 120), y = Math.round(40 + Math.sin(a) * d * 40 + Math.sin(t * 2 + k) * 2); R.disco(x, y, 2, C.oroL); R.pset(x, y, C.blanco); if (Math.sin(t * 5 + k) > 0.6) { R.pset(x - 3, y, C.oroL); R.pset(x + 3, y, C.oroL); } });
  for (const [p, d] of [[pasada1(t), 1], [pasada2(t), -1]]) if (p > 0 && p < 1) { const x = d > 0 ? lerp(-30, 350, p) : lerp(350, -30, p); caza52(R, x, 56, t, { dir: d }); caza52(R, x - d * 26, 66, t, { dir: d }); }
  radar(R, 284, 146, 20, t, cerca(t) ? [] : PTS, { marco: false });
};
// 6 · una semana después
const semana = (t) => calendarioMesa(R, t, { de: 19, a: 26, pasa: tramo(t, P6 + 0.4, P6 + 1.2) });
// 7 · el golpecito
const golpe = (t) => radarCerca(R, t, PTS, { toca: tramo(t, P7 + 0.3, P7 + 1.9) });
const efectos = [
  [0.4, 'motor', { dur: P2 - 0.4 }], ...PTS.map((_, k) => [aparecen + (k + 1) / 2.8, 'bip']),
  [P4 + 0.3, 'jet', { pan: 0.4, dur: 3 }], [primerT((t) => pasada1(t) > 0, P5, E.duracion), 'jet', { pan: -1, dur: 3 }], [primerT((t) => pasada2(t) > 0, P5, E.duracion), 'jet', { pan: 1, dur: 3 }],
  [P6 + 0.4, 'papel'], ...[0, 0.4, 0.8, 1.2].map((d) => [P7 + 0.35 + d, 'toc']),
];
rodar(E, R, [[0, aeropuerto], [P2, dentro], [P3, pantalla], [P4, despegue], [P5, ciudad], [P6, semana], [P7, golpe]], { efectos, cartela: '1952', año: 1952 });
</script>
</body>
</html>
