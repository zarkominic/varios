<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radar · ep10</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// OV-RADAR (frases 17–18). D: la torre del aeropuerto de Washington de noche; en la pantalla verde aparecen siete puntos sobre la
// ciudad. Mandan cazas: cuando llegan, los puntos desaparecen; cuando se van, vuelven (escondite). El controlador da golpecitos
// a la pantalla (gag).
import { preparar, rodar, primerT, torre, washington, caza52, radar } from '/atomo/plato/escenas/ov-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await preparar('ov-radar');
const { tramo, lerp } = R;
const m = { r: M('radar', 1.5), c: M('cazas', 15.3) };
const PTS = Array.from({ length: 7 }, (_, k) => [-0.9 + k * 0.17 + Math.sin(k * 3) * 0.08, 0.35 + ((k * 37) % 10) / 22]);
const aparecen = m.r + 4.5;
const visibles = (t) => PTS.slice(0, Math.max(0, Math.min(7, Math.floor((t - aparecen) * 3))));
const pasada1 = (t) => tramo(t, m.c + 0.8, m.c + 5), pasada2 = (t) => tramo(t, m.c + 8.5, m.c + 12.5), golpes = E.duracion - 3.2;
const escondidos = (t) => (pasada1(t) > 0.15 && pasada1(t) < 0.95) || (pasada2(t) > 0.15 && pasada2(t) < 0.95);
const dentro = (t) => { torre(R, t, visibles(t)); R.actor(EL.controlador, 168, 172, t, { sorpresa: t > aparecen && t < aparecen + 3, habla: t > aparecen + 3 && Math.sin(t * 5) > 0.3 }); };
const fuera = (t) => {
  washington(R, t);
  for (const [p, d] of [[pasada1(t), 1], [pasada2(t), -1]]) if (p > 0 && p < 1) { const x = d > 0 ? lerp(-30, 350, p) : lerp(350, -30, p); caza52(R, x, 60, t, { dir: d }); caza52(R, x - d * 26, 70, t, { dir: d }); }
  radar(R, 284, 146, 20, t, escondidos(t) ? [] : PTS, { marco: false });
};
const golpecitos = (t) => { torre(R, t, PTS); R.actor(EL.controlador, 182, 172, t, { dedo: Math.floor((t - golpes) * 4) % 2 === 0, enfado: true }); };
const efectos = [
  ...PTS.map((_, k) => [aparecen + (k + 1) / 3, 'bip']),
  [primerT((t) => pasada1(t) > 0, m.c, E.duracion), 'jet', { pan: -1, dur: 3 }], [primerT((t) => pasada2(t) > 0, m.c, E.duracion), 'jet', { pan: 1, dur: 3 }],
  ...[0, 0.5, 1, 1.5].map((d) => [golpes + d + 0.05, 'toc']),
];
rodar(E, R, [[0, dentro], [m.c - 0.3, fuera], [golpes, golpecitos]], { efectos, cartela: '1952', año: 1952 });
</script>
</body>
</html>
