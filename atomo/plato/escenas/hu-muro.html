<script type="module">
// HU-MURO (frase 15), 1902–1911. Cuatro planos:
// 1. «What Galveston does next»: el muro frente al mar se termina: la grúa de vapor avanza con su cubo, un ingeniero
//    repasa el plano y señala el muro en «unbelievable», un obrero empuja su carretilla de arena y la vuelca en el
//    montón, que crece, y otro echa la arena a paladas; en «seventeen feet» la cota sube por la cara del muro y sale el
//    «17»; los tres paran, miran arriba y sonríen, el ingeniero vuelve a señalar y la pala sigue (el grupo de la arena
//    queda entre x 72 y 160, a la izquierda de la orilla por donde pasean la señora de la sombrilla y los demás);
// 2. «house by house, it jacks up»: la casa de la pareja de la foto sube sobre sus gatos de tornillo; el gag del perro:
//    dormía en el porche, se despierta («!») y sube sentado y muy tieso con la casa; sale la escalera nueva y baja por
//    ella muy digno, peldaño a peldaño, con el hocico arriba (a la escala de la casa, unos 10 px, como los obreros de los
//    gatos; el obrero del gato de la derecha se repinta delante de la escalera) y se sienta junto a la pasarela; él se
//    sujeta el sombrero y luego se ríe, ella se asombra, aplaude y señala al perro; «2,000» sale en «two thousand»;
// 3. «pumps sand from the harbor underneath»: de cerca y de lado, la draga de cortador ocupa dos tercios del cuadro (casco
//    de tablas forradas de chapa con remaches, escotillas de latón, óxido de los imbornales, defensas y ancla; la caseta
//    de tablas con las ventanas a la altura de las cabezas, el bote y la campana en el tejado; la chimenea con su humo
//    denso que se lleva el viento) y avanza unos 9 px hacia la izquierda: el capitán, dentro, se asoma a la primera
//    ventana y tira del cordón del silbato; en la popa gira el volante de la bomba con su biela (más deprisa en «pumps»)
//    y el marinero mueve la palanca y levanta la mano al ver la arena; otro marinero sale por la puerta y lleva un rollo
//    de cabo hasta el pórtico de proa, donde el torno enrolla el cable de la escala del cortador, que entra en el agua y
//    levanta fango. A la derecha, la punta del muro nuevo (testa curva, albardilla, verdín y escollera con su ola): la
//    tubería sale por la popa, flota sobre sus bidones, trepa por el muro y escupe el chorro de arena y agua sobre el
//    montón, que sube (de 3 a 14 px) junto a la estaca de nivel; dos obreros (del tamaño de la tripulación) lo extienden
//    a paladas y uno saluda al chorro. Cielo tramado con nubes de tres tonos a dos velocidades, cirros, pelícanos y
//    gaviotas que siguen a la draga;
// 4. «the city stands more than ten feet higher»: la misma calle de 1900 (la de hu-galveston), once años después, con
//    su tranvía y sus paseantes, y debajo de la acera el corte del terreno: el relleno de arena en tongadas con conchas,
//    la tubería nueva, y diez pies más abajo la acera vieja de ladrillo con su boca de riego, el pie del poste alargado,
//    el barro viejo y el agua del subsuelo, con un cangrejo en su galería y una lombriz; en «city» el lápiz marca el suelo
//    de antes a lo largo del corte y en «ten» sube la flecha «+10» hasta la acera de ahora; la pareja de la foto llega
//    por la acera con el perro digno delante y el mismo fotógrafo de 1900 los llama; posan, el perro se sienta, el
//    fotógrafo se mete bajo la tela y el destello cae en «before»: esta vez nadie se asusta (el perro ni se inmuta) y
//    sonríen; el humo sube. La barra del año queda tranquila: sin hilos del telégrafo, la punta del poste de x 104
//    cortada en y 21 y, detrás del «1911», el faldón de pizarra en sombra de la casa azul.
import * as T from '/atomo/plato/escenas/hu-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hu-muro');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const C = T.C;
const lin = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
const entre = (t, a, b) => t >= a && t < b;
const parpadeo = (t, v = 6) => Math.sin(t * v) > 0;
const hh = (a, b, k = 0) => { const s = Math.sin(a * 127.1 + b * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
// dónde lleva algo un personaje: la mano que cuelga (delante), la de atrás y la levantada (con dedo)
const enMano = (x, suelo, dir) => [dir > 0 ? x + 11 : x - 5, suelo - 9];
const manoAtras = (x, suelo, dir) => [dir > 0 ? x + 1 : x + 13, suelo - 8];
const manoArriba = (x, suelo, dir) => [dir > 0 ? x + 16 : x - 2, suelo - 19];
// recorrido por fotogramas clave [t, x, suelo]: dónde está, si anda y hacia dónde mira (null antes de empezar)
const ruta = (t, kf, desde = true) => {
  if (t < kf[0][0]) return desde ? null : { x: kf[0][1], s: kf[0][2], mv: false, d: Math.sign(kf[1][1] - kf[0][1]) || 1 };
  let d = 1; for (let i = 0; i + 1 < kf.length; i++) { const [t0, x0, s0] = kf[i], [t1, x1, s1] = kf[i + 1]; if (x1 !== x0) d = x1 < x0 ? -1 : 1;
    if (t < t1) { const u = (t - t0) / (t1 - t0); return { x: Math.round(lerp(x0, x1, u)), s: Math.round(lerp(s0, s1, u)), mv: x1 !== x0 || s1 !== s0, d }; } }
  const [, x, s] = kf[kf.length - 1]; return { x, s, mv: false, d };
};
// figura con contorno de 1 px: rectángulos [x0, y0, x1, y1, color]; el contorno envuelve a todos juntos
const figura = (rs) => {
  for (const [x0, y0, x1, y1] of rs) R.rect(Math.min(x0, x1) - 1, Math.min(y0, y1) - 1, Math.max(x0, x1) + 1, Math.max(y0, y1) + 1, C.k);
  for (const [x0, y0, x1, y1, c] of rs) if (c != null) R.rect(Math.min(x0, x1), Math.min(y0, y1), Math.max(x0, x1), Math.max(y0, y1), c);
};
// la sombrilla de 1900 en la mano de atrás (el mango no cruza la cara): media luna de 15 px a rayas con su festón
const sombrilla = (hx, hy, tela = hex('#f4eef0'), raya = hex('#e87a9a')) => {
  const cx = hx + 1, cy = hy - 20;
  R.linea(hx, hy, cx, cy, C.k);
  for (let i = -7; i <= 7; i++) { const a = Math.round(Math.sqrt(49 - i * i) * 0.6); R.rect(cx + i, cy - a, cx + i, cy, C.k); }
  for (let i = -6; i <= 6; i++) { const a = Math.round(Math.sqrt(49 - i * i) * 0.6) - 1; if (a > 0) R.rect(cx + i, cy - a, cx + i, cy - 1, Math.floor((i + 7) / 3) % 2 ? tela : raya); }
  for (let i = -7; i <= 7; i += 2) R.pset(cx + i, cy, Math.floor((i + 7) / 3) % 2 ? tela : raya);
  R.pset(cx, cy - 5, C.k); R.pset(cx - 2, cy - 3, C.blanco);
};
// el perro del gag, de lado y a la escala de los personajes (unos 18 × 17 px): o.dir, o.pose 'pie' | 'sentado' |
// 'tumbado', o.anda (patas alternas), o.digno (la cabeza y el hocico arriba, la cola tiesa), o.cabeza (−1: mira arriba)
const PERRO = { D: hex('#d89a4a'), s: hex('#a86a2a'), l: hex('#f0c070') };
const perrito = (x, suelo, t, o = {}) => {
  const d = o.dir ?? 1, X = (i) => Math.round(x + i * d), q = (a, b, j0, j1, c) => [Math.min(X(a), X(b)), Math.round(suelo + j0), Math.max(X(a), X(b)), Math.round(suelo + j1), c];
  const fill = (a, b, j0, j1, c) => { const r = q(a, b, j0, j1); R.rect(r[0], r[1], r[2], r[3], c); }, px = (i, j, c) => R.pset(X(i), Math.round(suelo + j), c);
  const { D, s, l } = PERRO, pose = o.pose ?? 'pie', cab = o.digno ? -2 : (o.cabeza ?? 0);
  if (pose === 'tumbado') {

    figura([q(-3, -1, -2, -1, D), q(0, 10, -5 + resp, -1, D), q(9, 14, -7, -2, D), q(14, 16, -4, -2, l)]);
    fill(1, 9, -1, -1, s); fill(9, 11, -7, -4, s); px(12, -5, C.k); px(13, -5, C.k); px(16, -4, C.k); fill(8, 8, -6, -3, C.rojo);

    fill(0, 3, -6, -2, s); fill(1, 5, -9, -9, l); fill(5, 6, -17 + cab, -13 + cab, s); px(9, -15 + cab, C.k); px(13, -14 + cab - (o.digno ? 1 : 0), C.k);

  }
  const paso = o.anda ? Math.floor(t * (o.digno ? 4 : 8)) % 2 : -1, alzo = o.digno ? 1 : 0;
  const pata = (a, alza) => q(a, a + 1, -4, alza ? -2 : -1, D);
  const cola = o.digno ? q(-2, -1, -14, -9, D) : (Math.sin(t * 14) > 0 ? q(-3, -2, -11, -8, D) : q(-4, -3, -10, -8, D));
  figura([cola, q(0, 9, -9, -4, D), pata(0, paso === 0), pata(3, paso === 1), pata(6, paso === 1), pata(8, paso === 0), q(8, 13, -14 + cab, -8 + cab, D), q(13, 16, -11 + cab - alzo, -9 + cab - alzo, l)]);
  fill(1, 8, -4, -4, s); fill(1, 7, -9, -9, l); fill(8, 10, -14 + cab, -10 + cab, s); px(12, -12 + cab, C.k); px(16, -11 + cab - alzo, C.k);
  fill(8, 9, -8 + Math.min(0, cab + 1), -7, C.rojo); px(9, -6, C.oroL);
};
// el mismo perro a la escala del término de la casa (unos 10 px, como los obreros de los gatos): mismas poses y opciones
const perroChico = (x, suelo, t, o = {}) => {
  const d = o.dir ?? 1, X = (i) => Math.round(x + i * d), q = (a, b, j0, j1, c) => [Math.min(X(a), X(b)), Math.round(suelo + j0), Math.max(X(a), X(b)), Math.round(suelo + j1), c];
  const px = (i, j, c) => R.pset(X(i), Math.round(suelo + j), c), { D, s, l } = PERRO, pose = o.pose ?? 'pie', cab = o.digno ? -1 : (o.cabeza ?? 0);
  if (pose === 'tumbado') {
    const resp = Math.sin(t * 2.2) > 0 ? 0 : 1;
    figura([q(-2, -1, -1, -1, D), q(0, 5, -3 + resp, -1, D), q(5, 7, -4, -1, D), q(8, 8, -2, -1, l)]);
    px(1, -1, s); px(3, -1, s); px(5, -4, s); px(7, -3, C.k); px(8, -2, C.k); px(4, -2, C.rojo);
    return;
  }
  if (pose === 'sentado') {
    figura([q(-2, -1, -1, -1, D), q(0, 3, -4, -1, D), q(2, 4, -7, -3, D), q(3, 6, -10 + cab, -7 + cab, D), q(7, 7, -8 + cab, -7 + cab, l), q(4, 4, -2, -1, D)]);
    px(0, -2, s); px(1, -2, s); px(3, -10 + cab, s); px(3, -9 + cab, s); px(5, -9 + cab, C.k); px(7, -8 + cab, C.k); px(3, -6, C.rojo); px(4, -6, C.rojo); px(4, -5, C.oroL);
    return;
  }
  const paso = o.anda ? Math.floor(t * (o.digno ? 4 : 8)) % 2 : -1, pata = (a, alza) => q(a, a, -2, alza ? -2 : -1, D);
  const cola = o.digno ? q(-1, -1, -8, -5, D) : (Math.sin(t * 14) > 0 ? q(-2, -1, -6, -5, D) : q(-2, -2, -6, -4, D));
  figura([cola, q(0, 5, -5, -3, D), pata(0, paso === 0), pata(2, paso === 1), pata(4, paso === 1), pata(5, paso === 0), q(5, 7, -8 + cab, -5 + cab, D), q(8, 8, -6 + cab, -5 + cab, l)]);
  px(1, -3, s); px(2, -3, s); px(3, -3, s); px(5, -8 + cab, s); px(7, -7 + cab, C.k); px(8, -6 + cab, C.k); px(5, -4, C.rojo);
};
// el obrero del gato de la derecha de la casa que sube (el de hu-comun, k = 3), repintado delante de la escalera nueva
// para que ni la escalera ni el perro se le monten encima
const obreroGato = (x, suelo, t) => {
  const X = (i) => Math.round(x - i), f = Math.sin(t * 3 + 3 * 1.3), inc = Math.round(f * 1.2), ropa = hex('#3a4a6a'), piel = hex('#e8b48a'), r = (a, b, y0, y1, c) => R.rect(Math.min(X(a), X(b)), y0, Math.max(X(a), X(b)), y1, c);
  r(0, 1, suelo - 4, suelo, ropa); R.pset(X(-1), suelo, C.k); R.pset(X(2), suelo, C.k);
  r(inc, 2 + inc, suelo - 9, suelo - 5, ropa); R.pset(X(1 + inc), suelo - 8, hex('#e8e0d0'));
  r(inc, 1 + inc, suelo - 11, suelo - 10, piel); r(-1 + inc, 2 + inc, suelo - 12, suelo - 12, hex('#4a4a52')); R.pset(X(2 + inc), suelo - 11, hex('#4a4a52'));
  R.linea(X(2 + inc), suelo - 8, X(5 + inc), suelo - 7, piel);
};
// la pareja de la foto de la playa de hu-galveston: él de azul, ella de rosa; y su fotógrafo
const SENOR = { C: hex('#3e4a6a'), c: hex('#2c3650'), F: hex('#4a4a56'), W: hex('#f2eee2'), o: hex('#a83a3a') };
const SENORA = { C: hex('#b85a7a'), c: hex('#8e4060'), W: hex('#ecd0da'), L: hex('#2a2430') };
const FOTOGRAFO = { C: hex('#5a4a3a'), c: hex('#443828'), F: hex('#3a3a46'), W: hex('#f2eee2'), o: hex('#2a2430') };
// un obrero pequeño a lo lejos (unos 9 px) que echa arena con la pala: fase de la palada
const obreroLejos = (x, y, t, k, dir = 1) => {
  const f = Math.sin(t * 4 + k * 1.7), X = (i) => Math.round(x + i * dir), ropa = [hex('#3a5a8a'), hex('#6a5a3a')][k % 2];
  R.rect(Math.min(X(0), X(1)), y - 3, Math.max(X(0), X(1)), y, hex('#3a3a46')); R.rect(Math.min(X(0), X(2)), y - 7, Math.max(X(0), X(2)), y - 4, ropa); R.rect(Math.min(X(0), X(1)), y - 9, Math.max(X(0), X(1)), y - 8, hex('#e0a878')); R.rect(Math.min(X(-1), X(2)), y - 10, Math.max(X(-1), X(2)), y - 10, hex('#4a4a52'));
  const px = X(4 + Math.round(f)), py = y - 2 - Math.round(Math.max(0, f) * 3); R.linea(X(2), y - 6, px, py, hex('#8a6a3a')); R.rect(px - 1, py, px + 1, py + 1, hex('#6a6a72'));
  if (f > 0.7) { R.pset(px + dir * 2, py - 2, hex('#d8c49a')); R.pset(px + dir * 3, py - 3, hex('#e8d8b0')); }
};

const w = (f) => en('muro', f);
// los cortes: «And then», «and pumps», y la pausa antes de «the city»
const P2 = w(0.329), P3 = w(0.584), P4 = w(0.811);
const increible = w(0.127), muroW = w(0.221), diecisiete = w(0.25), alto = w(0.30);
const casa = w(0.362), gatos = w(0.431), dosmil = w(0.505);
const bombea = w(0.605), arenaW = w(0.622), puerto = w(0.67), debajo = w(0.70);
const ciudad = w(0.819), diez = w(0.899), antes = w(0.975);

// ── 1 · el muro de diecisiete pies ──────────────────────────────────────────────────────────────────────────────
const INGENIERO = { C: hex('#5a5a6a'), c: hex('#44444f'), F: hex('#4a4a52'), W: hex('#f2eee2'), o: hex('#3a5a8a') };
const OBRERO = { C: hex('#3e5a8a'), c: hex('#2c4468'), F: hex('#3e5a8a'), W: hex('#c84a3a'), o: hex('#3e5a8a'), H: hex('#2c2232'), h: hex('#54466a') };
const OBRERO2 = { C: hex('#7a5a3a'), c: hex('#5a4028'), F: hex('#4a4a5a'), W: hex('#e8dcc0'), o: hex('#7a5a3a'), H: hex('#8a5428'), h: hex('#a8703a') };
const obra = (t) => lerp(0.5, 0.97, tramo(t, 0.3, muroW + 0.55));
const gira = (px, py, cx, cy, a) => [cx + (px - cx) * Math.cos(a) - (py - cy) * Math.sin(a), cy + (px - cx) * Math.sin(a) + (py - cy) * Math.cos(a)];
const carretilla = (x, s, vuelca, carga) => {   // delante del obrero (mirando a la derecha); vuelca 0–1 la inclina sobre la rueda
  const cx = x + 27, cy = s - 3, a = vuelca * 0.7, P = (pts) => pts.map(([px, py]) => gira(px, py, cx, cy, a));
  R.linea(x + 11, s - 9, x + 15, s - 9, C.k); R.rect(x + 15, s - 6, x + 16, s - 1, C.k);
  R.poligono(P([[x + 12, s - 13], [x + 30, s - 13], [x + 26, s - 5], [x + 16, s - 5]]), C.k); R.poligono(P([[x + 13, s - 12], [x + 29, s - 12], [x + 25, s - 6], [x + 17, s - 6]]), hex('#6a7080'));
  if (carga > 0) R.poligono(P([[x + 14, s - 12], [x + 28, s - 12], [x + 25, s - 15], [x + 17, s - 15]]), hex('#c8b48a'));

};
const plano = (x, y) => { R.rect(x - 1, y - 1, x + 10, y + 7, C.k); R.rect(x, y, x + 9, y + 6, hex('#3a6ab8')); R.linea(x + 1, y + 5, x + 8, y + 5, hex('#d8e8ff')); for (let i = 0; i < 5; i++) R.pset(x + 6 + Math.round(Math.sin(i / 4 * 1.4) * 2), y + 1 + i, hex('#d8e8ff')); R.rect(x + 1, y + 1, x + 3, y + 1, hex('#a8c8f0')); };
const vuelcaT = [3.55, 4.15];
const p1 = (t) => {
  T.galveston(R, t, { despues: true, encuadre: 'muro', muro: obra(t) });
  // «seventeen feet»: la cota sube por la cara del muro y sale el número
  const e = tramo(t, diecisiete - 0.2, diecisiete + 0.25), X = 30, pie = 141, top = 63;
  if (e > 0) { const yt = Math.round(lerp(pie, top, e));
    R.rect(X - 1, yt, X + 1, pie, C.k); R.rect(X, yt + 1, X, pie - 1, C.oroL); R.rect(X - 4, pie, X + 4, pie, C.k);
    R.poligono([[X - 4, yt + 5], [X + 5, yt + 5], [X + 0.5, yt - 1]], C.k); R.poligono([[X - 3, yt + 4], [X + 4, yt + 4], [X + 0.5, yt]], C.oroL);
    if (e >= 1) R.rect(X - 4, top - 1, X + 4, top - 1, C.k);
    if (t > diecisiete) R.numero('17', 38, Math.round(lerp(112, 106, tramo(t, diecisiete, diecisiete + 0.2))), { tam: 16 }); }
  // el ingeniero repasa el plano y señala el muro; luego mira la cota con orgullo
  const s1 = 158, x1 = 72, senala = entre(t, increible - 0.1, increible + 0.9) || entre(t, alto, alto + 0.6);
  R.actor(EL.vecino, x1, s1, t, { dir: senala || t > diecisiete - 0.1 ? -1 : 1, pal: INGENIERO, dedo: senala, sonrisa: t > alto, sorpresa: entre(t, diecisiete, diecisiete + 0.5), habla: entre(t, increible - 0.1, increible + 0.8) && parpadeo(t, 7) });
  if (!senala && t < diecisiete - 0.1) { const [hx, hy] = enMano(x1, s1, 1); plano(hx - 4, hy - 6); }
  // el obrero trae la carretilla de arena, la vuelca junto al encofrado y mira arriba en «seventeen»; el compañero la
  // echa a paladas
  const u = lin(t, 0.2, vuelcaT[0]), xo = Math.round(lerp(-30, 96, u)), so = 170, mira = t > diecisiete - 0.1;
