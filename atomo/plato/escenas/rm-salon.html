<title>Salon · ep5</title>

<body>
<canvas id="lienzo"></canvas>
<script type="module">
// RM-SALON (frases 2–3). Cartela «476». El salón de mármol al atardecer: el emperador niño, con la corona que le queda
// grande, se la quita (en «takes off») y se la da a Odoacro, que la guarda en un cofre. Luego, fuera, una calle
// cualquiera: un panadero junto a su horno, un perro que duerme y gente que pasa sin mirar.
import { preparar, rodar } from '/atomo/plato/escenas/rm-comun.js';
const { E, R, M } = await preparar('rm-salon');
const { PALA, PR, ELENCO, tramo, lerp } = R;
const m = { corona: M('corona', 1.5), fuera: M('fuera', 10) };
const S = R.SUELO_SALON, H = 30;
const salon = (t) => {
  R.salon(t);
  const u = t - m.corona, quita = u >= 4.5, sube = u >= 4.1 && u < 5.4, tiende = u >= 6.6 && u < 8, coge = u >= 7.6, guarda = u >= 8.6;
  R.personaje(126, S + 22, H, { ...ELENCO.emperadorNino, t, sombrero: quita ? 'no' : 'corona', brazoD: tiende ? 'ofrece' : sube ? 'arriba' : 'abajo', pose: tiende ? 'ofrece' : 'pie', objeto: quita && !coge ? 'corona' : undefined, ceño: coge });
  const llega = tramo(t, m.corona + 2, m.corona + 5.5);
  const ox = guarda ? lerp(166, 206, tramo(t, m.corona + 8.6, m.corona + 9.4)) : lerp(300, 166, llega);
  R.cofre(220, S + 22, t, { w: 14, abierto: u < 9.4 });
  R.personaje(ox, S + 23, 36, { ...ELENCO.odoacro, t, dir: guarda && u < 9.4 ? 1 : -1, anda: (llega > 0 && llega < 1) || (guarda && u < 9.4) ? t * 7 : null, pose: tiende || (coge && !guarda) ? 'ofrece' : 'pie', objeto: coge && u < 9.3 ? 'corona' : undefined, ceño: true });
};
const calle = (t) => {
  R.cieloR(t, 'dia', { hor: 140 });
  R.insula(-6, 140, 70, 5, t); R.insula(70, 140, 56, 4, t, { rampa: PALA.AMARILLO }); R.templo(190, 140, 64, 34); R.insula(236, 140, 90, 4, t);
  R.suelo(140, PALA.MARMOL, { losas: true, luz: 2 });
  R.disco(50, 140, 11, PALA.TERRACOTA[2]); R.rect(39, 140, 61, 141, PALA.TERRACOTA[1]); R.disco(50, 138, 4, PALA.CONTORNO); R.disco(50, 139, 2, PALA.ANTORCHA[Math.floor(t * 10) % 2 ? 2 : 3]);
  const saca = (t - m.fuera) % 4;
  R.personaje(74, 160, 28, { ...ELENCO.ciudadano, t, dir: -1, pelo: PALA.PELO_NEGRO, chaqueta: PALA.BLANCO, camisa: PALA.BLANCO, falda: PALA.BLANCO, pose: saca < 2 ? 'ofrece' : 'pie', objeto: saca < 2 ? 'pergamino' : undefined, sonrisa: true });
  R.perro(150, 164, t, { duerme: true, esc: 0.5 });
  [[340, -16, 'senador', null], [-30, 20, 'ciudadano', PALA.ROJO], [400, -13, 'ciudadano', PALA.VERDE], [-120, 18, 'legionario', null]].forEach(([x0, v, pre, c], i) => {
    const x = x0 + v * (t - m.fuera);
    R.personaje(x, 166 + (i & 1) * 5, 28, { ...ELENCO[pre], t: t + i, dir: Math.sign(v), anda: t * 7, ...(c ? { chaqueta: c, camisa: c, falda: c } : {}), objeto: pre === 'legionario' ? 'gladio' : undefined });
  });
};
rodar(E, R, [[0, salon], [m.fuera - 0.2, calle]], { cartela: '476', durCartela: 2.4, año: 476 });
</script>
