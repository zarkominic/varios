// 3. «Along the way, a formula kept in a vault»: la cámara acorazada de 1925 vista DESDE DENTRO (otro encuadre que el

//    papelito en primer plano. Al principio se ve el dorso de la puerta: el engranaje gira, la biela recoge los cinco

//    dos manos ponen los dos vasos sin marca en «rival»; brillan en «unmarked cups»; el contador de catas sube a 200000 en
//    «hundreds of thousands» y un visto enorme salta en «yes».
// 5. «and a country that picked up the phone to say no»: la centralita; los teléfonos suenan, el contador de llamadas se

import * as T from '/atomo/plato/escenas/nc-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';

};

// ── 1 · la lata tapada bajo el haz (prensa, cámara del atril) ──

  const tira = tramo(t, cambia - 0.15, receta) * (1 - tramo(t, famosa + 0.3, P2 - 1.2));
  const o = { encuadre: 'prensa', camara: 'atril', paño: 0.32 * tira, flashes: 0.35 + 0.6 * tramo(t, anyo85, famosa) };
  T.anuncio(R, t, o);
  // el ayudante de la peana: espera con la mano en el paño, tira en «changed» y lo vuelve a soltar
  R.actor(NC.keough, 133, 160, t, { dir: -1, sostiene: [124 - Math.round(tira * 4), 120], sonrisa: tira > 0.5, sorpresa: t > receta && t < famosa });
  // el portavoz tras el atril habla a la sala y señala la lata en «changed the recipe»
  const habla = t > anyo85 && t < P2 - 0.2 && Math.sin(t * 8.3) > -0.1;
  R.actor(NC.goizueta, 208, 160, t, { dir: -1, habla, dedo: t > cambia - 0.2 && t < famosa + 0.8, sonrisa: t > famosa + 0.8 });

};

// ── 2 · la protesta en la calle ──
const rebela = a(0.5705), setenta = a(0.6723), despues = a(0.749), vuelta = a(0.9224);

  R.pset(x + 7, y - 2, K); R.pset(x + 18, y - 2, K); R.rect(x + 1, y + 23, x + 24, y + 25, BS);

    R.rect(hx - w - 1, hy - 4, hx + w + 1, hy + 4, K); R.rect(hx - w, hy - 3, hx + w, hy + 3, BL); if (w > 2) R.rect(hx - w, hy - 3, hx + w, hy - 2, T.C.rojoCola);
  }

const p2 = (t) => {

  const m1x = Math.round(lerp(-30, 52, u)), m2x = Math.round(lerp(-58, 18, u));

  PZ.pancarta(R, r1.mano[0], r1.mano[1] + 10 - alza, { dibujo: 'lata' });

  const rs = R.actor(NC.senora75, 150, 138, t, { dir: -1, enfado: !saca && t > rebela, habla: !saca && t > rebela && Math.sin(t * 7) > 0, dedo: !saca && t > rebela + 0.4 && t < despues, sostiene: saca ? [146, 112 - Math.round(tramo(t, vuelta, vuelta + 0.4) * 4)] : false, sonrisa: saca });

  T.rebelionDelante(R, t, o);
};

const formula = c(0.0709), boveda = c(0.1481);
const CAPAS = new Map();
const capaBuf = (k, f) => { let b = CAPAS.get(k); if (!b) { b = R.nuevo(); const p = R.usar(b); f(); R.usar(p); CAPAS.set(k, b); } return b; };
const hh = (x, y, s) => { let n = (x * 374761393 + y * 668265263 + s * 1442695041) | 0; n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16), bay = (x, y) => B4[(y & 3) * 4 + (x & 3)];
const mez = (c, d, a) => { const r = c & 255, g = (c >> 8) & 255, b = (c >> 16) & 255;
  return (0xff000000 | (Math.round(b + (((d >> 16) & 255) - b) * a) << 16) | (Math.round(g + (((d >> 8) & 255) - g) * a) << 8) | Math.round(r + ((d & 255) - r) * a)) >>> 0; };
// la chapa de la bóveda en penumbra (azulada) y el acero de la puerta
const VB = ['#14161d', '#20232c', '#2e323c', '#40454f', '#575d69', '#767d8a'].map(hex);
const VA = ['#2a2e38', '#424854', '#68707e', '#8c95a2', '#b6bfcc', '#e2e8f0'].map(hex);
const tono = (x, y, v, P = VB) => P[Math.max(0, Math.min(5, Math.floor(v * 5 + bay(x, y) - 0.5)))];
const LUZ = hex('#e8c888'), LUZL = hex('#fff0c8'), OX = hex('#5a3a2c'), OXL = hex('#7a4e36');
const LAT = hex('#c8a040'), LATS = hex('#8a6a24'), LATL = hex('#f0d878'), CAO = hex('#6e3a22'), CAOL = hex('#8c5030'), CAOS = hex('#4c2616'), CAOD = hex('#2c140c');
const CX = 160, CY = 78, RF = 44, RN = 51, RC = 57, BX = 243, BY = 27;   // el agujero: lejos (RF), boca (RN), collar (RC); la bombilla
const pintaBoveda = () => {
  // la habitación en perspectiva central: pared del fondo x 40–280, y 20–140; techo, suelo y paredes laterales hacia la cámara
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) {
    const dx = x - 160, dy = y - 80, bl = Math.max(0, 1 - Math.hypot(x - BX, y - BY) / 170), sx = Math.abs(dx) / 120, sy = Math.abs(dy) / 60;
    let v, c = null;
    if (x >= 40 && x <= 280 && y >= 20 && y <= 140) {
      // las planchas de 40×20 al tresbolillo, con remaches en dos filas, sus regueros de óxido y arañazos
      const fila = Math.floor((y - 20) / 20), xx = x - 40 + (fila % 2) * 20, u = xx % 40, w = (y - 20) % 20, pl = Math.floor(xx / 40);
      v = 0.25 + bl * 0.55 + hh(pl, fila, 3) * 0.08 + (hh(x, y, 4) - 0.5) * 0.07 - (y - 20) * 0.0006;
      if (w === 0 || u === 0) v -= 0.2; else if (w === 1 || u === 1) v += 0.09; else if (u === 39 || w === 19) v -= 0.08;
      const rv = (w === 3 || w === 16) && u % 5 === 2, rs = (w === 4 || w === 17) && u % 5 === 3;
      if (rv) v += 0.32; else if (rs) v -= 0.18;
      c = tono(x, y, v);
      const id = pl * 31 + fila * 7 + Math.floor(u / 5);
      if (u % 5 === 2 && w > 4 && w < 5 + Math.floor(hh(id, 1, 5) * 12) && hh(id, 2, 6) > 0.8) c = w < 7 ? OXL : OX;
      if (hh(x >> 3, y, 7) > 0.985) c = tono(x, y, v + 0.2);
    } else if (sx > sy) {
      // las paredes laterales: chapa con juntas por la profundidad y estanterías de acero vacías
      const ad = Math.abs(dx), Y = dy * 120 / ad, D = 14400 / ad;
      v = 0.2 + bl * 0.5 + (hh(Math.floor(D / 6), dx > 0 ? 1 : 0, 8) - 0.5) * 0.06;
      if ((D % 6) < 0.25) v -= 0.16;
      for (const s of [-42, -18, 6, 30]) { if (Y >= s - 2.2 && Y < s) v = 0.42 + bl * 0.4; else if (Y >= s && Y < s + 1.6) v = 0.12; else if (Y >= s + 1.6 && Y < s + 6) v -= 0.08; }
      if ((D > 116 && D < 118.5) || (D > 99 && D < 101)) v = Math.max(v, 0.36 + bl * 0.3);
      c = tono(x, y, v);
    } else if (dy < 0) {

      v = 0.13 + bl * 0.45 + (hh(Math.floor(X / 30), Math.floor(D / 5), 9) - 0.5) * 0.05;
      if ((D % 5) < 0.18) v = 0.08; else if ((D % 5) < 0.4) v += 0.12;
      if (Math.abs(((X % 30) + 30) % 30) < 0.5) v -= 0.1;
      c = tono(x, y, v);
    } else {
      // el suelo de chapa estriada (lágrimas en espiga), con juntas, roces y polvo
      const X = dx * 60 / dy, D = 3600 / dy, fu = ((X / 3.2) % 1 + 1) % 1, fv = ((D / 0.7) % 1 + 1) % 1, iu = Math.floor(X / 3.2), iv = Math.floor(D / 0.7);
      const dg = (iu + iv) & 1 ? fu - fv : fu + fv - 1;
      v = 0.23 + bl * 0.35 + (hh(Math.floor(X / 30), Math.floor(D / 6), 10) - 0.5) * 0.06;
      if (Math.abs(dg) < 0.16) v += 0.14; else if (Math.abs(dg) < 0.28) v -= 0.05;
      if (Math.abs(((X % 30) + 30) % 30) < 0.4 + 0.012 * dy || (D % 6) < 0.12) v = 0.07;
      if (hh(x >> 2, y >> 1, 11) > 0.94) v += 0.08;
      c = tono(x, y, v);
    }
    R.pset(x, y, c);
  }
  // la boca: el túnel del grosor del muro (de RN a RF) y el collar remachado (de RN a RC)
  for (let j = -RC; j <= RC; j++) for (let i = -RC; i <= RC; i++) {
    const r = Math.hypot(i, j); if (r > RC || r < RF - 1) continue; const x = CX + i, y = CY + j, l = (i - j * 1.3) / Math.max(1, r);
    let v;
    if (r < RN) { const q = (r - RF) / (RN - RF); v = 0.22 + 0.16 * q + l * 0.08 - Math.max(0, -j / RC) * 0.1; if ((Math.floor(q * 4) !== Math.floor((r + 0.6 - RF) / (RN - RF) * 4))) v -= 0.1; }
    else if (r < RN + 1) v = 0.06;
    else if (r > RC - 1) v = 0.05;
    else { v = 0.5 + l * 0.22; if (r < RN + 2) v += 0.15; }
    R.pset(x, y, tono(x, y, v, VA));
  }
  for (let k = 0; k < 24; k++) { const a = k * Math.PI / 12, x = Math.round(CX + Math.cos(a) * (RN + 3)), y = Math.round(CY + Math.sin(a) * (RN + 3)); R.pset(x, y, VA[5]); R.pset(x + 1, y + 1, VA[0]); }

  R.rect(61, 40, 85, 41, hex('#4a4436')); for (let k = 0; k < 5; k++) R.rect(60, 44 + k * 3, 60 + 14 + Math.floor(hh(k, 3, 12) * 12), 44 + k * 3, hex('#544c3c'));
  R.disco(82, 52, 3, hex('#7a2a22')); R.pset(81, 51, hex('#a84a3a'));
  R.disco(74, 76, 7, LATS); R.disco(74, 76, 6, mez(LAT, VB[1], 0.4)); R.disco(74, 76, 5, hex('#8e887a'));
  for (let k = 0; k < 9; k++) { const a = Math.PI * (0.8 + k * 0.175); R.pset(Math.round(74 + Math.cos(a) * 4), Math.round(76 + Math.sin(a) * 4), hex('#3a3630')); }

  R.rect(64, 104, 76, 106, hex('#3a3a40')); R.rect(65, 107, 75, 117, hex('#2a2c32')); R.rect(66, 108, 74, 116, hex('#4a5058')); R.rect(68, 109, 70, 115, hex('#6a7078'));
  R.rect(64, 117, 76, 119, hex('#3a3a40')); R.linea(66, 104, 70, 99, hex('#55555c')); R.linea(74, 104, 70, 99, hex('#55555c')); R.pset(70, 98, hex('#55555c'));
  for (let i = -14; i <= 14; i++) if (i % 2) R.pset(70 + i, 151, VB[0]);
  // a la derecha: la rejilla de ventilación, el tubo de la luz con su interruptor de palanca y el cubo de arena
  R.rect(220, 32, 258, 52, VB[0]); for (let y = 34; y < 51; y += 3) { R.rect(222, y, 256, y, VB[4]); R.rect(222, y + 1, 256, y + 1, VB[2]); }
  R.rect(BX - 1, 20, BX + 1, 98, VB[1]); R.rect(BX - 1, 20, BX - 1, 98, VB[4]); for (const y of [36, 60, 84]) R.rect(BX - 2, y, BX + 2, y + 1, VB[3]);
  R.rect(236, 98, 252, 116, VB[0]); R.rect(237, 99, 251, 115, VB[3]); R.rect(237, 99, 251, 99, VB[5]); R.rect(242, 102, 246, 112, VB[1]); R.linea(244, 107, 249, 101, VA[4]); R.disco(249, 101, 1, hex('#1a1a1a'));
  R.rect(260, 146, 274, 162, hex('#4a1410')); R.rect(261, 146, 273, 161, hex('#7a2a22')); R.rect(261, 146, 262, 161, hex('#9a3a2e')); R.rect(261, 147, 273, 148, hex('#8a7a5a')); R.linea(260, 146, 267, 139, VB[4]); R.linea(274, 146, 267, 139, VB[4]);
  for (let i = -8; i <= 8; i++) if (i % 2) R.pset(267 + i, 163, VB[0]);
  // en las estanterías de los lados: cajas de seguridad vacías con la tapa abierta, y una telaraña en el rincón

  const nA = t > cientos ? 0.55 + 0.25 * ritmo : 0.8, nB = t > cientos ? 0.55 - 0.25 * ritmo : 0.8;
  const brilla = t > sinMarca && t < vasos + 0.7;
  for (const [x, n] of [[ax, nA], [bx, nB]]) {
    PZ.vaso(R, x, 153, { s: 3, lleno: n });
    if (brilla) for (let k = 0; k < 5; k++) { const an = t * 5 + k * 1.26; R.pset(Math.round(x + Math.cos(an) * 25), Math.round(128 + Math.sin(an) * 26), hex('#fff6c0')); }
  }
  // las manos que los colocan (y después se retiran)
  const fuera = tramo(t, vasos, vasos + 0.8);
  T.brazo(R, -12, 214, Math.round(ax - 34 - fuera * 40), Math.round(150 + fuera * 50), '#4a6a8a', 1, { codo: [Math.round(ax - 70 - fuera * 30), 190] });
  T.brazo(R, 334, 214, Math.round(bx + 34 + fuera * 40), Math.round(150 + fuera * 50), '#8a4a3a', -1, { codo: [Math.round(bx + 70 + fuera * 30), 190] });
  // el contador de catas, en su placa, y el visto en «yes»
  if (t > cientos - 0.2) {
    const n = Math.round(200000 * tramo(t, cientos, catas + 0.4) ** 0.6 / 1000) * 1000;
    R.rect(110, 24, 216, 48, K); R.rect(111, 25, 215, 47, hex('#1a2a3a')); R.rect(112, 26, 214, 27, hex('#2e4a64'));
    R.numero(String(n), 163, 42, { tam: 16, centro: true });
  }
  const v = tramo(t, si - 0.05, si + 0.25);
  if (v > 0) { const s = Math.round(lerp(1, 4, v)); visto(Math.round(163 - 4 * s), Math.round(84 - 3 * s), s); }
};

// ── 5 · la centralita ──
const pais = c(0.6267), coge = c(0.6641), no = c(0.7476);
const p5 = (t) => {
  const o = { encuadre: 'centralita', llamadas: Math.round(lerp(400, 1500, tramo(t, P5, P6 - 0.3))), sacos: t > no ? 7 : 6 };
  T.rebelion(R, t, o);
  // la operadora contesta con los cascos y oye un «no» tras otro
  const contesta = t > coge;
  const r = R.actor(NC.operadora, 124, 150, t, { dir: 1, habla: contesta && Math.sin(t * 8) > 0, sostiene: contesta ? [140, 121] : false, sorpresa: t > no && t < no + 0.9, triste: t > no + 0.9 });
  const [hx, hy] = r.cabeza; R.linea(hx - 6, hy + 1, hx - 5, hy - 4, K); R.linea(hx - 5, hy - 4, hx + 5, hy - 4, K); R.rect(hx + 5, hy, hx + 7, hy + 3, K); R.pset(hx + 6, hy + 1, hex('#5a5a66'));
  // un compañero detrás de la otra mesa, que anota en la libreta
  R.actor(NC.investigador, 152, 150, t, { dir: -1, sostiene: [160, 138 + (Math.floor(t * 6) % 2)], sorpresa: t > no && t < no + 0.6 });
  // el cartero entra con otro saco y lo deja en el montón
  const w = tramo(t, P5 + 0.2, no - 0.1), cx = Math.round(lerp(330, 262, w));
  const rc = R.actor(NC.voluntario, cx, 162, t, { dir: -1, anda: w > 0 && w < 1, sostiene: t < no ? [cx - 4, 146] : false, sonrisa: t > no + 0.5 });
  if (t < no) PZ.sacoCartas(R, rc.mano[0] - 6, rc.mano[1] + 14, {});
  T.rebelionDelante(R, t, o);
  // los «no»: bocadillos con la X que salen de las mesas
  for (const [k, x, y] of [[0, 110, 96], [1, 56, 84], [2, 184, 90], [3, 14, 98]]) { const t0 = no - 0.05 + k * 0.22; if (t > t0 && t < P6) bocadillo(x, y - Math.round(tramo(t, t0, t0 + 0.2) * 4), 'X', T.C.rojoCola); }
};

// ── 6 · el escritorio de Atom: la lata (gag 1) ──
const cerebro = c(0.8811), bebe = c(0.9658);
const p6 = (t) => {
  const pss = tramo(t, bebe, bebe + 0.5), golpe = tramo(t, bebe + 0.2, bebe + 0.6);
  const o = { encuadre: 'estudio', camara: 'mesa', espuma: pss, lataX: 168 };
  T.hoy(R, t, o);
  T.hoyDelante(R, t, o);
  // Atom se acerca a la lata, la mira con un «?», le da con un electrón… y la espuma le da en la cara
  const llega = tramo(t, P6 + 0.1, cerebro + 0.3), asoma = tramo(t, cerebro + 0.5, bebe - 0.3);
  let ax = Math.round(lerp(lerp(92, 136, llega), 160, asoma) - golpe * 40), ay = Math.round(lerp(lerp(96, 92, llega), 84, asoma) - golpe * 22 + Math.sin(t * 2.6) * 2);
  if (golpe > 0 && golpe < 1) ax += Math.round(Math.sin(t * 40) * 2);
  ondaAtom(ax, ay, t, t > cerebro + 0.4 && t < bebe ? 0.9 : 0.35);
  if (t > cerebro - 0.1 && t < bebe - 0.2) R.icono('?', ax - 3, ay - 30 - Math.round(Math.sin(t * 5) * 2), hex('#ffe890'), K, 2);
  // el electrón que toca la anilla
  const toca = tramo(t, bebe - 0.6, bebe - 0.05);
  if (toca > 0 && toca < 1) { const ex = Math.round(lerp(ax + 8, 172, toca)), ey = Math.round(lerp(ay + 6, 104, toca)); R.disco(ex, ey, 2, K); R.disco(ex, ey, 1, hex('#7af0ff')); }
  // la espuma pegada a Atom y las gotas que escurren
  if (golpe > 0) {
    for (const [dx, dy, r] of [[-6, -4, 3], [3, -7, 2], [7, 2, 3], [-2, 5, 2], [-9, 3, 1]]) pegote(ax + dx, ay + dy, golpe < 1 ? Math.max(1, Math.round(r * golpe)) : r);
    for (let k = 0; k < 3; k++) { const u = ((t - bebe) * 0.8 + k * 0.33) % 1; pegote(ax - 6 + k * 6, Math.round(ay + 8 + u * 22), 1); }
  }
};

const efectos = [[anyo85 + 0.1, 'flash'], [cambia, 'flash'], [famosa, 'brillo'], [P2 + 0.2, 'publico'], [setenta, 'papel'], [vuelta + 0.1, 'brillo'],
  [P3 + 0.25, 'cerrojo'], [formula - 0.3, 'puerta'], [boveda, 'brillo'], [P4 + 0.6, 'toc'], [gana + 0.6, 'toc'], [cientos, 'tecleo'], [si, 'campana'],
  [P5 + 0.1, 'ring'], [no, 'aviso'], [cerebro + 0.1, 'boing'], [bebe - 0.1, 'bip'], [bebe, 'vapor'], [bebe + 0.25, 'chof']];
const año = (t) => t < P3 ? 1985 : t < P4 ? 1925 : t < P5 ? 1984 : t < P6 ? 1985 : 2026;
T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3], [P4, p4], [P5, p5], [P6, p6]], { efectos, año });
