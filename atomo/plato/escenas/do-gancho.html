<body>
<canvas id="lienzo"></canvas>
<script type="module">
// DO-GANCHO (frases 1–3), 2019. Seis planos:
// 0. «The man who saved the universe as Iron Man is coming back on December 18… as the villain» (la promesa del título
//    en los primeros segundos, regla del 03/11/2026): la miniatura en movimiento. Iron Man al doble en la batalla de
//    2019; en «saved» levanta el guantelete, que brilla; en «December 18» cae desde arriba la placa dorada 12.18, que
//    queda en el cielo (y 18–64), por debajo de la barra del año; en «as the villain» la diagonal barre el plano de
//    derecha a izquierda con un fogonazo verde y deja a Doom ante su castillo; Iron Man se aparta a la izquierda y las
//    palomitas se asustan; corta en la pausa antes de «In 2019»;
// 1. «In 2019, in the final battle of Avengers: Endgame»: el cine desde el fondo de la sala (fondo local): la pantalla
//    grande a la izquierda entre telones, la pared acolchada de la derecha con apliques y la salida, el haz del
//    proyector que viene de detrás con motas, y cuatro filas de público DE ESPALDAS (nuca y hombros, respaldos por
//    delante). En la pantalla avanza la batalla: el ejército se acerca, los héroes se lanzan (el Capitán corre, Thor
//    llama al rayo, Iron Man vuela); en «Battle» choque y fogonazo, el de la capucha de araña salta y se le escapan las
//    palomitas; después se abren los dos portales y salen Hulk y Spider-Man; en «Endgame» la ola de cabezas; corta en
//    la pausa antes de «Tony»;
// 2. la ciudad en ruinas (fondo local, fachadas con ventanas de varios tonos y columnas de humo): Iron Man chibi de pie
//    sobre un bloque de hormigón levanta el guantelete (a la escala de la mano canónica); en «puts all six Infinity
//    Stones» las seis gemas llegan volando una a una desde los lados con su estela y encajan con un destello; en
//    «gauntlet» el guante se carga, Iron Man tiembla, chisporrotea y suelta un haz al cielo; corta en «Snaps»;
// 3. el llano de la batalla con cámara baja (fondo local: montes con el bosque que arde, torres de alta tensión,
//    cráteres, un carro estrellado; sin edificio ni nave): Iron Man detrás de su bloque, abajo a la izquierda, levanta
//    el guante hacia el ejército, que llena el centro, con Thanos delante; el chasquido es un destello blanco de medio
//    segundo que llena el cuadro; después el ejército se deshace en polvo de colores que sube, de izquierda a derecha,
//    y en «Thanos» se deshace él; en «doesn't survive» Iron Man se deja caer detrás del bloque y el Capitán y Thor
//    vuelven del llano, cabizbajos; corta en «Millions»;
// 4. el cine visto desde la pantalla, de cara al público (fondo local: pared acolchada en rombos, la cabina con los
//    haces del proyector hacia la cámara, paredes laterales con paneles, la puerta y la salida verde): cinco gradas de
//    público lloran, sollozan y se secan con pañuelos; delante, la de la capa se frota los ojos con el pañuelo, las
//    palomitas lloran y en «goodbye» sacan la servilleta y se suenan con un bote (gag 1, «moc» de claxon); en «Iron
//    Man» la chica abraza al de la gorra; corta en «the hero»;
// 5. la noche, el pedestal de homenaje con la armadura: las velas se encienden una a una; un fan llega con una flor y la
//    deja al pie; una niña levanta la luz del móvil; en la placa sale 2008 («started it all») y cuenta hasta 2019 en
//    «11 years earlier».
import * as T from '/atomo/plato/escenas/do-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('do-gancho');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const C = T.C;
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const BY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], by = (x, y) => BY[(y & 3) * 4 + (x & 3)] / 16;
const rampa = (lista) => lista.map(hex);
// degradado tramado por filas (cielos, fondos): v 0–1 de y0 a y1, con la rampa de colores
const degradado = (x0, y0, x1, y1, ram, k = 0) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
  const v = (y - y0) / Math.max(1, y1 - y0) * (ram.length - 1) + by(x, y) - 0.5 + (hh(x >> 3, y >> 2, k) - 0.5) * 0.5;
  R.pset(x, y, ram[Math.max(0, Math.min(ram.length - 1, Math.round(v)))]); } };
// una nube de humo de tres tonos (bolas que se solapan), en (x, y), tamaño s
const humo = (x, y, s, c0, c1, c2) => { for (const [dx, dy, k] of [[0, 0, 1], [-1.1, 0.2, 0.75], [1.1, 0.25, 0.8], [-0.5, -0.6, 0.7], [0.6, -0.55, 0.65]]) R.disco(x + dx * s, y + dy * s, s * k + 1, c2);
  for (const [dx, dy, k] of [[0, 0, 1], [-1.1, 0.2, 0.75], [1.1, 0.25, 0.8], [-0.5, -0.6, 0.7], [0.6, -0.55, 0.65]]) R.disco(x + dx * s, y + dy * s - 1, s * k, c1);
  for (const [dx, dy, k] of [[-0.3, -0.5, 0.55], [0.5, -0.45, 0.45], [-1.1, 0, 0.4]]) R.disco(x + dx * s - 1, y + dy * s - 2, s * k, c0); };
// lágrimas que caen de los ojos de un chibi (cabeza = la .cabeza que devuelve R.actor)
const lagrimas = (cab, t, dir = 1) => { for (const ex of [-2, 2]) { const f = ((t * 1.6 + (ex > 0 ? 0.5 : 0)) % 1); const x = cab[0] + ex + (dir > 0 ? 1 : 0), y = Math.round(cab[1] + 7 + f * 7);
  R.pset(x, y, hex('#8ad8ff')); R.pset(x, y + 1, hex('#4aa8e8')); } };

const g = (f) => en('giro', f), a = (f) => en('chasquido', f), b = (f) => en('lloraron', f);
const P1 = (M('giro_fin', 0) + a(0)) / 2;
const SALVO = g(0.091), IRONM = g(0.288), DICIEMBRE = g(0.61), VILLANO = g(0.85);
const P2 = a(0.309), P3 = a(0.632), P4 = b(-0.014), P5 = b(0.571);
const BATALLA = a(0.147), ENDGAME = a(0.277), GEMA0 = a(0.408), GEMA5 = a(0.531), GUANTE = a(0.563), SNAP = P3 + 0.3, THANOS = a(0.750), SOBREVIVE = a(0.892);
const ADIOS = b(0.307), IRON = b(0.405), EMPEZO = b(0.683), ONCE = b(0.806);
const GEMAS = rampa(['#9a4ae8', '#3a8ae8', '#e83a3a', '#e8903a', '#3ac85a', '#f0e040']);

// ── 0 · la promesa: Iron Man en 2019 y, en «villain», la diagonal que deja a Doom ante su castillo ──
const izq0 = R.nuevo(), der0 = R.nuevo(), pj0 = R.nuevo(), VACIO = 0x01020304;
const pon0 = (sx0, sx1, sy0, sy1, dx, dy) => { for (let y = sy0; y <= sy1; y++) for (let x = sx0; x <= sx1; x++) { const c = pj0[y * 320 + x]; if (c === VACIO) continue;
  const X = Math.round(dx) + (x - sx0) * 2, Y = Math.round(dy) + (y - sy0) * 2; R.rect(X, Y, X + 1, Y + 1, c); } };
const p0 = (t) => {
  const prev = R.usar(izq0); T.lago(R, t, { encuadre: 'batalla', luz: 'dia' });
  R.usar(der0); T.latveria(R, t, { encuadre: 'castillo' }); R.usar(prev);
  // la diagonal: fuera del plano por la derecha hasta «villain»; entonces barre hasta dejar el plano partido
  const barre = tramo(t, VILLANO - 0.1, VILLANO + 0.55), ee = barre * barre * (3 - 2 * barre), base = lerp(340, 150, ee);
  const corte = (y) => base + Math.round((179 - y) * 0.25), B = R.buf;
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) B[y * 320 + x] = x < corte(y) ? izq0[y * 320 + x] : der0[y * 320 + x];
  if (barre > 0) for (let y = 0; y < 180; y++) { const x = corte(y); R.pset(x - 1, y, C.k); R.pset(x, y, hex('#f6f2ea')); R.pset(x + 1, y, hex('#f6f2ea')); R.pset(x + 2, y, C.k);
    if (barre < 1) for (let k = 3; k < 9; k++) if (by(x + k, y) < (1 - barre) * (1 - k / 9)) R.pset(x + k, y, hex('#9af0a8')); }
  // Iron Man al doble: llega al centro respirando, levanta el guantelete en «saved» y se aparta a la izquierda con el barrido
  const arriba = tramo(t, SALVO - 0.15, SALVO + 0.35);
  R.usar(pj0); pj0.fill(VACIO); const im = R.actor(EL.ironman, 20, 70, t, { dir: 1, brazos: arriba > 0.5 }); R.usar(prev);
  const ix = lerp(lerp(62, 74, tramo(t, 0, SALVO)), 30, ee), iy = 104 + Math.round(Math.sin(t * 2.2) * 1);
  pon0(10, 48, 36, 71, ix, iy);
  if (arriba > 0.5) { const brillo = 0.5 + 0.5 * Math.sin(t * 9), gx = ix + (im.mano[0] - 10) * 2, gy = iy + (im.mano[1] - 36) * 2;
    R.halo(gx, gy, 10 + brillo * 4 + tramo(t, IRONM, IRONM + 0.3) * 6 - tramo(t, IRONM + 0.6, IRONM + 1) * 6, [hex('#f8d870'), hex('#fff4c8')], 0.7);
    for (let k = 0; k < 6; k++) { const ang = t * 2 + k * 1.047; R.pset(Math.round(gx + Math.cos(ang) * 9), Math.round(gy + Math.sin(ang) * 5), GEMAS[k]); } }
  // Doom al doble, ante su castillo, cuando la diagonal lo descubre (fogonazo verde al llegar)
  if (barre > 0.15) { R.usar(pj0); pj0.fill(VACIO); R.actor(EL.doom, 20, 70, t, { dir: -1 }); R.usar(prev);
    const dx = lerp(260, 222, ee); pon0(10, 46, 36, 71, dx, 104);
    const fl = tramo(t, VILLANO + 0.2, VILLANO + 0.9); if (fl > 0 && fl < 1) R.anillo(dx + 36, 140, 8 + fl * 40, hex('#7af08a'), 3); }
  // «12.18» dorado: cae desde arriba en «December 18» y rebota
  const cae = tramo(t, DICIEMBRE - 0.2, DICIEMBRE + 0.35);
  if (cae > 0) { const rebote = Math.sin(tramo(t, DICIEMBRE + 0.35, DICIEMBRE + 0.75) * Math.PI) * 3, oy = Math.round(lerp(-60, 20, cae * cae) - rebote);   // la placa queda en y 18–64, debajo de la barra del año
    const x0 = 112, x1 = 216, y0 = oy, y1 = oy + 42, oro = hex('#e8b830'), oroS = hex('#8a5a10'), fondo = hex('#1a1030');
    R.rect(x0 - 2, y0 - 2, x1 + 2, y1 + 2, C.k); R.rect(x0 - 1, y0 - 1, x1 + 1, y1 + 1, oroS); R.rect(x0, y0, x1, y1, oro); R.rect(x0 + 3, y0 + 3, x1 - 3, y1 - 3, fondo);
    R.usar(pj0); pj0.fill(VACIO); T.a_cifras(R, '12', 20, 30); T.a_cifras(R, '18', 50, 30); R.usar(prev);
    for (const [sx0, sx1, dx] of [[13, 27, 117], [43, 57, 171]]) for (let y = 21; y <= 31; y++) for (let x = sx0; x <= sx1; x++) { const c = pj0[y * 320 + x]; if (c === VACIO) continue;
      const X = dx + (x - sx0) * 3, Y = oy + 6 + (y - 21) * 3; R.rect(X, Y, X + 2, Y + 2, c); }
    R.rect(164, oy + 30, 167, oy + 33, oro);
    if (cae >= 1) { const ch = tramo(t, DICIEMBRE + 0.35, DICIEMBRE + 1.1); for (let k = 0; k < 8; k++) if (ch < 1) { const ang = k * 0.785, q = 30 + ch * 34; R.pset(Math.round(164 + Math.cos(ang) * q * 1.6), Math.round(oy + 21 + Math.sin(ang) * q * 0.6), hex('#ffe070')); } } }
  // las palomitas, abajo a la derecha (se apartan al centro con el barrido): miran a Iron Man y, en «villain», dan un salto del susto
  const susto = t > VILLANO + 0.1, salto = Math.sin(tramo(t, VILLANO + 0.1, VILLANO + 0.5) * Math.PI) * 6;
  T.palomitas(R, Math.round(lerp(214, 162, ee)), Math.round(176 - salto), t, { s: 2, dir: -1, expresion: susto ? 'susto' : 'normal' });
};

// ── 1 · el cine desde el fondo de la sala: el público, de espaldas, ve la batalla final en la pantalla grande ──
const K0 = hex('#140c14'), PIEL = hex('#c88a5a'), PIELS = hex('#9a5e36');
const PELOS = [['#6a4a30', '#4a3020', '#2e1c14'], ['#4a3a34', '#2a1e1a', '#160e0c'], ['#d8aa5a', '#a87a34', '#6a4a1a'], ['#9a5a34', '#6a3418', '#3e1a0e'], ['#a8a8b0', '#7a7a84', '#4a4a54'], ['#e0a878', '#c88a5a', '#9a5e36']].map(rampa);
const ROPAS = [['#5a7ac8', '#3a5a9a', '#24386a'], ['#6aaa5a', '#4a8a3e', '#2e5a24'], ['#d8b050', '#a8842e', '#6a5018'], ['#9a6ab8', '#74469a', '#4a2a64'], ['#e0d8cc', '#b0a69a', '#6e665c'], ['#4a4a56', '#30303a', '#1c1c24'], ['#d85a48', '#a83a2e', '#6a201a']].map(rampa);
// un espectador de espaldas (nuca y hombros): (x, y) = centro de la cabeza, r = radio (2–6); pe y ro = [luz, base,
// sombra] del pelo y de la ropa; tipo: 'pelo' | 'coleta' | 'mono' | 'gorra' | 'capucha' (la de la araña) | 'capa';
// luz: el filo de luz que le pone la pantalla en el borde de la cabeza
const nuca = (x, y, r, pe, ro, tipo = 'pelo', luz = null) => {
  x = Math.round(x); y = Math.round(y);
  const hy = y + r - 1, hw = Math.round(r * 2.1), bajo = hy + Math.round(r * 2.6);
  R.poligono([[x - r, hy - 1], [x + r + 1, hy - 1], [x + hw + 2, hy + r], [x + hw + 2, bajo], [x - hw - 1, bajo], [x - hw - 1, hy + r]], K0);
  R.poligono([[x - r + 1, hy], [x + r, hy], [x + hw + 1, hy + r], [x + hw + 1, bajo], [x - hw, bajo], [x - hw, hy + r]], ro[1]);
  R.poligono([[x + Math.round(r * 0.5), hy + 1], [x + r, hy], [x + hw + 1, hy + r], [x + hw + 1, bajo], [x + Math.round(r * 0.9), bajo]], ro[2]);
  R.linea(x - r + 1, hy, x - hw, hy + r, ro[0]); R.linea(x, hy + 1, x, bajo, ro[2]);
  if (tipo === 'capa') { R.poligono([[x - r, hy], [x + r + 1, hy], [x + hw, bajo], [x - hw + 1, bajo]], hex('#b82a2a')); R.linea(x - r, hy, x - hw + 1, bajo, hex('#e8503e'));
    R.linea(x + 2, hy + 2, x + 3, bajo, hex('#8a1a1e')); R.pset(x, hy, hex('#f0c040')); R.pset(x + 1, hy, hex('#f0c040')); }
  if (tipo === 'mono') { const rb = Math.max(1, Math.round(r * 0.5)); R.disco(x, y - r, rb + 1, K0); R.disco(x, y - r, rb, pe[1]); }
  R.disco(x, y, r + 1, K0); R.disco(x, y, r, pe[2]); R.disco(x - 1, y - 1, Math.max(1, r - 1), pe[1]);
  if (r >= 3) { R.pset(x - Math.round(r * 0.5), y - Math.round(r * 0.6), pe[0]); R.pset(x - Math.round(r * 0.5) + 1, y - Math.round(r * 0.75), pe[0]); }
  if (tipo !== 'capucha') { R.pset(x - r - 1, y + 1, PIEL); R.pset(x + r + 1, y + 1, PIELS); if (r >= 5) { R.pset(x - r - 1, y + 2, PIEL); R.pset(x + r + 1, y + 2, PIELS); } }
  if (tipo === 'coleta') { for (let j = 0; j < r + 3; j++) R.pset(x + (j > r ? 1 : 0), y + r + j - 1, j % 2 ? pe[2] : pe[1]); R.pset(x, y + r - 1, hex('#e83a6a')); R.pset(x + 1, y + r - 1, hex('#e83a6a')); }
  if (tipo === 'gorra') { for (let i = -r; i <= r; i++) for (let j = -r; j <= 0; j++) if (i * i + j * j <= r * r) R.pset(x + i, y + j - 1, j === 0 ? ro[2] : i < 0 ? ro[0] : ro[1]);
    R.pset(x - 1, y, K0); R.pset(x, y, K0); R.pset(x + 1, y, K0); }
  if (tipo === 'capucha') { for (let k = -2; k <= 2; k++) R.linea(x, y - r, x + k * Math.round(r * 0.55), y + r, K0); R.linea(x - r + 1, y, x + r - 1, y, K0); R.linea(x - r + 2, y - Math.round(r * 0.55), x + r - 2, y - Math.round(r * 0.55), K0); }
  if (luz) for (let q = -2.7; q <= -0.9; q += 0.22) R.pset(Math.round(x + Math.cos(q) * (r + 1)), Math.round(y + Math.sin(q) * (r + 1)), luz);
};
// el respaldo de una butaca visto por detrás (tapa la espalda de quien está sentado)
const respaldo = (x0, y0, w, h) => {
  const x1 = x0 + w - 1, y1 = y0 + h;
  R.rect(x0, y0 + 1, x1, y1, K0); R.rect(x0 + 1, y0, x1 - 1, y0, K0);
  R.rect(x0 + 1, y0 + 1, x1 - 1, y1, hex('#7a1a26')); R.rect(x0 + 1, y0 + 1, x1 - 1, y0 + 2, hex('#a82a36')); R.rect(x0 + 2, y0 + 1, x1 - 2, y0 + 1, hex('#d0505a'));
  R.rect(x1 - 2, y0 + 2, x1 - 1, y1, hex('#4e0e16')); R.rect(x0 + 1, y0 + 3, x0 + 1, y1, hex('#9a2632'));
  for (let x = x0 + 4; x < x1 - 3; x += 4) R.linea(x, y0 + 4, x, y1, hex('#62141e'));
  if (h > 8) R.rect(x0 + 2, y0 + h - 3, x1 - 3, y0 + h - 3, hex('#4e0e16'));
};
// rectángulo que respeta el recorte (para lo que va dentro de la pantalla)
const rc = (x0, y0, x1, y1, c) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) R.pset(x, y, c); };
// la película: la batalla final, que avanza (los dos bandos se lanzan, choque en «Battle», se abren los portales)
const peliBatalla = (R, t, S) => {
  const [x0, y0, x1, y1] = S, w = x1 - x0, hz = y0 + 46;
  R.recorte(S);
  degradado(x0, y0, x1, hz, rampa(['#3a2232', '#5a2a34', '#8a3a30', '#c0582e', '#e8843a', '#f6b462']), 7);
  for (let y = hz - 20; y < hz; y++) for (let x = x0 + 120; x < x0 + 150; x++) { const d = Math.hypot(x - x0 - 135, y - hz + 2) / 14; if (d < 1 && by(x, y) < (1 - d) * 1.5) R.pset(x, y, d < 0.6 ? hex('#fff0c0') : hex('#f8c878')); }
  for (let k = 0; k < 7; k++) { const vel = [3, 6, 10][k % 3], x = x0 + ((k * 41 + t * vel) % (w + 50)) - 25; humo(x, y0 + 9 + (k % 3) * 9, 4 + (k % 3) * 2, hex('#b88a7a'), hex('#8a6060'), hex('#5a3a44')); }
  for (let x = x0; x <= x1; x++) { const top = hz - 3 - Math.round(10 * hh(x >> 3, 3)) - (x > x0 + 140 ? 5 : 0); R.linea(x, top, x, hz, (x & 7) < 2 ? hex('#2a1c28') : hex('#3a2634')); if ((x & 3) === 1) for (let y = top + 3; y < hz; y += 4) if (hh(x, y) > 0.72) R.pset(x, y, hh(x, y, 4) > 0.5 ? hex('#f8a040') : hex('#c85a28')); }
  for (let y = hz; y <= y1; y++) for (let x = x0; x <= x1; x++) R.pset(x, y, by(x, y) + hh(x >> 1, y >> 1, 2) * 0.4 > 0.72 ? hex('#7a5444') : (y - hz) > 18 ? hex('#4a3230') : hex('#5e3e36'));
  for (let k = 0; k < 10; k++) { const cx = x0 + 8 + k * 19, cy = hz + 6 + (k * 7) % 26; rc(cx, cy, cx + 3, cy, hex('#3a2428')); R.pset(cx + 1, cy - 1, hex('#8a6a5a')); }
  // el ejército de Thanos, de derecha a izquierda: tres filas de siluetas con lanzas y ojos rojos que avanzan
  const av = tramo(t, BATALLA - 0.8, P2);
  for (let fila = 0; fila < 3; fila++) for (let k = 0; k < 12; k++) {
    const hgt = 5 + fila * 2, ax = Math.round(x0 + 104 + k * 7 + fila * 3 - av * (18 + fila * 6)), ay = hz + 3 + fila * 6 + Math.round(Math.sin(t * 7 + k) * (fila ? 1 : 0)), c = fila === 2 ? hex('#1e1220') : fila ? hex('#2a1a2a') : hex('#3e2636');
