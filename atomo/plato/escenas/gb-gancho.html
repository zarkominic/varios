  for (let j = 0; j < 7; j++) { const X = Math.round(ex + Math.cos(a) * j), Y = Math.round(ey + Math.sin(a) * j), sd = j % 2 ? 1 : -1; R.pset(X, Y, j < 2 ? hex('#fff0a0') : hex('#e0b850')); R.pset(X + sd, Y, hex('#b08a30')); if (j % 2 === 0) R.pset(X - sd * 2, Y - 2, hex('#f0e0a0')); } } };
// una mata grande de primer término (de cerca): tallos de dos píxeles, hojas que cuelgan y espigas de 14 px con barbas largas
const mataTrigoG = (x, y, h, t, k) => { for (let f = 0; f < 5; f++) { const a = -1.57 + (f - 2) * 0.16 + Math.sin(t * 1.5 + k + f * 0.7) * 0.06 + Math.sin(t * 0.6 + k) * 0.03, L = h - (f % 2) * h * 0.18;
  const bx = x + (f - 2) * 2, ex = bx + Math.cos(a) * L, ey = y + Math.sin(a) * L;
  R.linea(bx, y, Math.round(ex), Math.round(ey), hex('#6a5a24')); R.linea(bx + 1, y, Math.round(ex) + 1, Math.round(ey), f % 2 ? hex('#9a8a3a') : hex('#b8a250'));
  const hj = 0.45 + (f % 3) * 0.12, hx = bx + Math.cos(a) * L * hj, hy = y + Math.sin(a) * L * hj, sd = f % 2 ? 1 : -1;   // una hoja que cuelga
  for (let i = 0; i < 10; i++) R.pset(Math.round(hx + sd * i), Math.round(hy + i * i * 0.08 - i * 0.3), i < 5 ? hex('#a8a050') : hex('#c8b860'));
  for (let j = 0; j < 14; j++) { const X = Math.round(ex + Math.cos(a) * j), Y = Math.round(ey + Math.sin(a) * j), s2 = j % 2 ? 1 : -1;
    R.pset(X, Y, hex('#c89a38')); R.pset(X + s2, Y, j < 4 ? hex('#fff0a0') : hex('#e8c058')); R.pset(X - s2, Y, hex('#a07828')); if (j % 2 === 0) R.linea(X + s2, Y, X + s2 * 4, Y - 7, hex('#f4e4a8')); } } };
// la hoz de sílex: mango de hueso curvo con dientes de sílex pegados con betún (en la mano m, ángulo a)
const hoz = (m, a) => { const [mx, my] = m, ux = Math.cos(a), uy = Math.sin(a);
  for (let i = 0; i <= 9; i++) { const X = Math.round(mx + ux * i - uy * i * i * 0.03), Y = Math.round(my + uy * i + ux * i * i * 0.03); R.pset(X, Y + 1, hex('#5a4a3a')); R.pset(X, Y, hex('#e8dcc0'));
    if (i > 3) { R.pset(X - Math.round(uy * 2), Y + Math.round(ux * 2), i % 2 ? hex('#3a3a46') : hex('#9a9aa8')); R.pset(X - Math.round(uy), Y + Math.round(ux), hex('#1a1424')); } } };
const cestoG = (x, y, w, h, lleno) => { for (let j = 0; j < h; j++) for (let i = -w; i <= w; i++) { const ii = Math.round(i * (1 - (h - 1 - j) * 0.02)); R.pset(x + ii, y - j, j === h - 1 ? hex('#5a3a1a') : (ii + j) % 2 ? hex('#8a6a3a') : hex('#b08a4a')); }
  for (let i = -w - 1; i <= w + 1; i++) tine(x + i + 3, y + 1, K, 0.35);
  for (let i = -w + 1; i < w; i++) { const hgt = Math.round(lleno * (2 + Math.abs(Math.sin(i * 1.3)) * 3)); for (let q = 0; q < hgt; q++) R.pset(x + i, y - h - q, q === hgt - 1 ? hex('#fff0a0') : hex('#d8b048')); } };
const p9 = (t) => {
  R.copiar(CLARO());
  cielo3(t, 8, 54, pal('#a8b8d0', '#e8eef4', '#ffffff'), 9, 7);
  pajaros(t, 36, 5, 8, 9, hex('#2a2a3a'));
  // el trigo lejano se mece en rachas (ondas claras que corren por las franjas)
  for (let k = 0; k < 3; k++) { const xr = ((t * 30 + k * 130) % 420) - 50; for (let y = 86; y < 112; y += 3) for (let i = 0; i < 18; i++) tine(xr + i + (y - 86) * 0.6, y + (i % 2), hex('#fff4c0'), 0.35 * (1 - i / 18)); }
  // el humo de un campamento detrás de la loma
  for (let k = 0; k < 10; k++) { const u = ((t * 0.22 + k / 10) % 1); tine(40 + Math.sin(u * 5 + t) * 3 + u * 10, 60 - u * 30, hex('#e8e8f0'), 0.5 * (1 - u)); }
  // el niño cruza por detrás del claro con su cesto de espigas, entre el trigo (el de delante le tapa los pies)
  const nx = Math.round(lerp(-20, 330, tramo(t, people - 0.6, people + 3.2)));
  const n = R.actor(T.GB.ninoGB, nx, 118, t, { dir: 1, anda: true, sostiene: true, sonrisa: true });
  if (n && n.mano) { const [mx, my] = n.mano; for (let j = 0; j < 5; j++) for (let i = -3; i <= 3; i++) R.pset(mx + i + 2, my - 4 + j, (i + j) % 2 ? hex('#8a6a3a') : hex('#b08a4a')); for (let i = -2; i <= 2; i++) R.pset(mx + i + 2, my - 5, hex('#f0d070')); }
  for (let x = 0; x < 320; x += 4) mataTrigo(x + (x % 8 ? 2 : 0), 120, 9 + (x % 12 ? 0 : 3), t, 1, x, 3);
  // los gorriones que picotean el grano caído y se levantan en «wild wheat»
  for (let k = 0; k < 5; k++) { const bx0 = 196 + k * 11, by0 = 150 + (k % 2) * 6, u = tramo(t, wild + k * 0.08, wild + k * 0.08 + 1.6);
    const X = Math.round(bx0 + u * (60 + k * 14)), Y = Math.round(by0 - u * (90 + k * 8) - Math.sin(u * 3) * 6); if (X > 270 && Y < 48) continue;
    if (u <= 0) { const pic = Math.floor(t * 3 + k) % 3 === 0; R.rect(X - 1, Y - 2, X + 1, Y - 1, hex('#7a5a3a')); R.pset(X + 2, Y - (pic ? 1 : 3), hex('#5a4030')); R.pset(X + 3, Y - (pic ? 0 : 3), hex('#d8a040')); R.pset(X, Y, hex('#3a2a1a')); R.pset(X - 2, Y - 2, hex('#5a4030')); }
    else { const al = Math.sin(t * 22 + k) > 0; R.pset(X, Y, hex('#7a5a3a')); R.pset(X + 1, Y, hex('#5a4030')); R.pset(X - 1, Y - (al ? 1 : -1), hex('#7a5a3a')); R.pset(X + 2, Y - (al ? 1 : -1), hex('#7a5a3a')); R.pset(X - 2, Y - (al ? 2 : 0), hex('#9a7a5a')); R.pset(X + 3, Y - (al ? 2 : 0), hex('#9a7a5a')); } }
  // la piedra de moler con su grano y el odre, a la izquierda del claro
  T.d_moler(R, 64, 172, { t, mano: 0.3 });
  // la cazadora entra por la senda con su cesto; en «tend» siega un manojo con la hoz de sílex; en «wild wheat» las espigas
  // se le desgranan en la mano (el trigo silvestre suelta el grano solo) y lo echa al cesto
  const MX = 140, MY = 164;   // la mata que siega
  mataTrigo(MX + 14, MY, 22, t, 1, 3, 5); mataTrigo(MX + 24, MY + 2, 20, t, 1, 7, 4);
  const va = ease(tramo(t, P9 + 0.1, tend - 0.5)), cx = Math.round(lerp(78, MX - 6, va)), siega = t > tend - 0.45, desg = t > wild;
  const lleno = cl(tramo(t, wild + 0.3, wild + 1.6));
  cestoG(MX - 12, MY + 1, 6, 7, lleno);
  const ang = siega && t < tend + 0.3 ? Math.sin((t - tend) * 14) * 0.6 : 0.4;
  const c = R.actor(T.GB.cazadoraGB, cx, MY + 4, t, { dir: 1, anda: va > 0 && va < 1, sostiene: siega ? (desg ? [cx + 19, MY - 18] : [cx + 19, MY - 12 + Math.round(ang * 4)]) : [cx + 18, MY - 6], sonrisa: siega && !desg, sorpresa: desg && t < wild + 0.7 });
  if (c && c.mano) { const [mx, my] = c.mano;
    if (!siega) hoz([mx, my], 0.9);
    else if (!desg) { hoz([mx, my], -0.2 + ang); }
    else {   // el manojo en alto, que se desgrana
      halo(mx + 1, my - 10, 12, hex('#fff8d0'), 0.45); const queda = Math.max(4, 12 - Math.floor((t - wild) * 7));
      for (let s_ = -1; s_ <= 1; s_++) { R.linea(mx + s_, my + 1, mx + s_ * 2, my - 4, hex('#a8944a'));
        for (let j = 0; j < queda; j++) { const Y = my - 5 - j, X = mx + s_ * 3, sd = j % 2 ? 1 : -1; R.pset(X, Y, j === queda - 1 ? hex('#fff0a0') : hex('#e0b850')); R.pset(X + sd, Y, hex('#b08a30')); } }
      for (let k = 0; k < 10; k++) { const u = tramo(t, wild + k * 0.09, wild + k * 0.09 + 0.6); if (u <= 0 || u >= 1) continue; const X = mx + Math.round(Math.sin(k * 2.1) * 4 + u * (k - 4.5)), Y = Math.round(my - 12 + u * 30); R.pset(X, Y, hex('#f0c050')); R.pset(X, Y + 1, hex('#8a6a2a')); } } }
  // Atom, en el claro a la derecha, mira y señala el manojo (se pinta después del niño, que va por detrás)
  T.AT.atom(R, 246, 168, t, { dir: -1, pose: t > beginning && t < tend ? 'saluda' : t > wild ? 'senala' : 'quieto', cara: t > wild ? 'sonrisa' : 'normal', habla: 0 });
  // las matas altas de delante, por los lados y abajo, que se mecen (primer término)
  for (const [x, y, h, k] of [[4, 184, 96, 1], [16, 186, 80, 2], [30, 188, 62, 3], [44, 190, 40, 9], [312, 184, 92, 4], [300, 186, 74, 5], [288, 188, 54, 6], [274, 190, 34, 10], [104, 192, 26, 7], [196, 192, 24, 8], [226, 192, 20, 11]]) mataTrigoG(x, y, h, t, k);
};

// ── 10 · el salón de noche con el móvil ─────────────────────────────────────────────────────────────────────────
const corazon = (x, y, c) => { for (const [i, j] of [[-2, -1], [-1, -2], [1, -2], [2, -1], [-2, 0], [2, 0], [-1, 1], [1, 1], [0, 2], [0, -1]]) R.pset(x + i, y + j, c); R.pset(x - 1, y - 1, hex('#ffffff')); R.pset(x, y, c); R.pset(x - 1, y, c); R.pset(x + 1, y, c); R.pset(x + 1, y - 1, c); R.pset(x, y + 1, c); };
const p10 = (t) => {
  const o = { encuadre: 'salon', movil: true };
  T.hoy(R, t, o);
  T.AT.atom(R, 248, 150, t, { dir: -1, pose: t > lost ? 'piensa' : 'quieto', cara: t > internet && t < lost ? 'sorpresa' : 'normal', habla: 0 });
  T.hoyDelante(R, t, o);
  // el globo de avisos salta en «internet», con su número que sube
  if (t > internet - 0.05) { const u = tramo(t, internet - 0.05, internet + 0.25), r = Math.round(6 * ease(cl(u)) + (u < 1 ? Math.sin(u * 3.14) * 2 : 0)), n = Math.min(99, Math.floor(12 + (t - internet) * 30));
    R.disco(196, 44, r + 1, K); R.disco(196, 44, r, ROJO[2]); R.disco(195, 43, Math.max(1, r - 3), ROJO[3]); if (u >= 1) R.numero(String(n), 196, 47, { centro: true, rampa: pal('#ffffff', '#ffffff', '#ffffff', '#ffffff') }); }
  // los corazones que suben del lado del móvil
  for (let k = 0; k < 4; k++) { const u = ((t - internet) * 0.6 + k * 0.25) % 1; if (t < internet || u < 0) continue; corazon(Math.round(204 + Math.sin(u * 6 + k) * 3), Math.round(140 - u * 70), u > 0.8 ? ROJO[1] : ROJO[2]); }
  if (t > lost) { const u = tramo(t, lost, lost + 0.25); R.icono('?', 250, Math.round(112 - u * 4), hex('#fff0a0'), K, 2); }
};

// ── 11 · la versión de internet: «lo enterraron a propósito» ───────────────────────────────────────────────────
const p11 = (t) => {
  const o = { encuadre: 'excavacion', camara: 'corte' };
  T.colina(R, t, o);
  T.colinaDelante(R, t, o);
  velo(hex('#1a1040'), 0.5);
  // la tierra nueva que se amontona arriba y los terrones que caen
  const u = tramo(t, buried - 0.1, P11 + 4.2), alto = Math.round(u * 9);
  for (let x = 192; x < 270; x++) { const h = Math.round(alto * (1 - Math.pow((x - 230) / 40, 2)) + hh(x >> 2, 4) * 1.5) - (x > 264 ? 1 : 0); if (h <= 0) continue; for (let y = 0; y < h; y++) R.pset(x, 38 - y, tono(pal('#2a1410', '#3e2018', '#542c20'), 1 + (y === h - 1 ? 1 : 0) + hh(x, y) * 0.6, x, 38 - y)); }
  // dos encapuchados con antorcha vuelcan sus cestos sobre el corte
  const OSC = { C: '#2a2238', c: '#1e1828', M: '#2a2238', m: '#1e1828', H: '#141020', h: '#1e1828' };
  [[204, 0], [236, 0.6]].forEach(([x, d], k) => { const vuelca = Math.sin((t - P11 + d) * 3) > 0, y0 = 38 - Math.round(alto * Math.max(0, 1 - Math.pow((x + 7 - 230) / 40, 2)));
    halo(x + (k ? 18 : -4), y0 - 22, 18, hex('#ff9a40'), 0.45);
    const a = R.actor(T.GB.cazador2GB, x, y0, t, { dir: 1, pal: OSC, sostiene: vuelca ? [x + 20, y0 - 18] : [x + 17, y0 - 12], enfado: true });
    if (a && a.mano) { const [mx, my] = a.mano; for (let j = 0; j < 5; j++) for (let i = -3; i <= 3; i++) R.pset(mx + i + 2, my - 3 + j + (vuelca ? -i * 0.4 : 0), (i + j) % 2 ? hex('#4a3420') : hex('#6a4a2a'));
      if (vuelca) for (let q = 0; q < 6; q++) { const f = ((t * 2 + q / 6) % 1); R.disco(Math.round(mx + 6 + f * 6 + q % 2), Math.round(my + f * 22), 1, hex('#5a3020')); } }
    const tx = k ? x - 4 : x + 18; R.linea(tx, y0 - 4, tx, y0 - 16, hex('#4a2e18')); const f = Math.sin(t * 15 + k * 2); R.poligono([[tx - 2, y0 - 16], [tx + Math.round(f), y0 - 23], [tx + 2, y0 - 16]], hex('#ffb040')); R.pset(tx, y0 - 18, hex('#fff0a0')); });
  // la barra de vídeo abajo: la versión de internet
  R.rect(8, 174, 312, 175, hex('#4a4a5a')); const pv = Math.round(lerp(8, 312, tramo(t, P11, P11 + 4.6))); R.rect(8, 174, pv, 175, ROJO[2]); R.disco(pv, 174, 2, ROJO[3]);
  if (t > knew - 0.1) { const a = tramo(t, knew - 0.1, knew + 0.2); halo(120, 98, 30, ROJO[2], 0.35 * a); R.icono('?', 110, Math.round(80 - a * 6), ROJO[3], K, 4); }
};

const año = (t) => t < P7 ? -9600 : t < P9 ? 2026 : t < P10 ? -9600 : 2026;
const efectos = [[0.4, 'carro'], [seis, 'brillo'], [before, 'pop'], [stone, 'boom'], [stone + 0.4, 'publico'],
  [P2 + 0.3, 'pasos'], [n11, 'brillo'], [bare, 'viento'], [P3 + 0.3, 'carro'], [leather, 'brillo'], [n30, 'pop'], [tshape, 'brillo'],
  [twomen - 0.2, 'boing'], [car, 'claxon'], [rises, 'carro'], [baseW, 'avalancha'], [P5 + 0.3, 'pasos'], [metal + 0.25, 'toc'], [wheels + 0.25, 'toc'], [animals + 0.25, 'toc'], [village + 0.25, 'toc'],
  [P6 + 0.3, 'pasos'], [arms, 'brillo'], [fox, 'brillo'], [real, 'flash'], [gobekli, 'brillo'], [pyramids, 'whoosh'],
  [writing + 0.05, 'golpecito'], [wheel - 0.6, 'carro'], [grain, 'brillo'], [olderEven, 'brillo'], [P9 + 0.5, 'viento'], [people, 'pasos'], [wild, 'brillo'],
  [internet, 'bip'], [lost + 0.3, 'whoosh'], [buried, 'chof'], [handsI, 'chof'], [knew, 'trueno']];
T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3], [P4, p4], [P5, p5], [P6, p6], [P7, p7], [P8, p8], [P9, p9], [P10, p10], [P11, p11]], { efectos, año });
