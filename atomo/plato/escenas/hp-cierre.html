<script type="module">
// HP-CIERRE (frases 34–35), hoy. Cuatro planos:
// 1. (0 → «In this world», 4,5 s) el claro del bosque: Harry entra con una lupa enorme; en «details» se para y el
//    cristal agranda una moto en miniatura escondida junto a las setas; se asombra («!») y el faro se enciende en
//    «episode»; la snitch se asoma tras el tronco. La esquina de Atom queda despejada: el tronco grande y las copas de la
//    derecha se quitan desde la escena (se repinta el fondo del claro sin ellos) y allí se ve cielo tramado con estrellas
//    que titilan, una nube tenue y una copa lejana azulada que se mece, con los troncos lejanos debajo.
// 2. (→ «decoration», 4,2 s) la tienda de túnicas: Hermione entra con la lupa, se sube al escabel junto a la estantería
//    de los carretes y la pasea por la balda de abajo mientras la costurera toma medidas a un alumno subido al taburete;
//    en «accident» el cristal se para sobre el calcetín de lana escondido entre los carretes, que en la lupa se ve grande
//    (a rayas rojas y crema, con su puño de canalé, el talón y la puntera verdes) sobre los carretes aumentados.
// 3. (→ «Tell», 5,9 s) el Gran Comedor vacío de noche, a ras de una mesa de las casas (cámara del estrado, en penumbra
//    azul y con el haz de luna del ventanal): la mesa larga entra en diagonal en primer término con su banco; la snitch
//    arrastra la lupa de objeto en objeto (plato, copa, la moto en miniatura, la vela que humea, la jarra, el calcetín, el
//    libro); en «clue» se para sobre la rata dormida junto al cabo de vela, que abre un ojo; en «which
//    house» se encienden uno a uno los cuatro estandartes y sale un «?» sobre el ventanal.
// 4. (→ fin, 6,2 s) las gradas del campo: cuatro hinchas levantan sus banderas de los cuatro colores en «Tell me in the
//    comments»; en «Meanwhile» Atom baja de su sitio; en «catch» se lanza a por la snitch, que se escapa por arriba en
//    «again»: Atom choca, da vueltas con estrellas, la grada se ríe y él vuelve a su sitio (gag final).
import * as T from '/atomo/plato/escenas/hp-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hp-cierre');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const P = T.PIEZAS_HP, C = T.C, K = hex('#141018');
// el decorado pega el fondo fijo con R.copiar: se guarda el último búfer copiado para repintar el claro sin el tronco grande
let copiado = null; const copiar0 = R.copiar; R.copiar = (b) => { copiado = b; return copiar0(b); };
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], umb = (x, y) => (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255, r2 = c2 & 255, g2 = (c2 >>> 8) & 255, b2 = (c2 >>> 16) & 255; return (0xff000000 | (Math.round(b1 + (b2 - b1) * a) << 16) | (Math.round(g1 + (g2 - g1) * a) << 8) | Math.round(r1 + (r2 - r1) * a)) >>> 0; };
// un halo tramado (no tapa: puntea) alrededor de (cx, cy)
const hsh = (x, y, k) => { const v = Math.sin(x * 12.9898 + y * 78.233 + k * 37.719) * 43758.5453; return v - Math.floor(v); };
const halo = (cx, cy, r, c, k = 0) => { for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++) { const d = Math.hypot(x - cx, y - cy) / r; if (d < 1 && ((x + y) & 1) && hsh(x, y, k % 3) < (1 - d) * (1 - d) * 1.4 + 0.08) R.pset(x, y, c); } };
// destellos en cruz que giran alrededor de (cx, cy)
const chispas = (cx, cy, r, t, c = hex('#fff4c0'), n = 5) => { for (let k = 0; k < n; k++) { const a = k * 6.283 / n + t * 3, x = Math.round(cx + Math.cos(a) * r), y = Math.round(cy + Math.sin(a) * r * 0.8); if (Math.sin(t * 11 + k * 2) > -0.2) { R.pset(x, y, c); R.pset(x - 1, y, c); R.pset(x + 1, y, c); R.pset(x, y - 1, c); R.pset(x, y + 1, c); } } };
// un sprite de letras con su paleta (s: escala)
const pinta = (g, x0, y0, pal, s = 1) => { for (let j = 0; j < g.length; j++) for (let i = 0; i < g[j].length; i++) { const c = pal[g[j][i]]; if (c != null) R.rect(x0 + i * s, y0 + j * s, x0 + i * s + s - 1, y0 + j * s + s - 1, c); } };

// la lupa grande: aumenta k veces lo que hay debajo (copia antes los píxeles), aro de latón con su luz, el reflejo del
// cristal y el mango de madera hacia la mano (mano = [x, y]) o hacia donde se diga
const lente = (cx, cy, r, k = 2.5, mano = null) => {
  cx = Math.round(cx); cy = Math.round(cy);
  const n = 2 * r + 1, S = new Array(n * n);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) S[j * n + i] = R.pget(cx - r + i, cy - r + j);
  if (mano) {
    const [hx, hy] = mano, a = Math.atan2(hy - cy, hx - cx), L = Math.hypot(hx - cx, hy - cy);
    for (let d = r + 1; d <= L + 1; d += 0.5) R.disco(Math.round(cx + Math.cos(a) * d), Math.round(cy + Math.sin(a) * d), 2, K);
    for (let d = r + 1; d <= L; d += 0.5) { const x = Math.round(cx + Math.cos(a) * d), y = Math.round(cy + Math.sin(a) * d); R.disco(x, y, 1, d < r + 5 ? hex('#c8902a') : hex('#7a4422')); if (d > r + 5) R.pset(x, y - 1, hex('#a86a3a')); }
  }
  for (let j = -r - 2; j <= r + 2; j++) for (let i = -r - 2; i <= r + 2; i++) {
    const d = Math.hypot(i, j);
    if (d <= r - 2.5) {
      let c = S[Math.round(r + j / k) * n + Math.round(r + i / k)] || K;
      c = mez(c, hex('#e4f2ff'), 0.1);
      const diag = i + j;
      if ((diag < -r * 0.85 && diag > -r * 1.05) || (diag < -r * 1.2 && diag > -r * 1.28)) c = mez(c, hex('#ffffff'), 0.55);
      R.pset(cx + i, cy + j, c);
    } else if (d <= r - 1.5) R.pset(cx + i, cy + j, hex('#6a4a18'));
    else if (d <= r + 0.9) { const luz = i + j; R.pset(cx + i, cy + j, luz < -r * 0.6 ? hex('#fff0b0') : luz < r * 0.3 ? hex('#e8b440') : hex('#a8701e')); }
    else if (d <= r + 1.9) R.pset(cx + i, cy + j, K);
  }
};
// la moto en miniatura (12 × 7), tan pequeña que solo se ve con la lupa
const MOTO_MINI = ['.....kk.....', '....kAAk.kk.', '..kkAAAAkOk.', '.kKkkkkkkKk.', 'kKlKk..kKlKk', 'kKKKk..kKKKk', '.kkk....kkk.'];
const motoMini = (x, y, faro = false) => pinta(MOTO_MINI, x, y, { k: K, A: hex('#d8283a'), K: hex('#4a4a56'), l: hex('#d8d8e8'), O: hex(faro ? '#fff8c0' : '#c8a040') });

const P2 = en('detalles', 0.334), P3 = en('detalles', 0.685), P4 = en('casa', 0.288);
const detalles = en('detalles', 0.174), episodio = en('detalles', 0.249), accidente = en('detalles', 0.553), pista = en('detalles', 0.880), ultimo = en('detalles', 0.927);
const casaT = en('casa', 0.065), dime = en('casa', 0.298), mientras = en('casa', 0.537), atrapa = en('casa', 0.757), otra = en('casa', 0.908);
// la esquina de arriba a la derecha del claro sin el tronco grande ni las copas oscuras (detrás de Atom): de arriba abajo,
// cielo tramado con estrellas, una nube tenue que pasa despacio, una copa lejana azulada que se mece y, debajo, el fondo
// del claro tal cual (troncos lejanos, sotobosque y hierba) con la niebla que corre por el suelo
const borde = (y) => 259 + Math.round(hsh(0, y >> 2, 5) * 3);
const copaArriba = (x) => Math.round(lerp(18, 50, Math.min(1, (x - 256) / 30)) + Math.sin(x * 0.45) * 2 + hsh(x >> 1, 0, 6) * 3);
const copaAbajo = (x) => Math.round(70 + Math.sin(x * 0.3) * 3 + hsh(x >> 1, 1, 6) * 4);
const esquina = (t) => {
  const F = copiado, B = R.buf; if (!F) return;
  const N0 = hex('#0a0e22'), N1 = hex('#111840'), N2 = hex('#18224e');
  for (let y = 0; y <= 156; y++) for (let x = borde(y); x < 320; x++) {
    const ya = copaArriba(x), yb = copaAbajo(x), i = y * 320 + x;
    if (y < ya) { const f = y / 52 * 2, k = Math.min(1, Math.floor(f)), g = f - k; B[i] = g > umb(x, y) ? (k ? N2 : N1) : (k ? N1 : N0); }
    else if (y < yb) { const q = hsh(x >> 1, y >> 1, 8), m = Math.sin(t * 0.9 + x * 0.12) * 0.12, bor = y - ya;
      B[i] = bor < 1 ? hex('#3a4a80') : bor < 3 && q > 0.35 ? hex('#2c3a6a') : q + m > 0.72 ? hex('#26325e') : q + m < 0.2 ? hex('#121a36') : hex('#1a2448'); }
    else B[i] = F[i];
  }
  // las estrellas (unas fijas, otras titilan) y la nube tenue de tres tonos que pasa despacio, por debajo de Atom
  for (let k = 0; k < 16; k++) { const x = 262 + Math.floor(hsh(k, 1, 9) * 56), y = 2 + Math.floor(hsh(k, 2, 9) * 40); if (y >= copaArriba(x) - 1) continue; const b = Math.sin(t * (1.5 + hsh(k, 3, 9) * 2) + k * 1.7);
    R.pset(x, y, b > 0.6 ? hex('#ffffff') : b > -0.3 ? hex('#8a9ad0') : hex('#3a4a80')); if (k % 5 === 0 && b > 0.85) { R.pset(x - 1, y, hex('#5a6aa8')); R.pset(x + 1, y, hex('#5a6aa8')); } }
  { const nx = 250 + ((t * 2.2) % 90), ny = 48; for (let j = -3; j <= 3; j++) for (let i = -14; i <= 14; i++) { const x = Math.round(nx + i), y = ny + j, e = (i / 14) ** 2 + (j / 3.4) ** 2 - hsh(x >> 1, y, 10) * 0.25;
    if (e < 1 && x >= borde(y) && x < 320 && y < copaArriba(x) + 2) R.pset(x, y, e < 0.35 && j < 0 ? hex('#46548a') : e < 0.7 ? hex('#26305c') : ((x + y) & 1) ? hex('#151c42') : R.pget(x, y)); } }
  // la niebla del suelo, que el repintado había quitado, corre otra vez por la esquina
  for (let y = 132; y <= 156; y++) for (let x = borde(y); x < 320; x++) { const v = Math.sin(x * 0.08 + t * 0.7 + y * 0.3) + Math.sin(x * 0.03 - t * 0.4); if (v > 0.6 && ((x + y) & 1)) R.pset(x, y, mez(R.pget(x, y), hex('#8a9ac8'), 0.3)); }
};
const p1 = (t) => {
  copiado = null;
  T.exterior(R, t, { encuadre: 'bosque', camara: 'claro' });
  esquina(t);
  // la moto en miniatura, escondida entre la hierba junto a las setas
  motoMini(194, 157, t > episodio && Math.sin(t * 6) > -0.3);
  // la snitch se asoma por detrás del tronco caído
  const as = tramo(t, detalles + 0.3, detalles + 0.8) * (1 - tramo(t, P2 - 0.4, P2));
  T.snitch(R, 70, Math.round(lerp(150, 136, as)), t, { cara: as > 0.5 ? 'susto' : 'normal' });
  // Harry entra con la lupa y se para en «details» con el cristal sobre la moto
  const u = tramo(t, 0.15, detalles - 0.1), ue = u * (2 - u), hx = Math.round(lerp(-46, 160, ue));
  const rh = R.actor(EL.harry, hx, 166, t, { dir: 1, anda: u > 0 && u < 1, sostiene: [hx + 18, 148], sorpresa: t > detalles && t < episodio + 0.4, sonrisa: t > episodio + 0.4 });
  T.exteriorDelante(R, t, { encuadre: 'bosque', camara: 'claro' });
  const bus = u < 1 ? Math.sin(t * 5) * 3 : 0;
  lente(rh.mano[0] + 22, rh.mano[1] + 10 + bus, 18, lerp(2.2, 3.2, tramo(t, detalles, detalles + 0.4)), rh.mano);
  if (t > detalles + 0.15 && t < episodio + 0.8) R.icono('!', rh.cabeza[0] - 3, rh.cabeza[1] - 26, hex('#ffe890'), K, 2);
};
// el calcetín escondido en la balda de abajo de la estantería (7 × 9, entre los carretes) y el mismo, grande, en la lupa
// (18 × 22: puño de canalé, rayas rojas y crema con el punto de la lana, talón y puntera verdes)
const CALC_P = ['kkkk...', 'kDDk...', 'kRRk...', 'kDDk...', 'kRRk...', 'kDDkk..', 'kRRRRk.', 'kHDDDHk', '.kkkkk.'];
const CALC_G = ['kkkkkkkkkk........', 'kWdWdWdWdk........', 'kWdWdWdWdk........', 'kWdWdWdWdk........', 'kkkkkkkkkk........',
  'klRRRRRRrk........', 'klRrRRrRrk........', 'klRRRRRRrk........', 'klDDDDDDdk........', 'klDdDDdDdk........', 'klDDDDDDdk........',
  'klRRRRRRrk........', 'klRrRRrRrk........', 'klRRRRRRrk........', 'kHHDDDDDDdkk......', 'kHHHDdDDdDDDkk....', 'kHHHRRRRRRRRRRkk..',
  'kHHHRrRRrRRrRRHHk.', 'kHHHDDDDDDDDDDHHHk', 'khHHDdDDdDDdDDHHhk', '.khhHHHHHHHHHHHhhk', '..kkkkkkkkkkkkkkk.'];
const CALC_PAL = { k: hex('#2a1418'), R: hex('#d0283a'), r: hex('#9a1a2a'), D: hex('#f4e8cc'), d: hex('#c8b898'), W: hex('#fff6e0'), l: hex('#ffd8d8'), H: hex('#2e9a52'), h: hex('#1a6a36') };
const CALC_X = 47, CALC_Y = 90;
// pinta un sprite donde ok(x, y) lo permita
const pintaSi = (g, x0, y0, pal, ok) => { for (let j = 0; j < g.length; j++) for (let i = 0; i < g[j].length; i++) { const c = pal[g[j][i]]; if (c != null && ok(x0 + i, y0 + j)) R.pset(x0 + i, y0 + j, c); } };
const p2 = (t) => {
  T.diagon(R, t, { encuadre: 'tunicas' });
  // un alumno en el taburete; la costurera le toma medidas con la cinta y se vuelve en «accident»
  R.actor(EL.alumno, 183, 146, t, { dir: -1, sonrisa: true, sorpresa: t > accidente && t < accidente + 0.8 });
  const mide = Math.sin(t * 3) > 0;
  const rc = R.actor(EL.costurera, 204, 166, t, { dir: -1, sostiene: mide ? [196, 140] : [198, 150], sorpresa: t > accidente + 0.1 && t < accidente + 0.9 });
  R.linea(rc.mano[0], rc.mano[1], 190, mide ? 136 : 148, hex('#f0d040'));
  // en la mesita, los carretes de hilo
  for (const [x, c] of [[98, '#3a6ad8'], [104, '#c8283a'], [118, '#3a9a3a']]) { R.rect(x - 2, 118, x + 2, 124, K); R.rect(x - 1, 119, x + 1, 123, hex(c)); R.linea(x - 2, 118, x + 2, 118, hex('#a87a4a')); R.linea(x - 2, 124, x + 2, 124, hex('#a87a4a')); }
  R.rect(104, 124, 120, 126, K); R.rect(105, 125, 119, 125, hex('#2a6a4a'));
  // el escabel de madera junto a la estantería (tablero en y 146, peldaño en 156, patas hasta el suelo) y su sombra
  for (let x = 48; x <= 76; x++) if ((x & 1) === 0 || (x > 52 && x < 72)) R.pset(x, 167, mez(R.pget(x, 167), K, 0.5));
  for (const [x, c] of [[54, hex('#4a2a14')], [68, hex('#4a2a14')]]) R.rect(x, 149, x + 1, 163, c);
  for (const [x0, x1] of [[51, 53], [70, 72]]) { R.rect(x0, 149, x1, 166, hex('#3a2010')); R.rect(x0 + 1, 149, x1 - 1, 166, hex('#8a5a32')); R.pset(x0 + 1, 152, hex('#b07a44')); R.pset(x0 + 1, 160, hex('#6a3e22')); }
  R.rect(50, 155, 73, 158, hex('#3a2010')); R.rect(51, 156, 72, 157, hex('#9a6436')); R.linea(51, 156, 72, 156, hex('#c08a50'));
  R.rect(49, 145, 74, 149, hex('#3a2010')); R.rect(50, 146, 73, 148, hex('#9a6436')); R.linea(50, 146, 73, 146, hex('#c8925a')); for (let x = 53; x < 72; x += 6) R.pset(x, 147, hex('#7a4a28'));
  // Hermione entra, se sube al escabel y levanta la lupa hacia la balda de abajo de la estantería
  const u = tramo(t, P2 + 0.05, P2 + 1.15), sube = tramo(t, P2 + 1.2, P2 + 1.55);
  const hx = Math.round(lerp(-46, 42, u * (2 - u)) + sube * 12), hy = Math.round(lerp(166, 146, sube) - Math.sin(sube * Math.PI) * 6);
  const rh = R.actor(EL.hermione, hx, hy, t, { dir: 1, anda: (u > 0 && u < 1) || (sube > 0 && sube < 1), sostiene: [hx + 15, hy - 34], sorpresa: t > accidente && t < accidente + 0.6, sonrisa: t > accidente + 0.6 });
  T.diagonDelante(R, t, { encuadre: 'tunicas' });
  // la lupa: junto a ella mientras anda; luego busca por la balda de derecha a izquierda (frena en cada carrete) y en
  // «accident» se para sobre el calcetín
  const busca = tramo(t, P2 + 1.45, accidente - 0.1), w = busca - Math.sin(busca * Math.PI * 4) / (Math.PI * 4) * 0.8, para = tramo(t, accidente - 0.1, accidente + 0.25), pp = para * (2 - para);

  lx = lerp(lx, CALC_X + 3, pp); ly = lerp(ly + (para < 1 ? Math.sin(t * 6) * 2 : 0), CALC_Y + 4, pp);
  const lr = 21, lk = 1.7 + Math.sin(tramo(t, accidente, accidente + 0.5) * Math.PI) * 0.25;

  pintaSi(CALC_P, CALC_X, CALC_Y, CALC_PAL, (x, y) => Math.hypot(x - LX, y - LY) > lr + 2);
  const gx = Math.round(LX + (CALC_X + 3.5 - LX) * lk - 9), gy = Math.round(LY + (CALC_Y + 4.5 - LY) * lk - 11);

// plano 3: el Gran Comedor vacío de noche visto a ras de una mesa de las casas (cámara 'mesa' del estrado, oscurecida

const COPA = ['kkkkkkk', 'kGooOgk', 'kOoOOgk', '.kOOgk.', '..kgk..', '..kgk..', '..kgk..', '.kOOgk.', 'kkkkkkk'];
