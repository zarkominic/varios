  for (let j = 0; j < 7; j++) { const y = 167 + j, x = 11 + Math.round(Math.sin(t * 4 + j * 1.3) * 1.2); R.pset(x, y, j % 2 ? hex('#a8783a') : hex('#e8b860')); if (j < 4) R.pset(x + 1, y, hex('#8a6a3a')); }
  { const f = (t * 0.7) % 1, r = 1 + f * 7; for (let i = 0; i < 16; i++) { const an = i / 16 * Math.PI * 2, x = Math.round(36 + Math.cos(an) * r), y = Math.round(170 + Math.sin(an) * r * 0.35); if (((x - 31) / 23) ** 2 + ((y - 170.5) / 4.5) ** 2 < 0.8) R.pset(x, y, mez(R.pget(x, y), hex('#6a74a0'), 0.6 * (1 - f))); } }
  // Hume sale de su puerta a la escalinata y mira la plaza; señala el balcón antes de «few»

  { const sw = Math.round(Math.sin(t * 1.3) * 1.2), sx = 309 + sw; R.linea(306, 98, 306 + sw, 101, PZ.hierro); R.linea(314, 98, 314 + sw, 101, PZ.hierro);

};
