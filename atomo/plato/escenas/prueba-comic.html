<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prueba de identidad · cómic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fuentes" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=block">
<style>
  html, body { margin: 0; height: 100%; background: #efe3c8; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// Prueba de identidad · cómic (a partir de estilos/12-comic.html).
// Página impresa con dos viñetas: la grande (la historia) y una estrecha a la derecha con la
// regla de potencias de diez. Tinta gruesa, tramas Ben-Day, planchas fuera de registro y papel.
// [hola] Atom da un bote y saluda con un electrón que hace de mano. [atom] crece sobre un
// estallido con líneas de concentración y sus electrones aceleran. [bloques] cinco átomos
// llegan con líneas de velocidad y cierran un anillo con él. [explico] salta una pizarrita
// con «?», que en [escuela] se convierte en «!». [saltos]→[pelo] cuatro zooms ×10: cada nivel
// es una viñeta incrustada que crece hasta llenar la grande (persona → mano → piel con vello →
// pelo saliendo de la piel → el pelo como un tronco), con golpe de cámara en cada llegada y el
// marcador de la regla bajando de 10⁰ a 10⁻⁴ m. [decima]→[milimetro] cota de lado a lado del
// pelo con su cartela «10⁻⁴ m». Después todo se asienta y queda quieto.
// Cada nivel se dibuja en vectorial con su propia transformación, así que al ampliarlo la trama
// crece como en una viñeta impresa vista con lupa; las tramas se recortan a lo visible.
import { escena } from '/atomo/plato/escena.js';

const E = await escena('prueba-comic', 'prueba');
const M = (k) => E.marca(k);
const DUR = E.duracion;
const W = 1920, H = 1080, TAU = Math.PI * 2, PI = Math.PI;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let S = 1, OX = 0, OY = 0, builtS = 0;

// Paleta de imprenta (la del demo) y tintas de esta historia.
const C = {
  paper: '#f1e5c9', white: '#fffaee', ink: '#17151b',
  yellow: '#f6cd2a', yellowL: '#fbe48c', orange: '#ef8f2c', red: '#de3a2e', redDk: '#9e1f2c',
  magenta: '#d8337f', cyan: '#1ea2d6', cyanL: '#9fd8ef', cyanP: '#cdebf5', blue: '#2b55a6',
  navy: '#1c2654', navyDk: '#0f1534',
  skin: '#f6c49b', skinL: '#fbdcc0', skinDk: '#e0754e', hair: '#8a4a22', hairDk: '#43200c', hairL: '#d48a45',
  board: '#2f5b4b', boardDk: '#1b382e', wood: '#c97f38', woodDk: '#7d4519',
};
const FT = "'Bangers', Impact, sans-serif";
const FM = "'Comic Neue', 'Comic Sans MS', sans-serif";      // la «m» (Bangers solo tiene mayúsculas)
const MIS = { x: 2.4, y: 1.6 };            // fuera de registro de las planchas de color

// ---------- página ----------
const PP = { x0: 40, y0: 40, x1: 1488, y1: 1040 };   // viñeta grande
const PR = { x0: 1514, y0: 40, x1: 1880, y1: 1040 }; // viñeta de la regla
const PC = { x: (PP.x0 + PP.x1) / 2, y: (PP.y0 + PP.y1) / 2 };
const PWd = PP.x1 - PP.x0, PHt = PP.y1 - PP.y0;

// ---------- tiempos (todo sale de las marcas) ----------
const T = {
  hola: M('hola'), holaF: M('hola_fin'), atom: M('atom'), atomF: M('atom_fin'),
  bloques: M('bloques'), bloquesF: M('bloques_fin'), explico: M('explico'), escuela: M('escuela'),
  saltos: M('saltos'), pelo: M('pelo'), decima: M('decima'), mm: M('milimetro'), mmF: M('milimetro_fin'),
};
T.quieto = DUR - 0.6;                                 // a partir de aquí, nada se mueve
T.calma0 = Math.min(T.mmF, T.quieto - 0.25);
T.d = (T.pelo - T.saltos) / 4;                         // duración de cada salto ×10
T.llegada = [1, 2, 3, 4].map((j) => T.saltos + j * T.d);

// ---------- utilidades ----------
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hsh(a, b) { let h = Math.imul((a | 0) + 0x9e3779b9 | 0, 0x85ebca6b) ^ Math.imul((b | 0) + 0x7f4a7c15 | 0, 0xc2b2ae35); h = Math.imul(h ^ h >>> 15, 0x2c1b3c6d); h = Math.imul(h ^ h >>> 12, 0x297a2d39); h ^= h >>> 15; return (h >>> 0) / 4294967296; }
const cl = (x) => x < 0 ? 0 : x > 1 ? 1 : x;
const seg = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, u) => a + (b - a) * u;
const eio = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eout = (x) => 1 - Math.pow(1 - x, 3);
const ein = (x) => x * x * x;
const eback = (x, s = 1.70158) => { const c3 = s + 1; return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
const einb = (x, s = 0.6) => (s + 1) * x * x * x - s * x * x;       // anticipación y arranque
const sstep = (a, b, x) => { const u = cl((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const muelle = (tau, w = 16, k = 7) => tau < 0 ? 0 : Math.sin(tau * w) * Math.exp(-tau * k);
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
// Reloj que frena hasta pararse al final (todo lo que se mueve «solo» va con él).
function calma(t) { const a = T.calma0, b = T.quieto; if (t <= a) return t; const u = Math.min(1, (t - a) / (b - a)); return a + (b - a) * (u - u * u / 2); }

// Vista: escala (px de pantalla por unidad del nivel) y caja visible en unidades del nivel.
const VISTA0 = { s: 1, x0: -1e4, y0: -1e4, x1: 1e4, y1: 1e4 };
// Trama: puntos sobre una rejilla girada, recortada a lo visible. Si los puntos quedan por
// debajo de ~3 px en pantalla, la rejilla se hace más gruesa conservando la cobertura.
function dots(g, V, x0, y0, x1, y1, sp, ang, rf) {
  x0 = Math.max(x0, V.x0); y0 = Math.max(y0, V.y0); x1 = Math.min(x1, V.x1); y1 = Math.min(y1, V.y1);
  if (x1 <= x0 || y1 <= y0) return;
  const px = sp * V.s * S, k = px < 3.2 ? Math.ceil(3.2 / px) : 1, s2 = sp * k, rmin = 0.3 / (V.s * S);
  const c = Math.cos(ang), s = Math.sin(ang);
  let umin = Infinity, umax = -Infinity, vmin = Infinity, vmax = -Infinity;
  for (const [x, y] of [[x0, y0], [x1, y0], [x0, y1], [x1, y1]]) {
    const u = x * c + y * s, v = -x * s + y * c;
    umin = Math.min(umin, u); umax = Math.max(umax, u); vmin = Math.min(vmin, v); vmax = Math.max(vmax, v);
  }
  g.beginPath();
  for (let j = Math.floor(vmin / s2) - 1; j <= Math.ceil(vmax / s2) + 1; j++) {
    const v = j * s2;
    for (let i = Math.floor(umin / s2) - 1; i <= Math.ceil(umax / s2) + 1; i++) {
      const u = i * s2, x = u * c - v * s, y = u * s + v * c;
      if (x < x0 - s2 || x > x1 + s2 || y < y0 - s2 || y > y1 + s2) continue;
      const r = rf(x, y) * k;
      if (r < rmin) continue;
      g.moveTo(x + r, y); g.arc(x, y, r, 0, TAU);
    }
  }
  g.fill();
}
// Gradiente lineal de radio de punto: 0 en A, rmax en B.
const lin = (ax, ay, bx, by, rmax, pw = 1) => { const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy; return (x, y) => rmax * Math.pow(cl(((x - ax) * dx + (y - ay) * dy) / L2), pw); };

// Trazo de pincel: cinta de anchura variable a lo largo de una polilínea.
function ribbon(g, P, wf) {
  const n = P.length, L = [], R = [];
  for (let i = 0; i < n; i++) {
    const a = P[Math.max(0, i - 1)], b = P[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const w = wf(n > 1 ? i / (n - 1) : 0, P[i]);
    L.push([P[i][0] - dy * w, P[i][1] + dx * w]); R.push([P[i][0] + dy * w, P[i][1] - dx * w]);
  }
  g.beginPath(); g.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < n; i++) g.lineTo(L[i][0], L[i][1]);
  for (let i = n - 1; i >= 0; i--) g.lineTo(R[i][0], R[i][1]);
  g.closePath(); g.fill();
}
function ellPts(x, y, a, b, phi, th0, th1, n) {
  const c = Math.cos(phi), s = Math.sin(phi), P = [];
  for (let i = 0; i <= n; i++) { const th = th0 + (th1 - th0) * i / n, u = a * Math.cos(th), v = b * Math.sin(th); P.push([x + u * c - v * s, y + u * s + v * c, th]); }
  return P;
}
function quadPts(x0, y0, x1, y1, x2, y2, n = 16) {
  const P = [];
  for (let i = 0; i <= n; i++) { const u = i / n, a = (1 - u) * (1 - u), b = 2 * u * (1 - u), c = u * u; P.push([a * x0 + b * x1 + c * x2, a * y0 + b * y1 + c * y2]); }
  return P;
}
function poly(g, pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); }
function rectP(r) { const p = new Path2D(); p.rect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0); return p; }
// Pieza de cómic: color plano, trama de sombra recortada y tinta.
function pieza(g, V, path, base, bb, sombra, lw = 5) {
  if (base) { g.fillStyle = base; g.fill(path); }
  if (sombra) {
    g.save(); g.clip(path);
    for (const s of sombra) { g.fillStyle = s.col; g.globalAlpha = s.a ?? 1; dots(g, V, bb[0], bb[1], bb[2], bb[3], s.sp, s.ang ?? PI / 4, s.rf); }
    g.restore();
  }
  if (lw) { g.lineWidth = lw; g.strokeStyle = C.ink; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke(path); }
}
function trazo(g, pts, w, col = C.ink) { g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.stroke(); }
// Sprite pre-renderizado a la resolución del dispositivo.
function sprite(x0, y0, w, h, draw, q = 1) {
  const k = Math.min(S * q, 3), c = mk(w * k, h * k), g = c.getContext('2d');
  g.setTransform(k, 0, 0, k, -x0 * k, -y0 * k); draw(g);
  return { c, x0, y0, w, h };
}
function blit(g, sp, x, y, sc = 1) { g.drawImage(sp.c, x + sp.x0 * sc, y + sp.y0 * sc, sp.w * sc, sp.h * sc); }

// Esfera de cómic (del demo): color plano, trama de sombra, negro macizo y brillo duro.
const LIGHT = (() => { const v = [-0.52, -0.62, 0.59], n = Math.hypot(...v); return v.map((a) => a / n); })();
function sphere(g, x, y, r, base, sp) {
  const disk = new Path2D(); disk.arc(x, y, r, 0, TAU);
  g.save(); g.translate(MIS.x * 0.6, MIS.y * 0.6);
  g.fillStyle = base; g.fill(disk);
  g.save(); g.clip(disk); g.fillStyle = C.ink; g.globalAlpha = 0.85;
  dots(g, VISTA0, x - r, y - r, x + r, y + r, sp, PI / 4, (px, py) => {
    const dx = (px - x) / r, dy = (py - y) / r, nz = Math.sqrt(Math.max(0, 1 - dx * dx - dy * dy));
    const l = dx * LIGHT[0] + dy * LIGHT[1] + nz * LIGHT[2];
    return sp * 0.6 * Math.pow(cl((0.7 - l) / 0.75), 1.1);
  });
  g.restore(); g.restore();
  g.save(); g.clip(disk);
  g.beginPath(); g.rect(x - r - 4, y - r - 4, 2 * r + 8, 2 * r + 8); g.arc(x - 0.17 * r, y - 0.22 * r, r * 1.05, 0, TAU);
  g.fillStyle = C.ink; g.fill('evenodd');
  g.restore();
  g.save(); g.translate(x - 0.36 * r, y - 0.4 * r); g.rotate(-0.7);
  g.beginPath(); g.ellipse(0, 0, 0.25 * r, 0.12 * r, 0, 0, TAU); g.fillStyle = C.white; g.fill();
  g.restore();
  g.beginPath(); g.arc(x + 0.38 * r, y - 0.47 * r, 0.06 * r, 0, TAU); g.fillStyle = C.white; g.fill();
  g.lineWidth = Math.max(2.4, r * 0.1); g.strokeStyle = C.ink; g.stroke(disk);
}
// Estrella de impacto (polígono dentado) en coordenadas unitarias.
const estrella = (seed, n, kin) => { const r = rng(seed), P = []; for (let i = 0; i < n; i++) { const a = i / n * TAU + (r() - 0.5) * 0.1; const k = i % 2 ? kin + r() * 0.08 : 1 + r() * 0.28; P.push([Math.cos(a) * k, Math.sin(a) * k]); } return P; };
const STAR_A = estrella(4, 26, 0.62), STAR_B = estrella(9, 18, 0.55), STAR_C = estrella(21, 22, 0.66);
function impacto(g, V, x, y, rx, ry, P, fondo, trama) {
  if (rx <= 1) return;
  const Q = P.map(([a, b]) => [x + a * rx, y + b * ry]);
  poly(g, Q); g.fillStyle = fondo; g.fill();
  if (trama) { g.save(); g.clip(); g.fillStyle = trama; dots(g, V, x - rx * 1.4, y - ry * 1.4, x + rx * 1.4, y + ry * 1.4, 12, PI / 4, (xx, yy) => 4.8 * cl((Math.hypot((xx - x) / rx, (yy - y) / ry) - 0.5) / 0.6)); g.restore(); }
  poly(g, Q); g.lineJoin = 'miter'; g.miterLimit = 6; g.lineWidth = 5; g.strokeStyle = C.ink; g.stroke();
}
// Número con potencia de diez dibujado a mano (sin depender de los superíndices de la fuente).
// Devuelve el ancho. al = 'left' | 'center'.
function potencia(g, x, y, exp, size, conM, col, al = 'left', borde = 0) {
  g.save(); g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  const fb = `${size}px ${FT}`, fe = `${Math.round(size * 0.6)}px ${FT}`, fm = `italic 700 ${Math.round(size * 0.92)}px ${FM}`;
  g.font = fb; const w10 = g.measureText('10').width;
  g.font = fe; const sE = String(Math.abs(exp)), wE = g.measureText(sE).width;
  const wMin = exp < 0 ? size * 0.34 : 0, gap = size * 0.04;
  g.font = fm; const gapM = size * 0.16, wM = conM ? gapM + g.measureText('m').width : 0;
  const total = w10 + gap + wMin + wE + wM;
  let xx = al === 'center' ? x - total / 2 : x;
  const piezas = [];
  piezas.push(['10', fb, xx, y]); xx += w10 + gap;
  const ye = y - size * 0.42;
  if (exp < 0) { piezas.push(['-', null, xx, ye]); xx += wMin; }
  piezas.push([sE, fe, xx, ye]); xx += wE;
  if (conM) piezas.push(['m', fm, xx + gapM, y]);
  for (const pass of borde ? [0, 1] : [1]) {
    for (const [s, f, px, py] of piezas) {
      if (f === null) {   // signo menos: barra inclinada como el resto de la letra
        g.save(); g.translate(px + wMin * 0.5, py - size * 0.2); g.transform(1, 0, -0.18, 1, 0, 0);
        g.beginPath(); g.rect(-wMin * 0.42, -size * 0.06, wMin * 0.84, size * 0.12);
        if (pass === 0) { g.lineWidth = borde; g.strokeStyle = C.ink; g.lineJoin = 'round'; g.stroke(); } else { g.fillStyle = col; g.fill(); }
        g.restore(); continue;
      }
      g.font = f;
      if (pass === 0) { g.lineWidth = borde; g.strokeStyle = C.ink; g.lineJoin = 'round'; g.strokeText(s, px, py); } else { g.fillStyle = col; g.fillText(s, px, py); }
    }
  }
  g.restore();
  return total;
}

// =====================================================================================
// Átomo narrador (el del demo, con pesos de línea para tamaño de presentador)
// =====================================================================================
let NUC, ELEC, PAPER, SOCIOS, TIZA, PIZARRA;
const ORB = [{ phi: -PI / 6, dir: 1, k: 1.0, th0: 0.4 }, { phi: PI / 6, dir: -1, k: 1.0, th0: 2.5 }, { phi: PI / 2, dir: 1, k: 1.3, th0: 4.6 }];
// Velocidad de los electrones (vueltas/s) e integral precalculada: así acelerar no hace saltar la fase.
function velAtomo(t) {
  let v = 0.36;
  v *= 1 + 2.4 * sstep(T.atom - 0.28, T.atom, t) * (1 - sstep(T.atom + 0.35, T.atom + 1.5, t));
  v *= 1 + 1.3 * sstep(T.saltos - 0.15, T.saltos + 0.2, t) * (1 - sstep(T.pelo, T.pelo + 0.7, t));
  return v * (1 - cl((t - T.calma0) / (T.quieto - T.calma0)));
}
const FASE = (() => {
  const dt = 1 / 240, n = Math.ceil(DUR / dt) + 2, A = new Float64Array(n);
  let ph = 0; for (let i = 0; i < n; i++) { A[i] = ph; ph += dt * velAtomo(i * dt); }
  return (t) => { const f = Math.max(0, t) / dt, i = Math.min(n - 2, Math.floor(f)); return A[i] + (A[i + 1] - A[i]) * (f - i); };
})();

// A = { x, y, sc, en, mano (0..1), manoAng, vel (multiplicador de estelas) }
function atomo(g, t, A) {
  const sc = A.sc * (1 + 0.05 * A.en), a = 330 * sc, b = 104 * sc;
  const wk = Math.pow(A.sc, 0.55), mis = Math.max(0.45, wk);
  const fase = FASE(t);
  const els = ORB.map((o, i) => ({ o, i, th: o.th0 + TAU * o.dir * o.k * fase }));
  const orbitHalf = (o, front) => {
    const P = ellPts(A.x, A.y, a, b, o.phi, front ? -0.03 : PI - 0.03, front ? PI + 0.03 : TAU + 0.03, 60);
    const wf = (u, p) => wk * (1.6 + 3.4 * Math.pow((1 + Math.sin(p[2])) / 2, 1.5));
    // sobre fondos oscuros, un filo blanco para que se lea
    if (A.osc > 0.01) { g.save(); g.globalAlpha = A.osc; g.fillStyle = C.white; ribbon(g, P, (u, p) => wf(u, p) + 3.2); g.restore(); }
    g.save(); g.translate(MIS.x * mis, MIS.y * mis); g.fillStyle = C.cyan; ribbon(g, P, (u, p) => wf(u, p) + 1.5 * mis); g.restore();
    g.fillStyle = C.ink; ribbon(g, P, wf);
  };
  const posOrb = (e) => {
    const o = e.o, c = Math.cos(o.phi), s = Math.sin(o.phi), u = a * Math.cos(e.th), v = b * Math.sin(e.th);
    return [A.x + u * c - v * s, A.y + u * s + v * c];
  };
  const er = 23 * Math.pow(A.sc, 0.8) / 24;                // escala del sprite del electrón
  const electron = (e) => {
    const o = e.o, dir = o.dir;
    let [x, y] = posOrb(e);
    let es = er * (1 + 0.12 * Math.sin(e.th));
    const m = e.i === 2 ? A.mano : 0;
    if (m > 0.001) {
      // el electrón sale de su órbita y hace de mano: brazo de tinta, se balancea con líneas de movimiento
      const R = a * 1.02, ang = A.manoAng;
      const hx = A.x + Math.cos(ang) * R, hy = A.y + Math.sin(ang) * R;
      x = lerp(x, hx, m); y = lerp(y, hy, m);
      const arm = [], u0 = 0.3; for (let i = 0; i <= 12; i++) { const u = u0 + (1 - u0) * i / 12; arm.push([lerp(A.x, x, u) - Math.sin(u * PI) * 10 * wk * Math.sin(ang), lerp(A.y, y, u) + Math.sin(u * PI) * 10 * wk * Math.cos(ang)]); }
      g.save(); g.globalAlpha = cl(m * 1.5);
      g.fillStyle = C.ink; ribbon(g, arm, (u) => wk * (6.5 - 2.5 * u));
      g.fillStyle = C.cyan; ribbon(g, arm.slice(2), (u) => wk * (2.6 - 1.2 * u));
      g.restore();
      if (m > 0.5) {
        g.save(); g.globalAlpha = cl((m - 0.5) / 0.3); g.fillStyle = C.ink;
        for (const sd of [-1, 1]) for (const [dr, w] of [[0.0, 5], [0.17, 3.6]]) {
          const rr = R * (1.0 + dr), a0 = ang + sd * (0.3 + dr * 0.4), a1 = ang + sd * (0.75 + dr * 0.6);
          const P = []; for (let i = 0; i <= 12; i++) { const aa = lerp(a0, a1, i / 12); P.push([A.x + Math.cos(aa) * rr, A.y + Math.sin(aa) * rr]); }
          ribbon(g, P, (u) => w * wk * Math.sin(PI * u));
        }
        g.restore();
      }
      es *= 1 + 0.45 * m;
    } else {

}

// =====================================================================================
// Líneas de zoom alrededor de la viñeta incrustada
// =====================================================================================
const ZL = (() => { const r = rng(8), L = []; for (let i = 0; i < 84; i++) L.push({ a: (i + r() * 0.8) / 84 * TAU, r: r(), w: 2 + r() * 10, k: i }); return L; })();
function lineasZoom(g, cx, cy, rx, ry, amt, t, col) {
  if (amt <= 0.02) return;
  const step = Math.floor(t * 24 + 1e-6);
  g.save(); g.globalAlpha = cl(amt * 1.2); g.fillStyle = col; g.beginPath();
  for (const l of ZL) {
    const a = l.a + (hsh(step, l.k) - 0.5) * 0.03, ca = Math.cos(a), sa = Math.sin(a);
    const kk = 1 / Math.max(Math.abs(ca) / rx, Math.abs(sa) / ry);   // borde del rectángulo en esa dirección
    const rin = kk * (1.15 + l.r * 1.4 * (1.2 - amt)) + (hsh(l.k, step + 7) - 0.5) * 30;
    const ro = 2400, w = l.w * (0.35 + 0.65 * amt);
    g.moveTo(cx + ca * rin, cy + sa * rin); g.lineTo(cx + ca * ro - sa * w, cy + sa * ro + ca * w); g.lineTo(cx + ca * ro + sa * w, cy + sa * ro - ca * w); g.closePath();

}

// =====================================================================================
// Fotograma
// =====================================================================================
// ---------- capas pre-renderizadas ----------
// Cada nivel se pinta una sola vez a escala 1 y, para su zoom, también a 10^(1/3) y 10^(2/3)
// alrededor de su punto fijo (una pirámide). En cada fotograma se componen dos imágenes: la de
// menor escala cubre los bordes y la de mayor escala, más nítida, el centro. Así la trama
// ampliada sigue siendo nítida y el fotograma no vuelve a dibujar miles de puntos.
const MARG = 44, PIR = [1, Math.pow(10, 1 / 3), Math.pow(10, 2 / 3)];
const ESTATICO = [(g, V) => { fondo0(g, V); persona(g, V); }, nivel1, nivel2, nivel3, nivel4];
let CAPA = [];
function capa(dib, s, F) {
  const R = { x0: F.x + (PP.x0 - MARG - F.x) / s, y0: F.y + (PP.y0 - MARG - F.y) / s, x1: F.x + (PP.x1 + MARG - F.x) / s, y1: F.y + (PP.y1 + MARG - F.y) / s };
  const k = S * s, c = mk((R.x1 - R.x0) * k, (R.y1 - R.y0) * k), g = c.getContext('2d');
  g.setTransform(k, 0, 0, k, -R.x0 * k, -R.y0 * k);
  dib(g, { s, x0: R.x0, y0: R.y0, x1: R.x1, y1: R.y1 });
  return { c, x0: R.x0, y0: R.y0, w: R.x1 - R.x0, h: R.y1 - R.y0, s };
}
function construirCapas() {
  CAPA = [];
  for (let k = 0; k <= 4; k++) {
    const L = { pir: [] };
    if (k === 0) { L.fondo = capa(fondo0, 1, PC); L.persona = capa(persona, 1, PC); }
    else L.base = capa(ESTATICO[k], 1, PC);
    if (k < 4) for (let i = 1; i < PIR.length; i++) L.pir.push(capa(ESTATICO[k], PIR[i], FS[k]));
    CAPA.push(L);
  }
}
const pinta = (g, im) => {
  const red = Math.abs(g.getTransform().a) * im.w / im.c.width;      // < 1: la imagen se reduce
  if (red < 0.7) { g.imageSmoothingQuality = 'high'; g.drawImage(im.c, im.x0, im.y0, im.w, im.h); g.imageSmoothingQuality = 'low'; }
  else g.drawImage(im.c, im.x0, im.y0, im.w, im.h);
};
// Pinta el nivel k (el contexto ya está en sus coordenadas, a escala s de pantalla).
function pintaNivel(g, k, s, t, tz, V) {
  const L = CAPA[k];
  const base = () => { if (k === 0) { pinta(g, L.fondo); if (s <= 1.0001) estallidoAtom(g, V, t); pinta(g, L.persona); } else pinta(g, L.base); };
  if (s <= 1.0001 || !L.pir.length) base();
  else {
    let i = 0; while (i + 1 < PIR.length && PIR[i + 1] <= s) i++;
    if (i === 0) base(); else pinta(g, L.pir[i - 1]);
    if (i + 1 < PIR.length) pinta(g, L.pir[i]);
  }
  if (k === 0) nivel0dyn(g, V, t, tz);
  if (k === 4) cota(g, V, t);
}
const COL_LINEAS = [C.ink, C.ink, C.ink, C.white];
function vista(F, s, r) { return { s, x0: F.x + (r.x0 - F.x) / s, y0: F.y + (r.y0 - F.y) / s, x1: F.x + (r.x1 - F.x) / s, y1: F.y + (r.y1 - F.y) / s }; }

function vinetaPrincipal(g, t) {
  const tz = calma(t);
  g.save(); g.beginPath(); g.rect(PP.x0, PP.y0, PWd, PHt); g.clip();
  // golpe en cada llegada: sacudida y rebote del zoom
  const L = ultimaLlegada(t);
  let sx = 0, sy = 0, pk = 1, PF = PC;
  if (L && L.tau < 0.8) {
    const a = 13 * Math.exp(-L.tau * 9); sx = a * Math.sin(L.tau * 83); sy = a * 0.7 * Math.cos(L.tau * 67);
    pk = 1 + 0.05 * muelle(L.tau, 15, 7); PF = FS[L.j];
  }
  g.translate(sx, sy);
  const vis = { x0: PP.x0 - 30, y0: PP.y0 - 30, x1: PP.x1 + 30, y1: PP.y1 + 30 };
  g.save();
  if (pk !== 1) { g.translate(PF.x, PF.y); g.scale(pk, pk); g.translate(-PF.x, -PF.y); }
  const cam = camara(t), k = cam.k, z = cam.z, s = Math.pow(10, z), F = k < 4 ? FS[k] : PC;
  g.save();
  if (s !== 1) { g.translate(F.x, F.y); g.scale(s, s); g.translate(-F.x, -F.y); }
  pintaNivel(g, k, s * pk, t, tz, vista(F, s * pk, vis));
  g.restore();
  // viñeta incrustada con el nivel siguiente
  const pop = k < 4 ? popInset(t, cam) : 0;
  if (pop > 0.001) {
    const Q = QS[k], hw = PWd / 20 * pop, hh = PHt / 20 * pop;
    const r = { x0: F.x + (Q.x - hw - F.x) * s, y0: F.y + (Q.y - hh - F.y) * s, x1: F.x + (Q.x + hw - F.x) * s, y1: F.y + (Q.y + hh - F.y) * s };
    const icx = (r.x0 + r.x1) / 2, icy = (r.y0 + r.y1) / 2;
    lineasZoom(g, icx, icy, (r.x1 - r.x0) / 2, (r.y1 - r.y0) / 2, cam.salto >= 0 ? Math.max(0.25 * pop * (1 - cam.u), velZoom(cam)) : 0.3 * pop, t, COL_LINEAS[k]);
    const s2 = s * pop / 10;
    g.save(); g.beginPath(); g.rect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0); g.clip();
    g.translate(F.x, F.y); g.scale(s, s); g.translate(-F.x, -F.y);
    g.translate(Q.x, Q.y); g.scale(pop / 10, pop / 10); g.translate(-PC.x, -PC.y);
    const ri = { x0: Math.max(r.x0, vis.x0), y0: Math.max(r.y0, vis.y0), x1: Math.min(r.x1, vis.x1), y1: Math.min(r.y1, vis.y1) };
    // de pantalla a coordenadas del nivel k+1
    const toL = (x, y) => [PC.x + ((F.x + (x - F.x) / s) - Q.x) * 10 / pop, PC.y + ((F.y + (y - F.y) / s) - Q.y) * 10 / pop];
    const [ax, ay] = toL(ri.x0, ri.y0), [bx, by] = toL(ri.x1, ri.y1);
    pintaNivel(g, k + 1, s2 * pk, t, tz, { s: s2 * pk, x0: ax, y0: ay, x1: bx, y1: by });
    g.restore();
    const fade = 1 - Math.pow(cl(z), 6);
    g.save(); g.globalAlpha = fade; g.lineJoin = 'miter';
    g.strokeStyle = C.white; g.lineWidth = 12; g.strokeRect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0);
    g.restore();
    g.lineWidth = 6; g.strokeStyle = C.ink; g.strokeRect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0);
  }
  g.restore();
  dibujarAtom(g, t);
  g.restore();
}

function frame(t) {
  const g = ctx;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'low';
  g.fillStyle = C.paper; g.fillRect(0, 0, cv.width, cv.height);
  g.setTransform(S, 0, 0, S, OX, OY);
  g.save(); g.beginPath(); g.rect(0, 0, W, H); g.clip();
  g.fillStyle = C.paper; g.fillRect(0, 0, W, H);
  vinetaPrincipal(g, t);
  g.lineJoin = 'miter'; g.lineWidth = 7; g.strokeStyle = C.ink; g.strokeRect(PP.x0, PP.y0, PWd, PHt);
  g.save(); g.beginPath(); g.rect(PR.x0, PR.y0, PR.x1 - PR.x0, PR.y1 - PR.y0); g.clip(); regla(g, t); g.restore();
  g.lineWidth = 7; g.strokeStyle = C.ink; g.strokeRect(PR.x0, PR.y0, PR.x1 - PR.x0, PR.y1 - PR.y0);
  g.restore();
  // grano del papel en multiplicar
  g.setTransform(S, 0, 0, S, OX, OY);
  g.globalCompositeOperation = 'multiply'; g.drawImage(PAPER, 0, 0, W, H);
  g.globalCompositeOperation = 'source-over';
}

// ---------- sprites y papel ----------
function buildPaper() {
  const w = 960, h = 540, c = mk(w, h), g = c.getContext('2d'), id = g.createImageData(w, h), d = id.data, r = rng(5);
  const gw = 33, gh = 19, L = new Float32Array(gw * gh); for (let i = 0; i < L.length; i++) L[i] = r();
  const vn = (x, y) => { const fx = x / w * (gw - 1), fy = y / h * (gh - 1), x0 = fx | 0, y0 = fy | 0, tx = fx - x0, ty = fy - y0;
    const a = L[y0 * gw + x0], b = L[y0 * gw + x0 + 1], c2 = L[(y0 + 1) * gw + x0], e = L[(y0 + 1) * gw + x0 + 1];
    const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty); return lerp(lerp(a, b, sx), lerp(c2, e, sx), sy); };
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4, n = r(), lo = vn(x, y);
    const v = 255 - n * n * 16 - lo * 9;
    d[i] = v; d[i + 1] = v - 1.5; d[i + 2] = v - 5; d[i + 3] = 255;
  }
  g.putImageData(id, 0, 0);
  g.lineCap = 'round';
  for (let i = 0; i < 900; i++) {
    const x = r() * w, y = r() * h, a = r() * TAU, l = 2 + r() * 7;
    g.strokeStyle = `rgba(120,95,60,${0.05 + r() * 0.09})`; g.lineWidth = 0.6 + r() * 0.6;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 0.5) * l * 0.6, y + Math.sin(a + 0.5) * l * 0.6, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  return c;
}
function chalkGlyph(ch) {
  return sprite(-120, -130, 240, 260, (g) => {
    g.font = `232px ${FT}`; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.fillStyle = 'rgba(255,250,238,0.95)'; g.fillText(ch, 0, 84);
    // grano de tiza: se raspa el trazo con motas del color del encerado
    g.globalCompositeOperation = 'destination-out';
    const r = rng(ch.charCodeAt(0));
    for (let i = 0; i < 800; i++) { g.globalAlpha = 0.25 + r() * 0.6; g.beginPath(); g.arc(-110 + r() * 220, -120 + r() * 240, 0.6 + r() * 1.8, 0, TAU); g.fill(); }
    for (let i = 0; i < 40; i++) { g.globalAlpha = 0.35; g.lineWidth = 1 + r() * 1.5; g.beginPath(); const x = -100 + r() * 200, y = -110 + r() * 220; g.moveTo(x, y); g.lineTo(x + 20 + r() * 30, y - 6 - r() * 10); g.stroke(); }
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  }, 2);
}
function buildSprites() {
  builtS = S;
  NUC = sprite(-110, -110, 220, 220, (g) => {
    const B = [[-36, -22, 'n'], [36, -24, 'p'], [2, 40, 'p'], [-2, -44, 'n'], [-40, 22, 'p'], [40, 20, 'n'], [0, -2, 'p']];
    for (const [x, y, ty] of B) sphere(g, x, y, 33, ty === 'p' ? C.red : C.blue, 6);
  }, 1.3);
  ELEC = sprite(-34, -34, 68, 68, (g) => sphere(g, 0, 0, 24, C.cyan, 5), 1.4);
  SOCIOS = [C.yellow, C.cyan, C.magenta].map((col) => sprite(-50, -50, 100, 100, (g) => sphere(g, 0, 0, 40, col, 6), 2));
  TIZA = { q: chalkGlyph('?'), ex: chalkGlyph('!') };
  PIZARRA = sprite(PIZ.x - 215, PIZ.y - PIZ.h / 2 - 30, 430, PIZ.h + 460, pizarraFija, 2);
  construirRegla();
  construirCapas();
}

function layout() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.round(window.innerWidth * dpr), ch = Math.round(window.innerHeight * dpr);
  if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch; }
  S = Math.min(cw / W, ch / H); OX = (cw - W * S) / 2; OY = (ch - H * S) / 2;
}

layout();
const link = document.getElementById('fuentes');
if (!link.sheet) await new Promise((r) => { link.addEventListener('load', r, { once: true }); link.addEventListener('error', r, { once: true }); setTimeout(r, 8000); });
try { await document.fonts.load(`96px ${FT}`, '10 m ?!-0123456789'); await document.fonts.ready; } catch (e) { /* fuentes de reserva */ }
PAPER = buildPaper();
buildSprites();
let rt = 0;
window.addEventListener('resize', () => { layout(); clearTimeout(rt); rt = setTimeout(() => { if (Math.abs(S - builtS) / builtS > 0.04) buildSprites(); }, 180); });
E.iniciar((t) => frame(t));
</script>
