// NV-PLAYA (frase 26), Australia e Italia, sin cartela. Cuatro planos:

//    castillo, la pelota rueda, las banderas ondean;
// 2. (corta en «summer») a ras de arena y de espaldas al mar (el paseo con el club de socorristas, las dunas, la cometa):

//    abulta), el del medio en «Sweets» y el tercero en «good kids»; en «the rest» saca un carbón, lo mete en el último
//    en «coal» y en «sugar» el carbón destella de azúcar; luego se aleja. En la pared, un cuadrito del campo, la cesta

// la escoba de la Befana bajo ella (x: el centro, y: el palo), con chispitas detrás
const escobaVuela = (x, y, t, dir = 1) => { T.PIEZAS_NV.escoba(R, x, y + 6, { dir: -dir }); for (let k = 0; k < 6; k++) { const u = (t * 2 + k / 6) % 1; R.pset(Math.round(x - dir * (16 + u * 26)), Math.round(y + 1 + Math.sin(t * 7 + k) * 3 + u * 2), u < 0.5 ? hex('#fff0a0') : hex('#f0c040')); } };

const p1 = (t) => {
  T.mundo(R, t, { encuadre: 'australia' });
  // el surfista corre hacia el agua con la tabla en «beach»; otra surfista llega andando
  const us = tramo(t, 0.5, playa + 1.6), xs = Math.round(lerp(40, 226, us));

};

// ── plano 2: la barbacoa a ras de arena, de espaldas al mar (otro encuadre que el 1: ni isla ni agua). Detrás, el cielo
// tramado con el sol bajo a la izquierda, nubes de tres tonos a tres velocidades, gaviotas y una cometa; las colinas con
// eucaliptos y dos bloques de pisos; el club de socorristas de tejas con su torre (corona de Navidad, bandera de patrulla
// y guirnalda de bombillas que parpadea), los pinos de Norfolk y una palmera; el paseo con su barandilla y gente que pasa,
// el murete de arenisca con su escalera, las dunas con hierba que se mece y la cerca, y la arena con ondas y huellas.
// Delante, la nevera (asa, tapa, cierres y sombra), la sombrilla y la parrilla grande abierta (tapa de hollín, rejilla,
// brasas que respiran, llamitas, salchichas redondeadas con su brillo y humo que sube)

  nube: '#ffffff', nubeM: '#e4ecf6', nubeS: '#b8c8dc', colina: '#4a7a6a', colinaS: '#36604f', colinaL: '#6a9a7a', euca: '#5a8a5a', eucaS: '#3e6a46',

  duna: '#ecd6a0', dunaS: '#cdb07a', dunaL: '#f8e8c0', hierba: '#7a9a3a', hierbaS: '#4a6a2a', hierbaL: '#a8c050', poste: '#8a6a44',

  brasa: '#a82a10', brasaM: '#e85a1a', brasaL: '#ffb040', brasaB: '#fff0a0', ceniza: '#3a2a26',
  salch: '#a8502a', salchL: '#d87a48', salchS: '#6a2a14', salchB: '#ffd8b0', madera: '#a0703a', maderaS: '#6a4420',
  humo: '#eef0f4', humoS: '#c8ccd8', rojo: '#d23a2a', amarillo: '#f8d030', naranja: '#f08a20', piel: '#d8a070',

  for (let x = 0; x < 320; x++) { const yt = Math.round(76 + Math.sin(x * 0.03) * 4 + Math.sin(x * 0.11) * 1.5); for (let y = yt; y < 106; y++) ps(x, y, y - yt < 2 && dz(x, y) < 0.6 ? P.colinaL : hs(x >> 1, y >> 1, 601) < 0.18 ? P.colinaS : P.colina); }

  for (const [x0, x1, y0] of [[200, 236, 62], [242, 274, 68], [290, 319, 72]]) { R.rect(x0, y0, x1, 104, P.k); R.rect(x0 + 1, y0 + 1, x1 - 1, 104, P.piso); R.rect(x1 - 3, y0 + 1, x1 - 1, 104, P.pisoS); R.rect(x0 + 1, y0 + 1, x1 - 1, y0 + 1, P.pisoS);
    for (let y = y0 + 4; y < 98; y += 6) { R.rect(x0 + 1, y + 4, x1 - 1, y + 4, P.balcon); for (let x = x0 + 3; x < x1 - 4; x += 5) { R.rect(x, y, x + 2, y + 2, P.vent); R.pset(x, y, P.ventL); if (hs(x, y, 603) < 0.25) R.rect(x, y, x + 2, y, P.rojo); } } }
  // el club de socorristas: tejado de tejas a cuatro aguas, torre central, ventanas arriba y arcos abajo

  R.poligono([[17, 73], [30, 59], [178, 59], [191, 73]], P.k);
  R.poligono([[19, 72], [31, 60], [177, 60], [189, 72]], (x, y) => { const f = Math.floor((y - 60) / 3), o = (x + f * 2) % 5; return (y - 60) % 3 === 2 ? P.tejaS : o === 0 ? P.tejaS : o === 1 && (y - 60) % 3 === 0 ? P.tejaL : P.teja; });

  R.rect(105, 28, 105, 41, P.k); R.disco(105, 27, 1, P.amarillo);
  R.disco(105, 58, 6, P.k); R.disco(105, 58, 5, P.vent); R.pset(103, 56, P.ventL); R.pset(104, 55, P.ventL);
  for (let a = 0; a < 6.28; a += 0.35) { const x = Math.round(105 + Math.cos(a) * 6), y = Math.round(58 + Math.sin(a) * 6); R.pset(x, y, P.pino); R.pset(x + 1, y, P.pinoL); } R.pset(102, 52, P.rojo); R.pset(108, 63, P.rojo); R.pset(99, 60, P.rojo); R.rect(104, 64, 106, 65, P.rojo); R.pset(103, 66, P.rojo); R.pset(107, 66, P.rojo);   // la corona de Navidad
  for (let y = 73; y < 100; y++) for (let x = 24; x < 185; x++) { if (x >= 90 && x <= 120 && y < 73) continue; ps(x, y, y < 75 ? P.estucoS : hs(x, y, 604) < 0.06 ? P.estucoS : hs(x, y, 605) > 0.96 ? P.estucoL : P.estuco); }
  R.rect(23, 73, 23, 100, P.k); R.rect(185, 73, 185, 100, P.k); R.rect(182, 75, 184, 100, P.estucoS);
  for (let k = 0; k < 12; k++) { const x = 29 + k * 13; R.rect(x - 1, 76, x + 6, 84, P.k); R.rect(x, 77, x + 5, 83, P.vent); R.linea(x, 83, x + 5, 78, P.ventL); R.rect(x, 80, x + 5, 80, P.k); R.rect(x - 1, 85, x + 6, 85, P.estucoL);
    if (k % 3 === 1) for (let i = x - 2; i <= x + 7; i++) R.rect(i, 74, i, 76, ((i - x) >> 1) % 2 ? P.rojo : P.blanco); }
  for (let k = 0; k < 12; k++) { const x0 = 27 + k * 13; R.rect(x0, 90, x0 + 9, 99, P.k); R.disco(x0 + 4.5, 91, 5, P.k); R.rect(x0 + 1, 91, x0 + 8, 99, P.arco); R.disco(x0 + 4.5, 91, 4, P.arco); R.rect(x0 + 7, 88, x0 + 8, 99, P.arcoS); R.rect(x0 + 1, 87, x0 + 8, 88, P.arcoS);
    R.rect(x0 - 3, 87, x0 - 1, 99, P.estuco); R.rect(x0 - 3, 87, x0 - 3, 99, P.estucoL); if (k % 4 === 2) { R.disco(x0 + 4, 95, 1.5, P.piel); R.rect(x0 + 3, 97, x0 + 5, 99, P.rojo); } }
  R.rect(24, 99, 184, 100, P.estucoS);
  pinoNorfolk(10, 58, 100); pinoNorfolk(282, 56, 100);
  // la palmera junto a la escalera
  { const bx = 236; for (let y = 64; y < 104; y++) { const x = Math.round(bx + Math.sin((y - 64) / 40 * 1.4) * 4); R.rect(x, y, x + 1, y, (y % 3) ? P.tronco : P.k); }
    for (let k = 0; k < 7; k++) { const a = -2.9 + k * 0.95, L = 12; for (let i = 0; i <= L; i++) { const x = Math.round(bx + Math.cos(a) * i), y = Math.round(64 + Math.sin(a) * i * 0.6 + (i / L) ** 2 * 6); R.pset(x, y, P.palma); R.pset(x, y + 1, i % 2 ? P.pinoS : P.palmaL); } } }
  // el paseo (losas) y el murete de arenisca con sus hiladas
  for (let y = 100; y < 104; y++) for (let x = 0; x < 320; x++) ps(x, y, (x + (y > 101 ? 8 : 0)) % 16 === 0 ? P.paseoS : y === 100 ? P.baranda : P.paseo);
  for (let y = 104; y < 116; y++) { const f = Math.floor((y - 104) / 4); for (let x = 0; x < 320; x++) { const xo = x + (f % 2) * 7, j = (y - 104) % 4 === 3 || xo % 14 === 0; ps(x, y, j ? P.junta : y === 104 ? P.muroL : hs(Math.floor(xo / 14), f, 606) < 0.3 ? P.muroS : hs(x, y, 607) < 0.08 ? P.muroS : P.muro); } }
  // las dunas con la hierba (spinifex) y la cerca de palos con su alambre
  for (let x = 0; x < 320; x++) { const yt = dunaY(x), sl = dunaY(x + 1) - yt; for (let y = yt; y < 134; y++) ps(x, y, y - yt < 2 ? P.dunaL : sl > 0 && dz(x, y) < 0.5 ? P.dunaS : hs(x >> 1, y, 608) < 0.12 ? P.dunaS : P.duna); }
  for (let k = 0; k < 44; k++) { const x = Math.round(hs(k, 1, 609) * 318), y = dunaY(x) + 3 + Math.round(hs(k, 2, 609) * 8); if (x > 208 && x < 240) continue; for (let i = -2; i <= 2; i++) R.linea(x, y, x + i * 2, y - 4 - (2 - Math.abs(i)), i % 2 ? P.hierbaS : P.hierba); R.pset(x, y - 6, P.hierbaL); }
  for (let x = 44; x < 196; x += 9) { const y = dunaY(x) + 7; R.rect(x, y - 6, x, y, P.poste); R.pset(x, y - 6, P.k); } for (let x = 44; x < 188; x++) { const y = Math.round(lerp(dunaY(x - (x - 44) % 9) + 3, dunaY(x - (x - 44) % 9 + 9) + 3, ((x - 44) % 9) / 9)); R.pset(x, y, P.barandaS); }
  // la escalera de bajada a la playa
  for (let s = 0; s < 5; s++) { const x0 = 212 + s * 5, y0 = 104 + s * 4; R.rect(x0, y0, x0 + 18, y0 + 3, P.paseoS); R.rect(x0, y0, x0 + 18, y0, P.baranda); }

  for (let x = 0; x < 320; x++) for (let y = arenaY(x); y < 180; y++) { const s = y > 160 ? 1 : 0, per = 5 + Math.floor((y - 128) / 9), on = (y + Math.round(Math.sin(x * 0.06 + y * 0.2) * 2)) % per === 0;

  for (let y = 164; y < 171; y++) for (let x = 6; x < 64; x++) if (((x - 34) / 29) ** 2 + ((y - 167) / 3.5) ** 2 < 1 && dz(x, y) < 0.7) ps(x, y, P.sombra);

      R.actor(EL.befana, xb, yb, t, { dir: 1, anda: w > 0 && w < 1, sostiene: [xb + 15, yb - 11], sonrisa: true, brazos: false });
      R.linea(xb + 16, yb - 20, xb + 16, yb, hex('#6a3a1a')); R.linea(xb + 17, yb - 20, xb + 17, yb, hex('#3a1a0a'));
      for (let k = -2; k <= 2; k++) R.linea(xb + 16 + k, yb - 21, xb + 16 + k * 2, yb - 26, hex('#c8a040'));
    }

    if (salta > 0.45) for (let y = 113; y < 180; y++) for (let x = 182; x < 210; x++) R.pset(x, y, BI[y * 320 + x]);
    if (salta > 0.55 && salta < 1) for (let k = 0; k < 5; k++) R.pset(190 + k * 3, 110 - Math.floor((t * 20 + k * 3) % 8), hex('#8a8a92'));
  }
  // un gato en el tejado se despierta y la mira pasar
  T.gato(R, 268, 140, t, { dir: -1 });
};

// ── plano 4: el hogar por dentro (ladrillo tiznado al fondo, morillos, troncos y llamas que lo iluminan), los calcetines
// redibujados uno a uno (cada uno se abulta cuando la Befana mete el dulce), y en la pared un cuadrito del campo, la
// cesta de leña con los atizadores y la ristra de guindillas; un gato que la mira desde el suelo
const LAD = ['#1a0a06', '#3a160c', '#5e2414', '#86381c', '#b05a2c', '#d88040'].map(hex);
const FU = { r: hex('#d8401a'), n: hex('#ff8a20'), a: hex('#ffe070'), b: hex('#fff8d0'), tr: hex('#4a2a1a'), trL: hex('#6a4028'), tr2: hex('#2e1a10'), corte: hex('#c89a60'), hierro: hex('#2a2a30'), laton: hex('#c8a040'), latonL: hex('#f0d880'), luz: hex('#e88a3a') };
const hogarFuego = (t) => {
  const fl = 0.08 * Math.sin(t * 7) + 0.05 * Math.sin(t * 13.3 + 1);
  // el ladrillo del fondo y de los lados (las hiladas de los lados bajan hacia delante), tiznado arriba y encendido abajo
  for (let x = 111; x < 210; x++) { const yb = 134 + Math.abs(x - 160) * 0.15; for (let y = 99; y < yb; y++) {
    const izq = x < 128, der = x > 192, dl = izq ? 128 - x : der ? x - 192 : 0;
    let mort, bid;
    if (dl) { const yy = y - 99 - dl * 0.45, fila = Math.floor(yy / 4); mort = ((Math.floor(yy) % 4) + 4) % 4 === 3 || (dl + (fila & 1) * 2) % 5 === 0; bid = fila * 7 + Math.floor((dl + (fila & 1) * 2) / 5) + (izq ? 0 : 50); }
    else { const fila = Math.floor((y - 99) / 4), xo = x - 128 + (fila & 1) * 5; mort = (y - 99) % 4 === 3 || xo % 10 === 9; bid = fila * 13 + Math.floor(xo / 10) + 100; }
    let L = Math.max(0, 1.05 - Math.hypot((x - 160) * 0.8, (y - 142) * 1.5) / 62) + fl - (dl ? 0.12 : 0) - (y < 108 ? (108 - y) * 0.04 : 0) + (hs(bid, 3, 615) - 0.5) * 0.25;
    if (mort) L -= 0.3;
    R.pset(x, y, LAD[Math.max(0, Math.min(5, Math.floor(L * 5 + dz(x, y))))]);
  } }
  // el leño de atrás, apoyado en los morillos de hierro (con su bola de latón)
  const tronco = (x0, y0, x1, y1) => { for (let d = -2; d <= 2; d++) R.linea(x0, y0 + d, x1, y1 + d, d < -1 ? FU.trL : d > 1 ? FU.tr2 : FU.tr); for (let k = 0; k < 7; k++) { const u = (k + 0.5) / 7, x = Math.round(lerp(x0, x1, u)), y = Math.round(lerp(y0, y1, u)); if (Math.sin(t * 3 + k * 2) > 0.2) { R.pset(x, y, FU.n); R.pset(x + 1, y + 1, FU.r); } } R.disco(x0, y0, 2.6, FU.tr2); R.disco(x0, y0, 1.8, FU.corte); R.pset(x0, y0, FU.trL); };
  tronco(124, 134, 198, 131);
  for (const ax of [134, 186]) { R.rect(ax, 127, ax + 1, 147, FU.hierro); R.linea(ax - 3, 148, ax, 144, FU.hierro); R.linea(ax + 4, 148, ax + 1, 144, FU.hierro); R.disco(ax, 125, 2.4, hex('#14121c')); R.disco(ax, 125, 1.6, FU.laton); R.pset(ax - 1, 124, FU.latonL); }
  // las llamas: lenguas de tres colores a distinta fase, y las chispas que suben por el tiro
  for (let k = 0; k < 9; k++) { const x = 130 + k * 8, b = 133, hgt = Math.round(11 + 5 * Math.sin(t * 9 + k * 1.7) + 3 * Math.sin(t * 14 + k)), sw = Math.round(Math.sin(t * 6 + k) * 2);
    R.poligono([[x - 4, b], [x + sw, b - hgt], [x + 4, b]], FU.r); R.poligono([[x - 3, b], [x + sw, b - hgt + 4], [x + 3, b]], FU.n); R.poligono([[x - 1, b], [x + Math.round(sw / 2), b - hgt + 8], [x + 1, b]], FU.a); }
  tronco(128, 140, 192, 141);
  R.recorte([111, 99, 209, 149]);
  for (let k = 0; k < 7; k++) { const u = (t * 0.8 + k / 7) % 1, x = Math.round(146 + k * 5 + Math.sin(t * 3 + k) * 4), y = Math.round(126 - u * 28); R.pset(x, y, u < 0.5 ? FU.a : FU.n); }
  R.recorte(null);
  // la luz del fuego en el suelo de delante y en el canto de las jambas de mármol
  for (let y = 150; y < 158; y++) for (let x = 112; x < 209; x++) if (dz(x, y) < (0.32 - (y - 150) * 0.04 + fl) * (1 - Math.abs(x - 160) / 52)) R.pset(x, y, FU.luz);
  for (let y = 100; y < 148; y++) { if (dz(109, y) < 0.35 + fl) R.pset(109, y, FU.luz); if (dz(210, y) < 0.35 + fl) R.pset(210, y, FU.luz); }
};
// los objetos de la pared y del suelo, lejos de Atom: el cuadrito del campo, la cesta de leña, los atizadores, las guindillas
const paredP4 = (t) => {
  // el cuadro: marco dorado con su sombra, un cielo de tarde, colinas, un ciprés y una casita
  R.rect(27, 48, 27, 73, hex('#a88a68')); R.rect(5, 74, 27, 74, hex('#a88a68'));
  R.rect(4, 46, 26, 73, K); R.rect(5, 47, 25, 72, hex('#c89a3a')); R.rect(5, 47, 25, 47, hex('#f0d080')); R.rect(6, 48, 24, 71, hex('#8a6420'));
  for (let y = 49; y < 71; y++) for (let x = 7; x < 24; x++) { const yh = 61 + Math.round(Math.sin(x * 0.5) * 2); R.pset(x, y, y < yh ? (dz(x, y) < (y - 49) / 14 ? hex('#f0c890') : hex('#8ab0d8')) : y < 66 ? ((x + y) % 3 ? hex('#6a9a4a') : hex('#4a7a3a')) : hex('#a8a04a')); }
  R.rect(11, 52, 12, 65, hex('#1e4a2a')); R.rect(10, 56, 13, 62, hex('#1e4a2a')); R.rect(18, 60, 21, 63, hex('#f0e8d0')); R.rect(18, 59, 21, 59, hex('#c05a34')); R.pset(19, 61, K);
  R.pset(15, 44, K); R.linea(15, 44, 6, 46, hex('#8a6a44')); R.linea(15, 44, 24, 46, hex('#8a6a44'));
  // la cesta de mimbre con troncos y su sombra en el suelo
  R.rect(34, 154, 72, 156, hex('#70341e'));
  for (const [lx, ly] of [[40, 130], [47, 127], [54, 129], [61, 127], [67, 131], [44, 133], [58, 133]]) { R.disco(lx, ly, 3.4, K); R.disco(lx, ly, 2.6, hex('#6a4028')); R.disco(lx, ly, 1.8, hex('#d8b080')); R.pset(lx, ly, hex('#a07a4a')); }
  R.poligono([[31, 134], [73, 134], [68, 155], [36, 155]], K); R.poligono([[32, 135], [72, 135], [67, 154], [37, 154]], (x, y) => (y < 137 ? hex('#c09050') : ((x >> 1) + (y >> 1)) % 2 ? hex('#a0703a') : hex('#7a5028')));
  R.rect(32, 135, 72, 135, hex('#e0b070'));
  // los atizadores en su pie de hierro (la pala, el hurgón y el cepillo)
  R.rect(79, 121, 79, 152, FU.hierro); R.rect(76, 152, 82, 153, FU.hierro); R.disco(79, 120, 1.6, FU.laton);
  R.linea(77, 123, 77, 149, FU.hierro); R.linea(77, 149, 75, 151, FU.hierro); R.rect(81, 123, 81, 146, FU.hierro); R.rect(80, 146, 83, 151, hex('#4a4a52')); R.pset(80, 146, hex('#8a8a92'));
  // la ristra de guindillas y ajos colgada en la pared de la derecha (por debajo de Atom), que se mece apenas
  const sw = Math.sin(t * 1.1) * 0.6;
  R.pset(306, 74, K); R.linea(306, 75, Math.round(306 + sw), 120, hex('#8a6a44'));
  R.disco(306, 79, 2.6, K); R.disco(306, 79, 2, hex('#f0ece0')); R.pset(305, 78, hex('#ffffff'));
  for (let k = 0; k < 9; k++) { const y = 84 + k * 4, x = Math.round(306 + sw * (y - 75) / 45), d = k % 2 ? 1 : -1; R.linea(x, y, x + d * 4, y + 4, K); R.linea(x, y - 1, x + d * 3, y + 2, hex('#d02a1a')); R.pset(x + d * 2, y, hex('#ff6a4a')); R.pset(x, y - 1, hex('#3a7a2a')); }
};
// un calcetín de la repisa (como los del decorado) con su relleno f 0–1: se abulta y asoman los dulces o el carbón
const CALC = [['#c82a2a', '#8a1e20', '#d6584e'], ['#2a7a3a', '#1e5028', '#5a9460'], ['#c82a2a', '#8a1e20', '#d6584e'], ['#2a5aa8', '#1e3c70', '#5a7cb8']].map((a) => a.map(hex));
const BLC = hex('#f0ece0'), BLC2 = hex('#d8d4c8');
const calcetin = (k, f, t, azucar = false) => {
  const x = 108 + k * 34, sw = Math.round(Math.sin(t * 1.2 + k) * 0.6), [col, colS, colL] = CALC[k], b = f > 0 ? Math.round(Math.min(1, f) * 3 + Math.sin(Math.min(1, f) * Math.PI) * 1.5) : 0;
  R.rect(x + sw, 79, x + 1 + sw, 82, K);
  const pts = [[x - 5 - b, 82], [x + 6 + b, 82], [x + 6 + b, 102], [x + 12 + b, 108], [x + 12 + b, 113 + (b >> 1)], [x + 2, 113 + (b >> 1)], [x - 5 - b, 104]].map(([a, c]) => [a + sw, c]);
  for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) R.poligono(pts.map(([a, c]) => [a + dx, c + dy]), K);
  R.poligono(pts, (xx, yy) => (yy < 88 ? ((xx + yy) % 2 ? BLC : BLC2) : xx > x + 3 + sw + b ? colS : xx < x - 3 - b + sw ? colL : (Math.floor((yy - 88) / 4) % 2 ? col : colL)));
  if (f <= 0.3) return;
  const X = x + sw;
  if (k === 3) { R.disco(X + 1, 80, 3.4, K); R.disco(X + 1, 80, 2.6, hex('#1a1a1e')); R.pset(X, 79, hex('#4a4a52')); R.pset(X + 2, 78, hex('#4a4a52')); R.pset(X + 3, 81, hex('#2e2e34'));
    if (azucar) { for (const [i, j] of [[-1, 0], [1, -1], [2, 1], [0, 2], [3, 0]]) R.pset(X + 1 + i, 80 + j, BLC); } return; }
  R.rect(X - 3, 76, X - 1, 81, hex('#e8c040')); R.pset(X - 2, 76, hex('#fff0a0'));
  R.rect(X + 1, 75, X + 3, 81, hex('#f04a8a')); R.pset(X + 2, 75, hex('#ffb0d0'));
  if (k === 1) { R.rect(X + 5, 74, X + 5, 81, BLC); R.pset(X + 6, 73, BLC); R.pset(X + 7, 74, hex('#d02a2a')); R.pset(X + 5, 76, hex('#d02a2a')); R.pset(X + 5, 79, hex('#d02a2a')); }
  else R.pset(X, 78, hex('#3ac0e0'));
};
// el dulce en la mano: un caramelo envuelto de 7 × 5 px
const caramelo = (x, y, c) => { R.disco(x, y, 2.4, K); R.disco(x, y, 1.6, c); R.pset(x - 1, y - 1, hex('#ffffff')); for (const d of [-1, 1]) { R.pset(x + d * 3, y - 1, c); R.pset(x + d * 3, y + 1, c); R.pset(x + d * 4, y, K); R.pset(x + d * 3, y, K); } };
const carbonMano = (x, y) => { R.disco(x, y, 2.8, K); R.disco(x, y, 2, hex('#1a1a1e')); R.pset(x - 1, y - 1, hex('#5a5a62')); R.pset(x + 1, y, hex('#3a3a42')); };
const P4T = { d0: dulces - 0.55, d1: dulces + 0.07, d2: buenos + 0.05 };
// la ruta de la Befana en escoba (pies): baja por el tiro dentro del hogar, sale disparada entre el hollín, sube a los
// calcetines uno a uno, recula a por el carbón, va al último calcetín y al final se aleja hacia el tiro
const RUTA4 = [[P4, 156, 88], [P4 + 0.75, 156, 130], [P4 + 1.15, 112, 110], [P4T.d0 - 0.25, 87, 100], [P4T.d0 + 0.15, 87, 100], [P4T.d1 - 0.25, 121, 100], [P4T.d1 + 0.15, 121, 100],
  [P4T.d2 - 0.25, 155, 100], [P4T.d2 + 0.2, 155, 100], [resto - 0.3, 150, 104], [resto + 0.2, 189, 100], [azucar + 0.6, 189, 100], [azucar + 1.6, 150, 90]];
const ruta4 = (t) => { let k = 0; while (k < RUTA4.length - 2 && t > RUTA4[k + 1][0]) k++; const [ta, xa, ya] = RUTA4[k], [tb, xb, yb] = RUTA4[k + 1], u0 = Math.max(0, Math.min(1, (t - ta) / (tb - ta))), u = u0 * u0 * (3 - 2 * u0); return [Math.round(lerp(xa, xb, u)), Math.round(lerp(ya, yb, u)), xb < xa ? -1 : 1]; };

const p4 = (t) => {
  T.mundo(R, t, { encuadre: 'italia', camara: 'chimenea', llenos: 0, carbon: -1 });
  // la guirnalda de rama de pino con naranjas secas sobre la pared y el reloj de pared que hace tictac
  for (let x = 24; x <= 256; x++) { const y = Math.round(28 + Math.sin((x - 24) / 232 * Math.PI * 4) ** 2 * 8); R.linea(x, y - 2, x - 1, y - 5, hex('#1e5a2a')); R.linea(x, y + 2, x - 1, y + 5, x % 3 ? hex('#2e7a3a') : hex('#14401e')); }
  for (const x of [53, 111, 169, 227]) { const y = 30 + Math.round(Math.sin(t * 1.3 + x) * 0.6); R.disco(x, y, 3, hex('#a84a0a')); R.disco(x, y, 2, hex('#f0901a')); R.pset(x, y, hex('#f8e0a0')); }
  { const cx = 262, cy = 70; R.disco(cx, cy, 9, K); R.disco(cx, cy, 8, hex('#8a5a3a')); R.disco(cx, cy, 6, hex('#f0ece0')); for (let k = 0; k < 12; k++) R.pset(Math.round(cx + Math.cos(k * 0.52) * 5), Math.round(cy + Math.sin(k * 0.52) * 5), K); const a = t * 6.28 / 6; R.linea(cx, cy, Math.round(cx + Math.cos(a) * 5), Math.round(cy + Math.sin(a) * 5), hex('#c82a2a')); R.linea(cx, cy, cx, cy - 4, K); R.linea(cx, cy + 9, cx + Math.round(Math.sin(t * 3.14) * 4), cy + 20, K); R.disco(cx + Math.round(Math.sin(t * 3.14) * 4), cy + 21, 2, hex('#d8a030')); }
  paredP4(t);
  hogarFuego(t);
  // el gato del suelo levanta la cabeza y la sigue
  T.gato(R, 270, 170, t, { dir: -1 });
  // la Befana en escoba: dentro del tiro se recorta a la boca del hogar
  const [bx, by0, d] = ruta4(t), by = by0 + (t > P4 + 1.15 ? Math.round(Math.sin(t * 3) * 1) : 0), dentro = t < P4 + 0.75;
  const pecho = [bx + 17, by - 8], boca = (k) => [108 + k * 34 - 1, 84];
  let mano = null, cosa = null;
  [P4T.d0, P4T.d1, P4T.d2].forEach((tp, k) => { if (t > tp - 0.6 && t < tp + 0.15) { const u = tramo(t, tp - 0.3, tp), [mx, my] = boca(k); mano = [Math.round(lerp(pecho[0], mx, u)), Math.round(lerp(pecho[1], my, u))]; if (t < tp) cosa = ['dulce', k]; } });
  if (t > resto - 0.6 && t < carbon + 0.15) { const u = tramo(t, carbon - 0.3, carbon), [mx, my] = boca(3); mano = [Math.round(lerp(pecho[0], mx, u)), Math.round(lerp(pecho[1], my, u))]; if (t < carbon) cosa = ['carbon']; }
  const befana = () => {
  if (dentro) R.recorte([111, 99, 209, 149]);
  escobaVuela(bx + 7, by + 1, t, d);
  const b = R.actor(EL.befana, bx, by, t, { dir: mano ? 1 : d, sostiene: mano, sonrisa: !dentro, sorpresa: dentro, dedo: !mano && t > azucar && t < azucar + 0.8 });
  if (cosa) { const [hx, hy] = b.mano; if (cosa[0] === 'dulce') caramelo(hx, hy - 3, [hex('#f04a8a'), hex('#3ac0e0'), hex('#f8c020')][cosa[1]]); else carbonMano(hx, hy - 3); }
  R.recorte(null); };
  // dentro del tiro va por detrás de los calcetines (que cuelgan delante de la boca); fuera, por delante
  if (dentro) befana();
  // los calcetines: cada uno se abulta cuando le cae su dulce; el último recibe el carbón en «coal», que brilla en «sugar»
  const fil = [tramo(t, P4T.d0, P4T.d0 + 0.4), tramo(t, P4T.d1, P4T.d1 + 0.4), tramo(t, P4T.d2, P4T.d2 + 0.4), tramo(t, carbon, carbon + 0.4)];
  for (let k = 0; k < 4; k++) calcetin(k, fil[k], t, t > azucar - 0.05);
  if (!dentro) befana();
  // el estallido de hollín al salir del hogar (gris, se abre y se deshace)
  { const u = tramo(t, P4 + 0.7, P4 + 1.9); if (u > 0 && u < 1) for (let k = 0; k < 9; k++) { const a = k * 0.7 + 0.3, x = Math.round(152 + Math.cos(a) * (4 + u * 26)), y = Math.round(126 - Math.abs(Math.sin(a)) * (2 + u * 16) + u * 6), r = 2 + u * 5, al = 0.85 - u * 0.8;
      R.disco(x, y, r, (xx, yy) => (dz(xx, yy) < al ? (yy > y ? hex('#4a4a52') : hex('#8a8a92')) : R.pget(xx, yy))); } }
  // al meter cada dulce, un destello en la boca del calcetín; en «sugar», el carbón destella de azúcar
  [P4T.d0, P4T.d1, P4T.d2, carbon].forEach((tp, k) => { const u = tramo(t, tp, tp + 0.4); if (u > 0 && u < 1) for (let j = 0; j < 6; j++) { const a = j * 1.05 + u * 2, r = 3 + u * 7; R.pset(Math.round(109 + k * 34 + Math.cos(a) * r), Math.round(80 + Math.sin(a) * r * 0.7), hex('#fff8d0')); } });
  if (t > azucar - 0.05) { const cx = 211, cy = 80, e = tramo(t, azucar - 0.05, azucar + 0.4); for (let k = 0; k < 4; k++) { const a = k * 1.57 + t * 2, r = Math.round(5 + e * 3 + Math.sin(t * 8 + k) * 1.5), x = Math.round(cx + Math.cos(a) * r), y = Math.round(cy + Math.sin(a) * r);
      R.pset(x, y, hex('#ffffff')); R.pset(x - 1, y, hex('#fff0c0')); R.pset(x + 1, y, hex('#fff0c0')); R.pset(x, y - 1, hex('#fff0c0')); R.pset(x, y + 1, hex('#fff0c0')); } if (Math.sin(t * 10) > 0) R.pset(cx, cy - 4, hex('#ffffff')); }
};
const efectos = [[0.8, 'ola'], [playa + 0.2, 'whoosh'], [3.2, 'palmada'], [parrilla, 'vapor'], [crema + 0.05, 'chof'], [chanclas, 'toc'], [P3 + 0.4, 'whoosh'], [befana + 1.4, 'toc'], [escoba + 0.8, 'whoosh'], [P4 + 0.8, 'chof'], [dulces, 'pop'], [carbon + 0.1, 'toc'], [azucar, 'brillo']];
T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3], [P4, p4]], { efectos, año: 2026 });
