<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// EPISODIO 3 · ep3-borde (frases 81–84, sin cartela). Plastilina adulta + kits/ep03-balanza.js (la balanza de latón, el
// montón de arena y la silueta de puntitos), kits/ep03-universo.js (la esfera de lo observable, la red y la niebla) y
// kits/ep03-instrumentos.js (el telescopio). Las dos balanzas (81–83) van en arcilla aunque el Visual las marca en papel
// (cambios de estilo n.º 11 y 12 de las notas: los tiene que firmar el dueño); es la misma balanza en las dos frases.
//  0          (= último de ep3-universo, FINAL_UNIVERSO) la esfera translúcida de lo observable, llena de puntitos-galaxia,
//             en el centro sobre la red; regla en 10²⁷; Atom pequeño abajo a la izquierda
//  nadie      GENERAL. La cámara se aleja: la red se apaga y aparece el plató con la balanza de latón; la esfera encoge y
//             cae en el plato derecho (llega con la marca); en el izquierdo, un montón de arena. La balanza oscila sin
//             decidirse durante toda la frase
//  carrera    PLANO MEDIO (corte; la balanza de tres cuartos, más cerca, con el plato de la arena delante). La arena deja
//             su plato (sube y se va, soltando granos) y el plato de la esfera baja; a mitad de frase cae la silueta de un
//             cuerpo humano llena de puntitos en el plato vacío: lo hunde de golpe (sin esfuerzo) y la esfera sube; los
//             puntitos se encienden. Al final, la cámara empieza a acercarse a la silueta
//  multitud   DETALLE: la cámara se acerca a la silueta (empuje 2D hasta una foto de cerca) y sigue acercándose despacio:
//             dentro, una multitud de puntitos que chispean
//  telescopios GENERAL (corte). Al fondo de todo, a la derecha, la pared de niebla brillante; delante, sobre la red
//             oscura, un telescopio enorme (el de ep03-instrumentos.js) gira y apunta al borde, con un haz de luz tenue.
//             A mitad de frase, su imagen aparece en una mirilla de latón (galaxias y puntitos) y se funde en la niebla
//             opaca desde el borde hacia dentro; la mirilla crece hasta llenar la pantalla: solo niebla, detrás no hay
//             nada que ver. Se asienta y queda quieta
// CONTINUIDAD
//  · Fotograma 0 = FINAL_UNIVERSO de kits/ep03-universo.js, como lo pinta ep3-universo en su último fotograma (la foto de
//    la red con la esfera, n 0, y puntoNosotros r 4,5 en el centro; la regla en 10²⁷; Atom en (230, 780) con su escala,
//    su giro y la fase de los electrones con que acaba ep3-universo: se leen de marcas-ep03.json). window.__inicio.
//  · Último fotograma (ep3-centro empieza así; window.__fin lo da en números): la niebla brillante de ep03-universo.js a
//    pantalla completa, NIEBLA_FIN = { escala 260, centro (960, 540), luz 1 } (foto n 0 o 1: hierve alternando), con la
//    sombra blanda detrás de Atom (SOMBRA_ATOM); la regla en 10²⁷ (como en FINAL_UNIVERSO); Atom en (230, 780) con el
//    velo 0,3. La «imagen del telescopio» ya se ha fundido del todo en la niebla.
// Coste: todo se compone en 2D (crearPost al final). Lo quieto son fotos (la red con la esfera, la regla, la balanza
// asentada, el detalle de la silueta, el telescopio, la pared de niebla, el campo de galaxias y la niebla final); en vivo
// va la balanza mientras se mueve (con su arena o su silueta), el platillo de la esfera (solo su borde de delante, que
// tapa la esfera 2D), el telescopio mientras gira y Atom siempre. Las fotos pesadas se hacen en fotogramas baratos poco
// antes de hacer falta (PREPARAR).
import * as THREE from 'three';
import { escena } from '/atomo/plato/escena.js';
import { crearPlato, crearPost, cl, mix, prog, ss, eio, eoc, eic, eob, azar, muelle } from '/atomo/plato/kits/plastilina-adulta.js';
import { tiposBalanza, balanza, geometriaBalanza, platillo, caida, silueta, arena, mundoPieza, BALANZA, SILUETA } from '/atomo/plato/kits/ep03-balanza.js';
import { crearCielo, RED, FINAL_UNIVERSO, puntoNosotros } from '/atomo/plato/kits/ep03-universo.js';
import { tiposInstrumentos, uniformesInstrumentos, ponerInstrumentos, instrumento } from '/atomo/plato/kits/ep03-instrumentos.js';

const T0 = performance.now();
window.__carga = [];
const marcaCarga = (k) => window.__carga.push([k, Math.round(performance.now() - T0)]);
const E = await escena('ep3-borde', 'ep03');
const M = (k, d) => E.marca(k, d);
const m = {
  n: M('nadie', 0.5), nF: M('nadie_fin', 4.607), c: M('carrera', 5.793), cF: M('carrera_fin', 11.822),
  mu: M('multitud', 12.372), muF: M('multitud_fin', 13.971), te: M('telescopios', 14.842), teF: M('telescopios_fin', 20.664),
};
const D = E.duracion, QUIETO = D - 0.6;
const W = 1920, H = 1080;
const FIN = FINAL_UNIVERSO;

// ---------------------------------------------------------------- tiempos (todo sale de las marcas)
const T = {
  rojo: [0.08, m.n - 0.04],                       // la red de alrededor se apaga: aparece el plató con la balanza
  baja: [0.08, m.n + 0.04],                       // la esfera encoge y cae en el plato derecho (llega con la marca)
  B: m.c - 0.22,                                  // corte: plano medio (la balanza de tres cuartos)
  sale: [m.c - 0.1, m.c + 0.42],                  // la arena deja su plato
  golpe: m.c + 0.42 * (m.cF - m.c),               // a mitad de frase, la silueta cae en el plato vacío
  C: m.mu - 0.22,                                 // la cámara se acerca a la silueta
  Dd: m.te - 0.22,                                // corte: el telescopio y la pared de niebla
  Ee: m.te + 0.5 * (m.teF - m.te),                // a mitad de frase: la imagen del telescopio
};
T.aterriza = T.baja[1];
T.inclina = T.sale[0] + 0.18;                     // sin la arena, el plato de la esfera baja
T.cae = [T.golpe - 0.4, T.golpe];
T.quietaB = T.golpe + 1.45;                       // la balanza asentada (desde aquí, foto)
T.empujeB = [T.quietaB + 0.25, T.C];              // la cámara empieza a acercarse, despacio
T.acerca = [T.C, T.C + 0.75];                     // … y se acerca a la silueta (fundido a la foto de cerca)
T.gira = [T.Dd, T.Dd + 1.1];                      // el telescopio gira y apunta al borde
T.haz = [T.Dd + 0.45, T.Dd + 1.25];               // su haz de luz
T.mirilla = [T.Ee - 0.3, T.Ee + 0.05];            // la mirilla con su imagen (completa a mitad de frase)
T.funde = [T.Ee + 0.05, T.Ee + 1.2];              // la imagen se funde en la niebla, del borde hacia dentro
T.crece = [T.Ee + 0.95, T.Ee + 2.05];             // la mirilla crece hasta llenar la pantalla
const plano = (ts) => (ts < T.B ? 'A' : ts < T.C ? 'B' : ts < T.Dd ? 'C' : 'D');

// ---------------------------------------------------------------- el plató
const I = { REG: 0, FLE: 1, BAL: 2, PLA: 3, ARE: 4, SIL: 5, TEL: 6 };
const UI = uniformesInstrumentos();
const P = await crearPlato({
  piezas: ['reglaA', 'flecha', 'balanza', 'platillo', 'arena', 'silueta', 'instrumento'],
  tiposExtra: { ...tiposBalanza(['balanza', 'platillo', 'arena', 'silueta']), ...tiposInstrumentos({ variantes: ['telescopio'] }) },
  uniformes: { ...UI },
  alfa: true, post: false,
  sombraFondo: ['p2', 'p4', 'p5'],
  sombras: { p2: ['p4', 'p5'] },
  camara: { pos: [0, 3.8, 15.5], mira: [0, 2.3, 0], fov: 28, desenfoque: 44 },
});
marcaCarga('plato');
ponerInstrumentos(UI, {});
const POST = crearPost();
const en = (sx, sy, z) => P.punto(sx, sy, z);
const pant = (p) => P.proyectar(p);
const pxU = (p) => { const a = pant(p), b = pant([p[0] + 1, p[1], p[2]]); return Math.hypot(b[0] - a[0], b[1] - a[1]); };
const suma = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];

// ---------------------------------------------------------------- capas: el lienzo de WebGL (oculto) y uno 2D encima
const cont = document.getElementById('escena');
const lienzoGL = P.renderer.domElement;
lienzoGL.style.visibility = 'hidden';
const capa = document.createElement('canvas');
capa.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;display:block;z-index:3';
cont.appendChild(capa);
const g = capa.getContext('2d');
function ajustarCapa() {
  if (capa.width !== lienzoGL.width || capa.height !== lienzoGL.height) { capa.width = lienzoGL.width; capa.height = lienzoGL.height; }
  g.setTransform(capa.width / W, 0, 0, capa.width / W, 0, 0);
}
// un lienzo 2D del tamaño del de WebGL, en px de diseño
function lienzo2D() {
  const c = document.createElement('canvas'); c.width = lienzoGL.width; c.height = lienzoGL.height;
  const x = c.getContext('2d'); x.setTransform(c.width / W, 0, 0, c.width / W, 0, 0);
  return [c, x];
}
const copiaGL = () => { const [c, x] = lienzo2D(); x.drawImage(lienzoGL, 0, 0, W, H); return c; };
const cielo = crearCielo();
marcaCarga('cielo');

// ---------------------------------------------------------------- fotos (se hacen la primera vez que hacen falta)
const FOTOS = {};
let hechas = 0;
function F(k) {
  if (!FOTOS[k]) {
    const a = performance.now();
    FOTOS[k] = HACER[k]();
    hechas++;
    window.__carga.push(['foto ' + k, Math.round(performance.now() - a)]);
  }
  return FOTOS[k];
}
const R0 = FIN.esfera.r, C0 = FIN.esfera.c, PAD = 26;
// la esfera recortada en redondo (con la Vía Láctea en el centro): se pone en 2D a cualquier tamaño
function hacerDisco(f) {
  const k = f.width / W, L = Math.round(2 * (R0 + PAD) * k);
  const c = document.createElement('canvas'); c.width = L; c.height = L;
  const gc = c.getContext('2d');
  gc.drawImage(f, (C0[0] - R0 - PAD) * k, (C0[1] - R0 - PAD) * k, L, L, 0, 0, L, L);
  gc.setTransform(k, 0, 0, k, 0, 0);
  puntoNosotros(gc, [R0 + PAD, R0 + PAD], { r: 4.5, k: 1 });
  gc.setTransform(1, 0, 0, 1, 0, 0);
  gc.globalCompositeOperation = 'destination-in';
  const gr = gc.createRadialGradient(L / 2, L / 2, (R0 - 1) * k, L / 2, L / 2, (R0 + 7) * k);
  gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  gc.fillStyle = gr; gc.fillRect(0, 0, L, L);
  return c;
}

// ---------------------------------------------------------------- la regla (quieta en 10²⁷, como en FINAL_UNIVERSO)
const REG_OP = { pieza: I.REG, flecha: I.FLE, pos: en(...FIN.regla.pos), escala: FIN.regla.escala, rot: FIN.regla.rot, e: 27, ya: 0, actual: 27, lupa: FIN.regla.lupa };

// ---------------------------------------------------------------- Atom (presentador: pequeño, abajo a la izquierda)
// el mismo cálculo que ep3-universo, y empieza con su giro y la fase de sus electrones del último fotograma
const A_Z = 1.0, ATOMO = FIN.atomo;
const A_ESC = 180 / (2 * (1.68 + 0.16) * pxU(en(...ATOMO, A_Z)));
const CAM = [0, 3.8, 15.5];
const gy = (p) => Math.atan2(CAM[0] - p[0], CAM[2] - p[2]), gp = (p) => Math.atan2(p[1] - CAM[1], Math.hypot(CAM[0] - p[0], CAM[2] - p[2]));
const A_REF = en(850, 330, A_Z);
const giroHacia = (sx, sy) => { const w = en(sx, sy, A_Z); return [gy(w) - gy(A_REF), gp(w) - gp(A_REF)]; };
const PREVIO = await (async () => {
  try {
    const u = (await (await fetch('/atomo/plato/escenas/marcas-ep03.json')).json())['ep3-universo'];
    const Du = u.duracion, Qu = Du - 0.6, es = u.marcas.espera, co = u.marcas.comopuede;
    const vel = (t) => (1 + 0.9 * Math.exp(-Math.pow((t - es) / 0.4, 2)) + 0.6 * Math.exp(-Math.pow((t - co) / 0.5, 2))) * (1 - eio(prog(t, Qu - 0.9, Qu)));
    const dt = 1 / 240, A = [0];
    for (let i = 1; i * dt <= Du + 0.2; i++) A.push(A[i - 1] + vel((i - 0.5) * dt) * dt);
    const x = Qu / dt, j = Math.min(A.length - 2, Math.floor(x));
    return { tz: Qu - 0.45, ta: mix(A[j], A[j + 1], x - j) };
  } catch { return { tz: 22.575, ta: 23.7448 }; }
})();
function calma(t, t1 = QUIETO, d = 0.9) { const a = t1 - d; if (t <= a) return t; const u = Math.min(t - a, d); return a + u - (u * u) / (2 * d); }
const DT = 1 / 240, TA = [0];
const velA = (t) => ss(0, 0.45, t) * (1 + 0.5 * Math.exp(-Math.pow((t - T.golpe) / 0.4, 2))) * (1 - eio(prog(t, QUIETO - 0.9, QUIETO)));
for (let i = 1; i * DT <= D + 0.2; i++) TA.push(TA[i - 1] + velA((i - 0.5) * DT) * DT);
const tAtomo = (t) => { const x = t / DT, i = Math.min(TA.length - 2, Math.floor(x)); return mix(TA[i], TA[i + 1], x - i); };
const MARCAS = [m.n, m.c, m.mu, m.te];
function atomo(ts, { velo = 0.1 } = {}) {
  const tz = PREVIO.tz + calma(ts), ta = PREVIO.ta + tAtomo(ts);
  const sx = ATOMO[0], sy = ATOMO[1] + 3 * Math.sin(tz * 1.3) + 2 * Math.sin(tz * 0.7 + 1.0);
  const brillo = Math.max(...MARCAS.map((t0) => Math.sin(Math.PI * prog(ts, t0 - 0.15, t0 + 0.6))));
  const en0 = ts < QUIETO ? E.energia(ts) : 0;
  const [dy, dp] = giroHacia(sx, sy);
  P.atomo({
    pos: en(sx, sy, A_Z), escala: A_ESC, yaw: -0.15 + dy + 0.08 * Math.sin(tz * 0.5), pitch: 0.06 - dp,
    energia: Math.min(1, en0 + 0.45 * brillo), ts: ta, halo: 1, velo,
  });
}
// la sombra blanda detrás de Atom, sobre la niebla clara (para que se lea en el móvil)
const SOMBRA_ATOM = { x: 230, y: 780, r0: 40, r1: 200, color: '8,6,8', alfa: 0.42 };
function sombraAtom(k) {
  if (k <= 0.002) return;
  const s = SOMBRA_ATOM, gr = g.createRadialGradient(s.x, s.y, s.r0, s.x, s.y, s.r1);
  gr.addColorStop(0, `rgba(${s.color},${s.alfa * k})`); gr.addColorStop(1, `rgba(${s.color},0)`);
  g.fillStyle = gr; g.fillRect(s.x - s.r1, s.y - s.r1, 2 * s.r1, 2 * s.r1);
}

// ---------------------------------------------------------------- la balanza: general (A) y plano medio de tres cuartos (B)
const A_MAX = BALANZA.A_MAX, A_PRE = 0.1;
const E_ARENA = 0.72, E_SIL = 0.55, R_ESF = 0.19;   // el montón, la silueta y la esfera, en unidades de la balanza
const BAL_A = (() => { const e = 2.8; return { pos: [en(820, 500, 0)[0], -BALANZA.SUELO * e, 0], escala: e, rot: [0, -0.1, 0] }; })();
const BAL_B = (() => { const e = 3.4; return { pos: [en(840, 500, 0)[0], -BALANZA.SUELO * e, 0], escala: e, rot: [0, 0.5, 0] }; })();
// el ángulo (positivo baja el plato izquierdo, el de la arena y la silueta)
function aOsc(t) {
  if (t < T.aterriza) return A_PRE;
  const v = t - T.aterriza;
  return (0.035 + 0.065 * Math.exp(-v / 1.6)) * Math.cos(2 * Math.PI * 0.42 * v);
}
function angulo(t) {
  if (t < T.inclina) return aOsc(t);
  if (t < T.golpe) return caida(t, { t0: T.inclina, dur: 0.55, de: aOsc(T.inclina), a: -A_MAX, rebote: 0.15, peso: 1.8 });
  return caida(t, { t0: T.golpe, dur: 0.42, de: -A_MAX, a: A_MAX, rebote: 0.2, peso: 2.4 });
}
const balEn = (ts) => (ts < T.B ? BAL_A : BAL_B);
// la silueta, de cara a la cámara (un poco de tres cuartos)
const rotSil = (geo) => [0, gy(geo.platoIzq) - 0.12, 0];
// el montón de arena: sube y se va (con un pellizco al arrancar)
function estadoArena(ts) {
  if (ts >= T.sale[1]) return null;
  const u = prog(ts, T.sale[0], T.sale[1]);
  const pre = Math.sin(Math.PI * prog(ts, T.sale[0] - 0.16, T.sale[0] + 0.06));
  return { alto: 6.2 * u * u * (ts < T.B ? BAL_A.escala : BAL_B.escala) / 3.4, rot: [0.5 * u, 1.2 * u, -0.3 * u], sq: [1 + 0.1 * pre, 1 - 0.14 * pre + 0.25 * u, 1 + 0.1 * pre] };
}
function estadoSilueta(ts) {
  if (ts < T.cae[0]) return null;
  const u = prog(ts, T.cae[0], T.cae[1]);
  const q = ts >= T.golpe ? muelle(ts - T.golpe, 2.4, 6) : 0;
  return {
    alto: 4.6 * (1 - u * u) * BAL_B.escala / 3.4,
    sq: [1 + 0.06 * q, 1 - 0.09 * q, 1 + 0.06 * q],
    brillo: 0.45 + 0.3 * ss(T.golpe + 0.15, T.golpe + 1.1, ts),
  };
}
// la esfera: radio en px en su plato, y su centro (posada en el fondo del plato)
const rEsfera = (geo, bal) => R_ESF * bal.escala * pxU(geo.platoDer);
const enSuPlato = (geo, r) => { const f = pant(geo.platoDer); return [f[0], f[1] - 0.97 * r]; };
function estadoEsfera(ts, geo, bal) {
  const r1 = rEsfera(geo, bal), c1 = enSuPlato(geo, r1);
  if (ts >= T.baja[1]) return { c: c1, r: r1, k: 1 };
  const u = prog(ts, T.baja[0], T.baja[1]);
  const es = eoc(u), ep = u * u * (1.6 - 0.6 * u);
  const r = R0 * Math.pow(r1 / R0, es);
  return { c: [mix(C0[0], c1[0], ep), mix(C0[1], c1[1], ep)], r, k: u };
}
// el borde de delante del platillo (pantalla): la mitad baja del aro, algo por dentro, cerrada hacia abajo
function frentePlato(geo, lado) {
  const o = geo._o, a = o.angulo, c = Math.cos(a), s = Math.sin(a);
  const Ex = lado === 'izq' ? -c : c, Ey = lado === 'izq' ? -s : s;
  const pts = [];
  for (let i = 0; i < 48; i++) {
    const th = (2 * Math.PI * i) / 48;
    pts.push(pant(mundoPieza(o, [Ex + 0.31 * Math.cos(th), Ey - BALANZA.HILO + 0.016, 0.185 * Math.sin(th)])));
  }
  let iMin = 0, iMax = 0;
  pts.forEach((p, i) => { if (p[0] < pts[iMin][0]) iMin = i; if (p[0] > pts[iMax][0]) iMax = i; });
  // los dos arcos entre el punto de más a la izquierda y el de más a la derecha: el de delante es el de abajo
  const arco = (a0, a1) => { const r = []; for (let i = a0; ; i = (i + 1) % 48) { r.push(pts[i]); if (i === a1) break; } return r; };
  const A1 = arco(iMin, iMax), A2 = arco(iMax, iMin);
  const media = (l) => l.reduce((x, p) => x + p[1], 0) / l.length;
  const fr = media(A1) > media(A2) ? A1 : A2.reverse();
  const yb = Math.max(...fr.map((p) => p[1])) + 400;
  return [...fr, [fr[fr.length - 1][0], yb], [fr[0][0], yb]];
}
// pinta en gc la balanza (con lo que lleve) y la esfera en su plato; devuelve la geometría y la silueta
function componer(gc, n, { bal, ang, conArena, arenaE, silE, esfera, rojo = 0, nFoto = n }) {
  P.limpiar();
  ponerInstrumentos(UI, {});
  const b = balanza(P, I.BAL, { ...bal, angulo: ang });
  if (conArena && arenaE) arena(P, I.ARE, { pos: suma(b.platoIzq, [0, arenaE.alto, 0]), escala: E_ARENA * bal.escala, rot: arenaE.rot, sq: arenaE.sq });
  let s = null;
  if (silE) s = silueta(P, I.SIL, { pos: suma(b.platoIzq, [0, silE.alto, 0]), escala: E_SIL * bal.escala, rot: rotSil(b), sq: silE.sq, brillo: silE.brillo });
  if (rojo < 0.999) { P.render(nFoto); gc.drawImage(lienzoGL, 0, 0, W, H); }
  if (rojo > 0.001) { gc.save(); gc.globalAlpha = rojo; gc.drawImage(F('esfera' + (n % 2)), 0, 0, W, H); gc.restore(); }
  if (esfera) {
    const { c, r, k } = esfera, f = pant(b.platoDer);
    const enPlato = k > 0.75;
    // la sombra de la esfera en el fondo del plato y su halo cálido (los dos, a medida que llega)
    const ks = ss(0.75, 1, k);
    if (ks > 0) {
      gc.save(); gc.fillStyle = `rgba(14,8,4,${0.5 * ks})`;
      gc.beginPath(); gc.ellipse(f[0], f[1] - 0.04 * r, 0.82 * r, 0.24 * r, 0, 0, 2 * Math.PI); gc.fill(); gc.restore();
    }
    const kh = ss(0.2, 1, k);

let TMP = null;

// el haz de luz del telescopio hacia la pared
function haz(ts) {

  if (k < 0.01) return;

}
function planoD(n, ts) {

    else fotoEscalada(F('telD'), s, [1300, 380]);

    if (km > 0) {

}
