<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2026 · ep10</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// OV-2026 (frase 34), cartela «2026». Tres planos:
// 1. febrero: la orden del presidente sobre el escritorio; la pluma firma y cae el sello rojo con el candado abierto;
// 2. desde mayo: el monitor de cerca; los archivos llegan por tandas (vídeos de sensores, audios de astronautas e informes
//    del FBI con líneas tachadas) y la barra de descarga avanza hasta el 99 %;
// 3. la sala de casa: quien descarga, sentado al escritorio, espera; la barra se queda en el 99 % y el gato sube y se
//    tumba sobre el teclado (gag).
import { preparar, rodar, ordenPresidencial, monitorGrande, pantallaArchivos, salaHoy, silla, gato as gatoDe, C } from '/atomo/plato/escenas/ov-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await preparar('ov-2026');
const { tramo, lerp } = R;
const m0 = M('orden', 1.5), P2 = 6, P3 = 11.8, firma = m0 + 0.3, sello = 4.2, tandas = [P2 + 0.5, P2 + 2.1, P2 + 3.7], gato = P3 + 1.6;
const n = (t) => tandas.reduce((a, v) => a + Math.min(5, Math.max(0, (t - v) * 10)), 0);
const barra = (t) => Math.min(0.99, tramo(t, P2 + 0.3, P2 + 5.2) * 0.99);
const orden = (t) => ordenPresidencial(R, t, { firma: tramo(t, firma, firma + 1.8), sello: tramo(t, sello, sello + 0.8) });
const pantalla = (t) => monitorGrande(R, t, (R, x0, y0, x1, y1, t) => pantallaArchivos(R, x0, y0, x1, y1, t, { n: n(t), barra: barra(t), cursor: [Math.round(lerp(200, 250, tramo(t, P2, P2 + 2)) + Math.sin(t * 1.3) * 10), Math.round(lerp(60, 140, tramo(t, P2 + 3, P2 + 5)))] }));
const mini = (R, x0, y0, x1, y1, t) => {
  R.rect(x0, y0, x1, y1, R.hex('#e8ecf2')); R.rect(x0, y0, x1, y0 + 3, R.hex('#2a3a5a'));
  for (let k = 0; k < 4; k++) { const x = x0 + 3 + k * 13; R.rect(x, y0 + 6, x + 10, y0 + 12, [R.hex('#3a3e44'), R.hex('#1a2a4a'), C.blanco, R.hex('#3a3e44')][k]); }
  R.numero('99', (x0 + x1) >> 1, y1 - 9, { color: C.k, sombra: false, centro: true });
  R.rect(x0 + 3, y1 - 6, x1 - 3, y1 - 3, C.k); R.rect(x0 + 4, y1 - 5, x1 - 5, y1 - 4, C.verdeL);
};
const sala = (t) => {
  const encima = t > gato, salta = t > gato - 1.3 && !encima;
  salaHoy(R, t, { pantalla: mini, gato: encima ? 'teclado' : salta ? false : 'cola' });
  // el gato va hasta el escritorio y salta al teclado
  if (salta) { const a = tramo(t, gato - 1.3, gato - 0.5), b = tramo(t, gato - 0.5, gato); gatoDe(R, Math.round(lerp(lerp(262, 226, a), 182, b)), Math.round(lerp(136, 108, b) - Math.sin(b * Math.PI) * 18), t, { dir: -1 }); }
  R.actor(EL.sudadera, 118, 128, t, { dir: 1, quieto: true, sorpresa: encima && t < gato + 1.4, triste: t > gato + 1.4, dedo: !encima && Math.floor(t * 2) % 3 === 0 });
  silla(R, 124, 124);
};
rodar(E, R, [[0, orden], [P2, pantalla], [P3, sala]], {
  efectos: [[firma, 'firma'], [sello + 0.55, 'sello'], ...tandas.map((v) => [v, 'aviso']), [gato, 'miau'], [gato + 1.6, 'toc'], [gato + 2.1, 'toc']],
  cartela: '2026', año: 2026,
});
</script>
</body>
</html>
