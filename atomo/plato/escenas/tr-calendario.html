// 5. (despacho libro) el recaudador escribe en el libro de cuentas y pasa la hoja: marzo → abril («April»).

const { E, R, M } = await T.preparar('tr-calendario');

const en = (k, f) => T.momento(M, k, f);

// ── 1 · el despacho de 1752 ──

  caja(x, y - 10, x + 4, y - 3, ropa); caja(fr, y - 10, fr, y - 4, mez(ropa, BL, 0.25)); R.pset(x + 2, y - 7, hex('#c8a048'));
  caja(x + 1, y - 13, x + 3, y - 11, hex('#e8b890')); R.pset(dir > 0 ? x + 3 : x + 1, y - 12, hex('#3a2a20'));

  if (carga) { const cx = dir > 0 ? x + 5 : x - 4; caja(cx, y - 7, cx + 3, y - 5, hex('#a8783a')); R.pset(cx + 1, y - 8, hex('#6a8a3a')); R.pset(cx + 2, y - 8, hex('#c84a3a')); }
};
// la vista por la ventana emplomada (hueco [22, 28, 92, 108]): una calle de Londres en 1752, que se lee
const VEN = [22, 28, 92, 108];
const calle1752 = (t) => {
  R.recorte(VEN);
  const CIE = rampa('#5e6878', '#6e7888', '#7e8898', '#8e98a6', '#a0a8b4');
  for (let y = 28; y < 50; y++) for (let x = 22; x <= 92; x++) R.pset(x, y, R.tone(CIE, 3.6 - (y - 28) / 7 + (h(x >> 2, y >> 1, 41) - 0.5) * 0.5, x, y));
  // la cúpula de San Pablo, lejana y azulada, entre los tejados
  for (let y = 33; y < 48; y++) for (let x = 64; x <= 84; x++) { const d = Math.hypot(x - 74, (y - 46) * 1.15); if (d < 10) R.pset(x, y, x < 72 ? hex('#8a92a0') : hex('#78808e')); }
  caja(72, 30, 75, 35, hex('#7a8290')); R.pset(73, 28, hex('#7a8290')); R.pset(73, 29, hex('#7a8290')); caja(66, 44, 82, 47, hex('#80889a'));
  // nubes bajas de tres tonos que pasan a dos velocidades
  for (const [x0, y0, v, k] of [[0, 33, 2.2, 0], [50, 38, 3.6, 1], [30, 30, 1.4, 2]]) { const x = 22 + ((x0 + t * v) % 100) - 18;
    for (let i = 0; i < 3; i++) { const cx = x + i * 6, cy = y0 - (i === 1 ? 2 : 0); R.disco(cx, cy + 1, 4, hex('#8a909c')); R.disco(cx, cy, 4, hex('#a8aeb8')); R.disco(cx - 1, cy - 1, 2, hex('#c8ccd2')); } }

  for (const [x0, x1, lad, k] of [[22, 55, hex('#8a4a36'), 0], [59, 92, hex('#6e3c2e'), 1]]) {
    for (let y = 49; y < 94; y++) for (let x = x0; x <= x1; x++) { const f = (y - 49) / 3 | 0, j = (y - 49) % 3 === 2 || (x + (f & 1) * 3) % 6 === 0; R.pset(x, y, j ? hex('#4e2a22') : h(x >> 1, f, 42 + k) < 0.2 ? mez(lad, K, 0.18) : lad); }
    caja(x0, 45, x1, 48, hex('#a8a090')); caja(x0, 45, x1, 45, hex('#c8c0b0')); caja(x0, 48, x1, 48, hex('#6a645a'));
    const cx = x0 + 8 + k * 14; caja(cx, 36, cx + 6, 44, hex('#7a4030')); caja(cx - 1, 35, cx + 7, 36, hex('#a8a090')); caja(cx + 1, 33, cx + 2, 34, hex('#a86a40')); caja(cx + 4, 33, cx + 5, 34, hex('#a86a40'));
    for (let i = 0; i < 5; i++) { const u = ((t * 0.5 + i * 0.2 + k * 0.1) % 1), sx = cx + 2 + u * 10 + Math.sin(t * 2 + i) * 1.5, sy = 32 - u * 12; if (sy > 28) R.disco(sx, sy, 1 + u * 2.2, mez(hex('#9a9aa2'), CIE[3], u)); }
    // ventanas de guillotina (marco blanco, dos hojas), alguna con la vela encendida
    for (const wy of [53, 68]) for (const wx of [x0 + 5, x0 + 21]) { const luz = h(wx, wy, 43) < 0.35; caja(wx - 1, wy - 1, wx + 7, wy + 11, hex('#e8e4dc')); caja(wx, wy, wx + 6, wy + 10, luz ? hex('#3a2e2a') : hex('#2a2e3a'));
      caja(wx, wy + 5, wx + 6, wy + 5, hex('#e8e4dc')); caja(wx + 3, wy, wx + 3, wy + 10, hex('#e8e4dc')); caja(wx - 1, wy + 11, wx + 7, wy + 12, hex('#c8c0b0'));
      if (luz) { const f = Math.sin(t * 7 + wx) > 0.2; caja(wx + 1, wy + 7, wx + 2, wy + 9, f ? hex('#f8c860') : hex('#e8a040')); R.pset(wx + 1, wy + 1, hex('#5a6a7a')); } else { R.pset(wx + 1, wy + 1, hex('#6a7a8c')); R.pset(wx + 5, wy + 6, hex('#5a6a7a')); } }
  }

  caja(25, 82, 50, 93, hex('#2a3a2a')); caja(26, 83, 49, 92, hex('#3a3a44')); for (let i = 0; i < 7; i++) { caja(28 + i * 3, 89, 29 + i * 3, 92, [hex('#c84a3a'), hex('#e8c040'), hex('#4a7ac8'), hex('#e8e4dc')][i % 4]); caja(28 + i * 3, 85, 29 + i * 3, 87, [hex('#7a9a4a'), hex('#c8a048'), hex('#a84a6a')][i % 3]); } caja(37, 83, 37, 92, hex('#2a3a2a'));
  caja(70, 80, 80, 93, hex('#e8e4dc')); caja(71, 83, 79, 93, hex('#2a4a3a')); caja(75, 83, 75, 93, hex('#1e3a2c')); R.pset(77, 88, hex('#e8c040'));
  for (let x = 71; x <= 79; x++) { const yy = 82 - Math.round(Math.sqrt(Math.max(0, 16 - (x - 75) ** 2)) * 0.6); R.pset(x, yy, hex('#e8e4dc')); } caja(72, 81, 78, 82, hex('#2a2e3a')); R.pset(75, 80, hex('#e8e4dc'));

  // la acera de losas, el bordillo y el empedrado mojado con su charco

  { const x = Math.round(((t * 10 + 30) % 130) - 30), y = 107;
    paseante(x - 8, y, t, hex('#4a3a2a'), 1, 'tricornio', false); paseante(x + 16, y, t + 0.2, hex('#4a3a2a'), 1, 'tricornio', false);

  for (let y = 28; y <= 108; y++) for (let x = 22; x <= 92; x++) { const a1 = ((x - 22) + (y - 28) * 0.7) % 8, b1 = ((x - 22) - (y - 28) * 0.7 + 800) % 8;
    if (a1 < 1 || b1 < 1) R.pset(x, y, mez(R.pget(x, y), hex('#2a2a2e'), 0.65)); else if (h(x >> 2, y >> 2, 158) < 0.04) R.pset(x, y, mez(R.pget(x, y), hex('#e8f0f0'), 0.5)); }
  R.recorte(null);
  R.rect(56, 28, 58, 108, hex('#4a4440')); R.rect(57, 28, 57, 108, hex('#6a645c')); R.rect(22, 66, 92, 68, hex('#4a4440')); R.rect(22, 66, 92, 66, hex('#6a645c')); R.rect(22, 28, 92, 28, hex('#4a4440'));
};
// la hoja de marzo que cae revoloteando: del tamaño de la del calendario (40 × 48), se ve de frente (cabecera roja con
// el 3, cuadrícula y el 25 en rojo) o de canto mientras gira, y se posa tumbada en el suelo
const hojaVuela = (cx, cy, fase, ang, plano = 0) => {
  const hw = 20 * (0.9 + 0.1 * Math.cos(fase * 0.5)), ch = Math.cos(fase), hh = Math.max(1.5, 24 * Math.abs(ch) * (1 - plano) + 3 * plano), ca = Math.cos(ang), sa = Math.sin(ang), frente = ch > 0;
  const pt = (u, v) => [cx + u * ca - v * sa, cy + u * sa + v * ca];
  const x0 = Math.floor(cx - 30), x1 = Math.ceil(cx + 30), y0 = Math.floor(cy - 30), y1 = Math.ceil(cy + 30);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const dx = x - cx, dy = y - cy, u = dx * ca + dy * sa, v = -dx * sa + dy * ca;
    if (Math.abs(u) > hw || Math.abs(v) > hh) continue; const lv = (v + hh) / (2 * hh), lu = (u + hw) / (2 * hw);
    let c = Math.abs(u) > hw - 1 || Math.abs(v) > hh - 1 ? hex('#a89870') : frente ? hex('#e8dcb8') : hex('#d4c8a0');
    if (frente && lv < 0.3 && lv > 0.05 && lu > 0.05 && lu < 0.95) c = hex('#8a2a24');
    else if (frente && lv > 0.38 && hh > 6) { const gi = Math.floor(lu * 7), gj = Math.floor((lv - 0.38) * 8.5); if ((lu * 7) % 1 < 0.3 && ((lv - 0.38) * 8.5) % 1 < 0.35) c = gi === 4 && gj === 3 ? hex('#c8302a') : gi === 0 ? hex('#a83a2a') : hex('#5a4a3a'); }
    R.pset(x, y, c); }

};
const POSA = [50, 160];   // donde queda la hoja: en el suelo, delante del arcón y detrás de los pies del aprendiz
const hojaSuelo = () => { const [x, y] = POSA;
  R.poligono([[x - 19, y + 4], [x + 21, y + 4], [x + 18, y - 2], [x - 16, y - 2]], hex('#2a180c'));
  R.poligono([[x - 20, y + 3], [x + 20, y + 3], [x + 17, y - 3], [x - 17, y - 3]], hex('#e8dcb8')); R.poligono([[x - 17, y - 3], [x + 17, y - 3], [x + 16, y - 1], [x - 16, y - 1]], hex('#8a2a24'));
  for (let i = 0; i < 7; i++) for (const yy of [y, y + 2]) R.pset(x - 14 + i * 5, yy, i === 4 && yy === y ? hex('#c8302a') : hex('#5a4a3a'));
  R.linea(x - 20, y + 3, x + 20, y + 3, hex('#a89870')); };

  const tira = tramo(t, ENERO - 0.55, ENERO - 0.05), alza = tramo(t, 0.6, ENERO - 0.6), baja = tramo(t, ENERO + 0.4, ENERO + 1.6);

// ── 2 · el foro de Roma: el calendario de piedra ──
const MAR = rampa('#a89c88', '#c4b8a2', '#dcd2bc', '#ece4d0', '#f8f2e4');

// la fuente de la plaza (primer término, a la derecha)

  if (t > ABRIL + 0.7) { const n = Math.round(tramo(t, ABRIL + 0.7, E.duracion) * 16); cifra('6', 178, 144, hex('#3a2a6a')); for (let i = 0; i < n; i++) R.pset(186 + i * 2, 146 + (i % 3 === 0 ? -1 : 0), hex('#3a2a6a')); }
};

  [MARZO, 'papel'], [ANUNC, 'campana'], [ARRANCA, 'papel'], [Y1752, 'brillo'], [P5 + 0.4, 'lapiz'], [ABRIL - 0.4, 'papel']];
T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3], [P4, p4], [P5, p5]], { efectos, año: (t) => (t < P2 ? 1752 : t < P3 ? null : t < P4 ? 1450 : 1752) });
