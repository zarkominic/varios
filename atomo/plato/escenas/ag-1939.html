<!doctype html>
<html lang="es">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1939 · ep9</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// AG-1939 (frases 24–27). El calendario de noviembre de 1939 con cinco jueves; el último, el 30, con el pavito.
// Roosevelt arrastra el pavito una semana atrás. Dos casas vecinas: una cena el jueves nuevo y la otra el viejo, y se
// miran por la ventana («?», gag); una fila de 48 estados: 23 azules, 22 naranjas y 3 de los dos. Un mazo del Congreso:
// el cuarto jueves se queda marcado.
import { preparar, rodar, comedor, calendario, mesaCena, C, EL } from '/atomo/plato/escenas/ag-comun.js';
const { E, R, M } = await preparar('ag-1939');
const { tramo } = R;
const m = { ci: M('cinco', 0.5), ro: M('roosevelt', 6), li: M('lio', 9), co: M('congreso', 18) };
const cinco = (t) => { comedor(R, t, { epoca: 'xix', cal: () => {} }); calendario(R, 104, 46, t, { empieza: 2, dias: 30, jueves: t - m.ci > 1, pavo: 30 }); };
const roosevelt = (t) => {
  const u = t - m.ro;
  comedor(R, t, { epoca: 'xix', cal: () => {} }); calendario(R, 104, 46, t, { empieza: 2, dias: 30, jueves: true, arrastra: [30, 23, tramo(u, 0.6, 2)] });
  const er = tramo(u, 0, 0.6); R.actor(EL.roosevelt, Math.round(R.lerp(330, 250, er)), 145, t, { dir: -1, anda: er < 1, dedo: u > 0.6 && u < 2, sonrisa: u >= 2 });
};
const lio = (t) => {
  const u = t - m.li, L = m.co - m.li;
  // dos comedores lado a lado, con una pared en medio
  comedor(R, t, { epoca: 'xix', gato: false });
  R.rect(158, 0, 162, 145, C.maderaD);
  mesaCena(R, 82, 145, 1, t); R.actor(EL.senor30, 40, 145, t, { sonrisa: true }); R.actor(EL.senora30, 108, 145, t + 1, { dir: -1, sonrisa: true });
  mesaCena(R, 240, 145, 1, t, { recogida: true }); R.actor(EL.chico, 200, 145, t + 2, { dir: -1, sorpresa: u > 0.2 * L }); R.actor(EL.chica, 270, 145, t + 3, { dir: -1, sorpresa: u > 0.2 * L });
  if (u > 0.25 * L && u < 0.55 * L) R.bocadillo(206, 96, { icono: '?' });
  // 48 estados
  const f = tramo(u, 0.5 * L, 0.9 * L);
  for (let k = 0; k < 48; k++) { if (f * 48 < k) break; const x = 12 + k * 6, y = 22; const c = k < 23 ? C.azulL : k < 45 ? C.naranja : null; R.rect(x, y, x + 4, y + 6, C.k); if (c) R.rect(x + 1, y + 1, x + 3, y + 5, c); else { R.rect(x + 1, y + 1, x + 1, y + 5, C.azulL); R.rect(x + 2, y + 1, x + 3, y + 5, C.naranja); } }
  if (f >= 1) { R.numero('23', 80, 44, { centro: true, color: C.azulL }); R.numero('22', 218, 44, { centro: true, color: C.naranja }); R.numero('3', 290, 44, { centro: true }); }
};
const congreso = (t) => {
  const u = t - m.co, golpe = tramo(u, 0.6, 0.9);
  comedor(R, t, { epoca: 'xix', cal: () => {} });
  calendario(R, 104, 46, t, { empieza: 5, dias: 30, marca: u > 0.9 ? { 27: C.oroL } : {}, pavo: u > 0.9 ? 27 : null });
  // el mazo
  const ang = (1 - golpe) * 0.9 + (u > 0.9 ? Math.max(0, 0.3 - (u - 0.9)) : 0), hx = 260, hy = 100;
  const ex = Math.round(hx - Math.cos(ang) * 30), ey = Math.round(hy - Math.sin(ang) * 30);
  R.linea(hx, hy, ex, ey, C.maderaS); R.linea(hx + 1, hy, ex + 1, ey, C.maderaS); R.rect(ex - 6, ey - 4, ex + 6, ey + 4, C.k); R.rect(ex - 5, ey - 3, ex + 5, ey + 3, C.madera);
  R.rect(244, 108, 276, 112, C.maderaD);
};
rodar(E, R, [[0, cinco], [m.ro - 0.2, roosevelt], [m.li - 0.2, lio], [m.co - 0.2, congreso]], { cartela: '1939', año: (t) => (t < m.co ? 1939 : 1941) });
</script>
</body>
</html>
