<script type="module">
// MC-CIERRE (frases 30–31), 1873, 1872 y 2026, sin cartela. Seis planos:
// 1. «So what happened on the Mary Celeste? Most likely, no one did anything wrong»: la sala de la casa de los Briggs en
//    Marion, 1873: Arthur, en la ventana del mar con su barquito de juguete, se vuelve hacia la abuela con un «?» y va
//    hacia ella; la abuela deja de mecerse y, serena, señala el cuadro del Mary Celeste sobre la chimenea, que brilla.
// 2. «10 people got scared, climbed into the boat to save themselves, and the sea did the rest»: el bote con sus diez
//    siluetas, de lejos y con respeto (decorado mar 'bote' en niebla; el cabo ya roto flota suelto): el barco se aleja y
//    se pierde en la niebla en «the sea did the rest»; luego el bote empieza a irse hacia el horizonte; gaviotas.
// 3. «The clues fit and the experiment says it's possible, but the last page of the log was left blank»: la mesa de
//    cartas desde arriba, con las pistas: la varilla de sondeo mojada (visto en «fit»), la maqueta de madera cuya tapa
//    salta con un soplo azul (visto en «possible»), la caja vacía del sextante, el compás y el tintero; el diario abierto:
//    la hoja pasa sola en «page» y queda la última, con el 25 y lo demás en blanco, que brilla en «blank».
// 4. «Sometimes science can't say what happened, but it can rule out what didn't»: el laboratorio de Manchester de hoy,
//    de frente (contraplano dibujado en la escena, no el encuadre de mc-manchester): en primer término la mesa de acero
//    con la maqueta sobre la placa, el termómetro, el encendido y el cuaderno; detrás, la ventana con Manchester bajo la
//    lluvia (tranvía, chimenea que humea), la pizarra blanca con la curva 41 → 77, la vitrina y la poyata. Mair se acerca
//    por detrás de la mesa y se encoge de hombros con un «?»; Rowbotham rodea la mesa por la derecha hasta su punta y
//    señala la maqueta en «rule out»: una «X» roja grande se dibuja encima de ella.
// 5. «No warm tea, no monsters, no pirates. And that's already a lot»: la pizarra del estudio de Atom con tres dibujos
//    de tiza: la taza humeante, el tentáculo y el barco pirata; el brazo de Atom entra por el borde derecho con un borrador
//    de palo extensible y los borra uno a uno, cada uno en su palabra (quedan el fantasma, los barridos y el polvo);
//    luego, con la tiza de la punta, dibuja lo que queda (el barco que sigue navegando y el bote vacío) y un «✓» en
//    «that's already a lot», y se recoge y sale por el mismo borde.
// 6. «If you ever come across a mystery, start by stripping away what was added afterward»: la botella de cerca: «?» sobre
//    la cubierta en «mystery»; en «stripping away» el botecito salta de su escotilla, cruza por el aire y cae en la taza de
//    té de Atom en «added» (gag 8), donde flota mecido; el brazo de Atom entra por el borde derecho, dice adiós y sale.
import * as T from '/atomo/plato/escenas/mc-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('mc-cierre');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const C = T.C;
const H = (s) => hex(s);
const lin = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
const suave = (v) => { v = Math.max(0, Math.min(1, v)); return v * v * (3 - 2 * v); };
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const bay = (x, y) => (BAY[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
const hs = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const mez = (a, b, k) => { let r = 0; for (const s of [0, 8, 16]) r |= Math.round(((a >>> s) & 255) * (1 - k) + ((b >>> s) & 255) * k) << s; return (r | 0xff000000) >>> 0; };
const tono = (cs, f, x, y) => cs[Math.max(0, Math.min(cs.length - 1, Math.floor(f * (cs.length - 1) + bay(x, y))))];
const tranquila = (x, y) => (x >= 272 && y <= 48) || (x >= 14 && x <= 176 && y <= 22);
const pul = (t, f, k = 0) => Math.sin(t * f + k) > 0;
const CAPAS = new Map();
const capa = (clave, dibuja) => { let b = CAPAS.get(clave); if (!b) { b = R.nuevo(); const prev = R.usar(b); dibuja(); R.usar(prev); R.recorte(null); CAPAS.set(clave, b); } R.copiar(b); };
const cieloT = (y0, y1, cs, x0 = 0, x1 = 319) => { for (let y = y0; y <= y1; y++) { const f = (y - y0) / Math.max(1, y1 - y0); for (let x = x0; x <= x1; x++) R.pset(x, y, tono(cs, f, x, y)); } };
const BOLAS = [[0, 0, 0.5], [-0.3, 0.1, 0.32], [0.32, 0.08, 0.34], [-0.1, -0.2, 0.3], [0.16, -0.14, 0.3], [0.44, 0.16, 0.2]];
const nube = (cx, cy, w, cs, ymax = 999) => {
  const h = Math.max(4, w * 0.36);
  for (let y = Math.floor(cy - h); y <= cy + h * 0.5; y++) for (let x = Math.floor(cx - w * 0.62); x <= cx + w * 0.62; x++) {
    if (x < 0 || x > 319 || y < 0 || y > ymax || tranquila(x, y)) continue;
    let d = 9; for (const [bx, by, r] of BOLAS) { const dx = (x - (cx + bx * w)) / (r * w), dy = (y - (cy + by * w)) / (r * w * 0.7); d = Math.min(d, dx * dx + dy * dy); }
    if (d > 1 || y > cy + h * 0.45) continue; if (d > 0.8 && bay(x, y) < 0.5) continue;
    const v = (y - (cy - h)) / (h * 1.45); R.pset(x, y, y > cy + h * 0.32 ? cs[2] : tono(cs, v, x, y));
  }
};
const nubes = (t, lista, cs, ymax = 999) => { for (const [x0, y, w, v] of lista) nube(((x0 + t * v) % 440 + 440) % 440 - 60, y, w, cs, ymax); };
const pajaro = (x, y, t, c) => { x = Math.round(x); y = Math.round(y); if (tranquila(x, y) || x < 2 || x > 317) return; const a = Math.floor(t * 7 + x * 0.3) % 2; R.pset(x, y, c); R.pset(x - 1, y - a, c); R.pset(x + 1, y - a, c); R.pset(x - 2, y - 1 + 2 * a, c); R.pset(x + 2, y - 1 + 2 * a, c); };
// tablas horizontales con vetas (cubiertas, muelles, paredes)
const madera = (x0, y0, x1, y1, cs, alto = 6, sem = 0) => {
  for (let y = y0; y <= y1; y++) { const tabla = Math.floor((y - y0) / alto), yy = (y - y0) % alto, junta = (tabla * 53) % 70;
    for (let x = x0; x <= x1; x++) { const g = Math.sin(x * 0.07 + tabla * 3.1 + Math.sin(x * 0.019 + tabla * 1.7) * 3 + yy * 0.9 + sem);
      let c = cs[1]; if (g > 0.86) c = cs[0]; else if (g < -0.84) c = cs[2]; if (hs(x, y, sem) > 0.96) c = mez(c, cs[0], 0.5);
      if (yy === alto - 1) c = cs[3] ?? cs[2]; if (yy === 0) c = mez(c, cs[0], 0.35); if ((x + junta) % 70 === 0) c = cs[3] ?? cs[2]; R.pset(x, y, c); } }
};
// agua con rizos por fila (cs de lejos a cerca), brillos que corren
const agua = (t, y0, y1, cs, x0 = 0, x1 = 319, vel = 1) => {
  const L = mez(cs[0], H('#ffffff'), 0.55);
  for (let y = y0; y <= y1; y++) { const f = (y - y0) / Math.max(1, y1 - y0), k = 0.25 + f * 0.6;
    for (let x = typeof x0 === 'function' ? x0(y) : x0; x <= x1; x++) {
      const w = Math.sin(x * k * 0.5 + y * 1.9 + t * 2.2 * vel) + Math.sin(x * k * 0.21 - y * 0.7 - t * 1.3 * vel) * 0.7;
      let c = tono(cs, f + w * 0.06, x, y); if (w > 1.45) c = L; else if (w < -1.5) c = cs[cs.length - 1]; R.pset(x, y, c); } }
};
// el bergantín de perfil: x, y = centro de la flotación; s escala (1 ≈ 116 px de eslora); o.dir, o.rot, o.casco 'dg'
// (verde, el Dei Gratia) | 'negro'; o.velas 0–1; o.barriles (barriles azules de petróleo trincados en cubierta); o.t
const bergantin = (x, y, s, o = {}) => {
  const dir = o.dir ?? 1, rot = o.rot ?? 0, cr = Math.cos(rot), sr = Math.sin(rot), t = o.t ?? 0;
  const P = (u, v) => [Math.round(x + dir * (u * cr - v * sr) * s), Math.round(y - (u * sr + v * cr) * s)];
  const pol = (pts, c) => R.poligono(pts.map(([u, v]) => P(u, v)), c);
  const l2 = (u0, v0, u1, v1, c) => { const [a, b] = P(u0, v0), [d, e] = P(u1, v1); R.linea(a, b, d, e, c); };
  const dg = o.casco === 'dg';
  const K = H('#0e0c10'), CA = dg ? H('#2e5e3e') : H('#1c1a20'), CL = dg ? H('#4e8a5a') : H('#3a3844'), CS = dg ? H('#1a3a26') : H('#0e0c10');
  pol([[-58, 15], [-56, 0], [-48, -2], [50, -2], [57, 6], [62, 17], [40, 15], [0, 13], [-30, 14]], K);
  pol([[-56, 14], [-54, 1], [-47, -1], [49, -1], [55, 6], [60, 16], [40, 14], [0, 12], [-30, 13]], CA);
  for (let v = 3; v <= 11; v += 3) l2(-53, v, 54, v + (v > 8 ? 1 : 0), CS);
  l2(-55, 12, 58, 14, H('#f2eee2'));
  l2(-54, 6, 54, 6, CL); l2(-50, 9, 50, 9, mez(CL, CA, 0.5));
  for (let u = -46; u <= 46; u += 13) { const [a, b] = P(u, 3); R.pset(a, b, H('#c8a040')); }   // los pernos de bronce
  pol([[-50, 14], [-50, 19], [-34, 19], [-34, 14]], dg ? H('#c8b890') : H('#d8c8a0'));
  for (const u of [-46, -40]) { const [a, b] = P(u, 17); R.pset(a, b, H('#5a7a9a')); R.pset(a + 1, b, H('#5a7a9a')); }
  l2(-56, 16, 60, 18, K);
  if (o.barriles) for (const u of [-24, -16, -8, 4, 12]) { const [a, b] = P(u, 16); R.rect(a - 3, b - 6, a + 3, b, K); R.rect(a - 2, b - 5, a + 2, b - 1, H('#2a4a7a')); R.linea(a - 2, b - 4, a + 2, b - 4, H('#4a6a9a')); R.linea(a - 2, b - 2, a + 2, b - 2, H('#1a2238')); }
  l2(60, 17, 84, 26, H('#5a4028')); l2(60, 16, 84, 25, H('#8a6a48'));
  const vel = o.velas ?? 0;
  const palo = (u, alto, vergas) => {
    l2(u, 14, u, alto, H('#3a2a1c')); l2(u + 1, 14, u + 1, alto - 4, H('#7a5a3a'));
    l2(u, alto, -56 + (u > 0 ? 40 : 0), 16, H('#4a4048')); l2(u, alto, 84, 26, H('#4a4048'));
    for (let i = 0; i < 4; i++) l2(u - 4 + i * 2, 16, u, alto - 8, H('#5a5058'));
    for (const [hh, w] of vergas) { l2(u - w, hh, u + w, hh, H('#3a2a1c'));
      if (vel > 0.05) { const bajo = hh - 9 * vel, fl = Math.sin(t * 4 + hh) * 0.8;
        pol([[u - w, hh], [u + w, hh], [u + w * 0.94 + fl, bajo], [u - w * 0.94 + fl, bajo]], H('#ece4cc'));
        l2(u - w * 0.9, bajo + 1, u + w * 0.9, bajo + 1, H('#b8ac90')); l2(u, hh - 1, u, bajo + 2, H('#d8ceb4')); }
      else { l2(u - w + 1, hh - 1, u + w - 1, hh - 1, H('#e8e0c8')); for (let k = -w + 3; k < w; k += 4) { const [a, b] = P(u + k, hh - 2); R.pset(a, b, H('#c8bca0')); } } }
  };
  palo(26, 78, [[34, 16], [46, 13], [56, 11], [64, 8]]);
  palo(-12, 84, []);
  if (vel > 0.05) { const fl = Math.sin(t * 3) * 1.5 * vel; pol([[-12, 30], [-12, 30 + 46 * vel], [-48 + fl, 22 + 20 * vel], [-52, 24]], H('#ece4cc')); l2(-12, 30, -52, 24, H('#3a2a1c')); l2(-13, 30 + 46 * vel, -48 + fl, 22 + 20 * vel, H('#b8ac90'));
    pol([[62, 18], [84, 26], [28, 72]], H('#f2ecd8')); l2(62, 18, 28, 72, H('#c8bca0')); }
  else { l2(-12, 30, -52, 26, H('#3a2a1c')); l2(-12, 31, -50, 27, H('#e8e0c8')); }
  { const [a, b] = P(26, 78); for (let i = 0; i < 8; i++) R.pset(a - dir * i, b + Math.round(Math.sin(t * 6 + i * 0.8) * (i / 5)), H('#c83a2a')); }
  return { P, cubierta: (u) => P(u, 15 + (u > 40 ? (u - 40) * 0.1 : 0)) };
};
// un barril tumbado visto de cara (tapa con duelas y aros); gir hace rodar las duelas
const barrilT = (x, y, r, azul = false, gir = 0) => { x = Math.round(x); y = Math.round(y);
  const K = H('#120e10'), A = azul ? [H('#1a2a4a'), H('#2a4a7a'), H('#4a6a9a')] : [H('#6a4422'), H('#a8794a'), H('#d4a46a')];
  R.disco(x, y, r + 1, K); R.disco(x, y, r, A[0]); R.disco(x, y, r - 1, A[1]); R.disco(x - 1, y - 1, Math.max(1, r - 3), A[2]); R.disco(x, y, Math.max(1, r - 3), A[1]);
  for (let k = 0; k < 3; k++) { const a = gir + k * Math.PI / 3; R.linea(Math.round(x - Math.cos(a) * (r - 1)), Math.round(y - Math.sin(a) * (r - 1)), Math.round(x + Math.cos(a) * (r - 1)), Math.round(y + Math.sin(a) * (r - 1)), A[0]); }
  R.pset(Math.round(x + Math.cos(gir) * (r - 3)), Math.round(y + Math.sin(gir) * (r - 3)), K); };
// un barril de pie: x centro, y la base; azul: de petróleo
const barrilP = (x, y, s = 1, azul = false) => { x = Math.round(x); y = Math.round(y);
  const K = H('#120e10'), A = azul ? [H('#1a2a4a'), H('#2a4a7a'), H('#4a6a9a')] : [H('#6a4422'), H('#a8794a'), H('#d4a46a')], w = Math.round(4 * s), h = Math.round(11 * s);
  R.rect(x - w - 1, y - h - 1, x + w + 1, y, K);
  for (let j = 0; j < h; j++) { const b = Math.round(Math.sin((j / h) * Math.PI) * s); R.rect(x - w - b, y - h + j, x + w + b, y - h + j, A[1]); R.pset(x - w - b, y - h + j, A[0]); R.pset(x + w + b, y - h + j, A[0]); R.pset(x - w + 1, y - h + j, A[2]); }
  for (const f of [0.2, 0.8]) { const yy = Math.round(y - h + h * f); R.linea(x - w - 1, yy, x + w + 1, yy, H('#2a2a30')); }
  R.linea(x - w, y - h, x + w, y - h, A[2]); };

const K = H('#17151d'), BL = H('#f6f2ea'), GUANTE = '#5a8ad0', ORO = H('#f0c040'), ORO2 = H('#b88a20'), ROJO = H('#d83a2a'), AZ = H('#3a6ac8'), VERDE = H('#3aa84a');
// bocadillo redondo con un icono (?, !, X)
const globo = (x, y, ic, c) => { x = Math.round(x); y = Math.round(y); if (y < 30) y = 30; R.disco(x, y, 8, K); R.disco(x, y, 7, BL); R.pset(x - 4, y + 8, K); R.pset(x - 3, y + 7, BL); R.pset(x - 5, y + 9, K); R.icono(ic, x - 3, y - 5, c, null, 1.4); };
// la marca de visto (dos trazos) en verde
const visto = (x, y, f = 1, c = VERDE) => { x = Math.round(x); y = Math.round(y); const n = Math.round(f * 12);
  for (let i = 0; i < Math.min(n, 4); i++) { R.rect(x + i - 1, y + i - 1, x + i + 1, y + i + 1, K); }
  for (let i = 4; i < n; i++) { R.rect(x + i - 1, y + 7 - i - 1, x + i + 1, y + 7 - i + 1, K); }
  for (let i = 0; i < Math.min(n, 4); i++) { R.pset(x + i, y + i, c); }
  for (let i = 4; i < n; i++) { R.pset(x + i, y + 7 - i, c); R.pset(x + i, y + 8 - i, c); } };
// una gaviota posada (de perfil), que a ratos abre las alas
const gaviotaP = (x, y, t, dir = 1) => { x = Math.round(x); y = Math.round(y); const X = (i) => x + dir * i, ab = Math.sin(t * 1.3 + x) > 0.85;
  for (let i = -3; i <= 2; i++) { R.pset(X(i), y - 3, BL); R.pset(X(i), y - 2, BL); } R.pset(X(-3), y - 3, H('#8a8a94')); R.pset(X(-4), y - 2, H('#5a5a64'));
  R.pset(X(2), y - 4, BL); R.pset(X(3), y - 4, BL); R.pset(X(3), y - 5, BL); R.pset(X(4), y - 4, H('#e8a020')); R.pset(X(3), y - 5, K);
  R.pset(X(0), y - 1, H('#e8a020')); R.pset(X(-1), y - 1, H('#e8a020')); R.pset(X(-1), y - 4, H('#9a9aa4')); R.pset(X(0), y - 4, H('#9a9aa4'));
  if (ab) { R.pset(X(-1), y - 5, H('#9a9aa4')); R.pset(X(-2), y - 6, H('#9a9aa4')); R.pset(X(0), y - 5, BL); } };
// un gato negro que anda de perfil (el «gato de mala suerte»), con la cola en alto
const gatoN = (x, y, dir, t, anda) => { x = Math.round(x); y = Math.round(y); const N = H('#141218'), N2 = H('#34303c'), OJ = H('#f0d040'), X = (i) => x + dir * i, p = anda ? Math.floor(t * 9) % 2 : 0;
  for (let i = -4; i <= 4; i++) for (let j = 3; j <= 5; j++) R.pset(X(i), y - j, N);
  for (let i = -3; i <= 3; i++) R.pset(X(i), y - 6, N); R.pset(X(-2), y - 5, N2); R.pset(X(0), y - 6, N2);
  for (const [i, f] of [[-4, 0], [-2, 1], [2, 0], [4, 1]]) { const d = anda ? (f === p ? 1 : -1) : 0; R.pset(X(i), y - 2, N); R.pset(X(i + (d > 0 ? 1 : 0)), y - 1, N); R.pset(X(i + (d > 0 ? 1 : 0)), y, N); }
  for (let i = 5; i <= 7; i++) for (let j = 4; j <= 7; j++) R.pset(X(i), y - j, N);
  R.pset(X(5), y - 8, N); R.pset(X(7), y - 8, N); R.pset(X(6), y - 6, OJ); R.pset(X(8), y - 5, N);
  const c = Math.sin(t * 3) > 0 ? 1 : 0; R.pset(X(-5), y - 5, N); R.pset(X(-6), y - 6, N); R.pset(X(-6), y - 7, N); R.pset(X(-6 + c), y - 8, N); R.pset(X(-5 + c), y - 9, N); };
// un cajón de madera con listones
const cajon = (x, y, w = 10, h = 8) => { x = Math.round(x); y = Math.round(y); R.rect(x - w / 2 - 1, y - h - 1, x + w / 2 + 1, y, K); R.rect(x - w / 2, y - h, x + w / 2, y - 1, H('#b8905a'));
  R.linea(x - w / 2, y - h, x + w / 2, y - h, H('#d8b07a')); for (const f of [0.33, 0.66]) R.linea(x - w / 2, Math.round(y - h * f), x + w / 2, Math.round(y - h * f), H('#8a6a40')); R.linea(x - w / 2, y - 1, x + w / 2, y - h, H('#9a7a4a')); };
// moneda de oro
const moneda = (x, y) => { x = Math.round(x); y = Math.round(y); R.rect(x - 3, y - 1, x + 3, y + 1, K); R.linea(x - 2, y - 2, x + 2, y - 2, K); R.linea(x - 2, y + 2, x + 2, y + 2, K); R.linea(x - 2, y - 1, x + 2, y - 1, ORO); R.linea(x - 2, y, x + 2, y, H('#e0a830')); R.linea(x - 2, y + 1, x + 2, y + 1, ORO2); R.pset(x - 1, y - 1, H('#fff0a0')); };
// palmera pequeña de fondo (x pie, y pie, h alto), que se mece
const palmera = (x, y, h, t, s = 1) => { const ln = Math.sin(t * 1.2 + x) * 1.2 * s;
  for (let j = 0; j <= h; j++) { const xx = Math.round(x + (j / h) * (4 * s + ln)); R.pset(xx, y - j, j % 3 ? H('#7a5a3a') : H('#5a4028')); if (s > 0.8) R.pset(xx + 1, y - j, H('#9a7a50')); }

  const adios = suave(lin(t, ADDED + 0.8, ADDED + 1.4)) * (1 - suave(lin(t, C6 + 6.4, C6 + 6.9)));
  // el adiós: el brazo de Atom entra por el borde derecho (bajo su esquina), saluda moviendo la muñeca y sale por el mismo sitio
  if (adios > 0) { const wx = Math.round(lerp(344, 304, adios) + Math.sin(t * 11) * 2), wy = Math.round(70 + Math.sin(t * 11 + 1) * 3);
    T.brazo(R, wx + 24, wy + 16, wx, wy, GUANTE, -1, { sombra: false, codo: [wx + 13, wy + 11] }); }
  // el bote, a su tamaño de vuelo, mecido en el té (se lee a la primera), con sus anillos
  if (t > ADDED) { const gi = Math.round(Math.sin(t * 3) * 1), x = tx, y = ty - 1 + Math.round(Math.sin(t * 2.2) * 0.8);
    R.poligono([[x - 7, y - 2 + gi], [x + 7, y - 2 - gi], [x + 5, y + 2], [x - 5, y + 2]], K); R.poligono([[x - 6, y - 1 + gi], [x + 6, y - 1 - gi], [x + 4, y + 1], [x - 4, y + 1]], H('#9a6a3a')); R.linea(x - 6, y - 1 + gi, x + 6, y - 1 - gi, BL); R.linea(x - 3, y, x + 3, y, H('#6a4428')); }

  if (t > ADDED) for (let k = 0; k < 2; k++) { const u = ((t - ADDED) * 0.7 + k * 0.5) % 1, r = 3 + u * 7; if (u < 0.9) for (let a = 0; a < 6.28; a += 0.3) R.pset(Math.round(tx + Math.cos(a) * r), Math.round(ty + 1 + Math.sin(a) * r * 0.3), H('#e8c890')); }

};

const efectos = [[HAPP + 0.05, 'pop'], [NOONE + 0.35, 'brillo'],
  [CLIMB, 'ola'], [SEA, 'viento'],
  [FIT, 'lapiz'], [EXPER + 0.45, 'pop'], [PAGE, 'papel'],
  [CANT + 0.05, 'pop'], [RULE + 0.1, 'pop'],
  [TEA - 0.05, 'papel'], [MONST - 0.05, 'papel'], [PIRATE - 0.05, 'papel'], [PIRATE + 1.0, 'lapiz'],
  [MYST, 'pop'], [STRIP + 0.05, 'whoosh'], [ADDED, 'chof'], [ADDED + 1.0, 'brillo']];
const año = (t) => t < C2 ? 1873 : t < C4 ? 1872 : 2026;
T.rodar(E, R, [[0, p1c], [C2, p2c], [C3, p3c], [C4, p4c], [C5, p5c], [C6, p6c]], { efectos, año });
