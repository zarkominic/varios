<script type="module">
// JH-MINOTAURO (frases 46–47), lo real, sin cartela ni barra (no es tiempo de Panem). Cuatro planos:
// 1. Creta desde el acantilado: el barco de vela negra cruza la bahía hacia el espigón mientras un pastor con su cabra
//    sube al borde y señala el barco en «Crete» (corta en «into»);
// 2. el muelle: cielo con nubes de tres tonos a tres velocidades, una bandada lejana y bruma sobre la isla; la vela negra
//    de cerca (paños cosidos, fajas de rizos, remiendo, sol a la izquierda y sombra a la derecha, se hincha con el viento);
//    los chicos esperan en cubierta, bajan la pasarela uno a uno y forman fila con un cuerpo de hueco (tres a la izquierda,
//    dos a la derecha); Teseo baja el último y en «Theseus volunteered» da un paso al frente y levanta el brazo (los demás
//    le miran y el guardia le señala);
// 3. el circo romano: gradas llenas; en la arena un malabarista y un acróbata que salta; en «bread» el emperador lanza
//    los panes desde el palco y el público los coge (corta en «Give»);
// 4. la mesa del palco (inserto, otra composición): el mantel con greca, la cesta de panes, la del centro con el pan con
//    ojos, uvas, jarro y copa de oro; detrás, la cortina recogida, la balaustrada y, al fondo, las gradas llenas con un
//    malabarista y un acróbata en la arena; el brazo canónico del emperador (manga morada, puño de oro) entra por abajo y
//    lanza los panes a las gradas («give people food»); el pan con ojos ve la mano, se asusta y se esconde («protest»); en
//    «Mockingjay» un sinsajo dorado sale de detrás de la cortina y cruza el cielo, y el pan se asoma y lo señala.
import * as T from '/atomo/plato/escenas/jh-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('jh-minotauro');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const K8 = { k: hex('#1c1222'), piel: hex('#f6c290'), pielS: hex('#c88a5a'), blanco: hex('#ffffff'), oro: hex('#f0c040'), oroS: hex('#a87a18'),
  verde: hex('#4a9a3a'), verdeL: hex('#7ac85a'), verdeS: hex('#2e6a24'), crema: hex('#f4eedc'), gris: hex('#8a8a96'), rojo: hex('#c8303a') };
// la mano de tres dedos encima de la mano del chibi (hx, hy): tres dedos de 1 px con su contorno
const tresDedos = (hx, hy, piel = K8.piel) => {
  R.rect(hx - 3, hy - 7, hx + 3, hy - 2, K8.k);
  for (const fx of [-2, 0, 2]) R.rect(hx + fx, hy - 6, hx + fx, hy - 2, piel);
  R.pset(hx - 2, hy - 6, K8.blanco);
};
// una rana (x, y = pie, en el centro) a o.s (2 por omisión) que salta (o.salto 0–1) e infla el saco (o.croa)
const RANA = ['..kk...kk..', '.kwek.kwek.', '.kGGkkkGGk.', 'kGLGGGGGLGk', 'kGgGGGGGgGk', 'kGGGGkGGGGk', '.kgGGGGGgk.', 'kGGkkkkkGGk', 'kkk.....kkk'];
const rana = (x, y, t, o = {}) => {
  const s = o.s ?? 2, w = RANA[0].length, x0 = Math.round(x - w * s / 2), y0 = Math.round(y - Math.sin(Math.max(0, Math.min(1, o.salto ?? 0)) * Math.PI) * 12 - RANA.length * s);
  const pal = { k: K8.k, w: K8.blanco, e: K8.k, G: K8.verde, g: K8.verdeS, L: K8.verdeL };
  RANA.forEach((f, j) => { for (let i = 0; i < w; i++) { const c = pal[f[i]]; if (c != null) R.rect(x0 + i * s, y0 + j * s, x0 + i * s + s - 1, y0 + j * s + s - 1, c); } });
  if (o.croa) { const cx = x0 + Math.round(w * s / 2), cy = y0 + 6 * s + 2; R.disco(cx, cy, 2 * s + 1, K8.k); R.disco(cx, cy, 2 * s, hex('#e8e0a8')); R.pset(cx - 1, cy - 1, K8.blanco); }
};

const a = (f) => en('teseo', f), b = (f) => en('pan', f);
const P2 = a(0.554), P3 = b(0), P4 = b(0.489);
const CRETA = a(0.46), TESEO = a(0.797), VOLUNT = a(0.857), BREAD = b(0.32), PROTEST = b(0.679), SINSAJO = b(0.9), GIVE = b(0.489);
const TUN = (q, qs) => ({ A: hex('#f0ece2'), a: hex('#c8bc9a'), Q: hex(q), q: hex(qs) });
const GRIEGOS = [
  [EL.ciudadano, { pal: TUN('#5a7ac0', '#3a5a90') }], [EL.nina, { pal: { C: hex('#f0ece2'), c: hex('#c8bc9a'), W: hex('#f0ece2') } }],
  [EL.ciudadano, { pal: { ...TUN('#6a9a5a', '#4a7a3a'), H: hex('#6a4426') } }], [EL.nina, { pal: { C: hex('#e0c890'), c: hex('#b8a070'), W: hex('#e0c890'), H: hex('#6a4426') } }],
  [EL.ciudadano, { pal: { ...TUN('#c84a3a', '#8a2a20'), H: hex('#a86a2a') } }],
];
// 1 · Creta desde el acantilado: el barco llega; el pastor sube al borde con la cabra y lo señala
const p1 = (t) => {
  const g = T.real(R, t, { encuadre: 'creta', barco: tramo(t, 0, CRETA + 0.4) });
  const u = tramo(t, 0.6, CRETA - 0.6), x = Math.round(lerp(330, 236, u));
  // la cabra que sigue al pastor y bala
  const cx = Math.round(lerp(352, 262, tramo(t, 0.9, CRETA - 0.2))), cy = g.suelo, bal = t > CRETA + 0.3 && t < CRETA + 1.1;
  R.rect(cx - 1, cy - 9, cx + 11, cy - 3, K8.k); R.rect(cx, cy - 8, cx + 10, cy - 4, K8.crema); R.rect(cx + 1, cy - 4, cx + 9, cy - 4, hex('#c8c0b0'));
  for (const lx of [1, 3, 7, 9]) R.rect(cx + lx, cy - 3, cx + lx, cy - (Math.floor(t * 6 + lx) % 2 && tramo(t, 0.9, CRETA - 0.2) < 1 ? 1 : 0), K8.k);
  R.rect(cx - 4, cy - 12, cx + 1, cy - 7, K8.k); R.rect(cx - 3, cy - 11, cx, cy - 8, K8.crema); R.pset(cx - 2, cy - 10, K8.k); R.pset(cx - 1, cy - 13, hex('#8a7a5a')); R.pset(cx, cy - 14, hex('#8a7a5a'));
  if (bal) R.icono('!', cx - 8, cy - 22, K8.blanco, K8.k);
  R.actor(EL.ciudadano, x, g.suelo, t, { dir: -1, anda: u > 0 && u < 1, dedo: t > CRETA - 0.2 && t < P2, habla: t > CRETA && t < CRETA + 1.2 && Math.sin(t * 9) > 0, pal: { T: hex('#a87a4a') } });
  // una niña del pueblo corre hacia el borde a mirar
  const v = tramo(t, CRETA + 0.2, P2 - 0.3); R.actor(EL.nina, Math.round(lerp(330, 206, v)), g.suelo, t, { dir: -1, anda: v > 0 && v < 1, sorpresa: v >= 1 });
  T.realDelante(R, t, { encuadre: 'creta' });
};
// utilidades de los planos 2 y 4: mezcla de colores, ruido fijo y tramado 2×2
const mez = (a, b, k) => { let r = 0; for (const s of [0, 8, 16]) r |= Math.round(((a >>> s) & 255) * (1 - k) + ((b >>> s) & 255) * k) << s; return (r | 0xff000000) >>> 0; };
const hh = (a, b, c) => { const v = Math.sin(a * 12.9898 + b * 78.233 + c * 37.719) * 43758.5453; return v - Math.floor(v); };
const BAY = (x, y) => [0, 0.5, 0.75, 0.25][((y & 1) << 1) | (x & 1)];
// 2 · el cielo del muelle: los cuatro tonos del degradado del decorado; lo nuevo solo se pinta donde aún se ve cielo
// (así queda detrás del mástil, la vela, la isla y las nubes del decorado)
const CIELO2 = new Set(['#5a9ad8', '#7ab4e6', '#a8d0ee', '#d8ecf4'].map(hex));
const NUBE = [hex('#ffffff'), hex('#e6eef6'), hex('#bccce0'), hex('#9cb0c8')];
const psetCielo = (x, y, c) => { if (x >= 0 && x < 320 && y >= 0 && y < 92 && CIELO2.has(R.pget(x, y))) R.pset(x, y, c); };
// una nube de borregos (centro cx, cy; ancho w): bultos redondos, base plana, luz arriba y sombra abajo (tres tonos y filo)
const BULTOS = [[0, 0, 0.42], [-0.42, 0.12, 0.3], [0.44, 0.1, 0.32], [-0.18, -0.18, 0.3], [0.2, -0.22, 0.27], [0.74, 0.22, 0.2], [-0.74, 0.24, 0.2]];
const nube2 = (cx, cy, w) => {
  const base = cy + Math.round(w * 0.2);
  for (let y = Math.round(cy - w * 0.5); y <= base; y++) for (let x = Math.round(cx - w); x <= Math.round(cx + w); x++) {
    let mejor = -1, top = 0;
    for (const [bx, by, br] of BULTOS) { const d = 1 - Math.hypot(x - cx - bx * w, (y - cy - by * w) * 1.25) / (br * w); if (d > mejor) { mejor = d; top = (y - (cy + by * w - br * w)) / (2 * br * w); } }
    if (mejor <= 0) continue;
    const v = top * 2.6 + (base - y < 2 ? 1.2 : 0) + BAY(x, y) * 0.9 - 0.45, i = Math.max(0, Math.min(3, Math.floor(v)));
    psetCielo(x, y, NUBE[i]);
  }
};
const cieloPuerto = (t) => {
  // tres capas de nubes a tres velocidades (lejos lentas y planas, cerca rápidas y grandes)
  for (const [y, w, v, f] of [[84, 22, 0.7, 40], [80, 16, 0.7, 210], [62, 15, 1.8, 120], [52, 19, 1.8, 300], [34, 12, 3.1, 60], [28, 9, 3.1, 250]]) {
    const L = 360 + w * 2, x = (((f + t * v) % L) + L) % L - w - 20; nube2(Math.round(x), y, w);
  }
  // una bandada lejana de gaviotas (por detrás de la vela) que planea hacia el puerto
  for (let k = 0; k < 6; k++) { const bx = Math.round(((t * 7 + 30) % 380) - 40 - [0, 6, 12, 7, 14, 21][k] * 1.6), by = Math.round(40 + [0, 3, 6, -3, -6, 9][k] + Math.sin(t * 0.8 + k) * 1.5), a = Math.sin(t * 7 + k * 1.3) > 0 ? 1 : 0;
    psetCielo(bx, by, hex('#4a5a6e')); psetCielo(bx - 1, by - a, hex('#4a5a6e')); psetCielo(bx + 1, by - a, hex('#4a5a6e')); psetCielo(bx - 2, by - 1 + a, hex('#6a7a8e')); psetCielo(bx + 2, by - 1 + a, hex('#6a7a8e')); }
  // la bruma de la mañana que se arrastra sobre la falda de la isla y el horizonte
  for (let y = 74; y < 94; y++) for (let x = 190; x < 320; x++) {
    if (((x + y) & 1) !== 0) continue;
    const d = (0.55 + 0.45 * Math.sin(x * 0.045 + t * 0.35 + y * 0.18)) * (1 - Math.abs(y - 86) / 12);
    if (hh(x >> 1, y, 571) < d * 0.8) R.pset(x, y, mez(R.pget(x, y), hex('#eef2f6'), 0.42));
  }
};
// la vela negra de cerca, encima de la del decorado (mismo sitio, misma vela y mismo vaivén): paños cosidos, dos fajas de
// rizos con sus puntas, un remiendo, relinga clara a barlovento, luz del sol a la izquierda y sombra a la derecha, pliegues
// que corren con el viento y una panza que se hincha (siempre algo más que la del decorado, para taparla entera)
const VELA = ['#0e0c12', '#17141d', '#211d29', '#2c2736', '#3a3446', '#4b4458', '#5e566e', '#7a7290'].map(hex);
const velaNegra = (t) => {
  const vai = Math.sin(t * 1.2) * 1.2, X = (u) => Math.round(14 + u * 0.875), Y = (v) => Math.round(140 + vai + v * 0.875);
  const yT = Y(-128), yB = Y(-64), x0 = X(50), xr = X(122), B = 9.5 + 3 * Math.sin(t * 1.6) + 1.5 * Math.max(0, Math.sin(t * 0.7));
  for (let y = yT; y <= yB; y++) {
    const f = (y - yT) / (yB - yT), x1 = xr + Math.ceil(Math.sin(f * Math.PI) * B);
    const faja = Math.abs(f - 0.36) < 0.012 || Math.abs(f - 0.7) < 0.012;
    for (let x = x0; x <= x1; x++) {
      const u = (x - x0) / (x1 - x0);
      let L = 1.0 - 1.12 * u + 0.12 * (1 - f) + 0.16 * Math.sin((u * 4.4 - f * 1.5) * Math.PI + t * 1.7) * Math.sin(f * Math.PI);
      if (u > 0.12 && u < 0.27 && f > 0.47 && f < 0.6) L += 0.1;   // el remiendo
      let i = Math.max(0, Math.min(6, Math.floor(L * 6 + BAY(x, y))));
      const p = x - x0;
      if (p > 0 && p % 9 === 0) i = Math.min(7, i + ((y & 1) ? 1 : 2));       // costura de los paños (puntadas)
      else if (p > 0 && p % 9 === 1) i = Math.max(0, i - 1);                   // y su sombra
      if (faja) i = Math.max(0, i - 2);
      if (u > 0.11 && u < 0.28 && Math.abs(f - 0.465) < 0.01 && ((x + y) & 1)) i = Math.min(7, i + 2);    // las puntadas del remiendo
      if (x === x0) i = 7; else if (x === x0 + 1) i = Math.min(7, i + 1);      // la relinga al sol
      if (x >= x1 - 1) i = 0;                                                   // la baluma en sombra
      if (y === yT) i = x % 4 === 0 ? -1 : 5;                                  // la envergadura atada a la verga
      if (y === yB) i = 1; else if (y === yB - 1 && (x & 1)) i = 4;            // el pujamen con su dobladillo
      R.pset(x, y, i < 0 ? hex('#8a6a4a') : VELA[i]);
    }
    // las puntas de rizo que cuelgan de cada faja y se mueven con el viento
    if (faja) for (let x = x0 + 4; x < x1 - 2; x += 6) { const d = Math.sin(t * 5 + x) > 0 ? 1 : 0; R.pset(x + d, y + 1, VELA[6]); R.pset(x + d, y + 2, VELA[5]); }
  }
  // un destello de sol que resbala por la panza
  { const gy = Math.round(yT + 12 + (Math.sin(t * 0.9) * 0.5 + 0.5) * 30); for (let k = 0; k < 3; k++) R.pset(x0 + 3 + k, gy + k, VELA[7]); }
  // las jarcias (por delante de la vela, como en el decorado) y las escotas que bajan a cubierta
  R.linea(X(86), Y(-140), X(170), Y(-50), hex('#3a2a1a')); R.linea(X(86), Y(-140), X(-6), Y(-42), hex('#3a2a1a'));
  R.linea(x0, yB, X(30), Y(-31), hex('#a8875a')); R.linea(xr + 1, yB, X(118), Y(-31), hex('#a8875a'));
};
// 2 · el muelle: bajan por la pasarela uno a uno y se ponen en fila con un cuerpo de hueco; Teseo, el último, da el paso
const p2 = (t) => {
  const g = T.real(R, t, { encuadre: 'creta', camara: 'puerto' });
  cieloPuerto(t); velaNegra(t);
  const [[ax, ay], [bx, by]] = g.pasarela, TOP = ax - 8, PX = bx - 8, FILA = g.suelo - 4;
  // el guardia cretense espera al final del muelle con su lanza; cuando Teseo se ofrece, le señala
  { const se = t > VOLUNT + 0.2 && t < VOLUNT + 1.3;
    const gm = R.actor(EL.ciudadano, 290, g.suelo - 2, t, { dir: -1, dedo: se, sostiene: se ? null : [283, g.suelo - 16], pal: { ...TUN('#8a3a2a', '#5a2018'), A: hex('#c84a3a'), a: hex('#8a2a20') } });
    if (!se) { const [lx, ly] = gm.mano; R.linea(lx, ly - 22, lx, ly + 10, K8.k); R.linea(lx + 1, ly - 22, lx + 1, ly + 10, hex('#8a5a2a')); R.poligono([[lx - 1, ly - 22], [lx + 2, ly - 22], [lx + 1, ly - 27]], hex('#c8ccd8')); } }
  // cada uno: espera en cubierta (la cola avanza), baja la pasarela y va a su sitio de la fila (a 45 px/s)
  const FX = [92, 120, 148, 240, 212, 180], BAJA = 0.9, S5 = TESEO - 1.35, S0 = FX.map((_, k) => S5 - (5 - k) * 0.55);
  const lista = [...GRIEGOS, [EL.teseo, {}]].map(([d, o], k) => {
    const s0 = S0[k], q = S0.slice(0, k).reduce((s, sj) => s + (1 - tramo(t, sj, sj + 0.4)), 0);
    const u = tramo(t, s0, s0 + BAJA), dur = Math.max(0.3, Math.abs(FX[k] - PX) / 45), w = tramo(t, s0 + BAJA, s0 + BAJA + dur);
    let x = TOP - 22 * q, y = ay, dir = 1, anda = t < s0 && q % 1 > 0.01;
    if (u > 0) { x = lerp(TOP, PX, u); y = lerp(ay, by, u); anda = u < 1; }
    if (w > 0) { x = lerp(PX, FX[k], w); y = lerp(by, FILA, w); anda = w < 1; dir = FX[k] < PX - 2 ? -1 : 1; }
    if (w >= 1) dir = 1;
    return { d, o, k, x, y, dir, anda };
  });
  const mira = t > TESEO + 0.1, pasa = tramo(t, TESEO - 0.1, TESEO + 0.6);
  { const ts = lista[5]; if (pasa > 0) { ts.x = lerp(FX[5], 186, pasa); ts.y = lerp(FILA, g.suelo + 5, pasa); ts.anda = pasa < 1; ts.dir = 1; } }
  lista.sort((p, q) => p.y - q.y).forEach(({ d, o, k, x, y, dir, anda }) => {
    if (k === 5) { R.actor(d, Math.round(x), Math.round(y), t, { dir, anda, brazos: t > VOLUNT && t < VOLUNT + 0.9, sonrisa: t > VOLUNT + 0.9 }); return; }
    const quieto = !anda && y >= FILA - 0.5, dm = mira && quieto ? (FX[k] > 186 ? -1 : 1) : dir;
    R.actor(d, Math.round(x), Math.round(y), t, { dir: dm, anda, triste: !mira, sorpresa: mira && t < VOLUNT + 0.8, ...o });
  });
};
// 3 · el circo: malabarista y acróbata en la arena; en «bread» vuelan los panes
const p3 = (t) => {
  const g = T.real(R, t, { encuadre: 'circo', panes: tramo(t, BREAD - 0.2, GIVE) });
  // el malabarista: tres bolas en el aire
  const mx = 92; R.actor(EL.ciudadano, mx, g.suelo, t, { dir: 1, brazos: true, pal: { A: hex('#e8c040'), a: hex('#b8902a'), Q: hex('#3aa86a'), q: hex('#2a7a4a') } });
  for (let k = 0; k < 3; k++) { const f = (t * 1.6 + k / 3) % 1, bx = Math.round(mx + 2 + f * 11), by = Math.round(g.suelo - 30 - Math.sin(f * Math.PI) * 16); R.disco(bx, by, 2, K8.k); R.disco(bx, by, 1, [K8.rojo, K8.oro, hex('#4a7ac8')][k]); }
  // el acróbata que da volteretas por la arena
  const v = tramo(t, P3 + 0.3, GIVE - 0.3), ax = Math.round(lerp(300, 150, v)), sal = v > 0 && v < 1 ? Math.round(Math.abs(Math.sin(t * 5)) * 12) : 0;
  R.actor(EL.ciudadano, ax, g.suelo, t, { dir: -1, salto: sal, brazos: sal > 4, anda: v > 0 && v < 1 && sal <= 4, pal: { A: hex('#e84a7a'), a: hex('#b83a5a'), Q: hex('#f0ece2'), q: hex('#c8bc9a') } });
  // el emperador en el palco: saluda y, en «bread», lanza los panes
  { const [ex, ey] = g.emperador, tira = t > BREAD - 0.3 && t < BREAD + 1.2; R.actor(EL.emperador, ex - 7, ey, t, { dir: 1, brazos: tira && Math.floor(t * 5) % 2 === 0, dedo: !tira && t > P3 + 1 && t < P3 + 2.2, sonrisa: true }); }
  // el legionario de la puerta aplaude con el público al caer los panes
  R.actor(EL.legionario, 252, g.suelo - 2, t, { dir: -1, sonrisa: t > BREAD, brazos: t > BREAD + 0.2 && Math.floor(t * 4) % 2 === 0 });
  T.realDelante(R, t, { encuadre: 'circo', panes: tramo(t, BREAD - 0.2, GIVE) });
};
// 4 · la mesa del palco (inserto): el emperador reparte; el pan con ojos se esconde; pasa el sinsajo
const P4C = {
  marmol: hex('#ece6d6'), marmolL: hex('#fbf8f0'), marmolS: hex('#c8bea8'), marmolSS: hex('#a89e88'),
  morado: hex('#6a2a8a'), moradoL: hex('#8a4aa8'), moradoS: hex('#4a1a62'), moradoSS: hex('#32104a'),
  oro: hex('#f0c040'), oroL: hex('#fff0a0'), oroS: hex('#a87a18'),
  lino: hex('#f6f2e8'), linoS: hex('#ddd4c0'), linoSS: hex('#bfb39a'),
  arena: hex('#e8cc96'), arenaS: hex('#c8a870'), arenaSS: hex('#a8885a'),
  mimbre: hex('#c8984a'), mimbreL: hex('#e0b868'), mimbreS: hex('#8a6028'), mimbreSS: hex('#5a3a14'),
  panB: hex('#c8843a'), panL: hex('#e8a85a'), panS: hex('#8a5220'), panBr: hex('#f8d490'), panK: hex('#5a3416'),
};
const ROPA4 = ['#c84a3a', '#4a7ac8', '#e8c040', '#6a9a5a', '#f0ece2', '#a85ac8', '#e88a3a', '#3a8a8a'].map(hex), PIEL4 = ['#f6c290', '#d8a070', '#a86a40', '#7a4a2a'].map(hex);
// un panecillo redondo de radio r con su corte, luz arriba a la izquierda y brillo
const panecillo = (x, y, r) => {
