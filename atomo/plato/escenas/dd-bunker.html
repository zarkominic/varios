// DD-BUNKER (frases 6–8). Once planos:
// 1. el pasillo del búnker: Banner llega con su taza de café, se para ante la puerta estanca y da un sorbo; un ratón cruza;
// 2. lo que graba su cámara: habla con su tablilla («report»); en «green light» la luz verde entra y se vuelve, sorprendido;
// 3. la otra pared del búnker (fondo local, otro encuadre: catre, estantería, rejilla con ventilador, reloj, hornillo,
//    taquilla y la cámara en su trípode delante); la luz verde solo alrededor de su foco: la voz de Doom (la máscara
//    canónica en holograma), «Hulk roars» (Banner es Hulk y la sala tiembla), «vanish» (destello corto) y queda el símbolo;
// 4. a ras de suelo: el símbolo y la taza que da vueltas y se para (gag 2); en «Why» sale un «?» verde (sin velos: la
//    cámara 'suelo' ya deja tranquilas la barra y la zona de Atom);
// 5. el escenario de la sala envolvente: los Russo llegan a sus sillas; en la pantalla, la silueta plana de Hulk (verde
//    oscura, sin rasgos, con su borde de luz, ~42 px) con «?»; uno niega, el otro se encoge de hombros («won't confirm»);
// 6. la sala de los Vengadores: el holograma de la máscara canónica de Doom (verde, con barrido, que gira y late) y Banner
//    chibi que da vueltas a su alrededor, por detrás y por delante («revolves»); la esquina de Atom, oscurecida;
// 7. la pared del salón: reloj, lámpara de pie con su luz, balda con libros, sofá asomando, zócalo con vetas y rodapié; la
//    mano arranca el 12 del taco y deja el 13 («November 13th»); con el mando enciende la tele, sale el reestreno (el
//    símbolo verde, «Disney Plus») y su luz tiembla en la pared;
// 8. (cómic) Victor, encapuchado, sube por la montaña nevada hacia el monasterio; «1964» en el cartucho;
// 9. (cómic) llega a la fragua; los monjes sacan la máscara al rojo de las brasas y la martillean («forge»);
// 10. (cómic) de cerca: la máscara en las tenazas, volutas de vapor gris que suben por los bordes y la capucha que se
//     inclina («put it on before it had cooled»);
// 11. dos imágenes partidas a la derecha del año: la otra pared del búnker, vacía y de cerca, con el símbolo quemado, y el
//     patio del cómic de cerca con la máscara pequeña, gris, sobre su yunque; dos círculos y «=» («a nod»).
import * as T from '/atomo/plato/escenas/dd-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('dd-bunker');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const K = hex('#141018');
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
const azar = (a, b = 0) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
const caja = (x0, y0, x1, y1, c, b = K) => { R.rect(x0, y0, x1, y1, b); R.rect(x0 + 1, y0 + 1, x1 - 1, y1 - 1, c); };
// oscurece (o aclara) una zona hacia un color, con un poco de trama: para dejar tranquila la esquina de Atom o la barra
const velo = (x0, y0, x1, y1, col, a) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) R.pset(x, y, mez(R.pget(x, y), col, a)); };
// una bocanada de vapor: gris claro translúcido, más denso en el centro, con trama de píxel
const vaho = (cx, cy, r, a) => { const q = r * r; for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++) {
  const d = ((x - cx) ** 2 + (y - cy) ** 2) / q; if (d > 1 || x < 0 || x > 319 || y < 0 || y > 179) continue;
  const k = a * (1 - d) * ((x + y) % 2 ? 0.8 : 1.15); R.pset(x, y, mez(R.pget(x, y), d < 0.3 ? hex('#e4e2dc') : hex('#a8aab0'), Math.min(0.8, k))); } };
// la taza de café de Banner (5 × 5, con su asa), (x, y) arriba a la izquierda; humo: el vapor que sube
const taza = (x, y, t, humo = true) => { R.rect(x, y, x + 4, y + 5, K); R.rect(x + 1, y + 1, x + 3, y + 4, hex('#f2eee2')); R.pset(x + 1, y + 1, hex('#5a3a24')); R.pset(x + 2, y + 1, hex('#5a3a24')); R.pset(x + 3, y + 1, hex('#5a3a24'));
  R.pset(x + 5, y + 2, K); R.pset(x + 6, y + 3, K); R.pset(x + 5, y + 4, K); R.pset(x + 3, y + 4, hex('#c8c4bc'));
  if (humo) for (let k = 0; k < 3; k++) { const f = (t * 0.9 + k / 3) % 1; R.pset(Math.round(x + 2 + Math.sin(t * 3 + k * 2) * 1.2), Math.round(y - 1 - f * 7), f > 0.6 ? hex('#8a8a90') : hex('#c8c8d0')); } };
// un actor del reparto dibujado a escala (silueta en una pantalla): col(c) da el color de cada píxel
const BUFA = R.nuevo();
const actorT = (def, x, suelo, t, o, col, a) => escalado(def, x - 12, suelo - 40, 1, t, o, (c) => mez(c, col, a));
const escalado = (def, x0, y0, s, t, o, col, clip = null) => { R.recorte(null); const prev = R.usar(BUFA); BUFA.fill(0); R.actor(def, 20, 44, t, o); R.usar(prev);
  for (let j = 4; j < 46; j++) for (let i = 8; i < 44; i++) { const c = BUFA[j * 320 + i]; if (!c) continue; const cc = col ? col(c, i, j) : c; for (let a = 0; a < s; a++) for (let b = 0; b < s; b++) { const px = x0 + (i - 8) * s + a, py = y0 + (j - 4) * s + b; if (!clip || (px >= clip[0] && px <= clip[2] && py >= clip[1] && py <= clip[3])) R.pset(px, py, cc); } } };

const A = (f) => en('bunker', f), B = (f) => en('porque', f), C = (f) => en('mascara', f);
const P2 = A(0.241), P3 = A(0.585), P4 = A(0.851), P5 = B(0.177), P6 = B(0.483), P7 = B(0.766), P8 = C(0), P9 = C(0.241), P10 = C(0.606), P11 = C(0.83);
const VERDE = hex('#3ae88a'), VERDES = hex('#1a8a4a');
// 1 · el pasillo: Banner llega con su café y da un sorbo junto a la puerta
const p1 = (t) => {
  const o = { encuadre: 'pasillo' }; T.bunker(R, t, o);

// 2 · lo que graba la cámara: habla con la tablilla; la luz verde entra y él se vuelve
const p2 = (t) => {

// LA MÁSCARA DE DOOM EN HOLOGRAMA (la forma canónica de b_mascara de dd-comun.js, rehecha aquí en verde translúcido):
// centro cx, cy; unos 9·s px de alto, con la capucha tramada detrás; frente, rendijas de los ojos, arista de la nariz,
// rejilla de la boca; líneas de barrido que bajan con t; a 0–1 su intensidad; g −1…1 el giro (el ancho; g < 0, de espaldas)
const mascaraHolo = (cx, cy, s, t, a = 1, g = 1) => {
  cx = Math.round(cx); cy = Math.round(cy); const H = 4.5 * s, W = 3.6 * s * Math.max(0.14, Math.abs(g)), atras = g < 0, barr = Math.floor(t * 16);
  const dentro = (u, v) => v < -0.15 ? u * u + ((v + 0.15) / 0.85) ** 2 < 1 : v < 1 && Math.abs(u) < 1 - (v + 0.15) * 0.38;
  const pon = (x, y, c, al) => { if (x >= 0 && x < 320 && y >= 0 && y < 180) R.pset(x, y, mez(R.pget(x, y), c, Math.min(0.95, al * a))); };
  const Wc = 3.6 * s * Math.max(0.3, Math.abs(g));
  for (let y = Math.floor(cy - H * 1.75); y <= Math.ceil(cy + H * 1.55); y++) for (let x = Math.floor(cx - Wc * 1.7); x <= Math.ceil(cx + Wc * 1.7); x++) {
    const u = (x - cx) / Wc, v = (y - cy) / H, pico = v < -1 ? Math.abs(u) < (v + 1.75) * 1.4 : true, e = (u / 1.65) ** 2 + ((v + 0.05) / 1.6) ** 2;
    if (e > 1 || !pico || v > 1.5 || dentro((x - cx) / W, v)) continue;
    const borde = e > 0.84; if (!borde && ((x + y + barr) % 3)) continue; pon(x, y, borde ? VERDE : VERDES, borde ? 0.75 : 0.45); }
  for (let y = Math.floor(cy - H); y <= Math.ceil(cy + H); y++) for (let x = Math.floor(cx - W); x <= Math.ceil(cx + W); x++) {
    const u = (x - cx) / W, v = (y - cy) / H; if (!dentro(u, v)) continue;
    const du = 1 / W, dv = 1 / H, filo = !dentro(u - du, v) || !dentro(u + du, v) || !dentro(u, v - dv) || !dentro(u, v + dv);
    if (filo) { pon(x, y, hex('#d2ffe6'), 0.95); continue; }
    const fila = (y + barr) % 4; let c = atras ? VERDES : VERDE, al = 0.42 - u * 0.12 * (atras ? -1 : 1);
    if (fila === 0) { c = hex('#9affc8'); al = 0.7; } else if (fila === 2) al *= 0.6;
    if (!atras) {
      if (v > -0.3 && v < -0.17 && Math.abs(u) > 0.18 && Math.abs(u) < 0.7 - (v + 0.3) * 0.6) { c = hex('#04140a'); al = 0.8; }
      else if (v > 0.48 && v < 0.64 && Math.abs(u) < 0.42) { c = (x - cx) % 2 === 0 ? hex('#04140a') : VERDE; al = 0.75; }
      else if (Math.abs(u) < 0.07 && v > -0.3 && v < 0.3) { c = hex('#d2ffe6'); al = 0.7; }
      else if (v > -0.42 && v < -0.33) { c = hex('#9affc8'); al = 0.6; } }
    pon(x, y, c, al); }
};

const G3 = { techo: hex('#2e2e34'), techoL: hex('#38383f'), m0: hex('#62625c'), m1: hex('#6e6e66'), m2: hex('#7a7a70'), m3: hex('#8e8e82'), jun: hex('#4a4a44'), junL: hex('#9c9c90'), hum: hex('#565a50'),
  s0: hex('#44443f'), s1: hex('#4e4e48'), s2: hex('#5a5a52'), me0: hex('#2e3238'), me1: hex('#4a5058'), me2: hex('#6a7078'), me3: hex('#9aa2aa'), ma0: hex('#4a2e16'), ma1: hex('#6a4426'), ma2: hex('#8a5e34'), ma3: hex('#a8763e'), carton: hex('#b88a4a'), cartonS: hex('#8a6430') };

const otraPared = () => { R.recorte(null); const prev = R.usar(BUF3);
  // el techo: la losa tramada, oscura (la barra del año y la esquina de Atom quedan tranquilas), la viga y dos tuberías

  R.rect(0, 10, 250, 15, hex('#1e2024')); R.rect(0, 11, 250, 11, hex('#4a5058')); R.rect(0, 12, 250, 13, hex('#3a3e44')); for (let x = 30; x < 250; x += 56) R.rect(x, 9, x + 2, 16, hex('#1a1c20'));
  R.rect(246, 10, 252, 40, hex('#1e2024')); R.rect(247, 15, 247, 40, hex('#4a5058')); R.rect(248, 15, 250, 40, hex('#3a3e44'));
  // el hormigón: tres tonos, paneles con juntas, agujeros de encofrado, manchas de humedad abajo y el churretón del tubo
  for (let y = 22; y < 132; y++) for (let x = 0; x < 320; x++) {
    const n = azar(x >> 1, y >> 1), hu = Math.sin(x * 0.045 + Math.sin(y * 0.07) * 2) + Math.sin(y * 0.11 + x * 0.013) * 0.6;
    let c = n < 0.25 ? G3.m0 : n < 0.8 ? G3.m1 : G3.m2; if (y < 30) c = mez(c, K, 0.25 - (y - 22) * 0.03);
    if (y > 92 && hu > 1.05 - (y - 92) * 0.012 && n > 0.2) c = G3.hum;

  R.rect(110, 166, 132, 172, K); R.rect(111, 167, 131, 171, G3.me1); for (let x = 113; x < 131; x += 3) R.linea(x, 167, x, 171, K); R.rect(111, 167, 131, 167, G3.me2);
