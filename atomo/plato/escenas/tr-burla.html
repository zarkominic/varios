<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La burla · ep23</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// TR-BURLA (frase 4), sin cartela. Cuatro planos:
// 1. el salón burgués de Madrid de 1894: la señora se come una uva del racimo («Back to the grapes»), el caballero abre
//    el periódico en «newspaper»; el criado entra por la derecha con la bandeja de dos copas, la señora coge la suya y
//    en «France» brindan a la francesa (el criado se inclina);
// 2. en «and some believe»: la calle de abajo de noche: el perrito ladra al chulapo; en «mocking» el chulapo levanta
//    el racimo como una copa y hace la reverencia; en «rich people» la chulapa aplaude riéndose; en «copied it» se
//    llena la boca de uvas; el pilluelo señala el balcón, se ríe y se va corriendo con el perro detrás;
// 3. en «Most likely»: el viñedo de Alicante en la vendimia de 1909: el viticultor da dos pasos y levanta el racimo en
//    «both things happened»; la labriega corta un racimo y lo echa en la cesta; en «was born» llega la niña con su
//    capazo, el viticultor le da el racimo y ella se come una uva;
// 4. en «and the grape surplus»: el almacén: el labriego sube las cajas a la pila (caen con su golpe) hasta el techo;
//    el viticultor estampa «1909» en «nineteen oh-nine»; el labriego carga una caja más en la carretilla y en «spread
//    it» se la lleva hacia la puerta; la caja de arriba bota en un bache y el viticultor le dice adiós con la mano.
import * as T from '/atomo/plato/escenas/tr-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('tr-burla');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const b = (f) => en('burla', f), K = T.C.k;
const P2 = b(0.2675), P3 = b(0.4961), P4 = b(0.7704);
// 1 · el salón burgués
const lee = b(0.0961), coge = b(0.0229), brindis = b(0.2249), TOMA = brindis - 1.5;
const bandeja = (x, y, n) => {
  // la bandeja de plata con n copas de champán
  R.rect(x - 7, y, x + 7, y + 1, K); R.rect(x - 6, y, x + 6, y, hex('#e8e8f0')); R.pset(x - 4, y, hex('#ffffff'));
  for (let k = 0; k < n; k++) T.PIEZAS_TR.copa(R, x - 3 + k * 6, y - 1);
};
const p1 = (t) => {
  const o = { encuadre: 'casa1890' };
  T.anuevo(R, t, o);
  // delante del balcón: él lee el periódico (en «newspaper») y ella se come las uvas; en «France», brindan
  const brinda = t > brindis - 0.4 && t < brindis + 0.9, choca = t > brindis - 0.1 && t < brindis + 0.3;
  const conCopa = brinda || t > brindis - 0.9;
  const a = R.actor(EL.burgues, 222, 162, t, { dir: 1, sostiene: brinda ? [244 - (choca ? 0 : 3), 136] : conCopa ? [238, 146] : t > lee - 0.3 ? [240, 146] : [238, 150], sonrisa: brinda || t > TOMA, habla: t > lee + 0.8 && t < TOMA && Math.sin(t * 7) > 0 });
  if (conCopa) T.PIEZAS_TR.copa(R, a.mano[0], a.mano[1] + 6);
  else if (t > lee - 0.3) T.PIEZAS_TR.periodico(R, a.mano[0] + 4, a.mano[1] + 10 - Math.round(tramo(t, lee - 0.3, lee) * 3), { anio: 1894 });
  // la señora: come uvas, se vuelve al criado y coge su copa; luego brinda
  const come = t > coge + 0.3 && t < lee + 1.2 && Math.sin((t - coge) * 5) > 0.3;
  const vuelta = t > TOMA - 0.5 && t < TOMA + 0.4, tiene = t > TOMA;
  const c = R.actor(EL.senoraMantilla, 262, 162, t, { dir: vuelta ? 1 : -1, sostiene: brinda ? [250 + (choca ? 0 : 3), 136] : vuelta ? [282, 140] : come ? [254, 145] : [251, 151], sonrisa: t > lee + 1.2 || brinda, habla: t > lee + 1.4 && t < TOMA - 0.6 && Math.sin(t * 6) > 0 });
  if (tiene) T.PIEZAS_TR.copa(R, c.mano[0], c.mano[1] + 6);
  else if (!vuelta) T.PIEZAS_TR.racimo(R, c.mano[0], c.mano[1] + 15, { color: 'verde', hueco: t > coge + 1 });
  // el criado entra por la derecha con la bandeja, se la ofrece y se inclina en el brindis
  const w = tramo(t, 1.2, TOMA - 0.6), sx = Math.round(lerp(336, 288, w)), incl = t > brindis - 0.1 && t < brindis + 0.5;
  const s = R.actor(EL.chulapo, sx, 162 + (incl ? 1 : 0), t, { dir: -1, anda: w > 0 && w < 1, sostiene: [sx - 4, 140 + (incl ? 2 : 0)], sonrisa: w >= 1, pal: { C: '#2a2a32', c: '#1a1a22' } });
  bandeja(s.mano[0], s.mano[1], tiene ? 1 : 2);
  T.anuevoDelante(R, t, o);
  if (t > brindis && t < brindis + 0.5) for (let k = 0; k < 6; k++) { const an = k * 1.05, r = 4 + (t - brindis) * 20; R.pset(Math.round(247 + Math.cos(an) * r), Math.round(126 + Math.sin(an) * r), hex('#fff0a0')); }
};
// 2 · la calle de abajo: la burla
// el perrito callejero: sentado, ladrando o corriendo (dir 1 a la derecha)
const perro = (x, y, t, modo, dir = 1) => {
  const corre = modo === 'corre', ladra = modo === 'ladra', p = corre ? Math.floor(t * 12) % 2 : 0;
  const Cp = hex('#b8844a'), cs = hex('#8a5a2a'), cl = hex('#e0b070');
  const X = (dx) => x + dx * dir;
  // cuerpo y patas
  for (let dx = -5; dx <= 4; dx++) for (let dy = -6; dy <= -3; dy++) R.pset(X(dx), y + dy, dy === -6 || Math.abs(dx) === 5 ? K : dy === -5 ? cl : dy === -3 ? cs : Cp);
  for (const [lx, ph] of [[-4, p], [-2, 1 - p], [2, p], [4, 1 - p]]) { R.pset(X(lx + (corre ? (ph ? 1 : -1) : 0)), y - 2, K); R.pset(X(lx + (corre ? (ph ? 1 : -1) : 0)), y - 1, K); }
  // cabeza (levantada si ladra) con la oreja caída y el hocico
  const hy = y - 9 - (ladra && Math.sin(t * 14) > 0 ? 1 : 0);
  for (let dx = 3; dx <= 8; dx++) for (let dy = 0; dy <= 4; dy++) R.pset(X(dx), hy + dy, dy === 0 || dx === 8 || dy === 4 ? K : dy === 1 ? cl : Cp);
  R.pset(X(6), hy + 2, K); R.pset(X(9), hy + 3, K); R.pset(X(4), hy + 1, cs); R.pset(X(4), hy + 2, cs);
  if (ladra && Math.sin(t * 14) > 0) R.pset(X(9), hy + 4, hex('#c8303a'));
  // la cola que se mueve
  const cola = Math.sin(t * (corre ? 18 : 12)) > 0 ? -1 : 0;
  R.pset(X(-6), y - 6 + cola, K); R.pset(X(-7), y - 7 + cola, K); R.pset(X(-7), y - 8 + cola, cs);
};
const burla = b(0.3714), ricos = b(0.4047), copian = b(0.4483), LADRA = P2 + 0.6;
const p2 = (t) => {
  const o = { encuadre: 'casa1890', camara: 'calle' };
  T.anuevo(R, t, o);
  const rev = t > burla && t < burla + 0.8;
  // el chulapo levanta un racimo como si fuera una copa de champán, hacia el balcón, y hace la reverencia
  const a = R.actor(EL.chulapo, 116, 164, t, { dir: 1, sostiene: rev ? undefined : [132, 132 + Math.round(Math.sin(t * 4))], brazos: rev, salto: rev ? Math.round(Math.abs(Math.sin((t - burla) * 8)) * 3) : 0, sonrisa: true, sorpresa: t > LADRA && t < LADRA + 0.5, habla: t > LADRA + 0.6 && t < burla && Math.sin(t * 8) > 0 });
  if (!rev) T.PIEZAS_TR.racimo(R, a.mano[0] + 1, a.mano[1] + 16);
  // la chulapa: aplaude en «rich people» y luego se llena la boca de uvas en «copied it»
  const aplaude = t > ricos + 0.1 && t < ricos + 0.7;
  const ch = R.actor(EL.chulapa, 152, 164, t, { dir: -1, sonrisa: true, brazos: aplaude, salto: aplaude && Math.sin(t * 20) > 0 ? 1 : 0, sostiene: aplaude ? undefined : t > copian ? [146, 140] : [144, 148], habla: t > burla && t < ricos && Math.sin(t * 9) > 0 });
  if (!aplaude && t < copian + 0.3) { const [mx, my] = ch.mano; R.rect(mx - 2, my + 1, mx + 2, my + 6, K); R.rect(mx - 1, my + 2, mx + 1, my + 5, hex('#6a2a7a')); R.pset(mx - 1, my + 2, hex('#b07ac8')); }
  // los mofletes llenos de uvas
  if (t > copian + 0.3) { R.pset(146, 164 - 17, hex('#f0a0a0')); R.pset(147, 164 - 16, hex('#f0a0a0')); }
  // el pilluelo señala el balcón y se ríe; luego se va corriendo con el perro detrás
  const n = tramo(t, copian - 0.1, P3 - 0.1), nx = Math.round(lerp(196, 264, n));
  R.actor(EL.ninoCampo, nx, 164, t, { dir: n > 0 ? 1 : -1, anda: n > 0 && n < 1, sonrisa: true, dedo: t > burla - 0.2 && t < copian - 0.1, salto: t > ricos && t < copian && Math.sin(t * 16) > 0 ? 1 : 0 });
  // el perro: sentado junto a la farola, ladra al chulapo y luego persigue al pilluelo
  const kp = tramo(t, copian + 0.1, P3 - 0.05), xp = Math.round(lerp(72, 240, kp));
  perro(xp, 165, t, kp > 0 && kp < 1 ? 'corre' : t > LADRA && t < LADRA + 0.7 ? 'ladra' : 'sentado', 1);
};
// 3 · el viñedo de Alicante en 1909
const ambas = b(0.5257), nace = b(0.6390), CORTA = P3 + 1.7, DA = nace + 0.9;
const p3 = (t) => {
  const o = { encuadre: 'vinedo' };
  T.anuevo(R, t, o);
  // el viticultor da dos pasos y levanta el racimo; luego se vuelve y se lo da a la niña
  const w = tramo(t, P3, ambas - 0.15), vx = Math.round(lerp(140, 150, w)), arriba = t > ambas - 0.2 && t < nace + 0.3;
  const da = t > nace + 0.3 && t < DA + 0.3, entregado = t > DA;
  const a = R.actor(EL.viticultor, vx, 160, t, { dir: da || entregado ? -1 : 1, anda: w > 0 && w < 1, sostiene: entregado ? undefined : arriba ? [vx + 18, 128] : da ? [vx - 4, 142 + Math.round(tramo(t, nace + 0.3, DA) * 4)] : [vx + 18, 146], sonrisa: arriba || entregado });
  if (!entregado) T.PIEZAS_TR.racimo(R, a.mano[0] + 1, a.mano[1] + 16);
  // la labriega corta un racimo con la podadera y lo echa en la cesta (en CORTA)
  const corta = t > CORTA - 0.6 && t < CORTA;
  R.actor(EL.labriega, 182, 160, t, { dir: -1, sostiene: corta ? [172, 140 + Math.round(Math.sin(t * 20))] : t > CORTA && t < CORTA + 0.4 ? [176, 150] : Math.sin(t * 3) > 0 ? [176, 148] : [174, 154], sonrisa: t > nace });
  if (t > CORTA - 0.05 && t < CORTA + 0.3) { const k = tramo(t, CORTA - 0.05, CORTA + 0.3); T.PIEZAS_TR.racimo(R, 176, Math.round(lerp(144, 156, k)), {}); }
  // la niña llega en «was born» con su capazo, recibe el racimo y se come una uva
  const n = tramo(t, nace - 0.4, nace + 0.4), nx = Math.round(lerp(84, 120, n));
  const comeN = t > DA + 0.6 && t < DA + 1.4;
  const ni = R.actor(EL.ninaCampo, nx, 162, t, { dir: 1, anda: n > 0 && n < 1, sonrisa: true, sostiene: comeN ? [nx + 12, 146] : [nx + 16, 152] });
  { const [mx, my] = ni.mano, cx = comeN ? nx + 16 : mx; const cy = comeN ? 152 : my;
    // el capazo de esparto (con el racimo dentro después de la entrega)
    R.rect(cx - 5, cy, cx + 5, cy + 6, K); R.rect(cx - 4, cy + 1, cx + 4, cy + 5, hex('#c8a060')); for (let i = -4; i <= 4; i += 2) R.pset(cx + i, cy + 3, hex('#8a6a34')); R.linea(cx - 4, cy, cx - 2, cy - 4, hex('#8a6a34')); R.linea(cx + 4, cy, cx + 2, cy - 4, hex('#8a6a34'));
    if (entregado) { R.disco(cx - 1, cy, 2, hex('#3e1450')); R.disco(cx + 2, cy - 1, 2, hex('#6a2a7a')); R.pset(cx + 1, cy - 2, hex('#b07ac8')); }
    if (comeN) { R.disco(mx, my + 1, 1, hex('#6a2a7a')); R.pset(mx, my, hex('#b07ac8')); } }
  T.anuevoDelante(R, t, o);
  if (arriba && t < ambas + 0.4) for (let k = 0; k < 6; k++) { const an = k * 1.05, r = 6 + (t - ambas + 0.2) * 24; R.pset(Math.round(a.mano[0] + Math.cos(an) * r), Math.round(a.mano[1] + 6 + Math.sin(an) * r), hex('#fff0a0')); }
};
// 4 · el almacén: las cajas que sobran
const caja = (x, y, n = 1) => {
  R.rect(x, y, x + 15, y + 9, K); R.rect(x + 1, y + 3, x + 14, y + 8, hex('#c8965a'));
  R.rect(x + 1, y + 5, x + 14, y + 5, hex('#8a5a2a')); R.rect(x + 1, y + 8, x + 14, y + 8, hex('#8a5a2a'));
  for (let i = 1; i <= 14; i += 2) { const c = (i + n) % 5 === 0 ? hex('#b07ac8') : (i + n) % 3 ? hex('#6a2a7a') : hex('#3e1450'); R.rect(x + i, y + 1, x + i + 1, y + 2, c); }
};
const carretilla = (lx, t, anda, bote) => {
  // la carretilla de madera con dos cajas; la de arriba bota en el bache
  const rueda = anda ? Math.floor(t * 10) % 2 : 0;
  R.rect(lx - 30, 146, lx - 8, 154, K); R.rect(lx - 29, 147, lx - 9, 153, hex('#8a5a2a')); R.rect(lx - 29, 147, lx - 9, 147, hex('#b07a44'));
  R.linea(lx - 8, 150, lx - 1, 147, K);
  caja(lx - 28, 138, 3); caja(lx - 26, 130 - bote, 5);
  R.disco(lx - 26, 157, 4, K); R.disco(lx - 26, 157, 3, hex('#5a3a1a')); R.pset(lx - 26 + (rueda ? 1 : -1), 156, hex('#b07a44')); R.pset(lx - 26, 157, K);
  R.linea(lx - 12, 154, lx - 12, 160, K);
};
const sobra = b(0.8120), sello = b(0.8551), lleva = b(0.9055), BOTE = lleva + 1.5;
const PILA = [[110, 152], [126, 152], [142, 152], [118, 142], [134, 142], [150, 152], [126, 132], [142, 142], [134, 122]];
const p4 = (t) => {
  const o = { encuadre: 'vinedo', camara: 'cajas' };
  T.anuevo(R, t, o);
  // la pila que crece: cada caja nueva cae desde arriba con su golpe
  const f = tramo(t, P4 + 0.2, sello) * 7, n = Math.min(9, 2 + Math.floor(f)), cae = f - Math.floor(f);
  PILA.slice(0, n).forEach(([x, y], i) => caja(x, y - (i === n - 1 && n < 9 && f < 7 ? Math.round(Math.max(0, 1 - cae * 5) * 5) : 0), i));
  // el labriego sube las cajas a la pila; luego carga la carretilla y se la lleva hacia la puerta
  const subiendo = t < sello + 0.1, wl = tramo(t, lleva - 0.3, E.duracion - 0.2), lx = Math.round(lerp(96, -44, wl));
  const brazo = subiendo ? (Math.sin(f * Math.PI * 2) > 0 ? [lx + 16, 128] : [lx + 14, 142]) : [lx - 8, 150];
  const bote = t > BOTE && t < BOTE + 0.35 ? Math.round(Math.sin((t - BOTE) / 0.35 * Math.PI) * 4) : 0;
  R.actor(EL.labriego, lx, 162, t, { dir: subiendo ? 1 : -1, anda: wl > 0 && wl < 1, sostiene: brazo, sonrisa: t > sello, sorpresa: t > BOTE && t < BOTE + 0.5 });
  carretilla(lx, t, wl > 0 && wl < 1, bote);
  // el viticultor estampa la caja; luego dice adiós con la mano
  const sel = t > sello - 0.25 && t < sello + 0.25;
  R.actor(EL.viticultor, 170, 162, t, { dir: -1, sostiene: sel ? [158, 148] : t > lleva + 0.4 ? undefined : [160, 140], dedo: t > sello + 0.6 && t < lleva + 0.4, brazos: t > lleva + 0.4 && Math.sin(t * 10) > -0.3, sonrisa: t > sello });
  if (t > sello) { const e = tramo(t, sello, sello + 0.25); R.numero('1909', 140, 112 - Math.round((1 - e) * 4), { tam: 16, centro: true }); }
  if (t > sello && t < sello + 0.4) R.icono('!', 160, 116, hex('#ffe08a'), K, 2);
  T.anuevoDelante(R, t, o);
};
const efectos = [
  [coge + 0.4, 'masca'], [lee, 'papel'], [TOMA, 'toc'], [brindis, 'brillo'],
  [LADRA, 'guau'], [burla, 'boing'], [ricos + 0.15, 'palmada'], [copian + 0.3, 'masca'],
  [ambas, 'brillo'], [CORTA + 0.25, 'golpecito'], [DA, 'golpecito'], [DA + 0.9, 'masca'],
  [sobra, 'golpecito'], [sello, 'sello'], [lleva, 'carro'], [BOTE, 'boing'],
];
T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3], [P4, p4]], { efectos, año: (t) => t < P3 ? 1894 : 1909 });
</script>
</body>
