<script type="module">
// TR-BURLA (frase 4), sin cartela. Cuatro planos:
// 1. el salón burgués de Madrid de 1894: la señora se come una uva del racimo («Back to the grapes»), el caballero abre
//    el periódico en «newspaper»; el criado entra por la derecha con la bandeja de dos copas, la señora coge la suya y
//    en «France» brindan a la francesa (el criado se inclina);
// 2. en «and some believe»: la calle de abajo de noche: el perrito ladra al chulapo; en «mocking» el chulapo levanta
//    el racimo como una copa y hace la reverencia; en «rich people» la chulapa aplaude riéndose; en «copied it» se
//    llena la boca de uvas; el pilluelo señala el balcón, se ríe y se va corriendo con el perro detrás. A la derecha de
//    la esquina, la calle de 1894 que se aleja (pintada aquí encima del fondo): casas de vecinos con balcones de forja,
//    persianas y chimeneas que humean, la taberna encendida, la farola de gas, el adoquín mojado con charcos, el cielo
//    con luna, nubes de tres tonos y murciélagos; la pareja que sale de la taberna, el sereno con su farol y el simón
//    que trota hacia aquí. Delante: la fuente de vecindad con su chorro (izquierda) y la castañera con su anafre que
//    humea tras el mostrador (derecha);
// 3. en «Most likely»: el viñedo de Alicante en la vendimia de 1909: el viticultor da dos pasos y levanta el racimo en
//    «both things happened»; la labriega corta un racimo y lo echa en la cesta; en «was born» llega la niña con su
//    capazo, el viticultor le da el racimo y ella se come una uva;
// 4. en «and the grape surplus»: el almacén: el labriego sube las cajas a la pila (caen con su golpe) hasta el techo;
//    el viticultor estampa «1909» en «nineteen oh-nine»; el labriego carga una caja más en la carretilla y en «spread
//    it» se la lleva hacia la puerta; la caja de arriba bota en un bache y el viticultor le dice adiós con la mano.
import * as T from '/atomo/plato/escenas/tr-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('tr-burla');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const b = (f) => en('burla', f), K = T.C.k;
const P2 = b(0.2675), P3 = b(0.4961), P4 = b(0.7704);
// 1 · el salón burgués
const lee = b(0.0961), coge = b(0.0229), brindis = b(0.2249), TOMA = brindis - 1.5;
const bandeja = (x, y, n) => {
  // la bandeja de plata con n copas de champán
  R.rect(x - 7, y, x + 7, y + 1, K); R.rect(x - 6, y, x + 6, y, hex('#e8e8f0')); R.pset(x - 4, y, hex('#ffffff'));
  for (let k = 0; k < n; k++) T.PIEZAS_TR.copa(R, x - 3 + k * 6, y - 1);
};
const p1 = (t) => {
  const o = { encuadre: 'casa1890' };
  T.anuevo(R, t, o);
  // delante del balcón: él lee el periódico (en «newspaper») y ella se come las uvas; en «France», brindan
  const brinda = t > brindis - 0.4 && t < brindis + 0.9, choca = t > brindis - 0.1 && t < brindis + 0.3;
  const conCopa = brinda || t > brindis - 0.9;
  const a = R.actor(EL.burgues, 222, 162, t, { dir: 1, sostiene: brinda ? [244 - (choca ? 0 : 3), 136] : conCopa ? [238, 146] : t > lee - 0.3 ? [240, 146] : [238, 150], sonrisa: brinda || t > TOMA, habla: t > lee + 0.8 && t < TOMA && Math.sin(t * 7) > 0 });
  if (conCopa) T.PIEZAS_TR.copa(R, a.mano[0], a.mano[1] + 6);
  else if (t > lee - 0.3) T.PIEZAS_TR.periodico(R, a.mano[0] + 4, a.mano[1] + 10 - Math.round(tramo(t, lee - 0.3, lee) * 3), { anio: 1894 });
  // la señora: come uvas, se vuelve al criado y coge su copa; luego brinda
  const come = t > coge + 0.3 && t < lee + 1.2 && Math.sin((t - coge) * 5) > 0.3;
  const vuelta = t > TOMA - 0.5 && t < TOMA + 0.4, tiene = t > TOMA;
  const c = R.actor(EL.senoraMantilla, 262, 162, t, { dir: vuelta ? 1 : -1, sostiene: brinda ? [250 + (choca ? 0 : 3), 136] : vuelta ? [282, 140] : come ? [254, 145] : [251, 151], sonrisa: t > lee + 1.2 || brinda, habla: t > lee + 1.4 && t < TOMA - 0.6 && Math.sin(t * 6) > 0 });
  if (tiene) T.PIEZAS_TR.copa(R, c.mano[0], c.mano[1] + 6);
  else if (!vuelta) T.PIEZAS_TR.racimo(R, c.mano[0], c.mano[1] + 15, { color: 'verde', hueco: t > coge + 1 });
  // el criado entra por la derecha con la bandeja, se la ofrece y se inclina en el brindis
  const w = tramo(t, 1.2, TOMA - 0.6), sx = Math.round(lerp(336, 288, w)), incl = t > brindis - 0.1 && t < brindis + 0.5;
  const s = R.actor(EL.chulapo, sx, 162 + (incl ? 1 : 0), t, { dir: -1, anda: w > 0 && w < 1, sostiene: [sx - 4, 140 + (incl ? 2 : 0)], sonrisa: w >= 1, pal: { C: '#2a2a32', c: '#1a1a22' } });
  bandeja(s.mano[0], s.mano[1], tiene ? 1 : 2);
  T.anuevoDelante(R, t, o);
  if (t > brindis && t < brindis + 0.5) for (let k = 0; k < 6; k++) { const an = k * 1.05, r = 4 + (t - brindis) * 20; R.pset(Math.round(247 + Math.cos(an) * r), Math.round(126 + Math.sin(an) * r), hex('#fff0a0')); }
};
// 2 · la calle de abajo: la burla
// el perrito callejero: sentado, ladrando o corriendo (dir 1 a la derecha)
const perro = (x, y, t, modo, dir = 1) => {
  const corre = modo === 'corre', ladra = modo === 'ladra', p = corre ? Math.floor(t * 12) % 2 : 0;
  const Cp = hex('#b8844a'), cs = hex('#8a5a2a'), cl = hex('#e0b070');
  const X = (dx) => x + dx * dir;
  // cuerpo y patas
  for (let dx = -5; dx <= 4; dx++) for (let dy = -6; dy <= -3; dy++) R.pset(X(dx), y + dy, dy === -6 || Math.abs(dx) === 5 ? K : dy === -5 ? cl : dy === -3 ? cs : Cp);
  for (const [lx, ph] of [[-4, p], [-2, 1 - p], [2, p], [4, 1 - p]]) { R.pset(X(lx + (corre ? (ph ? 1 : -1) : 0)), y - 2, K); R.pset(X(lx + (corre ? (ph ? 1 : -1) : 0)), y - 1, K); }
  // cabeza (levantada si ladra) con la oreja caída y el hocico
  const hy = y - 9 - (ladra && Math.sin(t * 14) > 0 ? 1 : 0);
  for (let dx = 3; dx <= 8; dx++) for (let dy = 0; dy <= 4; dy++) R.pset(X(dx), hy + dy, dy === 0 || dx === 8 || dy === 4 ? K : dy === 1 ? cl : Cp);
  R.pset(X(6), hy + 2, K); R.pset(X(9), hy + 3, K); R.pset(X(4), hy + 1, cs); R.pset(X(4), hy + 2, cs);
  if (ladra && Math.sin(t * 14) > 0) R.pset(X(9), hy + 4, hex('#c8303a'));
  // la cola que se mueve
  const cola = Math.sin(t * (corre ? 18 : 12)) > 0 ? -1 : 0;
  R.pset(X(-6), y - 6 + cola, K); R.pset(X(-7), y - 7 + cola, K); R.pset(X(-7), y - 8 + cola, cs);
};
// la calle de 1894 que se aleja a la derecha de la esquina (pintada encima del fondo del decorado, solo en x 239–319):
// el cielo tramado con luna, nubes de tres tonos a tres velocidades y murciélagos; cuatro casas de vecinos con balcones
// de forja, persianas, cornisas, tejas y chimeneas que humean; la taberna encendida; la farola de gas; la acera de
// granito y el adoquín mojado con charcos; el sereno, una pareja que sale de la taberna y el simón con su caballo
const hh = (a, b, c = 0) => { const s = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return s - Math.floor(s); };
const mez = (a, b2, u) => { const f = (s) => Math.round(((a >>> s) & 255) + (((b2 >>> s) & 255) - ((a >>> s) & 255)) * u); return (0xff000000 | (f(16) << 16) | (f(8) << 8) | f(0)) >>> 0; };
const pr = (x0, y0, x1, y1, c) => { for (let y = Math.round(y0); y <= Math.round(y1); y++) for (let x = Math.round(x0); x <= Math.round(x1); x++) R.pset(x, y, c); };
const brillo = (cx, cy, r, c, u) => { for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++) {
  const g = 1 - Math.hypot(x - cx, y - cy) / r; if (g <= 0 || x < 0 || x > 319 || y < 0 || y > 179) continue; const v = g * g * u; if (v > 0.04 + R.b4(x, y) * 0.08) R.pset(x, y, mez(R.pget(x, y), c, Math.min(0.85, v))); } };
const discoF = (cx, cy, r, c) => { for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++) for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++) { const dx = x + 0.5 - cx, dy = y + 0.5 - cy; if (dx * dx + dy * dy > r * r) continue; const col = c(x, y); if (col != null) R.pset(x, y, col); } };
const X0 = 239, calma = (x, y) => x >= 270 && y <= 50;
const sE = (x) => 0.55 + (x - X0) * 0.005625;                      // escala de la perspectiva: lejos 0,55, cerca 1
const pE = (x) => Math.log(sE(x) / 0.55) / 0.005625;               // coordenada a lo largo de las fachadas (0–106)
const baseE = (x) => 128 + (x - X0) * 0.175;                       // el pie de las fachadas
const aceraE = (x) => baseE(x) + 3 + 2 * sE(x);                    // el bordillo de la acera de enfrente
// las cuatro casas: [p0, p1, rampa del estuco, cuánto sube el tejado]
const CASAS = [[0, 26, ['#2e2428', '#3e3034', '#503e3e', '#62504a', '#76624e'], 1], [26, 52, ['#36262c', '#4a3436', '#5e4440', '#72544a', '#866452'], 4],
  [52, 80, ['#282a36', '#363846', '#464858', '#585a68', '#6a6c78'], 3], [80, 107, ['#3a3228', '#4e4434', '#645842', '#7a6c52', '#908262'], 0]].map(([a, b2, r, s]) => [a, b2, r.map(hex), s]);
const casaDe = (p) => Math.min(3, CASAS.findIndex(([a, b2]) => p < b2) < 0 ? 3 : CASAS.findIndex(([a, b2]) => p < b2));
const techoE = (x) => { const s = sE(x), b2 = casaDe(pE(x)); return 96 - (x - X0) * 0.55 - CASAS[b2][3] * 3 * s; };
const NOCHE = ['#080b24', '#0c1030', '#11163a', '#161c46', '#1d2252', '#26285c', '#302e64', '#3e3468', '#4e3a68', '#623e62'].map(hex);
// las chimeneas: [x, pie, ancho, alto] (la de la casa de cerca, baja, para no subir a la esquina de Atom)
const CHIM = [8, 40, 64, 84].map((p) => { const s = 0.55 * Math.exp(p * 0.005625), x = Math.round(X0 + (s - 0.55) / 0.005625); return [x, Math.round(techoE(x) - 3 * s), Math.max(2, Math.round(3 * s)), Math.round(7 * s)]; });
const FAROL = [266, Math.round(baseE(266) + 2)], TABERNA = 284;
let cieloDer = null, casasDer = null;
const capa = (dibuja) => { const bf = R.nuevo(); bf.fill(0); const prev = R.usar(bf); dibuja(); R.usar(prev); return bf; };
const pegarDer = (bf, y1) => { const B = R.buf; for (let y = 0; y <= y1; y++) for (let x = X0; x < 320; x++) { const c = bf[y * 320 + x]; if (c) B[y * 320 + x] = c; } };
const pintaCasas = () => {
  const AKc = hex('#1a1220'), TE = ['#2a1614', '#3e1e18', '#56281e', '#6e3426'].map(hex), PIE = ['#2e2c36', '#3e3c46', '#504e58', '#64626c', '#7a7882'].map(hex);
  const AD = ['#121018', '#1c1a24', '#26242e', '#32303c', '#42404e'].map(hex);
  for (let x = X0; x < 320; x++) {
    const s = sE(x), p = pE(x), b2 = casaDe(p), [p0, p1, FA] = CASAS[b2], q = p - p0, L = p1 - p0, top = techoE(x), base = baseE(x), H = base - top;
    // el tejado de tejas árabes con su caballete
    for (let y = Math.round(top - 3 * s); y < Math.round(top); y++) R.pset(x, y, y === Math.round(top - 3 * s) ? TE[3] : R.tone(TE, 1.6 + ((Math.floor(p * 0.9) + y) % 3 === 0 ? -1 : 0.4), x, y));
    for (let y = Math.round(top); y <= Math.round(base); y++) {
      const v = (y - top) / H, luz = Math.max(0, 1 - Math.hypot(x - FAROL[0], y - FAROL[1] + 26) / 34) * 1.6 + Math.max(0, 1 - Math.hypot(x - TABERNA, y - base) / 22) * 1.2;
      let c = R.tone(FA, 1.3 + (hh(x >> 1, y >> 1, b2) - 0.5) * 0.9 + luz + (hh(x, y, 9) < 0.03 ? -1 : 0), x, y);
      if (q < 0.9 || q > L - 0.9) c = q < 0.9 ? FA[0] : FA[2];                                   // la medianera
      else if (v < 0.05) c = v < 0.018 ? FA[4] : (Math.floor(q * 1.2) % 3 === 0 ? FA[3] : FA[0]);  // la cornisa con canecillos
      else if ((v > 0.355 && v < 0.38) || (v > 0.655 && v < 0.68)) c = FA[3];                     // las impostas
      else if ((v >= 0.38 && v < 0.395) || (v >= 0.68 && v < 0.695)) c = FA[0];
      else {
        const lv = v >= 0.1 && v < 0.33 ? 0 : v >= 0.42 && v < 0.63 ? 1 : -1, wb = lv === 0 ? 0.30 : 0.60, vt = lv === 0 ? 0.1 : 0.42;
        const k = Math.floor((q - 2) / 8), r = (q - 2) - k * 8;
        if (lv >= 0 && q > 2 && q < L - 2 && r >= 1 && r < 6.5) {
          const enc = hh(b2, k, lv) < 0.45, per = !enc && hh(b2, k, lv + 5) < 0.55, vv = (v - vt) / (wb - vt);
          if (v >= wb) c = v < wb + 0.02 ? FA[4] : v < wb + 0.035 ? FA[0] : c;                   // la losa del balcón y su sombra
          else if (vv > 0.68) c = (vv < 0.73 || x % 2 === 0) ? AKc : enc ? hex('#c87a3a') : hex('#1c1a2c');  // la barandilla de forja
          else if (r < 1.9 || r > 5.6 || vv < 0.08) c = AKc;                                      // el marco
          else if (enc) c = Math.abs(r - 3.75) < 0.4 ? hex('#7a3a22') : r < 2.5 || r > 5.0 ? hex('#8a2a2a') : R.tone(['#c87a3a', '#e8a850', '#f8d080', '#fff0c0'].map(hex), 3 - vv * 2.4, x, y);
          else if (per) c = y % 2 ? hex('#24382e') : hex('#36543e');   // la persiana verde
          else c = (x + y) % 7 === 0 ? hex('#3a3a5a') : hex('#16142a');
        } else if (v > 0.72) {
          // la planta baja: sillería, portales de madera y la taberna encendida
          if (Math.floor((v - 0.72) * H) % 4 === 0) c = FA[1];
          const kd = Math.floor((q - 3) / 12), rd = (q - 3) - kd * 12, puerta = q > 3 && q < L - 3 && rd >= 2 && rd < 8;
          if (puerta && v > 0.76) {
            const tab = b2 === 2, vd = (v - 0.76) / 0.24, arco = vd < 0.12 && (rd < 2.6 || rd > 7.4);
            if (arco) c = FA[3]; else if (rd < 2.6 || rd > 7.4 || vd < 0.04) c = AKc;
            else if (tab) c = Math.abs(rd - 5) < 0.4 ? hex('#5a2a1a') : vd < 0.3 ? hex('#fff0b0') : R.tone(['#a85a2a', '#d8903a', '#f0b850'].map(hex), 2.2 - vd, x, y);
            else c = Math.floor(rd * 1.3) % 2 ? hex('#3e2214') : hex('#2a160c');
          } else if (b2 === 2 && puerta && v > 0.73 && v <= 0.76) c = rd > 2.2 && rd < 7.8 ? ((Math.floor(rd * 2) % 3) ? hex('#c8a048') : hex('#3a2a1a')) : c;  // el rótulo
        }
      }
      R.pset(x, y, c);
    }
    // la acera de granito con sus juntas, el bordillo y el adoquín mojado en perspectiva
    const ac = aceraE(x);
    for (let y = Math.round(base) + 1; y <= Math.round(ac); y++) R.pset(x, y, Math.floor(p) % 7 === 0 ? PIE[0] : R.tone(PIE, 2 + (hh(Math.floor(p / 7), 3) - 0.5) + (y === Math.round(base) + 1 ? -1 : 0), x, y));
    R.pset(x, Math.round(ac) + 1, PIE[4]); R.pset(x, Math.round(ac) + 2, PIE[0]);
    const rh = Math.max(2, Math.round(2 + 1.6 * s));
    for (let y = Math.round(ac) + 3; y <= 153; y++) {
      const dy = y - Math.round(ac) - 3, fila = Math.floor(dy / rh), xx = x + (fila % 2) * 3, junta = dy % rh === 0 || xx % 6 === 0;
      const luz = Math.max(0, 1 - Math.hypot(x - FAROL[0], (y - FAROL[1]) * 2) / 26) * 1.6 + Math.max(0, 1 - Math.hypot(x - TABERNA, (y - base) * 1.6) / 24) * 1.4;
      let c = junta ? AD[0] : R.tone(AD, 1.6 + (hh(xx >> 2, fila, 7) - 0.5) * 1.2 + (dy % rh === 1 ? 0.7 : 0) + luz, x, y);
      // los charcos que reflejan el cielo
      for (const [cx, cy, w, hc] of [[300, 149, 13, 2.2], [255, 141, 7, 1.6]]) if (Math.abs(x - cx) / w + Math.abs(y - cy) / hc < 1) c = (x + y) % 3 ? hex('#1e2244') : hex('#323a62');

  }

  // la farola de gas de la acera de enfrente
  { const [x, y] = FAROL, al = 24; R.rect(x - 2, y - 4, x + 2, y, hex('#141820')); R.rect(x - 1, y - 3, x + 1, y - 1, hex('#2a3240')); R.rect(x, y - al, x, y - 4, hex('#141820')); R.pset(x, y - al * 0.5, hex('#4a5668'));
    R.rect(x - 2, y - al - 6, x + 2, y - al, hex('#141820')); R.rect(x - 1, y - al - 5, x + 1, y - al - 1, hex('#f8d880')); R.pset(x - 1, y - al - 5, hex('#fff8d0')); R.rect(x - 3, y - al - 7, x + 3, y - al - 7, hex('#141820')); R.pset(x, y - al - 8, hex('#141820')); }
};
// gente pequeña de fondo: c = [ropa, sombra, piel]; o.gorro ('chistera' | 'gorra' | 'mantilla'), o.falda, o.farol, o.chuzo
const persona = (x, y, al, c, t, o = {}) => {
  const pie = Math.max(2, Math.round(al * 0.32)), cu = Math.max(3, Math.round(al * 0.4)), w = al > 10 ? 1 : 0, paso = o.anda ? Math.floor(t * 6 + (o.k ?? 0)) % 2 : 0;
  const yb = y - pie, yt = yb - cu, hy = yt - 2;
  if (o.falda) { for (let j = 0; j <= pie + 1; j++) pr(x - w - 1 - (j > pie - 1 ? 1 : 0), yb - 1 + j, x + w + 1, yb - 1 + j, j % 2 && j > 1 ? c[1] : c[0]); }
  else { pr(x - w, yb + 1, x - w, y - paso, K); pr(x + w, yb + 1, x + w, y - 1 + paso, K); }
  pr(x - w - 1, yt, x + w, yb, c[0]); pr(x + w, yt + 1, x + w, yb, c[1]);
  pr(x - 1, hy, x, hy + 1, c[2]); R.pset(x - 1 + (o.dir > 0 ? 1 : 0), hy + 1, c[2]);
  if (o.gorro === 'chistera') { pr(x - 1, hy - 3, x, hy - 1, K); pr(x - 2, hy - 1, x + 1, hy - 1, K); }
  else if (o.gorro === 'gorra') { pr(x - 1, hy - 1, x + 1, hy - 1, hex('#1a1a26')); R.pset(x + (o.dir > 0 ? 2 : -2), hy - 1, hex('#1a1a26')); }
  else if (o.gorro === 'mantilla') { pr(x - 1, hy - 1, x, hy - 1, K); R.pset(x - 2, hy, K); R.pset(x - 2, hy + 1, K); }
  if (o.chuzo) { R.linea(x - w - 2, hy - 4, x - w - 2, y, hex('#2a2a32')); R.pset(x - w - 2, hy - 5, hex('#a8b0c0')); }
  if (o.farol) { const fx = x + w + 2, fy = yb - 1 + (paso ? 1 : 0); R.pset(fx, yt + 2, c[1]); pr(fx, fy, fx + 1, fy + 1, hex('#f8d070')); brillo(fx, fy, 7, hex('#f0b050'), 0.45); }
};
// el simón: coche de punto con su caballo que trota hacia aquí (x es el morro del caballo, y el suelo, s la escala)
const simon = (x, y, s, t) => {
  const S = (v) => Math.round(v * s), tr = Math.floor(t * 8) % 2;
  const CB = hex('#7a4a2a'), cbL = hex('#a86c3a'), CO = hex('#1e1a24'), coL = hex('#3a3040');
  // la sombra en el adoquín

  if (t > sello && t < sello + 0.4) R.icono('!', 160, 116, hex('#ffe08a'), K, 2);

};
