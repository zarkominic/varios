<script type="module">
// PR-BRANDAN (frase 14, «brandan»). Cinco planos:
// 1. (0–«and a giant fish») LOCAL otro trozo del pergamino, apaisado: arriba el mar con la rosa a la izquierda y dos naos;
//    abajo la costa de lado con tres palmeras grandes; en «parrots» los loros pintados echan a volar en corros; en «ships»
//    las naos sueltan las velas, se hinchan con su cruz y echan a navegar; un delfín de tinta salta junto a la costa;
// 2. («giant fish»–«Piri Reis») el pergamino, vista del pez: los monjes, agachados, soplan y golpean el pedernal sobre la
//    yesca; en «fish» la cola da un coletazo que levanta olas de tinta y gotas; en «lighting a fire» la hoguera prende
//    (9 px, chispas y una columna de humo de tinta que se deshace) y los monjes se levantan a calentarse las manos;
//    olitas y gaviotas de tinta se mueven por el pergamino;
// 3. («Piri Reis wrote»–«who landed») la mesa de Piri desde arriba: su mano escribe con tinta roja la nota junto al
//    pececito dibujado (el brazo del caftán entra en diagonal desde abajo a la derecha, doblado por el codo);
// 4. («who landed»–«geography») LOCAL el mar de la leyenda (gag 4): los dos monjes calientan las manos en su hoguera
//    sobre la «isla»; en «island» la isla abre un ojo, los monjes saltan a su barca y el pez se sumerge con la hoguera,
//    que se apaga en una nube de vapor; la cola sale, da un coletazo y los empapa; el cielo con su banco de cúmulos, nubes
//    de tres tonos a tres velocidades y gaviotas; delante, el tronco cabecea y su gaviota sale volando del susto;
// 5. («geography»–fin) LOCAL a dos alturas: arriba la barca, un monje achica agua con el balde; abajo el pez se aleja
//    nadando y, en «legend», se vuelve un dibujo de tinta sobre pergamino (vuelve al mapa).
import * as T from '/atomo/plato/escenas/pr-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('pr-brandan');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const K = hex('#1c1222');
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const umb = (x, y) => (BAY[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const suave = (u) => { u = cl(u); return u * u * (3 - 2 * u); };
// degradado tramado (orden de Bayer) entre varios colores, de y0 a y1
const degradado = (y0, y1, cols, x0 = 0, x1 = 319) => { const n = cols.length - 1; for (let y = y0; y <= y1; y++) { const v = (y - y0) / Math.max(1, y1 - y0) * n, k = Math.min(n - 1, Math.floor(v)), f = v - k; for (let x = x0; x <= x1; x++) R.pset(x, y, f > umb(x, y) ? cols[k + 1] : cols[k]); } };
// lo fijo de un plano, pintado una vez en su búfer (sin R.usar() a secas: rompe los fundidos)
const fijo = (pinta) => { let b = null; return () => { if (!b) { b = R.nuevo(); const prev = R.usar(b); pinta(); R.usar(prev); } R.copiar(b); }; };
// el oleaje: crestas claras, senos oscuros y espuma, más grandes y rápidas cuanto más cerca
const olas = (y0, y1, t, claro, oscuro, esp, x0 = 0, x1 = 319) => {
  for (let y = y0; y <= y1; y++) { const d = (y - y0) / Math.max(1, y1 - y0), fx = 0.75 - d * 0.6, ph = hh(y, 3) * 40, sp = 0.7 + d * 1.5;
    for (let x = x0; x <= x1; x++) { const s = Math.sin(x * fx + ph + t * sp) + 0.6 * Math.sin(x * fx * 0.37 + ph * 2 - t * sp * 0.6);
      if (s > 1.38) R.pset(x, y, d > 0.45 && s > 1.53 ? esp : claro); else if (s < -1.32) R.pset(x, y, oscuro); } } };
// cielo tramado de día con sol y su halo
const CIELO = ['#3a78d4', '#5494e2', '#7cb2ee', '#a8ccf2', '#d4e6f4'].map(hex);
const cieloDia = (hor, sol) => { degradado(0, hor - 1, CIELO); if (sol) { const [sx, sy] = sol; for (let j = -16; j <= 16; j++) for (let i = -16; i <= 16; i++) { const d = Math.hypot(i, j); if (d < 16 && d > 7 && (1 - (d - 7) / 9) * 0.6 > umb(sx + i, sy + j)) R.pset(sx + i, sy + j, hex('#fff6d0')); }
  R.disco(sx, sy, 7, hex('#ffe9a0')); R.disco(sx, sy, 6, hex('#fff8dc')); R.disco(sx - 2, sy - 2, 2, hex('#ffffff')); } };
// nubes de tres tonos a tres velocidades (lejos pequeñas y lentas, cerca grandes y rápidas)
const nubes = (t, lista) => { for (const [x0, y, w, v] of lista) R.nube(Math.round(((x0 + t * v) % 420 + 420) % 420) - 50, y, w); };

// LA NAO portuguesa (dibujo propio de la escena): x, y = centro de la línea de flotación; s = escala (1 ≈ 72 px de eslora);
// o.dir 1 con la proa a la derecha; o.vela 0–1 (0 = aferradas en las vergas); o.entre() pinta a quien va en cubierta
// entre el aparejo y el casco (el casco le tapa las piernas). Devuelve los puntos de la toldilla, la cofa y la proa.
const MAD = ['#2e1a0e', '#4e2e18', '#6e4426', '#906038', '#b07c4a'].map(hex), VEL = ['#a89874', '#d6c8a4', '#efe4c6', '#fbf6e6'].map(hex);
const CRUZ = hex('#b8262a'), CRUZS = hex('#7a161c'), JARCIA = hex('#4a3a2c');
function nao(x, y, s, t, o = {}) {
  const d = o.dir ?? 1, vela = cl(o.vela ?? 1), ph = o.fase ?? 0, Y0 = y + Math.sin(t * 1.4 + ph) * Math.min(1.6, s * 1.1);
  const X = (i) => Math.round(x + d * i * s), Y = (j) => Math.round(Y0 + j * s), lw = Math.max(1, Math.round(s * 0.7));
  const palo = (i, j0, j1) => { for (let w = 0; w < lw; w++) R.linea(X(i) + w, Y(j0), X(i) + w, Y(j1), w === 0 ? MAD[3] : MAD[1]); };
  // la jarcia: estays a proa y popa, y los obenques
  const tope = { m: [2, -60], f: [24, -48], z: [-24, -46] };
  R.linea(X(2), Y(-60), X(37), Y(-19), JARCIA); R.linea(X(24), Y(-48), X(52), Y(-27), JARCIA); R.linea(X(2), Y(-60), X(-36), Y(-22), JARCIA); R.linea(X(-24), Y(-46), X(-36), Y(-22), JARCIA);
  if (s >= 0.9) for (const [pi, pj, base] of [[2, -44, [-6, 10]], [24, -38, [18, 30]], [-24, -36, [-31, -17]]]) for (let k = 0; k <= 3; k++) { const bi = lerp(base[0], base[1], k / 3); R.linea(X(pi), Y(pj), X(bi), Y(pi === -24 ? -21 : pi === 24 ? -18 : -13), hex('#6a5a48')); }
  palo(2, -13, -62); palo(24, -18, -50); palo(-24, -21, -48);
  R.linea(X(33), Y(-18), X(52), Y(-27), MAD[2]);   // el bauprés
  // las velas cuadras (hinchadas, con su cruz) y la latina de mesana
  const cuadra = (L, Rr, T, B, cruz) => {
    const Bv = T + (B - T) * vela, xa = Math.min(X(L), X(Rr)), xb = Math.max(X(L), X(Rr));
    R.rect(xa - 1, Y(T) - 1, xb + 1, Y(T), MAD[0]);   // la verga
    if (vela < 0.08) { for (let x = xa; x <= xb; x++) R.pset(x, Y(T) + 1, (x + Math.floor(s * 3)) % 3 ? VEL[1] : VEL[0]); return; }
    for (let x = xa; x <= xb; x++) { const u = (x - xa) / Math.max(1, xb - xa), yb = Math.round(Y(Bv) + Math.sin(u * Math.PI) * 2 * s * vela);
      for (let yy = Y(T) + 1; yy <= yb; yy++) { const v = (yy - Y(T)) / Math.max(1, yb - Y(T)); let c = u < 0.12 || u > 0.9 ? VEL[0] : (d > 0 ? u : 1 - u) > 0.55 && (d > 0 ? u : 1 - u) < 0.78 ? VEL[3] : VEL[1];
        if (v > 0.86) c = VEL[0]; if (s >= 0.9 && (x - xa) % Math.max(3, Math.round(4 * s)) === 0 && c !== VEL[3]) c = mez(c, VEL[0], 0.5); R.pset(x, yy, c); }
      if (s >= 0.7) R.pset(x, yb + 1, K); }
    if (s >= 0.7) { R.linea(xa - 1, Y(T), xa - 1, Y(Bv), K); R.linea(xb + 1, Y(T), xb + 1, Y(Bv), K); }
    if (cruz && vela > 0.55) { const cx = Math.round((xa + xb) / 2), cy = Math.round((Y(T) + Y(Bv)) / 2), aw = Math.max(1, Math.round((xb - xa) * 0.3)), ah = Math.max(1, Math.round((Y(Bv) - Y(T)) * 0.34)), g = Math.max(1, Math.round(s * 1.4));
      R.rect(cx - g + 1, cy - ah, cx + g - 1, cy + ah, CRUZ); R.rect(cx - aw, cy - g + 1, cx + aw, cy + g - 1, CRUZ); if (s >= 1) { R.rect(cx + g - 1, cy - ah, cx + g - 1, cy + ah, CRUZS); R.rect(cx - aw, cy + g - 1, cx + aw, cy + g - 1, CRUZS); } }
  };
  // la latina de mesana
  if (vela > 0.08) R.poligono([[X(-36), Y(-27)], [X(-12), Y(-52)], [X(-24), Y(-27 + (-52 + 27) * (1 - vela) * 0.2)]], VEL[1]);
  R.linea(X(-38), Y(-25), X(-10), Y(-54), MAD[0]);
  cuadra(-13, 17, -48, -27, true); cuadra(-9, 13, -60, -51, true); cuadra(16, 32, -44, -26, true);
  // la cofa con su vigía (o.vigia) y el gallardete del tope
  R.rect(Math.min(X(-1), X(5)), Y(-52), Math.max(X(-1), X(5)), Y(-49), MAD[1]); R.rect(Math.min(X(-1), X(5)), Y(-52), Math.max(X(-1), X(5)), Y(-52), MAD[3]);
  for (let k = 0; k < 9; k++) { const fx = X(2) + d * k * Math.max(1, s), fy = Y(-62) + Math.round(Math.sin(t * 7 + k * 0.7 + ph) * Math.min(2, k * 0.3)) + Math.floor(k / 4); R.rect(fx, fy, fx, fy + (k < 6 ? 1 : 0), k % 3 === 2 ? hex('#f4f0e8') : CRUZ); }
  if (o.entre) o.entre({ X, Y });
  // el casco, columna a columna: tracas, la cinta pintada, portas, la regala y la obra viva mojada
  const top = (i) => i < -16 ? -21 : i <= 17 ? -13 - ((i / 17) ** 2) : i <= 31 ? -18 : -18 - (i - 31) * 0.2;
  const bot = (i) => i < -22 ? lerp(0, -12, (-22 - i) / 13) : i > 26 ? lerp(0, -19, (i - 26) / 11) : 0;
  const xa = Math.min(X(-35), X(37)), xb = Math.max(X(-35), X(37));
  for (let px = xa; px <= xb; px++) { const i = (px - x) / (d * s); if (i < -35 || i > 37) continue; const yt = Y(top(i)), yb = Y(bot(i)) - Math.round(1.5 * s);
    for (let yy = yt; yy <= yb; yy++) { const j = (yy - Y0) / s; let c;
      if (yy <= yt + Math.max(0, Math.round(s * 0.6))) c = MAD[4]; else if (j > -7.5 && j < -5.8) c = hex('#a84a24'); else if (j > -2.6) c = MAD[0];
      else { const pl = Math.floor((j + 30) / 3.6); c = (j + 30) % 3.6 < 0.7 && s >= 0.9 ? MAD[0] : pl % 2 ? MAD[2] : MAD[1]; if (hh(px, Math.floor(yy / 2), 7) > 0.93) c = MAD[0]; }
      if (yy === yb || px === xa || px === xb) c = K; R.pset(px, yy, c); }
  }
  // las barandillas de los castillos y las portas
  for (const [a, b, j] of [[-35, -16, -21], [18, 31, -18]]) { R.linea(X(a), Y(j - 2.5), X(b), Y(j - 2.5), MAD[3]); for (let i = a; i <= b; i += 3) R.linea(X(i), Y(j - 2.5), X(i), Y(j), MAD[1]); }
  if (s >= 0.9) for (const i of [-11, -3, 5, 13]) { R.rect(X(i), Y(-10.5), X(i) + Math.round(s * 2), Y(-10.5) + Math.round(s * 1.6), K); }
  // espuma en la proa y la estela
  for (let k = 0; k < 10 * s; k++) { const u = hh(k, Math.floor(t * 5), 11); R.pset(X(36 + u * 6 - 4), Y(-2 + hh(k, 2, 12) * 2), hex('#f4fbfc')); R.pset(X(-36 - u * 18), Y(-1 + hh(k, Math.floor(t * 4), 13) * 2), u > 0.5 ? hex('#e4f2f4') : hex('#a8d0dc')); }
  return { toldilla: [X(-26), Y(-21)], cofa: [X(2), Y(-52)], proa: [X(37), Y(-19)], cubierta: Y(-13), X, Y };
}

const b = (f) => en('brandan', f);
const P2 = b(0.204), P3 = b(0.41), P4 = b(0.628), P5 = b(0.876);
const parrots = b(0.108), ships = b(0.141), fish = b(0.243), fuego = b(0.305), island = b(0.741), leyenda = b(0.965);
const PER = ['#6e4e2c', '#9a7646', '#bc9a62', '#d2b47e', '#e2c896', '#eed9ae'].map(hex);
const TINTA = hex('#2a2018'), ROJA = hex('#a83224'), VERDE = ['#4e622b', '#869a4c', '#a2b464'].map(hex), OCRE = ['#b07c36', '#dab468'].map(hex);

// 1 · LOCAL otro trozo del pergamino, apaisado: arriba el mar abierto con la rosa a la izquierda y dos naos; abajo la
//     costa de lado, con tres palmeras grandes y sus loros, una ciudad, montes, un río y un ciervo
const yc1 = (x) => 126 + 7 * Math.sin(x * 0.033 + 0.6) + 3 * Math.sin(x * 0.12 + 2);
const PALMAS = [[44, 172, 40], [150, 168, 34], [240, 174, 44]];
const RO1 = [46, 68], RR1 = 24;
const mar1 = (x, y) => y < yc1(x) - 2;
const fondo1 = fijo(() => {
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) {
    const n = 0.5 + 0.22 * Math.sin(x * 0.04 + y * 0.025) + 0.14 * Math.sin(x * 0.11 - y * 0.07) + (hh(x >> 2, y >> 2, 1) - 0.5) * 0.3, borde = Math.min(x, 319 - x, y * 1.4, (179 - y) * 1.4) / 40;
    const lev = cl(2.4 + n * 2.6 - (borde < 1 ? (1 - borde) * 1.6 : 0), 0, 5), k = Math.floor(lev); let c = PER[Math.min(5, lev - k > umb(x, y) ? k + 1 : k)];
    if (hh(x, y, 2) > 0.985) c = PER[2]; if (hh(x >> 3, y, 4) > 0.97 && (x & 7) < 5) c = mez(c, PER[1], 0.35); R.pset(x, y, c); }
  // aureolas de agua y agujeros de polilla
  for (const [cx, cy, r] of [[196, 44, 20], [104, 150, 14], [292, 146, 16]]) for (let a = 0; a < 6.283; a += 0.02) { const x = Math.round(cx + Math.cos(a) * r), y = Math.round(cy + Math.sin(a) * r * 0.8); R.pset(x, y, mez(R.pget(x, y), PER[1], 0.45)); R.pset(x + 1, y, mez(R.pget(x + 1, y), PER[2], 0.3)); }
  for (const [x, y] of [[158, 30], [302, 100], [16, 118]]) { R.disco(x, y, 2, PER[0]); R.disco(x, y, 1, hex('#3a2416')); }
  // la tierra de abajo: aguadas de verde, ocre y almagre, y el perfil de costa con sus líneas de agua
  for (let x = 0; x < 320; x++) { const ye = Math.round(yc1(x)); for (let y = ye; y < 180; y++) { const v = Math.sin(x * 0.05 + y * 0.03) + Math.sin(x * 0.021 - y * 0.06 + 2) + (hh(x >> 3, y >> 3, 5) - 0.5) * 0.25 + (umb(x, y) - 0.5) * 0.3;
      const col = v > 0.75 ? hex('#7e9446') : v < -0.55 ? hex('#c8984a') : v < 0.1 ? hex('#bc7250') : hex('#98aa58');
      R.pset(x, y, mez(R.pget(x, y), col, y - ye < 3 ? 0.75 : 0.55)); if ((x + y) % 4 === 0 && hh(x, y, 6) > 0.6) R.pset(x, y, mez(R.pget(x, y), K, 0.15)); } }
  for (let x = 0; x < 320; x++) { const ye = Math.round(yc1(x)), yn = Math.round(yc1(x + 1)); R.linea(x, ye, x + 1, yn, TINTA); R.pset(x, ye + 1, mez(R.pget(x, ye + 1), VERDE[0], 0.6));
    for (const off of [4, 8, 13]) if ((x + off) % (off > 8 ? 3 : 2) === 0) R.pset(x, ye - off, hex('#7a8e88')); }
  // los montes en lomas, con el sombreado a un lado
  for (const [mx, my, w] of [[192, 156, 12], [212, 152, 15], [98, 160, 10], [280, 158, 12]]) { for (let i = -w; i <= w; i++) { const y = Math.round(my - Math.sqrt(Math.max(0, 1 - (i / w) ** 2)) * w * 0.7); R.pset(mx + i, y, TINTA); if (i > 0) for (let yy = y + 2; yy < my; yy += 2) if ((mx + i + yy) % 3 === 0) R.pset(mx + i, yy, hex('#6a4a2a')); } }
  // el río que baja al mar
  for (let y = 178; y > yc1(120); y--) { const x = Math.round(118 + Math.sin(y * 0.16) * 5 + (178 - y) * 0.1); R.pset(x, y, hex('#2a4a7a')); R.pset(x + 1, y, hex('#4a6694')); }
  // un ciervo de tinta y notas en garabato rojo y negro (en la tierra y en el mar)
  const ci = ['.......kk.', '.......kkk', '.......k..', 'kkkkkkkk..', 'kkkkkkkk..', '.kkkkkkk..', '.k.k..k.k.', '.k.k..k.k.'];
  for (const [ax, ay] of [[176, 160]]) ci.forEach((f, j) => [...f].forEach((ch, i) => { if (ch === 'k') { R.rect(ax + i * 2, ay + j * 2, ax + i * 2 + 1, ay + j * 2 + 1, j < 3 && i > 6 ? hex('#6a4a2a') : hex('#8a5a32')); } }));
  for (const [nx, ny, nw, col] of [[262, 150, 34, ROJA], [264, 156, 26, TINTA], [124, 100, 36, ROJA], [126, 106, 30, ROJA], [122, 112, 32, TINTA], [10, 160, 22, ROJA]]) for (let i = 0; i < nw; i++) R.pset(nx + i, ny + Math.round(Math.sin(i * 1.3) * 1.2 + (i % 7 === 0 ? -1 : 0)), col);
  // los rumbos que salen de la rosa (solo en el mar, lejos de Atom)
  const [rx, ry] = RO1;
  for (let k = 0; k < 16; k++) { const ang = k * Math.PI / 8 + 0.1, col = k % 3 === 0 ? ROJA : k % 3 === 1 ? hex('#3a6a3a') : TINTA;
    for (let r = RR1 + 3; r < 340; r += 1) { const x = Math.round(rx + Math.cos(ang) * r), y = Math.round(ry + Math.sin(ang) * r); if (y < 0 || x < 0 || x > 319 || y > 179) break; if (mar1(x, y) && !(x > 270 && y < 48) && r % 3 !== 0) R.pset(x, y, mez(R.pget(x, y), col, 0.7)); } }
  // la trama azulada del mar
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) if (mar1(x, y - 4) && (x + y * 2) % 5 === 0 && hh(x, y, 9) > 0.35 && !(x > 270 && y < 48) && Math.hypot(x - rx, y - ry) > RR1 + 2) R.pset(x, y, mez(R.pget(x, y), hex('#8ea69c'), 0.5));
  // la rosa de dieciséis puntas
  for (let k = 0; k < 16; k++) { const ang = k * Math.PI / 8 - Math.PI / 2, l = k % 4 === 0 ? 23 : k % 2 === 0 ? 15 : 10, w = k % 4 === 0 ? 4 : 2.5, nx = -Math.sin(ang) * w, ny = Math.cos(ang) * w;
    const c1 = k === 0 ? ROJA : k % 4 === 0 ? hex('#3a6a3a') : k % 2 ? hex('#c89a4a') : ROJA, c2 = mez(c1, K, 0.35);
    R.poligono([[rx + nx, ry + ny], [rx + Math.cos(ang) * l, ry + Math.sin(ang) * l], [rx, ry]].map(([u, v]) => [Math.round(u), Math.round(v)]), c1);
    R.poligono([[rx - nx, ry - ny], [rx + Math.cos(ang) * l, ry + Math.sin(ang) * l], [rx, ry]].map(([u, v]) => [Math.round(u), Math.round(v)]), c2); }
  R.disco(rx, ry, 3, hex('#d8a838')); R.disco(rx, ry, 1, ROJA);
