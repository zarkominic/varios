<script type="module">
// LT-PREDICADOR (frases 9–11: «predicador», «tigres», «finge»), año 21, sin cartela. Catorce planos de 3,9–6,0 s, cortados
// en la palabra inglesa:
// 1 «Through the streets» fondo local 'calle' (Arrakeen de tarde): el muchacho trae de la mano al predicador ciego (venda y
//   bastón); un aguador cruza al fondo, la vendedora le señala en «blind», los pájaros vuelan cuando pasan; se paran.
// 2 «who cries out» ciudadela balcon/multitud: en el brocal de un pozo, en un claro de la gente, grita con el dedo arriba;
//   en «Muad'Dib» alza los brazos y en «Paul's name» señala la fachada; los del corro se sorprenden y se entristecen.
// 3 «People listen» fondo local 'mercado': la arquería y el puesto de estatuillas doradas del profeta; la gente se encoge
//   en «fear» y una madre retrocede con su niña; en «lie» la estatuilla grande se tambalea y cae.
// 4 «and no one dares» ciudadela balcon/general: dos sacerdotes cuchichean; uno señala el corro de la plaza (el predicador
//   diminuto), el otro duda («?» en «who»); en «known the prophet» se vuelven al busto del profeta, que brilla.
// 5 «Meanwhile» fondo local 'salusa': la muralla del castillo Corrino de noche, con tormenta; el adarve con grietas, verdín,
//   canalillo, charcos con ondas de lluvia, brasero y hachón encendidos, argolla con cadena y el bordillo de delante;
//   Wensicia llega, señala la estrellita anaranjada en «Arrakis»; el guardia hace la ronda con su lanza hacia ella; rayo
//   y trueno en «overthrew» (ella se vuelve al castillo, él da un respingo); en «the Corrinos» los dos van hacia el castillo.
// 6 «the Corrinos» fondo local 'salon': sube al estrado y, en «throne», arranca la funda: el trono de oro brilla entre el
//   polvo; su hijo da un respingo («!»), sonríe y camina hasta el estrado (x 98→136) con el oro reflejado en la cara.
// 7 «and to them» inserto 'mapa': la mesa con el mapa de Arrakis (el tapiz del león a la derecha, x 192–252, fuera de
//   la barra del año); la mano morada toca a los dos peones pelirrojos en
//   «children» y deja a su lado dos tigres de juguete en «standing in the way»; los peones Corrino avanzan.
// 8 «So one night» fondo local 'jaula' (de noche): el embozado tira del cerrojo en «released», la puerta cae y salen los
//   tigres en «tigers», de uno en uno (dentro van recortados al hueco y en la sombra de la jaula; salen por la boca, por
//   encima de la puerta caída, y caminan sigilosos hacia el sietch); una luz del sietch se enciende en «sietch».
// 9 «but Leto» planeta desierto/roca de noche: en la repisa, Leto señala los tigres de abajo en «seen it coming»; en
//   «a thousand lives» se alzan detrás los antepasados de luz.
// 10 «learn to expect» fondo local 'acecho' (a ras de arena junto a la roca grande, sin luna; lejos, la meseta del sietch):
//   los tigres avanzan agachados junto a la roca y se paran en seco al salir el gatito (nunca atacan); el matojo se mueve
//   en «expect the worst», Atom salta del susto… y es el gatito (gag); los gemelos, escondidos tras un pedrusco, huyen
//   corriendo hacia el sietch en «escape».
// 11 «And then Leto» ciudadela aposentos de noche: Leto entra y le cuenta el plan a Ghanima; las voces le rodean en
//   «a thousand lives»; ella se sorprende en «could do».
// 12 «He decides» inserto 'huellas' (la arena al amanecer): huellas de tigre; la mano de Leto, dentro del cuadro desde el
//   principio, sostiene su capa parda (pliegues en abanico, ribete azul, zarpazos), la baja y la suelta en «dead»: cae y
//   queda tirada con su capucha y su sombra en la arena.
// 13 «His sister» sietch cuarto/puerta: Ghanima se hipnotiza con el anillo de agua; el recuerdo de Leto se deshace en
//   «forget»; en «grieve» baja el anillo y llora.
// 14 «and Leto walks off» planeta desierto/general al ocaso: Ghanima llora sola delante; Leto, figurita, se aleja hacia el
//   sol; en «just as his father did» asoma lejos el fantasma de su padre; Atom, lucecita, va a consolarla.
import * as T from '/atomo/plato/escenas/lt-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('lt-predicador');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const AT = T.AT, LT = T.LT, PA = T.PA, K = T.C.k, ri = Math.round, H = (s) => hex(s);
const B4M = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const b4 = (x, y) => (B4M[((y & 3) << 2) | (x & 3)] + 0.5) / 16;
const h2 = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const ns = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const a = h2(xi, yi), b = h2(xi + 1, yi), c = h2(xi, yi + 1), d = h2(xi + 1, yi + 1); return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy; };
const rmp = (ramp, v, x, y) => { let l = Math.floor(v); if (v - l > b4(x, y)) l++; return ramp[Math.max(0, Math.min(ramp.length - 1, l))]; };
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
const pal = (a) => a.map((c) => hex(c));
const ease = (u) => u * u * (3 - 2 * u), cl = (u) => Math.max(0, Math.min(1, u));
const voz = (t) => (E.energia ? E.energia(t) : 0.5);
const FIJOS = {};
// lo fijo de un fondo propio, pintado una vez en su búfer (R.usar(prev), nunca R.usar() a secas)
const horno = (k, f) => { if (!FIJOS[k]) { const b = R.nuevo(), prev = R.usar(b); f(); R.usar(prev); FIJOS[k] = b; } return FIJOS[k]; };
const fijo = (k, f) => R.copiar(horno(k, f));
const sombrea = (x, y, a) => { x = ri(x); y = ri(y); if (x >= 0 && x < 320 && y >= 0 && y < 180) R.pset(x, y, mez(R.pget(x, y), K, a)); };
const aclara = (x, y, c, a) => { x = ri(x); y = ri(y); if (x >= 0 && x < 320 && y >= 0 && y < 180) R.pset(x, y, mez(R.pget(x, y), c, a)); };
const conAlfa = (a, f, caja = [0, 0, 319, 179]) => { if (a >= 1) return f(); if (a <= 0) return;
  const [x0, y0, x1, y1] = caja, B = R.buf, copia = new Uint32Array(B); const r = f();
  for (let y = Math.max(0, y0); y <= Math.min(179, y1); y++) for (let x = Math.max(0, x0); x <= Math.min(319, x1); x++) { const i = y * 320 + x; if (B[i] !== copia[i] && b4(x, y) > a) B[i] = copia[i]; }
  return r; };
// recuerdo: un tinte sepia y una viñeta suave
const sepia = (a = 0.55) => { const B = R.buf; for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) { const i = y * 320 + x, c = B[i], r = c & 255, g = (c >> 8) & 255, b = (c >> 16) & 255, l = 0.3 * r + 0.59 * g + 0.11 * b;
  const v = Math.hypot((x - 160) / 190, (y - 90) / 120), o = v > 0.8 && b4(x, y) < (v - 0.8) * 2.2 ? 0.55 : 1;
  const rr = (l * 1.05 + 28) * o, gg = (l * 0.9 + 14) * o, bb = (l * 0.68) * o;
  B[i] = (0xff000000 | (Math.min(255, Math.round(b + (bb - b) * a)) << 16) | (Math.min(255, Math.round(g + (gg - g) * a)) << 8) | Math.min(255, Math.round(r + (rr - r) * a))) >>> 0; } };
const flota = (t, k = 0) => Math.round(Math.sin(t * 2.4 + k) * 1.5);
// fuera de la zona de Atom (x 278–318, y 4–44) y de la barra del año (x 20–170, y 0–20)
const tranquilo = (x, y) => (x >= 274 && y <= 48) || (x >= 16 && x <= 174 && y <= 21);

// ── LOS ANTEPASADOS: siluetas de luz (cabeza, hombros y túnica), translúcidas, con el filo más claro ──
const LUZ = pal(['#9ad8ff', '#ffe6a0', '#c8b4ff', '#a8f0d8']);
const fantasma = (x, y, h, a, c, o = {}) => {
  if (a <= 0.01) return;
  const hr = Math.max(1.2, h * 0.16), top = y - h;
  for (let j = 0; j <= h; j++) { const yy = ri(top + j); let w;
    if (j <= 2 * hr) { const d = j - hr; w = Math.sqrt(Math.max(0, hr * hr - d * d)); }
    else { const u = (j - 2 * hr) / Math.max(1, h - 2 * hr); w = hr * (u < 0.2 ? 0.7 + u * 3.5 : 1.4) + u * h * 0.12; }
    const W = Math.ceil(w);
    for (let i = -W; i <= W; i++) { if (Math.abs(i) > w + 0.35) continue; const X = ri(x + i); if (o.m && o.m(X, yy)) continue; if (tranquilo(X, yy)) continue;
      const borde = Math.abs(i) >= w - 0.8 || j === 0; aclara(X, yy, c, a * (borde ? 1 : 0.45)); } }
  if (o.brazo) { const sx = x + o.brazo * hr * 1.4, sy = top + 2.8 * hr; for (let k = 0; k < h * 0.42; k++) aclara(sx + o.brazo * k * 0.45, sy - k, c, a); }
  if (o.asta) { const sx = x + hr * 1.6, sy = y - h * 0.5; for (let k = 0; k < h * 1.1; k++) aclara(sx, sy - k, c, a); const ond = o.asta; for (let j = 0; j < 5; j++) for (let i = 1; i <= 7; i++) aclara(sx + i, sy - h * 1.1 + j + Math.round(Math.sin(i * 0.9 + ond) * 1), c, a * 0.8); }
};
// cientos de antepasados en un rectángulo, que derivan despacio y laten (m: máscara, true donde NO se pinta)
const antepasados = (t, n, x0, x1, y0, y1, a, o = {}) => {
  for (let k = 0; k < n; k++) { const v = h2(k, 2, 7), yb = y0 + (y1 - y0) * v, h = (o.hmin ?? 5) + v * (o.hmas ?? 7);
    const x = x0 + ((h2(k, 1, 7) * (x1 - x0) + t * (o.deriva ?? 1.2) * (0.4 + h2(k, 3, 7))) % (x1 - x0));
    const parp = 0.6 + 0.4 * Math.sin(t * (0.7 + h2(k, 4, 7)) + k);
    fantasma(x, yb, h, a * parp, LUZ[k % 5 === 0 ? 1 : k % 7 === 0 ? 2 : k % 11 === 0 ? 3 : 0], { m: o.m }); }
};
// una lucecita de recuerdo (con estela), para las voces que rodean a Leto
const lucecita = (x, y, t, a = 1, c = LUZ[0], fuerte = false) => { const X = ri(x), Y = ri(y); if (fuerte) { for (const [dx, dy] of [[2, 1], [-2, 1], [1, 2], [-1, 2], [2, -1], [-2, -1], [1, -2], [-1, -2]]) aclara(X + dx, Y + dy, H('#1a1430'), a * 0.45); aclara(X + 1, Y, H('#ffffff'), a); } aclara(X, Y, H('#ffffff'), a); for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) aclara(X + dx, Y + dy, c, a * 0.8); for (const [dx, dy] of [[2, 0], [-2, 0], [0, 2], [0, -2], [1, 1], [-1, -1], [1, -1], [-1, 1]]) aclara(X + dx, Y + dy, c, a * 0.35); };
// la sombra gorda del barón: cuerpo enorme y cabeza pequeña, sin cara, oscura y translúcida (o.ancho: de flaca a gorda)
const baron = (cx, by, s, a, o = {}) => {
  if (a <= 0.01) return;
  const wf = o.ancho ?? 1, bw = 15 * s * wf, bh = 26 * s, hr = 6.5 * s * Math.max(0.7, Math.sqrt(wf)), cy = by - bh * 0.5, hcy = by - bh - hr * 0.6;
  for (let y = ri(hcy - hr - 1); y <= by; y++) for (let x = ri(cx - bw - 2); x <= ri(cx + bw + 2); x++) {
    if (o.m && o.m(x, y)) continue; if (tranquilo(x, y)) continue;
    const dx = (x - cx) / bw, dy = (y - cy) / (bh * 0.56), d = dx * dx + dy * dy, hx = (x - cx) / hr, hy = (y - hcy) / hr, dh = hx * hx + hy * hy, m = Math.min(d, dh);
    if (m > 1.12) continue; const borde = m > 0.8; if (borde && b4(x, y) > (1.12 - m) * 2.5) continue;
    sombrea(x, y, a * (borde ? 0.55 : 0.85)); if (borde && !o.sinFilo) aclara(x, y, H('#5a1424'), a * 0.25); }
};

// ── fondos locales: el cielo de noche, las dunas de noche y la roca ──
const CN = pal(['#080a1e', '#0e1230', '#161c42', '#202852', '#2c3262', '#3c3c70', '#524a7c', '#6a5884']);
const ROCA = pal(['#7a5e58', '#644a48', '#4e3a3c', '#3a2a30', '#281e26', '#1a1420']);   // de luz a sombra
const DUNA = pal(['#9a8cb8', '#7a6ea0', '#5e5688', '#464070', '#322e58', '#221e40']);
const cieloNoche = (yH, k = 1, o = {}) => {
  for (let y = 0; y < yH; y++) for (let x = 0; x < 320; x++) { const v = (y / yH) * 6.4 + (ns(x * 0.04 + k, y * 0.07) - 0.5) * 0.9 - (o.luna ? Math.max(0, 1.6 - Math.hypot(x - o.luna[0], y - o.luna[1]) / 30) : 0) * -0.8; R.pset(x, y, rmp(CN, v, x, y)); }
  for (let x = 0; x < 320; x++) { const yc = (o.via ?? 10) + x * 0.22 + Math.sin(x * 0.03 + k) * 8;
    for (let dy = -13; dy <= 13; dy++) { const y = ri(yc + dy); if (y < 0 || y >= yH - 6 || tranquilo(x, y)) continue; const g = (1 - Math.abs(dy) / 13) * (0.3 + 0.6 * ns(x * 0.14, y * 0.22 + k)); if (g > b4(x, y) + 0.2) R.pset(x, y, mez(R.pget(x, y), H('#8a86b8'), 0.3 + g * 0.2)); } }
  for (let i = 0; i < 320; i++) { const x = ri(h2(i, 1, k) * 319), y = ri(h2(i, 2, k) * (yH - 6)); if (tranquilo(x, y)) continue; const b = h2(i, 3, k);
    R.pset(x, y, b > 0.9 ? H('#ffffff') : b > 0.6 ? H('#c8d0f0') : H('#7a80b0')); if (b > 0.96) { R.pset(x + 1, y, H('#8a90c0')); R.pset(x - 1, y, H('#8a90c0')); R.pset(x, y - 1, H('#8a90c0')); R.pset(x, y + 1, H('#8a90c0')); } }
};
// lo vivo del cielo: estrellas que titilan, nubes de tres tonos a tres velocidades y una estrella fugaz de vez en cuando
const cieloVivo = (t, yH, k = 1, o = {}) => {
  for (let i = 0; i < 40; i++) { const x = ri(h2(i, 5, k) * 319), y = ri(h2(i, 6, k) * (yH - 8)); if (tranquilo(x, y) || (o.m && o.m(x, y))) continue; const on = Math.sin(t * (2 + h2(i, 7, k) * 4) + i) > 0.3; R.pset(x, y, on ? H('#ffffff') : H('#5a6090')); }
  const capas = [[0.5, H('#1e2248'), 0.05, o.n0 ?? 26], [1.1, H('#2e3060'), 0.07, o.n1 ?? 40], [2.0, H('#4a4676'), 0.09, o.n2 ?? 58]];
  capas.forEach(([vel, c, fr, yc], i) => { for (let y = yc - 7; y <= yc + 7; y++) for (let x = 0; x < 320; x++) { if (tranquilo(x, y) || y >= yH || (o.m && o.m(x, y))) continue;
    const xx = x + t * vel * 4 + i * 97, v = ns(xx * fr, y * fr * 2.2 + i * 9) - 0.58 - Math.abs(y - yc) / 18; if (v > 0 && v * 6 > b4(x, y)) R.pset(x, y, v > 0.12 ? mez(c, H('#8a84b4'), 0.35) : c); } });
  const ft = (t + k * 3.1) % 7; if (ft < 0.6) { const u = ft / 0.6, x = 40 + u * 120 + k * 30, y = 30 + u * 26; for (let j = 0; j < 10; j++) { const X = ri(x - j * 1.6), Y = ri(y - j * 0.7); if (!tranquilo(X, Y) && Y < yH) aclara(X, Y, H('#ffffff'), (1 - j / 10) * (1 - u)); } }
};
const lunaN = (x, y, r, t) => { R.halo(x, y, r * 2.6, [H('#1e2450'), H('#2a3060'), H('#3a4070')], 1.0); R.disco(x, y, r + 1, K); R.disco(x, y, r, H('#e8e4cc'));
  for (const [dx, dy, rr] of [[-3, -2, 2.2], [3, 2, 1.6], [-1, 4, 1.4], [4, -3, 1.2]]) R.disco(x + dx, y + dy, rr, H('#c8c2a8')); for (let a = 0; a < 40; a++) { const p = a / 40 * 6.283; if (Math.cos(p - 2.4) > 0.3) R.pset(ri(x + Math.cos(p) * (r - 0.5)), ri(y + Math.sin(p) * (r - 0.5)), H('#a8a490')); } };
// dunas de noche en capas: lista de [base, amplitud, fase, oscuridad]; devuelve la cresta de la más cercana
const dunasNoche = (capas, ramp = DUNA) => { const cr = [];
  capas.forEach(([base, amp, fase, osc], i) => {
    const Y = (x) => base + Math.sin(x * 0.021 + fase) * amp + Math.sin(x * 0.057 + fase * 2) * amp * 0.4 + Math.sin(x * 0.13 + fase * 3) * amp * 0.12;
    for (let x = 0; x < 320; x++) { const yc = Y(x), d = Y(x + 1) - Y(x - 1);
      for (let y = Math.max(0, ri(yc)); y < 180; y++) { const dy = y - yc;
        let v = osc + dy * 0.035 + d * 4 + (ns(x * 0.08 + i * 5, y * 0.25) - 0.5) * 0.8;
        const rip = Math.sin(x * 0.33 + dy * 1.7 + ns(x * 0.05, y * 0.1) * 5); if (rip > 0.78) v += 0.8; else if (rip < -0.88) v -= 0.5;
        if (dy < 1.2) v -= 1.4; else if (dy < 2.5) v -= 0.6;
        R.pset(x, y, rmp(ramp, v, x, y)); } }
    cr.push(Y); });
  return cr; };
// roca tallada con estratos, grietas y marcas de cincel; luz(x, y) suma oscuridad
const roca = (pts, luz = () => 0, k = 3) => R.poligono(pts, (x, y) => { let v = 2 + (ns(x * 0.09 + k, y * 0.3) - 0.5) * 1.6 + Math.sin(y * 0.55 + ns(x * 0.05, y * 0.05) * 6) * 0.35 + luz(x, y);
  if (h2(x >> 2, y >> 1, k) > 0.93) v += 1.1; if ((x * 7 + y * 3 + k) % 23 === 0) v -= 0.6; return rmp(ROCA, v, x, y); });
// una nota musical de luz
const nota = (x, y, c, a) => { const X = ri(x), Y = ri(y); for (let j = 0; j < 6; j++) aclara(X + 2, Y - j, c, a); aclara(X, Y, c, a); aclara(X + 1, Y, c, a); aclara(X, Y + 1, c, a); aclara(X + 1, Y + 1, c, a); aclara(X + 3, Y - 5, c, a); aclara(X + 4, Y - 4, c, a); };
// un corazón (7 × 6)
const CORAZON = ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'];
const corazon = (x, y, a, c = H('#ff7aa8')) => { for (let j = 0; j < 6; j++) for (let i = 0; i < 7; i++) if (CORAZON[j][i] === '#') aclara(x - 3 + i, y - 3 + j, (i + j) % 5 === 0 ? H('#ffd0e0') : c, a); };
// el halcón de los Atreides (7 × 5), no una letra
const HALCON = ['X.....X', 'XX.Hp.X', '.dXXXd.', '..dXd..', '..d.d..'];
const halconB = (cx, cy, o = {}) => { for (let j = 0; j < 5; j++) for (let i = 0; i < 7; i++) { const ch = HALCON[j][i]; if (ch === '.') continue;
  R.pset(cx - 3 + i, cy - 2 + j, o.c ?? (ch === 'd' ? H('#a8782a') : ch === 'p' ? H('#e07a30') : ch === 'H' ? H('#fff0a0') : H('#f0c848'))); } };



// ══════════════ utilidades propias de lt-predicador ══════════════
const ARE = pal(['#f4e2b8', '#e6cc98', '#d2b47e', '#ba9a66', '#9a7c50', '#76603e', '#4e3e2a']);   // arenisca, de luz a sombra
const CIELO_D = pal(['#4e6e9e', '#6484b0', '#7e9ac0', '#9caebe', '#bcbcb4', '#d8c8a4', '#ead2a0']);
const TELA = pal(['#a83a2e', '#d86a3a', '#2e5a6a', '#e8c060', '#5a3a6a', '#3a6aa8']);
const pp = (o) => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, H(v)]));
const voz2 = (t) => Math.sin(t * 9) > -0.2;   // la boca que se abre y se cierra al hablar
// un cielo de día tramado (de la tarde), con velos

const CAPA = pal(['#c8aa82', '#a8865e', '#86664a', '#644a36', '#463224']);
const capaColgada = (hx, hy, t) => { const sw = Math.sin(t * 2.2) * 1.8, B = hy + 40;
  const pts = [[hx - 3, hy], [hx + 3, hy], [hx + 9, hy + 14], [hx + 14 + sw, B - 4], [hx + 9 + sw, B], [hx + 3 + sw, B - 3], [hx - 3 + sw, B + 1], [hx - 9 + sw, B - 2], [hx - 14 + sw, B - 3], [hx - 9, hy + 14]];
  R.poligono(pts.map(([x, y]) => [x + Math.sign(x - hx) * 1, y + (y > hy ? 1 : -1)]), K);
  // pliegues que bajan desde la pinza (en abanico, no rayas paralelas) y la sombra del lado de la derecha
  R.poligono(pts, (x, y) => { const a = Math.atan2(x - hx - sw * (y - hy) / 40, y - hy + 4); return rmp(CAPA, 1.2 + Math.sin(a * 9) * 0.8 + (x - hx) * 0.06 + (y - hy) * 0.012, x, y); });
  for (let i = -12; i <= 12; i++) { const x = ri(hx + i + sw), y = ri(B - 3 + Math.abs(Math.sin(i * 0.9)) * 2); if (y > hy + 20) { R.pset(x, y, H('#3a6aa8')); R.pset(x, y - 1, H('#5a8ac8')); } }   // el ribete azul del bajo
  for (const d of [-5, -1, 3]) { R.linea(ri(hx + d + sw * 0.5), hy + 20, ri(hx + d + 4 + sw * 0.6), hy + 28, SAND[1]); R.linea(ri(hx + d + 1 + sw * 0.5), hy + 20, ri(hx + d + 5 + sw * 0.6), hy + 28, CAPA[4]); }   // los zarpazos (asoma la luz)
  R.pset(hx, hy + 1, CAPA[4]); R.pset(hx - 1, hy + 2, CAPA[3]); };
const capaSuelo = (x, y, u = 1) => { const w = ri(lerp(12, 24, u)), h = ri(lerp(24, 13, u));
  // la sombra en la arena, por delante y a la derecha (el sol sale por la izquierda)
  if (u > 0.4) for (let j = -1; j <= 4; j++) for (let i = -w - 3; i <= w + 8; i++) { const e = ((i - 3) / (w + 6)) ** 2 + (j / 4) ** 2; if (e < 1) sombrea(x + i, y + j, 0.42 * (1 - e) * u); }
  // la tela arrugada: un contorno de bultos, no un rectángulo
  const pts = [[x - w, y], [x - w - 3, y - ri(h * 0.3)], [x - w + 1, y - h + 2], [x - w + 7, y - h - 1], [x - 4, y - h + 4], [x + 3, y - h + 1], [x + 10, y - h + 5], [x + w - 1, y - h + 3], [x + w + 3, y - ri(h * 0.35)], [x + w + 1, y], [x + 8, y + 2], [x - 2, y + 1], [x - 10, y + 2]];
  R.poligono(pts.map(([px, py]) => [px + Math.sign(px - x), py + (py < y - 1 ? -1 : 1)]), K);
  R.poligono(pts, (xx, yy) => { const r = Math.hypot((xx - x + 4) * 0.5, yy - y + h * 0.4); return rmp(CAPA, 0.9 + Math.sin(r * 0.9 + Math.atan2(yy - y, xx - x) * 3) * 0.7 + (yy - y + h) / (h + 1) * 1.1, xx, yy); });
  // la capucha caída a la izquierda: un bulto con su luz arriba y su sombra debajo
  for (let i = -4; i <= 4; i++) { const X = x - w + 5 + i, Y = y - h + 3 + ri(i * i * 0.15); aclara(X, Y, H('#e8d0a8'), 0.5); sombrea(X + 1, Y + 4 - ri(Math.abs(i) * 0.4), 0.35); }
  // la punta doblada a la derecha enseña el forro, más claro
  R.poligono([[x + w - 10, y - h + 4], [x + w + 1, y - h + 3], [x + w - 1, y - 4]], K); R.poligono([[x + w - 9, y - h + 5], [x + w, y - h + 4], [x + w - 2, y - 5]], (xx, yy) => rmp(pal(['#e8d4b0', '#d0b890', '#b89c74']), (yy - y + h) * 0.25, xx, yy));
  // pliegues: arrugas curvas que salen del centro
  for (const [a0, l] of [[-2.6, 9], [-1.9, 7], [-0.9, 8], [-0.3, 6]]) for (let q = 2; q < l; q++) { const px = x - 2 + Math.cos(a0 + q * 0.05) * q * 1.6, py = y - h * 0.45 + Math.sin(a0) * q * 0.45; sombrea(px, py, 0.4); aclara(px, py - 1, H('#e0c8a0'), 0.35); }
  // el ribete azul por el borde de abajo, que sigue los bultos
  for (let i = -w + 1; i < w; i++) { const yy = y - 1 + (i > 4 ? 1 : 0) + (i < -8 ? 1 : 0); R.pset(x + i, yy, H('#3a6aa8')); if (i & 1) R.pset(x + i, yy - 1, H('#5a8ac8')); }
  if (u >= 1) { for (const d of [-1, 4, 9]) { R.linea(x + d, y - h + 5, x + d + 3, y - 4, SAND[1]); R.linea(x + d + 1, y - h + 5, x + d + 4, y - 4, CAPA[4]); }   // tres zarpazos por los que asoma la arena
    for (const [dx, dy] of [[w + 7, -2], [w + 11, 1], [-w - 7, 1]]) { R.pset(x + dx, y + dy, CAPA[2]); R.pset(x + dx + 1, y + dy, CAPA[1]); R.pset(x + dx, y + dy + 1, CAPA[3]); }   // jirones sueltos
    for (let k = 0; k < 10; k++) R.pset(x - w + ri(h2(k, 1, 97) * w * 2), y - ri(h2(k, 2, 97) * 3), SAND[1]); } };   // arena que le ha caído encima
// ── p12 · «He decides the world must believe he's dead» ──
const p12 = (t) => {
  R.copiar(huellasFijo());
  // el sol que asoma, nubes finas y la arena que vuela
  R.halo(70, 52, 22, [H('#e8906a'), H('#f4b07a'), H('#fcd8a0')], 1.1); R.disco(70, 52, 7, H('#fff0c8'));
  for (let x = 40; x < 100; x++) for (let y = 46; y < 56; y++) { if (y > 46 + Math.sin(x * 0.05 + 2.6) * 4) R.pset(x, y, R.pget(x, y)); }
  for (const [y, v, w] of [[18, 3, 60], [28, 5, 44], [34, 8, 70]]) { const x0 = ((t * v + y * 7) % 400) - 60; for (let i = 0; i < w; i++) { const X = ri(x0 + i), Y = y + ri(Math.sin(i * 0.2) * 1.2); if (!tranquilo(X, Y)) aclara(X, Y, H('#f8d0b0'), 0.55); } }
  for (let i = 0; i < 40; i++) { const f = (t * (0.5 + h2(i, 1, 95) * 0.6) + h2(i, 2, 95)) % 1, x = -10 + f * 340, y = 70 + h2(i, 3, 95) * 106 + Math.sin(t * 4 + i) * 2; aclara(x, y, H('#fff0d0'), 0.6); aclara(x - 1, y, H('#fff0d0'), 0.3); }
  // un escarabajo que cruza
  const bx = ri(120 + ((t - en('finge', 0.2440)) * 6)), by = 140 + ri(Math.sin(t) * 2); R.rect(bx - 2, by - 1, bx + 2, by + 1, K); R.pset(bx - 1, by - 1, H('#5a6a8a')); R.pset(bx + 3, by, K); if (Math.sin(t * 14) > 0) { R.pset(bx - 2, by + 2, K); R.pset(bx + 2, by - 2, K); } else { R.pset(bx - 2, by - 2, K); R.pset(bx + 2, by + 2, K); }
  // la mano de Leto (manga de arena) asoma con la capa colgando (dentro del cuadro desde el principio), la baja un poco
  // y la suelta en «dead»; la capa cae y queda tirada junto a las huellas
  const a = ease(cl((t - en('finge', 0.2440)) / 0.6)), suelta = en('finge', 0.3767), c = ease(cl((t - suelta - 0.45) / 0.7));
  const baja = ease(cl((t - en('finge', 0.2700)) / (suelta - en('finge', 0.2700))));
  const wx = ri(lerp(300, 286, a) + c * 60), wy = ri(lerp(92, 98, a) + baja * 8);
  const cae = cl((t - suelta) / 0.4), cx = 262, cy = 158;
  if (cae <= 0 && a > 0) capaColgada(wx - 8, wy + 4, t);
  else if (cae > 0 && cae < 1) { const y = lerp(wy + 34, cy, cae * cae); capaSuelo(ri(lerp(wx - 8, cx, cae)), ri(y), cae * 0.6); }
  if (cae >= 1) { capaSuelo(cx, cy, 1); const p = cl((t - suelta - 0.4) / 0.8); if (p < 1) for (let i = 0; i < 12; i++) aclara(cx - 18 + i * 3, cy - 2 - p * 6 - h2(i, 1, 96) * 4, H('#f8e0b0'), 0.7 * (1 - p)); }
  if (a > 0 && c < 1) T.brazo(R, 334, 98, wx, wy, '#c8a878', -1, { codo: [ri(lerp(330, 318, a)), 92] });
};

// ── p13 · «His sister hypnotizes herself to forget the truth and grieve for him for real» (sietch, el pasillo de la puerta, de noche) ──
const O13 = { encuadre: 'cuarto', camara: 'puerta' };
const p13 = (t) => {
  T.sietch(R, t, O13);
  const s = t - en('finge', 0.4444), hip = ease(cl((t - en('finge', 0.4678)) / 0.8)), olvida = cl((t - en('finge', 0.5563)) / 0.9), llora = t > en('finge', 0.6083);
  // los anillos de la hipnosis: ondas que se abren desde sus ojos
  if (hip > 0 && !llora) for (let k = 0; k < 4; k++) { const r = ((t * 10 + k * 7) % 28) + 4; for (let a = 0; a < 48; a++) { const p = a / 48 * 6.283; aclara(167 + Math.cos(p) * r, 120 + Math.sin(p) * r * 0.6, H('#d8c8ff'), hip * 0.85 * (1 - r / 34)); } }
  // el recuerdo de su hermano (una lucecita con su pelo rojo) que se deshace en «forget»
  if (olvida < 1 && s > 0.4) { const mx = 186, my = 86 + Math.sin(t * 2) * 2, a = 1 - olvida;
    for (let a2 = 0; a2 < 40; a2++) { const p = a2 / 40 * 6.283; aclara(mx + Math.cos(p) * 10, my + Math.sin(p) * 8, H('#ffffff'), 0.7 * a); }
    for (let j = -7; j <= 7; j++) for (let i = -9; i <= 9; i++) if ((i * i) / 81 + (j * j) / 49 < 1) aclara(mx + i, my + j, H('#2a2440'), 0.6 * a);
    conAlfa(a, () => R.actor(LT.letoNinoLT, mx - 7, my + 12, t, { dir: -1, sonrisa: true, quieto: true }), [mx - 12, my - 12, mx + 12, my + 12]);
    if (olvida > 0) for (let i = 0; i < 16; i++) aclara(mx + (h2(i, 1, 97) - 0.5) * 20 + olvida * (h2(i, 2, 97) - 0.3) * 30, my + (h2(i, 3, 97) - 0.5) * 16 - olvida * 14, LUZ[1], 0.8 * (1 - olvida)); }
  // Ghanima con el anillo de agua colgado de un hilo, que se mece delante de sus ojos; en «grieve» lo baja y llora
  const ang = Math.sin(t * 3.2) * 0.55 * hip, baja = llora;
  const g = R.actor(LT.ghanimaLT, 160, 150, t, { dir: 1, sostiene: baja ? [176, 136] : [175, 120], triste: llora, sonrisa: false, quieto: hip > 0 && !llora });
  const [mx, my] = g.mano, l = baja ? 8 : 12, ax = mx + Math.sin(ang) * l, ay = my + Math.cos(ang) * l;
  R.linea(mx, my, ri(ax), ri(ay), H('#d8d0c0')); R.disco(ri(ax), ri(ay) + 2, 2, H('#c8962e')); R.pset(ri(ax), ri(ay) + 2, H('#3a2a1a')); if (Math.sin(t * 5) > 0.4) R.pset(ri(ax) - 1, ri(ay) + 1, H('#fff0a0'));
  if (llora) { const [cx, cy] = g.cabeza; for (let k = 0; k < 3; k++) { const f = ((t - en('finge', 0.6083)) * 1.4 + k / 3) % 1; R.pset(cx + 4, ri(cy + 7 + f * 8), H('#9ad8ff')); R.pset(cx + 6, ri(cy + 7 + ((f + 0.5) % 1) * 8), H('#9ad8ff')); } }
  T.sietchDelante(R, t, O13);
};

// ── p14 · «and Leto walks off alone into the desert, at nine years old, just as his father did» (planeta desierto/general, al ocaso) ──
const O14 = { encuadre: 'desierto', hora: 'ocaso' };
// una figurita que se aleja (s: escala 1 = 10 px), con el pelo rojo; ph: el paso
const FIG = ['..HH..', '.HHHH.', '.HhHH.', '..SS..', '.CCCC.', 'CCCCCC', 'cCCCCc', '.WWWW.', '.CCCC.', '.CccC.', '.n..n.', '.n..n.'];
const figurita = (x, y, s, t) => { const X = ri(x), Y = ri(y), p = Math.floor(t * 4) % 2, col = { H: '#b04a24', h: '#d0683a', S: '#c08a6a', C: '#c8a878', c: '#a08458', W: '#3a6aa8', n: '#5a4632' };
  const w = 6 * s, hh = FIG.length * s, x0 = X - (w >> 1), y0 = Y - hh;
  for (let j = 0; j < FIG.length; j++) for (let i = 0; i < 6; i++) { let ch = FIG[j][i]; if (j >= 10 && ch === 'n' && ((i < 3) === (p === 1)) && j === 11) ch = '.'; if (ch === '.') continue;
    R.rect(x0 + i * s - 1, y0 + j * s - 1, x0 + i * s + s, y0 + j * s + s, H('#3a1e1a')); }
  for (let j = 0; j < FIG.length; j++) for (let i = 0; i < 6; i++) { let ch = FIG[j][i]; if (j >= 10 && ch === 'n' && ((i < 3) === (p === 1)) && j === 11) ch = '.'; if (ch === '.') continue;
    R.rect(x0 + i * s, y0 + j * s, x0 + i * s + s - 1, y0 + j * s + s - 1, H(col[ch])); }
  for (let i = 0; i < 4 * s; i++) sombrea(X + 2 + i, Y + 1, 0.4); };
const p14 = (t) => {
  T.planeta(R, t, O14);
  // las huellas que deja y él, cada vez más lejos, hacia el sol que se pone
  const u = cl((t - en('finge', 0.7176)) / (en('finge', 1.0091) - en('finge', 0.7176))), pos = (v) => [lerp(196, 70, v), lerp(146, 98, Math.pow(v, 0.7))];
  for (let k = 0; k < 40; k++) { const v = k / 40 * u; const [x, y] = pos(v); sombrea(x + (k & 1) * 2 - 1, y + 1, 0.35 * (1 - v * 0.6)); }
  const [lx, ly] = pos(u); figurita(lx, ly, u < 0.45 ? 2 : 1, t);
  // el fantasma de su padre, más allá, que también se fue (en «just as his father did»)
  const pa = ease(cl((t - en('finge', 0.9284)) / 0.9)); if (pa > 0) { fantasma(lerp(52, 44, pa), 96, 13, pa * 0.6, LUZ[1]); for (let k = 0; k < 6; k++) sombrea(60 + k * 3, 97 + (k & 1), 0.2 * pa); }
  // Ghanima llora sola en primer término; Atom, lucecita, se le acerca a consolarla
  const g = R.actor(LT.ghanimaLT, 236, 152, t, { dir: -1, triste: true, dedo: t > en('finge', 0.7280) && t < en('finge', 0.7957) });
  const [cx, cy] = g.cabeza; for (let k = 0; k < 3; k++) { const f = (t * 1.2 + k / 3) % 1; R.pset(cx - 5, ri(cy + 7 + f * 9), H('#9ad8ff')); }
  const av = ease(cl((t - en('finge', 0.8061)) / 1.8)); T.AT.luciernaga(R, ri(lerp(300, 262, av) + Math.sin(t * 1.3) * 3), ri(lerp(70, 116, av) + Math.sin(t * 2.2) * 2), t, { dir: -1, brillo: 0.7, cara: 'triste' });
  T.planetaDelante(R, t, O14);
};

// ══════════════ el rodaje: catorce planos, cortados en la voz inglesa ══════════════
T.rodar(E, R, [[0, p1], [en('predicador', 0.2303), p2], [en('predicador', 0.5151), p3], [en('predicador', 0.7396), p4], [en('tigres', 0.0000), p5], [en('tigres', 0.1783), p6], [en('tigres', 0.3436), p7], [en('tigres', 0.5068), p8], [en('tigres', 0.6728), p9], [en('tigres', 0.8435), p10], [en('finge', -0.0001), p11], [en('finge', 0.2440), p12], [en('finge', 0.4444), p13], [en('finge', 0.7108), p14]], {
  año: 21,
  efectos: [[en('predicador', 0.0096), 'pasos'], [en('predicador', 0.1266), 'pajaros'], [en('predicador', 0.2628), 'publico'], [en('predicador', 0.6976), 'golpecito'], [en('predicador', 0.9532), 'brillo'], [en('tigres', 0.1373), 'trueno'], [en('tigres', 0.2893), 'whoosh'], [en('tigres', 0.3149), 'brillo'],
    [en('tigres', 0.3815), 'toc'], [en('tigres', 0.4617), 'golpecito'], [en('tigres', 0.5454), 'cerrojo'], [en('tigres', 0.7913), 'brillo'], [en('tigres', 0.8630), 'boing'], [en('tigres', 0.8869), 'miau'], [en('tigres', 0.9245), 'pasos'], [en('finge', 0.2544), 'viento'], [en('finge', 0.3793), 'papel'],
    [en('finge', 0.4730), 'campana'], [en('finge', 0.5615), 'brillo'], [en('finge', 0.7228), 'viento'],
    [en('predicador', 0.5250), 'publico'], [en('tigres', 0.0150), 'lluvia'], [en('tigres', 0.0700), 'viento'], [en('tigres', 0.5200), 'viento'], [en('tigres', 0.6850), 'rafaga'], [en('finge', 0.0150), 'pasos'], [en('finge', 0.4500), 'burbujas']],
});
</script>
