<script type="module">
// GT-CLIFFORD (frase 13), Londres, 1997. Tres planos:
// 1. la redacción del tabloide: el de BMG espera; Max Clifford entra por la izquierda y se dan la mano («hired Max
//    Clifford»); Clifford va a una pizarra de ruedas a su altura, coge el rotulador rojo de la bandeja y, con él en la
//    mano, traza desde la foto de la caja del juego una línea que sube a una plana de tabloide («tabloid press») y luego
//    a un político; el redactor de la mesa contesta al teléfono y levanta una plana; al fondo teclean;
// 2. la pizarra grande de la sala (arriba, el calendario del mes tachado, recortes, la gráfica que sube y la caja del
//    juego): Clifford entra y recorre con el rotulador la tira de abajo; de la línea suben tallos a tres políticos
//    («politicians»: un lord con peluca, un ministro con corbata, uno con gafas), que se enfadan en «complain», y luego a
//    tres periódicos («newspapers») que echan humo en «join in»;
// 3. de madrugada, en una calle de casas de estuco de Londres (cornisas, jardineras, ventanas con luz y cortinas que se
//    mueven, un plátano en la acera, nubes y palomas): Clifford en la cabina roja, con el teléfono de la cabina al hombro
//    y el móvil que le suena («according to Jones»); en «came true» pasa la furgoneta del reparto y tira dos fardos de
//    periódicos (la plana: coche y rayo); las palomas salen volando, se encienden dos ventanas, el del perro se vuelve y
//    Clifford sonríe.
import * as T from '/atomo/plato/escenas/gt-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('gt-clifford');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const C = T.C, G = T.PIEZAS_GT;
const h = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
// lo fijo de un fondo local se pinta una vez en un búfer y se pega en cada fotograma
const capas = {};
const capa = (k, f) => { let b = capas[k]; if (!b) { b = R.nuevo(); const prev = R.usar(b); f(); R.usar(prev); capas[k] = b; } R.copiar(b); };
const caja = (x0, y0, x1, y1, c, b = C.k) => { R.rect(x0, y0, x1, y1, b); R.rect(x0 + 1, y0 + 1, x1 - 1, y1 - 1, c); };
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
// relleno tramado: cada píxel toma un color de la lista según el ruido (la lista lleva los pesos repitiendo colores)
const trama = (x0, y0, x1, y1, cols, k = 0, esc = 1) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) R.pset(x, y, cols[Math.floor(h(Math.floor(x / esc), Math.floor(y / esc), k) * cols.length)]); };
// degradado vertical tramado
const degradado = (x0, y0, x1, y1, cols, k = 0) => { const n = cols.length - 1; for (let y = y0; y <= y1; y++) { const v = (y - y0) / Math.max(1, y1 - y0) * n, i = Math.floor(v), f = v - i; for (let x = x0; x <= x1; x++) R.pset(x, y, cols[Math.min(n, i + (h(x, y, k) < f ? 1 : 0))]); } };
// nube de tres tonos (luz arriba, sombra abajo), con la panza plana
const nube = (cx, cy, w, hh, cols) => { cx = Math.round(cx); for (let j = -hh; j <= Math.round(hh * 0.5); j++) for (let i = -w; i <= w; i++) { const b = 0.7 + 0.3 * Math.sin(i * 0.5 + w); if ((i / w) ** 2 + (j / (hh * b)) ** 2 > 1) continue; const v = (j + hh) / (1.5 * hh); R.pset(cx + i, cy + j, v < 0.4 ? cols[0] : v < 0.75 ? cols[1] : cols[2]); } };
const pajaro = (x, y, t, c) => { x = Math.round(x); y = Math.round(y); const a = Math.floor(t * 5 + x * 0.3) % 2; R.pset(x, y, c); R.pset(x - 1, y - 1 + a, c); R.pset(x + 1, y - 1 + a, c); R.pset(x - 2, y - 1 + 2 * a - a, c); R.pset(x + 2, y - 1 + 2 * a - a, c); };
// un resplandor de color sobre lo ya pintado (luces de sirena, pantallas)
const resplandor = (cx, cy, r, col, a) => { for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) { const d = Math.hypot(x - cx, (y - cy) * 1.3) / r; if (d < 1 && h(x, y, 9) < (1 - d) * 1.4) R.pset(x, y, mez(R.pget(x, y), col, a * (1 - d * 0.6))); } };
// guarda un trozo de lo pintado y lo repone después (lo que va detrás de algo)
const guardar = (x0, y0, x1, y1) => { const v = []; for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) v.push(R.pget(x, y)); return () => { let i = 0; for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) R.pset(x, y, v[i++]); }; };
// gente pequeña del fondo (12–14 px): piernas que se alternan, cuerpo, cabeza con pelo; o.brazos los levanta, o.salta bota
const PIEL = [hex('#f6c290'), hex('#d48a5a'), hex('#a8643a')];
const persona = (x, suelo, t, cuerpo, pelo, o = {}) => {
  x = Math.round(x); const pa = o.anda ? Math.floor(t * 6 + x * 0.1) % 2 : 0, y = Math.round(suelo - (o.salta ? Math.abs(Math.sin(t * 9 + x)) * 3 : 0)), piel = PIEL[(x >> 3) % 3], d = o.dir ?? 1;
  R.rect(x - 2, y - 4, x - 1, y - pa, C.k); R.rect(x + 1, y - 4, x + 2, y - (1 - pa), C.k);
  R.rect(x - 3, y - 10, x + 3, y - 4, C.k); R.rect(x - 2, y - 9, x + 2, y - 5, cuerpo); R.pset(x - 2, y - 5, mez(cuerpo, C.k, 0.3));
  R.rect(x - 2, y - 15, x + 2, y - 10, C.k); R.rect(x - 1, y - 14, x + 1, y - 11, piel); R.rect(x - 2, y - 15, x + 2, y - 14, pelo); R.pset(x - d, y - 13, pelo); R.pset(x + d, y - 12, C.k);
  if (o.brazos) { R.rect(x - 5, y - 13, x - 4, y - 10, C.k); R.rect(x + 4, y - 13, x + 5, y - 10, C.k); R.pset(x - 5, y - 13, piel); R.pset(x + 5, y - 13, piel); }
  if (o.paraguas) { R.linea(x + 3, y - 9, x + 3, y - 19, C.k); for (let i = -7; i <= 7; i++) { const yy = y - 19 - Math.round(3 * Math.sqrt(Math.max(0, 1 - (i / 7) ** 2))); R.linea(x + 3 + i, yy, x + 3 + i, y - 19, (i + 7) % 4 < 2 ? o.paraguas : C.k); } }
};
// un bocadillo de pensamiento blanco con su rabito de burbujas hacia (cx, cy); dentro se dibuja lo que se piensa
const BL = hex('#f8f6ee'), BLS = hex('#d8d4c8');
const bocadillo = (x0, y0, x1, y1, cx, cy, dibuja) => {
  R.rect(x0 + 2, y0, x1 - 2, y1, C.k); R.rect(x0, y0 + 2, x1, y1 - 2, C.k); R.rect(x0 + 1, y0 + 1, x1 - 1, y1 - 1, C.k);
  R.rect(x0 + 2, y0 + 1, x1 - 2, y1 - 1, BL); R.rect(x0 + 1, y0 + 2, x1 - 1, y1 - 2, BL); R.rect(x0 + 2, y1 - 2, x1 - 2, y1 - 1, BLS);
  const mx = (x0 + x1) / 2; for (const [u, r] of [[0.35, 2], [0.7, 1]]) { const bx = Math.round(lerp(mx, cx, u)), by = Math.round(lerp(y1 + 2, cy, u)); R.disco(bx, by, r + 1, C.k); R.disco(bx, by, r, BL); }
  dibuja();
};
// el mando de una consola de los noventa (centro abajo en x, y); con sirena, la lucecita roja y azul que gira
const mando = (x, y, col, colS, t, sirena = 0) => {
  x = Math.round(x); y = Math.round(y);
  R.rect(x - 9, y - 7, x + 9, y, C.k); R.rect(x - 11, y - 5, x + 11, y + 1, C.k);
  R.rect(x - 8, y - 6, x + 8, y - 1, col); R.rect(x - 10, y - 4, x + 10, y, col); R.rect(x - 10, y, x + 10, y, colS); R.rect(x - 8, y - 6, x + 8, y - 6, mez(col, hex('#ffffff'), 0.4));
  R.rect(x - 8, y - 3, x - 4, y - 3, C.k); R.rect(x - 6, y - 5, x - 6, y - 1, C.k);
  R.pset(x + 4, y - 3, hex('#f0c040')); R.pset(x + 6, y - 5, hex('#5ac83a')); R.pset(x + 8, y - 3, hex('#ff4a4a')); R.pset(x + 6, y - 1, hex('#4a9aff'));
  R.rect(x - 1, y - 3, x, y - 3, colS);
  if (sirena) { const on = Math.floor(t * 7) % 2 && sirena > 0.5; R.rect(x - 3, y - 11, x + 3, y - 6, C.k); R.rect(x - 2, y - 10, x - 1, y - 7, on ? hex('#ff4a4a') : hex('#7a2a34')); R.rect(x + 1, y - 10, x + 2, y - 7, !on && sirena > 0.5 ? hex('#4a9aff') : hex('#26305a')); }
};
// el teléfono de los noventa con el auricular descolgado (la horquilla vacía)
const telefonoCogido = (x, y) => { const rest = guardar(x - 12, y - 17, x - 1, y - 11); G.telefonoNoventa(R, x, y, {}); rest(); R.rect(x - 11, y - 11, x - 10, y - 10, C.k); R.rect(x - 3, y - 11, x - 2, y - 10, C.k); };
// el auricular negro en la mano (hx, hy), con el cable rizado hasta la base (bx, by)
const auricular = (hx, hy, bx, by, dir = 1) => {
  hx = Math.round(hx); hy = Math.round(hy);
  for (let i = 0; i <= 16; i++) { const u = i / 16, x = Math.round(lerp(bx, hx, u)), y = Math.round(lerp(by, hy + 3, u) + Math.sin(u * Math.PI) * 6); R.pset(x, y, C.k); if (i % 2) R.pset(x, y - 1, hex('#4a4856')); }
  R.rect(hx - 2, hy - 5, hx + 1, hy + 4, C.k); R.rect(hx - 3, hy - 6, hx + 2, hy - 4, C.k); R.rect(hx - 3, hy + 3, hx + 2, hy + 5, C.k); R.pset(hx - 1, hy - 5, hex('#4a4856'));
};
const ROJO = hex('#ff4a4a'), AZUL = hex('#4a9aff');

const l = (x) => en('clifford', x);
const P2 = l(0.391), P3 = l(0.8107);
const contrata = l(0.1106), max = l(0.1284), tabloide = l(0.3078), politicos = l(0.5532), quejar = l(0.6168), periodicos = l(0.688), sumar = l(0.7478), jones = l(0.8539), palabra = l(0.9023), cumplio = l(0.9506);
const sin = (t, v = 7) => Math.sin(t * v) > 0;
// la furgoneta del reparto (220 px/s) y los dos fardos que tira por detrás
const v0 = palabra - 0.4, t1 = v0 + 200 / 220, t2 = v0 + 250 / 220, cae = t1 + 0.3;

// el rotulador en la mano canónica del chibi: Clifford lo sostiene (R.actor con sostiene) y la punta toca la pizarra.
// La mano va hacia la punta y se queda a 5 px de ella (el brazo de R.actor llega a 9 px del hombro: la punta, a 14 como
// mucho); el cuerpo del rotulador sale del puño (gris con su contorno), la tapa asoma por detrás y la punta es del color
// de la tinta, justo donde se dibuja
const rotulador = ([mx, my], [tx, ty], col) => {
  const d = Math.hypot(tx - mx, ty - my) || 1, ux = (tx - mx) / d, uy = (ty - my) / d, nx = -uy, ny = ux;
  R.pset(Math.round(mx - ux * 3), Math.round(my - uy * 3), col);
  for (let i = 2; i < d - 0.5; i += 0.5) { const x = mx + ux * i, y = my + uy * i; R.pset(Math.round(x + nx), Math.round(y + ny), C.k); R.pset(Math.round(x), Math.round(y), hex('#e8e8f0')); }
  R.pset(Math.round(tx), Math.round(ty), col); R.pset(Math.round(tx - ux), Math.round(ty - uy), C.k);
};
// un chibi que dibuja con la punta en tip: el hombro de delante está en (x + 12, suelo − 11) mirando a la derecha
const dibujante = (def, x, suelo, t, tip, col, o = {}) => {
  const sx = x + 12, sy = suelo - 11 - (o.anda && Math.floor(t * 5 + x * 0.37) % 2 === 1 ? 1 : 0), dx = tip[0] - sx, dy = tip[1] - sy, d = Math.hypot(dx, dy) || 1, k = Math.max(0, d - 5) / d;
  const cl = R.actor(def, x, suelo, t, { ...o, dir: 1, sostiene: [Math.round(sx + dx * k), Math.round(sy + dy * k)] });
  rotulador(cl.mano, tip, col); return cl;
};
// la punta que recorre un camino de tramos [[x, y], …] según u (0–1), repartido por longitudes
const recorrido = (pts, u) => {
  const L = []; let tot = 0; for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); L.push(l); tot += l; }
  let r = Math.max(0, Math.min(1, u)) * tot; for (let i = 1; i < pts.length; i++) { if (r <= L[i - 1] || i === pts.length - 1) { const f = Math.min(1, r / (L[i - 1] || 1)); return { tip: [lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)], i, f }; } r -= L[i - 1]; }
  return { tip: pts[0], i: 1, f: 0 };
};
// la tinta de un camino hasta u: tramos enteros y el trozo del que se está dibujando (dos píxeles de grueso)
const tinta = (pts, u, col) => {
  if (u <= 0) return; const { tip, i } = recorrido(pts, u);
  const seg = (a, b) => { R.linea(Math.round(a[0]), Math.round(a[1]), Math.round(b[0]), Math.round(b[1]), col); if (a[1] === b[1]) R.linea(Math.round(a[0]), Math.round(a[1]) + 1, Math.round(b[0]), Math.round(b[1]) + 1, col); else R.linea(Math.round(a[0]) + 1, Math.round(a[1]), Math.round(b[0]) + 1, Math.round(b[1]), col); };
  for (let k = 1; k < i; k++) seg(pts[k - 1], pts[k]); seg(pts[i - 1], tip);
};
// la punta de flecha hacia arriba en (x, y) (un tallo que sube a un icono)
const puntaArriba = (x, y, col) => { for (const [a, b] of [[-1, 1], [2, 1], [-2, 2], [3, 2]]) R.pset(x + a, y + b, col); };

// ── 1 · la redacción: el apretón de manos y la primera flecha ──────────────────────────────────────────────────
// la pizarra de ruedas a la altura de Clifford (la del decorado le queda por encima de la cabeza): marco de aluminio,
// el blanco con restos borrados y el reflejo de los fluorescentes, la foto de la caja del juego con celo, notas, imanes,
// la bandeja con los rotuladores y la esponja, y las patas con ruedas. Superficie x 115–191, y 97–151 (tapa la línea de mesas del fondo, como la del decorado); Clifford (suelo
// 163) dibuja en la tira de abajo (y 146–150), con el brazo hacia delante a la altura del pecho, y los iconos aparecen
// encima (hasta y 144), por delante de su cara
const S1 = 163;
const pizarra1 = (t, cogido) => {
  const K = C.k, AL = hex('#c0c4cc'), ALS = hex('#8a8c94'), BLA = hex('#f6f6f2');
  // las patas y las ruedas (detrás de todo lo de la pizarra)
  for (const [x0, x1] of [[119, 116], [187, 190]]) { R.linea(x0, 155, x1, 161, K); R.linea(x0 + 1, 155, x1 + 1, 161, ALS); }
  R.rect(117, 159, 189, 159, ALS); R.rect(117, 160, 189, 160, hex('#5a5e6a'));
  for (const x of [116, 190]) { R.disco(x, 162, 2, K); R.pset(x, 162, AL); }
  R.rect(112, 94, 194, 154, K); R.rect(113, 95, 193, 153, AL); R.rect(113, 95, 193, 95, hex('#e8eaf0')); R.rect(193, 96, 193, 153, ALS); R.rect(113, 153, 193, 153, ALS);
  R.rect(115, 97, 191, 151, BLA);
  for (let y = 98; y < 151; y++) for (let x = 116; x < 191; x++) if (h(x >> 2, y >> 1, 61) < 0.07) R.pset(x, y, hex('#e6e6ee'));
  // restos borrados de otra reunión: un círculo y unas rayas
  for (let a = 0; a < 6.2; a += 0.35) R.pset(Math.round(150 + Math.cos(a) * 9), Math.round(122 + Math.sin(a) * 6), hex('#dedee8'));
  for (let k = 0; k < 3; k++) R.rect(162, 119 + k * 4, 178 - k * 5, 119 + k * 4, hex('#e0e0ea'));
  // el reflejo de los fluorescentes, que tiembla un poco
  const rf = Math.sin(t * 9) > 0.85 ? hex('#ffffff') : hex('#fbfbf8'); for (let i = 0; i < 6; i++) { R.pset(176 + i, 100 + i, rf); R.pset(181 + i, 100 + i, rf); }
  // un recorte de plana con celo y la nota azul de arriba
  caja(142, 99, 156, 111, hex('#f2ecd8')); R.rect(143, 100, 155, 102, hex('#d8303a')); R.rect(144, 104, 154, 104, K); R.rect(144, 106, 150, 107, hex('#5a5868')); R.rect(151, 106, 154, 106, hex('#8a8a96')); R.rect(146, 97, 152, 98, hex('#e8e0b0'));
  R.rect(162, 100, 169, 107, hex('#a0e0f8')); R.rect(162, 107, 169, 107, mez(hex('#a0e0f8'), K, 0.3)); R.rect(163, 102, 168, 102, mez(hex('#a0e0f8'), K, 0.45)); R.rect(163, 104, 166, 104, mez(hex('#a0e0f8'), K, 0.45));
  // la foto de la caja del juego, con dos tiras de celo
  G.cajaJuego(R, 126, 143, { color: '#3a6ad8' }); R.rect(114, 113, 119, 115, hex('#e8e0b0')); R.rect(132, 113, 137, 115, hex('#e8e0b0')); R.pset(119, 115, hex('#c8c09a')); R.pset(137, 115, hex('#c8c09a'));
  // notas adhesivas (la de arriba aletea con el aire) e imanes
  const al = Math.sin(t * 5) > 0.6 ? 1 : 0;
  for (const [x, y, col] of [[178, 124, hex('#f8e870')], [184, 133, hex('#f8a0c8')]]) { R.rect(x, y, x + 6, y + 6, col); R.rect(x, y + 6, x + 6, y + 6, mez(col, K, 0.3)); R.rect(x + 1, y + 2, x + 5, y + 2, mez(col, K, 0.45)); R.rect(x + 1, y + 4, x + 3, y + 4, mez(col, K, 0.45)); }
  R.rect(178, 124 - al, 184, 124 - al, hex('#fff8b0'));
  for (const [x, y, col] of [[120, 100, ROJO], [134, 100, AZUL], [188, 100, hex('#3ac85a')]]) { R.disco(x, y, 2, K); R.disco(x, y, 1, col); R.pset(x - 1, y - 1, hex('#ffffff')); }
  // la bandeja: los rotuladores (el rojo, hasta que Clifford lo coge) y la esponja
  R.rect(113, 154, 193, 156, K); R.rect(114, 154, 192, 155, hex('#a8acb4'));
  for (const [x, col, k] of [[131, ROJO, 1], [139, AZUL, 0], [147, hex('#2a2832'), 0]]) { if (k && cogido) continue; R.rect(x, 153, x + 5, 154, K); R.rect(x + 1, 153, x + 4, 153, hex('#e8e8f0')); R.pset(x + 5, 153, col); }
  R.rect(176, 151, 186, 154, K); R.rect(177, 152, 185, 153, hex('#3a3a46')); R.rect(177, 152, 185, 152, hex('#c8a87a'));
};
// los dos iconos que aparecen en lo alto de cada tallo: la plana del tabloide (cabecera roja, titular de barras y un
// cochecito) y un político (silueta con su escarapela roja)
const planaIcono = (x, y) => { R.rect(x - 7, y - 11, x + 7, y, C.k); R.rect(x - 6, y - 10, x + 6, y - 1, hex('#f2ecd8')); R.rect(x - 6, y - 10, x + 6, y - 8, hex('#d8303a')); R.rect(x - 5, y - 6, x + 5, y - 6, C.k); R.rect(x - 5, y - 4, x - 1, y - 2, hex('#5a5868')); R.rect(x + 1, y - 4, x + 5, y - 4, hex('#8a8a96')); R.rect(x + 1, y - 2, x + 4, y - 2, hex('#8a8a96')); };
const politicoIcono = (x, y) => { R.disco(x, y - 9, 3, C.k); R.rect(x - 4, y - 5, x + 4, y, C.k); R.pset(x - 1, y - 10, hex('#f8f6ee')); R.pset(x + 2, y - 3, ROJO); R.pset(x + 2, y - 4, ROJO); };
// el camino de la punta: baja de la foto de la caja, corre por la tira y sube a la plana; luego sigue y sube al político
const CAM1 = [[137, 146], [137, 149], [158, 149], [158, 146]], CAM1B = [[158, 149], [178, 149], [178, 146]];
const p1 = (t) => {
  const o = { encuadre: 'redaccion', pizarra: false, suena: t > 0.3 && t < 1.6 };
  const g = T.londres(R, t, o) || {}, ms = g.mesaSuelo ?? 158;

  const a = tramo(t, 0.7, contrata), b = tramo(t, contrata + 1.4, contrata + 2.1), mano = t > contrata && t < contrata + 1.2;
