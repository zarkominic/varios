<body>
<canvas id="lienzo"></canvas>
<script type="module">
// OV-TRIANGULO (frases 35–36). Noche: una valla con focos; dos agentes miran arriba; un triángulo negro tapa las estrellas al
// pasar, sin ruido. Luego el cielo vuelve a quedar estrellado y vacío; «?».
import { preparar, rodar, instalacion } from '/atomo/plato/escenas/ov-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await preparar('ov-triangulo');
const { tramo } = R;
const m = { t: M('triangulo', 0.5), n: M('nadie2', 12.4) };
const pasa = (t) => tramo(t, m.t + 2, m.n - 0.5);
const plano = (t) => {
  const p = pasa(t); instalacion(R, t, { tri: p > 0 && p < 1 ? p : null });
  R.actor(EL.agente, 180, 150, t, { dir: -1, sorpresa: p > 0.2 && p < 1, dedo: p > 0.3 && p < 0.9 });
  R.actor(EL.agenta, 204, 150, t + 1, { dir: -1, sorpresa: p > 0.25 && p < 1 });
  if (t > m.n + 1.5) R.icono('?', 154, 36, undefined, undefined, 4);
};
rodar(E, R, [[0, plano]], { efectos: [[m.n + 1.5, 'pop']], año: 2026 });
</script>
