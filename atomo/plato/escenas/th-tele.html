<script type="module">
// TH-TELE (frase 26). Tres planos:
// 1. el plató: la regidora, con cascos, cuenta con la mano, da paso y se aparta; se enciende la luz roja de «en el aire»;
//    el entrevistador pregunta y la pértiga del micro pasa de él a ella; Holmes contesta tranquila y, con «the story is
//    wrong», levanta el dedo; el cámara, detrás de la suya, sigue la toma;
// 2. el laboratorio: la técnica pipetea en su carrito y el técnico cruza con una gradilla; entran los inspectores
//    federales con sus carpetas («federal inspectors»), el técnico se para y retrocede; la inspectora fotografía los
//    analizadores (dos flashes) y el inspector abre la carpeta y repasa las Edison; con «they find» las señala y, con
//    «serious problems», salta un «!» rojo sobre cada una y la pantalla de controles se llena de puntos rojos;
// 3. el pasillo del laboratorio (2016): techo de placas con sus plafones (el de encima de la puerta parpadea), el cartel
//    verde de salida, la cámara que vigila la puerta, los pictogramas, el pulsador de alarma y el extintor, el banco con
//    una bata olvidada y las cajas de pruebas precintadas; por el ventanal se ve el laboratorio, que un técnico cruza con
//    una caja. Sale una técnica con su caja de cosas, el del correo pasa con su carro y el del café espera su vaso; la
//    inspectora pasa la cadena por las barras de la puerta («ban her») y cierra el candado, que se queda balanceándose;
//    con «running one» el laboratorio se apaga por zonas (solo quedan la nevera y los pilotos), las ventanillas se
//    oscurecen y la máquina de café se apaga también: el del café le da un manotazo y vuelve a encenderse (gag); el del
//    correo se para a mirar; el inspector pega el aviso con la «X» y la balanza, y con «two years» las agujas del reloj
//    dan vueltas y el calendario pasa de 2016 a 2018; los inspectores se van.
import * as T from '/atomo/plato/escenas/th-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('th-tele');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const a = (f) => en('tele', f);
const P2 = a(0.3), P3 = a(0.7);
const K = T.C.k;
const lin = (t, x0, x1) => Math.min(1, Math.max(0, (t - x0) / (x1 - x0)));
// recorrido por fotogramas clave [t, x, suelo?]: dónde está, si anda y hacia dónde fue la última vez que anduvo
const ruta = (t, kf, d0 = 1) => { let d = d0; const s0 = kf[0][2] ?? 0; if (t < kf[0][0]) return { x: kf[0][1], s: s0, mv: false, d };
  for (let i = 0; i + 1 < kf.length; i++) { const [t0, x0, sa = s0] = kf[i], [t1, x1, sb = sa] = kf[i + 1]; if (x1 !== x0) d = x1 < x0 ? -1 : 1; if (t < t1) { const u = (t - t0) / (t1 - t0); return { x: Math.round(lerp(x0, x1, u)), s: Math.round(lerp(sa, sb, u)), mv: x1 !== x0 || sb !== sa, d }; } }
  const u = kf[kf.length - 1]; return { x: u[1], s: u[2] ?? s0, mv: false, d }; };
const carpeta = (x, y, abierta) => { if (abierta) { R.rect(x - 4, y, x + 8, y + 7, K); R.rect(x - 3, y + 1, x + 1, y + 6, hex('#f4f0e4')); R.rect(x + 3, y + 1, x + 7, y + 6, hex('#f4f0e4')); R.rect(x + 2, y + 1, x + 2, y + 6, T.C.ocre); for (let l = 0; l < 3; l++) { R.rect(x - 2, y + 2 + l * 2, x, y + 2 + l * 2, hex('#9aa0ac')); R.rect(x + 4, y + 2 + l * 2, x + 6, y + 2 + l * 2, hex('#9aa0ac')); } }
  else { R.rect(x, y, x + 6, y + 8, K); R.rect(x + 1, y + 1, x + 5, y + 7, T.C.ocre); R.rect(x + 1, y + 3, x + 5, y + 3, T.C.ocreS ?? hex('#a87430')); } };

// ── 1 · el plató ──────────────────────────────────────────────────────────────────────────────────────────────────
const AIRE = 0.45, PREGUNTA = [0.6, 1.4], CONTESTA = 1.5, EQUIVOCA = a(0.244);
const p1 = (t) => {
  T.plato(R, t);
  // el fondo del plató también vive: ventanitas que se encienden y se apagan
  for (let k = 0; k < 12; k++) { const x = 40 + ((k * 53) % 240), y = 84 + ((k * 29) % 30); if (Math.sin(t * 1.3 + k * 2.7) > 0.2) R.pset(x, y, hex('#f0e0a0')); }
  // la luz de «en el aire», colgada del techo: se enciende cuando la regidora da paso
  { const on = t > AIRE; R.linea(204, 0, 204, 21, T.C.metalD); R.rect(192, 21, 216, 29, K); R.rect(193, 22, 215, 28, on ? T.C.rojo : hex('#4a2a2a')); if (on) { R.disco(198, 25, 1, Math.floor(t * 2) % 2 ? hex('#ff8a8a') : T.C.rojo); R.disco(210, 25, 1, Math.floor(t * 2 + 1) % 2 ? hex('#ff8a8a') : T.C.rojo); } }
  // el entrevistador pregunta; ella contesta tranquila y, con «wrong», levanta el dedo
  const pregunta = t > PREGUNTA[0] && t < PREGUNTA[1], contesta = t > CONTESTA;
  R.actor(EL.holmes, 103, 140, t, { dir: 1, habla: contesta && Math.sin(t * 6) > 0, sonrisa: !contesta, dedo: t > EQUIVOCA - 0.2 && t < EQUIVOCA + 0.7 });
  R.actor(EL.periodista, 183, 140, t, { dir: -1, habla: pregunta && Math.sin(t * 7) > 0, dedo: t > 0.8 && t < 1.3 });
  // la regidora, con cascos, cuenta con la mano, da paso y se va por detrás de la cámara
  { const q = ruta(t, [[0.7, 232], [1.8, 330]]); R.actor(EL.chica, q.x, 170, t, { dir: q.mv ? 1 : -1, anda: q.mv, tocado: 'auriculares', dedo: t < 0.55 && Math.floor(t * 6) % 2 === 0, sonrisa: t > AIRE }); }
  // el cámara, detrás de la cámara de la izquierda
  R.actor(EL.sudadera, 2, 160, t, { dir: 1, tocado: 'auriculares', dedo: t > 2.6 && t < 3.0 });
  // la pértiga del micrófono: pasa de quien pregunta a quien contesta
  { const mx = Math.round(lerp(190, 116, tramo(t, 1.2, 1.8)) + Math.sin(t * 1.7) * 2), my = 100 + Math.round(Math.sin(t * 2.3)); R.linea(-4, 34, mx - 4, my - 2, K); R.linea(-4, 35, mx - 4, my - 1, T.C.metalD);
    R.rect(mx - 5, my - 3, mx + 5, my + 2, K); R.rect(mx - 4, my - 2, mx + 4, my + 1, hex('#8a8a96')); for (let i = -4; i <= 4; i += 2) R.pset(mx + i, my - 2, hex('#b8b8c4')); }
  T.platoCamaras(R, t);
};

// ── 2 · los inspectores en el laboratorio ─────────────────────────────────────────────────────────────────────────
const ENCUENTRAN = a(0.574), GRAVES = a(0.624), FLASH = [P2 + 2.7, P2 + 3.4];
const p2 = (t) => {
  T.laboratorio(R, t, { rojo: t > GRAVES - 0.1 });
  // «!» rojos que saltan sobre las Edison, una tras otra
  [18, 52, 86].forEach((x, k) => { const u = lin(t, GRAVES - 0.35 + k * 0.2, GRAVES - 0.2 + k * 0.2); if (u > 0) { const y = Math.round(84 - Math.sin(u * Math.PI) * 4); R.disco(x, y + 3, 5, K); R.disco(x, y + 3, 4, T.C.rojo); R.rect(x, y, x, y + 3, T.C.blanco); R.pset(x, y + 5, T.C.blanco); } });
  // el carrito de la técnica con su gradilla
  R.rect(50, 150, 76, 152, K); R.rect(51, 151, 75, 151, T.C.metalL); R.rect(52, 152, 53, 166, T.C.metalD); R.rect(73, 152, 74, 166, T.C.metalD); R.rect(52, 160, 74, 160, T.C.metalD);
  for (let k = 0; k < 5; k++) { R.rect(56 + k * 4, 144, 57 + k * 4, 150, T.C.blanco); R.pset(56 + k * 4, 144, [T.C.rojoW, T.C.tealT, T.C.amarilloT][k % 3]); if (k < 3) R.pset(56 + k * 4, 149, T.C.sangre); }
  const viene = t > P2 + 0.8;
  // la técnica pipetea; cuando entran, se para y mira
  { const pip = !viene || t > GRAVES + 0.6, py = 140 + (pip ? Math.round(Math.abs(Math.sin(t * 3)) * 3) : -2); R.actor(EL.erika, 34, 162, t, { dir: 1, sorpresa: viene && t < P2 + 1.6 || t > GRAVES && t < GRAVES + 0.5, habla: t > P2 + 2.6 && t < P2 + 3.2 && Math.sin(t * 7) > 0, triste: t > GRAVES + 0.5 });
    R.rect(58, py - 6, 60, py - 3, K); R.pset(59, py - 5, hex('#5a9ad8')); R.rect(59, py - 3, 59, py + 3, hex('#e8eef4')); }
  // el técnico cruza con una gradilla, ve a los inspectores y retrocede
  { const q = ruta(t, [[P2 - 0.2, 66], [P2 + 0.9, 124], [P2 + 1.3, 124], [P2 + 2.0, 100]]); const gira = t > P2 + 2.4 && t < P2 + 3.2;
    R.actor(EL.tecnico, q.x, 166, t, { dir: gira ? -1 : 1, anda: q.mv, sorpresa: t > P2 + 0.9 && t < P2 + 1.6 || t > GRAVES && t < GRAVES + 0.4, habla: gira && Math.sin(t * 8) > 0, triste: t > GRAVES + 0.4 });
    const gx = gira ? q.x - 9 : q.x + 12; R.rect(gx, 150, gx + 11, 155, K); R.rect(gx + 1, 151, gx + 10, 154, T.C.metalL); for (let k = 0; k < 4; k++) { R.rect(gx + 1 + k * 3, 145, gx + 2 + k * 3, 150, T.C.blanco); R.pset(gx + 1 + k * 3, 145, [T.C.rojoW, T.C.tealT, T.C.amarilloT, T.C.verdeT][k]); } }
  // el inspector: entra con la carpeta, la abre, repasa las Edison y las señala
  { const q = ruta(t, [[P2 + 0.3, 340], [P2 + 1.8, 168], [P2 + 2.1, 168], [P2 + 2.9, 140]]), abre = t > P2 + 2.0, senala = t > ENCUENTRAN && t < GRAVES + 0.6;
    R.actor(EL.agente, q.x, 168, t, { dir: -1, anda: q.mv, dedo: senala, enfado: t > GRAVES }); if (!senala) carpeta(abre ? q.x - 6 : q.x - 2, 152, abre); R.rect(q.x + 9, 158, q.x + 10, 159, T.C.oro); }
  // la inspectora: entra detrás, levanta la cámara y fotografía los analizadores
  { const q = ruta(t, [[P2 + 0.7, 350], [P2 + 2.1, 214]]), foto = t > P2 + 2.3 && t < P2 + 3.8;
    R.actor(EL.agenta, q.x, 164, t, { dir: foto ? 1 : -1, anda: q.mv }); if (foto) { R.rect(q.x + 12, 143, q.x + 18, 148, K); R.rect(q.x + 13, 144, q.x + 17, 147, hex('#3a3e48')); R.pset(q.x + 18, 145, hex('#8ac0e0')); } else carpeta(q.x - 3, 150, false); R.rect(q.x + 9, 154, q.x + 10, 155, T.C.oro);
    for (const f of FLASH) { const d = t - f; if (d > 0 && d < 0.18) { const fx = q.x + 19, r = 2 + Math.round(d * 40); for (let g = 0; g < 6.28; g += 0.4) R.pset(Math.round(fx + Math.cos(g) * r), Math.round(145 + Math.sin(g) * r), T.C.blanco); R.disco(fx, 145, 2, T.C.blanco); T.tinte(R, 30, 140, [255, 255, 255], 0.18 * (1 - d / 0.18)); } } }
};

// ── 3 · el pasillo del laboratorio (2016): la cadena, el candado, las luces y el calendario ──────────────────────────
const SALE = P3 + 0.15, CADENA = a(0.77), CANDADO = a(0.81), APAGA = a(0.868), AVISO = a(0.9), DOS = a(0.949);
const TAZA0 = P3 + 0.15, CHORRO = [P3 + 0.35, P3 + 1.25], TOMA = P3 + 1.45;   // el café: sale el vaso, cae el chorro y lo coge
const MUERE = APAGA + 0.36, GOLPE = APAGA + 0.62;   // la máquina de café se apaga con el laboratorio; el manotazo la revive
const hsh = (k, s) => { const v = Math.sin(k * 127.1 + s * 311.7) * 43758.5453; return v - Math.floor(v); };
const mezcla = (c, d, f) => { const r = c & 255, g = (c >> 8) & 255, b = (c >> 16) & 255;
  return (0xff000000 | (Math.round(b + (((d >> 16) & 255) - b) * f) << 16) | (Math.round(g + (((d >> 8) & 255) - g) * f) << 8) | Math.round(r + ((d & 255) - r) * f)) >>> 0; };
const velo = (x0, y0, x1, y1, col, f, paso = 1) => { for (let y = Math.max(0, y0); y <= Math.min(179, y1); y++) for (let x = Math.max(0, x0); x <= Math.min(319, x1); x++) if (paso === 1 || (x + y) % paso === 0) R.pset(x, y, mezcla(R.pget(x, y), col, f)); };
// lo que no se mueve se pinta una sola vez en un búfer aparte y en cada fotograma se copia entero
const capas = new Map();
const capa = (clave, dibuja) => { let b = capas.get(clave); if (!b) { b = R.nuevo(); const prev = R.usar(b); dibuja(); R.usar(prev); capas.set(clave, b); } return b; };
const PS = Object.fromEntries(Object.entries({
  techo: '#c6d2cc', techoS: '#b4c0ba', techoL: '#d6e0db', cornisa: '#a9b6b0', pared: '#d6e2dc', paredS: '#cad7d0', paredL: '#e8f1ec', junta: '#bccbc4',
  guarda: '#9fb2aa', guardaL: '#bfcfc8', guardaS: '#7e928a', zocalo: '#adc0b8', zocaloS: '#9aaea6', zocaloL: '#c0d1ca', rodapie: '#5e6e68', rodapieL: '#7a8a84',
  suelo: '#aabab6', sueloS: '#98a8a4', sueloJ: '#9eaeaa', sueloL: '#c2d0cc', brillo: '#d2dedb',
  marco: '#7a8a94', marcoL: '#a0aeb8', marcoS: '#5a6872', hoja: '#c4d0d8', hojaL: '#dce6ec', hojaS: '#a4b2bc', chapa: '#8a96a6', chapaL: '#b0bac8',
  cafe: '#3a2c2c', cafeS: '#2a1e1e', cafeL: '#5a4444', cafeR: '#b8382c', nicho: '#160e0e', calido: '#f0b870',
  lab: '#cfe0ea', labS: '#b4c8d6', labT: '#e6eef2', labSuelo: '#98aab6', noche: '#141c2e', caja: '#c89a5a', cajaS: '#a07440', cajaL: '#dcb47a',
}).map(([k, v]) => [k, hex(v)]));
// los pictogramas (sin letras): el hombrecillo que corre de la salida y su flecha, el riesgo biológico y los guantes
const CORRE = ['..##..', '..##..', '.###..', '#.###.', '..#..#', '.#.#..', '#...#.'], FLECHA = ['..#..', '.##..', '#####', '.##..', '..#..'];
const BIO = ['.....k.....', '....kYk....', '....kkk....', '...kYkYk...', '...kYYYk...', '..kYYkYYk..', '..kYkYkYk..', '.kYkYYYkYk.', '.kYkkYkkYk.', 'kkkkkkkkkkk'];
const GUANTES = ['...kkkkk...', '..kBBBBBk..', '.kBWBWBWBk.', 'kBBWBWBWBBk', 'kBBWBWBWBBk', 'kBWWWWWWBBk', 'kBBWWWWWBBk', 'kBBWWWWWBBk', '.kBBWWWBBk.', '..kBBBBBk..', '...kkkkk...'];
const PICTO = { k: K, Y: T.C.amarilloT, B: hex('#2a5ab8'), W: T.C.blanco };
// un plafón del techo (encendido o no) y el cono de su luz en la pared (solo sobre la pintura, por debajo de lo colgado)
const plafon = (x0, x1, on) => { R.rect(x0, 8, x1, 13, K); R.rect(x0 + 1, 9, x1 - 1, 12, on ? T.C.blanco : PS.techoS); for (let x = x0 + 5; x < x1; x += 5) R.rect(x, 9, x, 12, on ? hex('#e4ecf0') : PS.techo); };
const conoPared = (x0, x1) => { for (let y = 17; y < 74; y++) { const e = (y - 17) * 0.55, p = 0.75 * (1 - (y - 17) / 57);
  for (let x = Math.round(x0 - e); x <= Math.round(x1 + e); x++) if ((x + y) % 2 === 0 && hsh(x, y) < p) { const c = R.pget(x, y); if (c === PS.pared || c === PS.paredS) R.pset(x, y, PS.paredL); } } };
// la parte fija del pasillo: techo de placas con sus plafones buenos, el cartel de salida, la cámara y el detector; la
// pared con su gotelé, los conos de luz, el pasamanos, el friso rozado y el rodapié; el suelo de vinilo con juntas,
// brillos, rayas de ruedas, el reflejo de la puerta y la franja amarilla y negra; el banco con la bata y las gafas
// olvidadas, las cajas de pruebas precintadas, los pictogramas, el pulsador de alarma y el armario del extintor; el marco
// de acero de la puerta doble, el cartel del tubo y la gota, la lámpara de «en uso» y el lector de tarjetas; la máquina
// de café, la papelera y la maceta
const pasilloFijo = () => {
  const { rect, pset, linea } = R;
  rect(0, 0, 319, 13, PS.techo); for (let x = 16; x < 320; x += 32) rect(x, 0, x, 13, PS.techoS); rect(0, 7, 319, 7, PS.techoS);
  for (let k = 0; k < 120; k++) { const x = Math.floor(hsh(k, 1) * 320), y = Math.floor(hsh(k, 2) * 13); if (x % 32 !== 16 && y !== 7) pset(x, y, hsh(k, 3) < 0.5 ? PS.techoS : PS.techoL); }
  for (const x of [96, 220]) { rect(x - 1, 12, x + 1, 12, T.C.metalS); pset(x, 11, T.C.metalD); }   // los rociadores
  rect(0, 14, 319, 16, PS.cornisa); rect(0, 14, 319, 14, PS.techoL); rect(0, 16, 319, 16, PS.junta);
  rect(0, 17, 319, 94, PS.pared); for (let k = 0; k < 320; k++) pset(Math.floor(hsh(k, 4) * 320), 17 + Math.floor(hsh(k, 5) * 78), PS.paredS);
  for (let x = 8; x < 320; x += 48) { rect(x, 17, x, 94, PS.junta); rect(x + 1, 17, x + 1, 94, PS.paredL); }
  for (const [x0, x1] of [[30, 66], [128, 164], [250, 274]]) { plafon(x0, x1, true); conoPared(x0, x1); }
  rect(176, 9, 180, 11, T.C.metalL); pset(178, 12, T.C.metalS);   // el detector de humo
  rect(240, 14, 242, 17, T.C.metalD); rect(234, 17, 244, 21, K); rect(235, 18, 243, 20, hex('#e8ecf0')); rect(232, 18, 234, 20, hex('#2a2e38')); pset(232, 19, hex('#6a8ab8'));   // la cámara, que mira la puerta
  // el cartel de salida colgado del techo, con su resplandor verde
  rect(9, 14, 9, 17, T.C.metalD); rect(27, 14, 27, 17, T.C.metalD);
  for (let y = 15; y < 34; y++) for (let x = 0; x < 38; x++) if ((x + y) % 3 === 0 && Math.hypot(x - 18, (y - 22) * 1.6) < 18) pset(x, y, hex('#c8e8d4'));
  rect(4, 17, 32, 27, K); rect(5, 18, 31, 26, hex('#2a9a5a')); rect(5, 18, 31, 18, hex('#4aba7a')); R.dibujo(CORRE, 21, 19, 1, { '#': T.C.blanco }); R.dibujo(FLECHA, 10, 20, 1, { '#': T.C.blanco });
  // el pasamanos con sus soportes, el friso con rozaduras de carros y el rodapié
  rect(0, 95, 319, 98, PS.guarda); rect(0, 95, 319, 95, PS.guardaL); rect(0, 98, 319, 98, PS.guardaS); for (let x = 28; x < 320; x += 56) { rect(x, 96, x + 2, 97, PS.guardaS); pset(x + 1, 96, PS.guardaL); }
  rect(0, 99, 319, 132, PS.zocalo); rect(0, 99, 319, 100, PS.zocaloS);
  for (let x = 12; x < 320; x += 24) { rect(x, 101, x, 132, PS.zocaloS); rect(x + 1, 101, x + 1, 132, PS.zocaloL); }
  for (let k = 0; k < 18; k++) { const x = Math.floor(hsh(k, 6) * 312), y = 116 + Math.floor(hsh(k, 7) * 15); rect(x, y, x + 2 + (k % 4), y, PS.zocaloS); }
  rect(0, 133, 319, 140, PS.rodapie); rect(0, 133, 319, 133, PS.rodapieL); rect(0, 140, 319, 140, K);
  // el suelo: juntas en perspectiva, sombra al pie de la pared, brillos de los plafones, rayas de suelas y de ruedas y el
  // reflejo de la puerta; delante de ella, la franja amarilla y negra
  rect(0, 141, 319, 179, PS.suelo); rect(0, 141, 319, 142, PS.sueloS); for (const y of [148, 158, 171]) rect(0, y, 319, y, PS.sueloJ);
  for (let k = -6; k <= 16; k++) { const xa = 8 + k * 26; linea(xa, 143, Math.round(160 + (xa - 160) * 1.9), 179, PS.sueloJ); }
  for (const [x, y, w] of [[34, 162, 26], [96, 166, 22], [240, 162, 24], [190, 175, 30], [8, 176, 20]]) { rect(x, y, x + w, y, PS.brillo); rect(x + 4, y + 2, x + w - 6, y + 2, PS.brillo); }
  for (let k = 0; k < 10; k++) { const x = Math.floor(hsh(k, 8) * 300) + 6, y = 150 + Math.floor(hsh(k, 9) * 27); rect(x, y, x + 3 + (k % 4), y, PS.sueloS); }
  for (let y = 145; y < 158; y++) for (let x = 123; x <= 197; x++) if (Math.abs(x - 160) > 1 && (x + y) % 2 === 0 && hsh(x, y) < 0.8 - (y - 145) * 0.06) pset(x, y, PS.sueloL);
