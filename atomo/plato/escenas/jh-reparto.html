<script type="module">
// JH-REPARTO (frases 27–28), Juegos 50. Cuatro planos:
// 1. el plató a oscuras: Haymitch joven entra por la izquierda; en «Haymitch» se enciende el foco y en la pantalla su
//    silueta de rizos; en «Zada» saluda al público, que aplaude, y cae confeti;
// 2. (corte en «and Lenore») la Pradera junto a la alambrada, de tarde (fondo propio, no el lago de jh-cosecha ni de
//    jh-cancion): la alambrada en diagonal con el bosque detrás y el sol entre los pinos, el sendero al agujero de la
//    malla, flores, la roca, dos casuchas que humean a lo lejos, un sinsajo que canta en un poste y dos gansos que pacen;
//    Lenore Dove canta; Haymitch llega con una flor; en «loves» sale un corazón; en «Whitney Peak» un ganso de Lenore le
//    pica la bota y él da un salto;
// 3. (corte en «McKenna») el balcón del Capitolio: Maysilee sale por el ventanal y se pone lejos de Haymitch, de morros;
//    entre los dos, el hueco; un pájaro rosa de caramelo cruza el hueco; en «tribute» la multitud aplaude;
// 4. (corte al final de «tribute») la calle de la Veta en perspectiva desde lo alto de la esquina (fondo propio en 3D,
//    no la fachada de frente de jh-cosecha): la valla y otra fila de casas a la izquierda, tejados de chapa con estufas
//    que humean, el farol, la mina al fondo con la rueda que gira, ropa tendida, un gato en la valla, un minero que sube;
//    Haymitch, en el escalón junto a su puerta entornada, tira una piedrecita al aire; Maysilee, de rosa, salta el cubo
//    de carbón en «town girl»; en «nothing like him» él sonríe, una gallina sale de debajo del escalón y cruza entre los
//    dos, y ella se va muy digna calle abajo.
import * as T from '/atomo/plato/escenas/jh-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('jh-reparto');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const mez = (c1, c2, k) => { let r = 0; for (const s of [0, 8, 16]) r |= Math.round(((c1 >>> s) & 255) * (1 - k) + ((c2 >>> s) & 255) * k) << s; return (r | 0xff000000) >>> 0; };
const hh = (a, b, c = 0) => { let n = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1274126177); n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };
const rr = (x0, y0, x1, y1, c) => { for (let y = Math.round(y0); y <= Math.round(y1); y++) for (let x = Math.round(x0); x <= Math.round(x1); x++) R.pset(x, y, c); };
const aclara = (x, y, k, col = 0xffffffff) => { const c = R.pget(x, y); if (c) R.pset(x, y, mez(c, col, k)); };
const K0 = hex('#14101c');
R.ICONOS.corazon = ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'];
R.ICONOS.nota = ['..##', '..#.', '..#.', '..#.', '###.', '###.'];
// un cono de luz desde arriba (foco): aclara lo que ya está pintado
const foco = (xc, y0, y1, w0, w1, k = 0.28, col = hex('#fff6d8')) => { for (let y = Math.max(0, y0); y <= Math.min(179, y1); y++) { const u = (y - y0) / Math.max(1, y1 - y0), w = w0 + (w1 - w0) * u; for (let x = Math.round(xc - w); x <= Math.round(xc + w); x++) aclara(x, y, Math.abs(x - xc) > w - 1.5 ? k * 0.45 : k, col); } };
// charco de luz en el suelo
const charco = (xc, yc, rx, ry, k = 0.3, col = hex('#fff6d8')) => { for (let y = Math.round(yc - ry); y <= Math.round(yc + ry); y++) for (let x = Math.round(xc - rx); x <= Math.round(xc + rx); x++) { const u = (x - xc) / rx, v = (y - yc) / ry, d = u * u + v * v; if (d <= 1) aclara(x, y, d > 0.7 ? k * 0.5 : k, col); } };
// un pájaro pequeño que vuela (alas arriba y abajo); col, colS, pico
const pajarito = (x, y, t, dir, col, colS, pico = hex('#f0b030'), aleteo = true) => {
  x = Math.round(x); y = Math.round(y); const ala = aleteo ? Math.floor(t * 12) % 2 : 1, X = (i) => x + dir * i;
  for (let i = -3; i <= 3; i++) for (let j = -2; j <= 2; j++) if (i * i / 10 + j * j / 4 <= 1) R.pset(X(i), y + j, j > 0 ? colS : col);
  for (let i = -4; i <= 4; i++) for (let j = -3; j <= 3; j++) if (i * i / 16 + j * j / 7 <= 1 && !(i * i / 10 + j * j / 4 <= 0.6)) { const c = R.pget(X(i), y + j); if (c !== col && c !== colS) R.pset(X(i), y + j, K0); }
  R.pset(X(2), y - 1, K0); R.pset(X(4), y, pico); R.pset(X(5), y, pico); R.pset(X(-4), y - 1, colS); R.pset(X(-5), y - 2, colS);
  if (ala) { R.linea(X(-1), y - 1, X(-3), y - 5, K0); R.linea(X(0), y - 1, X(-2), y - 5, colS); R.pset(X(-1), y - 4, col); }
  else { R.linea(X(-1), y + 1, X(-3), y + 4, K0); R.linea(X(0), y + 1, X(-2), y + 4, colS); }
};
// confeti que cae (fuera de la barra del año y de la esquina de Atom)
const confeti = (t, n, x0, x1, y0, y1, semilla = 1, desde = 0) => { if (t < desde) return; const cols = [hex('#ff5aa8'), hex('#3ad0c8'), hex('#ffd84a'), hex('#a86aff'), hex('#8ae04a'), hex('#ffffff')];
  for (let i = 0; i < n; i++) { const vel = 18 + hh(i, 2, semilla) * 22, x = Math.round(x0 + hh(i, 1, semilla) * (x1 - x0) + Math.sin(t * 3 + i) * 3), y = Math.round(y0 + ((hh(i, 3, semilla) * (y1 - y0) + (t - desde) * vel) % (y1 - y0)));
    if (y < 16 || (x > 274 && y < 48)) continue; const c = cols[i % 6]; R.pset(x, y, c); if (Math.floor(t * 8 + i) % 2) R.pset(x + 1, y, mez(c, K0, 0.3)); else R.pset(x, y + 1, mez(c, K0, 0.3)); } };

const a = (f) => en('zada', f), g = (f) => en('grace', f);
const P2 = a(0.418), P3 = g(0), P4 = g(0.631);
const HAY = a(0.032), ZADA = a(0.195), LOVES = a(0.697), PEAK = a(0.839);
const MAY = g(0.15), TRIB = g(0.544), TOWN = g(0.726), NADA = g(0.85);
// la silueta de Haymitch en la pantalla: hombros, cuello, cabeza y rizos, con el filo dorado
const siluetaRizos = (cx, base, cuerpo, filo) => {
  const hombros = (d) => [[cx - 34 - d, base + 2], [cx - 28 - d, base - 14 - d], [cx - 12, base - 21 - d], [cx + 12, base - 21 - d], [cx + 28 + d, base - 14 - d], [cx + 34 + d, base + 2]];
  const cab = (d) => { R.disco(cx, base - 36, 13 + d, d ? filo : cuerpo); for (let k = 0; k < 9; k++) { const an = Math.PI * (1.05 + k * 0.11); R.disco(cx + Math.cos(an) * 13, base - 38 + Math.sin(an) * 13, 5 + d, d ? filo : cuerpo); } };
  R.poligono(hombros(1), filo); cab(1); R.poligono(hombros(0), cuerpo); rr(cx - 6, base - 26, cx + 6, base - 18, cuerpo); cab(0);
};
const pantallaHaymitch = (R_, t, [x0, y0, x1, y1]) => {
  const on = tramo(t, HAY - 0.1, HAY + 0.35);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    if (on < 1 && hh(x, y, Math.floor(t * 15)) > on) { const v = hh(y, x, Math.floor(t * 15) + 7); R.pset(x, y, v > 0.5 ? hex('#8a8aa0') : hex('#3a3a4a')); continue; }
    const u = (y - y0) / (y1 - y0), ray = Math.sin((x - 160) * 0.09 + t * 0.6) > 0.55 && (x + y) % 2 === 0;
    R.pset(x, y, ray ? mez(hex('#3a5ac8'), hex('#5ad0e8'), u) : mez(hex('#1a1a5a'), hex('#2a7aa8'), u));
  }
  if (on > 0.5) { siluetaRizos(160, y1 + 2, hex('#0c0a18'), Math.sin(t * 6) > 0 ? hex('#ffd84a') : hex('#f0b030'));
    if (t > ZADA) for (let i = 0; i < 8; i++) { const an = i / 8 * Math.PI * 2 + t, r = 30 + (Math.floor(t * 6 + i) % 3) * 4; R.pset(160 + Math.cos(an) * r, 60 + Math.sin(an) * r * 0.6, hex('#fff4b0')); } }
};
const p1 = (t) => {
  const ap = 0.15 + 0.85 * tramo(t, ZADA - 0.1, ZADA + 0.6);
  T.capitolio(R, t, { encuadre: 'plato', pantalla: pantallaHaymitch, aplausos: ap, audiencia: 0.3 + 0.6 * tramo(t, HAY, ZADA + 0.5) });
  const luz = tramo(t, HAY - 0.05, HAY + 0.15);
  T.tinte(R, 16, 179, [12, 6, 34], 0.42 - 0.12 * luz);
  const u = tramo(t, 0.2, HAY - 0.1), x = Math.round(lerp(58, 132, u));
  if (luz > 0) { foco(x + 7, 22, 150, 3, 17, 0.3 * luz); charco(x + 7, 150, 20, 5, 0.35 * luz); }
  const saluda = t > ZADA && t < ZADA + 1.3, mira = t > HAY + 0.4 && t < ZADA - 0.1;
  R.actor(EL.haymitch, x, 150, t, { dir: mira ? -1 : 1, anda: u > 0 && u < 1, sorpresa: t > HAY && t < HAY + 0.5, dedo: saluda && Math.floor(t * 4) % 2 === 0, brazos: saluda && Math.floor(t * 4) % 2 === 1, sonrisa: t > ZADA - 0.2 });
  confeti(t, 40, 60, 262, 18, 150, 3, ZADA + 0.1);
};
const ganso = (x, y, t, dir, anda, pica) => {
  x = Math.round(x); y = Math.round(y); const X = (i) => x + dir * i, paso = anda ? Math.floor(t * 8) % 2 : 0, B = hex('#f4f2ea'), S = hex('#c8c4b8'), N = hex('#f08a20');
  for (let i = -6; i <= 5; i++) for (let j = -4; j <= 3; j++) if (i * i / 36 + j * j / 14 <= 1) R.pset(X(i), y - 5 + j, j > 1 ? S : B);
  for (let i = -7; i <= 6; i++) for (let j = -5; j <= 4; j++) if (i * i / 49 + j * j / 22 <= 1 && !(i * i / 36 + j * j / 14 <= 1)) R.pset(X(i), y - 5 + j, K0);
  R.pset(X(-7), y - 7, B); R.pset(X(-8), y - 8, K0);
  const cy = pica ? y - 6 : y - 14, cx = pica ? 9 : 5;
  R.linea(X(3), y - 7, X(cx - 1), cy + 2, K0); R.linea(X(4), y - 7, X(cx), cy + 2, B); R.linea(X(5), y - 7, X(cx + 1), cy + 2, K0);
  R.disco(X(cx), cy, 2.2, B); R.pset(X(cx + 1), cy - 1, K0); R.pset(X(cx + 3), cy, N); R.pset(X(cx + 4), cy, N); R.pset(X(cx + 3), cy + 1, hex('#c86a10'));
  R.pset(X(-1), y - 1 + (paso ? -1 : 0), N); R.pset(X(-1), y, N); R.pset(X(1), y - 1 + (paso ? 0 : -1), N); R.pset(X(1), y, N); R.pset(X(2), y, N); R.pset(X(0), y, N);
};
const notas = (t, x, y, desde, hasta, col, semilla) => { for (let i = 0; i < 4; i++) { const f = ((t - desde) * 0.8 + i * 0.25) % 1; if (t < desde || t > hasta) continue; R.icono('nota', Math.round(x + Math.sin(f * 6 + i) * 4 + f * 18 * semilla), Math.round(y - f * 34), col, K0, 1); } };
// ── fondos propios de los planos 2 y 4 (pintados aquí; no son decorados de jh-comun.js) ──
// la trama ordenada 4 × 4 de los degradados, las zonas tranquilas (barra del año y Atom) y la lista de colores
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16), um = (x, y) => B4[(y & 3) * 4 + (x & 3)];
const calma = (x, y) => (y < 17 && x < 176) || (x > 271 && y < 49);
const hx = (s) => s.split(' ').map(hex);
const FONDOS = new Map();
// el fondo fijo se pinta una vez en su búfer: degradado del cielo, lo fijo del cielo (cieloFijo) y el resto (dibuja);
// guarda la máscara del cielo libre (donde pasan las nubes y los pájaros) y lo que devuelve dibuja
const fondo = (clave, hor, grad, cieloFijo, dibuja) => {
  let F = FONDOS.get(clave); if (F) return F;
  const b = R.nuevo(), prev = R.usar(b), B = R.buf, n = grad.length - 1;
  for (let y = 0; y < 180; y++) { const u = Math.min(0.999, y / hor) * n, i = Math.floor(u), f = u - i; for (let x = 0; x < 320; x++) B[y * 320 + x] = f > um(x, y) ? grad[Math.min(n, i + 1)] : grad[i]; }
  cieloFijo(B); const foto = B.slice(), dat = dibuja(B) ?? {}, cielo = new Uint8Array(57600);
  for (let i = 0; i < 57600; i++) if (B[i] === foto[i] && (i / 320 | 0) < hor && !calma(i % 320, i / 320 | 0)) cielo[i] = 1;
  R.usar(prev); F = { b, cielo, dat }; FONDOS.set(clave, F); return F;
};
// estratos finos y el sol con su halo tramado
const cieloFijo = (B, hor, [, cN, cNL], sol, cSol, cHalo, estratos) => {
  for (const [x0, yy, w] of estratos) { const y = Math.round(yy * hor);
    for (let i = 0; i < w; i++) { const x = Math.round(x0 + i), e = 1 - Math.abs(i / w * 2 - 1); if (x < 0 || x > 319 || calma(x, y)) continue; if (e * 1.4 > um(x, y)) B[y * 320 + x] = cNL; if (e > um(x, y + 1) + 0.3) B[(y + 1) * 320 + x] = cN; } }
  const [sx, sy, sr] = sol, rr = sr * 3.4;
  for (let y = Math.max(17, Math.floor(sy - rr)); y < Math.min(179, sy + rr); y++) for (let x = Math.max(0, Math.floor(sx - rr)); x < Math.min(320, sx + rr); x++) {
    const d = Math.hypot(x + 0.5 - sx, y + 0.5 - sy), i = y * 320 + x;
    if (d < sr) B[i] = d > sr - 1.2 ? cHalo : (x - sx < -sr * 0.2 && y - sy < -sr * 0.2 && d < sr * 0.6 ? hex('#ffffff') : cSol);
    else { const q = 1 - (d - sr) / (rr - sr); if (q * q * 0.9 > um(x, y)) B[i] = mez(B[i], cHalo, 0.5); }
  }
};
// las nubes (cúmulo de tres tonos con la base plana), solo en el cielo libre; lado: de dónde les da la luz (−1 izquierda)
const NUBE = [[0, 0, 0.3], [-0.3, 0.06, 0.21], [0.3, 0.05, 0.23], [-0.1, -0.13, 0.24], [0.15, -0.09, 0.2], [0.46, 0.1, 0.13], [-0.47, 0.1, 0.12]];
const nube = (F, cx, cy, w, [cS, c, cL], lado) => { const B = R.buf, base = cy + w * 0.14;
  const capa = (dx0, dy0, f, col) => { for (const [dx, dy, r0] of NUBE) { const r = Math.max(1, r0 * w * f), x0 = cx + dx * w + dx0, y0 = cy + dy * w + dy0;
    for (let y = Math.floor(y0 - r); y <= y0 + r; y++) { if (y < 0 || y > 179 || y > base + dy0 * 0.3) continue; for (let x = Math.floor(x0 - r); x <= x0 + r; x++) { if (x < 0 || x > 319) continue; const i = y * 320 + x; if (F.cielo[i] && (x + 0.5 - x0) ** 2 + (y + 0.5 - y0) ** 2 <= r * r) B[i] = col; } } } };
  capa(-lado, 1, 1, cS); capa(0, 0, 0.94, c); capa(lado, -1.5, 0.62, cL); };
// pájaros lejanos en uve que aletean (solo en el cielo libre)
const pajaros = (t, F, n, y, v, c, sem) => { const B = R.buf, ciclo = 420 / v + 6, u = (t + sem * 5.3) % ciclo, x0 = -40 + u * v;
  for (let k = 0; k < n; k++) { const x = Math.round(x0 - k * 9 - (k % 2) * 3), yy = Math.round(y + (k % 2 ? 4 : -1) * Math.ceil(k / 2) * 0.8 + Math.sin(t * 2 + k) * 1.5), a = Math.sin(t * 10 + k * 1.7) > 0;
    for (const [dx, dy] of [[0, 0], [-1, a ? -1 : 1], [1, a ? -1 : 1], [-2, a ? -2 : 1], [2, a ? -2 : 1]]) { const px = x + dx, py = yy + dy; if (px >= 0 && px < 320 && py >= 0 && py < 180 && F.cielo[py * 320 + px]) B[py * 320 + px] = c; } } };
// lo vivo del cielo: tres capas de nubes a tres velocidades (las lejanas más pálidas) y dos bandadas
const cieloVivo = (t, F, hor, cs, gMedio, cPaj, lado) => {
  const capas = [[0.9, 0.6, [[10, 0.28, 30], [130, 0.18, 24], [250, 0.34, 28]]], [2.2, 0.85, [[60, 0.46, 40], [200, 0.38, 34], [330, 0.5, 30]]], [4.2, 1, [[0, 0.66, 46], [170, 0.72, 52]]]];
  for (const [v, esc, lista] of capas) for (const [x0, yy, w] of lista) { const x = ((x0 + t * v) % 440 + 440) % 440 - 60, tonos = esc < 0.7 ? cs.map((c) => mez(c, gMedio, 0.38)) : cs; nube(F, Math.round(x), Math.round(yy * hor), w * esc, tonos, lado); }
  pajaros(t, F, 5, Math.round(hor * 0.4), 22, cPaj, 1); pajaros(t, F, 3, Math.round(hor * 0.24), 15, cPaj, 7);
};
// humo en bocanadas de tres tonos que se va con el viento (nunca en las zonas tranquilas)
const humo = (x, y, t, o = {}) => { const B = R.buf, n = o.n ?? 6, alto = o.alto ?? 30, viento = o.viento ?? 14, r0 = o.r ?? 1.2, v = o.v ?? 0.16, cols = o.cols ?? hx('#5a5a66 #8a8a96 #b4b4be');
  for (let k = n - 1; k >= 0; k--) { const u = (t * v + k / n) % 1, cx = x + u * viento + Math.sin(u * 6 + k + t * 0.7) * 2, cy = y - u * alto, r = r0 + u * (o.crece ?? 4);
    for (const [dx, dy, f, c] of [[0.5, 0.8, 1, cols[0]], [0, 0, 0.92, cols[1]], [-0.6, -0.7, 0.55, cols[2]]]) { const q = r * f;
      for (let yy = Math.floor(cy + dy - q); yy <= cy + dy + q; yy++) for (let xx = Math.floor(cx + dx - q); xx <= cx + dx + q; xx++) {
        if (xx < 0 || xx > 319 || yy < 0 || yy > 179 || calma(xx, yy)) continue; if ((xx + 0.5 - cx - dx) ** 2 + (yy + 0.5 - cy - dy) ** 2 > q * q) continue;
        if (u > 0.7 && um(xx, yy) < (u - 0.7) * 3.3) continue; B[yy * 320 + xx] = c; } } } };
// montes: perfil con ruido; las laderas que miran a la luz (luz: +1 derecha, −1 izquierda) van claras, motas de bosque
const montes = (B, base, amp, [cL, c, cS], sem, hasta, luz) => {
  const alt = (x) => base - amp * (0.5 + 0.3 * Math.sin(x * 0.019 + sem) + 0.14 * Math.sin(x * 0.051 + sem * 2.3) + 0.06 * Math.sin(x * 0.14 + sem * 3.1));
  for (let x = 0; x < 320; x++) { const top = Math.round(alt(x)), lit = (alt(x + 2) - alt(x - 2)) * luz > 0;
    for (let y = Math.max(17, top); y <= hasta; y++) { let col = y === top ? (lit ? cL : c) : lit && y - top < 7 && um(x, y) < 0.5 ? cL : c;
      if (hh(x, y, sem) < 0.14) col = cS; else if (!lit && y - top > 2 && um(x, y) < 0.3) col = cS; B[y * 320 + x] = col; } }
  return alt;
};

// ── plano 2: la Pradera junto a la alambrada, de tarde ──
// La cámara mira la alambrada de lado: viene de lejos por la izquierda (pequeña) y se acerca por la derecha (grande);
// detrás, el bosque de pinos con el sol que se pone entre las copas; delante, la pradera con el sendero que lleva al
// agujero de la alambrada, flores, la roca y dos casuchas de la Veta a lo lejos. Pies de los personajes en y 162.
const P2C = { g: hx('#3c3c7a #764e92 #c4687e #ee905e #fac46c'), n: hx('#7a4a72 #d6827a #fac690') };
const yb2 = (x) => 106 + x * 0.075, ht2 = (x) => 24 + x * 0.12, es2 = (x) => 0.45 + 0.55 * Math.max(0, Math.min(320, x)) / 320;
const POSTES2 = (() => { const p = []; for (let x = -4; x < 340; x += 18 + 30 * es2(x)) p.push(Math.round(x)); return p; })();
const PAJ2 = POSTES2.reduce((m, x) => Math.abs(x - 222) < Math.abs(m - 222) ? x : m, 0);
const AGUJERO2 = 258;
