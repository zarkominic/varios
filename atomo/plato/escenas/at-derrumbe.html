//    y el contador baja con ellos; a «fallen» el de Atari da un golpe en la consola y unos cuantos reviven un instante; a
//    «97» quedan tres que tiemblan, el contador salta a -97 % en rojo, la baliza gira y barre la pared, el de Warner
//    cuelga el teléfono y el jefe de ventas de la carpeta se queda helado; ventana con cielo de noche, nubes, ciudad y
//    avión, reloj que anda, cinta del teletipo que cae al suelo, humo y vapor, cajas de devoluciones;
// 4. la mesa de juntas de cerca (fondo local): una mano apila fajos hasta la torre de 1983 ($3,200,000,000) y a «to about»
//    deja al lado el único fajo de 1985 ($100,000,000); el humo del cenicero sube y el reloj anda;
// 5. el despacho de un programador de noche: mete el último cartucho en la caja a «companies», la levanta; a «shut down»
//    se apagan la terminal, la tele y el flexo, y se va con la caja; luego el haz de la linterna del vigilante barre la
//    habitación.
import * as T from '/atomo/plato/escenas/at-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';

const { E, R, M } = await T.preparar('at-derrumbe');

// ── 1 · la juguetería de 1984: la torre de cajas se derrumba ─────────────────────────────────────────────────────

// ── 2 · la cesta de saldo (gag 4): el precio baja y el cartucho se encoge ─────────────────────────────────────────

  }
};

  for (let k = 0; k < 9; k++) { const x = 286 + Math.floor(hh3(k, 3) * 16), y = 66 + Math.floor(hh3(k, 4) * 14); disco(x, y, 2, hex('#2a5a32')); pset(x - 1, y - 1, hex('#4a8a4a')); }
  linea(294, 80, 292, 68, hex('#3a2a1a'));

};
const poligono3 = (pts, c) => R.poligono(pts, c);
// la rejilla de cartuchos: colores de las cajas (encendido, apagado) y el orden en que se apagan (los tres primeros aguantan)
const LUCES = [['#ffd860', '#4a3a1a'], ['#ff8a6a', '#4a2620'], ['#7ae07a', '#1e3a22'], ['#7ab8ff', '#1e2a4a'], ['#ffb04a', '#4a301a']];
const ORDEN = Array.from({ length: 100 }, (_, i) => i).sort((a, b) => hh3(a, 9, 6) - hh3(b, 9, 6));
const RANGO = []; ORDEN.forEach((i, r) => { RANGO[i] = r; });
const p3 = (t) => {
  if (!fondo3) { fondo3 = R.nuevo(); const prev = R.usar(fondo3); pinta3(); R.usar(prev); }
  R.copiar(fondo3);
  const { rect, linea, pset, disco } = R;
  // cuántos cartuchos siguen encendidos: cien hasta «By 1985», caen hasta tres a «97»; el golpe en la consola a «fallen»
  // revive unos cuantos un momento
  const u = tramo(t, P3 + 0.45, noventa), s = u * u * (3 - 2 * u), golpe = tramo(t, caido - 0.05, caido + 0.5);
  const quedan = Math.round(lerp(100, 3, s)) + (golpe > 0.15 && golpe < 0.85 ? 7 : 0), alarma = t > noventa;

      R.linea(319, 120, cx + 16, cy - 6, hex('#3a3a3a')); R.linea(319, 132, cx + 18, cy + 4, hex('#3a3a3a'));
    }
  }
};
