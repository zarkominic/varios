// AT-DERRUMBE (frase 12), cartela «1983». Cinco planos:

// 5. el despacho de un programador de noche: a «companies» mete sus cosas en una caja, a «shut down» se apagan la

const hh3 = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };

const AÑOS = [['82', 142], ['83', 172], ['84', 202], ['85', 232]], ALTOS = [80, 34, 12, 3];
// el carrito con el retroproyector: la mesa de metal, la caja con la platina iluminada, el brazo y el cabezal con su lente

const p3 = (t) => {
  if (!fondo3) { fondo3 = R.nuevo(); const prev = R.usar(fondo3); pinta3(); R.usar(prev); }

  const BAR = [[P3 + 0.25, P3 + 0.75], [P3 + 0.85, P3 + 1.35], [P3 + 1.45, P3 + 1.95]];

    if (i === 0) return;
    const u = tramo(t, BAR[i - 1][0], BAR[i - 1][1]), hgt = Math.round(ALTOS[i] * u);
    if (hgt > 0) { rect(x - 10, 110 - hgt, x + 10, 110, hex('#d0383a')); for (let y = 112 - hgt; y < 110; y += 3) linea(x - 8, y, x + 8, y, hex('#f06a5a')); rect(x - 10, 110 - hgt, x - 9, 110, hex('#a02028')); }
  });
  // la línea roja que cae a «fallen», con su flecha al final
  const cae = tramo(t, caido - 0.3, noventa - 0.1), pts = AÑOS.map(([, x], i) => [x, 108 - ALTOS[i]]);
  for (let i = 0; i < 3; i++) { const u = Math.max(0, Math.min(1, cae * 3 - i)); if (u <= 0) break; const [x0, y0] = pts[i], [x1, y1] = pts[i + 1]; const xe = Math.round(lerp(x0, x1, u)), ye = Math.round(lerp(y0, y1, u)); for (const d of [0, 1]) linea(x0, y0 + d, xe, ye + d, hex('#b0202a')); }
  if (cae >= 1) R.poligono([[232, 110], [226, 100], [238, 100]], hex('#b0202a'));
  // a «97» se escribe el -97 % arriba a la derecha
  if (t > noventa) R.numero('-97%', 196, 44, { color: hex('#d0383a'), tam: 16, n: Math.round(tramo(t, noventa, noventa + 0.5) * 64) });
  // la sombra de la mano y el rotulador proyectados en la pantalla, siguiendo el trazo que se pinta
  let sx = null, sy = null;
  BAR.forEach(([a, b], i) => { if (t > a - 0.15 && t < b + 0.1) { const u = tramo(t, a, b); sx = AÑOS[i + 1][1] + Math.round(Math.sin(t * 22) * 6); sy = 110 - Math.round(ALTOS[i + 1] * u); } });
  if (cae > 0 && cae < 1) { const k = Math.min(2, Math.floor(cae * 3)), u = cae * 3 - k; sx = Math.round(lerp(pts[k][0], pts[k + 1][0], u)); sy = Math.round(lerp(pts[k][1], pts[k + 1][1], u)); }
  if (t > noventa && t < noventa + 0.5) { sx = 196 + Math.round(tramo(t, noventa, noventa + 0.5) * 50); sy = 40; }
  if (sx !== null) { R.recorte([102, 15, 274, 127]); for (let k = 0; k < 4; k++) linea(sx + 2 + k, sy + 2 + k, sx + 14 + k, sy + 16 + k * 2, hex('#b8b6ae')); linea(sx, sy, sx + 3, sy + 3, hex('#8a8880')); R.recorte(null); }
  // el haz del proyector: dos filos tenues y motas de polvo que suben en la luz
  for (let k = 0; k < 14; k++) { const f = (t * 0.12 + k / 14) % 1, u = hh3(k, 7); const x = Math.round(lerp(258, 120 + u * 140, f)), y = Math.round(lerp(112, 30 + hh3(k, 8) * 80, f)); if (y > 15 && (k + Math.floor(t * 3)) % 3) pset(x, y, hex('#fffbe0')); }
  // la puerta: se abre a «By 1985», una secretaria asoma con unos papeles, da un respingo a «97» y cierra
  const abre = tramo(t, P3 + 0.4, P3 + 0.8), cierra = tramo(t, noventa + 0.45, noventa + 0.8), hoja = Math.round(lerp(36, 6, abre * (1 - cierra)));
  if (abre > 0 && cierra < 1) {
    R.recorte([4, 56, 40, 150]);
    const sec = EL.cajera || EL.oficinista;
    const sx2 = Math.round(lerp(10, 24, tramo(t, P3 + 0.6, P3 + 1.1)) - lerp(0, 16, tramo(t, noventa + 0.2, noventa + 0.5)));
    R.actor(sec, sx2, 150, t, { dir: 1, sostiene: [sx2 + 14, 134], sorpresa: t > noventa && t < noventa + 0.5, habla: false });
    R.recorte(null);
  }
  // la hoja de la puerta: plafones, el cristal esmerilado y el pomo de latón (abierta, de canto contra el marco)
  { const x0 = 4, x1 = 4 + hoja; rect(x0, 56, x1, 150, hex('#8a5a2e')); rect(x0, 56, x1, 57, hex('#a8743c')); if (hoja > 20) { rect(x0 + 6, 62, x1 - 6, 88, hex('#5a3a1e')); rect(x0 + 7, 63, x1 - 7, 87, hex('#c8d8d8')); for (let y = 64; y < 87; y += 2) pset(x0 + 8 + (y % 4), y, hex('#e8f0f0')); rect(x0 + 6, 96, x1 - 6, 140, hex('#7a4e26')); rect(x0 + 7, 97, x1 - 7, 139, hex('#94643a')); disco(x1 - 4, 106, 1, hex('#e8c040')); } else { rect(x1, 56, x1 + 1, 150, hex('#5a3a1e')); disco(x1 + 2, 106, 1, hex('#e8c040')); } }
  // el presentador, junto al retroproyector: habla, pinta las barras con el rotulador en la transparencia, sigue la caída
  // y a «97» se lleva un susto; luego se queda cabizbajo
  const pinta = BAR.some(([a, b]) => t > a - 0.15 && t < b + 0.1) || (cae > 0 && cae < 1) || (t > noventa && t < noventa + 0.5);
  const hx = 262 + (pinta ? Math.round(Math.sin(t * 22) * 2) : 0), hy = 136 + (pinta ? 0 : -4);
  retro(t, true);
  const r = R.actor(EL.ejecutivoAtari2, 284, 170, t, { dir: -1, sostiene: [hx, hy], sorpresa: t > noventa && t < noventa + 0.6, habla: !pinta && t < noventa && parp(t, 7), triste: t > noventa + 0.6 });
  linea(r.mano[0], r.mano[1], r.mano[0] - 3, r.mano[1] + 2, C.k); pset(r.mano[0] - 3, r.mano[1] + 2, hex('#d0383a'));
  // la hoja de transparencia en la platina, con la gráfica pequeña que se ve desde aquí
  rect(247, 134, 266, 135, hex('#d8e8f0'));
  // dos consejeros en sillas a la izquierda: comentan, uno señala la pantalla y a «97» dan un respingo
  const resp = t > noventa && t < noventa + 0.5 ? 3 : 0;
  R.actor(EL.ejecutivoAtari, 56, 170 - resp, t, { dir: 1, sorpresa: resp > 0, triste: t > noventa + 0.5, habla: t < caido && parp(t, 6) });
  R.actor(EL.ejecutivoWarner, 88, 172 - resp, t, { dir: 1, sorpresa: resp > 0, enfado: t > noventa + 0.5, dedo: t > P3 + 1.0 && t < P3 + 2.0 });
  for (const [x, y] of [[54, 170], [86, 172]]) { rect(x - 1, y - 12, x + 18, y - 9, C.k); rect(x, y - 11, x + 17, y - 10, hex('#5a3a2a')); rect(x, y - 11, x + 17, y - 11, hex('#7a5a3a')); rect(x + 1, y - 9, x + 2, y, hex('#3a2a1a')); rect(x + 15, y - 9, x + 16, y, hex('#3a2a1a')); }
  if (resp) { R.icono('!', 60, 132, hex('#f0d040'), C.k, 2); R.icono('!', 92, 134, hex('#f0d040'), C.k, 2); }
};

// ── 4 · la mesa de juntas de cerca: la torre de fajos de 1983 y el fajo de 1985 (fondo local) ───────────────────────
let fondo4 = null;
const pinta4 = () => {
  const { rect, linea, pset, disco } = R;
  // los paneles de nogal con sus molduras, el zócalo y un cuadro de un velero
  for (let y = 0; y < 116; y++) for (let x = 0; x < 320; x++) { const v = Math.sin(x * 0.11 + Math.sin(y * 0.07 + x * 0.01) * 3); pset(x, y, x % 64 < 2 ? hex('#3a2212') : v > 0.5 ? hex('#6a4224') : v > -0.4 ? hex('#5a361c') : hex('#4e2e16')); }
  for (let k = 0; k < 5; k++) { const x0 = k * 64 + 8; rect(x0, 24, x0 + 48, 24, hex('#7a5232')); rect(x0, 96, x0 + 48, 96, hex('#3a2212')); rect(x0, 24, x0, 96, hex('#7a5232')); rect(x0 + 48, 24, x0 + 48, 96, hex('#3a2212')); }
  rect(196, 30, 250, 72, hex('#c8a040')); rect(198, 32, 248, 70, hex('#7ab0d8')); rect(198, 58, 248, 70, hex('#3a6a9a')); for (let x = 200; x < 248; x += 5) pset(x, 60 + (x % 3), hex('#c8e0f0'));
  linea(222, 38, 222, 58, hex('#4a3a2a')); R.poligono([[223, 38], [236, 56], [223, 56]], hex('#f4f0e4')); R.poligono([[221, 42], [212, 56], [221, 56]], hex('#e8e0d0')); rect(214, 57, 234, 59, hex('#7a3a2a'));
  // la mesa de nogal pulido con el reflejo de la ventana
  for (let y = 116; y < 180; y++) for (let x = 0; x < 320; x++) { const v = Math.sin(x * 0.04 + Math.sin(y * 0.25) * 1.5 + y * 0.05); pset(x, y, v > 0.55 ? hex('#7a4a26') : v > -0.3 ? hex('#6a3e1e') : hex('#5a3418')); }
  for (let y = 120; y < 176; y += 2) for (let x = 20 + (y - 120); x < 60 + (y - 120); x += 2) pset(x, y, hex('#8a5a32'));
  rect(0, 116, 319, 117, hex('#9a6a3a'));
  // el cenicero de cristal, la carpeta de informes y la pluma
  disco(36, 160, 12, C.k); disco(36, 160, 11, hex('#a8c0c8')); disco(36, 160, 7, hex('#6a8088')); rect(30, 158, 44, 159, hex('#f4f0e4')); rect(42, 157, 44, 160, hex('#e8803a'));
  rect(274, 140, 318, 176, C.k); rect(275, 141, 317, 175, hex('#e8dcc0')); rect(275, 141, 317, 145, hex('#3a6ad8')); for (let y = 150; y < 172; y += 4) linea(280, y, 312, y, hex('#a8a090'));
  linea(250, 178, 272, 168, C.k); linea(250, 177, 272, 167, hex('#c8a040'));
  // el reloj de pared y el cuadro de la gráfica de barras de los buenos tiempos
  disco(150, 50, 13, C.k); disco(150, 50, 12, hex('#c8a040')); disco(150, 50, 10, hex('#f4ecd8')); for (let k = 0; k < 12; k++) pset(Math.round(150 + Math.cos(k * 0.5236) * 8), Math.round(50 + Math.sin(k * 0.5236) * 8), C.k);

};
const fajo = (x, y) => { R.rect(x, y, x + 39, y + 3, C.k); R.rect(x + 1, y + 1, x + 38, y + 2, hex('#7ab86a')); R.rect(x + 1, y + 1, x + 38, y + 1, hex('#a8d898')); R.rect(x + 17, y, x + 22, y + 3, hex('#f4ecd0')); };
const placa = (x, y, txt) => { R.rect(x, y, x + 36, y + 12, C.k); R.rect(x + 1, y + 1, x + 35, y + 11, hex('#c8a040')); R.rect(x + 1, y + 1, x + 35, y + 2, hex('#f0d878')); R.numero(txt, x + 3, y + 10, { color: hex('#3a2212'), sombra: false }); };
const p4 = (t) => {
  if (!fondo4) { fondo4 = R.nuevo(); const prev = R.usar(fondo4); pinta4(); R.usar(prev); }
  R.copiar(fondo4);
  // el reloj anda y el humo del cenicero sube
  { const an = t * 0.9 - 1.5; R.linea(150, 50, Math.round(150 + Math.cos(an) * 8), Math.round(50 + Math.sin(an) * 8), C.k); R.linea(150, 50, 150 + 4, 50 - 3, C.k); }
  for (let k = 0; k < 7; k++) { const f = ((t * 0.5 + k / 7) % 1), y = Math.round(156 - f * 50), x = Math.round(42 + Math.sin(f * 7 + t) * 4 * f); R.pset(x, y, hex('#c8c0b8')); if (f < 0.6) R.pset(x + 1, y, hex('#a8a098')); }
  // la torre de 1983: los fajos caen uno a uno hasta 32 y la cifra cuenta a la vez
  const sube = tramo(t, P4 + 0.2, tres + 0.4), n = Math.max(1, Math.round(32 * sube));
  for (let k = 0; k < n; k++) fajo(56, 156 - k * 3);
  placa(58, 162, '1983');
  // la mano que pone el fajo de arriba
  if (sube < 1) { const hy = 156 - n * 3 - 1; fajo(Math.round(lerp(10, 56, ((t * 4) % 1))), hy - 3); T.brazo(R, -14, hy + 24, Math.round(lerp(10, 56, ((t * 4) % 1))) + 4, hy - 2, '#3a3a5a', 1); }
  const v = Math.round(3200 * sube) * 1e6;
  R.numero('$' + String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ','), 76, Math.max(24, 156 - n * 3 - 8), { centro: true, color: hex('#a8f098') });
  // a «to about» llega el único fajo de 1985
  const llega = tramo(t, aCien, cien), hx = Math.round(lerp(340, 232, llega));
  if (llega > 0) { fajo(hx - 26, Math.round(lerp(120, 156, llega))); placa(208, 162, '1985'); }
  if (llega > 0 && t < cien + 0.6) T.brazo(R, 352, 100, hx + 18, Math.round(lerp(118, 154, llega)), '#3a3a5a', -1, { codo: [hx + 50, Math.round(lerp(118, 154, llega)) - 20] });
  if (t > cien) R.numero('$100,000,000', 226, 146, { centro: true, color: hex('#f06a5a') });
};

// ── 5 · el despacho de noche: recoge sus cosas y apaga ───────────────────────────────────────────────────────────
const p5 = (t) => {
  T.atari(R, t, { encuadre: 'despachoProg' });
  const apaga = t > cierran;
  const va = tramo(t, cierran + 0.35, cierran + 2.6), x = Math.round(lerp(104, 330, va));
  // antes de «companies» la caja está en el escritorio y él va metiendo sus cosas (la taza, luego el cartucho);
  // a «companies» cae el último cartucho dentro, levanta la caja y, tras el apagón, se va con ella
  const levanta = t > empresas - 0.1, mete = (t - P5) % 1.1 / 1.1;
  const destino = levanta ? [x + 18, 134] : [Math.round(lerp(x + 16, 128, Math.min(1, mete * 1.6))), Math.round(134 - Math.sin(Math.min(1, mete * 1.6) * Math.PI) * 6)];
  const r = R.actor(EL.ejecutivoAtari2, x, 152, t, { dir: 1, anda: va > 0 && va < 1, sostiene: destino, triste: true });
  // la caja de cartón con sus cosas: una planta, la taza y el cartucho
  const [mx, my] = r.mano, bx = levanta ? mx - 4 : 128, by = levanta ? my - 6 : 136;
  R.rect(bx - 6, by, bx + 10, by + 10, C.k); R.rect(bx - 5, by + 1, bx + 9, by + 9, hex('#c8a06a')); R.rect(bx - 5, by + 1, bx + 9, by + 2, hex('#e4c48c')); R.linea(bx - 6, by - 2, bx - 3, by, hex('#b08a58')); R.linea(bx + 10, by - 2, bx + 7, by, hex('#b08a58'));
  R.rect(bx - 2, by - 6, bx + 1, by, hex('#3a9a4a')); R.pset(bx - 3, by - 5, hex('#5ac85a')); R.pset(bx + 2, by - 4, hex('#5ac85a'));
  if (t > P5 + 1.1) { R.rect(bx + 3, by - 3, bx + 6, by, C.k); R.rect(bx + 4, by - 2, bx + 5, by, hex('#e8e4d8')); }
  if (t > empresas - 0.3) { R.rect(bx + 4, by - 4, bx + 8, by, C.k); R.rect(bx + 5, by - 3, bx + 7, by - 1, hex('#e8c840')); }
  // lo que lleva en la mano de camino a la caja: la taza en la primera vuelta, el cartucho en la segunda
  if (!levanta && mete < 0.62) { if (t < P5 + 1.1) { R.rect(mx - 1, my - 4, mx + 2, my, C.k); R.rect(mx, my - 3, mx + 1, my - 1, hex('#e8e4d8')); } else if (t > empresas - 0.9) { R.rect(mx - 2, my - 5, mx + 2, my, C.k); R.rect(mx - 1, my - 4, mx + 1, my - 1, hex('#e8c840')); } }
  T.atariDelante(R, t, { encuadre: 'despachoProg' });
  // a «shut down» se apagan la terminal, la tele de pruebas y el flexo: la habitación se queda a oscuras
  if (apaga) {
    const k = tramo(t, cierran, cierran + 0.6);
    R.rect(38, 110, 76, 138, hex('#0a0e0a')); R.rect(214, 103, 242, 121, hex('#0a0a12'));
    if (k < 1) { R.rect(56 - Math.round((1 - k) * 18), 123, 56 + Math.round((1 - k) * 18), 124, hex('#8aff8a')); }
    T.tinte(R, 0, 179, [10, 12, 30], 0.35 * k);
  }
};

T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3], [P4, p4], [P5, p5]], {
  cartela: '1983',
  año: (t) => (t < ochenta5 ? 1983 : 1985),
  efectos: [[derrumbe, 'avalancha'], [rebaja, 'papel'], [P2 - 1.0, 'toc'], [a5, 'lapiz'], [cinco, 'boing'], [aun + 0.1, 'whoosh'], [ochenta5 + 0.2, 'tic'],
    [P3 + 0.3, 'lapiz'], [P3 + 1.5, 'lapiz'], [noventa, 'boom'], [noventa + 0.75, 'puerta'],
    [P4 + 0.3, 'papel'], [P4 + 1.4, 'papel'], [aCien + 0.4, 'papel'], [P5 + 0.7, 'toc'], [empresas - 0.2, 'golpecito'], [cierran, 'interruptor']],
});
