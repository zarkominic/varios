<canvas id="lienzo"></canvas>
<script type="module">
// DC-PALOMA (frase 10), 1943 → 1944. Cinco planos:
// 1. «not the first animal recruit… World War Two»: un campo de 1943 al atardecer; un soldado suelta una paloma mensajera
//    que se va hacia el sol; el otro abre la cesta y saca la siguiente; un tercero cruza al fondo y un jeep llega por el
//    camino de delante (y 149, más cerca que el tercero; se pinta después de la gente) levantando polvo y frena en x 208;
// 2. (corta en «Skinner») el laboratorio de Skinner: con la paloma en la mano cruza hasta la escalerilla de tijera junto a
//    la cola de la punta (x 282–305, rellano en y 128), sube los peldaños, la lleva al borde de la escotilla, la paloma
//    salta a la percha («rode inside the nose») y él baja la tapa: se la ve dentro por la ventanita (centro 261, 110);
//    el oficial de la Marina entra hasta x 228 y mira con el ceño fruncido («?»); el ayudante apunta en su cuaderno;
// 3. (corta en «in front of a little screen») dentro de la punta: el barco se va de lado, la paloma lo picotea
//    («pecked… correct the course»); con cada acierto caen granos de la tolva al comedero y se los come; al final deja
//    el barco en el centro («dead center», brillo);
// 4. (corta en «dead center») la sala de los mandos: Skinner entra con la paloma y se la enseña; los cinco dicen que no
//    con la cabeza («nobody in charge»), y al «trust a pigeon» la paloma aletea, «X» y Skinner se pone triste;
// 5. (corta en «Project Pigeon») 1944, el archivo de la Marina de noche (composición propia, no el archivo de dc-secreto):
//    ventana con reflectores, reloj, carta náutica, estantería, puerta entornada, perchero, lámpara colgada con su cono
//    de luz y motas; dos archivadores a la escala del oficial (1938–1940 y 1941–1944, x 128–166). El oficial baja la
//    carpeta de la paloma (sostiene) al cajón de 1944, abierto a su altura (fila 141); lo empuja («cancelled»), le echa
//    el candado («1944») y se va; una paloma entra por la báscula de la ventana y se posa encima; un ratón corre a la
//    ratonera del zócalo.
import * as T from '/atomo/plato/escenas/dc-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('dc-paloma');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const P = T.PIEZAS_DC, k = T.C.k;
const hh = (x, y, s = 0) => { const v = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453; return v - Math.floor(v); };
const mixN = (c1, c2, a) => { const f = (s) => { const p = (c1 >>> s) & 255; return Math.round(p + (((c2 >>> s) & 255) - p) * a); }; return (0xff000000 | (f(16) << 16) | (f(8) << 8) | f(0)) >>> 0; };
const mez = (a, b, u) => { const A = hex(a), B = hex(b); const c = (s) => Math.round(((A >>> s) & 255) + (((B >>> s) & 255) - ((A >>> s) & 255)) * u); return (0xff000000 | (c(16) << 16) | (c(8) << 8) | c(0)) >>> 0; };
// pinta algo en un búfer aparte y lo copia solo dentro del hueco [x0, y0, x1, y1] (ventanas, escotillas)
const enHueco = (dibuja, huecos) => { const b = R.nuevo(), prev = R.usar(b); dibuja(); R.usar(prev); for (const [x0, y0, x1, y1] of huecos) for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const c = b[y * 320 + x]; if (c) R.pset(x, y, c); } };
// un fondo fijo pintado una vez en su búfer y puesto en pantalla de un recorrido
const capas = new Map();
const fondo = (clave, dibuja) => { let b = capas.get(clave); if (!b) { b = R.nuevo(); const prev = R.usar(b); dibuja(); R.usar(prev); capas.set(clave, b); } const d = R.usar(b); R.usar(d); d.set(b); };
// los auriculares de escuchar sobre la cabeza que devuelve R.actor
const cascos = ([cx, cy]) => { const Z = hex('#3a3a44'), z = hex('#6a6a78'); for (let i = -6; i <= 6; i++) { const y = cy + 1 + Math.round((i * i) / 9); R.pset(cx + i, y - 1, k); R.pset(cx + i, y, Z); } for (const s of [-1, 1]) { R.rect(cx + s * 7 - 1, cy + 4, cx + s * 7 + 1, cy + 9, k); R.rect(cx + s * 7 - (s < 0 ? 0 : 0), cy + 5, cx + s * 7, cy + 8, z); } };
// cifras de 3 × 5 (las fechas de una etiqueta o de un papel: números, no letras)
const CIF = { 0: ['###', '#.#', '#.#', '#.#', '###'], 1: ['.#.', '##.', '.#.', '.#.', '###'], 2: ['###', '..#', '###', '#..', '###'], 4: ['#.#', '#.#', '###', '..#', '..#'], 5: ['###', '#..', '###', '..#', '###'], 6: ['###', '#..', '###', '#.#', '###'], 7: ['###', '..#', '.#.', '.#.', '.#.'], 3: ['###', '..#', '.##', '..#', '###'], 8: ['###', '#.#', '###', '#.#', '###'], 9: ['###', '#.#', '###', '..#', '###'] };
const cifras = (s, x, y, c, e = 1) => String(s).split('').forEach((d, n) => (CIF[d] || []).forEach((f, j) => { for (let i = 0; i < 3; i++) if (f[i] === '#') R.rect(x + (n * 4 + i) * e, y + j * e, x + (n * 4 + i) * e + e - 1, y + j * e + e - 1, c); }));
// la paloma que picotea cuando la escena quiere (la pieza decide la pose con su t: se le da uno que cae en «pica»)
const palomaPica = (x, y, t, pica, o = {}) => P.paloma(R, x, y, { ...o, t: pica ? (0.05 - x) / 3 : 1.4 - x / 3, picotea: pica });
// el vaho del aliento en el frío: nubecitas que salen de la boca y se deshacen
const vaho = (x, y, t, dir, fase = 0) => { const u = ((t + fase) % 1.4) / 1.4; if (u > 0.7) return; const r = 1 + u * 3, cx = Math.round(x + dir * (2 + u * 9)), cy = Math.round(y - u * 5); R.disco(cx, cy, r, u < 0.35 ? hex('#f4f8fc') : hex('#d8e2ec')); };

const m = (f) => en('paloma', f);
const P2 = m(0.2175), P3 = m(0.409), P4 = m(0.676), P5 = m(0.859);
const RECLUTA = m(0.053), GUERRA = m(0.103), PALOMAS = m(0.254), BOMBA = m(0.302), PUNTA = m(0.379);
const PICA = [m(0.475), m(0.502), m(0.524), m(0.548)], BLANCO = m(0.663), NADIE = m(0.723), CONFIAR = m(0.809), PALOMA = m(0.829);
const CANCELA = m(0.909), ANNO = m(0.942);

// 1 · el campo de 1943: la paloma mensajera
const cesta = (x, y, t, abre) => { const { rect, pset } = R; rect(x - 13, y - 14, x + 13, y, k); for (let j = y - 13; j < y; j++) for (let i = x - 12; i <= x + 12; i++) pset(i, j, (i + j * 2) % 5 < 2 ? hex('#8a6a3a') : hex('#c8a060'));
  palomaPica(x - 5, y - 9, t, Math.sin(t * 2.4) > 0.6); palomaPica(x + 6, y - 9, t, Math.sin(t * 2 + 2) > 0.7, { dir: -1 });
  for (let i = x - 12; i <= x + 12; i += 4) rect(i, y - 13, i + 1, y - 1, hex('#a8844a'));
  const a = Math.round(abre * 12); R.poligono([[x - 13, y - 14], [x + 13, y - 14], [x + 13 - a, y - 18 - a], [x - 13, y - 18]], k); R.poligono([[x - 12, y - 15], [x + 12, y - 15], [x + 12 - a, y - 17 - a], [x - 12, y - 17]], hex('#b8904e')); };
const p1 = (t) => {
  T.guerra(R, t, { encuadre: 'campo44', tanque: false, altavoz: 0 });
  const suelta = RECLUTA + 0.35, u = tramo(t, suelta, P2 - 0.2);
  const a = R.actor(EL.soldadoGA, 112, 156, t, { dir: -1, sostiene: t < suelta ? [104, 128] : false, brazos: t >= suelta && t < suelta + 0.5, sonrisa: t > suelta, habla: t < RECLUTA && Math.sin(t * 8) > 0 });
  if (t < suelta) palomaPica(a.mano[0] - 1, a.mano[1] - 1, t, false, { dir: -1 });
  else if (u < 1) P.paloma(R, Math.round(lerp(100, 34, u)), Math.round(lerp(118, 26, u) - Math.sin(u * Math.PI) * 10), { t, vuela: true, dir: -1 });
  const abre = tramo(t, GUERRA, GUERRA + 0.5), saca = t > GUERRA + 1.1;
  cesta(158, 156, t, abre);
  const b = R.actor(EL.soldadoGA2, 168, 152, t, { dir: -1, sostiene: saca ? [162, 128] : false, dedo: t > suelta + 0.3 && t < GUERRA, sonrisa: true });
  if (saca) palomaPica(b.mano[0], b.mano[1] - 1, t, Math.sin(t * 3) > 0.7, { dir: -1 });
  // un tercero cruza al fondo con otra cesta
  const c = tramo(t, 0.4, P2 - 0.3); R.actor(EL.soldadoGA3, Math.round(lerp(204, 296, c)), 140, t, { dir: 1, anda: c > 0 && c < 1 });
  // el jeep que llega por el camino de delante (más cerca que el tercero, que va por detrás) y frena junto a la cesta:
  // se pinta después de la gente, como todos los coches
  { const u = tramo(t, 0.2, P2 - 0.6), e = 1 - (1 - u) * (1 - u), jx = Math.round(lerp(345, 208, e)), jy = 149, { rect, pset, disco } = R, va = u > 0 && u < 1;
    if (u > 0) {
      R.poligono([[jx - 17, jy + 1], [jx + 17, jy + 1], [jx + 15, jy + 3], [jx - 15, jy + 3]], hex('#2e3a1c'));   // la sombra en la hierba
      if (va) for (let n = 0; n < 5; n++) { const v = ((t * 1.6 + n * 0.2) % 1); disco(Math.round(jx + 16 + v * 18), Math.round(jy - 2 - v * 6), Math.round(1 + v * 3 * (1 - e * 0.5)), v < 0.5 ? hex('#c8b088') : hex('#d8c8a8')); }
      rect(jx - 15, jy - 9, jx + 15, jy - 2, k); rect(jx - 14, jy - 8, jx + 14, jy - 3, hex('#5a6a3a')); rect(jx - 14, jy - 8, jx + 14, jy - 7, hex('#7a8a52')); rect(jx - 14, jy - 4, jx + 14, jy - 3, hex('#46542c'));
      rect(jx - 6, jy - 15, jx - 5, jy - 9, k); rect(jx - 6, jy - 15, jx + 1, jy - 14, k); rect(jx - 5, jy - 14, jx, jy - 10, hex('#9ab8c8')); pset(jx - 4, jy - 13, hex('#e8f4f8'));
      disco(jx + 3, jy - 12, 2, hex('#e0b090')); rect(jx + 1, jy - 15, jx + 5, jy - 13, hex('#4a5a2a')); rect(jx + 9, jy - 12, jx + 13, jy - 9, hex('#4a5a2a')); rect(jx + 9, jy - 12, jx + 13, jy - 12, hex('#6a7a42'));
      for (const [a, b] of [[-3, 0], [3, 0], [0, -3], [0, 3], [0, 0]]) pset(jx + 6 + a / 3 | 0, jy - 5 + b / 3 | 0, hex('#f2eee2'));
      pset(jx - 15, jy - 7, va ? hex('#fff2a0') : hex('#c8b860'));
      for (const wx of [jx - 9, jx + 10]) { disco(wx, jy - 1, 3, k); disco(wx, jy - 1, 1, hex('#6a6a6a')); const an = -t * 12 * (va ? 1 - e : 0); pset(wx + Math.round(Math.cos(an) * 2), jy - 1 + Math.round(Math.sin(an) * 2), hex('#8a8a8a')); } } }
  T.guerraDelante(R, t, { encuadre: 'campo44', tanque: false, altavoz: 0 });
};

// 2 · el laboratorio de Skinner: sube a la escalerilla junto a la punta, mete la paloma por la escotilla y la cierra
// la escalerilla de tijera de madera junto a la cola de la punta (el pie en el suelo, en 152; el rellano en 128)
const escalerilla = () => { const { rect, pset, linea } = R, M1 = hex('#8a6440'), M2 = hex('#b88a58'), M0 = hex('#5a3c24');
  for (const [xa, xb] of [[287, 282], [299, 305]]) { linea(xa + 1, 130, xb + 1, 152, M0); linea(xa, 130, xb, 152, k); linea(xa + 1, 131, xb + 1, 151, xa < 290 ? M2 : M1); }
  for (const y of [136, 142, 148]) { const f = (y - 130) / 22, xa = Math.round(287 - f * 5) + 1, xb = Math.round(299 + f * 6); rect(xa, y, xb, y + 1, k); rect(xa + 1, y, xb - 1, y, M2); }
  rect(284, 127, 302, 130, k); rect(285, 127, 301, 128, M2); rect(285, 129, 301, 129, M1); pset(288, 128, M0); pset(298, 128, M0);
  linea(292, 131, 296, 146, hex('#a8a8a0')); };
// los colores de la chapa de la punta (los del decorado)
const PU = hex('#7a8a6a'), PUS = hex('#5a6a4e'), PUL = hex('#9aaa86');
// la tapa de la escotilla (u 0: levantada, como la pinta el decorado; 1: cerrada, con la ventanita por la que se ve la
// paloma). Al moverse, se repinta el friso de detrás con el mismo friso 96 px a la izquierda (el friso se repite cada 32)
const tapaEscotilla = (u) => { if (u <= 0) return; const { pset, poligono, rect } = R;
  for (let y = 88; y <= 101; y++) for (let x = 245; x <= 285; x++) {
    if (y >= 96) { const c = y === 96 ? k : y === 97 || y >= 100 ? (x === 262 && (y - 97) % 3 === 0 ? PUS : PU) : PUL; pset(x, y, x === 285 ? PU : c); } else pset(x, y, R.pget(x - 96, y)); }
  const yE = Math.round(lerp(90, 120, u));
  if (yE <= 101) { const a = (101 - yE) / 11, dx = Math.round(4 * a); poligono([[245, 101], [281, 101], [281 + dx, yE], [245 + dx, yE]], k); poligono([[246, 100], [280, 100], [280 + dx, yE + 1], [246 + dx, yE + 1]], PUS); return; }
  // bajando o cerrada: la chapa con su filo de luz, remaches y la ventanita redonda
  for (let y = 102; y <= yE; y++) for (let x = 244; x <= 280; x++) {
    const dv = Math.hypot(x - 261, y - 110), dentro = yE >= 119 && dv < 6.2;
    if (dentro) { pset(x, y, mixN(R.pget(x, y), hex('#c8f0e0'), 0.12)); continue; }
    let c = x === 244 || x === 280 || y === yE ? k : y === 102 ? PUL : y === 103 ? PUL : (x === 262 && (y - 104) % 3 === 0) ? PUS : PU;
    if (dv >= 6.2 && dv < 7.8) c = dv < 7 ? k : hex('#c8a040');
    if ((x === 247 || x === 277) && (y === 105 || y === yE - 2)) c = PUS;
    pset(x, y, c); }
  if (yE >= 119) { pset(257, 106, hex('#f4fff8')); pset(256, 107, hex('#f4fff8')); } };
const p2 = (t) => {
  const g = T.animales(R, t, { encuadre: 'labSkinner' });
  escalerilla();
  // Skinner cruza hasta la escalerilla, sube los peldaños, mete la paloma por la escotilla y cierra la tapa
  const va = tramo(t, PALOMAS + 0.2, BOMBA + 0.3), sube = tramo(t, BOMBA + 0.3, BOMBA + 1.1), mete = tramo(t, PUNTA - 0.6, PUNTA - 0.15), cierra = tramo(t, PUNTA - 0.1, PUNTA + 0.3);
  const pel = Math.min(4, Math.floor(sube * 4.999));
  const sx = sube > 0 ? Math.round(lerp(291, 285, sube)) : Math.round(lerp(140, 291, va)), sy = sube > 0 ? 152 - pel * 6 : Math.round(lerp(166, 152, va));
  const enLaPunta = sube >= 1, alcanza = enLaPunta && t < PUNTA - 0.1;
  const dir = va > 0 && !enLaPunta ? 1 : -1;
  // ya dentro, la paloma va en la percha (detrás de la tapa que se cierra y de la mano que la empuja)
  if (mete >= 1) palomaPica(262, 116, t, Math.sin(t * 6) > 0.3, { dir: -1 });
  tapaEscotilla(cierra);
  const s = R.actor(EL.skinner, sx, sy, t, { dir, anda: (va > 0 && va < 1) || (sube > 0 && sube < 1), sostiene: mete < 1 ? (alcanza ? [Math.round(lerp(281, 279, mete)), 113] : true) : cierra < 1 ? [279, Math.round(lerp(104, 116, cierra))] : false, sonrisa: cierra >= 1, habla: t < PALOMAS && Math.sin(t * 8) > 0 });
  // la paloma: en la mano hasta el borde de la escotilla; luego salta dentro, a la percha delante de la pantallita
  if (mete < 0.55) palomaPica(s.mano[0] + dir * 2, s.mano[1] - 1, t, false, { dir });
  else if (mete < 1) { const v = tramo(mete, 0.55, 1); palomaPica(Math.round(lerp(s.mano[0] - 2, 262, v)), Math.round(lerp(s.mano[1] - 1, 116, v) - Math.sin(v * Math.PI) * 6), t, false, { dir: -1 }); }
  const o = tramo(t, P2 + 0.3, PALOMAS + 0.6), ox = Math.round(lerp(330, 228, o));
  R.actor(EL.oficialNaval, ox, 170, t, { dir: -1, anda: o > 0 && o < 1, enfado: t > PUNTA, habla: t > BOMBA && t < PUNTA && Math.sin(t * 7) > 0.3 });
  // el ayudante del laboratorio (un oficinista de los cuarenta), que apunta los picotazos
  const rf = R.actor(EL.oficinista, 62, g.detrasMesa, t, { dir: 1, sostiene: [82 + Math.round(Math.sin(t * 6) * 2), 140], habla: Math.sin(t * 3) > 0.6 });
  // el lápiz con el que apunta los picotazos en el cuaderno
  R.linea(rf.mano[0] + 1, rf.mano[1] - 1, rf.mano[0] + 4, rf.mano[1] - 5, hex('#e8b030')); R.pset(rf.mano[0] + 4, rf.mano[1] - 5, k);
  T.animalesDelante(R, t, { encuadre: 'labSkinner' });
  if (t > PUNTA + 0.2) R.bocadillo(ox + 12, 136, { icono: '?' });
};

// 3 · dentro de la punta: picotea el barco hasta dejarlo en el centro
const rumboEn = (t) => { let n = PICA.filter((p) => t >= p).length; const base = [0.85, 0.55, 0.3, 0.12, 0][n]; const deriva = n < 4 ? tramo(t, n ? PICA[n - 1] : P3, n < 4 ? PICA[n] : P3) * 0.12 : 0; return base + deriva + (n === 4 ? Math.sin(t * 2) * 0.03 : 0); };
const p3 = (t) => {
  const r = rumboEn(t), g = T.animales(R, t, { encuadre: 'labSkinner', camara: 'punta', rumbo: r });
  const [cx, cy] = g.pantalla, bx = Math.round(cx + r * 24);
  const pica = PICA.some((p) => t >= p - 0.08 && t < p + 0.16) || (t > PICA[3] + 1.4 && t < BLANCO - 0.4 && Math.sin(t * 9) > 0.3);
  palomaPica(g.paloma[0], g.paloma[1], t, pica, { s: 3 });
  // el golpecito en la pantalla: un anillo sobre el barco
  // la tolva de la recompensa: con cada acierto caen granos al comedero; la paloma se los come al acabar
  { const { rect, pset } = R; rect(204, 112, 216, 124, k); rect(205, 113, 215, 123, hex('#8a7a5a')); rect(205, 113, 215, 114, hex('#b8a47a')); rect(208, 124, 212, 150, k); rect(209, 124, 211, 150, hex('#6a6a5a'));
    for (const p of PICA) { const u = tramo(t, p + 0.15, p + 0.7); if (u > 0 && u < 1) for (let n = 0; n < 3; n++) pset(209 + n, Math.round(150 + u * 6 + n), hex('#e8b040')); }
    const n = PICA.filter((p) => t > p + 0.7).length - (t > PICA[3] + 1.4 ? Math.floor(tramo(t, PICA[3] + 1.4, BLANCO - 0.4) * 6) : 0);
    for (let i = 0; i < Math.max(0, n) * 2; i++) { rect(196 - i * 3, 155, 197 - i * 3, 156, hex('#f0c050')); pset(196 - i * 3, 155, hex('#fff0a0')); } }
  for (const p of PICA) { const u = tramo(t, p, p + 0.4); if (u > 0 && u < 1) { const rr = 3 + u * 8; for (let a = 0; a < 6.28; a += 0.2) R.pset(Math.round(bx + Math.cos(a) * rr), Math.round(cy - 4 + Math.sin(a) * rr * 0.6), hex('#e8fff0')); } }
  if (t > BLANCO && t < BLANCO + 0.9 && Math.floor(t * 8) % 2) for (const [dx, dy] of [[-10, -12], [12, -10], [0, 14]]) R.icono('X', cx + dx - 2, cy + dy - 3, hex('#f8f0a0'), k);
};

// 4 · los mandos dicen que no
const p4 = (t) => {
  const o = { encuadre: 'tallerHielo', camara: 'reunion', bloque: false };
  const g = T.hielo(R, t, o);
  const S = g.sillones, MANDOS = [EL.oficialAliado, EL.oficialNaval, EL.generalAF, EL.generalAF2, EL.oficialAliado2];
  MANDOS.forEach((d, n) => { const niega = t > NADIE + n * 0.15 && t < NADIE + 1.1 + n * 0.15; R.actor(d, S[n] - 7, g.detrasMesa, t, { dir: niega ? (Math.floor(t * 7) % 2 ? 1 : -1) : -1, enfado: t > NADIE + n * 0.15, habla: n === 1 && t > CONFIAR - 0.4 && t < CONFIAR + 0.5 && Math.sin(t * 9) > 0 }); });
  const aletea = t > PALOMA && t < PALOMA + 0.5;
  const ve = tramo(t, P4 + 0.05, P4 + 1.1), skx = Math.round(lerp(20, 70, ve));
  const s = R.actor(EL.skinner, skx, 168, t, { dir: 1, anda: ve > 0 && ve < 1, sostiene: ve < 1 ? true : [94, 136], habla: t < NADIE && Math.sin(t * 8) > 0, sonrisa: t < NADIE, triste: t > PALOMA + 0.3 });
