<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Asilo · ep5</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// RM-ASILO (frases 9–10). Una empalizada con su puerta: Rómulo la abre y saluda; entra gente variopinta con sacos,
// un tuerto, una oveja. Después los recién llegados se quedan en fila y se encogen de hombros («?» en la caja).
import { preparar, rodar } from '/atomo/plato/escenas/rm-comun.js';
const { E, R, M } = await preparar('rm-asilo');
const { PALA, PR, ELENCO, tramo, lerp } = R;
const m = { pue: M('puertas', 0.5), nad: M('nadie', 6) };
const tunica = (c) => ({ peinado: 'corto', chaqueta: c, camisa: c, falda: c, antebrazo: PALA.PIEL, pantalon: PALA.PIEL, sandalias: true, chaqueta_larga: false, faja: PALA.MARRON });
const gente = [
  { ...tunica(PALA.VERDE), pelo: PALA.PELO_NEGRO, objeto: 'saco' },
  { ...tunica(PALA.AZUL), pelo: PALA.PELO_RUBIO, parche: true },
  { ...tunica(PALA.AMARILLO), pelo: PALA.PELO_CASTANO, piel: PALA.PIEL_OSCURA, objeto: 'bolsa' },
  { ...tunica(PALA.ROJO), pelo: PALA.PELO_BLANCO, barba: 'poblada' },
  { ...tunica(PALA.MORADO), pelo: PALA.PELO_ROJO, objeto: 'saco' },
];
const fondo = (t) => { R.cieloR(t, 'dia', { hor: 118 }); R.colinas(118, { amp: 8, luz: 1.8 }); R.suelo(150, PR.TIERRA, { luz: 2.4 }); R.cabana(250, 116, 0.8, t, { humo: true }); };
const entra = (t) => {
  fondo(t);
  const ab = tramo(t, m.pue + 0.4, m.pue + 1.4);
  R.empalizada(0, 319, 150, 34, { puerta: [190, 34, ab], fondoPuerta: PR.HIERBA[2] });
  gente.forEach((g, i) => { const p = tramo(t, m.pue + 1.6 + i * 0.7, m.pue + 4.5 + i * 0.7); R.personaje(lerp(200, 40 + i * 30, p), lerp(150, 168, p), 38, { ...g, t, dir: -1, anda: p > 0 && p < 1 ? t * 7 : null }); });
  R.oveja(lerp(210, 150, tramo(t, m.pue + 4, m.pue + 6)), 170, t, { dir: -1 });
  R.personaje(232, 168, 42, { ...tunica(PALA.BLANCO), pelo: PALA.PELO_CASTANO, banda: PALA.PURPURA, t, dir: -1, pose: ab > 0.9 ? 'saluda' : 'pie', sonrisa: true });
};
const fila = (t) => {
  fondo(t);
  R.empalizada(0, 319, 150, 34, { puerta: [190, 34, 1], fondoPuerta: PR.HIERBA[2] });
  const encoge = Math.sin((t - m.nad) * 2.4) > 0;
  gente.forEach((g, i) => R.personaje(70 + i * 44, 168, 40, { ...g, t, brazoD: encoge ? 'ofrece' : 'abajo', brazoI: encoge ? 'ofrece' : 'abajo', objeto: undefined, sonrisa: i % 2 === 0 }));
};
rodar(E, R, [[0, entra], [m.nad - 0.2, fila]], { caja: (t, e) => R.caja(t, t > m.nad ? tramo(t, m.nad + 0.6, m.nad + 1) : 0, (x, y) => R.icono('?', x + 8, y, undefined, undefined, 2), { energia: e }) });
</script>
</body>
</html>
