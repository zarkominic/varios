<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aldea · ep5</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// RM-ALDEA (frases 9–10). La aldea de verdad, por capas: barro, cabañas en las colinas, una barca que sube el Tíber
// con mercancía y un vigía en lo alto. Luego, reyes que se suceden en un trono de madera; al último lo echan de una
// patada y los romanos levantan la mano: nunca más un rey.
import { preparar, rodar } from '/atomo/plato/escenas/rm-comun.js';
const { E, R, M } = await preparar('rm-aldea');
const { PALA, PR, ELENCO, tramo, lerp, clamp } = R;
const m = { ald: M('aldea', 0.5), rey: M('reyes', 9) };
const SOL = R.hex('#ffb060');
const pastor = (c, pelo) => ({ peinado: 'corto', pelo, chaqueta: c, camisa: c, falda: c, antebrazo: PALA.PIEL, pantalon: PALA.PIEL, sandalias: true, chaqueta_larga: false, faja: PALA.MARRON });
const aldea = (t) => {
  const pan = (t - m.ald) * 2;
  R.cieloR(t, 'tarde', { sol: [60, 92, 10], nubes: { n: 4, vel: 1.5 } });
  for (let x = 0; x < R.W; x++) { const xx = x + pan * 0.2, top = Math.round(90 - 12 * (0.5 + 0.5 * Math.sin(xx * 0.02 + 2)) - 5 * R.vnoise(xx * 0.05, 7)); for (let y = top; y < 128; y++) R.pset(x, y, R.tone([PALA.PURPURA[1], PALA.PURPURA[2], R.hex('#b0506a')], 2 - (y - top) * 0.03 + (y === top ? 1 : 0), x, y)); }
  const colina = (x) => { const xx = x + pan * 0.5; return Math.round(116 - 18 * Math.abs(Math.sin(xx * 0.024 + 0.5)) - 4 * R.vnoise(xx * 0.08, 2)); };
  for (let x = 0; x < R.W; x++) { const c = colina(x); for (let y = c; y < 136; y++) R.pset(x, y, y === c ? SOL : R.tone(PR.HIERBA, 1.2 + (y - c) * 0.03 + (R.hash2(x >> 1, y >> 1) - 0.5) * 0.5, x, y)); }
  for (const x0 of [40, 86, 134, 190, 240, 292]) { const x = Math.round(x0 - pan * 0.5); if (x > -20 && x < 340) R.cabana(x, colina(x) + 3, 0.45, t, { humo: x0 % 4 === 2 }); }
  // vigía en la colina más alta
  R.personaje(Math.round(160 - pan * 0.5), colina(Math.round(160 - pan * 0.5)) + 1, 16, { ...pastor(PALA.ROJO, PALA.PELO_NEGRO), t, objeto: 'gladio', sombra: false });
  for (let y = 136; y < 150; y++) for (let x = 0; x < R.W; x++) { const onda = Math.sin(x * 0.25 + y * 1.3 - t * 3) > 0.75; R.pset(x, y, onda && R.b4(x, y) < 0.5 ? PR.TARDE[3] : R.tone(PR.MAR, 1.4 + (y - 136) * 0.12 + (onda ? 1.2 : 0), x, y)); }
  // la barca sube el río con sacos
  const bx = lerp(340, -40, ((t - m.ald) / 14) % 1);
  R.poligono([[bx - 14, 142], [bx + 14, 142], [bx + 10, 146], [bx - 10, 146]], PR.MADERA[2]); R.rect(bx - 6, 138, bx + 4, 141, PR.PAJA[2]); R.rect(bx - 6, 138, bx + 4, 138, PR.PAJA[3]);
  R.personaje(bx + 9, 142, 14, { ...pastor(PALA.AZUL, PALA.PELO_CASTANO), t, dir: -1, sombra: false, objeto: 'pala' });
  // orilla con barro y pastores
  R.suelo(150, PR.TIERRA, { luz: 1.7 });
  for (let k = 0; k < 5; k++) for (let j = -1; j <= 1; j++) { const w = Math.round(8 * Math.sqrt(1 - (j / 2) ** 2)); R.rect(30 + k * 64 - w, 162 + (k % 2) * 7 + j, 30 + k * 64 + w, 162 + (k % 2) * 7 + j, j < 0 ? PR.TIERRA[0] : PR.TIERRA[1]); }
  [[96, 166], [118, 170], [228, 165]].forEach(([x, y], i) => R.oveja(x + Math.sin(t * 0.5 + i) * 3, y, t + i, { dir: i % 2 ? -1 : 1 }));
  const px = lerp(-20, 340, ((t - m.ald) / 10) % 1);
  R.personaje(px, 174, 28, { ...pastor(PALA.MARRON, PALA.PELO_NEGRO), t, anda: t * 7, objeto: 'saco' });
  for (let k = 0; k < 5; k++) { const f = ((t * 3 + k / 5) % 1); R.pset(Math.round(px - 5 - f * 8 + k), Math.round(173 - Math.sin(f * Math.PI) * 6), PR.TIERRA[1]); }
};
const reyes = (t) => {
  R.cieloR(t, 'tarde', { hor: 130, sol: [270, 110, 9] });
  R.colinas(130, { amp: 8, luz: 1.4 }); R.suelo(146, PR.TIERRA, { luz: 2 });
  R.trono(160, 150, { tela: PALA.ROJO, esc: 0.75 });
  const u = t - m.rey, cambios = [0, 1.1, 2.2], i = cambios.filter((c) => u >= c).length - 1;
  const capas = [PALA.AZUL, PALA.VERDE, PALA.NEGRO], barbas = ['perilla', 'poblada', 'bigote'];
  const vuela = clamp((u - 4.4) / 1.3, 0, 1);
  if (vuela < 1) R.personaje(160 + vuela * 200, 152 - Math.sin(vuela * Math.PI) * 60 - vuela * 20, 30, { ...ELENCO.rey, peinado: 'corto', capa: capas[Math.max(0, i)], barba: barbas[Math.max(0, i)], pelo: [PALA.PELO_BLANCO, PALA.PELO_CASTANO, PALA.PELO_NEGRO][Math.max(0, i)], t, pose: vuela > 0 ? 'brazos' : 'sentado', ceño: i === 2, sombra: vuela > 0 ? false : PALA.CONTORNO });
  if (u > 3.2) { const p = tramo(t, m.rey + 3.2, m.rey + 4.2); R.personaje(lerp(-20, 136, p), 164, 28, { ...pastor(PALA.AMARILLO, PALA.PELO_RUBIO), t, anda: p < 1 ? t * 7 : null, pose: u > 4.3 && u < 4.8 ? 'senala' : 'pie', ceño: true }); }
  if (vuela > 0.6) [[50, PALA.VERDE], [80, PALA.AZUL], [230, PALA.ROJO], [262, PALA.MORADO]].forEach(([x, c], k) => R.personaje(x, 168 + (k & 1) * 4, 26, { ...pastor(c, [PALA.PELO_NEGRO, PALA.PELO_CASTANO][k & 1]), t: t + k, pose: 'arriba', brazoD: 'arriba', dir: x < 160 ? 1 : -1, sonrisa: true }));
};
rodar(E, R, [[0, aldea], [m.rey - 0.2, reyes]], { año: (t) => Math.round(lerp(-753, -509, tramo(t, m.rey, m.rey + 6))) });
</script>
</body>
</html>
