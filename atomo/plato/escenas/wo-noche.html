<title>La noche · ep37</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// WO-NOCHE (frase 9), cartela 1977; año 1977. La gran oreja sin nadie, de noche. Tres planos:
// 1. (cartela) el carro de las bocinas de noche: un mapache entra por los raíles, olfatea el cable bajo la bocina;
//    en «a quarter past 11» el piloto del receptor se enciende de golpe y el mapache da un brinco y se va corriendo;
//    murciélagos y polillas en la lámpara.
// 2. («nobody was at the telescope», 7,0) la boca de la impresora: el papel sube línea a línea, solo unos y espacios;
//    en «logged» un ratón asoma por la botonera, se sienta y mira cómo sale el papel; en «all on its own» se asoma.
// 3. («and printed it», 13,35) la sala de noche, vacía: EL GAG 3: el papel continuo llena la caja, rebosa, corre por
//    el suelo hacia la puerta y en «line by line» sale por ella en una ola; el ratón huye delante del papel y se lo
//    lleva la ola por la puerta; la silla gira sola.
import * as T from '/atomo/plato/escenas/wo-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('wo-noche');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const K = hex('#17151d'), BL = hex('#f6f2ea'), ease = (u) => Math.max(0, Math.min(1, u)) ** 2 * (3 - 2 * Math.max(0, Math.min(1, u)));
const hs = (a, b, k = 0) => { const s = Math.sin(a * 127.1 + b * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const bay = (x, y) => (BAY[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
const tono = (cs, f, x, y) => cs[Math.max(0, Math.min(cs.length - 1, Math.floor(f * (cs.length - 1) + bay(x, y))))];
const mez = (a, b, k) => { let r = 0; for (const sh of [0, 8, 16]) r |= Math.round(((a >>> sh) & 255) * (1 - k) + ((b >>> sh) & 255) * k) << sh; return (r | 0xff000000) >>> 0; };
// una luz cálida que aclara lo que hay debajo (tramada hacia el borde)
const luzCalida = (cx, cy, r, c, f = 0.45) => { for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++) { const d = Math.hypot(x - cx, (y - cy) * 1.4) / r; if (d < 1 && bay(x, y) < 1.2 - d) R.pset(x, y, mez(R.pget(x, y), c, f * (1 - d * 0.6))); } };
const tranquila = (x, y) => (x >= 274 && y <= 48) || (x >= 16 && x <= 174 && y <= 22);
// un bocadillo blanco con un icono (?, !) que sale con un saltito
const globo = (x, y, ic, c, e = 1) => { if (e <= 0) return; const r = Math.round(6 * Math.min(1, e * 1.3)); R.disco(x, y, r + 1, K); R.disco(x, y, r, BL); R.pset(x - 4, y + r + 1, K); R.pset(x - 3, y + r, BL); R.pset(x - 3, y + r + 1, K); if (e > 0.6) R.icono(ic, x - (ic === '?' ? 2 : 1), y - 4, c, null, 1); };
// destello de cuatro puntas
const destello = (x, y, r, c = BL) => { x = Math.round(x); y = Math.round(y); for (let i = -r; i <= r; i++) { R.pset(x + i, y, c); R.pset(x, y + i, c); } };
// un murciélago que aletea (5 px de cuerpo)
const murcielago = (x, y, t, k) => { x = Math.round(x); y = Math.round(y); const ar = Math.sin(t * 22 + k * 2) > 0; const N = hex('#14121c');
  R.rect(x - 1, y, x + 1, y + 1, N); R.pset(x - 1, y - 1, N); R.pset(x + 1, y - 1, N);
  if (ar) { R.linea(x - 2, y, x - 5, y - 3, N); R.linea(x + 2, y, x + 5, y - 3, N); R.pset(x - 6, y - 2, N); R.pset(x + 6, y - 2, N); }
  else { R.linea(x - 2, y + 1, x - 6, y + 2, N); R.linea(x + 2, y + 1, x + 6, y + 2, N); } };
// una polilla que da vueltas a una luz
const polilla = (cx, cy, t, k, r = 6) => { const a = t * (5 + k) + k * 2.1, x = Math.round(cx + Math.cos(a) * r), y = Math.round(cy + Math.sin(a * 1.3) * r * 0.6); R.pset(x, y, hex('#e8dcc0')); if (Math.sin(t * 40 + k) > 0) { R.pset(x - 1, y - 1, hex('#bfb090')); R.pset(x + 1, y - 1, hex('#bfb090')); } };
// un ratón de campo (8 × 5 px) que anda (fase) o se para y mueve los bigotes; dir 1 mira a la derecha
const raton = (x, y, dir, fase, anda, t, s = 2) => { x = Math.round(x); y = Math.round(y);
  const G = hex('#a88060'), GL = hex('#d0a880'), GS = hex('#7a5a40'), P = hex('#f0a0a8');
  const px = (i, j, c) => { for (let a = 0; a < s; a++) for (let b = 0; b < s; b++) R.pset(x + (i * s + a) * dir, y + (j + 1) * s - 1 - b, c); };
  for (let i = -4; i <= 3; i++) for (let j = -4; j <= -1; j++) { const d = (i / 4.2) ** 2 + ((j + 2.5) / 2) ** 2; if (d <= 1.25) px(i, j, d > 0.95 ? K : j === -4 ? GL : j === -1 ? GS : G); }
  px(4, -3, G); px(5, -3, G); px(5, -2, K); px(6, -2, P); px(4, -2, G); px(3, -5, GL); px(2, -5, P);   // hocico, nariz y oreja
  px(4, -4, K);   // el ojo
  const b = Math.sin(t * 18) > 0 ? 0 : 1; px(6, -3 - b, hex('#d8d0c0')); px(7, -3 - b, hex('#d8d0c0'));   // bigotes
  for (let i = 1; i <= 6; i++) px(-4 - i, -2 + Math.round(Math.sin(i * 0.8 + t * 6) * 0.8), P);   // la cola
  const p = anda ? Math.floor(fase) % 2 : 0; px(-2, 0 - p, GS); px(2, 0 - (1 - p) * (anda ? 1 : 0), GS); };

const tn = (s) => en('noche', (s - 1.5) / 15.607);
const P2 = tn(7.0), P3 = tn(13.35), CUARTO = tn(5.64), LOGGED = tn(11.03), SOLO = tn(12.43), CONT = tn(15.03), LINEA = tn(16.27);
// un mapache (dir 1 mira a la derecha): x el centro, y la línea de los pies
const mapache = (x, y, dir, fase, anda, olfatea, t, s = 2) => { x = Math.round(x); y = Math.round(y);
  const G = hex('#9a9aa8'), GL = hex('#c4c4d0'), GS = hex('#6a6a78'), N = hex('#1c1c24'), CL = hex('#f0f0f6');
  const px = (i, j, c) => { for (let a = 0; a < s; a++) for (let b = 0; b < s; b++) R.pset(x + (i * s + a) * dir, y + (j + 1) * s - 1 - b, c); };
  const p = anda ? Math.floor(fase) % 2 : 0;
  for (const [i, s] of [[-4, p], [-2, 1 - p], [3, p], [5, 1 - p]]) { const up = anda ? s : 0; px(i, -1 - up, N); px(i, -2 - up, GS); px(i, -3, GS); }
  for (let i = -7; i <= 6; i++) for (let j = -10; j <= -2; j++) { const d = (i / 7) ** 2 + ((j + 6) / 4) ** 2; if (d <= 1.15) px(i, j, d > 0.9 ? K : j <= -9 ? GL : j >= -3 ? GS : G); }
  const cola = Math.round(Math.sin(t * 6) * 1.5);   // la cola de anillos
  for (let i = 1; i <= 7; i++) for (let j = -1; j <= 1; j++) px(-7 - i, -7 + j + Math.round(i * 0.3) + (i > 4 ? cola : 0), j === -1 && i < 7 ? K : (i >> 1) % 2 ? N : GL);
  const hb = olfatea ? Math.round(Math.abs(Math.sin(t * 14))) + 1 : 0;   // la cabeza que baja al olfatear
  const hx = 8, hy = -8 + hb;
  for (let i = -3; i <= 3; i++) for (let j = -3; j <= 3; j++) { const d = (i / 3.2) ** 2 + (j / 3) ** 2; if (d <= 1.1) px(hx + i, hy + j, d > 0.85 ? K : G); }
  for (let i = -2; i <= 3; i++) px(hx + i, hy - 1, N); px(hx, hy - 1, CL); px(hx + 2, hy - 1, CL); px(hx + 1, hy - 1, N); px(hx + 3, hy - 1, N);   // el antifaz
  for (let i = -2; i <= 3; i++) px(hx + i, hy - 2, CL);
  px(hx - 2, hy - 4, K); px(hx - 1, hy - 4, GL); px(hx + 2, hy - 4, K); px(hx + 1, hy - 4, GL);   // las orejas
  px(hx + 4, hy + 1, N); px(hx + 3, hy + 1, CL); px(hx + 3, hy + 2, CL); };
// ── 1 · las bocinas de noche, sin nadie (y un mapache) ───────────────────────────────────────────────────────────
const p1 = (t) => {
  const o = { encuadre: 'caseta', camara: 'bocinas', luz: 'noche' };
  T.oreja(R, t, o);
  // murciélagos que cruzan bajo el reflector y polillas en la lámpara
  for (let k = 0; k < 2; k++) { const u = ((t * 0.11 + k * 0.45) % 1); murcielago(260 - u * 300, 62 - u * 20 + Math.sin(t * 3 + k) * 4, t, k); }
  for (let k = 0; k < 3; k++) polilla(266, 100, t, k, 5 + k * 2);
  // luciérnagas sobre el suelo de metal (y su reflejo)
  for (let k = 0; k < 9; k++) { const x = Math.round((hs(k, 1) * 320 + t * (4 + k) + Math.sin(t + k) * 6) % 320), y = Math.round(136 + hs(k, 2) * 36 + Math.sin(t * 1.3 + k * 2) * 3), on = Math.sin(t * 3 + k * 1.7) > 0.2;
    if (on) { R.pset(x, y, hex('#e8ff8a')); R.pset(x + 1, y, hex('#a8d860')); R.pset(x, y - 1, hex('#a8d860')); if (y + 8 < 180) R.pset(x, y + 8, hex('#5a7a4a')); } }
  // el piloto del receptor de la izquierda: en «a quarter past 11» se enciende de golpe
  const flash = tramo(t, CUARTO, CUARTO + 0.15) * (1 - tramo(t, CUARTO + 0.9, CUARTO + 1.4));
  if (flash > 0) { R.halo(96, 118, 9 * flash, [hex('#5a1a1a'), hex('#c83a2a'), hex('#ff8a5a')], 1.2); R.disco(96, 118, 2, hex('#ffd0a0')); }
  // el mapache: entra por la izquierda andando, se para y olfatea el cable, brinca con la luz y huye a la derecha
  const entra = tramo(t, 1.45, CUARTO - 1.4), huye = tramo(t, CUARTO + 0.35, P2 - 0.3);
  const x = huye > 0 ? lerp(110, 380, huye * huye) : lerp(-30, 110, ease(entra)), anda = (entra > 0 && entra < 1) || huye > 0;
  const brinco = t > CUARTO + 0.05 && t < CUARTO + 0.4 ? Math.round(Math.sin((t - CUARTO - 0.05) / 0.35 * Math.PI) * 7) : 0;
  const olf = entra >= 1 && t < CUARTO;
  mapache(x, 177 - brinco, 1, t * (huye > 0 ? 14 : 7), anda, olf, t);
  if (brinco > 2) globo(Math.round(x) + 18, 177 - brinco - 34, '!', hex('#d83a2a'), 1);
  T.orejaDelante(R, t, o);
};
// ── 2 · la impresora sola ─────────────────────────────────────────────────────────────────────────────────────────
const p2 = (t) => {
  const o = { camara: 'impresora', luz: 'noche', velocidad: 1.1 };
  T.sala(R, t, o);
  // una polilla en la luz de la ventana
  polilla(252, 30, t, 1, 7);
  // el ratón: asoma por la derecha de la botonera en «logged», anda, se sienta a mirar el papel y se estira en «all on its own»
  const entra = tramo(t, LOGGED - 0.3, LOGGED + 0.9);
  if (entra > 0) {
    const x = lerp(272, 232, ease(entra)), mira = t > SOLO;
    raton(x, 144 - (mira ? 1 : 0), -1, t * 8, entra < 1, t);
    if (mira && t < SOLO + 0.8) globo(Math.round(x) - 6, 126, '!', hex('#3a6ac8'), tramo(t, SOLO, SOLO + 0.2));
  }
  T.salaDelante(R, t, o);
};
// ── 3 · el papel infinito (gag 3) ─────────────────────────────────────────────────────────────────────────────────
const p3 = (t) => {
  const papel = Math.min(1, ease(tramo(t, P3 + 0.1, LINEA)) * 0.8 + ease(tramo(t, LINEA, LINEA + 1.0)) * 0.2);
  const o = { luz: 'noche', papel };
  const g = T.sala(R, t, o);
  polilla(116, 105, t, 2, 6);
  // el ratón huye delante del frente del papel hacia la puerta y la ola se lo lleva
  const [fx, fy] = g.papel || [196 + papel * 80, 156 - papel * 30];
  const huye = tramo(t, P3 + 0.6, LINEA);
  if (t > P3 + 0.3) {
    if (papel < 0.8) {
      const x = Math.max(fx + 10, lerp(210, 268, ease(huye))), y = lerp(158, 128, ease(tramo(x, 230, 272)));
      raton(x, y, 1, t * 16, true, t, 2);
      if (t > P3 + 0.3 && t < P3 + 1.0) globo(Math.round(x) + 4, Math.round(y) - 16, '!', hex('#d83a2a'), tramo(t, P3 + 0.3, P3 + 0.5));
    } else {
      // en la cresta de la ola, por el hueco de la puerta, y se va por el pasillo
      const v = tramo(t, LINEA - 0.1, LINEA + 1.2);
      if (v < 1) { R.recorte([256, 66, 294, 125]); const x = lerp(270, 290, v), y = lerp(112, 96, Math.sin(v * Math.PI)) + v * 10; raton(x, y, 1, t * 10, false, t, 2); R.recorte(null); }
    }
  }
  T.salaDelante(R, t, o);
};
// efectos (uno por segundo como mucho, cada uno con su acción): el mapache olfatea el cable; el piloto y el brinco; la
// impresora arranca y traquetea línea a línea; el ratón asoma; el papel cae en la caja; la sala zumba con la impresora
// y los receptores; la ola de papel por la puerta; el reloj de la pared
const efectos = [[CUARTO - 1.3, 'masca'], [CUARTO, 'bip'], [CUARTO + 0.05, 'boing'], [P2 + 0.1, 'maquina', { dur: 2.4 }], [P2 + 3.1, 'tecleo', { dur: 1.6 }],
  [SOLO, 'pop'], [P3 + 0.3, 'papel'], [P3 + 1.2, 'zumbido'], [LINEA, 'whoosh'], [LINEA + 0.6, 'papel'], [LINEA + 1.7, 'tic']];
T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3]], { efectos, cartela: '1977', año: 1977 });
</script>
