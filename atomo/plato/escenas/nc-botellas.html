// NC-BOTELLAS (frase 6), 1899. Cuatro planos:
// 1. la estación de 1899 (el edificio bajo, para que arriba a la derecha solo haya cielo): el tren echa vapor, la chimenea
//    humea, un mozo cruza con un carro de cajones de botellas rectas («the bottles») y los dos abogados de bombín bajan del
//    vagón y echan a andar («two lawyers from Tennessee»); en el andén, un charco con ondas, el carro de equipajes con
//    baúles, la carretilla con un saco y un periódico tirado;
// 2. la farmacia de Atlanta al revés: la cámara, detrás de la fuente de soda, mira a la puerta; por los escaparates se ve
//    la calle (paseantes, un coche de caballos) y llegan los abogados, que entran con la campanilla y le enseñan a Candler
//    una botella («the rights to bottle it»); él no se lo cree y señala la fuente, donde el dependiente llena un vaso
//    para los clientes sentados al mostrador («the soda fountains»);
// 3. el inserto del mármol desde arriba (bombín, botella tumbada, vaso con pajita, tintero, reloj de bolsillo, periódico,
//    la sombra del ventilador que barre): Candler firma con la pluma y la deja en el tintero; el abogado suelta el dólar,
//    que rueda girando hasta Candler («one dollar»), y se lleva el contrato; Candler tapa la moneda y se la lleva
//    («worst deals»);
// 4. el mapa de EE. UU.: desde Atlanta salen las rutas con botellas, trenes y carros que llegan a cada rincón del país
//    («every corner of the country»), con una chincheta en cada ciudad; la barra corre de 1899 a 1920.
import * as T from '/atomo/plato/escenas/nc-comun.js';

  return (0xff000000 | (Math.round(b + (b2 - b) * a) << 16) | (Math.round(g + (g2 - g) * a) << 8) | Math.round(r + (r2 - r) * a)) >>> 0; };

const ladrillos = (x0, y0, x1, y1, ramp, junta, k = 0) => { for (let y = y0; y <= y1; y++) { const fila = Math.floor((y - y0) / 4), off = fila % 2 ? 4 : 0;

  for (let x = x0; x <= x1; x++) { const largo = 40 + Math.floor(hh(fila, 3, k) * 40), jx = (x + Math.floor(hh(fila, 7, k) * 60)) % largo === 0;
    if (jy || jx) { R.pset(x, y, ramp[0]); continue; }

    const nudo = Math.hypot(((x * 7 + fila * 31) % 97) - 48, (((y - y0) % alto) - alto / 2) * 3) < 3 ? -0.9 : 0;
    R.pset(x, y, R.tone(ramp, 1.6 + veta + nudo + (hh(fila, 1, k) - 0.5) * 0.6 + luz, x, y)); } } };
// nube de tres tonos (sombra abajo, luz arriba)

// el contrato (54 × 64): encabezado, renglones, el sello de lacre con su cinta y la firma que crece (sig 0–1)
const contrato = (x, y, sig) => { const W = 54, H = 64;
  for (let j = 2; j <= H + 2; j++) for (let i = 3; i <= W + 3; i++) { const px = x + i, py = y + j; if (py >= 50 && py <= 167) R.pset(px, py, mez(R.pget(px, py), K0, 0.22)); }
  R.rect(x, y, x + W, y + H, K0); R.rect(x + 1, y + 1, x + W - 1, y + H - 1, hex('#f4eedc')); R.rect(x + 1, y + 1, x + W - 1, y + 2, hex('#fffaf0')); R.rect(x + W - 2, y + 1, x + W - 1, y + H - 1, hex('#ddd4bc'));
  R.rect(x + 12, y + 6, x + W - 12, y + 7, hex('#3a3430')); R.rect(x + 18, y + 10, x + W - 18, y + 10, hex('#6a6058'));
  for (let k = 0; k < 8; k++) R.rect(x + 5, y + 16 + k * 4, x + 5 + W - 10 - (k % 3 === 2 ? 14 : Math.floor(hh(k, 4, 2) * 6)), y + 16 + k * 4, hex('#8a8070'));
  R.linea(x + 8, y + 52, x + 4, y + 62, hex('#a82a2a')); R.linea(x + 11, y + 52, x + 14, y + 62, hex('#a82a2a'));
  R.disco(x + 10, y + 52, 5, K0); R.disco(x + 10, y + 52, 4, hex('#c83a32')); R.disco(x + 9, y + 51, 2, hex('#e86a5a')); R.pset(x + 10, y + 52, hex('#7a1a1a'));
  R.rect(x + 24, y + 58, x + 48, y + 58, hex('#6a6058'));
  const n = Math.round(sig * 24); for (let i = 0; i < n; i++) { const sx = x + 24 + i, sy = y + 55 + Math.round(Math.sin(i * 0.9) * 2 + Math.sin(i * 2.3) * 0.8); R.pset(sx, sy, hex('#1a1a3a')); R.pset(sx, sy + 1, hex('#2a2a5a')); } };
// la pluma de mojar: la plumilla en (nx, ny) y el mango hacia arriba a la derecha
const pluma = (nx, ny) => { R.linea(nx + 1, ny, nx + 11, ny - 13, K0); R.linea(nx, ny, nx + 10, ny - 13, hex('#2a1a3a')); R.linea(nx + 2, ny - 3, nx + 3, ny - 4, hex('#c8a040')); R.pset(nx, ny, hex('#e8c060')); R.pset(nx + 10, ny - 13, hex('#6a4a8a')); };
// la sombra de las aspas del ventilador del techo, que barre el mármol
const aspas = (t) => { const cx = 170, cy = 100, g = t * 2.2;
  for (let y = 50; y <= 167; y++) for (let x = 92; x <= 248; x++) { const ddx = x - cx, ddy = (y - cy) * 1.25, r = Math.hypot(ddx, ddy); if (r < 8 || r > 78) continue;
    if (Math.cos((Math.atan2(ddy, ddx) - g - r * 0.004) * 4) > 0.82) R.pset(x, y, mez(R.pget(x, y), K0, 0.16 * Math.min(1, (78 - r) / 20))); } };
const p3 = (t) => {
  capa('marmol', fondoMarmol);
  // la espuma del vaso que chisporrotea y el segundero del reloj
  for (let k = 0; k < 6; k++) if (Math.sin(t * 7 + k * 2.1) > 0.5) R.pset(Math.round(236 + Math.cos(k * 1.1) * (2 + (k % 3) * 1.5)), Math.round(82 + Math.sin(k * 1.1) * (2 + (k % 3) * 1.5)), hex('#c8b898'));
  const sa = Math.floor(t) * 0.1047 - 1.57; R.linea(300, 140, Math.round(300 + Math.cos(sa) * 6), Math.round(140 + Math.sin(sa) * 6), hex('#c83a32'));
  // Candler firma el contrato; el abogado se lo lleva arrastrándolo hacia su lado
  const sig = lin(t, P3, b(0.578)), lleva = tramo(t, b(0.62), b(0.69)), dx = Math.round(-96 * lleva), dy = Math.round(64 * lleva);
  contrato(132 + dx, 92 + dy, sig);
  aspas(t);
  // la pluma: en la mano de Candler hasta que la deja en el tintero
  const enTintero = t > b(0.595);
  if (enTintero) pluma(250, 150);
  // el dólar: en los dedos del abogado; cae, rueda girando hasta Candler y se queda de cara
  const da = tramo(t, P3 + 0.1, b(0.585)), cae = lin(t, b(0.585), b(0.62)), quita = tramo(t, b(0.7), P4);
  const wx0 = Math.round(lerp(30, 100, da)), wy0 = Math.round(lerp(212, 158, da)), va = tramo(t, b(0.6), b(0.62));
  const wx = Math.round(lerp(wx0, 122, va)) + dx, wy = Math.round(lerp(wy0, 154, va)) + dy;

  const nx = 156 + Math.round(sig * 24), ny = 147 + Math.round(Math.sin(sig * 21.6) * 2);
  let cx = nx + 15, cy = ny - 5;
  if (t > b(0.578)) { const u = tramo(t, b(0.578), b(0.595)); cx = Math.round(lerp(180 + 15, 265, u)); cy = Math.round(lerp(142, 145, u)); }
  if (t > b(0.6)) { const u = tramo(t, b(0.6), b(0.628)); cx = Math.round(lerp(265, 226, u)); cy = Math.round(lerp(145, 158, u)) + (t > b(0.64) && t < b(0.7) ? Math.round(Math.abs(Math.sin(t * 12))) : 0); }
  cx = Math.round(cx + lerp(0, 76, quita)); cy = Math.round(cy + lerp(0, 60, quita));
  const giro = 4 * (1 - (1 - Math.min(1, Math.max(0, (t - b(0.585)) / (b(0.65) - b(0.585))))) ** 2);
  let gx, gy;
  if (cae <= 0) { gx = wx + 16; gy = wy + 6; } else if (quita > 0) { gx = cx - 12; gy = cy + 8; } else { gx = Math.round(lerp(wx0 + 16, 214, cae)); gy = Math.round(166 - Math.abs(Math.sin(cae * Math.PI * 2.5)) * 8 * (1 - cae) - (1 - cae) * (166 - wy0 - 6) * 0); }
  if (t > P3 + 0.1) PZ.dolar(R, gx, gy, { s: 2, giro: cae > 0 ? giro % 1 : 0 });
  if (cae >= 1 && quita <= 0) R.numero('$1', 214, 140, { tam: 16, centro: true });

  if (!enTintero) pluma(cx - 15, cy + 5);
  T.brazo(R, cx + 34, Math.max(200, cy + 42), cx, cy, '#2e2e3a', -1, { codo: [cx + 26, cy + 22] });
  if (t > b(0.67) && t < P4) R.icono('!', 158, 100 + Math.round(Math.sin(t * 9)), hex('#ffd36a'), K0, 3);

// 4 · el mapa: de Atlanta a cada rincón
const ATL = [-84.39, 33.75];
const DESTINOS = [[[-85.31, 35.05], 0.0], [[-86.78, 36.16], 0.08], [[-90.07, 29.95], 0.15], [[-87.63, 41.88], 0.22], [[-74.0, 40.71], 0.3], [[-80.19, 25.76], 0.38], [[-96.8, 32.78], 0.44],
  [[-90.2, 38.63], 0.5], [[-104.99, 39.74], 0.58], [[-93.27, 44.98], 0.62], [[-122.42, 37.77], 0.7], [[-118.24, 34.05], 0.74], [[-122.68, 45.52], 0.8], [[-71.06, 42.36], 0.84]];
const p4 = (t) => {
  const P = T.mapa(R, t, { zona: 'eeuu' });
  const [ax, ay] = P(ATL), U = lin(t, P4 + 0.2, b(0.95));

  DESTINOS.forEach(([lugar, s], k) => { const [dx, dy] = P(lugar), u = Math.max(0, Math.min(1, (U - s) / 0.16)); if (u <= 0) return;
    const mx = (ax + dx) / 2, my = (ay + dy) / 2 - Math.hypot(dx - ax, dy - ay) * 0.15, pts = [];
    for (let i = 0; i <= 12; i++) { const q = i / 12; pts.push([Math.round((1 - q) * (1 - q) * ax + 2 * (1 - q) * q * mx + q * q * dx), Math.round((1 - q) * (1 - q) * ay + 2 * (1 - q) * q * my + q * q * dy)]); }
    R.ruta(pts, u, hex('#c83a32'), { grueso: 1, flecha: false });
    if (u < 1) { const i = Math.min(11, Math.floor(u * 12)), f = u * 12 - i, x = Math.round(pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f), y = Math.round(pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f);
      if (k % 3 === 0) { R.rect(x - 4, y - 3, x + 3, y + 1, K0); R.rect(x - 3, y - 2, x + 2, y, hex('#3a3a44')); R.rect(x + 1, y - 5, x + 2, y - 3, K0); R.pset(x + 3, y - 1, hex('#ffe8a0')); }
      else { R.rect(x - 1, y - 6, x + 1, y + 1, K0); R.pset(x, y - 5, hex('#c8c8d0')); R.rect(x, y - 3, x, y, hex('#5a3418')); } }
  });
  R.recorte(null);
  DESTINOS.forEach(([lugar, s], k) => { const [dx, dy] = P(lugar), u = (U - s) / 0.16; if (u >= 1) T.chincheta(R, dx, dy, t, hex('#c83a32'), { baja: Math.min(1, (u - 1) * 3) }); });
  // Atlanta: la botella recta grande de pie y su halo
  R.halo(ax, ay - 8, 14 + Math.sin(t * 4) * 2, rp('#c8a040', '#e8c060', '#fff0b0'), 0.7);
  PZ.botella(R, ax, ay + 2, { color: 'marron', s: 1 });
};

const efectos = [[0.15, 'vapor'], [b(0.03), 'carro'], [b(0.145), 'golpecito'], [b(0.25), 'puerta'], [b(0.31), 'toc'], [b(0.49), 'burbujas'], [b(0.585), 'papel'], [b(0.6), 'tic'],
