<script type="module">
// LF-CAIMANES (frases 11–14), cartela «2018». Catorce planos:
// 1. (cartela) la gasolinera de madrugada: una silueta sin cara llega desde lo oscuro con una caja de cartón de la que
//    asoma una cola; se para bajo la cámara del alero, que parpadea, y entra por la puerta; al fondo pasa un coche con los
//    faros y unas polillas rondan la luz (2018).
// 2. «A convenience store's cameras…»: la tienda de color: la silueta entra, deja la caja junto a la puerta en «leaving»,
//    sale el caimán pequeño en «small alligator» y la silueta se va; el dependiente se sobresalta.
// 3. «The animal wandered the aisles…»: el pasillo: el caimán recorre el pasillo, se para ante el cajón de patatas, duda
//    («?») y coge una bolsa con la boca (gag 4); en «arrived» llega el trampero con la pértiga, y detrás el dependiente, que
//    señala el caimán; lo enlaza y se lo llevan.
// 4. «The culprit… seventeen… prank»: inserto de un banco de garaje: una mano gira la manivela de la caja sorpresa; «17»;
//    en «prank» salta el caimán de juguete con su muelle.
// 5. «And years later… linked… trailer»: dos pantallas en un mueble: el monitor gris de la cámara con la grabación de la
//    tienda; una mano enciende con el mando la tele de al lado en «linked», que da el mismo plano con franjas de cine; «=» y
//    «?» que parpadean (2023).
// 6. «a security camera, and an alligator walking into a store»: el tráiler (franjas de cine): la entrada de la tienda
//    desde dentro; la cámara de la esquina gira y sigue al caimán, que entra por las puertas automáticas hacia nosotros; fuera
//    pasa un coche; el dependiente (cabeza y hombros sobre el mostrador) se sobresalta.
// 7. «Others tie it to different Florida gators…»: la terraza de un hotel de Miami: caimanes que asoman bajo la mesa,
//    tras la máquina de refrescos y por los escalones; la patinadora salta uno; el turista hace una foto; «?» en «never said».
// 8. «It wasn't the only alligator… In 2015…»: el autoservicio de noche: llega el coche a la ventanilla; «2015» (2015).
// 9. «…tossed… through the drive-thru window»: dentro: el caimán pequeño entra volando por la ventanilla, cae al suelo, y
//    el empleado salta hacia atrás (sin heridos); el compañero de la freidora se da la vuelta, se asusta; al final sonríen.
// 10. «Nobody was hurt… a few months later… police»: la pared del cuarto de atrás: el empleado entra y señala el visto
//    bueno del botiquín; mira el calendario, que pasa de octubre de 2015 a febrero de 2016; con las luces de policía se
//    sobresalta y va a mirar por la ventana; en «2023» las hojas vuelan de lado hasta marzo de 2023.
// 11. «…an eleven-foot alligator burst through a porch screen…»: el porche: la vecina sale con un vaso; el caimán grande
//    rasga la mosquitera en «burst», corre y se tira a la piscina en «slid»; el flamenco sale volando (2023).
// 12. «…like the Kool-Aid Man…»: «el anuncio» en una tele vieja: el muro del jardín tiembla dos veces y en «crashes» lo
//    atraviesa una jarra sin cara ni logo; ladrillos y salpicones; asoma el caimán por el agujero; el gato del muro da un
//    bote con el primer golpe y se va por la valla; el aspersor gira.
// 13. «And the trailer has its own version…»: el agua de la piscina: el caimán con gafas de sol flota donde estaba el
//    flamenco (gag 7); bajan las franjas de cine; el trampero llega por el borde de enfrente, le tiende la pértiga en
//    «wrangler» y retrocede sacándolo a rastras (las gafas se quedan flotando).
// 14. «…a different case, from 2019, in Palm Beach Gardens»: el pueblo: el cazador lleva un caimán con el hocico atado
//    hasta la camioneta, lo sube a la caja y cierra el portón; «2019»; al final pasa un coche por delante (2019).
import * as T from '/atomo/plato/escenas/lf-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('lf-caimanes');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const L = T.ELENCO_LF, K = T.C.k;
const P2 = en('tienda', 0.326), P3 = en('tienda', 0.628), P4 = en('broma', 0), P5 = en('broma', 0.198), P6 = en('broma', 0.490), P7 = en('broma', 0.687), P8 = en('broma', 1.013), P9 = en('wendys', 0.382), P10 = en('wendys', 0.741), P11 = en('piscina', 0.064), P12 = en('piscina', 0.321), P13 = en('piscina', 0.569), P14 = en('piscina', 0.779);
const leaving = en('tienda', 0.473), small = en('tienda', 0.523), arrived = en('tienda', 0.883), took = en('tienda', 0.946);
const d17 = en('broma', 0.069), prank = en('broma', 0.156), linked = en('broma', 0.292), shot = en('broma', 0.400), walk = en('broma', 0.576);
const different = en('broma', 0.732), gators = en('broma', 0.765), more = en('broma', 0.837), never = en('broma', 0.922);
const shop = en('wendys', 0.109), y2015 = en('wendys', 0.177), tossed = en('wendys', 0.400), through = en('wendys', 0.543);
const hurt = en('wendys', 0.756), few = en('wendys', 0.828), police = en('wendys', 0.903), y2023 = en('piscina', 0.009);
const burst = en('piscina', 0.165), slid = en('piscina', 0.238), kool = en('piscina', 0.396), crashes = en('piscina', 0.500);
const wtrailer = en('piscina', 0.579), wrangler = en('piscina', 0.665), y2019 = en('piscina', 0.887);

// ── utilidades ─────────────────────────────────────────────────────────────────────────────────────────────────────
const H = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
const lum = (c) => ((c & 255) * 0.3 + ((c >>> 8) & 255) * 0.59 + ((c >>> 16) & 255) * 0.11) / 255;
const ease = (u) => u * u * (3 - 2 * u);
const caja = (x0, y0, x1, y1, c, cL, cS) => { R.rect(x0, y0, x1, y1, K); R.rect(x0 + 1, y0 + 1, x1 - 1, y1 - 1, c); if (cL != null) R.rect(x0 + 1, y0 + 1, x1 - 1, y0 + 1, cL); if (cS != null) R.rect(x0 + 1, y1 - 1, x1 - 1, y1 - 1, cS); };
const trama = (x0, y0, x1, y1, c, d, k = 0) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (H(x, y, k) < d) R.pset(x, y, c); };
const tinte = (x0, y0, x1, y1, c, a) => { for (let y = Math.max(0, y0); y <= Math.min(179, y1); y++) for (let x = Math.max(0, x0); x <= Math.min(319, x1); x++) R.pset(x, y, mez(R.pget(x, y), c, a)); };
// madera con vetas (base, sombra, luz)
const madera = (x0, y0, x1, y1, c0, c1, c2, k = 0) => { for (let y = y0; y <= y1; y++) { const fy = H(0, y, k) * 9; for (let x = x0; x <= x1; x++) { const v = Math.sin(x * 0.07 + fy + Math.sin(x * 0.021 + y * 0.31 + k) * 2.2); R.pset(x, y, v > 0.86 ? c1 : v < -0.93 ? c2 : H(x >> 2, y, k + 3) < 0.08 ? c1 : c0); } } };
// un fondo fijo pintado una vez en su búfer
const BUF = {};
const fijo = (clave, f) => { let b = BUF[clave]; if (!b) { b = BUF[clave] = R.nuevo(); const prev = R.usar(b); f(); R.usar(prev); } R.copiar(b); };
// nubes de tres tonos
const nube = (cx, cy, w, c0, c1, c2) => { const bolas = [[0, 0, w * 0.32], [-w * 0.32, w * 0.06, w * 0.24], [w * 0.3, w * 0.05, w * 0.26], [-w * 0.1, -w * 0.12, w * 0.26], [w * 0.14, -w * 0.08, w * 0.22]];
  for (const [dx, dy, r] of bolas) R.disco(Math.round(cx + dx), Math.round(cy + dy + 1), Math.round(r), c2);
  for (const [dx, dy, r] of bolas) R.disco(Math.round(cx + dx), Math.round(cy + dy), Math.round(r), c1);
  for (const [dx, dy, r] of bolas) R.disco(Math.round(cx + dx - 1), Math.round(cy + dy - 2), Math.round(r * 0.75), c0); };
// la silueta sin cara: el actor en un búfer aparte y sus píxeles en un tono oscuro, con el filo de luz de un lado
const SIL = R.nuevo();
const silueta = (def, x, suelo, t, o = {}, luz = 1) => {
  SIL.fill(0); const prev = R.usar(SIL); const r = R.actor(def, x, suelo, t, o); R.usar(prev);
  const cS = hex('#15131d'), cM = hex('#24222f'), cL = hex('#4c4866');
  for (let y = Math.max(1, suelo - 42); y <= Math.min(178, suelo + 1); y++) for (let xx = Math.max(1, x - 8); xx <= Math.min(318, x + 24); xx++) {
    const i = y * 320 + xx; if (!SIL[i]) continue; const filo = !SIL[i + luz], arriba = !SIL[i - 320];
    R.pset(xx, y, filo ? cL : arriba ? cM : cS); }
  return r;
};
// la caja de cartón con la cola del caimán que asoma (cx, y: el centro de abajo)
const cajaCarton = (cx, y, t, cola = true, a = 7, h = 10) => {
  const c = hex('#c8945a'), cS = hex('#9a6a3a'), cL = hex('#e0b07a');
  if (cola) { const w = Math.sin(t * 6) * 1.5, n = a + 5; for (let i = 0; i < n; i++) { const px = cx + a - 1 + i, py = Math.round(y - h + 2 - i * 0.35 + w * i / n); R.pset(px, py, T.C.caiman); R.pset(px, py + 1, T.C.caimanS); if (i < n - 4) R.pset(px, py + 2, T.C.caimanS); if (i % 2) R.pset(px, py - 1, hex('#76894a')); } }
  caja(cx - a, y - h, cx + a, y, c, cL, cS); R.rect(cx - a + 1, y - (h >> 1) - 1, cx + a - 1, y - (h >> 1) - 1, cS); R.rect(cx - 1, y - h + 1, cx + 1, y - 1, hex('#d8c070'));
  R.poligono([[cx - a, y - h], [cx - a - 3, y - h - 4], [cx - a + 3, y - h - 2]], cL); R.poligono([[cx + a, y - h], [cx + a + 3, y - h - 3], [cx + a - 3, y - h - 2]], cS);
};
// la pértiga del trampero: de la mano al hocico, con el lazo
const pertiga = (m, ho, cierra) => {
  R.linea(m[0], m[1] + 1, ho[0], ho[1] + 1, hex('#2a2a30')); R.linea(m[0], m[1] - 1, ho[0], ho[1] - 1, hex('#2a2a30')); R.linea(m[0], m[1], ho[0], ho[1], hex('#d8dce4'));
  R.linea(m[0] + 2, m[1] - 1, m[0] - 3, m[1] + 2, hex('#2a2a30'));
  const r = cierra ? 2 : 4; R.anillo(ho[0], ho[1], r, hex('#e8d070'));
};
// las gafas de sol sobre el ojo del caimán
const gafas = (o, d = 1) => { const [x, y] = o, mo = hex('#ff4fa8'); R.rect(x - 8, y - 3, x + 7, y + 3, mo); R.rect(x - 1, y - 3, x + 1, y - 2, mo); R.rect(x - 7, y - 2, x - 2, y + 2, K); R.rect(x + 2, y - 2, x + 6, y + 2, K); R.rect(x - 1, y - 1, x + 1, y + 3, hex('#5a6a3a')); R.pset(x - 6, y - 1, hex('#ffffff')); R.pset(x - 5, y - 1, hex('#ffffff')); R.pset(x - 6, y, hex('#a8d8ff')); R.pset(x + 3, y - 1, hex('#ffffff')); R.pset(x + 4, y - 1, hex('#a8d8ff')); R.linea(x - 9 * d, y - 1, x - 14 * d, y + 1, mo); };
// un bocadillo blanco con un icono
const bocadillo = (x, y, ic, c = K) => { R.rect(x - 6, y - 11, x + 6, y + 1, K); R.rect(x - 5, y - 10, x + 5, y, hex('#f6f6f2')); R.pset(x - 2, y + 2, K); R.pset(x - 1, y + 2, K); R.pset(x - 2, y + 1, hex('#f6f6f2')); R.icono(ic, x - 2, y - 8, c, hex('#c8c8d0')); };
// una pantalla a partir de un búfer de 320 × 180 (escala por muestreo; f: color → color)
const volcar = (src, x0, y0, x1, y1, sx0, sy0, sx1, sy1, f) => { const w = x1 - x0 + 1, h = y1 - y0 + 1;
  for (let j = 0; j < h; j++) { const sy = Math.min(179, Math.floor(sy0 + (j + 0.5) / h * (sy1 - sy0))); for (let i = 0; i < w; i++) { const sx = Math.min(319, Math.floor(sx0 + (i + 0.5) / w * (sx1 - sx0))); R.pset(x0 + i, y0 + j, f(src[sy * 320 + sx], i, j)); } } };

// ── 1 · la gasolinera de madrugada ───────────────────────────────────────────────────────────────────────────────
const p1 = (t) => {
  const o = { encuadre: 'pueblo', camara: 'gasolinera' }, g = T.interior(R, t, o);
  // la cámara del alero, con su luz roja
  R.rect(200, 38, 210, 43, K); R.rect(201, 39, 209, 42, hex('#d8dce4')); R.rect(198, 36, 201, 40, K); R.disco(209, 41, 1, K); if (Math.floor(t * 2) % 2) R.pset(203, 40, hex('#ff3a3a'));
  const tt = t < 3.3 ? t : t < 3.9 ? 3.3 : t - 0.6;   // se para medio segundo bajo la cámara
  const u = T.lerp(0, 1, Math.max(0, Math.min(1, (tt - 1.4) / 3.7))), x = Math.round(T.lerp(272, 186, ease(u)));
  const anda = t > 1.5 && t < 5.7;
  // la puerta se ilumina al abrirse
  if (t > 5.75) tinte(188, 92, 198, g.suelo - 1, hex('#fff0b0'), Math.min(0.55, (t - 5.75) * 1.5));
  // un coche lejano pasa por la carretera de la derecha con los faros encendidos (recortado a su hueco, tras la valla)
  const cl = (t - 1.2) / 3.4; if (cl > 0 && cl < 1) { const qx = Math.round(T.lerp(330, 262, cl)); R.recorte([270, 128, 319, 150]);
    R.poligono([[qx, 140], [qx + 14, 140], [qx + 14, 144], [qx, 144]], hex('#6a7aa0')); R.linea(qx, 140, qx + 14, 140, hex('#9aaad0')); R.poligono([[qx + 3, 137], [qx + 10, 137], [qx + 12, 140], [qx + 2, 140]], hex('#4a5a80'));
    R.linea(qx + 4, 138, qx + 9, 138, hex('#a8c0e8')); R.pset(qx + 3, 145, K); R.pset(qx + 11, 145, K);
    R.poligono([[qx - 14, 141], [qx - 1, 142], [qx - 1, 143], [qx - 14, 145]], (x, y) => mez(R.pget(x, y), hex('#fff0b0'), 0.45)); R.pset(qx, 142, hex('#fff6c0')); R.pset(qx + 14, 142, hex('#ff3a3a')); R.recorte(null); }
  // las polillas que revolotean junto a la luz de la cámara
  for (let k = 0; k < 4; k++) R.pset(Math.round(205 + Math.sin(t * (3 + k) + k * 2) * (6 + k)), Math.round(48 + Math.cos(t * (4 - k * 0.5) + k) * 4), hex('#e8e0c8'));
  // la silueta mira un instante a la cámara (se para) y sigue hacia la puerta
  const r = silueta(L.ciudadanoLF, x, g.suelo, t, { dir: -1, anda: anda && !(t > 3.3 && t < 3.9), sostiene: [x - 4, g.suelo - 13] }, 1);
  cajaCarton(r.mano[0] - 4, r.mano[1] + 7, t, true, 10, 13);
  T.interiorDelante(R, t, o);
};
// ── 2 · la tienda: la silueta deja la caja ──────────────────────────────────────────────────────────────────────
const p2 = (t) => {
  const abre = Math.max(Math.min(1, (t - P2) / 0.4), 0) - Math.max(0, Math.min(1, (t - (P3 - 0.7)) / 0.4)) * (t > P3 - 0.7 ? 1 : 0);
  const o = { encuadre: 'tienda', puerta: t < leaving ? Math.min(1, Math.max(0, (t - P2) / 0.4)) * (t < P2 + 1.2 ? 1 : Math.max(0, 1 - (t - P2 - 1.2) / 0.4)) : Math.max(0, Math.min(1, (t - (small + 0.3)) / 0.3)) * (t < P3 - 0.5 ? 1 : 0), hora: '03:52' };
  const g = T.tienda(R, t, o);
  // la silueta: entra por la puerta, baja y deja la caja; luego se va
  const ida = ease(Math.max(0, Math.min(1, (t - P2 - 0.1) / (leaving - P2 - 0.3)))), vuelta = ease(Math.max(0, Math.min(1, (t - small - 0.2) / (P3 - small - 0.35))));
  const sx = Math.round(T.lerp(36, 74, ida) + (T.lerp(74, 36, vuelta) - 74) * (vuelta > 0 ? 1 : 0)), sy = Math.round(T.lerp(110, 160, ida) + (T.lerp(160, 110, vuelta) - 160) * (vuelta > 0 ? 1 : 0));
  const deja = t > leaving - 0.2, cajaX = 96, cajaY = 162;
  if (deja) cajaCarton(cajaX, cajaY, t, t < small, 10, 13);
  // el caimán pequeño sale de la caja y echa a andar
  const cu = Math.max(0, (t - small) / (P3 - small));
  if (t > small) T.a_caiman(R, Math.round(T.lerp(102, 150, ease(Math.min(1, cu)))), 164, t, { s: 1.3, anda: cu < 1 ? 1 : 0 });
  if (t < P3 - 0.15 && (vuelta < 1)) {
    const lleva = !deja, dir = vuelta > 0 ? -1 : 1, an = (ida > 0 && ida < 1) || (vuelta > 0 && vuelta < 1);
    const r = silueta(L.ciudadanoLF, sx, sy, t, { dir, anda: an, sostiene: lleva ? [sx + 20, sy - 13] : (t < small + 0.2 ? [sx + 20, sy - 6] : undefined) }, -1);
    if (lleva) cajaCarton(r.mano[0] + 4, r.mano[1] + 7, t, true, 10, 13);
  }
  // el dependiente: mira el móvil; se sobresalta al ver el caimán
  const ve = t > small + 0.6;
  const rd = R.actor(L.dependienteLF, 262, 130, t, { dir: -1, sorpresa: ve, salto: ve && t < small + 0.9 ? 2 : 0, sostiene: ve ? undefined : [256, 112] });
  if (!ve) { const [mx, my] = rd.mano; R.rect(mx - 2, my - 6, mx + 1, my, K); R.rect(mx - 1, my - 5, mx, my - 1, hex('#6ac8f0')); }
  if (ve && t < small + 1.6) bocadillo(270, 96, '!', hex('#d83a3a'));
  T.tiendaDelante(R, t, o);
};
// ── 3 · el pasillo: las patatas y el trampero ─────────────────────────────────────────────────────────────────────
const p3 = (t) => {
  const o = { encuadre: 'tienda', camara: 'pasillo' }, g = T.tienda(R, t, o);
  const llega = ease(Math.max(0, Math.min(1, (t - P3 - 0.1) / 1.7)));
  const lleva = Math.max(0, Math.min(1, (t - took - 0.1) / 2.1));
  let gx = Math.round(T.lerp(10, 168, llega) + lleva * 150);
  const elige = t > P3 + 1.8 && t < took, coge = t > P3 + 2.9;
  const r = T.a_caiman(R, gx, 166, t, { s: 2, anda: (llega > 0 && llega < 1) || (lleva > 0 && lleva < 1) ? 1 : 0, boca: elige && !coge ? 0.25 + 0.15 * Math.sin(t * 6) : 0 });
  // gag 4: duda entre las bolsas y coge una
  if (elige && t < P3 + 2.9) bocadillo(r.hocico[0] - 18, r.hocico[1] - 22, '?');
  if (coge) { const [hx, hy] = r.hocico; const b = hex('#e8b030'); R.rect(hx - 3, hy - 9, hx + 4, hy + 1, K); R.rect(hx - 2, hy - 8, hx + 3, hy, b); R.rect(hx - 2, hy - 8, hx + 3, hy - 7, hex('#d83a3a')); R.pset(hx, hy - 4, hex('#fff0a0')); }
  // el trampero: entra por la derecha en «arrived», enlaza el hocico y se lo lleva
  const tu = ease(Math.max(0, Math.min(1, (t - (arrived - 0.9)) / 0.9)));
  if (t > arrived - 0.9) {
    const tx = Math.round(T.lerp(330, 238, tu) + lleva * 150), alarga = Math.max(0, Math.min(1, (t - arrived) / 0.5));
    const ra = R.actor(L.tramperoLF, tx, 168, t, { dir: -1, anda: (tu > 0 && tu < 1) || (lleva > 0 && lleva < 1), sostiene: [tx - 2, 150], sonrisa: lleva > 0.2 });
    const ho = [Math.round(T.lerp(ra.mano[0] - 8, r.hocico[0] + 2, alarga)), Math.round(T.lerp(ra.mano[1] + 2, r.hocico[1] - 2, alarga))];
    pertiga(ra.mano, ho, t > arrived + 0.55);
  }
  // el dependiente llega detrás del trampero, señala el caimán y, cuando se lo llevan, los acompaña sonriendo
  if (t > arrived - 0.5) { const du = ease(Math.max(0, Math.min(1, (t - (arrived - 0.5)) / 1.0))), dx = Math.round(T.lerp(345, 272, du) + lleva * 150);
    R.actor(L.dependienteLF, dx, 170, t, { dir: lleva > 0 ? 1 : -1, anda: (du > 0 && du < 1) || (lleva > 0 && lleva < 1), dedo: t > arrived + 0.4 && t < took, sonrisa: t > took, habla: t > arrived + 0.4 && t < took && Math.sin(t * 8) > 0 }); }
  T.tiendaDelante(R, t, o);
