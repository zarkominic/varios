<script type="module">
// JM-HISTORIA (frase «alan»), cartela «1995». Cinco planos:
// 1. un caballete de cerca (vista libre): la mano canónica sola (sin brazo, con su sombra en el papel) dibuja a lápiz
//    una claqueta mientras el número cuenta de 1 a 14 a la vez que el año de la barra (1981 → 1995) y se retira por
//    abajo; la claqueta se cierra («14 years»); un «!» rojo («a problem») y el libro fino llega lanzado y queda
//    clavado con una chincheta: 32 («A 32-page book»);
// 2. los dos relojes: el guionista señala el de 10 minutos («10 minutes»), se vuelve al de 100 («runs 100») y da un
//    salto cuando la película le pasa por los pies;
// 3. el despacho de guionistas: las fichas se van clavando en el corcho («Almost everything had to be invented»), uno
//    teclea y la otra encesta una bola en la papelera; entra Van Allsburg con una hoja («himself helped») y la lanza al
//    corcho: es la última ficha («out of it came…»);
// 4. el salón de la casa en 1969, de lado y en color, con NUESTRO tablero abierto en la alfombra (en perspectiva, lo
//    pinta la escena): un chico llega, su ficha roja avanza a saltitos («A boy»), la meta de latón se enciende (anillos
//    tumbados y una columna de luz) y se lo traga en espiral («swallows»); queda una hoja de selva donde estaba él;
// 5. el calendario arranca 26 hojas, de 1969 a 1995; la caja de la repisa tiembla y lo devuelve ya adulto, con la
//    misma gorra y barba («26 years later»).
import * as T from '/atomo/plato/escenas/jm-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('jm-historia');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const h = (s) => en('alan', (s - 1.5) / 20.767);   // el segundo de cada palabra inglesa
const P2 = h(5.96), P3 = h(9.59), P4 = h(15.12), P5 = h(19.66);
const sua = (u) => u * u * (3 - 2 * u);
const K = hex('#14121c'), P = T.PIEZAS_JM;
const hh = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
// un personaje pintado aparte para poder girarlo y encogerlo (el remolino del juego)
const buf = R.nuevo();
const enBuf = (el, t, o) => { const prev = R.usar(buf); buf.fill(0); R.actor(el, 20, 70, t, o); R.usar(prev); };
const girado = (cx, cy, s, ang, halo) => { const c = Math.cos(ang), sn = Math.sin(ang), r = Math.ceil(26 * s);
  for (const pasada of halo ? [1, 0] : [0]) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) { const sx = Math.round(27.5 + (dx * c + dy * sn) / s), sy = Math.round(55 + (-dx * sn + dy * c) / s); if (sx < 8 || sx > 47 || sy < 28 || sy > 74) continue; const col = buf[sy * 320 + sx]; if (!col) continue; const X = Math.round(cx) + dx, Y = Math.round(cy) + dy;
    if (pasada) { for (const [i, j] of [[2, 0], [-2, 0], [0, 2], [0, -2], [1, 1], [-1, 1], [1, -1], [-1, -1]]) R.pset(X + i, Y + j, halo); } else R.pset(X, Y, col); } };
const ALAN = { J: hex('#e8b830'), j: hex('#f8d860'), C: hex('#d8642a'), c: hex('#b04c1c'), p: hex('#8a3a14'), H: hex('#8a4a22'), h: hex('#a8643a'), F: hex('#3e5a8a') };   // el chico inventado por el cine: gorra amarilla y jersey naranja, de niño y de adulto
const chispa = (x, y, c) => { R.pset(x, y, hex('#ffffff')); for (const [i, j] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) R.pset(x + i, y + j, c); };

// 1. el caballete (vista libre): la claqueta a lápiz, 14 años, y el libro fino de 32 páginas
const GR = hex('#3a3a44'), GR2 = hex('#9a9aa2'), PAPEL = hex('#f2f0e8'), MANGA = '#6a4a34';
// la mano canónica sola (sin brazo: desde el papel no se llega a ningún borde en 45 px), con su sombra tramada sobre

const sombraMano = (cx, cy, rx, ry) => { const [x0, y0, x1, y1] = HOJA; for (let j = -ry; j <= ry; j++) for (let i = -rx; i <= rx; i++) { const x = cx + i, y = cy + j; if ((x + y) & 1 || (i * i) / (rx * rx) + (j * j) / (ry * ry) > 1 || x < x0 || x > x1 || y < y0 || y > y1) continue; R.pset(x, y, hex('#b4b0a4')); } };

// 3. hubo que inventar casi todo

  const g = T.keene(R, t, o), [[x1, s1], [x2, s2], [x3, s3]] = g.puestos, F = Array.isArray(g.ficha) ? g.ficha : [221, 81];

// 4. el juego se traga al chico (1969): el salón de lado, en color, con NUESTRO tablero abierto en la alfombra

const TB = { cx: 128, y0: 146, y1: 171, w0: 96, w1: 126 };

const MADERA = hex('#4a2c18'), MADERA2 = hex('#2e1a0e'), LATON = hex('#e8b830'), LATON2 = hex('#fff6a0'), LATON3 = hex('#a8741c'), ROJO = hex('#d8303a');
const tablero3d = (t, luz) => {
  const { cx, y0, y1, w0, w1 } = TB, NI = 19, NJ = 11;

  for (let y = y1 + 2; y <= y1 + 7; y++) { const w = w1 + 4 - (y - y1 - 4) * 2; for (let x = Math.round(cx - w / 2) + 3; x <= cx + w / 2 + 6; x++) if ((x + y) & 1 || y <= y1 + 5) R.pset(x, y, hex('#3a1014')); }
  for (let y = y0 - 1; y <= y1 + 4; y++) { const q = Math.min(1, Math.max(0, (y - y0) / (y1 - y0))), w = lerp(w0, w1, q), xa = Math.round(cx - w / 2) - 1, xb = Math.round(cx + w / 2) + 1, v = q / (0.8 + 0.2 * q);
    for (let x = xa; x <= xb; x++) { let c;

        const anillo = (a, b) => ci >= a && ci <= NI - 1 - a && cj >= b && cj <= NJ - 1 - b && (ci === a || ci === NI - 1 - a || cj === b || cj === NJ - 1 - b);
        if (ci === 0 || ci === NI - 1 || cj === 0 || cj === NJ - 1) c = (ci === 0 || ci === NI - 1) && (cj === 0 || cj === NJ - 1) ? LATON3 : hh(ci, y) > 0.7 ? MADERA2 : hex('#5a361c');   // el marco, con cantoneras

  const [gx, gy] = tabPunto(0.5, 0.5), rr = 10 + (luz > 0 && Math.sin(t * 16) > 0 ? 1 : 0);

// una elipse tumbada en el suelo (los anillos de la meta), a trazos
const elipse = (cx, cy, rx, col, paso) => { const n = Math.max(12, Math.round(rx * 5)); for (let k = 0; k < n; k++) { if (paso && Math.floor(k / paso) & 1) continue; const an = k / n * Math.PI * 2; R.pset(Math.round(cx + Math.cos(an) * rx), Math.round(cy + Math.sin(an) * rx * 0.3), col); } };
const p4 = (t) => {
  const TR = h(17.3), FIN = h(18.5), SUELO = 164, QQ = 0.45;
  const o = { encuadre: 'salon', color: 1 };
  T.casaJuego(R, t, o);
  const entra = tramo(t, P4 + 0.05, h(16.2)), u = tramo(t, TR, FIN), bx = Math.round(lerp(326, 200, sua(entra))), by = SUELO;
  const luz = tramo(t, h(17.0), TR) * (1 - tramo(t, FIN + 0.5, FIN + 1.2));

  if (P.cajaJuego) { for (let i = -18; i <= 20; i++) for (let j = 0; j <= 2; j++) if ((i + j) & 1 || j === 0) R.pset(244 + i, 160 + j, hex('#3a1014')); P.cajaJuego(R, 244, 160); }

  // las fichas, de pie en el tablero: la azul espera; la roja la mueve él a saltitos («A boy»)
  { const av = tramo(t, h(16.45), h(17.2)), paso = Math.min(3, Math.floor(av * 3 + 1e-6)), fr = av * 3 - paso, [ax, ay] = tabPunto(0.13, 0.87), [rx0, ry] = tabPunto(0.22, 0.87);
    const rx = rx0 + paso * 7 + Math.round((av < 1 ? fr : 0) * 7), salto = av > 0 && av < 1 ? Math.round(Math.sin(fr * Math.PI) * 5) : 0;

  if (luz > 0) { for (let k = 0; k < 3; k++) { const r = 12 + ((t * 14 + k * 9) % 27) * (u > 0 ? -1 : 1) + (u > 0 ? 27 : 0); elipse(gx, gy, r, k % 2 ? LATON2 : hex('#f0c030'), 3); }

  if (u <= 0) {
    for (let i = -6; i <= 6; i++) for (let j = -1; j <= 1; j++) if ((i + j) & 1 && Math.abs(i) + Math.abs(j) * 3 < 8) R.pset(bx + 7 + i, by + j, hex('#3a1014'));
    R.actor(EL.chico1JM, bx, by, t, { pal: ALAN, dir: -1, anda: entra > 0 && entra < 1, dedo: t > h(16.45) && t < h(17.05), sorpresa: t > h(17.05), brazos: t > TR - 0.12 });

    const sx = bx + 7.5, sy = by - 13, d0 = Math.hypot(sx - gx, (sy - gy) / QQ), a0 = Math.atan2((sy - gy) / QQ, sx - gx), pos = (e) => { const r = d0 * (1 - e), an = a0 + e * Math.PI * 2.5; return [gx + Math.cos(an) * r, gy + Math.sin(an) * r * QQ - Math.sin(Math.PI * e) * 10]; };

  }

  { const f = tramo(t, FIN, FIN + 0.5); if (f > 0 && f < 1) { elipse(gx, gy, 12 + f * 80, LATON2, 2); elipse(gx, gy, 10 + f * 56, hex('#f0c030'), 4); if (f < 0.3) { R.disco(gx, gy - 2, 8 - f * 18, hex('#ffffff')); for (let k = 0; k < 8; k++) { const an = k * Math.PI / 4; R.linea(gx, gy - 2, Math.round(gx + Math.cos(an) * 18), Math.round(gy - 2 + Math.sin(an) * 12), LATON2); } } }
    const v = tramo(t, FIN + 0.1, FIN + 0.9); if (v > 0 && P.hojaSelva) { const e = sua(v), x = Math.round(lerp(gx, 207, e) + Math.sin(v * 9) * 5 * (1 - v)), y = Math.round(lerp(gy - 4, SUELO, e) - Math.sin(v * Math.PI) * 34); if (v >= 1) for (let i = -6; i <= 6; i++) if (i & 1) R.pset(207 + i, SUELO, hex('#3a1014')); P.hojaSelva(R, x, y, { t: v < 1 ? t * 3 : t }); }
    if (t > FIN) for (let k = 0; k < 6; k++) { const an = t * 2 + k * 1.05, r = 20 + Math.sin(t * 3 + k) * 4; if (Math.sin(t * 5 + k * 2) > 0.2 && t < FIN + 1.0) chispa(Math.round(gx + Math.cos(an) * r), Math.round(gy - 6 + Math.sin(an) * r * 0.5), hex('#f0c030')); } }
  T.casaJuegoDelante(R, t, o);
};

// 5. veintiséis hojas después
const U5 = (t) => tramo(t, P5 + 0.15, h(21.5));

    R.actor(EL.tecnicoFX2JM, 82, 164, t, { pal: ALAN, dir: 1, sorpresa: dt < 0.6, sonrisa: dt >= 0.6, brazos: dt >= 0.75 && Math.floor(t * 5) % 2 === 0, salto: Math.round(Math.abs(Math.sin(dt * 9)) * 6 * Math.max(0, 1 - dt * 1.8)) });
    if (P.hojaSelva) { const f = tramo(dt, 0, 1.1), x = Math.round(40 - f * 8 + Math.sin(dt * 6) * 5 * (1 - f)), y = Math.round(lerp(128, 168, f)); if (dt < 0.35) for (let k = 0; k < 6; k++) { const d = (k < 3 ? -1 : 1) * (6 + dt * 40 + (k % 3) * 3); R.disco(Math.round(89 + d), 163 - (k % 3), 1.5, hex('#e4dcc4')); } P.hojaSelva(R, x, y, { t: f < 1 ? t * 3 : 0 }); }
  } else if (v > 0) {
    enBuf(EL.tecnicoFX2JM, t, { pal: ALAN, dir: 1, sorpresa: true, brazos: true });
    const e = sua(v), x = lerp(62, 89.5, e) + Math.sin(Math.PI * e) * 30, y = lerp(88, 151, e) - Math.sin(Math.PI * e) * 26;
    for (let k = 1; k <= 10; k++) { const vk = v - k * 0.03; if (vk <= 0) break; const ek = sua(vk); chispa(Math.round(lerp(62, 89.5, ek) + Math.sin(Math.PI * ek) * 30), Math.round(lerp(88, 151, ek) - Math.sin(Math.PI * ek) * 26), k % 2 ? hex('#fff6a0') : hex('#3aa85a')); }

};

const efectos = [[1.5, 'lapiz'], [h(2.95), 'palmada'], [h(3.7), 'aviso'], [h(4.9), 'golpecito'], [h(6.3), 'tic'], [h(8.1), 'maquina'], [h(8.8), 'boing'], [P3 + 0.3, 'tecleo'], [h(10.6), 'papel'], [h(14.55), 'pop'],
  [h(16.5), 'toc'], [h(17.3), 'whoosh'], [h(18.5), 'brillo'], [P5 + 0.3, 'papel'], [h(21.6), 'rafaga'], [h(22.4), 'boing']];
T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3], [P4, p4], [P5, p5]], { efectos, cartela: '1995', año });
