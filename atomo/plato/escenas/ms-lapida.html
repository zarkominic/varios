const relleno = (x0, y0, x1, y1, ramp, vf) => caja(x0, y0, x1, y1, (x, y) => R.pset(x, y, rmp(ramp, vf(x, y), x, y)));

// ── PIEZAS DE INTERIOR ──
// papel pintado de damasco: rayas finas y una flor en rombo, más oscuro junto al techo y a los rincones
const papel = (x0, y0, x1, y1, ramp, k = 0, o = {}) => relleno(x0, y0, x1, y1, ramp, (x, y) => {
  const c = Math.floor((x - x0) / 14), gx = (x - x0) % 14, gy = ((y - y0) + (c % 2) * 9) % 18, dx = Math.abs(gx - 7), dy = Math.abs(gy - 9);
  let v = (o.base ?? 2.4) + (ns(x * 0.05 + k, y * 0.06) - 0.5) * 0.6;
  const d = dx + dy * 0.7; if (d < 4 && d > 2.2) v += 0.9; else if (d < 1.2) v += 0.7;
  if (dx === 0 && dy > 4 && dy < 8) v += 0.5;

// el friso de madera con sus paneles en relieve (luz arriba a la izquierda) y el zócalo
const friso = (x0, x1, y0, y1, ramp, paso = 30, k = 0) => {
  relleno(x0, y0, x1, y1, ramp, (x, y) => 2.4 + (ns(x * 0.25 + k, y * 0.05) - 0.5) * 1.0 + (Math.sin(x * 0.9 + ns(x * 0.1, y * 0.2) * 4) > 0.85 ? -0.6 : 0));
  for (let x = x0; x <= x1; x++) { ps(x, y0, ramp[0]); ps(x, y0 + 1, ramp[5]); ps(x, y0 + 2, ramp[4]); ps(x, y1, ramp[0]); ps(x, y1 - 1, ramp[1]); ps(x, y1 - 2, ramp[1]); }
  for (let px = x0 + 4; px + paso - 8 <= x1; px += paso) { const a = px, b = px + paso - 8, c0 = y0 + 6, c1 = y1 - 7;
    for (let x = a; x <= b; x++) { ps(x, c0, ramp[0]); ps(x, c0 + 1, ramp[5]); ps(x, c1, ramp[5]); ps(x, c1 + 1, ramp[4]); }

// la tarima: tablas de 5 px con sus juntas, vetas y clavos; más oscura hacia el fondo

// una vela en su candelero (x, base): la llama tiembla; o.alta: altura de la vela; devuelve la punta de la llama

  const alta = o.alta ?? 6, k = o.k ?? x;

// fuego en la boca de una chimenea (x0–x1, base): llamas que suben con ruido y chispas
const fuego = (x0, x1, base, t, alto = 12, k = 0) => {
  for (let x = x0; x <= x1; x++) { const u = (x - x0) / (x1 - x0), env = Math.sin(u * Math.PI);
    const hgt = env * alto * (0.55 + 0.45 * ns(x * 0.35 + k, t * 5)) + 1;
    for (let j = 0; j < hgt; j++) { const v = 5.6 - (j / hgt) * 5.2 + (ns(x * 0.5, j * 0.4 - t * 7) - 0.5) * 1.6; if (v > 0.2) ps(x, base - j, rmp(LLAMA, v, x, base - j)); } }

};

// relleno de un polígono en una máscara (W × Hh con esquina X0, Y0)
const mascara = (X0, Y0, W, Hh) => { const m = new Uint8Array(W * Hh);
  const pon = (px, py) => { px -= X0; py -= Y0; if (px >= 0 && px < W && py >= 0 && py < Hh) m[py * W + px] = 1; };
  const elip = (cx, cy, rx, ry) => { for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) if (((x + 0.5 - cx) / rx) ** 2 + ((y + 0.5 - cy) / ry) ** 2 <= 1) pon(x, y); };
  const poli = (pts) => { let y0 = Infinity, y1 = -Infinity; for (const [, py] of pts) { y0 = Math.min(y0, py); y1 = Math.max(y1, py); }
    for (let y = Math.floor(y0); y <= Math.ceil(y1); y++) { const xs = []; for (let i = 0; i < pts.length; i++) { const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length], yc = y + 0.5; if ((ay <= yc && by > yc) || (by <= yc && ay > yc)) xs.push(ax + (yc - ay) / (by - ay) * (bx - ax)); }
      xs.sort((a, b) => a - b); for (let k = 0; k + 1 < xs.length; k += 2) for (let x = Math.round(xs[k]); x < Math.round(xs[k + 1]); x++) pon(x, y); } };
  const en = (x, y) => { x -= X0; y -= Y0; return x >= 0 && x < W && y >= 0 && y < Hh && m[y * W + x] === 1; };
  return { m, pon, elip, poli, en };
};

  { const f = (t * 0.45) % 4; if (f < 1.5) { const s2 = ri(Math.sin(Math.min(1, f) * Math.PI) * 4), x = 272; R.rect(x - s2, 145, x - s2 + 3, 147, H('#6a6070')); ps(x - s2 - 1, 146, H('#6a6070')); ps(x - s2, 144, H('#8a8090')); ps(x - s2 - 1, 145, K); } }
};

// ── P19 · La calle de madrugada (julio de 1814): Mary sale por su puerta con la bolsa y llega a la acera, donde Percy espera
// detrás de la línea del coche; él sube la bolsa al techo en «fit»; en «run away» pasan por detrás del coche y suben, y el
// coche se va hacia la izquierda («to France»). El coche y el caballo se pintan aquí, después de la gente ──
const p19 = (t) => {
  const va = tramo(t, TG.HIM - 0.2, TG.FIN + 0.2), X0 = ri(lerp(108, -150, ease(va) * 0.7 + va * 0.3)), cla = lerp(0.3, 0.55, tramo(t, TG.P19, TG.FIN));
  const oo = { encuadre: 'calle', clarea: cla, carruaje: false };
  T.londres(R, t, oo);
  const u = tramo(t, TG.LEAVES - 0.1, TG.FIT - 0.8), mx0 = lerp(214, 224, ease(u)), my0 = u < 0.4 ? lerp(137, 143, u / 0.4) : 143;
  const entra = tramo(t, TG.RUN - 0.2, TG.RUN + 0.5), dentro2 = entra >= 1;
  const mx = lerp(mx0, 178, ease(entra)), pxx = lerp(206, 170, ease(entra));
  const pasa = tramo(t, TG.FIT - 0.7, TG.FIT - 0.3), sube = tramo(t, TG.FIT - 0.3, TG.FIT + 0.4);
  let bolsa = null;
  if (!dentro2) {
    const rm = R.actor(MS.maryMS, ri(mx), ri(my0), t, { dir: entra > 0 ? -1 : -1, anda: (u > 0 && u < 1) || (entra > 0 && entra < 1), sostiene: pasa < 1 ? true : false, sorpresa: t < TG.LEAVES + 0.3, sonrisa: t > TG.FIT });
    const rp = R.actor(MS.percyMS, ri(pxx), 143, t, { dir: entra > 0 ? -1 : 1, anda: entra > 0 && entra < 1, brazos: sube > 0 && sube < 1, sostiene: pasa > 0 && sube <= 0 ? [214, 126] : false, sonrisa: true, dedo: t > TG.LEAVES + 0.4 && t < TG.FIT - 0.8 });
    if (pasa <= 0) bolsa = [rm.mano[0], rm.mano[1] + 7]; else if (pasa < 1) bolsa = [lerp(rm.mano[0], 214, ease(pasa)), lerp(rm.mano[1] + 7, 133, ease(pasa))];
    else if (sube <= 0) bolsa = [214, 133];
    if (bolsa) bolsaViaje(bolsa[0], bolsa[1], 0, 6);
  }
  coche(X0, 150, t, va > 0, cla, { bolsa: sube >= 1 });
  // la bolsa en el aire, de las manos de Percy al techo del coche (por encima de la caja)
  if (sube > 0 && sube < 1) bolsaViaje(lerp(214, X0 + 46, ease(sube)), lerp(122, 107, ease(sube)) - Math.sin(sube * Math.PI) * 14, 0, 6);
  T.londresDelante(R, t, oo);
};
