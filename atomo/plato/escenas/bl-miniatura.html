<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ep48 · miniatura A</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// BL-MINIATURA (A, la principal) · ep48, prueba de miniaturas SIN ATOM y con texto en inglés (aprobada por el usuario el
// 25/11/2026: «sí, sin Atom, haz las tres… van de prueba»). Estilo nuevo: UNA idea de cine. De noche, en el claro de Goose
// Creek (el bosque de Bedford), al pie del roble, un cofre de madera recién desenterrado rebosa de oro a la luz de un
// farol; un buscador chibi grande (al triple) se queda boquiabierto con la hoja de números en la mano y la pala clavada.
// Arriba, «ONLY NUMBERS» (el mapa del tesoro son solo números). Nada morboso; sin Atom.
import { crearRoma } from '/atomo/plato/kits/pixel-roma.js';
import { conChibi } from '/atomo/plato/kits/pixel-chibi.js';
import { hex } from '/atomo/plato/kits/pixel-retro.js';
import * as T from '/atomo/plato/escenas/bl-comun.js';
import { figura, grado, halo } from '/atomo/plato/escenas/mini-chibi.js';
import { palabra, ancho } from '/atomo/plato/escenas/bl-mini-letras.js';
const R = conChibi(await crearRoma(document.getElementById('lienzo')));
const K = hex('#140c08');
const mez = (a, b, f) => { let r = 0; for (const sh of [0, 8, 16]) r |= (Math.round(((a >>> sh) & 255) * (1 - f) + ((b >>> sh) & 255) * f) & 255) << sh; return (0xff000000 | r) >>> 0; };
const h = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const ORO = ['#6a4410', '#a87820', '#d8a830', '#f0c840', '#ffe470', '#fff8d0'].map(hex);
// una moneda de 5 × 3 vista de canto o de frente (k: su tono), con su brillo
const moneda = (x, y, k) => { x = Math.round(x); y = Math.round(y); R.rect(x - 2, y - 1, x + 2, y + 1, ORO[1]); R.rect(x - 1, y - 1, x + 1, y, ORO[2 + (k % 2)]); R.pset(x - 1, y - 1, ORO[4]); R.pset(x + 2, y + 1, ORO[0]); };
const lingote = (x, y) => { x = Math.round(x); y = Math.round(y); R.rect(x - 6, y - 3, x + 6, y + 2, K); R.rect(x - 5, y - 2, x + 5, y + 1, ORO[2]); R.rect(x - 4, y - 2, x + 4, y - 2, ORO[4]); R.rect(x - 5, y + 1, x + 5, y + 1, ORO[1]); R.pset(x - 3, y - 1, ORO[5]); };
const destello = (x, y, n, f = 1) => { for (let k = -n; k <= n; k++) { const c = Math.abs(k) < 2 ? ORO[5] : ORO[4]; if (f > 0.5 || Math.abs(k) < n) { R.pset(x + k, y, c); R.pset(x, y + k, c); } } R.pset(x, y, hex('#ffffff')); };
// el cofre de madera con herrajes, abierto, a medio salir del hoyo (x, y: el centro de su base)
const cofre = (x, y, t) => {
  const MAD = ['#2a160a', '#4a2a14', '#6a3e1e', '#8a5428', '#a86e36'].map(hex), HI = ['#2a2a30', '#4a4a52', '#7a7a84'].map(hex);
  const x0 = x - 30, x1 = x + 30, y0 = y - 26, y1 = y;
  // la tapa abierta hacia atrás (se ve su cara de dentro, en sombra)
  for (let yy = y0 - 22; yy <= y0; yy++) { const w = Math.round(lerp(26, 30, (yy - y0 + 22) / 22)); for (let xx = x - w; xx <= x + w; xx++) R.pset(xx, yy, (xx === x - w || xx === x + w || yy === y0 - 22) ? K : MAD[1 + Math.round(h(xx >> 2, yy, 7) * 1.2)]); }
  for (const yy of [y0 - 18, y0 - 6]) R.rect(x - 28, yy, x + 28, yy + 2, HI[1]);
  // la boca: el oro que rebosa (un montón en cúpula con monedas, lingotes, una copa y un collar)
  const mont = (xx) => y0 - 2 - Math.round(14 * Math.cos(((xx - x) / 34) * Math.PI / 2));
  for (let xx = x0 + 2; xx <= x1 - 2; xx++) for (let yy = mont(xx); yy <= y0 + 4; yy++) { const v = 2 + Math.round(1.6 * (1 - (yy - mont(xx)) / 18) + (h(xx, yy, 3) - 0.5) * 1.6); R.pset(xx, yy, ORO[Math.max(0, Math.min(5, v))]); }
  for (let k = 0; k < 34; k++) { const xx = x0 + 4 + h(k, 1, 9) * 52, yy = mont(Math.round(xx)) + 2 + h(k, 2, 9) * 14; moneda(xx, yy, k); }
  lingote(x - 12, mont(x - 12) + 4); lingote(x + 9, mont(x + 9) + 3); lingote(x - 1, mont(x) + 9);
  // la copa de oro y una sarta de perlas que cuelga por el canto
  R.rect(x + 16, y0 - 16, x + 22, y0 - 13, K); R.rect(x + 17, y0 - 15, x + 21, y0 - 13, ORO[3]); R.rect(x + 18, y0 - 12, x + 20, y0 - 8, ORO[2]); R.rect(x + 17, y0 - 7, x + 21, y0 - 6, ORO[2]); R.pset(x + 17, y0 - 15, ORO[5]);
  for (let k = 0; k < 9; k++) { const px = x0 + 6 + k * 2, py = y0 + 2 + Math.round(Math.sin(k * 0.5) * 3 + k * 0.6); R.pset(px, py, hex('#f4f0f8')); R.pset(px, py + 1, hex('#a8a0b8')); }
  R.rect(x - 4, y0 - 8, x - 1, y0 - 5, hex('#c82a3a')); R.pset(x - 3, y0 - 8, hex('#ff8a9a'));     // un rubí
  R.rect(x + 4, y0 - 12, x + 6, y0 - 10, hex('#2a8ac8')); R.pset(x + 4, y0 - 12, hex('#a8e0ff'));  // un zafiro
  // el cuerpo del cofre: tablas, flejes y la cerradura
  for (let yy = y0 + 2; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++) R.pset(xx, yy, (xx === x0 || xx === x1 || yy === y1) ? K : (yy - y0) % 8 === 0 ? MAD[0] : MAD[2 + Math.round((h(xx >> 3, yy >> 3, 5) - 0.3) * 1.4) + (xx < x0 + 6 ? 1 : 0)]);
  R.rect(x0, y0 + 2, x1, y0 + 3, K);
  for (const xx of [x0 + 8, x1 - 10]) { R.rect(xx, y0 + 2, xx + 3, y1, HI[0]); R.rect(xx + 1, y0 + 2, xx + 1, y1, HI[2]); for (let yy = y0 + 6; yy < y1; yy += 7) R.pset(xx + 2, yy, HI[2]); }
  R.rect(x - 5, y0 + 6, x + 5, y0 + 15, HI[0]); R.rect(x - 4, y0 + 7, x + 4, y0 + 14, ORO[1]); R.rect(x - 1, y0 + 9, x, y0 + 12, K); R.pset(x - 3, y0 + 7, ORO[4]);
  // monedas caídas en la tierra, delante
  for (let k = 0; k < 9; k++) moneda(x0 - 6 + h(k, 4, 2) * 80, y1 + 3 + h(k, 5, 2) * 10, k);
  // destellos que se encienden por turnos
  for (let k = 0; k < 6; k++) { const f = Math.sin(t * 3 + k * 2.1); if (f > 0.3) destello(Math.round(x0 + 8 + h(k, 6, 4) * 44), Math.round(mont(Math.round(x0 + 8 + h(k, 6, 4) * 44)) + 2 + h(k, 7, 4) * 8), 2 + Math.round(f * 3), f); }
  return { boca: [x, y0 - 6] };
};
const lerp = (a, b, u) => a + (b - a) * u;
// la pala clavada en el montón de tierra, inclinada
const pala = (x, y) => { R.linea(x, y, x + 14, y - 46, hex('#3a2410')); R.linea(x + 1, y, x + 15, y - 46, hex('#8a5a2e')); R.linea(x + 2, y, x + 16, y - 46, hex('#5a3a1a'));
  R.rect(x + 12, y - 50, x + 20, y - 47, hex('#3a2410')); R.rect(x + 13, y - 49, x + 19, y - 48, hex('#a8743a'));
  R.poligono([[x - 6, y + 2], [x + 7, y + 2], [x + 5, y + 14], [x - 4, y + 14]], hex('#5a5e66')); R.linea(x - 5, y + 3, x + 6, y + 3, hex('#9aa0a8')); };
const dibujar = (t) => {
  const o = { encuadre: 'claro', hoyo: 1, faroles: false };
  T.bedford(R, t, o);
  const B = R.buf, NOCHE = hex('#04060e');
  // la noche, más cerrada que en la escena: todo cae a lo oscuro salvo el cielo con la luna
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) B[y * 320 + x] = mez(B[y * 320 + x], NOCHE, 0.28 + 0.22 * (y / 180));
  // el montón de tierra del hoyo y la pala clavada
  for (let y = 140; y <= 160; y++) for (let x = 226; x <= 290; x++) { const d = Math.hypot((x - 258) / 32, (y - 160) / 18); if (d < 1) B[y * 320 + x] = [hex('#2a1a0e'), hex('#3e2614'), hex('#5a3a1e')][Math.min(2, Math.round((1 - d) * 2.4 * h(x >> 1, y >> 1, 11) + 0.3))]; }
  pala(262, 146);
  // el farol en el suelo junto al cofre: la única luz cálida
  const f = T.d_farol(R, 148, 128, t, { escala: 2, luz: 1 });
  const c = cofre(196, 164, t);
  // el buscador, al triple, boquiabierto, con la hoja de números alzada en la mano
  const b = figura(R, T.BL.buscadorBL, 62, 178, t, { dir: 1, sorpresa: true, sostiene: [76, 66], cosa: (R, mano) => T.d_hoja(R, mano[0] + 4, mano[1] - 7, { escala: 0.5, n: 1 }) }, 3);
  T.bedfordDelante(R, t, o);
  // luz de cine: el oro y el farol encienden la escena; el borde frío de la luna recorta al buscador
  const [lx, ly] = f && f.luz ? f.luz : [150, 140];
  for (let y = 30; y < 180; y++) for (let x = 0; x < 320; x++) { const d = Math.min(Math.hypot((x - 196) / 1.3, y - 140), Math.hypot(x - lx, y - ly) * 1.2);
    const v = Math.min(0.55, Math.max(0, (d - 40) / 170)); if (v > 0) B[y * 320 + x] = mez(B[y * 320 + x], NOCHE, v); }
  halo(R, 196, 140, 80, 46, '#ffb840', 0.38);
  halo(R, 196, 146, 40, 22, '#fff0a0', 0.35);
  halo(R, lx, ly, 34, 34, '#ffd890', 0.4);
  if (b) halo(R, 40, 110, 24, 64, '#7a8ac8', 0.22);
  // el oro se refleja en la cara y la hoja del buscador
  halo(R, 92, 92, 34, 40, '#ffc860', 0.22);
  for (let k = 0; k < 8; k++) { const u = (t * 0.4 + h(k, 1, 21)) % 1, x = 160 + h(k, 2, 21) * 74, y = 130 - u * 40; if (Math.sin(t * 6 + k) > 0) R.pset(Math.round(x), Math.round(y), ORO[5]); }
  grado(R, { cx: 170, cy: 110, tinte: '#0a0814', f: 0.12, desde: 0.55, max: 0.7 });
  // el texto: una línea, centrada arriba (lo que se lee a 320 × 180)
  const s = 4, w = ancho('ONLY NUMBERS', s);
  palabra(R, 'ONLY NUMBERS', Math.round(160 - w / 2), 10, s, hex('#ffe470'), hex('#3a1c08'));
};
window.__frame = async (t) => { dibujar(t); R.presentar(); };
window.__listo = true;
</script>
</body>
</html>
