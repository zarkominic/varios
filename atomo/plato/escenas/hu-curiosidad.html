<canvas id="lienzo"></canvas>
<script type="module">
// HU-CURIOSIDAD (frase 32), 1943 → 2026. Tres planos:
// 1. al atardecer, entre las nubes: la AT-6 amarilla de 1943 (Duckworth y el navegante) y el P-3 de hoy vuelan juntos;
//    en «Thanks to them» el P-3 alabea para saludar y la AT-6 le contesta; en «more than eighty years» la barra del año
//    corre de 1943 a 2026 y el «83» cuenta hasta su cifra; la gaviota del gancho vuelve, aletea junto a la avioneta y en
//    «began» se posa otra vez en su lomo (gag); en «bet or no bet» aparece en el aire la copa de la leyenda con su «?», que
//    se queda ahí, y la gaviota la mira y ahueca las alas;
// 2. (corta en «with») el Centro Nacional de Huracanes desde la pared de pantallas (el contraplano de hu-isaias, con
//    fondo local): la pared de la historia con la foto de 1943 en sepia, la tele grande con el gráfico de la NOAA, la fila
//    de mesas con los del turno de cara, que teclean y se ríen, y la puerta del pasillo, por cuyo ventanuco pasa gente; la
//    pronosticadora le cuenta al pronosticador lo de la foto y en «one flight over Texas» la señala: su lámpara se aviva y
//    un brillo cruza el cristal; él se admira, y ella va hacia la tele contándoselo; en «we now see hurricanes coming» él
//    se vuelve, la tele se refresca y el cono se va dibujando hacia la costa mientras él lo señala; en «days» salta el
//    «5» en su caja, con las cinco casillas de los días que se encienden con el cono, el del fondo levanta la mano y la
//    impresora saca el mapa del aviso, que la compañera que esperaba recoge y se lleva a su mesa; en «arrive» la
//    pronosticadora señala también la tele, contenta, y él se vuelve hacia ella sonriendo; delante, la taza que humea;
// 3. (corta en «And the calm») el corte del huracán con la luz del atardecer: el aire sube por las paredes y en «the calm
//    in the eye» una parte se desvía hacia dentro; la AT-6 de 1943 y el P-3 de hoy cruzan juntos el ojo sobre el mar en
//    calma; en «mystery» aparece un «?» en la columna del ojo; en «physics» el aire baja por el centro calentándose (del
//    azul al rojo) y sube el termómetro; en «explain» el «?» se vuelve «!» y la AT-6 alabea.
import * as T from '/atomo/plato/escenas/hu-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hu-curiosidad');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const C = T.C, K = C.k;
const lin = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
const suave = (u) => u * u * (3 - 2 * u);
const entre = (t, a, b) => t >= a && t < b;
const parp = (t, v = 7) => Math.sin(t * v) > 0;
const mezcla = (p, q, f) => { const r = p & 255, g = (p >> 8) & 255, bb = (p >> 16) & 255, r2 = q & 255, g2 = (q >> 8) & 255, b2 = (q >> 16) & 255;
  return (0xff000000 | (Math.round(bb + (b2 - bb) * f) << 16) | (Math.round(g + (g2 - g) * f) << 8) | Math.round(r + (r2 - r) * f)) >>> 0; };
const ruido = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const umbral = (x, y) => (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
// a ritmo lineal entre puntos [t, valor]
const tramos = (t, P) => { if (t <= P[0][0]) return P[0][1]; for (let i = 1; i < P.length; i++) if (t <= P[i][0]) return lerp(P[i - 1][1], P[i][1], (t - P[i - 1][0]) / (P[i][0] - P[i - 1][0])); return P[P.length - 1][1]; };
// tiñe un píxel hacia un color, con trama (a: cuánto)
const tine = (x, y, c, a) => { if (x < 0 || x > 319 || y < 0 || y > 179) return; R.pset(x, y, mezcla(R.pget(x, y), c, a)); };
// la zona de Atom y la de la barra del año quedan tranquilas
const tranquilo = (x, y) => (x >= 276 && y <= 46) || (x >= 18 && x <= 172 && y <= 15);
const PAL = {
  k: K, W: hex('#f4f4f0'), S: hex('#c4c8d2'), m: hex('#9aa4b4'), M: hex('#d8dee8'), A: hex('#f4cc60'), a: hex('#e0a030'), v: hex('#d8ecf6'),
  G: hex('#a2aab6'), L: hex('#cdd3dc'), g: hex('#6f7785'), w: hex('#2f3d58'), N: hex('#555d6b'), p: hex('#e2e6ec'), R: hex('#e83a3a'),
  P: hex('#f29ab8'), Q: hex('#d8628a'), Y: hex('#f6d860'), B: hex('#2a4a8a'),
};
// la gaviota del gancho, con contorno para que se vea contra las nubes: alas arriba, alas abajo; y posada (mira a la derecha)
const GAVIOTA = [
  ['k.......k', 'kmk...kmk', '.kWk.kWk.', '..kWWWkkk', '...kkk.A.'],
  ['...kkkkk.', '..kWWWkkk', '.kmWk.kA.', 'kmk......', 'k........'],
];
const POSADA = ['......kkk..', '.....kWWWk.', '.....kWkWAA', 'kk..kkWWWk.', 'kkkkmmmWWk.', '.kmmmmmWWk.', '..kkkkkkk..', '....A..A...'];
const gaviota = (x, y, pose, dir = 1) => R.dibujo(GAVIOTA[pose], Math.round(x) - 4, Math.round(y) - 2, dir, PAL);
// el WC-130J gris de los cazahuracanes de la Fuerza Aérea, de lejos (24 × 8, el morro a la derecha): ala alta, dos motores
// de este lado con su hélice borrosa, la deriva alta con la rampa que sube y la baliza roja; dir −1 lo voltea
const C130 = [
  '.kk.....................',
  '.kLk.......kkkkkkkk.....',
  '.kGLk..kkkkLLLLLLLLkk...',
  '.kGGLkkGGGGkNNkpkNNkpk..',
  'kkGGGGGGGGGGGGGGGGGGGwwk',
  '.kgGGGGGGGGGGGGGGGGGGGGk',
  '..kkgggggggGGGGgggggggk.',
  '....kkkkkkkkkkkkkkkkkk..',
];
const c130 = (x, y, dir, t, cl = null) => {
  const px = (X, Y, c) => { if (!cl || cl(X, Y)) R.pset(X, Y, c); };
  C130.forEach((f, j) => { for (let i = 0; i < f.length; i++) { const c = PAL[f[i]]; if (c == null) continue; px(Math.round(x + (dir > 0 ? i : f.length - 1 - i)), Math.round(y + j), c); } });
  if ((t * 1.2) % 1 < 0.15) px(Math.round(x + (dir > 0 ? 12 : 11)), Math.round(y), PAL.R);   // la baliza
};
// el avioncito visto desde arriba (para el satélite): fuselaje, alas y cola, con su sombra; a: ángulo del morro
const avionArriba = (x, y, a, t) => {
  const ca = Math.cos(a), sa = Math.sin(a), q = (u, v) => [Math.round(x + u * ca - v * sa), Math.round(y + u * sa + v * ca)];
  for (const [dx, dy, c] of [[3, 3, hex('#2a2030')], [0, 0, null]]) {
    const col = c ?? C.blanco, P = (u, v, cc = col) => { const [X, Y] = q(u, v); R.pset(X + dx, Y + dy, c ?? cc); };
    for (let u = -4; u <= 4; u++) P(u, 0); for (let v = -5; v <= 5; v++) P(1, v, c ?? (Math.abs(v) > 3 ? hex('#c8ccd8') : C.blanco)); for (let v = -2; v <= 2; v++) P(-4, v);
    if (!c) { P(4, 0, hex('#2a4a8a')); P(0, 0, hex('#2a4a8a')); P(-1, 0, hex('#2a4a8a')); if ((t * 1.3) % 1 < 0.15) P(1, -5, hex('#e83a3a')); }
  }
};
// el personal de tierra de la NOAA: mono azul o chaleco naranja, con los cascos de protección de los oídos
const MONO = { C: hex('#3a5a8a'), c: hex('#2a4468'), W: hex('#3a5a8a'), F: hex('#2e4a74'), M: hex('#3a3e4a'), o: hex('#e8e4dc') };
const CHALECO = { C: hex('#f08a2a'), c: hex('#c8641a'), W: hex('#f08a2a'), F: hex('#3a3e4a'), M: hex('#3a3e4a'), o: hex('#f6d860') };
// la tableta en la mano (x, s: el suelo del personaje)
const tableta = (x, s, dir) => { const bx = dir > 0 ? x + 11 : x - 5; R.rect(bx, s - 13, bx + 5, s - 8, K); R.rect(bx + 1, s - 12, bx + 4, s - 9, hex('#4ab8e8')); R.pset(bx + 1, s - 12, C.blanco); };
// un destello de cuatro puntas (r: largo)
const destello = (x, y, r, c = C.blanco) => { for (let i = 1; i <= r; i++) { for (const [dx, dy] of [[i, 0], [-i, 0], [0, i], [0, -i]]) R.pset(x + dx, y + dy, i === r ? mezcla(c, C.blanco, 0.5) : c); } R.pset(x, y, C.blanco); };

const c = (f) => en('curiosidad', f);
// los cortes: «with», «And (the calm)»
const P2 = c(0.3741), P3 = c(0.7158);
const ellos = c(0.029), mas = c(0.0948), ochenta = c(0.1146), curios = c(0.1646), empezo = c(0.2265);
const apuesta = c(0.2904), noAp = c(0.3128);
const uno = c(0.3833), texas = c(0.4294);
const vemos = c(0.5137), llegar = c(0.5584), dias = c(0.5874), llegan = c(0.652);
const calma = c(0.7303), ojoT = c(0.7632), misterio = c(0.8436), fisica = c(0.9094), explicar = c(0.9529);

// ── 1 · la AT-6 de 1943 y el P-3 de hoy, juntos ──────────────────────────────────────────────────────────────────────
const VASO = ['kk.......kk', 'kv.......k.', 'kv.......k.', 'kvAAWWAAAk.', 'kAAAWWAaAk.', 'kAaAAAAAak.', 'kaaaaaaaak.', '.kkkkkkkk..'];
const cuenta = (t) => Math.round(83 * suave(lin(t, ochenta, curios + 0.5)));
const posa = empezo - 0.05;
const p1 = (t) => {
  T.cieloVuelo(R, t, { hora: 'tarde' });
  // el P-3 alabea en «Thanks to them»; la AT-6 contesta
  const al1 = lin(t, 0.45, 0.7) * (1 - lin(t, 1.25, 1.55)), al2 = lin(t, 1.3, 1.5) * (1 - lin(t, 2.1, 2.4));
  const px = 132 + Math.round(Math.sin(t * 0.6) * 2), py = 110 + Math.round(Math.sin(t * 1.2) * 1.5);
  T.p3(R, px, py, t, { s: 1.4, dir: 1, vuelo: true, sacude: 0.08, inclina: 0.07 * Math.sin(t * 7) * al1 });
  const ax = 196 + Math.round(Math.sin(t * 0.5 + 2) * 2), ay = 70 + Math.round(Math.sin(t * 1.3 + 1) * 1.5);
  T.at6(R, ax, ay, t, { s: 1.2, dir: 1, vuelo: true, helice: 1, piloto: EL.duckworth, copiloto: EL.navegante, inclina: 0.08 * Math.sin(t * 7) * al2 });
  // la gaviota: llega aleteando y se posa en el lomo de la avioneta, detrás de la cubierta (como en el gancho)
  const wx = ax - 22, wy = ay - 15, llega = lin(t, 1.5, posa);
  if (t > 1.5) {
    if (llega < 1) { const gx = lerp(306, wx, suave(llega)) + 8 * Math.sin(llega * 6) * (1 - llega), gy = lerp(96, wy, suave(llega)) - 12 * Math.sin(llega * Math.PI); gaviota(gx, gy, parp(t, 14) ? 0 : 1, -1); }
    else { const rebote = entre(t, posa, posa + 0.2) ? 1 : 0, ahueca = entre(t, noAp, noAp + 0.5) && parp(t, 18), mira = t > apuesta - 0.1 ? -1 : 1;
      if (ahueca) gaviota(wx, wy - 4, 0, mira); else R.dibujo(POSADA, wx - 5, wy - 7 - rebote, mira, PAL); }
  }
  // «83»: los años de curiosidad, que cuentan mientras la barra del año corre de 1943 a 2026
  if (t > ochenta - 0.1) { const n = cuenta(t), e = lin(t, ochenta - 0.1, ochenta + 0.2); R.numero(String(n), 74, Math.round(lerp(66, 58, e)), { tam: 16, centro: true }); if (n === 83 && t < curios + 1.2) destello(96, 40, 3, hex('#ffe08a')); }
  // la copa de la leyenda, con su «?», que se queda en el aire (con apuesta o sin ella)
  if (t > apuesta - 0.05) { const e = suave(lin(t, apuesta - 0.05, apuesta + 0.3)), tiembla = entre(t, noAp, noAp + 0.5) ? Math.round(Math.sin(t * 40)) : 0, x = 122 + tiembla, y = Math.round(lerp(90, 76, e) + Math.sin(t * 2.2) * 1.5);
    R.dibujo(VASO, x - 5, y, 1, PAL); if (e > 0.6) R.bocadillo(x, y - 4, { icono: '?' }); if (e < 0.6) destello(x, y - 2, 3); }
};

// ── 2 · el Centro Nacional de Huracanes, desde la pared de pantallas: la foto de 1943 y el cono de cinco días ──────────
// FONDO LOCAL: el contraplano de la sala de hu-isaias, de noche, mirando hacia el fondo (allí se ve la pared de pantallas;
// aquí, lo que tienen delante los del turno). El techo de placas con su rejilla y sus focos; la cornisa con la luz que
// baña la pared; la pared de paneles de tela con sus juntas, su trama y su zócalo; a la izquierda, la pared de la
// historia: la foto de 1943 de la AT-6 sobre los campos de Texas en sepia (la grande, con su lámpara de cuadro y su placa
// de latón), el P-3 «Kermit» en color sobre el mar, el satélite con el remolino, la tripulación delante de la cola de la
// rana y el emblema redondo de los cazahuracanes en su placa de madera; el reloj de pared, con su segundero; a la
// derecha, la tele grande con el gráfico de la NOAA (el mismo de la pantalla de la sala: la sala se pinta entera en un
// búfer aparte y se copia su pantalla grande), su cámara y el resplandor azul en la pared; la puerta del pasillo, con el
// ventanuco por el que pasa gente; la fila de mesas del fondo, de cara, con los pronosticadores (bustos) iluminados por
// sus pantallas, sus sillas y los monitores de espaldas; la impresora en su mueble; la moqueta de losetas, cada una con
// la trama en un sentido, con las manchas de luz de los focos y el reflejo azul de las mesas; delante a la derecha, la
// esquina de una mesa con la taza que humea, el teléfono con su luz y unos papeles.
const SV = {
  techo: hex('#5a6273'), techoS: hex('#4f576a'), techoL: hex('#646c7e'), aro: hex('#7c8494'), luz: hex('#fff6de'), rejilla: hex('#3a4152'),
  soffit: hex('#363e52'), soffitL: hex('#4a5470'), cove: hex('#7c90b8'),
  pared: hex('#3e4d6b'), paredS: hex('#384663'), paredL: hex('#4b5c7e'), junta: hex('#313e58'), tela: hex('#43537a'), brillo: hex('#56688e'),
  zocalo: hex('#2e3a54'), zocaloL: hex('#46567a'), rodapie: hex('#1e2638'),
  moq: hex('#56607a'), moqS: hex('#4e586f'), moqL: hex('#626d88'), moqD: hex('#434b60'), luzSuelo: hex('#6a7692'),
  mesa: hex('#cfd2d9'), mesaS: hex('#9da2ae'), mesaL: hex('#e9ebef'), bajo: hex('#232733'), bajoL: hex('#2d3240'), bajoS: hex('#181b22'),
  silla: hex('#1f2229'), sillaL: hex('#3a3f4c'), mon: hex('#2a2e38'), monL: hex('#3a3f4c'), monS: hex('#1a1d24'),
  marco: hex('#0b0d12'), marcoL: hex('#2a2e38'), madera: hex('#6a4426'), maderaL: hex('#9a6a3a'), maderaS: hex('#3a2418'),
  paspartu: hex('#efe6d0'), paspartuS: hex('#cfc4a8'), laton: hex('#c8a040'), latonL: hex('#f0d070'), latonS: hex('#8a6a20'),
  calido: hex('#ffe2a8'), azulTV: hex('#3a6ab8'), metal: hex('#8a90a0'), metalS: hex('#6a7080'), metalL: hex('#b8bcc8'),
  puerta: hex('#5a6478'), puertaS: hex('#4a5470'), pasillo: hex('#e8dcb8'), pasilloS: hex('#c8b890'),
};
const SV_PANT = [143, 27, 273, 97];   // la pantalla de la tele: la grande de la sala (x 95–225, y 18–88) desplazada (+48, +9)
const SV_VENT = [299, 55, 305, 84];   // el ventanuco de la puerta
// un marco de madera con paspartú (la foto queda de x0 + 5 a x1 − 5) o uno negro moderno (la foto, de x0 + 4 a x1 − 4)
const svMarco = (x0, y0, x1, y1, madera) => {
  const { rect, pset } = R;
  if (madera) { rect(x0, y0, x1, y1, SV.maderaS); rect(x0 + 1, y0 + 1, x1 - 1, y1 - 1, SV.madera); rect(x0 + 1, y0 + 1, x1 - 1, y0 + 1, SV.maderaL); rect(x0 + 1, y0 + 1, x0 + 1, y1 - 1, SV.maderaL);
    rect(x0 + 2, y0 + 2, x1 - 2, y1 - 2, SV.paspartu); rect(x0 + 2, y0 + 2, x1 - 2, y0 + 2, SV.paspartuS); rect(x0 + 2, y0 + 2, x0 + 2, y1 - 2, SV.paspartuS); rect(x0 + 4, y0 + 4, x1 - 4, y1 - 4, SV.maderaS); }
  else { rect(x0, y0, x1, y1, SV.marco); rect(x0 + 1, y0 + 1, x1 - 1, y1 - 1, SV.marcoL); rect(x0 + 2, y0 + 2, x1 - 2, y1 - 2, SV.paspartu); rect(x0 + 2, y0 + 2, x1 - 2, y0 + 2, SV.paspartuS); rect(x0 + 3, y0 + 3, x1 - 3, y1 - 3, SV.marcoL); }
  // la sombra del marco en la pared, abajo y a la derecha
  for (let y = y0 + 2; y <= y1 + 1; y++) if (umbral(x1 + 1, y) < 0.6) pset(x1 + 1, y, SV.junta);
  for (let x = x0 + 2; x <= x1 + 1; x++) if (umbral(x, y1 + 1) < 0.6) pset(x, y1 + 1, SV.junta);
};
// pasa un trozo de la pantalla a sepia (foto vieja): luminancia a una rampa de seis tonos con trama, viñeta y motas
const SEPIA = ['#2e2016', '#5a4430', '#8a6c4c', '#b8987a', '#e0ccaa', '#f6ecd6'].map(hex);
const svSepia = (x0, y0, x1, y1) => {
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = (x1 - x0) / 2, ry = (y1 - y0) / 2;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const p = R.pget(x, y), L = ((p & 255) * 0.3 + ((p >> 8) & 255) * 0.59 + ((p >> 16) & 255) * 0.11) / 255, d = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2;
    const v = Math.max(0, Math.min(0.999, ((L - 0.12) / 0.78) * (1 - 0.2 * d * d))) * (SEPIA.length - 1), i = Math.floor(v), f = v - i;
    R.pset(x, y, SEPIA[Math.min(SEPIA.length - 1, i + (f > 0.42 && f < 0.58 ? (umbral(x, y) < 0.5 ? 1 : 0) : f >= 0.58 ? 1 : 0))]);
  }
  for (const [a, b] of [[x0 + 9, y0 + 3], [x1 - 7, y1 - 9]]) for (let j = 0; j < 5; j++) R.pset(a + (j >> 1), b + j, SEPIA[4]);   // dos rayas de la foto vieja
};
// todo lo fijo, pintado una vez en su búfer
const svFija = () => {
  const { rect, pset, linea, disco } = R;
  // el techo de placas: juntas, motas, la rejilla del aire y los focos empotrados con su halo (fuera de la barra del año
  // y de la zona de Atom)
  rect(0, 0, 319, 10, SV.techo);
  for (let x = 0; x < 320; x += 16) rect(x, 0, x, 10, SV.techoS); rect(0, 5, 319, 5, SV.techoS);
  for (let k = 0; k < 90; k++) pset(Math.floor(ruido(k, 1, 4) * 320), Math.floor(ruido(k, 2, 4) * 10), SV.techoL);
  for (let y = 2; y <= 8; y++) rect(196, y, 216, y, y % 2 ? SV.rejilla : SV.techoS); rect(195, 1, 217, 1, SV.aro); rect(195, 9, 217, 9, SV.techoL);
  for (const x of [8, 178, 240]) { for (let j = -3; j <= 3; j++) for (let i = -5; i <= 5; i++) if ((i * i) / 25 + (j * j) / 9 < 1 && umbral(x + i, 6 + j) < 0.35) pset(x + i, 6 + j, SV.techoL); rect(x - 2, 5, x + 2, 7, SV.aro); rect(x - 1, 6, x + 1, 6, SV.luz); }
  // la cornisa con la tira de luz
  rect(0, 11, 319, 11, SV.soffit); rect(0, 12, 319, 12, SV.soffitL); rect(0, 13, 319, 13, SV.cove);
  // la pared: paneles de tela de 24 px con su junta y su canto de luz, la trama de la tela, la luz de la cornisa arriba y
  // la sombra abajo
  for (let y = 14; y <= 105; y++) for (let x = 0; x < 320; x++) {
    const px = x % 24, n = ruido(x, y, 3); let c = n < 0.07 ? SV.paredS : n > 0.94 ? SV.tela : (x + y * 3) % 7 === 0 ? SV.tela : SV.pared;
    const arriba = 1 - (y - 14) / 16; if (arriba > 0 && umbral(x, y) < arriba * 0.85) c = SV.paredL;
    const abajo = (y - 82) / 24; if (abajo > 0 && umbral(x, y) < abajo * 0.6) c = SV.paredS;
    if (px === 0) c = SV.junta; else if (px === 1) c = SV.brillo;
    pset(x, y, c);
  }

    const u = lin(t, texas - 0.1, texas + 0.45); if (u > 0 && u < 1) { for (let y = 31; y <= 57; y++) { const x0 = Math.round(8 + u * 56 + (57 - y) * 0.5); for (let x = x0; x <= x0 + 2; x++) if (x >= 15 && x <= 53) R.pset(x, y, mezcla(R.pget(x, y), C.blanco, x === x0 + 1 ? 0.55 : 0.3)); } }
    if (entre(t, texas, texas + 0.5)) destello(56, 28, 3, hex('#ffe08a')); }
  // por el ventanuco de la puerta pasa gente por el pasillo
  { R.recorte(SV_VENT);
    for (const [t0, d] of [[P2 + 0.6, 1], [P2 + 3.6, -1]]) { const u = lin(t, t0, t0 + 0.9); if (u <= 0 || u >= 1) continue; const x = Math.round(d > 0 ? lerp(294, 310, u) : lerp(310, 294, u)), y = 63 + (Math.floor(u * 8) % 2);
      R.disco(x, y, 2.2, hex('#4a4050')); R.rect(x - 3, y + 3, x + 3, y + 12, hex('#4a4050')); R.pset(x + d, y - 1, hex('#6a5e6a')); }
    R.recorte(null); }
  // los del turno, en la fila del fondo
  turno(t);
  // la impresora: en «days» saca el mapa del aviso (con la luz verde que parpadea mientras imprime)
  { const u = lin(t, dias + 0.15, dias + 1.0), coge = t > recoge; R.pset(147, 109, u > 0 && u < 1 && (t * 6) % 1 < 0.5 ? hex('#5ad87a') : hex('#2a6a3a'));
    if (u > 0 && !coge) { const yb = 113 + Math.round(u * 8); R.rect(139, 113, 148, yb, hex('#f4f2ec')); R.rect(139, yb, 148, yb, hex('#c8c4b8')); if (yb > 116) { R.rect(140, 115, 146, 115, hex('#a8a8b0')); R.poligono([[141, yb - 1], [144, 116], [147, yb - 1]], hex('#c8ccd8')); } } }
  // la compañera que espera junto a la impresora: mira hacia su mesa; en «days» se vuelve a la impresora, que arranca,
  // coge el mapa recién impreso y se va con él a su sitio, a la izquierda
  { const va2 = lin(t, recoge + 0.25, P3 + 0.4), x = Math.round(lerp(130, 92, va2)), d = t < dias - 0.1 || va2 > 0 ? -1 : 1;
    R.actor(EL.chica, x, 152, t, { dir: d, anda: va2 > 0 && va2 < 1, dedo: entre(t, recoge - 0.25, recoge + 0.15), sorpresa: entre(t, dias - 0.05, dias + 0.3), sonrisa: t > recoge, pal: CAMISA });
    if (t > recoge) { const hx = x + (d > 0 ? 12 : -4); R.rect(hx, 133, hx + 5, 139, hex('#f4f2ec')); R.rect(hx + 1, 135, hx + 4, 135, hex('#a8a8b0')); R.pset(hx + 2, 137, hex('#c8ccd8')); R.pset(hx + 3, 137, hex('#c8ccd8')); } }
  // las sombras de los dos en la moqueta
  const va = lin(t, texas + 0.75, llegan - 0.35), x1 = Math.round(lerp(60, 146, va)), x2 = 182;
  for (const [x, s] of [[x1, 176], [x2, 174]]) for (let j = -1; j <= 1; j++) for (let i = -8; i <= 8; i++) if ((i / 8) ** 2 + j * j / 2.2 < 1 && umbral(x + 7 + i, s + j) < 0.7) R.pset(x + 7 + i, s + j, mezcla(R.pget(x + 7 + i, s + j), SV.moqD, 0.7));
  // la pronosticadora: le cuenta lo de la foto; en «one flight over Texas» la señala; luego se vuelve y va hacia la tele
  // contándole, y en «arrive» la señala también, contenta
  R.actor(EL.pronosticadora, x1, 176, t, { dir: va > 0 ? 1 : -1, anda: va > 0 && va < 1, dedo: entre(t, uno - 0.1, texas + 0.65) || t > llegan - 0.05, sonrisa: entre(t, texas, vemos) || t > llegan - 0.1, habla: (entre(t, P2 + 0.1, uno - 0.1) || entre(t, texas + 0.7, vemos)) && parp(t, 8) });
  // el pronosticador: la escucha, se admira en «Texas», en «we now see» se vuelve a la tele, la cambia y señala el cono
  // mientras se dibuja; en «arrive» sonríe y se vuelve hacia ella
  R.actor(EL.pronosticador, x2, 174, t, { dir: t < vemos - 0.15 || t > llegan + 0.4 ? -1 : 1, dedo: entre(t, vemos - 0.1, llegan + 0.2), sorpresa: entre(t, texas, texas + 0.35), sonrisa: t > llegan + 0.1 || entre(t, texas + 0.35, vemos - 0.2), habla: entre(t, llegar, dias + 0.35) && parp(t, 8) });
  // delante, la taza que humea y la luz del teléfono
  taza(t); R.pset(313, 150, (t * 0.8) % 1 < 0.15 ? hex('#ff5a3a') : hex('#6a2a20'));
};

// ── 3 · el corte: la calma del ojo es física ─────────────────────────────────────────────────────────────────────────
const corteU = (t) => tramos(t, [[P3, 0.42], [calma, 0.46], [ojoT + 0.3, 0.56], [fisica - 0.1, 0.57], [explicar + 0.25, 0.85], [P3 + 6, 0.9]]);
// la luz del atardecer del cierre sobre el corte: oro en las luces y morado en las sombras, más fuerte arriba (un recorrido
// de la pantalla); así el corte del cierre no es el del acto del ojo (hu-ojo), a mediodía
const ORO = [255, 178, 98], MORADO = [74, 46, 110];
const atardecer = () => { const B = R.buf;
  for (let i = 0; i < B.length; i++) { const p = B[i], r = p & 255, g = (p >> 8) & 255, b = (p >> 16) & 255, L = (r * 0.3 + g * 0.59 + b * 0.11) / 255, y = (i / 320) | 0;
    const w = 0.4 * L * (1 - y / 320), m = 0.28 * (1 - L), q = 1 - w - m;
    B[i] = (0xff000000 | (Math.round(b * q + ORO[2] * w + MORADO[2] * m) << 16) | (Math.round(g * q + ORO[1] * w + MORADO[1] * m) << 8) | Math.round(r * q + ORO[0] * w + MORADO[0] * m)) >>> 0; } };
const p3 = (t) => {
  T.ojo(R, t, { vista: 'corte', corte: corteU(t) });
  // la AT-6 de 1943 y el P-3 de hoy cruzan juntos el ojo, en fila y a ras del mar en calma, por debajo de las flechas del
  // aire (como al principio de la escena); en «explain», la AT-6 alabea
  { const u = lin(t, P3, P3 + 5.0), x = Math.round(lerp(98, 146, u)), y = 139 + Math.round(Math.sin(t * 1.4)), cl = [123, 0, 197, 179];
    R.recorte(cl); T.p3(R, x, y, t, { s: 0.5, dir: 1, vuelo: true });
    T.at6(R, x + 33, y + Math.round(Math.sin(t * 1.9 + 1)), t, { s: 0.4, dir: 1, vuelo: true, helice: 1, recorte: cl, inclina: entre(t, explicar, explicar + 0.8) ? 0.12 * Math.sin((t - explicar) * 9) : 0 }); R.recorte(null); }
  atardecer();
  // el «?» en la columna del ojo («mystery») que en «explain» se vuelve «!»
  if (t > misterio - 0.05) { const e = lin(t, misterio - 0.05, misterio + 0.2), y = Math.round(84 + Math.sin(t * 2.4) * 1.5 + (1 - e) * 6);
    if (t < explicar) R.numero('?', 161, y + 16, { tam: 16, centro: true, color: hex('#eef4ff') });
    else { R.numero('!', 161, y + 16, { tam: 16, centro: true }); const b = lin(t, explicar, explicar + 0.5); if (b < 1) for (let k2 = 0; k2 < 8; k2++) { const a = k2 * Math.PI / 4, r = 12 + b * 12; R.pset(Math.round(160 + Math.cos(a) * r), Math.round(y + 8 + Math.sin(a) * r), hex('#ffe08a')); } } }
};
const año = (t) => (t < ochenta ? 1943 : t < curios + 0.5 ? Math.round(lerp(1943, 2026, suave(lin(t, ochenta, curios + 0.5)))) : 2026);
const efectos = [
  [0.5, 'whoosh'], [1.35, 'whoosh'], [ochenta + 0.05, 'tic'], [ochenta + 0.35, 'tic'], [ochenta + 0.65, 'tic'], [ochenta + 0.95, 'tic'], [curios + 0.5, 'brillo'], [posa, 'tic'], [apuesta, 'pop'], [noAp + 0.05, 'golpecito'],
  [P2 + 0.1, 'tecleo', { dur: 1.2 }], [texas, 'brillo'], [vemos - 0.05, 'interruptor'], [dias, 'pop'], [dias + 0.2, 'papel'],
  [P3 + 0.05, 'whoosh'], [ojoT, 'whoosh'], [misterio, 'pop'], [fisica, 'vapor'], [explicar, 'brillo'],
];
T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3]], { efectos, año });
