<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sorlingas · ep4</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// EP4-NIEBLA (frases 56–58), cartela 1707.
//  niebla  el mapa del ancla, de cerca (Canal de la Mancha): la X de la flota en mar abierto; una segunda X, la de
//          verdad, encima de unas islas (las Sorlingas).
//  flota   flota británica de noche en la niebla; los faroles apenas se ven.
//  rocas   rocas negras salen de la niebla; el buque grande golpea y se escora, y tres más detrás; los faroles se
//          apagan uno a uno. «4» y un barco en la caja.
import { escena } from '/atomo/plato/escena.js';
import { crearRetro } from '/atomo/plato/kits/pixel-retro.js';
const E = await escena('ep4-niebla', 'ep04');
const R = await crearRetro(document.getElementById('lienzo'));
const { PAL, tramo, lerp, clamp } = R;
const M = (k, d) => E.marca(k, d);
const m = { niebla: M('niebla', 1.5), flota: M('flota', 4.5), rocas: M('rocas', 10) };

// costas del Canal de la Mancha a mano (lon, lat): Inglaterra y Gales, Irlanda (esquina) y Francia
const COSTAS = [
  [[-5.7, 50.05], [-5.1, 50], [-4.2, 50.35], [-3.5, 50.6], [-2.5, 50.6], [-1.3, 50.8], [0.2, 50.8], [1.4, 51.2], [1.6, 52], [2, 52.6], [2, 53.5], [-5, 53.5], [-4.5, 53], [-4.3, 52.4], [-5.3, 51.7], [-4.2, 51.6], [-3, 51.4], [-4.2, 51.2], [-4.6, 50.9], [-5.6, 50.4]],
  [[-10, 53.5], [-6.2, 53.5], [-6, 52.9], [-6.4, 52.2], [-7.5, 52], [-8.5, 51.6], [-10, 51.5]],
  [[-4.8, 48.4], [-4.6, 48.6], [-3, 48.8], [-2, 48.6], [-1.6, 48.65], [-1.9, 49.7], [-1.2, 49.4], [0.2, 49.5], [1.5, 50.2], [1.6, 51], [2, 51.1], [2.5, 51.1], [2.5, 47], [-2.5, 47], [-4.4, 47.9], [-4.7, 48.1]],
];
const mapa = (t) => {
  R.mesa(t, { luz: [60, 20] });
  R.pergamino(20, 12, 300, 148, { luz: [60, 20], semilla: 43 });
  const pj = R.proyector(26, 18, 294, 142, -10, 2.5, 47, 53.5);
  R.recorte([26, 18, 294, 142]);
  for (const c of COSTAS) R.costa(c.map(([a, b]) => pj(a, b)), { tierra: 2.4 });
  R.recorte(null);
  // las Sorlingas
  for (const [lon, lat] of [[-6.3, 49.93], [-6.36, 49.89], [-6.25, 49.96]]) { const [x, y] = pj(lon, lat); R.disco(x, y, 1.6, R.tone(PAL.PERG, 2.2, x, y)); }
  // dónde creía estar la flota (mar abierto) y dónde estaba (las Sorlingas)
  const [fx, fy] = pj(-5 + 0.3 * Math.sin(t), 49.2);
  R.equis(fx, fy, 3, PAL.TINTA);
  if (t > m.niebla + 1.6) { const [rx, ry] = pj(-6.3, 49.92); R.equis(rx, ry, 4); R.anillo(rx + 0.5, ry + 0.5, 7 + Math.sin(t * 6), PAL.ROJO); }
  R.rosa(266, 120, 10);
};
const BARCOS = [[110, 140, 0.9, 0], [190, 132, 0.65, 1.2], [240, 128, 0.5, 2.1], [282, 125, 0.4, 2.9]];
const flota = (t, choque) => {
  R.cielo(t, { hor: 120, semilla: 63, brillo: -0.3, nubes: { bandas: [[50, 18, 1.2]], densidad: 0.15 } });
  R.mar(t, { hor: 120 });
  // las rocas
  const ve = choque ? tramo(t, m.rocas - 0.2, m.rocas + 0.8) : 0;
  if (ve > 0) for (const [x, w, h] of [[40, 30, 40], [90, 22, 26], [150, 34, 34]]) R.poligono([[x - w, 150], [x - w * 0.4, 150 - h], [x + w * 0.3, 150 - h * 0.8], [x + w, 150]], (xx, yy) => R.hash2(xx, yy) < ve ? PAL.FGC[1] : PAL.MIST[0]);
  BARCOS.forEach(([x, y, s, f], i) => {
    const golpe = m.rocas + 1 + i * 0.9;
    const g = choque ? tramo(t, golpe, golpe + 1.2) : 0;
    const dx = choque ? -Math.min(t - m.rocas, golpe - m.rocas) * 8 : -(t - m.flota) * 3;
    R.barco(x + dx, y + g * 6, t, { tipo: 'guerra', esc: s, fase: f, farol: g < 0.6, silueta: i > 0 ? 2 : 1, cabeceo: 1 + g * 4, bandera: i === 0 ? 'ingles' : null });
  });
  R.niebla(t, 96, 150, 1.0, 6);
};

E.iniciar((t) => {
  R.secuencia(t, [[0, (t) => R.cartela(t, '1707')], [1.2, mapa], [m.flota - 0.2, (t) => flota(t, false)], [m.rocas - 0.2, (t) => flota(t, true)]]);
  const e = E.energia(t);
  R.caja(t, t > m.rocas + 3 ? tramo(t, m.rocas + 3, m.rocas + 3.4) : 0, (x, y) => { R.numero('4', x + 6, y + 12); R.icono('barco', x + 20, y + 4, PAL.UI[5]); }, { energia: e });
  if (t > 1.3) R.companero(t, e);
  R.presentar();
});
</script>
</body>
</html>
