<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ep49 · miniatura</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// GB-MINIATURA · ep49, la composición de siempre (la de referencia del 48: escena a la izquierda, corte en diagonal,
// texto en blanco hueso y un chibi al doble), SIN ATOM. A la izquierda, el recinto al alba: el pilar en T ya de pie y,
// a su pie, Stonehenge diminuto; un cazador, chibi al doble, levanta los brazos. A la derecha del corte, el cerro de hoy
// con su gran cubierta blanca, un poco más oscuro. «OLDER» en pixel grande y «6000» en hueso. Lo cumple el vídeo: el
// título dice «Built 6,000 Years Before Stonehenge» y el gancho enseña lo mismo.
import { crearRoma } from '/atomo/plato/kits/pixel-roma.js';
import { conChibi } from '/atomo/plato/kits/pixel-chibi.js';
import { hex } from '/atomo/plato/kits/pixel-retro.js';
import * as T from '/atomo/plato/escenas/gb-comun.js';
import { figura, grado, halo, desplazar, cifra } from '/atomo/plato/escenas/mini-chibi.js';
import { palabra } from '/atomo/plato/escenas/bl-mini-letras.js';
const R = conChibi(await crearRoma(document.getElementById('lienzo')));
const mez = (a, b, f) => { let r = 0; for (const sh of [0, 8, 16]) r |= (Math.round(((a >>> sh) & 255) * (1 - f) + ((b >>> sh) & 255) * f) & 255) << sh; return (0xff000000 | r) >>> 0; };
const K = hex('#1a1424');
const tine = (x, y, c, a) => { x = Math.round(x); y = Math.round(y); if (x < 0 || x > 319 || y < 0 || y > 179) return; R.pset(x, y, mez(R.pget(x, y), c, a)); };
// Stonehenge diminuto (el mismo anillo de trilitos del gancho), piedra gris con su sombra
const SARSEN = ['#4a4a54', '#7a7a86', '#a4a4ae', '#d0d0d8'].map(hex);
const stonehenge = (cx, by, s = 1.6) => {
  const S = (v) => Math.round(v * s);
  for (let i = -S(20); i <= S(24); i++) { tine(cx + i, by + 1, K, 0.4); tine(cx + i + 3, by + 2, K, 0.22); }
  const pie = (x, y, h, w) => { R.rect(x, y - h, x + w, y, SARSEN[0]); R.rect(x + 1, y - h + 1, x + w - 1, y - 1, SARSEN[2]); R.rect(x + 1, y - h + 1, x + 1, y - 1, SARSEN[3]); R.rect(x + w - 1, y - h + 2, x + w - 1, y - 1, SARSEN[1]); };
  const din = (x0, x1, y) => { R.rect(x0, y - 2, x1, y + 1, SARSEN[0]); R.rect(x0 + 1, y - 1, x1 - 1, y - 1, SARSEN[3]); R.rect(x0 + 1, y, x1 - 1, y, SARSEN[2]); };
  for (const [dx, h] of [[-12, 7], [-4, 8], [4, 8], [12, 7]]) pie(cx + S(dx), by - S(4), S(h), S(2));
  din(cx - S(13), cx - S(1), by - S(11)); din(cx + S(3), cx + S(15), by - S(11));
  for (const [dx, h] of [[-17, 10], [-10, 11], [-2, 12], [6, 11], [13, 10]]) pie(cx + S(dx), by, S(h), S(3));
  din(cx - S(18), cx - S(6), by - S(11)); din(cx - S(3), cx + S(10), by - S(12)); din(cx + S(12), cx + S(17), by - S(10)); };
const dibujar = (t) => {
  // la mitad derecha: el cerro de hoy con la cubierta, algo apagado
  const b = R.nuevo(), prev = R.usar(b);
  T.colina(R, t, { encuadre: 'cerro', epoca: 'hoy' });
  desplazar(R, 96);   // la cubierta blanca, a la derecha del corte
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) b[y * 320 + x] = mez(b[y * 320 + x], hex('#0a0814'), 0.22);
  R.usar(prev);
  // la mitad izquierda: el recinto al alba con el pilar ya de pie
  const o = { levantar: 1 };
  T.recinto(R, t, o);
  desplazar(R, -36);
  halo(R, 118, 152, 34, 20, '#d8e4ff', 0.3);
  stonehenge(116, 164, 1.3);
  const m = figura(R, T.GB.cazadorGB, 40, 174, t, { dir: 1, brazos: true, sonrisa: true }, 2);
  T.recintoDelante(R, t, o);
  const B = R.buf;
  halo(R, 150, 70, 60, 50, '#ffe0a0', 0.22);
  // el corte en diagonal con su filo blanco hueso
  for (let y = 0; y < 180; y++) { const xd = 204 + Math.round((180 - y) * 0.28); for (let x = xd; x < 320; x++) B[y * 320 + x] = b[y * 320 + x]; for (let k = -1; k <= 1; k++) R.pset(xd + k, y, hex('#f4f0e4')); }
  grado(R, { cx: 160, cy: 100, tinte: '#060a14', f: 0.16, desde: 0.55, max: 0.65 });
  palabra(R, 'OLDER', 12, 14, 5, hex('#f4f0e4'), hex('#2a1a30'));
  cifra(R, '6000', 268, 26, 24);
};
window.__frame = async (t) => { dibujar(t); R.presentar(); };
window.__listo = true;
</script>
</body>
</html>
