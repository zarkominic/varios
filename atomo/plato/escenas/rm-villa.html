<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Villa · ep5</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// RM-VILLA (frases 53–54). Una villa blanca junto al mar con cipreses: el chaval, tumbado al sol con una bolsa de
// monedas; «16» en la caja. Luego tres estatuas de mármol sobre pedestales: Rómulo con la loba, Augusto con el laurel
// y el chaval con su corona; una luz las va señalando una a una.
import { preparar, rodar } from '/atomo/plato/escenas/rm-comun.js';
const { E, R, M } = await preparar('rm-villa');
const { PALA, PR, ELENCO, tramo, lerp } = R;
const m = { vil: M('villa', 0.5), nom: M('nombre', 7) };
const villa = (t) => {
  R.cieloR(t, 'dia', { hor: 112, sol: [260, 30, 8] });
  R.mar(t, { hor: 112, y1: 132 });
  R.suelo(132, PR.PAJA, { luz: 2.8 });
  R.rect(30, 70, 140, 132, PALA.MARMOL[3]); R.rect(30, 70, 34, 132, PALA.MARMOL[4]); for (let k = 0; k < 4; k++) R.rect(40 + k * 26, 86, 50 + k * 26, 104, PALA.CONTORNO);
  R.poligono([[24, 70], [85, 52], [146, 70]], (x, y) => R.tone(PALA.TERRACOTA, 2.6 - (y - 52) * 0.05, x, y));
  for (const x of [12, 160]) for (let y = 0; y < 44; y++) { const w = Math.round(4 * Math.sin(Math.PI * y / 44) + 0.5); R.rect(x - w, 132 - y, x + w, 132 - y, PR.HIERBA[y % 5 === 0 ? 2 : 0]); }
  R.rect(176, 156, 224, 158, PR.MADERA[2]); R.rect(178, 158, 180, 166, PR.MADERA[1]); R.rect(220, 158, 222, 166, PR.MADERA[1]);
  R.personaje(200, 160, 38, { ...ELENCO.emperadorNino, sombrero: 'no', capa: null, t, pose: 'sentado', objeto: 'bolsa', sonrisa: true });
};
const marmol = { piel: PALA.MARMOL, pelo: PALA.MARMOL, chaqueta: PALA.MARMOL, camisa: PALA.MARMOL, falda: PALA.MARMOL, pantalon: PALA.MARMOL, botas: PALA.MARMOL, faja: PALA.MARMOL, banda: PALA.MARMOL, capa: PALA.MARMOL, antebrazo: PALA.MARMOL };
const estatuas = (t) => {
  R.salon(t, { trono: false, estatua: false, cortina: false });
  const u = t - m.nom, foco = u < 2.4 ? -1 : u < 4 ? 0 : u < 5.6 ? 1 : 2;
  [[70, 'romulo'], [160, 'augusto'], [250, 'nino']].forEach(([x, k], i) => {
    if (foco === i || u > 6.4) R.halo(x, 110, 40, [PALA.AMARILLO[1], PALA.AMARILLO[2]], 0.9);
    R.rect(x - 22, 150, x + 22, 170, PALA.MARMOL[2]); R.rect(x - 24, 148, x + 24, 150, PALA.MARMOL[3]);
    const base = { ...ELENCO.cesar, ...marmol, sombrero: k === 'augusto' ? 'laurel' : k === 'nino' ? 'corona' : 'no', tamSombrero: k === 'nino' ? 1.35 : 1, peinado: k === 'nino' ? 'rizos' : 'corto', colorLaurel: PALA.MARMOL, t: 0 };
    R.personaje(x + (k === 'romulo' ? 10 : 0), 148, k === 'nino' ? 38 : 44, base);
    if (k === 'romulo') R.loba(x - 10, 148, 0, { rampa: PALA.MARMOL, esc: 0.8 });
  });
};
rodar(E, R, [[0, villa], [m.nom - 0.2, estatuas]], { caja: (t, e) => R.caja(t, t > m.vil + 4 && t < m.nom - 0.2 ? tramo(t, m.vil + 4, m.vil + 4.4) : 0, (x, y) => R.numero('16', x + 10, y + 12), { energia: e }) });
</script>
</body>
</html>
