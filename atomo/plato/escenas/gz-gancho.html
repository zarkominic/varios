<script type="module">
// GZ-GANCHO (frases 1–2), sin cartela. Siete planos:
// 1. (2025) la meseta de Giza al atardecer: el camellero cruza llevando a su camello del ronzal, dos turistas llegan;
//    él señala Kefrén en «second pyramid» y ella le hace una foto (flash en «pyramid»); en «Giza» una línea de barrido
//    sube y lo convierte todo en plano azul;  2. (según ellos) los pozos de cerca en el plano azul: en «eight» salta el 8
//    (golpe), en «sink» la cámara baja seiscientos metros por las roscas hasta los cubos; en «Nobody… prove it» salen
//    tres «?»;  3. (2023) la cara norte de Keops: en el andamio el técnico mete el endoscopio por la rendija en «real
//    secrets»; abajo llegan dos turistas por la cuerda; en «found» la científica se sorprende y sale un bocadillo con lo
//    que ve en la pantallita (el pasillo con su tejado), la turista señala arriba; en «recently» lo celebran;
//    4. (según ellos) el plano azul impreso sobre una mesa: una mano lleva la lupa de mango largo (el brazo entra por
//    abajo); en «full detail» la lupa enseña las salas en grande y en «what they say lies down there» baja por un pozo,
//    con su rosca girando, hasta los cubos y un «?»;  5. (2023) lo que ve el endoscopio: la lucecita de la cámara se
//    enciende poco a poco; en «hidden corridor» la mira ámbar se cierra sobre el pasillo y el foco barre las paredes; en
//    «thinner than a pencil» entra al lado la comparación: el lápiz y el cable;  6. (hacia el 450 a. C.) el laberinto:
//    Heródoto entra entre las columnas; el guía egipcio lo espera con su candil y le hace señas; Heródoto mira a un lado y
//    a otro, se queda boquiabierto en «greater than the pyramids» (el guía alza el candil y salen tres murciélagos del
//    fondo) y señala el fondo, que no se acaba;  7. (hoy) la mesa de Atom: Atom baja de su esquina, levanta la punta de
//    la pirámide de pisapapeles en «the reason», se asoma en «gone down to look»… dentro, nada: una nubecilla de polvo;
//    la deja caer en «yet» y vuelve a su sitio (gag 1).
import * as T from '/atomo/plato/escenas/gz-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('gz-gancho');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const a = (f) => en('pozos', f), c = (f) => en('camino', f);
const P2 = a(0.354), P3 = a(0.7415), P4 = c(-0.004), P5 = c(0.3066), P6 = c(0.5689), P7 = c(0.8246);
const segunda = a(0.243), piramide = a(0.261), giza = a(0.305), ocho = a(0.3561), hunde = a(0.436), tierra = a(0.567), nadie = a(0.614), prueba = a(0.676);
const reales = a(0.808), hallados = a(0.920), reciente = a(0.957);
const veras = c(0.032), detalle = c(0.058), dicen = c(0.128), abajo = c(0.173), alli = c(0.194);
const oculto = c(0.3345), camara = c(0.451), fino = c(0.473), lapizW = c(0.5236);
const laberinto = c(0.579), griego = c(0.6414), mayor = c(0.724), piramides = c(0.771);
const razon = c(0.8408), bajado = c(0.9158), mira = c(0.9664), aun = c(0.980);
const K = hex('#0c0a12');
const PZ = Object.fromEntries(Object.entries({ f0: '#050c22', f1: '#08142e', f2: '#0c1a3a', f3: '#102248', rj: '#132c56', rjM: '#1c3c70', rjC: '#2a568e',
  hal: '#113a62', hal2: '#1a5a88', co: '#2a8ab6', ci: '#5ae0f0', br: '#c8fbff' }).map(([k, v]) => [k, hex(v)]));
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], b4 = (x, y) => (B4[((y & 3) << 2) | (x & 3)] + 0.5) / 16;
const tono = (r, v, x, y) => { let l = Math.floor(v); if (v - l > b4(x, y)) l++; return r[Math.max(0, Math.min(r.length - 1, l))]; };
const mezcla = (a, b, u) => { u = Math.max(0, Math.min(1, u)); const f = (s) => Math.round(((a >>> s) & 255) + (((b >>> s) & 255) - ((a >>> s) & 255)) * u); return (0xff000000 | (f(16) << 16) | (f(8) << 8) | f(0)) >>> 0; };
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
// la pluma del plano azul: halo y luego núcleo; 'c' cian, 'd' cian apagado, 'b' brillo
const pluma = (L) => {
  for (const [x0, y0, x1, y1, k] of L) if (k !== 'd') for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) R.linea(Math.round(x0 + dx), Math.round(y0 + dy), Math.round(x1 + dx), Math.round(y1 + dy), PZ.hal);
  for (const [x0, y0, x1, y1, k] of L) R.linea(Math.round(x0), Math.round(y0), Math.round(x1), Math.round(y1), k === 'd' ? PZ.co : k === 'b' ? PZ.br : PZ.ci);
};
const caja = (L, x0, y0, x1, y1, k = 'c') => L.push([x0, y0, x1, y0, k], [x1, y0, x1, y1, k], [x1, y1, x0, y1, k], [x0, y1, x0, y0, k]);
// un camello que anda (22 px de alto): joroba con su manta, cuello curvo, cabeza que cabecea, patas que se cruzan y
// la cola que se mueve; x = el centro del cuerpo, dir = hacia dónde mira. Devuelve dónde va el ronzal (la cabeza).
const CAM = { k: hex('#2a1a10'), a: hex('#c8995a'), s: hex('#9a7040'), l: hex('#e4c088'), m1: hex('#b83a2a'), m2: hex('#2a5a9a'), m3: hex('#e8c040') };
const elipse = (cx, cy, rx, ry, c) => { for (let j = -ry; j <= ry; j++) { const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (j / (ry + 0.5)) ** 2))); R.rect(cx - w, cy + j, cx + w, cy + j, c); } };
const camello = (x, suelo, t, dir = 1, anda = false, k = 0) => {
  x = Math.round(x); const X = (i) => x + i * dir, ph = t * 5 + k, p = anda ? Math.sin(ph) : 0, cab = anda ? Math.round(Math.sin(ph * 2) * 1) : Math.round(Math.sin(t * 1.3 + k) * 0.8);
  // las patas de atrás (lejanas, en sombra) y las de delante, que se cruzan al andar
  for (const [i0, f, c] of [[-6, -p, CAM.s], [5, p, CAM.s], [-4, p, CAM.a], [7, -p, CAM.a]]) { const pie = Math.round(f * 2); R.linea(X(i0), suelo - 10, X(i0 + pie), suelo - 1, CAM.k); R.linea(X(i0) + dir, suelo - 10, X(i0 + pie) + dir, suelo - 1, c); R.rect(Math.min(X(i0 + pie), X(i0 + pie + 1)), suelo - 1, Math.max(X(i0 + pie), X(i0 + pie + 1)) + 1, suelo, CAM.k); }
  // el cuerpo y la joroba, con su contorno, su luz arriba y su sombra abajo
  elipse(x, suelo - 13, 10, 4, CAM.k); elipse(X(-1), suelo - 17, 6, 4, CAM.k);
  elipse(x, suelo - 13, 9, 3, CAM.a); elipse(X(-1), suelo - 17, 5, 3, CAM.a);
  R.rect(x - 7, suelo - 11, x + 7, suelo - 11, CAM.s); R.rect(X(-3) - 1, suelo - 20, X(-3) + 2, suelo - 20, CAM.l);
  // la manta de colores sobre la joroba, con flecos
  for (let i = -4; i <= 3; i++) { R.pset(X(i - 1), suelo - 16, [CAM.m1, CAM.m3, CAM.m2][(i + 8) % 3]); R.pset(X(i - 1), suelo - 15, CAM.m1); if (i % 2 === 0) R.pset(X(i - 1), suelo - 14, CAM.m3); }
  // el cuello curvo y la cabeza, que cabecea al andar
  for (let j = 0; j < 9; j++) { const nx = X(9 + Math.round(j * 0.5)), ny = suelo - 13 - j + (j > 5 ? cab : 0); R.rect(Math.min(nx, nx + dir * 2), ny, Math.max(nx, nx + dir * 2), ny, j < 2 ? CAM.s : CAM.a); R.pset(nx - dir, ny, CAM.k); }
  const hy = suelo - 23 + cab, hx = X(13);
  R.rect(Math.min(hx - dir, X(18)), hy - 1, Math.max(hx - dir, X(18)), hy + 2, CAM.k); R.rect(Math.min(hx, X(17)), hy, Math.max(hx, X(17)), hy + 1, CAM.a); R.pset(X(15), hy, CAM.k); R.pset(X(17), hy + 1, CAM.s); R.pset(X(13), hy - 2, CAM.s);
  // la cola, que se mueve
  const cl = Math.round(Math.sin(t * 3 + k) * 1.5); R.linea(X(-10), suelo - 14, X(-11) + cl * dir, suelo - 8, CAM.k); R.pset(X(-11) + cl * dir, suelo - 7, CAM.s);
  return [X(16), hy + 2];
};
// la ficha del bocadillo: lo que acaba de ver la científica en su pantallita (un pasillo con el techo en tejado)
const bocadillo = (x0, y0, w, h, cola, t) => {
  R.rect(x0 - 1, y0, x0 + w + 1, y0 + h, K); R.rect(x0, y0 - 1, x0 + w, y0 + h + 1, K);
  R.rect(x0, y0, x0 + w, y0 + h, hex('#f4ecd8')); R.rect(x0 + 1, y0 + h - 1, x0 + w - 1, y0 + h, hex('#c8bc9e'));
  R.poligono([[cola[0] - 3, y0 + h], [cola[0] + 3, y0 + h], cola], K); R.poligono([[cola[0] - 2, y0 + h], [cola[0] + 2, y0 + h], [cola[0], cola[1] - 2]], hex('#f4ecd8'));
  // la pantallita: el pasillo en perspectiva con su tejado de losas y la luz que tiembla al fondo
  const a0 = x0 + 4, b0 = y0 + 4, a1 = x0 + w - 4, b1 = y0 + h - 4, cx = (a0 + a1) >> 1, cy = ((b0 + b1) >> 1) + 2;
  R.rect(a0, b0, a1, b1, hex('#1a120a'));
  for (let y = b0; y <= b1; y++) for (let x = a0; x <= a1; x++) { const d = Math.max(Math.abs(x - cx) / (a1 - a0), Math.abs(y - cy) / (b1 - b0)); if (d > 0.12) R.pset(x, y, tono([hex('#2a1c10'), hex('#5a4024'), hex('#8a6a40'), hex('#b8925a')], 3.2 - d * 5 + (hh(x >> 1, y >> 1) - 0.5) * 0.8, x, y)); }
  R.linea(a0, b0, cx - 3, cy - 4, K); R.linea(a1, b0, cx + 3, cy - 4, K); R.linea(a0, b1, cx - 3, cy + 3, K); R.linea(a1, b1, cx + 3, cy + 3, K);
  R.linea(a0, b0 + 4, cx, b0 - 1 + 2, hex('#e8c890')); R.linea(a1, b0 + 4, cx, b0 - 1 + 2, hex('#e8c890'));
  R.rect(cx - 3, cy - 4, cx + 3, cy + 3, hex('#0a0604')); if (Math.sin(t * 9) > -0.3) R.pset(cx, cy, hex('#ffe0a0'));
};

// Atom en el plano (plano 7), con su halo; la esquina se queda tranquila mientras está en la mesa
const comp0 = R.companero; R.companero = (t, e) => { if (t < P7) comp0(t, e); };
const atomEn = (x, y, t, e = 0.4, r = 13) => {
  for (let j = -20; j <= 20; j++) for (let i = -20; i <= 20; i++) { const g = 1 - Math.hypot(i, j) / (r + 6); if (g > 0.3 && ((i + j) & 1 || g > 0.6)) R.pset(x + i, y + j, g > 0.7 ? R.PAL.GLOW[1] : R.PAL.GLOW[0]); }
  R.atomo(x, y, t, { r, orbita: R.PAL.ATOM[7], energia: e });
};

// 1 · la meseta al atardecer; en «Giza» el barrido la vuelve plano azul
const O1 = { hora: 'atardecer' };
let azul = null;
const p1 = (t) => {
  T.giza(R, t, O1);
  // el camellero cruza por la izquierda con su vara
  const u = tramo(t, 0.2, P2 - 0.3);
  const xc = Math.round(lerp(18, 96, u)), anda = u > 0 && u < 1;
  const ron = camello(xc - 24, 166, t, 1, anda);
  const ca = R.actor(EL.camellero, xc, 166, t, { dir: 1, anda, sostiene: [xc - 7, 152], sonrisa: !anda });
  if (ca && ca.mano) { const [mx, my] = ca.mano; for (let k = 0; k <= 8; k++) { const f = k / 8; R.pset(Math.round(lerp(ron[0], mx, f)), Math.round(lerp(ron[1], my, f) + Math.sin(f * Math.PI) * 2), hex('#3a2a1a')); } }
  // los dos turistas llegan por la derecha; él señala Kefrén, ella le hace la foto
  const v = tramo(t, 0.4, 3.4), xa = Math.round(lerp(300, 250, v)), xb = Math.round(lerp(282, 214, tramo(t, 0.6, 3.9)));
  R.actor(EL.turista2, xa, 166, t, { dir: -1, anda: v > 0 && v < 1, dedo: t > segunda - 0.15 && t < giza + 0.3, sorpresa: t > giza, habla: t > 3.5 && t < segunda - 0.2 && Math.sin(t * 9) > 0 });
  const ub = tramo(t, 0.6, 3.9), foto = t > piramide - 0.9;
  const r1 = R.actor(EL.turista1, xb, 162, t, { dir: 1, anda: ub > 0 && ub < 1, sostiene: foto ? [xb + 20, 140] : undefined, sonrisa: t > piramide + 0.3 });
  if (foto) { const [mx, my] = r1.mano; R.rect(mx - 1, my - 7, mx + 3, my, K); R.rect(mx, my - 6, mx + 2, my - 1, hex('#5a6a8a')); R.pset(mx + 1, my - 5, hex('#bfe0ff'));
    const f = tramo(t, piramide, piramide + 0.25); if (f > 0 && f < 1) { R.disco(mx + 1, my - 4, Math.round(2 + f * 5), hex('#fff8d8')); R.disco(mx + 1, my - 4, 2, hex('#ffffff')); } }
  T.gizaDelante(R, t, O1);
  // el barrido: una línea de holograma que sube y deja debajo el plano azul de los pozos
  const w = tramo(t, giza + 0.1, P2);
  if (w > 0) {
    if (!azul) azul = R.nuevo();
    const prev = R.usar(azul); T.plano(R, t, { encuadre: 'corte', camara: 'pozos', baja: 0 }); R.usar(prev);
    const yl = Math.round(lerp(181, -2, w * w * (3 - 2 * w)));
    for (let y = Math.max(0, yl); y < 180; y++) for (let x = 0; x < 320; x++) R.pset(x, y, azul[y * 320 + x]);
    if (yl > 0 && yl < 180) {
      for (let x = 0; x < 320; x++) { R.pset(x, yl, PZ.br); if (yl - 1 >= 0) R.pset(x, yl - 1, (x + Math.floor(t * 40)) % 5 ? PZ.ci : PZ.br); if (yl - 2 >= 0 && hh(x, yl) > 0.6) R.pset(x, yl - 2, PZ.ci); if (yl - 4 >= 0 && hh(x, yl, 3) > 0.85) R.pset(x, yl - 4, PZ.co); }
    }
  }
};

// 2 · los pozos de cerca: en «eight» el 8 (golpe); en «sink» la cámara baja; en «prove it» los «?»
const p2 = (t) => {
  const bj = tramo(t, hunde - 0.15, tierra + 0.6), o = { encuadre: 'corte', camara: 'pozos', baja: bj * bj * (3 - 2 * bj) };
  T.plano(R, t, o); T.planoDelante(R, t, o);
  // el 8, con su marco cian, que salta en «eight» y se va al bajar
  const e8 = tramo(t, ocho - 0.05, ocho + 0.25), fuera = tramo(t, hunde + 0.4, hunde + 1.0);
  if (e8 > 0 && fuera < 1) {
    const y = Math.round(28 - Math.sin(e8 * Math.PI) * 5 - fuera * 40), x = 44;
    const L = []; caja(L, x - 4, y - 3, x + 30, y + 23, 'c'); L.push([x + 13, y + 24, x + 13, y + 34, 'c'], [x + 10, y + 31, x + 13, y + 34, 'c'], [x + 16, y + 31, x + 13, y + 34, 'c']); pluma(L);
    for (let j = y - 2; j <= y + 22; j++) for (let i = x - 3; i <= x + 29; i++) if ((i + j) & 1) R.pset(i, j, PZ.f2);
    R.numero('8', x + 13, y + 20, { tam: 16, centro: true });
    if (t < ocho + 0.5) { const g = tramo(t, ocho, ocho + 0.5); for (let q = 0; q < 12; q++) { const an = q * Math.PI / 6, rr = 22 + g * 16; R.pset(Math.round(x + 13 + Math.cos(an) * rr), Math.round(y + 10 + Math.sin(an) * rr * 0.8), PZ.br); } }
  }
  // «Nobody has been able to prove it yet»: tres «?» amarillos que salen de uno en uno junto a los cubos
  for (let i = 0; i < 3; i++) { const t0 = nadie + 0.1 + i * 0.32; if (t < t0) continue; const s = tramo(t, t0, t0 + 0.18);
    const x = [112, 160, 210][i], y = Math.round([64, 46, 64][i] - s * 5 + Math.sin(t * 4 + i * 2) * 2);
    R.icono('?', x - 7, y, hex('#ffe890'), K, 3); }
};

// 3 · la cara norte de Keops: el endoscopio entra por la rendija
const p3 = (t) => {
  const en3 = tramo(t, reales - 0.1, reciente + 0.4), o = { encuadre: 'norte', entra: en3 };
  T.keops(R, t, o);
  // la científica ante la pantallita del maletín; el técnico empuja el cable por la rendija
  const sorp = t > hallados && t < reciente, fiesta = t > reciente;
  R.actor(EL.cientificaFrancesa, 46, 104, t, { dir: 1, sorpresa: sorp, brazos: fiesta && t < reciente + 1.1, salto: fiesta && t < reciente + 1.1 ? Math.round(Math.abs(Math.sin((t - reciente) * 6)) * 3) : 0, sonrisa: t > reciente, habla: t > P3 + 0.4 && t < reales - 0.2 && Math.sin(t * 8) > 0 });
  const empuja = t > reales - 0.1 && t < reciente + 0.4 ? Math.round(Math.sin(t * 7) * 2) : 0;
  if (sorp || (fiesta && t < reciente + 1.2)) R.icono('!', 78, Math.round(70 - tramo(t, hallados, hallados + 0.2) * 4), hex('#ffe890'), K, 2);
  R.actor(EL.tecnicoEgipcio, 82, 104, t, { dir: 1, sostiene: [100 + empuja, 84], sonrisa: t > reciente, habla: t > reciente + 0.6 && Math.sin(t * 8) > 0 });
  // abajo, junto a la cuerda, dos turistas llegan, miran arriba en «found» y ella aplaude en «recently»
  const v = tramo(t, P3 + 0.2, hallados - 0.4), ando = v > 0 && v < 1;
  const xt1 = Math.round(lerp(336, 208, v)), xt2 = Math.round(lerp(352, 228, v));
  R.actor(EL.turista2, xt2, 170, t, { dir: -1, anda: ando, dedo: t > hallados - 0.1 && t < reciente + 0.3, sorpresa: t > hallados && t < reciente });
  R.actor(EL.turista1, xt1, 171, t, { dir: -1, anda: ando, brazos: t > reciente && t < reciente + 1.4, salto: t > reciente && t < reciente + 1.4 ? Math.round(Math.abs(Math.sin((t - reciente) * 7)) * 2) : 0, sonrisa: t > reciente, habla: t > reciente + 1.4 && Math.sin(t * 7) > 0 });
  T.keopsDelante(R, t, o);
  // lo que ve en la pantallita, en un bocadillo que sale en «found» y se queda
  const bo = tramo(t, hallados - 0.05, hallados + 0.1);
  if (bo > 0) { const hb = Math.round(28 * bo); bocadillo(28, 74 - hb - 4, 46, Math.max(6, hb), [48, 76], t); }
};

// 4 · el plano azul impreso sobre la mesa: la mano lleva la lupa por él
let hoja = null, lenteB = null;
const H0 = [16, 20, 266, 164];   // la hoja
const dibujoHoja = (Lx) => {   // las líneas del plano en coordenadas de la hoja (Lx: transformación)
  const L = [], P = (x, y) => Lx(x, y), l = (x0, y0, x1, y1, k = 'c') => { const [a0, b0] = P(x0, y0), [a1, b1] = P(x1, y1); L.push([a0, b0, a1, b1, k]); };
  l(30, 58, 252, 58); for (let x = 34; x < 252; x += 6) l(x, 59, x - 3, 62, 'd');
  l(116, 58, 144, 28); l(144, 28, 172, 58); for (let k = 1; k < 7; k++) { const y = 28 + k * 4.3, w = (y - 28) * 0.95; l(144 - w, y, 144 + w, y, 'd'); }
  l(206, 58, 220, 42, 'd'); l(220, 42, 234, 58, 'd'); l(62, 58, 72, 47, 'd'); l(72, 47, 82, 58, 'd');
  for (let i = 0; i < 5; i++) { const x = 122 + i * 11; l(x - 3, 61, x + 3, 61); l(x + 3, 61, x + 3, 66); l(x + 3, 66, x - 3, 66); l(x - 3, 66, x - 3, 61); if (i < 4) l(x + 3, 63, x + 8, 63, 'd'); }
  for (let i = 0; i < 8; i++) { const x = 102 + i * 12; l(x - 1, 68, x - 1, 140); l(x + 1, 68, x + 1, 140); for (let y = 72; y < 138; y += 6) l(x - 4, y, x + 4, y + 3, 'd'); }
