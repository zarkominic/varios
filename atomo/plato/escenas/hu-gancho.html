<script type="module">
// HU-GANCHO (frases 1–3), 1943, cartela «1943». Once planos de 4,2–5,6 s, todos con acción, vida de fondo y gags:
// 1. Bryan Field al alba (la pista): una AT-6 de la patrulla del alba baja planeando y toca la pista en «1943», levanta
//    polvo y rueda frenando hacia los dos mecánicos que la esperan en el margen de la derecha (uno sorbe su café y la
//    señala con la taza cuando asoma; el otro la guía con los brazos arriba cuando toca tierra); a la izquierda, junto al
//    jeep de la base aparcado con los faros encendidos y el termo humeando en el capó, el navegante sorbe su café («July»)
//    y el sargento de guardia charla con él y bebe en la tapa del termo; cuando la avioneta toca tierra, el sargento la
//    saluda con un bocinazo y dos destellos de las largas y el navegante levanta la taza (se le escapan unas gotas); a lo
//    lejos, la segunda de la patrulla da la vuelta con el tren fuera y la luz de aterrizaje parpadeando;
// 2. el hangar 2 (corta en «at»): por la puerta de atrás entran los tres pilotos británicos y cruzan el hangar hasta la
//    plataforma («British pilots»); en «in training» el primero señala la avioneta aparcada y se ríen; mientras, un
//    mecánico entra por la izquierda empujando una rueda de repuesto, la mete en el hangar y la deja junto a la AT-6 que
//    revisan, y otro barre delante de la puerta verde (el viento se lleva el polvo); dentro, los mecánicos trabajan;
// 3. la plataforma (corta en «are teasing»): los británicos se ríen de la AT-6 junto a Duckworth, que frunce el ceño y
//    protesta con su tablilla («American instructor»); en «little plane» uno le pone la mano encima del morro (le llega a la
//    cintura) y la avioneta se bambolea; el navegante se esconde la sonrisa detrás de la taza;
// 4. el inserto (corta en «They say»): el morro de la avioneta muy de cerca, junto al borde derecho, con el aeródromo
//    desenfocado detrás (pasan un jeep y un mecánico con la caja); el brazo del británico entra por la derecha (camisa de
//    manga corta, la mano canónica) y le da dos palmaditas al capó en «toy»; el tornillo del capó tiembla, salta en
//    «never», bota en «survive» y en «real» y rueda por el hormigón, y en «weather» relampaguea la tormenta del fondo; la
//    mano de Duckworth sube a ras de suelo desde abajo y se lo lleva (gag);
// 5. el hangar con la tormenta más cerca (corta en «The instructor»): Duckworth sale mirando el tornillo, se lo guarda,
//    devuelve el saludo al mecánico que amarra la AT-6 aparcada y se cuadra al verle pasar («Lieutenant Colonel»), sigue
//    hasta la esquina y, en «knows», mira con los prismáticos la tormenta de la derecha; relámpago en «hurricane»: el
//    navegante, que sorbía su café, da un respingo y el mecánico levanta la vista;
// 6. el mapa de papel (corta en «is bearing down»): el golfo entero, con la cámara que se acerca despacio a Texas;
//    el huracán, en espiral, cruza el golfo y se echa encima de la costa; el brazo de Duckworth entra por la izquierda con
//    el lápiz (manga corta remangada, sombra en el papel), toca Galveston (cae su chincheta) y en «at that very moment»
//    traza la raya de Bryan a la tormenta; en la esquina, la taza del navegante humea sobre el mapa;
// 7. la plataforma con la tormenta encima (corta en «So he bets»): Duckworth levanta un vasito con un «?» («a drink»), se
//    dan la mano, señala la avioneta («that toy») y la tormenta («into the storm»: relámpago); en «and come back» él y el
//    navegante se meten en la cabina diminuta como en un coche de feria, se cierra la cubierta y arranca el motor;
// 8. la pista (corta en «He takes off», el golpe de música): la AT-6 a s 2 corre, levanta la cola, despega en «navigator»
//    y se aleja hacia la tormenta, encogiéndose, hasta que la lluvia se la traga («into rain»); a la izquierda, el mecánico
//    que acaba de sacar los calzos la despide con ellos colgando, celebra el despegue, se sujeta la gorra con la racha y
//    sale corriendo cuando llega la lluvia; el frente de lluvia barre la pista y, en «wind», la racha le arranca la gorra
//    a uno de los dos británicos que la despiden desde el margen;
// 9. dentro de la tormenta (corta en «as the navigator»): la avioneta pequeña entre muros de lluvia y rayos; una gaviota
//    pasa dando vueltas de campana en el viento; en «tossed about like a stick in a dog's mouth» la zarandean de lado a
//    lado como el perro sacude un palo;
// 10. de cerca, la cabina (corta tras «mouth»): la avioneta grande y, dentro, Duckworth y el navegante pequeños, con su
//    casco de cuero y las gafas, botando con los golpes; la taza del navegante flota con el café fuera y él la persigue
//    con la mano (gag); en «Suddenly» un último bandazo y Duckworth se vuelve a mirarla; en «the rain stops» la pared se
//    abre, y en «the sun comes out» entra el sol, el café vuelve a la taza y la taza aterriza suave en la tablilla;
// 11. el ojo (corta en «They are inside the eye»): el estadio de nubes al sol sobre el campo de Texas; la avioneta vuela
//    tranquila y la gaviota de la tormenta llega aleteando y se posa en su lomo, detrás de la cubierta, en «a hole of
//    calm», a descansar; en «center» ahueca las alas (gag).
import * as T from '/atomo/plato/escenas/hu-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hu-gancho');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const C = T.C;
const a = (f) => en('leyenda', f), b = (f) => en('apuesta', f), c = (f) => en('ojo', f);
// los cortes, en la palabra que toca (tiempos de cada palabra en build/largo/ep12/linea.json)
const P2 = a(0.2417), P3 = a(0.5279), P4 = a(0.7974), P5 = b(0), P6 = b(0.3203), P7 = b(0.6428), P8 = c(0), P9 = c(0.2501), P10 = c(0.502), P11 = c(0.7605);
// las palabras con las que va la acción
const julio = a(0.0888), anyo = a(0.1491);
const britanicos = a(0.4309), entrenando = a(0.4889);
const americano = a(0.5776), instructor = a(0.6072), pequena = a(0.7031), entrenan = a(0.7374);
const juguete = a(0.8686), nunca = a(0.9066), sobrevive = a(0.9208), real = a(0.9432), tiempo = a(0.968);
const teniente = b(0.092), joe = b(0.1394), duck = b(0.1616), sabe = b(0.2418), huracan = b(0.2936);
const echa = b(0.3528), galveston = b(0.4743), momento = b(0.5291);
const apuesta = b(0.6635), copa = b(0.7065), volar = b(0.7702), derecho = b(0.8399), tormenta = b(0.9005), volver = b(0.9464);
const despega = c(0.0203), navegante = c(0.055), lluvia = c(0.1029), viento = c(0.1508);
const zarandea = c(0.3717), perro = c(0.4543);
const deRepente = c(0.5842), para = c(0.6201), sol = c(0.6763), sale = c(0.7062);
const dentro = c(0.7725), hueco = c(0.8538), calma = c(0.8754), centro = c(0.9304);

const lin = (t, x, y) => Math.max(0, Math.min(1, (t - x) / (y - x)));
const suave = (u) => u * u * (3 - 2 * u);
const entre = (t, x, y) => t >= x && t < y;
const parp = (t, v = 7) => Math.sin(t * v) > 0;
const mezcla = (p, q, f) => { const r = p & 255, g = (p >> 8) & 255, bb = (p >> 16) & 255, r2 = q & 255, g2 = (q >> 8) & 255, b2 = (q >> 16) & 255;
  return (0xff000000 | (Math.round(bb + (b2 - bb) * f) << 16) | (Math.round(g + (g2 - g) * f) << 8) | Math.round(r + (r2 - r) * f)) >>> 0; };
const ruido = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const umbral = (x, y) => (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
const K = C.k;
const PAL = {
  k: K, W: hex('#f4f4f0'), S: hex('#c4c8d2'), B: hex('#3a6ac8'), c: hex('#5a3418'), C: hex('#8a5428'),
  m: hex('#9aa4b4'), M: hex('#d8dee8'), a: hex('#e0a030'), A: hex('#f4cc60'), v: hex('#d8ecf6'),
};
// un británico pelirrojo (el tercero), con la misma ropa
const PELIRROJO = { H: hex('#b8582a'), h: hex('#d8783a') };
const MANGA = { duck: '#6a6444', brit: '#6a7a96' };
const VIDRIOS = [hex('#34404e'), hex('#4a5a6e')];   // el cristal de la cubierta de la AT-6 (sin los reflejos)

// ── piezas locales ─────────────────────────────────────────────────────────────────────────────────────────────────
const dibuja = (g, x, y, dir = 1) => R.dibujo(g, Math.round(x), Math.round(y), dir, PAL);
// un sprite girado (vecino más cercano), centrado en (cx, cy)
const girado = (g, cx, cy, ang) => {
  const hh = g.length, w = g[0].length, ca = Math.cos(ang), sa = Math.sin(ang), r = Math.ceil(Math.hypot(w, hh) / 2) + 1;
  for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) {
    const u = Math.round(i * ca + j * sa + (w - 1) / 2), v = Math.round(-i * sa + j * ca + (hh - 1) / 2);
    if (u < 0 || v < 0 || u >= w || v >= hh) continue; const col = PAL[g[v][u]]; if (col == null) continue; R.pset(Math.round(cx) + i, Math.round(cy) + j, col);
  }
};
// la taza esmaltada del navegante: blanca con el borde azul y el asa a la derecha
const TAZA = ['kkkkk..', 'kBBBkkk', 'kWWWk.k', 'kWWSkkk', 'kWSSk..', '.kkk...'];
const taza = (x, y, dir = 1) => dibuja(TAZA, dir > 0 ? x : x - 6, y, dir);
// el vapor del café: tres hebras que suben y se deshacen
const vapor = (x, y, t) => { for (let k = 0; k < 3; k++) { const u = (t * 0.8 + k / 3) % 1, px = Math.round(x + k - 1 + Math.sin(u * 7 + k * 2) * 1.2), py = Math.round(y - u * 9); if (u < 0.85) R.pset(px, py, u < 0.45 ? hex('#eef0f4') : hex('#aeb4c2')); } };
// el vasito de la apuesta: whisky ambarino con su brillo
const VASO = ['k...k', 'kv..k', 'kAAAk', 'kaaak', '.kkk.'];
// el tornillo del capó (cabeza ranurada y la caña)
const TORNILLO = ['kkkk', 'kMmk', 'kkkk', '.kk.', '.km.', '.kk.'];
// los prismáticos
const PRISMA = ['kk.kk', 'kmkmk', 'kkkkk'];
// la tablilla de vuelo de Duckworth
const TABLILLA = ['kkkk', 'kWWk', 'kWWk', 'kWWk', 'kkkk'];
// la gorra de un británico que se lleva el viento
const GORRA = ['.kkkk.', 'kBBBBk', 'kkkkkk'];
const GORRA_PAL = { k: K, B: hex('#4e5c78') };
// la gaviota con contorno (para que se vea contra las nubes blancas): alas arriba, abajo y plegadas
const GAVIOTA = [
  ['k.......k', 'kmk...kmk', '.kWk.kWk.', '..kWWWkkk', '...kkk.A.'],
  ['...kkkkk.', '..kWWWkkk', '.kmWk.kA.', 'kmk......', 'k........'],
];
// la gaviota posada (mirando a la derecha): cabeza blanca con el pico amarillo, el ala gris y la punta de la cola negra
const POSADA = ['......kkk..', '.....kWWWk.', '.....kWkWAA', 'kk..kkWWWk.', 'kkkkmmmWWk.', '.kmmmmmWWk.', '..kkkkkkk..', '....A..A...'];
const gaviota = (x, y, pose, dir = 1) => R.dibujo(GAVIOTA[pose], Math.round(x) - 4, Math.round(y) - 2, dir, PAL);
// la gaviota que da vueltas de campana en el viento (girada ang radianes)
const gaviotaGira = (x, y, ang, pose) => girado(GAVIOTA[pose], x, y, ang);
// dónde lleva algo un personaje en la mano que cuelga, y en la levantada (con dedo: true), junto a la cara
const enMano = (x, s, dir) => [dir > 0 ? x + 12 : x - 4, s - 11];
const arriba = (x, s, dir) => [dir > 0 ? x + 15 : x - 1, s - 21];
// ── el brazo que entra desde fuera del cuadro ──────────────────────────────────────────────────────────────────────
// La mano es la canónica (T.mano, 14 px); el brazo se dibuja aquí para que se lea como un brazo y no como un palo: el
// antebrazo desnudo con su luz arriba y su sombra abajo, el reloj de pulsera en la muñeca, el codo redondeado y la manga
// corta de la camisa de verano (julio en Texas), con su dobladillo y sus arrugas, que se ensancha hacia el borde porque
// el hombro queda fuera, cerca de la cámara. capsula: los píxeles de un segmento grueso de A a B (radio wa → wb), con la
// distancia al eje, el radio, la fracción u y el lado (+1 el de arriba, el de la luz; −1 el de abajo)
const capsula = (A, B, wa, wb, pinta) => {
  const [ax, ay] = A, [bx, by] = B, vx = bx - ax, vy = by - ay, L2 = vx * vx + vy * vy || 1, L = Math.sqrt(L2);
  let nx = -vy / L, ny = vx / L; if (ny > 0 || (ny === 0 && nx > 0)) { nx = -nx; ny = -ny; }
  const m = Math.max(wa, wb) + 2, x0 = Math.max(0, Math.floor(Math.min(ax, bx) - m)), x1 = Math.min(319, Math.ceil(Math.max(ax, bx) + m)), y0 = Math.max(0, Math.floor(Math.min(ay, by) - m)), y1 = Math.min(179, Math.ceil(Math.max(ay, by) + m));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const u = Math.max(0, Math.min(1, ((x - ax) * vx + (y - ay) * vy) / L2)), dx = x - ax - vx * u, dy = y - ay - vy * u, d = Math.hypot(dx, dy), w = wa + (wb - wa) * u;
    if (d <= w + 1) pinta(x, y, d, w, u * L, (dx * nx + dy * ny) / Math.max(1, w));
  }
};
const PIEL = { L: hex('#fcd8b0'), S: hex('#f6c290'), s: hex('#d48a5a'), d: hex('#b8704a') };
const MANO_TMP = R.nuevo();
// (x, y): la mano, como en T.mano; dir: hacia dónde apuntan los dedos; hombro: [x, y], fuera del cuadro; o.codo: cuánto se
// dobla el codo (radianes, el signo elige el lado); o.ante: el largo del antebrazo; o.manga: el color de la camisa;
// o.ancho: lo que se ensancha la manga hacia el borde; o.sombra [dx, dy]: la sombra del brazo sobre lo de debajo
const brazo = (x, y, dir, hombro, o = {}) => {
  x = Math.round(x); y = Math.round(y);
  const mg = hex(o.manga ?? MANGA.duck), mL = mezcla(mg, hex('#ffffff'), 0.2), mS = mezcla(mg, K, 0.28), mD = mezcla(mg, K, 0.5);
  const W = [x - dir * 4, y], [sx, sy] = hombro, Lf = o.ante ?? 21;
  const th = Math.atan2(sy - W[1], sx - W[0]) + (o.codo ?? 0.3), E = [W[0] + Math.cos(th) * Lf, W[1] + Math.sin(th) * Lf];
  const lu = Math.hypot(sx - E[0], sy - E[1]) || 1, Hm = [E[0] + (sx - E[0]) * 4 / lu, E[1] + (sy - E[1]) * 4 / lu], S = [sx, sy];
  const wS0 = 4, wS1 = 4 + (o.ancho ?? 4.5);
  // la sombra del brazo sobre la mesa o el papel (tramada, desplazada)
  if (o.sombra) { const [ox, oy] = o.sombra, sh = (p) => [p[0] + ox, p[1] + oy], osc = (px, py, d, w) => { if (d <= w && umbral(px, py) < 0.55) R.pset(px, py, mezcla(R.pget(px, py), hex('#3a3428'), 0.3)); };
    capsula(sh(W), sh(E), 2.2, 2.8, osc); capsula(sh(E), sh(S), 3, wS1, osc);
    const hc = x + dir * 3.5 + ox; for (let j = -4; j <= 4; j++) for (let i = -8; i <= 8; i++) { const px = Math.round(hc + i), py = y + oy + j; if (i * i / 56 + j * j / 16 < 1 && umbral(px, py) < 0.55) R.pset(px, py, mezcla(R.pget(px, py), hex('#3a3428'), 0.3)); } }
  // el contorno de todo, y luego los rellenos (así las juntas quedan limpias)
  const borde = (px, py, d, w) => { if (d > w) R.pset(px, py, K); };
  capsula(W, E, 1.9, 3, borde); capsula(E, Hm, 3, 3.3, borde); capsula(Hm, S, wS0, wS1, borde);
  const piel = (px, py, d, w, l, lado) => { if (d <= w) R.pset(px, py, lado > 0.45 ? PIEL.L : lado < -0.55 ? PIEL.d : lado < -0.15 ? PIEL.s : PIEL.S); };
  capsula(W, E, 1.9, 3, piel); capsula(E, Hm, 3, 3.3, piel);
  // el reloj de pulsera: la correa de cuero y la esfera con su brillo
  capsula(W, E, 1.9, 3, (px, py, d, w, l, lado) => { if (d <= w && l >= 2.2 && l < 4.2) R.pset(px, py, lado > 0.5 && l < 3.6 ? hex('#d8dce4') : hex('#4a3020')); });
  // la manga: luz arriba, sombra abajo, el dobladillo vuelto junto al codo y las arrugas
  capsula(Hm, S, wS0, wS1, (px, py, d, w, l, lado) => {
    if (d > w) return;
    let c = lado > 0.55 ? mL : lado < -0.6 ? mD : lado < -0.12 ? mS : mg;
    if (l < 3.4) c = l < 0.9 ? mD : l > 2.6 ? mS : lado > 0.1 ? mL : mg;                  // el dobladillo vuelto
    else { // las arrugas: pliegues en diagonal que salen del codo, con su canto de luz, y la costura de abajo
      const q = l - 3.4 + lado * 2.6, k = Math.floor(q / 8), f = q - k * 8;
      if (k < 3 && Math.abs(lado) < 0.7 && f < 1) c = mS; else if (k < 3 && Math.abs(lado) < 0.6 && f < 2 && lado > -0.2) c = mL;
      if (lado < -0.75 && lado > -0.95 && umbral(px, py) < 0.5) c = mD;
    }
    R.pset(px, py, c);
  });
  // la mano canónica (T.mano) se pinta en un búfer aparte y solo se copia la mano (su manga larga de 40 px no se usa);
  // con la piel como «manga», su puño es la muñeca desnuda
  const prev = R.usar(MANO_TMP); T.mano(R, x, y, dir, '#f6c290'); R.usar(prev);
  const hx0 = x - (dir > 0 ? 3 : 10), hy0 = y - 4;
  for (let j = 0; j < 8; j++) for (let i = 0; i < 14; i++) { const X = hx0 + i, Y = hy0 + j; if (X < 0 || X > 319 || Y < 0 || Y > 179) continue; const c = MANO_TMP[Y * 320 + X]; if (c) R.pset(X, Y, c); }
  MANO_TMP.fill(0, Math.max(0, hy0 - 2) * 320, Math.min(180, hy0 + 11) * 320);
  return E;
};

// ── el jeep Willys de la base, de perfil ───────────────────────────────────────────────────────────────────────────
// x: el centro, suelo: donde pisan las ruedas, o.dir. Verde oliva con su luz y su sombra, la estrella blanca en el capó,
// la rejilla, el parachoques, el parabrisas levantado con su brillo, el volante, el asiento, la rueda de repuesto y el
// bidón detrás, la pala y el hacha en el costado, la antena de látigo que se mece, los faros (o.faros 0–1: encendidos,
// con su haz sobre la hierba; o.rafaga: el destello de las largas), el escape que humea al ralentí y las ruedas (o.giro:
// el ángulo de las ruedas). o.conductor: el personaje sentado al volante (con o.conductorOpc); devuelve dónde va su mano
const OLIVA = { L: hex('#80845a'), M: hex('#5f6341'), S: hex('#474a30'), D: hex('#30321f') };
const JEEP = [[-17, 4.5], [-17, 12], [-4.5, 12], [-3, 9.5], [2, 9.5], [3.5, 12], [15.5, 11.5], [17.5, 10.5], [17.5, 4.5]];
const ESTRELLA = ['..W..', 'WWWWW', '.WWW.', '.W.W.'];
const TERMO = ['.kkk.', 'kRrRk', 'kkkkk', 'kGLGk', 'kGLGk', 'kGLgk', 'kGLgk', 'kGGgk', '.kkk.'];
const TERMO_PAL = { k: K, R: hex('#b83a2a'), r: hex('#8a2a20'), G: hex('#7a8a6a'), g: hex('#5a6a4e'), L: hex('#b8c8a8') };
const jeep = (x, suelo, t, o = {}) => {
  const d = o.dir ?? 1, f = (u) => Math.round(x + u * d), Y = (v) => Math.round(suelo - v);
  const r = (a, b, v0, v1, c) => R.rect(Math.min(f(a), f(b)), Y(v1), Math.max(f(a), f(b)), Y(v0), c);
  // la sombra en el suelo
  for (let i = -21; i <= 21; i++) for (let j = 0; j < 2; j++) { const X = f(i), YY = suelo + j; if (umbral(X, YY) < (j ? 0.35 : 0.75)) R.pset(X, YY, mezcla(R.pget(X, YY), K, 0.38)); }
  // el haz de los faros sobre la hierba (detrás de todo lo del jeep)
  const luz = Math.min(1, (o.faros ?? 0) + (o.rafaga ?? 0) * 0.8);

// ── 7 · la apuesta y a la cabina ───────────────────────────────────────────────────────────────────────────────────
const entraN = [volver - 0.25, volver + 0.35], entraD = [volver + 0.2, volver + 0.75], cierra = entraD[1] + 0.12, motor = cierra + 0.2;
const p7 = (t) => {
  T.aerodromo(R, t, { tormenta: 0.8 });
  rayo(214, 50, 77, 11, tormenta, t, [150, 40, 270, 90]);
  nublar(0.2);
  // quién se mete en la cabina: primero el navegante (con su taza) y después Duckworth; se hunden en la cabina diminuta
  const enCabina = (def, x0, x1, t0, t1, o) => {
    const anda = lin(t, t0 - 0.55, t0), hunde = lin(t, t0, t1), x = Math.round(lerp(x0, x1, anda));
    if (hunde >= 1) return;
    const s = 158 + Math.round(hunde * 16) - (entre(hunde, 0.01, 0.3) ? 3 : 0);
    R.recorte([0, 0, 319, 153]); R.actor(def, x, s, t, { dir: x1 >= x0 ? 1 : -1, anda: anda > 0 && anda < 1, sonrisa: hunde > 0, ...o }); R.recorte(null);
    return [x, s];
  };
  const nv = enCabina(EL.navegante, 96, 136, entraN[0], entraN[1], {});
  if (nv) { const [tx, ty] = enMano(nv[0], nv[1], 1); if (ty < 150) taza(tx, ty, 1); }
  const dentroD = t > entraD[0] - 0.55;
  if (dentroD) enCabina(EL.duckworth, 178, 144, entraD[0], entraD[1], {});
  // la AT-6: la cubierta abierta hasta que suben, los dos cascos dentro, el arranque con su bocanada
  const helice = lin(t, motor, motor + 0.5);
  T.at6(R, 150, 158, t, { s: 1, dir: 1, abierta: t < cierra, piloto: t > entraD[1] ? EL.duckworth : null, copiloto: t > entraN[1] ? EL.navegante : null, helice: helice * 0.9, humo: t > motor ? Math.max(0, 1 - (t - motor) / 0.6) : 0 });
  for (const [t1, x1] of [[entraN[1], 143], [entraD[1], 151]]) if (entre(t, t1, t1 + 0.25)) { const r = 2 + Math.round(lin(t, t1, t1 + 0.25) * 4); for (let k = 0; k < 8; k++) R.pset(Math.round(x1 + Math.cos(k * 0.8) * r), Math.round(141 + Math.sin(k * 0.8) * r * 0.6), C.blanco); }
  // Duckworth: levanta el vasito («a drink») con el «?», se dan la mano, señala la avioneta y la tormenta
  const brinda = entre(t, apuesta - 0.05, copa + 0.4), mano = entre(t, copa + 0.4, volar - 0.05), avion = entre(t, volar, derecho), torm = entre(t, derecho, volver - 0.1);
  if (!dentroD) {
    R.actor(EL.duckworth, 178, 158, t, { dir: avion ? -1 : 1, dedo: brinda || avion || torm, sonrisa: brinda || mano, habla: (entre(t, P7, apuesta) || avion) && parp(t, 9) });
    if (brinda) { const [hx, hy] = arriba(178, 158, 1); dibuja(VASO, hx - 1, hy - 3); if (entre(t, copa, copa + 0.3)) for (let r = 1; r < 4; r++) { R.pset(hx + 1 + r, hy - 5, C.blanco); R.pset(hx + 1, hy - 5 - r, C.blanco); R.pset(hx + 1 - r, hy - 5, C.blanco); } R.bocadillo(193, 128 - (Math.floor(t * 3) % 2), { icono: '?' }); }
    if (mano) { const y = 149 + (Math.floor(t * 9) % 2); R.rect(189, y, 193, y + 1, hex(MANGA.duck)); R.rect(198, y, 202, y + 1, hex(MANGA.brit)); R.rect(193, y - 1, 198, y + 2, K); R.rect(194, y, 197, y + 1, hex('#f6c290')); }
  }
  // los británicos: se ríen de la apuesta, el primero se acerca a dar la mano, miran la tormenta y despiden con los brazos
  const da = lin(t, copa + 0.15, copa + 0.4) - lin(t, volar - 0.05, volar + 0.25), mira = entre(t, tormenta - 0.1, volver);
  const adios = t > cierra;
  R.actor(EL.britanico, Math.round(lerp(204, 196, da)), 160, t, { dir: mira ? 1 : -1, anda: da > 0 && da < 1, brazos: adios && parp(t, 6), sorpresa: entre(t, tormenta, tormenta + 0.5), ...(mira || adios ? {} : rie(t, 0)) });
  R.actor(EL.britanico2, 220, 162, t, { dir: mira ? 1 : -1, sorpresa: entre(t, tormenta, tormenta + 0.5), brazos: adios && !parp(t, 6), ...(mira ? {} : rie(t, 1)) });
  R.actor(EL.britanico2, 238, 158, t, { dir: -1, pal: PELIRROJO, dedo: entre(t, volar, derecho), ...(entre(t, tormenta, tormenta + 0.5) ? { sorpresa: true } : rie(t, 2)) });
};

// ── 8 · el despegue hacia la tormenta ──────────────────────────────────────────────────────────────────────────────
const t0d = P8 - 0.5, airea = t0d + 1.7, fin8 = t0d + 3.4;
const p8 = (t) => {
  T.aerodromo(R, t, { encuadre: 'pista', tormenta: 0.82 });
  rayo(214, 60, 106, 5, viento + 0.75, t, [150, 50, 268, 112]);
  const tau = t - t0d;
  if (t < fin8) {
    const tierra = t < airea, g = lin(tau, 0.3, 1.7), aa = lin(tau, 1.7, 3.4);
    const x = tierra ? 30 + 120 * g ** 1.6 : 150 + 150 * (1 - (1 - aa) ** 1.5), suelo = T.pistaY(Math.round(x));
    const s = tierra ? lerp(2, 1.6, g) : lerp(1.6, 0.75, aa), alt = tierra ? 0 : 74 * aa ** 1.3;
    const inc = tierra ? 0.19 * (1 - lin(tau, 0.6, 1.2)) : 0.12 * Math.min(1, aa * 4) - 0.05 * lin(aa, 0.6, 1);
    const px = Math.round(x), py = Math.round(suelo - alt);
    const desv = lin(aa, 0.62, 1);   // la lluvia se la traga
    const ant = desv > 0 ? new Uint32Array(320 * 180) : null; if (ant) ant.set(R.buf);
    T.at6(R, px, py, t, { s, dir: 1, helice: 1, piloto: EL.duckworth, copiloto: EL.navegante, vuelo: !tierra, suelo, inclina: inc, tren: tierra ? 1 : Math.max(0, 1 - aa * 3), polvo: tierra ? 0.9 : 0, sacude: tierra ? 0 : 0.25 + aa * 0.4 });
    if (ant) { const B = R.buf; for (let y = Math.max(0, py - 60); y < Math.min(180, py + 6); y++) for (let xx = Math.max(0, px - 40); xx < Math.min(320, px + 30); xx++) { const i = y * 320 + xx; if (B[i] !== ant[i] && umbral(xx, y) < desv * 1.05) B[i] = ant[i]; } }
  }
  // la lluvia que barre la pista desde la tormenta: su frente avanza de derecha a izquierda
  const frente = lerp(330, 150, lin(t, lluvia - 0.4, P9 + 0.3));
  for (let k = 0; k < 140; k++) { const v = 160 + ruido(k, 3, 50) * 70, x = Math.round(((ruido(k, 1, 50) * 340 - t * v * 0.35) % 340 + 340) % 340 - 10), y = Math.round(((ruido(k, 2, 50) * 150 + t * v) % 150) + 30);
    if (x < frente + ruido(k, 4, 50) * 30) continue; for (let i = 0; i < 6; i++) R.pset(x + Math.round(i * 0.35), y - i, i < 2 ? hex('#e0e6f0') : hex('#8e9ab0')); }
  // el mecánico de los calzos, en el margen de la izquierda: los acaba de sacar de las ruedas y se aparta con ellos
  // colgando de la cuerda, la despide con la mano, celebra cuando despega, se sujeta la gorra con la racha y, cuando
  // llega la lluvia, sale corriendo a resguardarse
  const racha = viento - 0.02, sinGorra = t > racha, mira = t > airea + 0.3;
  { const huye = lin(t, P9 - 0.75, P9 + 0.2), x = Math.round(lerp(50, 42, lin(t, P8 - 0.2, P8 + 0.5)) - 70 * huye), ms = 173;
    const corre = huye > 0, adios = entre(t, P8 + 0.3, airea - 0.1), viva = entre(t, airea, airea + 0.9), gorra = entre(t, racha, racha + 0.8);
    R.actor(MECANICO, x, ms, t, { dir: corre ? -1 : 1, anda: corre || entre(t, P8 - 0.2, P8 + 0.5), dedo: (adios && parp(t, 4)) || gorra, brazos: viva && parp(t, 6), sonrisa: viva || adios, sorpresa: gorra || corre });
    if (!viva) { const [hx, hy] = enMano(x, ms, corre ? -1 : 1); calzos(hx - 5 + Math.round(Math.sin(t * 6) * 1), hy + 9, [hx, hy]); } }
  // los británicos (a la derecha, en el margen) se despiden riéndose, se asustan cuando despega de verdad, la miran irse
  // hacia la tormenta y la racha le arranca la gorra a uno
  R.actor(EL.britanico, 270, 169, t, { dir: mira ? 1 : -1, tocado: sinGorra ? '' : undefined, brazos: (t < airea && parp(t, 5)) || entre(t, racha + 0.05, racha + 0.7), sorpresa: entre(t, airea, airea + 0.8) || entre(t, racha, racha + 0.9), ...(t < airea ? rie(t, 0) : {}) });
  R.actor(EL.britanico2, 290, 170, t, { dir: entre(t, racha + 0.9, racha + 1.5) ? -1 : mira ? 1 : -1, brazos: t < airea && !parp(t, 5), sorpresa: entre(t, airea, airea + 0.8), triste: t > racha + 0.9, ...(t < airea ? rie(t, 1) : {}) });
  if (sinGorra) { const u = lin(t, racha, racha + 1.3); if (u < 1) girado(GORRA.map((f) => f.replace(/B/g, 'm')), lerp(282, 150, u), 140 - Math.sin(u * Math.PI) * 30 + u * 14, u * 11); }
  nublar(0.12 + 0.1 * lin(t, P8, P9));
};

// ── 9 · dentro de la tormenta: zarandeados como un palo en la boca de un perro ─────────────────────────────────────
const rayos9 = [P9 + 0.55, perro - 0.15];
const p9 = (t) => {
  const o = { oscuro: 0.72, suelo: 'texas', rayos: rayos9 };
  T.tormentaDentro(R, t, o);
  const e = lin(t, zarandea - 0.15, zarandea + 0.2) * (1 - lin(t, perro + 0.5, P10 + 0.1)), f = 2.7;
  const x = 160 + 7 * Math.sin(t * 1.3) + e * 18 * Math.sin(t * Math.PI * 2 * f + 0.6), y = 90 + 5 * Math.sin(t * 1.9) + e * 7 * Math.sin(t * Math.PI * 4 * f);
  const s = 1.5, inc = 0.04 * Math.sin(t * 2.3) + e * 0.42 * Math.sin(t * Math.PI * 2 * f);
  T.at6(R, Math.round(x), Math.round(y), t, { s, dir: 1, vuelo: true, helice: 1, piloto: EL.duckworth, copiloto: EL.navegante, inclina: inc, sacude: 1 });
  // una gaviota a la que el viento lleva dando vueltas de campana (es la que luego descansará en el ojo)
  { const u = lin(t, P9 + 0.3, P9 + 1.7); if (u > 0 && u < 1) gaviotaGira(lerp(338, -24, u), 46 + 16 * Math.sin(u * Math.PI * 1.3) + 6 * Math.sin(t * 9), u * 15, parp(t, 13) ? 0 : 1); }
  T.b_lluviaDelante(R, t, { ...o, velo: 0.7, sobre: [Math.round(x - 8 * s), Math.round(x + 6 * s), Math.round(y - 6 * s)] });
};

// ── 10 · de cerca: la taza flota, sale el sol y aterriza ───────────────────────────────────────────────────────────
const abre = [deRepente + 0.05, para + 0.45], aterriza = sale;
const p10 = (t) => {
  const cl = suave(lin(t, abre[0], abre[1])), calmo = lin(t, para, sol), o = { oscuro: 0.55 - 0.15 * cl, claro: cl, rayos: [P10 + 0.45] };
  T.tormentaDentro(R, t, o);
  // la avioneta, grande, zarandeada; el último bandazo en «Suddenly»; se calma cuando para la lluvia
  const band = entre(t, deRepente - 0.05, deRepente + 0.35) ? Math.sin(lin(t, deRepente - 0.05, deRepente + 0.35) * Math.PI) : 0;
  const x = Math.round(134 + 14 * suave(lin(t, para, P11))), y = 176 + Math.round(1.5 * Math.sin(t * 2.1) - band * 6);
  const r = T.at6(R, x, y, t, { s: 4, dir: 1, vuelo: true, helice: 1, inclina: 0.02 * Math.sin(t * 1.7) - band * 0.07, sacude: 0.9 * (1 - calmo) });
  // dentro de la cubierta, pequeños dentro de la avioneta grande: el navegante (detrás) y Duckworth (delante), con el
  // casco de cuero y las gafas; los dos botan con los golpes. La taza del navegante flota con el café fuera; él la persigue
  // con la mano y Duckworth se vuelve a mirarla en el último bandazo; cuando sale el sol, baja suave a la tablilla
  const [cx, cy] = r.cabina, sac = Math.round((1 - calmo) * (Math.sin(t * 23) + Math.sin(t * 31)) * 0.8);
  trasCristal(cx - 70, cy - 20, cx + 22, cy + 12, () => {
    const ny = cy - 6 + sac, dy = cy - 6 - sac, nxp = cx - 37, dxp = cx - 7;
    const tbx = cx - 26, tby = cy + 3 + sac;
    const bajada = lin(t, sol - 0.15, aterriza);
    const qx = lerp(cx - 18 + 3 * Math.sin(t * 2.3) + (deRepente < t && t < deRepente + 0.3 ? 2 : 0), tbx + 5, suave(bajada)), qy = lerp(cy - 5 + 2 * Math.sin(t * 3.1), tby - 3, suave(bajada)), ang = lerp(Math.sin(t * 2.7) * 2.6, 0, bajada);
    const coge = entre(t, P10 + 0.3, deRepente - 0.1) || entre(t, sol - 0.2, aterriza + 0.3);
    const parpa = (k) => (t + k) % 2.7 < 0.1;
    pilotoP(nxp, ny, t, { C: hex('#7a4a2a'), W: hex('#d8cca8') }, { sorpresa: entre(t, P10, sol - 0.2), sonrisa: t > sol - 0.2, parpadea: parpa(0.7), brazo: coge ? [Math.round(qx - 5 + Math.sin(t * 7)), Math.round(qy + 2)] : null });
    const vuelve = entre(t, deRepente + 0.05, deRepente + 0.75);
    pilotoP(dxp, dy, t, { C: hex('#6a6444'), W: hex('#f4f4f0') }, { dir: vuelve ? -1 : 1, enfado: t < para && !vuelve, sorpresa: vuelve || entre(t, para, sol), sonrisa: t > sol, parpadea: parpa(1.6) });
    // la tablilla del navegante, delante de él, y la taza: flota y gira con el café fuera; en «the sun comes out» baja suave
    R.rect(tbx, tby, tbx + 10, tby + 1, K); R.rect(tbx, tby, tbx + 10, tby, hex('#a8743c')); R.pset(tbx + 3, tby, hex('#f4f4f0')); R.pset(tbx + 4, tby, hex('#f4f4f0'));
    if (t < aterriza) girado(TAZA, qx, qy, ang); else taza(tbx + 2, tby - 6, 1);
    // el café, fuera de la taza, en una gota temblona; vuelve a la taza justo antes de aterrizar
    const vu = lin(t, sol - 0.45, sol + 0.05);
    if (vu < 1) { const gx = Math.round(lerp(qx + 7 + 2 * Math.sin(t * 4), qx, vu)), gy = Math.round(lerp(qy - 5 + 1.5 * Math.cos(t * 5), qy - 1, vu)), w = parp(t, 11) ? 1 : 0;
      R.rect(gx - 2 - w, gy - 1, gx + 2 + w, gy + 1, K); R.rect(gx - 1, gy - 2 + w, gx + 1, gy + 2 - w, K); R.rect(gx - 1 - w, gy - 1 + (w ? 1 : 0), gx + 1 + w, gy + 1 - (w ? 1 : 0), PAL.c); R.pset(gx - 1, gy - 1, PAL.C);
      if (vu < 0.5) for (let k = 0; k < 2; k++) { const an = t * 5 + k * Math.PI; R.pset(Math.round(gx + Math.cos(an) * 5), Math.round(gy + Math.sin(an) * 3), PAL.c); } }
    if (t > aterriza && t < aterriza + 1.2) vapor(tbx + 4, tby - 7, t);
  });
  T.b_lluviaDelante(R, t, { ...o, velo: 0.35 * (1 - cl) });
  // el sol: entra en rayos dorados por el hueco en «the sun comes out»
  const luz = lin(t, sol - 0.1, sale + 0.2);
  if (luz > 0) for (let y = 0; y < 180; y++) for (let xx = 0; xx < 320; xx++) { if (xx > 272 && y < 48) continue; const bnd = ((xx + y * 0.55 - t * 6) % 46 + 46) % 46; if (bnd < 13 && umbral(xx, y) < luz * 0.32 * (1 - y / 230)) R.pset(xx, y, mezcla(R.pget(xx, y), hex('#fff2c0'), 0.5)); }
};

// ── 11 · el ojo: el hueco de calma y la gaviota que viaja dentro ───────────────────────────────────────────────────
const posa = calma - 0.05;
const p11 = (t) => {
  T.ojo(R, t, { suelo: 'texas', entra: 0.45 + 0.55 * suave(lin(t, P11 - 0.1, dentro + 0.6)) });
  const x = 150 + Math.round(3 * Math.sin(t * 0.7)), y = 92 + Math.round(1.6 * Math.sin(t * 1.5));
  T.at6(R, x, y, t, { s: 2, dir: 1, vuelo: true, helice: 1, piloto: EL.duckworth, copiloto: EL.navegante, inclina: 0.015 * Math.sin(t * 1.1) });
  // la gaviota: llega planeando desde la derecha, aletea junto a la avioneta y se posa en el ala a descansar
  const llega = lin(t, dentro + 0.2, posa), wx = x - 37, wy = y - 25;
  if (t > dentro + 0.2) {
    if (llega < 1) { const gx = lerp(300, wx, suave(llega)) + 10 * Math.sin(llega * 5) * (1 - llega), gy = lerp(64, wy, suave(llega)) - 10 * Math.sin(llega * Math.PI); gaviota(gx, gy, parp(t, 14) ? 0 : 1, -1); }
    else { const rebote = entre(t, posa, posa + 0.2) ? 1 : 0, ahueca = entre(t, centro, centro + 0.45) && parp(t, 18);
      if (ahueca) gaviota(wx, wy - 4, 0, 1); else R.dibujo(POSADA, wx - 5, wy - 7 - rebote, 1, PAL); }
  }
};

const efectos = [
  [1.4, 'motor', { dur: 3.6 }], [julio + 0.05, 'burbujas', { dur: 0.6 }], [toca, 'golpecito'], [toca + 0.22, 'claxon'], [toca + 0.5, 'chof'],
  [entrenando + 0.3, 'palmada'], [P2 + 3.6, 'golpecito'],
  [P3 + 0.1, 'palmada'], [instructor + 0.1, 'papel'], [mano3, 'golpecito'], [entrenan + 0.1, 'boing'],
  [juguete, 'golpecito'], [juguete + 0.3, 'golpecito'], [salta, 'pop'], [sobrevive + 0.06, 'tic'], [real + 0.04, 'tic'], [tiempo, 'trueno'], [rec + 0.3, 'tic'],
  [P5 + 0.3, 'brillo'], [joe, 'rafaga'], [huracan, 'trueno'],
  [echa, 'rafaga'], [galveston - 0.02, 'toc'], [galveston + 0.2, 'pop'], [momento + 0.15, 'lapiz'],
  [apuesta, 'brillo'], [copa + 0.45, 'palmada'], [tormenta, 'trueno'], [entraN[1] - 0.05, 'pop'], [entraD[1] - 0.05, 'pop'], [cierra, 'cerrojo'], [motor - 0.05, 'arranque'],
  [P8 + 0.1, 'motor', { dur: 3.2 }], [airea, 'whoosh'], [lluvia, 'lluvia'], [viento, 'rafaga'], [viento + 0.75, 'trueno'],
  [rayos9[0], 'trueno'], [zarandea, 'rafaga'], [rayos9[1], 'boom'],
  [P10 + 0.05, 'lluvia'], [P10 + 0.5, 'burbujas', { dur: 1.6 }], [deRepente, 'whoosh'], [sol, 'brillo'], [aterriza, 'toc'],
  [dentro + 0.6, 'whoosh'], [posa, 'tic'], [centro, 'brillo'],
];
T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3], [P4, p4], [P5, p5], [P6, p6], [P7, p7], [P8, p8], [P9, p9], [P10, p10], [P11, p11]], { cartela: '1943', efectos, año: 1943 });
</script>
