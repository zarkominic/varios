<script type="module">
// HU-GANCHO (frases 1–3), 1943, cartela «1943». Once planos de 4,2–5,6 s, todos con acción, vida de fondo y gags:
// 1. Bryan Field al alba (la pista): una AT-6 de la patrulla del alba baja planeando y toca la pista en «1943», levanta
//    polvo y rueda frenando hacia los dos mecánicos que la esperan en el margen de la derecha (uno sorbe su café y la
//    señala con la taza cuando asoma; el otro la guía con los brazos arriba cuando toca tierra); a la izquierda, junto al
//    jeep de la base aparcado con los faros encendidos y el termo humeando en el capó (la avioneta pasa por encima de
//    él, alta, y redondea al final para tocar: nunca se monta en la cabeza del sargento), el navegante sorbe su café («July»)
//    y el sargento de guardia charla con él y bebe en la tapa del termo; cuando la avioneta toca tierra, el sargento la
//    saluda con un bocinazo y dos destellos de las largas y el navegante levanta la taza (se le escapan unas gotas); a lo
//    lejos, la segunda de la patrulla da la vuelta con el tren fuera y la luz de aterrizaje parpadeando;
// 2. el hangar 2 (corta en «at»): por la puerta de atrás entran los tres pilotos británicos y cruzan el hangar hasta la
//    plataforma («British pilots»); en «in training» el primero señala la avioneta aparcada y se ríen; mientras, un
//    mecánico entra por la izquierda empujando una rueda de repuesto, la mete en el hangar y la deja junto a la AT-6 que
//    revisan, y otro barre delante de la puerta verde (el viento se lleva el polvo); dentro, los mecánicos trabajan;
// 3. la plataforma (corta en «are teasing»): los británicos se ríen de la AT-6 junto a Duckworth, que frunce el ceño y
//    protesta con su tablilla («American instructor»); en «little plane» uno le pone la mano encima del morro (le llega a la
//    cintura) y la avioneta se bambolea; el navegante se esconde la sonrisa detrás de la taza (el reloj del decorado va
//    adelantado DT34: el mecánico pequeño del carro del bidón no pasa por delante de la puerta del hangar 2 en este plano);
// 4. más cerca (corta en «They say»; encuadre propio): la AT-6 grande (s 4) delante del aeródromo ampliado ×1,7 hacia
//    la derecha y desenfocado de verdad con bruma (la puerta del hangar 3, la torre, el depósito, la bandera, la manga y
//    la tormenta, con el relámpago de «weather» al fondo); a la derecha, un mecánico llega con la caja, la deja junto al
//    morro y mira, y pasa un jeep por delante de él; el británico, subido a la escalerilla de madera de los mecánicos junto al morro (le llega
//    a la altura del capó), se ríe y le da dos palmaditas con su mano levantada en «toy» (la avioneta bota); el pelirrojo
//    se parte de risa junto a la hélice; el tornillo del capó tiembla, salta en «never» (el británico da un respingo y se
//    tambalea en la escalerilla), bota en «survive» y en «real» y rueda hasta los pies de Duckworth, que ha llegado por
//    la izquierda con su tablilla y el ceño fruncido; en «weather» relampaguea la tormenta y él lo recoge y lo mira;
// 5. desde la esquina del hangar (corta en «The instructor»; cámara y decorado propios): a la izquierda, la pared de
//    tablas del hangar 2 en perspectiva (la ventana que refleja la tormenta, los cubos de incendios, el pictograma de no
//    fumar, el farol que se mece, la bajante, los bidones y la caja), la plataforma que se va hacia el campo con la fila
//    de AT-6 pequeñas, la arboleda, los postes y la manga, y la tormenta que llena el cielo (torres de bultos con luz,
//    jirones que corren, lluvia que cuelga, fucilazos, golondrinas que huyen). Duckworth sale de detrás de la esquina
//    mirando el tornillo, devuelve el saludo («Lieutenant Colonel») al mecánico que amarra la AT-6 en primer término,
//    sigue hasta el término medio y en «knows» mira la tormenta con los prismáticos; el jeep llega y aparca; relámpago
//    en «hurricane»: el navegante, junto a los bidones, da un respingo y se le escapa el café;
// 6. el mapa de papel (corta en «is bearing down»): el golfo entero, con la cámara que se acerca despacio a Texas;
//    el huracán, en espiral, cruza el golfo y se echa encima de la costa; el brazo de Duckworth (la mano canónica con su
//    manga plana alargada hasta el borde izquierdo, y su sombra) entra por la izquierda con el lápiz, toca Galveston (cae su chincheta) y en «at that very moment» traza
//    la raya de Bryan a la tormenta; en la esquina, la taza del navegante humea sobre el mapa;
// 7. la línea de vuelo a la altura de la cabina (corta en «So he bets»; cámara y decorado propios, de espaldas a los
//    hangares): la AT-6 de cerca (s 2,2), la fila de AT-6 aparcadas que se aleja, la pista lejana con el camión de
//    bomberos que patrulla, la manga, el carro de extintores delante y la tormenta encima. Duckworth levanta un vasito
//    con un «?» («a drink»), se dan la mano, señala la avioneta («that toy») y la tormenta («into the storm»:
//    relámpago); el navegante deja de reírse, va al ala y salta a su asiento, y en «and come back» Duckworth salta al
//    suyo: la cabina se los traga como un coche de feria, se cierra la cubierta y arranca el motor;
// 8. desde la cabecera de la pista (corta en «He takes off», el golpe de música; cámara propia): la pista en
//    perspectiva hasta la tormenta, con las bandas del umbral, el eje, las juntas, las marcas de goma y las balizas que
//    se alejan; la AT-6, de espaldas, corre levantando polvo, levanta la cola, despega en «navigator» y sube hacia la
//    base de la tormenta, cada vez más pequeña, hasta que la lluvia se la traga («into rain»); el frente de lluvia
//    avanza pista arriba hacia la cámara; a la izquierda, el mecánico de los calzos la despide, celebra el despegue,
//    se sujeta la gorra con la racha y sale corriendo cuando llega la lluvia; a la derecha, en «wind», la racha le
//    arranca la gorra a uno de los dos británicos;
// 9. dentro de la tormenta (corta en «as the navigator»): la avioneta pequeña entre muros de lluvia y rayos; una gaviota
//    pasa dando vueltas de campana en el viento; en «tossed about like a stick in a dog's mouth» la zarandean de lado a
//    lado como el perro sacude un palo;
// 10. de cerca, la cabina (corta tras «mouth»): la avioneta grande y, dentro, Duckworth y el navegante pequeños, con su
//    casco de cuero y las gafas, botando con los golpes; la taza del navegante flota con el café fuera y él la persigue
//    con la mano (gag); en «Suddenly» un último bandazo y Duckworth se vuelve a mirarla; en «the rain stops» la pared se
//    abre, y en «the sun comes out» entra el sol, el café vuelve a la taza y la taza aterriza suave en la tablilla;
// 11. el ojo (corta en «They are inside the eye»): el estadio de nubes al sol sobre el campo de Texas; la avioneta vuela
//    tranquila y la gaviota de la tormenta llega aleteando y se posa en su lomo, detrás de la cubierta, en «a hole of
//    calm», a descansar; en «center» ahueca las alas (gag).
import * as T from '/atomo/plato/escenas/hu-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hu-gancho');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const C = T.C;
const a = (f) => en('leyenda', f), b = (f) => en('apuesta', f), c = (f) => en('ojo', f);
// los cortes, en la palabra que toca (tiempos de cada palabra en build/largo/ep12/linea.json)
const P2 = a(0.2417), P3 = a(0.5279), P4 = a(0.7974), P5 = b(0), P6 = b(0.3203), P7 = b(0.6428), P8 = c(0), P9 = c(0.2501), P10 = c(0.502), P11 = c(0.7605);
// las palabras con las que va la acción
const julio = a(0.0888), anyo = a(0.1491);
const britanicos = a(0.4309), entrenando = a(0.4889);
const americano = a(0.5776), instructor = a(0.6072), pequena = a(0.7031), entrenan = a(0.7374);
const juguete = a(0.8686), nunca = a(0.9066), sobrevive = a(0.9208), real = a(0.9432), tiempo = a(0.968);
const teniente = b(0.092), joe = b(0.1394), duck = b(0.1616), sabe = b(0.2418), huracan = b(0.2936);
const echa = b(0.3528), galveston = b(0.4743), momento = b(0.5291);
const apuesta = b(0.6635), copa = b(0.7065), volar = b(0.7702), derecho = b(0.8399), tormenta = b(0.9005), volver = b(0.9464);
const despega = c(0.0203), navegante = c(0.055), lluvia = c(0.1029), viento = c(0.1508);
const zarandea = c(0.3717), perro = c(0.4543);
const deRepente = c(0.5842), para = c(0.6201), sol = c(0.6763), sale = c(0.7062);
const dentro = c(0.7725), hueco = c(0.8538), calma = c(0.8754), centro = c(0.9304);

const lin = (t, x, y) => Math.max(0, Math.min(1, (t - x) / (y - x)));
const suave = (u) => u * u * (3 - 2 * u);
const entre = (t, x, y) => t >= x && t < y;
const parp = (t, v = 7) => Math.sin(t * v) > 0;
const mezcla = (p, q, f) => { const r = p & 255, g = (p >> 8) & 255, bb = (p >> 16) & 255, r2 = q & 255, g2 = (q >> 8) & 255, b2 = (q >> 16) & 255;
  return (0xff000000 | (Math.round(bb + (b2 - bb) * f) << 16) | (Math.round(g + (g2 - g) * f) << 8) | Math.round(r + (r2 - r) * f)) >>> 0; };
const ruido = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const umbral = (x, y) => (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
const K = C.k;
const PAL = {
  k: K, W: hex('#f4f4f0'), S: hex('#c4c8d2'), B: hex('#3a6ac8'), c: hex('#5a3418'), C: hex('#8a5428'),
  m: hex('#9aa4b4'), M: hex('#d8dee8'), a: hex('#e0a030'), A: hex('#f4cc60'), v: hex('#d8ecf6'),
};
// un británico pelirrojo (el tercero), con la misma ropa
const PELIRROJO = { H: hex('#b8582a'), h: hex('#d8783a') };
const MANGA = { duck: '#6a6444', brit: '#6a7a96' };
const VIDRIOS = [hex('#34404e'), hex('#4a5a6e')];   // el cristal de la cubierta de la AT-6 (sin los reflejos)

// ── piezas locales ─────────────────────────────────────────────────────────────────────────────────────────────────
const dibuja = (g, x, y, dir = 1) => R.dibujo(g, Math.round(x), Math.round(y), dir, PAL);
// un sprite girado (vecino más cercano), centrado en (cx, cy)
const girado = (g, cx, cy, ang) => {
  const hh = g.length, w = g[0].length, ca = Math.cos(ang), sa = Math.sin(ang), r = Math.ceil(Math.hypot(w, hh) / 2) + 1;
  for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) {
    const u = Math.round(i * ca + j * sa + (w - 1) / 2), v = Math.round(-i * sa + j * ca + (hh - 1) / 2);
    if (u < 0 || v < 0 || u >= w || v >= hh) continue; const col = PAL[g[v][u]]; if (col == null) continue; R.pset(Math.round(cx) + i, Math.round(cy) + j, col);
  }
};
// la taza esmaltada del navegante: blanca con el borde azul y el asa a la derecha
const TAZA = ['kkkkk..', 'kBBBkkk', 'kWWWk.k', 'kWWSkkk', 'kWSSk..', '.kkk...'];
const taza = (x, y, dir = 1) => dibuja(TAZA, dir > 0 ? x : x - 6, y, dir);
// el vapor del café: tres hebras que suben y se deshacen
const vapor = (x, y, t) => { for (let k = 0; k < 3; k++) { const u = (t * 0.8 + k / 3) % 1, px = Math.round(x + k - 1 + Math.sin(u * 7 + k * 2) * 1.2), py = Math.round(y - u * 9); if (u < 0.85) R.pset(px, py, u < 0.45 ? hex('#eef0f4') : hex('#aeb4c2')); } };
// el vasito de la apuesta: whisky ambarino con su brillo
const VASO = ['k...k', 'kv..k', 'kAAAk', 'kaaak', '.kkk.'];
// el tornillo del capó (cabeza ranurada y la caña)
const TORNILLO = ['kkkk', 'kMmk', 'kkkk', '.kk.', '.km.', '.kk.'];
// el tornillo grande del capó (planos 4 y 5): cabeza ranurada y caña con rosca
const TORNILLO_G = ['.kkk.', 'kMmMk', '.kkk.', '.kmk.', '.kMk.', '.kmk.', '..k..'];
// los prismáticos
const PRISMA = ['kk.kk', 'kmkmk', 'kkkkk'];
// la tablilla de vuelo de Duckworth
const TABLILLA = ['kkkk', 'kWWk', 'kWWk', 'kWWk', 'kkkk'];
// la gorra de un británico que se lleva el viento
const GORRA = ['.kkkk.', 'kBBBBk', 'kkkkkk'];
const GORRA_PAL = { k: K, B: hex('#4e5c78') };
// la gaviota con contorno (para que se vea contra las nubes blancas): alas arriba, abajo y plegadas
const GAVIOTA = [
  ['k.......k', 'kmk...kmk', '.kWk.kWk.', '..kWWWkkk', '...kkk.A.'],
  ['...kkkkk.', '..kWWWkkk', '.kmWk.kA.', 'kmk......', 'k........'],
];
// la gaviota posada (mirando a la derecha): cabeza blanca con el pico amarillo, el ala gris y la punta de la cola negra
const POSADA = ['......kkk..', '.....kWWWk.', '.....kWkWAA', 'kk..kkWWWk.', 'kkkkmmmWWk.', '.kmmmmmWWk.', '..kkkkkkk..', '....A..A...'];
const gaviota = (x, y, pose, dir = 1) => R.dibujo(GAVIOTA[pose], Math.round(x) - 4, Math.round(y) - 2, dir, PAL);
// la gaviota que da vueltas de campana en el viento (girada ang radianes)
const gaviotaGira = (x, y, ang, pose) => girado(GAVIOTA[pose], x, y, ang);
// dónde lleva algo un personaje en la mano que cuelga, y en la levantada (con dedo: true), junto a la cara
const enMano = (x, s, dir) => [dir > 0 ? x + 12 : x - 4, s - 11];
const arriba = (x, s, dir) => [dir > 0 ? x + 15 : x - 1, s - 21];
// ── el brazo de Duckworth sobre el mapa (plano 6) ──────────────────────────────────────────────────────────────────
// la mano canónica (T.mano, 14 px) con su manga plana de 5 px, que se alarga igual de plana hasta el borde del cuadro
// (como manoLarga en hu-motor y en th-pruebas del 11), y la sombra del brazo en el papel: el brazo entra siempre desde
// fuera del cuadro
const PIEL = { L: hex('#fcd8b0'), S: hex('#f6c290'), s: hex('#d48a5a'), d: hex('#b8704a') };
const manoLarga = (x, y, dir, manga = MANGA.duck) => {
  x = Math.round(x); y = Math.round(y);
  const x0 = dir > 0 ? 0 : x - 6, x1 = dir > 0 ? x + 6 : 319;
  for (let X = x0; X <= x1; X++) for (let j = 1; j <= 5; j++) { const Y = y + 3 + j; if (umbral(X, Y) < 0.6) R.pset(X, Y, mezcla(R.pget(X, Y), hex('#3a3428'), 0.3)); }
  T.mano(R, x, y, dir, manga);
  const m = hex(manga), m0 = dir > 0 ? 0 : x + 43, m1 = dir > 0 ? x - 43 : 319;
  if (m1 >= m0) { R.rect(m0, y - 2, m1, y + 2, m); R.rect(m0, y - 3, m1, y - 3, K); R.rect(m0, y + 3, m1, y + 3, K); }
};

// ── los otros puntos de vista del aeródromo (planos 5, 7 y 8) ──────────────────────────────────────────────────────
// Tres cámaras que el decorado común no tiene: la esquina del hangar mirando al campo abierto (5), la línea de vuelo a la
// altura de la cabina (7) y la cabecera de la pista (8). Cada una pinta su capa fija una vez en un búfer (el cielo
// tramado, la tormenta de bolas con su luz, el horizonte y el suelo) y en cada fotograma la copia y pone encima lo que
// se mueve: jirones, lluvia, relámpagos, pájaros, viento, gente
const CAPAS = new Map();
const fijo = (clave, pinta) => { let b = CAPAS.get(clave); if (!b) { b = R.nuevo(); const prev = R.usar(b); R.recorte(null); pinta(); R.usar(prev); CAPAS.set(clave, b); } R.buf.set(b); };
// el cielo de verano tramado en siete azules, que se agrisa hacia la tormenta (de xs a la derecha) y hacia abajo
const AZUL = ['#3e6cb8', '#4c7ac0', '#5e8aca', '#749cd2', '#8cb0da', '#a6c2e0', '#bed0e2'].map(hex), GRIS_T = hex('#596078');
const cieloT = (hor, xs, dx = 1) => {
  const n = AZUL.length - 1;
  for (let y = 0; y < hor; y++) { const f = y / hor * n, i = Math.min(n - 1, Math.floor(f)), p = f - i;
    for (let x = 0; x < 320; x++) { let c = umbral(x, y) < p ? AZUL[i + 1] : AZUL[i];
      const g = Math.max(0, Math.min(1, dx * (x - xs) / 150)) * (0.3 + 0.5 * y / hor), q = Math.floor(g * 4 + umbral(x + 2, y + 1));
      if (q > 0) c = mezcla(c, GRIS_T, q * 0.2); R.pset(x, y, c); } }
  // cirros altos, finos y deshilachados
  for (let k = 0; k < 3; k++) { const y = 10 + k * 9 + Math.round(ruido(k, 1, 80) * 4), x0 = ruido(k, 2, 80) * 200, w = 26 + ruido(k, 3, 80) * 34;
    for (let i = 0; i < w; i++) { const x = Math.round(x0 + i); if (x > 272 && y < 48) continue; const e = Math.sin(i / w * Math.PI); if (umbral(x, y) > e * 0.9) continue; R.pset(x, y, mezcla(R.pget(x, y), hex('#ffffff'), 0.3)); if (i % 4 === 1 && e > 0.5) R.pset(x + 1, y - 1, mezcla(R.pget(x + 1, y - 1), hex('#ffffff'), 0.2)); } }
};
// una masa de nubes hecha de bolas [x, y, r]: cada píxel toma la luz de la bola que más asoma hacia la cámara (la luz
// viene de arriba a la izquierda), se oscurece hacia la base y el canto de cada bola se marca un poco; tonos de claro a
// oscuro, tramados entre vecinos. o.top / o.base: la cima y la base plana; o.osc: cuánto se oscurece abajo
const masa = (bolas, tonos, o = {}) => {
  let x0 = 319, x1 = 0, y0 = 179, y1 = 0;
  for (const [bx, by, r] of bolas) { x0 = Math.min(x0, bx - r); x1 = Math.max(x1, bx + r); y0 = Math.min(y0, by - r); y1 = Math.max(y1, by + r); }
  const top = o.top ?? y0, base = o.base ?? y1, n = tonos.length - 1;
  for (let y = Math.max(0, Math.floor(y0)); y <= Math.min(179, Math.ceil(y1), base); y++) for (let x = Math.max(0, Math.floor(x0)); x <= Math.min(319, Math.ceil(x1)); x++) {
    let mejor = -1, nx = 0, ny = 0, nz = 0;
    for (const [bx, by, r] of bolas) { const dx = x - bx, dy = y - by, d2 = dx * dx + dy * dy; if (d2 > r * r) continue; const z = Math.sqrt(r * r - d2); if (z > mejor) { mejor = z; nx = dx / r; ny = dy / r; nz = z / r; } }
    if (mejor < 0) continue;
    let lum = 0.5 + 0.5 * (-0.32 * nx - 0.78 * ny + 0.3 * nz) - (o.osc ?? 0.55) * (y - top) / Math.max(1, base - top);
    if (nz < 0.18 && ny > -0.3) lum -= 0.07;
    const v = Math.max(0, Math.min(n, (1 - lum) * n)), i = Math.floor(v);
    const f = v - i; R.pset(x, y, tonos[Math.min(n, f > 0.68 || (f > 0.32 && umbral(x, y) < 0.5) ? i + 1 : i)]);
  }
};
const TOR = ['#eef0f4', '#cdd2de', '#a6adc0', '#7e869e', '#5c637c', '#434960', '#30354a'].map(hex);
const CUM = ['#ffffff', '#eef3fa', '#d4e0ee', '#b2c4dc'].map(hex);
// las torres de la tormenta, de xs a xe, con la base plana en base y hasta alto px de altura (junto a Atom no suben a
// su esquina: las bolas que llegarían se quitan)
const torres = (xs, xe, base, alto, sem, nT = 5) => {
  const B = [];
  for (let k = 0; k < nT; k++) {
    const cx = xs + (k + 0.5) * (xe - xs) / nT + (ruido(k, 1, sem) - 0.5) * 22, w = 17 + 17 * ruido(k, 3, sem), lean = (ruido(k, 7, sem) - 0.5) * 0.35;
    let H = alto * (0.42 + 0.58 * ruido(k, 2, sem)); if (cx + w > 262) H = Math.min(H, base - 58);
    let y = base - w * 0.5, j = 0;
    while (y > base - H + w * 0.2) { const f = (base - y) / H, r = w * (1 - 0.45 * f) * (0.82 + 0.32 * ruido(k, j, sem + 4)), px = cx + lean * (base - y) + (ruido(k, j, sem + 1) - 0.5) * w * 0.5;
      B.push([px, y, r]);
      if (ruido(k, j, sem + 2) < 0.75) B.push([px - r * (0.65 + 0.3 * ruido(k, j, sem + 5)), y + r * 0.25, r * (0.38 + 0.25 * ruido(k, j, sem + 6))]);
      if (ruido(k, j, sem + 3) < 0.75) B.push([px + r * (0.65 + 0.3 * ruido(k, j, sem + 7)), y + r * 0.3, r * (0.38 + 0.25 * ruido(k, j, sem + 8))]);
      y -= r * (0.5 + 0.2 * ruido(k, j, sem + 9)); j++; }
