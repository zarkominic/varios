// FA-RECORD (frases 27–28), cartela «2025». Ocho planos:
// 1. los postes del estadio cubierto de Las Vegas: el balón del récord pasa dando vueltas entre los palos en la marca

// 2. el mapa del oeste: Denver tachada, la ruta hasta Las Vegas («in Las Vegas»), la chincheta, el estadio con cúpula y

// 5. inserto del carrito: la mano cepilla el balón gastado; desliza una caja con un balón nuevo y brillante («brand new»),

// la pierna que patea: muslo y espinilla del color del pantalón y la media, y la bota negra con su brillo

// la mano canónica (la de T.mano, 14 px) sin la manga recta, con su brazo en diagonal: sale del borde en (x0, y0) y llega

// el balón aplastado: T.balon con las volteretas «paradas» en el ángulo A y el largo Esc (0,62–1)

// un balón de patada pequeño con su franja blanca y su número (no hay «K»: no hay letras)

const P2 = en('record', 0.285), P3 = en('record', 0.576), P4 = en('kballs', 0.000), P5 = en('kballs', 0.260), P6 = en('kballs', 0.515), P7 = en('kballs', 0.688), P8 = en('kballs', 0.860);

  const pix = []; for (let j = y - 22; j <= y + 2; j++) for (let i = x - 12; i <= x + 12; i++) { const c = PB[j * 320 + i]; if (c) pix.push([i, j, c]); }
  for (const [i, j] of pix) for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) if (!PB[(j + dy) * 320 + i + dx]) R.pset(i + dx, j + dy, hex('#f6f0dc'));
  for (const [i, j, c] of pix) R.pset(i, j, c); };
// ── 1 · el balón del récord entre los postes (golpe en «record»)
const GOLPE = M('record', 1.5);
const p1 = (t) => {

  const bueno = t > GOLPE + 0.25;
  arbitro(88, 168, t, { dir: 1, brazos: bueno, sorpresa: t > GOLPE - 0.2 && t < GOLPE + 0.3 });
  arbitro(218, 168, t, { dir: -1, brazos: bueno });

  R.actor(EL.quarterback, 262, 174, t, { dir: -1, salto: bueno && t < GOLPE + 3 ? Math.round(Math.abs(Math.sin((t - GOLPE) * 6 + 1)) * 5) : 0, brazos: bueno, sonrisa: bueno });

// ── 2 · el mapa: Denver no, Las Vegas sí

const p2 = (t) => {

    R.rect(x - 1, y - 1, x + 23, y + 7, K); R.rect(x, y, x + 22, y + 6, hex('#5a6a7a')); for (let i = 1; i < 22; i += 3) R.rect(x + i, y + 1, x + i, y + 5, hex('#2a3442'));

    R.rect(x + 2, y + 2, x + 32, y + 36, hex('#6a5a4a')); R.rect(x - 1, y - 1, x + 30 + sw, y + 34, K); R.rect(x, y, x + 29 + sw, y + 33, hex('#f6f2e6')); R.rect(x, y, x + 29 + sw, y + 8, hex('#c83a3a'));

// ── 3 · desde arriba: 68 yardas, más de dos tercios del campo
