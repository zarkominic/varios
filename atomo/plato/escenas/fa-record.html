<script type="module">
// FA-RECORD (frases 27–28), cartela «2025». Ocho planos:
// 1. los postes del estadio cubierto de Las Vegas: el balón del récord pasa dando vueltas entre los palos en la marca

// 2. el mapa del oeste: Denver tachada, la ruta hasta Las Vegas («in Las Vegas»), la chincheta, el estadio con cúpula y

//    manos («break in»); ella vuelve a por otro; un compañero estira, otro cruza delante con la toalla y el utillero

// 6. inserto de la tableta en el banquillo: las barras de las patadas de más de 60 yardas crecen y la última se dispara

//    colocan, el árbitro pita en «August», el saque, el pateador arranca y patea («hit one») y el balón se aleja y pasa
//    por encima del larguero; el público hace la ola y levanta los brazos;
// 8. el videomarcador bajo la cúpula: la repetición, «69», que se queda gris con su asterisco, y «68» con la corona
//    («doesn't count toward the record»). Debajo, el público de delante en bustos con cara: se alegra con el 69, se
//    calma con el asterisco y con el 68 levanta brazos y bufandas y graba con el móvil; arriba, la membrana con

import * as T from '/atomo/plato/escenas/fa-comun.js';

const arrodillado = (def, x, suelo, t, o = {}) => {

  for (let i = 0; i <= 3; i++) { R.pset(X(i), suelo - 1, K); R.pset(X(i), suelo, K); }

// la pierna que patea: muslo y espinilla del color del pantalón y la media, y la bota negra con su brillo

// la mano canónica (la de T.mano, 14 px) sin la manga recta, con su brazo en diagonal: sale del borde en (x0, y0) y llega
// al puño en (x1, y1), de 7 px que se estrechan a 5, con luz, sombra, dos pliegues y el puño; dir −1: los dedos a la izquierda
const MANO = ['.....kkkkkk...', '....kSSSSSSkk.', 'kkkkSSSSSSSSSk', 'MMMkSSSSSSSSSk', 'MMMkSSSSSSSssk', 'MMMkSSSSSSssk.', 'kkkkkSSSSskk..', '.....kkkkk....'];

  if (o.sombra !== false) for (let i = 0; i <= n; i++) { const w = 4 - 1.4 * i / n; for (let s = -w; s <= w; s += 0.5) { const px = Math.round(x0 + ux * i + nx * s + 3), py = Math.round(y0 + uy * i + ny * s + 6); R.pset(px, py, mezcla(R.pget(px, py), K, 0.3)); } }

    for (let s = -w; s <= w; s += 0.5) { const px = Math.round(cx + nx * s), py = Math.round(cy + ny * s), puno = i > n - 6 && i <= n - 3;

};
// el balón aplastado: T.balon con las volteretas «paradas» en el ángulo A y el largo Esc (0,62–1)

const destello = (x, y, r, c = BL) => { for (let i = -r; i <= r; i++) { R.pset(x + i, y, c); R.pset(x, y + i, c); } R.pset(x - 1, y - 1, c); R.pset(x + 1, y + 1, c); R.pset(x + 1, y - 1, c); R.pset(x - 1, y + 1, c); };
// un balón de patada pequeño con su franja blanca y su número (no hay «K»: no hay letras)
const balonK = (x, y, t, n, o = {}) => { T.balon(R, x, y, t, { s: o.s ?? 1, ang: o.ang ?? 0 }); const s = o.s ?? 1;
  for (let j = -Math.round(3 * s); j <= Math.round(3 * s); j++) { R.pset(Math.round(x + 3 * s), y + j, BL); if (s > 1.5) R.pset(Math.round(x + 3 * s + 1), y + j, BLS); }

const P2 = en('record', 0.285), P3 = en('record', 0.576), P4 = en('kballs', 0.000), P5 = en('kballs', 0.260), P6 = en('kballs', 0.515), P7 = en('kballs', 0.688), P8 = en('kballs', 0.860);
// ── 1 · el balón del récord entre los postes (golpe en «record»)
const GOLPE = M('record', 1.5);
const p1 = (t) => {
  T.estadioPatada(R, t, { lugar: 'vegas', encuadre: 'postes', paloma: false });
  // los árbitros bajo los palos y los jugadores en la zona de anotación
  const bueno = t > GOLPE + 0.25;
  arbitro(88, 168, t, { dir: 1, brazos: bueno, sorpresa: t > GOLPE - 0.2 && t < GOLPE + 0.3 });
  arbitro(218, 168, t, { dir: -1, brazos: bueno });
  R.actor(EL.receptor, 30, 176, t, { dir: 1, salto: bueno && t < GOLPE + 3 ? Math.round(Math.abs(Math.sin((t - GOLPE) * 6)) * 5) : 0, brazos: bueno, sonrisa: bueno });
  R.actor(EL.quarterback, 262, 174, t, { dir: -1, salto: bueno && t < GOLPE + 3 ? Math.round(Math.abs(Math.sin((t - GOLPE) * 6 + 1)) * 5) : 0, brazos: bueno, sonrisa: bueno });
  R.actor(EL.liniero, 244, 178, t, { dir: -1, triste: bueno, sorpresa: !bueno && t > GOLPE - 0.4 });

  const u = lin(t, GOLPE - 0.2, GOLPE + 0.8);
  if (u > 0 && u < 0.92) { const x = lerp(140, 166, u), y = 200 - 170 * Math.pow(u, 0.27), s = lerp(3.4, 0.45, Math.sqrt(u)); T.balon(R, Math.round(x), Math.round(y), t, { s, volteretas: true }); }
  // la paloma del larguero (el gag): se agacha justo cuando pasa el balón y luego se le erizan las plumas
  const ag = tramo(t, GOLPE - 0.3, GOLPE - 0.05) - tramo(t, GOLPE + 1.6, GOLPE + 2.6);
  // (la del decorado se quita con paloma:false y se pinta aquí con T.g_paloma, que ya trae su filo oscuro y crema)
  T.g_paloma(R, 178, 93, t, ag, t > GOLPE + 2.7 ? 1 : -1);

  const e = tramo(t, GOLPE + 0.15, GOLPE + 0.45) - tramo(t, P2 - 1.0, P2 - 0.6); if (e > 0) R.numero('68', 160, Math.round(lerp(90, 82, e)), { tam: 16, centro: true });
};
// ── 2 · el mapa: Denver no, Las Vegas sí
const VEGAS = en('record', 0.303), DIA = en('record', 0.387);
const A0 = [-109, 38.3], A1 = [-110.6, 37.6];
const p2 = (t) => {
  const z = ease(tramo(t, P2 + 0.3, P2 + 1.3)), P = T.mapa(R, t, { zoom: lerp(2.6, 2.95, z), centro: [lerp(A0[0], A1[0], z), lerp(A0[1], A1[1], z)], rosa: false });

    R.rect(x + 2, y + 2, x + 32, y + 36, hex('#6a5a4a')); R.rect(x - 1, y - 1, x + 30 + sw, y + 34, K); R.rect(x, y, x + 29 + sw, y + 33, hex('#f6f2e6')); R.rect(x, y, x + 29 + sw, y + 8, hex('#c83a3a'));

// ── 3 · desde arriba: 68 yardas, más de dos tercios del campo
const PATEA = en('record', 0.725), S68 = en('record', 0.757), TERCIOS = en('record', 0.904);
// un jugador visto desde arriba: la sombra larga hacia abajo a la derecha (los focos del anillo), el casco y los hombros
const top = (x, y, c, cs, t, bob = 0) => { const X = Math.round(x), Y = Math.round(y - bob);
