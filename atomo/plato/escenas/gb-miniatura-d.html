<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ep49 · miniatura D</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// GB-MINIATURA-D · ep49, opción nueva: EL PILAR DE CERCA. El pilar central con su zorro, sus brazos y sus manos llena el
// cuadro a la luz rasante del alba; un cazador chibi al doble, a su pie, lo mira boquiabierto (la escala la da él).
// «11600 YEARS» en hueso. Lo cumple el vídeo: el gancho y el acto 2 enseñan este pilar.
import { crearRoma } from '/atomo/plato/kits/pixel-roma.js';
import { conChibi } from '/atomo/plato/kits/pixel-chibi.js';
import { hex } from '/atomo/plato/kits/pixel-retro.js';
import * as T from '/atomo/plato/escenas/gb-comun.js';
import { figura, grado, halo, desplazar, cifra } from '/atomo/plato/escenas/mini-chibi.js';
import { palabra, ancho } from '/atomo/plato/escenas/gb-mini-letras.js';
const R = conChibi(await crearRoma(document.getElementById('lienzo')));
const HUESO = hex('#f4f0e4'), SOMBRA = hex('#2a1a30');
const dibujar = (t) => {
  const o = { encuadre: 'construccion', camara: 'pilar' };
  T.recinto(R, t, o);
  desplazar(R, 48);
  halo(R, 208, 90, 70, 80, '#ffe0a0', 0.22);
  figura(R, T.GB.cazadorGB, 150, 178, t, { dir: 1, sorpresa: true }, 2);
  T.recintoDelante(R, t, o);
  grado(R, { cx: 190, cy: 100, tinte: '#060a14', f: 0.14, desde: 0.55, max: 0.7 });
  palabra(R, '11600', 12, 14, 5, HUESO, SOMBRA);
  palabra(R, 'YEARS', 12, 58, 5, HUESO, SOMBRA);
};
window.__frame = async (t) => { dibujar(t); R.presentar(); };
window.__listo = true;
</script>
</body>
</html>
