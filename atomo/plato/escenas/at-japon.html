  // los bosques y matas en tierra
  for (let k = 0; k < 400; k++) { const x = MX0 + Math.floor(ru(k, 1) * (MX1 - MX0)), y = MY0 + Math.floor(ru(k, 2) * (MY1 - MY0)); const c = R.pget(x, y); if (c === H('#d4c498') || c === H('#c8b88a')) { pset(x, y, H('#7a8a4a')); pset(x + 1, y, H('#6a7a3a')); pset(x, y - 1, H('#8a9a5a')); } }

  rect(288, 70, 290, 171, H('#2a2a2e')); R.poligono([[278, 70], [300, 70], [296, 56], [282, 56]], H('#e8d8a8')); linea(278, 70, 300, 70, H('#b8a878')); rect(282, 168, 296, 171, H('#2a2a2e'));
  for (let y = 71; y < 100; y++) for (let x = 276 - (y - 71) / 2; x < 302 + (y - 71) / 2; x++) if (ru(x, y) > 0.7) pset(Math.round(x), y, H('#7a8a6a'));
  rect(276, 120, 316, 171, T.C.k); rect(277, 121, 315, 170, H('#7a7e86')); for (const y of [124, 140, 156]) { rect(279, y, 313, y + 13, H('#8a8e96')); rect(292, y + 5, 300, y + 6, H('#3a3a40')); }
  rect(300, 104, 312, 120, T.C.k); rect(301, 105, 311, 119, H('#b8603a')); for (const [dx, dy] of [[-4, -10], [0, -14], [4, -9], [-2, -6], [3, -5]]) { R.disco(306 + dx, 104 + dy, 3, H('#3a7a3a')); R.pset(306 + dx, 103 + dy, H('#5aaa5a')); }
});
const nubeT = (cx, cy, t, luz) => { const c = luz ? ['#e8e8f0', '#c8c8d4', '#a0a0b0'] : ['#8a8a96', '#6a6a78', '#4a4a58']; for (let k = 0; k < 3; k++) for (const [dx, dy, r] of [[-12, 3, 6], [-4, -1, 8], [6, 0, 9], [15, 4, 6]]) R.disco(cx + dx, cy + dy + k * 1.5, r - k * 1.6, H(c[k])); };
// el océano vivo: olas a dos tonos, las rutas de barco que se dibujan de Japón a América, el carguero que cruza,
// el pesquero frente a Japón y la ballena que sopla junto a Hawái; todo solo en el agua y dentro del marco
const MW1 = MX1 - MX0 + 1;
const agua = (x, y) => x >= MX0 && x <= MX1 && y >= MY0 && y <= MY1 && MAR && MAR[(y - MY0) * MW1 + (x - MX0)] === 1;
const hondo = (x, y) => (agua(x, y) ? DIST[(y - MY0) * MW1 + (x - MX0)] : 0);

const bez = (p0, p1, p2, u) => [(1 - u) * (1 - u) * p0[0] + 2 * u * (1 - u) * p1[0] + u * u * p2[0], (1 - u) * (1 - u) * p0[1] + 2 * u * (1 - u) * p1[1] + u * u * p2[1]];
const RUTA1 = Array.from({ length: 161 }, (_, i) => bez([64, 72], [122, 30], [190, 66], i / 160));      // Tokio → San Francisco, por el norte
const RUTA2 = [...Array.from({ length: 81 }, (_, i) => bez([62, 76], [96, 98], [140, 103], i / 80)), ...Array.from({ length: 121 }, (_, i) => bez([144, 103], [200, 126], [244, 120], i / 120))];   // Tokio → Hawái → Panamá
const ruta = (pts, prog, t, c, paso) => { const n = Math.floor(pts.length * prog), m = Math.floor(t * 5); for (let i = 0; i < n; i++) { if ((i + m) % paso >= Math.ceil(paso / 2)) continue; const [x, y] = pts[i].map(Math.round); if (agua(x, y)) R.pset(x, y, H(c)); } };
const oceano = (t) => {
  if (!OLAS) { OLAS = []; for (let k = 0; OLAS.length < 90 && k < 3000; k++) { const x = MX0 + 4 + Math.floor(ru(k, 7) * (MX1 - MX0 - 8)), y = MY0 + 4 + Math.floor(ru(k, 8) * (MY1 - MY0 - 8)); if (hondo(x, y) > 4 && Math.hypot(x - 104, y - 138) > 19) OLAS.push([x, y, ru(k, 9) * 6.28]); } }

    for (const [dx, dy, c] of [[-2, 0, '#e4f2f8'], [-1, -1, '#e4f2f8'], [0, -1, '#f4fafc'], [1, 0, '#5a86a2'], [2, 1, '#5a86a2'], [3, 1, '#4e7a96']]) if (agua(ox + dx, y + dy)) R.pset(ox + dx, y + dy, H(c)); }

  { const c = (t * 0.45) % 1, bx = 166, by = 112;
    if (c < 0.55) { const s = Math.sin(c / 0.55 * Math.PI); const h = Math.round(s * 3);
      for (let dx = -5; dx <= 5; dx++) { const top = by - Math.round(Math.sqrt(Math.max(0, 1 - (dx / 5.5) ** 2)) * h); for (let y = top; y <= by; y++) R.pset(bx + dx, y, H(y === top ? '#5a6a7a' : '#2e3a48')); }

    } else if (c > 0.62 && c < 0.8) { const h = Math.round(Math.sin((c - 0.62) / 0.18 * Math.PI) * 4); R.linea(bx + 3, by, bx + 3, by - h, H('#2e3a48')); R.linea(bx + 1, by - h - 1, bx + 5, by - h - 1, H('#2e3a48')); R.pset(bx + 1, by - h - 2, H('#2e3a48')); R.pset(bx + 5, by - h - 2, H('#2e3a48')); R.pset(bx + 2, by + 1, H('#e4f2f8')); R.pset(bx + 4, by + 1, H('#e4f2f8')); }
  }

  const u = 0.1 + 0.5 * tramo(t, 0, P2), i = Math.floor(u * (RUTA1.length - 1)), [sx, sy] = RUTA1[i].map(Math.round), bob = Math.round(Math.sin(t * 3) * 0.6);
