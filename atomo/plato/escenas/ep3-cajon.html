{

    const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#e9c48a'); g.addColorStop(1, '#d08a5a'); x.fillStyle = g; x.fillRect(0, 0, w, h);
    x.fillStyle = '#f3dfb4'; x.beginPath(); x.arc(w * 0.66, h * 0.46, h * 0.13, 0, TAU); x.fill();

  const luz2 = K.brillo('#f5cd8a', 0.22, 900); luz2.position.set(XW + 30, FY + APLIQUE.y + 10, APLIQUE.z); decorado.add(luz2);

// la luna, fuera (solo se ve por encima de la pared al seguir la cinta)
const luna = K.crearLuna({ radio: 70 });

raiz.add(luna.g);

// ================================================================ la persona isométrica (HUMANO.md)

const LINEAS = {

    hombrosAncho: 0.25, caderasAncho: 0.19, brazoR: 0.029, anteR: 0.025, musloR: 0.046, piernaR: 0.035, pie: 0.15, fondo: 0.125 },

};
function crearPersona() {
  const g = new THREE.Group();          // en los pies; mira a +z local (de frente, rotation.y = π/4)
  const mJ = lam(PAL.jersey), mJD = lam(PAL.jerseyD), mP = lam(C.caqui), mPD = lam(C.caquiD), mS = lam(C.zapato), mSk = lam(PAL.skin, { emissive: '#3a2620' }), mH = lam(C.pelo), mHD = lam(C.peloD), mT = basic(C.tinta);

    const rod = new THREE.Group(); cad.add(rod);

    const zap = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mS); tob.add(zap);
    const punta = bola(mS, 0); tob.add(punta);
    return { s, cad, muslo, rod, pierna, tob, zap, punta };
  });
  // pelvis (pantalón) y torso (jersey)

  });
  // cabeza
  const cab = new THREE.Group(); g.add(cab);
  const craneo = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 7), mSk); cab.add(craneo);   // con polo abajo: la barbilla cae justo en su línea
  const pelo = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 7, 0, TAU, 0, Math.PI * 0.56), mH); cab.add(pelo);

    const r = R_MON;
    MON.forEach((c, j) => {
      const st = MONTONES[c.si];
      const enSuelo = new THREE.Vector3(st.c.x + c.jx, FY + G_MON * (c.i + 0.5), st.c.z + c.jz);
      let p = enSuelo, q = new THREE.Quaternion().setFromEuler(new THREE.Euler(c.inc, c.giro, c.inc * 0.7));
      if (enB) {
        // orden: de arriba abajo, primero el montón pequeño
        const orden = c.si === 0 ? (st.n - 1 - c.i) : MONTONES[0].n + (st.n - 1 - c.i);
        const t0 = TB_VUELA + orden * 0.062, vuelo = 0.36;
        const u = seg(t, t0, t0 + vuelo);
        if (u > 0) {
          const destL = cerebro.hueco(c.si, c.i);
          const dest = destL.applyMatrix4(cerebro.cajon.matrixWorld);
          const ctrl = enSuelo.clone().lerp(dest, 0.5).addScaledVector(Y, 260);
          const w = eio(u);
          p = enSuelo.clone().multiplyScalar((1 - w) ** 2).addScaledVector(ctrl, 2 * w * (1 - w)).addScaledVector(dest, w * w);
          const qd = new THREE.Quaternion(); cerebro.cajon.getWorldQuaternion(qd);
          const voltereta = new THREE.Quaternion().setFromAxisAngle(vR, Math.sin(Math.PI * w) * 2.6);
          q = q.slerp(qd, w).premultiply(voltereta);
        }
      }
      _m.compose(p, q, new THREE.Vector3(1, 1, 1));
      monedas.setMatrixAt(j, _m);
    });
    monedas.instanceMatrix.needsUpdate = true;
  }
  MONTONES.forEach((st, i) => {
    let a = enA ? 0 : 0.5;
    if (enB) a *= 1 - seg(t, TB_VUELA + (i ? MONTONES[0].n * 0.062 : 0), TB_VUELA + (i ? N_MON : MONTONES[0].n) * 0.062 + 0.2);
    sombrasMon[i].poner(st.c, a);
  });

  // el calendario: hoja 1 a la vista hasta la frase 2; once hojas arrancadas y la duodécima a medias
  let arriba = 0;
  if (t >= T_C) while (arriba < 11 && t >= tHoja(arriba)) arriba++;
  calendario.hojas.forEach((m, i) => {
    if (i === 11) { m.visible = arriba === 11; ponerMedia(m, t); return; }
    if (t < T_C) { m.visible = i === 0; ponerHoja(m, i, -1, 0); return; }
    m.visible = i <= arriba;
    ponerHoja(m, i, t, tHoja(i));
  });

  // la pila y la persona que crece con ella
  ponerPila(t);

  const ta = tQuieto(t);
  pres.actualizar(ta, t < QUIETO ? E.energia(t) : 0);
  plato.titilar(ta);
  K.cartela(plato, t, E.cartela);
  plato.render();
}

if (VISTA === 'guias') {
  // la persona sola, de frente y grande, para guias-humano.py
  const k = Number(q.get('k') ?? 1);
  for (const o of [decorado, cajaCinta, cinta.mesh, cinta.punta, monedas, cerebro.g, calendario.g, pila.g, luna.g]) o.visible = false;
  pres.atomo.g.visible = false;
  function guias() {
    // de frente (cámara ortográfica horizontal), para medir las proporciones del mundo sin la inclinación isométrica
    const H = k ? H_AD : H_NI;
    persona.poner(k, H, { cabeza: [0, 0] });
    persona.g.position.copy(PIES); persona.g.rotation.y = Math.PI / 4;
    const z = 764 / H, mid = PIES.clone().addScaledVector(Y, H / 2);
    plato.encuadre(mid, z);
    plato.camera.position.copy(mid).addScaledVector(vF, 6000); plato.camera.up.set(0, 1, 0); plato.camera.lookAt(mid);
    plato.camera.updateProjectionMatrix(); plato.camera.updateMatrixWorld();
    plato.render();
    window.__info = { centro: 960, suela: 540 + z * H / 2, coronilla: 540 - z * H / 2, H: z * H, k };
  }
  E.iniciar(guias, { paso: 0 });
} else {
  // Sin calentar a propósito: cualquier trabajo de GL antes de __listo espera al proceso de GPU compartido, y con otra
  // escena cargando a la vez la carga pasaba de 5 s a 45 s. El primer fotograma paga la compilación (≈ 2 s, una vez).
  E.iniciar(dibujar, { paso: 0 });
}
</script>
