// DO-VACIO (frases 39–40), sin cartela; año 2024. Cuatro planos:
// 1. otro rincón del Vacío (fondo local, cámara baja): el coche volcado grande en primer término a la izquierda, la pila
//    de chatarra a la derecha (nevera, chapa, tele con nieve, neumáticos, farol que parpadea, bidón con fuego) y la
//    cabeza coronada pequeña y lejos en la bruma; en «show up» Gambito salta desde la izquierda sobre la panza del coche
//    con sus cartas rosas; el perrito con capa sale de debajo del coche y le ladra a Deadpool (gag 5), que da un
//    respingo; Lobezno sonríe (corta en «Like Gambit»);
// 2. la mesa de cartas sobre un bidón (fondo local): la mano de Gambito abre las cartas, que brillan rosa en «Gambit»;
//    lanza una que gira y cae en el centro (el brazo, corto: hombro fuera de cuadro y unos 40 px de manga); en «cast of Doomsday» la carta se da la vuelta y es la máscara de Doom, que
//    brilla verde (corta en «And like»);
// 3. la fortaleza de restos: la Antorcha llega volando con su estela en «Human Torch», se posa en el arco y en
//    «Fantastic Four» lanza cuatro bolas de fuego que estallan una tras otra y las palomitas las cuentan con la manita
//    (1, 2, 3, 4); abajo, Deadpool aplaude, Gambito y Lobezno miran (corta en «The same actor»);
// 4. la pared de chapa (fondo local): la Antorcha junto al bidón de fuego; su sombra en la pared se convierte en
//    «Captain America» en la de un héroe con escudo y casco de alas; se mira la sombra, Deadpool la señala y en «joke»
//    las palomitas y Deadpool se parten de risa; Lobezno niega con la cabeza.
// Sonido (~50 % del tiempo con efectos): trueno con los relámpagos, ladridos, carta, estela de fuego,
//    cuatro pops de los fuegos y palmas (todo con recetas de NIVEL).
import * as T from '/atomo/plato/escenas/do-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('do-vacio');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const PZ = T.PIEZAS_DO, K = hex('#1a1014'), BLANCO = hex('#f6f2ea');
const hh = (a, b = 0) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
// recorrido por puntos [t, x, y]: devuelve { x, y, mv }
const ruta = (t, pts) => {
  if (t <= pts[0][0]) return { x: pts[0][1], y: pts[0][2], mv: false };
  for (let i = 0; i < pts.length - 1; i++) { const [t0, x0, y0] = pts[i], [t1, x1, y1] = pts[i + 1]; if (t < t1) { const u = (t - t0) / (t1 - t0); return { x: Math.round(lerp(x0, x1, u)), y: Math.round(lerp(y0, y1, u)), mv: x1 !== x0 || y1 !== y0 }; } }
  const l = pts[pts.length - 1]; return { x: l[1], y: l[2], mv: false };
};
const cache = new Map();
const fijo = (k, dibuja) => { let b = cache.get(k); if (!b) { b = R.nuevo(); const prev = R.usar(b); dibuja(); R.usar(prev); cache.set(k, b); } R.copiar(b); };
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255; return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
const tine = (x, y, c, a) => R.pset(x, y, mez(R.pget(x, y), c, a));
const TR = [[0.12, 0.62], [0.87, 0.37]];
const trama = (x, y, f) => f > TR[y & 1][x & 1];
// degradado tramado en bandas (cielos, paredes)
const banda = (x0, y0, x1, y1, cols) => { const n = cols.length - 1; for (let y = y0; y <= y1; y++) { const u = (y - y0) / Math.max(1, y1 - y0) * n, i = Math.min(n - 1, Math.floor(u)), f = u - i; for (let x = x0; x <= x1; x++) R.pset(x, y, trama(x, y, f) ? cols[i + 1] : cols[i]); } };

// nube de tres tonos y capas de nubes a varias velocidades: [y, ancho, velocidad, cuántas, [sombra, cuerpo, luz], semilla]
const nube3 = (cx, cy, w, c3) => { const B = [[0, 0, .32], [-.32, .06, .24], [.3, .05, .26], [-.1, -.12, .26], [.14, -.08, .22]]; for (const [dx, dy, r] of B) R.disco(cx + dx * w, cy + dy * w + 1, r * w, c3[0]); for (const [dx, dy, r] of B) R.disco(cx + dx * w, cy + dy * w - 1, r * w * 0.9, c3[1]); for (const [dx, dy, r] of B) R.disco(cx + dx * w - 1, cy + dy * w - 3, r * w * 0.55, c3[2]); };
const nubes = (t, capas, x0 = -40, x1 = 360) => { for (const [y, w, v, n, c3, sem] of capas) for (let k = 0; k < n; k++) { const x = x0 + ((hh(k, sem) * (x1 - x0) + t * v) % (x1 - x0)); nube3(x, y + hh(k, sem + 1) * 6, w * (0.8 + hh(k, sem + 2) * 0.4), c3); } };
const pajaros = (t, y, n = 3, v = 16, sem = 0, x0 = 0, x1 = 270) => { for (let k = 0; k < n; k++) { const x = Math.round(x0 + ((hh(k, sem) * (x1 - x0) + t * v) % (x1 - x0))), yy = Math.round(y + hh(k, sem + 2) * 10 + Math.sin(t * 1.7 + k) * 2), a = Math.sin(t * 9 + k * 2) > 0 ? 1 : 0; R.pset(x, yy, K); R.pset(x - 1, yy - a, K); R.pset(x + 1, yy - a, K); R.pset(x - 2, yy - 1 - a, K); R.pset(x + 2, yy - 1 - a, K); } };
// chispas que saltan de (cx, cy) en t0
const chispas = (cx, cy, t, t0, n, cols, v = 40, dur = 0.8, g = 30) => { const d = t - t0; if (d < 0 || d > dur) return; for (let k = 0; k < n; k++) { const a = hh(k, Math.round(t0 * 10)) * 6.283, s = v * (0.35 + hh(k + 7, Math.round(t0 * 10)) * 0.65), x = cx + Math.cos(a) * s * d, y = cy + Math.sin(a) * s * d + g * d * d; R.pset(x, y, cols[k % cols.length]); if (d < dur * 0.45) R.pset(x + 1, y, cols[(k + 1) % cols.length]); } };
// polvo que levanta un aterrizaje
const polvo = (cx, cy, t, t0, col = hex('#c8a07a'), colL = hex('#e8c8a0')) => { const d = t - t0; if (d < 0 || d > 0.9) return; for (let k = 0; k < 6; k++) { const s = k < 3 ? -1 : 1, r = 2 + d * 6 * (1 - d * 0.4), x = cx + s * (4 + (k % 3) * 5 + d * 18), y = cy - 2 - (k % 3) * 2 - d * 4; R.disco(x, y, r * (1 - d * 0.6), col); R.disco(x - 1, y - 1, r * 0.5 * (1 - d), colL); } };
// Xavier en su silla de ruedas (respaldo, el actor y las ruedas delante): (x, suelo) como R.actor
const xavier = (x, s, t, o = {}) => { const d = o.dir ?? 1, sx = d > 0 ? x + 2 : x + 12; PZ.silla(R, sx, s, { dir: d, parte: 'respaldo' }); const r = R.actor(EL.xavier, x, s - 8, t, o); PZ.silla(R, sx, s, { dir: d, parte: 'ruedas' }); return r; };
// el perrito con capa (gag 5): unos 18 × 14 px; o.dir, o.anda, o.ladra
const perrito = (x, s, t, o = {}) => {
  const d = o.dir ?? 1, X = (i) => Math.round(x + d * i), P = (i, j, c) => R.pset(X(i), s + j, c);
  const F = hex('#f0dcc0'), f = hex('#c8a07a'), RC = hex('#d0303a'), RS = hex('#8a1e28'), RL = hex('#f05a5a'), N = hex('#3a2430');
  const lad = o.ladra && Math.floor(t * 7) % 2 ? 1 : 0, paso = o.anda ? Math.floor(t * 12) % 2 : 0, y0 = -(o.anda ? paso : 0) - lad;
  for (const [i, ph] of [[1, 0], [3, 1], [8, 1], [10, 0]]) { const lev = o.anda && ph === paso ? 1 : 0; P(i, -1 - lev, N); P(i, -2 - lev, f); P(i, -3 - lev, f); }
  for (let i = 0; i <= 11; i++) for (let j = -8; j <= -3; j++) P(i, j + y0, i === 0 || i === 11 || j === -8 || j === -3 ? K : j === -4 ? f : F);
  const w = Math.sin(t * 16) > 0 ? 1 : 0; P(-1, -6 + y0, K); P(-2, -7 - w + y0, K); P(-3, -8 - w * 2 + y0, K); P(-2, -8 - w + y0, F);
  for (let i = 9; i <= 15; i++) for (let j = -13; j <= -6; j++) P(i, j + y0, i === 9 || i === 15 || j === -13 || j === -6 ? K : j === -7 ? f : F);
  for (let i = 15; i <= 18; i++) for (let j = -10; j <= -7 + lad; j++) P(i, j + y0, j === -10 || i === 18 || j === -7 + lad ? K : F);
  P(18, -10 + y0, N); P(19, -10 + y0, N); P(13, -11 + y0, K); P(12, -11 + y0, hex('#ffffff'));
  if (lad) { P(16, -7 + y0, hex('#e86a7a')); P(17, -7 + y0, hex('#e86a7a')); for (const [i, j] of [[21, -13], [22, -14], [21, -9], [22, -8], [22, -11], [23, -11]]) P(i, j, K); }
  P(10, -14 + y0, K); P(11, -15 + y0 + lad, K); P(12, -14 + y0, K); P(11, -14 + y0, f); P(13, -14 + y0, K); P(14, -15 + y0 + lad, K); P(15, -14 + y0, K); P(14, -14 + y0, f);
  const ola = Math.round(Math.sin(t * 12) * 1.5);
  R.poligono([[X(10), s - 9 + y0], [X(8), s - 9 + y0], [X(-4), s - 5 + y0 + ola], [X(-2), s - 2 + y0 + ola], [X(4), s - 4 + y0], [X(9), s - 6 + y0]], RC);
  R.linea(X(10), s - 9 + y0, X(-4), s - 5 + y0 + ola, RS); R.linea(X(-4), s - 5 + y0 + ola, X(-2), s - 2 + y0 + ola, RS); R.linea(X(8), s - 8 + y0, X(2), s - 6 + y0, RL);
  P(10, -9 + y0, hex('#e8b830')); P(9, -9 + y0, hex('#e8b830'));
};

const a = (f) => en('gambito', f), b = (f) => en('antorcha', f);
const P2 = a(0.502), P3 = b(0), P4 = b(0.573);
const APARECEN = a(0.215), NUNCA = a(0.31), GAMBIT = a(0.515), TATUM = a(0.706), TAMBIEN = a(0.826), DOOMS = a(0.921);
const TORCH = b(0.042), CUATRO = b(0.24), EVANS = b(0.449), CAPI = b(0.662), BROMA = b(0.827), NUNCAV = b(0.941);

// 1. otro rincón del vertedero, con la cámara baja junto al coche volcado (fondo local, ya no el de la cabeza: la
//    cabeza queda lejos, pequeña en la bruma): Gambito salta sobre el coche; el perrito sale de debajo y ladra
const CIE = ['#1e1228', '#2a1630', '#3a1c32', '#4e2234', '#682a36', '#883a3a', '#a84e3e', '#c86a46'].map(hex);
const ARE = ['#5a2a1e', '#7a3a24', '#9a5030', '#b8663a', '#cc7a46', '#de9258', '#eeaa6c'].map(hex);
const PIE = ['#2e2228', '#4a3a3e', '#665250', '#846c66', '#a48a7e', '#c4a898', '#dcc4b0'].map(hex);
const CO = { c: hex('#4a9a92'), s: hex('#2e6a68'), l: hex('#86c4b6'), ox: hex('#8a4424'), oxL: hex('#b8683a'), cr: hex('#c8c8cc'), crS: hex('#7a7a84'), go: hex('#262228'), goL: hex('#4a4248'), me: hex('#3a3238') };
const LEJ = { c: hex('#5a2e36'), l: hex('#78403e'), s: hex('#44222e'), v: hex('#9a5446'), br: hex('#8a4a42') };
const h3 = (x, y, s) => hh(x + s * 13.13, y - s * 7.31);
const rampa = (cols, v, x, y) => { const n = cols.length - 1, u = Math.max(0, Math.min(0.999, v)) * n, i = Math.floor(u); return trama(x, y, u - i) ? cols[Math.min(n, i + 1)] : cols[i]; };
const HOR = 80;
// el coche de los cincuenta volcado, grande (cx, base = suelo, s = escala): cabina abajo, ruedas arriba
const coche = (cx, base, s) => {
  const S = (v) => Math.round(v * s), X = (v) => cx + S(v), Y = (v) => base - S(v);
  for (let j = 0; j < S(4); j++) R.rect(X(-38) - j, base - j, X(26), base - j, j < 3 ? ARE[1] : ARE[2]);
  R.poligono([[X(-16), Y(2)], [X(16), Y(2)], [X(20), Y(11)], [X(-20), Y(11)]], K);
  R.poligono([[X(-15), Y(3)], [X(15), Y(3)], [X(18), Y(10)], [X(-18), Y(10)]], (x, y) => { const lo = x < X(-1) ? X(-17) : X(1), w = x - lo; return w < S(2) ? CO.s : (w + y) % 7 === 0 ? CO.l : h3(x, y, 830) < 0.2 ? hex('#3a4a5a') : hex('#1e2830'); });
  R.rect(X(-1), Y(10), X(1), Y(3), CO.s);
  for (let k = 0; k < 7; k++) { const x = X(-14) + Math.round(h3(k, 1, 834) * S(28)), y = Y(4) + Math.round(h3(k, 2, 834) * S(5)); R.pset(x, y, hex('#a8c0c8')); R.pset(x + 1, y + 1, hex('#6a8090')); }   // cristales rotos
  R.poligono([[X(-30), Y(10)], [X(30), Y(10)], [X(32), Y(16)], [X(30), Y(23)], [X(-28), Y(23)], [X(-32), Y(17)]], K);
  R.poligono([[X(-29), Y(11)], [X(29), Y(11)], [X(31), Y(16)], [X(29), Y(22)], [X(-27), Y(22)], [X(-31), Y(17)]], (x, y) => {
    const v = (Y(11) - y) / S(11); let c = v > 0.78 ? CO.l : v < 0.25 ? CO.s : CO.c;
    if (h3(x >> 1, y >> 1, 831) < 0.16 || h3(x >> 2, y >> 2, 832) < 0.12) c = h3(x, y, 833) < 0.5 ? CO.ox : CO.oxL;
    if ((x - X(-29)) % 23 === 0 && v > 0.2) c = CO.s; return c; });
  R.rect(X(-30), Y(17), X(30), Y(17), CO.cr); R.rect(X(-30), Y(16), X(30), Y(16), CO.crS);
  R.rect(X(-33), Y(14), X(-31), Y(19), CO.cr); R.rect(X(31), Y(13), X(33), Y(19), CO.cr); R.rect(X(-33), Y(14), X(-31), Y(14), hex('#ffffff'));
  R.rect(X(31), Y(20), X(32), Y(21), hex('#e8604a')); R.rect(X(-32), Y(20), X(-31), Y(21), hex('#f0e0a0'));
  for (const ax of [-8, 8]) { R.disco(X(ax), Y(13), 2, K); R.pset(X(ax), Y(13), CO.cr); }   // abolladuras con remache
  R.rect(X(-26), Y(26), X(26), Y(23), CO.go); R.rect(X(-26), Y(26), X(26), Y(26), CO.goL);
  for (let x = X(-24); x < X(24); x += 5) R.pset(x, Y(24), CO.ox);
  R.linea(X(-22), Y(25), X(24), Y(25), CO.me); R.rect(X(24), Y(25), X(34), Y(25), hex('#5a5258')); R.pset(X(34), Y(25), K);
  for (const wx of [-19, 19]) { const x = X(wx), y = Y(28); R.disco(x, y, S(7) + 1, K); R.disco(x, y, S(7), CO.go); R.disco(x, y, S(4), CO.crS); R.disco(x - 1, y - 1, S(3), CO.cr); R.pset(x - S(2), y - S(2), hex('#ffffff'));
    for (let a = 0; a < 6.28; a += 0.35) R.pset(Math.round(x + Math.cos(a) * S(5.8)), Math.round(y + Math.sin(a) * S(5.8)), CO.goL);
    for (let a = 0.2; a < 6.28; a += 0.7) R.pset(Math.round(x + Math.cos(a) * S(6.6)), Math.round(y + Math.sin(a) * S(6.6)), hex('#3a3438')); }
};
const neum = (cx, cy, rx, ry) => { for (let j = -ry; j <= ry; j++) for (let i = -rx; i <= rx; i++) { const q = (i / rx) ** 2 + (j / ry) ** 2; if (q > 1) continue; const qi = (i / (rx * 0.5)) ** 2 + (j / (ry * 0.45)) ** 2; R.pset(cx + i, cy + j, q > 0.85 ? K : qi < 1 ? (j < 0 ? hex('#140c10') : hex('#2a2024')) : j < -ry * 0.4 ? CO.goL : (i + j * 3) % 4 === 0 ? hex('#1a1418') : CO.go); } };
const fondoRincon = () => {
  // el cielo de tormenta, con el resplandor a la derecha y vetas
  for (let y = 0; y < HOR; y++) for (let x = 0; x < 320; x++) { const u = y / HOR, glow = Math.exp(-(((x - 200) / 100) ** 2)) * u * u * u * 0.18, rem = Math.sin(x * 0.045 + y * 0.11) * Math.sin(x * 0.013 - y * 0.05) * 0.05; R.pset(x, y, rampa(CIE, u * 0.88 + glow + rem, x, y)); }
  // lejos, en la bruma: el rascacielos torcido, la noria medio enterrada y la cabeza coronada, pequeña
  R.poligono([[18, HOR], [34, HOR - 34], [46, HOR - 31], [36, HOR]], LEJ.c); R.linea(34, HOR - 34, 46, HOR - 31, LEJ.v); R.linea(46, HOR - 31, 36, HOR, LEJ.s);
  for (let y = HOR - 28; y < HOR - 2; y += 4) for (let k = 0; k < 3; k++) { const x = Math.round(31 + k * 3 - (y - HOR + 28) * 0.42); if (h3(k, y, 840) > 0.3) R.pset(x, y, h3(k, y, 841) > 0.85 ? hex('#c8784a') : LEJ.s); }
  for (let r = 18; r >= 17; r--) R.anillo(112, HOR + 4, r, LEJ.s); for (let k = 0; k < 10; k++) { const a = k * 0.628; R.linea(112, HOR + 4, 112 + Math.cos(a) * 17, HOR + 4 + Math.sin(a) * 17, LEJ.c); const cx2 = Math.round(112 + Math.cos(a) * 18), cy2 = Math.round(HOR + 4 + Math.sin(a) * 18); if (cy2 < HOR) R.rect(cx2 - 1, cy2, cx2 + 1, cy2 + 2, LEJ.l); }
  { const hx = 214, hy = HOR - 6; for (let j = -12; j <= 10; j++) for (let i = -15; i <= 15; i++) { const q = (i / 15) ** 2 + (j / 12) ** 2; if (q < 1) R.pset(hx + i, hy + j, q > 0.86 ? LEJ.s : rampa([LEJ.s, LEJ.c, LEJ.l, LEJ.v], 0.4 + (i - j) / 30, hx + i, hy + j)); }
    for (let k = 0; k < 5; k++) { const x = hx - 10 + k * 5; R.poligono([[x - 2, hy - 10 + Math.abs(k - 2)], [x + 2, hy - 10 + Math.abs(k - 2)], [x + 1, hy - 17 + Math.abs(k - 2)]], k % 2 ? LEJ.l : LEJ.v); }
    R.linea(hx - 8, hy - 1, hx - 4, hy - 2, LEJ.s); R.linea(hx + 2, hy - 2, hx + 6, hy - 1, LEJ.s); R.linea(hx - 1, hy, hx - 2, hy + 4, LEJ.s); R.linea(hx + 6, hy - 9, hx + 3, hy - 3, LEJ.s); }
  // la línea de dunas lejanas que entierra los restos
  for (let x = 0; x < 320; x++) { const yt = HOR - 4 - Math.round(Math.sin(x * 0.03) * 2 + Math.sin(x * 0.011 + 1) * 3); for (let y = yt; y < HOR + 2; y++) R.pset(x, y, y === yt ? LEJ.v : trama(x, y, (y - yt) / 8) ? LEJ.br : LEJ.l); }
  // la arena: dunas con su ladera de luz, rizos que se marcan cerca y guijarros
  for (let y = HOR + 2; y < 180; y++) { const u = (y - HOR) / (180 - HOR); for (let x = 0; x < 320; x++) {
    const fa = x * 0.021 + u * 9 + 1.7 + Math.sin(x * 0.007 + 1.7) * 2.2; let v = 0.36 + u * 0.32 + Math.cos(fa) * 0.16 + Math.sin(fa) * 0.04;
    if (u < 0.12) v = v * (u / 0.12) + 0.3 * (1 - u / 0.12);
    const riz = Math.sin(x * (0.18 + u * 0.22) + y * (0.9 + u * 0.6) + Math.sin(x * 0.05 + y * 0.13) * 3); if (u > 0.08 && riz > 0.9 - u * 0.05) v -= 0.17; else if (u > 0.08 && riz < -0.94) v += 0.08;
    const q = h3(x, y, 812); if (q < 0.025 * u) v -= 0.3; else if (q > 1 - 0.02 * u) v += 0.14; R.pset(x, y, rampa(ARE, v, x, y)); } }

// 4. la pared de chapa y la sombra con escudo
const CONT = [[0, 112, '#a84a32', '#8a3a26', '#c86a4a'], [112, 228, '#2e5a8a', '#1e4270', '#4a7ab0'], [228, 320, '#3a7a4a', '#2a5a36', '#5a9a62']];

// la sombra en la pared: oscurece lo que haya; c = Capitán (escudo y casco de alas)
const sombra = (x, base, s, cap, t) => {
  const M = new Set();
  const D = (x0, y0, x1, y1) => { for (let y = Math.round(y0); y <= Math.round(y1); y++) for (let xx = Math.round(x0); xx <= Math.round(x1); xx++) if (y < 146) M.add(y * 320 + xx); };

const p4 = (t) => {

  const rie = t > BROMA;

  R.actor(EL.lobezno, 270, 168, t, { dir: Math.floor(t * 3) % 2 && rie ? 1 : -1, enfado: true, garras: false });

// principio, el aterrizaje de Gambito, los dos ladridos del perrito, la carta que cae y se da la vuelta, la llegada y
// el posado de la Antorcha, los cuatro fuegos (un pop por estallido) y las palmas de Deadpool
const efectos = [[0.05, 'trueno'], [APARECEN - 0.3, 'whoosh'], [APARECEN, 'golpecito'],
  [NUNCA + 0.25, 'guau'], [NUNCA + 0.45, 'boing'], [NUNCA + 0.7, 'guau'],

  [CAPI, 'boing'], [BROMA, 'palmada']];
T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3], [P4, p4]], { efectos, año: 2024 });
