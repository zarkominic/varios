<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hola · ep31</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// GT-HOLA (frase 3), sin cartela. Un plano: el estudio de Atom de día; el coche de policía de juguete sigue dando
// vueltas por la mesa con las luces encendidas. Atom, todavía resoplando de la persecución, salta a saludar en «I'm
// Atom»; en «explain the things» gira con chispas; en «wondered about» salen tres «?» sobre la mesa; en «Let's find
// out» el coche frena con un pitido y Atom sale disparado hacia la ventana.
import * as T from '/atomo/plato/escenas/gt-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('gt-hola');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const K = hex('#17151d'), BL = hex('#f6f2ea'), PZ = T.PIEZAS_GT;
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const b4 = (x, y) => (B4[((y | 0) & 3) * 4 + ((x | 0) & 3)] + 0.5) / 16;
const pal = (o) => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, hex(v)]));
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
// degradado tramado entre varios colores (f da 0–1 en cada punto; por omisión, de arriba abajo)
const grad = (x0, y0, x1, y1, cols, f) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const u = f ? f(x, y) : (y - y0) / Math.max(1, y1 - y0); R.pset(x, y, cols[Math.max(0, Math.min(cols.length - 1, Math.floor(u * (cols.length - 1) + b4(x, y))))]); } };
// luz: mezcla cada punto con col en la proporción que da f
const luz = (x0, y0, x1, y1, col, f) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const a = f(x, y); if (a > 0) R.pset(x, y, mez(R.pget(x, y), col, Math.min(1, a))); } };
// lo fijo de un plano, pintado una vez en un búfer
const FIJOS = {};
const fijo = (k, fn) => { if (!FIJOS[k]) { const b = R.nuevo(), prev = R.usar(b); fn(); R.usar(prev); FIJOS[k] = b; } R.copiar(FIJOS[k]); };
// una nube de tres tonos (centro x, base y, ancho w)
const nube = (x, y, w, c) => { const hg = Math.max(3, Math.round(w / 4)); for (let j = 0; j <= hg; j++) for (let i = -w / 2; i <= w / 2; i++) { const e = (i / (w / 2)) ** 2 + ((j - hg) / hg) ** 2 * (Math.abs(i) < w / 4 ? 0.55 : 1.4); if (e <= 1) R.pset(Math.round(x + i), Math.round(y + j - hg), j > hg * 0.7 ? c[2] : (j < hg * 0.35 && i < 0) ? c[0] : c[1]); } };
// la lluvia en diagonal dentro de un rectángulo (con recorte)
const lluvia = (x0, y0, x1, y1, t, n, col, v = 150) => { R.recorte([x0, y0, x1, y1]); for (let k = 0; k < n; k++) { const x = x0 + ((hh(k, 1, 31) * (x1 - x0 + 40) + t * v * 0.25) % (x1 - x0 + 40)) - 20, y = y0 + ((hh(k, 2, 31) * (y1 - y0) + t * v) % (y1 - y0 + 1)); R.linea(Math.round(x), Math.round(y), Math.round(x - 2), Math.round(y + 5), col); } R.recorte(null); };
// el paraguas abierto que se sostiene con la mano en (mx, my)
const paraguas = (mx, my, cols, t) => {
  mx = Math.round(mx); my = Math.round(my); const cy = my - 12;
  R.linea(mx, my, mx, cy, K); R.pset(mx + 1, my, K); R.pset(mx + 1, my - 1, K);
  for (let j = -9; j <= 0; j++) for (let i = -12; i <= 12; i++) { const e = (i / 12) ** 2 + (j / 9) ** 2; if (e > 1) continue; const seg = Math.floor((i + 12) / 5) % 2; R.pset(mx + i, cy + j, e > 0.8 ? K : j < -5 && i < -2 && i > -8 ? mez(cols[seg], BL, 0.35) : cols[seg]); }
  for (let i = -12; i <= 12; i++) if (((i + 12) % 5) !== 0) R.pset(mx + i, cy + 1, K);
  R.pset(mx, cy - 10, K); R.pset(mx, cy - 11, K);
  for (const e of [-12, 12]) { const u = (t * 2.2 + (e > 0 ? 0.5 : 0)) % 1; R.pset(mx + e, cy + 2 + Math.round(u * 9), hex('#c8d8ec')); }
};

R.companero = () => {};   // Atom está en el plano: la esquina queda tranquila
const h1 = (f) => en('hola', f);
const atom = h1(0.035), explica = h1(0.218), pregunta = h1(0.541), vamos = h1(0.8);
const p1 = (t) => {
  const d = Math.min(0.6, Math.max(0, t - vamos)), A = t < vamos ? 1.5 * t : 1.5 * vamos + 1.5 * (d - d * d / 1.2);
  const o = { encuadre: 'estudio', coche: 'persigue', vueltas: t > 0.01 ? A / t : 1.5 };
  const geo = T.hoy(R, t, o);
  // las luces del coche de juguete, que destellan rojo y azul sobre la mesa
  { const [cx, cy] = [geo.coche.x, geo.coche.y - 4], col = Math.floor(t * 6) % 2 ? hex('#ff4a4a') : hex('#4a7aff'); luz(cx - 20, cy - 14, cx + 20, cy + 10, col, (x, y) => { const d = Math.hypot((x - cx) / 20, (y - cy) / 12); return d < 1 && b4(x, y) < 1 - d ? 0.5 : 0; }); R.pset(cx - 1, cy - 4, hex('#ffffff')); }
  // los «?» de «wondered about», sobre la mesa
  if (t > pregunta - 0.1 && t < vamos + 0.3) for (let i = 0; i < 3; i++) { if (t < pregunta - 0.1 + i * 0.22) continue; R.icono('?', 138 + i * 18, 98 - (i & 1) * 8 - Math.round(Math.sin(t * 4 + i) * 2), hex('#ffe890'), K, 2); }
  T.hoyDelante(R, t, o);
  // Atom: jadea al principio, salta en «Atom», gira en «explain» y en «Let's find out» vuela a la ventana
  const sal = t > atom && t < explica + 0.2 ? Math.round(Math.abs(Math.sin((t - atom) * Math.PI * 2.2)) * 12) : 0;
  const v = tramo(t, vamos + 0.15, E.duracion - 0.1), e = v * v;
  const jadeo = t < atom ? Math.round(Math.sin(t * 16) * 1.5) : 0;
  const ax = Math.round(lerp(262, 50, e)), ay = Math.round(lerp(114, 52, e)) - sal + Math.round(Math.sin(t * 2.6) * 2) + jadeo;
  for (let j = -20; j <= 20; j++) for (let i = -20; i <= 20; i++) { const g = 1 - Math.hypot(i, j) / 19; if (g > 0.3 && ((i + j) & 1 || g > 0.6)) R.pset(ax + i, ay + j, g > 0.7 ? R.PAL.GLOW[1] : R.PAL.GLOW[0]); }
  if (sal > 0 || (t > explica && t < explica + 0.9)) for (let k = 0; k < 10; k++) { const an = k * Math.PI / 5 + t * 4, rr = 19 + Math.sin(t * 9) * 2; R.pset(Math.round(ax + Math.cos(an) * rr), Math.round(ay + Math.sin(an) * rr), hex('#c8f0ff')); }
  if (t < atom) for (const s of [-1, 1]) { const u = (t * 2.5 + (s > 0 ? 0.5 : 0)) % 1; R.pset(Math.round(ax + s * (16 + u * 5)), Math.round(ay - 10 - u * 4), hex('#8ad0ff')); R.pset(Math.round(ax + s * (16 + u * 5)), Math.round(ay - 9 - u * 4), hex('#8ad0ff')); }
  R.atomo(ax, ay, t, { r: Math.round(lerp(13, 9, e)) + (sal > 0 ? 1 : 0), orbita: R.PAL.ATOM[7], energia: sal > 0 || v > 0 ? 0.75 : 0.35, vel: t > explica && t < explica + 0.9 ? 3 : 1 });
  // la estela al salir disparado
  if (v > 0 && v < 1) for (let k = 1; k <= 6; k++) { const u = Math.max(0, v - k * 0.04), ee = u * u; R.pset(Math.round(lerp(262, 50, ee)), Math.round(lerp(114, 52, ee)), hex('#c8f0ff')); }
};
const efectos = [[atom + 0.05, 'pop'], [explica + 0.1, 'brillo'], [pregunta + 0.05, 'boing'], [vamos, 'claxon'], [vamos + 0.2, 'whoosh']];
T.rodar(E, R, [[0, p1]], { efectos, año: 2026 });
</script>
</body>
</html>
