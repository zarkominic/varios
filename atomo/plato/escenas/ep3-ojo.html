<script type="module">

//  0        el último fotograma de ep3-hola, igual: pintarFinalHola(...) del kit del ojo y Atom quieto en su sitio.

//           franja, un destello cálido, y dentro, entre los párpados enormes y desenfocados, un espacio oscuro con una

//           para en el centro y sigue flotando cada vez menos mientras el ojo se funde en un cielo estrellado (termina_con:
//           FIN_OJO del kit de instrumentos; el último medio segundo es pintarFinOjo(...) más Atom quieto).
// Coste: cámara del plató fija; lo quieto son fotos hechas al cargar (las del final de ep3-hola, el ojo entero, el
// párpado de cerca abierto y cerrado, las franjas, el cielo y el final). En cada fotograma se dibujan Atom (en su pasada)
// y lo que se mueve en 3D (como mucho dos cosas de la franja, el teléfono o la banda de los párpados). El microscopio y el
// anillo son fotos hechas en fotogramas baratos poco antes de hacer falta (PREPARAR) y el telescopio, la foto del final
// (la de pintarFinOjo): los tres pasan en 2D. Los planos muy desenfocados se pintan a media resolución (pegarB).
import * as THREE from 'three';

const E = await escena('ep3-ojo', 'ep03');
const __c0 = performance.now(); window.__carga = {};
const cargaT = (k) => { window.__carga[k] = Math.round(performance.now() - __c0); };
const M = (k) => E.marca(k);
const m = {
  franja: M('franja'), franjaFin: M('franja_fin'), rinden: M('serinden'), rindenFin: M('serinden_fin'),

  entra0: m.franja - 0.2, entra1: m.franja + 1.0,

// ---------------------------------------------------------------- el plató
const UO = uniformesOjo(), UI = uniformesInstrumentos();
// (el ojo, la franja y la cosa en los mismos índices que en ep3-hola: las huellas y el hervor de sus fotos salen iguales)
const I = { PELO: 0, LUNA: 1, OJO: 2, FR: 3, COSA: 4, COSA2: 5, INS: 6, INS2: 7 };
const P = await crearPlato({

const en = (sx, sy, z) => P.punto(sx, sy, z);

// lienzo 2D encima del de WebGL (se compone todo aquí; viñeta y grano al final)
const cont = document.getElementById('escena');
const lienzoGL = P.renderer.domElement;
const capa = document.createElement('canvas');

cont.appendChild(capa);

function pegarGL(gx = g) { gx.save(); gx.setTransform(1, 0, 0, 1, 0, 0); gx.drawImage(lienzoGL, 0, 0); gx.restore(); }
// pega una foto (del tamaño del lienzo) escalada z veces: el punto src de la foto queda en dst (px de diseño)

  gx.drawImage(f, 0, 0, W, H);

}

// (coste) pegar con desenfoque bl (px de diseño) y brillo: si el desenfoque es grande, se pinta a media resolución (el
// desenfoque esconde la diferencia y el filtro cuesta la cuarta parte) y se amplía al pegarlo

// ---------------------------------------------------------------- Atom (quieto en su sitio de presentador)
const A_Z = 1.0, ATOM = [HOLA.ATOM.x, HOLA.ATOM.y];
const A_ESC = HOLA.ATOM.d / (2 * (1.68 + 0.16) * pxU(en(ATOM[0], ATOM[1], A_Z)));
// el reloj de los electrones sigue donde lo dejó ep3-hola (su tAtomo en su QUIETO, con sus marcas): arranca despacio y
// se para al final
const DT = 1 / 240;
async function relojHola() {
  let hola = 0.5, dur = 19.153;
  try { const j = await (await fetch('/atomo/plato/escenas/marcas-ep03.json')).json(); hola = j['ep3-hola'].marcas.hola; dur = j['ep3-hola'].duracion; } catch { /* valores de la locución actual */ }
  const QH = dur - 0.6;
  const v = (t) => (1 + 1.4 * ss(hola - 0.2, hola + 0.3, t) * (1 - ss(hola + 1.6, hola + 2.6, t))) * (1 - eio(prog(t, QH - 0.9, QH)));
  let a = 0;
  for (let i = 1; i * DT <= QH + 1e-9; i++) a += v((i - 0.5) * DT) * DT;
  // tz de ep3-hola en su final (calma(QUIETO) = QUIETO − 0,45)
  return { ta: a, tz: QH - 0.45 };
}
const HOLA_RELOJ = await relojHola();
const velA = (t) => ss(0, 0.8, t) * (1 - eio(prog(t, QUIETO - 0.9, QUIETO)));
const TA = [0];
for (let i = 1; i * DT <= D + 0.2; i++) TA.push(TA[i - 1] + velA((i - 0.5) * DT) * DT);
const tAvance = (t) => { const x = Math.max(0, t) / DT, i = Math.min(TA.length - 2, Math.floor(x)); return mix(TA[i], TA[i + 1], x - i); };
function atomo(ts) {
  const av = tAvance(ts), tz = HOLA_RELOJ.tz + av;
  const w = en(ATOM[0], ATOM[1], A_Z);
  P.atomo({
    pos: [w[0], w[1] + 0.006 * Math.sin(tz * 1.1), w[2]], escala: A_ESC,
    yaw: -0.15 + 0.08 * Math.sin(tz * 0.5), pitch: 0.06, roll: 0,
    energia: ts < QUIETO ? E.energia(ts) : 0, ts: HOLA_RELOJ.ta + av, velo: 0.1,
  });
}
function pasadaAtomo(ts, nf) { P.limpiar(); atomo(ts); P.render(nf, { fondo: false }); pegarGL(); }
// la sombra blanda bajo el sitio de Atom (que se lea en el móvil): la del ojo (cálida) y la del cielo (fría)
function sombraAtom(kCielo = 0) {
  const a = HOLA.SOMBRA_ATOM, b = FIN_OJO.SOMBRA_ATOM;
  for (const [s, k] of [[a, 1 - kCielo], [b, kCielo]]) {
    if (k <= 0.002) continue;
    const gr = g.createRadialGradient(s.x, s.y, s.r0, s.x, s.y, s.r1);
    gr.addColorStop(0, `rgba(${s.color},${s.alfa * k})`); gr.addColorStop(1, `rgba(${s.color},0)`);
    g.fillStyle = gr; g.fillRect(s.x - s.r1 - 10, s.y - s.r1 - 10, 2 * s.r1 + 20, 2 * s.r1 + 20);
  }
}

// ---------------------------------------------------------------- el ojo a tres escalas
// 1 × = el de ep3-hola (encuadreHola); ESC_MEDIO × = el ojo entero (frase 5, segunda mitad: otra foto, el ojo más
// pequeño en el mismo sitio). Mismo centro (960, 540, Z_OJO), misma rotación; los párpados en el estado final de ep3-hola
// (FIN). El párpado de cerca (frase 6) son las capas de 1 × ampliadas ESC_CERCA veces en 2D: renderizado más grande, el ojo
// se acerca tanto a la cámara que la luz del plató le llega rasante y la piel sale oscura y morada.
const EH = encuadreHola(P);
const FIN = EH.fin, PUP = HOLA.PUPILA;
const ESC_MEDIO = 0.62, ESC_CERCA = 1.8;
const R_OJO = new THREE.Euler(...EH.rot, 'YXZ');
// y de pantalla del borde de cada párpado en el centro de la rendija (ojo a k veces la escala de ep3-hola)
function bordesPx(k, estado = FIN) {
  const ang = (c, a0) => mix(a0, OJO.CIERRE, c);
  const au = ang(estado.arriba, OJO.ARRIBA), al = Math.min(ang(estado.abajo, OJO.ABAJO), au - 0.004);
  const y = (a) => {
    const s = Math.sin(a), c = Math.cos(a), rho = Math.sqrt(OJO.RL * OJO.RL - OJO.H * OJO.H * s * s);
    const q = new THREE.Vector3(0, (rho - OJO.H * c) * s, OJO.H + (rho - OJO.H * c) * c - OJO.BZ).multiplyScalar(EH.escala * k).applyEuler(R_OJO);
    return pant([EH.pos[0] + q.x, EH.pos[1] + q.y, EH.pos[2] + q.z])[1];
  };
  return [y(au), y(al)];
}
// la franja delante del ojo a k veces (la receta de encuadreHola): pos, escala, rot, alto (variante) e y de pantalla
function franjaEn(k, medioAltoPx = HOLA.FRANJA.medioAltoPx * k) {
  const fpos = EH.pos.map((x, i) => x + EH.dirCam[i] * HOLA.FRANJA.delante * EH.escala * k);
  const fesc = HOLA.FRANJA.largoPx * k / pxU(fpos);
  return { pos: fpos, escala: fesc, rot: haciaCamara(P, fpos), alto: medioAltoPx / (fesc * pxU(fpos)), y: pant(fpos)[1] };
}
const B1 = bordesPx(1), B05 = bordesPx(ESC_MEDIO);
const YF1 = EH.franja.y;                                  // el centro de la franja de ep3-hola
const YC05 = (B05[0] + B05[1]) / 2;
const FR05 = franjaEn(ESC_MEDIO);
// la banda de pantalla (a 1 ×) que tocan los párpados al cerrarse (con las pestañas de arriba) y su pluma
const BANDA = [Math.max(0, Math.round(B1[0] - 150)), Math.min(H, Math.round(B1[1] + 70))], PLUMA = 26;
// (coste) y en x, solo lo que se ve en el primer plano del párpado (ESC_CERCA veces alrededor del centro), con margen
const BANDA_X = [Math.round(960 - 960 / ESC_CERCA - 50), Math.round(960 + 960 / ESC_CERCA + 50)];

// ---------------------------------------------------------------- el desfile por la franja (frase 5)
const Z_IN = 7;                                            // el aumento dentro de la franja (respecto a ep3-hola)
const ZP = 6.0, PXP = pxU(en(960, YF1, ZP));

const corre = (tau, v0, v1) => -(v0 * tau + v1 * tau * tau * tau);

  { nombre: 'pelo', t: T.pelo, dy: 0, d: 170 },
  { nombre: 'luna', t: T.luna, dy: -6, d: 430 },
  { nombre: 'estrellas', t: T.estrellas, dy: 4, d: 560 },
  { nombre: 'galaxia', t: T.galaxia, dy: -4, d: 580 },

const PARADA_V = [520, 2157], PARADA_TAU = 0.85;

function ponerParada(ts) {
  const luces = [];

    const tau = ts - o.t;

      const esc = (o.d / 2) / PXP, sq = [1, 2.8, 1], rot = [0, 0.9 * tau, 0.2];

    } else if (o.nombre === 'luna') {
      P.pieza(I.LUNA, { pos, escala: o.d / PXP, rot: [0.1, 0.35 * tau, 0.25] });
      luces.push({ x, y, r: o.d * 0.9, color: '255,214,150', a: 0.10 });
    } else if (o.nombre === 'estrellas') {
      P.pieza(I.COSA, { pos, escala: o.d / PXP, rot: [0.15, 0.5 * tau, 0.2 * tau], variante: COSA.ESTRELLAS, color: 0 });
      luces.push({ x, y, r: o.d * 0.8, color: '255,220,160', a: 0.24 });
    } else {
      P.pieza(I.COSA2, { pos, escala: o.d / PXP, rot: [-0.85, 0.2, 0.5 - 0.7 * tau], variante: COSA.REMOLINO, color: 0 });

    gr.addColorStop(0, `rgba(${l.color},${l.a * k})`); gr.addColorStop(1, `rgba(${l.color},0)`);
    g.fillStyle = gr; g.fillRect(-l.r, -l.r, 2 * l.r, 2 * l.r);

// ---------------------------------------------------------------- el teléfono (frase 5, segunda mitad)
const ZT = 7.0, Y_TEL = YC05 + 100, TEL_PX = 580;
const ESC_TEL = TEL_PX / (0.96 * pxU(en(960, Y_TEL, ZT)));
function ponerTelefono(ts) {
  const u = eoc(prog(ts, T.tel0, T.tel1));

  P.pieza(I.COSA, { pos: en(960, y, ZT), escala: ESC_TEL, rot, variante: COSA.TELEFONO, color: 0 });
  return { y, u };

// ---------------------------------------------------------------- los instrumentos (frase 7)
const ZI = 5.0, PXI = pxU(en(960, 540, ZI));
// el anillo, de unos 1050 px de ancho en pantalla: entero dentro del cuadro y por encima de los subtítulos
const ANILLO_PX = 880;
const EFIN = encuadreFinOjo(P);
const TEL_X0 = 2500;
// al salir por la izquierda, los instrumentos suben (no pasan por detrás de Atom)
const subeIzq = (x) => 0.5 * Math.max(0, 1000 - x);
// (coste) el microscopio y el anillo son fotos, de tres cuartos, en el centro, que pasan en 2D. Se hacen en fotogramas
// baratos (el ojo ya cerrado, antes de oscurecerse) poco antes de hacer falta, una por fotograma; el anillo, por bandas
// horizontales (la tijera de WebGL: cada banda solo paga sus píxeles). Ver PREPARAR.
const MICRO = { x: 960, y: 530, alto: 700, rot: [0.14, -0.62, 0.03], nf: 9210 };
const ANILLO = { x: 960, y: 490, rot: [0.66, 0.35, 0], nf: 9220, bandas: [[150, 400], [400, 640], [640, 930]] };
function fotoMicro() {
  if (F.micro) return;
  P.fotograma(0); ponerInstrumentos(UI, { luz: 1 });
  P.limpiar();
  instrumento(P, I.INS, { variante: 'microscopio', pos: en(MICRO.x, MICRO.y, ZI), escala: MICRO.alto / (1.93 * PXI), rot: MICRO.rot });
  P.render(MICRO.nf, { fondo: false });

  P.limpiar();
}

        const gr = g.createRadialGradient(0, 0, 0, 0, 0, 1100);
        gr.addColorStop(0, `rgba(255,228,190,${0.55 * fl})`); gr.addColorStop(0.4, `rgba(255,200,140,${0.22 * fl})`); gr.addColorStop(1, 'rgba(255,190,120,0)');
        g.fillStyle = gr; g.fillRect(-1100, -1100, 2200, 2200);
        g.restore();
      }
    } else {
      // ---- el ojo entero (con el fundido desde el de 1 × al final de la apertura) y el teléfono
      const z = Z / ESC_MEDIO, yd = mix(YC05, YF1, cl(z - 1));
      ojoMedio(g, z, yd);
      const a1 = ss(0.62, 0.95, Z);
      if (a1 > 0.002) {
        const gt = CAPA_TMP.getContext('2d');
        gt.setTransform(1, 0, 0, 1, 0, 0); gt.clearRect(0, 0, CAPA_TMP.width, CAPA_TMP.height);
        gt.setTransform(KD, 0, 0, KD, 0, 0); gt.globalAlpha = 1;
        ojoUno(gt, Z, { yDst: yd, fondo: false });
        g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = a1; g.drawImage(CAPA_TMP, 0, 0); g.restore();
      }
      if (ts > T.tel0) {
        P.limpiar(); const tel = ponerTelefono(ts); P.render(nf, { fondo: false });
        // la luz de la pantalla sobre la piel
        const k = eoc(prog(ts, T.tel0, T.tel1));
        g.save(); g.globalCompositeOperation = 'lighter'; g.translate(960, tel.y); g.scale(1, 0.6);
        const gr = g.createRadialGradient(0, 0, 60, 0, 0, 560);
        gr.addColorStop(0, `rgba(190,200,225,${0.06 * k})`); gr.addColorStop(1, 'rgba(190,200,225,0)');
        g.fillStyle = gr; g.fillRect(-560, -560, 1120, 1120);
        g.restore();
        pegarGL();
        marcaT('telefono');
      }
    }
    if (!principio) sombraAtom(0);
    pasadaAtomo(ts, nf);
    marcaT('atom');
    POST.aplicar(g, nf);
    marcaT('post');
    return;
  }
  if (ts < T.oscuro0) {
    // ---- el párpado de cerca: la franja se estrecha hasta un borde fino y el ojo se cierra
    let parp = F.cerrado1, sombraP = F.sombra1;
    if (ts >= T.cierra1) { parp = F.cerr1; sombraP = F.sombraC1; }
    else if (ts > T.cierra0) {
      const u = eio(prog(ts, T.cierra0, T.cierra1));
      parp = bandaParpados({ arriba: mix(FIN.arriba, 1, u), abajo: mix(FIN.abajo, 1, u) }, nf);
      sombraP = sombraParpados(parp, HOLA.SOMBRA);
      marcaT('parpados');
    }
    componerCerca(g, parp, sombraP);
    const ue = eio(prog(ts, T.estrecha0, T.estrecha1));
    const sy = mix(1, 1.6 / HOLA.FRANJA.medioAltoPx, ue);
    const kf = 1 - ss(T.cierra0 + 0.15, T.cierra1 - 0.1, ts);
    if (kf > 0.002) {
      pegar(g, F.franja1, ESC_CERCA, [960, YF1], [960, YF1], kf, 'none', sy);
      const xm = 960 + (HOLA.HALO.x1 - 960) * ESC_CERCA;
      resplandorFranja(g, 960 - (xm - 960), xm, YF1, HOLA.HALO.alto * ESC_CERCA * mix(1, 0.25, ue), HOLA.HALO.fuerza * kf * mix(1, 0.7, ue));
    }
    sombraAtom(0);
    pasadaAtomo(ts, nf);
    POST.aplicar(g, nf);
    return;
  }
  // ---- los instrumentos sobre el ojo cerrado, que se oscurece y se funde en el cielo
  const ko = eio(prog(ts, T.oscuro0, T.oscuro1)), kc = eio(prog(ts, T.cielo0, T.cielo1));
  g.drawImage(F.cerca2, 0, 0, W, H);
  if (ko > 0.002) pegar(g, F.fondoI, 1, [960, 540], [960, 540], ko);
  if (kc > 0.002) pegar(g, F.cielo, 1, [960, 540], [960, 540], kc);
  marcaT('fondo');
  // el halo cálido detrás del telescopio
  const h = FIN_OJO.HALO, kh = kc * eoc(prog(ts, T.tele0, T.tele1));
  if (kh > 0.002) {
    g.save(); g.globalCompositeOperation = 'lighter';
    const gh = g.createRadialGradient(h.x, h.y, 0, h.x, h.y, h.r);
    gh.addColorStop(0, `rgba(255,190,110,${h.alfa * kh})`); gh.addColorStop(1, 'rgba(255,170,90,0)');
    g.fillStyle = gh; g.fillRect(h.x - h.r, h.y - h.r, 2 * h.r, 2 * h.r);
    g.restore();
  }
  // el microscopio: llega por la derecha, despacio por el centro, y sale deprisa subiendo hacia la izquierda, ladeándose
  const tm = ts - T.micro;
  if (Math.abs(tm) < 0.9) {
    const x = 960 + corre(tm, 420, tm > 0 ? 2500 : 1780), y = MICRO.y - subeIzq(x);
    g.save(); g.translate(x, y); g.rotate(-0.12 * Math.max(0, tm) + 0.02 * tm); g.translate(-MICRO.x, -MICRO.y);
    g.drawImage(F.micro, 0, 0, W, H);
    g.restore();
  }
  // el anillo del acelerador (visto desde arriba, de tres cuartos), con los dos paquetes de luz que corren por el tubo
  // en sentidos contrarios y chocan en el detector de enfrente
  const ta = ts - T.anillo;
  let choque = null;
  if (Math.abs(ta) < 1.0) {
    const x = 960 + corre(ta, 450, 1900), y = ANILLO.y - subeIzq(x), giro = -0.03 * ta;
    const cg = Math.cos(giro), sg = Math.sin(giro);
    const aPant = ([px, py]) => { const dx = px - ANILLO.x, dy = py - ANILLO.y; return [x + cg * dx - sg * dy, y + sg * dx + cg * dy]; };
    g.save(); g.translate(x, y); g.rotate(giro); g.translate(-ANILLO.x, -ANILLO.y);
    g.drawImage(F.anillo, 0, 0, W, H);
    g.restore();
    const fase = 0.5 * prog(ts, T.anillo - 1.0, T.choque);
    if (ts < T.choque + 0.05) {
      g.save(); g.globalCompositeOperation = 'lighter';
      for (const sgn of [1, -1]) {
        const u0 = sgn * fase;
        // la estela (se apaga hacia atrás) y el paquete
        for (let j = 18; j >= 0; j--) {
          const u = u0 - sgn * j * 0.006, vis = fueraDetector(u);
          if (vis < 0.02) continue;
          const [px, py] = aPant(tuboEn(u)), r = j ? 20 - 0.6 * j : 46, a = (j ? 0.5 * Math.exp(-j / 6) : 0.95) * vis;
          const gr = g.createRadialGradient(px, py, 0, px, py, r);
          gr.addColorStop(0, `rgba(255,${j ? 190 : 236},${j ? 110 : 200},${a})`); gr.addColorStop(0.35, `rgba(255,170,80,${a * 0.45})`); gr.addColorStop(1, 'rgba(255,150,60,0)');
          g.fillStyle = gr; g.fillRect(px - r, py - r, 2 * r, 2 * r);
        }
      }
      g.restore();
    }
    choque = aPant(F.detectores[2]);
  }
  if (ts >= T.tele0) {
    // el telescopio (la foto del final, la misma pieza y encuadre que pintarFinOjo): llega flotando desde la derecha, algo
    // más lejos y ladeado, se para en el centro y sigue flotando (sube y baja unos píxeles, cada vez menos) hasta quedarse
    // quieto en su sitio
    const u = eoc(prog(ts, T.tele0, T.tele1));
    const env = 1 - eio(prog(ts, T.tele1, QUIETO)), fa = Math.max(0, ts - T.tele1);
    const dx = (TEL_X0 - FIN_OJO.X) * (1 - u), dy = 70 * (1 - u) - 7 * Math.sin(fa * 2.1) * env;
    const esc = mix(0.86, 1, u), giro = -0.1 * (1 - u) + 0.006 * Math.sin(fa * 1.3) * env;
    g.save(); g.translate(FIN_OJO.X + dx, FIN_OJO.Y + dy); g.rotate(giro); g.scale(esc, esc); g.translate(-FIN_OJO.X, -FIN_OJO.Y);
    g.drawImage(F.tele, 0, 0, W, H);
    g.restore();
  }
  marcaT('instrumentos');
  // el choque de los dos paquetes en el detector
  if (choque) {
    const k = Math.exp(-Math.pow((ts - T.choque) / 0.16, 2));
    if (k > 0.01) {
      const [x, y] = choque;
      g.save(); g.globalCompositeOperation = 'lighter';
      const gr = g.createRadialGradient(x, y, 0, x, y, 260);
      gr.addColorStop(0, `rgba(255,236,200,${0.85 * k})`); gr.addColorStop(0.25, `rgba(255,190,110,${0.35 * k})`); gr.addColorStop(1, 'rgba(255,160,80,0)');
      g.fillStyle = gr; g.fillRect(x - 260, y - 260, 520, 520);
      g.restore();
    }
  }
  sombraAtom(kc);
  pasadaAtomo(ts, nf);
  marcaT('atom');
  POST.aplicar(g, nf);
  marcaT('post');
}
cargaT('listo');
window.__info = { T, m, B1, B05, YF1, YC05, BANDA, ESC_TEL, EFIN, HOLA_RELOJ };
// el último fotograma, para ep3-promesa (ver la cabecera): la receta del kit de instrumentos y Atom quieto en su sitio
window.__fin = (() => {
  const av = tAvance(QUIETO), tz = HOLA_RELOJ.tz + av, w = en(ATOM[0], ATOM[1], A_Z);
  return {
    t: D, quieto: QUIETO, receta: 'pintarFinOjo(P, U, i) de kits/ep03-instrumentos.js (FIN_OJO, encuadreFinOjo, cieloOjo)',
    telescopio: { ...EFIN, variante: 'telescopio', uniformes: { rueda: 0, haz: 0, fase: 0, luz: 0 } },
    atom: { centro: ATOM, diametroOrbitas: HOLA.ATOM.d, pos: [w[0], w[1] + 0.006 * Math.sin(tz * 1.1), w[2]], escala: A_ESC,
      yaw: -0.15 + 0.08 * Math.sin(tz * 0.5), pitch: 0.06, roll: 0, energia: 0, ts: HOLA_RELOJ.ta + av, velo: 0.1 },
    camara: { pos: [0, 3.8, 15.5], mira: [0, 2.3, 0], fov: 28, desenfoque: 44 },
  };
})();
E.iniciar(dibujar, { paso: 1 / 12 });
