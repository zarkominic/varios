<title>Partir · ep5</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>

<body>
<canvas id="lienzo"></canvas>
<script type="module">
// RM-PARTIR (frase 32). Cartela «284». Unas tijeras bajan por el mapa y lo parten en dos: el oeste y el este se separan
// un poco y aparece un gobernante en cada mitad (y luego otro más en cada una).
import { preparar, rodar } from '/atomo/plato/escenas/rm-comun.js';
const { E, R, M } = await preparar('rm-partir');
const { PALA, PR, ELENCO, tramo, lerp } = R;
const m0 = M('partir', 1.5);
const emp = (c, pelo, barba) => ({ ...ELENCO.cesar, sombrero: 'diadema', capa: c, pelo, barba });
const parte = (t) => {
  const u = t - m0, corte = tramo(u, 3.5, 5.5), sep = tramo(u, 5.5, 6.2) * 6;
  const B = R.nuevo(), prev = R.usar(B); R.mapaAño(t, 284); R.usar(prev);
  const cx = Math.round(R.lugar([19, 40])[0]);
  for (let y = 0; y < R.H; y++) for (let x = 0; x < R.W; x++) { const sx = x < cx - sep ? x + sep : x > cx + sep ? x - sep : -1; R.pset(x, y, sx >= 0 ? B[y * R.W + sx] : PALA.CONTORNO); }
  for (let y = 0; y < corte * R.H; y++) R.pset(cx, y, PALA.CONTORNO);
  if (corte > 0 && corte < 1) R.tijeras(cx, Math.round(corte * R.H), Math.abs(Math.sin(u * 8)), { ang: Math.PI / 2 });
  if (u > 6.4) [[60, 166, PALA.PURPURA, PALA.PELO_BLANCO, 'poblada'], [260, 166, PALA.ROJO, PALA.PELO_NEGRO, 'perilla'], [96, 170, PALA.AZUL, PALA.PELO_CASTANO, 'no'], [224, 170, PALA.VERDE, PALA.PELO_RUBIO, 'bigote']].forEach(([x, y, c, p, b], i) => { if (u > 6.4 + (i >> 1) * 1.2) R.personaje(x, y, 26, { ...emp(c, p, b), t: t + i, dir: x < 160 ? 1 : -1, pose: 'manos_cintura' }); });
};
rodar(E, R, [[0, parte]], { cartela: '284', año: (t) => Math.round(lerp(284, 293, tramo(t, m0 + 6, m0 + 8))) });
</script>
</body>
</html>
