<body>
<canvas id="lienzo"></canvas>
<script type="module">
// OV-SECRETO (frase 25), dos planos de detalle: 1 una carpeta con la foto del avión espía recibe un sello rojo; 2 el cajón del
// archivador se cierra y cae el candado.
import { preparar, rodar, insertoCarpeta, insertoArchivador } from '/atomo/plato/escenas/ov-comun.js';
const { E, R, M } = await preparar('ov-secreto');
const { tramo } = R;
const m0 = M('sospecha2', 0.5), corte = m0 + 0.48 * (E.duracion - m0);
const carpeta = (t) => insertoCarpeta(R, t, { sello: tramo(t, m0 + 0.6, corte - 0.4), marca: '?', forma: 20 });
const cajon = (t) => insertoArchivador(R, t, { cierra: tramo(t, corte + 0.2, corte + 1.2), candado: tramo(t, corte + 1.4, corte + 2.8) });
rodar(E, R, [[0, carpeta], [corte, cajon]], { efectos: [[m0 + 0.6 + 0.75 * (corte - 0.4 - m0 - 0.6), 'sello'], [corte + 1.1, 'cerrojo'], [corte + 2.7, 'cerrojo']], año: 1958 });
</script>
</body>
