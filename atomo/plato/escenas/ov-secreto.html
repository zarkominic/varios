<title>Secreto · ep10</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// OV-SECRETO (frase 25). F: en la oficina, un sobre con un sello rojo se guarda en un cajón y el cajón se cierra con candado.
import { preparar, rodar, despacho, C } from '/atomo/plato/escenas/ov-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await preparar('ov-secreto');
const { tramo, lerp } = R;
const m0 = M('sospecha2', 0.5), mete = (t) => tramo(t, m0 + 1, m0 + 3.2), cierra = m0 + 3.6;
const plano = (t) => {
  despacho(R, t, { mapa: true });
  R.actor(EL.oficial, 236, 150, t, { dir: 1, quieto: true, dedo: t < m0 + 3 });
  // el sobre con el sello rojo vuela de la mano al cajón del archivador
  const u = mete(t);
  if (u < 1) { const x = Math.round(lerp(250, 276, u)), y = Math.round(lerp(130, 100, u) - Math.sin(u * Math.PI) * 10); R.rect(x - 5, y - 3, x + 5, y + 3, C.k); R.rect(x - 4, y - 2, x + 4, y + 2, C.papel); R.disco(x, y, 1, C.rojo); }
  if (t > cierra) { R.rect(270, 96, 286, 106, C.k); R.icono('candado', 275, 98, C.oro, C.k); }
};
rodar(E, R, [[0, plano]], { efectos: [[m0 + 1, 'papel'], [cierra, 'cerrojo']], año: 1958 });
</script>
</body>
</html>
