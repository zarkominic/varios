<script type="module">
// OI-MAREAS (frase 26), 1850. Dos planos:
// 1. el pozo y la orilla, de cerca y a ras de suelo, al atardecer: a la izquierda medio pozo en corte (la entibación con
//    sus testas, las marcas de tiza y el torno); a la derecha la playa en corte y el mar con su poste de la marea (marcas,
//    la de la pleamar en rojo, y números). El buscador gira la manivela y baja el flotador al agua del pozo; la marea sube
//    y baja dos veces y el agua del pozo la sigue a la misma altura (las dos flechas a la vez); el agua se cuela por la
//    capa de grava; el bote amarrado flota y vuelve a vararse; el cangrejo sigue la orilla; el capataz, en la playa, mira
//    el poste y el pozo. Luna pálida que cruza, nubes de tres tonos, una gaviota (corta en «In time with the tides»);
// 2. la boca del pozo de noche, de cerca y desde arriba: el brocal de cuatro maderos llena medio cuadro; dentro, la
//    entibación en perspectiva con sus troncos marcados y numerados con tiza; el agua sube y baja entre ellos («como si
//    la isla respirara») con el reflejo de la luna que tiembla, anillos, la franja mojada y la línea de la pleamar. El
//    obrero llega con el farol y lo alza; el capataz se aparta cuando sube y se asoma cuando baja. Luna sobre la bahía,
//    goleta fondeada, polillas y luciérnagas.
import * as T from '/atomo/plato/escenas/oi-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('oi-mareas');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const m = (f) => en('mareas', f);
const P2 = m(0.643);
const K = hex('#1c1424'), MAD = hex('#7a5230'), MADS = hex('#4e3218'), LUNA = hex('#f2eedc'), LUNAS = hex('#c8c2aa');
const mez = (p, q, k) => { let r = 0; for (const s of [0, 8, 16]) r |= Math.round(((p >>> s) & 255) * (1 - k) + ((q >>> s) & 255) * k) << s; return (r | 0xff000000) >>> 0; };
const luna = (x, y, r, k = 1) => { for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) { const d = Math.hypot(i, j); if (d > r + 0.3) continue; const c = d > r - 0.8 ? LUNAS : (i * 3 + j * 5) % 7 === 0 && d < r - 1.5 ? LUNAS : LUNA; R.pset(x + i, y + j, mez(R.pget(x + i, y + j), c, k)); } };
// la flecha blanca que sube o baja (la misma en el pozo y en el mar)
const flechaV = (x, y, sube) => { for (let j = 0; j < 7; j++) { const w = sube ? Math.floor(j / 2) : 3 - Math.floor(j / 2); R.rect(x - w - 1, y + j - 1, x + w + 1, y + j + 1, K); } for (let j = 0; j < 7; j++) { const w = sube ? Math.floor(j / 2) : 3 - Math.floor(j / 2); R.rect(x - w, y + j, x + w, y + j, j === (sube ? 6 : 0) ? hex('#c8d8e0') : hex('#f2f6f8')); } };
// la marea: dos subidas y dos bajadas en el plano («rises» sube, «falls» baja)
const marea = (t) => 0.5 - 0.5 * Math.cos(2 * Math.PI * (t - 0.8) / 3.0);

// ── utilidades del plano: trama de Bayer, ruido, degradados tramados y capas fijas en búfer ──────────────────────────
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const umb = (x, y) => (BAY[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
const hs = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const cl = (v) => Math.max(0, Math.min(1, v));
// degradado tramado por filas: P = [[y, color], …]
const degradado = (B, x0, x1, y0, y1, P) => { for (let y = y0; y <= y1; y++) { let i = 0; while (i + 1 < P.length && y >= P[i + 1][0]) i++; const a = P[i], b = P[Math.min(i + 1, P.length - 1)], k = b[0] > a[0] ? (y - a[0]) / (b[0] - a[0]) : 0;
  for (let x = x0; x <= x1; x++) B[y * 320 + x] = umb(x, y) < k ? b[1] : a[1]; } };
const capas = {};
const capa = (k, dibuja) => { if (!capas[k]) { const b = R.nuevo(); const prev = R.usar(b); dibuja(b); R.usar(prev); capas[k] = b; } R.buf.set(capas[k]); };
const pal = (o) => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, hex(v)]));
// una nube de tres tonos (sombra abajo, cuerpo y luz arriba a la izquierda)
const nube = (x, y, w, c) => { const n = Math.max(2, Math.round(w / 9));
  for (let i = 0; i < n; i++) { const cx = Math.round(x + (i + 0.5) * w / n), r = Math.round(w / n * (i === 0 || i === n - 1 ? 0.55 : 0.8)); R.disco(cx, y + 1, r, c[0]); }
  for (let i = 0; i < n; i++) { const cx = Math.round(x + (i + 0.5) * w / n), r = Math.round(w / n * (i === 0 || i === n - 1 ? 0.55 : 0.8)); R.disco(cx - 1, y - 1, Math.max(1, r - 1), c[1]); R.disco(cx - Math.round(r / 2), y - Math.round(r * 0.7), Math.max(1, Math.round(r / 2)), c[2]); }
  R.rect(Math.round(x + 2), y + 1, Math.round(x + w - 2), y + 2, c[0]); };

// ── plano 1: el pozo y la orilla, de cerca y a ras de suelo ──────────────────────────────────────────────────────────
const Q = pal({ humus: '#4a3424', humusL: '#5e4430', till: '#9a7a5a', tillS: '#84664a', tillL: '#b0906c', roja: '#a26a48', rojaS: '#86543a', rojaL: '#b8805a',
  grava: '#8e9488', gravaS: '#6a7470', gravaL: '#b4bab0', gris: '#857f74', grisS: '#6e6960', grisL: '#9c958a', canto: '#a8a4ac', cantoS: '#76727e', cantoL: '#d4d0d8',
  arena: '#d8c08a', arenaS: '#b89c68', arenaM: '#9c8458', arenaL: '#f0dca8', raiz: '#3a2618', hierba: '#5a8a3a', hierbaS: '#3e6a2a', hierbaL: '#a8b84a',
  tronco: '#6a4a2c', troncoS: '#4a3018', troncoL: '#8e6a40', anillo: '#c8a070', anilloS: '#9a7448', hueco: '#2a1c12', huecoL: '#3e2a1a', mojado: '#3a3a2a', alga: '#4a6a3a',
  mar0: '#7ab4cc', mar1: '#4a88b0', mar2: '#356e98', mar3: '#265680', mar4: '#1c4468', caust: '#a8dcec', espuma: '#eef8ff',
  rob0: '#26361e', rob1: '#3a4e2a', rob2: '#5a6a34', rob3: '#c08a58', poste: '#8a6a44', posteS: '#5e4428', posteL: '#b08a5a', marca: '#f2eee2', rojoM: '#d84a2c',
  bote: '#9a4a30', boteS: '#6a2e1c', boteL: '#c8704a', boteI: '#5a3a24', cuerda: '#d8ccaa', hierro: '#4a4e58' });

const ys1 = (x) => (x <= 150 ? 72 : 72 + (x - 150) * 0.5);   // el suelo: llano hasta x 150; luego la playa baja al mar

const estrato = (y) => { let n = ESTR[0][1]; for (const [y0, k] of ESTR) if (y >= y0) n = k; return n; };
// el color del agua en corte a una profundidad d bajo la superficie (con la trama entre tonos y los rayos de luz)
const agua = (x, y, d, t) => { const TT = [[0, Q.mar0], [4, Q.mar1], [14, Q.mar2], [30, Q.mar3], [48, Q.mar4]]; let i = 0; while (i + 1 < TT.length && d >= TT[i + 1][0]) i++;
  const a = TT[i], b = TT[Math.min(i + 1, TT.length - 1)], k = b[0] > a[0] ? (d - a[0]) / (b[0] - a[0]) : 0; let c = umb(x, y) < k ? b[1] : a[1];
  if (d > 2 && d < 26 && Math.sin(x * 0.21 + Math.sin(y * 0.3 + t * 1.3) * 1.6 + t * 0.9) > 0.93) c = Q.caust;
  if (d > 4 && ((x * 3 + y * 7 + Math.floor(t * 2)) % 97) === 0) c = Q.mar0;
  return c; };
const fondo1 = (B) => {
  // el cielo del atardecer, tramado

  R.disco(236, 60, 11, hex('#ffd890')); R.disco(236, 60, 10, hex('#ffb85a')); R.disco(233, 57, 4, hex('#fff2c4'));
  // el mar lejano, que refleja el atardecer, con su reguero de oro bajo el sol
  degradado(B, 140, 319, HOR1, 179, [[HOR1, hex('#e8a080')], [68, hex('#b07a90')], [80, hex('#6a74a8')], [100, hex('#4a64a0')], [140, hex('#3a5490')]]);
  for (let y = HOR1 + 1; y < 140; y += 2) for (let x = 140; x < 320; x++) if (hs(x >> 3, y, 7) < 0.25 && (x + y) % 3 === 0) B[y * 320 + x] = mez(B[y * 320 + x], hex('#f0d0c0'), 0.35);
  // la costa de enfrente: una loma azulada con abetos y dos islotes con su orilla clara
  for (let x = 140; x < 320; x++) { const yt = Math.round(HOR1 - 3 - Math.sin(x * 0.05) * 2 - (x > 170 && x < 205 ? 3 : 0)); for (let y = yt; y < HOR1; y++) B[y * 320 + x] = (x + y) % 4 ? hex('#7a6a8e') : hex('#6a5a80'); if (x % 5 === 0) { B[(yt - 1) * 320 + x] = hex('#5a4a72'); B[(yt - 2) * 320 + x] = hex('#5a4a72'); } }
  for (const [cx, w] of [[268, 12], [300, 8]]) for (let x = cx - w; x <= cx + w; x++) { const e = 1 - ((x - cx) / w) ** 2, yt = Math.round(HOR1 + 2 - e * 6); for (let y = yt; y <= HOR1 + 2; y++) B[y * 320 + x] = y === HOR1 + 2 ? hex('#e8c8a0') : (x + y) % 3 ? hex('#4a4a5a') : hex('#3a3a4e'); }
  // el robledal de la isla detrás del pozo: copas de tres tonos con el borde encendido por el sol, troncos y sotobosque
  for (let k = 0, x = -6; x < 152; x += 13, k++) { const y = 58 + Math.round(hs(k, 1, 40) * 6), r = 9 + Math.round(hs(k, 2, 40) * 4);
    R.disco(x, y + 1, r, Q.rob0); R.disco(x - 1, y, r - 1, Q.rob1); R.disco(x - 3, y - 3, Math.round(r * 0.5), Q.rob2);
    for (let i = 0; i < r * 2; i++) { const a = hs(i, k, 41) * 6.28, d = hs(i, k, 42) * r, px = Math.round(x + Math.cos(a) * d), py = Math.round(y + Math.sin(a) * d); R.pset(px, py, Math.cos(a) > 0.5 && Math.sin(a) < 0 ? Q.rob3 : Q.rob0); } }
  for (let x = 4; x < 150; x += 11) R.rect(x, 64, x + 1, 71, Q.troncoS);
  for (let x = 0; x < 152; x++) for (let y = 66; y < 72; y++) if (umb(x, y) < (y - 64) / 8) B[y * 320 + x] = Q.rob0;
  // la tierra en corte: estratos tramados en sus bordes, cantos rodados, raíces y la playa de arena encima
  for (let y = 72; y < 180; y++) for (let x = 0; x < 320; x++) { const s = ys1(x); if (y < s) continue; const d = y - s, k = estrato(y), ke = estrato(y - 2);
    let c = Q[k]; if (ke !== k && umb(x, y) < 0.5) c = Q[ke];
    if (x > 150 && d < 7) c = d < 1 ? Q.arenaL : hs(x, y, 3) < 0.15 ? Q.arenaS : Q.arena;
    else { const n = hs(x >> 1, y >> 1, 9); if (n < 0.08) c = Q[k + 'S'] ?? c; else if (n > 0.94) c = Q[k + 'L'] ?? c;
      // las láminas de cada estrato (onduladas y a trozos) y las lentes más claras
      if ((y + Math.round(Math.sin(x * 0.07 + y * 0.5) * 1.5)) % 5 === 0 && hs(x >> 3, y, 11) < 0.65) c = Q[k + 'S'] ?? c;
      else if ((y + Math.round(Math.sin(x * 0.05 + y) * 1.2)) % 9 === 3 && hs(x >> 4, y, 12) < 0.35) c = Q[k + 'L'] ?? c; }
    B[y * 320 + x] = c; }
  for (let k = 0; k < 70; k++) { const x = Math.round(hs(k, 1, 50) * 318), y = 80 + Math.round(hs(k, 2, 50) * 98); if (y < ys1(x) + 8 || (x > 40 && x < 112)) continue; const r = 1 + Math.round(hs(k, 3, 50) * 2);
    R.disco(x, y, r, Q.cantoS); R.disco(x, y - (r > 1 ? 1 : 0), Math.max(0, r - 1), Q.canto); R.pset(x - 1, y - r + 1, Q.cantoL); }
  for (let k = 0; k < 12; k++) { let x = 4 + k * 12, y = 74; if (x > 40 && x < 112) continue; for (let i = 0; i < 9; i++) { R.pset(x, y, Q.raiz); x += Math.round(hs(k, i, 51) * 2 - 1); y++; } }
  // un tronco viejo enterrado en la arcilla gris y unas conchas fósiles
  for (let i = 0; i < 26; i++) { const x = 116 + i, y = 152 + Math.round(i * 0.15); R.pset(x, y - 1, Q.troncoL); R.pset(x, y, Q.tronco); R.pset(x, y + 1, Q.tronco); R.pset(x, y + 2, Q.troncoS); if (i % 6 === 2) R.pset(x, y, Q.troncoS); }
  R.disco(115, 153, 2, Q.troncoS); R.pset(115, 153, Q.anillo);
  for (let k = 0; k < 10; k++) { const x = Math.round(hs(k, 1, 55) * 150) + (hs(k, 3, 55) < 0.5 ? 0 : 160), y = 140 + Math.round(hs(k, 2, 55) * 36); if ((x > 40 && x < 112) || y < ys1(x) + 8) continue; R.pset(x, y, hex('#e8e0cc')); R.pset(x + 1, y, hex('#c8bea8')); R.pset(x, y - 1, hex('#f4eedc')); }
  // la playa: algas en la línea de la pleamar, conchas y una piedra grande con percebes
  for (let x = 196; x < 300; x += 3) if (hs(x, 5, 52) < 0.5) R.pset(x, Math.round(ys1(x)) - 1, Q.alga);
  for (let k = 0; k < 9; k++) { const x = 156 + k * 17, y = Math.round(ys1(x)) + 2; R.pset(x, y, hex('#f0ece0')); R.pset(x + 1, y, hex('#c8c0b0')); }
  R.disco(262, Math.round(ys1(262)) - 1, 5, Q.cantoS); R.disco(261, Math.round(ys1(262)) - 2, 4, Q.canto); R.pset(259, Math.round(ys1(262)) - 5, Q.cantoL); R.pset(264, Math.round(ys1(262)) - 3, hex('#e8e4d0'));
  // el pozo en corte: la entibación de troncos (en los lados, sus testas con anillos; al fondo, los troncos tumbados)
  for (let y = 73; y < 180; y++) for (let x = 50; x <= 101; x++) { const j = (y - 73) % 7; let c = j === 0 ? Q.hueco : j === 1 ? Q.troncoL : (x * 5 + y * 3) % 23 === 0 ? Q.troncoS : Q.tronco;
    c = mez(c, Q.hueco, 0.45 + 0.35 * cl((y - 73) / 100)); if (y > 100 && j > 1 && hs(x >> 2, y, 53) < 0.12) c = Q.mojado; B[y * 320 + x] = c; }
  for (let y = 73; y < 180; y += 7) for (const cx of [47, 104]) { R.disco(cx, y + 3, 3, Q.troncoS); R.disco(cx, y + 3, 2, Q.anillo); R.pset(cx, y + 3, Q.anilloS); R.pset(cx - 1, y + 2, hex('#e8c890')); }
  // la línea de la pleamar en la madera: algas verdes y sal
  for (let x = 50; x <= 101; x++) if ((x + 1) % 3) R.pset(x, 95, x % 2 ? Q.alga : hex('#6a8a4a'));
  // las marcas de tiza del pozo, a la misma altura que las del poste de la marea
  for (let y = 96; y <= 136; y += 8) { R.linea(92, y, 100, y, Q.marca); R.pset(91, y, hex('#b8b4a8')); }
  // el torno sobre el pozo: dos pies, el travesaño con el tambor y su cuerda enrollada
  for (const x of [40, 110]) { R.rect(x - 1, 48, x + 2, 73, Q.troncoS); R.rect(x, 48, x + 1, 73, Q.tronco); R.pset(x, 52, Q.troncoL); R.pset(x + 1, 60, Q.troncoL); }
  R.rect(36, 47, 116, 50, Q.troncoS); R.rect(36, 47, 116, 48, Q.troncoL); for (let x = 38; x < 116; x += 6) R.pset(x, 49, Q.tronco);
  R.rect(68, 50, 84, 55, Q.troncoS); for (let x = 69; x < 84; x += 2) R.linea(x, 51, x, 54, Q.cuerda);
  // la hierba del borde del suelo y del arranque de la playa
  for (let x = 0; x < 158; x++) { if (x >= 44 && x <= 108) continue; R.pset(x, 72, x % 3 ? Q.hierba : Q.hierbaS); if (hs(x, 1, 54) < 0.4) R.pset(x, 71, Q.hierbaL); }

// el bote varado en la playa: flota cuando la marea lo alcanza (o.k = inclinación 0–1)
const bote = (xc, yb, k, yS, t) => { const tilt = 0.42 * k;
  for (let i = -14; i <= 14; i++) { const x = xc + i, prof = Math.round(5 - Math.abs(i) * 0.24), y0 = Math.round(yb + i * tilt - prof);
    for (let y = y0; y <= y0 + prof; y++) { let c = y === y0 ? Q.boteL : y === y0 + prof ? Q.boteS : y < y0 + 2 ? Q.bote : (i + y) % 5 ? Q.bote : Q.boteS; if (Math.abs(i) > 12) c = Q.boteS; if (y >= yS) c = mez(c, Q.mar2, 0.55); R.pset(x, y, c); }

  R.linea(xc - 2, Math.round(yb - 2 * tilt - 6), xc + 9, Math.round(yb + 9 * tilt - 8), Q.troncoL);   // el remo
  return [xc - 14, Math.round(yb - 14 * tilt - 4)]; };

const p1 = (t) => {
  const mr = marea(t), yM = Math.round(136 - mr * 40), sube = Math.sin(2 * Math.PI * (t - 0.8) / 3.0) > 0;
  capa('p1', fondo1);
  // nubes de tres tonos a tres velocidades (sin pasar por la zona de Atom) y el brillo que corre en el mar lejano
  // la luna pálida de día que cruza el cielo (la que mueve las mareas), detrás de las nubes
  const u = tramo(t, 0, P2); luna(Math.round(lerp(30, 196, u)), Math.round(30 - Math.sin(u * Math.PI) * 10), 4, 0.8);
  const cn = [hex('#7a4476'), hex('#de8478'), hex('#ffd4a4')];
  nube(Math.round(176 + t * 1.2), 24, 34, cn); nube(Math.round(-8 + t * 2.4), 40, 44, cn); nube(Math.round(160 + t * 3.6), 44, 26, cn); nube(Math.round(96 + t * 0.6), 32, 18, cn);
  for (let k = 0; k < 14; k++) { const x = 220 + Math.round(hs(k, 1, 60) * 32), y = HOR1 + 2 + Math.round(hs(k, 2, 60) * 20); if (y < yM - 1 && Math.sin(t * 4 + k * 1.7) > 0.3) R.pset(x, y, hex('#ffe6a0')); }
  // una gaviota cruza hacia la isla
  { const g = tramo(t, 0.3, 6.6); if (g > 0 && g < 1) T.gaviota(R, Math.round(lerp(330, -20, g)), Math.round(52 + Math.sin(g * 9) * 3), t, { pose: 'vuela', dir: -1, tarde: true }); }
  // el mar en corte: sube y baja por la playa; su superficie ondea y deja espuma en la orilla
  const surf = (x) => yM + Math.round(Math.sin(x * 0.18 + t * 3.1) * 0.8);
  for (let x = 151; x < 320; x++) { const s = Math.round(ys1(x)), y0 = surf(x); for (let y = y0; y < s; y++) R.pset(x, y, y === y0 ? ((x + Math.floor(t * 6)) % 4 ? Q.espuma : Q.caust) : agua(x, y, y - yM, t)); }
