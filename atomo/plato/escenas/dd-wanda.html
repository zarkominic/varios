<script type="module">
// DD-WANDA (frases 11–13). Nueve planos:
// 1. las ruinas de Wundagore: la luz verde se abre paso entre las piedras; Doom llega y, en «lifts», levanta las rocas con
//    su poder: en el hueco aparece Wanda, tumbada, como dormida;
// 2. de cerca, en el hueco (Wanda a escala 1 en su lecho de nieve): el charco de luz verde que late sobre ella, motas
//    verdes que suben por el haz, copos que caen de la abertura y piedrecillas nevadas alrededor; en el golpe («awaken»)
//    abre los ojos, corre una onda roja por la nieve, saltan las piedrecillas y chispea su magia; fundido a negro;
// 3. el corcho de Atom (sale del negro): la mano clava la foto de Wanda («Wanda isn't the only Maximoff»);
// 4. de cerca, la foto de 2015 en el corcho (con su luz y su sombra, chinchetas, otras fotos y notas cortadas por el
//    encuadre, el hilo rojo que llega a su chincheta, una ficha que se mueve con el aire y la luz de la persiana):
//    Pietro (escala 1) cruza la calle a toda velocidad, las palomas echan a volar y se para; en «died» se vuelve sepia;
// 5. el móvil sobre el escritorio: el dedo pulsa y Tommy (escala 1) corre por su barrio con su estela (recortada a la pantalla);
//    en «like his uncle» llega al lado la foto de Pietro;
// 6. el plató del bosque (techo con vigas, conducto, pasarela de celosía y focos colgados; la cortina de la izquierda con
//    su saco de arena y sus cables): un operario trae una silla de director roja y la deja vacía; mira a un lado y a
//    otro y sale el «?» («any Maximoff»); en «Elizabeth Olsen» el foco de la pasarela se enciende sobre la silla y él,
//    junto a ella, se encoge de hombros hasta el final;
// 7. (cómic) Latveria de noche: cielo tramado con nubes de tres tonos a tres velocidades y murciélagos, la luna con su
//    halo, la sierra nevada; el castillo de sillares en su peña (ventanas que titilan, robots en el adarve), abetos,
//    rocas y matas, y el pueblo de casas distintas con humo en las chimeneas; los cartuchos «2010» → «2012»; Wanda
//    llega por el camino;
// 8. (cómic) dentro del castillo, la boda: Wanda con velo y ramo, desorientada («?», «no memory»); Doom le tiende la mano
//    («marry him»); en «catastrophe» le chispea la magia roja;
// 9. las dos imágenes juntas: el cómic a la izquierda y la película a la derecha; en «resemblance», el «=».
import * as T from '/atomo/plato/escenas/dd-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('dd-wanda');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const K = hex('#141018');
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
const azar = (a, b = 0) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
const caja = (x0, y0, x1, y1, c, b = K) => { R.rect(x0, y0, x1, y1, b); R.rect(x0 + 1, y0 + 1, x1 - 1, y1 - 1, c); };
// oscurece (o aclara) una zona hacia un color, con un poco de trama: para dejar tranquila la esquina de Atom o la barra
const velo = (x0, y0, x1, y1, col, a) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) R.pset(x, y, mez(R.pget(x, y), col, a)); };
// la taza de café de Banner (5 × 5, con su asa), (x, y) arriba a la izquierda; humo: el vapor que sube
const taza = (x, y, t, humo = true) => { R.rect(x, y, x + 4, y + 5, K); R.rect(x + 1, y + 1, x + 3, y + 4, hex('#f2eee2')); R.pset(x + 1, y + 1, hex('#5a3a24')); R.pset(x + 2, y + 1, hex('#5a3a24')); R.pset(x + 3, y + 1, hex('#5a3a24'));
  R.pset(x + 5, y + 2, K); R.pset(x + 6, y + 3, K); R.pset(x + 5, y + 4, K); R.pset(x + 3, y + 4, hex('#c8c4bc'));
  if (humo) for (let k = 0; k < 3; k++) { const f = (t * 0.9 + k / 3) % 1; R.pset(Math.round(x + 2 + Math.sin(t * 3 + k * 2) * 1.2), Math.round(y - 1 - f * 7), f > 0.6 ? hex('#8a8a90') : hex('#c8c8d0')); } };
// un actor del reparto dibujado a escala (silueta en una pantalla): col(c) da el color de cada píxel
const BUFA = R.nuevo();
const actorT = (def, x, suelo, t, o, col, a) => escalado(def, x - 12, suelo - 40, 1, t, o, (c) => mez(c, col, a));
const escalado = (def, x0, y0, s, t, o, col, clip = null) => { R.recorte(null); const prev = R.usar(BUFA); BUFA.fill(0); R.actor(def, 20, 44, t, o); R.usar(prev);
  for (let j = 4; j < 46; j++) for (let i = 8; i < 44; i++) { const c = BUFA[j * 320 + i]; if (!c) continue; const cc = col ? col(c, i, j) : c; for (let a = 0; a < s; a++) for (let b = 0; b < s; b++) { const px = x0 + (i - 8) * s + a, py = y0 + (j - 4) * s + b; if (!clip || (px >= clip[0] && px <= clip[2] && py >= clip[1] && py <= clip[3])) R.pset(px, py, cc); } } };

const W = (f) => en('awaken', f), X = (f) => en('maximoff', f), Y = (f) => en('cruzada', f);
const P2 = W(0.38), P3 = W(1.003), P4 = X(0.151), P5 = X(0.439), P6 = X(0.694), P7 = Y(0), P8 = Y(0.354), P9 = Y(0.737);
const VERDE = hex('#3ae88a'), BLANCO = hex('#ffffff');
// un actor tumbado (girado 90°, la cabeza a la izquierda y la cara hacia arriba), a escala s; (cx, cy) el centro
const tumbado = (def, cx, cy, s, t, o, col = null) => { R.recorte(null); const prev = R.usar(BUFA); BUFA.fill(0); R.actor(def, 20, 44, t, o); R.usar(prev);
  for (let j = 4; j < 46; j++) for (let i = 8; i < 44; i++) { const c = BUFA[j * 320 + i]; if (!c) continue; const X0 = cx + (j - 32) * s, Y0 = cy - (i - 27) * s; for (let a = 0; a < s; a++) for (let b = 0; b < s; b++) R.pset(X0 + a, Y0 + b, col ? col(c) : c); } };
const chispas = (cx, cy, r, t, n = 10) => { for (let k = 0; k < n; k++) { const a = k * 2.4 + t * 6, rr = r * (0.6 + 0.4 * Math.sin(t * 9 + k)); R.pset(Math.round(cx + Math.cos(a) * rr), Math.round(cy + Math.sin(a) * rr * 0.7), k % 2 ? hex('#ff3a5a') : hex('#ffb0c0')); } };
// 1 · las ruinas: la luz verde; Doom llega y levanta las rocas; Wanda en el hueco
const p1 = (t) => {
  const o = { encuadre: 'ruinas', verde: tramo(t, 0.4, W(0.12)), levanta: tramo(t, W(0.206), W(0.36)) };
  T.wundagore(R, t, o);
  if (o.levanta > 0) tumbado(EL.wandaDD, 204, 147, 1, t, { dir: 1, parpadea: true, quieto: true });
  const u = tramo(t, 0.3, W(0.19)), x = Math.round(lerp(8, 118, u));
  R.actor(EL.doom, x, 160, t, { dir: 1, anda: u > 0 && u < 1, brazos: t > W(0.206) });
  T.wundagoreDelante(R, t, o);
  if (t > W(0.206)) chispas(x + 7, 132, 12, t, 8);
};
// 2 · el hueco de cerca: el resplandor verde; en «awaken» abre los ojos; fundido a negro
const p2 = (t) => {
  const golpe = W(0.641), o = { encuadre: 'ruinas', camara: 'cara', reflejo: Math.min(1, tramo(t, P2, golpe) * 0.7 + (t > golpe ? 0.3 : 0)), negro: tramo(t, W(0.876), W(0.96)) };
  T.wundagore(R, t, o);
  const abre = t > golpe, cx = 180, cy = 121, hx = cx - 20, ga = t - golpe;
  // el charco de luz verde que cae sobre ella y late (más fuerte al despertar)
  const lv = (0.25 + o.reflejo) * (0.85 + 0.15 * Math.sin(t * 3.2));
  for (let y = cy - 20; y <= cy + 20; y++) for (let x = cx - 66; x <= cx + 34; x++) { const d = ((x - cx + 16) / 50) ** 2 + ((y - cy) / 20) ** 2; if (d < 1) R.pset(x, y, mez(R.pget(x, y), hex('#8affc0'), (1 - d) * 0.32 * lv)); }
  // las piedrecillas del lecho, con su gorro de nieve: al despertar saltan con la onda
  for (let k = 0; k < 9; k++) { const a = k * 0.7 + 0.3, bx = Math.round(cx - 16 + Math.cos(a) * (40 + (k % 3) * 8)), by = Math.round(cy + Math.sin(a) * (13 + (k % 2) * 4));
    const sal = abre && ga < 1.4 ? Math.round(Math.abs(Math.sin(ga * 9 + k)) * 3 * (1 - ga / 1.4)) : 0, py = by - sal;
    if (sal) R.pset(bx, by + 1, hex('#8a90a0')); R.rect(bx - 1, py - 1, bx + 2, py + 1, K); R.rect(bx, py - 1, bx + 1, py, hex('#7a7488')); R.pset(bx, py - 1, hex('#e8f0ff')); R.pset(bx + 1, py - 1, hex('#c8d4e8')); }
  // Wanda, tumbada a escala 1 en el hueco blando de la nieve
  tumbado(EL.wandaDD, cx, cy, 1, t, { dir: 1, parpadea: !abre, sorpresa: abre, quieto: true });
  // las motas verdes que suben por el haz y los copos que caen de la abertura
  for (let k = 0; k < 16; k++) { const f = (t * (0.08 + (k % 4) * 0.02) + azar(k, 7)) % 1, x = Math.round(130 + azar(k, 8) * 70 + Math.sin(t * 1.3 + k) * 3), y = Math.round(140 - f * 120);
    R.pset(x, y, mez(R.pget(x, y), k % 3 ? VERDE : hex('#d8ffe8'), (1 - Math.abs(f - 0.5) * 2) * (0.5 + o.reflejo * 0.5))); }
  for (let k = 0; k < 12; k++) { const f = (t * (0.12 + (k % 3) * 0.03) + azar(k, 9)) % 1, x = Math.round(124 + azar(k, 10) * 80 + Math.sin(t * 2 + k * 1.7) * 4), y = Math.round(22 + f * 128); R.pset(x, y, k % 2 ? hex('#f0f4ff') : hex('#b8c4d8')); }
  // al despertar: la onda roja que corre por la nieve y las chispas de su magia junto a la cabeza
  if (abre && ga < 2.4) { const lr = Math.min(1, ga / 0.15) * (1 - Math.max(0, ga - 1.2) / 1.2); for (let y = cy - 16; y <= cy + 16; y++) for (let x = hx - 30; x <= hx + 40; x++) { const d = ((x - hx - 5) / 35) ** 2 + ((y - cy) / 16) ** 2; if (d < 1) R.pset(x, y, mez(R.pget(x, y), hex('#ff4a6a'), (1 - d) * 0.42 * lr)); } }
  if (abre && ga < 1.1) { const rr = ga / 1.1, rx = 10 + rr * 70, ry = 4 + rr * 24; for (let s = 0; s < 180; s++) { const an = s / 180 * Math.PI * 2; for (const dd of [0, 1]) { const x = Math.round(hx + Math.cos(an) * (rx + dd)), y = Math.round(cy + Math.sin(an) * (ry + dd * 0.5)); R.pset(x, y, mez(R.pget(x, y), dd ? hex('#ffb0c0') : hex('#ff2a4a'), 0.9 * (1 - rr))); } } }
  if (abre && ga < 2.4) { const n = ga < 1.6 ? 1 : 0.5; for (let k = 0; k < 22 * n; k++) { const an = k * 2.4 + t * 5, r = 8 + ((k * 7 + t * 30) % 24), x = Math.round(hx + 4 + Math.cos(an) * r), y = Math.round(cy - 2 + Math.sin(an) * r * 0.55 - (t * 20 + k * 3) % 8);
    const c = k % 3 === 0 ? hex('#ffe0e8') : k % 3 === 1 ? hex('#ff3a5a') : hex('#c8102a'); R.pset(x, y, c); if (k % 2 === 0) { R.pset(x + 1, y, c); R.pset(x, y + 1, c); R.pset(x - 1, y, hex('#8a1020')); } } }
  const f = 1 - Math.min(1, Math.abs(t - golpe) / 0.2); if (f > 0) velo(0, 0, 319, 179, hex('#d8ffe8'), f * 0.7);
  T.wundagoreDelante(R, t, o);
};
// 3 · el corcho: sale del negro y la mano clava la foto de Wanda
const foto = (r, dy, pinta) => { const [x0, y0, x1, y1] = r; caja(x0, y0 + dy, x1, y1 + dy, hex('#f6f2e6')); const a = x0 + 4, b = y0 + 4 + dy, c = x1 - 4, d = y1 - 12 + dy; pinta(a, b, c, d); };
const fotoWanda = (a, b, c, d, t) => { for (let y = b; y <= d; y++) R.linea(a, y, c, y, mez(hex('#2a1030'), hex('#8a2a4a'), (y - b) / (d - b))); for (let k = 0; k < 8; k++) R.pset(a + Math.floor(azar(k, 1) * (c - a)), b + Math.floor(azar(k, 2) * (d - b) * 0.5), hex('#ff8aa8'));
  escalado(EL.wandaDD, Math.round((a + c) / 2) - 19, d - 40, 1, t, { dir: 1, sonrisa: true }, null, [a, b, c, d]); R.recorte(null); };
const p3 = (t) => {
  const o = { encuadre: 'pared' }; const g = T.estudio(R, t, o), F = g.fotos;
  const sube = tramo(t, X(0) - 0.6, X(0) + 0.05), dy = Math.round((1 - sube) * 120);
  foto(F[0], dy, (a, b, c, d) => fotoWanda(a, b, c, d, t));
  T.estudioDelante(R, t, o);
  if (t < X(0) + 0.5) T.brazo(R, -4, Math.round(F[0][1] + dy + 54), F[0][0] - 2, Math.round(F[0][1] + dy + 32), '#2a3a5a', 1, {});
  if (sube >= 1) { const q = tramo(t, X(0) + 0.6, X(0) + 1); if (q > 0 && Math.floor(t * 3) % 3) { const [a, b, c, d] = F[3]; R.icono('?', Math.round((a + c) / 2) - 13, b + 6, hex('#e83a3a'), K, 5); } }
  const n = 1 - tramo(t, P3, P3 + 0.9); if (n > 0) velo(0, 0, 319, 179, hex('#000000'), n);
};
// el corcho de fondo para los insertos (fijo, en un búfer): la luz de la lámpara arriba a la izquierda y la sombra en
// los bordes, agujeros de chinchetas viejas y, cortados por el encuadre, otras fotos y notas clavadas
const BUFC = R.nuevo(); let corchoOK = false;
const chinche = (x, y, c) => { R.pset(x + 1, y + 2, hex('#4a2a12')); R.pset(x + 2, y + 1, hex('#4a2a12')); R.disco(x, y, 2, K); R.disco(x, y, 1, hex(c)); R.pset(x - 1, y - 1, hex('#ffffff')); };
const corcho = () => { R.recorte(null); const prev = R.usar(BUFC); const SOMB = hex('#4a2a10'), LUZ = hex('#f8d8a0');
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) { const n = azar(x, y), m = azar(x >> 2, y >> 2); let c = n > 0.93 ? hex('#7a5430') : n < 0.08 ? hex('#d8a868') : m > 0.6 ? hex('#b8864a') : hex('#c4925a');
    const d = Math.hypot((x - 120) / 240, (y - 50) / 170); R.pset(x, y, d < 0.45 ? mez(c, LUZ, (0.45 - d) * 0.5) : mez(c, SOMB, Math.min(0.55, (d - 0.45) * 0.8))); }
  for (let k = 0; k < 46; k++) { const x = Math.floor(azar(k, 11) * 318), y = 22 + Math.floor(azar(k, 12) * 156); R.pset(x, y, hex('#4a2a12')); R.pset(x, y + 1, hex('#e0b070')); }
  const sombra = (pts) => R.poligono(pts.map(([x, y]) => [x + 3, y + 3]), (x, y) => mez(R.pget(x, y), hex('#2a1608'), 0.5));
  // A · una foto vieja, un poco torcida y cortada por la izquierda: la montaña de Wundagore en sepia
  const A = [[-6, 38], [48, 32], [54, 104], [-2, 110]]; sombra(A); R.poligono(A, hex('#efe8d6')); R.linea(-6, 38, 48, 32, hex('#b8b0a0')); R.linea(48, 32, 54, 104, hex('#b8b0a0'));
  R.poligono([[-2, 42], [44, 37], [48, 90], [1, 95]], (x, y) => { const hor = 76 - x * 0.08, mo = 50 + Math.abs(x - 24) * 1.1; return y > hor ? (azar(x, y) > 0.8 ? hex('#5a3a1e') : hex('#6a4a28')) : y > mo ? (x > 24 ? hex('#4a2e16') : hex('#7a5632')) : mez(hex('#d8b888'), hex('#a88458'), (y - 38) / 40); });
  for (let x = 2; x < 44; x += 5) R.linea(x, 77 - x * 0.08, x + 2, 75 - x * 0.08, hex('#3a2410'));
  // B · una nota amarilla con trazos y un círculo rojo
  R.rect(9, 117, 41, 149, hex('#5a3418')); R.rect(6, 114, 38, 146, hex('#f0d860')); R.rect(6, 114, 38, 118, hex('#e0c040')); R.rect(6, 146, 38, 146, hex('#c8a830'));
  for (const [y, l] of [[123, 26], [129, 20], [135, 24], [141, 14]]) for (let x = 10; x < 10 + l; x++) if (azar(x, y) > 0.12) R.pset(x, y + Math.round(Math.sin(x * 1.3 + y) * 0.7), hex('#3a4a8a'));
  for (let s = 0; s < 40; s++) { const an = s / 40 * Math.PI * 2.2; R.pset(Math.round(32 + Math.cos(an) * 4), Math.round(138 + Math.sin(an) * 3), hex('#c8202a')); }
  // C · la entrada de cine con su troquel y sus barras
  R.rect(31, 155, 61, 167, hex('#5a3418')); R.rect(28, 152, 58, 164, hex('#d87a6a')); R.rect(28, 152, 58, 152, hex('#f0a090')); for (let y = 153; y < 164; y += 2) R.pset(36, y, hex('#f6f2e6'));
  for (let x = 40; x < 56; x += 2) R.rect(x, 155, x, 161 - (x % 3), hex('#5a2a2a'));
  // D · una ficha cortada por abajo
  R.rect(5, 171, 31, 179, hex('#5a3418')); R.rect(2, 168, 28, 179, hex('#ece6d6')); for (let y = 172; y < 180; y += 3) R.linea(4, y, 26, y, hex('#a8b8d8'));
  // E · una foto de la ciudad de noche, cortada por la derecha
  const E = [[264, 56], [330, 52], [330, 122], [268, 124]]; sombra(E); R.poligono(E, hex('#efe8d6')); R.linea(264, 56, 330, 52, hex('#b8b0a0'));
  R.poligono([[268, 60], [330, 57], [330, 108], [271, 110]], (x, y) => { const ed = 84 + Math.round(Math.sin(Math.floor(x / 7) * 2.1) * 10); if (y > ed) return (x % 7 > 1 && (y % 5) === 2 && azar(x >> 1, y) > 0.5) ? hex('#e8d8a0') : hex('#1a1a26'); return mez(hex('#2a2a4a'), hex('#4a4a6a'), (y - 57) / 50); });
  // G · un trozo de mapa con su ruta y su cruz, cortado por la esquina
  R.rect(295, 151, 319, 179, hex('#5a3418')); R.rect(292, 148, 319, 179, hex('#b8d0d8')); for (let k = 0; k < 4; k++) R.linea(292, 154 + k * 7, 319, 150 + k * 8, hex('#8aa8b8'));
  R.linea(296, 176, 304, 166, hex('#c8202a')); R.linea(304, 166, 312, 168, hex('#c8202a')); R.linea(310, 162, 314, 166, hex('#c8202a')); R.linea(314, 162, 310, 166, hex('#c8202a'));
  // la chincheta de cada una
  chinche(22, 40, '#e8c030'); chinche(22, 116, '#3a6ae8'); chinche(52, 154, '#3ab85a'); chinche(14, 170, '#e83a3a'); chinche(292, 60, '#e8c030'); chinche(305, 151, '#3ab85a'); chinche(40, 26, '#c8ccd8');
  R.usar(prev); corchoOK = true; };
// el hilo rojo (con su sombra), un poco combado, de chincheta en chincheta
const hilo = (pts) => { for (let i = 0; i < pts.length - 1; i++) { const [a, b] = pts[i], [c, d] = pts[i + 1], mx = (a + c) / 2, my = (b + d) / 2 + 2;
  for (const [o, col] of [[1, hex('#5a2a14')], [0, hex('#c8202a')]]) { R.linea(a + o, b + o, Math.round(mx) + o, Math.round(my) + o, col); R.linea(Math.round(mx) + o, Math.round(my) + o, c + o, d + o, col); } } };
// F · la ficha que se mueve con el aire: sus esquinas de abajo se levantan
const ficha = (t) => { const w1 = Math.max(0, Math.sin(t * 2.3) + Math.sin(t * 5.1) * 0.4), l = Math.round(w1 * 3), l2 = Math.round(w1 * 1.5);
  const P = [[262, 124], [294, 124], [294 - l2, 158 - l], [262 + l, 158 - l2]];
  R.poligono(P.map(([x, y], i) => [x + 2 + (i > 1 ? l : 0), y + 2 + (i > 1 ? l : 0)]), (x, y) => mez(R.pget(x, y), hex('#2a1608'), 0.45));
  const fondo = 158 - l; R.poligono(P, (x, y) => (x === 267 ? hex('#e88a8a') : (y - 124) % 6 === 5 && y < fondo - 1 ? hex('#a8b8d8') : y > fondo - 3 ? hex('#ddd6c4') : hex('#f6f2e6')));
  chinche(278, 126, '#e83a3a'); };
// 4 · la foto de 2015: Pietro cruza la calle a toda velocidad; en «died» se vuelve sepia
