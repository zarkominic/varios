<body>
<canvas id="lienzo"></canvas>
<script type="module">
// JH-PLATO (frases 31–32), Juegos 50 (y 75 en los cuadros de los vencedores). Cuatro planos:
// 1. los sillones del plató, con gradas de público a los lados y la primera fila abajo, focos colgados, altavoces y dos
//    cámaras de TV con su operario; suelo de tablas con brillo. Caesar habla con el micrófono; en «Caesar» se vuelve al
//    público con los brazos arriba y todos aplauden; en «interview host» cruza por delante de la mesita hasta el chico y
//    le tiende el micrófono: el chico da un respingo (salta y retrocede) y contesta; la cámara de la derecha le sigue;
// 2. (corte en «And Glenn») la avenida: Drusilla cruza abanicándose con Haymitch y Maysilee detrás, por la parte de
//    delante de la plaza (pies en y 174, las cabezas por debajo de la calzada: los aerodeslizadores nunca les pasan por
//    detrás); en «escort» se vuelve y les señala el camino; Haymitch se entretiene y ella le da un abanicazo de hollín;
// 3. (corte en «and three victors») el museo de los vencedores: tres retratos de Beetee (su taller), Wiress (su cuarto
//    de labores) y Mags (el muelle) ya mayores, de cuerpo entero; en «victors» se encienden uno a uno; dos capitolinos
//    llegan por delante del cordón y los señalan, se acercan en «Catching Fire», y en «come back» los lienzos pivotan
//    (se ve el revés de tela) y vuelven con los tres de cara, saludando; los capitolinos dan un respingo y aplauden;
// 4. (corte en «25») el cuadro de cerca (el colgador tapado: la barra del año, libre): un salón pintado con cortinas,
//    bambalina, columnas, público en gradas y focos que barren; un reloj gira hacia atrás veinticinco años (75 a 50) y
//    aparecen los tres jóvenes en sus sillas: Beetee levanta el cable que chispea, Wiress la aguja y Mags el anzuelo,
//    cada uno en su nombre; la capitolina entra, da un respingo al verlos, los señala y aplaude.
import * as T from '/atomo/plato/escenas/jh-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('jh-plato');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const mez = (c1, c2, k) => { let r = 0; for (const s of [0, 8, 16]) r |= Math.round(((c1 >>> s) & 255) * (1 - k) + ((c2 >>> s) & 255) * k) << s; return (r | 0xff000000) >>> 0; };
const hh = (a, b, c = 0) => { let n = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1274126177); n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };
const rr = (x0, y0, x1, y1, c) => { for (let y = Math.round(y0); y <= Math.round(y1); y++) for (let x = Math.round(x0); x <= Math.round(x1); x++) R.pset(x, y, c); };
const aclara = (x, y, k, col = 0xffffffff) => { const c = R.pget(x, y); if (c) R.pset(x, y, mez(c, col, k)); };
const K0 = hex('#14101c');
R.ICONOS.corazon = ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'];
R.ICONOS.nota = ['..##', '..#.', '..#.', '..#.', '###.', '###.'];
// un cono de luz desde arriba (foco): aclara lo que ya está pintado
const foco = (xc, y0, y1, w0, w1, k = 0.28, col = hex('#fff6d8')) => { for (let y = Math.max(0, y0); y <= Math.min(179, y1); y++) { const u = (y - y0) / Math.max(1, y1 - y0), w = w0 + (w1 - w0) * u; for (let x = Math.round(xc - w); x <= Math.round(xc + w); x++) aclara(x, y, Math.abs(x - xc) > w - 1.5 ? k * 0.45 : k, col); } };
// charco de luz en el suelo
const charco = (xc, yc, rx, ry, k = 0.3, col = hex('#fff6d8')) => { for (let y = Math.round(yc - ry); y <= Math.round(yc + ry); y++) for (let x = Math.round(xc - rx); x <= Math.round(xc + rx); x++) { const u = (x - xc) / rx, v = (y - yc) / ry, d = u * u + v * v; if (d <= 1) aclara(x, y, d > 0.7 ? k * 0.5 : k, col); } };
// un pájaro pequeño que vuela (alas arriba y abajo); col, colS, pico
const pajarito = (x, y, t, dir, col, colS, pico = hex('#f0b030'), aleteo = true) => {
  x = Math.round(x); y = Math.round(y); const ala = aleteo ? Math.floor(t * 12) % 2 : 1, X = (i) => x + dir * i;
  for (let i = -3; i <= 3; i++) for (let j = -2; j <= 2; j++) if (i * i / 10 + j * j / 4 <= 1) R.pset(X(i), y + j, j > 0 ? colS : col);
  for (let i = -4; i <= 4; i++) for (let j = -3; j <= 3; j++) if (i * i / 16 + j * j / 7 <= 1 && !(i * i / 10 + j * j / 4 <= 0.6)) { const c = R.pget(X(i), y + j); if (c !== col && c !== colS) R.pset(X(i), y + j, K0); }
  R.pset(X(2), y - 1, K0); R.pset(X(4), y, pico); R.pset(X(5), y, pico); R.pset(X(-4), y - 1, colS); R.pset(X(-5), y - 2, colS);
  if (ala) { R.linea(X(-1), y - 1, X(-3), y - 5, K0); R.linea(X(0), y - 1, X(-2), y - 5, colS); R.pset(X(-1), y - 4, col); }
  else { R.linea(X(-1), y + 1, X(-3), y + 4, K0); R.linea(X(0), y + 1, X(-2), y + 4, colS); }
};
// confeti que cae (fuera de la barra del año y de la esquina de Atom)
const confeti = (t, n, x0, x1, y0, y1, semilla = 1, desde = 0) => { if (t < desde) return; const cols = [hex('#ff5aa8'), hex('#3ad0c8'), hex('#ffd84a'), hex('#a86aff'), hex('#8ae04a'), hex('#ffffff')];
  for (let i = 0; i < n; i++) { const vel = 18 + hh(i, 2, semilla) * 22, x = Math.round(x0 + hh(i, 1, semilla) * (x1 - x0) + Math.sin(t * 3 + i) * 3), y = Math.round(y0 + ((hh(i, 3, semilla) * (y1 - y0) + (t - desde) * vel) % (y1 - y0)));
    if (y < 16 || (x > 274 && y < 48)) continue; const c = cols[i % 6]; R.pset(x, y, c); if (Math.floor(t * 8 + i) % 2) R.pset(x + 1, y, mez(c, K0, 0.3)); else R.pset(x, y + 1, mez(c, K0, 0.3)); } };

const c = (f) => en('caesar', f), v = (f) => en('ganadores', f);
const P2 = c(0.499), P3 = v(0), P4 = v(0.485);
const CAESAR = c(0.136), HOST = c(0.335), DRU = c(0.611), ESCORT = c(0.846);
const VICT = v(0.048), CATCH = v(0.245), BACK = v(0.345), YOUNG = v(0.572), BEETEE = v(0.712), WIRESS = v(0.791), MAGS = v(0.915);
// ── plano 1: los sillones ──
const micro = (mx, my) => { R.linea(mx, my, mx + 3, my - 3, hex('#2a2a34')); R.disco(mx + 4, my - 4, 2, K0); R.pset(mx + 4, my - 4, hex('#c8ccd8')); R.pset(mx + 3, my - 5, hex('#ffffff')); };
const oscurece = (x, y, k) => aclara(x, y, k, K0);
// una cámara de televisión en su pedestal (x = centro del pedestal, base = y de las ruedas; dir hacia donde apunta)
const camaraTV = (x, base, dir, t, graba) => {
  const g1 = hex('#2a2834'), g2 = hex('#4a4858'), g3 = hex('#7a7890'), X = (i) => x + dir * i;
  // pie de tres ruedas y columna telescópica
  R.linea(x - 8, base - 2, x + 8, base - 2, g1); R.linea(x - 7, base - 3, x + 7, base - 3, g2);
  for (const dx of [-8, 0, 8]) { R.disco(x + dx, base, 1, K0); R.pset(x + dx, base - 1, g3); }
  rr(x - 1, base - 16, x + 1, base - 3, g2); R.linea(x - 1, base - 16, x - 1, base - 3, g3); R.linea(x + 1, base - 16, x + 1, base - 3, g1);
  rr(x - 2, base - 10, x + 2, base - 9, g1);
  // el cuerpo, el objetivo con su parasol, el visor y el piloto rojo
  const yb = base - 27; rr(Math.min(X(-8), X(8)), yb, Math.max(X(-8), X(8)), yb + 10, g2); R.linea(Math.min(X(-8), X(8)), yb, Math.max(X(-8), X(8)), yb, g3); R.linea(Math.min(X(-8), X(8)), yb + 10, Math.max(X(-8), X(8)), yb + 10, K0);
  for (let i = -6; i <= 4; i += 3) R.pset(X(i), yb + 5, g1);
  rr(Math.min(X(9), X(15)), yb + 2, Math.max(X(9), X(15)), yb + 8, g1); rr(Math.min(X(16), X(17)), yb + 1, Math.max(X(16), X(17)), yb + 9, K0);
  R.pset(X(16), yb + 4, hex('#6ab0ff')); R.pset(X(16), yb + 5, hex('#c8e4ff'));
  rr(Math.min(X(-10), X(-12)), yb + 1, Math.max(X(-10), X(-12)), yb + 6, K0); R.pset(X(-11), yb + 3, hex('#4ac8ff'));
  rr(Math.min(X(-4), X(2)), yb - 3, Math.max(X(-4), X(2)), yb - 1, g1); R.pset(X(-2), yb - 2, g3);
  if (graba && Math.floor(t * 2) % 2 === 0) { R.pset(X(6), yb - 2, hex('#ff3a3a')); R.pset(X(6), yb - 3, hex('#ffb0b0')); }
  // el asa con la que la mueve el operario
  R.linea(X(-8), yb + 8, X(-14), yb + 12, g3);
  return [X(-14), yb + 12];
};
// un altavoz colgado (x0, y0 esquina) con los conos que laten
const altavoz = (x0, y0, t, k) => {
  rr(x0, y0, x0 + 14, y0 + 26, hex('#1c1a24')); R.linea(x0, y0, x0 + 14, y0, hex('#4a4858')); R.linea(x0, y0, x0, y0 + 26, hex('#3a3846'));
  for (let y = y0 + 2; y < y0 + 25; y += 2) for (let x = x0 + 1; x < x0 + 14; x += 2) R.pset(x, y, hex('#24222e'));
  const late = Math.sin(t * 9 + k) > 0.2 ? 1 : 0;
  R.disco(x0 + 7, y0 + 8, 4 + late, hex('#2e2c38')); R.disco(x0 + 7, y0 + 8, 2, hex('#5a5868')); R.pset(x0 + 6, y0 + 7, hex('#9a98a8'));
  R.disco(x0 + 7, y0 + 19, 3, hex('#2e2c38')); R.disco(x0 + 7, y0 + 19, 1, hex('#5a5868'));
  R.linea(x0 + 3, y0 - 1, x0 + 3, y0 - 6, hex('#5a5868')); R.linea(x0 + 11, y0 - 1, x0 + 11, y0 - 6, hex('#5a5868'));
};
// un foco de escenario colgado de la barra (apunta hacia (tx, ty)); el haz aclara lo pintado
const focoBarra = (x, y, tx, ty, col, on = 1) => {
  R.disco(x, y + 3, 3, hex('#2a2834')); R.disco(x, y + 3, 2, hex('#4a4858')); R.linea(x, y - 1, x, y, hex('#7a7890'));
  const a = Math.atan2(ty - y, tx - x), bx = Math.round(x + Math.cos(a) * 4), by = Math.round(y + 3 + Math.sin(a) * 4);
  R.disco(bx, by, 1, col); R.pset(bx, by, hex('#ffffff'));
  if (on > 0) for (let s = 6; s < Math.hypot(tx - x, ty - y); s += 1) { const px = x + Math.cos(a) * s, py = y + 3 + Math.sin(a) * s, w = s * 0.18;
    for (let d = -w; d <= w; d += 1) { const qx = Math.round(px - Math.sin(a) * d), qy = Math.round(py + Math.cos(a) * d); if (qy > 15 && !(qx > 276 && qy < 46)) aclara(qx, qy, 0.12 * on * (1 - s / 220), col); } }
};
// el público de las gradas (bustos con pelucas de colores); ap 0–1: cuánto aplaude
const PELUCAS = [['#ff5aa8', '#c83a80', '#3ad0c8'], ['#3ad0c8', '#249a94', '#ff8ad8'], ['#ffd84a', '#c8a020', '#a86aff'], ['#a86aff', '#7a44c8', '#8ae04a'], ['#8ae04a', '#5aa82a', '#ff5aa8'], ['#ff8a3a', '#c85a1a', '#ffd84a']];
const TIPOS = ['peluca', 'mujer', 'rizos', 'calvo', 'peluca', 'rizos'];
const publico = (x, y, t, i, ap) => {
  const [c1, c2, pelo] = PELUCAS[i % 6], palma = ap > 0.6 && Math.floor(t * 7 + i * 1.7) % 2 === 0;
  const by = y - (ap > 0.6 && Math.floor(t * 5 + i) % 3 === 0 ? 1 : 0);
  R.busto(TIPOS[i % 6], T.tela(c1, c2, { H: pelo, V: pelo }), x, by, t + i * 0.37, { rie: ap > 0.6, saluda: ap > 0.6 && i % 4 === 1 });
  if (palma) { R.pset(x + 3, by + 9, hex('#f0c8a0')); R.pset(x + 5, by + 9, hex('#f0c8a0')); R.pset(x + 4, by + 7, hex('#fff4b0')); }
};
// las gradas de un lado (x0–x1, de y0 a y1): escalones con canto dorado y tres filas de público
const grada = (x0, x1, y0, t, ap, semilla) => {
  for (let f = 0; f < 3; f++) { const y = y0 + f * 14;
    for (let yy = y + 11; yy <= y + 14; yy++) for (let x = x0; x <= x1; x++) R.pset(x, yy, yy === y + 11 ? hex('#e8b830') : ((x + yy) % 4 ? hex('#3a1a4a') : hex('#2a1238')));
    for (let x = x0 + 1 + (f % 2) * 5, i = 0; x + 9 <= x1; x += 11, i++) publico(x, y, t, i + f * 3 + semilla, ap); }
};
const ELIP = (x, y) => ((x - 160) / 151) ** 2 + ((y - 157.5) / 14.5) ** 2;
const p1 = (t) => {
  const ap = t > CAESAR + 0.2 && t < HOST ? 1 : 0.35;
  T.capitolio(R, t, { encuadre: 'plato', camara: 'sillones', aplausos: ap });
  T.tinte(R, 16, 179, [90, 20, 70], 0.12);
  // el suelo del escenario, fuera de la alfombra: tablas con juntas, clavos y el brillo de los focos que corre
  for (let y = 150; y < 180; y++) for (let x = 0; x < 320; x++) { if (ELIP(x, y) < 1.04) continue;
    const fila = Math.floor((y - 150) / 5), jx = (x + fila * 23) % 38;
    if ((y - 150) % 5 === 0) oscurece(x, y, 0.45); else if (jx === 0) oscurece(x, y, 0.35); else if (jx === 3 && (y - 150) % 5 === 2) aclara(x, y, 0.4, hex('#c8b0e0'));
    else if ((y - 150) % 5 === 1) aclara(x, y, 0.1, hex('#e0c8ff'));
    const b = (x + y * 2 - t * 60) % 160; if (b > 0 && b < 6) aclara(x, y, 0.18, hex('#fff6d8')); }
  // cables por el suelo, de las cámaras a los lados
  R.linea(0, 172, 30, 168, K0); R.linea(30, 168, 52, 170, K0); R.linea(52, 170, 60, 166, K0);
  R.linea(319, 171, 290, 168, K0); R.linea(290, 168, 268, 170, K0); R.linea(268, 170, 262, 166, K0);
  // la barra de focos de la izquierda (lejos del año) y los altavoces
  rr(0, 17, 60, 18, hex('#5a5868')); R.linea(0, 17, 60, 17, hex('#8a88a0')); for (let x = 2; x < 60; x += 6) R.pset(x, 18, hex('#2a2834'));
  focoBarra(14, 19, 118, 132, hex('#ff8ad8'), 0.8 + 0.2 * Math.sin(t * 3)); focoBarra(44, 19, 212, 130, hex('#8ae8ff'), 0.8 + 0.2 * Math.sin(t * 3 + 2));
  altavoz(4, 52, t, 0); altavoz(301, 92, t, 2);
  rr(296, 120, 319, 144, hex('#1c1a24')); R.linea(296, 120, 319, 120, hex('#4a4858'));
  for (const yy of [126, 138]) { R.disco(307, yy, 4 + (Math.sin(t * 9 + yy) > 0.2 ? 1 : 0), hex('#2e2c38')); R.disco(307, yy, 2, hex('#5a5868')); }
  // las gradas de los dos lados, con su público
  grada(0, 54, 86, t, ap, 0); grada(262, 296, 92, t, ap, 7);
  // los cámaras: el de la izquierda, delante del micrófono de pie, sigue a Caesar; el de la derecha, al chico
  const sig = Math.round(tramo(t, HOST - 1.0, HOST - 0.3) * 6);
  R.actor(EL.capitolino1, 32, 168, t, { dir: 1, sostiene: [47, 152] }); camaraTV(62, 168, 1, t, true);
  R.actor(EL.capitolino2, 274 + sig, 168, t, { dir: -1, sostiene: [267 + sig, 152] });
  camaraTV(252 + sig, 168, -1, t, t > HOST - 0.6);
  // Caesar: habla al público con el micrófono; en «Caesar» se vuelve con los brazos arriba; luego cruza por delante de la
  // mesita hasta el chico y le tiende el micrófono
  const ta = t > CAESAR + 0.15 && t < CAESAR + 0.95, va = tramo(t, CAESAR + 1.0, HOST - 0.35), tiende = t > HOST - 0.35;
  const xc = Math.round(lerp(112, 184, va)), yc = Math.round(lerp(158, 164, va));
  const ca = R.actor(EL.caesar, xc, yc, t, { dir: ta ? -1 : 1, brazos: ta, anda: va > 0 && va < 1, sostiene: tiende ? [207, 141] : undefined, sonrisa: true, habla: !ta && !tiende && va === 0 && Math.sin(t * 9) > 0 });
  if (tiende || ta) micro(ca.mano[0], ca.mano[1]);
  // el chico: se sobresalta (un salto y un paso atrás) y luego contesta
  const sus = tramo(t, HOST - 0.3, HOST + 0.4), salta = sus > 0 && sus < 1, contesta = t > HOST + 0.4 && t < P2;
  R.actor(EL.tributoChico, 208 + Math.round(sus * 3), 158, t, { dir: -1, sorpresa: salta, salto: salta ? Math.round(Math.sin(sus * Math.PI) * 6) : 0, habla: contesta && Math.sin(t * 11) > 0, sonrisa: t < HOST - 0.3 });
  if (salta) { R.icono('!', 216, 106, hex('#ffffff'), K0, 1); for (const [dx, dy] of [[-3, 0], [17, 2], [-1, -6], [16, -5]]) R.pset(208 + dx, 128 + dy - Math.round(sus * 3), hex('#ffffff')); }
  if (ta) for (let i = 0; i < 8; i++) { const an = i / 8 * Math.PI * 2, r = 12 + tramo(t, CAESAR + 0.15, CAESAR + 0.6) * 10; R.pset(Math.round(119 + Math.cos(an) * r), Math.round(118 + Math.sin(an) * r * 0.7), hex('#fff4b0')); }
  confeti(t, 24, 40, 270, 18, 170, 5, CAESAR + 0.2);
  // la primera fila del público, abajo, por delante de todo (aplaude con los demás)
  for (let i = 0, x = 1; x < 316; x += 12, i++) publico(x, 168 + (i % 2), t, i + 2, ap);
};
// ── plano 2: la avenida ──
const hollin = (x, y, f) => { for (let i = 0; i < 9; i++) { const an = i * 0.7, r = 2 + f * (6 + i); R.pset(Math.round(x + Math.cos(an) * r), Math.round(y + Math.sin(an) * r * 0.6 - f * 6), mez(hex('#3a3a40'), hex('#8a8a90'), f)); } };
const p2 = (t) => {
  T.capitolio(R, t, { encuadre: 'avenida' });
  // los tres van por la parte de delante de la plaza (pies en y 174): las cabezas, y el sombrero de Drusilla, quedan por
  // debajo de la calzada (y 123–139) y los aerodeslizadores nunca les pasan por detrás
  const SU = 174;
  const llega = tramo(t, P2 + 0.05, DRU - 0.05), xd = Math.round(lerp(300, 168, llega));
  const vuelve = t > ESCORT - 0.2 && t < ESCORT + 0.9, sacude = t > ESCORT + 0.3 && t < ESCORT + 0.9;
  const sale = tramo(t, ESCORT + 1.0, P3 + 0.2), off = lerp(0, -200, sale);
  const xh = Math.round(lerp(340, 214, tramo(t, P2 + 0.4, DRU + 0.3)) + off), xm = Math.round(lerp(360, 240, tramo(t, P2 + 0.6, DRU + 0.5)) + off);
  const andH = (t > P2 + 0.4 && t < DRU + 0.3) || (sale > 0 && sale < 1), mirando = t > DRU + 0.5 && t < ESCORT + 0.3;
  R.actor(EL.maysilee, xm, SU, t, { dir: sale > 0 ? -1 : -1, anda: (t > P2 + 0.6 && t < DRU + 0.5) || (sale > 0 && sale < 1), enfado: t > DRU + 0.5 && t < ESCORT + 1 });
  R.actor(EL.haymitch, xh, SU, t, { dir: mirando ? 1 : -1, anda: andH, sorpresa: sacude, sonrisa: mirando, salto: sacude ? Math.round(Math.sin((t - ESCORT - 0.3) / 0.6 * Math.PI) * 4) : 0 });
  if (sacude) hollin(xh + 7, 158, tramo(t, ESCORT + 0.3, ESCORT + 0.9));
  R.actor(EL.drusilla, Math.round(xd + off), SU, t, { dir: vuelve ? 1 : -1, anda: (llega > 0 && llega < 1) || (sale > 0 && sale < 1), dedo: vuelve && !sacude, enfado: vuelve });
  if (vuelve && !sacude) R.icono('!', Math.round(xd + off) + 6, 120, hex('#ffd84a'), K0, 1);
};
// ── plano 3: el museo de los vencedores ──
const viejo = { H: hex('#b8b8c0'), h: hex('#e0e0e6') };
// cada retrato lleva su sitio pintado detrás; todo se queda dentro del hueco del cuadro (Pc comprueba el borde)
