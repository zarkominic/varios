<script type="module">
// VD-DIOS (frases 31–33), sin cartela; año 2015 desde «2015». Catorce planos, cortados en la palabra inglesa:
// 1. «Years later, in 2015» el cielo de las dos Tierras: sobre la ciudad en ruinas baja otra Tierra; Doom entra por la
//    almena y en «everything» alza los brazos con chispas verdes;
// 2. «because the universes destroy» el espacio: las dos Tierras chocan en «destroy» (destello, anillo, trozos); en
//    «steals the power» los seres de luz del fondo (capucha y manto con pliegues, núcleo que late, halo tramado) vierten
//    su luz en Doom con hilos y chispas que caen hacia él, que crece en su roca; en «beings» se deshacen en chispas;
// 3. «gathers the pieces» el planeta cosido (battleworld planeta sin mirador): los retales vuelan hacia él; en
//    «stitches» Doom tira de hilos de oro y la costura brilla; Atom luciérnaga se sorprende;
// 4. «where he rules as a god» el país de retales: la procesión con banderas verdes sube hacia la estatua de oro; en
//    «god» se enciende su halo y todos inclinan la cabeza;
// 5. «at last the greatest» GAG DEL TRONO: Atom salta al cojín del trono, alza los brazos en «greatest» y le cuelgan
//    las piernas sin llegar al escabel; en «no one to contradict» mira a los lados: nadie;
// 6. «And it's then» el mirador (planeta/general): se abre un portal azul; en «Reed» sale Reed y anda hacia Doom, que se
//    vuelve en «reach»;
// 7. «and it's Doom who asks» el trono (planeta/trono): Doom sentado con su halo, mirando a Reed, que avanza hacia la
//    escalinata; en «asks» nace el «?» de luz sobre Doom y baja en curva hasta quedar entre los dos (x 116, y 102); en
//    «avoiding» Doom se vuelve y baja la cabeza, y Reed sube hasta el pie del primer escalón (x 122, suelo 154);
// 8. «Whether Reed, with that power» inserto: el brazo del trono con la esfera del poder, ventanales con nebulosa y
//    estrellas que titilan, un haz de luz con polvo y el zócalo tallado (friso de grecas, tres paneles con medallón) que
//    recoge el brillo de la esfera; el brazo de Reed entra; la esfera vuela a su mano y en «better» se cura;
// 9. «Reed tells him yes» el rosetón con el planeta: Reed asiente en «yes», señala en «knows it»; en «the God» Doom
//    alza los brazos con un destello; en «never admitted» le da la espalda y se aleja;
// 10. «falls silent» la sala de lejos: Doom en su trono; en «admits» baja la cabeza y el halo se deshace en chispas, y
//    los dos guardias se sorprenden; en «right» se dan la vuelta y se van por detrás de las columnas; en «loses
//    everything» los braseros se apagan de atrás adelante y la sala se enfría;
// 11. «it's Reed, his worst enemy» el árbol de luz: Doom con la cabeza baja; Reed alza la mano; en «heals» los anillos
//    de luz van a su cara y la máscara se ilumina;
// 12. «Doom takes off his mask» el espejo de oro: Doom de espaldas se lleva las manos a la cara y en «mask» se la quita
//    (la máscara en la mano); el espejo se llena de luz; brilla en «scars»; un destello naranja en «explosion»; Atom,
//    con su máscara pequeña, mira desde el candelabro;
// 13. «and laughs with joy» GAG DE LA RISA: el arco al planeta; Doom de espaldas, sin capucha, se ríe (los hombros se
//    agitan); Atom se quita su máscara pequeña en «joy» y se ríe con él; en «young man» el bocadillo: Victor joven con
//    la maleta llega en barco;
// 14. «But the wounds» la mesa: la máscara en su cojín; en «wounds» se apaga una vela; en «iron mask» la sombra de Doom
//    sube por la pared, la máscara vuela a su cara y en «back» se encienden los ojos verdes.
import * as T from '/atomo/plato/escenas/vd-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('vd-dios');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const VD = T.VD, K = hex('#160f1c'), H = (s) => hex(s), ease = (u) => u * u * (3 - 2 * u), cl = (u) => Math.max(0, Math.min(1, u));
const lin = (t, a, b) => cl((t - a) / Math.max(1e-6, b - a));
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], bay = (x, y) => (B4[((y & 3) << 2) | (x & 3)] + 0.5) / 16;
const hh = (x, y, k = 0) => { const v = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return v - Math.floor(v); };
const vn = (x, y, k = 0) => { const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const a = hh(xi, yi, k), b = hh(xi + 1, yi, k), c = hh(xi, yi + 1, k), d = hh(xi + 1, yi + 1, k); return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy; };
const rgb = (c) => [c & 255, (c >> 8) & 255, (c >> 16) & 255];
const mez = (a, b, u) => { u = cl(u); const A = rgb(a), B = rgb(b); return (0xff000000 | (Math.round(A[2] + (B[2] - A[2]) * u) << 16) | (Math.round(A[1] + (B[1] - A[1]) * u) << 8) | Math.round(A[0] + (B[0] - A[0]) * u)) >>> 0; };
const lum = (c) => 0.3 * (c & 255) + 0.59 * ((c >> 8) & 255) + 0.11 * ((c >> 16) & 255);
const voz = (t) => E.energia(t);
const CACHE = new Map();
const horno = (k, f) => { if (!CACHE.has(k)) { const b = R.nuevo(), prev = R.usar(b); f(); R.usar(prev); CACHE.set(k, b); } return CACHE.get(k); };
const ps = (x, y, c) => R.pset(Math.round(x), Math.round(y), c);
const MK = 0xff00ff01 >>> 0, TMP = R.nuevo();
const aparte = (f) => { TMP.fill(MK); const prev = R.usar(TMP); const r = f(); R.usar(prev); return r; };
// una capa con huecos (MK): se hornea una vez y se pone encima
const capa = (k, f) => horno(k, () => { R.buf.fill(MK); f(); });
const poner = (b) => { const B = R.buf; for (let i = 0; i < 57600; i++) { const c = b[i]; if (c !== MK) B[i] = c; } };
// el decorado del planeta cosido, pintado aparte para verlo por un hueco
const BW = R.nuevo();
const planetaEn = (t, dentro) => { const prev = R.usar(BW); T.battleworld(R, t, { encuadre: 'planeta', camara: 'general', mirador: false }); R.usar(prev);
  const B = R.buf; for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) if (dentro(x, y)) B[y * 320 + x] = BW[y * 320 + x]; };
// todo el lienzo hacia un tono (u 0–1)
const tenir = (col, u) => { if (u <= 0) return; const B = R.buf; for (let i = 0; i < 57600; i++) B[i] = mez(B[i], col, u * (0.55 + 0.45 * lum(B[i]) / 255)); };
const rampa = (x0, y0, x1, y1, cs) => { const n = cs.length - 1; for (let y = y0; y <= y1; y++) { const f = (y - y0) / Math.max(1, y1 - y0) * n, i = Math.min(n - 1, Math.floor(f)), u = f - i; for (let x = x0; x <= x1; x++) R.pset(x, y, u > bay(x, y) ? cs[i + 1] : cs[i]); } };
const luz = (cx, cy, rx, ry, col, a) => { for (let y = Math.max(0, Math.floor(cy - ry)); y <= Math.min(179, cy + ry); y++) for (let x = Math.max(0, Math.floor(cx - rx)); x <= Math.min(319, cx + rx); x++) { const d = Math.hypot((x - cx) / rx, (y - cy) / ry); if (d >= 1) continue; const g = (1 - d) * a; if (g > bay(x, y) * 0.35) R.pset(x, y, mez(R.pget(x, y), col, Math.min(1, g))); } };
const bloques = (x0, y0, x1, y1, [cL, c, cS], k = 0, w = 16, h = 8) => { for (let y = y0; y <= y1; y++) { const fila = Math.floor((y - y0) / h), off = fila % 2 ? w / 2 : 0, jy = (y - y0) % h;
  for (let x = x0; x <= x1; x++) { const bx = Math.floor((x - x0 + off) / w), jx = (x - x0 + off) % w; let col;
    if (jy === h - 1 || jx === w - 1) col = cS; else if (jy === 0 || jx === 0) col = cL; else { col = c; const q = hh(bx, fila, k); if (q > 0.72) col = mez(c, cS, 0.22); else if (q < 0.18) col = mez(c, cL, 0.2); if (hh(x, y, k + 3) > 0.94) col = mez(col, cS, 0.45); }
    R.pset(x, y, col); } } };
const filo = (pts, col) => { for (let i = 0; i < pts.length - 1; i++) R.linea(Math.round(pts[i][0]), Math.round(pts[i][1]), Math.round(pts[i + 1][0]), Math.round(pts[i + 1][1]), col); };
const nube = (x, y, w, tono) => { x = Math.round(x); y = Math.round(y); const n = Math.max(3, Math.round(w / 9));
  const d = (cx, cy, r, c) => { for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) if (i * i + j * j <= r * r + r) R.pset(cx + i, cy + j, c); };
  for (let k = 0; k < n; k++) d(x + Math.round((k + 0.5) * w / n), y + 2, Math.round(w / n * (0.62 + 0.3 * Math.sin(k * 2.3 + w))), tono[2]);
  for (let k = 0; k < n; k++) d(x + Math.round((k + 0.5) * w / n) - 1, y, Math.round(w / n * (0.55 + 0.3 * Math.sin(k * 2.3 + w))), tono[1]);
  for (let k = 1; k < n - 1; k++) d(x + Math.round((k + 0.3) * w / n) - 1, y - 2, Math.max(1, Math.round(w / n * (0.42 + 0.3 * Math.sin(k * 1.7 + w)))), tono[0]); };
const esquina = (col, x0 = 236, y1 = 70) => { for (let y = 0; y < y1; y++) for (let x = x0; x < 320; x++) { const f = cl((x - x0) / 40) * cl((y1 - y) / 28); if (f > 0) R.pset(x, y, mez(R.pget(x, y), col, f * 0.8)); } };
const libre = (x, y) => !(x > 274 && y < 48) && !(x > 16 && x < 174 && y < 22);
const estrellas = (x0, y0, x1, y1, n, k, t, ok = () => true) => { for (let i = 0; i < n; i++) { const x = Math.round(x0 + hh(i, 1, k) * (x1 - x0)), y = Math.round(y0 + hh(i, 2, k) * (y1 - y0)); if (!libre(x, y) || !ok(x, y)) continue;
  const b = Math.sin(t * (1.5 + hh(i, 3, k) * 3) + i) > 0.6; R.pset(x, y, b ? H('#ffffff') : hh(i, 4, k) > 0.5 ? H('#a8b0e0') : H('#7880b0')); if (b && hh(i, 5, k) > 0.8) { R.pset(x - 1, y, H('#8890c8')); R.pset(x + 1, y, H('#8890c8')); } } };
const pajaro = (x, y, t, col) => { x = Math.round(x); y = Math.round(y); const a = Math.floor(t * 9 + x) % 2; R.pset(x, y, col); R.pset(x + 1, y, col); R.pset(x + 2, y - 1 + a * 2, col); R.pset(x - 1, y - 1 + a * 2, col); R.pset(x + 3, y - 2 + a * 3, col); R.pset(x - 2, y - 2 + a * 3, col); };
const llama = (x, y, t, s = 1, k = 0) => { const h = (5 + Math.sin(t * 13 + k) * 1.2) * s, w = 2.2 * s;
  for (let j = 0; j < h; j++) { const u = j / h, a = w * (1 - u) * (0.6 + 0.4 * Math.sin(u * 3)), dx = Math.sin(t * 9 + j * 0.6 + k) * u * s; for (let i = -a; i <= a; i++) { const c = Math.abs(i) < a * 0.45 && u < 0.6 ? H('#fff4b0') : Math.abs(i) < a * 0.75 ? H('#f8b030') : H('#e0502a'); ps(x + i + dx, y - j, c); } } };
const chispas = (x, y, t, n, alto, k = 0, cs = [H('#fff0a0'), H('#f8a030'), H('#c04a2a')]) => { for (let i = 0; i < n; i++) { const ph = (t * (0.6 + hh(i, 2, k) * 0.5) + hh(i, 1, k)) % 1, X = x + (hh(i, 3, k) - 0.5) * 14 + Math.sin(t * 3 + i) * 3 * ph, Y = y - ph * alto; if (ph < 0.9) ps(X, Y, ph < 0.3 ? cs[0] : ph < 0.6 ? cs[1] : cs[2]); } };
const humo = (x, y, t, n, k = 0) => { for (let i = 0; i < n; i++) { const ph = (t * 0.5 + i / n) % 1, X = x + Math.sin(t * 1.5 + i * 2 + k) * 3 * ph, Y = y - ph * 22; if (ph < 0.85 && (1 - ph) > bay(Math.round(X), Math.round(Y)) * 0.8) { ps(X, Y, ph < 0.4 ? H('#8a8a98') : H('#5a5a68')); if (ph > 0.3) ps(X + 1, Y, H('#6a6a78')); } } };

// ── el oro y las piezas de la sala ──
const ORO = [H('#fff6d0'), H('#f4d878'), H('#d8a840'), H('#a87828'), H('#6a4818'), H('#3a2610')];
const VERDE = [H('#5ac87a'), H('#2e8a4a'), H('#1e6a36'), H('#124422')];
const columna = (x0, x1, y0, y1, P = ORO) => { const w = x1 - x0;
  for (let y = y0 + 4; y <= y1 - 4; y++) for (let x = x0 + 1; x <= x1 - 1; x++) { const u = (x - x0) / w, f = (x - x0) % 4 === 0; let c = u < 0.25 ? P[1] : u < 0.6 ? P[2] : u < 0.85 ? P[3] : P[4]; if (f) c = mez(c, P[5], 0.35); if (hh(x, y, 7) > 0.96) c = P[0]; R.pset(x, y, c); }
  R.rect(x0 - 2, y0, x1 + 2, y0 + 3, P[3]); R.rect(x0 - 2, y0, x1 + 2, y0, P[1]); R.rect(x0 - 1, y0 + 2, x1 + 1, y0 + 3, P[4]);
  R.rect(x0 - 2, y1 - 3, x1 + 2, y1, P[3]); R.rect(x0 - 2, y1 - 3, x1 + 2, y1 - 3, P[1]); R.rect(x0 - 2, y1, x1 + 2, y1, P[5]);
  R.linea(x0, y0 + 4, x0, y1 - 4, P[5]); R.linea(x1, y0 + 4, x1, y1 - 4, P[5]); };
const brasero = (x, yb, t, on = 1, s = 1, k = 0) => { x = Math.round(x); yb = Math.round(yb); const w = Math.round(6 * s), h = Math.max(2, Math.round(4 * s));
  R.rect(x - Math.round(w * 0.5), yb - 1, x + Math.round(w * 0.5), yb, ORO[4]); R.rect(x - 1, yb - Math.round(7 * s), x + 1, yb - 1, ORO[3]); R.pset(x - 1, yb - Math.round(7 * s), ORO[1]);
  R.poligono([[x - w, yb - Math.round(8 * s) - h], [x + w, yb - Math.round(8 * s) - h], [x + w - 2, yb - Math.round(8 * s)], [x - w + 2, yb - Math.round(8 * s)]], (X, Y) => X < x - w * 0.3 ? ORO[1] : X < x + w * 0.4 ? ORO[2] : ORO[3]);
  R.linea(x - w, yb - Math.round(8 * s) - h, x + w, yb - Math.round(8 * s) - h, ORO[0]);
  if (on > 0) { luz(x, yb - Math.round(12 * s), 18 * s, 14 * s, H('#f8c060'), 0.32 * on); llama(x, yb - Math.round(9 * s) - h, t, 1.4 * s * on, k); if (on > 0.6) chispas(x, yb - Math.round(14 * s), t, Math.round(4 * s), 18 * s, k); }
  else humo(x, yb - Math.round(9 * s) - h, t, 6, k); };
// una esfera: 'tierra' (mares, tierras y hielo) o 'cosido' (retales con costuras de oro); o.cura 0–1 borra las costuras
const SEM = Array.from({ length: 16 }, (_, i) => { const lo = hh(i, 1, 9) * 6.28, la = (hh(i, 2, 9) - 0.5) * 2.6; return [Math.cos(la) * Math.sin(lo), Math.sin(la), Math.cos(la) * Math.cos(lo)]; });
const RETAL = [[H('#e8c070'), H('#c89a48'), H('#8a6a30')], [H('#e8f0f8'), H('#a8c0d8'), H('#6a88a8')], [H('#4aa85a'), H('#2a7a3a'), H('#1a4a26')], [H('#9a9aa8'), H('#6a6a7a'), H('#3a3a4a')],
  [H('#4a8ad8'), H('#2a5aa8'), H('#1a3470')], [H('#c85a3a'), H('#8a3a2a'), H('#4a1a14')], [H('#a88ae0'), H('#7a5ab8'), H('#4a3480')], [H('#8ac85a'), H('#5a9a3a'), H('#3a6a26')]];
const TIERRA = { mar: [H('#5a9ae8'), H('#2a6ac0'), H('#173c80')], tie: [H('#8ad06a'), H('#4a9a4a'), H('#2a5a30')], hie: [H('#ffffff'), H('#d8e4f0'), H('#98a8c0')] };
const esfera = (cx, cy, r, rot, tipo, o = {}) => { const cura = o.cura ?? 0, k = o.k ?? 0;
  for (let dy = -Math.ceil(r) - 2; dy <= r + 2; dy++) for (let dx = -Math.ceil(r) - 2; dx <= r + 2; dx++) { const X = Math.round(cx + dx), Y = Math.round(cy + dy); if (X < 0 || X > 319 || Y < 0 || Y > 179) continue;

// un trozo de mundo que vuela (cuadrilátero girado) con su filo
const esquirla = (x, y, s, a, col, borde) => { const p = [[-1, -0.6], [0.9, -0.8], [1, 0.7], [-0.7, 0.9]].map(([u, v]) => [x + (u * Math.cos(a) - v * Math.sin(a)) * s, y + (u * Math.sin(a) + v * Math.cos(a)) * s]); R.poligono(p, col); if (borde) filo([...p, p[0]], borde); };

const pregunta = (x, y, t, a = 1, esc = 3) => { if (a <= 0) return; const cx = x + esc * 2.5, cy = y + esc * 3.5; luz(cx, cy, 8 * esc * a, 8 * esc * a, H('#fff2c0'), 0.45 * a); const c = mez(H('#f4c860'), H('#ffffff'), 0.5 + 0.5 * Math.sin(t * 6));

// un personaje que asiente: se pinta aparte y la cabeza baja d px
const asiente = (def, x, suelo, t, o, d) => { if (!d) return R.actor(def, x, suelo, t, o); const r = aparte(() => R.actor(def, x, suelo, t, o)); const cue = suelo - def.altoCuerpo, B = R.buf;
