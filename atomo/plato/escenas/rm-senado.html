<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Senado · ep5</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// RM-SENADO (frase 16). El Senado por dentro: gradas llenas de ancianos con toga que discuten a la vez; por las
// ventanas altas, el sol cruza deprisa (pasan horas) y en la caja un reloj de arena se da la vuelta.
import { preparar, rodar } from '/atomo/plato/escenas/rm-comun.js';
const { E, R, M } = await preparar('rm-senado');
const { PALA, PR, ELENCO, tramo } = R;
const sen = (t) => {
  for (let y = 0; y < 90; y++) for (let x = 0; x < R.W; x++) R.pset(x, y, R.tone(PALA.MARMOL, 1.2 + y * 0.012 + ((x % 40 < 2) ? -0.8 : 0), x, y));
  const sx = 20 + ((t * 40) % 300), cielo = Math.floor(((t * 40) % 300) / 100);
  for (const wx of [60, 160, 260]) { R.rect(wx - 14, 16, wx + 14, 50, [PR.DIA[2], PR.TARDE[3], PR.TARDE[1]][cielo]); if (Math.abs(sx - wx) < 14) R.disco(sx, 30, 5, PR.SOL[0]); R.rect(wx - 15, 15, wx + 15, 16, PALA.MARMOL[1]); R.rect(wx - 1, 16, wx + 1, 50, PALA.MARMOL[2]); }
  for (let g = 0; g < 4; g++) {
    const y = 96 + g * 22;
    R.rect(0, y, R.W, y + 22, PALA.MARMOL[2 - (g & 1)]); R.rect(0, y, R.W, y + 1, PALA.MARMOL[3]);
    for (let k = 0; k < 9; k++) {
      const x = 22 + k * 36 + (g & 1) * 18, i = g * 9 + k;
      const pelo = [PALA.PELO_BLANCO, PALA.PELO_BLANCO, PALA.PELO_CASTANO][i % 3];
      R.personaje(x, y + 16, 28, { ...ELENCO.senador, pelo, peinado: i % 4 === 0 ? 'calvo' : 'corto', barba: i % 5 === 0 ? 'poblada' : 'no', t: t + i, dir: k % 2 ? -1 : 1, pose: Math.sin(t * 2 + i) > 0.4 ? 'senala' : Math.sin(t * 1.3 + i) > 0.6 ? 'brazos' : 'pie', habla: 1, ceño: i % 3 === 0 });
    }
  }
};
rodar(E, R, [[0, sen]], { caja: (t, e) => R.caja(t, tramo(t, 0.8, 1.2), (x, y) => R.icono(Math.floor(t * 1.5) % 2 ? 'arena' : 'reloj', x + 8, y, undefined, undefined, 2), { energia: e }) });
</script>
</body>
</html>
