<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¿Dónde estoy? · ep4</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// EP4-DONDE (frases 8–10).
//  donde     un barco solo en un mar sin nada alrededor, sin Luna; una X roja salta de un sitio a otro sobre el agua.
//  bolsillo  un teléfono asoma de un bolsillo de vaquero, con el punto azul que late.
//  gracias   un marinero niega con la cabeza; Atom, en su caja, con un «?».
import { escena } from '/atomo/plato/escena.js';
import { crearAventura, PALA, ELENCO } from '/atomo/plato/kits/pixel-aventura.js';
const E = await escena('ep4-donde', 'ep04');
const R = await crearAventura(document.getElementById('lienzo'));
const { PAL, tramo, clamp } = R;
const M = (k, d) => E.marca(k, d);
const m = { donde: M('donde', 0.5), bolsillo: M('bolsillo', 6), gracias: M('gracias', 9.5) };

const solo = (t) => {
  R.cielo(t, { hor: 110, semilla: 33, nubes: { bandas: [[30, 10, 1], [70, 8, 0.9]], densidad: 0.05 } });
  R.mar(t, { hor: 110 });
  R.barco(160, 128, t, { tipo: 'galeon', esc: 0.6, farol: true });
  // la X salta cada medio segundo (tras «where am I?»)
  if (t > m.donde + 2) {
    const k = Math.floor(t * 2);
    const x = 40 + R.hash2(k, 7) * 240, y = 114 + R.hash2(k, 9) * 50;
    R.equis(x, y, 3);
  }
};
const bolsillo = (t) => {
  // vaquero oscuro a la luz de la Luna: tela con trama diagonal
  for (let y = 0; y < R.H; y++) for (let x = 0; x < R.W; x++) R.pset(x, y, R.tone(PAL.FARC, 0.4 + 0.8 * (((x + y) % 4) === 0) + 1.2 * Math.exp(-Math.hypot(x - 160, y - 90) / 90), x, y));
  const sube = tramo(t, m.bolsillo - 0.1, m.bolsillo + 0.8);
  R.telefono(160, 96 - 18 * sube, 84, t, { semilla: 4 });
  // bolsillo delante del teléfono, con costura de hilo ámbar
  R.poligono([[106, 106], [214, 106], [206, 180], [114, 180]], (x, y) => R.tone(PAL.FARC, 1.2 + 0.8 * (((x - y) % 4) === 0) + 0.8 * Math.exp(-Math.hypot(x - 160, y - 110) / 50), x, y));
  R.linea(106, 106, 214, 106, PAL.FARC[4]); R.linea(106, 107, 214, 107, PAL.FARC[0]);
  for (let x = 108; x < 212; x += 2) { R.pset(x, 110, PAL.FIRE[2]); }
  for (let y = 110; y < 180; y += 2) { R.pset(110 + (y - 110) * 0.05, y, PAL.FIRE[2]); R.pset(210 - (y - 110) * 0.05, y, PAL.FIRE[2]); }
  for (const x of [108, 212]) { R.disco(x, 108, 2, PAL.ORO[3]); R.pset(x, 107, PAL.ORO[5]); }
};
const marinero = (t) => {
  R.cielo(t, { luna: [90, 40, 12], hor: 140, semilla: 5 });
  R.mar(t, { hor: 140, luzX: 90 });
  // cubierta de madera en primer término
  for (let y = 150; y < R.H; y++) for (let x = 0; x < R.W; x++) R.pset(x, y, R.tone(PAL.HULL, 2.4 - (y - 150) * 0.05 + (x % 18 === 0 ? -1 : 0), x, y));
  const niega = Math.sin(t * 7) * (t > m.gracias + 1.6 && t < m.gracias + 3 ? 1 : 0);
  R.personaje(170, 152, 54, { ...ELENCO.marinero, t, dir: Math.sin(t * 7) > 0 && niega !== 0 ? 1 : -1, pose: 'manos_cintura' });
};

E.iniciar((t) => {
  R.secuencia(t, [[0, solo], [m.bolsillo - 0.2, bolsillo], [m.gracias - 0.2, marinero]]);
  const e = E.energia(t);
  R.caja(t, tramo(t, m.gracias + 0.2, m.gracias + 0.6), (x, y) => R.icono('?', x + 6, y, undefined, undefined, 2), { energia: e });
  R.companero(t, e);
  R.presentar();
});
</script>
</body>
</html>
