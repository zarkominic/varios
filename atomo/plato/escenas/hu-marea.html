<script type="module">
// HU-MAREA (frase 14), la noche del 8 de septiembre de 1900. Empieza con un golpe de música. Nadie en el agua: la gente,
// a salvo en los pisos de arriba. Tres planos:
// 1. el golpe: la calle de noche bajo la tormenta, vista desde la galería de arriba de una casa azul (a la izquierda,
//    delante); cae un rayo detrás de las casas (los rayos solo se pintan en el cielo de verdad, por encima de los
//    tejados, fuera de la barra del año y de la zona de Atom) y el mar empieza a entrar por la calle y sube por el porche de abajo, cuya
//    ventana se apaga. Se abre la puerta de la galería y sale el padre con un farol; va a la barandilla, mira abajo y se
//    asusta («no higher ground»), levanta el farol, se vuelve y llama («!»); salen la madre y el niño y se asoman; otro
//    rayo en «that night» los sobresalta y el padre cuelga el farol del gancho del poste, que se mece. Arriba, en la
//    buhardilla, la abuela con su vela; enfrente, siluetas en las ventanas de arriba; el helecho colgado se mece y el
//    canalón gotea;
// 2. «the sea rises about fifteen feet»: la escala de mareas del poste, de cerca, con la calle en penumbra detrás; a la
//    izquierda, la casa de Isaac Cline: sube la hoja de su ventana, se asoma con un farol y lee la escala mientras el agua
//    sube; en «feet» el 15 parpadea y sale el «15» grande (se asusta); deja el farol en el alféizar y lo apunta en su
//    libreta; la escala va de 5 en 5 px por pie y los quince pies quedan en y 110, así que la calle de enfrente se sigue
//    viendo, con las casas medio hundidas. El agua tiene fondo: clara junto a la superficie, con los reflejos rotos del
//    farol de Cline y de las ventanas, y oscura abajo, con la corriente en vetas a dos velocidades; lejos, despacio, pasan
//    tablas y un cajón. En «sweeps across the city» la corriente arrastra, cada vez más cerca, un tramo de valla, una
//    puerta y un barril grandes, medio hundidos y con su estela; una ola llega por la calle, revienta contra el poste
//    (penacho de espuma que trepa por la escala) y la espuma vuela hasta la ventana y salpica el cristal: se echa atrás sujetándose el sombrero, mira la corriente de un lado
//    a otro, recoge el farol y baja la hoja. Llueve y los hilos se mecen;
// 3. «the deadliest natural disaster»: inserto de la ventana grande de arriba de la casa azul, encendida, sobre el agua.
//    Dentro, el cuarto con la luz del quinqué (tramada, más oscura en los rincones) y las sombras de la familia en la
//    pared: friso de rombos, papel pintado de rayas y flores, zócalo de tableros, el cuadro del puerto, la repisa con
//    platos, el reloj con su péndulo, la mecedora de la casa y la mesa camilla con su tapete. El padre coge el quinqué de
//    la mesa y se vuelve hacia los suyos; el niño, junto a la madre, señala la mecedora que flota; la farola de la calle
//    se apaga en «deadliest» (y una ventana de enfrente) y se sobresaltan; la madre calma al niño, que se arrima a ella,
//    con el relámpago lejano de «disaster»; el padre deja el quinqué en el alféizar, que se enciende, y su reflejo en el
//    agua crece. A la derecha, la calle: nubes de tormenta tramadas en tres tonos que corren a dos velocidades, lluvia
//    lejana, la casa de enfrente (tablas, hastial de escamas, celosía, dos ventanas con siluetas, porche medio hundido) y
//    otra detrás con su chimenea que humea. La contraventana golpea, llueve, y la corriente arrastra de derecha a
//    izquierda una tabla, la mecedora, un barril y otra tabla, que toman la luz al pasar por delante de la ventana; el
//    gato, silueta a contraluz con el borde encendido y los ojos que brillan, mira desde la ventana de al lado: dentro, el
//    cuarto en penumbra con la luz tenue tramada que entra por la rendija de la puerta, el retrato, la cómoda con su jarra
//    y el visillo de encaje que se mece. El quinqué va siempre en la mano que cuelga del padre (enMano), nunca sobre su
//    cabeza, hasta que lo deja en el alféizar.
import * as T from '/atomo/plato/escenas/hu-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hu-marea');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const C = T.C;
const lin = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
const entre = (t, a, b) => t >= a && t < b;
const parpadeo = (t, v = 6) => Math.sin(t * v) > 0;
const hh = (a, b, k = 0) => { const s = Math.sin(a * 127.1 + b * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
// el tramado ordenado 4 × 4 (para degradados sin rayas)
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], umbral = (x, y) => (B4[((y & 3) << 2) | (x & 3)] + 0.5) / 16;
// dónde lleva algo un personaje: la mano que cuelga (delante) y la levantada (con dedo)
const enMano = (x, suelo, dir) => [dir > 0 ? x + 11 : x - 5, suelo - 9];
const manoArriba = (x, suelo, dir) => [dir > 0 ? x + 16 : x - 2, suelo - 19];
const mezcla = (p, [cr, cg, cb], a) => { const r = p & 255, g = (p >> 8) & 255, b = (p >> 16) & 255; return (0xff000000 | (Math.round(b + (cb - b) * a) << 16) | (Math.round(g + (cg - g) * a) << 8) | Math.round(r + (cr - r) * a)) >>> 0; };
// tiñe solo lo que pinta dibuja dentro de la caja [x0, y0, x1, y1] (de noche, los personajes toman la luz del decorado)
const tenido = ([x0, y0, x1, y1], col, a, dibuja) => {
  const w = x1 - x0 + 1, antes = new Uint32Array(w * (y1 - y0 + 1));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) antes[(y - y0) * w + x - x0] = R.pget(x, y);
  dibuja();
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const p = R.pget(x, y); if (p !== antes[(y - y0) * w + x - x0]) R.pset(x, y, mezcla(p, col, a)); }
};
// recorrido por fotogramas clave [t, x, suelo]: dónde está, si anda y hacia dónde mira (null antes de empezar)
const ruta = (t, kf, desde = true) => {
  if (t < kf[0][0]) return desde ? null : { x: kf[0][1], s: kf[0][2], mv: false, d: Math.sign(kf[1][1] - kf[0][1]) || 1 };
  let d = 1; for (let i = 0; i + 1 < kf.length; i++) { const [t0, x0, s0] = kf[i], [t1, x1, s1] = kf[i + 1]; if (x1 !== x0) d = x1 < x0 ? -1 : 1;
    if (t < t1) { const u = (t - t0) / (t1 - t0); return { x: Math.round(lerp(x0, x1, u)), s: Math.round(lerp(s0, s1, u)), mv: x1 !== x0 || s1 !== s0, d }; } }
  const [, x, s] = kf[kf.length - 1]; return { x, s, mv: false, d };
};
// la luz cálida de un farol sobre lo ya pintado, tramada en escalones (sin franjas): (cx, cy) el centro, r el radio
const luzCalida = (cx, cy, r, a, col = [255, 206, 130]) => {
  for (let y = Math.max(0, Math.floor(cy - r)); y <= Math.min(179, Math.ceil(cy + r)); y++) for (let x = Math.max(0, Math.floor(cx - r)); x <= Math.min(319, Math.ceil(cx + r)); x++) {
    const g = 1 - Math.hypot(x - cx, (y - cy) * 1.1) / r; if (g <= 0) continue;
    const q = Math.floor(g * g * 5 + umbral(x, y)) / 5 * a; if (q > 0) R.pset(x, y, mezcla(R.pget(x, y), col, q));
  }
};
// el farol de mano (x, y: el asa): el aro, la jaula y la llama que tiembla
const farol = (x, y, t) => {
  x = Math.round(x); y = Math.round(y);
  R.pset(x, y, C.k); R.rect(x - 2, y + 1, x + 2, y + 1, C.k); R.pset(x - 2, y + 2, C.k); R.pset(x + 2, y + 2, C.k);
  R.rect(x - 3, y + 2, x + 3, y + 9, C.k); R.rect(x - 2, y + 3, x + 2, y + 8, hex('#fff0b0')); R.rect(x - 2, y + 3, x + 2, y + 3, hex('#8a8a7a')); R.rect(x - 2, y + 8, x + 2, y + 8, hex('#6a6a5a'));
  R.pset(x - 1, y + 5, hex('#f8e8a0')); R.pset(x, y + 5, Math.sin(t * 13) > 0 ? C.blanco : hex('#f8c040')); R.pset(x, y + 6, hex('#f0a030')); R.pset(x + 2, y + 4, hex('#c8c0a0'));
};
// las tablas de chilla de una fachada: canto con luz, sombra, vetas y juntas; pal = [tabla, luz, sombra, veta]. Cada
// píxel sale de sus coordenadas, así se puede repintar un trozo (lo que tapa a alguien) sin que se note la costura
const fachada = (x0, y0, x1, y1, pal, sem) => {
  for (let y = Math.max(0, y0); y <= Math.min(179, y1); y++) { const j = y % 5, fila = (y / 5) | 0;
    for (let x = Math.max(0, x0); x <= Math.min(319, x1); x++) {
      let c = j === 0 ? pal[1] : j === 4 ? pal[2] : pal[0];
      if (j === 2 && ((x + fila * 3) & 7) < 5 && hh((x + fila * 13) >> 3, fila, sem) < 0.3) c = pal[3];
      else if (j > 0 && j < 4 && (x + fila * 29) % 37 === 0) c = pal[2];
      R.pset(x, y, c);
    }
  }
};
// la silueta de alguien detrás de un cristal encendido: solo sobre los píxeles de luz
const esLuz = (x, y) => { const p = R.pget(x, y), r = p & 255, g = (p >> 8) & 255, b = (p >> 16) & 255; return r > 170 && g > 120 && b < 150; };
const silueta = (x0, cy, col = hex('#3a2a30'), vela = false, t = 0) => {
  for (let y = cy - 6; y <= cy + 6; y++) for (let x = x0 - 4; x <= x0 + 4; x++) { const cab = Math.hypot(x - x0, y - (cy - 3)) < 2.4, cuerpo = y >= cy && Math.abs(x - x0) <= 3 + (y - cy) * 0.3; if ((cab || cuerpo) && esLuz(x, y)) R.pset(x, y, col); }
  if (vela) { R.pset(x0 + 4, cy - 1, Math.sin(t * 11) > 0 ? C.blanco : hex('#fff0a0')); R.pset(x0 + 4, cy, hex('#f8b040')); }
};
const FACH = [hex('#3a4662'), hex('#4c5a7c'), hex('#2a334c'), hex('#34405a')];   // la casa azul: tabla, canto con luz, sombra, veta
const CASA2 = [hex('#3a4a44'), hex('#4c605a'), hex('#28342f'), hex('#32403b')];  // la casa de Cline, verde: igual
const MOLD = [hex('#8a90a8'), hex('#a8aec4'), hex('#5e647c')];                     // las molduras blancas, de noche
const VERDE = [hex('#26402e'), hex('#33553e'), hex('#1a2c20')];                    // las contraventanas
const TEJA = [hex('#262a3a'), hex('#323848'), hex('#1a1e2a')];                     // las tejas de madera del tejadillo
const LUZ = [hex('#fff0b8'), hex('#f8d890'), hex('#e8b468'), hex('#b8804a')];      // la luz de la lámpara, del centro afuera
const OSCURO = [hex('#141a28'), hex('#1e2638'), hex('#2a344a')];                   // un cristal apagado y su reflejo
const PADRE = { C: hex('#5a4a3a'), c: hex('#443828'), F: hex('#4a4a52'), W: hex('#f2eee2'), o: hex('#3a3a46') };
const MADRE = { C: hex('#4a6a8a'), c: hex('#36506a'), W: hex('#e8e0d0'), L: hex('#2a2430') };
const NINO = { C: hex('#e8e4dc'), c: hex('#c0bcb4'), F: hex('#3a4a6a'), W: hex('#e8e4dc'), o: hex('#3a4a6a'), H: hex('#c8904c'), h: hex('#e0ac64') };
// un hueco con luz de lámpara (del centro (lx, ly) afuera, tramada) o apagado (oscuro con un reflejo frío)
const hueco = (x0, y0, x1, y1, enc, lx = (x0 + x1) / 2, ly = (y0 + y1) / 2, esc = 16) => {
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    if (enc > 0) { const v = Math.hypot(x - lx, (y - ly) * 1.15) / esc, i = Math.min(3, Math.floor(v) + (v - Math.floor(v) > umbral(x, y) ? 1 : 0)); R.pset(x, y, enc >= 1 || umbral(x, y) < enc ? LUZ[i] : OSCURO[0]); }
    else R.pset(x, y, ((x - x0) + (y1 - y)) % 11 === 0 && (y - y0) % 3 !== 1 ? OSCURO[2] : (y - y0) < (y1 - y0) * 0.35 ? OSCURO[1] : OSCURO[0]);
  }
};
// el marco de una ventana de guillotina (sin el cristal): moldura con su luz y su sombra, travesaño y cornisa de dentículos
const marco = (x0, y0, x1, y1) => {
  R.rect(x0 - 3, y0 - 7, x1 + 3, y0 - 4, C.k); R.rect(x0 - 2, y0 - 6, x1 + 2, y0 - 5, MOLD[1]); for (let x = x0 - 1; x <= x1 + 1; x += 2) R.pset(x, y0 - 5, MOLD[2]);
  R.rect(x0 - 2, y0 - 3, x1 + 2, y0 - 1, C.k); R.rect(x0 - 2, y0 - 3, x0 - 1, y1 + 1, C.k); R.rect(x1 + 1, y0 - 3, x1 + 2, y1 + 1, C.k);
  R.rect(x0 - 1, y0 - 2, x1 + 1, y0 - 2, MOLD[0]); R.rect(x0 - 1, y0 - 2, x0 - 1, y1, MOLD[1]); R.rect(x1 + 1, y0 - 2, x1 + 1, y1, MOLD[2]);
};
const alfeizar = (x0, x1, y) => { R.rect(x0 - 4, y, x1 + 4, y + 3, C.k); R.rect(x0 - 3, y + 1, x1 + 3, y + 1, MOLD[1]); R.rect(x0 - 3, y + 2, x1 + 3, y + 2, MOLD[0]); R.rect(x0 - 1, y + 4, x1 + 1, y + 5, MOLD[2]); };

const m = (f) => en('marea', f);
// los cortes: «rises» y «In what is still»
const P2 = m(0.275), P3 = m(0.681);
const alto = m(0.074), esaNoche = m(0.23), pies = m(0.39), barre = m(0.452), otro = m(0.632);
const mortal = m(0.783), desastre = m(0.866), historia = m(0.944);

// ── 1 · el golpe: el mar entra en la calle; la familia, a salvo en la galería de arriba ─────────────────────────────
const rayo = (x0, y0, x1, y1, sem, cielo = () => true) => {   // un rayo quebrado con su halo y una rama; solo sobre el cielo
  const pts = [[x0, y0]]; for (let i = 1; i <= 8; i++) { const f = i / 8; pts.push([Math.round(lerp(x0, x1, f) + (i < 8 ? (hh(i, sem, 40) - 0.5) * 16 : 0)), Math.round(lerp(y0, y1, f))]); }
  const traza = (a, b, col) => R.linea(a[0], a[1], b[0], b[1], (x, y) => (cielo(x, y) ? col : null));
  for (let i = 0; i + 1 < pts.length; i++) for (const dx of [-1, 1]) traza([pts[i][0] + dx, pts[i][1]], [pts[i + 1][0] + dx, pts[i + 1][1]], hex('#8a9cff'));
  for (let i = 0; i + 1 < pts.length; i++) traza(pts[i], pts[i + 1], C.blanco);
  const [bx, by] = pts[3]; traza([bx, by], [bx + 12, by + 11], hex('#c8d0ff')); traza([bx + 12, by + 11], [bx + 9, by + 19], hex('#c8d0ff'));
};
const esCielo = (x, y) => { const p = R.pget(x, y), r = p & 255, b = (p >> 16) & 255; return b > r + 6 && r < 90; };
// el cielo de verdad del decorado 'calle', de x 170 a 277: por encima de los tejados (el hastial de la casa de ladrillo,
// su chimenea, las cubiertas de la derecha y la otra chimenea), sin el poste del telégrafo ni su cruceta, y sin la barra
// del año (y < 16). Los rayos solo se pintan aquí, así caen por detrás de las casas
const techo = (x) => x < 170 || x > 277 ? 0 : x < 184 ? 40 - (x - 170) * 10 / 14 : x < 200 ? 30 + (x - 184) * 10 / 16 : x < 210 ? 30 : x < 240 ? 42 : x < 260 ? 40 : x < 268 ? 30 : 41;
const cieloP1 = (x, y) => y >= 16 && y < techo(x) && !(x >= 231 && x <= 240 && y >= 33) && !(x >= 225 && x <= 252 && y >= 31 && y <= 38) && esCielo(x, y);
const a1 = (t) => lerp(0, 0.52, tramo(t, 0.55, P2 + 0.3));
// la casa azul de delante: la fachada (x 0–58), la galería de arriba (suelo en y 115) con sus postes en x 60 y 102,
// el tejadillo (y 56–71) y el porche de abajo, que se va llenando de agua
const GAL = { piso: 115, x1: 106, postes: [60, 102], puerta: [18, 84, 32, 114], ventana: [38, 88, 52, 106], gancho: [64, 88] };
const abre = [0.38, 0.7], padreR = [[0.55, 18, 115], [1.3, 70, 115]], madreR = [[2.45, 18, 115], [3.1, 42, 115]], ninoR = [[2.6, 18, 118], [3.2, 28, 118]];
const asusta = [1.32, 2.0], alza = [alto, 2.15], llama = [2.2, 2.85], cuelga = [2.9, 3.15];
const poste = (x, y0, y1) => {   // un poste torneado: perfil negro, luz a la izquierda y un abombado cada 12 px
  R.rect(x, y0, x + 3, y1, C.k); R.rect(x + 1, y0, x + 1, y1, MOLD[1]); R.rect(x + 2, y0, x + 2, y1, MOLD[2]);
  for (let y = y0 + 6; y < y1 - 3; y += 12) { R.rect(x - 1, y, x + 4, y + 2, C.k); R.rect(x, y, x + 3, y + 1, MOLD[0]); R.pset(x, y, MOLD[1]); }
};
const balaustrada = (x0, x1, yT, yB, t) => {   // pasamanos, balaustres torneados con hueco entre ellos y zócalo
  R.rect(x0, yT - 1, x1, yT - 1, C.k); R.rect(x0, yT, x1, yT + 1, MOLD[1]); R.rect(x0, yT + 2, x1, yT + 2, MOLD[2]); R.rect(x0, yT + 3, x1, yT + 3, C.k);
  for (let x = x0 + 1; x < x1; x += 4) { R.rect(x, yT + 4, x + 1, yB - 2, C.k); R.pset(x, yT + 4, MOLD[0]); for (let y = yT + 5; y < yB - 2; y++) { R.pset(x, y, MOLD[0]); R.pset(x + 1, y, MOLD[2]); } const yb = Math.round((yT + yB) / 2); R.rect(x - 1, yb, x + 2, yb + 1, C.k); R.pset(x, yb, MOLD[1]); R.pset(x + 1, yb, MOLD[0]); }
  R.rect(x0, yB - 2, x1, yB - 2, C.k); R.rect(x0, yB - 1, x1, yB, MOLD[0]); R.rect(x0, yB - 1, x1, yB - 1, MOLD[1]);
};
const p1 = (t) => {
  const a = a1(t), d = a * 15, wlF = 178 - d * 5.2;
  T.galveston(R, t, { encuadre: 'calle', noche: 1, cielo: 'tormenta', agua: a });
  // el agua de delante, como la deja el decorado, para reponerla luego delante del porche de abajo
  const AG = [0, 100, GAL.x1 + 1, 179], ag = a > 0 ? new Uint32Array((AG[2] + 1) * (AG[3] - AG[1] + 1)) : null;
  if (ag) for (let y = AG[1]; y <= AG[3]; y++) for (let x = 0; x <= AG[2]; x++) ag[(y - AG[1]) * (AG[2] + 1) + x] = R.pget(x, y);
  // enfrente, en las ventanas encendidas de arriba, la gente a salvo; una silueta lleva una vela de una ventana a otra
  [[111, 69], [133, 69], [172, 63], [242, 69], [265, 69]].forEach(([cx, cy], k) => silueta(cx + Math.round(Math.sin(t * 0.9 + k * 2) * 1.5), cy));
  { const u = (t * 0.35) % 1; silueta(Math.round(lerp(168, 204, u)), 63, hex('#3a2a30'), true, t); }
  // el golpe: un rayo cae detrás de las casas y el fogonazo lo ilumina todo; otro en «that night»
  for (const [r0, x0, x1] of [[0.03, 214, 224], [esaNoche - 0.06, 262, 248]]) { const u = t - r0; if (u < 0 || u > 0.4) continue; if (u < 0.2 || (u > 0.26 && u < 0.32)) rayo(x0, 16, x1, 60, 3 + x0, cieloP1); }

  // ── la casa azul, de delante ──
  fachada(0, 0, 57, 178, FACH, 81);
  R.rect(55, 0, 58, 178, MOLD[2]); R.rect(55, 0, 56, 178, MOLD[0]); R.rect(58, 0, 58, 178, C.k);   // la esquinera
  // la buhardilla: la abuela vela con su candil
  { const [x0, y0, x1, y1] = [16, 28, 36, 46]; marco(x0, y0, x1, y1); hueco(x0, y0, x1, y1, 1, 26 + Math.sin(t * 0.7) * 3, 39, 12);
    silueta(26 + Math.round(Math.sin(t * 0.7) * 3), 41, hex('#4a3438'), true, t);
    R.rect(x0, 37, x1, 37, MOLD[0]); R.rect(26, y0, 26, y1, MOLD[0]); alfeizar(x0, x1, y1 + 1); }
