//    («almost fifteen years»).
import * as T from '/atomo/plato/escenas/si-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('si-lago');

const K = { k: hex('#1a1420'), blanco: hex('#f2eee2'), oro: hex('#f8d040'), oroS: hex('#c89a28'), rojo: hex('#d83a3a'), rojoS: hex('#981e2a'),

  CORAZON.forEach((f, j) => { for (let i = 0; i < 7; i++) if (f[i] === '#') px(i, j, j > 2 && i > 3 ? mez(col, K.k, 0.25) : col); });

// gotas de agua que caen de alguien que sale del agua (x, y arriba; u 0–1 del goteo)
const goteo = (x, y, t, u) => { if (u <= 0 || u >= 1) return; for (let k = 0; k < 4; k++) { const f = ((t * 1.7 + k * 0.27) % 1); if (f > 1 - u * 0.6) continue;
  const gx = Math.round(x + (k * 5) % 13), gy = Math.round(y + f * 20); R.pset(gx, gy, K.aguaS); R.pset(gx, gy - 1, K.agua); } };

  R.pset(x, y + 5, hex('#f89a30')); R.pset(x, y + 6, hex('#f8c040')); R.rect(x - 3, y + 10, x + 3, y + 10, K.k); R.pset(x - 2, y + 3, K.blanco);
};

const a = (f) => en('lago', f), b = (f) => en('exito', f);
const P2 = 3.6, P3 = b(0);
const nada = a(0.05), sale = a(0.2), trepa = a(0.257), gnomo = a(0.441), juego = a(0.598), entiende = a(0.701), tecleo = a(0.785), escrito = a(0.905);
const exito = b(0.141), roberta = b(0.267), familia = b(0.564), anos = b(0.753);
// p1 · el lago: nada, sale y trepa al sauce
const p1 = (t) => {
  const g = T.reino(R, t, { encuadre: 'lago' }); const wl = 136;
  const u = suave(lin(t, 0.15, sale)), fuera = lin(t, sale, sale + 0.45), anda = lin(t, sale + 0.45, trepa + 0.35), sube = suave(lin(t, trepa + 0.35, gnomo - 0.15));

    R.recorte([0, 0, 319, wl]); R.actor(EL.graham, gx, wl + 15, t, { dir: -1, quieto: true, habla: false, sonrisa: true }); R.recorte(null);
    for (let k = 0; k < 3; k++) { const r = ((t * 1.4 + k / 3) % 1), w = Math.round(9 + r * 22), c = r < 0.6 ? K.agua : K.aguaS;
      for (let i = -w; i <= w; i += 2) if (Math.abs(i) > 6) R.pset(gx + 7 + i + Math.round(r * 6), wl + 1 + Math.round(r * 2), c); }
    R.rect(gx + 1, wl, gx + 13, wl + 1, K.agua); R.rect(gx + 3, wl + 1, gx + 11, wl + 1, K.aguaS);
    for (const s of [-1, 1]) { const bx = gx + 7 + s * (bra ? 9 : 6), by = wl - (bra ? 3 : 1); R.pset(bx, by, K.blanco); R.pset(bx + s, by - 1, K.agua); R.pset(bx - s, by + 1, K.agua); }
    // el chof al tirarse a nadar

      R.pset(Math.round(gx + 10 + Math.cos(ang) * r), Math.round(wl - Math.sin(ang) * r * 1.1 + ch * ch * 14), k % 2 ? K.blanco : K.agua); }
  } else {

    const x = Math.round(sube > 0 ? 17 : anda > 0 ? lerp(70, 17, anda) : lerp(84, 70, fuera)), y = Math.round(sube > 0 ? lerp(157, 112, sube) : anda > 0 ? 157 : lerp(wl + 15, 157, suave(fuera)));
    const enRama = sube >= 1, trepando = sube > 0 && sube < 1;
    if (enRama) { R.rect(14, 112, 44, 113, hex('#5a3a1a')); R.rect(14, 111, 44, 111, hex('#7a5228')); R.rect(40, 113, 52, 114, hex('#5a3a1a')); }   // la rama donde se sienta
    R.actor(EL.graham, x, y, t, { dir: enRama ? 1 : -1, anda: (anda > 0 && anda < 1), brazos: trepando || (fuera > 0 && fuera < 1), salto: trepando ? Math.round(Math.abs(Math.sin(t * 10)) * 2) : 0,
      dedo: enRama && t > gnomo - 0.2, sonrisa: true, habla: enRama && t > gnomo - 0.2 && Math.sin(t * 9) > 0 });
    goteo(x + 2, y - 18, t, lin(t, sale, gnomo + 0.5));

// el bocadillo de escribir: «>», los trazos que se teclean y el cursor
const bocadilloTecleo = (x, y, n, t) => {
  R.rect(x - 1, y - 1, x + 41, y + 11, K.k); R.rect(x, y, x + 40, y + 10, K.blanco); R.rect(x + 6, y + 11, x + 9, y + 12, K.k); R.rect(x + 7, y + 11, x + 8, y + 11, K.blanco); R.pset(x + 7, y + 13, K.k);
  const gr = hex('#3a3a4a'); R.pset(x + 3, y + 3, gr); R.pset(x + 4, y + 4, gr); R.pset(x + 5, y + 5, gr); R.pset(x + 4, y + 6, gr); R.pset(x + 3, y + 7, gr);
  let cx = x + 9; for (let k = 0; k < n && cx < x + 36; k++) { if (k % 5 !== 4) R.rect(cx, y + 4, cx + 1, y + 7, k % 3 ? gr : hex('#5a5a7a')); cx += 3; }
  if (Math.floor(t * 4) % 2) R.rect(cx, y + 7, cx + 2, y + 7, gr);
};
// la llave dorada (x, y: el ojo)
const llave = (x, y, u = 0) => { x = Math.round(x); y = Math.round(y);
  R.disco(x, y, 3, K.k); R.disco(x, y, 2, K.oro); R.pset(x, y, K.k); R.rect(x + 3, y - 1, x + 11, y + 1, K.k); R.rect(x + 3, y, x + 10, y, K.oro);
  R.rect(x + 8, y + 1, x + 9, y + 3, K.k); R.pset(x + 8, y + 2, K.oro); R.rect(x + 11, y + 1, x + 12, y + 3, K.k); R.pset(x - 1, y - 2, K.blanco); };
// ── p2 · la orilla del tocón, contraplano bajo y cerca: el tocón grande, setas y espadañas delante, el lago una franja ──
// Lo fijo (cielo tramado, montes con bruma, la otra orilla con pinos, abedules y la caseta de la barca, el lago con su
// reflejo, la orilla de guijarros, el prado con el caminito de losas, el tocón con su corteza, musgo, hiedra, setas de
// repisa, la puerta en arco, la ventanita redonda y la chimenea) va en un búfer; lo que se mueve, encima.
const hh = (x, y, s) => { let n = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0; n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const trama = (x, y) => (BAY[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
// el tono de una escala (u 0–1) con trama entre dos tonos vecinos

const O = {
  cielo: ['#4a86d6', '#5c98e0', '#74ace8', '#90c2ee', '#b0d6f2', '#d0e8f2'].map(hex),
  monteL: ['#b8cadc', '#a4bad0', '#94aac4', '#889ebc'].map(hex), monteM: ['#8cb4a0', '#7aa690', '#6a9882', '#5c8a74'].map(hex),

  corteza: ['#c89a64', '#a87a48', '#8a5e36', '#6e4628', '#52321c', '#3a2214'].map(hex),
  musgo: ['#8cc050', '#6aa040', '#4e8232'].map(hex),
  piedra: hex('#9a9890'), piedraL: hex('#c8c6bc'), piedraS: hex('#68665e'), tierra: hex('#b08a58'), tierraS: hex('#8a6a40'),
  anillo1: hex('#dcb47e'), anillo2: hex('#c69a64'), cambium: hex('#ecca90'), hueco: hex('#1c120c'), huecoL: hex('#2e1e12'),
  madera: hex('#a8743e'), maderaL: hex('#cc9a5e'), maderaS: hex('#74482a'), hierro: hex('#5a5e68'), hierroL: hex('#9aa0aa'), hierroS: hex('#3a3c44'),
  nube: hex('#ffffff'), nubeM: hex('#e4eef8'), nubeS: hex('#b8cce0'),

const TX = 217, TY = 76, TRX = 44, PX0 = 205, PX1 = 229, PY0 = 122, PY1 = 155;   // el tocón (centro, arriba) y la puerta
const anchoT = (y) => TRX + (y > 138 ? (y - 138) * 0.55 : 0) + Math.sin(y * 0.31) * 0.6;
// un pino de la otra orilla (cx, base, alto, [luz, medio, sombra])
const pino = (cx, base, al, c) => { const top = base - al;
  for (let y = top; y <= base - 2; y++) { const d = y - top, w = Math.max(0, Math.floor(d * 0.36) - (d > 3 && d % 4 === 0 ? 1 : 0));
    for (let x = cx - w; x <= cx + w; x++) R.pset(x, y, x < cx - w * 0.3 ? c[0] : x > cx + w * 0.4 ? c[2] : c[1]); }
  R.rect(cx, base - 1, cx, base, hex('#3a2a1c')); };
// una raíz que sale del tocón hacia el prado, más fina en la punta, con luz arriba
const raiz = (x0, y0, x1, y1, w0) => { for (let i = 0; i <= 40; i++) { const s = i / 40, x = Math.round(lerp(x0, x1, s)), y = Math.round(lerp(y0, y1, s) - Math.sin(s * Math.PI) * 2), w = Math.round(w0 * (1 - s) + 1);
  for (let j = 0; j <= w; j++) R.pset(x, y - j, j === w ? O.corteza[1] : j === 0 ? O.corteza[5] : O.corteza[2 + (j + x) % 2]); } };
// una seta de repisa en la corteza (dir -1 sale a la izquierda)
const repisa = (x, y, dir, r) => { for (let i = 0; i <= r; i++) { const hgt = Math.round(Math.sqrt(1 - (i / (r + 0.5)) ** 2) * 2.4); const xx = x + dir * i;
  for (let j = 0; j <= hgt; j++) R.pset(xx, y - j, j === hgt ? hex('#f4d494') : hex('#e0b070')); R.pset(xx, y + 1, hex('#94643a')); } };
let fondo2 = null;
const pintarFondo2 = () => {
  const { pset, pget, rect, disco } = R;
  // el cielo tramado en seis tonos, con velos de cirros
  for (let y = 0; y < 69; y++) for (let x = 0; x < 320; x++) pset(x, y, escala(O.cielo, y / 66 + Math.sin(x * 0.02 + y * 0.1) * 0.03, x, y));
  for (const [cx, cy, l] of [[64, 30, 40], [200, 26, 52], [150, 36, 30]]) for (let i = -l; i <= l; i++) { const yy = cy + Math.round(Math.sin(i * 0.05) * 2); if (hh(cx + i, cy, 3) < 0.55) pset(cx + i, yy, O.cielo[Math.min(5, Math.floor(yy / 66 * 5) + 2)]); }
  // el sol con su corona tramada
  for (let j = -16; j <= 16; j++) for (let i = -16; i <= 16; i++) { const d = Math.hypot(i, j); const x = 118 + i, y = 24 + j;

  // los montes lejanos, con bruma abajo y el filo claro; luego la loma verde de delante con motas de árboles

  // la línea de la otra orilla: barro oscuro y matas de juncos
  for (let x = 0; x < 320; x++) { pset(x, 67, hex('#2e4628')); pset(x, 68, hh(x, 68, 12) < 0.4 ? hex('#5a4e34') : hex('#463c28')); if (hh(x, 5, 12) < 0.12) { pset(x, 66, hex('#5a8a3a')); pset(x, 65, hex('#7aa84a')); } }
  // el lago: el reflejo de la otra orilla y del cielo, cada vez más azul hacia aquí, con rayas de brisa
  for (let y = 69; y <= 93; y++) { const dy = y - 69, sy = 67 - Math.round(dy * 1.25) - 1, k = 0.5 + dy / 24 * 0.35, sh = Math.round((hh(0, y, 13) - 0.5) * 3);
    for (let x = 0; x < 320; x++) { let c = mez(pget(Math.max(0, Math.min(319, x + sh)), Math.max(0, sy)), escala(O.agua, dy / 24, x, y), k);
      if (hh(x >> 3, y, 14) < 0.1) c = mez(c, hex('#cfe8f8'), 0.25); pset(x, y, c); } }
