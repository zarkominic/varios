<body>
<canvas id="lienzo"></canvas>
<script type="module">
// TU-PERMISO (frase 25), 2026, sin cartela. Dos planos:
// 1. el calendario de pared del despacho oficial (noviembre de 2026), con la pared llena: la caja de la persiana, el
//    termómetro, el interruptor con su canaleta, el diploma enmarcado (rayas y lacre, sin letras), el tablón de corcho
//    con notas que aletean con el ventilador, la chaqueta y el bolso colgados del perchero, y bajo la balda los legajos
//    atados con cuerda, la papelera y el cable del teléfono. Del 1 al 14 ya están tachados; la mano (brazo corto, en
//    diagonal desde abajo a la derecha) tacha del 15 al 19; en «permit» y «Supreme Council» el sello de la balda se
//    ilumina con una «?», pero no baja; en «if it came through» el lápiz va al 20 rodeado y da golpecitos;
// 2. el Valle de los Reyes en 2026: la perforadora espera en su terraza (la luz ámbar de espera parpadea en su caja, el
//    piloto rojo, el banderín de la torre y la cincha de la lona que aletean); el técnico espera abajo: mira el reloj en
//    «November 2026», da vueltas, mira el móvil y en «no decision has been announced» se encoge de hombros con la «?».
//    Dos turistas bajan por el asfalto y se paran dentro del cuadro: una señala la máquina parada, la otra la fotografía
//    en «mid-November» y luego se enseñan la foto en la pantallita mientras la luz de espera sigue parpadeando.
import * as T from '/atomo/plato/escenas/tu-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('tu-permiso');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const p = (f) => en('permiso', f);
const P2 = p(0.5207), CONSEJO = p(0.153), EQUIPO = p(0.347), CAME = p(0.459), NOV = p(0.606), MEDIO = p(0.795), NADA = p(0.867), ANUNCIO = p(0.95);
const N = Math.round, K = hex('#141018'), BL = hex('#f8f4ec'), ROJO = hex('#d8342a'), ORO = hex('#ffd860');
const suave = (u) => u * u * (3 - 2 * u);
const mez = (c1, c2, a) => { const f = (s) => Math.round(((c1 >>> s) & 255) + (((c2 >>> s) & 255) - ((c1 >>> s) & 255)) * a); return (0xff000000 | (f(16) << 16) | (f(8) << 8) | f(0)) >>> 0; };
const globo = (x, y, ic, col) => { R.disco(x, y, 7, K); R.disco(x, y, 6, BL); R.pset(x - 4, y + 7, K); R.pset(x - 5, y + 8, K); R.pset(x - 4, y + 6, BL); R.icono(ic, x - 2, y - 3, col, null); };

// la pared del despacho, más llena (encima del decorado del calendario, en cada fotograma)
const MAD = [hex('#3a2414'), hex('#5a3a20'), hex('#7a5230'), hex('#9a6a40'), hex('#b88a58')];
const hh = (x, y, s) => { const v = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453; return v - Math.floor(v); };
const marco = (x0, y0, x1, y1) => { R.rect(x0, y0, x1, y1, K); R.rect(x0 + 1, y0 + 1, x1 - 1, y1 - 1, MAD[2]); R.rect(x0 + 1, y0 + 1, x1 - 1, y0 + 1, MAD[4]); R.rect(x0 + 1, y0 + 1, x0 + 1, y1 - 1, MAD[3]); R.rect(x1 - 1, y0 + 1, x1 - 1, y1 - 1, MAD[1]); R.rect(x0 + 1, y1 - 1, x1 - 1, y1 - 1, MAD[1]); R.rect(x0 + 2, y1 + 1, x1 + 1, y1 + 1, hex('#8a7c5c')); };
function pared(t) {
  const air = Math.sin(t * 0.8);   // el ventilador oscila: cuando mira a la izquierda, mueve papeles y ropa
  // la caja de la persiana encima de la ventana
  R.rect(1, 20, 49, 25, K); R.rect(2, 21, 48, 24, MAD[2]); R.rect(2, 21, 48, 21, MAD[4]); R.rect(2, 24, 48, 24, MAD[1]); R.rect(44, 22, 46, 23, hex('#c8c0a8'));
  // el termómetro de pared (tablilla, escala de rayitas, bulbo rojo) y el interruptor con la canaleta hasta el enchufe
  R.rect(53, 32, 59, 66, K); R.rect(54, 33, 58, 65, hex('#e8e0c8')); R.rect(54, 33, 58, 33, BL); for (let y = 36; y < 60; y += 3) R.pset(54, y, hex('#8a7c60'));
  R.rect(56, 36, 56, 60, hex('#c8c0b0')); R.rect(56, 44, 56, 60, ROJO); R.disco(56, 62, 1.5, ROJO); R.pset(56, 61, hex('#f8a090')); R.pset(55, 35, BL);
  R.rect(53, 122, 60, 131, K); R.rect(54, 123, 59, 130, hex('#ece6d4')); R.rect(54, 123, 59, 123, BL); R.rect(56, 124, 57, 126, hex('#a89a80')); R.rect(56, 125, 57, 126, hex('#5a5048'));
  R.rect(56, 132, 57, 149, hex('#d8d0bc')); R.rect(58, 132, 58, 149, hex('#a89a80')); for (const y of [137, 145]) R.rect(55, y, 58, y, hex('#a89a80'));
  // el diploma enmarcado (rayas de texto, una franja dorada y el lacre con su cinta: sin letras), con un brillo que pasa
  marco(234, 16, 270, 46); R.rect(237, 19, 267, 43, hex('#f2ead2')); R.rect(238, 20, 266, 42, hex('#ece2c4'));
  R.rect(240, 21, 264, 21, hex('#c8a040')); R.rect(240, 41, 264, 41, hex('#c8a040'));
  R.rect(246, 24, 258, 25, hex('#5a4a3a')); for (let j = 0; j < 4; j++) R.rect(241, 28 + j * 3, 241 + 14 + N(hh(j, 2, 7) * 8), 28 + j * 3, hex('#9a8a70'));
  R.linea(258, 39, 255, 44, hex('#2a5a9a')); R.linea(262, 39, 265, 44, hex('#2a5a9a')); R.disco(260, 37, 3.5, hex('#8a1e16')); R.disco(260, 37, 2.5, ROJO); R.pset(259, 36, hex('#f89080'));
  { const g = ((t * 0.35) % 1.6) * 40 - 8; for (let j = 0; j < 23; j++) { const x = N(237 + g + j * 0.5); if (x >= 238 && x <= 266) R.pset(x, 20 + j, BL); } }
  // el tablón de corcho con notas, una foto del valle y un plano de rayas; la nota de abajo aletea con el aire
  marco(232, 84, 256, 134);
  for (let y = 86; y <= 132; y++) for (let x = 234; x <= 254; x++) { const v = hh(x, y, 3); R.pset(x, y, v < 0.18 ? hex('#8a5a30') : v < 0.6 ? hex('#b07a44') : v < 0.9 ? hex('#c08a50') : hex('#d8a468')); }
  R.rect(235, 88, 245, 97, K); R.rect(236, 89, 244, 92, hex('#9ac8e8')); R.rect(236, 93, 244, 96, hex('#d8b070')); R.pset(240, 92, hex('#c89a58')); R.pset(239, 92, hex('#c89a58')); R.disco(240, 88, 1, hex('#3a6ad8'));
  R.rect(247, 90, 254, 100, hex('#f8f0a0')); for (let j = 0; j < 3; j++) R.rect(248, 93 + j * 2, 248 + 3 + j, 93 + j * 2, hex('#8a7c50')); R.disco(250, 90, 1, ROJO);
  R.rect(236, 103, 252, 115, BL); R.rect(237, 104, 251, 114, hex('#e8eef0')); R.linea(238, 112, 244, 106, hex('#3a6ac8')); R.linea(244, 106, 250, 109, hex('#3a6ac8')); R.rect(243, 105, 245, 107, ROJO); R.disco(244, 103, 1, hex('#4a9a4a'));
  { const lev = air < -0.2 ? N((-air - 0.2) * 4) : 0; R.rect(238, 118, 250, 130 - lev, hex('#f4ecd8')); for (let j = 0; j < 3; j++) R.rect(240, 121 + j * 3, 247, 121 + j * 3, hex('#9a8a70')); if (lev > 0) { R.rect(244, 130 - lev, 250, 131 - lev, hex('#d8ccb0')); } R.disco(244, 118, 1, ROJO); }
  // el perchero de pared: la chaqueta y el bolso cuelgan de sus ganchos y se mecen con el aire del ventilador
  R.rect(288, 82, 317, 85, K); R.rect(289, 83, 316, 84, MAD[3]); R.rect(289, 83, 316, 83, MAD[4]);
  { const sw = air * 1.4, b = N(sw); R.rect(298, 85, 299, 89, hex('#8a8a92'));
    R.poligono([[291, 92], [306, 92], [309 + b, 122], [288 + b, 122]], K); R.poligono([[292, 93], [305, 93], [308 + b, 121], [289 + b, 121]], hex('#4a5a48'));
    R.poligono([[292, 93], [297, 93], [295 + b, 120], [290 + b, 120]], hex('#5e7058')); R.linea(298, 90, 296, 104, hex('#2a3428')); R.linea(299, 90, 301, 104, hex('#2a3428'));
    R.poligono([[295, 90], [302, 90], [299, 99]], hex('#e8e4d8')); R.rect(297, 108, 300, 108, hex('#2a3428')); R.pset(303 + b, 112, hex('#c8b070')); R.pset(303 + b, 116, hex('#c8b070'));
    R.linea(306, 95, 309 + b, 119, hex('#2a3428')); R.rect(291, 89, 306, 91, K); R.rect(292, 89, 305, 90, hex('#5e7058'));
    R.rect(313, 85, 314, 88, hex('#8a8a92')); const bb = N(air * 2); R.linea(313, 88, 309 + bb, 104, K); R.linea(314, 88, 317 + bb, 104, K);
    R.rect(308 + bb, 104, 318, 116, K); R.rect(309 + bb, 105, 317, 115, hex('#8a5a30')); R.rect(309 + bb, 105, 317, 106, hex('#a87444')); R.rect(312 + bb, 109, 314 + bb, 110, hex('#d8b060')); }
  // el cable del teléfono que baja rizado hasta su caja en el zócalo
  for (let y = 146; y < 167; y++) R.pset(N(249 + Math.sin(y * 1.3) * 1.5 + Math.sin(t * 1.1) * 0.6), y, K);
  R.rect(245, 166, 253, 172, K); R.rect(246, 167, 252, 171, hex('#e8e0c8')); R.rect(248, 169, 250, 169, K);
  // bajo la balda, en el suelo: tres legajos atados con cuerda, apilados contra la pared, y la papelera de rejilla
  for (let k = 0; k < 3; k++) { const y0 = 172 - k * 9, x0 = 262 + [0, 3, -1][k], x1 = x0 + 34 - k * 2, col = [hex('#c8b890'), hex('#a8b088'), hex('#d8c8a0')][k];
    R.rect(x0, y0 - 8, x1, y0, K); R.rect(x0 + 1, y0 - 7, x1 - 1, y0 - 1, col); R.rect(x0 + 1, y0 - 7, x1 - 1, y0 - 7, hex('#f0e6c8'));
    for (let j = y0 - 5; j < y0 - 1; j += 2) R.rect(x0 + 1, j, x1 - 1, j, hex('#e8dcc0')); R.rect(x0 + 1, y0 - 1, x1 - 1, y0 - 1, hex('#8a7a5a'));
    const cx = x0 + 12 + k * 3; R.rect(cx, y0 - 8, cx, y0, hex('#6a4a2a')); R.rect(x0, y0 - 4, x1, y0 - 4, hex('#6a4a2a')); R.pset(cx + 1, y0 - 9, hex('#6a4a2a')); R.pset(cx + 2, y0 - 10, hex('#6a4a2a')); }
  R.rect(262, 173, 300, 179, hex('#2a1c10'));
  R.poligono([[302, 162], [318, 162], [316, 179], [304, 179]], K); R.poligono([[303, 163], [317, 163], [315, 178], [305, 178]], hex('#6a6a72'));
  for (let y = 165; y < 178; y += 3) R.linea(304, y, 316, y, hex('#4a4a52')); for (let x = 306; x < 316; x += 3) R.linea(x, 163, x, 178, hex('#8a8a92'));
  R.disco(307, 162, 3, hex('#f4ecd8')); R.disco(312, 161, 2.5, hex('#e8e0c8')); R.pset(306, 161, hex('#c8bca0')); R.pset(313, 160, BL);
}

// 1 · el calendario: los días que pasan y el sello que no baja
const D0 = 14 / 19;   // ya están tachados los catorce primeros días: la mano trabaja en la fila del 15 al 20
const p1 = (t) => {
  // la mano tacha desde 0,6 s hasta «if it came through», se para y señala; luego tacha el último antes del corte
  const pausa = suave(tramo(t, CAME - 0.55, CAME - 0.1)), golpea = t > CAME - 0.4 ? N(Math.abs(Math.sin(t * 7)) * 2) : 0;
  const prog = tramo(t, 0.6, CAME - 0.5);
  const dias = lerp(D0, 1, prog);
  const g = T.ladera(R, t, { encuadre: 'permiso', camara: 'calendario', dias, hoy: 20 });
  pared(t);
  // el sello en su balda: en «permit» y «Supreme Council» brilla y sale la «?»; no baja
  const s = tramo(t, 0.3, 0.7) - tramo(t, EQUIPO - 0.3, EQUIPO) + tramo(t, CAME - 0.3, CAME);
  if (s > 0) { globo(268, 86 + N(Math.sin(t * 3) * 1.5), '?', hex('#3a6ac8'));
    if (t > CONSEJO - 0.2 && t < CONSEJO + 0.8) { const k = (t - CONSEJO) * 4; for (const [dx, dy] of [[-10, 0], [10, 0], [0, -10], [0, 14]]) R.pset(266 + N(dx * (0.6 + k * 0.1)), 116 + N(dy * (0.6 + k * 0.1)), ORO); } }
  // la punta del lápiz: al final del trazo del día que se está tachando
  const di = dias * 19, hasta = Math.floor(di + 1e-6), frac = di - hasta;
  const d = Math.min(19, Math.max(1, frac > 0 ? hasta : hasta)), k = d - 1, cx = 66 + (k % 7) * 22, cy = 64 + Math.floor(k / 7) * 20;
  const nn = dias < 1 ? Math.min(1, frac * 3 + 0.4) : 1, ii = 3 + 15 * nn;
  let tx = cx + ii, ty = cy + 2 + ii * 0.9;
  if (pausa > 0) { tx = lerp(tx, 194, pausa); ty = lerp(ty, 121, pausa); }   // va al 20 rodeado
  const entra = suave(tramo(t, 0.1, 0.7)), oy = (1 - entra) * 90;
  ty += oy - golpea;
  // el lápiz rojo (punta en tx, ty), largo y sujeto cerca de la punta; el brazo corto entra en diagonal desde abajo a
  // la derecha (hombro fuera de cuadro, muy empinado: se ven unos 45 px de manga)
  R.linea(N(tx), N(ty), N(tx + 10), N(ty + 10), K); R.linea(N(tx + 1), N(ty), N(tx + 10), N(ty + 9), hex('#d84a2a')); R.linea(N(tx), N(ty + 1), N(tx + 9), N(ty + 10), hex('#a02a1a')); R.pset(N(tx), N(ty), ROJO); R.pset(N(tx + 10), N(ty + 10), hex('#e8b0a0'));
  const wx = N(tx + 20), wy = N(ty + 11);
  T.brazo(R, wx + 16, 206, wx, wy, '#e8e0d0', -1, { codo: [wx + 9, wy + 26] });
  return g;
};

// 2 · el valle en 2026: la perforadora que espera; el técnico que espera abajo
const p2 = (t) => {
  const o = { encuadre: 'valle', epoca: 2026, luz: 'dia' };
  T.valle(R, t, o);
  // la perforadora que espera: la luz ámbar de espera en la antena de su caja (con su halo), el piloto rojo que
  // parpadea, el banderín de la torre y la cincha suelta de la lona, que aletean con el aire
  { const on = (t % 1.2) < 0.6, bx = 250, by = 59;
    const lz = on ? ORO : hex('#8a6a2a'); R.rect(bx, by + 2, bx, by + 3, K); R.rect(bx - 2, by + 1, bx + 2, by + 1, K); R.rect(bx - 2, by - 1, bx - 2, by, K); R.rect(bx + 2, by - 1, bx + 2, by, K); R.pset(bx - 1, by - 2, K); R.pset(bx + 1, by - 2, K); R.pset(bx, by - 3, K);
    R.rect(bx - 1, by - 1, bx + 1, by, lz); R.pset(bx, by - 2, lz); R.pset(bx - 1, by - 1, on ? BL : hex('#a88040'));
    if (on) for (let a = 0; a < 6.28; a += 0.5) { const x = N(bx + Math.cos(a) * 3), y = N(by + Math.sin(a) * 3); R.pset(x, y, mez(R.pget(x, y), ORO, 0.45)); }
    if (Math.floor(t * 3) % 2) R.pset(252, 64, ROJO);
    const fl = Math.sin(t * 6) * 1.5; R.linea(241, 34, 241, 27, K); R.poligono([[242, 27], [248 + N(fl), 28 + N(fl * 0.5)], [242, 30]], ROJO); R.pset(243, 28, BL);
    const cf = Math.sin(t * 5.3); R.linea(244, 66, 248 + N(cf * 2), 69 + N(Math.abs(cf)), hex('#8a7a5a')); R.linea(245, 66, 249 + N(cf * 2), 69 + N(Math.abs(cf)), hex('#c4b89c')); }
  // la nevera y la caja del equipo, en la arena de la derecha
  R.rect(272, 147, 294, 157, K); R.rect(273, 148, 293, 156, hex('#3a7ac8')); R.rect(273, 148, 293, 149, hex('#8ab8e8')); R.rect(279, 146, 287, 147, K); R.rect(274, 156, 293, 157, hex('#c8a870'));
  // el técnico del equipo: mira el reloj, da unas vueltas, mira el móvil y se encoge de hombros
  const ronda = tramo(t, NOV + 0.4, MEDIO), xt = N(246 + Math.sin(ronda * Math.PI * 2) * 12);
  const reloj = t > NOV - 0.5 && t < NOV + 0.4, movil = t > MEDIO && t < NADA, hombros = t > NADA && t < ANUNCIO + 0.6;
  const dirT = ronda > 0 && ronda < 1 ? (Math.cos(ronda * Math.PI * 2) > 0 ? 1 : -1) : -1;
  const r = R.actor(EL.tecnico, xt, 156, t, { dir: dirT, anda: ronda > 0 && ronda < 1, sostiene: reloj ? [xt + (dirT > 0 ? 13 : 2), 140] : movil ? [xt + (dirT > 0 ? 15 : 0), 138] : undefined, brazos: hombros, triste: hombros || movil });
  if (movil) { const [mx, my] = r.mano; R.rect(mx - 1, my - 7, mx + 3, my, K); R.rect(mx, my - 6, mx + 2, my - 1, hex('#5a8ad8')); }
  if (reloj) globo(xt + 8, 112, 'reloj', hex('#3a3a44'));
  if (t > NADA + 0.2) globo(xt + 8, 112, '?', hex('#3a6ac8'));
  // dos turistas bajan por el asfalto y se paran en el cuadro; una señala la máquina parada, la otra la fotografía en
  // «mid-November» y, en «no decision», se vuelven la una a la otra y miran la foto en la pantallita
  const uu = lerp(0.18, 0.6, suave(tramo(t, P2 + 0.1, NOV + 0.7))), anda = t > P2 + 0.15 && t < NOV + 0.65;
  const x1 = N(lerp(198, 140, uu)), s1 = N(lerp(150, 176, uu));
  const mira = t > NOV + 0.7, foto = t > MEDIO - 0.3 && t < NADA, ensena = t > NADA + 0.1;
  R.actor(EL.turista2, x1 - 20, s1 + 4, t, { dir: mira ? 1 : -1, anda, sonrisa: true, dedo: t > NOV + 0.8 && t < MEDIO - 0.2 });
  const rt = R.actor(EL.turista1, x1, s1, t, { dir: ensena ? -1 : mira ? 1 : -1, anda, sostiene: foto ? [x1 + 16, s1 - 22] : ensena ? [x1 - 3, s1 - 7] : undefined, sonrisa: true });
  if (foto) { const [mx, my] = rt.mano; R.rect(mx - 2, my - 5, mx + 5, my, K); R.rect(mx - 1, my - 4, mx + 4, my - 1, hex('#3a3a44')); R.pset(mx + 3, my - 3, hex('#8ad8f8')); if (t > MEDIO + 0.3 && t < MEDIO + 0.45) R.disco(mx + 6, my - 3, 5, BL); }
  if (ensena) { const [mx, my] = rt.mano; R.rect(mx - 4, my - 5, mx + 3, my, K); R.rect(mx - 3, my - 4, mx + 2, my - 1, hex('#8ad8f8')); R.rect(mx - 2, my - 3, mx + 1, my - 2, hex('#d8a860')); R.pset(mx, my - 4, hex('#ff9a2a')); }
  T.valleDelante(R, t, o);
};

const efectos = [[0.7, 'lapiz'], [CONSEJO, 'brillo'], [2.9, 'lapiz'], [EQUIPO, 'lapiz'], [CAME, 'toc'],
  [NOV - 0.3, 'tic'], [MEDIO + 0.3, 'flash'], [NADA + 0.2, 'pop']];
T.rodar(E, R, [[0, p1], [P2, p2]], { efectos, año: 2026 });
</script>
