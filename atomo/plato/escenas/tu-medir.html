<script type="module">
// TU-MEDIR (frases 26–27), hoy (2026), sin cartela. Siete planos (cortes en Radar · Gravity · rubble · (silencio) ·
// they could be · And the team):
// 1. la pizarra de Atom: se dibujan uno a uno los cinco estudios (tres radares de mano, el de carrito y el gravímetro)
//    con sus respuestas ✓ ✗ ✗ ? ?; debajo, sus cinco autores levantan el dedo cuando sale la suya (sonríe el del ✓, se
//    enfadan los del ✗, se encogen los de la ?) y en «each tool measures something different» se ponen a discutir por
//    parejas con sus globos (la barra del año va 2015 → 2024 con cada dibujo);
// 2. el corte de roca (inserto): bajo un cielo de desierto con nubes de tres tonos a tres velocidades, tres milanos y
//    dunas con relieve (todo por detrás del radar), la mano del técnico (brazo corto desde arriba) pulsa el radar en
//    «Radar»; la onda baja y rebota en el escombro en «material» (chispazo y el filo de la franja a trazos); en «not
//    empty space» sale un hueco vacío tachado; el cronómetro corre;
// 3. las flechas de la gravedad (inserto): en «Gravity» la mano del geofísico señala; el hueco crece en «missing mass» y
//    las flechas de encima menguan; en «not doors» la puerta dibujada a tiza al lado del hueco se tacha con una X;
// 4. la esfera del aparato en su carcasa de baquelita (mandos, interruptor, led que late y se pone rojo en «fool», asa de
//    cuero) sobre una mesa de campo de pino con el cuaderno de trazos, el lápiz, tornillos, el destornillador, el cable,
//    el termo que humea y la lona doblada: en «rubble», «crack» y «plaster wall» salen sus tres fichas sobre la mesa y la
//    aguja da un salto con cada una; en «fool» se sale de la banda gris y vuelve; en «Measuring» la mano (brazo corto
//    desde abajo) da dos golpecitos al cristal, la aguja se calma y sale la «?»;
// 5. el busto de la reina (el nuestro) en su vitrina: desde el corte entra el puntero de un guía, que toca el cristal
//    delante de la corona; un brillo cruza el cristal en «rooms»; la «?» grande sale en «Nefertiti's»; el puntero se
//    retira y la mano se levanta con el «!» de aviso en «warn»;
// 6. otros arqueólogos avisan, en una sala de congresos (el decorado de la rueda de prensa, sin cifra): en la pantalla,
//    el corte con la tumba y la mancha; en «storage rooms», «family tomb» y «passage» baja de la mancha una flecha a
//    trazos a su recuadro azul con «?» (jarras, dos coronas, un pasillo que acaba contra la roca) y el arqueólogo de
//    turno se levanta con el dedo arriba; en «never finished» el tercero da dos golpecitos y la roca del pasillo parpadea;
// 7. la mesa de Atom delante de la pizarra (lámpara verde, papeles con los cinco estudios, taza que humea, libros, carrete
//    de cable, cactus y LA CAMARITA DE VERDAD en su soporte): Atom baja de su esquina a la mesa a mirar el recuadro vacío;
//    en «admits» la camarita se enciende y la mano del rotulador baja desde arriba (brazo corto) al recuadro, duda en
//    «hasn't reached» (va y viene sin escribir) y pone tres puntos gordos en «final conclusion… yet» (Atom brinca con
//    cada uno); la mano se sube y Atom vuelve a su esquina.
import * as T from '/atomo/plato/escenas/tu-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('tu-medir');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const TU = T.ELENCO_TU, PZ = T.PIEZAS_TU, N = Math.round;
const K = hex('#17151d'), BL = hex('#f6f2ea'), ROJO = hex('#d8402c'), AZ = hex('#3a6ac8'), ORO = hex('#ffd860');
const ease = (u) => u * u * (3 - 2 * u);
const destello = (x, y, r, c = BL) => { x = N(x); y = N(y); for (let i = -r; i <= r; i++) { R.pset(x + i, y, c); R.pset(x, y + i, c); } };
// el globito con un símbolo encima de alguien (o de algo)
const globo = (x, y, ic, c = ROJO) => { x = N(x); y = N(y); R.disco(x, y, 7, K); R.disco(x, y, 6, BL); R.pset(x - 5, y + 7, K); R.pset(x - 4, y + 6, BL); R.icono(ic, x - (ic === '?' ? 2 : 1), y - 4, c, null, 1); };
// una chispa de cuatro puntas que se abre y se cierra (u 0–1)
const chispa = (x, y, u, c = ORO) => { const r = N(Math.sin(Math.min(1, Math.max(0, u)) * Math.PI) * 3); if (r > 0) destello(x, y, r, c); };
// ruido fijo (0–1) y búferes de lo que no se mueve: se dibujan una vez y se pegan por zonas cada fotograma
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const fijo = (dibuja) => { let b = null; return () => { if (!b) { b = R.nuevo(); b.fill(0); const prev = R.usar(b); dibuja(); R.usar(prev); } return b; }; };
const pegaZona = (b, x0, y0, x1, y1) => { const B = R.buf; for (let y = y0; y <= y1; y++) B.set(b.subarray(y * 320 + x0, y * 320 + x1 + 1), y * 320 + x0); };
// un disco que no pinta donde dice la máscara (lo que pasa por detrás de algo)
const discoM = (cx, cy, r, c, tapa) => { cx = N(cx); cy = N(cy); for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) if (i * i + j * j <= r * r + r * 0.6) { const x = cx + i, y = cy + j; if (!tapa(x, y)) R.pset(x, y, c); } };

const wm = (s) => en('medir', (s - 0.9) / 17.985), wf = (s) => en('familia', (s - 20.386) / 14.284);   // segundo de la voz inglesa → instante
const P2 = wm(5.7), P3 = wm(9.4), P4 = wm(13.05), P5 = wm(19.6), P6 = wf(25.15), P7 = wf(30.75);

// 1 · la pizarra: cinco estudios, cinco respuestas
const T0 = wm(0.25), T1 = wm(3.35), DIF = wm(2.4), DISCUTE = wm(3.8);
const tr1 = (t) => tramo(t, T0, T1);
const AUT = [[TU.watanabeTU, 79], [TU.natgeoTU, 120], [TU.porcelliTU, 160], [TU.eldamatyTU, 200], [TU.geofisico1TU, 241]];
const p1 = (t) => {
  const tr = tr1(t), g = T.hoy(R, t, { encuadre: 'pizarra', n: 5, respuestas: ['✓', '✗', '✗', '?', '?'], traza: tr });
  const disc = t > DISCUTE;
  AUT.forEach(([d, cx], i) => {
    const f = tr * 5 - i, sale = f >= 0.85, x = cx - 7;
    // cuando sale su respuesta, un pasito al frente y el dedo arriba; luego, a discutir por parejas
    const paso = N(ease(tramo(f, 0.6, 0.9)) * 2);
    let dir = i < 2 ? 1 : i > 2 ? -1 : (Math.sin(t * 0.9) > 0 ? 1 : -1);
    if (disc) dir = [1, -1, 1, -1, -1][i];
    const habla = disc && Math.sin(t * 9 + i * 1.7) > 0.1 && ((N(t * 1.2) + i) % 2 === 0);
    const o = { dir, habla, salto: sale && f < 1.2 ? N(Math.sin((f - 0.85) / 0.35 * Math.PI) * 3) : 0 };
    if (sale && !disc) o.dedo = true;
    if (sale) { if (i === 0) o.sonrisa = true; else if (i < 3) o.enfado = true; else o.sorpresa = !disc || i === 4; }
    if (disc && i === 1 && Math.sin(t * 3) > 0) o.dedo = true;
    R.actor(d, x, 162 + paso, t, o);
  });
  // los globos de la discusión: el del ✓ y el del ✗, y los dos de la «?» que no saben
  if (disc) {
    const b = (k) => N(Math.sin(t * 5 + k) * 1.5);
    if (Math.sin(t * 2.2) > -0.3) globo(86, 127 + b(0), '!', ROJO);
    if (Math.sin(t * 2.2) < 0.3) globo(128, 127 + b(1), '!', ROJO);
    globo(207, 127 + b(2), '?', AZ); if (t > DISCUTE + 0.6) globo(248, 127 + b(3), '?', AZ);
  }
  T.hoyDelante(R, t, { encuadre: 'pizarra' });
};

// 2 · el corte de roca: el radar ve cambios de material
// el cielo del desierto encima del corte: nubes de tres tonos a tres velocidades (lejos, en medio y cerca), tres
// milanos que planean y aletean, y las dunas con relieve (crestas al sol, caras en sombra, rizos, una acacia y un
// mojón lejanos). Todo pasa por DETRÁS del radar (x 130–170, y 22–58): la máscara no lo pinta encima
const tapaRadar = (x, y) => x >= 130 && x <= 170 && y >= 22 && y <= 58;
const NUBE = [[hex('#c4d8e8'), hex('#d6e6f0'), hex('#e8f0f6')], [hex('#b4cce0'), hex('#dfeaf3'), hex('#f6fafc')], [hex('#a4bed4'), hex('#e6eef5'), hex('#ffffff')]];
const nube = (x, y, w, k) => {
  const [cS, cM, cL] = NUBE[k], n = Math.max(3, Math.round(w / 7));
  for (const [dy, c, rr] of [[1, cS, 0], [0, cM, 0], [-1, cL, -1]]) for (let i = 0; i < n; i++) {
    const u = i / (n - 1), r = Math.max(1, N(2 + Math.sin(u * Math.PI) * (2 + k * 1.3) + (hh(i, k, 21) - 0.5) * 2) + rr);
    discoM(x + u * w - (rr ? 1 : 0), y + dy - (rr ? 1 : 0) - N(Math.sin(u * Math.PI) * (1 + k)), r, c, tapaRadar);
  }
  for (let i = 0; i <= w; i++) if (!tapaRadar(N(x + i), N(y + 3))) R.pset(N(x + i), N(y + 3), cS);   // la base plana, en sombra
};
const DUNA = [hex('#c49870'), hex('#d4ac80'), hex('#e6c49a'), hex('#f4dcb4')];
const dunas = () => {
  // la cresta de las dunas de en medio (delante de las colinas lejanas), su cara al sol y su cara en sombra, con rizos
  for (let x = 0; x < 320; x++) {
    const c = (xx) => 49 + 2.6 * Math.sin(xx * 0.043 + 0.6) + 1.6 * Math.sin(xx * 0.11 + 2) , y0 = N(c(x)), sube = c(x + 1) < c(x);
    for (let y = y0; y < 56; y++) { if (tapaRadar(x, y)) continue; const k = y === y0 ? 3 : sube ? (hh(x, y, 22) < 0.12 ? 1 : 2) : (hh(x, y, 23) < 0.2 ? 2 : 1); R.pset(x, y, ((x + y * 3) % 9 === 0 && y > y0 + 1) ? DUNA[k - 1] : DUNA[k]); }
  }
  // las colinas lejanas: vetas de viento y sombra en la falda
  for (let x = 0; x < 320; x++) for (let y = 41; y < 49; y++) if (((x * 2 + y * 5) % 23 === 0) && !tapaRadar(x, y)) R.pset(x, y, hex('#d8b088'));
  // una acacia y un mojón lejanos
  R.rect(57, 41, 57, 46, hex('#6a5038')); R.rect(51, 39, 63, 40, hex('#6a7a48')); R.rect(53, 38, 61, 38, hex('#8a9a58')); R.pset(50, 40, hex('#6a7a48'));
  R.rect(236, 43, 238, 46, hex('#a08460')); R.rect(235, 45, 239, 46, hex('#8a6e4c')); R.pset(237, 42, hex('#b89a70'));
};
const cieloRoca = (t) => {
  dunas();
  // nubes: lejos (lentas, bajas y pequeñas), en medio y cerca (rápidas, altas y grandes). Cada una se queda en su
  // carril durante el plano: fuera de la barra del año (x 20–185, y < 22) y de la esquina de Atom (x > 270, y < 46)
  const d = t - P2;
  for (const [k, v, y, cl] of [[0, 1.6, 35, [[8, 16], [62, 20], [118, 18], [214, 22], [244, 14]]], [1, 3.6, 27, [[4, 26], [70, 30], [196, 24]]], [2, 6.5, 14, [[192, 44]]]])
    cl.forEach(([x0, w]) => nube(x0 + d * v, y, w, k));
  // tres milanos que planean de izquierda a derecha, aleteando de vez en cuando (no pasan por la esquina de Atom)
  for (let k = 0; k < 3; k++) {
    const x = N(((40 + k * 85 + t * (5 + k * 1.5)) % 240) + 20), y = N(29 + k * 2.5 + Math.sin(t * 1.3 + k * 2) * 2), ala = Math.sin(t * 7 + k * 1.7) > 0.4;
    if (tapaRadar(x, y) || (x > 268 && y < 46)) continue;
    const c = hex('#4a3a34'); R.pset(x, y, c); R.pset(x - 1, y - (ala ? 1 : 0), c); R.pset(x + 1, y - (ala ? 1 : 0), c); R.pset(x - 2, y - (ala ? 2 : 0), c); R.pset(x + 2, y - (ala ? 2 : 0), c);
  }
};
const RADAR = wm(6.06), MATERIAL = wm(7.6), VACIO = wm(8.25);
const p2 = (t) => {
  const onda = tramo(t, RADAR, 2 * MATERIAL - RADAR);
  T.radares(R, t, { encuadre: 'canon', camara: 'roca', onda, material: 'escombro' });
  cieloRoca(t);
  // la mano del técnico baja desde arriba a la derecha, sujeta el radar y pulsa en «Radar»; se va en «not empty space»
  // (brazo corto: del borde de arriba a la muñeca se ven ~38 px)
  { const e = ease(tramo(t, P2, RADAR - 0.15)) * (1 - ease(tramo(t, VACIO + 0.3, P3 - 0.2))), pul = t > RADAR - 0.15 && t < RADAR + 0.25 ? 2 : 0;
    if (e > 0) T.brazo(R, 206, -14, N(lerp(212, 182, e)), N(lerp(-16, 34, e)) + pul, '#5a6a8a', -1, { sombra: false }); }
  // «material»: el filo de la franja del escombro se enciende a trazos (ahí rebota la onda)
  const fi = tramo(t, MATERIAL - 0.1, MATERIAL + 0.2) * (1 - tramo(t, P3 - 0.6, P3 - 0.1));
  if (fi > 0) for (let x = 24; x < 24 + N(fi * 208); x++) if (((x + N(t * 16)) >> 2) % 2) { R.pset(x, 123, ORO); R.pset(x, 140, ORO); }
  // «not empty space»: el hueco vacío (un recuadro oscuro, al lado) que sale tachado: el radar no ve vacíos, ve materiales
  const x = tramo(t, VACIO - 0.25, VACIO + 0.3);
  if (x > 0) { const X0 = 60, Y0 = 148, s = N(8 * Math.min(1, x * 1.6));
    R.rect(X0 - 12, Y0 - 9, X0 + 12, Y0 + 9, K); R.rect(X0 - 11, Y0 - 8, X0 + 11, Y0 + 8, hex('#2a2018')); for (let i = -10; i <= 10; i += 3) R.pset(X0 + i, Y0 + 7, hex('#4a3a2a'));
    if (t > VACIO) for (let k = -s; k <= s; k++) { R.rect(X0 + k - 1, Y0 + k - 1, X0 + k + 1, Y0 + k + 1, BL); R.rect(X0 + k - 1, Y0 - k - 1, X0 + k + 1, Y0 - k + 1, BL); }
    if (t > VACIO) for (let k = -s + 1; k <= s - 1; k++) { R.rect(X0 + k, Y0 + k, X0 + k, Y0 + k + 1, ROJO); R.rect(X0 + k, Y0 - k - 1, X0 + k, Y0 - k, ROJO); } }
  if (t > MATERIAL - 0.05 && t < MATERIAL + 0.5) { chispa(150, 124, (t - MATERIAL + 0.05) / 0.55, BL); chispa(140, 128, (t - MATERIAL) / 0.5); }
};

// 3 · las flechas: la gravedad ve masa que falta, no puertas
const GRAV = wm(9.6), MASA = wm(10.4), PUERTA = wm(11.3);
const puerta = (x, y, c) => { R.rect(x, y, x + 15, y, c); R.rect(x, y, x, y + 24, c); R.rect(x + 15, y, x + 15, y + 24, c); R.rect(x + 3, y + 4, x + 12, y + 4, c); R.rect(x + 3, y + 4, x + 3, y + 22, c); R.rect(x + 12, y + 4, x + 12, y + 22, c); R.rect(x + 9, y + 13, x + 10, y + 14, c); R.rect(x - 2, y + 24, x + 17, y + 24, c); };
const p3 = (t) => {
  const g = T.ladera(R, t, { encuadre: 'gravedad', camara: 'flechas', hueco: ease(tramo(t, GRAV, MASA + 0.4)) });
  // la puerta, a tiza, al lado del hueco: sale en «not» y se tacha en «doors»
  const pu = tramo(t, PUERTA - 0.35, PUERTA - 0.1);
  if (pu > 0) { puerta(208, 141, hex('#5a4630')); puerta(207, 140, pu < 1 && Math.floor(t * 20) % 2 ? hex('#c8b898') : BL); }
  const x = tramo(t, PUERTA, PUERTA + 0.3);
  if (x > 0) { const s = N(4 + 9 * x); for (let k = -s; k <= s; k++) { R.rect(214 + k, 152 + k, 216 + k, 153 + k, K); R.rect(214 + k, 152 - k, 216 + k, 153 - k, K); } for (let k = -s + 1; k <= s - 1; k++) { R.rect(215 + k, 152 + k, 215 + k, 153 + k, ROJO); R.rect(215 + k, 152 - k, 215 + k, 153 - k, ROJO); } }
  // la mano del geofísico entra por abajo y señala el hueco en «missing mass»; luego la puerta
  const e = ease(tramo(t, GRAV - 0.2, MASA)), s2 = ease(tramo(t, PUERTA - 0.2, PUERTA + 0.3)), sal = ease(tramo(t, P4 - 0.6, P4 - 0.05));
  const hx = N(lerp(lerp(118, 112, e), 184, s2)), hy = N(lerp(196, lerp(158, 150, e), Math.min(1, e + s2)) + sal * 40 + (t > MASA - 0.1 && t < MASA + 0.3 ? 2 : 0));
  T.brazo(R, hx - 40, 200, hx, hy, '#7a6a4a', 1, { codo: [hx - 26, hy + 26], sombra: false });
  if (t > MASA && t < MASA + 0.5) chispa(160, 150, (t - MASA) / 0.5, BL);
};

// 4 · la esfera: cascotes, grieta o yeso engañan; medir no es mirar
const CASC = wm(13.18), GRIETA = wm(13.74), YESO = wm(14.6), FOOL = wm(15.26), OTRA = wm(16.3), MIDE = wm(17.22), MIRA = wm(18.36);
const ficha = (y, k, u) => {
  if (u <= 0) return; const x0 = 280, x1 = 316, y0 = y + N((1 - ease(u)) * 6), y1 = y0 + 28;
  R.rect(x0 + 1, y0 + 1, x1 + 1, y1 + 1, hex('#8a8478')); R.rect(x0, y0, x1, y1, K); R.rect(x0 + 1, y0 + 1, x1 - 1, y1 - 1, hex('#f4ecd8'));
  R.disco(N((x0 + x1) / 2), y0 + 1, 1, ROJO);
  const cx = N((x0 + x1) / 2), b = y1 - 4;
  if (k === 0) {        // cascotes: un montón de piedras grises en el suelo de un pasillo
    R.rect(x0 + 3, b, x1 - 3, b, hex('#8a7a5a')); for (const [i, j, r] of [[-8, -2, 3], [-2, -3, 3], [5, -2, 3], [-5, -6, 2], [2, -7, 2], [9, -5, 2], [-11, -4, 2]]) { R.disco(cx + i, b + j, r, K); R.disco(cx + i, b + j, r - 1, hex('#a8a090')); R.pset(cx + i - 1, b + j - 1, hex('#d8d0c0')); }
  } else if (k === 1) { // grieta: la roca con su raja en zigzag
    R.rect(x0 + 3, y0 + 4, x1 - 3, b, hex('#d8b88a')); for (let j = y0 + 7; j < b; j += 5) R.rect(x0 + 3, j, x1 - 3, j, hex('#c8a474'));
    let px = cx - 2; for (let j = y0 + 4; j <= b; j++) { const nx = cx - 2 + ((j >> 2) % 2 ? 3 : -2); R.pset(nx, j, K); R.pset(nx + 1, j, hex('#5a3a20')); px = nx; }
  } else {              // yeso: una pared de ladrillo con una mancha de yeso blanco encima
    for (let j = y0 + 4; j < b; j += 4) { R.rect(x0 + 3, j, x1 - 3, j + 2, hex('#c87a52')); R.rect(x0 + 3, j + 3, x1 - 3, j + 3, hex('#8a4a32')); for (let i = x0 + 3 + ((j >> 2) % 2) * 3; i < x1 - 3; i += 6) R.pset(i, j, hex('#8a4a32')); R.pset(i0(j), j + 1, hex('#8a4a32')); }
    R.disco(cx + 2, y0 + 13, 7, hex('#ece6d8')); R.disco(cx - 4, y0 + 16, 5, hex('#ece6d8')); R.pset(cx + 6, y0 + 10, hex('#fffaf0'));
  }
};
const i0 = (j) => 290 + (j % 3);
const golpe = (t, a, d = 0.5, h = 0.25) => { const u = (t - a) / d; return u > 0 && u < 1 ? Math.sin(u * Math.PI) * h * (1 - u * 0.5) : 0; };
// LA MESA DE CAMPO (fija): tablones de pino con vetas, juntas y nudos, la carcasa de baquelita del aparato alrededor de
// la esfera (con su sombra, remaches, dos mandos, el interruptor y el asa de cuero con costuras), el cuaderno abierto
// con trazos de sismógrafo, el lápiz, tornillos sueltos y el destornillador, el cable que sale del aparato, el termo
// y un rollo de cinta. Arriba a la derecha (la esquina de Atom), la lona doblada, lisa y tranquila. Cada fotograma se
// pega todo menos la esfera (x 46–274, y 40–179), y encima van el led que parpadea y el vapor del termo
const PINO = [hex('#8a6038'), hex('#a87a4a'), hex('#bc9060'), hex('#cca472'), hex('#dcb888'), hex('#ead0a4')];
const mesaCampo = fijo(() => {
  const { rect, pset, disco, linea } = R;
  for (let y = 0; y < 180; y++) { const tabla = Math.floor((y + 6) / 22), yy = (y + 6) % 22;
    for (let x = 0; x < 320; x++) {

// lámpara verde con su charco de luz, los papeles con los cinco estudios en miniatura, la taza que humea, clips, el
// carrete de cable y un cactus) y en su soporte de pruebas LA CAMARITA DE VERDAD; detrás, el final de la fila en la pizarra
const ADMITE = wf(31.65), DUDA = wf(32.5), FINAL = wf(33.23), YET = wf(34.11), FIN = E.duracion;

const BAJA = P7 + 0.15, LLEGA = BAJA + 0.75, VUELVE = YET + 0.35, ESTA = Math.min(FIN - 0.25, VUELVE + 0.8);
const ESQ = R.companero, AT7 = [298, 92];

const atomAbajo = (ax, ay, t, o = {}) => {

};
const vuelo = (a, b, u, alto) => [lerp(a[0], b[0], ease(u)), lerp(a[1], b[1], ease(u)) - Math.sin(u * Math.PI) * alto];
const NOG = [hex('#2e1a0e'), hex('#4a2a18'), hex('#5e3620'), hex('#744628'), hex('#8c5834'), hex('#a87044')];
const MESA_Y = 106;
const mesaAtom = fijo(() => {
  const { rect, pset, disco, linea } = R;
  for (let y = MESA_Y; y < 180; y++) for (let x = 0; x < 320; x++) {

const p7 = (t) => {
  const g = T.hoy(R, t, { encuadre: 'pizarra', camara: 'final', ojo: 0 }), [rx, ry] = g.recuadro || [216, 50];
  // la mesa delante (fija) y, encima, la lámpara, el vapor de la taza y la camarita en su soporte
  pegaZona(mesaAtom(), 0, MESA_Y, 319, 179);
  // la lámpara de banquero: el pie de latón, el brazo, la pantalla verde con su luz por dentro y la cadenita que se mece
  R.rect(14, 128, 42, 133, K); R.rect(15, 129, 41, 132, hex('#b88a30')); R.rect(15, 129, 41, 129, hex('#f0c860'));
  R.rect(27, 100, 30, 128, K); R.rect(28, 100, 29, 128, hex('#d8a840'));
  R.poligono([[18, 88], [38, 88], [46, 101], [10, 101]], K); R.poligono([[19, 89], [37, 89], [44, 100], [12, 100]], hex('#2a6a4a'));
  R.linea(20, 90, 36, 90, hex('#5aaa7a')); R.linea(16, 95, 22, 92, hex('#4a9a6a')); R.rect(11, 101, 45, 102, hex('#fff0b0')); R.rect(13, 103, 43, 103, hex('#f8e090'));
  { const c = N(Math.sin(t * 2.1) * 1.5); R.linea(40, 101, 40 + c, 110, hex('#d8a840')); R.disco(40 + c, 111, 1, hex('#f0c860')); }
  for (let k = 0; k < 3; k++) for (let i = 0; i < 18; i++) { const y = N(119 - i * 1.4 - ((t * 8 + k * 4) % 5)), x = N(118 + k * 3 + Math.sin(t * 2 + i * 0.42 + k * 2.1) * (1 + i * 0.2));
    if (hh(i, k + Math.floor(t * 6), 54) < 0.78 - i * 0.035) R.pset(x, y, i > 10 ? hex('#d8d4cc') : hex('#f4f0e8')); }
  // el soporte: la varilla, el brazo y la camarita que cuelga (se enciende en «admits», cuando el equipo reconoce)
  R.rect(267, 80, 270, 134, K); R.rect(268, 80, 269, 134, hex('#9aa0a8')); R.pset(268, 80, BL);
  R.rect(250, 78, 270, 81, K); R.rect(251, 79, 269, 80, hex('#9aa0a8'));
  const luz = t > ADMITE - 0.15, cam = PZ.camarita?.(R, 254, 81, { cable: 3, s: 2, t, luz }), [kx, ky] = cam?.punta || [254, 105];
  if (luz) for (let k = 0; k < 6; k++) { const yy = ky + 2 + k * 2; if (yy < MESA_Y + 8) for (let i = -k; i <= k; i++) if ((i + k + Math.floor(t * 6)) % 3 === 0) R.pset(kx + i, yy, hex('#fff4c0')); }
  if (t > ADMITE - 0.15 && t < ADMITE + 0.4) chispa(kx + 6, ky - 6, (t - ADMITE + 0.15) / 0.55, BL);
  // los tres puntitos rojos, gordos, en el recuadro vacío: «final conclusion… yet»
  const pts = [FINAL - 0.1, FINAL + 0.3, YET - 0.1];
  pts.forEach((a, i) => { const u = tramo(t, a, a + 0.12); if (u > 0) { const x = rx - 8 + i * 8, y = ry + 2; R.disco(x, y, u < 1 ? 1 : 2, ROJO); if (u >= 1) { R.pset(x - 1, y - 1, hex('#f07a5c')); R.pset(x + 1, y + 1, hex('#a02818')); } } });
  // la mano del rotulador: baja desde arriba en «admits» hasta el recuadro, duda en «hasn't reached» (va y viene sin
  // escribir), pone los tres puntos y se vuelve a subir. Brazo corto: del borde de arriba a la muñeca, ≤ 40 px
  const ent = ease(tramo(t, ADMITE - 0.2, ADMITE + 0.45)), sube = ease(tramo(t, YET + 0.15, YET + 0.75));
  let tx = rx + 10, ty = ry - 6;

    tx = rx - 8 + i * 8 + (ap ? 0 : 2); ty = ry + 2 - (ap ? 0 : 3); }

    const px = N(tx), py = N(ty), qx = wx - 12, qy = wy + 4;
    R.linea(px - 1, py, qx - 1, qy, K); R.linea(px + 2, py, qx + 2, qy, K); R.linea(px, py - 1, qx, qy - 1, K); R.linea(px + 1, py + 1, qx + 1, qy + 1, K);
    R.linea(px, py, qx, qy, hex('#eef0f4')); R.linea(px + 1, py, qx + 1, qy, hex('#b8bcc8')); R.disco(px, py, 1, ROJO); R.linea(qx - 2, qy - 1, qx + 1, qy + 2, ROJO);
    T.brazo(R, wx + 12, -10, wx, wy, '#5a8a6a', -1, { sombra: false });
  }
  // Atom: baja a la mesa, junto a la camarita, mira el recuadro, se enciende con los puntos y vuelve a su esquina
  if (t >= BAJA && t <= ESTA) {
    const b = tramo(t, BAJA, LLEGA), v = tramo(t, VUELVE, ESTA);
    let [ax, ay] = b < 1 ? vuelo([297, 24], AT7, b, -10) : v > 0 ? vuelo(AT7, [297, 24], v, -10) : [AT7[0] - 3 * ease(tramo(t, DUDA - 0.3, DUDA + 0.3)), AT7[1] + Math.sin(t * 2.4) * 1.5];

    atomAbajo(ax, ay - brinco, t, { r: N(lerp(10, 11, Math.min(1, b) * (1 - v))), e: t > FINAL - 0.1 && t < YET + 0.4 ? 0.85 : 0.4 });
  }
};

const año = (t) => t < P2 ? [2015, 2016, 2018, 2020, 2024][Math.min(4, Math.floor(tr1(t) * 5))] : 2026;
const efectos = [[T0 + 0.05, 'lapiz'], [T0 + (T1 - T0) * 0.42, 'lapiz'], [T0 + (T1 - T0) * 0.82, 'lapiz'], [DISCUTE + 0.1, 'tic'],
  [RADAR, 'bip'], [MATERIAL, 'toc'], [VACIO + 0.05, 'golpecito'],

T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3], [P4, p4], [P5, p5], [P6, p6], [P7, p7]], { efectos, año });
