<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finkel y el barco redondo · ep34</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// NX-FINKEL (frase 14), 2014 y la tablilla de hacia 1750 a. C. Tres planos:
// 1. el despacho del conservador (museo · conferencia/taller): Finkel entra andando con la tablilla pequeña en la mano,
//    se para a «In 2014» (el calendario parpadea) y la levanta a «Finkel» (destello); la ayudante, detrás de la mesa,
//    deja el portátil, se vuelve y se asombra; a «the same museum» brillan los cajones de tablillas del estante;
// 2. inserto (museo · sala/tablilla, pequeña): la mano del conservador entra con un punzón de bambú y recorre las filas
//    de cuñas; a «3,700» aparece la cifra; a «the instructions for building the boat» la punta sigue el círculo y la
//    espiral de cuerda, que se van trazando; a «One detail» se aparta y salta un «!»;
// 3. el barco redondo (mesopotamia · barco), gag 5: llueve cada vez más; a «it was round» el barco empieza a girar como
//    una peonza, cada vez más deprisa (arcos de giro, salpicaduras, estrellas de mareo sobre los animales); en el
//    ribazo, una garza lo sigue con la cabeza hasta marearse; al final frena.
import * as T from '/atomo/plato/escenas/nx-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('nx-finkel');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const K = hex('#1c1222'), BL = hex('#f6f6ee'), AM = hex('#f8d040'), PZ = T.PIEZAS_NX;
const lin = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));   // tramo() frena al arrancar y al llegar; esto no
const suave = (u) => u * u * (3 - 2 * u);
// posición entre claves [t, x, y…], con arranque y frenada suaves
const kf = (t, Kf) => { if (t <= Kf[0][0]) return Kf[0].slice(1); for (let i = 1; i < Kf.length; i++) if (t <= Kf[i][0]) { const u = (t - Kf[i - 1][0]) / (Kf[i][0] - Kf[i - 1][0]), e = u * u * (3 - 2 * u); return Kf[i].slice(1).map((v, j) => Kf[i - 1][j + 1] + (v - Kf[i - 1][j + 1]) * e); } return Kf[Kf.length - 1].slice(1); };
const chispa = (x, y, r, c = hex('#fff8d0')) => { x = Math.round(x); y = Math.round(y); R.pset(x, y, c); for (let i = 1; i <= r; i++) { R.pset(x + i, y, c); R.pset(x - i, y, c); R.pset(x, y + i, c); R.pset(x, y - i, c); } };
// una estrella con filo oscuro (los mareos, los destellos que tienen que leerse sobre cualquier fondo)
const estrella = (x, y, c = AM) => { x = Math.round(x); y = Math.round(y); for (const [i, j] of [[0, -3], [0, 3], [-3, 0], [3, 0], [-1, -2], [1, -2], [-1, 2], [1, 2], [-2, -1], [2, -1], [-2, 1], [2, 1]]) R.pset(x + i, y + j, K); chispa(x, y, 2, c); R.pset(x, y, BL); };
// línea de 3 px con filo oscuro (flechas y trazos que se leen sobre el decorado)
const trazo = (x0, y0, x1, y1, c) => { for (const [i, j] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) R.linea(Math.round(x0) + i, Math.round(y0) + j, Math.round(x1) + i, Math.round(y1) + j, K); R.linea(Math.round(x0), Math.round(y0), Math.round(x1), Math.round(y1), c); };
// una garza grande (22 px): las patas, el cuerpo, el ala gris, el cuello hasta la cabeza (hx, hy) y el pico
const garzaG = (x, y, hx, hy, dir = 1, o = {}) => {
  x = Math.round(x); y = Math.round(y); hx = Math.round(hx); hy = Math.round(hy);
  R.linea(x - 1, y - 10, x - 1, y, K); R.linea(x + 2, y - 10, x + 2 + (o.pata ? dir : 0), y, K);
  for (let j = -5; j <= 5; j++) for (let i = -7; i <= 7; i++) { const d = (i / 6.4) ** 2 + (j / 4.4) ** 2; if (d <= 1.25) R.pset(x + i, y - 14 + j, d > 0.82 ? K : j > 1 ? hex('#c8ccd8') : BL); }
  R.linea(x - dir * 2, y - 14, x - dir * 6, y - 12, hex('#9aa0b4')); R.linea(x - dir * 1, y - 12, x - dir * 6, y - 11, hex('#9aa0b4')); R.pset(x - dir * 8, y - 12, K); R.pset(x - dir * 9, y - 11, K);
  const nx0 = x + dir * 4, ny0 = y - 17;
  for (const [i, j] of [[-1, 0], [1, 0], [0, -1], [0, 1], [2, 0], [-2, 0]]) R.linea(nx0 + i, ny0 + j, hx + i, hy + j, K);
  R.linea(nx0, ny0, hx, hy, BL); R.linea(nx0 + 1, ny0, hx + 1, hy, BL); R.linea(nx0 - 1, ny0, hx - 1, hy, hex('#c8ccd8'));
  R.disco(hx, hy, 3, K); R.disco(hx, hy, 2, BL); trazo(hx + dir * 3, hy, hx + dir * 9, hy + 1 + (o.pico ?? 0), hex('#f0a030'));
  if (o.mareo) { R.pset(hx + dir, hy - 1, K); R.pset(hx + dir, hy + 1, K); R.pset(hx, hy, K); R.pset(hx + dir * 2, hy, K); } else R.pset(hx + dir, hy - 1, K);
  R.pset(hx - dir, hy - 3, K); R.pset(hx - dir * 2, hy - 4, K);
};

const a = (f) => en('finkel', f);
const P2 = a(0.323), P3 = a(0.7057);
const TWEED = '#8a7450';

// ── 1 · el despacho de 2014: Finkel llega con la tablilla ──
const O1 = { encuadre: 'conferencia', camara: 'taller' };
const en2014 = a(0.1), finkelT = a(0.18), curator = a(0.222), mismo = a(0.271);
const p1 = (t) => {
  T.museo(R, t, O1);
  // el calendario de 2014 parpadea cuando la voz lo dice
  if (t > en2014 && t < en2014 + 1.2 && Math.sin(t * 16) > 0) { for (const [x0, y0, x1, y1] of [[255, 66, 279, 66], [255, 84, 279, 84], [255, 66, 255, 84], [279, 66, 279, 84]]) R.linea(x0, y0, x1, y1, AM); }
  // los cajones de tablillas del estante brillan a «the same museum»
  if (t > mismo) for (const [x, y, f] of [[168, 70, 0], [214, 66, 1.3], [180, 88, 2.1], [232, 78, 3.4], [196, 104, 4.2], [240, 100, 5.5]]) if (Math.sin((t - mismo) * 8 - f) > 0.45) chispa(x, y, 2);
  // la ayudante, detrás de la mesa: teclea, se vuelve y se asombra
  const mira = t > finkelT - 0.25;
  R.actor(EL.geologa3NX, 240, 147, t, { dir: -1, sorpresa: mira && t < curator + 0.5, sonrisa: t >= curator + 0.5, brazos: t > mismo + 0.15 && t < mismo + 0.75 });
  // Finkel
  const u = lin(t, 0.25, en2014 - 0.15), fx = Math.round(lerp(52, 122, u)), anda = u > 0 && u < 1;
  const alza = suave(lin(t, finkelT - 0.35, finkelT));
  const F = R.actor(EL.finkel, fx, 152, t, { dir: 1, anda, sostiene: [fx + 16, Math.round(lerp(139, 123, alza))], habla: !anda && t > en2014 && t < mismo + 0.6 && Math.sin(t * 9) > 0, sonrisa: t > finkelT });
  const [mx, my] = F.mano;
  PZ.tablillaPequena(R, mx + 1, my + 4, {});
  if (alza >= 1) { const b = Math.sin((t - finkelT) * 7); for (let k = 0; k < 6; k++) { const an = k * Math.PI / 3 + t * 0.8, r0 = 11, r1 = 14 + (b > 0 ? 2 : 0); R.linea(Math.round(mx + 1 + Math.cos(an) * r0), Math.round(my - 5 + Math.sin(an) * r0), Math.round(mx + 1 + Math.cos(an) * r1), Math.round(my - 5 + Math.sin(an) * r1), AM); } }
  T.museoDelante(R, t, O1);
  // las teclas del portátil (visto por detrás): la luz de la pantalla en la cara de quien teclea
  if (!mira && Math.floor(t * 9) % 3 !== 0) { R.pset(236, 129, hex('#bfe6ff')); R.pset(233, 128, hex('#bfe6ff')); }
};

// ── 2 · la tablilla pequeña como un móvil: las instrucciones ──
const tabl = a(0.3556), tres = a(0.3957), instr = a(0.527), barco = a(0.635), detalle = a(0.648);
const p2 = (t) => {
  const d = lin(t, instr, barco);
  const o = { encuadre: 'sala', camara: 'tablilla', pequena: true, dibujo: d };
  const G = T.museo(R, t, o), [cx, cy] = G.centro ?? [160, 85];
  // la cifra: unos 3.700 años
  const n = lin(t, tres, tres + 0.75);
  if (n > 0) { R.numero('3700', 194, 32, { tam: 16, n: Math.round(n * 72) }); if (n < 1) chispa(194 + n * 62, 24, 3); }
  // la punta del punzón: lee las filas de abajo, luego sigue el círculo y la espiral, y se aparta
  const s = lin(t, P2 + 0.5, instr - 0.35), fila = Math.min(2, Math.floor(s * 3)), us = (s * 3) % 1;
  const lee = [lerp(144, 176, fila === 1 ? 1 - us : us), 104 + fila * 6];
  const ang = d < 0.35 ? -Math.PI / 2 + (d / 0.35) * Math.PI * 2 : -Math.PI / 2 + ((d - 0.35) / 0.65) * Math.PI * 5, rr = d < 0.35 ? 17 : 17 * (1 - (d - 0.35) / 0.65 * 0.86);
  const traza = [cx + Math.cos(ang) * rr, cy + Math.sin(ang) * rr];
  const fuera = [cx + 34, cy + 30];
  const m0 = suave(lin(t, P2 + 0.1, P2 + 0.6)), m1 = suave(lin(t, instr - 0.35, instr)), m2 = suave(lin(t, barco, barco + 0.45));
  let tip = [lerp(lerp(lee[0], traza[0], m1), fuera[0], m2), lerp(lerp(lee[1], traza[1], m1), fuera[1], m2)];
  tip = [lerp(250, tip[0], m0), lerp(190, tip[1], m0)];
  if (d > 0 && d < 1 && Math.floor(t * 15) % 2 === 0) R.pset(Math.round(tip[0]) - 1, Math.round(tip[1]) - 1, hex('#fff8d0'));
  const hx = Math.round(tip[0] + 33), hy = Math.round(tip[1] + 43);
  // el punzón de bambú, de la punta al puño
  for (const [i, j] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) R.linea(Math.round(tip[0]) + i, Math.round(tip[1]) + j, hx + 3 + i, hy + 3 + j, K);
  R.linea(Math.round(tip[0]), Math.round(tip[1]), hx + 3, hy + 3, hex('#d8b468')); R.linea(Math.round(tip[0]) + 1, Math.round(tip[1]), hx + 4, hy + 3, hex('#a8843c'));
  T.brazo(R, hx + 30, 186, hx + 8, hy + 2, TWEED, -1, { codo: [hx + 26, Math.round((hy + 186) / 2)] });
  if (t > detalle) { const b = Math.round(Math.abs(Math.sin((t - detalle) * 7)) * 3 * (1 - lin(t, detalle, detalle + 0.7))); R.icono('!', 208, 58 - b, AM, K, 2); }
  T.museoDelante(R, t, o);
};

// ── 3 · el barco redondo gira como una peonza (gag 5) ──
const redondo = a(0.786), cesta = a(0.832), cuerda = a(0.892), betun = a(0.9685);
const giroDe = (t) => { const s = t - redondo + 0.1; if (s <= 0) return Math.sin(t * 1.3) * 0.05; if (s < 2) return 1.75 * s * s; let g = 7 + 7 * (Math.min(s, 4.0) - 2); if (s > 4.0) { const q = Math.min(1.2, s - 4.0); g += 7 * q - 2.6 * q * q; if (s > 5.2) g += 0.76 * (s - 5.2); } return g; };
const p3 = (t) => {
  const g = giroDe(t), w = (giroDe(t + 0.05) - giroDe(t - 0.05)) / 0.1, s = t - redondo;
  const o = { encuadre: 'barco', giro: g, lluvia: lerp(0.15, 1, lin(t, P3, cuerda)) };
  T.mesopotamia(R, t, o);
  // los arcos de giro por delante del casco y las salpicaduras que salen despedidas
  if (w > 1.5) {
    for (let k = 0; k < 3; k++) { const a0 = (g * 0.5 + k * 2.1) % (Math.PI * 2), n = Math.round(Math.min(14, w * 2));
      for (let i = 0; i < n; i++) { const an = a0 - i * 0.045, sy = Math.sin(an); if (sy < 0.15) continue; const x = 168 + Math.cos(an) * (96 + k * 5), y = 124 + sy * (24 + k * 3); R.pset(Math.round(x), Math.round(y), i < 3 ? BL : hex('#b8d0e8')); if (i < 5) R.pset(Math.round(x), Math.round(y) + 1, BL); } }
    for (let k = 0; k < 12; k++) { const q = (t * 1.9 + k * 0.137) % 1, an = g * 0.25 + k * 0.524, r = 86 + q * 34, x = 168 + Math.cos(an) * r, y = 118 + Math.sin(an) * r * 0.28 - Math.sin(q * Math.PI) * 9; if (w > 3) { R.pset(Math.round(x), Math.round(y), BL); R.pset(Math.round(x) + 1, Math.round(y), hex('#b8d0e8')); } }
  }
  // las estrellas de mareo que rondan sobre los animales
  if (s > 1.5) { const nE = s > 2.6 ? 5 : 3; for (let k = 0; k < nE; k++) { const an = t * 4.2 + k * Math.PI * 2 / nE; estrella(168 + Math.cos(an) * 52, 49 + Math.sin(an) * 7, k % 2 ? BL : AM); } }
  if (t > betun && Math.sin((t - betun) * 9) > 0) { chispa(132, 126, 3); chispa(206, 132, 2); }
  // la garza del ribazo: mira, sigue el giro con la cabeza y se marea
  const gx = 34, gy = 172, sigue = s > 0 && s < 2.8, mareo = s >= 2.8;
  const hx = gx + 7 + (sigue ? Math.cos(g * 0.5) * 3 : mareo ? Math.sin(t * 5) * 4 : 0), hy = gy - 31 + (sigue ? Math.sin(g * 0.5) * 2 : mareo ? 3 + Math.cos(t * 10) * 1.5 + lin(s, 3.6, 4.6) * 5 : Math.sin(t * 1.4) * 0.6);
  garzaG(gx, gy, hx, hy, 1, { mareo, pico: mareo ? 1 : 0 });
  if (s > -1.1 && s <= 0) R.bocadillo(gx + 8, gy - 38, { icono: '?' });
  if (s > 0.1 && s < 1.3) R.bocadillo(gx + 8, gy - 38 - Math.round(Math.abs(Math.sin(s * 9)) * 2), {});
  if (mareo) for (let k = 0; k < 2; k++) { const an = t * 6 + k * Math.PI; estrella(hx + Math.cos(an) * 7, hy - 7 + Math.sin(an) * 2, AM); }
  T.mesopotamiaDelante(R, t, o);
};

T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3]], {
  año: (t) => (t < P3 ? 2014 : -1750),
  efectos: [[0.5, 'tecleo'], [finkelT, 'brillo'], [tres, 'pop'], [instr, 'lapiz'], [detalle, 'aviso'],
    [P3 + 0.15, 'lluvia'], [redondo, 'whoosh'], [redondo + 1.4, 'rafaga'], [redondo + 2.8, 'ola']],
});
</script>
</body>
