//    el sol (x 206) con su camino de brillo que centellea; mar de fondo en cinco ondas que crecen hacia delante, con
//    borregos de espuma; gaviotas posadas entre los barcos y el bote; en primer término el bote del Dei Gratia (casco más

//    corre: las hojas del calendario de la puerta vuelan (12 → 1 → 2 → 3 → 4), las sombras giran, el año pasa a 1873; en
//    «Gibraltar's attorney general» para al pie de la escalinata el coche de punto de Solly-Flood (el caballo, de 46 px,
//    más alto que la gente, unido al coche con varas, collera, sufra y riendas; cochero con fusta); se abre la portezuela,

// 7. «and the tests showed the stains were not blood. The court found no evidence of any crime» (corta en «It paid»).
