<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rubicon · ep5</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// RM-RUBICON (frases 24–25). Un riachuelo: César y sus legionarios lo cruzan chapoteando; la línea punteada de la ley
// que corre por la orilla se rompe a su paso. Luego, dentro del Senado, sombras con puñales rodean a César; en la caja,
// un calendario con «15»; un fundido rojo tapa el golpe (sin sangre).
import { preparar, rodar } from '/atomo/plato/escenas/rm-comun.js';
const { E, R, M } = await preparar('rm-rubicon');
const { PALA, PR, ELENCO, tramo, lerp, clamp } = R;
const m = { rub: M('rubicon', 0.5), idu: M('idus', 8) };
const cesar = { ...ELENCO.cesar, sombrero: 'laurel', capa: PALA.ROJO, chaqueta: PALA.BRONCE, camisa: PALA.BRONCE, falda: PALA.ROJO, banda: null, largoFalda: 0.2, pelo: PALA.PELO_NEGRO };
const rio = (t) => {
  R.cieloR(t, 'tarde', { hor: 100, sol: [60, 92, 9] });
  R.colinas(100, { amp: 8, luz: 1.4 }); R.suelo(100, PR.HIERBA, { luz: 2 });
  const orilla = (y) => 146 + (y - 100) * 0.4;
  for (let y = 100; y < R.H; y++) for (let x = Math.round(orilla(y)); x < orilla(y) + 22; x++) R.pset(x, y, R.tone(PR.AGUA, 1.6 + (Math.sin(y * 0.4 + x * 0.2 - t * 4) > 0.8 ? 1.4 : 0), x, y));
  const p = tramo(t, m.rub + 1, m.rub + 7), cx = lerp(-10, 330, p);
  // la ley: una línea punteada roja en la orilla, que se rompe cuando César la cruza
  for (let y = 100; y < R.H; y += 4) { const x = Math.round(orilla(y)) - 3, roto = cx > x - 4; const dx = roto ? Math.round(6 * Math.sin(y * 1.7) * Math.min(1, (cx - x) / 40)) : 0; R.rect(x + dx, y + (roto ? Math.round(Math.cos(y) * 3) : 0), x + 1 + dx, y + 1 + (roto ? Math.round(Math.cos(y) * 3) : 0), PALA.ROJO[2]); }
  for (let k = 0; k < 5; k++) {
    const x = cx - k * 26, y = 160 + (k & 1) * 8;
    R.personaje(x, y, 36, k === 0 ? { ...cesar, t, anda: t * 7, pose: 'senala' } : { ...ELENCO.legionario, t: t + k, anda: t * 7, objeto: 'gladio' });
    const ox = orilla(y);
    if (x > ox && x < ox + 22) for (let s = 0; s < 4; s++) R.pset(Math.round(x - 6 + s * 4), Math.round(y - 2 - Math.abs(Math.sin(t * 9 + s)) * 4), PR.AGUA[4]);
  }
};
const senado = (t) => {
  for (let y = 0; y < R.H; y++) for (let x = 0; x < R.W; x++) R.pset(x, y, R.tone(PALA.MARMOL, 0.8 + (y > 130 ? 0.6 : 0) + ((x % 50) < 3 && y < 130 ? -0.6 : 0), x, y));
  for (let g = 0; g < 2; g++) R.rect(0, 100 + g * 14, R.W, 113 + g * 14, PALA.MARMOL[1 + g]);
  const u = t - m.idu, cerca = tramo(t, m.idu + 2, m.idu + 5);
  R.personaje(160, 160, 42, { ...cesar, sombrero: 'laurel', chaqueta: PALA.MARMOL, camisa: PALA.MARMOL, falda: PALA.MARMOL, largoFalda: 0.36, banda: PALA.PURPURA, capa: PALA.PURPURA, t, pose: u > 5 ? 'rodilla' : 'pie', ceño: u > 3 });
  for (let k = 0; k < 6; k++) { const s = k < 3 ? -1 : 1, d = 30 + (k % 3) * 20; R.personaje(160 + s * lerp(140, d, cerca), 162 + (k % 3) * 4, 40, { ...ELENCO.senador, chaqueta: PALA.NEGRO, camisa: PALA.NEGRO, falda: PALA.NEGRO, banda: PALA.ROJO, piel: PALA.PIEL_OSCURA, t: t + k, dir: -s, objeto: 'gladio', pose: cerca > 0.9 ? 'senala' : 'pie', anda: cerca > 0 && cerca < 1 ? t * 6 : null, ceño: true }); }
  const rojo = tramo(t, m.idu + 5, m.idu + 6);
  if (rojo > 0) for (let y = 0; y < R.H; y++) for (let x = 0; x < R.W; x++) if (R.b4(x, y) < rojo * 0.85) R.pset(x, y, (x + y) & 1 ? PALA.ROJO[0] : PALA.CONTORNO);
};
rodar(E, R, [[0, rio], [m.idu - 0.2, senado]], { caja: (t, e) => R.caja(t, t > m.idu + 0.8 ? tramo(t, m.idu + 0.8, m.idu + 1.2) : 0, (x, y) => R.numero('15', x + 10, y + 12), { energia: e }) });
</script>
</body>
</html>
