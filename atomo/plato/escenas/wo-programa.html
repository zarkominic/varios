// WO-PROGRAMA (frases 25–26), sin cartela; la barra dice 2024 hasta «In 2025», 2025 hasta «former volunteers» y 2026
// después. Diez planos:
// 1. (0) la sala de digitalización de Puerto Rico al anochecer (fondo local): una estudiante coge un montón de listados
//    de la estantería, lo lleva al escáner y lo mete en «went through»; las hojas salen una a una y el monitor cambia;
//    en «those days» Méndez se vuelve y levanta una hoja vieja. Palmeras y nubes por la ventana, reloj, flexo, ventilador.
// 2. («one by one», 4,40) inserto cenital: la mesa de luz sobre la alfombrilla de corte con cosas; una hoja sale y entra
//    otra, y otra; llega la del «Wow!» (piezaListado) y en «measured» la mano pone la regla y un corchete cian mide la U;
//    en «modern methods» la tableta traza la curva.
// 3. («In 2025», 8,73) la pantalla (archivo 'pantalla' general): en «published» la curva nueva empieza a crecer y en
//    «four» (golpe «programa») llega al cuádruple de la vieja: la flecha y el 4× laten; un destello.
// 4. («and its frequency», 14,85) otra pared de la sala: la pantalla grande con el espectro; en «slightly different» la
//    raya verde nueva se corre un poco de la ámbar vieja y Méndez la señala; en «They also» se vuelve al técnico, que
//    copia el programa del listado viejo: la pantalla de código se llena de rayas.
// 5. («and started running», 19,69) el monitor de fósforo (listado escala 'curva'): corren las rayas del programa y la
//    simulación vuelve a trazar la campana de seis escalones.
// 6. («That doesn't solve», 23,76) el pasillo de la universidad: Méndez llega con la carpeta; «?» en «mystery»; la deja
//    en la bandeja en «study» (sello vacío y reloj de arena); en «other scientists» se asoman dos por sus puertas.
// 7. (pausa antes de «but», 28,15) la Tierra de noche llena la mitad de abajo; sus antenas hacen ondas que no salen de su
//    cúpula; la señal fina baja del cielo limpio; X roja sobre el ruido en «wasn't interference»; la Tierra gira.
// 8. («former volunteers», 33,88) el GAG 7 (archivo 'garaje' general): el voluntario mayor entra, abre la caja en «punch
//    cards» y salen las tarjetas como confeti; una cae en la cabeza del gato, que se despierta; el voluntario se ríe.
// 9. («And the archive», 40,85) el archivo (garaje 'archivo'): una investigadora con linterna recorre el pasillo; el
//    contador sube hasta 40000 en «40,000» y sobre las cajas saltan señales cortas en «short signals».
// 10. («has looked at», 45,05) la balda de cerca, en penumbra: la caja con el 1985 bajo el polvo y una telaraña; la
//    linterna la encuentra en «looked at», la mano limpia el polvo en «1985» y tira de la caja; la araña sube.
import * as T from '/atomo/plato/escenas/wo-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('wo-programa');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const K = hex('#17151d'), BL = hex('#f6f2ea');
const cl = (u) => Math.max(0, Math.min(1, u));
const ease = (u) => { u = cl(u); return u * u * (3 - 2 * u); };
const hs = (a, b, k = 0) => { const s = Math.sin(a * 127.1 + b * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const bay = (x, y) => (BAY[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
const tono = (cs, f, x, y) => cs[Math.max(0, Math.min(cs.length - 1, Math.floor(cl(f) * (cs.length - 1) + bay(x, y))))];
const mez = (a, b, k) => { let r = 0; for (const sh of [0, 8, 16]) r |= Math.round(((a >>> sh) & 255) * (1 - k) + ((b >>> sh) & 255) * k) << sh; return (r | 0xff000000) >>> 0; };
const tinta = (x, y, c, f) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && x < 320 && y >= 0 && y < 180) R.pset(x, y, mez(R.pget(x, y), c, f)); };
const tranquila = (x, y) => (x >= 274 && y <= 48) || (x >= 16 && x <= 174 && y <= 22);
const curva = (t, pts) => { if (t <= pts[0][0]) return pts[0][1]; for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]) { const [a, va] = pts[i - 1], [b, vb] = pts[i]; return va + (vb - va) * ease((t - a) / Math.max(1e-6, b - a)); } return pts[pts.length - 1][1]; };
const fijo = (() => { const B = {}; return (k, f) => { if (!B[k]) { const b = R.nuevo(), prev = R.usar(b); f(); R.usar(prev); B[k] = b; } R.copiar(B[k]); }; })();
const globo = (x, y, ic, c, e = 1) => { if (e <= 0) return; const r = Math.round(6 * Math.min(1, e * 1.3)); R.disco(x, y, r + 1, K); R.disco(x, y, r, BL); R.pset(x - 4, y + r + 1, K); R.pset(x - 3, y + r, BL); R.pset(x - 3, y + r + 1, K); if (e > 0.6) R.icono(ic, x - (ic === '?' || ic === 'X' ? 2 : ic === '!' ? 1 : 3), y - 3, c, null, 1); };
const destello = (x, y, r, c = BL) => { x = Math.round(x); y = Math.round(y); for (let i = -r; i <= r; i++) { if (!tranquila(x + i, y)) R.pset(x + i, y, c); if (!tranquila(x, y + i)) R.pset(x, y + i, c); } };
const vapor = (t, x, y, k = 0) => { for (let i = 0; i < 4; i++) { const q = (t * 0.7 + i / 4 + k * 0.13) % 1; tinta(x + Math.sin(q * 6 + i + k) * 1.6, y - q * 11, hex('#f0f0f4'), 0.55 * (1 - q)); } };
const madera = (x0, y0, x1, y1, sem, C = ['#4a2c18', '#5e3a20', '#70482a', '#86583a', '#9a6a46'].map(hex)) => {
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const v = Math.sin(y * 0.55 + Math.sin(x * 0.045 + y * 0.02) * 2.4 + hs(y >> 3, 1, sem) * 3) * 0.5 + 0.5; const f = 0.25 + v * 0.45 + (hs(x >> 4, y >> 1, sem) - 0.5) * 0.1; R.pset(x, y, tono(C, f, x, y)); }
  for (let k = 0; k < 5; k++) { const cx = x0 + hs(k, 1, sem + 3) * (x1 - x0), cy = y0 + hs(k, 2, sem + 3) * (y1 - y0); for (let a = 0; a < 6.28; a += 0.2) R.pset(Math.round(cx + Math.cos(a) * 4), Math.round(cy + Math.sin(a) * 1.6), C[0]); }
};
// ruido suave (valor interpolado) y fbm de tres octavas, para las nubes de gas
const ruido = (x, y, s) => { const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hs(xi, yi, s), b = hs(xi + 1, yi, s), c = hs(xi, yi + 1, s), d = hs(xi + 1, yi + 1, s); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; };
const fbm = (x, y, s) => ruido(x, y, s) * 0.55 + ruido(x * 2.1, y * 2.1, s + 1) * 0.3 + ruido(x * 4.3, y * 4.3, s + 2) * 0.15;
// el fondo del espacio: degradado tramado, una banda de la Vía Láctea con su polvo oscuro y estrellas de tres tamaños
const ESP = ['#05060f', '#090b1c', '#0e1028', '#151636', '#1e1c44', '#2a2452', '#3a3064'].map(hex);
const espacio = (sem, banda, tinte = null) => {
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) {
    let f = 0.12 + (hs(x >> 4, y >> 4, sem) - 0.5) * 0.06;
    const d = banda(x, y); if (d < 1) { const n = fbm(x * 0.05, y * 0.05, sem); f += (1 - d) * (0.35 + n * 0.45); if (n > 0.62 && d < 0.6) f -= 0.35 * (n - 0.62) * 4; }
    let c = tono(ESP, f, x, y); if (tinte) { const k = tinte(x, y); if (k > 0) c = mez(c, tinte.c, k); } R.pset(x, y, c);
  }
  for (let k = 0; k < 520; k++) { const x = Math.floor(hs(k, 1, sem) * 320), y = Math.floor(hs(k, 2, sem) * 180); if (tranquila(x, y)) continue; const b = hs(k, 4, sem), cerca = banda(x, y) < 1 ? 1 : 0;
    R.pset(x, y, b > 0.93 ? BL : b > 0.7 ? hex('#c8d4f0') : b > 0.4 ? hex('#7a86b8') : hex('#4a5288'));
    if (b > 0.985 - cerca * 0.01) { const cc = hs(k, 5, sem) > 0.5 ? hex('#ffd8a0') : hex('#a8c8ff'); R.pset(x, y, cc); R.pset(x - 1, y, mez(cc, ESP[2], 0.5)); R.pset(x + 1, y, mez(cc, ESP[2], 0.5)); R.pset(x, y - 1, mez(cc, ESP[2], 0.5)); R.pset(x, y + 1, mez(cc, ESP[2], 0.5)); } }
};
// estrellas que titilan (encima del fondo fijo), con una deriva lenta en x (la cámara se mueve)
const titilan = (t, n, sem, dx = 0) => { for (let k = 0; k < n; k++) { const x = Math.round(((hs(k, 5, sem) * 340 + dx * (0.5 + hs(k, 8, sem))) % 340 + 340) % 340) - 10, y = Math.floor(hs(k, 6, sem) * 180); if (tranquila(x, y)) continue; const s = Math.sin(t * (1.5 + hs(k, 7, sem) * 3) + k); if (s > 0.3) { R.pset(x, y, s > 0.85 ? BL : hex('#9aa8d8')); if (s > 0.94) { tinta(x - 1, y, hex('#9aa8d8'), 0.6); tinta(x + 1, y, hex('#9aa8d8'), 0.6); tinta(x, y - 1, hex('#9aa8d8'), 0.6); tinta(x, y + 1, hex('#9aa8d8'), 0.6); } } } };
// una galaxia lejana de canto
const galaxia = (x, y, t, k, c = hex('#c8d0ff')) => { for (let i = 0; i < 22; i++) { const a = i * 0.5 + t * 0.15 + k, rr = i * 0.3; tinta(x + Math.cos(a) * rr * 1.7, y + Math.sin(a) * rr * 0.6, c, 0.55); tinta(x - Math.cos(a) * rr * 1.7, y - Math.sin(a) * rr * 0.6, c, 0.55); } R.pset(Math.round(x), Math.round(y), hex('#fff4d0')); };
// un átomo de hidrógeno diminuto: el protón rojo y el electrón que gira (con su órbita punteada)
const atomoH = (x, y, t, k, e = 1) => { if (e <= 0) return; x = Math.round(x); y = Math.round(y); for (let a = 0; a < 6.28; a += 0.25) if (Math.floor(a * 4) % 2 === 0 && e > 0.3) tinta(x + Math.cos(a) * 8, y + Math.sin(a) * 4.5, hex('#e8f8ff'), 0.7 * e);
  R.disco(x, y, 2, K); R.rect(x - 1, y - 1, x + 1, y + 1, hex('#ff5a5a')); R.pset(x - 1, y - 1, hex('#ffb0b0')); const a = t * 4 + k * 1.7, ex = Math.round(x + Math.cos(a) * 8), ey = Math.round(y + Math.sin(a) * 4.5); R.rect(ex - 1, ey - 1, ex + 1, ey + 1, K); R.rect(ex, ey - 1, ex + 1, ey, hex('#9ae8ff')); };

const tp = (s) => en('programa', (s - 0.5) / 22.761), tc = (s) => en('cajas', (s - 23.761) / 23.729);
const P2 = tp(4.40), P3 = tp(8.73), P4 = tp(14.85), P5 = tp(19.69), P6 = tc(23.76), P7 = tc(28.15), P8 = tc(33.88), P9 = tc(40.85), P10 = tc(45.05);
const lim = (x0, y0, x1, y1, f) => { R.recorte([x0, y0, x1, y1]); f(); R.recorte(null); };
const caja = (x0, y0, x1, y1, c, borde = K) => { R.rect(x0, y0, x1, y1, borde); R.rect(x0 + 1, y0 + 1, x1 - 1, y1 - 1, c); };
// pared de bloques pintados (gris azulado), con su llaga, poros y un tono por bloque; tranquila arriba a la derecha
const bloques = (x0, y0, x1, y1, sem, CS = ['#93a4ad', '#9dafb8', '#a7b8c0', '#b1c1c8'].map(hex), junta = hex('#7f9099')) => {
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const fila = Math.floor((y - y0) / 9), bx = Math.floor((x + (fila % 2) * 11) / 22), q = tranquila(x, y) ? 0.2 : 1;
    const jy = (y - y0) % 9 === 0, jx = (x + (fila % 2) * 11) % 22 === 0;
    let f = 0.45 + (hs(bx, fila, sem) - 0.5) * 0.35 * q + (hs(x, y, sem + 1) - 0.5) * 0.18 * q; if (hs(x >> 1, y, sem + 2) > 0.985 && q > 0.5) f -= 0.3;
    R.pset(x, y, (jx || jy) ? (q < 1 ? mez(tono(CS, f, x, y), junta, 0.35) : junta) : tono(CS, f, x, y)); }
};
const techo = (y1, c0 = '#d4d8d2', c1 = '#c4c9c4') => { for (let y = 0; y <= y1; y++) for (let x = 0; x < 320; x++) R.pset(x, y, (x > 176 && x < 270 && x % 32 === 0) ? hex(c1) : (y / y1 > 0.7 && bay(x, y) < (y / y1 - 0.7) * 1.4) ? hex(c1) : hex(c0)); };
const reloj = (x, y, r, t) => { R.disco(x, y, r + 1, K); R.disco(x, y, r, hex('#f4f0e4')); for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6; R.pset(Math.round(x + Math.cos(a) * (r - 1.5)), Math.round(y + Math.sin(a) * (r - 1.5)), hex('#5a5a66')); }
  const am = t * 0.35 - Math.PI / 2, ah = t * 0.03 + 1.1; R.linea(x, y, Math.round(x + Math.cos(am) * (r - 2)), Math.round(y + Math.sin(am) * (r - 2)), K); R.linea(x, y, Math.round(x + Math.cos(ah) * (r - 4)), Math.round(y + Math.sin(ah) * (r - 4)), K);
  const as = t * 6.28 / 6 - Math.PI / 2; R.linea(x, y, Math.round(x + Math.cos(as) * (r - 1)), Math.round(y + Math.sin(as) * (r - 1)), hex('#d02a2a')); R.pset(x, y, hex('#d02a2a')); };
// un fluorescente de techo que a ratos parpadea
const fluor = (x0, x1, y, t, k = 0) => { const on = !(Math.sin(t * 13 + k) > 0.97 && Math.sin(t * 2.1 + k) > 0.6); R.rect(x0 - 1, y - 1, x1 + 1, y + 3, hex('#8a8e94')); R.rect(x0, y, x1, y + 2, on ? hex('#fbfdf6') : hex('#c8ccc4')); if (on) for (let x = x0; x <= x1; x++) if (bay(x, y + 4) < 0.35) tinta(x, y + 4, hex('#ffffff'), 0.4); };
// el cielo del atardecer de Puerto Rico con montes, tejados, palmeras que se mecen, nubes de tres tonos y pájaros
const atardecer = (x0, y0, x1, y1, t, sem = 5) => lim(x0, y0, x1, y1, () => {
  const CC = ['#f4c27a', '#f0a070', '#d8808a', '#a070a0', '#6a5a98'].map(hex);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) R.pset(x, y, tono(CC, 1 - (y - y0) / (y1 - y0) * 1.05, x, y));
  const sx = x0 + (x1 - x0) * 0.62, sy = y1 - 12; R.disco(sx, sy, 7, hex('#ffe6a8')); R.disco(sx, sy, 5, hex('#fff6d8'));
  for (const [k, v, yy, w, c] of [[0, 1.2, y0 + 8, 18, '#f8d8c0'], [1, 2.1, y0 + 17, 12, '#e8b0a8'], [2, 3.2, y0 + 26, 9, '#c890a8']]) { const nx = x0 + ((hs(k, 1, sem) * 90 + t * v) % (x1 - x0 + 30)) - 15;
    for (let i = -w; i <= w; i++) for (let j = -3; j <= 2; j++) if ((i / w) ** 2 + (j / 3.2) ** 2 < 1 - hs(i, j, k) * 0.15) R.pset(Math.round(nx + i), yy + j, j < 0 ? hex(c) : mez(hex(c), hex('#a070a0'), 0.35)); }
  for (let x = x0; x <= x1; x++) { const hm = y1 - 10 - Math.round(5 * Math.sin(x * 0.07 + sem) + 3 * Math.sin(x * 0.19)); for (let y = hm; y <= y1; y++) R.pset(x, y, y < hm + 2 ? hex('#5a6a7a') : hex('#3e4a5e')); }
  for (let x = x0 + 6; x < x1; x += 13) { const hh = 4 + Math.round(hs(x, 2, sem) * 4); R.rect(x, y1 - 4 - hh, x + 8, y1, hex('#4a4658')); R.linea(x - 1, y1 - 5 - hh, x + 9, y1 - 5 - hh, hex('#6a5a6a')); if (hs(x, 3, sem) > 0.4) R.pset(x + 3, y1 - 2 - hh, Math.sin(t * 2 + x) > -0.5 ? hex('#ffd890') : hex('#6a5a6a')); }
  for (const [px, ph] of [[x0 + 12, 38], [x1 - 14, 46]]) { const sw = Math.sin(t * 1.3 + px) * 2.2; let tx = px, ty = y1;
    for (let j = 0; j < ph; j++) { tx = px + sw * (j / ph) ** 2; R.pset(Math.round(tx), y1 - j, hex('#2a2a3a')); R.pset(Math.round(tx) + 1, y1 - j, hex('#34344a')); }
    for (let f = 0; f < 7; f++) { const a = -Math.PI / 2 + (f - 3) * 0.48 + Math.sin(t * 1.7 + f + px) * 0.07; for (let i = 0; i < 16; i++) { const cx = tx + Math.cos(a) * i, cy = y1 - ph + Math.sin(a) * i + i * i * 0.035; R.pset(Math.round(cx), Math.round(cy), hex('#2a2a3a')); if (i % 3 === 1) R.pset(Math.round(cx), Math.round(cy) + 1, hex('#2a2a3a')); } } }
  for (let b = 0; b < 3; b++) { const q = ((t * 0.09 + b * 0.31) % 1), bx = x0 + q * (x1 - x0 + 20) - 10, by = y0 + 14 + b * 6 + Math.sin(t * 2 + b) * 2, al = Math.sin(t * 9 + b * 2) > 0; R.pset(Math.round(bx), Math.round(by), K); R.pset(Math.round(bx) - 1, Math.round(by) - (al ? 1 : 0), K); R.pset(Math.round(bx) + 1, Math.round(by) - (al ? 1 : 0), K); }
});
// una hoja suelta de listado (vista de pie, pequeña): papel con bandas verdes y renglones de «1»
const hojita = (x, y, w = 10, h = 13, giro = 0) => { caja(x, y, x + w, y + h, hex('#f4efe0')); for (let j = 2; j < h - 1; j += 2) { if (Math.floor(j / 4) % 2) R.linea(x + 2, y + j, x + w - 2, y + j, hex('#c8e4c0')); else for (let i = 2; i < w - 1; i += 2) R.pset(x + i, y + j, hex('#7a7a88')); } R.linea(x + 1, y + 1, x + 1, y + h - 1, hex('#d8d0b8')); };
// una caja de archivo de cartón gris o parda con su etiqueta
const cajaArch = (x, y, w, h, c = '#8e949c', n = null) => { R.rect(x + 1, y + 1, x + w + 1, y + h + 1, hex('#2a2a32')); caja(x, y, x + w, y + h, hex(c)); R.linea(x + 1, y + 1, x + w - 1, y + 1, mez(hex(c), BL, 0.35)); R.linea(x + w - 1, y + 2, x + w - 1, y + h - 1, mez(hex(c), K, 0.3));
  R.rect(x + 3, y + 3, x + w - 3, y + Math.min(h - 3, 7), hex('#efe8d4')); if (w > 10) R.linea(x + 4, y + 5, x + w - 5, y + 5, hex('#8a8a98')); R.rect(x + Math.round(w / 2) - 2, y + h - 4, x + Math.round(w / 2) + 2, y + h - 3, mez(hex(c), K, 0.45)); };

// ── 1 · la sala de digitalización ───────────────────────────────────────────────────────────────────────
const HARD = tp(1.32), WENT = tp(2.5), DAYS = tp(3.82);
const sala1 = () => {
  techo(21); for (let x = 0; x < 320; x++) { R.pset(x, 22, hex('#9aa4a8')); R.pset(x, 23, hex('#7a8488')); }
  bloques(0, 24, 319, 117, 11);
  // el zócalo pintado de verde azulado con su listón
  for (let y = 118; y <= 129; y++) for (let x = 0; x < 320; x++) R.pset(x, y, y === 118 ? hex('#8ab0b0') : y === 119 ? hex('#3a5a60') : tono(['#4a6e74', '#567a80', '#5e848a'].map(hex), 0.5 + (hs(x >> 2, y, 3) - 0.5) * 0.4, x, y));
  // el suelo de linóleo en baldosas, con juntas, rozaduras y el reflejo de la ventana
  for (let y = 130; y < 180; y++) for (let x = 0; x < 320; x++) { const by = Math.floor((y - 130) / 12), bx = Math.floor((x - 160) * (0.8 + by * 0.06) / 22 + 100), j = (y - 130) % 12 === 0 || Math.abs(((x - 160) * (0.8 + by * 0.06)) % 22) < 0.9;
    let f = 0.5 + (hs(bx, by, 7) - 0.5) * 0.3 + (hs(x, y, 8) - 0.5) * 0.15; if (x > 190 && x < 262 && y < 150 && bay(x, y) < 0.3 * (1 - (y - 130) / 20)) f += 0.35;

  // las antenas y torres sobre el borde, con sus ondas que no salen de su cúpula (el ruido de la Tierra)
  const torres = [[46, 0], [110, 1], [176, 2], [250, 3]];
  for (const [x, k] of torres) { const y0 = Math.round(EC[1] - Math.sqrt(ER * ER - (x - EC[0]) ** 2)); R.linea(x, y0, x, y0 - 10, hex('#8a9aaa')); R.linea(x - 3, y0, x, y0 - 10, hex('#6a7a8a')); R.linea(x + 3, y0, x, y0 - 10, hex('#6a7a8a')); R.pset(x, y0 - 11, Math.sin(t * 6 + k) > 0 ? hex('#ff5a5a') : hex('#6a2a2a'));
    for (let n = 0; n < 3; n++) { const q = ((t * 0.7 + n / 3 + k * 0.17) % 1), rr = 3 + q * 26; for (let a = -Math.PI; a < 0; a += 0.7 / rr) tinta(x + Math.cos(a) * rr, y0 - 10 + Math.sin(a) * rr * 0.8, hex('#ff8a5a'), 0.75 * (1 - q)); } }
  // la cúpula punteada del ruido de la Tierra
  for (let a = Math.PI * 1.08; a < Math.PI * 1.92; a += 0.004) { const x = EC[0] + Math.cos(a) * (ER + 40), y = EC[1] + Math.sin(a) * (ER + 40); if (Math.floor(a * 300) % 3 === 0 && y < 180) tinta(x, y, hex('#ff8a5a'), 0.6); }
  // un satélite y un avión con su luz que cruzan por dentro de la cúpula
  const qs = ((t - P7) / 6) % 1, sat = [Math.round(-10 + qs * 340), Math.round(92 + Math.sin(qs * 3) * 4)]; R.rect(sat[0] - 1, sat[1] - 1, sat[0] + 1, sat[1] + 1, hex('#c8ccd4')); R.rect(sat[0] - 6, sat[1], sat[0] - 2, sat[1], hex('#4a6ad0')); R.rect(sat[0] + 2, sat[1], sat[0] + 6, sat[1], hex('#4a6ad0'));
  const qa = ((t - P7) / 5) % 1, av = [Math.round(330 - qa * 360), 110]; R.linea(av[0] - 3, av[1], av[0] + 3, av[1], hex('#8a8e98')); R.linea(av[0], av[1] - 2, av[0] + 1, av[1] + 2, hex('#8a8e98')); if (Math.sin(t * 8) > 0) R.pset(av[0] - 3, av[1], hex('#ff5a5a'));
  // en «wasn't interference» una X roja grande sobre el ruido de la Tierra; en «Earth» la señal brilla y su punto late
  const x1 = tramo(t, WASNT, WASNT + 0.3);
  if (x1 > 0) { const cx = 214, cy = 100, r = Math.round(12 * ease(x1)); for (let d = -1; d <= 1; d++) { R.linea(cx - r + d, cy - r, cx + r + d, cy + r, hex('#e83a3a')); R.linea(cx + r + d, cy - r, cx - r + d, cy + r, hex('#e83a3a')); } R.linea(cx - r, cy - r + 2, cx + r - 2, cy + r, hex('#8a1a1a')); }
  if (t > EARTH) { const k = ((t - EARTH) * 1.2) % 1; for (let a = 0; a < 6.28; a += 0.12) tinta(sx + Math.cos(a) * (4 + k * 14), sy + Math.sin(a) * (4 + k * 14), hex('#ffd25a'), 0.8 * (1 - k)); globo(sx + 24, sy - 12, 'balanza', hex('#3a3a48'), tramo(t, EARTH, EARTH + 0.3)); }
};

// ── 8 · el garaje: las tarjetas como confeti (GAG 7) ─────────────────────────────────────────────────────
const SENT = tc(35.10), PUNCH = tc(36.72), DEC = tc(38.62), ATT = tc(40.04);
const p8 = (t) => {
  const conf = cl((t - PUNCH + 0.1) / 3.6), o = { encuadre: 'garaje', confeti: conf };

  const w = tramo(t, P8 + 0.2, SENT + 0.4), vx = Math.round(lerp(30, 128, ease(w))), anda = w > 0 && w < 1, abre = t > PUNCH - 0.3;
  const susto = t > PUNCH && t < PUNCH + 0.7, risa = t > DEC - 0.2;
  R.actor(EL.voluntario1WO, vx, 158, t, { dir: 1, anda, sostiene: !anda && !abre ? [vx + 22, 146] : abre && t < PUNCH ? [vx + 24, 140] : false, sorpresa: susto, brazos: t > PUNCH + 0.7 && t < DEC - 0.4, sonrisa: risa || (t > PUNCH + 0.7), dedo: t > DEC + 0.6 && t < ATT, salto: susto ? 2 : 0, pal: { H: hex('#b8b8c0'), h: hex('#d8d8e0') } });

// ── 9 · el archivo: más de cuarenta mil señales ───────────────────────────────────────────────────────────
const FORTY = tc(42.29), SHORT = tc(43.37), HARDLY = tc(44.31);
const p9 = (t) => {
  const o = { encuadre: 'garaje', camara: 'archivo' };
  T.archivo(R, t, o);

  const s = tramo(t, SHORT - 0.2, SHORT + 0.8);
  for (let k = 0; k < 14; k++) { const x = 34 + (k % 7) * 18 + Math.round(hs(k, 1, 71) * 6), y = 60 + Math.floor(k / 7) * 34 + Math.round(hs(k, 2, 71) * 8), q = ((t - SHORT) * 1.3 + hs(k, 3, 71)) % 1;
    if (s <= hs(k, 4, 71)) continue; const hh = Math.round(Math.sin(q * Math.PI) * 6); if (hh > 0) { R.linea(x - 3, y, x - 1, y, hex('#5aff8a')); R.linea(x - 1, y, x, y - hh, hex('#5aff8a')); R.linea(x, y - hh, x + 1, y, hex('#5aff8a')); R.linea(x + 1, y, x + 3, y, hex('#5aff8a')); R.pset(x, y - hh, BL); } }
  // el contador sube hasta 40000 en «40,000» y late
  const c = tramo(t, P9 + 0.3, FORTY + 0.2), n = Math.round(40000 * ease(c) / 100) * 100, late = t > FORTY + 0.2 ? Math.sin((t - FORTY) * 10) * 0.5 + 0.5 : 0;
  caja(106, 26, 172, 44, hex('#14202a'), hex('#5a6a7a')); R.numero(String(n), 139, 40, { centro: true, color: late > 0.5 ? hex('#c8ffd8') : hex('#5aff8a'), sombra: false });
  // la investigadora recorre el pasillo con su linterna y la mueve de caja en caja
  const w = tramo(t, P9 + 0.1, HARDLY), ix = Math.round(lerp(14, 150, ease(w))), anda = w > 0 && w < 1;
  const lx = ix + 26, ly = 132 + Math.round(Math.sin(t * 2.4) * 10);
  const I = R.actor(EL.cientifica, ix, 158, t, { dir: 1, anda, sostiene: [ix + 19, 138], sorpresa: t > FORTY && t < FORTY + 0.6, sonrisa: t > HARDLY, pal: { C: hex('#5a6a8a'), c: hex('#4a5a7a') } });
  if (I.mano) { const [mx, my] = I.mano; R.rect(mx, my - 1, mx + 5, my + 1, hex('#3a3a48')); R.rect(mx + 5, my - 2, mx + 6, my + 2, hex('#c8ccd4'));
    for (let i = 0; i < 40; i++) { const q = i / 40, bx = mx + 7 + q * 40, by = my + (ly - my) * q; for (let j = -Math.round(q * 6); j <= Math.round(q * 6); j++) if (bay(Math.round(bx), Math.round(by + j)) < 0.45) tinta(bx, by + j, hex('#fff6c8'), 0.35); } }
  T.archivoDelante(R, t, o);
};

// ── 10 · la caja de 1985 ──────────────────────────────────────────────────────────────────────────────
const LOOK = tc(45.37), Y85 = tc(45.97);
const balda = () => {
  // el fondo: el pasillo en penumbra, otras estanterías lejos y una escalera
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) R.pset(x, y, tono(['#0e1018', '#141824', '#1a1e2c', '#22283a'].map(hex), 0.35 + (hs(x >> 3, y >> 3, 51) - 0.5) * 0.15 + (1 - Math.abs(x - 170) / 200) * 0.25, x, y));
  for (const x0 of [10, 240]) for (let s = 1; s < 4; s++) { const y = 30 + s * 34; R.rect(x0, y, x0 + 60, y + 2, hex('#2a3040')); for (let b = 0; b < 4; b++) { const bx = x0 + 2 + b * 15; R.rect(bx, y - 14, bx + 12, y - 1, hex('#363c4c')); R.rect(bx + 3, y - 11, bx + 9, y - 8, hex('#4a5060')); } }
  for (let y = 40; y < 170; y += 10) R.linea(228, y, 236, y, hex('#3a3428')); R.linea(228, 30, 228, 170, hex('#4a4030')); R.linea(236, 30, 236, 170, hex('#4a4030'));

  R.rect(40, 116, 300, 124, hex('#5a6270')); R.linea(40, 116, 300, 116, hex('#8a92a0')); R.linea(40, 125, 300, 125, hex('#14161e')); for (let x = 44; x < 300; x += 8) R.pset(x, 120, hex('#2a2e38'));
  for (const x of [36, 300]) { const y0 = x > 200 ? 50 : 24; R.rect(x, y0, x + 6, 180, hex('#4a5260')); R.linea(x + 1, y0, x + 1, 180, hex('#7a8290')); for (let y = y0 + 4; y < 178; y += 6) R.rect(x + 3, y, x + 4, y + 2, hex('#14161e')); }
  R.rect(40, 168, 300, 174, hex('#5a6270')); R.linea(40, 168, 300, 168, hex('#8a92a0'));

  for (const [x, w] of [[46, 56], [240, 56]]) { caja(x, 60, x + w, 115, hex('#6a707c'), K); R.linea(x + 1, 61, x + w - 1, 61, hex('#8a909c')); R.rect(x + 10, 72, x + w - 10, 84, hex('#a8a090')); R.rect(x + w / 2 - 4, 100, x + w / 2 + 4, 104, hex('#3a3e48')); for (let i = 0; i < 40; i++) R.pset(x + 2 + Math.floor(hs(i, 1, x) * (w - 4)), 62 + Math.floor(hs(i, 2, x) * 50), hex('#7a808c')); }

  ['83', '84', '86', '87'].forEach((n, b) => { const x = 48 + b * 64; caja(x, 136, x + 56, 167, hex(b % 2 ? '#626874' : '#585e6a'), K); R.linea(x + 1, 137, x + 55, 137, hex('#7a808c')); caja(x + 12, 142, x + 44, 156, hex('#cfc6ae'), hex('#6a6458')); R.numero(n, x + 28, 154, { centro: true, color: hex('#3a3a48'), sombra: false });
    R.rect(x + 24, 161, x + 32, 164, hex('#2a2e38')); for (let i = 0; i < 30; i++) R.pset(x + 2 + Math.floor(hs(i, 1, b + 60) * 52), 138 + Math.floor(hs(i, 2, b + 60) * 28), hex('#8a8e98')); });
  // el polvo acumulado en el canto de los estantes y una etiqueta de pasillo que cuelga
  for (let x = 42; x < 300; x++) { if (hs(x, 1, 61) > 0.5) R.pset(x, 115, hex('#a8a498')); if (hs(x, 2, 61) > 0.6) R.pset(x, 167, hex('#a8a498')); }

const p10 = (t) => {
  fijo('balda', balda);
  // la caja de 1985, quieta en su balda, con el polvo de cuarenta años
  const X0 = 108, X1 = 232, Y0 = 52, Y1 = 115;

  caja(X0, Y0, X1, Y1, hex('#787e8a'), K); R.linea(X0 + 1, Y0 + 1, X1 - 1, Y0 + 1, hex('#9aa0ac')); R.linea(X1 - 1, Y0 + 2, X1 - 1, Y1 - 1, hex('#5a606c'));
  R.rect(X0 + 50, Y1 - 12, X0 + 74, Y1 - 6, hex('#3a3e48')); R.rect(X0 + 52, Y1 - 11, X0 + 72, Y1 - 9, hex('#22262e'));
  const LBx = 136, LBy = 66; caja(LBx, LBy, LBx + 68, LBy + 24, hex('#efe6cc'), hex('#8a8070')); R.numero('1985', LBx + 34, LBy + 18, { tam: 16, centro: true, color: hex('#2a2a3a'), sombra: false, contorno: false });
  // el polvo: una capa gris tramada que la mano barre de izquierda a derecha
  const barre = tramo(t, Y85 - 0.2, Y85 + 0.9), bx = X0 + (X1 - X0) * barre;
  for (let y = Y0 + 2; y < Y1 - 1; y++) for (let x = X0 + 2; x < X1 - 1; x++) { if (barre > 0 && x < bx && y > LBy - 8 && y < LBy + 32) continue; const dd = hs(x, y, 52); if (dd > 0.35 && bay(x, y) < 0.6) tinta(x, y, hex('#b8b4a8'), 0.45); }
  // la telaraña en la esquina de arriba a la izquierda, con su araña que sube cuando llega la mano
  const W0 = [X0 + 1, Y0 + 1]; for (let a = 0; a <= 1.57; a += 0.26) R.linea(W0[0], W0[1], Math.round(W0[0] + Math.cos(a) * 30), Math.round(W0[1] + Math.sin(a) * 30), hex('#9a9aa8'));
  for (let r = 6; r < 30; r += 6) for (let a = 0; a <= 1.57; a += 0.05) if (bay(Math.round(W0[0] + Math.cos(a) * r), Math.round(W0[1] + Math.sin(a) * r)) < 0.7) R.pset(Math.round(W0[0] + Math.cos(a) * (r + Math.sin(a * 8) )), Math.round(W0[1] + Math.sin(a) * (r + Math.sin(a * 8))), hex('#8a8a98'));
  const ay = Math.round(lerp(W0[1] + 22, W0[1] - 14, ease(tramo(t, Y85, Y85 + 1.0)))), ax = W0[0] + 16; R.linea(ax, W0[1] - 20, ax, ay, hex('#9a9aa8')); R.disco(ax, ay, 2, K); R.pset(ax, ay - 1, hex('#4a4a5a')); for (const d of [-1, 1]) for (let l = 0; l < 3; l++) { R.pset(ax + d * 3, ay - 1 + l, K); R.pset(ax + d * 4, ay - 2 + l * 2, K); }
  // la luz de la linterna: entra por la izquierda en «looked at» y se queda en la etiqueta
  const L = tramo(t, LOOK - 0.4, LOOK + 0.3), lx = lerp(-40, 170, ease(L)) + 100 * ease(tramo(t, Y85 + 2.4, Y85 + 3.6)), ly = lerp(140, 78, ease(L)) + 10 * ease(tramo(t, Y85 + 2.4, Y85 + 3.6));
  if (L > 0) { for (let i = 0; i <= 60; i++) { const q = i / 60, cx = lerp(-12, lx, q), cy = lerp(176, ly, q), rr = 4 + q * 40; for (let j = -rr; j <= rr; j += 1) { const x = Math.round(cx + j * 0.55), y = Math.round(cy + j * 0.84); if (bay(x, y) < 0.35) tinta(x, y, hex('#fff2c0'), 0.16); } }
    for (let y = Math.round(ly - 44); y < ly + 44; y++) for (let x = Math.round(lx - 60); x < lx + 60; x++) { const d = ((x - lx) / 60) ** 2 + ((y - ly) / 44) ** 2; if (d < 1) tinta(x, y, hex('#fff2c0'), 0.12 + (1 - d) * 0.3); } }
  // las motas de polvo que flotan en el haz (y la nube que levanta la mano)
  for (let k = 0; k < 26; k++) { const q = (t * 0.08 + hs(k, 1, 53)) % 1, x = 100 + hs(k, 2, 53) * 150 + Math.sin(t + k) * 4, y = 40 + q * 90 + (barre > 0 && barre < 1 ? -Math.sin(barre * 3) * 10 : 0); if (L > 0.5 && Math.hypot((x - lx) / 60, (y - ly) / 44) < 1) tinta(x, y, BL, 0.85); }
  // la mano (canónica) entra por abajo a la derecha con un plumero de mango largo y barre el polvo de la etiqueta en
  // «1985» (nube de polvo); luego se retira y la linterna se pasea a la caja de al lado: hay más
  const entra = tramo(t, Y85 - 0.8, Y85 - 0.2), sale = tramo(t, Y85 + 1.3, Y85 + 2.0), hx = Math.round(lerp(lerp(300, 226, ease(entra)), 252, ease(barre)) + 70 * ease(sale)), hy = Math.round(lerp(196, 144, ease(entra)) + Math.sin(barre * Math.PI * 3) * 2 + 50 * ease(sale));
  const tx = Math.round(lerp(LBx - 2, LBx + 70, ease(barre)) + 70 * ease(sale)), ty = LBy + 12 + Math.round(Math.sin(barre * Math.PI * 4) * 4) + Math.round(50 * ease(sale));
  if (entra > 0 && sale < 1) { R.linea(hx, hy, tx, ty, hex('#6a4a2a')); R.linea(hx + 1, hy, tx + 1, ty, hex('#9a6a3a'));
    for (let k = 0; k < 40; k++) { const a = hs(k, 1, 54) * 6.28, r = hs(k, 2, 54) * 9, px = tx + Math.cos(a) * r * 1.2 + Math.sin(t * 20 + k) * 0.8, py = ty + Math.sin(a) * r * 0.7; R.pset(Math.round(px), Math.round(py), hs(k, 3, 54) > 0.5 ? hex('#c8b89a') : hex('#8a7a62')); }
    T.brazo(R, hx + 44, hy + 46, hx, hy, '#5a6a8a', -1, { codo: [hx + 32, hy + 16] }); }
  // la nube de polvo que levanta el plumero
  const nb = tramo(t, Y85 - 0.1, Y85 + 1.6); if (nb > 0 && nb < 1) for (let k = 0; k < 30; k++) { const px = LBx + hs(k, 1, 55) * 70 + (hs(k, 2, 55) - 0.5) * 40 * nb, py = LBy + 12 - nb * (10 + hs(k, 3, 55) * 26); if (bay(Math.round(px), Math.round(py)) < 0.8 * (1 - nb)) { tinta(px, py, hex('#d8d0bc'), 0.8); tinta(px + 1, py, hex('#d8d0bc'), 0.5); } }

  if (entra > 0) T.brazo(R, hx + 56, hy + 92, hx, hy, '#5a6a8a', -1, { codo: [hx + 44, hy + 40] });
};

  [P2 + 0.3, 'papel'], [MEAS - 0.2, 'papel'], [MEAS + 0.8, 'bip'], [MODERN, 'bip'],
