// DU-ADIOS (frase 25), 1986. Solo el hecho y con ternura. Tres planos:
// 1. casa 'cuarto'/general (1986): el cuarto, la silla vacía y la máquina con su funda, y el atardecer que AVANZA durante
//    el plano (la ventana se repinta entera aquí, recortada a su cristal): el sol baja tras los abetos, el cielo pasa de
//    naranja a malva y salen las primeras estrellas, tres pájaros vuelven hacia el sol; el rayo del suelo se alarga por
//    la alfombra y se apaga (los rayos fijos del decorado se deshacen y se pintan vivos) y la luz del cuarto se enfría.
//    El flexo, la única luz cálida (cono sobre la mesa y filo en la funda), se apaga despacio en «died»; al reloj de

//    en un jarrón; debajo, la cómoda con la tele pequeña. Pasan los años (la barra corre de 1986 a 2016): la luz de la
//    ventana cruza la pared tres veces, se hace de noche y de día, el polvo se posa y una telaraña crece; en «TV
//    miniseries» la tele se enciende (dunas abstractas nuestras) y en «2000» se apaga. Corta en «The book».
// 3. (LOCAL) el almacén de latas de película: en «The book» nuestro libro da un destello junto a la claqueta con su
//    telaraña y una araña baja por su hilo; el brazo del archivero (el canónico) entra por abajo con un lápiz graso rojo

//    película que se mece. Del cajón de madera asoma la paja en manojos desiguales (sin picos en fila: parecían letras).
import * as T from '/atomo/plato/escenas/du-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('du-adios');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const K = T.C.k, C = T.C, PZ = T.PIEZAS_DU;
const h = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const BY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

const tono = (r, v, x, y) => r[Math.max(0, Math.min(r.length - 1, Math.floor(v + BY[(y & 3) * 4 + (x & 3)] / 16)))];

// lo fijo de un plano se pinta una vez en su búfer y se copia en cada fotograma

  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };

const elipse = (cx, cy, rx, ry, col, a) => baña(cx - rx, cy - ry, cx + rx, cy + ry, col, a, (x, y) => { const d = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2; return d < 1 ? 1 - d * d : 0; });

// madera con vetas (tablas horizontales de alto ht)
const madera = (x0, y0, x1, y1, r, ht = 12, k = 0) => { for (let y = y0; y <= y1; y++) { const tb = Math.floor((y - y0) / ht), fy = (y - y0) % ht;
  for (let x = x0; x <= x1; x++) { const v = 1.6 + Math.sin(x * 0.045 + tb * 1.7 + Math.sin(y * 0.55 + tb) * 1.4) * 0.8 + (h(x >> 2, y, k + tb) - 0.5) * 0.5 - (fy === 0 ? 1.6 : 0) + (fy === 1 ? 0.6 : 0);
    R.pset(x, y, tono(r, v, x, y)); }
  if (fy === 0) for (let x = x0 + ((tb * 53) % 70); x <= x1; x += 70 + (tb % 3) * 9) R.pset(x, y + 4, r[0]); } };
const BL = hex('#f6f6f6'), ORO = hex('#f0c040'), OROL = hex('#f6e08a'), OROS = hex('#9a7420'), ROJO = hex('#d8303a');
// un globo de cómic blanco con su pico hacia abajo (para un símbolo)
const globo = (cx, cy, w, hh, px = 0) => { const x0 = Math.round(cx - w / 2), x1 = Math.round(cx + w / 2), y0 = Math.round(cy - hh / 2), y1 = Math.round(cy + hh / 2);

// el decorado de cartón piedra: un bastidor pintado (una muralla con su arco y sus almenas, pintura plana) sobre un

  const w = 40, hh = 52, F = hex(k ? '#c8a47a' : '#d8b070'), FS = hex(k ? '#a8845a' : '#b88a4c'), FL = hex('#ecd098'), J = hex('#8e6434'), MAD = hex('#c89858'), MADS = hex('#8a6234'), OSC = hex('#4a3424');

  R.rect(x - 1, y - hh - 1, x + w + 3, y - 5, K); R.rect(x, y - hh, x + w, y - 6, F);
  for (let j = y - hh; j <= y - 6; j++) for (let i = x; i <= x + w; i++) { const fj = j - (y - hh), b = fj % 8 === 7 || (i - x + (fj >> 3) * 5) % 10 === 0; if (b) R.pset(i, j, J); else if (h(i - x, fj, 31 + k) < 0.14) R.pset(i, j, FS); }

const b = (f) => en('adios', f);
const P2 = b(0.394) - 0.1, P3 = b(0.842);
const muere = b(0.042), t65 = b(0.290), tele0 = b(0.517), tele1 = b(0.66), x1 = b(0.900), x2 = b(0.923), x3 = b(0.961);

// ── 1. el cuarto de 1986: el atardecer avanza de verdad durante el plano ───────────────────────
const O1 = { encuadre: 'cuarto', camara: 'general', epoca: 1986 };
const VENT = [106, 36, 168, 90], mz3 = (A, B, u) => A.map((c, i) => mez(c, B[i], u));
const CIELO_A = RA('#4e3a7c', '#a04e78', '#e8744e', '#f8b450'), CIELO_B = RA('#161a44', '#2c2860', '#523672', '#94506e');
const NUBE_A = RA('#7a3a6a', '#c05a6a', '#f8a060'), NUBE_B = RA('#221e48', '#3c2e66', '#6a4478');
const PINO_A = RA('#2a1a2c', '#4a2630', '#c0603a', '#20121c'), PINO_B = RA('#0e0c1e', '#18142c', '#2c2444', '#0c0a14');
const RAYO_A = hex('#ffc060'), RAYO_B = hex('#f06848'), CALIDA = hex('#fff0b0');
// una nube y un abeto como los del decorado (con disco, poligono y linea: los recorta R.recorte)
const nube1 = (cx, cy, w, P) => { const N = [[0, 0, 0.3], [-0.3, 0.07, 0.21], [0.3, 0.06, 0.23], [-0.08, -0.13, 0.24], [0.14, -0.08, 0.2]], r = (f) => Math.max(1, Math.round(f * w));
  for (const [dx, dy, f] of N) R.disco(Math.round(cx + dx * w), Math.round(cy + dy * w + 1), r(f), P[0]);
  for (const [dx, dy, f] of N) R.disco(Math.round(cx + dx * w), Math.round(cy + dy * w), r(f), P[1]);
  for (const [dx, dy, f] of N) R.disco(Math.round(cx + dx * w - 1), Math.round(cy + dy * w - 1), r(f * 0.7), P[2]);
  R.linea(Math.round(cx - w * 0.5), Math.round(cy + w * 0.24), Math.round(cx + w * 0.5), Math.round(cy + w * 0.24), P[0]); };
const abeto1 = (x, yb, alto, t, P, k = 0) => { const n = Math.max(3, Math.round(alto / 6)), an = alto * 0.24;
  R.linea(x, yb, x, yb - Math.round(alto * 0.3), P[3]); R.linea(x + 1, yb, x + 1, yb - Math.round(alto * 0.3), P[3]);
  for (let j = n - 1; j >= 0; j--) { const u = j / n, y1 = yb - Math.round(alto * 0.12) - Math.round(u * alto * 0.88 * 0.86), y0 = y1 - Math.round(alto / n * 1.9), w = Math.max(2, Math.round(an * (1 - u * 0.86))), m = Math.round(Math.sin(t * 1.3 + k * 1.7 + j * 0.5) * 1.6 * u);
    R.poligono([[x + m, y0], [x - w + (m >> 1), y1], [x + w + 1 + (m >> 1), y1]], P[0]);
    R.poligono([[x + m, y0 + 1], [x - w + 2 + (m >> 1), y1 - 1], [x + (m >> 1), y1 - 1]], P[1]);
    R.linea(x + m, y0 + 1, x - w + 2 + (m >> 1), y1 - 1, P[2]); } };
// el decorado deja pintados en su búfer los rayos de sol de 1986 (trama de damero, mezcla fija): se deshace esa mezcla
// para poder pintarlos vivos (el del suelo se alarga y los dos se apagan)
const quitaRayo = (x0, y0, x1, y1, incl, a, xmin = 0) => { const q = 1 / (1 - a), f = (v, c) => cl(Math.round((v - c * a) * q), 0, 255);
  for (let y = y0; y <= y1; y++) { const d = Math.round((y - y0) * incl); for (let x = Math.max(xmin, x0 + d); x <= Math.min(319, x1 + d); x++) if (((x + y) & 1) === 0) { const c = R.pget(x, y);
    R.pset(x, y, (0xff000000 | (f((c >>> 16) & 255, 96) << 16) | (f((c >>> 8) & 255, 192) << 8) | f(c & 255, 255)) >>> 0); } } };
const rayo1 = (x0, y0, x1, y1, incl, col, a, f = null) => { if (a <= 0.01) return; for (let y = y0; y <= y1; y++) { const d = Math.round((y - y0) * incl); for (let x = Math.max(0, x0 + d); x <= Math.min(319, x1 + d); x++) if (((x + y) & 1) === 0 && (!f || f(x, y, x - x0 - d))) R.pset(x, y, mez(R.pget(x, y), col, a)); } };
// la luz del cuarto se enfría: del ámbar al malva del anochecer (un recorrido de la pantalla, sobre el búfer)
const enfria = (e) => { if (e <= 0.01) return; const B = R.buf, kr = 1 - 0.46 * e, kg = 1 - 0.3 * e, kb = 1 + 0.1 * e, ka = 0.24 * e;
  for (let i = 0; i < 57600; i++) { const c = B[i], r = c & 255; const r2 = Math.round(r * kr), g2 = Math.round(((c >>> 8) & 255) * kg);   // el azul, con tope: los blancos quedan gris lavanda, no cian
    B[i] = (0xff000000 | (Math.min(Math.max(r2, g2) + 30, Math.round(((c >>> 16) & 255) * kb + r * ka)) << 16) | (g2 << 8) | r2) >>> 0; } };
// lo que se ve por la ventana, entero y recortado a su cristal: el cielo pasa de naranja a malva, el sol baja tras los
// abetos, salen las primeras estrellas, las nubes y los pájaros cruzan. u 0–1: cuánto ha avanzado el atardecer
const ventana1 = (t, u) => { const [x0, y0, x1, y1] = VENT, w = x1 - x0, a = y1 - y0;
  // el parteluz, el pestillo y los cantos de las cortinas que pisan el cristal se guardan y se devuelven
  const m = R.pget(137, 40), mS = R.pget(138, 40), pest = R.pget(137, 65), Kc = R.pget(95, 50), bordes = [];

  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) R.pset(x, y, S[cl(Math.floor((y - y0) / (a * 0.8) * 3.4 + (BY[(y & 3) * 4 + (x & 3)] / 16 - 0.5) * 0.9 + Math.sin(x * 0.11 + y * 0.05) * 0.18), 0, 3)]);

  const sx = x0 + 20, sy = Math.round(lerp(y0 + 15, y1 + 8, u)), cs = mez(hex('#f8c860'), hex('#f0603a'), u);

  R.disco(sx, sy, 12, mez(S[3], cs, 0.45)); R.disco(sx, sy, 10, cs); R.disco(sx, sy, 7, mez(hex('#fff0b8'), hex('#f8a060'), u));

    if (q > 0 && q < 1) { R.pset(x, y, K); R.pset(x + 1, y, K); R.pset(x - 1, y + al, K); R.pset(x - 2, y + al * 2, K); R.pset(x + 2, y + al, K); R.pset(x + 3, y + al * 2, K); } }

  for (let k = 0; k < 9; k++) abeto1(x0 + 2 + k * 8 + ((k * 5) % 3), y1 - 2 + (k % 2) * 2, 20 + ((k * 7) % 9), t * 0.7, [P[0], P[0], P[1], P[3]], k);
  abeto1(x0 + 13, y1 + 6, 50, t, P, 3); abeto1(x1 - 9, y1 + 8, 40, t, P, 7);
  for (let i = 0; i < 9; i++) if (i % 2) R.pset(x0 + 5 + i, y0 + 12 - i, mez(BL, hex('#7a78b0'), u));   // el reflejo del cristal
  R.recorte(null);
  R.rect(136, 36, 138, 90, m); R.rect(138, 36, 138, 90, mS); R.rect(106, 61, 168, 62, m); R.rect(106, 63, 168, 63, mS); R.rect(135, 64, 139, 66, pest);
  for (let y = y0, i = 0; y <= y1; y++, i += 2) { if (bordes[i] === Kc) R.pset(x0, y, Kc); if (bordes[i + 1] === Kc) R.pset(x1, y, Kc); }
};
const p1 = (t) => {
  const u = lin(t, 0.2, P2 - 0.2), e = u * u * (3 - 2 * u), apaga = lin(u, 0.35, 0.96);

  quitaRayo(176, 128, 236, 176, 1.5, 0.36); quitaRayo(178, 60, 230, 121, 0.5, 0.2, 180);

  PZ.relojArena?.(R, 142, 143, { nivel: niv, t });

  rayo1(176, 128, 236, 176, 1.5 + 0.9 * e, cr, 0.46 * Math.sqrt(1 - apaga), (x, y, q) => !enMesa(x, y) && !(y < 149 && x >= 258) && Math.abs(q - 30) > 1 && y !== 151);
  rayo1(178, 60, 230, 121, 0.5, cr, 0.24 * Math.sqrt(1 - apaga), (x) => x >= 180);

  const luz = 1 - tramo(t, muere, muere + 1.1);
