// DO-INCURSION (frases 26–28), 2022. Seis planos:
// 1. el espacio: dos planetas chocan como coches de choque (golpe en «incursion»); las palomitas se tapan los ojos y
//    Strange, en el risco, da un respingo; vuelven a chocar en «collision» (gag 3); los aros del golpe se recortan bajo
//    la barra del año (y 15), pero la nebulosa y las estrellas pintan el cuadro entero (búfer hecho fuera del recorte);
// 2. la mesa de hologramas del consejo: dos universos en burbuja cuya luz azul y rosa tiñe la sala en penumbra (motas de

//    Reed da un paso atrás y Strange retrocede; frente de mármol con vetas, cajones, gemas, rejilla y círculo de runas;

//    él se vuelve, se acerca y ella le avisa;

//    alfombra y barandilla delante): Strange llega de la escalera y ve la incursión que ha causado; Clea le hace la

// 5. un autocine de noche: en la pantalla, dos universos chocan con un destello («crashing»); las palomitas, en el techo
//    de un coche con gafas 3D, saltan;
// 6. 2026, la rueda de prensa: el presentador cuenta la sinopsis; en «universes collide» chocan dos aros de luz y
//    saltan los flashes.
import * as T from '/atomo/plato/escenas/do-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('do-incursion');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const a = (f) => en('incursion', f), c = (f) => en('clea', f), d = (f) => en('chocan', f);
const P2 = a(0.618), P3 = c(0), P4 = c(0.502), P5 = d(0), P6 = d(0.474);

  for (let y = Math.max(0, Math.round(cy - ry)); y <= Math.min(179, Math.round(cy + ry)); y++) for (let x = Math.max(0, Math.round(cx - rx)); x <= Math.min(319, Math.round(cx + rx)); x++) {

  for (let j = 0; j < hh; j++) { const w = Math.round((1 - j / hh) * 1.4 * s); for (let i = -w; i <= w; i++) R.pset(x + i + (j > hh / 2 ? sw : 0), y - j, j < hh * 0.45 && Math.abs(i) < Math.max(1, w) ? hex('#fff4c0') : j < hh * 0.75 ? hex('#ffb040') : hex('#e85a20')); } };

  y = Math.round(y0 + ((hsh(k, 3, sem) * (y1 - y0) - t * (1 + hsh(k, 4, sem) * 2) + 400 * (y1 - y0)) % (y1 - y0)) + Math.sin(t * 1.3 + k) * 1.5);
  if (Math.sin(t * 2.2 + k * 1.9) > -0.3) R.pset(x, y, col); } };
const hsh = (i, j, k) => { const v = Math.sin(i * 12.9898 + j * 78.233 + k * 37.719) * 43758.5453; return v - Math.floor(v); };

// a de 0 a 1 (abierto)

// el búfer del fondo del cosmos (nebulosa y estrellas) se hace aquí, una vez y sin recorte: si se hiciera dentro del
// recorte de p1, sus 20 filas de arriba quedarían sin pintar en todos los fotogramas
T.cosmos(R, 0, { encuadre: 'espacio', camara: 'choque', choque: 0.4 });
const p1 = (t) => {
  // los aros, chispas y estrellitas del golpe se recortan por debajo de la barra del año (y 0–14); el fondo de estrellas
  // y nebulosa, que se copia de su búfer, pinta los 320 × 180 enteros
  const ch = choque(t);
  R.recorte([0, 15, 319, 179]);
  T.cosmos(R, t, { encuadre: 'espacio', camara: 'choque', choque: ch, numeros: [838, 616] });
  // el resplandor del destello sí sigue por detrás de la barra (sin aros), para que no quede cortado en y = 15
  if (ch >= 0.78) {
    const f = ch < 0.8 ? (ch - 0.78) / 0.02 : 1 - (ch - 0.8) / 0.2;
    R.recorte([0, 0, 319, 14]); R.halo(160, 76, 30 + f * 46, [hex('#f8d870'), hex('#fff4c8'), T.C.blanco], 0.4 + f * 0.9);
  }

  const tapa = (t > GOLPE - 0.1 && t < 2.6) || (t > COL2 - 0.2 && t < P2);
  T.palomitas(R, 46, 160, t, { s: 2, dir: 1, tapa, expresion: tapa ? 'susto' : 'normal' });

  for (let j = -rr; j <= rr; j++) for (let i = -rr; i <= rr; i++) { const q = Math.hypot(i, j); if (q > rr) continue;
    const h = hsh(i, j, sem), an = Math.atan2(j, i), sw = Math.sin(an * 2 + q * 0.35 - t * 1.5);
    let c = q > rr - 1 ? hex('#c8faff') : q < 3 ? hex('#ffffff') : sw > 0.55 ? tono[1] : (h > 0.95 ? hex('#ffffff') : tono[0]);
    if (((j + Math.floor(t * 8)) & 3) === 0 && q < rr - 1) c = mix(c, hex('#0a1a2a'), 0.35);
    if (se > 0 && h < se) { if (h > se - 0.3 && ((i + j) % 3 === 0)) R.pset(x + i + Math.round(Math.sin(h * 20 + t) * 3), y + j - Math.round((se - h) * 50), tono[1]); continue; }
    R.pset(x + i, y + j, c); }

  // (más en lo claro, que es lo que refleja); al deshacerse cada universo se apaga su luz

    else { const v = Math.sin(x * 0.06 + y * 0.21 + Math.sin(y * 0.09) * 2) + 0.6 * Math.sin(x * 0.017 - y * 0.13);
      c = v > 1.15 ? hex('#a8a6bc') : v > 0.95 ? hex('#c4c2d2') : hex('#dcdae6');
      if (Math.abs(Math.sin(x * 0.045 + y * 0.17 + Math.sin(x * 0.021) * 3)) < 0.045) c = hex('#b09868');        // las vetas de oro viejo
