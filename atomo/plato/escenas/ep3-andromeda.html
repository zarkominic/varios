<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<body>
<script type="module">
// EP3-ANDROMEDA · episodio 3, frases 72–74 (sin cartela), plastilina adulta. No crea kit: usa ep03-sofa.js (la ventana y
// el salón de ep3-mapa), ep03-ojo.js (el ojo exterior y el remolino), ep03-tocar.js (la figurita), ep03-tiempo.js (el
// reloj y el rayo de alambre), ep03-cosmos.js (el mundo) y ep03-universo.js (ENLACE y fotoEnlace).
//  0          el último fotograma de ep3-mapa: el salón entero (encuadre general) con la persona sentada de espaldas, el
//             bol, el reloj en una hora, las estrellas en rayas por la ventana, la regla en 10²¹ y Atom abajo a la izquierda
//  andromeda  (plano general) la regla salta a 10²² (completa en la marca, con un destello en su fila); las rayas de la
//             ventana frenan hasta quedarse en estrellas quietas y en el vidrio de arriba a la derecha aparece Andrómeda,
//             una manchita borrosa (el remolino de ep03-ojo.js, desenfocado); la cámara se acerca despacio a la ventana.
//             A mitad de frase (corte, plano medio): la ventana de cerca, enfocada en el cielo (la habitación, desenfocada;
//             la cabeza de la persona asoma abajo a la izquierda): la manchita entre estrellas quietas, que se acerca
//  serinden   (corte, primer plano) el ojo de la persona mira arriba a la derecha; en la córnea, el reflejo de la ventana
//             con la manchita. El ojo entorna la mirada (los párpados se juntan, la pupila se abre); a mitad de frase llega
//             a su límite (un temblor, el reflejo se apaga) y el párpado se cierra. (corte, plano medio) la persona de perfil,
//             con los ojos cerrados frente a la ventana, deja caer la cabeza: se rinde
//  humanos    (corte, plano general) el espacio a 10²²: la Vía Láctea y Andrómeda, pequeñas y lejos, unidas por la vara de
//             alambre de la línea de tiempo. En la marca la luz sale de Andrómeda (un destello) y avanza por el alambre; en
//             la Vía Láctea no hay nadie; cuando la luz va por el último tramo brotan tres figuritas (los primeros humanos
//             modernos); la luz se para en ENLACE.luz y todo queda quieto (termina_con = ENLACE de ep03-universo.js)
// CONTINUIDAD
//  · Fotograma 0 = el último de ep3-mapa, con su receta (ver window.__fin de ep3-mapa): la foto del salón general (sin
//    reloj) con luzSalon y su retoque, el cielo cieloVentana(t = TQ de ep3-mapa, rayas de hornearRayas()) debajo y el vidrio
//    encima, sombrasPresentador(0,8), la regla en 10²¹ (la foto de P.render(0)), el reloj en vivo en una hora con la cuña
//    ámbar, Atom en (230, 780) con el reloj de sus electrones donde lo dejó ep3-mapa (se recalcula con sus marcas) y el
//    mismo número de fotograma para el hervor y el parpadeo.
//  · Último fotograma = ENLACE (el fotograma 0 de ep3-universo, sin su cartela): fotoEnlace(n 7), las dos galaxias, la vara
//    con la luz en ENLACE.luz y las figuritas como allí; la regla en 10²²; Atom en (230, 780), con el balanceo en el punto
//    con el que empieza ep3-universo.
// COSTE (servidor sin GPU): todo se compone en 2D (crearPost al final). Lo quieto son fotos: el salón (al cargar), la
// regla (en 10²¹ y, en 10²², tres fotos que se alternan para el hervor), la habitación desenfocada del plano de la ventana,
// Andrómeda, el fondo del plano de perfil, el fondo del espacio y las galaxias, y las figuritas. En vivo: Atom siempre;
// el reloj en el plano general; la regla mientras salta; el ojo (frase 73, primera mitad) y la persona de perfil.
// Al cargar solo se hace lo del fotograma 0 y el mundo; lo demás, en fotogramas baratos poco antes de hacer falta
// (PREPARAR). Un instante suelto hace al momento lo que le falte (F) y sale igual.
import * as THREE from 'three';
import { escena } from '/atomo/plato/escena.js';
import { crearPlato, crearPost, cargarFuenteCartela, cl, mix, prog, ss, eio, eoc, eic, azar, muelle, mulberry32, brote, QUIETO as QUIETO_KIT } from '/atomo/plato/kits/plastilina-adulta.js';
import { crearMundo, estadoMundo, camaraPorTierra } from '/atomo/plato/kits/ep03-cosmos.js';
import { tiposTiempo, uniformesTiempo, rayo } from '/atomo/plato/kits/ep03-tiempo.js';
import { tiposSofa, uniformesSofa, salon, hornearRayas, cieloVentana, vidrioVentana, recorteHueco } from '/atomo/plato/kits/ep03-sofa.js';
import { tiposOjo, uniformesOjo, ponerOjo, aberturaOjo, CAPA, COSA, haciaCamara } from '/atomo/plato/kits/ep03-ojo.js';
import { tiposTocar, figurita } from '/atomo/plato/kits/ep03-tocar.js';
import { ENLACE, fotoEnlace } from '/atomo/plato/kits/ep03-universo.js';

const T0 = performance.now();
window.__carga = [];
const marcaCarga = (k) => window.__carga.push([k, Math.round(performance.now() - T0)]);
const E = await escena('ep3-andromeda', 'ep03');
const M = (k, d) => E.marca(k, d);
const m = {
  an: M('andromeda', 0.5), anFin: M('andromeda_fin', 6.403), se: M('serinden', 6.953), seFin: M('serinden_fin', 13.218),
  hu: M('humanos', 13.793), huFin: M('humanos_fin', 16.522),
};
const D = E.duracion, QUIETO = D - 0.6;
const W = 1920, H = 1080;
const mitad = (a, b) => (a + b) / 2;
const busq = new URLSearchParams(location.search);
const GUIAS = busq.has('guias');

// ---------------------------------------------------------------- el final de ep3-mapa (con sus marcas)
// su último fotograma: n = floor((D − 0,3) × 12), el cielo en TQ y el reloj de los electrones de Atom (TA, TZ) en TQ
async function finMapa() {
  let d = 17.856, il = 0.5, ilFin = 10.264, so = 10.814;
  try {
    const j = await (await fetch('/atomo/plato/escenas/marcas-ep03.json')).json(), x = j['ep3-mapa'];
    d = x.duracion; il = x.marcas.ilustracion; ilFin = x.marcas.ilustracion_fin; so = x.marcas.sofa;
  } catch { /* los valores de la locución actual */ }
  const Q = d - 0.6, B = mitad(il, ilFin) - 0.3, golpes = [il, so], DT = 1 / 240;
  const velA = (t) => ss(0, 0.7, t) * (1 + golpes.reduce((s, t0) => s + 0.8 * Math.exp(-Math.pow((t - t0) / 0.4, 2)), 0) + 0.6 * Math.exp(-Math.pow((t - B) / 0.4, 2))) * (1 - eio(prog(t, Q - 0.9, Q)));
  const velZ = (t) => ss(0, 0.7, t) * (1 - eio(prog(t, Q - 0.9, Q)));
  const n = Math.floor((d - QUIETO_KIT) * 12 + 1e-6), TQ = n / 12;
  const TA = [0], TZ = [0];
  for (let i = 1; i * DT <= d + 0.2; i++) { TA.push(TA[i - 1] + velA((i - 0.5) * DT) * DT); TZ.push(TZ[i - 1] + velZ((i - 0.5) * DT) * DT); }
  const tabla = (Tb, t) => { const x = t / DT, i = Math.min(Tb.length - 2, Math.max(0, Math.floor(x))); return mix(Tb[i], Tb[i + 1], x - i); };
  return { n, TQ, ta: tabla(TA, TQ), tz: tabla(TZ, TQ) };
}
const MAPA = await finMapa();

// ---------------------------------------------------------------- tiempos (todo sale de las marcas)
const T = {
  salto: [m.an - 0.30, m.an + 0.02],                    // la regla salta de 10²¹ a 10²² (completa en la marca)
  frena: [m.an - 0.15, m.an + 1.05],                    // las rayas frenan hasta ser estrellas quietas
  andro: [m.an + 0.1, m.an + 1.0],                      // aparece Andrómeda en la ventana
  empA: [m.an + 0.35, 0],                               // la cámara se acerca despacio a la ventana
  B: mitad(m.an, m.anFin),                              // corte: la ventana de cerca
  C: m.se - 0.2,                                        // corte: el ojo
  entorna: [m.se - 0.05, 0],                            // el ojo entorna la mirada
  lim: mitad(m.se, m.seFin),                            // a mitad de frase: el límite, y el párpado se cierra
  E: m.hu - 0.22,                                       // corte: el espacio y la línea de tiempo
  luz: [m.hu, Math.min(m.huFin, m.hu + 2.7)],           // la luz va de Andrómeda a ENLACE.luz
};
T.empA[1] = T.B;
T.entorna[1] = T.lim - 0.3;
T.cierra = [T.lim - 0.12, T.lim + 0.28];
T.D = T.lim + 0.62;                                     // corte: la persona de perfil
T.cae = [T.D + 0.45, T.D + 1.9];                        // deja caer la cabeza
const TQ = Math.floor((D - QUIETO_KIT) * 12 + 1e-6) / 12;
const tramo = (ts) => (ts < T.B ? 'general' : ts < T.C ? 'ventana' : ts < T.D ? 'ojo' : ts < T.E ? 'perfil' : 'espacio');

// ---------------------------------------------------------------- el plató
// (continuidad) la persona, la regla y su flecha y las piezas del salón en los huecos de ep3-mapa (0…6): la foto del salón
// y la de la regla salen como allí
const I = { PER: 0, REG: 1, FLE: 2, VEN: 3, SOFA: 4, BOL: 5, REL: 6, OJO: 7, COSA: 8, FIG: 9 };
const IS_FOTO = { persona: I.PER, ventana: I.VEN, sofa: I.SOFA, bol: I.BOL };
const UO = uniformesOjo();
const TO = tiposOjo({ cosas: ['remolino'] });
await cargarFuenteCartela();   // (los rótulos de la regla salen como en ep3-mapa y ep3-universo)
const P = await crearPlato({
  piezas: ['humano', 'reglaA', 'flecha', 'ventana', 'sofa', 'bol', 'reloj', 'ojo', 'cosa', 'figurita'],
  tiposExtra: { ...tiposSofa(['ventana', 'sofa', 'bol']), ...tiposTiempo(['reloj']), ojo: TO.ojo, cosa: TO.cosa, ...tiposTocar(['figurita']) },
  uniformes: { ...uniformesSofa(), ...uniformesTiempo(), ...UO },
  alfa: true, post: false,
  sombraFondo: ['p1', 'p2'],
  sombras: { p3: ['p4'], p4: ['p0', 'p5'], p5: ['p0'] },
  camara: { pos: [0, 3.8, 15.5], mira: [0, 2.3, 0], fov: 28, desenfoque: 44 },
});
marcaCarga('plató');
const POST = crearPost();
const RAYAS = hornearRayas();
const en = (sx, sy, z) => P.punto(sx, sy, z);
const pant = (p) => P.proyectar(p);
const pxU = (pos) => { const a = pant(pos), b = pant([pos[0] + 1, pos[1], pos[2]]); return Math.hypot(b[0] - a[0], b[1] - a[1]); };

// ---------------------------------------------------------------- capas: el lienzo de WebGL (oculto) y uno 2D encima
const cont = document.getElementById('escena');
const lienzoGL = P.renderer.domElement;
lienzoGL.style.visibility = 'hidden';
const capa = document.createElement('canvas');
capa.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;display:block;z-index:3';
cont.appendChild(capa);
const g = capa.getContext('2d');
let KD = 1;
function ajustarCapa() {
  if (capa.width !== lienzoGL.width || capa.height !== lienzoGL.height) { capa.width = lienzoGL.width; capa.height = lienzoGL.height; }
  KD = capa.width / W; g.setTransform(KD, 0, 0, KD, 0, 0);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.filter = 'none';
}
const pegarGL = (alfa = 1) => { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = alfa; g.drawImage(lienzoGL, 0, 0); g.restore(); };
const lienzo = (w = lienzoGL.width, h = lienzoGL.height) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const copiaGL = () => { const c = lienzo(); c.getContext('2d').drawImage(lienzoGL, 0, 0); return c; };
function trozoGL([x0, y0, x1, y1]) {
  const k = lienzoGL.width / W, c = lienzo(Math.round((x1 - x0) * k), Math.round((y1 - y0) * k));
  c.getContext('2d').drawImage(lienzoGL, Math.round(x0 * k), Math.round(y0 * k), c.width, c.height, 0, 0, c.width, c.height);
  c.ref = [x0, y0, x1, y1];
  return c;
}
// una foto de 1920 × 1080 escalada s veces: el punto src de la foto queda en dst
function pegarEscalada(f, s, src, dst = src, alfa = 1, filtro = null) {
  if (alfa <= 0.002) return;
  g.save(); g.globalAlpha *= alfa;
  if (filtro) g.filter = filtro;
  g.translate(dst[0], dst[1]); g.scale(s, s); g.translate(-src[0], -src[1]);
  g.drawImage(f, 0, 0, W, H);
  g.restore();
}
const llevar = (s, src, dst) => (p) => [dst[0] + (p[0] - src[0]) * s, dst[1] + (p[1] - src[1]) * s];
// el «parpadeo» de la luz del plató (como ep3-mapa; con su número de fotograma: el fotograma 0 sale como su último)
function parpadeo(n) {
  const fl = azar(n, 3) - 0.5;
  g.fillStyle = fl > 0 ? `rgba(255,236,210,${fl * 0.03})` : `rgba(0,0,6,${-fl * 0.04})`; g.fillRect(0, 0, W, H);
}

// ---------------------------------------------------------------- Atom (presentador: pequeño, abajo a la izquierda)
const A_Z = 1.0, ATOMO = [230, 780];
const A_ESC = 180 / (2 * (1.68 + 0.16) * pxU(en(...ATOMO, A_Z)));
const CAM = [0, 3.8, 15.5];
const gy = (p) => Math.atan2(CAM[0] - p[0], CAM[2] - p[2]), gp = (p) => Math.atan2(p[1] - CAM[1], Math.hypot(CAM[0] - p[0], CAM[2] - p[2]));
const A_W = en(...ATOMO, A_Z), A_REF = en(850, 330, A_Z);
const A_YAW = gy(A_W) - gy(A_REF), A_PITCH = gp(A_W) - gp(A_REF);
// el reloj de los electrones (TA) y el del balanceo (TZ) siguen donde los dejó ep3-mapa; arrancan despacio y se paran al
// final, con el balanceo en el punto con el que empieza ep3-universo (tz = 0)
const DT = 1 / 240, TA = [MAPA.ta], TZ = [MAPA.tz];
const golpes = [m.an, m.se, m.hu];
const velA = (t) => ss(0, 0.7, t) * (1 + golpes.reduce((s, t0) => s + 0.8 * Math.exp(-Math.pow((t - t0) / 0.4, 2)), 0) + 0.5 * Math.exp(-Math.pow((t - T.lim) / 0.4, 2))) * (1 - eio(prog(t, QUIETO - 0.9, QUIETO)));
const velZ = (t) => ss(0, 0.7, t) * (1 - eio(prog(t, QUIETO - 0.9, QUIETO)));
for (let i = 1; i * DT <= D + 0.2; i++) { TA.push(TA[i - 1] + velA((i - 0.5) * DT) * DT); TZ.push(TZ[i - 1] + velZ((i - 0.5) * DT) * DT); }
const tabla = (Tb, t) => { const x = t / DT, i = Math.min(Tb.length - 2, Math.max(0, Math.floor(x))); return mix(Tb[i], Tb[i + 1], x - i); };
function estadoAtom(ts) {
  const tz = tabla(TZ, ts), fin = ss(QUIETO - 1.8, QUIETO - 0.15, ts);
  const sx = ATOMO[0], sy = ATOMO[1] + mix(3 * Math.sin(tz * 1.3) + 2 * Math.sin(tz * 0.7 + 1.0), 2 * Math.sin(1.0), fin);
  const yawW = mix(0.08 * Math.sin(tz * 0.5), 0, fin);
  const brillo = Math.max(...golpes.map((t0) => Math.sin(Math.PI * prog(ts, t0 - 0.15, t0 + 0.6))), 0.6 * Math.sin(Math.PI * prog(ts, T.lim - 0.1, T.lim + 0.5)));
  return { sx, sy, tz, yawW, brillo };
}
function atomo(ts, { claro = 0 } = {}) {
  const S = estadoAtom(ts);
  const en0 = ts < QUIETO ? E.energia(ts) : 0;
  P.atomo({
    pos: en(S.sx, S.sy, A_Z), escala: A_ESC, yaw: -0.15 + A_YAW + S.yawW, pitch: 0.06 - A_PITCH,
    energia: Math.min(1, en0 + 0.45 * S.brillo), ts: tabla(TA, ts), halo: 1 - 0.55 * claro, velo: 0.1 + 0.35 * claro,
  });
  return S;
}
// la sombra blanda bajo Atom (para que se lea sobre fondos claros: la piel del ojo, el perfil) y las sombras de Atom y de
// la regla sobre el salón (como ep3-mapa)
function sombraAtom(k = 1) {
  if (k <= 0.002) return;
  const gr = g.createRadialGradient(232, 782, 40, 232, 782, 190);
  gr.addColorStop(0, `rgba(14,8,5,${0.55 * k})`); gr.addColorStop(1, 'rgba(14,8,5,0)');
  g.fillStyle = gr; g.fillRect(30, 580, 400, 400);
}
const SOM_A = [ATOMO[0] + 22, ATOMO[1] + 2 * Math.sin(1.0) + 30, 62, 0.42];
function sombrasPresentador(fuerza = 1, regla = true) {
  g.save();
  g.globalCompositeOperation = 'multiply';
  const [ax, ay, ar, ak] = SOM_A;
  const h = g.createRadialGradient(ax, ay, 0, ax, ay, ar * 1.6);
  h.addColorStop(0, `rgba(40,30,40,${ak * 0.9 * fuerza})`); h.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = h; g.fillRect(ax - ar * 1.6, ay - ar * 1.6, ar * 3.2, ar * 3.2);
  if (regla) {
    const l = g.createLinearGradient(1500, 0, 1640, 0);
    l.addColorStop(0, 'rgba(255,255,255,0)'); l.addColorStop(1, `rgba(50,40,45,${0.38 * fuerza})`);
    g.fillStyle = l; g.fillRect(1500, 230, 260, 690);
  }
  g.restore();
}
// la pasada de Atom sola (cuando lo de detrás va en otra pasada: el ojo y la persona están más cerca de la cámara)
function pasadaAtomo(n, ts) { P.limpiar(); atomo(ts); P.render(n, { fondo: false }); pegarGL(); }

// ---------------------------------------------------------------- la regla: 10²¹ (foto) → salta a 10²² (en vivo) → 10²² (fotos)
const E_REG = 1.42, REG = en(1655, 528, 0.4), RECT_REG = [1300, 0, 1920, 1080];
const seco = (u) => 1 - Math.pow(1 - cl(u), 4);
const eRegla = (ts) => 21 + seco(prog(ts, T.salto[0], T.salto[1]));
const destello = (ts) => { const u = prog(ts, T.salto[1] - 0.06, T.salto[1] + 0.75); return u <= 0 || u >= 1 ? 0 : Math.pow(Math.sin(Math.PI * u), 0.8); };
const reglaViva = (ts) => ts < T.salto[1] + 0.8;
function regla(ts) {
  const e = eRegla(ts), fl = destello(ts);
  const rango = fl > 0.01 ? { de: 22, a: 22, marcas: 1, madera: 1.1 * fl } : null;
  return P.regla({ pieza: I.REG, flecha: I.FLE, pos: REG, escala: E_REG, rot: [0, -0.12, 0], e, ya: 0, actual: Math.round(e), lupa: 0.5 + 0.22 * fl, rango, toque: ts < T.salto[1] + 0.08 });
}
function fotoRegla(e, n) {
  P.limpiar();
  P.regla({ pieza: I.REG, flecha: I.FLE, pos: REG, escala: E_REG, rot: [0, -0.12, 0], e, ya: 0, actual: e, lupa: 0.5 });
  P.render(n, { fondo: false });
  return trozoGL(RECT_REG);
}
const pegarRegla = (f) => g.drawImage(f, RECT_REG[0], RECT_REG[1], RECT_REG[2] - RECT_REG[0], RECT_REG[3] - RECT_REG[1]);
const reglaDe = (n) => 'reg22' + (n % 3);

// ---------------------------------------------------------------- las fotos (F: se hacen la primera vez que hacen falta)
const FOTOS = {}, HACER = {};
function F(k) { if (!(k in FOTOS)) { const a = performance.now(); FOTOS[k] = HACER[k](); window.__carga.push(['F ' + k, Math.round(performance.now() - a)]); } return FOTOS[k]; }
for (const k of [0, 1, 2]) HACER['reg22' + k] = () => fotoRegla(22, 7201 + k);

// ---------------------------------------------------------------- A · el salón (la foto de ep3-mapa) y la ventana
const N_FOTO_SALON = 5002;
function luzSalon(gc, foco) {
  gc.save();
  gc.globalCompositeOperation = 'source-atop';
  const R = 1250;
  const h = gc.createRadialGradient(foco[0], foco[1], 120, foco[0], foco[1], R);
  h.addColorStop(0, 'rgba(255,190,120,0.06)'); h.addColorStop(0.45, 'rgba(40,24,16,0.08)'); h.addColorStop(1, 'rgba(18,10,8,0.42)');
  gc.fillStyle = h; gc.fillRect(0, 0, W, H);
  gc.restore();
}
// (el retoque de ep3-mapa: dos defectos del «humano» de espaldas en esta postura y este encuadre)
function retoque(gf) {
  gf.save();
  const blob = (x, y, rx, ry, col, a, modo) => {
    gf.save(); gf.globalCompositeOperation = modo; gf.translate(x, y); gf.scale(1, ry / rx);
    const h = gf.createRadialGradient(0, 0, 0, 0, 0, rx);
    h.addColorStop(0, `rgba(${col},${a})`); h.addColorStop(0.6, `rgba(${col},${a * 0.65})`); h.addColorStop(1, `rgba(${col},0)`);
    gf.fillStyle = h; gf.fillRect(-rx, -rx, 2 * rx, 2 * rx); gf.restore();
  };
  blob(738, 476, 30, 34, '150,108,78', 0.5, 'multiply');
  blob(710, 542, 17, 8, '206,189,164', 0.95, 'lighten');
  blob(676, 440, 6, 6, '150,110,78', 0.9, 'darken');
  gf.restore();
}
HACER.salon = () => {
  P.limpiar();
  const info = salon(P, IS_FOTO, { encuadre: 'general' });
  P.render(N_FOTO_SALON, { fondo: false });
  const foto = copiaGL(), gf = foto.getContext('2d'), k = foto.width / W;
  gf.setTransform(k, 0, 0, k, 0, 0);
  luzSalon(gf, pant(info.persona.punto('cabeza')));
  retoque(gf);
  return { foto, info };
};

// Andrómeda: el remolino de ep03-ojo.js, muy inclinado (casi de canto, como se ve), en una foto; en la ventana va

const kAndro = (ts) => ss(T.andro[0], T.andro[1], ts);

// ---------------------------------------------------------------- render por recortes (scissor de WebGL)

    const y0 = Math.round((b * H) / nb), y1 = b === nb - 1 ? H : Math.round(((b + 1) * H) / nb);

    return true;
  };

// pega el rectángulo [x0, y0, x1, y1] del lienzo de WebGL en gx con los bordes fundidos (pluma px)

// ---------------------------------------------------------------- C · el ojo (el exterior de ep03-ojo.js)
// de frente, algo a la izquierda (la regla va a la derecha), mirando arriba a la derecha (la ventana). La cara entera es

  const tr = Math.sin(Math.PI * prog(ts, T.lim - 0.55, T.cierra[0] + 0.05)) * 0.035 * Math.sin(ts * 47);

const zoomC = (ts) => mix(1, 1.05, eio(prog(ts, T.C, T.D)));

// en el render con esta mirada: un poco arriba a la izquierda del centro de la pupila

// la sombra del párpado de arriba sobre el globo (sin la sombra 3D del kit, que con el ojo entornado deja una mancha

// ---------------------------------------------------------------- D · la persona de perfil, con los ojos cerrados

// arriba; deja caer la cabeza. El cuerpo es una foto (no se mueve); la cabeza, en vivo (la receta de la foto del kit:
// partes). Detrás, la habitación de noche y la ventana con el cielo quieto (desenfocadas, una foto)
const Z_D = 11.1, E_D = 2.4, X_D = 650;

fotoPorBandas('cuerpoD', 3, () => { P.limpiar(); personaD(T.D, { partes: ['cuerpo', 'manos'] }); }, 9401);
// el rectángulo de la cabeza (con margen para lo que se mueve al dejarla caer)

  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const r = 0.62 * (Math.max(...ys) - Math.min(...ys));
  return [Math.min(...xs) - r * 1.25, Math.min(...ys) - r * 0.8, Math.max(...xs) + r * 1.25, Math.max(...ys) + r * 0.75].map(Math.round);
})();
P.limpiar();
// el fondo: la pared de noche (en penumbra, con la lámpara cálida a la izquierda) y, a la derecha, la ventana (marco
// crema, parteluz, el cielo quieto con Andrómeda), todo desenfocado
const HUECO_D = [[1050, 70], [1520, 70], [1520, 790], [1050, 790]];
HACER.fondoD = () => {
  const c = lienzo(), gc = c.getContext('2d');
  const a = lienzo(), ga = a.getContext('2d');
  ga.setTransform(KD, 0, 0, KD, 0, 0);

  pg.addColorStop(0, '#433f30'); pg.addColorStop(0.55, '#323126'); pg.addColorStop(1, '#25261f');
  ga.fillStyle = pg; ga.fillRect(0, 0, W, H);
  const lm = ga.createRadialGradient(60, 300, 40, 60, 300, 950);
  lm.addColorStop(0, 'rgba(255,190,120,0.35)'); lm.addColorStop(0.5, 'rgba(200,140,80,0.10)'); lm.addColorStop(1, 'rgba(0,0,0,0)');
  ga.fillStyle = lm; ga.fillRect(0, 0, W, H);
  ga.fillStyle = 'rgba(30,22,16,0.9)'; ga.fillRect(0, 940, W, 140);
  // la ventana: el cielo quieto con Andrómeda, y el marco
  cieloVentana(ga, HUECO_D, { t: 0, velocidad: 1e-4, rayas: RAYAS });
  andromeda(ga, HUECO_D, 1, { ancho: 0.24, centro: [1330, 280] });
  ga.fillStyle = '#d4c8ad';

  bar(1020, 40, 30, 790); bar(1520, 40, 30, 790); bar(1020, 40, 530, 30); bar(1020, 790, 530, 30); bar(1275, 70, 22, 720); bar(1050, 420, 470, 20);
  ga.fillStyle = '#c4b697'; bar(990, 820, 590, 34);
  // la cortina, a la izquierda de la ventana: pliegues (bandas de luz y sombra)
  for (let i = 0; i < 6; i++) {
    const x = 870 + i * 25, l = ga.createLinearGradient(x, 0, x + 25, 0);
    l.addColorStop(0, '#9c5534'); l.addColorStop(0.5, '#c87a4c'); l.addColorStop(1, '#9c5534');

// la persona: la foto del cuerpo, la cabeza en vivo y la luz fría de la ventana, que recorta el perfil (solo sobre ella)
const PERF = lienzo(), gpf = PERF.getContext('2d');
function tramoD(n, ts) {
  g.drawImage(F('fondoD'), 0, 0, W, H);

  mk(x0 + pl, y0 + pl, x1 - x0 - 2 * pl, y1 - y0 - 2 * pl);
  gpf.restore();
  pegarParche(gpf, CAJA_CAB, pl);
  gpf.setTransform(KD, 0, 0, KD, 0, 0); gpf.globalCompositeOperation = 'source-atop';
  const rl = gpf.createLinearGradient(X_D + 260, 0, X_D + 40, 0);

  gpf.fillStyle = rl; gpf.fillRect(0, 0, W, H);

// ---------------------------------------------------------------- E · el espacio a 10²² y la línea de tiempo (ENLACE)
HACER.mundo = () => { const mundo = crearMundo(cont, { captura: P.captura }); mundo.lienzo.style.visibility = 'hidden'; return mundo; };
HACER.enlace = () => fotoEnlace(F('mundo'), estadoMundo, camaraPorTierra, { n: 7 });
const RODV = (() => { const [a, b] = ENLACE.vara; return { a, b, L: Math.hypot(b[0] - a[0], b[1] - a[1]) }; })();
// las figuritas, como en ep3-universo (una foto de cada una con su semilla)
HACER.figs = () => ENLACE.figuritas.map((f) => {
  const R = 150;
  P.fotograma(0); P.limpiar();
  const p = en(960, 540, 1.5), e = R / pxU(p);
  figurita(P, I.FIG, { pos: p, escala: e, semilla: f.semilla, rot: [0, 0.35, 0] });
  P.render(0, { fondo: false });
  const c = document.createElement('canvas'); const k = lienzoGL.width / W;
  c.width = Math.round(R * 1.2 * k); c.height = Math.round(R * 1.2 * k);
  c.getContext('2d').drawImage(lienzoGL, (960 - R * 0.6) * k, (540 - R * 0.6) * k, R * 1.2 * k, R * 1.2 * k, 0, 0, c.width, c.height);
  return { ...f, foto: c, R };
});
// la luz: sale de Andrómeda en la marca y llega a ENLACE.luz (el último tramo) poco antes del final de la frase
const luzEn = (ts) => ENLACE.luz * (0.5 - 0.5 * Math.cos(Math.PI * Math.pow(prog(ts, T.luz[0], T.luz[1]), 0.85)));
// cuándo pasa la luz por u (para que las figuritas broten cuando ya va por el último tramo)
function cuandoLuz(u) { let a = T.luz[0], b = T.luz[1]; for (let i = 0; i < 40; i++) { const c = (a + b) / 2; if (luzEn(c) < u) a = c; else b = c; } return (a + b) / 2; }
const T_FIG = [0.78, 0.82, 0.86].map(cuandoLuz);
// la cámara empieza cerca de Andrómeda (la Vía Láctea, fuera del cuadro) y se aleja con la luz hasta el encuadre de ENLACE
const zoomE = (ts) => mix(1.32, 1, eio(prog(ts, T.E, T.luz[1] + 0.15)));
const C_E = ENLACE.andromeda;
function tramoE(n, ts) {
  const EN = F('enlace'), GAL = EN.galaxia;
  const z = zoomE(ts);
  g.save();
  g.translate(C_E[0], C_E[1]); g.scale(z, z); g.translate(-C_E[0], -C_E[1]);
  g.drawImage(EN.fondo, 0, 0, W, H);
  const dibGal = (x, y, r, giro, aplasta, a) => {
    const k = r / GAL.r, L = GAL.lienzo.width * k;
    g.save(); g.globalAlpha = a; g.translate(x, y); g.rotate(giro); g.scale(1, aplasta);
    g.drawImage(GAL.lienzo, -L / 2, -L / 2, L, L); g.restore();
  };
  dibGal(ENLACE.via[0], ENLACE.via[1], ENLACE.rVia, 0, 1, 1);
  dibGal(ENLACE.andromeda[0], ENLACE.andromeda[1], ENLACE.rAnd, ENLACE.giroAnd, ENLACE.aplastaAnd, 1);
  // la salida de la luz: un destello en Andrómeda y un anillo que se abre
  const kd = Math.sin(Math.PI * prog(ts, T.luz[0] - 0.18, T.luz[0] + 0.55));
  if (kd > 0.01) {
    const [x, y] = RODV.a;
    g.save(); g.globalCompositeOperation = 'screen';
    const hd = g.createRadialGradient(x, y, 0, x, y, 120);
    hd.addColorStop(0, `rgba(255,225,170,${0.75 * kd})`); hd.addColorStop(0.3, `rgba(255,190,110,${0.3 * kd})`); hd.addColorStop(1, 'rgba(255,170,90,0)');
    g.fillStyle = hd; g.fillRect(x - 120, y - 120, 240, 240);
    const ua = prog(ts, T.luz[0] - 0.05, T.luz[0] + 0.6);
    if (ua > 0 && ua < 1) { g.strokeStyle = `rgba(255,210,150,${0.8 * (1 - ua)})`; g.lineWidth = 4 * (1 - ua) + 1; g.beginPath(); g.arc(x, y, 18 + 90 * eoc(ua), 0, 2 * Math.PI); g.stroke(); }
    g.restore();
  }
  // la vara de alambre y la luz que avanza (como lineaTiempo de ep3-universo)
  const pts = [RODV.a, RODV.b];
  rayo(g, pts, { grosor: 4, brillo: 0.12, cabeza: 0, sombra: 0.6 });
  const u = luzEn(ts), kc = ss(T.luz[0] - 0.2, T.luz[0] + 0.05, ts);
  if (kc > 0.001) rayo(g, pts, { hasta: Math.max(u * RODV.L, 0.001), grosor: 6, brillo: 1, cabeza: kc });
  // las figuritas: brotan una a una cuando la luz ya va por el último tramo (con un brillo cálido al llegar)
  const FIGS = F('figs');
  FIGS.forEach((f, i) => {
    const kb = brote(ts, T_FIG[i], 0.22, 0.16);
    if (kb <= 0.001) return;
    const s = f.alto / (f.R * 0.98), w = f.foto.width * (W / lienzoGL.width) * s * kb;
    const gb = Math.sin(Math.PI * prog(ts, T_FIG[i] - 0.2, T_FIG[i] + 0.5));
    if (gb > 0.01) {
      g.save(); g.globalCompositeOperation = 'screen';
      const hb = g.createRadialGradient(f.x, f.y - f.alto * 0.5, 0, f.x, f.y - f.alto * 0.5, f.alto * 1.1);
      hb.addColorStop(0, `rgba(255,200,130,${0.4 * gb})`); hb.addColorStop(1, 'rgba(255,180,100,0)');
      g.fillStyle = hb; g.fillRect(f.x - f.alto * 1.2, f.y - f.alto * 1.7, f.alto * 2.4, f.alto * 2.4);
      g.restore();
    }
    g.drawImage(f.foto, f.x - w / 2, f.y - w * 0.92, w, w);
  });
  g.restore();
  pegarRegla(F(reglaDe(n)));
  pasadaAtomo(n, ts);
}

// ---------------------------------------------------------------- vista de guías (?guias): la persona de perfil, de cuerpo entero
if (GUIAS) {
  const Zg = 2.0, Eg = 2.4;

  // (la misma persona, de frente, a la derecha: para medir las líneas con los brazos colgando)

}

// ---------------------------------------------------------------- al cargar: lo del fotograma 0, el mundo y los estrenos
F('salon'); marcaCarga('salón');
// estrenos: Atom, el reloj y la regla en vivo (su primer dibujo compila en SwiftShader); no cambian ningún píxel
P.fotograma(0); P.limpiar();
relojEn(1); regla(T.salto[0]); atomo(0);
P.render(0, { fondo: false });
marcaCarga('estrenos');
F('mundo'); marcaCarga('mundo');
// lo demás, en fotogramas baratos poco antes de hacer falta (en orden, como renderiza render-escenas.mjs)
const nDe = (t) => Math.floor(t * 12 + 1e-6);
// los estrenos (compilar en SwiftShader un programa la primera vez que dibuja) en un recorte de dos filas: no pintan nada
// que se vea y compilan lo mismo que el primer fotograma que los usa
const TIRA = [0, 0, W, 2];
HACER.estrenoOjo = () => { ponerOjoEn(estadoOjo(T.C)); renderRect(0, TIRA); return true; };
HACER.estrenoCuerpoD = () => { P.limpiar(); personaD(T.D, { partes: ['cuerpo', 'manos'] }); renderRect(0, TIRA); return true; };
HACER.estrenoCabezaD = () => { P.limpiar(); personaD(T.D); renderRect(0, TIRA); return true; };
const PREPARAR = [
  [1, 'andro'], [3, 'reg220'], [4, 'reg221'], [5, 'reg222'],
  [17, 'estrenoOjo'], ...[0, 1, 2, 3, 4, 5].map((b) => [19 + 2 * b, 'ojoFoto' + b]),
  [31, 'estrenoCuerpoD'], [33, 'estrenoCabezaD'], [35, 'cuerpoD0'], [37, 'cuerpoD1'], [39, 'cuerpoD2'],
  [nDe(T.B) - 4, 'salonB'],
  [nDe(T.B) + 4, 'fondoD'],
  [nDe(T.B) + 10, 'enlace'],
  [nDe(T.B) + 18, 'figs'],
];
// las fotos que necesita cada fotograma (se piden antes de empezar a dibujarlo, para no limpiar el plató a medias)
function fotosDe(n, ts) {
  const k = [];
  if (!reglaViva(ts)) k.push(reglaDe(n));
  const tr = tramo(ts);
  if (tr === 'general') { k.push('salon'); if (kAndro(ts) > 0.002) k.push('andro'); }
  else if (tr === 'ventana') k.push('salon', 'salonB', 'andro');
  else if (tr === 'ojo') k.push('ojoFoto');
  else if (tr === 'perfil') k.push('fondoD', 'andro', 'cuerpoD');
  else if (tr === 'espacio') k.push('enlace', 'figs');
  return k;
}

// ---------------------------------------------------------------- dibujar
function dibujar(t) {
  ajustarCapa();
  const n = P.fotograma(t, D), ts = n / 12;
  for (const [nk, k] of PREPARAR) if (n === nk) F(k);
  for (const k of fotosDe(n, ts)) F(k);
  ajustarCapa();
  g.fillStyle = '#05060b'; g.fillRect(0, 0, W, H);
  const tr = tramo(ts);
  if (tr === 'general') tramoA(n, ts);
  else if (tr === 'ventana') tramoB(n, ts);
  else if (tr === 'ojo') tramoC(n, ts);
  else if (tr === 'perfil') tramoD(n, ts);
  else tramoE(n, ts);
  if (tr !== 'espacio') parpadeo(n + MAPA.n);
  POST.aplicar(g, n);
  window.__plano = tr;
}
window.__fin = {
  final: 'ENLACE de ep03-universo.js: fotoEnlace(n 7) + las dos galaxias + la vara (rayo grosor 4, brillo 0,12, sombra 0,6) + la luz en ENLACE.luz (rayo grosor 6) + las figuritas de ENLACE.figuritas; la regla en 10²² (foto); Atom en (230, 780)',
  TQ, tiempos: T, figuritas: T_FIG, mapa: MAPA, atomo: (() => { const S = estadoAtom(D); return { sy: S.sy, tz: S.tz, ta: tabla(TA, D) }; })(),
};
marcaCarga('listo');
