<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<body>
<script type="module">
// EPISODIO 3 · ep3-centro (frases 85–89, cartela «½»). Plastilina adulta: el plató de las pruebas, la regla del lote 0
// en modo entera (la coreografía de ep3-lote0-demo: rango y flecha que cae a −4), el «humano» del lote 0, la niebla de
// kits/ep03-universo.js, el ojo, la franja y las cosas de kits/ep03-ojo.js (el ojo del gancho, como pintarFinalHola) y la
// foto del pelo-tronco (nivel 4) de prueba-plastilina-adulta. No crea ni cambia ningún kit.
//  0          (= último fotograma de ep3-borde) la niebla brillante a pantalla completa (NIEBLA_FIN, la foto n 0 o 1 con la
//             misma paridad), la sombra blanda de Atom, la regla en 10²⁷ con la flecha y Atom en (230, 780) con el giro y
//             la fase de los electrones con que acaba ep3-borde; delante, la cartela «½» (quieta hasta 0,75 s, se va
//             hacia 1,2 s)
//  pregunta   DETALLE → GENERAL. Tras la cartela la niebla se abre desde el centro (abre del kit) y se aleja; detrás, el
//             plató de las pruebas, que también se aleja: la persona de pie a la izquierda y la regla, que se comprime
//             hasta verse entera (de la niebla de Planck a la red). La flecha se queda arriba, en +27, y busca: baja un
//             par de filas y vuelve
//  sesenta    PLANO MEDIO (corte; un recorte 2D del render, como dice la producción: la regla entera fotografiada 1,35
//             veces más grande y ampliada 1,56 en 2D). La cámara sube de la niebla de Planck a la red mientras las marcas
//             se encienden en ámbar una a una (la foto con el rango entero, recortada por debajo de la última marca
//             alcanzada). Al final, arriba, la red y la flecha en +27
//  medio      GENERAL (corte). Las marcas se apagan; la flecha baja de +27 a 0, a la altura de la persona, que la señala
//             con la izquierda (apuntar); se para un instante en 0 («no eres tú») y cae cuatro saltos secos a −4
//  pelo       Junto a la marca −4 se abre la mirilla del pelo (la foto del pelo-tronco de la prueba), que brilla en la
//             marca; la mirilla crece hasta llenar la pantalla. Silencio de 2 s: la imagen quieta sobre el pelo
//  mismopelo  La cámara se aleja del pelo: la mirilla encoge hasta una cuenta de luz en el centro de la franja del ojo
//             del gancho (el último fotograma de ep3-hola: ojo enorme, párpados casi cerrados, la franja de luz y las
//             cosas apagadas tras los párpados). La franja se estrecha hasta el ancho de la cuenta del pelo y ahí se
//             cierran los párpados (en vivo, solo la banda que se mueve). Se asienta y queda quieto (0,6 s)
// Las palabras sueltas no tienen marca: lo que pasa dentro de una frase va a una fracción fija de su intervalo
// (E.marca(x) … E.marca(x + '_fin')). La regla va siempre encima, como en ep3-borde (en el general, en su sitio del plató).
// CONTINUIDAD
//  · Fotograma 0 = el último de ep3-borde (window.__fin de ep3-borde): ver arriba; window.__inicio.
//  · Último fotograma (ep3-despedida empieza así; window.__fin lo da en números): el ojo de encuadreHola (ep03-ojo.js) con
//    los párpados cerrados ({ arriba: 1, abajo: 1 }) sobre la franja reducida al pelo (la franja de encuadreHola, estirada
//    en x por FIN.franja.sx alrededor de x 960, y su halo; queda tras la cuenta), con la cuenta del pelo en el centro
//    (CF, radio R_PELO: la tira del pelo-tronco, y de 140 a 700 de su foto repetida en vertical, escalada SC_FIN con su
//    punto SRC0 en el centro, y un aro de luz); la regla entera en la posición de
//    FINAL_UNIVERSO (P.punto(1655, 528, 0,4), escala 1,42, rot [0, −0,12, 0]) con entera 1, actual −4, marca −4,
//    lupaEntera 1,3, con la flecha; Atom en (230, 780), quieto, con la sombra cálida del ojo (HOLA.SOMBRA_ATOM).
// Coste (≤ 5 s por fotograma dibujado): lo quieto son fotos (la niebla, el plató con la persona, el plató vacío, la regla
// de cerca apagada y encendida, el pelo-tronco, el general del final con la persona señalando, la regla en −4, las capas
// del ojo). En vivo: Atom siempre; la regla del general mientras cambia (y la cartela al principio); la niebla al abrirse
// (a media resolución); la persona solo en la frase 87, cuando señala; los párpados mientras se cierran (solo la banda
// que se mueve). Las fotos que no hacen falta al cargar se hacen en fotogramas baratos poco antes (PREPARAR; las de la
// regla de cerca, por bandas horizontales).
import * as THREE from 'three';
import { escena } from '/atomo/plato/escena.js';
import { crearPlato, crearPost, cartela, cl, mix, prog, ss, eio, eoc, eob, HUMANO } from '/atomo/plato/kits/plastilina-adulta.js';
import { crearCielo, FINAL_UNIVERSO } from '/atomo/plato/kits/ep03-universo.js';
import { tiposOjo, uniformesOjo, ponerOjo, CAPA, OJO, HOLA, encuadreHola, resplandorFranja, sombraParpados, vinetaOjo } from '/atomo/plato/kits/ep03-ojo.js';

const T0 = performance.now();
window.__carga = [];
const marcaCarga = (k) => window.__carga.push([k, Math.round(performance.now() - T0)]);
const E = await escena('ep3-centro', 'ep03');
const M = (k, d) => E.marca(k, d);
const m = {
  pr: M('pregunta', 1.5), prF: M('pregunta_fin', 5.059), se: M('sesenta', 5.758), seF: M('sesenta_fin', 10.633),
  me: M('medio', 11.183), meF: M('medio_fin', 14.167), pe: M('pelo', 14.842), peF: M('pelo_fin', 16.099),
  mp: M('mismopelo', 18.119), mpF: M('mismopelo_fin', 24.296),
};
const D = E.duracion, QUIETO = D - 0.6;
const W = 1920, H = 1080;
const fr = (a, b, u) => a + (b - a) * u;
const seco = (u) => 1 - Math.pow(1 - cl(u), 4);
const FIN_U = FINAL_UNIVERSO;

// ---------------------------------------------------------------- tiempos (todo sale de las marcas)
const T = {
  // frase 85: tras la cartela (fuera a 1,2 s) la niebla se abre y la cámara se aleja; la regla se comprime
  abre: [1.22, 3.0], aleja: [1.22, 3.35], entera: [1.3, 3.05], busca: 3.1,
  // frase 86: corte al plano medio; la cámara sube por la regla y las marcas se encienden una a una
  B: m.se - 0.2, sube: [m.se - 0.2, m.seF + 0.3], rango: [m.se - 0.05, m.seF - 0.15],
  // frase 87: corte al general; las marcas se apagan; la flecha baja a 0 («no eres tú»), se para y cae cuatro saltos
  C: m.me - 0.2, apaga: [m.me - 0.2, m.me + 0.45], baja: [m.me - 0.1, fr(m.me, m.meF, 0.41)],
  senala: [m.me + 0.05, m.me + 0.6], cae0: fr(m.me, m.meF, 0.55),
  // frase 88: la mirilla del pelo (completa en la marca), brilla y crece hasta llenar la pantalla; después, silencio
  mir: [m.pe - 0.3, m.pe], brilla: [m.pe - 0.12, m.pe + 0.35], crece: [m.pe + 0.3, m.peF],
  // frase 89: la cámara se aleja del pelo hasta el ojo del gancho; la franja se estrecha hasta el pelo; el ojo se cierra
  vuelve: [m.mp - 0.25, m.mp + 1.3],
  estrecha: [fr(m.mp, m.mpF, 0.3), fr(m.mp, m.mpF, 0.66)],
  cierra: [fr(m.mp, m.mpF, 0.78), fr(m.mp, m.mpF, 0.93)],
};
const plano = (ts) => (ts < T.B ? 'A' : ts < T.C ? 'B' : ts < T.mir[0] ? 'C' : ts < T.vuelve[0] ? 'M' : 'O');

// ---------------------------------------------------------------- el plató
const I = { REG: 0, FLE: 1, OJO: 2, FR: 3, COSA: 4, HUM: 5, TRO: 6 };
const UO = uniformesOjo();
const P = await crearPlato({
  piezas: ['reglaA', 'flecha', 'ojo', 'franja', 'cosa', 'humano', 'tronco'],
  tiposExtra: tiposOjo({ cosas: ['celula', 'atomo', 'galaxia'] }),
  uniformes: { ...UO },
  alfa: true, post: false, cartela: E.cartela,
  sombraFondo: ['p0', 'p5', 'p6'],
  camara: { pos: [0, 3.8, 15.5], mira: [0, 2.3, 0], fov: 28, desenfoque: 44 },
});
marcaCarga('plato');
const POST = crearPost();
const en = (sx, sy, z) => P.punto(sx, sy, z);
const pant = (p) => P.proyectar(p);
const pxU = (p) => { const a = pant(p), b = pant([p[0] + 1, p[1], p[2]]); return Math.hypot(b[0] - a[0], b[1] - a[1]); };

// ---------------------------------------------------------------- capas: el lienzo de WebGL (oculto) y uno 2D encima
const cont = document.getElementById('escena');
const lienzoGL = P.renderer.domElement;
lienzoGL.style.visibility = 'hidden';
const capa = document.createElement('canvas');
capa.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;display:block;z-index:3';
cont.appendChild(capa);
const g = capa.getContext('2d');
let KD = 1;
function ajustarCapa() {
  if (capa.width !== lienzoGL.width || capa.height !== lienzoGL.height) { capa.width = lienzoGL.width; capa.height = lienzoGL.height; }
  KD = capa.width / W; g.setTransform(KD, 0, 0, KD, 0, 0);
}
function lienzo2D() {
  const c = document.createElement('canvas'); c.width = lienzoGL.width; c.height = lienzoGL.height;
  const x = c.getContext('2d'); x.setTransform(c.width / W, 0, 0, c.width / W, 0, 0);
  return [c, x];
}
const copiaGL = () => { const [c, x] = lienzo2D(); x.drawImage(lienzoGL, 0, 0, W, H); return c; };
function pegarGL(alfa = 1) { g.save(); g.globalAlpha = alfa; g.drawImage(lienzoGL, 0, 0, W, H); g.restore(); }
// la foto f escalada s veces alrededor de p, que va a parar a q
function fotoEscalada(gx, f, s, p, q = p, alfa = 1) {
  if (!f || alfa <= 0.001) return;
  gx.save(); gx.globalAlpha *= alfa; gx.translate(q[0], q[1]); gx.scale(s, s); gx.translate(-p[0], -p[1]);
  gx.drawImage(f, 0, 0, W, H); gx.restore();
}
const cielo = crearCielo();
marcaCarga('cielo');

// ---------------------------------------------------------------- la persona (en el sitio de las pruebas, mirando la regla)
const E_PER = 2.4, PER = [en(612, 600, 0.6)[0], E_PER, 0.6];
const MIRA = { cabeza: [0.25, 0.05, 0], mirada: [0.7, 0.2] };
function persona(ts, R, k = 0) {
  return P.pieza(I.HUM, { pos: PER, escala: E_PER, rot: [0, 0.2, 0], postura: MIRA, t: ts, huellaFija: [0.37, 0.21, 0],
    apuntar: k > 0.001 && R?.flecha ? { izq: R.flecha, peso: k } : null });
}

// ---------------------------------------------------------------- la regla (la de FINAL_UNIVERSO, que pasa a entera)
const REG_POS = en(...FIN_U.regla.pos), REG_ESC = FIN_U.regla.escala, REG_ROT = FIN_U.regla.rot;
const LUPA_E = 1.3;
const BASE_R = { pieza: I.REG, flecha: I.FLE, rot: REG_ROT, e: 27, ya: 0, lupaEntera: LUPA_E };
// la flecha arriba, buscando: baja un par de filas y vuelve (dos veces) y queda en +27 al cortar
function flechaA(ts) {
  const k = ss(T.busca, T.busca + 0.4, ts), v = Math.max(0, ts - T.busca);
  return 27 - 2.4 * k * (0.5 - 0.5 * Math.cos((2 * Math.PI * v) / ((T.B - 0.1 - T.busca) / 2)));
}
// la flecha del general: de +27 a 0 (la persona), un instante quieta, y cuatro saltos secos a −4
function flechaC(ts) {
  let v = mix(27, 0, eio(prog(ts, T.baja[0], T.baja[1])));
  for (let k = 0; k < 4; k++) v -= seco(prog(ts, T.cae0 + k * 0.32, T.cae0 + k * 0.32 + 0.25));
  return v;
}
const OP_FIN = { ...BASE_R, pos: REG_POS, escala: REG_ESC, entera: 1, actual: -4, marca: -4, lupa: 0.3 };
function opA(ts) {
  const u = eio(prog(ts, T.entera[0], T.entera[1])), f = flechaA(ts);
  return { ...BASE_R, pos: REG_POS, escala: REG_ESC, entera: u, actual: f, marca: f, lupa: mix(FIN_U.regla.lupa, 0.3, u), toque: u > 0 && u < 1 };
}
// el plano medio (un recorte 2D del render, como dice la producción): dos fotos de la regla entera 1,35 veces más grande
// que en el general, entera en el cuadro y centrada en (XP, 540), una con las marcas apagadas y otra con todas encendidas
// (rango de −35 a +27), amplidas ZB veces (en total, 2,1 veces la regla del general). La cámara sube: el punto local de la
// regla que queda en el centro de la pantalla va de −0,62 (abajo, la niebla de Planck) a +0,62 (arriba, la red); las marcas
// se encienden una a una: la foto encendida se ve por debajo de la última marca encendida
const K_P = 1.35, ZB = 2.1 / K_P, XP = 1150;
const PXL = REG_ESC * K_P * pxU(en(XP, 540, REG_POS[2]));    // px de la foto por unidad local de la regla
const subeB = (ts) => eio(prog(ts, T.sube[0], T.sube[1]));
const opFotoB = (lit) => ({ ...BASE_R, pos: en(XP, 540, REG_POS[2]), escala: REG_ESC * K_P, entera: 1, actual: 27, marca: 27, lupa: 0.3,
  escalaFlecha: 0.8 * K_P, separacion: 0.36 * K_P, rango: lit ? { de: -35, a: 27, marcas: 1, madera: 0.35 } : null });
const FILA_B = (() => { const R = P.regla(opFotoB(0)); P.limpiar(); return (e) => pant(R.punto(e))[1]; })();
function opC(ts) {
  const f = flechaC(ts), ap = 1 - ss(T.apaga[0], T.apaga[1], ts);
  return { ...BASE_R, pos: REG_POS, escala: REG_ESC, entera: 1, actual: f, marca: f, lupa: 0.3,
    rango: ap > 0.002 ? { de: -35, a: 27, marcas: ap, madera: 0.35 * ap } : null, toque: ts > T.cae0 - 0.05 && ts < T.cae0 + 1.3 };
}

// ---------------------------------------------------------------- Atom (presentador: pequeño, abajo a la izquierda)
// el mismo cálculo que ep3-borde; empieza con el giro y la fase de los electrones con que acaba ep3-borde (que a su vez
// empezó donde acabó ep3-universo): se calculan con sus marcas
const A_Z = 1.0, ATOMO = FIN_U.atomo;
const A_ESC = 180 / (2 * (1.68 + 0.16) * pxU(en(...ATOMO, A_Z)));
const CAM = [0, 3.8, 15.5];
const gy = (p) => Math.atan2(CAM[0] - p[0], CAM[2] - p[2]), gp = (p) => Math.atan2(p[1] - CAM[1], Math.hypot(CAM[0] - p[0], CAM[2] - p[2]));
const A_REF = en(850, 330, A_Z);
const giroHacia = (sx, sy) => { const w = en(sx, sy, A_Z); return [gy(w) - gy(A_REF), gp(w) - gp(A_REF)]; };
function calma(t, t1 = QUIETO, d = 0.9) { const a = t1 - d; if (t <= a) return t; const u = Math.min(t - a, d); return a + u - (u * u) / (2 * d); }
const DT = 1 / 240;
function integra(vel, hasta) {
  const A = [0];
  for (let i = 1; i * DT <= hasta + 0.2; i++) A.push(A[i - 1] + vel((i - 0.5) * DT) * DT);
  return (t) => { const x = t / DT, j = Math.min(A.length - 2, Math.floor(x)); return mix(A[j], A[j + 1], x - j); };
}
let BORDE_N = 249;   // el último fotograma de ep3-borde (n a 12 fps): la paridad de su foto de la niebla
const RELOJ = await (async () => {
  try {
    const j = await (await fetch('/atomo/plato/escenas/marcas-ep03.json')).json();
    const u = j['ep3-universo'], b = j['ep3-borde'];
    // ep3-universo, en su final (el PREVIO de ep3-borde)
    const Qu = u.duracion - 0.6, es = u.marcas.espera, co = u.marcas.comopuede;
    const vu = (t) => (1 + 0.9 * Math.exp(-Math.pow((t - es) / 0.4, 2)) + 0.6 * Math.exp(-Math.pow((t - co) / 0.5, 2))) * (1 - eio(prog(t, Qu - 0.9, Qu)));
    const Au = integra(vu, u.duracion);
    const previo = { tz: Qu - 0.45, ta: Au(Qu) };
    // ep3-borde, en su final
    const Qb = b.duracion - 0.6, c = b.marcas.carrera, cF = b.marcas.carrera_fin, golpe = c + 0.42 * (cF - c);
    const vb = (t) => ss(0, 0.45, t) * (1 + 0.5 * Math.exp(-Math.pow((t - golpe) / 0.4, 2))) * (1 - eio(prog(t, Qb - 0.9, Qb)));
    const Ab = integra(vb, b.duracion);
    BORDE_N = Math.floor(Qb * 12 + 1e-6);
    return { tz: previo.tz + (Qb - 0.45), ta: previo.ta + Ab(Qb) };
  } catch { return { tz: 42.889, ta: 46.0 }; }
})();
const velA = (t) => ss(0, 0.45, t) * (1 - eio(prog(t, QUIETO - 0.9, QUIETO)));
const tAtomo = integra(velA, D);
const MARCAS = [m.pr, m.se, m.me, m.pe, m.mp];
function atomo(ts) {
  const tz = RELOJ.tz + calma(ts), ta = RELOJ.ta + tAtomo(ts);
  const sx = ATOMO[0], sy = ATOMO[1] + 3 * Math.sin(tz * 1.3) + 2 * Math.sin(tz * 0.7 + 1.0);
  const brillo = Math.max(...MARCAS.map((t0) => Math.sin(Math.PI * prog(ts, t0 - 0.15, t0 + 0.6))));
  const en0 = ts < QUIETO ? E.energia(ts) : 0;
  const [dy, dp] = giroHacia(sx, sy);
  P.atomo({
    pos: en(sx, sy, A_Z), escala: A_ESC, yaw: -0.15 + dy + 0.08 * Math.sin(tz * 0.5), pitch: 0.06 - dp,
    energia: Math.min(1, en0 + 0.45 * brillo), ts: ta, halo: 1, velo: 0.1,
  });
}
// la sombra blanda detrás de Atom sobre la niebla clara (la de ep3-borde)
const SOMBRA_NIEBLA = { x: 230, y: 780, r0: 40, r1: 200, color: '10,7,8', alfa: 0.72 };
function sombraAtom(gx, s, k) {
  if (k <= 0.002) return;
  const gr = gx.createRadialGradient(s.x, s.y, s.r0, s.x, s.y, s.r1);
  gr.addColorStop(0, `rgba(${s.color},${s.alfa * k})`); gr.addColorStop(1, `rgba(${s.color},0)`);
  gx.fillStyle = gr; gx.fillRect(s.x - s.r1 - 10, s.y - s.r1 - 10, 2 * s.r1 + 20, 2 * s.r1 + 20);
}

// ---------------------------------------------------------------- la niebla (la de ep3-borde) y cómo se abre
const NIEBLA_FIN = { escala: 260, centro: [960, 540], luz: 1, velo: 1 };
const C_ABRE = [940, 500], ABRE_MAX = 1500;
const abreEn = (ts) => eio(prog(ts, T.abre[0], T.abre[1]));
// lo que tapa la niebla en el sitio de Atom (para su sombra)
const kNieblaAtom = (ts) => 1 - ss(0, 1, (ABRE_MAX * abreEn(ts) - (Math.hypot(ATOMO[0] - C_ABRE[0], ATOMO[1] - C_ABRE[1]) - 160)) / 260);

// ---------------------------------------------------------------- el pelo (la foto del nivel 4 de prueba-plastilina-adulta)
const E_TRO = 2.15, TRO = (() => { const a = en(900, 540, -0.4); return [a[0], 1.4 * E_TRO, -0.4]; })();
const HC = [pant([TRO[0], 0, TRO[2]])[0], 540];                  // el eje del pelo en la foto (px)
const R_PEL = E_TRO * pxU([TRO[0], 2.3, TRO[2]]);                 // su radio en la foto (px)
const R_FULL = 1260;                                              // la mirilla que llena la pantalla
const MIR0 = { r: 125 };                                          // la mirilla junto a −4, al abrirse
// la foto del pelo dentro de una mirilla de radio r: escalada lo justo para cubrirla de arriba abajo sin llegar a la base
// del pelo (que está en el suelo del plató), con el punto SRC0 de la foto en el centro; a pantalla completa, tal cual
const SRC0 = [HC[0], 400];
const TIRA = { y0: 140, y1: 700 };
const scFoto = (r) => Math.min(1, 1.35 * r / 540);
// al alejarse hacia el ojo, en la mirilla pequeña (r < 400) el pelo es un hilo que la cruza de arriba abajo: la foto se
// funde con «la tira» (el tramo del pelo sin la base, repetido hacia arriba y hacia abajo, sobre el color del fondo de la
// foto) y por debajo de r 200 el pelo encoge menos que la mirilla (en la cuenta del final, un hilo de ~44 px en 100 px)
const scPelo = (r) => (r >= 200 ? scFoto(r) : mix(0.075, 0.5, cl((r - 50) / 150)));
const kTira = (r) => 1 - ss(200, 400, r);
// el ojo del gancho (encuadreHola) y la cuenta del pelo en el centro de su franja
const EH = encuadreHola(P);
const CF = [960, Math.round(EH.franja.y)];
const R_PELO = 50;
const SC_FIN = scPelo(R_PELO);
const SX_FIN = (1.9 * R_PELO) / (2 * HOLA.FRANJA.largoPx);          // la franja, reducida a la cuenta del pelo (tras ella)
const CERRADO = { arriba: 1, abajo: 1 };

// la mirilla del pelo: centro c, radio r; la foto del pelo escalada sc con su punto src en c; brillo (0…1)
function mirillaPelo(gx, c, r, sc, src, brillo, { sombra = 1, aro = 1, tira = false } = {}) {
  if (r <= 1) return;
  if (sombra > 0.01 && r < 900) {
    gx.save(); gx.shadowColor = `rgba(0,0,0,${0.7 * sombra})`; gx.shadowBlur = 40; gx.fillStyle = '#0b0c0f';

}
