<title>El perro blanco · ep35</title>

<body>
<canvas id="lienzo"></canvas>
<script type="module">
// JM-PERRO (frase 6), 1979. Cinco planos:
// 1. el despacho del editor en Boston: el autor entra y se queda esperando, inquieto; Lisa le tiende un dibujo al editor
// por encima de la mesa (la hoja va al lado, hacia la mesa: nunca le tapa la cara) y saca otro de la carpeta; él lo
// levanta a la luz, se asombra y el autor da un paso, ya sonriendo;
// 2. la mesa desde arriba: los dibujos salen de la carpeta, el brazo del editor entra en diagonal por el borde de abajo
// (el hombro, fuera de cuadro; ≤45 px a la vista), coge la pluma por el medio, la tiende y da dos golpecitos con ella en
// la hoja en blanco; la mano del autor la coge y se pone a escribir (rayas);  3. NUESTRA lámina del libro de 1979: el
// viento barre unas hojas por el césped, el perro blanco entra, se sienta y echa a correr; el niño lo persigue, el perro
// frena en seco (polvo), se vuelve y escapa; todo ello recortado al hueco de la lámina (al final se repinta el margen
// de la página: nada pisa el papel blanco);  4. la verja: el perro se sienta, se cuela entre los barrotes y el niño llega
// tarde y sacude la verja;  5. gag 2: nieva en la lámina del tren; una mano entra por la derecha con la lupa cogida por el
// mango y busca por las páginas; la otra, con el lápiz rojo (el de la mesa ya no está: lo lleva ella), traza un cerco
// alrededor del perrito escondido en la esquina de cada lámina (rayitas de ladrido al cerrarse cada cerco); a los dos
// de abajo los encuentra antes la lupa, que se aparta para que el lápiz los cerque; al final ladran los cuatro.
import * as T from '/atomo/plato/escenas/jm-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('jm-perro');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const e = (f) => en('editor', f), P = T.PIEZAS_JM;
const P2 = e(0.166), P3 = e(0.397), P4 = e(0.642), P5 = e(0.8265);
const K = hex('#1a1420'), suave = (u) => u * u * (3 - 2 * u);
const hh = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };

// 1 · el despacho: el editor mira un dibujo
const pasa = 0.9, sacaOtro = 2.15, ve = e(0.113), asombro = e(0.137);
const p1 = (t) => {
  const o = { encuadre: 'despacho' }; T.editorial(R, t, o);
  const u = suave(tramo(t, pasa, pasa + 0.9)), enMano = u >= 1, otro = suave(tramo(t, sacaOtro, sacaOtro + 0.5));   // otro: el segundo dibujo que Lisa saca de la carpeta
  // el autor entra, espera cambiando el peso de pie y, con el asombro del editor, da un paso adelante
  const ent = suave(tramo(t, 0.05, 0.85)), paso = suave(tramo(t, asombro + 0.25, asombro + 0.7)), espera = ent >= 1 && t < ve;
  R.actor(EL.vanallsburg, Math.round(lerp(60, 84, ent) + paso * 9) + (espera && Math.sin(t * 4.5) > 0.6 ? 1 : 0), 158, t, { dir: 1, anda: (ent > 0 && ent < 1) || (paso > 0 && paso < 1), sonrisa: t > asombro + 0.3, triste: espera, sorpresa: t > asombro && t < asombro + 0.3 });
  const lor = R.actor(EL.lorraine, 206, 144, t, { dir: -1, sostiene: enMano ? [199, Math.round(lerp(126, 120, tramo(t, ve - 0.3, ve)))] : u > 0.5 ? [198, 128] : undefined, sorpresa: t > asombro && t < asombro + 0.5, sonrisa: t > asombro + 0.5, habla: t < pasa && Math.sin(t * 8) > 0 });
  P.carpeta(R, 142, 158, {});
  const lisa = R.actor(EL.lisa, 122, 158, t, { dir: 1, sostiene: u < 1 ? [Math.round(lerp(140, 152, u)), Math.round(lerp(140, 128, u))] : otro > 0 ? [141, Math.round(lerp(152, 145, otro))] : undefined, sonrisa: true, habla: t > pasa + 1 && t < ve && Math.sin(t * 7) > 0 });
  if (!enMano) P.dibujo(R, lisa.mano[0] + 18 + Math.round(u * 26),   // la hoja, al lado (hacia la mesa): no le tapa la cara
     lisa.mano[1] + 6 - Math.round(Math.sin(u * Math.PI) * 6), { tema: 'salon' });
  else if (otro > 0) P.dibujo(R, lisa.mano[0] + 16, lisa.mano[1] + 12, { tema: 'seto' });
  T.editorialDelante(R, t, o);
  if (enMano) { P.dibujo(R, lor.mano[0] - 12, lor.mano[1] + 9, { tema: 'salon' }); if (t > asombro && t < asombro + 0.9) R.icono('!', 214, 104 - Math.round(Math.abs(Math.sin(t * 7)) * 2), hex('#ffe08a')); }
};

// 2 · la mesa: la pluma cambia de mano
const coge = e(0.2115) + 0.5, ofrece = e(0.282), toma = e(0.31) + 0.3, escribe = e(0.352);
const p2 = (t) => {
  const of = suave(tramo(t, coge, ofrece)), es = tramo(t, escribe, P3 - 0.05), lin = Math.min(2, Math.floor(es * 3)), fl = es * 3 - lin;
  const tip = es > 0 ? [Math.round(178 + (es >= 1 ? 1 : fl) * 40), Math.round(155 + lin * 6 + Math.sin(t * 22) * 1.2)] : [Math.round(lerp(lerp(262, 204, of), 178, suave(tramo(t, toma + 0.15, escribe)))), Math.round(lerp(lerp(150, 160, of), 155, suave(tramo(t, toma + 0.15, escribe))))];
  T.editorial(R, t, { encuadre: 'despacho', camara: 'mesa', dibujos: 2 + 3 * tramo(t, P2 + 0.1, e(0.2115) + 0.3), pluma: [400, 150] });
  // la hoja en blanco que le pone delante, y las rayas que escribe (onduladas: nada de letras)
  for (let j = 0; j < 30; j++) for (let i = 0; i < 62; i++) if ((i + j) % 2) R.pset(172 + i, 149 + j, hex('#141a14'));
  R.rect(167, 145, 229, 175, K); R.rect(168, 146, 228, 174, hex('#f6f2e6')); R.rect(168, 173, 228, 174, hex('#d8d2c0')); R.rect(227, 146, 228, 174, hex('#d8d2c0')); R.poligono([[222, 146], [228, 146], [228, 152]], hex('#c8c0aa')); R.linea(222, 146, 228, 152, K); R.rect(172, 150, 196, 150, hex('#c8c0aa')); R.rect(170, 146, 171, 152, hex('#9a9aa6'));
  for (let k = 0; k <= lin && es > 0; k++) { const w = k < lin || es >= 1 ? 40 : fl * 40; for (let i = 0; i < w; i++) { const y = 155 + k * 6 + Math.round(Math.sin(i * 0.9 + k) * 1.3); R.pset(178 + i, y, hex('#22306a')); if (i % 9 === 8) R.pset(178 + i, y, hex('#f6f2e6')); } }
  const pl = (x, y) => { R.linea(x + 3, y + 1, x + 25, y - 17, hex('#2a1a10')); for (let w = -1; w <= 1; w++) R.linea(x + 4 + w, y - 4 + w, x + 22 + w, y - 22 + w, w < 0 ? hex('#5a6ab0') : w ? hex('#141a3a') : hex('#2e3e84')); R.linea(x + 14, y - 15, x + 16, y - 13, hex('#e8c860')); R.linea(x + 18, y - 21, x + 24, y - 23, hex('#e8c860')); R.linea(x, y, x + 4, y - 4, hex('#e8c860')); R.linea(x + 1, y, x + 4, y - 3, hex('#c8a040')); R.pset(x, y, K); };
  if (es <= 0 && t > ofrece && t < ofrece + 0.5) tip[1] -= Math.round(Math.abs(Math.sin((t - ofrece - 0.1) * Math.PI * 5)) * 4);   // dos golpecitos: «escríbelo tú»
  pl(tip[0], tip[1]);
  if (of > 0.3 && t < toma) { const c2 = hex('#fff8c0'), sx = tip[0] + 25, sy = tip[1] - 25, r = Math.floor(t * 6) % 2 ? 3 : 2; for (let d = -r; d <= r; d++) { R.pset(sx + d, sy, c2); R.pset(sx, sy + d, c2); } }
  const ed = suave(tramo(t, coge - 0.8, coge)) - suave(tramo(t, toma + 0.15, toma + 0.8));   // la mano del editor entra, ofrece y se va
  // coge la pluma por el medio y entra en diagonal por el borde de abajo: el hombro queda fuera de cuadro (y = 188)
  if (ed > 0) { const wx = tip[0] + 17 + Math.round((1 - ed) * 28), wy = tip[1] - 10 + Math.round((1 - ed) * 46), L = (188 - wy) / 0.906; T.brazo(R, Math.round(wx + L * 0.423), 188, wx, wy, '#8a6a48', -1, { codo: [Math.round(wx + L * 0.21 + 3), Math.round(wy + L * 0.453 - 2)] }); }
  const au = suave(tramo(t, toma - 0.6, toma + 0.1));   // la mano del autor
  if (au > 0) { const wx = tip[0] - 12 - Math.round((1 - au) * 26), wy = tip[1] - 9 + Math.round((1 - au) * 36); T.brazo(R, wx - 30, wy + 42, wx, wy, '#2e5a3e', 1, { codo: [wx - 22, wy + 14] }); }
};

// 3 · la lámina de 1979: el niño persigue al perro
const corre = e(0.502), para = e(0.575), mira = e(0.612);
const perroX = (t) => t < corre ? lerp(-14, 92, suave(tramo(t, P3, P3 + 1.2))) : t < mira ? lerp(92, 204, suave(tramo(t, corre, para))) : lerp(204, 330, tramo(t, mira, P4) ** 1.4);
let margen = null;   // la página sin perro ni niño: de aquí sale el margen que se repinta al final
const p3 = (t) => {
  if (!margen) { margen = R.nuevo(); const prev = R.usar(margen), o0 = { encuadre: 'libro1979' }; T.editorial(R, 0, o0); T.editorialDelante(R, 0, o0); R.usar(prev); }
  const dx = Math.round(perroX(t)), va = t < P3 + 1.2 || (t > corre && t < para) || t > mira, bote = va ? Math.round(Math.abs(Math.sin(t * 15)) * 2) : 0;
  const o = { encuadre: 'libro1979', perro: [dx, 140 - bote], perroDir: t >= para && t < mira ? -1 : 1, perroSentado: t > P3 + 1.3 && t < corre - 0.15 };
  T.editorial(R, t, o);
  // una racha de viento barre unas hojas por el césped de la lámina (en grises, como el grabado)
  { const w = tramo(t, P3 + 0.1, P3 + 2.1); if (w > 0 && w < 1) for (let k = 0; k < 6; k++) { const z = w * 1.4 - k * 0.075; if (z <= 0 || z >= 1) continue; const x = Math.round(lerp(14, 302, z) + Math.sin(z * 9 + k) * 5), y = Math.round(145 + (k * 7) % 5 - Math.abs(Math.sin(z * 10 + k * 2)) * 4), g = Math.floor(t * 9 + k) % 2, c1 = hex('#1e1e26'), c2 = hex('#4a4a52');
    if (g) { R.rect(x, y, x + 4, y + 1, c1); R.rect(x + 1, y - 1, x + 3, y + 2, c1); R.rect(x + 1, y, x + 3, y, c2); R.pset(x + 5, y + 1, c1); } else { R.rect(x + 1, y - 1, x + 2, y + 3, c1); R.rect(x, y, x + 3, y + 2, c1); R.rect(x + 1, y, x + 2, y + 1, c2); R.pset(x + 2, y + 4, c1); }
    R.pset(x + 1, y - 2, hex('#fafaf6')); R.pset(x - 2, y + 1, hex('#8a8a92')); R.pset(x - 4, y + 1, hex('#b8b8c0')); } }
  // la frenada del perro: una nube de polvo por delante
  { const f = tramo(t, para - 0.05, para + 0.45); if (f > 0 && f < 1) for (let k = 0; k < 5; k++) { const x = dx + 10 + Math.round(f * (4 + k * 3)), y = 139 - Math.round(f * (1 + k * 1.6)) - (k % 2), r = 1 + f * 1.6 * (1 - k / 7); R.disco(x, y, r + 1, hex('#8a8a92')); R.disco(x, y, r, f < 0.7 ? hex('#fafaf6') : hex('#d8d8d4')); } }
  if (va) for (let k = 1; k <= 3; k++) { const px = dx - 10 - k * 5, py = 139 - ((Math.floor(t * 9) + k) % 3); R.pset(px, py, hex('#e8e8e4')); R.pset(px + 1, py, hex('#b8b8c0')); }
  const u = tramo(t, corre - 0.5, P4), bx = Math.min(dx - 34, Math.round(lerp(-18, 214, u ** 0.9)));
  R.actor(EL.nino77 ?? EL.chico, bx, 141, t, { dir: 1, anda: u > 0, dedo: t > para && t < mira, sorpresa: t > para && t < mira });
  T.editorialDelante(R, t, o);
  // el niño, el perro, el polvo y las hojas viven dentro de la lámina: el margen de la página se repinta encima
  for (let y = 0; y < 180; y++) for (let x = 0; x < 16; x++) { const xx = x < 8 ? x : 304 + x; R.pset(xx, y, margen[y * 320 + xx]); }
};

// 4 · la verja: el perro se cuela
const sienta = e(0.70), cuela = e(0.744), dentro = e(0.765), llegaN = e(0.80);
const p4 = (t) => {
  const v = tramo(t, P4, sienta), c = suave(tramo(t, cuela, dentro + 0.5)), tras = t >= dentro;
  const dx = Math.round(t < cuela ? lerp(-12, 148, suave(v)) : lerp(148, 152, c)), dy = Math.round(t < cuela ? 158 : lerp(158, 143, c));
  const bote = (v > 0 && v < 1) || (t > cuela && c < 1) ? Math.round(Math.abs(Math.sin(t * 15)) * 2) : 0;
  const o = { encuadre: 'libro1979', camara: 'verja', abre: 0.25 + 0.6 * suave(tramo(t, cuela - 0.25, cuela + 0.3)) + (t > llegaN && t < llegaN + 0.5 ? Math.sin((t - llegaN) * 26) * 0.07 * (1 - tramo(t, llegaN, llegaN + 0.5)) : 0), perro: tras ? [dx, dy - bote] : undefined, perroDir: 1 };
  T.editorial(R, t, o);
  if (!tras) P.perro(R, dx, dy - bote, { t, dir: 1, sentado: t >= sienta && t < cuela - 0.1 });
  // los destellos del jardín del mago
  if (t > dentro) for (let k = 0; k < 6; k++) { const ph = (t * 1.3 + k * 0.37) % 1, sx = 126 + ((k * 37) % 68), sy = Math.round(120 - k * 9 - ph * 14); if (ph < 0.7) { const c2 = k % 2 ? hex('#fff8c0') : hex('#ffe08a'); R.pset(sx, sy, c2); if (ph > 0.15 && ph < 0.5) { R.pset(sx - 1, sy, c2); R.pset(sx + 1, sy, c2); R.pset(sx, sy - 1, c2); R.pset(sx, sy + 1, c2); } } }
  const u = tramo(t, cuela, llegaN), bx = Math.round(lerp(-18, 118, u));
  if (u > 0) R.actor(EL.nino77 ?? EL.chico, bx, 160, t, { dir: 1, anda: u < 1, sorpresa: u >= 1 && t < llegaN + 0.8, dedo: u >= 1 && t > llegaN + 0.3 });
  if (u >= 1 && t < llegaN + 1) R.icono('?', bx + 4, 122 - Math.round(Math.abs(Math.sin(t * 6)) * 2), hex('#ffe08a'));
  T.editorialDelante(R, t, o);
};

// 5 · gag 2: el perro escondido en todos los libros
const C = [e(0.902), e(0.922), e(0.955), e(0.985)], Q = [[73, 83], [223, 83], [130, 161], [166, 162]];
const S = [C[0] - 0.2, C[1], C[2] - 0.05, C[3]], TR = 0.25, DOS_PI = Math.PI * 2;   // cuándo empieza el lápiz cada cerco y lo que tarda en cerrarlo
const enCerco = (k, f) => [Q[k][0] + Math.cos(Math.PI * 0.75 + f * DOS_PI) * 8, Q[k][1] + Math.sin(Math.PI * 0.75 + f * DOS_PI) * 8];
const punta = (t) => {   // la punta del lápiz rojo: entra por abajo, traza cada cerco y salta al siguiente; al acabar se retira al hueco entre los dos libros de abajo
  let a = [34, 206], b = enCerco(0, 0), z = suave(tramo(t, P5 + 0.8, S[0]));
  for (let k = 0; k < 4; k++) if (t >= S[k]) { if (t < S[k] + TR) return enCerco(k, tramo(t, S[k], S[k] + TR)); a = enCerco(k, 1); if (k < 3) { b = enCerco(k + 1, 0); z = suave(tramo(t, S[k] + TR, S[k + 1])); } else { b = [158, 146 - Math.abs(Math.sin(t * 5)) * 1.5]; z = suave(tramo(t, S[3] + TR, S[3] + TR + 0.5)); } }
  return [lerp(a[0], b[0], z), lerp(a[1], b[1], z) - Math.sin(z * Math.PI) * 5];   // entre cerco y cerco, la mano se levanta un poco
};
const osc = (x, y, a = 0.3) => { if (x < 0 || x > 319 || y < 0 || y > 179) return; const c = R.pget(x, y), m = 1 - a; R.pset(x, y, (0xff000000 | (Math.round(((c >>> 16) & 255) * m) << 16) | (Math.round(((c >>> 8) & 255) * m) << 8) | Math.round((c & 255) * m)) >>> 0); };
const sombraMano = (x0, y0) => { for (let j = 0; j < 8; j++) for (let i = (j === 0 || j === 7 ? 2 : 0); i < (j === 0 || j === 7 ? 12 : 14); i++) osc(x0 + i + 2, y0 + j + 4); };   // la sombra de la mano canónica (14 × 8) sobre la mesa
const p5 = (t) => {
  const paradas = [[P5, [346, 153]], [P5 + 0.7, [236, 150]], [C[0], [216, 148]], [C[1], Q[2]], [C[1] + 0.33, Q[2]], [C[2] - 0.08, Q[3]], [C[3] - 0.25, Q[3]], [C[3] - 0.02, [203, 150]], [E.duracion, [211, 146]]];
  let lupa = paradas[0][1]; for (let k = 0; k < paradas.length - 1; k++) if (t >= paradas[k][0]) { const z = suave(tramo(t, paradas[k][0], paradas[k + 1][0])); lupa = [Math.round(lerp(paradas[k][1][0], paradas[k + 1][1][0], z)), Math.round(lerp(paradas[k][1][1], paradas[k + 1][1][1], z))]; }
  // los cercos ya cerrados los pinta el decorado (cuantos, entero); el que se está trazando, la escena, con el lápiz en la punta
  T.editorial(R, t, { encuadre: 'esquinas', cuantos: S.reduce((s, c) => s + (t >= c + TR ? 1 : 0), 0), lupa, radio: 15 });
  // el lápiz rojo ya no está con los otros dos: lo lleva la mano (se tapa con la madera de al lado)
  for (let y = 95; y <= 143; y++) for (let x = 299; x <= 305; x++) R.pset(x, y, R.pget(x + 7, y));
  // nieva en la lámina del tren y la locomotora echa vapor (fuera del cristal de la lupa)
  const fuera = (x, y) => Math.hypot(x - lupa[0], y - lupa[1]) > 19;
  for (let k = 0; k < 16; k++) { const x = 29 + Math.round(hh(k, 2) * 49 + Math.sin(t * 1.5 + k) * 2), y = 33 + Math.round((t * (9 + hh(k, 4) * 8) + hh(k, 6) * 54) % 54); if (x >= 29 && x <= 78 && fuera(x, y)) R.pset(x, y, hex('#ffffff')); }
  for (let k = 0; k < 4; k++) { const u = (t * 0.7 + k / 4) % 1, x = Math.round(52 - u * 12 + Math.sin(u * 5 + k) * 2), y = Math.round(56 - u * 14); if (y > 33 && x > 29 && fuera(x, y)) { R.pset(x, y, hex('#e8ecf4')); if (u > 0.3) R.pset(x + 1, y, hex('#c8d0e0')); if (u > 0.6) R.pset(x, y - 1, hex('#c8d0e0')); } }
  // al cerrarse cada cerco, tres rayitas de ladrido junto al perrito; al final ladran los cuatro, uno tras otro
  const ladra = (k, f) => { if (f <= 0 || f >= 1) return; const [qx, qy] = Q[k], d = k === 3 ? 1 : -1, r = 10 + Math.round(f * 4); for (const an of [-0.7, -0.15, 0.4]) { const ca = Math.cos(an) * d, sa = Math.sin(an); if (fuera(qx + ca * r, qy - 6 + sa * r)) R.linea(Math.round(qx + ca * r), Math.round(qy - 3 + sa * r), Math.round(qx + ca * (r + 3)), Math.round(qy - 3 + sa * (r + 3)), hex('#e83a34')); } };
  S.forEach((c, k) => { ladra(k, tramo(t, c + TR, c + TR + 0.45)); const fin = S[3] + TR + 0.55 + k * 0.14; ladra(k, tramo(t, fin, fin + 0.4)); if (t > fin + 0.6) ladra(k, ((t - fin) * 1.6) % 1 * 1.6); });
  // la mano que lleva la lupa: la coge por el mango, justo bajo el aro, con su sombra
  { const hx = lupa[0] + 20, hy = lupa[1] + 15; sombraMano(hx - 10, hy - 4); T.mano(R, hx, hy, -1, '#3a5a8a', { sinManga: true }); }
  // el trazo del cerco que se está cerrando
  const [px, py] = punta(t).map(Math.round), roj = hex('#e83a34');
  S.forEach((c, k) => { const f = tramo(t, c, c + TR); if (f <= 0 || t >= c + TR) return; for (let i = 0; i <= 48 * f; i++) { const [x, y] = enCerco(k, i / 48); R.pset(Math.round(x), Math.round(y), roj); } });
  // el lápiz rojo (la punta en el trazo, la goma hacia abajo) y la mano que lo lleva, con sus sombras en la mesa
  if (t > P5 + 0.8) {
    const cx = px - 17, cy = py + 24, hx = px - 13, hy = py + 5;
    for (let i = 0; i <= 24; i++) { const x = Math.round(lerp(px - 2, cx, i / 24)) + 3, y = py + 4 + Math.round(i * 20 / 24) + 3; osc(x, y); osc(x + 1, y); osc(x + 2, y); }
    sombraMano(hx - 3, hy - 4);
    for (let w = -2; w <= 2; w++) R.linea(px - 2 + w, py + 4, cx + w, cy, K);
