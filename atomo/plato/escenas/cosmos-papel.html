<canvas id="c"></canvas>
<script type="module">
// Segunda prueba de identidad · RECORTES DE PAPEL (stop-motion a 12 fps): de ti a la Vía Láctea.
// Guion: atomo/plato/prueba-identidad/ENCARGO-COSMOS.md. Kit: kits/papel-prueba.js (la persona sigue HUMANO.md).
//
// Una sola cámara que se aleja, como una cámara multiplano de teatro de papel:
//  · cada ×10 es un «golpe» de alejamiento: z = log10 del tamaño del cuadro (en metros), con anticipación
//    y rebote; la cinta de la regla corre con z y la banderita enseña la potencia actual en grande;
//  · hasta 10⁵ m la vista es lateral: la persona y lo de cada década (casa, barrio, pueblo, valle, sierra)
//    están sobre la línea del suelo a su tamaño real; detrás, capas lejanas de colinas y montañas con
//    paralaje (encogen menos, como en una cámara multiplano);
//  · la línea del suelo es el borde de una Tierra de radio real: se curva sola al alejarse; la cámara sube
//    y gira el globo (el sitio de la persona baja del borde a la cara) hasta la Tierra entera: de noche donde
//    vive la persona, con las luces de las ciudades, y de día hacia el Sol;
//  · luego pasa la Luna, entra el Sol enorme, las órbitas cosidas con hilo, el cinturón de Kuiper, la nube de
//    Oort, las estrellas vecinas, campos de estrellas y la galaxia en espiral, toda de papel recortado, con una
//    flecha de papel donde estamos.
// Lo grande va en «láminas» (lienzos en caché dibujados al cargar con K.aEscala) que solo se pegan escaladas:
// así cada fotograma cuesta poco en el servidor sin GPU. Atom cuelga de su hilo (tamaño constante) y late
// con la voz. Sin palabras.
import { escena } from '/atomo/plato/escena.js';
import * as K from '/atomo/plato/kits/papel-prueba.js';
const { C, seg, eio, ein, eout, eback, eiob, lerp, cl, PI, TAU, D2R } = K;

const E = await escena('cosmos-papel', 'cosmos');
await K.preparar();

// ---------------------------------------------------------------- tiempos (todo sale de las marcas)
const M = (n) => E.marca(n);
const m = {
  tu: M('tu'), arriba: M('arriba'), siete: M('siete'), desaparecido: M('desaparecido'), tierra: M('tierra'),
  dos: M('dos'), sol: M('sol'), doce: M('doce'), galaxia: M('galaxia'), lactea: M('lactea'),
};
const QUIETO = E.duracion - 0.6;              // desde aquí, imagen fija
// saltos ×10: [inicio, fin, z0, z1]
const SALTOS = [];
{ // siete: el 1.º empieza ~0,15 s antes de «Seven» y el 7.º acaba en «Earth»
  const t0 = m.siete - 0.25, dt = (m.tierra - t0) / 7, mov = Math.min(0.36, dt * 0.85);
  for (let k = 0; k < 7; k++) { const b = t0 + (k + 1) * dt; SALTOS.push([b - mov, b, k, k + 1]); }
}
{ // dos: de «Two» a «Sun»
  const a = m.dos - 0.22, d = (m.sol - a) / 2;
  for (let k = 0; k < 2; k++) SALTOS.push([a + k * d, a + (k + 1) * d, 7 + k, 8 + k]);
}
{ // doce: cada vez más seguidos; el último aterriza en «Milky»
  const a0 = m.doce - 0.25, ult = 0.22, tot = m.lactea - a0 - ult, r = 0.9, d0 = tot * (1 - r) / (1 - Math.pow(r, 11));
  let a = a0;
  for (let k = 0; k < 11; k++) { const d = d0 * Math.pow(r, k); SALTOS.push([a, a + d, 9 + k, 10 + k]); a += d; }
  SALTOS.push([a, m.lactea, 20, 21]);
}
function zEn(t) {
  let z = 0;
  for (const [a, b, z0, z1] of SALTOS) {
    if (t >= b) { z = z1; continue; }
    if (t > a) { const u = (t - a) / (b - a); return z0 + (z1 - z0) * (b - a > 0.2 ? eiob(u) : eio(u)); }
    break;
  }
  return z;
}
// reposo que se frena antes del final (balanceos)
function calma(t, t1 = QUIETO, d = 0.9) {
  const a = t1 - d; if (t <= a) return t;
  const u = Math.min(t - a, d); return a + u - (u * u) / (2 * d);
}
// fase de los electrones de Atom (integral de su velocidad: se paran al final)
const VEL = 0.42, DT = 1 / 240, FASE = [0];
for (let i = 1; i * DT <= E.duracion + 0.2; i++) FASE.push(FASE[i - 1] + TAU * VEL * (1 - eio(seg((i - 0.5) * DT, QUIETO - 0.9, QUIETO))) * DT);
const fase = (t) => { const x = t / DT, i = Math.min(FASE.length - 2, Math.floor(x)); return lerp(FASE[i], FASE[i + 1], x - i); };

// ---------------------------------------------------------------- escalas físicas
const PPM0 = K.HUMANO_H / 1.70;               // px por metro con z = 0: la persona mide 1,70 m
const ppm = (z) => PPM0 * Math.pow(10, -z);
const RT = 6.371e6, RSOL = 6.957e8, LUNA_D = 3.844e8, RLUNA = 1.737e6, UA = 1.496e11;
const D0 = 4;                                 // distancia de la cámara a la persona con z = 0 (paralaje)
const FOCAL = PPM0 * D0;
const sCapa = (z, d) => FOCAL / (D0 * Math.pow(10, z) + d);   // px por metro de una capa a profundidad d
const LUGAR = { lon: -3.7, lat: 40.4 };       // dónde vive la persona
const SOL3 = (() => { const v = [-0.9, -0.32, 0.3], l = Math.hypot(...v); return v.map((x) => x / l); })();   // luz del Sol (x der., y arriba, z hacia la cámara)

// ---------------------------------------------------------------- utilidades
const sstep = (u) => u * u * (3 - 2 * u);
function trazoPts(pts) { const p = new Path2D(); pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y))); return p; }
function raya(pts, col, w) { const c = K.g; c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.lineJoin = 'round'; c.stroke(trazoPts(pts)); }
/** interpolación cúbica monótona (Fritsch–Carlson) por los puntos (xs, ys) */
function curva(xs, ys) {
  const n = xs.length, d = [], ms = new Array(n).fill(0);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  ms[0] = d[0]; ms[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) ms[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { ms[i] = 0; ms[i + 1] = 0; continue; }
    const a = ms[i] / d[i], b = ms[i + 1] / d[i], h = a * a + b * b;
    if (h > 9) { const t = 3 / Math.sqrt(h); ms[i] = t * a * d[i]; ms[i + 1] = t * b * d[i]; }
  }
  return (x) => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], u = (x - xs[i]) / h, u2 = u * u, u3 = u2 * u;
    return (2 * u3 - 3 * u2 + 1) * ys[i] + (u3 - 2 * u2 + u) * h * ms[i] + (-2 * u3 + 3 * u2) * ys[i + 1] + (u3 - u2) * h * ms[i + 1];
  };
}
// destellos en caché (luces de ventanas, farolas, ciudades, estrellas)
function hazDestello(c0, c1, c2) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const c = cv.getContext('2d', { willReadFrequently: true }), gr = c.createRadialGradient(64, 64, 0, 64, 64, 64);   // en CPU, como todo el kit
  gr.addColorStop(0, c0); gr.addColorStop(0.18, c1); gr.addColorStop(0.5, c2); gr.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = gr; c.fillRect(0, 0, 128, 128); return cv;
}
const DESTELLO = hazDestello('rgba(255,226,160,1)', 'rgba(255,205,120,0.55)', 'rgba(255,190,100,0.14)');
const BRILLO_FRIO = hazDestello('rgba(255,250,235,1)', 'rgba(235,232,255,0.5)', 'rgba(210,215,255,0.1)');
function destello(x, y, r, a = 1, frio = false) {
  if (r < 0.4 || a <= 0) return;
  const c = K.g;
  c.globalAlpha = a; c.drawImage(frio ? BRILLO_FRIO : DESTELLO, x - r, y - r, 2 * r, 2 * r); c.globalAlpha = 1;
}
/**
 * Lámina en caché: dibuja fn (en unidades «nativas») en un lienzo a r px por unidad, con fibras, filos y
 * sombras a r (K.aEscala): pegada a 1 px de pantalla por unidad se ve como si se dibujara en directo.
 * caja: [x0, y0, x1, y1] en unidades nativas.
 */
function lamina(caja, r, fn, fib = r) {
  const [x0, y0, x1, y1] = caja, w = Math.ceil((x1 - x0) * r), h = Math.ceil((y1 - y0) * r);
  const cv = K.capa(() => { const c = K.g; c.translate(-x0 * r, -y0 * r); c.scale(r, r); K.aEscala(fib, () => fn(c)); }, w, h);
  return { cv, x0, y0, x1, y1, r, w, h };
}
/** pega la lámina con su origen nativo en (x, y) de pantalla a s px de pantalla por unidad; curvo: sigue el borde */
function pegarLamina(L, x, y, s, curvo = false) {
  const c = K.g, k = s / L.r, X0 = x + L.x0 * s, Y0 = y + L.y0 * s;
  if (Y0 > 1120 || Y0 + L.h * k < -40) return;
  const u0 = Math.max(0, Math.floor((-40 - X0) / k)), u1 = Math.min(L.w, Math.ceil((1960 - X0) / k));
  if (u1 <= u0) return;
  if (!curvo) { c.drawImage(L.cv, u0, 0, u1 - u0, L.h, X0 + u0 * k, Y0, (u1 - u0) * k, L.h * k); return; }
  const base = limbo(x), n = 14, du = (u1 - u0) / n;
  for (let i = 0; i < n; i++) {
    const a = u0 + i * du, w2 = Math.min(du + 1, L.w - a), xc = X0 + (a + du / 2) * k;
    c.drawImage(L.cv, a, 0, w2, L.h, X0 + a * k, Y0 + limbo(xc) - base, w2 * k, L.h * k);
  }
}

// =====================================================================================
// CÁMARA: todo depende de z (y de t solo para los pequeños movimientos)
// =====================================================================================
// sitio de la persona en pantalla (xp, yp) y giro del globo θ (el sitio baja del borde a la cara)
const zsT = [0, 1, 2, 3, 4, 5, 5.6, 6, 6.5, 7];
const fXp = curva(zsT, [600, 760, 800, 820, 820, 820, 820, 820, 820, 820]);
const fYp = curva(zsT, [905, 845, 830, 815, 800, 765, 735, 610, 440, 312]);
const fTh = curva(zsT, [0, 0, 0, 0, 0, 0, 3, 18, 31, 42]);
// centro de la Tierra entre 7 y 9 (deja sitio al Sol, que entra por la izquierda)
const fEx = curva([7, 8, 9], [820, 930, 1160]), fEy = curva([7, 8, 9], [520, 500, 470]);
// órbita de la Tierra (inclinada: elipse Q) y distancia Tierra–Sol «de teatro» hasta 10¹¹ m
const Q = 0.42, PHI_T = 18.5 * D2R;
const SEP9 = 675 / ppm(9);
const sepTS = (z) => Math.pow(10, lerp(Math.log10(SEP9), Math.log10(UA), sstep(seg(z, 9, 11))));
// Sol en pantalla desde 9; la galaxia, desde 19
const SOL9 = [fEx(9) - 675 * Math.cos(PHI_T), fEy(9) + 675 * Q * Math.sin(PHI_T)];
const fSx = curva([9, 10, 11, 19.2, 20.2, 21], [SOL9[0], 720, 820, 820, 895, 964]);
const fSy = curva([9, 10, 11, 19.2, 20.2, 21], [SOL9[1], 548, 540, 540, 583, 620]);
const DGAL = 175.6 / ppm(21);                 // del Sol al centro de la galaxia (dibujo)
const PSI0 = 35 * D2R;                        // ángulo del Sol en la galaxia (al final)
const giroGal = (z) => 0.35 * Math.min(2.2, Math.max(0, 21 - z));
function camara(z) {
  const k = { z, ppm: ppm(z), Rt: RT * ppm(z) };
  const sep = sepTS(z) * k.ppm, ox = sep * Math.cos(PHI_T), oy = -sep * Q * Math.sin(PHI_T);
  k.sepPx = sep;
  if (z <= 7) {
    k.xp = fXp(z); k.yp = fYp(z); k.th = fTh(z) * D2R;
    k.Ex = k.xp; k.Ey = k.yp + k.Rt * Math.cos(k.th); k.Sx = k.Ex - ox; k.Sy = k.Ey - oy;
  } else {
    k.th = 42 * D2R;
    if (z <= 9) { k.Ex = fEx(z); k.Ey = fEy(z); k.Sx = k.Ex - ox; k.Sy = k.Ey - oy; }
    else { k.Sx = fSx(z); k.Sy = fSy(z); k.Ex = k.Sx + ox; k.Ey = k.Sy + oy; }
    k.xp = k.Ex; k.yp = k.Ey - k.Rt * Math.cos(k.th);
  }
  k.top = k.yp - 2 * k.Rt * Math.sin(k.th / 2) ** 2;     // tope del borde, estable con R enorme
  k.giro = giroGal(z); k.psi = PSI0 + k.giro;
  const dg = DGAL * k.ppm; k.Gx = k.Sx - dg * Math.cos(k.psi); k.Gy = k.Sy - dg * Math.sin(k.psi);
  return k;
}
let CAM = camara(0);
/** y del borde de la Tierra (línea del suelo) en la x de pantalla xs */
function limbo(xs) {
  const R = CAM.Rt, dx = xs - CAM.Ex;
  if (Math.abs(dx) >= R) return CAM.Ey + 4000;
  return CAM.top + dx * dx / (R + Math.sqrt(R * R - dx * dx));
}
const curvado = () => CAM.Rt < 400000;        // la curvatura se nota (> 1 px) en el ancho del cuadro

// =====================================================================================
// FONDOS (capas fijas): cielo de noche y espacio profundo (galaxia vista desde fuera)
// =====================================================================================
const cieloNoche = K.capa(() => K.fondoNoche({ luz: [760, 470], semilla: 61, estrellas: 230, nubes: false, vineta: 0.5,
  evitar: [{ x0: 1560, y0: 90, x1: 1780, y1: 960 }] }));
const espacio = K.capa(() => {
  const c = K.g, full = new Path2D(); full.rect(0, 0, 1920, 1080); full.bb = [0, 0, 1920, 1080];
  K.papel(full, '#0a0e25', { d: 0, seed: 5, tb: 0.3, edge: 0, print: () => {
    const gr = c.createRadialGradient(820, 520, 100, 820, 520, 1300);
    gr.addColorStop(0, 'rgba(60,60,130,0.22)'); gr.addColorStop(1, 'rgba(0,0,10,0.5)');
    c.fillStyle = gr; c.fillRect(0, 0, 1920, 1080);
    const r = K.rng(808);
    for (let i = 0; i < 160; i++) { c.fillStyle = `rgba(235,225,255,${0.15 + r() * 0.35})`; c.beginPath(); c.arc(r() * 1920, r() * 1080, 0.5 + r() * 0.9, 0, TAU); c.fill(); }
  } });
  // galaxias lejanas: ovalitos de papel con núcleo
  const r = K.rng(809);
  let n = 0;
  for (let i = 0; i < 400 && n < 10; i++) {
    const x = 70 + r() * 1780, y = 70 + r() * 940, s = 9 + r() * 15, e = 0.3 + r() * 0.45, a = r() * PI, col = r() < 0.5 ? '#8f8fc4' : '#b9a7c9';
    if (Math.hypot(x - 820, y - 520) < 480 || (x > 1220 && y < 330) || (x > 1270 && y > 430 && y < 630) || x > 1530) continue;
    n++;
    c.save(); c.translate(x, y); c.rotate(a);
    destello(0, 0, s * 1.7, 0.35, true);
    K.papel(K.elipse(s, s * e, 810 + i, 0.03), col, { d: 1.2, seed: 811 + i, edge: 0.5, tb: 0.4 });
    K.papel(K.circulo(s * 0.28, 820 + i, 0.03), C.goldL, { d: 0.5, seed: 821 + i, edge: 0.3 });
    c.restore();
  }
});

// =====================================================================================
// CAPAS LEJANAS (paralaje): colinas con árboles, colinas, montañas nevadas. Láminas a la escala de z = 0.
// =====================================================================================
const ARBOL = (() => {   // abeto de papel de alto 100 (pie en 0,0)
  const tiers = [];
  for (let i = 0; i < 3; i++) { const w = 100 * (0.42 - i * 0.09), y1 = -18 - i * 24; tiers.push(K.poligono([[-w, y1], [w, y1], [w * 0.1, y1 - 42], [-w * 0.1, y1 - 42]])); }
  return { tronco: K.rect(-4, -25, 8, 28, 2), tiers };
})();
function abeto(x, y, h, col, seed) {
  const c = K.g; c.save(); c.translate(x, y); c.scale(h / 100, h / 100);
  K.papel(ARBOL.tronco, C.maderaD, { d: 1.4, seed, edge: 0.5 });
  ARBOL.tiers.forEach((p, i) => K.papel(p, col, { d: 2, seed: seed + i + 1, edge: 0.8 }));
  c.restore();
}
const CAPAS = (() => {
  const r = K.rng(4040), picos = [];
  for (let x = -70000; x < 70000;) { const w = 3500 + r() * 6000, h = 800 + r() * 1300; picos.push({ x: x + w / 2, h, w }); x += w * (0.55 + r() * 0.3); }
  const altM = (x) => { let h = 0; for (const p of picos) h = Math.max(h, p.h * (1 - Math.abs(x - p.x) / (p.w * 0.62))); return h + 40 * Math.sin(x * 0.002); };
  return [
    { d: 30000, col: '#1a2350', x: 70000, paso: 450, alt: altM, picos, z1: 5.25, seed: 4100 },
    { d: 2000, col: '#202c5c', x: 6000, paso: 60, alt: (x) => 55 + 32 * Math.sin(x * 0.0021 + 1) + 22 * Math.sin(x * 0.0057 + 2) + 10 * Math.sin(x * 0.017), z1: 4.3, seed: 4110 },
    { d: 150, col: C.hillA, x: 460, paso: 6, alt: (x) => 7.4 + 2.3 * Math.sin(x * 0.07 + 0.8) + 0.8 * Math.sin(x * 0.16 + 2.4), z1: 3.1, seed: 4120,
      arboles: [-61, -55, -46, -39, -34, -26, 48, 55, 63, 75, -120, -104, -96, 112, 126, 141, -170, -230, -245, 205, 260, 280, 330, -320, -380, 395]
        .map((x, i) => ({ x, h: 7 + ((i * 37) % 11) * 0.45 })) },
    { d: 40, col: C.hillB, x: 140, paso: 2, alt: (x) => 0.95 + 0.32 * Math.sin(x * 0.21 + 2.1) + 0.12 * Math.sin(x * 0.55), z1: 2.0, seed: 4130 },
  ].map((L) => {
    const s0 = sCapa(0, L.d), pts = [];
    let hmax = 0;
    for (let x = -L.x; x <= L.x; x += L.paso) { const h = L.alt(x); hmax = Math.max(hmax, h); pts.push([x * s0, -h * s0]); }
    const X = L.x * s0, techo = hmax * s0 + (L.arboles ? 12 * s0 : 0) + 30;
    pts.push([X, 70], [-X, 70]);
    L.s0 = s0;
    L.lam = lamina([-X - 30, -techo, X + 30, 90], 1, (c) => {
      K.papel(K.poligono(pts), L.col, { d: 4, seed: L.seed, sa: 0.6, print: () => {
        const gr = c.createLinearGradient(0, -hmax * s0, 0, 40);
        gr.addColorStop(0, 'rgba(255,240,215,0.10)'); gr.addColorStop(1, 'rgba(0,0,12,0.38)');
        c.fillStyle = gr; c.fillRect(-X - 40, -techo, 2 * X + 80, techo + 100);
      } });
      if (L.picos) for (const p of L.picos) {
        const xs = p.x * s0, hh = p.h * s0, ww = p.w * 0.62 * s0, k = 0.3, q = [[xs, -hh]];
        for (let i = 0; i <= 6; i++) { const u = i / 6; q.push([xs + ww * k * (1 - 2 * u), -hh * (1 - k) + (i % 2 ? -hh * 0.07 : hh * 0.03)]); }
        K.papel(K.poligono(q), '#8d96c2', { d: 1.2, seed: L.seed + 7, edge: 0.6 });
      }
      if (L.arboles) for (const a of L.arboles) abeto(a.x * s0, -L.alt(a.x) * s0 + 4 * s0, a.h * s0, C.tree, 310 + a.x);
    });
    return L;
  });
})();
function capaLejana(L, z) {
  if (z > L.z1) return;
  pegarLamina(L.lam, CAM.xp, limbo(CAM.xp), sCapa(z, L.d) / L.s0, curvado());
}

// =====================================================================================
// EL SUELO (cara de la Tierra vista de lado), LA ATMÓSFERA Y EL GLOBO
// =====================================================================================
// lámina del suelo en px de pantalla, con el borde en y = 0 y x relativa a la persona
const SUELO = lamina([-1100, -30, 1500, 760], 1, (c) => {
  const pts = [[-1100, 760]];
  for (let x = -1100; x <= 1500; x += 16) pts.push([x, 1.5 * Math.sin(x * 0.031 + 3)]);
  pts.push([1500, 760]);
  K.papel(K.poligono(pts), C.hillC, { d: 6, seed: 303, sa: 0.6, print: () => {
    const gr = c.createLinearGradient(0, -12, 0, 220);
    gr.addColorStop(0, 'rgba(255,240,215,0.10)'); gr.addColorStop(1, 'rgba(0,0,12,0.38)');
    c.fillStyle = gr; c.fillRect(-1110, -30, 2620, 800);
  } });
  const q = [[-1100, 760]];
  for (let x = -1100; x <= 1500; x += 24) q.push([x, 96 + 10 * Math.sin(x * 0.006 + 1) + 5 * Math.sin(x * 0.019)]);
  q.push([1500, 760]);
  K.papel(K.poligono(q), '#2f5f5a', { d: 7, seed: 304, sa: 0.6, print: () => {
    const gr = c.createLinearGradient(0, 80, 0, 300);
    gr.addColorStop(0, 'rgba(255,240,215,0.08)'); gr.addColorStop(1, 'rgba(0,0,12,0.45)');
    c.fillStyle = gr; c.fillRect(-1110, 60, 2620, 700);

  // bandera con la potencia actual, grande
  const n = Math.max(0, Math.min(21, Math.round(z)));
  const salto = SALTOS.find(([a, b]) => t > a && t < b + 0.04);
  c.save(); c.translate(xr - REGLA.w / 2 - 136 + 2, marcY); K.temblor(810, 0.4, 0.004);
  if (salto) { const v = Math.sin(PI * seg(t, salto[0], salto[1] + 0.04)); c.translate(-4 * v, -6 * v); }
  K.pegar(bandera(n), 0, 0);
  c.restore();
}
// Atom: junto al hombro; en «tu» se inclina hacia la persona; en «arriba» sube a su sitio
const ATOMO0 = [850, 330], ATOMO1 = [1340, 214];
function atomoEn(t) {
  const g1 = eback(seg(t, m.tu - 0.22, m.tu), 1.8) * (1 - eio(seg(t, m.tu + 0.3, m.tu + 0.7)));
  const up = eback(seg(t, m.arriba - 0.24, m.arriba + 0.14), 1.3);
  let x = lerp(ATOMO0[0] - 34 * g1, ATOMO1[0], up), y = lerp(ATOMO0[1] + 8 * g1, ATOMO1[1], up);
  y -= 70 * Math.sin(PI * seg(t, m.arriba - 0.24, m.arriba + 0.14));        // arco al subir
  return [x, y, g1, up];
}
function atomHUD(t) {
  const c = K.g, [x, y, g1] = atomoEn(t), e = t < QUIETO ? E.energia(t) : 0, tc = calma(t), ph = fase(t);
  let sway = 0.025 * Math.sin(TAU * 0.23 * tc) - 0.16 * g1;
  for (const [a, b] of SALTOS) if (t > a && t < b + 0.25) sway += 0.03 * Math.sin(PI * seg(t, a, b + 0.25)) * (b - a > 0.2 ? 1 : 0.5);
  const L = y + 20;
  K.hilo(x, -20, x + Math.sin(sway) * L * 0.15, y - 40 * 0.55, 0.8, 1.4);
  c.save(); c.translate(x + Math.sin(sway) * L * 0.15, y);
  const gr = c.createRadialGradient(0, 0, 30, 0, 0, 110); gr.addColorStop(0, 'rgba(8,10,30,0.32)'); gr.addColorStop(1, 'rgba(8,10,30,0)');
  c.fillStyle = gr; c.fillRect(-110, -110, 220, 220);   // halo oscuro: se lee sobre cualquier fondo
  K.atomo(0, 0, t, e, { escala: 0.55, hilo: false, fase: ph, balanceo: sway, id: 10 });
  c.restore();
}

// =====================================================================================
// COMPOSICIÓN
// =====================================================================================
function escenaEn(t) {
  const c = K.g, z = zEn(t);
  CAM = camara(z);
  c.drawImage(z < 19.8 ? cieloNoche : espacio, 0, 0);
  K.zoomFisico(() => {
    galaxia(z);
    campos(z);
    vecinas(z);
    confeti(z);
    orbitas(z, t);
    solEstrella(z);
    sol(z, t);
    luna(z);
    if (z < 9.6) {
      atmosfera(z);
      for (const L of CAPAS) capaLejana(L, z);
      dibujaDecadas(z);                       // detrás de la franja del suelo: quedan «plantadas» en él
      if (z < 4.55) suelo(); else if (CAM.Rt >= 40) globo(z, t);
      dibujaDecadas(z, true);                 // sus luces, delante
      personaMundo(z, t);
      aroTu(z, t);
    }
    tierraPunto(z);
    aquiEstamos(t);
  });
  regla(t, z);
  atomHUD(t);
}
K.fotograma(0, escenaEn);                      // calienta cachés (marco, trazos) al cargar: t = 0 ya queda dibujado
E.iniciar((t) => K.fotograma(Math.min(t, QUIETO), escenaEn), { paso: 1 / 12 });
</script>
