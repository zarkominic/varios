<script type="module">
// NC-CUOTA (frase 9, «To make things worse, Coca-Cola's share of the market had been slipping for years…»), sin
// cartela; la barra del año corre de 1975 a 1984 en el plano 1 y se queda en 1984. Tres planos:
// 1. «To make things worse, Coca-Cola's share of the market had been slipping for years, while Pepsi kept climbing»
//    (0–6,3 s): la sala de juntas de la sede; la gráfica se dibuja: el presidente la señala en «share», la línea roja
//    baja en «slipping» (él se pone triste) y la azul sube en «climbing» (sorpresa); la secretaria entra y deja otra
//    carpeta en la mesa en «years»; el directivo de detrás se lleva las manos a la cabeza.
// 2. «In grocery stores, Pepsi was already selling more» (6,3–9,9 s): la góndola de frente (botellas rectas, cartones
//    de seis y latas, cantos metálicos con brillo, precios y cartones colgados) y, a la derecha, el pasillo que se va al
//    fondo con la otra góndola de lado y las neveras; una clienta pequeña empuja el carrito, abre una nevera y coge una
//    lata; delante, el canto de la balda más cercana. La mano del reponedor pasa por la balda de abajo y las latas se
//    vuelven azules a su paso, y arriba y en medio también; en «selling more» la mano de otra clienta coge una lata azul
//    y la mete en su cesta.
// 3. «For a company that thought it was unbeatable, it was an alarm going off» (9,9 s–fin): la torre de la sede en
//    Atlanta con su plaza; el directivo saca pecho junto al trofeo del número 1, que brilla en «unbeatable»; en «alarm»
//    se enciende la baliza roja de la azotea, las ventanas parpadean en rojo, las palomas salen volando, la gente sale
//    corriendo por la puerta y el directivo se asusta.
import * as T from '/atomo/plato/escenas/nc-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
import { ELENCO_NC as NC } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('nc-cuota');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const PZ = T.PIEZAS_NC, K = hex('#1c1222');
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const tr = (x, y, a) => a * 16 > BAY[((y & 3) << 2) | (x & 3)] + 0.5;
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const CAPAS = new Map();
// la capa fija de un plano: se pinta una vez en su búfer y en cada fotograma se copia entera
const capa = (k, pintar) => { let b = CAPAS.get(k); if (!b) { b = R.nuevo(); const prev = R.usar(b); pintar(); R.usar(prev); CAPAS.set(k, b); } R.copiar(b); };
const grad = (x0, y0, x1, y1, cols) => { const n = cols.length - 1; for (let y = y0; y <= y1; y++) { const u = (y - y0) / Math.max(1, y1 - y0) * n, i = Math.min(n - 1, Math.floor(u)), f = u - i; for (let x = x0; x <= x1; x++) R.pset(x, y, tr(x, y, f) ? cols[i + 1] : cols[i]); } };
const caja = (x0, y0, x1, y1, c, borde = K) => { R.rect(x0 - 1, y0 - 1, x1 + 1, y1 + 1, borde); R.rect(x0, y0, x1, y1, c); };
const cajaR = (x0, y0, x1, y1, c) => { for (let y = y0; y <= y1; y++) R.linea(x0, y, x1, y, c); };   // respeta R.recorte
const sombrear = (x0, y0, x1, y1, c, a) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (tr(x, y, a)) R.pset(x, y, c); };
const nube = (cx, cy, w, c1, c2, c3) => {
  const r = w / 5, P = [[-1.6, .4, .9], [-.6, -.2, 1.2], [.6, -.4, 1.3], [1.6, .3, 1], [0, .5, 1.1]];
  for (const [a, b, q] of P) R.disco(Math.round(cx + a * r), Math.round(cy + b * r + 1), Math.round(q * r), c3);
  for (const [a, b, q] of P) R.disco(Math.round(cx + a * r), Math.round(cy + b * r), Math.round(q * r), c2);
  for (const [a, b, q] of P.slice(1, 3)) R.disco(Math.round(cx + a * r - 1), Math.round(cy + b * r - 1), Math.max(1, Math.round(q * r * .6)), c1);
};
// nubes de tres tonos a tres velocidades dentro de cl (con R.recorte puesto)
const nubes = (cl, t, y0, y1, cols, n = 6, v = 1, w0 = 12) => { for (let k = 0; k < n; k++) { const c3 = k % 3, vel = (1.5 + c3 * 2.5) * v, w = w0 + c3 * 6 + hh(k, 1) * 8, ancho = cl[2] - cl[0] + 2 * w + 20; const x = cl[0] - w - 10 + ((hh(k, 2) * ancho + t * vel) % ancho), y = y0 + hh(k, 3) * (y1 - y0); nube(x, y, w, cols[0], c3 === 0 ? cols[2] : cols[1], c3 === 0 ? cols[3] ?? cols[2] : cols[2]); } };
const pajaros = (t, x0, x1, y, n = 3, v = 9, c = K) => { for (let k = 0; k < n; k++) { const x = Math.round(x0 + ((hh(k, 7) * (x1 - x0) + t * v * (1 + (k % 2) * 0.3)) % (x1 - x0))), yy = Math.round(y + hh(k, 8) * 10 + Math.sin(t * 2 + k) * 2), a = Math.sin(t * 11 + k * 2) > 0 ? 1 : 0; R.pset(x, yy, c); R.pset(x - 1, yy - a, c); R.pset(x + 1, yy - a, c); R.pset(x - 2, yy - 2 * a + (a ? 0 : 1), c); R.pset(x + 2, yy - 2 * a + (a ? 0 : 1), c); } };
// la botellita recta a escala de chibi (3 × 9) con su chapa y su brillo; (x, y) el centro de abajo
const BOT = { marron: [hex('#6a3a1e'), hex('#9a6a40')], rojo: [hex('#c8382e'), hex('#e2675c')], azul: [hex('#2e5aa8'), hex('#5a82c8')] };
const botellita = (x, y, col = 'marron', inclina = 0) => { const [c, l] = BOT[col]; const dx = (j) => Math.round(inclina * j / 9); for (let j = 0; j < 9; j++) { const w = j < 3 ? 0 : 1; R.rect(x - w - 1 + dx(j), y - j, x + w + 1 + dx(j), y - j, K); } for (let j = 1; j < 8; j++) { const w = j < 3 ? 0 : 1; R.rect(x - w + dx(j), y - j, x + w + dx(j), y - j, c); if (j > 2) R.pset(x - 1 + dx(j), y - j, l); } R.pset(x + dx(9), y - 9, hex('#c8c8d2')); R.pset(x + dx(9), y - 10, K); };
const vasito = (x, y, lleno = 0.7) => { R.rect(x - 3, y - 6, x + 3, y, K); R.rect(x - 2, y - 5, x + 2, y - 1, hex('#d6e6ee')); const h = Math.round(4 * lleno); if (h) R.rect(x - 2, y - h, x + 2, y - 1, hex('#4a2414')); R.pset(x - 2, y - 5, hex('#ffffff')); };
// el globo grande de un símbolo (se lee a 640 px): «!», «?» o «X» a escala 2 sobre fondo claro, con su piquito abajo en (x, y)
const globo = (x, y, ic, col = hex('#c8382e')) => { R.rect(x - 9, y - 18, x + 9, y - 1, K); R.rect(x - 8, y - 17, x + 8, y - 2, hex('#fbf6ea')); R.rect(x - 8, y - 3, x + 8, y - 2, hex('#d8d0c0')); R.rect(x - 2, y, x + 1, y, K); R.rect(x - 1, y + 1, x, y + 1, K); R.rect(x - 1, y - 1, x, y, hex('#fbf6ea')); R.icono(ic, x - 5, y - 15, col, K, 2); };
const destello = (x, y, u, c = hex('#fff6c0')) => { if (u <= 0 || u >= 1) return; const r = Math.round(2 + 4 * Math.sin(u * Math.PI)); for (let i = -r; i <= r; i++) { R.pset(x + i, y, c); R.pset(x, y + i, c); } R.pset(x - 1, y - 1, c); R.pset(x + 1, y + 1, c); R.pset(x + 1, y - 1, c); R.pset(x - 1, y + 1, c); };

const c = (f) => en('cuota', f);
const P2 = c(.4378), P3 = c(.702);
// ── 1 · la gráfica en la sala de juntas ──
const CUOTA = c(.1422), BAJA = c(.235), AÑOS = c(.2814), SUBE = c(.3996);
const p1 = (t) => {
  const o = { encuadre: 'sede', grafica: lerp(0.3, 1, tramo(t, 1.0, SUBE + 0.3)) };
  T.colas(R, t, o);
  // el directivo de detrás de la mesa, con las manos en la cabeza cuando la roja baja
  R.actor(EL.ejecutivo2, 182, 136, t, { dir: 1, brazos: t > BAJA + 0.2 && t < SUBE, triste: t > BAJA, sorpresa: t > SUBE });
  R.actor(EL.ejecutivo, 108, 136, t, { dir: 1, habla: t < BAJA && Math.sin(t * 8) > 0, triste: t > BAJA + 0.4, sorpresa: t > SUBE && t < SUBE + 0.6 });
  T.colasDelante(R, t, o);
  // la carpeta que deja la secretaria en la mesa
  if (t > AÑOS) { R.rect(84, 128, 100, 131, K); R.rect(85, 128, 99, 130, hex('#e8c060')); R.rect(85, 128, 99, 128, hex('#f8e0a0')); }
  // la secretaria entra por la izquierda con la carpeta y la deja en «years»
  const sx = t < AÑOS ? Math.round(lerp(-18, 76, tramo(t, 0.6, AÑOS - 0.2))) : t < AÑOS + 0.8 ? 76 : Math.round(lerp(76, -24, tramo(t, AÑOS + 0.8, P2)));
  const se = R.actor(EL.cajera, sx, 166, t, { dir: t < AÑOS + 0.8 ? 1 : -1, anda: (t > 0.6 && t < AÑOS - 0.2) || t > AÑOS + 0.8, sostiene: t < AÑOS ? [sx + 16, 146] : undefined, triste: t > BAJA });
  if (t < AÑOS) { const [mx, my] = se.mano; R.rect(mx - 6, my - 4, mx + 6, my + 4, K); R.rect(mx - 5, my - 3, mx + 5, my + 3, hex('#e8c060')); R.rect(mx - 5, my - 3, mx + 5, my - 2, hex('#f8e0a0')); }
  // el presidente señala la gráfica en «share»
  R.actor(NC.keough, 248, 166, t, { dir: -1, dedo: t > CUOTA - 0.2 && t < SUBE + 0.3, habla: t > CUOTA && t < BAJA && Math.sin(t * 9) > 0, triste: t > BAJA && t < SUBE, sorpresa: t > SUBE });
  if (t > SUBE && t < SUBE + 0.9) globo(256, 136, '!');
  // las puntas de las líneas, resaltadas cuando la voz las nombra
  destello(236, 72, tramo(t, BAJA, BAJA + 0.6)); destello(236, 64, tramo(t, SUBE, SUBE + 0.6));
  // la papelera con bolas de papel y el periódico en el suelo; una bola nueva cae cuando la roja baja
  R.rect(288, 158, 304, 174, K); R.rect(289, 159, 303, 173, hex('#8a8c98')); for (let x = 291; x < 303; x += 3) R.rect(x, 159, x, 173, hex('#6a6c78')); R.disco(293, 157, 3, hex('#f2eee2')); R.disco(299, 156, 3, hex('#e8e4dc'));
  { const u = tramo(t, BAJA + 0.3, BAJA + 1.1); if (u > 0) { const bx = Math.round(lerp(262, 296, u)), by = Math.round(lerp(140, 154, u) - Math.sin(u * Math.PI) * 14); R.disco(bx, by, 2, K); R.disco(bx, by, 1, hex('#fbf6ea')); } }
  R.poligono([[150, 170], [176, 166], [180, 176], [154, 179]], hex('#e8e4dc')); for (let k = 0; k < 4; k++) R.linea(156 + k, 170 + k * 2, 174 + k, 167 + k * 2, hex('#a8a090')); R.linea(152, 170, 176, 166, hex('#5a5a62'));
};

// ── 2 · el estante: las latas azules ganan sitio ──
// La góndola de frente (x 0–225) y, a la derecha, el pasillo que se va al fondo (punto de fuga VP): techo de placas y
// suelo de baldosas en perspectiva, la otra góndola de lado, las neveras del fondo con una clienta pequeña; delante, el
// canto de la balda más cercana (abajo a la izquierda) y la cesta.
const TIENDAS = c(.5022), PEPSI2 = c(.5605), VENDE = c(.6159);
const BALDAS = [70, 108, 146], VP = [270, 86], GD = 225;
// lo que hay en cada balda: [x, tipo] (tipo 'bot' botella recta, 'caja' cartón de seis, 'lata')
const GENERO = [
  [...[0, 1, 2, 3, 4, 5].map((i) => [7 + i * 11, 'bot']), ...Array.from({ length: 12 }, (_, i) => [76 + i * 13, 'lata'])],
  [[17, 'caja'], [47, 'caja'], ...Array.from({ length: 12 }, (_, i) => [72 + i * 13, 'lata'])],
  Array.from({ length: 17 }, (_, i) => [8 + i * 13, 'lata']),
];
const COGE = 15;   // la lata de la balda de abajo que coge la clienta (x 203)
// el instante en que cada pieza se vuelve azul: la balda de abajo, al paso de la mano; las otras, en una ola
const giro = (b, i) => { const x = GENERO[b][i][0]; if (b === 2) return P2 + 0.4 + (240 - x) / 230 * 2.2; return P2 + 0.9 + (GD - x) / 220 * 2.0 + b * 0.15 + hh(i, b) * 0.4; };
// una figurita lejana (12 px) con su carrito de alambre, sin R.rect (respeta el recorte)
const figurita = (x, ys, t, o = {}) => {
  const ropa = hex('#4a8a5a'), ropaS = hex('#2e5e3c'), piel = hex('#f0c8a0'), pelo = hex('#6a3a22'), pc = hex('#3a3a5a');
  const paso = o.anda ? Math.floor(t * 6) % 2 : 0, yc = ys - 7, yh = yc - 3;
  R.linea(x - 1 - paso, ys - 3, x - 1 - paso, ys, pc); R.linea(x + 1 + paso, ys - 3, x + 1 + paso, ys, pc);
  for (let y = yc; y < ys - 3; y++) { R.linea(x - 1, y, x, y, ropa); R.pset(x + 1, y, ropaS); }
  R.pset(x - 2, yc + 1, ropa); R.pset(x + 2, yc + 1, ropaS);
  for (let y = yh; y < yc; y++) R.linea(x - 1, y, x + 1, y, piel);
  R.linea(x - 1, yh, x + 1, yh, pelo); R.pset(o.dir < 0 ? x + 1 : x - 1, yh + 1, pelo); R.pset(o.dir < 0 ? x - 1 : x + 1, yh + 1, K);
  if (o.brazo) { R.linea(x + 2, yc, x + 4, yc - 4, ropa); R.pset(x + 4, yc - 5, piel); }
};
const carrito = (x, ys, d) => {
  const X = (i) => x + d * i, pl = hex('#c8ccd6'), ps = hex('#8a8e9a');
  for (let j = 0; j <= 6; j += 2) R.linea(X(0), ys - 9 + j, X(10 - (j >> 1)), ys - 9 + j, ps);
  for (let i = 0; i <= 10; i += 2) R.linea(X(i), ys - 9, X(Math.min(i, 7)), ys - 3, ps);
  R.linea(X(0), ys - 9, X(10), ys - 9, pl); R.linea(X(0), ys - 9, X(0), ys - 3, pl); R.linea(X(-2), ys - 11, X(0), ys - 9, pl); R.pset(X(-2), ys - 11, hex('#c8382e'));
  R.linea(X(1), ys - 2, X(8), ys - 2, ps); R.pset(X(1), ys, K); R.pset(X(8), ys, K); R.pset(X(1), ys - 1, ps); R.pset(X(8), ys - 1, ps);
  R.pset(X(4), ys - 8, hex('#c8382e')); R.pset(X(6), ys - 8, hex('#2e5aa8')); R.pset(X(5), ys - 7, hex('#f0c040'));
};
const p2 = (t) => {
  capa('estante', () => {
    // la nave en perspectiva: techo de placas (con su punteado), la pared del fondo y el suelo de baldosas, en una pasada
    const [vx, vy] = VP;
    for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) {
      let col;
      if (y < 62) {
        const d = vy - y, wx = (x - vx) / d * 2, k = 900 / d, dx = Math.abs(wx - Math.round(wx)) * d / 2, dk = Math.abs(k - Math.round(k)) * d * d / 900;
        col = dx < 0.5 || dk < 0.5 ? hex('#c4baa4') : tr(x, y, 1 - d / 90) ? hex('#d8d0bc') : hex('#e8e0cc');
        if (hh(x, y) < 0.05) col = hex('#cfc6b0');
      } else if (y <= 104) {
        col = y < 66 ? hex('#c8d4c4') : tr(x, y, (y - 66) / 40) ? hex('#b8c8b8') : hex('#d0dcc8');
      } else {
        const d = y - vy, wx = (x - vx) / d * 2.5, k = 880 / d, cq = (Math.floor(wx) + Math.floor(k)) % 2 === 0;
        col = cq ? hex('#e8dcc0') : hex('#c8b890');
        const fx = Math.abs(wx - Math.round(wx)) * d / 2.5, fk = Math.abs(k - Math.round(k)) * d * d / 880;
        if (fx < 0.45 || fk < 0.45) col = hex('#a8987a');
        if (hh(x, y, 3) < 0.012) col = hex('#9a8a6a');
      }
      R.pset(x, y, col);
    }
    // las neveras del fondo: marco, cuatro puertas de cristal con su luz y las filas de género dentro
    caja(236, 67, 291, 101, hex('#e8ecf0'), hex('#5a5e6a'));
    R.rect(236, 67, 291, 69, hex('#3a6aa8')); for (let x = 240; x < 290; x += 8) R.rect(x, 68, x + 3, 68, hex('#8ab8e0'));
    for (let p = 0; p < 4; p++) { const x0 = 238 + p * 13; R.rect(x0, 71, x0 + 11, 99, hex('#bcd8e8')); R.rect(x0, 71, x0, 99, hex('#8a9aa8')); R.rect(x0 + 11, 71, x0 + 11, 99, hex('#6a7a88'));
      for (const y of [77, 84, 91, 98]) { R.rect(x0 + 1, y, x0 + 10, y, hex('#8a9aa8')); for (let i = x0 + 1; i < x0 + 11; i += 2) R.rect(i, y - 3, i, y - 1, [hex('#c8382e'), hex('#2e5aa8'), hex('#f0c040'), hex('#e8e4dc')][(i + y + p) % 4]); }
      R.pset(x0 + 2, 73, hex('#ffffff')); R.pset(x0 + 3, 74, hex('#ffffff')); R.rect(x0 + 9, 82, x0 + 9, 88, hex('#c8c8d2')); }
    R.rect(234, 101, 293, 104, hex('#7c8090')); R.rect(234, 101, 293, 101, hex('#b8bcc8'));
    // la otra góndola del pasillo, de lado, que se va al fondo (x 292–319): cabecera, tres baldas y el género en tiras
    for (let x = 292; x < 320; x++) {
      const u = (x - vx) / 50, yT = Math.round(vy + (46 - vy) * u), yB = Math.round(vy + (176 - vy) * u), hgt = yB - yT, k = Math.floor(260 / (x - vx));
      for (let y = yT; y <= yB; y++) { const v = (y - yT) / hgt; let col;
        if (v < 0.13) col = v < 0.03 ? hex('#f0b050') : tr(x, y, v * 4) ? hex('#b86818') : hex('#e8902a');
        else if (v > 0.93) col = hex('#5a5e6a');
        else { const fr = [0.36, 0.62, 0.9].find((s) => v <= s) ?? 0.9, top = fr - 0.2; const labio = fr - v < 0.035;
          col = labio ? (fr - v < 0.012 ? hex('#e0e4ec') : hex('#9a9eaa')) : v < top ? hex('#c8bca0') : [hex('#c8382e'), hex('#2e5aa8'), hex('#c8985a'), hex('#2e5aa8'), hex('#e8e4dc')][(k + Math.round(fr * 10)) % 5];
          if (!labio && v >= top && (x + k) % 3 === 0) col = hex('#1c1222'); }
        R.pset(x, y, col); }
    }
    R.linea(292, 68, 292, 126, K);
    // los tubos fluorescentes del techo: dos delante y tres que se alejan por el pasillo
    caja(178, 18, 220, 19, hex('#fbfaf4'), hex('#a8a090'));
    caja(238, 34, 256, 35, hex('#fbfaf4'), hex('#a8a090')); caja(246, 47, 258, 47, hex('#fbfaf4'), hex('#a8a090')); caja(252, 55, 260, 55, hex('#fbfaf4'), hex('#a8a090'));
    // la cabecera naranja de la góndola de frente, con sus paneles de pictogramas
    R.rect(0, 23, GD, 46, hex('#e8902a')); R.rect(0, 23, GD, 24, hex('#f0b050')); R.rect(0, 45, GD, 46, hex('#b86818')); R.rect(0, 30, GD, 31, hex('#d8b040')); R.rect(0, 38, GD, 39, hex('#8a5a2a'));
    for (let x = 8; x < 200; x += 54) { caja(x, 26, x + 30, 43, hex('#fbf6ea')); R.icono('lata', x + 3, 30, hex('#2e5aa8'), K, 1); R.icono('lata', x + 12, 30, hex('#c8382e'), K, 1); R.rect(x + 22, 29, x + 28, 40, hex('#f0c040')); R.rect(x + 22, 36, x + 28, 40, hex('#e8902a')); }
    // el panel perforado del fondo de la góndola, en sombra bajo cada balda
    for (let y = 47; y < 155; y++) for (let x = 0; x <= GD; x++) R.pset(x, y, x % 8 === 4 && y % 8 === 4 ? hex('#a89c80') : hex('#d8ccb0'));
    for (const by of [46, ...BALDAS.slice(0, 2)]) sombrear(0, by + (by === 46 ? 1 : 9), GD, by + (by === 46 ? 6 : 15), hex('#a89c80'), 0.45);
    for (const by of BALDAS) {
      // el canto metálico de la balda: el borde de luz, el riel de precios y la sombra de abajo
      if (by < VP[1]) { R.rect(0, by + 8, GD, by + 9, hex('#6a6e7a')); }
