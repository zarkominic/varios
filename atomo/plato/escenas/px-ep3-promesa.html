const { PAL, W, H, clamp, mezcla, lin, suave, sale, entra, entraSale, paso, fot, tono, vnoise, fbm, hash2, b4, b8, mulberry32, rgb, color, hex } = PX;

};

const mitad = mezcla(m.d, m.dF, 0.5);

// el plató de detrás: el foco cae detrás del respaldo (la luz pasa por el hueco entre los dedos y la madera)
const PLATO_A = PX.crearPlato({ ancho: 640, focoX: 462, focoY: 104, sueloY: 246, semilla: 5 });
const FONDO_A = copiaPantalla(() => PLATO_A.dibujar({ camX: 80, t: 0, polvo: 0 }));

const MANO = { largo: 64, angulo: 0.15, tipo: 'abierta', manga: 1.8 };
const GAP0 = 8, GAP1 = 4;                                     // el hueco al frenar y después de dudar
const Y_MANO = 100;
const borde = (capa, desdeDer) => {
  const r = new Int16Array(H).fill(desdeDer ? -999 : 9999);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (capa.buf[y * W + x]) { if (desdeDer) r[y] = x; else if (r[y] === 9999) r[y] = x; }
  return r;
};
const X_REF = 200;
const PRUEBA_MANO = copiaPantalla(() => PX.mano({ ...MANO, x: X_REF, y: Y_MANO }));

for (let y = 0; y < H; y++) if (derMano[y] > -999 && izqSilla[y] < 9999) minHueco = Math.min(minHueco, izqSilla[y] - derMano[y] - 1);

  const p = sale(prog(t, T.f1, T.mano1));
  const x = mezcla(X_MANO_FIN - (GAP0 - GAP1) - 330, X_MANO_FIN - (GAP0 - GAP1), Math.pow(p, 0.9));

const manoY = (t) => Math.round(Y_MANO - 26 * (1 - sale(prog(t, T.f1, T.mano1))));
const camA = (t) => Math.round(8 * (1 - sale(prog(t, T.f1, T.mano1 + 0.6))));   // la cámara acompaña la mano y se asienta
function planoSilla(t) {
  const cx = camA(t);

  if (cx > 0) PX.rect(W - Math.ceil(cx * 0.35), 0, W - 1, H - 1, PAL.TELON[2]);

  PX.pegar(SILLA, -cx, 0);
  const x = manoX(t) - cx, y = manoY(t);

  PX.mano({ ...MANO, x, y });

// el centro del hueco (para la luz y el segundo fogonazo)
let xHueco = 0, yHueco = 0;
{
  let n = 0, sx = 0, sy = 0;
  for (let y = 0; y < H; y++) if (derMano[y] > -999 && izqSilla[y] < 9999 && izqSilla[y] - derMano[y] - 1 <= minHueco + 1) { sx += (izqSilla[y] + derMano[y] + (X_MANO_FIN - X_REF)) / 2; sy += y; n++; }

}
// motas de polvo en el haz (las del plató, desplazadas con la cámara)
function polvoA(t, cx) {

    const a = rnd(), b = rnd(), c = rnd(), d = rnd();
    const x = Math.round(250 + a * 220 + Math.sin(tq * (0.3 + c * 0.4) + d * 9) * 5 - cx * 0.6);
    const y = Math.round(((b * 220 + tq * (2 + c * 4)) % 220) + 6);

// ═════════════════════════════════════════════════════════════ PLANO 2: la balanza en vilo (PLANO MEDIO)
const LAT = PAL.LATON, NOG = PAL.NOGAL;
const PIV = [240, 54], LB = 126, HILO = 88, PRX = 42, PRY = 8, HONDO = 13;
const PLATO_B = PX.crearPlato({ ancho: 640, focoX: 320, focoY: 96, sueloY: 226, semilla: 7 });

// los platos: el fondo y el borde de atrás (detrás de lo que llevan) y la panza y el borde de delante (delante)
const PB = 64;   // las capas de los platos: 2·PB × PB, con el centro del borde en (PB, PB/2)
function capaPlato(delante) {

{

  for (let y = 0; y < c.h; y++) for (let x = 0; x < c.w; x++) {
    if (!lleno(x, y)) continue;
    const bordeS = !lleno(x - 1, y) || !lleno(x + 1, y) || !lleno(x, y - 1) || !lleno(x, y + 1);
    const rejilla = ((x & 1) === 0 && (y & 1) === 0) || (((x + 1) & 1) === 0 && ((y + 1) & 3) === 0 && hash2(x, y) > 0.5);
    if ((bordeS && ((x + y) & 1) === 0) || rejilla) PUNTOS.push([x - 60, y - 104, hash2(x * 3 + 1, y * 7 + 5), bordeS ? 1 : 0]);
  }
}
function silueta(t, x, y) {
  PX.luz(x, y - 36, 56, rgb(PAL.AMBAR[2]), 0.45, 4);
  const f = fot(t, 8);
  for (const [dx, dy, h, bs] of PUNTOS) {
    const ph = (h * 97 + f * 0.37 * (0.5 + h)) % 1;
    const c = ph > 0.92 ? PAL.BLANCO : ph > 0.66 ? PAL.AMBAR[5] : bs ? PAL.CREMA[5] : h > 0.3 ? PAL.AMBAR[4] : PAL.TERRACOTA[5];
    PX.pset(x + dx, y + dy, c);
  }
}
// en el plato derecho: una esfera de cielo estrellado
const RO = 31, ORBE = PX.nuevaCapa(2 * RO + 4, 2 * RO + 4), ESTRELLAS_O = [];
{
  const cx = RO + 2, cy = RO + 2, rnd = mulberry32(57);
  PX.en(ORBE, () => {
    for (let y = 0; y < ORBE.h; y++) for (let x = 0; x < ORBE.w; x++) {
      const nx = (x + 0.5 - cx) / RO, ny = (y + 0.5 - cy) / RO, d2 = nx * nx + ny * ny;
      if (d2 > 1) continue;
      const nz = Math.sqrt(1 - d2);
      const s = nx * 0.6 + ny * 0.8, banda = Math.exp(-((s * 1.6 - 0.05) ** 2) / 0.09) * (0.5 + 0.8 * fbm(x * 0.09 + 3, y * 0.09, 3));
      let v = 1.0 + 3.6 * banda * nz + 1.4 * nz;
      const neb = suave(0.55, 0.8, fbm(x * 0.06 + 11, y * 0.06 + 2, 3));
      let c = neb > b8(x, y) ? tono(PAL.NEBULOSA, 1.5 + 3 * neb + 0.8 * nz, x, y, 1) : tono(PAL.NOCHE, v, x, y, 1);
      // el borde coge el contraluz frío y el lado de la luz, un brillo
      const rim = Math.pow(1 - nz, 3);
      if (rim > 0.35 && nx > -0.2) c = tono(PAL.ESTRELLA, 0.2 + 1.6 * rim, x, y, 1);
      if (d2 > 0.9 && b4(x, y) > 0.5) c = PAL.NOCHE[1];
      ORBE.buf[y * ORBE.w + x] = c;
    }
    for (let k = 0; k < 70; k++) {
      const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * (RO - 3);
      const x = Math.round(cx + Math.cos(a) * r), y = Math.round(cy + Math.sin(a) * r);
      const q = rnd();
      PX.pset(x, y, q > 0.85 ? PAL.ESTRELLA[4] : q > 0.5 ? PAL.ESTRELLA[3] : PAL.ESTRELLA[2]);
      if (q > 0.88) ESTRELLAS_O.push([x - cx, y - cy, rnd()]);
    }
  });
}
function orbe(t, x, y) {
  // (x, y) = el centro del borde del plato; la esfera se hunde un poco en el plato
  const cx = x, cy = y - RO + 7;
  PX.luz(cx, cy, 56, [60, 80, 140], 0.35, 4);
  PX.pegar(ORBE, cx - RO - 2, cy - RO - 2);
  const f = fot(t, 8);
  for (const [dx, dy, h] of ESTRELLAS_O) {
    const on = ((f + Math.floor(h * 13)) % 9) < 6;
    const X = cx + dx, Y = cy + dy;
    PX.pset(X, Y, PAL.BLANCO);
    if (on) { PX.pset(X - 1, Y, PAL.ESTRELLA[2]); PX.pset(X + 1, Y, PAL.ESTRELLA[2]); PX.pset(X, Y - 1, PAL.ESTRELLA[2]); PX.pset(X, Y + 1, PAL.ESTRELLA[2]); }
  }
}
// el brazo: llega meciéndose tras el fogonazo y se queda en vilo, temblando sin decidirse (a > 0 baja el plato izquierdo)
function anguloBalanza(t) {
  const s = Math.max(0, paso(t, 15) - T.f2);
  const amort = Math.exp(-s / 1.5);
  return 0.075 * amort * Math.cos((2 * Math.PI * s) / 1.85) + 0.014 * (1 - amort) * Math.sin((2 * Math.PI * s) / 2.6 + 0.6);
}
function planoBalanza(t) {
  PX.pegar(FIJA, 0, 0, { opaco: true });
  const a = anguloBalanza(t), ca = Math.cos(a), sa = Math.sin(a);
  const tipL = [PIV[0] - LB * ca, PIV[1] + LB * sa], tipR = [PIV[0] + LB * ca, PIV[1] - LB * sa];
  const platoL = [Math.round(tipL[0]), Math.round(tipL[1] + HILO)], platoR = [Math.round(tipR[0]), Math.round(tipR[1] + HILO)];
  // las sombras de los platos en el suelo
  PX.sombra(platoL[0] + 6, 236, 40, 4, 0.4); PX.sombra(platoR[0] + 6, 236, 40, 4, 0.4);
  // el brazo de latón (más grueso en el centro) con sus remates
  PX.forma({
    x0: Math.min(tipL[0], tipR[0]) - 6, y0: Math.min(tipL[1], tipR[1]) - 8, x1: Math.max(tipL[0], tipR[0]) + 6, y1: Math.max(tipL[1], tipR[1]) + 8,
    sdf: union(segSdf(PIV[0], PIV[1], tipL[0], tipL[1], 3.6, 1.8), segSdf(PIV[0], PIV[1], tipR[0], tipR[1], 3.6, 1.8),
      (x, y) => Math.hypot(x - tipL[0], y - tipL[1]) - 3.2, (x, y) => Math.hypot(x - tipR[0], y - tipR[1]) - 3.2),
    rampa: LAT, lo: 1.2, hi: 5.8, grosor: 3,
  });
  // el fiel: la aguja cuelga del pivote por delante de la columna
  const fx = PIV[0] + 44 * sa, fy = PIV[1] + 44 * ca;
  PX.linea(PIV[0] + 1, PIV[1] + 4, fx + 1, fy, LAT[1]);
  PX.linea(PIV[0], PIV[1] + 4, fx, fy, LAT[5]);
  // el pivote
  PX.forma({ x0: PIV[0] - 8, y0: PIV[1] - 12, x1: PIV[0] + 8, y1: PIV[1] + 7, sdf: union((x, y) => Math.hypot(x - PIV[0], y - PIV[1]) - 5, segSdf(PIV[0], PIV[1] - 10, PIV[0], PIV[1] - 4, 1.4, 2.4)), rampa: LAT, lo: 1.4, hi: 6, grosor: 3 });
  for (const [tip, pl, lado] of [[tipL, platoL, -1], [tipR, platoR, 1]]) {
    const hx = Math.round(tip[0]), hy = Math.round(tip[1]) + 3;
    PX.anillo(hx, hy + 1, 2, LAT[4]);
    // el hilo de atrás, el plato por dentro, lo que lleva, la panza y los dos hilos de delante
    PX.linea(hx, hy + 3, pl[0], pl[1] - PRY, LAT[1], 2);
    PX.pegar(PLATO_DETRAS, pl[0] - PB, pl[1] - PB / 2);
    if (lado < 0) silueta(t, pl[0], pl[1] + 1); else orbe(t, pl[0], pl[1]);
    PX.pegar(PLATO_DELANTE, pl[0] - PB, pl[1] - PB / 2);
    PX.linea(hx, hy + 3, pl[0] - PRX + 1, pl[1], LAT[3]);
    PX.linea(hx, hy + 3, pl[0] + PRX - 1, pl[1], LAT[3]);
    PX.luz(hx, hy, 6, rgb(PAL.AMBAR[4]), 0.4, 3);
  }
  // un brillo recorre el brazo cuando llega
  const g = prog(t, T.f2b, T.f2b + 0.7);
  if (g > 0 && g < 1) { const u = mezcla(-1, 1, g); PX.luz(PIV[0] + LB * u * ca, PIV[1] - LB * u * sa, 7, rgb(PAL.AMBAR[5]), 0.7, 3); }
}

// ═════════════════════════════════════════════════════════════ PLANO 3: del cielo al plató (PLANO GENERAL)
const FIN = {
  plato: { ancho: 640, focoX: 240, focoY: 118, sueloY: 200, semilla: 11 }, camX: 80,
  persona: { x: 153, y: 214, altura: 118, pose: 'depie', vida: false, t: 0 },
  regla: { e: 0, entera: 1, actual: 0, marca: 0 },
};
const PLATO_C = PX.crearPlato(FIN.plato);
// la pared del plató por encima de su borde de arriba (la misma fórmula que crearPlato, sin costura en y = 0)
function paredV(x, y) {
  const { ancho, focoX, focoY, sueloY, semilla } = FIN.plato;
  const fu = [focoX - 150, -60], ob = [focoX, sueloY + 18], ax = ob[0] - fu[0], ay = ob[1] - fu[1], al = Math.hypot(ax, ay);
  const px = x - fu[0], py = y - fu[1], along = (px * ax + py * ay) / al, perp = Math.abs(px * ay - py * ax) / al;
  const haz = along <= 0 ? 0 : clamp(1 - perp / (18 + along * 0.42), 0, 1) ** 1.6 * clamp(along / 60, 0, 1) * (1 - clamp((along - al) / 60, 0, 1));
  const borde = Math.abs(x - ancho / 2) / (ancho / 2);
  const tex = 0.55 * (fbm(x * 0.022 + semilla, y * 0.03, 3) - 0.5) + 0.25 * (vnoise(x * 0.25, y * 0.25) - 0.5);
  return 1.8 + 4.2 * Math.exp(-(((x - focoX) / 170) ** 2) - (((y - focoY) / 115) ** 2)) - 1.6 * borde * borde + tex + haz;
}
const ALTO_CIELO = 360;
const VIAJE = PX.nuevaCapa(W, ALTO_CIELO + H);
{
  const cielo = PX.crearCielo({ ...INS.FIN.cielo, ancho: 640, alto: H });
  const capaCielo = copiaPantalla(() => cielo.dibujar({ camX: INS.FIN.camX, t: 0, quieto: true }));
  const capaPlato = copiaPantalla(() => PLATO_C.dibujar({ camX: FIN.camX, t: 0, polvo: 0 }));
  // el cielo de arriba es el del principio (el mismo encuadre, sin el telescopio); debajo sigue en espejo (sin costura)
  // y se funde tramado en la pared oscura del plató
  const B0 = H, B1 = ALTO_CIELO + 24;
  for (let y = 0; y < VIAJE.h; y++) for (let x = 0; x < W; x++) {
    const cieloC = capaCielo.buf[clamp(y < H ? y : 2 * H - 1 - y, 0, H - 1) * W + x];
    const yp = y - ALTO_CIELO;
    const platoC = capaPlato.buf[clamp(yp, 0, H - 1) * W + x];
    const pared = yp < 0 ? tono(PAL.TELON, paredV(x + FIN.camX, yp) - 1.6 * lin(yp, 0, -110), x, y, 1) : platoC;
    const k = suave(B0, B1, y);
    VIAJE.buf[y * W + x] = k <= 0 ? cieloC : k >= 1 || b8(x, y) < k ? pared : cieloC;
  }
}
const camY = (t) => Math.round(ALTO_CIELO * entraSale(prog(t, T.cielo, T.baja1)));
// el «?»: sale de la niebla y sube a saltos buscando el centro; a la altura de la persona (10⁰) no se para
const QK = (() => {
  const q = T.q0, a = m.a;
  return [[q, -37], [q + 0.14, -37], [q + 0.3, -25], [q + 0.42, -25], [q + 0.58, -15], [q + 0.68, -15], [q + 0.84, -6],
    [a - 0.05, -2.2], [a + 0.25, 1.2], [a + 1.25, 52]];
})();
function eInterrogante(t) {
  if (t <= QK[0][0]) return QK[0][1];
  for (let i = 0; i < QK.length - 1; i++) {
    const [ta, ea] = QK[i], [tb, eb] = QK[i + 1];
    if (t <= tb) {
      const u = (t - ta) / (tb - ta);
      const f = i === QK.length - 2 ? entra(u) * 0.75 + u * 0.25 : i === QK.length - 3 ? u : i === QK.length - 4 ? sale(u) : entraSale(u);
      return mezcla(ea, eb, f);
    }
  }
  return QK[QK.length - 1][1];
}
function interrogante(t, R) {
  if (t < T.q0) return null;
  const e = eInterrogante(t), y = Math.round(R.y(e)) - 10;
  if (y < -30) return null;
  const busca = t < m.a - 0.2 ? [0, 1, 0, -1][fot(t, 6) & 3] : 0;
  const x = R.x + R.ancho + 4 + busca;
  const asoma = suave(T.q0, T.q0 + 0.15, t);
  PX.luz(x + 7, y + 10, 22, rgb(PAL.AMBAR[3]), 0.45, 4);
  if (asoma < 1) { if (b8(x, y) < asoma) PX.texto('?', x, y + Math.round(6 * (1 - asoma)), { esc: 3, rampa: PAL.CREMA, sombra: PAL.TINTA, contorno: PAL.TINTA }); }
  else PX.texto('?', x, y, { esc: 3, rampa: PAL.CREMA, sombra: PAL.TINTA, contorno: PAL.TINTA });
  return { x, y, e };
}
// la persona sigue al «?» con la cabeza (a 12 fps)
function miradaPersona(t, q) {
  const tq = paso(t, 12);
  const mira = suave(T.regla0, T.regla1, tq) * (1 - suave(m.a + 1.15, m.a + 1.6, tq));      // hacia la regla
  const arriba = suave(m.a + 0.2, m.a + 0.75, tq) * (1 - suave(m.a + 1.15, m.a + 1.6, tq)); // y hacia arriba
  const baja = q ? clamp((q.e + 4) / -30, 0, 1) * (1 - arriba) : 0;                           // mientras el «?» está abajo
  const r4 = (v) => Math.round(v * 8) / 8;
  return {
    pose: arriba > 0.01 ? { de: 'depie', a: 'mirarArriba', u: r4(arriba * 0.8) } : 'depie',
    cabeza: { giro: r4(0.42 * mira * (1 - 0.4 * arriba)), cabeceo: r4(0.5 * arriba - 0.2 * baja * mira) },
    mira: [r4(0.9 * mira), r4(arriba > 0.01 ? -1 : 0.6 * baja * mira)],
  };
}
function planoGeneral(t) {
  const cy = camY(t), llegado = cy >= ALTO_CIELO;
  if (!llegado) PX.pegar(VIAJE, 0, -cy, { opaco: true });
  else PLATO_C.dibujar({ camX: FIN.camX, t: Math.min(t, QUIETO), polvo: t < QUIETO ? 1 : 0 });
  const dy = ALTO_CIELO - cy;
  // la regla: entra por la derecha y se despliega entera
  let R = null;
  if (t >= T.regla0) {
    const p = entraSale(prog(t, T.entera0, T.entera1));
    const entera = p < 0.45 ? (p / 0.45) * 0.3 : 0.5 + ((p - 0.45) / 0.55) * 0.5;
    R = PX.regla({ e: 0, actual: 0, marca: 0, entera, aparece: prog(t, T.regla0, T.regla1), t: Math.min(t, QUIETO) });
  }
  // el destello del marcador cuando el «?» pasa por 10⁰ (por la persona)
  if (R) {
    const g = prog(t, m.a - 0.05, m.a + 0.55);
    if (g > 0 && g < 1) PX.luz(R.x - 3, R.y(0), 10 + 14 * g, rgb(PAL.AMBAR[5]), 0.8 * (1 - g), 4);
  }
  const q = R ? interrogante(t, R) : null;
  // la persona
  if (dy < H + 10) {
    const fin = t >= QUIETO;
    const g = fin ? { pose: 'depie' } : miradaPersona(t, q);
    PX.persona({ ...FIN.persona, ...g, y: FIN.persona.y + dy, vida: !fin, t: fin ? 0 : t });
  }
}

// ═════════════════════════════════════════════════════════════ Atom y fogonazos
const relojAtom = (t) => (t < T.cielo ? t : t - D);
function fogonazo(t) {
  // 1: el Sol prende en el espejo del telescopio y se abre en blanco; 2: el hueco entre los dedos y la silla se enciende
  if (t >= T.f1a && t < T.f1) {
    const u = prog(t, T.f1a, T.f1);
    const [ex, ey] = [TELE_X - 18, TELE_Y - 14];
    PX.luz(ex, ey, 10 + 260 * entra(u), rgb(PAL.BLANCO), 0.4 + 1.6 * u, 5);
    const l = Math.round(3 + 40 * u * u);
    PX.linea(ex - l, ey, ex + l, ey, PAL.BLANCO); PX.linea(ex, ey - l, ex, ey + l, PAL.BLANCO);
    PX.velo(PAL.BLANCO, entra(suave(0.35, 1, u)));
  } else if (t >= T.f1 && t < T.f1b) PX.velo(PAL.BLANCO, 1 - sale(prog(t, T.f1, T.f1b)));
  else if (t >= T.f2a && t < T.f2) {
    const u = prog(t, T.f2a, T.f2);
    PX.luz(xHueco, yHueco, 8 + 260 * entra(u), rgb(PAL.BLANCO), 0.5 + 1.6 * u, 5);
    PX.velo(PAL.BLANCO, entra(suave(0.3, 1, u)));
  } else if (t >= T.f2 && t < T.f2b) PX.velo(PAL.BLANCO, 1 - sale(prog(t, T.f2, T.f2b)));
}

// ───────────────────────────────────────────────────────────── dibujar(t)
{ const ens = PX.nuevaCapa(W, H); PX.en(ens, () => { planoSilla(T.duda1); planoBalanza(T.f2b); planoGeneral(m.a); }); }
function dibujar(t) {
  if (t < T.f1) PX.pegar(INICIO, 0, 0, { opaco: true });
  else if (t < T.f2) planoSilla(t);
  else if (t < T.cielo) planoBalanza(t);
  else planoGeneral(t);
  fogonazo(t);
  PX.atom({ ...PX.ATOM_SITIO, t: relojAtom(t), energia: energia(t) });
  PX.presentar(t);
}
window.__tiempos = { ...T, D, QUIETO, mitad, hueco: [xHueco, yHueco], manoFin: X_MANO_FIN, minHueco };
window.__fin = { plato: FIN.plato, camX: FIN.camX, persona: FIN.persona, regla: FIN.regla, atom: { ...PX.ATOM_SITIO, t: 0, energia: 0 }, desde: QUIETO };
window.__carga = Math.round(performance.now() - c0);
E.iniciar(dibujar);
</script>
