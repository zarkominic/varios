// LA-MONKEY (frases 15–16), 1990, cartela «1990». Cuatro planos:

//    fantasma y el barco, tocando cada dibujo con la punta; en «two young members» entran dos jóvenes; uno levanta la

  const TON = [[hex('#2a2234'), hex('#3c3248'), hex('#54486a'), hex('#6e6284')], [hex('#30262e'), hex('#463a44'), hex('#5e505a'), hex('#7c6c74')], [hex('#26222e'), hex('#363244'), hex('#4c4860'), hex('#68647c')]];
