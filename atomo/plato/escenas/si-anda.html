<script type="module">
// SI-ANDA (frases 21–23), sin cartela, año 1984. Cuatro planos, el gag 3 (el árbol):
// 1. el salón de 1984 desde la pantalla: la abuela, el chico y el adolescente en el sofá; en «never seen before» se
//    quedan con la boca abierta, a las palomitas les da un salto el bol; el chico señala la pantalla; corta en «knight»;
// 2. el bosque del reino por la tarde: el caballero anda por el borde de delante y pasa por delante del árbol grande
//    («in front of»), da la vuelta, sube al camino y entra por detrás del mismo tronco («behind the trees»)… y no sale:
//    ha desaparecido de verdad; un pájaro baja, mira a un lado y a otro del tronco, «?»;
// 3. el roble de cerca: el pájaro lo busca rama por rama; en «inside it» Graham sale por delante del tronco, saluda y
//    se va andando; el pájaro, «!»;
// 4. el ordenador del porche de cerca, con un monitor grande delante del ocaso (cielo tramado con estrellas, nubes de tres
//    tonos a tres velocidades, bandada; el pueblo del valle con luces y un coche entre los balaustres): las manos teclean
//    («typed») y la línea se llena de trazos; Enter, y el caballero de la pantalla (16 px) responde con un bocadillo con
//    la mano; en «now the world moved» echa a andar, el mundo se desplaza con él (montes y nubes en parallax), pasa por
//    detrás del árbol grande y asoma el castillo con su bandera; en la pantalla, el estanque con el pato y un conejo.
// Sonido (pulido): pasos de Graham, hojas, aleteos y el pájaro posándose en cada rama, además de los gags.
import * as T from '/atomo/plato/escenas/si-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('si-anda');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const C = T.C;
const K = { k: hex('#1a1420'), carton: hex('#c8925a'), cartonL: hex('#e0b07a'), cartonS: hex('#9a6a3a'), cinta: hex('#e8d8a8'),
  blanco: hex('#f2eee2'), papel: hex('#fbf6e6'), papelS: hex('#d8d0b8'), oro: hex('#f8d040'), oroS: hex('#c89a28'), rojo: hex('#c83a3a') };
// una caja de cartón de envíos (x, y: esquina de arriba a la izquierda; w × h), con su cinta y la sombra del canto
const caja = (x, y, w = 9, h = 7) => {
  x = Math.round(x); y = Math.round(y);
  R.rect(x - 1, y - 1, x + w, y + h, K.k); R.rect(x, y, x + w - 1, y + h - 1, K.carton); R.rect(x, y, x + w - 1, y, K.cartonL);
  R.rect(x + w - 2, y + 1, x + w - 1, y + h - 1, K.cartonS); R.rect(x + (w >> 1), y, x + (w >> 1), y + h - 1, K.cinta);
};
// el saco del cartero (lo lleva en la mano: x, y es la mano)
const saco = (x, y, lleno = 1) => {
  x = Math.round(x); y = Math.round(y); const h = 9 + Math.round(lleno * 3);
  R.rect(x - 5, y, x + 5, y + h, K.k); R.rect(x - 4, y + 1, x + 4, y + h - 1, hex('#8a7a5a')); R.rect(x - 4, y + 1, x - 3, y + h - 1, hex('#a8966e'));
  R.rect(x - 1, y - 1, x + 1, y + 1, K.k); R.rect(x - 3, y + 4, x + 3, y + 4, hex('#6a5a40')); R.pset(x + 2, y + 6, hex('#c83a3a'));
};
// estrellitas de brillo que se abren y se apagan (u 0–1)
const brillo = (x, y, u, r = 8, col = K.oro) => {
  if (u <= 0 || u >= 1) return; const d = Math.round(r * Math.sin(u * Math.PI)), e = Math.round(d * 0.6);
  for (let i = -d; i <= d; i++) { R.pset(x + i, y, Math.abs(i) < d * 0.4 ? K.blanco : col); R.pset(x, y + i, Math.abs(i) < d * 0.4 ? K.blanco : col); }
  for (let i = -e; i <= e; i += 2) { R.pset(x + i, y + i, col); R.pset(x + i, y - i, col); }
};
// un pajarito azul de cuento (x, y: las patas), mirando a dir; o.vuela: alas arriba/abajo; o.salta: px
const pajaro = (x, y, t, o = {}) => {
  x = Math.round(x); y = Math.round(y - (o.salta ?? 0)); const d = o.dir ?? 1, X = (i) => x + d * i;
  const az = hex('#3a7ad8'), azS = hex('#2a52a0'), pe = hex('#f0c060'), k = K.k;
  for (let i = -3; i <= 3; i++) for (let j = -6; j <= -2; j++) if ((i * i) / 10 + ((j + 4) * (j + 4)) / 5 <= 1.05) R.pset(X(i), y + j, j > -3 ? pe : az);
  R.pset(X(-4), y - 5, azS); R.pset(X(-5), y - 6, azS); R.pset(X(-4), y - 4, azS);   // la cola
  R.pset(X(2), y - 7, az); R.pset(X(3), y - 7, az); R.pset(X(2), y - 8, az); R.pset(X(3), y - 6, az);   // la cabeza
  R.pset(X(3), y - 7, k); R.pset(X(4), y - 7, hex('#f0a020')); R.pset(X(5), y - 7, hex('#f0a020'));
  const ala = o.vuela ? (Math.sin(t * 30) > 0 ? -3 : 1) : 0;
  R.pset(X(-1), y - 5 + ala, azS); R.pset(X(0), y - 5 + ala, azS); R.pset(X(-2), y - 5 + ala, azS); if (o.vuela) R.pset(X(-1), y - 6 + ala, az);
  if (!o.vuela) { R.pset(X(-1), y - 1, k); R.pset(X(1), y - 1, k); R.pset(X(-1), y, k); R.pset(X(1), y, k); }
};

const a = (f) => en('arboles', f), b = (f) => en('dentro', f), c = (f) => en('escribe', f);
const P2 = a(0.435), P3 = b(0), P4 = c(0);
const nunca = a(0.08), delante = a(0.70), detras = a(0.848), dentro = b(0.786), teclea = c(0.098), mueve = c(0.755);
const lin = (t, a0, a1) => Math.max(0, Math.min(1, (t - a0) / (a1 - a0)));
// p1 · el sofá: la cara de asombro; las palomitas saltan del bol
const p1 = (t) => {
  const g = T.casa(R, t, { encuadre: 'jugadores', camara: 'sofa', epoca: 1985 });
  const asombro = t > nunca && t < nunca + 1.5, ve = a(0.3);
  R.actor(EL.abuela, 75, 152, t, { dir: 1, sorpresa: asombro, sonrisa: t > nunca + 1.5, brazos: t > ve + 0.4 && t < ve + 1.1 });
  const sj = t > ve - 0.2 && t < ve + 0.3 ? Math.round(Math.sin((t - ve + 0.2) / 0.5 * Math.PI) * 7) : 0;
  R.actor(EL.chico, 139, 152, t, { dir: 1, sorpresa: asombro, salto: sj, dedo: t > ve, sonrisa: t > ve, habla: t > ve + 0.3 && Math.sin(t * 9) > 0 });
  R.actor(EL.adolescente, 203, 152, t, { dir: -1, sorpresa: asombro, sonrisa: t > nunca + 1.5 });
  T.a_casaDelante(R, t, { encuadre: 'jugadores', camara: 'sofa', epoca: 1985 });
  // los «!» del asombro, uno detrás de otro
  [[82, 0], [146, 0.15], [210, 0.3]].forEach(([x, d]) => { if (t > nunca + d && t < nunca + d + 1.1) R.bocadillo(x, 112, { icono: '!' }); });
  // las palomitas saltan del bol y caen
  const pu = (t - nunca - 0.05) / 1.1;
  if (pu > 0 && pu < 1) for (let k = 0; k < 9; k++) { const vx = (k - 4) * 7 + (k % 2) * 3, vy = 42 + (k * 13) % 17, x = Math.round(100 + vx * pu), y = Math.round(160 - vy * pu + 70 * pu * pu);
    if (y < 176) { R.rect(x - 1, y - 1, x + 1, y + 1, hex('#8a7a5a')); R.rect(x - 1, y, x + 1, y, K.blanco); R.rect(x, y - 1, x, y + 1, K.blanco); R.pset(x + 1, y + 1, hex('#e8c860')); } }
};
// p2 · el bosque: por delante del árbol… y por detrás, donde desaparece de verdad
const p2 = (t) => {
  const o = { encuadre: 'bosque', luz: 'tarde' }; T.reino(R, t, o);
  // por el borde de delante hacia la izquierda (pasa por delante del tronco), da la vuelta, sube al camino y entra por detrás
  const ida = lin(t, P2, delante + 0.25), sube = lin(t, delante + 0.45, detras + 0.15);
  const gx = Math.round(sube > 0 ? lerp(54, 92, sube) : lerp(176, 54, ida)), gy = Math.round(sube > 0 ? lerp(176, 154, Math.min(1, sube * 1.3)) : 176);
  const frente = gy > 166, oG = { dir: sube > 0 || (t > delante + 0.25) ? 1 : -1, anda: (ida > 0 && ida < 1) || (sube > 0 && sube < 1), sonrisa: true };
  if (!frente) R.actor(EL.graham, gx, gy, t, oG);
  T.reinoDelante(R, t, o);
  if (frente) R.actor(EL.graham, gx, gy, t, oG);
  // el pájaro baja y lo busca a un lado y a otro del tronco
  const pb = tramo(t, detras + 0.5, detras + 1.1), cambia = lin(t, detras + 1.7, detras + 2.0);
  if (pb > 0) { const x = pb < 1 ? lerp(190, 124, pb) : lerp(124, 66, cambia), lado = cambia > 0 && cambia < 1 ? -1 : cambia >= 1 ? 1 : -1;
    pajaro(x, lerp(96, 154, pb) - (cambia > 0 && cambia < 1 ? Math.sin(cambia * Math.PI) * 10 : 0), t, { dir: lado, vuela: pb < 1 || (cambia > 0 && cambia < 1), salta: pb >= 1 && Math.sin(t * 14) > 0.8 ? 1 : 0 });
    if (pb >= 1 && (cambia === 0 || cambia >= 1) && t > detras + 1.25) R.bocadillo(Math.round(x), 136, { icono: '?' }); }
};
// p3 · el roble: el pájaro lo busca rama por rama; Graham sale por delante del tronco
const ramas = [[44, 51], [80, 59], [110, 67], [184, 62], [220, 54]];
const p3 = (t) => {
  const o = { encuadre: 'bosque', camara: 'arbol', luz: 'tarde', pajaro: false }; T.reino(R, t, o);
  const sale = lin(t, dentro - 0.35, dentro + 0.25), va = lin(t, dentro + 1.0, E.duracion + 0.6);
  const s = Math.min(ramas.length - 1, (t - P3) * 1.25), i = Math.floor(s), f = s - i;
  const [x0, y0] = ramas[i], [x1, y1] = ramas[Math.min(ramas.length - 1, i + 1)];
  const vuela = f > 0.62 && i < ramas.length - 1, w = vuela ? (f - 0.62) / 0.38 : 0;
  let bx = lerp(x0, x1, w), by = lerp(y0, y1, w) - Math.sin(w * Math.PI) * 10;
  const baja = lin(t, dentro + 0.6, dentro + 1.2); if (baja > 0) { bx = lerp(bx, 236 + va * 60, baja); by = lerp(by, 132, baja) - Math.sin(baja * Math.PI) * 6; }
  pajaro(bx, by, t, { dir: baja > 0 ? 1 : x1 >= x0 ? 1 : -1, vuela: vuela || (baja > 0 && baja < 1), salta: !vuela && Math.sin(t * 13) > 0.85 ? 1 : 0 });
  if (!vuela && baja === 0 && t < dentro) R.bocadillo(Math.round(bx), Math.round(by) - 11, { icono: '?' });
  if (t > dentro && t < dentro + 0.9) R.bocadillo(Math.round(bx), Math.round(by) - 11, { icono: '!' });
  // Graham sale de detrás del tronco (recortado al borde derecho del tronco mientras sale), saluda y se va
  if (sale > 0) { const gx = Math.round(lerp(162, 192, sale) + va * 150);
    if (sale < 1) R.recorte([177, 0, 319, 179]);
    R.actor(EL.graham, gx, 166, t, { dir: 1, anda: sale < 1 || va > 0, dedo: sale >= 1 && va === 0, sonrisa: true, habla: sale >= 1 && va === 0 && Math.sin(t * 9) > 0 });
    R.recorte(null); }
  T.reinoDelante(R, t, o);
};
// p4 · el ordenador del porche de cerca: teclea, Enter, el caballero responde con la mano y echa a andar; el mundo de la
// pantalla se desplaza con él (pasa por detrás del árbol y asoma el castillo). Encima del decorado: el cielo del ocaso
// repintado (tramado, estrellas, nubes de tres tonos a tres velocidades, bandada), el pueblo con luces y un coche entre
// los balaustres, y un monitor más grande con su luz de contra del sol.
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16), b4 = (x, y) => B4[((y & 3) << 2) | (x & 3)];
const OCASO = ['#3a3a7a', '#6a4a8a', '#a8508a', '#e0706a', '#f0985a', '#f8c870'].map(hex);
const NUBES3 = [[hex('#b88aa8'), hex('#8e6a96'), hex('#5e4a78')], [hex('#ffc8a0'), hex('#e08a8a'), hex('#8a4a7a')], [hex('#ffe4b4'), hex('#f09a7a'), hex('#9a4a6a')]];
const MON = { k: hex('#1a1420'), b: hex('#ddd2b6'), l: hex('#f2ead6'), s: hex('#b4a68a'), d: hex('#8a7e66'), rim: hex('#f8c070'), bisel: hex('#2a2626'), biselL: hex('#4a4440') };
const J = { cA: hex('#5a8ae8'), cL: hex('#8ab8f8'), cT: hex('#7aa8f8'), mon: hex('#6a7ab8'), monS: hex('#4a5a98'), nieve: hex('#eef0fa'), col: hex('#2a7a3a'), colL: hex('#3a9a4a'),
  pr: hex('#3aa83a'), prS: hex('#2a8a2a'), prL: hex('#5ac85a'), ca: hex('#c89a5a'), caS: hex('#a87a3a'), ag: hex('#3a6ad8'), agL: hex('#8ab8f8'), agS: hex('#2a4aa0'),
  neg: hex('#0a0a0e'), gr: hex('#e8e8e8'), piedra: hex('#b8b8b8'), piedraS: hex('#888890'), teja: hex('#2a52a0'), tronco: hex('#6a3a1a'), troncoL: hex('#8a5a2a'),
  hoja: hex('#1a6a1a'), hojaM: hex('#2a9a2a'), hojaL: hex('#5ac85a'), rojo: hex('#d83a3a'), ama: hex('#f8e040'), bl: hex('#f8f8f8'), piel: hex('#f0c8a0'),
  pelo: hex('#6a3a1a'), tun: hex('#2a5aa8'), tunL: hex('#4a7ad8'), cinto: hex('#5a3a1a'), oro: hex('#f0c040'), calza: hex('#4a4a6a'), bota: hex('#3a2a1a') };
// una nube de bultos de tres tonos (respeta R.recorte)
const nube3 = (x, y, w, [cl, c, cs], k) => {
  const n = Math.max(3, Math.round(w / 7));
  for (let i = 0; i < n; i++) { const bx = x + (i + 0.5) * w / n, r = 2 + ((i * 7 + k * 3) % 3) + (i > 0 && i < n - 1 ? 2 : 0); R.disco(bx, y - r * 0.5 + 1, r + 1, cs); }
  for (let i = 0; i < n; i++) { const bx = x + (i + 0.5) * w / n, r = 2 + ((i * 7 + k * 3) % 3) + (i > 0 && i < n - 1 ? 2 : 0); R.disco(bx, y - r * 0.5, r, c); if (r > 2) R.disco(bx - 1, y - r * 0.5 - 1, r - 2, cl); }
  R.linea(Math.round(x + 2), Math.round(y + 1), Math.round(x + w - 2), Math.round(y + 1), cs);
};
// [x, y, ancho, capa] — capa 0 lejos, tenue y lenta (y 30–36), 1 media (y 47–49), 2 cerca y rápida (y 53–54); nunca tocan el año
const NUBES = [[10, 34, 26, 0], [120, 31, 30, 0], [235, 36, 22, 0], [300, 32, 24, 0], [40, 48, 34, 1], [170, 47, 38, 1], [280, 49, 30, 1], [90, 53, 46, 2], [250, 54, 52, 2]];
const VEL = [0.7, 2.0, 4.2];
const cieloOcaso = (t) => {
  const ps = R.pset;
  for (let y = 0; y <= 61; y++) { const u = y / 100 * 5, i = Math.min(4, Math.floor(u)), f = u - i; for (let x = 0; x < 320; x++) ps(x, y, b4(x, y) < f ? OCASO[i + 1] : OCASO[i]); }
  // estrellas que se encienden arriba (fuera del año y de Atom)
  for (let k = 0; k < 7; k++) { const x = 178 + k * 14 + (k % 2) * 5, y = 5 + (k * 5) % 13; if (Math.sin(t * 2.3 + k * 1.9) > 0.1) ps(x, y, k % 3 ? hex('#c8b8e8') : hex('#f8f0ff')); }
  {
    R.recorte([0, 24, 319, 60]);
    NUBES.forEach(([x, y, w, c], k) => { const W = 400; nube3(-50 + (((x + t * VEL[c]) % W) + W) % W, y, w, NUBES3[c], k); });
    // la bandada en uve que cruza despacio y dos pájaros sueltos
    for (let k = 0; k < 7; k++) { const fila = k === 0 ? 0 : Math.ceil(k / 2), lado = k % 2 ? 1 : -1, a = Math.floor(t * 5 + k) % 2;
      const x = Math.round(330 - ((t * 7) % 420) + fila * 4), y = Math.round(34 + lado * fila * 2 + Math.sin(t * 1.2 + k) * 0.7);
      ps(x, y, hex('#3a2a4a')); ps(x - 1, y - a, hex('#3a2a4a')); ps(x + 1, y - a, hex('#3a2a4a')); }
    for (let k = 0; k < 2; k++) { const x = Math.round(((t * 11 + k * 140) % 380) - 30), y = Math.round(50 + k * 4 + Math.sin(t * 2 + k) * 2), a = Math.floor(t * 7 + k) % 2;
      ps(x, y, hex('#4a2a4a')); ps(x - 1, y - a, hex('#4a2a4a')); ps(x + 1, y - a, hex('#4a2a4a')); ps(x - 2, y - 1 + a, hex('#4a2a4a')); ps(x + 2, y - 1 + a, hex('#4a2a4a')); }
    R.recorte(null);
  }
};
// el pueblo del valle entre los balaustres (y 101–111): casitas con la ventana encendida, la carretera y un coche
const hueco = (x) => x < 4 || ((x - 4) % 14) >= 6;
const pueblo = (t) => {
  const ps = R.pset;
  for (let x = 0; x < 320; x++) if (hueco(x)) ps(x, 110, (x >> 1) % 3 ? hex('#8a6a3a') : hex('#a88050'));
  for (let k = 0; k < 16; k++) { const x = 8 + k * 19 + (k * 7) % 5, y = 103 + (k * 3) % 5; for (let dx = 0; dx < 4; dx++) if (hueco(x + dx)) {
    ps(x + dx, y - 1, dx > 0 && dx < 3 ? hex('#7a3a3a') : hex('#c88a48')); ps(x + dx, y, hex('#5a4a5a')); ps(x + dx, y + 1, hex('#5a4a5a')); }
    if (hueco(x + 1) && Math.sin(t * 1.3 + k * 2.1) > -0.6) ps(x + 1, y, k % 3 ? hex('#ffd860') : hex('#fff0a8')); }
  // el coche con los faros encendidos que recorre la carretera
  const cx = Math.round(((t * 16) % 360) - 20); for (let dx = 0; dx < 5; dx++) if (hueco(cx + dx)) { ps(cx + dx, 108, hex('#c83a3a')); ps(cx + dx, 109, hex('#3a2a2a')); }
  if (hueco(cx + 5)) ps(cx + 5, 108, hex('#fff4c0')); if (hueco(cx + 6)) ps(cx + 6, 108, hex('#f8d870'));
};
// el monitor grande (x 94–198, y 46–128), a contraluz del sol: el canto derecho y el de arriba encendidos
const monitor = (t) => {
  const { rect, pset } = R;
  rect(94, 46, 198, 128, MON.k); rect(95, 47, 197, 127, MON.b); rect(95, 47, 197, 48, MON.l); rect(95, 47, 96, 127, MON.l);
  rect(192, 49, 197, 127, MON.s); rect(95, 124, 197, 127, MON.s); rect(196, 47, 197, 120, MON.rim); rect(120, 47, 196, 47, MON.rim);
  for (let y = 50; y < 124; y += 4) { pset(194, y, MON.d); pset(195, y + 1, MON.d); }
  for (let x = 98; x < 192; x++) for (let y = 49; y < 124; y++) if (((x * 7 + y * 13) % 29) === 0) pset(x, y, MON.s);
  rect(100, 50, 191, 121, MON.k); rect(101, 51, 190, 120, MON.bisel); rect(101, 51, 190, 51, MON.biselL); rect(101, 51, 101, 120, MON.biselL);
  pset(105, 124, Math.sin(t * 4) > -0.5 ? hex('#e84a3a') : hex('#8a2a20')); pset(106, 124, hex('#5a2a20'));
  for (const x of [176, 184]) { R.disco(x, 124, 2, MON.d); pset(x - 1, 123, MON.l); }
  // las rejillas del lado y la sombra del monitor sobre la caja
  for (let x = 112; x < 168; x += 4) pset(x, 125, MON.d);
  for (let x = 92; x <= 206; x++) { pset(x, 129, hex('#9a8e74')); if (x > 96) pset(x, 130, hex('#b4a68a')); }
};
// el caballero de la pantalla (16 px de alto; x, y: los pies; d: dirección; f: paso 0/1; anda)
const caballero = (x, y, d, f, anda) => {
  const ps = R.pset, X = (i) => x + d * i;
  for (let i = -3; i <= 3; i++) ps(x + i, y + 1, J.prS);   // la sombra
  // piernas y botas: en el paso se abren
  const ab = anda ? (f ? 2 : 1) : 1;
  for (let j = -3; j <= -1; j++) { ps(x - ab, j + y, J.calza); ps(x + ab, j + y, J.calza); }
  ps(x - ab, y, J.bota); ps(x - ab - 1, y, J.bota); ps(x + ab, y, J.bota); ps(x + ab + 1, y, J.bota);
  // la túnica con su cinturón y la hebilla
