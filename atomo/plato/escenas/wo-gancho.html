// WO-GANCHO (frases 1–2), sin cartela; año 1977 salvo los planos de hoy (2026). Siete planos:

// 4. («Almost fifty years later», 15,26) hoy: la pantalla con la foto del listado; una mano teclea y el ordenador de

//    no T.oreja): el muro plano enorme, de frente y alejándose a la derecha (chapas de malla, vigas, remaches, óxido, la
//    escalerilla, chapas que el sol enciende una tras otra), el sol que se pone tras su canto, charcos, desagüe, la caja roja y el
//    cable; un técnico diminuto sube por la escalerilla todo el plano (la escala); en «three football fields» salen
//    tres campos en el cielo; antes de «volunteers» ya cruzan la hierba del borde, por la senda y el hueco de la cerca,
//    dos voluntarios (ella delante con la linterna, él con el termo), se paran en el metal y ella enciende la linterna en «volunteers»; sonríen en «free». Nubes en tres capas, pájaros
//    y la hierba del borde que se mece.
// 6. («a line of six», 24,25) la escala sobre la mesa: un lápiz toca los seis caracteres, las barras crecen y la
//    calculadora cuenta; en «isn't a message» un sobre tachado.
// 7. («who reopened», 27,97) el laboratorio de Puerto Rico hoy (la pared alta, llena: bandeja de cables, termostato,
//    póster de Arecibo, reloj, balda con la maqueta de la antena y un receptor con LED): una científica entra con una
//    caja de listados y la deja, Méndez saca uno en «printouts»; en «look at that night» los dos van hacia el monitor,
//    ella señala y él levanta el listado; la pantalla marca la secuencia con corchetes que parpadean y en «one more

import * as T from '/atomo/plato/escenas/wo-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('wo-gancho');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
// los instantes, de las palabras de la voz inglesa: tw (frase «wow», 0,5–14,41 s) y tc (frase «camino», 15,26–32,77 s)
const tw = (s) => en('wow', (s - 0.5) / 13.907), tc = (s) => en('camino', (s - 15.263) / 17.51);
const P2 = tw(4.42), P3 = tw(9.36), P4 = tc(15.26), P5 = tc(19.36), P6 = tc(24.25), P7 = tc(27.97);
const K = hex('#17151d'), BL = hex('#f6f2ea'), ROJO = hex('#d8402c'), ease = (u) => u * u * (3 - 2 * u);
const destello = (x, y, r, c = BL) => { x = Math.round(x); y = Math.round(y); for (let i = -r; i <= r; i++) { R.pset(x + i, y, c); R.pset(x, y + i, c); } };
// un termo de los setenta (rojo de cuadros con el tapón blanco) en la mano
const termo = (x, y) => { x = Math.round(x); y = Math.round(y); R.rect(x - 2, y - 9, x + 2, y + 1, K); R.rect(x - 1, y - 7, x + 1, y, hex('#c8382c')); R.pset(x - 1, y - 5, hex('#f0d8a0')); R.pset(x + 1, y - 3, hex('#f0d8a0')); R.pset(x, y - 6, hex('#8a2420')); R.rect(x - 1, y - 8, x + 1, y - 8, hex('#e8e8ec')); };
// ── 1 · la gran oreja de noche ───────────────────────────────────────────────────────────────────────────────────
const ESTRELLA = [196, 30], LABIO = [262, 70], CARRO = [206, 120], llega = tw(3.88);
const p1 = (t) => {
  const o = { encuadre: 'campo', luz: 'noche' };
  T.oreja(R, t, o);
  // el voluntario sale de la caseta con el termo, camina hacia el campo y bebe (rutina: no sabe nada)
  const w = tramo(t, tw(0.5), tw(2.6)), x = Math.round(lerp(110, 172, ease(w))), bebe = tramo(t, tw(2.9), tw(3.3)) - tramo(t, tw(3.9), tw(4.3));
  const a = R.actor(EL.voluntario1WO, x, 158, t, { dir: 1, anda: w > 0 && w < 1, sostiene: bebe > 0.5 ? [x + 11, 136] : [x + 13, 145] });
  if (a && a.mano) termo(a.mano[0], a.mano[1] + 2);
  // la linterna que lleva colgada alumbra el suelo delante
  if (w < 1) for (let k = 0; k < 18; k++) { const yy = 156 + (k % 3), xx = x + 16 + k; if ((xx + yy + Math.floor(t * 8)) % 3 === 0) R.pset(xx, yy, hex('#e8d890')); }

  const tit = tramo(t, tw(3.0), tw(3.4)) - tramo(t, tw(4.2), tw(4.4)); if (tit > 0) destello(ESTRELLA[0], ESTRELLA[1], Math.round(1 + tit * 3), Math.floor(t * 10) % 2 ? BL : hex('#bfe0ff'));
  for (let k = 0; k < 3; k++) {
    const u = tramo(t, tw(3.3) + k * 0.18, llega + k * 0.18), v = tramo(t, llega + k * 0.18, llega + 0.4 + k * 0.18);
    const arco = (cx, cy, a0, r, c) => { for (let a2 = -1; a2 <= 1; a2 += 0.08) for (const d of [0, 1]) R.pset(Math.round(cx + Math.cos(a2 + a0) * (r + d)), Math.round(cy + Math.sin(a2 + a0) * (r + d)), d ? hex('#4a7ab8') : c); };
    if (u > 0 && u < 1) arco(lerp(ESTRELLA[0], LABIO[0], u), lerp(ESTRELLA[1], LABIO[1], u), 1.2, 6 + k, hex('#bfe8ff'));

  }
  const piloto = t > llega + 0.4 && Math.floor(t * 6) % 2; if (piloto) { R.disco(CARRO[0], CARRO[1], 2, hex('#ff5a3a')); R.pset(CARRO[0], CARRO[1] - 1, BL); }
  T.orejaDelante(R, t, o);
};
// ── 2 · la impresora de noche: sale 6EQUJ5 ─────────────────────────────────────────────────────────────────────
const SETENTA = tw(5.6), NUNCA = tw(7.3), APAGA = tw(8.4);
const p2 = (t) => {
  const o = { camara: 'impresora', luz: 'noche', seqT: tw(5.0), velocidad: 2 };
  const g = T.sala(R, t, o);
  // el 72 con su esfera de segundos que se llena (y se apaga en «never heard it again»)
  const e = tramo(t, SETENTA, SETENTA + 0.3), f = 1 - tramo(t, APAGA, APAGA + 0.5);
  if (e > 0 && f > 0) {

    R.disco(cx, cy, r + 2, K); R.disco(cx, cy, r + 1, hex('#e8e2d0')); R.disco(cx, cy, r - 1, hex('#fbf6e8'));
    for (let a = 0; a < lleno * 6.283; a += 0.04) for (let q = 3; q < r - 1; q++) if ((q + Math.round(a * 20)) % 2 === 0) R.pset(Math.round(cx + Math.sin(a) * q), Math.round(cy - Math.cos(a) * q), hex('#f0c060'));
    for (let k = 0; k < 12; k++) { const a = k / 12 * 6.283; R.pset(Math.round(cx + Math.sin(a) * (r - 1)), Math.round(cy - Math.cos(a) * (r - 1)), K); }

    R.rect(cx - 2, cy - r - 5, cx + 2, cy - r - 2, K); R.rect(cx - 1, cy - r - 4, cx + 1, cy - r - 3, hex('#c8c8cc'));
    if (f > 0.5 || Math.floor(t * 10) % 2) R.numero('72', cx, Math.round(lerp(cy + 40, cy + 34, ease(e))), { tam: 16, centro: true });
  }

  T.salaDelante(R, t, o);

// ── 3 · el círculo rojo y el «Wow!» (el plano del golpe) ─────────────────────────────────────────────────────────
const RODEA = tw(9.96), ESCRIBE = tw(11.66), WOW = tw(13.71), WOWFIN = en('wow', 1);
const p3 = (t) => {
  const g = T.listado(R, t, { encuadre: 'mesa', camara: 'listado', luz: 'noche', boli: 3, resalta: tramo(t, P3 + 0.05, P3 + 0.5),
    rodea: ease(tramo(t, RODEA - 0.05, RODEA + 1.25)), wow: tramo(t, ESCRIBE, WOW),

    retira: tramo(t, WOWFIN, WOWFIN + 0.6) });

  const p = tramo(t, WOW - 0.05, WOWFIN + 0.5);
  if (p > 0 && p < 1 && g.anillo) {
    const [cx, cy, rx, ry] = g.anillo;
    for (let k = 0; k < 2; k++) { const q = Math.min(1, p * 1.4 - k * 0.25); if (q <= 0) continue; const s = 1 + q * 0.7;
      for (let a = 0; a < 6.283; a += 0.03) if ((Math.round(a * 30) + k) % 3 !== 0) { const X = Math.round(cx + Math.cos(a) * (rx + 3) * s), Y = Math.round(cy + Math.sin(a) * (ry + 3) * Math.min(s, 1.25)); R.pset(X, Y, q < 0.6 ? hex('#ff5a3a') : hex('#f09a80')); if (q < 0.5) R.pset(X + 1, Y, hex('#ffd0b0')); } }
    if (g.wow && p < 0.5) for (let k = 0; k < 6; k++) { const a = k * 1.047 + p * 2, q = 6 + p * 22; R.pset(Math.round(g.wow[0] + Math.cos(a) * q), Math.round(g.wow[1] - 8 + Math.sin(a) * q * 0.6), hex('#ffd890')); }
  }
};
// ── 4 · hoy: la pantalla con el listado y el ordenador de 1977 imitado ──────────────────────────────────────────
const SIN = tc(16.86), RATON = tc(16.8), CLIC = tc(18.0);
const p4 = (t) => {
  const o = { encuadre: 'pantalla', codigo: tramo(t, P4 + 0.3, P4 + 3.6), alto: 0 };
  T.archivo(R, t, o);
  // la mano teclea (de 15,4 a 16,7) y luego va al ratón y hace clic
  const tec = t < RATON, va = ease(tramo(t, RATON, RATON + 0.7));
  let mx = lerp(150 + (Math.floor(t * 7) % 3) * 6, 214, va), my = lerp(166 - (tec && Math.floor(t * 11) % 2 ? 2 : 0), 170, va);
  if (t > CLIC && t < CLIC + 0.2) my += 1;
  T.brazo(R, Math.round(mx) + 40, 206, Math.round(mx), Math.round(my), '#3a5a8a', -1, { codo: [Math.round(mx) + 26, 190] });
  // «unexplained»: un «?» grande sobre la curva, que late
  const q = tramo(t, SIN, SIN + 0.25); if (q > 0) { const y = Math.round(lerp(96, 66, ease(q))) + Math.round(Math.sin(t * 5) * 1.5);
    R.disco(153, y + 6, 13, K); R.disco(153, y + 6, 12, BL); R.poligono([[146, y + 16], [152, y + 17], [143, y + 23]], K); R.poligono([[147, y + 16], [151, y + 17], [145, y + 21]], BL); R.icono('?', 147, y, hex('#3a6ac8'), null, 2); }
  T.archivoDelante(R, t, o);
};
// ── 5 · contrapicado desde el borde del suelo de metal: el muro plano, enorme, al atardecer ─────────────────────────
// la cámara, baja, en el borde del suelo; el muro plano entra de frente y se aleja a la derecha hasta su punto de fuga
// (VX, VY), fuera del cuadro. Columna x del muro: profundidad z = 440 / (VX − x) (1 en la esquina de cerca); su pie,
// en y = VY + 32/z, y su borde de arriba, en y = VY − 96/z (en x −10, y 22: el año queda en cielo tranquilo). Acaba en
// z 3,2 (x ≈ 292); detrás, el campo lejano y el sol que se pone. Delante, una franja de suelo de metal y, a la
// derecha, la hierba del borde, por donde llegan los voluntarios.
const CAMPOS = [tc(20.62), tc(20.9), tc(21.24)], VOLUNTARIOS = tc(22.16), GRATIS = tc(23.6);
const VX = 430, VY = 118, ZFIN = 3.2, SUELO5 = 168;
const zMuro = (x) => 440 / (VX - x), yPie = (z) => VY + 32 / z, yTope = (z) => VY - 96 / z;
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16), bay = (x, y) => B4[(y & 3) * 4 + (x & 3)];
const rampa = (r, v, x, y) => { v = Math.max(0, Math.min(r.length - 1.001, v)); const i = Math.floor(v); return v - i > bay(x, y) ? r[i + 1] : r[i]; };
const hs = (a, b, c = 0) => { let n = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 1442695041)) | 0; n = Math.imul(n ^ (n >>> 13), 1274126177); n ^= n >>> 16; return (n >>> 0) / 4294967296; };
const CIELO5 = ['#2a2048', '#3a2a5c', '#52346c', '#6e4278', '#90507e', '#b45e80', '#d2727e', '#e88c78', '#f4aa78', '#f8c888', '#fce2a4'].map(hex);
const MURO5 = ['#2e2236', '#46344c', '#5e4a62', '#786278', '#947a8a', '#b09296', '#cca89c', '#e4c0a4', '#f6dab4'].map(hex);
const METAL5 = ['#241a30', '#382844', '#503656', '#6a4462', '#865468', '#a2666c', '#bc7c70', '#d49676', '#e8b282', '#f6d09a'].map(hex);
const HIERBA5 = ['#2a2a22', '#3e3a26', '#56502c', '#6e6830', '#8a7e38', '#a89448', '#c8ac5c'].map(hex);
const HORM5 = ['#4a3e48', '#6a5a62', '#8a7878', '#a8948c', '#c4aca0'].map(hex);
const OXIDO = [hex('#6a3424'), hex('#8e4a2c'), hex('#b0663a')];
const SOL5 = [308, 112];
const CIELOM = new Uint8Array(320 * 180), MUROM = new Uint8Array(320 * 180);   // 1 = cielo (detrás van nubes y pájaros) · 1 = cara del muro
const CHAPA = new Int16Array(320 * 180).fill(-1);   // la chapa (columna · 16 + fila) de cada píxel del muro (−1 en juntas, vigas y remaches)
const cieloIdx = (x, y) => Math.max(0, y) / VY * 8.6 + Math.max(0, 2.2 - Math.hypot(x - SOL5[0], (y - SOL5[1]) * 1.5) / 34);
const fijo5 = (() => { let b = null; return (f) => { if (!b) { b = R.nuevo(); const prev = R.usar(b); f(); R.usar(prev); } R.copiar(b); }; })();
// un píxel de la cara del muro: chapas de malla en rejilla (columnas de profundidad z, diez filas), juntas, una viga de
// acero cada tres columnas con su canto al sol, remaches a lo largo de las juntas, chapas con brillo y churretes de óxido
const muroPx = (x, y, z) => {
  const v = (yPie(z) - y) / (128 / z), cz = (z - 1) / 0.12, ci = Math.floor(cz), pw = 53 / (z * z), px = (cz - ci) * pw;
  const rv = v * 10, ri = Math.floor(rv), ph = 12.8 / z, py = (rv - ri) * ph, arriba = ph - py;
  if (ci % 3 === 0 && px < 2.6) return px < 1 ? MURO5[0] : px < 1.8 ? MURO5[3] : MURO5[7];   // la viga
  if (px < 1 || py < 1) return MURO5[1];                                                    // la junta
  if (pw > 3 && px > 2.4) CHAPA[y * 320 + x] = ci * 16 + ri;
  if (pw > 7 && px < 2.4 && Math.floor(py) % 3 === 1) return MURO5[8];                       // remache al sol
  if (pw > 7 && px < 2.4 && Math.floor(py) % 3 === 2) return MURO5[2];                       // y su sombra
  const hp = hs(ci, ri, 5);
  if (hp < 0.3 && pw > 4) {                                                                   // el óxido que chorrea de la junta de arriba
    const sx = (0.2 + hs(ci, ri, 7) * 0.6) * pw, largo = ph * (0.35 + hs(ci, ri, 8) * 0.6);
    if (Math.abs(px - sx) < 1 && arriba < largo && bay(x, y) < 1.15 - arriba / largo) return OXIDO[arriba < largo * 0.4 ? 1 : 0];
    if (Math.abs(px - sx) < 2 && arriba < 2) return OXIDO[2];
  }
  let l = 2.4 + hp * 1.3 + v * 0.9 + (z - 1) * 0.9 + (hp > 0.86 ? 1.6 : 0);                   // más luz hacia el sol y arriba
  if ((x * 3 + y * 2) % 5 === 0) l -= 1.1;                                                    // los agujeros de la malla
  if (py < 2) l -= 0.8;                                                                       // sombra bajo la junta
  return rampa(MURO5, l, x, y);

// un píxel del suelo de metal: refleja el cielo (más oscuro hacia la cámara), losas con juntas y tornillos, rozaduras y
// la estela del sol; a la izquierda, la zapata de hormigón del pie del muro
const sueloPx = (x, y, z, Xw) => {
  if (Xw < 9) return rampa(HORM5, 1.4 + hs(x >> 1, y, 3) * 1.4 - (Xw < 2 ? 1.2 : 0) + (Xw > 7.5 ? 1 : 0), x, y);
  const cx = (Xw - 9) / 30, ci = Math.floor(cx), lw = 30 / z, fx = (cx - ci) * lw;
  const cz = z / 0.22, ri = Math.floor(cz), lh = 7 / (z * z), fy = (cz - ri) * lh;
  if (fx < 1 || fy < Math.min(1, lh * 0.34)) return METAL5[1];

  let l = cieloIdx(x, 2 * VY - y) * 0.95 - 1.6 + hs(ci, ri, 9) * 0.9;
  if (hs(x >> 2, y, 11) < 0.05) l -= 1;                                                       // rozaduras

};
const lejosPx = (x, y) => { const d = y - VY; if (d <= 0) return null; const banda = ((x + d * 9) >> 3) % 3; return rampa(HIERBA5, 1.2 + banda * 0.7 + (10 - d) * 0.12 + hs(x, y, 4) * 0.6, x, y); };
const hierbaPx = (x, y, z) => rampa(HIERBA5, 2 + hs(x, y >> 1, 12) * 1.6 + ((x * 7 + y * 3) % 6 === 0 ? 1.4 : 0) - z * 0.3 + (hs(x >> 1, y >> 1, 13) < 0.04 ? 2.5 : 0), x, y);
const pintaFondo5 = () => {
  const { pset, rect, linea, disco } = R;
