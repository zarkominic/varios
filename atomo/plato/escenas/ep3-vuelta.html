      sombra(b[0] + 34 * SC.k, b[1] + 26 * SC.k, 190 * SC.k, 46 * SC.k, 0.5);
    }
    if (TR && !TR.dentro) {
      // la sombra del terrón: en el mapa, debajo del sitio donde se posa (crece y se aprieta al bajar)
      const posado = prog(ts, T.salta[0] + 0.35, T.posa);
      const c = zm(CIUDAD), zz = ZOOM(ts);
      sombra(c[0] + 16 * zz, c[1] + 10 * zz, mix(30, 70, posado) * zz, mix(10, 24, posado) * zz, 0.55 * ss(0, 1, posado));
    }
    P.limpiar();
    atomo(ts, { claro: kS });
    const fl = destello4(ts);
    if (!quieto4 || fl > 0.001) reglaEn(zr, { rango: fl > 0.01 ? { de: 4, a: 4, marcas: 1, madera: 1.1 * fl } : null, lupa: 0.5 + 0.22 * fl, toque: enSalto(ts) });
    else regla = F('reg4_' + (n % 3));
    if (SC.k > 0.01) cajon(P, I.CAJ, { ...SC.o, abierto: SC.ab, toque: (SC.k > 0.02 && SC.k < 0.99) || (SC.ab > 0.01 && SC.ab < 1) });
    if (TR && (SC.ab > 0.05 || !TR.dentro) && (TR.dentro ? SC.k > 0.5 : true)) terron(P, I.TER, { pos: TR.pos, escala: TR.escala, rot: TR.rot, sq: TR.sq, toque: TR.vuela });
    P.render(nP, { fondo: false }); pegarGL();
    luzCajon(ts, SC);
    // el terrón (la humanidad entera) brilla un poco, cálido, mientras vuela y posado
    if (TR && !TR.dentro) {
      const p = pant(TR.pos), kg = 0.5 + 0.12 * Math.sin(ts * 2.6);
      g.save(); g.globalCompositeOperation = 'screen';
      const Rg = 120 * ZOOM(ts), h = g.createRadialGradient(p[0], p[1], 0, p[0], p[1], Rg);
      h.addColorStop(0, `rgba(255,232,190,${0.22 * kg})`); h.addColorStop(1, 'rgba(255,190,120,0)');
      g.fillStyle = h; g.beginPath(); g.arc(p[0], p[1], Rg, 0, 2 * Math.PI); g.fill();
      g.restore();
    }
  } else {
    // C · D · la estrella grande en corte, sin ciudad
    ULTIMO = planoEstrella(ts, n);
    const kt = kTenue(ts), fr4 = F('reg4_' + (n % 3));
    if (kt < 0.002) regla = fr4;
    else {
      g.save(); g.globalAlpha = 1 - kt; g.drawImage(fr4, 0, 0, W, H);
      g.globalAlpha = 0.5 * kt; g.drawImage(F('reg4Tenue'), 0, 0, W, H); g.restore();
    }
  }
  if (regla) g.drawImage(regla, 0, 0, W, H);
  parpadeo(nP);
  POST.aplicar(g, nP);
}
window.__fin = {

  // el último fotograma (el primero de ep3-neutrones)
  final: {
    fondo: { foto: 'fondoCielo(mundo, 932, { somA })', somA: SOM_A },
    gigante: { centro: GE.c, radio: GE.R, z: GE.z, corte: 1, apaga: 0.9, hunde: 1, fotos: 'gE_0 / gE_1 (n 9720 / 9721), hueco 8 del plató',
      halo: 'halo(gigante, k = 1 − 0,72 · apaga) debajo; encima, halo(neutrones, dentro: false) de la bola, radio 0,075 · R' },
    regla: { e: 4, foto: 'n = 9400 + (n % 3)' },
    atomo: (() => { const S = estadoAtom(QUIETO); return { sx: S.sx, sy: S.sy, tz: S.tz, ta: FIN_SOL.ta + tabla(TA, QUIETO), escala: A_ESC, yaw: -0.15 + A_YAW + 0.08 * Math.sin(S.tz * 0.5), pitch: 0.06 - A_PITCH }; })(),
  },
};
window.__ultimo = () => ULTIMO;
marcaCarga('listo');
E.iniciar(dibujar, { paso: 1 / 12 });
