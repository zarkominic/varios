<script type="module">
// DO-ESCUDO (frases 13–14), sin cartela. Tres planos:
// 1. el acantilado del lago visto desde el agua, en contrapicado (fondo local): horizonte bajo con el faro y la otra
//    orilla, la peña a la derecha y el agua de cerca con nenúfares, espadañas y la canoa amarrada; Sam llega por lo alto de
//    la peña y levanta el escudo, que brilla («the shield has changed hands»); en el cielo crece un árbol de luz que se
//    ramifica («time can branch»), con su reflejo en el agua (2019);
// 2. un plató de rodaje (fondo local, 2025): paredes de espuma, parrilla con siete focos y cables en comba, croma colgado
//    con pinzas, pliegues y costuras, ventilador de viento, escalera, baúles y silla del director; la cámara avanza por la
//    vía empujada por el maquinista, el claquetista da la claqueta («Doomsday»), Steve entra hasta su marca con la pértiga
//    siguiéndole («Chris Evans returns») y el equipo aplaude («Steve Rogers»);
// 3. el cine de frente: en la pantalla, el martillo vuela hasta la mano de Steve («flies into his hand») y las
//    palomitas saltan de emoción (2025).
// Efectos: ola, pisada, dos brillos y dos whoosh en la orilla; claqueta y aplauso en el plató; trueno, whoosh, golpe y
// público en el cine (~52 % del tiempo con efectos, medido como medir-sonido.py).
import * as T from '/atomo/plato/escenas/do-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('do-escudo');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], bay = (x, y) => (BAY[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
const KK = hex('#1a1014'), BL = 0xffffffff;
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
// fondos fijos en búferes: se pintan una vez (con prev = R.usar(b) y vuelta) y se copian enteros (fondo) o solo lo pintado (pegar)
const BUF = {};
const bufer = (clave, dibuja) => { if (!BUF[clave]) { const b = R.nuevo(), prev = R.usar(b); dibuja(); R.usar(prev); BUF[clave] = b; } return BUF[clave]; };
const fondo = (clave, dibuja) => R.copiar(bufer(clave, dibuja));
const pegar = (clave, dibuja) => { const b = bufer(clave, dibuja), B = R.buf; for (let i = 0; i < 57600; i++) { const c = b[i]; if (c) B[i] = c; } };
// rampa tramada de arriba abajo en [x0..x1]×[y0..y1]
const rampa = (x0, y0, x1, y1, cols) => { const n = cols.length - 1; for (let y = y0; y <= y1; y++) { const u = (y - y0) / Math.max(1, y1 - y0) * n, i = Math.min(n - 1, Math.floor(u)), f = u - i; for (let x = x0; x <= x1; x++) R.pset(x, y, cols[f > bay(x, y) ? i + 1 : i]); } };
// caja con contorno, cara, luz arriba-izquierda y sombra abajo-derecha
const caja = (x0, y0, x1, y1, c, cl, cs) => { R.rect(x0, y0, x1, y1, KK); R.rect(x0 + 1, y0 + 1, x1 - 1, y1 - 1, c); R.rect(x0 + 1, y0 + 1, x1 - 1, y0 + 1, cl); R.rect(x0 + 1, y0 + 1, x0 + 1, y1 - 1, cl); R.rect(x0 + 1, y1 - 1, x1 - 1, y1 - 1, cs); R.rect(x1 - 1, y0 + 1, x1 - 1, y1 - 1, cs); };
// gema facetada de radio s en (x, y); brillo > 0: destellos alrededor
const gema = (x, y, c, s = 3, brillo = 0) => { const cl = mez(c, BL, 0.5), cs = mez(c, KK, 0.45);
  for (let j = -s - 1; j <= s + 1; j++) for (let i = -s - 1; i <= s + 1; i++) { const d = Math.abs(i) + Math.abs(j); if (d > s + 1) continue; R.pset(x + i, y + j, d === s + 1 ? KK : (i + j < 0 ? cl : i + j > 1 ? cs : c)); }
  R.pset(x - 1, y - 1, BL); if (s > 3) R.pset(x - 2, y - 1, BL);
  if (brillo > 0) { const r = Math.round(s + 3 + brillo * 3); for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 + brillo; R.pset(Math.round(x + Math.cos(a) * r), Math.round(y + Math.sin(a) * r), k % 2 ? cl : BL); } } };
const CORA = ['.kk.kk.', 'k##k##k', 'k#h####k'.slice(0, 7), 'k#####k', '.k###k.', '..k#k..', '...k...'];
const corazon = (x, y, c, s = 1) => CORA.forEach((f, j) => { for (let i = 0; i < 7; i++) { const ch = f[i]; if (ch === '.') continue; R.rect(x - 3 * s + i * s, y - 3 * s + j * s, x - 3 * s + i * s + s - 1, y - 3 * s + j * s + s - 1, ch === 'k' ? KK : ch === 'h' ? mez(c, BL, 0.6) : c); } });
// los trajes cuánticos de los Vengadores: blanco con franjas rojas
const QS = { C: hex('#eeeae2'), c: hex('#b4b0a8'), W: hex('#eeeae2'), F: hex('#c8303a'), G: hex('#c8303a'), I: hex('#2a2430'), n: hex('#2a2430'), X: hex('#c8303a'), r: hex('#c8303a') };
// el maletín plateado (en la mano: (x, y) = el asa)
const maletin = (x, y) => { R.rect(x - 2, y - 1, x + 2, y - 1, KK); R.pset(x - 2, y, KK); R.pset(x + 2, y, KK); caja(x - 6, y, x + 6, y + 8, hex('#c0c4cc'), hex('#eef0f4'), hex('#7a7e88')); R.rect(x - 5, y + 3, x + 5, y + 3, hex('#8a8e98')); R.pset(x - 3, y + 2, hex('#e8b830')); R.pset(x + 3, y + 2, hex('#e8b830')); };
const GEMAS = ['#9a4ae8', '#3a8ae8', '#e83a3a', '#e8903a', '#3ac85a', '#f0e040'].map(hex);
// nube de atardecer de tres tonos
const nubeT = (cx, cy, w, s, b, l) => { const bolas = [[0, 0, w * 0.3], [-w * 0.3, w * 0.07, w * 0.22], [w * 0.28, w * 0.06, w * 0.24], [-w * 0.1, -w * 0.12, w * 0.24]];
  for (const [dx, dy, r] of bolas) R.disco(Math.round(cx + dx), Math.round(cy + dy + 1), Math.round(r), s);
  for (const [dx, dy, r] of bolas) R.disco(Math.round(cx + dx), Math.round(cy + dy - 1), Math.round(r * 0.9), b);
  for (const [dx, dy, r] of bolas) R.disco(Math.round(cx + dx + 1), Math.round(cy + dy + 1 + r * 0.35), Math.round(r * 0.55), l); };
// pájaro en uve que aletea (silueta)
const ave = (x, y, t, k, c) => { const a = Math.sin(t * 8 + k) > 0 ? 1 : 0; R.pset(x, y, c); R.pset(x - 1, y - a, c); R.pset(x - 2, y - 1 - a, c); R.pset(x + 1, y - a, c); R.pset(x + 2, y - 1 - a, c); };

const Mn = (f) => en('manos', f), Mt = (f) => en('martillo', f);
const P2 = Mt(-0.067), P3 = Mt(0.571);
const dos = Mn(0.076), vuelven = Mn(0.335), escudo = Mn(0.535), manos = Mn(0.636), tiempo = Mn(0.83), rama = Mn(0.907);
const detalle = Mt(0.05), doomsday = Mt(0.192), evans = Mt(0.314), vuelve = Mt(0.367), rogers = Mt(0.458);
const trailer = Mt(0.676), martillo = Mt(0.808), vuela = Mt(0.834), mano = Mt(0.939);

// 1 · el acantilado del lago visto desde el agua, en contrapicado (fondo local): horizonte bajo, cielo grande, la peña a
// la derecha con Sam arriba y el agua de cerca con nenúfares, espadañas y la canoa amarrada
const HOR = 136;
const PENA = [[146, 140], [152, 130], [158, 122], [163, 112], [169, 102], [176, 93], [184, 86], [194, 81], [204, 79], [230, 78], [260, 77], [290, 75], [320, 74]];
const pena = (x) => { if (x < PENA[0][0]) return 999; for (let k = 1; k < PENA.length; k++) { const [x0, y0] = PENA[k - 1], [x1, y1] = PENA[k]; if (x <= x1) return Math.round(y0 + (y1 - y0) * (x - x0) / (x1 - x0)); } return 74; };
const orilla = () => {
  // el cielo tramado del anochecer
  rampa(0, 0, 319, HOR, ['#16123a', '#221a4a', '#32225a', '#4a2a6a', '#7a3674', '#a8446c', '#d8645c', '#f49a5c'].map(hex));
  // el resplandor del sol que se acaba de poner, a la izquierda, y sus rayos
  for (let r = 34; r > 0; r -= 2) R.disco(58, HOR, r, mez(hex('#f49a5c'), hex('#fff0b0'), 1 - r / 34));
  for (let k = 0; k < 7; k++) { const a = Math.PI + 0.25 + k * 0.44; for (let d = 38; d < 70; d++) { const x = Math.round(58 + Math.cos(a) * d), y = Math.round(HOR + Math.sin(a) * d * 0.8); if (bay(x, y) < 0.3 && y < HOR - 2 && !(x > 18 && x < 172 && y < 16)) R.pset(x, y, hex('#f0a070')); } }
  // la otra orilla, lejos y baja: lomas, pinitos, un faro y casitas con la luz encendida
  for (let x = 0; x < 160; x++) { const y1 = Math.round(126 + Math.sin(x * 0.04 + 1) * 3 + Math.sin(x * 0.13) * 1.5);
    for (let y = y1; y <= HOR; y++) R.pset(x, y, y === y1 ? hex('#8a4a72') : bay(x, y) > 0.6 ? hex('#4a2a56') : hex('#3e2450')); }
  for (let k = 0; k < 34; k++) { const x = k * 5 + Math.round(hh(k, 8) * 3), h = 3 + Math.round(hh(k, 9) * 5); if (x < 160) R.poligono([[x - 2, 131], [x + 2, 131], [x, 128 - h]], hex('#2a1a38')); }
  for (const [x, y] of [[74, 131], [112, 132], [130, 130]]) { R.rect(x, y, x + 5, y + 3, hex('#2a1a30')); R.poligono([[x - 1, y], [x + 6, y], [x + 2, y - 3]], hex('#1e1226')); R.pset(x + 2, y + 1, hex('#ffd860')); }
  caja(26, 116, 31, 132, hex('#e8e0d8'), BL, hex('#a8a0a8')); R.rect(27, 121, 30, 122, hex('#c83a3a')); R.rect(27, 126, 30, 127, hex('#c83a3a')); R.rect(25, 112, 32, 116, KK); R.rect(26, 113, 31, 115, hex('#ffe890'));
  // la peña: cara iluminada por el ocaso a la izquierda, estratos, grietas y musgo
  for (let x = 146; x < 320; x++) { const y0 = pena(x);
    for (let y = y0; y <= HOR + 4; y++) { const d = y - y0, cara = x < 200 ? (200 - x) / 54 : 0, est = (y + Math.round(Math.sin(x * 0.09) * 2)) % 9, n = hh(x, y, 3);
      let c = est === 0 ? hex('#22182c') : est === 1 ? hex('#5a4268') : (n + cara * 0.5 - (x - 146) / 400) > 0.62 ? hex('#5a3e62') : bay(x, y) > 0.55 ? hex('#3a2a46') : hex('#30223c');
      if (d === 0) c = hex('#e8906a'); else if (d === 1 && x < 220) c = hex('#b0606a');
      else if (cara > 0.25 && n < cara * 0.35) c = hex('#a85a6a');
      R.pset(x, y, c); } }
  for (const [x0, y0, l] of [[180, 96, 22], [214, 84, 30], [248, 82, 40], [284, 80, 34], [300, 96, 26]]) { let x = x0, y = y0; for (let k = 0; k < l; k++) { R.pset(x, y, hex('#160e1e')); R.pset(x + 1, y, hex('#6a5070')); y++; if (hh(k, x0) > 0.6) x += hh(k, y0) > 0.5 ? 1 : -1; } }
  for (let k = 0; k < 70; k++) { const x = 170 + Math.round(hh(k, 40) * 150), y = pena(x) + 1 + Math.round(hh(k, 41) * 14); if (x < 320) { R.pset(x, y, hex('#3a5a34')); R.pset(x + 1, y, hex('#4a6a3a')); } }
  // el borde de arriba con hierba, un arbusto y dos pinos (por debajo de la zona de Atom)
  for (let x = 186; x < 320; x += 2) { const y = pena(x); R.linea(x, y, x + (x % 3) - 1, y - 2 - (x % 4 === 0 ? 1 : 0), hex('#4a6a34')); }
  const pino = (x, y, h) => { R.rect(x - 1, y - 6, x + 1, y, hex('#3a2418')); for (let k = 0; k < 5; k++) { const yy = y - 6 - k * (h / 6), w = 9 - k * 1.7; R.poligono([[x - w, yy], [x + w, yy], [x, yy - h / 4]], hex('#16241a')); R.linea(x, yy - h / 4, x - w, yy, hex('#c86a5a')); for (let i = 1; i < w; i += 3) R.pset(x + i, yy - 1, hex('#24382a')); } };
  pino(246, 77, 26); pino(300, 75, 28);
  for (let k = 0; k < 7; k++) R.disco(268 + k * 3, 74 - (k % 2), 3, k % 2 ? hex('#22362a') : hex('#2a4430'));
  // el agua: refleja el cielo al revés, y bajo la peña su reflejo oscuro y ondulado
  rampa(0, HOR + 1, 319, 179, ['#f08a5c', '#c85a66', '#8a3a72', '#5a2e66', '#32224e', '#1e1838'].map(hex));
  for (let y = HOR + 1; y < 180; y++) { const o = Math.round(Math.sin(y * 0.9) * 2); for (let x = 146; x < 320; x++) { const ym = 2 * HOR - y + 2; const pm = pena(x + o); if (pm <= ym || ym <= 74) { const st = (Math.floor(x / 11 + Math.sin(y * 0.7) * 1.5) + y * 3) % 7; R.pset(x, y, Math.abs(pm - ym) < 2 ? hex('#a8586a') : st === 0 ? hex('#4a3050') : st === 3 && bay(x, y) < 0.5 ? hex('#3a2a46') : bay(x, y) > 0.5 ? hex('#22182e') : hex('#1c1428')); } } }
  for (let y = HOR + 1; y < HOR + 5; y++) for (let x = 146; x < 320; x++) if (bay(x, y) < 0.4) R.pset(x, y, hex('#a85a6a'));
};
const ramaLuz = (x, y, a, l, d, u, lista) => { if (d > 5 || u <= 0) return; const f = Math.min(1, u), x2 = x + Math.cos(a) * l * f, y2 = y + Math.sin(a) * l * f; lista.push([x, y, x2, y2, d]);
  if (u > 1) for (const s of [-1, 1]) ramaLuz(x2, y2, a + s * (0.42 + hh(d, s + x) * 0.3), l * 0.72, d + 1, u - 1, lista); };
const p1 = (t) => {
  fondo('orilla', orilla);
  // estrellas que titilan (fuera de la barra del año y de la zona de Atom), nubes de tres tonos a tres velocidades y pájaros
  for (let k = 0; k < 40; k++) { const x = Math.round(hh(k, 5) * 320), y = Math.round(hh(k, 6) * 64) + 2; if (!(x > 16 && x < 174 && y < 17) && !(x > 274 && y < 48) && Math.sin(t * 2 + k * 1.3) > -0.6) R.pset(x, y, k % 5 ? hex('#c8c0f0') : BL); }
  R.disco(196, 30, 1, hex('#fff4d0')); if (Math.sin(t * 3) > 0) { R.pset(194, 30, hex('#fff4d0')); R.pset(198, 30, hex('#fff4d0')); }
  for (const [x0, y, w, v] of [[20, 40, 48, 1.1], [150, 58, 38, 2], [60, 84, 30, 3.2], [226, 28, 22, 1.6]]) nubeT(((x0 + t * v) % 400) - 40, y, w, hex('#4a2a5e'), hex('#a04c78'), hex('#f0907a'));
  for (let k = 0; k < 5; k++) ave(Math.round(((40 + k * 8 + t * 16) % 360) - 20), 70 + (k % 2) * 4 + Math.round(Math.sin(t + k) * 2), t, k, hex('#2a1a30'));
  // el haz del faro que barre
  const fa = Math.sin(t * 1.6); R.recorte([0, 100, 160, HOR]); for (let d = 4; d < 40; d++) if ((d + Math.floor(t * 8)) % 3) R.pset(Math.round(28 + fa * d), 114 + Math.round(Math.abs(fa) * d * 0.05), hex('#fff0b0')); R.recorte(null);
  // el agua: el camino del sol, brillos que corren, bruma que pasa y ondas
  for (let y = HOR + 2; y < 178; y += 2) { const w = 2 + Math.round((y - HOR) / 5), x = 58 + Math.round(Math.sin(t * 3 + y) * 2); R.rect(Math.max(0, x - w), y, x + w, y, (y + Math.floor(t * 6)) % 4 ? hex('#ffd8a0') : hex('#f8a870')); }
  for (let k = 0; k < 46; k++) { const y = HOR + 3 + Math.round(hh(k, 20) * 40), x = Math.round((hh(k, 21) * 320 + t * (3 + (k % 4))) % 320), l = 2 + (k % 3) + Math.round((y - HOR) / 12); R.rect(x, y, Math.min(319, x + l), y, x > 150 ? hex('#5a3a62') : k % 3 ? hex('#e88a6a') : hex('#f8c890')); }
  for (let k = 0; k < 3; k++) { const y = HOR - 1 + k * 3, x0 = Math.round((t * (6 + k * 3) + k * 90) % 420) - 80; for (let x = x0; x < x0 + 70; x++) if (x >= 0 && x < 320 && bay(x, y) < 0.35) R.pset(x, y, hex('#d8a8b8')); }
  // un pez salta: sus anillos se abren en el agua
  const pz = (t * 0.45) % 1; if (pz < 0.7) { const r = Math.round(2 + pz * 22); for (let a = 0; a < 6.28; a += 0.12) { const x = Math.round(104 + Math.cos(a) * r), y = Math.round(160 + Math.sin(a) * r * 0.25); if (y > HOR) R.pset(x, y, hex('#f8c890')); } }
  // el árbol de luz nace en el horizonte y se ramifica, con su reflejo recortado al agua (antes de la peña)
  const u = tramo(t, tiempo - 0.2, rama + 0.6) * 6.2;
  if (u > 0) { const L = []; ramaLuz(100, HOR, -Math.PI / 2, 30, 0, u, L);
    for (const [x1, y1, x2, y2, d] of L) { R.linea(x1 + 1, y1, x2 + 1, y2, hex('#f0a040')); R.linea(x1, y1, x2, y2, d < 2 ? hex('#fff4c8') : hex('#ffd860')); }
    R.recorte([0, HOR + 2, 145, 179]);
    for (const [x1, y1, x2, y2] of L) R.linea(x1, 2 * HOR - y1 + 2, x2, 2 * HOR - y2 + 2, (x, y) => (x + y) % 2 ? hex('#e8a060') : null);
    R.recorte(null);
    for (let k = 0; k < 8; k++) { const v = (t * 0.8 + k / 8) % 1; R.pset(100 + Math.round(Math.sin(k * 2 + t) * 16 * v), Math.round(HOR - v * 70), hex('#fff4c8')); } }
  // Sam llega por lo alto de la peña con el escudo, se para en el borde y lo levanta hacia el cielo
  const w = tramo(t, 0.3, vuelven - 0.3), x = Math.round(lerp(330, 206, w)), al = tramo(t, escudo - 0.3, escudo + 0.2), pie = pena(x + 7) + 1;
  const q = R.actor(EL.sam, x, pie, t, { dir: -1, anda: w > 0 && w < 1, sostiene: al > 0 ? [x - 3, Math.round(lerp(pie - 12, pie - 32, al))] : true, sonrisa: t > manos, sorpresa: t > tiempo && t < rama + 0.5 });
  const [mx, my] = q.mano; T.PIEZAS_DO.escudo(R, mx - 1, my - 1, { r: 7 });
  if (al >= 1) { for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 + t * 2, r = 11 + Math.round(Math.abs(Math.sin(t * 5 + k)) * 3); R.linea(mx - 1 + Math.cos(a) * 9, my - 1 + Math.sin(a) * 9, mx - 1 + Math.cos(a) * r, my - 1 + Math.sin(a) * r, k % 2 ? hex('#ffd860') : BL); }
    R.recorte([146, HOR + 1, 319, 179]); for (let k = 0; k < 5; k++) R.pset(mx - 3 + k, 2 * HOR - my + 4 + (k % 2), hex('#ffd860')); R.recorte(null); }
  // la canoa amarrada al pie de la peña, que se mece, con su cabo a la argolla
  const cb = Math.round(Math.sin(t * 1.8)), cy = 150 + cb;
  R.linea(186, 118, 160, cy - 2, hex('#c8a878')); R.disco(186, 118, 1, hex('#8a8e98'));
  R.poligono([[150, cy - 3], [204, cy - 3], [198, cy + 4], [156, cy + 4]], hex('#7a2a20')); R.rect(152, cy - 4, 202, cy - 3, hex('#c85a3a')); R.rect(156, cy + 3, 198, cy + 4, hex('#4a1a14'));
  R.rect(166, cy - 6, 168, cy - 3, hex('#a87a4a')); R.rect(186, cy - 6, 188, cy - 3, hex('#a87a4a')); R.linea(170, cy - 7, 182, cy - 5, hex('#c89a5a')); R.linea(156, cy + 6, 198, cy + 6, hex('#e8907a'));
  // los nenúfares de delante, que suben y bajan, con una flor

  R.actor(EL.fanArana, 98, 176, t, { dir: 1, dedo: t > martillo && t < mano, sonrisa: t > mano });
  T.hoyDelante(R, t, { encuadre: 'cine', camara: 'pantalla' });
};
