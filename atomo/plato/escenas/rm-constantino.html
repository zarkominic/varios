<title>Constantino · ep5</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// RM-CONSTANTINO (frases 33–34). Constantino con armadura y capa púrpura, con un escudo redondo con la cruz; un trirreme
// se lleva la capital hacia el este, donde se levantan las cúpulas de Constantinopla; «330» en la caja. Luego el mapa:
// monedas que viajan de Roma a Constantinopla y nubes de tormenta que se quedan sobre el oeste.
import { preparar, rodar } from '/atomo/plato/escenas/rm-comun.js';
const { E, R, M } = await preparar('rm-constantino');
const { PALA, PR, ELENCO, tramo, lerp } = R;
const m = { con: M('constantino', 0.5), est: M('este', 11) };
const constantino = { ...ELENCO.legionario, sombrero: 'diadema', capa: PALA.PURPURA, pelo: PALA.PELO_CASTANO, peinado: 'corto' };
const puerto = (t) => {
  R.cieloR(t, 'tarde', { hor: 118, sol: [290, 100, 10], nubes: { n: 3 } });
  R.mar(t, { hor: 118 });
  const sube = tramo(t, m.con + 5, m.con + 8);
  for (const [x, r] of [[262, 8], [284, 11], [306, 7]]) { const h = Math.round(r * 2 * sube); R.rect(x - r, 118 - h, x + r, 118, PALA.PURPURA[1]); if (sube > 0.8) R.disco(x, 118 - h, r, PALA.PURPURA[1]); }
  const p = tramo(t, m.con + 4, m.con + 9);
  R.trirreme(lerp(110, 230, p), 128, t, { esc: 0.8, vela: PALA.PURPURA, carga: true });
  R.suelo(146, PALA.MARMOL, { losas: true });
  R.personaje(70, 172, 30, { ...constantino, t, pose: t > m.con + 4 ? 'senala' : 'pie' });
  const ex = 58, ey = 155; R.disco(ex, ey, 6, PALA.ROJO[1]); R.anillo(ex, ey, 6, PALA.ORO[2]); R.icono('cruz', ex - 3, ey - 3, PALA.ORO[3], PALA.ROJO[0]);
};
const flujo = (t) => {
  const u = t - m.est;
  R.mapaAño(t, 340, { oeste: tramo(u, 2, 5) * 0.35 });
  const a = R.lugar('roma'), b = R.lugar('constantinopla');
  for (let k = 0; k < 6; k++) { const f = (u * 0.35 + k / 6) % 1, x = lerp(a[0], b[0], f), y = lerp(a[1], b[1], f) - Math.sin(f * Math.PI) * 18; R.disco(x, y, 2, PALA.ORO[4]); R.pset(Math.round(x), Math.round(y), PALA.ORO[5]); }
  R.punto(...b, t, PALA.ORO, 3);
  if (u > 2) R.nubesR(t, { rampa: PR.TORMENTA, base: 1, n: 5, y0: 30, y1: 120, vel: 1.5 });
};
rodar(E, R, [[0, puerto], [m.est - 0.2, flujo]], { año: (t) => (t < m.con + 5 ? 312 : t < m.est ? 330 : 340), caja: (t, e) => R.caja(t, t > m.con + 6 && t < m.est - 0.2 ? tramo(t, m.con + 6, m.con + 6.4) : 0, (x, y) => R.numero('330', x + 6, y + 12), { energia: e }) });
</script>
