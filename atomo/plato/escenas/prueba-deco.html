<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prueba de identidad · art déco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fuentes" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Poiret+One&display=block">
<style>
  html, body { margin: 0; height: 100%; background: #060a13; overflow: hidden; }
  canvas { position: fixed; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// Prueba de identidad · art déco (a partir de estilos/19-art-deco.html).
// Pan de oro y marfil sobre azul noche, marco escalonado con abanicos, rayos de sol naciente y
// destellos de cuatro puntas. Todo el oro se pinta con un mismo degradado metálico (en el marco de
// la pantalla) que se recalcula en cada fotograma, con barridos de luz en los momentos clave.
// La regla es una pilastra escalonada a la derecha: el valor actual se «enciende» en pan de oro.
// [hola] Atom bota y saluda con un electrón. [atom] crece con un sol de rayos y destellos.
// [bloques] cinco átomos de oro cierran un anillo hexagonal. [explico] aparece una placa con «?»;
// [escuela] la placa gira sobre su eje y muestra «!». [saltos]→[pelo] cuatro zooms ×10 a través de
// medallones: el nivel siguiente se abre dentro de un medallón dorado que crece hasta llenar la
// pantalla (persona → mano → piel con vello → pelo sobre escamas → el pelo como una columna
// estriada). [decima]→[milimetro] cota dorada con su cartela «10⁻⁴ m».
import { escena } from '/atomo/plato/escena.js';

const E = await escena('prueba-deco', 'prueba');
const M = (k) => E.marca(k);
const DUR = E.duracion, W = 1920, H = 1080, PI = Math.PI, TAU = PI * 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const bgc = document.createElement('canvas');
let S = 1;
const FD = "'Limelight', 'Didot', serif";
const FL = "'Poiret One', 'Futura', sans-serif";
const CREAM = '239,228,198';
const PC = { x: W / 2, y: H / 2 };

// ---------- tiempos ----------
const T = {
  hola: M('hola'), holaF: M('hola_fin'), atom: M('atom'), bloques: M('bloques'), explico: M('explico'),
  escuela: M('escuela'), saltos: M('saltos'), pelo: M('pelo'), decima: M('decima'), mm: M('milimetro'), mmF: M('milimetro_fin'),
};
T.quieto = DUR - 0.6;
T.calma0 = Math.min(T.mmF, T.quieto - 0.25);
T.d = (T.pelo - T.saltos) / 4;
T.llegada = [1, 2, 3, 4].map((j) => T.saltos + j * T.d);

// ---------- utilidades ----------
const cl = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const seg = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const ioC = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const oC = (x) => 1 - Math.pow(1 - x, 3);
const iC = (x) => x * x * x;
const eback = (x, s = 1.70158) => { const c3 = s + 1; return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
const einb = (x, s = 0.6) => (s + 1) * x * x * x - s * x * x;
const sstep = (a, b, x) => { const u = cl((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const muelle = (tau, w = 16, k = 7) => tau < 0 ? 0 : Math.sin(tau * w) * Math.exp(-tau * k);
function mulberry32(s) { return () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let r = Math.imul(s ^ (s >>> 15), 1 | s); r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r; return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; }
function calma(t) { const a = T.calma0, b = T.quieto; if (t <= a) return t; const u = Math.min(1, (t - a) / (b - a)); return a + (b - a) * (u - u * u / 2); }
// matrices [a b c d e f]
const mul = (A, B) => [A[0] * B[0] + A[2] * B[1], A[1] * B[0] + A[3] * B[1], A[0] * B[2] + A[2] * B[3], A[1] * B[2] + A[3] * B[3], A[0] * B[4] + A[2] * B[5] + A[4], A[1] * B[4] + A[3] * B[5] + A[5]];
const zoomM = (F, s) => [s, 0, 0, s, F.x * (1 - s), F.y * (1 - s)];
const ap = (m, x, y) => [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]];
const ID = [1, 0, 0, 1, 0, 0];
const dom = (m) => new DOMMatrix([m[0], m[1], m[2], m[3], m[4], m[5]]);

// ---------- oro: degradado metálico por fotograma (del demo) ----------
const RAMP = [[0.00, [70, 46, 14]], [0.28, [132, 94, 36]], [0.52, [190, 150, 70]], [0.74, [228, 196, 120]], [0.90, [246, 230, 172]], [1.00, [255, 246, 214]]];
function ramp(v) { v = cl(v); for (let i = 1; i < RAMP.length; i++) if (v <= RAMP[i][0]) { const [a, ca] = RAMP[i - 1], [b, cb] = RAMP[i], k = (v - a) / (b - a); return [ca[0] + (cb[0] - ca[0]) * k, ca[1] + (cb[1] - ca[1]) * k, ca[2] + (cb[2] - ca[2]) * k]; } return RAMP[RAMP.length - 1][1]; }
let SWEEPS = [];
function makeGold(t) {
  const g = ctx.createLinearGradient(-180, -100, 2100, 1180), cs = [];
  for (const [a, b, k] of SWEEPS) if (t > a && t < b) cs.push([lerp(-0.15, 1.15, ioC((t - a) / (b - a))), k]);
  const ps = []; for (let i = 0; i <= 28; i++) ps.push(i / 28);
  for (const [c] of cs) for (let j = -5; j <= 5; j++) { const p = c + j * 0.009; if (p > 0 && p < 1) ps.push(p); }
  ps.sort((a, b) => a - b);
  const drift = 0.32 * Math.sin(TAU * calma(t) / 10);
  let last = -1;
  for (const p of ps) {
    if (p - last < 1e-4) continue; last = p;
    const v = 0.5 + 0.27 * Math.sin(TAU * p * 3.1 + 0.5 + drift) + 0.15 * Math.sin(TAU * p * 8.3 + 1.9 - drift * 1.7) + 0.06 * Math.sin(TAU * p * 21 + 0.3);
    let col = ramp(v);
    for (const [c, k] of cs) { const d = (p - c) / 0.026, s = k * Math.exp(-d * d); col = [col[0] + (255 - col[0]) * s, col[1] + (250 - col[1]) * s, col[2] + (230 - col[2]) * s]; }
    g.addColorStop(p, `rgb(${col[0] | 0},${col[1] | 0},${col[2] | 0})`);
  }
  return g;
}
let G = null;   // oro del fotograma

// ---------- formas ----------
const P2 = (d) => new Path2D(d);
function steppedPath(L, Tt, R, B, s) {
  const p = new Path2D();
  p.moveTo(L + 2 * s, Tt); p.lineTo(R - 2 * s, Tt); p.lineTo(R - 2 * s, Tt + s); p.lineTo(R - s, Tt + s); p.lineTo(R - s, Tt + 2 * s); p.lineTo(R, Tt + 2 * s);
  p.lineTo(R, B - 2 * s); p.lineTo(R - s, B - 2 * s); p.lineTo(R - s, B - s); p.lineTo(R - 2 * s, B - s); p.lineTo(R - 2 * s, B); p.lineTo(L + 2 * s, B);
  p.lineTo(L + 2 * s, B - s); p.lineTo(L + s, B - s); p.lineTo(L + s, B - 2 * s); p.lineTo(L, B - 2 * s); p.lineTo(L, Tt + 2 * s); p.lineTo(L + s, Tt + 2 * s); p.lineTo(L + s, Tt + s); p.lineTo(L + 2 * s, Tt + s);
  p.closePath(); return p;
}
const circ = (x, y, r) => { const p = new Path2D(); p.arc(x, y, r, 0, TAU); return p; };
const ell = (x, y, rx, ry, rot = 0) => { const p = new Path2D(); p.ellipse(x, y, rx, ry, rot, 0, TAU); return p; };
function diamondP(p, x, y, rx, ry) { p.moveTo(x, y - ry); p.lineTo(x + rx, y); p.lineTo(x, y + ry); p.lineTo(x - rx, y); p.closePath(); }
const polyP = (pts, cerrar = false) => { const p = new Path2D(); pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y))); if (cerrar) p.closePath(); return p; };

// Dibujo con matriz: los rellenos usan el sistema del nivel (sus degradados se escalan con él);
// las líneas de oro se pasan a pantalla y se trazan con el oro del fotograma a grosor constante.
function relleno(g, p, m, estilo, a = 1) { g.save(); g.setTransform(S * m[0], S * m[1], S * m[2], S * m[3], S * m[4], S * m[5]); g.globalAlpha = a; g.fillStyle = estilo; g.fill(p); g.restore(); }
function oro(g, p, m, w, a = 1, estilo = null) {
  const q = new Path2D(); q.addPath(p, dom(m));
  g.save(); g.setTransform(S, 0, 0, S, 0, 0); g.globalAlpha = a; g.strokeStyle = estilo || G; g.lineWidth = w; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke(q); g.restore();
}
function oroRelleno(g, p, m, a = 1) { const q = new Path2D(); q.addPath(p, dom(m)); g.save(); g.setTransform(S, 0, 0, S, 0, 0); g.globalAlpha = a; g.fillStyle = G; g.fill(q); g.restore(); }
function recorta(g, p, m) { const q = new Path2D(); q.addPath(p, dom(m)); g.setTransform(S, 0, 0, S, 0, 0); g.clip(q); }
const lin = (x0, y0, x1, y1, stops) => { const gr = ctx.createLinearGradient(x0, y0, x1, y1); for (const [o, c] of stops) gr.addColorStop(o, c); return gr; };
const rad = (x0, y0, r0, x1, y1, r1, stops) => { const gr = ctx.createRadialGradient(x0, y0, r0, x1, y1, r1); for (const [o, c] of stops) gr.addColorStop(o, c); return gr; };
// grabado: rayado fino de buril dentro de un recorte (alfa según la densidad en pantalla)
function grabado(g, clipP, m, sc, bb, ang, sp, a, col = 'rgba(120,86,34,1)') {
  const esp = sp * sc;
  if (esp < 1.6) return;
  g.save(); recorta(g, clipP, m);
  const p = new Path2D(), dx = Math.cos(ang), dy = Math.sin(ang), nx = -dy, ny = dx;
  const cx = (bb[0] + bb[2]) / 2, cy = (bb[1] + bb[3]) / 2, R0 = Math.hypot(bb[2] - bb[0], bb[3] - bb[1]) / 2;
  for (let c = -R0; c <= R0; c += sp) { p.moveTo(cx + c * nx - R0 * dx, cy + c * ny - R0 * dy); p.lineTo(cx + c * nx + R0 * dx, cy + c * ny + R0 * dy); }
  const q = new Path2D(); q.addPath(p, dom(m));
  g.globalAlpha = a * cl((esp - 1.6) / 3); g.strokeStyle = col; g.lineWidth = 1; g.stroke(q);
  g.restore();
}
// destello de cuatro puntas
function destello(g, x, y, sz, a) {
  if (a <= 0.01) return;
  g.save(); g.setTransform(S, 0, 0, S, 0, 0); g.globalCompositeOperation = 'lighter';
  const gr = rad(x, y, 0, x, y, sz * 0.9, [[0, `rgba(255,240,205,${0.45 * a})`], [1, 'rgba(255,240,205,0)']]);
  g.fillStyle = gr; g.fillRect(x - sz, y - sz, sz * 2, sz * 2);
  const p = new Path2D(); diamondP(p, x, y, sz * 0.07, sz); diamondP(p, x, y, sz, sz * 0.07);
  g.fillStyle = `rgba(255,250,232,${0.95 * a})`; g.fill(p);
  g.translate(x, y); g.rotate(PI / 4); const q = new Path2D(); diamondP(q, 0, 0, sz * 0.05, sz * 0.45); diamondP(q, 0, 0, sz * 0.45, sz * 0.05);
  g.fillStyle = `rgba(255,250,232,${0.5 * a})`; g.fill(q);
  g.restore();
}
// texto con espaciado
function tracked(g, str, x, y, font, track, modo = 'fill', align = 'center') {
  g.font = font;
  const ws = [...str].map((c) => g.measureText(c).width), total = ws.reduce((a, b) => a + b, 0) + track * (ws.length - 1);
  let cx = align === 'center' ? x - total / 2 : x;
  g.textAlign = 'left';
  [...str].forEach((c, i) => { modo === 'fill' ? g.fillText(c, cx, y) : g.strokeText(c, cx, y); cx += ws[i] + track; });
  return total;
}
// «10» con exponente y unidad. modo: 'fill' (pan de oro) o 'stroke' (perfil)
function potencia(g, x, y, exp, size, conM, modo, estilo, align = 'left') {
  const fb = `${size}px ${FD}`, fe = `${Math.round(size * 0.58)}px ${FD}`;
  g.font = fb; const w10 = g.measureText('10').width;
  g.font = fe; const sE = String(Math.abs(exp)), wE = g.measureText(sE).width, wMin = exp < 0 ? size * 0.28 : 0;
  g.font = fb; const wM = conM ? g.measureText('m').width + size * 0.2 : 0;
  const tot = w10 + size * 0.05 + wMin + wE + wM;
  let xx = align === 'center' ? x - tot / 2 : x;
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  const pinta = (s, f, px, py) => { g.font = f; modo === 'fill' ? g.fillText(s, px, py) : g.strokeText(s, px, py); };
  if (modo === 'fill') g.fillStyle = estilo; else g.strokeStyle = estilo;
  pinta('10', fb, xx, y); xx += w10 + size * 0.05;
  if (exp < 0) { const r = new Path2D(); r.rect(xx + wMin * 0.12, y - size * 0.62, wMin * 0.72, Math.max(1.5, size * 0.07)); modo === 'fill' ? g.fill(r) : g.stroke(r); xx += wMin; }
  pinta(sE, fe, xx, y - size * 0.4); xx += wE + size * 0.2;
  if (conM) pinta('m', fb, xx, y);
  return tot;
}

// =====================================================================================
// Fondo estático: azul noche, cuñas de sol naciente y grano (del demo)
// =====================================================================================
let grainTile = null;
function buildGrain() {
  const n = 192, c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d'), im = g.createImageData(n, n), rnd = mulberry32(1925);
  for (let i = 0; i < n * n; i++) { const v = rnd(), light = v > 0.5; im.data[i * 4] = light ? 255 : 0; im.data[i * 4 + 1] = light ? 240 : 0; im.data[i * 4 + 2] = light ? 210 : 0; im.data[i * 4 + 3] = Math.floor(Math.abs(v - 0.5) * 2 * 22); }
  g.putImageData(im, 0, 0); grainTile = c;
}
function buildStatic() {
  bgc.width = cv.width; bgc.height = cv.height;
  const b = bgc.getContext('2d');
  b.setTransform(S, 0, 0, S, 0, 0);
  const g = b.createRadialGradient(PC.x, PC.y, 0, PC.x, PC.y, 1250);
  g.addColorStop(0, '#192b4e'); g.addColorStop(0.32, '#101d38'); g.addColorStop(0.68, '#0a1326'); g.addColorStop(1, '#050912');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  b.fillStyle = 'rgba(150,180,240,0.035)'; b.beginPath();
  const N = 36;
  for (let i = 0; i < N; i += 2) { const a0 = -PI / 2 + (i - 0.5) * TAU / N, a1 = a0 + TAU / N; b.moveTo(PC.x, PC.y + 380); b.arc(PC.x, PC.y + 380, 2600, a0, a1); b.closePath(); }
  b.fill();
  b.setTransform(1, 0, 0, 1, 0, 0);
  b.fillStyle = b.createPattern(grainTile, 'repeat'); b.fillRect(0, 0, bgc.width, bgc.height);
}
let VIG;
function marco(g) {
  g.setTransform(S, 0, 0, S, 0, 0);
  g.strokeStyle = G; g.lineWidth = 2.2; g.stroke(steppedPath(24, 24, W - 24, H - 24, 16));
  g.lineWidth = 1; g.stroke(steppedPath(34, 34, W - 34, H - 34, 16));
  for (const [x, y, a0] of [[34, 34, 0], [W - 34, 34, PI / 2], [W - 34, H - 34, PI], [34, H - 34, 3 * PI / 2]]) {
    g.save(); g.translate(x, y); g.rotate(a0);
    g.beginPath();
    for (const r of [58, 72, 86]) { g.moveTo(r + 16, 16); g.arc(16, 16, r, 0, PI / 2); }
    for (let k = 0; k <= 6; k++) { const a = k * PI / 12; g.moveTo(16 + Math.cos(a) * 20, 16 + Math.sin(a) * 20); g.lineTo(16 + Math.cos(a) * 58, 16 + Math.sin(a) * 58); }
    g.restore();
    g.lineWidth = 1; g.globalAlpha = 0.75; g.stroke(); g.globalAlpha = 1;
    g.save(); g.translate(x, y); g.rotate(a0); g.beginPath(); g.arc(16, 16, 9, 0, TAU); g.restore(); g.fillStyle = G; g.fill();
  }
}

// =====================================================================================
// Átomo narrador: medallón de oro (del demo)
// =====================================================================================
const ORB = [{ tilt: -PI / 3, ph: 0.05, dir: 1 }, { tilt: 0, ph: 0.38, dir: -1 }, { tilt: PI / 3, ph: 0.71, dir: 1 }];
const ATOM = { rx: 238, ry: 78 };
function velAtomo(t) {
  let v = 0.3;
  v *= 1 + 2.4 * sstep(T.atom - 0.28, T.atom, t) * (1 - sstep(T.atom + 0.35, T.atom + 1.5, t));
  v *= 1 + 1.3 * sstep(T.saltos - 0.15, T.saltos + 0.2, t) * (1 - sstep(T.pelo, T.pelo + 0.7, t));
  return v * (1 - cl((t - T.calma0) / (T.quieto - T.calma0)));
}
const FASE = (() => {
  const dt = 1 / 240, n = Math.ceil(DUR / dt) + 2, A = new Float64Array(n);
  let ph = 0; for (let i = 0; i < n; i++) { A[i] = ph; ph += dt * velAtomo(i * dt); }
  return (t) => { const f = Math.max(0, t) / dt, i = Math.min(n - 2, Math.floor(f)); return A[i] + (A[i + 1] - A[i]) * (f - i); };
})();
function nucleo(g, x, y, r, a = 1) {
  g.save(); g.setTransform(S, 0, 0, S, 0, 0); g.globalAlpha = a;
  g.fillStyle = rad(x - r * 0.38, y - r * 0.42, r * 0.04, x, y, r, [[0, '#fff6d8'], [0.22, '#f2d68a'], [0.58, '#b98a36'], [1, '#4e3410']]);
  g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  g.strokeStyle = G; g.lineWidth = Math.max(0.8, r * 0.05); g.beginPath(); g.arc(x, y, r * 1.22, 0, TAU); g.stroke();
  g.lineWidth = Math.max(0.6, r * 0.025); g.beginPath(); g.arc(x, y, r * 1.38, 0, TAU); g.stroke();
  g.globalCompositeOperation = 'lighter'; g.fillStyle = `rgba(255,244,214,${0.5 * a})`;
  const q = new Path2D(); diamondP(q, x - r * 0.38, y - r * 0.42, r * 0.06, r * 0.4); diamondP(q, x - r * 0.38, y - r * 0.42, r * 0.4, r * 0.06); g.fill(q);
  g.restore();
}
function atomo(g, t, A) {
  const sc = A.sc * (1 + 0.05 * A.en), x = A.x, y = A.y;
  const wk = Math.max(0.55, Math.pow(A.sc / 0.42, 0.5));
  g.save(); g.setTransform(S, 0, 0, S, 0, 0);
  // halo suave
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = rad(x, y, 10 * sc, x, y, 300 * sc, [[0, `rgba(255,222,150,${0.16 + 0.1 * A.en})`], [1, 'rgba(255,222,150,0)']]);
  g.beginPath(); g.arc(x, y, 300 * sc, 0, TAU); g.fill();
  g.globalCompositeOperation = 'source-over';
  // órbitas: línea de oro y su paralela fina
  g.strokeStyle = G;
  for (const o of ORB) {
    g.lineWidth = 2.2 * wk; g.beginPath(); g.ellipse(x, y, ATOM.rx * sc, ATOM.ry * sc, o.tilt, 0, TAU); g.stroke();
    g.globalAlpha = 0.45; g.lineWidth = 0.8 * wk; g.beginPath(); g.ellipse(x, y, ATOM.rx * sc + 9 * wk, ATOM.ry * sc + 9 * wk, o.tilt, 0, TAU); g.stroke(); g.globalAlpha = 1;
  }
  g.restore();
  nucleo(g, x, y, 50 * sc * (1 + 0.08 * A.en));
  // electrones con estela
  const fase = FASE(t);
  ORB.forEach((o, i) => {
    const rx = ATOM.rx * sc, ry = ATOM.ry * sc, th = TAU * (o.ph + 2.6 * fase) * o.dir;
    const ct = Math.cos(o.tilt), stt = Math.sin(o.tilt);
    const P = (q) => [x + rx * Math.cos(q) * ct - ry * Math.sin(q) * stt, y + rx * Math.cos(q) * stt + ry * Math.sin(q) * ct];
    let [ex, ey] = P(th);
    const m = i === 0 ? A.mano : 0;
    g.save(); g.setTransform(S, 0, 0, S, 0, 0); g.strokeStyle = G; g.lineCap = 'round';
    if (m > 0.001) {
      const R = rx * 1.05, ang = A.manoAng, hx = x + Math.cos(ang) * R, hy = y + Math.sin(ang) * R;
      ex = lerp(ex, hx, m); ey = lerp(ey, hy, m);
      g.globalAlpha = cl(m * 1.5); g.lineWidth = 2.4 * wk; g.beginPath(); g.moveTo(x + (ex - x) * 0.3, y + (ey - y) * 0.3); g.lineTo(ex, ey); g.stroke();
      if (m > 0.5) { g.globalAlpha = cl((m - 0.5) / 0.3); for (const sd of [-1, 1]) for (const dr of [0, 0.18]) { g.lineWidth = (dr ? 1.2 : 2) * wk; g.beginPath(); g.arc(x, y, R * (1 + dr), ang + sd * (0.3 + dr * 0.4), ang + sd * (0.72 + dr * 0.6), sd < 0); g.stroke(); } }
    } else {
      const NS = 14, lar = 0.8 + 0.5 * (A.vel - 1), dirn = -o.dir;
