<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cicuta · ep6</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// GR-CICUTA (frase 32). Cartela «399». Una celda de piedra con una ventanita: los amigos abren la puerta y le señalan la
// salida; Sócrates niega con la cabeza, se sienta, coge la copa y sigue hablando con ellos; la luz de la ventana se va
// apagando despacio (sin mostrar la muerte).
import { preparar, rodar } from '/atomo/plato/escenas/gr-comun.js';
const { E, R, M } = await preparar('gr-cicuta');
const { PALA, PR, ELENCO, tramo, lerp } = R;
const m0 = M('cicuta', 1.5), dur = E.duracion ?? 18;
const celda = (t) => {
  const u = t - m0, apaga = tramo(t, dur - 4, dur - 0.5);
  R.ambiente({ luz: { lado: 1, color: lerp(1, 0, apaga) > 0.5 ? R.hex('#ffb060') : PR.NIEVE[0] }, sombra: PALA.CONTORNO });
  for (let y = 0; y < R.H; y++) for (let x = 0; x < R.W; x++) { const fila = Math.floor(y / 10), junta = y % 10 === 0 || (x + (fila & 1) * 10) % 20 === 0; R.pset(x, y, R.tone(PR.ROCA, 1.2 + (junta ? -0.8 : 0) - apaga * 0.8 + Math.max(0, 1 - Math.hypot(x - 230, y - 50) / 120) * 1.2 * (1 - apaga), x, y)); }
  R.rect(220, 30, 240, 56, R.tone(PR.TARDE, 4 - apaga * 3.5, 230, 40)); for (let k = 0; k < 3; k++) R.rect(224 + k * 6, 30, 225 + k * 6, 56, PALA.CONTORNO);
  const abre = tramo(t, m0, m0 + 1.2); R.rect(30, 90, 60, 150, PALA.CONTORNO); R.rect(30, 90, 30 + Math.round(30 * (1 - abre)), 150, PR.MADERA[2]);
  R.suelo(150, PR.ROCA, { luz: 1.2 - apaga });
  R.personaje(78, 172, 26, { ...ELENCO.platon, t, pose: u < 5 ? 'senala' : 'cara', ceño: u > 5 });
  R.personaje(110, 172, 26, { ...ELENCO.griego, pelo: PALA.PELO_BLANCO, t, pose: u < 5 ? 'ofrece' : 'pie', ceño: true });
  const niega = u > 2 && u < 4.5 && Math.sin(t * 9) > 0, sienta = u > 5;
  R.rect(166, 160, 200, 166, PR.ROCA[2]);
  R.personaje(184, sienta ? 160 : 172, 28, { ...ELENCO.socrates, t, dir: niega ? 1 : -1, pose: sienta ? 'sentado' : 'pie', objeto: u > 6.5 ? 'copa' : undefined, habla: u > 7 ? 1 : 0, sombra: sienta ? false : PALA.CONTORNO });
};
rodar(E, R, [[0, celda]], { cartela: '399', año: -399 });
</script>
</body>
</html>
