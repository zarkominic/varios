<script type="module">
// LA-PINTADOS (frase 20), 1991. Dos planos:
// 1. el estudio de dibujo: la pintora, de pie en una tarima de madera delante de la mesa, termina con un pincel de 11 px
//    el fondo pintado en papel (la acuarela avanza por el boceto a lápiz y ella se va moviendo con el borde) y, en
//    «painted by hand», levanta el pincel satisfecha; un compañero lleva otra hoja hacia el escáner. El fluorescente del
//    decorado (que caía en la barra del año) se tapa y se cuelga en x 188–248;
// 2. (desde «The artists») el escáner de cerca: en la tapa, el boceto a lápiz en papel de calco pegado con celo (la
//    esquina se levanta), un lápiz y una goma en el borde, motas en la luz; el cristal vacío con reflejos y la lámpara que
//    se calienta; el monitor se enciende y muestra el programa de escanear (sin letras). Una mano desliza la hoja pintada
//    sobre el cristal («on paper») y se retira; la vista previa la muestra, el cursor va al botón verde y en «scanned» lo
//    pulsa: la barra de luz recorre el cristal y el dibujo aparece en píxeles en el monitor, tapando el programa.
import * as T from '/atomo/plato/escenas/la-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('la-pintados');

// la nube de pensar: bolas blancas y tres bolitas hasta (qx, qy)

  R.linea(Math.round(x + ux * 2), Math.round(y + uy * 2), x1, y1, hex('#eef2fa')); R.pset(x1, y1, hex('#ffffff'));
  R.linea(Math.round(x + ux * 2 - uy * 3), Math.round(y + uy * 2 + ux * 3), Math.round(x + ux * 2 + uy * 3), Math.round(y + uy * 2 - ux * 3), hex('#c8a040'));

// la chispa de dos hojas que chocan (a 0–1)

  R.pset(cx - 2, cy - 2, KK); R.pset(cx + 2, cy - 2, KK); R.disco(cx, cy + 3, 3.4, KK); R.disco(cx, cy + 3, 2.6, hex('#f0a0a8')); R.pset(cx - 1, cy + 3, hex('#a85a6a')); R.pset(cx + 1, cy + 3, hex('#a85a6a')); };

  R.poligono(P.map(([x, y]) => [x - 1, y]), KK); R.poligono(P.map(([x, y]) => [x + 1, y]), KK); R.poligono(P, c); R.pset(cx + 2, cy - 6, hex('#fff8c0')); };

// el tricornio de pirata (pictograma para la nube de pensar), con su calavera

  R.poligono(q([[-9, 3], [9, 3], [6, -5], [0, -2], [-6, -5]]), KK); R.poligono(q([[-7.5, 2], [7.5, 2], [5, -3.5], [0, -0.8], [-5, -3.5]]), hex('#2a2430'));
  R.rect(cx - 8 * s, cy + 2 * s, cx + 8 * s, cy + 3 * s - 1, hex('#c8a040')); R.disco(cx, cy - 0.5 * s, 2 * s, hex('#f4f2ee')); R.pset(cx - s, cy - s, KK); R.pset(cx + s, cy - s, KK); R.rect(cx - s, cy + s, cx + s, cy + s, KK); };
// la espada de los pictogramas, con su contorno para que se lea sobre el pergamino
const espadaP = (R, x, y, ang, L = 16) => { for (const [i, j] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) R.linea(x + i, y + j, Math.round(x + Math.cos(ang) * L) + i, Math.round(y + Math.sin(ang) * L) + j, KK); espada(R, x, y, ang, L); };

  R.rect(x0, y, x1, y + 4, KK); R.rect(x0 + 1, y + 1, x1 - 1, y + 3, hex('#b8b4a8'));
  for (const yy of [y + 1, y + 3]) R.rect(x0 + 2, yy, x1 - 2, yy, on ? hex('#fbfbf2') : hex('#a8b0a8'));
  R.rect(x0 + 2, y + 2, x1 - 2, y + 2, hex('#d8d8cc')); for (let x = x0 + 4; x < x1 - 2; x += 6) R.pset(x, y + 2, hex('#9a968a')); };
const P = (s) => en('pintados', (s - 0.5) / 7.632);
const P2 = P(4.2), pinta0 = P(0.6), pinta1 = P(3.0), mano = P(3.23), coloca = P(5.6), escanea = P(6.52), fin = P(7.7);
const p1 = (t) => {
  const d = T.estudio(R, t, { encuadre: 'dibujo', camara: 'general', escaneo: 1.2 });
  // el fluorescente del decorado caía en la barra del año: se tapa con las placas del techo y se cuelga más a la derecha
  for (let y = 2; y <= 6; y++) for (let x = 119; x <= 181; x++) R.pset(x, y, R.pget(x - 90, y));
  fluor(R, 188, 248, 2, t);
  // la parte del papel que aún es boceto (a lápiz), a la derecha del borde de la acuarela
  const u = tramo(t, pinta0, pinta1), borde = Math.round(lerp(82, 134, u));
  for (let y = 89; y <= 119; y++) { const v = (y - 89) / 30, xa = Math.round(39 - 9 * v), xb = Math.round(123 + 9 * v); for (let x = Math.max(xa + 1, borde); x < xb; x++) { const m = ((x * 7 + y * 13) % 23 === 0);
      R.pset(x, y, y === 104 + Math.round(Math.sin(x * 0.1) * 2) || m ? hex('#9a968a') : hex('#f2eee4')); } }
  for (let y = 89; y <= 119; y++) if (borde < 132 && (y + Math.floor(t * 8)) % 3 === 0) R.pset(borde, y, hex('#6aa8d8'));
  // la tarima de madera delante de la mesa (para llegar al papel): tablas con vetas, clavos, gotas de pintura y su sombra
  for (let x = 54; x <= 172; x++) { R.pset(x, 151, mez(R.pget(x, 151), KK, 0.45)); R.pset(x, 152, mez(R.pget(x, 152), KK, 0.25)); }
  R.rect(56, 139, 170, 150, KK); R.rect(57, 140, 169, 142, hex('#c8965a')); R.rect(57, 140, 169, 140, hex('#e0b47a'));
  for (let x = 57; x <= 169; x++) { if (h1(x, 3) < 0.25) R.pset(x, 141, hex('#a87840')); for (let y = 143; y <= 149; y++) R.pset(x, y, (x - 57) % 19 === 0 ? hex('#4a2c16') : (h1(x, y) < 0.12 || y === 146 && h1(x, 7) < 0.5) ? hex('#7a4c26') : y === 143 ? hex('#a8743e') : hex('#8e5c30')); }

  const pin = t < mano, xa = pin ? borde + 9 : 145, ty = 110 + Math.round(Math.sin(t * 7) * 3);
  const a = R.actor(EL.disenadora, xa, 140, t, { dir: -1, anda: pin && u > 0 && u < 1, sostiene: pin ? [borde + 5, 120] : [xa - 1, 118], sonrisa: !pin, habla: false });
  const [hx, hy] = a.mano, [gx, gy] = pin ? [Math.min(borde, 131), ty] : [hx - 3, hy - 12], dl = Math.hypot(gx - hx, gy - hy) || 1, ux = (gx - hx) / dl, uy = (gy - hy) / dl;
  const tx = Math.round(hx + ux * 11), tyy = Math.round(hy + uy * 11), cx0 = Math.round(hx - ux * 2), cy0 = Math.round(hy - uy * 2), fx = Math.round(hx + ux * 8), fy = Math.round(hy + uy * 8);
  R.linea(cx0 + 1, cy0, fx + 1, fy, hex('#5a3a1e')); R.linea(cx0, cy0, fx, fy, hex('#c8944a')); R.pset(cx0, cy0, hex('#c83a3a'));
  R.linea(fx, fy, Math.round(hx + ux * 9), Math.round(hy + uy * 9), hex('#c8c8d0')); R.linea(Math.round(hx + ux * 10), Math.round(hy + uy * 10), tx, tyy, hex('#3a6ab8')); R.pset(tx, tyy, hex('#2a4a8a'));
  if (!pin && Math.sin(t * 6) > 0) { R.pset(tx + 2, tyy - 2, hex('#fff4a0')); R.pset(tx - 2, tyy - 1, hex('#fff4a0')); }

  const [cx, cy] = c.mano; R.rect(cx - 12, cy - 9, cx + 1, cy + 1, KK); R.rect(cx - 11, cy - 8, cx, cy, hex('#8ac0e8')); R.rect(cx - 11, cy - 3, cx, cy, hex('#5a9a5a')); R.rect(cx - 8, cy - 6, cx - 6, cy - 4, hex('#f0d060'));
};
let pint = null;
const p2 = (t) => {
  const g = T.estudio(R, t, { encuadre: 'dibujo', camara: 'escaner', escaneo: tramo(t, escanea, fin) });
  if (!pint) { pint = []; for (let y = 121; y <= 156; y++) for (let x = 0; x < 192; x++) { const v = (y - 121) / 35, xa = Math.round(28 - 9 * v), xb = Math.round(164 + 9 * v); if (x >= xa && x <= xb) pint.push([x, y, R.pget(x, y)]); } }

  for (const x of [44, 114]) { R.rect(x, 52, x + 8, 56, hex('#d8cc90')); R.rect(x + 1, 53, x + 7, 55, hex('#ece2b0')); R.pset(x + 2 + Math.floor(t * 4) % 5, 53, hex('#ffffff')); }
  { const q = Math.round(2 + Math.max(0, Math.sin(t * 2.3)) * 3); R.poligono([[121 - q, 93], [121, 93 - q], [121, 93]], hex('#8a867a')); R.poligono([[121 - q, 93], [121, 93 - q], [121 - q, 93 - q]], hex('#ffffff')); }

  R.linea(128, 114, 158, 114, hex('#e8c040')); R.linea(128, 115, 158, 115, hex('#b88a20')); R.rect(159, 114, 161, 115, hex('#c8c8d0')); R.rect(162, 114, 164, 115, hex('#f0a0a8')); R.pset(127, 114, hex('#e8d0a0')); R.pset(126, 114, KK);
  R.rect(110, 114, 116, 115, hex('#f6f2ea')); R.rect(110, 115, 116, 115, hex('#c8c0b0'));
  for (let k = 0; k < 6; k++) { const mx = 40 + ((k * 23 + t * 6) % 110), my = 70 + Math.sin(t * 0.9 + k * 1.7) * 18 + k * 3; R.pset(Math.round(mx), Math.round(my), hex('#fffbe8')); }
  // la mano desliza la hoja sobre el cristal y se retira
  const s = tramo(t, P2 + 0.15, coloca), dy = Math.round((1 - s) * (1 - s) * 46), r = tramo(t, coloca + 0.1, coloca + 0.7);
  if (s < 1) { R.poligono([[20, 117], [172, 117], [180, 160], [12, 160]], hex('#2a3a4a'));

    const lat = 0.35 + Math.sin(t * 5) * 0.2;
