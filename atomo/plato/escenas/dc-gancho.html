// DC-GANCHO (frases 1–2), sin cartela; barra del año 1958 → 2000 → 2026. Ocho planos:
// 1. (0–6,5 s) la pizarra de 1958: la mano con tiza escribe 3, 2, 1 junto a la Tierra (cae el polvo de tiza), da el toque
//    y se retira; el cohete de tiza vuela con su llama y deja una estela gruesa con bocanadas de polvo que se deshacen y
//    caen; el gato espía llega por la repisa y se sienta a mirar; en «moon» estalla el destello DIBUJADO (rayos de tiza,
//    halo de polvo que brilla, tiza que salta), el gato da un brinco y bajan tres líneas de mira hasta la Tierra (golpe

// 2. (6,5–11,2) por el telescopio: el ocular se abre; un murciélago cruza por delante de la Luna; un trazo punteado de

// 5. (22,6–27,7) inserto, mesa de nogal desde arriba: se abre la carpeta del gato («cat») y el sello cae en «microphone»;
//    se abre la de la gallina («bomb») y en «chickens» rueda un huevo y sale una pluma; sello. Corta en «spies».

// 7. (32,0–36,4) inserto, mesa de acero con escarcha (la esquina de Atom, chapa lisa en sombra): la carpeta del barco de hielo se abre, el bloque de hielo gotea y la
//    escarcha se extiende en «ice»; dos sellos en «real» y «secret». Corta tras «secret».
// 8. (36,4–40,0) inserto, la caja de archivo de frente: la mano deja la última carpeta, la tapa baja y en «joke» el sello
//    cae sobre la tapa; una pluma de la gallina se escapa por la rendija.
import * as T from '/atomo/plato/escenas/dc-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('dc-gancho');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const a = (f) => en('luna', f), b = (f) => en('archivos', f);
const P2 = a(0.325), P3 = a(0.584), P4 = a(0.824), P5 = b(0.119), P6 = b(0.407), P7 = b(0.640), P8 = b(0.886);
const LUNA = a(0.286), FLASH = a(0.411), CONSP = a(0.508), CUENTA = a(0.67), DOSMIL = a(0.767), NUMEROS = a(0.86), CARL = a(0.94);
const NOES = b(0.010), FILE = b(0.075), GATO = b(0.181), MICRO = b(0.211), BOMBA = b(0.269), POLLOS = b(0.358);
const VER = b(0.473), LEJOS = b(0.502), GOMA = b(0.593), HIELO = b(0.647), ICE = b(0.72), REAL = b(0.802), SECRET = b(0.858), JOKE = b(0.966);
const { rect, pset, linea, disco, poligono } = R;
const K = hex('#14121a'), TIZA = hex('#e8ece4'), TIZAS = hex('#a8b4a8'), AMA = hex('#f8e070'), AMAS = hex('#e0a030');
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };

const capas = new Map();
const capa = (k, dib) => { let bf = capas.get(k); if (!bf) { bf = R.nuevo(); const prev = R.usar(bf); R.recorte(null); dib(); R.recorte(null); R.usar(prev); capas.set(k, bf); } return bf; };
const poner = (bf) => { const d = R.usar(bf); R.usar(d); d.set(bf); };

const CARP = hex('#d8c8a0'), CARPS = hex('#a8946a'), CARPL = hex('#ece0bc'), CARPD = hex('#8a744a');
const carpeta = (cx, base, s, u, dib, o = {}) => {

  const sx0 = u <= 0 ? cx - 1 : cx - w; for (let k = sx0; k <= cx + w + 2; k++) if ((k + base) % 2 === 0 || k > cx + w - 2) pset(k + 1, base + 1, K);
  if (u >= 1) { T.PIEZAS_DC.carpeta(R, cx, base, { s, abierta: true, dibujo: dib, sello: o.sello ?? false }); return; }
  // cerrada: el lado derecho; la tapa vuelve hacia la izquierda
  if (u <= 0) { T.PIEZAS_DC.carpeta(R, cx + Math.round(8.5 * s), base, { s, dibujo: dib, sello: o.selloTapa ?? true }); return; }

// la marca roja del sello (círculo con raya), a escala s, centrada en (x, y)
const marca = (x, y, s, v = 1) => { if (v > 0) T.PIEZAS_DC.sello(R, x, y + Math.round(3.5 * s), { tipo: 'marca', s }); };
// la mano que sella: el brazo canónico desde abajo a la derecha, con el sello en el puño; p 0–1 baja y vuelve a subir
const sellar = (mx, my, p, manga = '#3a4a6a') => {

  const fuera = 70 * (1 - ent) + 70 * sal;
  const sx = mx, base = Math.round(my + 10 - 10 + (1 - baja) * -8 + fuera);
  T.PIEZAS_DC.sello(R, sx, base + 10, { s: 3 });
  const wx = sx + 8, wy = base - 30;

};
const golpeSello = (x, y, t, t0) => { const d = t - t0; if (d < 0 || d > 0.35) return; const r = Math.round(14 + d * 40); for (let k = 0; k < 8; k++) { const an = k * Math.PI / 4; pset(Math.round(x + Math.cos(an) * r), Math.round(y + Math.sin(an) * r * 0.6), hex('#f4ecd8')); pset(Math.round(x + Math.cos(an) * (r - 2)), Math.round(y + Math.sin(an) * (r - 2) * 0.6), hex('#c8b890')); } };
// el destello de tiza: rayos discontinuos que crecen y titilan (dibujado, sin fuego)
const destello = (x, y, u, t, c1 = AMA, c2 = TIZA, L = 16) => {
  if (u <= 0) return;
  const r = L * Math.min(1, u * 1.6), tw = 1 + 0.15 * Math.sin(t * 18);
  for (let k = 0; k < 12; k++) { const an = k * Math.PI / 6 + 0.13, rr = (k % 2 ? 0.55 : 1) * r * tw; for (let q = 4; q < rr; q += 1) if (Math.floor(q) % 4 !== 3) pset(Math.round(x + Math.cos(an) * q), Math.round(y + Math.sin(an) * q), k % 2 ? c2 : c1); }
  disco(x, y, Math.max(1, Math.round(3 * Math.min(1, u * 2))), c2); pset(x, y, AMA);
};

// 1 · la pizarra: la mano escribe la cuenta atrás y lanza el cohete de tiza, que deja su estela de polvo; el gato de la
// repisa lo sigue con la vista; en «moon», el destello dibujado, el polvo de tiza que salta y las líneas de mira hasta la Tierra
const bz1 = (v) => { const A = (1 - v) * (1 - v), Bq = 2 * (1 - v) * v, Cq = v * v; return [A * 52 + Bq * 140 + Cq * 215, A * 132 + Bq * 30 + Cq * 52]; };
const T0 = 1.15, NPUF = 16;
const enAtom = (x, y) => x >= 272 && y <= 48;
const p1 = (t) => {
  const vuelo = tramo(t, T0, LUNA - 0.05), nube = tramo(t, LUNA, LUNA + 0.9);
  T.carrera(R, t, { encuadre: 'laboratorio', camara: 'pizarra', cohete: 0, nube: Math.min(0.58, nube) });
  const TV = LUNA - 0.05 - T0;
  // la estela de tiza que queda (gruesa y punteada) y las bocanadas de polvo que crecen, se deshacen y caen
  if (vuelo > 0) {
    for (let i = 0; i < 60 * vuelo; i++) { const [x, y] = bz1(i / 60); if (i % 2 === 0 && i < 60 * vuelo - 3) { pset(Math.round(x), Math.round(y), TIZA); pset(Math.round(x) + 1, Math.round(y), TIZAS); pset(Math.round(x), Math.round(y) + 1, TIZAS); } }
    for (let i = 0; i < NPUF; i++) {
      const v = i / NPUF; if (v > vuelo) break;
      const tb = T0 + v * TV, ed = t - tb, [px, py] = bz1(v), r = 1.5 + Math.min(1, ed / 1.2) * 4.5, dens = Math.max(0, 0.75 - ed * 0.22);
      if (dens <= 0) continue;
      const cx = px + Math.sin(i * 2.1) * ed * 2, cy = py + ed * 2.2;
      for (let yy = Math.floor(cy - r); yy <= cy + r; yy++) for (let xx = Math.floor(cx - r); xx <= cx + r; xx++) {
        const d = Math.hypot(xx - cx, yy - cy) / r; if (d > 1 || enAtom(xx, yy)) continue;
        if (bay(xx, yy) < dens * (1 - d * d)) pset(xx, yy, d < 0.5 ? TIZA : TIZAS);
      }
      // dos motas de tiza que caen de cada bocanada hasta la repisa
      for (let q = 0; q < 2; q++) { const mx = Math.round(px + (q ? 3 : -2) + Math.sin(ed * 3 + i + q) * 2), my = Math.round(py + ed * (14 + q * 6)); if (my < 165 && !enAtom(mx, my)) pset(mx, my, q ? TIZAS : TIZA); }
    }
  }
  // el cohete de tiza grande con su llama que parpadea
  if (vuelo > 0 && vuelo < 1) {
    const [x, y] = bz1(vuelo), [x2, y2] = bz1(Math.min(1, vuelo + 0.02)), an = Math.atan2(y2 - y, x2 - x), ca = Math.cos(an), sa = Math.sin(an);
    const Q = (i, j) => [Math.round(x + ca * i - sa * j), Math.round(y + sa * i + ca * j)];
    for (let i = -12; i <= 9; i++) { const ww = i > 4 ? Math.max(0, (9 - i) * 0.9) : 4; for (let j = -ww; j <= ww; j += 0.5) { const [px, py] = Q(i, j); pset(px, py, Math.abs(Math.abs(j) - ww) < 0.6 || i === -12 ? TIZA : hex('#3a5a48')); } }
    for (const [i, j] of [[-12, -7], [-11, -6], [-10, -5], [-12, 7], [-11, 6], [-10, 5], [-9, 4], [-9, -4]]) { const [px, py] = Q(i, j); pset(px, py, TIZA); }
    const [wx0, wy0] = Q(1, 0); disco(wx0, wy0, 2, TIZA); pset(wx0, wy0, hex('#3a5a48'));
    const fl = 5 + Math.floor(t * 12) % 3;
    for (let i = 0; i < fl; i++) for (let j = -2; j <= 2; j++) { if (Math.abs(j) > 2 - i / fl * 2) continue; const [px, py] = Q(-13 - i, j); pset(px, py, i < 2 ? hex('#fff8d0') : (i + j + Math.floor(t * 20)) % 2 ? AMA : AMAS); }
  }
  // en «moon»: el destello dibujado que crece y titila, el halo de polvo que brilla y la tiza que salta
  const dz = tramo(t, LUNA - 0.02, LUNA + 0.5);
  if (dz > 0) {
    const hr = 4 + tramo(t, LUNA, LUNA + 0.8) * 14;
    for (let yy = Math.floor(54 - hr); yy <= 54 + hr; yy++) for (let xx = Math.floor(215 - hr); xx <= 215 + hr; xx++) { const d = Math.hypot(xx - 215, yy - 54) / hr; if (d <= 1 && bay(xx, yy) < 0.5 * (1 - d)) pset(xx, yy, d < 0.5 ? AMA : AMAS); }
    destello(215, 54, dz, t, AMA, TIZA, 22 + 8 * tramo(t, LUNA + 0.3, LUNA + 0.7));
    const e = t - LUNA;
    if (e < 1.4) for (let k = 0; k < 22; k++) { const an = k / 22 * Math.PI * 2 + hh(k, 7) * 0.3, sp = 18 + hh(k, 8) * 22, x = Math.round(215 + Math.cos(an) * sp * e), y = Math.round(54 + Math.sin(an) * sp * e + 16 * e * e); if (!enAtom(x, y) && y < 165) pset(x, y, k % 3 ? TIZA : AMA); }
  }
  // las líneas de mira de tiza que bajan del destello a la Tierra: «que lo viera el mundo entero»
  const mira = tramo(t, LUNA + 0.25, P2 - 0.1);
  if (mira > 0) for (const [ex, ey] of [[46, 128], [52, 136], [44, 146]]) for (let k = 0; k < 40 * mira; k++) { if (k % 3 === 2) continue; const u = k / 40; pset(Math.round(lerp(208, ex, u)), Math.round(lerp(60, ey, u)), TIZAS); }
  // la mano con la tiza: escribe 3, 2, 1 al lado de la Tierra, da el toque de salida y se retira soltando polvo
  const sube = tramo(t, 0.05, 0.35), retira = tramo(t, 1.35, 1.95);
  const dig = [['3', 0.3, 0.55], ['2', 0.6, 0.82], ['1', 0.86, 1.05]];
  dig.forEach(([s, a0, a1], i) => { const v = tramo(t, a0, a1); if (v > 0) R.numero(s, 78 + i * 10, 158, { n: Math.ceil(v * 8), color: TIZA, sombra: false }); });

    else if (t < 0.3) { wx = 66; wy = 156; }
    else { const k = tramo(t, 1.05, 1.15); wx = Math.round(lerp(98, 62, k)); wy = Math.round(lerp(154, 140, k)); }

  }

  // el gato espía llega por la repisa, se sienta a mirar el vuelo y en «moon» da un brinco y le pega a una mota
  const g = tramo(t, 1.5, 3.6), gx = Math.round(lerp(336, 168, g));
  const brinco = t > LUNA && t < LUNA + 0.45 ? Math.round(Math.sin(tramo(t, LUNA, LUNA + 0.45) * Math.PI) * 7) : 0;
  if (g > 0) T.gatoEspia(R, gx, 166 - brinco, t, { anda: g < 1, dir: g < 1 ? -1 : 1, cara: t > LUNA ? 'travieso' : undefined });
  if (g >= 1 && t > LUNA + 0.5) { const v = ((t - LUNA - 0.5) * 0.8) % 1; pset(Math.round(186 + Math.sin(v * 9) * 3), Math.round(140 + v * 16), TIZA); }
};
// 2 · por el telescopio: el ocular se abre, el trazo de tiza cruza y el destello brilla en «flash»; «?» en «conspiracy»
const p2 = (t) => {
  T.carrera(R, t, { encuadre: 'observatorio', camara: 'luna' });
  R.recorte([84, 18, 230, 166]);
  const tr = tramo(t, P2 + 0.3, FLASH - 0.05);
  for (let k = 0; k < 40 * tr; k++) { const u = k / 40, x = lerp(96, 192, u), y = lerp(160, 82, u) - Math.sin(u * Math.PI) * 26; if (k % 2 === 0) { disco(Math.round(x), Math.round(y), 1, TIZA); } }
  // un murciélago cruza por delante de la Luna antes del destello
  { const u = tramo(t, P2 + 0.7, P2 + 2.4); if (u > 0 && u < 1) { const x = Math.round(lerp(96, 236, u)), y = Math.round(140 - u * 70 + Math.sin(u * 14) * 4), f = Math.floor(t * 10) % 2; rect(x - 1, y - 1, x + 1, y, K); for (const s of [-1, 1]) { linea(x + s * 2, y - 1, x + s * 5, y - (f ? 4 : -1), K); linea(x + s * 5, y - (f ? 4 : -1), x + s * 7, y - (f ? 2 : 1), K); } } }
  // en «flash»: el halo de polvo que crece y brilla en la línea del día y la noche, y un anillo que se abre
  const hz = tramo(t, FLASH, FLASH + 1.6);
  if (hz > 0) { const hr = 3 + hz * 13; for (let yy = Math.floor(82 - hr); yy <= 82 + hr; yy++) for (let xx = Math.floor(192 - hr); xx <= 192 + hr; xx++) { const d = Math.hypot(xx - 192, yy - 82) / hr; if (d <= 1 && bay(xx, yy) < 0.62 * (1 - d * 0.8)) pset(xx, yy, d < 0.45 ? hex('#fff4c8') : d < 0.75 ? AMA : AMAS); } }
  { const e = t - FLASH; if (e > 0 && e < 0.9) { const r = Math.round(6 + e * 40); for (let q = 0; q < 48; q++) { const an = q / 48 * Math.PI * 2; if (q % 2) pset(Math.round(192 + Math.cos(an) * r), Math.round(82 + Math.sin(an) * r), e < 0.45 ? AMA : AMAS); } } }
  R.recorte(null);
  destello(192, 82, tramo(t, FLASH - 0.05, FLASH + 0.35), t, AMA, TIZA, 18);
  const q = tramo(t, CONSP, CONSP + 0.25);
  if (q > 0) R.numero('?', 214 + Math.round(Math.sin(t * 5) * 1.5), Math.round(lerp(64, 56, q) + Math.sin(t * 3) * 1.5), { tam: 16, centro: true });
  // el iris del ocular que se abre al principio
  const ab = tramo(t, P2, P2 + 0.6);
  if (ab < 1) { const r = 6 + ab * 80; for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) if (Math.hypot(x - 156, y - 92) > r) pset(x, y, K); }
};
// 3 · la redacción de 2000: Reiffel mayor entra y se lo cuenta al periodista
const p3 = (t) => {
  T.carrera(R, t, { encuadre: 'redaccion' });
  const u = tramo(t, P3 + 0.1, P3 + 1.5), rx = Math.round(lerp(326, 226, u));
  const habla = u >= 1 && Math.sin(t * 9) > -0.2;
  // al fondo, una compañera cruza con las hojas recién impresas y otro vuelve con su café
  { const u = tramo(t, P3 + 0.2, P4 - 0.2), x = Math.round(lerp(-12, 250, u)); if (u > 0 && u < 1) { const c = R.actor(EL.periodistaUK2, x, 146, t, { dir: 1, anda: true, sostiene: true }); const [hx, hy] = c.mano; rect(hx - 3, hy - 2, hx + 4, hy + 3, K); rect(hx - 2, hy - 1, hx + 3, hy + 2, hex('#f6f4ee')); pset(hx - 1, hy, hex('#8a8a90')); pset(hx + 1, hy + 1, hex('#8a8a90')); } }
  { const u = tramo(t, P3 + 1.8, P3 + 3.0), x = Math.round(lerp(334, 302, u)); if (u > 0) { const c = R.actor(EL.periodistaUK, x, 148, t, { dir: -1, anda: u < 1, sostiene: true, sonrisa: u >= 1 }); const [hx, hy] = c.mano; rect(hx - 2, hy - 3, hx + 2, hy + 1, K); rect(hx - 1, hy - 2, hx + 1, hy, hex('#f0ece0')); if (Math.floor(t * 4) % 2) pset(hx, hy - 5, hex('#c8c8d0')); } }
  R.actor(EL.periodista2000, 100, 141, t, { dir: 1, habla: false, sorpresa: t > DOSMIL && t < DOSMIL + 1.2, sonrisa: t > DOSMIL + 1.2, dedo: t > CUENTA && t < DOSMIL && Math.sin(t * 6) > 0 });

  const uo = tramo(t, P6 + 0.15, P6 + 0.6), ut = tramo(t, b(0.56), b(0.585));

  const on = tramo(t, VER - 0.2, LEJOS + 0.8);

};
// 7 · la mesa de acero: la carpeta del portaaviones de hielo, el bloque que gotea, la escarcha y dos sellos
const p7 = (t) => {
  poner(fondoAcero());
  const u = tramo(t, P7 + 0.1, HIELO + 0.3);

  const es = tramo(t, ICE - 0.2, ICE + 0.6);

  // el bloque de hielo a la derecha, con sus gotas y el charco que crece

  disco(bx, by + 3, Math.round(16 + tramo(t, P7, E.duracion) * 8), hex('#5a8ab0')); disco(bx, by + 3, Math.round(14 + tramo(t, P7, E.duracion) * 8), hex('#7ab0d0'));

  if (t > s1) { for (let d = 0; d < 3; d++) { linea(172 + d, 148, 178 + d, 156, hex('#2a8a3a')); linea(178 + d, 156, 192 + d, 136, hex('#2a8a3a')); } }

};
// 8 · la caja de archivo: cae la última carpeta, baja la tapa, el sello en «joke»; la pluma se escapa
const p8 = (t) => {
  poner(fondoCaja());
  { const an = t * 1.2 - Math.PI / 2; linea(40, 34, Math.round(40 + Math.cos(an) * 7), Math.round(34 + Math.sin(an) * 7), hex('#c83030')); linea(40, 34, 44, 31, K); pset(40, 34, K); }
  const cx = 160, y0 = 92, w = 120, h = 70;

  rect(cx - w / 2 - 1, y0 - 1, cx + w / 2 + 1, y0 + h + 1, K);
  rect(cx - w / 2, y0, cx + w / 2, y0 + 8, hex('#3a2818'));

  const cae = tramo(t, P8 + 0.15, P8 + 0.6);
  dib.forEach((d, i) => { const fin = y0 + 24 - (i % 2) * 2; const yy = i === 4 ? Math.round(lerp(-10, fin, cae * cae)) : fin; if (i === 4 && cae <= 0) return; T.PIEZAS_DC.carpeta(R, cx - 44 + i * 22, yy, { s: 2, dibujo: d }); });
  // el frente de la caja (delante de las carpetas)

  rect(cx - 10, y0 + h - 16, cx + 10, y0 + h - 10, K); rect(cx - 9, y0 + h - 15, cx + 9, y0 + h - 11, hex('#3a2414'));

  const tp = tramo(t, b(0.925), b(0.95)), ty = Math.round(lerp(-14, y0 - 2, tp * tp)), tw = w / 2 + 4;
  if (tp > 0) { rect(cx - tw - 1, ty - 1, cx + tw + 1, ty + 13, K); for (let y = ty; y <= ty + 12; y++) for (let x = cx - tw; x <= cx + tw; x++) pset(x, y, ramp([hex('#9a7a44'), hex('#b8945a'), hex('#d0aa6c')], 0.75 - (y - ty) / 16 + 0.1 * hh(x, y), x, y)); rect(cx - tw, ty + 12, cx + tw, ty + 12, hex('#6a4a24')); }
  if (tp >= 1 && t < b(0.95) + 0.25) for (const sx of [-1, 1]) for (let k = 0; k < 4; k++) pset(cx + sx * (tw + 4 + k * 3), y0 - 2 - k, hex('#c8b890'));
  if (t > JOKE + 0.1) marca(cx + 36, y0 + 52, 3);
  golpeSello(cx + 36, y0 + 52, t, JOKE + 0.1);
  sellar(cx + 36, y0 + 52, tramo(t, JOKE - 0.35, JOKE + 0.6));
  // la pluma de la gallina que se escapa por la rendija de la tapa y sube
  const pl = tramo(t, JOKE + 0.5, E.duracion);
  if (pl > 0) { const x = Math.round(cx - 30 - pl * 46 + Math.sin(t * 5) * 5), y = Math.round(y0 - 4 - pl * 36); linea(x, y, x + 5, y - 2, hex('#f6f2e6')); linea(x, y + 1, x + 5, y - 1, hex('#d8d0c4')); pset(x - 1, y + 1, K); }
};
