<script type="module">
// TH-ANULA (frase 27), 2016. Tres planos:
// 1. la sede de Theranos: una empleada mete en la trituradora, hoja a hoja, los resultados de la caja «2014»; con «throw
//    out every Edison result» entra un compañero empujando una carretilla con las cajas «2015», levanta una y la vuelca
//    entera dentro; la trituradora se atasca, tiembla, echa humo y escupe una lluvia de tiras de papel (gag); detrás de

//    los de al lado le miran y aparece «1 : 10»; con «voided» le cae encima un sello con la «X» y, con «corrected», la
//    enfermera le cambia la hoja por otra con el visto bueno y él sonríe; la recepcionista teclea y el reloj avanza.
import * as T from '/atomo/plato/escenas/th-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('th-anula');

};

  rect(90, 62, 96, 76, K); rect(91, 63, 95, 75, T.C.blanco); rect(92, 76, 94, 79, K); rect(91, 66, 95, 68, T.C.tealT);
  if (oscuro) {}
};
const recepcion = (t) => {   // el mostrador de recepción, a la derecha, por delante de la recepcionista
  const { rect, pset } = R; velo(264, 62, 319, 115, [190, 220, 236], 0.32); rect(262, 60, 319, 61, T.C.metalL); rect(262, 60, 263, 116, T.C.metalL); for (let i = 0; i < 12; i++) pset(268 + i, 66 + i * 2, hex('#f4f8fc'));
  rect(262, 116, 319, 150, K); rect(263, 117, 319, 149, hex('#b88a5a')); rect(263, 117, 319, 120, hex('#d8aa7a')); for (let x = 270; x < 320; x += 12) rect(x, 122, x, 148, hex('#a87a4a'));
