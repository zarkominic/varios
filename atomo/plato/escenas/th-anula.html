<script type="module">
// TH-ANULA (frase 27), 2016. Tres planos:
// 1. la sede de Theranos: una empleada mete en la trituradora, hoja a hoja, los resultados de la caja «2014»; con «throw
//    out every Edison result» entra un compañero empujando una carretilla con las cajas «2015», levanta una y la vuelca
//    entera dentro; la trituradora se atasca, tiembla, echa humo y escupe una lluvia de tiras de papel (gag); detrás de
//    los cristales pasan otros empleados;
// 2. el mapa de papel: la cámara baja hasta Arizona («in Arizona»), una mano clava la primera chincheta en Phoenix y caen
//    las demás; el marcador cuenta personas hasta 175,000 con «seventy-five thousand» y le sale el «+»; de las chinchetas
//    suben gotitas (los análisis); al lado, el café humea;
// 3. la sala de espera de la farmacia de Arizona: gira el ventilador del techo; por la ventana, el desierto con la
//    meseta, los saguaros, la carretera (pasan una camioneta y un camión), un halcón, la bola de rastrojo y el horizonte
//    que tiembla de calor; la tele pasa el anuncio de Theranos y, desde «one in ten», las noticias; cambia el número de
//    turno, la recepcionista con cascos teclea y la enfermera llena un vaso en el dispensador de agua, bebe y lo encesta
//    en la papelera (gag). Diez pacientes sentados con su resultado (dos charlan, una se abanica con la hoja, el profesor
//    dormita, la de la punta hace punto); con «one in ten» la hoja de uno se pone roja, él se sorprende, los de al lado le
//    miran (el profesor se despierta de golpe) y salta «1 : 10»; con «voided» le cae encima un sello con la «X» y, con
//    «corrected», la enfermera le cambia la hoja por otra con el visto bueno y él sonríe.
import * as T from '/atomo/plato/escenas/th-comun.js';
import { ELENCO_CHIBI as EL, tela } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('th-anula');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const a = (f) => en('anula', f);

const K = T.C.k, PAPEL = hex('#f4f0e4');
const lin = (t, x0, x1) => Math.min(1, Math.max(0, (t - x0) / (x1 - x0)));

// mezcla un rectángulo con un color (lo que se ve detrás del cristal)

// ── 1 · la trituradora ────────────────────────────────────────────────────────────────────────────────────────────
const VUELCA = a(0.123) + 0.4, ATASCO = a(0.241) - 0.5, TX = 150;

};

  { const cx = q.x - 32; R.rect(cx + 28, 140, cx + 29, 166, K); R.rect(cx + 2, 165, cx + 29, 166, K); R.disco(cx + 8, 166, 3, K); R.disco(cx + 8, 166, 1, T.C.metal); R.disco(cx + 24, 166, 3, K); R.disco(cx + 24, 166, 1, T.C.metal); caja(cx + 3, 164, 2015);
    if (!levanta) caja(cx + 3, 152, 2015);
    else if (t < VUELCA + 0.6) { const u = lin(t, VUELCA - 0.35, VUELCA), bx = Math.round(lerp(cx + 3, TX + 1, u)), by = Math.round(lerp(152, 124, u)); caja(bx, by, 2015, false);
      if (t > VUELCA) for (let k = 0; k < 6; k++) { const w = ((t - VUELCA) * 3 + k / 6) % 1; hoja(bx + 6 + (k % 3) * 4, Math.round(by - 2 + w * 8), false); } } }
  // el atasco: la máquina escupe una lluvia de tiras de papel que cae por todo el suelo
  if (atasco > 0.35) { const d = atasco - 0.35; for (let k = 0; k < 80; k++) { const dd = d - hsh(k, 1) * 0.3; if (dd < 0) continue; const vx = (hsh(k, 2) - 0.5) * 120, vy = -60 - hsh(k, 3) * 70, x = Math.round(TX + 13 + vx * dd), y = Math.round(126 + vy * dd + 90 * dd * dd);
    if (y > 176) { R.rect(x, 176, x + 2, 176, PAPEL); continue; } const g = Math.floor(t * 10 + k) % 2; R.rect(x - 1, y - 1, x + (g ? 5 : 1), y + (g ? 1 : 5), hex('#8a8e98')); R.rect(x, y, x + (g ? 4 : 0), y + (g ? 0 : 4), PAPEL); if (k % 5 === 0) R.pset(x, y, T.C.sangre); } }
};

// ── 2 · Arizona en el mapa ─────────────────────────────────────────────────────────────────────────────────────────
const CLAVA = P2 + 0.9, CUENTA = [a(0.401), a(0.575)], GOTAS = a(0.618);

  if (t > CUENTA[0] - 0.4) for (let k = 0; k < 44; k++) { const [x1, y1] = pts[k % pts.length], g = hsh(k, 5) * 6.28, r0 = 110 + hsh(k, 6) * 60, v = ((t - CUENTA[0] + 0.4) * 0.45 + hsh(k, 7)) % 1;
    const x = Math.round(x1 + Math.cos(g) * r0 * (1 - v)), y = Math.round(y1 + Math.sin(g) * r0 * 0.6 * (1 - v)); if (v < 0.92) { R.rect(x, y, x + 1, y + 1, [hex('#3a5a9a'), hex('#c8283a'), hex('#3a3046'), hex('#5a9a4a')][k % 4]); R.pset(x, y - 1, hex('#e8b890')); } }

  if (t > GOTAS) for (let k = 0; k < 14; k++) { const [x, y] = pts[(k * 7) % pts.length], v = ((t - GOTAS) * 0.9 + hsh(k, 4)) % 1; R.disco(x + (k % 3) - 1, Math.round(y - 10 - v * 16), v < 0.7 ? 1 : 0, T.C.sangre); }
  // la mano clava la primera chincheta, en Phoenix
  { const u = lin(t, CLAVA - 0.6, CLAVA), w = lin(t, CLAVA + 0.15, CLAVA + 0.7), [x, y] = pts[0]; if (u > 0 && w < 1) { const hx = Math.round(lerp(330, x + 8, u) + w * 120), hy = Math.round(lerp(190, y - 4, u) + w * 60); T.mano(R, hx, hy, -1, '#4a6a9a'); } }

  R.disco(282, 152, 11, K); R.disco(282, 152, 10, T.C.blanco); R.disco(282, 152, 7, hex('#6a4028')); R.pset(279, 149, hex('#8a6040')); R.rect(293, 150, 297, 154, K); R.rect(294, 151, 296, 153, T.C.blanco);
  for (let k = 0; k < 4; k++) { const v = (t * 0.6 + k / 4) % 1; R.pset(Math.round(282 + Math.sin(v * 7 + k) * 3 - v * 6), Math.round(146 - v * 22), hex('#f4f4f8')); }

  const e = lin(t, CUENTA[0], CUENTA[1]); if (e > 0) { const n = Math.round(175000 * (1 - (1 - e) ** 2)), mas = t > CUENTA[1] + 0.3, w = mas ? 196 : 180, x0 = 160 - w / 2;
    R.rect(x0, 20, x0 + w, 48, K); R.rect(x0 + 2, 22, x0 + w - 2, 46, hex('#f4f0e4')); R.rect(x0 + 2, 22, x0 + w - 2, 23, hex('#c8c0ac'));
    R.numero(n.toLocaleString('en-US') + (mas ? '+' : ''), 160, 42, { tam: 16, centro: true }); }

// ── 3 · la sala de espera de Arizona: uno de cada diez ─────────────────────────────────────────────────────────────
const PRUEBA = a(0.693), UNO = a(0.778), ANULA = a(0.906), CORRIGE = a(0.939) + 0.1, X = (k) => 12 + k * 24, ELEGIDO = 6;
const TURNO = P3 + 0.9, LLENA = [P3 + 0.1, P3 + 0.8], BEBE = [P3 + 0.95, P3 + 1.45], TIRA = UNO + 0.65;   // el turno cambia; la enfermera llena el vaso, bebe y lo encesta
const RUBIA = { H: hex('#e8c870'), h: hex('#c8a050') };

  return (0xff000000 | (Math.round(b + (((d >> 16) & 255) - b) * f) << 16) | (Math.round(g + (((d >> 8) & 255) - g) * f) << 8) | Math.round(r + ((d & 255) - r) * f)) >>> 0; };
// lo que no se mueve se pinta una sola vez en un búfer aparte y en cada fotograma se copia entero
const capas = new Map();
const capa = (clave, dibuja) => { let b = capas.get(clave); if (!b) { b = R.nuevo(); const prev = R.usar(b); dibuja(); R.usar(prev); capas.set(clave, b); } return b; };
const PW = Object.fromEntries(Object.entries({
  techo: '#f2ebe0', techoS: '#e4dacb', moldura: '#dccbb2', molduraS: '#c4b094', pared: '#eee4d4', paredS: '#e2d6c2', paredL: '#f6efe4', motivo: '#e4d6c0',
  friso: '#a88a6a', frisoL: '#c8a882', madera: '#d4bea0', maderaS: '#bea482', maderaL: '#e4d2b6', maderaD: '#a08260', rodapie: '#8a6a4a',
  suelo: '#dcd4c6', suelo2: '#d6cdbe', sueloS: '#c6bcac', sol: '#fbecc4', corcho: '#c89a68', corchoS: '#a87a4a', silla: '#3a8a9a', sillaL: '#5aaaba', sillaS: '#2a6a7a',

  rect(0, 100, 319, 129, PW.madera);

    for (let k = 0; k < 4; k++) { const vx = x0 + 6 + k * 7; for (let y = 107; y < 123; y++) if (hsh(vx, y) < 0.5) pset(vx + Math.round(Math.sin(y * 0.5 + k) * 0.8), y, PW.maderaS); } }
  rect(0, 130, 319, 132, PW.rodapie); rect(0, 130, 319, 130, PW.maderaD);
  // las baldosas en perspectiva, con un poco de ajedrez, y el sol de la ventana en el suelo (con la sombra del parteluz)
  for (let y = 133; y < 180; y++) { const f = 1 + (y - 133) / 40, fila = Math.floor((y - 133) / 9);
    for (let x = 0; x < 320; x++) { const col = Math.floor((160 + (x - 160) / f) / 26); pset(x, y, (col + fila) % 2 ? PW.suelo : PW.suelo2); } }
  for (let y = 140; y < 180; y += 9) rect(0, y, 319, y, PW.sueloS); for (let x = -40; x < 360; x += 26) linea(x, 133, x + (x - 160) * 0.35, 179, PW.sueloS); rect(0, 133, 319, 134, PW.sueloS);
  for (let y = 135; y < 180; y++) { const xa = Math.round(118 + (y - 135) * 0.75), xb = Math.round(200 + (y - 135) * 1.4), xm = Math.round(152 + (y - 135) * 1.08);
    for (let x = xa; x <= xb; x++) if ((x + y) % 2 === 0 && Math.abs(x - xm) > 1) pset(x, y, mezcla(R.pget(x, y), PW.sol, 0.55)); }
  // el marco blanco de la ventana y el alféizar con su sombra
  rect(102, 16, 200, 84, T.C.blanco); rect(105, 19, 197, 83, K); rect(100, 83, 202, 87, K); rect(101, 83, 201, 85, T.C.blanco); rect(101, 86, 201, 86, hex('#d8d0c4'));
  for (let x = 102; x < 201; x++) if (x % 2 === 0) pset(x, 88, PW.paredS);

  rect(76, 28, 98, 58, hex('#8a5a30')); rect(77, 29, 97, 57, PW.corcho); for (let k = 0; k < 30; k++) pset(77 + Math.floor(hsh(k, 13) * 21), 29 + Math.floor(hsh(k, 14) * 29), PW.corchoS);
  for (const [x0, y0, x1, y1, c, ch] of [[79, 31, 87, 41, T.C.blanco, T.C.rojo], [89, 31, 96, 38, hex('#f4e08a'), hex('#3a6ad8')], [80, 44, 90, 55, hex('#f4c8d8'), hex('#3a9a5a')], [91, 42, 96, 49, hex('#c8e0f4'), T.C.rojo]]) {
    rect(x0, y0, x1, y1, c); for (let y = y0 + 3; y < y1 - 1; y += 2) rect(x0 + 1, y, x1 - 2 - ((y >> 1) % 3), y, hex('#a8a4a0')); pset(Math.round((x0 + x1) / 2), y0, ch); }

  for (let x = 63; x < 88; x += 3) pset(x, 118, T.C.metalS);
