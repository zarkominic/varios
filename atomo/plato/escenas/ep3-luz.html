const E = await escena('ep3-luz', 'ep03');

const SALTOS = [];
{ const a0 = m.subir - 0.25; for (let k = 0; k < 3; k++) SALTOS.push([a0 + k * 0.58, a0 + k * 0.58 + 0.4, 0]); }
{

// ---------------------------------------------------------------- la cámara del mundo

const C4 = (() => { const c = camara(4), d = [MUNDO.CIUDAD[0] / c.mpp, -MUNDO.CIUDAD[1] / c.mpp]; return camaraPorTierra(c.z, [930 - d[0], 470 - d[1]], 4); })();

// ---------------------------------------------------------------- el plató

// la viñeta del mundo, quitada (crearPost la vuelve a poner al final): color-dodge con 1 − v (la de ep3-mapa)
const VIG = { K: 0.42, A: 0.42, B: 1.12 };
const GRAD_VIG = (gc) => {
  const R = Math.hypot(960, 540) + 2;
  const gr = gc.createRadialGradient(960, 540, 0, 960, 540, R);
  for (let i = 0; i <= 24; i++) {
    const r = (i / 24) * R, v = 1 - VIG.K * ss(VIG.A, VIG.B, r / 1080);
    const q = Math.round((1 - v) * 255);
    gr.addColorStop(i / 24, `rgb(${q},${q},${q})`);
  }

};

function hervir(f, semilla, c) {
  const r = mulberry32(semilla), k = f.width / W, out = lienzo(f.width, f.height), go = out.getContext('2d');

// ---------------------------------------------------------------- la regla

// ---------------------------------------------------------------- fotos
const FOTOS = {}, HACER = {};

const F = (k) => FOTOS[k] ?? (FOTOS[k] = asentar(HACER[k]()));
const CIUDAD_C = [930, 470];
const fotoMundoSin = (C, n, zr) => sinVineta(fotoMundo(mundo, estadoMundo(C, n, { somA: somA(zr) })));

  const kV = 1 - ss(T.zoom2[0] + 0.1, T.zoom2[0] + 0.7, ts);
  if (sCab > 0 && kV > 0.003) vueltas(sCab, Et, Rt / R0, kV, repintar, vivo);
  // 4 · la cinta de año luz (se pierde a lo lejos al pasar de 10¹⁶)
  const kC = 1 - ss(16.3, 17.3, zr);
  if (ts > T.cinta[0] && kC > 0.003) cintaAL(C, ts, kC, vivo);
  // 5 · el rayo que cruza la galaxia
  rayoCruza(ts);
  // 6 · la regla (foto quieta o en vivo) y el plató en vivo: Atom, el reloj, el reloj de arena, la cartela
  if (!reglaVivaEn(n)) pegarTrozo(F(zi === 21 && n >= N_FIN ? 'reg21_0' : regDe(zi, n)));
  else pegarTrozo(reglaEnDos(n));
  P.limpiar();
  const kReloj = relojEn(ts);
  const infoArena = arenaEn(ts);
  atomo(ts, zr < 7 ? sueloClaro(zr) : 0);
  const cartelaViva = ts >= 0.75 && ts < 1.3;
  if (cartelaViva) cartela(P, ts, E.cartela);
  P.render(n, { fondo: false });
  pegarGL();
  if (infoArena) vidrioArena(g, infoArena, { fuerza: infoArena.k });
  unoS(ts, kReloj);
  if (ts < 0.75) g.drawImage(F('cartela0'), 0, 0, W, H);
  parpadeo(n);
  POST.aplicar(g, n);
  window.__plano = `zr ${zr.toFixed(3)} z ${C.z.toFixed(3)}${vivo ? ' vivo' : ''}`;
}
window.__tiempos = { ...T, SALTOS: SALTOS.map(([a, b]) => [+a.toFixed(3), +b.toFixed(3)]) };
window.__inicio = {
  mundo: `camaraPorTierra(${C4.z.toFixed(3)}, [${tierraPx(C4).map((v) => v.toFixed(1))}]), n 940, sin viñeta`, brilloCiudad: 1, estrellaNeutrones: { centro: CIUDAD4, radio_m: R_NS, radio_px: R_NS / C4.mpp, brillo: 0.6 },
  regla: 'e 4 (foto n 9400)', atomo: ATOMO,
};
window.__fin = { mundo: `camara(21), n ${N_LUZ}, somA ${SOM_A.map((v) => +v.toFixed(2))}`, regla: 'e 21 (foto n 0)', atomo: ATOMO, galaxia: GAL };
marcaCarga('listo');
