<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sharp · ep4</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// EP4-SHARP (frases 2–4), cartela 1681.
//  sharp  el balandro pirata se pega a un galeón español; desde el galeón alguien lanza un libro grueso al agua y,
//         en el aire, lo atrapa un pirata del balandro.
//  espana Londres de noche con niebla: tejados y una horca recortada contra la Luna.
//  rey    sala con velas: el pirata, de rodillas, ofrece el libro al rey, que lo toma; en la ventana, la horca se desvanece.
import { escena } from '/atomo/plato/escena.js';
import { crearRetro } from '/atomo/plato/kits/pixel-retro.js';
const E = await escena('ep4-sharp', 'ep04');
const R = await crearRetro(document.getElementById('lienzo'));
const { PAL, tramo, lerp, clamp, sale } = R;
const M = (k, d) => E.marca(k, d);
const m = { sharp: M('sharp', 1.5), espana: M('espana', 7), rey: M('rey', 9.5), fin: E.duracion };

// horca: dos postes y la cuerda (silueta)
const horca = (x, suelo, h, c = PAL.INK) => {
  R.rect(x, suelo - h, x + 1, suelo, c);
  R.rect(x, suelo - h, x + Math.round(h * 0.45), suelo - h + 1, c);
  R.linea(x + 1, suelo - h + Math.round(h * 0.25), x + Math.round(h * 0.2), suelo - h + 1, c);
  R.linea(x + Math.round(h * 0.42), suelo - h + 2, x + Math.round(h * 0.42), suelo - h + Math.round(h * 0.3), c);
  R.anillo(x + Math.round(h * 0.42) + 0.5, suelo - h + Math.round(h * 0.3) + 2.5, 2, c);
};
// libro cerrado pequeño (en vuelo)
const libroCerrado = (x, y, giro) => {
  const w = 6, h = 4;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const xx = Math.round(x + (i - w / 2) * Math.cos(giro) - (j - h / 2) * Math.sin(giro)), yy = Math.round(y + (i - w / 2) * Math.sin(giro) + (j - h / 2) * Math.cos(giro));
    R.pset(xx, yy, j === 0 || i === 0 ? PAL.MOON[3] : PAL.OBS[3]);
  }
};

const abordaje = (t) => {
  R.cielo(t, { luna: [250, 34, 13], nubes: true });
  R.mar(t, { luzX: 250 });
  const g = R.barco(110, 136, t, { tipo: 'galeon', bandera: 'espana', farol: true, esc: 0.95 });
  const llega = tramo(t, m.sharp - 0.6, m.sharp + 1.6);
  const bx = lerp(300, 200, llega);
  R.barco(bx, 138, t, { tipo: 'balandro', bandera: 'pirata', dir: -1, esc: 0.9, fase: 1.3 });
  // figuras en cubierta: el español en el galeón, el pirata en el balandro
  R.figura(140, g.wl - 13, 14, { sombrero: 'sombrero', pose: tramo(t, m.sharp + 1.4, m.sharp + 1.7) > 0 ? 'brazos' : 'pie' });
  const piraX = bx - 4;
  const lanza = m.sharp + 1.8, atrapa = m.sharp + 3.0;
  R.figura(piraX, 132, 14, { sombrero: 'pañuelo', faja: 2, pose: t > atrapa - 0.3 ? 'brazos' : 'pie', dir: -1 });
  // el libro: sale del español, sube y cae hacia el agua; el pirata lo atrapa
  if (t > lanza) {
    const p = clamp((t - lanza) / (atrapa - lanza), 0, 1);
    const x = lerp(142, piraX - 1, p), y = lerp(g.wl - 30, 104, p) - 26 * Math.sin(Math.PI * p);
    libroCerrado(x, t < atrapa ? y : 104 + Math.round(Math.sin(t * 6)), t < atrapa ? p * 9 : 0);
  }
};
const londres = (t) => {
  R.cielo(t, { luna: [210, 50, 15], hor: 150, semilla: 4, nubes: { bandas: [[60, 10, 0.8]] } });
  // tejados de Londres en silueta
  const rnd = R.mulberry32(9);
  let x = -4;
  while (x < 330) {
    const w = 12 + Math.floor(rnd() * 16), h = 18 + Math.floor(rnd() * 26);
    R.rect(x, 150 - h, x + w, 180, PAL.MIDC[1]);
    R.poligono([[x - 1, 150 - h], [x + w / 2, 150 - h - 7], [x + w + 1, 150 - h]], PAL.MIDC[1]);
    if (rnd() < 0.5) R.rect(x + 3, 150 - h - 9, x + 5, 150 - h - 3, PAL.MIDC[1]);
    for (let k = 0; k < 3; k++) if (rnd() < 0.4) { const wx = x + 3 + Math.floor(rnd() * (w - 6)), wy = 150 - h + 6 + Math.floor(rnd() * (h - 12)); R.rect(wx, wy, wx + 1, wy + 1, PAL.FIRE[2]); }
    x += w + 1;
  }
  // colina con la horca, delante de la Luna
  R.poligono([[150, 180], [170, 128], [250, 122], [290, 180]], PAL.FGC[1]);
  for (let xx = 170; xx < 250; xx++) R.pset(xx, 122 + Math.round((xx - 210) ** 2 / 400) + (xx < 175 ? 175 - xx : 0), PAL.FGC[3]);
  horca(200, 124, 52);
  R.niebla(t, 120, 180, 1.1, 6);
};
const sala = (t) => {
  R.interior(t, { luces: [[90, 50], [250, 50]], suelo: 140 });
  R.vela(90, 56, t); R.vela(250, 56, t);
  // ventana con la horca: se desvanece cuando el rey toma el libro
  const wx = 150, wy = 30;
  R.rect(wx - 1, wy - 1, wx + 41, wy + 41, PAL.HULL[3]);
  for (let y = wy; y <= wy + 40; y++) for (let x = wx; x <= wx + 40; x++) R.pset(x, y, R.tone(PAL.SKY, 3 + (y - wy) / 14, x, y));
  R.lunaLlena(wx + 30, wy + 10, 5);
  const toma = m.rey + 2.0, borra = tramo(t, toma + 0.3, toma + 1.6);
  if (borra < 1) horcaSola(wx + 10, wy + 40, 30, borra);
  R.rect(wx + 20, wy, wx + 20, wy + 40, PAL.HULL[3]); R.rect(wx, wy + 20, wx + 40, wy + 20, PAL.HULL[3]);
  // el rey y el pirata
  const p = tramo(t, m.rey + 0.6, toma);
  R.figura(205, 150, 46, { sombrero: 'corona', capa: true, dir: -1, pose: p > 0.7 ? 'ofrece' : 'pie', objeto: p >= 0.7 ? 'libro' : null });
  R.figura(120, 150, 40, { sombrero: 'tricornio', faja: 2, pose: 'rodilla', objeto: p < 0.7 ? 'libro' : null });
};
// la horca de la ventana, borrada con tramado según b
const horcaSola = (x, suelo, h, b) => {
  const B = R.nuevo(); const prev = R.usar(B);
  horca(x, suelo, h, PAL.INK);
  R.usar(prev);
  for (let y = suelo - h; y <= suelo; y++) for (let xx = x; xx <= x + h; xx++) {
    const c = B[y * R.W + xx];
    if (c && R.hash2(xx, y) * 0.6 + R.b4(xx, y) * 0.4 >= b) R.pset(xx, y, c);
  }
};

E.iniciar((t) => {
  R.secuencia(t, [
    [0, (t) => R.cartela(t, '1681')],
    [1.2, abordaje],
    [m.espana - 0.2, londres],
    [m.rey - 0.2, sala],
  ]);
  if (t > 1.3) R.companero(t, E.energia(t));
  R.presentar();
});
</script>
</body>
</html>
