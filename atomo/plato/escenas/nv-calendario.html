<title>La fecha · ep22</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>

<body>
<canvas id="lienzo"></canvas>
<script type="module">
// NV-CALENDARIO (frase 11), cartela «354», barra 354. Cuatro planos:
// 1. la Biblia abierta (inserto): la mano pasa la hoja de la derecha en «The next myth is the date», recorre los renglones
//    buscando la fecha y no la hay: el «?» dorado salta en «never says»; en «born» cae el calendario de la mesa con la
//    hoja en blanco y su «?» rojo, y la mano se aparta. La vela tiembla y una polilla le da vueltas;
// 2. el scriptorium romano: el calígrafo pinta el calendario; al fondo el ayudante coge un rollo de la estantería y se lo
//    lleva; la criada le trae un tintero nuevo y lo deja en el pupitre; en «354» sale el número; el cristiano rico de
//    toga entra por la izquierda con la bolsa («made for»), se la tiende en «wealthy Christian», el
//    calígrafo la coge con un saltito y el cliente señala la hoja;
// 3. la hoja del calendario de cerca: la mano con el cálamo llena la columna de diciembre y se para en el 25 en
//    «December 25th»; se aparta en «Christ», la estrella se enciende sola en «Bethlehem» y la mano vuelve en «same book»
//    a dibujar el sol con rayos en la misma casilla (se enciende todo) y se va en «same day»;
// 4. el templo del Sol al alba: la fiesta del Sol Invicto; dos con antorchas llegan por los lados, tres fieles suben la
//    escalinata con sus antorchas, la romana señala la puerta; en «Sun» el disco se enciende, todos alzan los brazos y
//    las palomas de la escalinata echan a volar.
import * as T from '/atomo/plato/escenas/nv-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('nv-calendario');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const a = (f) => en('fecha', f);
const P2 = a(0.211), P3 = a(0.566), P4 = a(0.866), FIN = E.duracion;
const biblia = a(0.082), nunca = a(0.097), nacio = a(0.179), romano = a(0.346), ano354 = a(0.42), hecho = a(0.489), rico = a(0.514);
const dic = a(0.618), cristo = a(0.681), belen = a(0.729), libro = a(0.781), mismo = a(0.849), fiesta = a(0.9), sol = a(0.975);
const K = T.C.k;
const suave = (u) => u * u * (3 - 2 * u);
const mz = (a, b, u) => { u = Math.max(0, Math.min(1, u)); const m = (s) => Math.round(((a >>> s) & 255) + (((b >>> s) & 255) - ((a >>> s) & 255)) * u); return (0xff000000 | (m(16) << 16) | (m(8) << 8) | m(0)) >>> 0; };
// una antorcha en la mano (x, y): el palo, la llama que tiembla y su chispa
const antorcha = (x, y, t, k = 0) => { R.rect(x, y - 8, x + 1, y + 2, hex('#6a4422')); R.pset(x, y - 8, hex('#3a2416')); const f = Math.sin(t * 20 + k * 2) > 0 ? 0 : 1;
  R.disco(x, y - 10, 2, hex('#f0a040')); R.pset(x, y - 12 - f, hex('#ffd060')); R.pset(x + (f ? 1 : -1), y - 13, hex('#fff0a0')); R.pset(x, y - 10, hex('#fff0a0')); };
// un rollo de papiro (horizontal, centrado en x, y)
const rollo = (x, y) => { R.rect(x - 5, y - 1, x + 5, y + 1, K); R.rect(x - 4, y, x + 4, y, hex('#e8d8a8')); R.pset(x - 4, y - 1, hex('#f4ead0')); R.pset(x - 6, y, hex('#8a5a2a')); R.pset(x + 6, y, hex('#8a5a2a')); };
// una paloma que vuela (alas arriba o abajo)
const paloma = (x, y, ar) => { R.rect(x - 1, y, x + 2, y + 1, hex('#c8c8d4')); R.pset(x + 3, y, hex('#8a8a9a')); R.pset(x + 4, y, hex('#e0a040'));
  if (ar) { R.pset(x - 1, y - 1, hex('#e8e8f0')); R.pset(x - 2, y - 2, hex('#e8e8f0')); R.pset(x + 1, y - 1, hex('#b0b0c0')); } else { R.pset(x - 1, y + 2, hex('#b0b0c0')); R.pset(x - 2, y + 2, hex('#e8e8f0')); } };
const p1 = (t) => {
  const g = T.epoca(R, t, { encuadre: 'copista', camara: 'pagina', ji: 0 });
  // la polilla que da vueltas a la llama de la vela (y su sombrita en el pergamino)
  { const a = t * 3.1, x = Math.round(299 + Math.cos(a) * 9), y = Math.round(100 + Math.sin(a * 1.7) * 6), al = Math.sin(t * 40) > 0;
    R.pset(x, y, hex('#a89880')); R.pset(x + 1, y, hex('#8a7a62')); R.pset(x - 1, y - (al ? 1 : 0), hex('#d8ccb0')); R.pset(x + 2, y - (al ? 1 : 0), hex('#d8ccb0')); }
  // la hoja de la derecha que pasa la mano en «the date»: se curva, se alza y cae a la izquierda
  const ho = tramo(t, 1.35, 2.45);
  let xr = 272, alza = 0;
  if (ho > 0 && ho < 1) { const e = suave(ho); xr = Math.round(lerp(272, 30, e)); alza = Math.sin(e * Math.PI) * 16;
    const xa = Math.min(151, xr), xb = Math.max(151, xr);
    for (let y = 34; y <= 168; y++) { const cu = Math.round(alza * Math.sin((y - 34) / 134 * Math.PI) * 0.3);
      for (let x = xa; x <= xb; x++) { const d = Math.abs(x - 151) / 121, yy = y - Math.round(alza * d);
        let c = x === xr ? hex('#a08860') : mz(hex('#f2e4c0'), hex('#c4ac80'), d * 0.8 + (xr < 151 ? 0.15 : 0));
        if ((y - 40) % 7 === 0 && x > xa + 6 && x < xb - 6 && y > 40 && y < 162 && ((x * 3 + y) % 11) > 1) c = mz(c, hex('#5a4a3a'), 0.45);
        R.pset(x + (xr < 151 ? -cu : cu), yy, c); } }
  }
  // la mano: entra y coge la esquina de la hoja; luego recorre los renglones buscando la fecha y se aparta en «born»
  const u = tramo(t, 2.6, nacio - 0.2), fila = Math.min(2, Math.floor(u * 3)), fr = (u * 3) % 1, sale = tramo(t, nacio - 0.2, nacio + 0.5);
  let tx, ty;
  if (t < 1.35) { const e = suave(tramo(t, 0.8, 1.35)); tx = Math.round(lerp(330, 259, e)); ty = Math.round(lerp(214, 160, e)); }
  else if (t < 2.45) { tx = xr - 13; ty = Math.round(160 - alza * 0.9); }
  else if (t < 2.6) { const e = suave(tramo(t, 2.45, 2.6)); tx = Math.round(lerp(17, 52, e)); ty = Math.round(lerp(160, 122, e)); }
  else { tx = Math.round(lerp(u >= 1 ? 150 : lerp(52, 150, fr), 330, sale)); ty = Math.round(lerp(122 + fila * 12, 210, sale)); }
  T.brazo(R, tx + 34, 204, tx + 13, ty + 3, '#7a5a3a', -1, { codo: [tx + 30, Math.round(lerp(ty, 204, 0.5))], puno: '#e8dcc0' });
  // donde iría la fecha, el recuadro azul vacío: el «?» dorado grande que salta y tiembla en «never says»
  const q = tramo(t, nunca, nunca + 0.3); if (q > 0) { const k = Math.round(lerp(2, 5, q)); R.icono('?', 214 - Math.round(2.5 * k) + Math.round(Math.sin(t * 12) * 0.7), 98 - Math.round(3.5 * k), hex('#f0c040'), K, k); }
  // el calendario de la mesa: la hoja en blanco con un «?» en lugar del día, que cae en «born» y rebota
  const c = tramo(t, nacio - 0.6, nacio), bo = t > nacio && t < nacio + 0.3 ? Math.round(Math.sin((t - nacio) / 0.3 * Math.PI) * 3) : 0;
  if (c > 0) { T.PIEZAS_NV.calendario(R, 252, Math.round(lerp(130, 176, c * c)) - bo, { s: 2 }); if (c >= 1) R.icono('?', 247, 146 - bo, hex('#c8303a'), K, 2); }
};
const p2 = (t) => {
  const g = T.roma(R, t, { encuadre: 'scriptorium' });
  // al fondo, el ayudante coge un rollo de la estantería y se lo lleva por la izquierda
  const co = tramo(t, P2 + 0.3, P2 + 1.3), va = tramo(t, P2 + 1.5, romano + 1.2), ax = Math.round(lerp(168, -16, va));
  if (va < 1) { const ay = R.actor(EL.romanoPileo2, ax, 134, t, { dir: va > 0 ? -1 : 1, anda: va > 0, sostiene: va > 0 ? true : [178, Math.round(lerp(118, 98, Math.sin(co * Math.PI)))] });
    if (co > 0.5 || va > 0) rollo(ay.mano[0], ay.mano[1] - 1); }
  // el calígrafo pinta (la mano va y viene sobre la hoja); en «354» levanta el pincel y sonríe; luego atiende al cliente
  const tiende = t > rico, coge = t > rico + 0.45;
  const cal = R.actor(EL.caligrafo, 182, 158, t, { dir: -1, sostiene: coge ? [170, 132] : tiende ? [166, 128] : t > ano354 && t < ano354 + 0.8 ? [158, 124] : [150 + Math.round(Math.sin(t * 9) * 4), 138 + Math.round(Math.cos(t * 6))],
    sonrisa: t > ano354 && t < ano354 + 0.8 || t > rico, habla: t > rico && Math.sin(t * 7) > 0.3, salto: coge && t < rico + 0.75 ? 1 : 0 });
  if (coge) T.PIEZAS_NV.bolsa(R, cal.mano[0] - 1, cal.mano[1] + 5, {});
  // la criada trae un tintero nuevo por la derecha, lo deja en la esquina del pupitre y se vuelve
  const ll = suave(tramo(t, P2 + 0.2, P2 + 1.7)), vt = suave(tramo(t, P2 + 2.5, P2 + 4.0)), deja = t > P2 + 2.1;
  if (vt < 1) { const cx = Math.round(lerp(lerp(336, 204, ll), 336, vt)), cr = R.actor(EL.romana, cx, 163, t, { dir: vt > 0 ? 1 : -1, anda: (ll > 0 && ll < 1) || vt > 0, sostiene: deja ? false : ll >= 1 ? [190, 134] : true, sonrisa: ll >= 1 });
    if (!deja) { R.rect(cr.mano[0] - 2, cr.mano[1] - 3, cr.mano[0] + 2, cr.mano[1] + 1, K); R.rect(cr.mano[0] - 1, cr.mano[1] - 2, cr.mano[0] + 1, cr.mano[1], hex('#4a4a6a')); R.pset(cr.mano[0], cr.mano[1] - 4, hex('#2a2a3a')); } }
  if (deja) { R.rect(162, 132, 166, 137, K); R.rect(163, 133, 165, 136, hex('#4a4a6a')); R.pset(163, 133, hex('#8a8ab0')); R.pset(164, 131, hex('#2a2a3a')); }
  // el 354 que sale sobre el pupitre
  const n = tramo(t, ano354, ano354 + 0.3) - tramo(t, hecho - 0.5, hecho - 0.1);
  if (n > 0) R.numero('354', 141, Math.round(lerp(128, 116, n)), { tam: 16, centro: true });
  // el cristiano rico entra por la izquierda con la bolsa, se para ante el pupitre, la tiende y señala la hoja
  const viene = tramo(t, hecho - 2.0, hecho), x = Math.round(lerp(-20, 100, suave(viene)));
  if (viene > 0) { const m = R.actor(EL.cristianoRico, x, 158, t, { dir: 1, anda: viene < 1, sostiene: coge ? false : tiende ? [x + 18, 130] : true, dedo: t > rico + 0.6, sonrisa: tiende, habla: t > rico + 0.6 && Math.sin(t * 8) > 0.2 });
    if (!coge) T.PIEZAS_NV.bolsa(R, m.mano[0] + 1, m.mano[1] + 5, {}); }
  T.romaDelante(R, t, { encuadre: 'scriptorium' });
};
const p3 = (t) => {
  const esc = lerp(0.68, 1, tramo(t, P3 + 0.2, dic + 0.2)), br = tramo(t, libro + 0.1, libro + 0.7);
  const g = T.roma(R, t, { encuadre: 'scriptorium', camara: 'mesa', escrito: esc, brilla: br });
  const fy = g.fila || ((r) => r < 24 ? 48 + r * 3 : r === 24 ? 120 : 130 + (r - 25) * 3);
  // la estrella sola se enciende primero, en «Bethlehem»
  const es = tramo(t, cristo, belen);
  if (es > 0 && br === 0) { for (let r = 2; r <= 4 + es * 5; r++) for (let k = 0; k < 10; k++) { const an = k / 10 * Math.PI * 2 + t; if ((k + r) % 3 === 0) R.pset(Math.round(221 + Math.cos(an) * r), Math.round(123 + Math.sin(an) * r * 0.8), hex('#fff0a0')); } R.rect(220, 121, 222, 125, hex('#f0c040')); R.rect(219, 123, 223, 123, hex('#f0c040')); }
  // la mano con el cálamo escribe la columna de diciembre renglón a renglón, llega al 25 en «December 25th», lo señala
  // y se aparta en «Christ»; vuelve en «same book» a trazar el sol alrededor de la estrella y se va en «same day»
  const r = Math.min(31, Math.round(esc * 31)), sale = tramo(t, cristo - 0.2, cristo + 0.5);
  let tx = Math.round(lerp(r >= 25 && r < 31 ? 224 : 220 + Math.sin(t * 14) * 3, 330, sale)), ty = Math.round(lerp(r >= 25 && t > dic ? 124 : fy(Math.max(0, r - 1)), 200, sale));
  const vu = suave(tramo(t, libro - 0.8, libro + 0.1)), va = suave(tramo(t, mismo - 0.4, mismo + 0.25));
  if (vu > 0) { const a = tramo(t, libro + 0.1, libro + 0.7) * Math.PI * 2 - 1.6, cx = Math.round(221 + Math.cos(a) * 8), cy = Math.round(123 + Math.sin(a) * 7);
    tx = Math.round(lerp(lerp(330, cx, vu), 330, va)); ty = Math.round(lerp(lerp(200, cy, vu), 200, va)); }
  const fx = tx + 14, fyy = ty + 12;
  R.linea(tx, ty, fx, fyy, hex('#c8b070')); R.linea(tx + 1, ty, fx + 1, fyy, hex('#8a7040')); R.pset(tx, ty, K);
  T.brazo(R, fx + 34, 204, fx + 13, fyy + 2, '#e8dcc0', -1, { codo: [fx + 32, Math.round(lerp(fyy, 204, 0.5))] });
  T.romaDelante(R, t, { encuadre: 'scriptorium', camara: 'mesa' });
};
const p4 = (t) => {
  const g = T.roma(R, t, { encuadre: 'templo' });
  // el disco del Sol de la puerta se enciende en «Sun»
  const s = tramo(t, sol - 0.3, sol + 0.2);
  if (s > 0) for (let r = 4; r < 4 + s * 14; r += 2) for (let k = 0; k < 16; k++) { const an = k / 16 * Math.PI * 2 + t * 0.6; if ((k + r) % 2 === 0) R.pset(Math.round(165 + Math.cos(an) * r), Math.round(86 + Math.sin(an) * r), hex('#fff0a0')); }
  // tres fieles con antorchas suben la escalinata, uno tras otro, y se paran arriba; en «Sun» alzan los brazos
  // (se paran a los lados de la puerta, para no tapar el disco)
  for (const [k, x0, x1, y1, d] of [[0, 104, 130, 124, 1], [1, 230, 206, 124, -1], [2, 92, 108, 138, 1]]) {
    const su = suave(tramo(t, P4 + 0.1 + k * 0.4, sol - 0.3 + k * 0.1)), arr = t > sol + k * 0.08;
    const f = R.actor([EL.romanoPileo, EL.romana, EL.romanoPileo2][k], Math.round(lerp(x0, x1, su)), Math.round(lerp(154, y1, su)), t, { dir: d, anda: su > 0 && su < 1, sostiene: arr ? false : true, brazos: arr, sonrisa: arr });
    if (!arr) antorcha(f.mano[0], f.mano[1], t, k + 3);
  }
  // las palomas de la escalinata echan a volar en «Sun», hacia la izquierda y arriba
  const vu = tramo(t, sol, sol + 1.4);
  if (vu > 0) for (let k = 0; k < 5; k++) { const x = Math.round(118 + k * 20 - vu * (90 + k * 14)), y = Math.round(128 + (k % 2) * 8 - vu * (60 + k * 6)); if (x > -6 && y > 30) paloma(x, y, Math.sin(t * 26 + k * 2) > 0); }
  // la gente de la fiesta en la plaza: dos que llegan con antorchas, la romana que señala la puerta y el de toga
  const u = tramo(t, P4 + 0.1, sol - 0.2);
  const m1 = R.actor(EL.romanoPileo, Math.round(lerp(14, 66, u)), 166, t, { dir: 1, anda: u > 0 && u < 1, sostiene: true, brazos: t > sol, sonrisa: true });
  if (!(t > sol)) antorcha(m1.mano[0], m1.mano[1], t, 0);
  const m2 = R.actor(EL.romanoPileo2, Math.round(lerp(290, 214, u)), 166, t, { dir: -1, anda: u > 0 && u < 1, sostiene: true, brazos: t > sol + 0.1, sonrisa: true });
  if (!(t > sol + 0.1)) antorcha(m2.mano[0], m2.mano[1], t, 1);
  R.actor(EL.romana, 160, 172, t, { dir: -1, dedo: t > fiesta && t < sol, brazos: t > sol + 0.2, sonrisa: true, salto: t > sol + 0.2 ? Math.round(Math.abs(Math.sin((t - sol) * 9)) * 2) : 0 });
  R.actor(EL.cristianoRico, 244, 176, t, { dir: -1, sorpresa: t > sol, habla: t > fiesta && t < sol && Math.sin(t * 7) > 0 });
};
const efectos = [[1.4, 'papel'], [nunca + 0.05, 'pop'], [nacio, 'golpecito'], [ano354, 'brillo'], [rico + 0.45, 'toc'],
  [P3 + 0.3, 'lapiz'], [belen, 'brillo'], [libro + 0.1, 'lapiz'], [P4 + 0.3, 'publico'], [sol, 'brillo']];
T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3], [P4, p4]], { cartela: '354', efectos, año: 354 });
</script>
