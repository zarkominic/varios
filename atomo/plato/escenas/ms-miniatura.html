<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ep47 · miniatura</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// MS-MINIATURA · ep47, canon de miniatura del 43: a la izquierda, en la casita del lago de Ginebra la noche de la
// tormenta de 1816, MARY (18) sola junto a la ventana con su palmatoria; fuera, en lo oscuro, dos ojos amarillos y
// acuosos que la miran (la imagen de su introducción de 1831; la criatura NO se ve, y nada de las películas); Atom grande
// y pensativo a la derecha; corte en diagonal, «MARY» en pixel grande y el «18» en blanco hueso.
import { crearRoma } from '/atomo/plato/kits/pixel-roma.js';
import { conChibi } from '/atomo/plato/kits/pixel-chibi.js';
import { hex } from '/atomo/plato/kits/pixel-retro.js';
import { lago, lagoDelante, estudio, MS } from '/atomo/plato/escenas/ms-comun.js';
import * as AT from '/atomo/plato/escenas/atom-personaje.js';
import { figura, grado, halo, desplazar, cifra } from '/atomo/plato/escenas/mini-chibi.js';
const R = conChibi(await crearRoma(document.getElementById('lienzo')));
// letras de pixel (5 × 7) para las 1–3 palabras de la miniatura
const F = {
  M: ['#...#', '##.##', '#.#.#', '#.#.#', '#...#', '#...#', '#...#'], A: ['.###.', '#...#', '#...#', '#####', '#...#', '#...#', '#...#'],
  R: ['####.', '#...#', '#...#', '####.', '#.#..', '#..#.', '#...#'], Y: ['#...#', '#...#', '.#.#.', '..#..', '..#..', '..#..', '..#..'],
};
// gruesas, con contorno oscuro y sombra dura, como los títulos de las miniaturas de relato
const palabra = (txt, x, y, s, c, sombra) => {
  const celdas = []; let cx = x;
  for (const ch of txt) { const g = F[ch]; for (let j = 0; j < 7; j++) for (let i = 0; i < 5; i++) if (g[j][i] === '#') celdas.push([cx + i * s, y + j * s]); cx += 6 * s; }
  for (const [px, py] of celdas) R.rect(px - 1 + 3, py - 1 + 3, px + s + 1 + 3, py + s + 1 + 3, sombra);   // sombra
  for (const [px, py] of celdas) R.rect(px - 2, py - 2, px + s + 1, py + s + 1, hex('#1a1020'));            // contorno
  for (const [px, py] of celdas) R.rect(px, py, px + s - 1, py + s - 1, c);
  for (const [px, py] of celdas) R.rect(px, py, px + s - 1, py, hex('#ffffff'));                         // brillo arriba
};
const K = hex('#1a1020');
// la palmatoria de latón con su vela (en el búfer de la figura, a escala 1: crece con ella)
const palmatoria = (R, [hx, hy]) => { hx = Math.round(hx); hy = Math.round(hy);
  R.rect(hx - 3, hy + 1, hx + 3, hy + 1, hex('#8a6420')); R.rect(hx - 2, hy, hx + 2, hy, hex('#c89a40')); R.pset(hx + 3, hy, hex('#8a6420'));
  R.rect(hx - 1, hy - 6, hx, hy - 1, hex('#f0e8d0')); R.pset(hx, hy - 5, hex('#c8bea6')); R.pset(hx - 1, hy - 3, hex('#fffbe8'));
  R.pset(hx, hy - 7, K); R.pset(hx, hy - 8, hex('#fff4c0')); R.pset(hx - 1, hy - 8, hex('#ffb040')); R.pset(hx, hy - 9, hex('#ffd870')); };
// dos ojos amarillos y acuosos en lo oscuro (como los de ms-cierre, plano 6), un poco más grandes para que se lean
const ojos = (ox, oy, sep, t) => {
  halo(R, ox + sep / 2, oy, 36, 18, '#c89a20', 0.5);
  for (const dx of [0, sep]) { const al = 3;
    for (let i = -6; i <= 6; i++) for (let j = -al - 1; j <= al + 1; j++) if (Math.abs(i) / 6.5 + Math.abs(j) / (al + 1.3) <= 1.02) R.pset(ox + dx + i, oy + j, Math.abs(j) >= al ? hex('#b08010') : hex('#f8e050'));
    R.rect(ox + dx, oy - 2, ox + dx + 1, oy + 2, K); R.pset(ox + dx - 3, oy - 1, hex('#fffbe0')); R.pset(ox + dx - 2, oy - 1, hex('#fff4a0')); R.pset(ox + dx - 4, oy, hex('#fff4a0'));
    R.pset(ox + dx + 3, oy + 4, hex('#a8c8e8')); R.pset(ox + dx + 3, oy + 5, hex('#7a98c0')); R.pset(ox + dx + 4, oy + 4, hex('#c8e0f0')); }
};
const mezcla = (a, b, f) => { let r = 0; for (const sh of [0, 8, 16]) r |= (Math.round(((a >>> sh) & 255) * (1 - f) + ((b >>> sh) & 255) * f) & 255) << sh; return (0xff000000 | r) >>> 0; };
const DX = 36, MX = 58, OX = 142, OY = 124;
const dibujar = (t) => {
  const b = R.nuevo(), prev = R.usar(b); estudio(R, t, { encuadre: 'estudio', camara: 'mesa' }); R.usar(prev);
  const o = { encuadre: 'lago', camara: 'ventana', tormenta: 1 };
  lago(R, t, o);
  desplazar(R, -DX);
  // fuera es noche cerrada: el cristal se oscurece, más abajo (el jardín) que arriba (la villa y sus velas, al fondo)
  const B = R.buf, NOCHE = hex('#03050c');
  for (let y = 22; y <= 144; y++) for (let x = 76 - DX; x <= 244 - DX; x++) { const v = 0.35 + 0.45 * ((y - 22) / 122); B[y * 320 + x] = mezcla(B[y * 320 + x], NOCHE, v); }
  // en lo oscuro, entre las matas del jardín, los dos ojos amarillos que la miran
  ojos(OX, OY, 22, t);
  // Mary sola junto a la ventana, con la palmatoria alzada hacia el cristal
  const m = figura(R, MS.maryMS, MX, 178, t, { dir: 1, sostiene: [78, 72], cosa: palmatoria }, 3);
  lagoDelante(R, t, o);
  // la vela es la única luz del cuarto: todo lo demás cae a la penumbra (los ojos siguen brillando)
  const [lx, ly] = m && m.mano ? [m.mano[0] + 1, m.mano[1] - 25] : [MX + 40, 110];
  for (let y = 0; y < 180; y++) for (let x = 0; x < 250; x++) { const d = Math.hypot((x - lx) / 1.15, y - ly);
    if (Math.hypot((x - OX - 11) / 30, (y - OY) / 11) < 1) continue;
    const f = Math.min(0.66, Math.max(0, (d - 34) / 130)); if (f > 0) B[y * 320 + x] = mezcla(B[y * 320 + x], NOCHE, f); }
  halo(R, MX - 30, 130, 26, 50, '#5a6a9a', 0.3);   // un filo frío de la ventana que la recorta de la cortina
  halo(R, lx - 8, ly + 26, 70, 66, '#ffc870', 0.4);
  halo(R, lx, ly, 22, 22, '#ffe8a0', 0.5);
  halo(R, lx, ly, 7, 8, '#fffbe8', 0.6);
  for (let y = 0; y < 180; y++) { const xd = 190 + Math.round((180 - y) * 0.28); for (let x = xd; x < 320; x++) B[y * 320 + x] = b[y * 320 + x]; for (let k = -1; k <= 1; k++) R.pset(xd + k, y, hex('#f4f0e4')); }
  grado(R, { cx: 160, cy: 100, tinte: '#060a14', f: 0.2, desde: 0.5, max: 0.75 });
  halo(R, 262, 110, 46, 46, '#fff0c0', 0.28);
  AT.atom(R, 262, 160, t, { s: 4, pose: 'piensa', dir: -1, cara: 'triste' });
  palabra('MARY', 12, 14, 5, hex('#f4f0e4'), hex('#3a2030'));
  cifra(R, '18', 172, 48, 28);
};
window.__frame = async (t) => { dibujar(t); R.presentar(); };
window.__listo = true;
</script>
</body>
</html>
