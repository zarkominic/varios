<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Miniatura · ep14</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// OI-MINIATURA · la miniatura del episodio 14 (se captura en t = 1, 1280 × 720). Partida por una diagonal: a la izquierda,
// el claro de 1795 con el roble, la polea y el hoyo; a la derecha, el pozo en corte con sus plataformas de troncos y el
// agua del mar que lo llena, y abajo, en el fondo, un destello de oro. McGinnis al doble con su pala mira el hoyo; un «?»
// grande sobre el agua y el «1795». Sin palabras.
import { crearRoma } from '/atomo/plato/kits/pixel-roma.js';
import { conChibi, ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
import { C, isla1795, pozo, polea } from '/atomo/plato/escenas/oi-comun.js';
const R = conChibi(await crearRoma(document.getElementById('lienzo')));
const izq = R.nuevo(), der = R.nuevo(), pj = R.nuevo(), VACIO = 0x01020304;
const corte = (y) => 150 + Math.round(y * 0.35), DX = 116;   // el corte del pozo se corre a la derecha: el pozo queda en x ≈ 228
const dibujar = (t) => {
  let prev = R.usar(izq); isla1795(R, t, { encuadre: 'claro', cavado: 0.6 });
  R.usar(der); const g = pozo(R, t, { encuadre: 'corte', epoca: '1803', nivel: 0.75, fondo: 100 });
  R.usar(pj); pj.fill(VACIO); R.actor(EL.mcginnis, 12, 60, 0.5, { dir: 1, quieto: true, sorpresa: true });
  R.usar(prev);
  const B = R.buf;
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) B[y * 320 + x] = x < corte(y) ? izq[y * 320 + x] : der[y * 320 + Math.max(0, x - DX)];
  for (let y = 0; y < 180; y++) { const x = corte(y); R.pset(x, y, C.k); R.pset(x + 1, y, C.blanco); R.pset(x + 2, y, C.blanco); R.pset(x + 3, y, C.k); }
  const pon = (src, sx0, sx1, sy0, sy1, dx, dy, s = 2) => { for (let y = sy0; y <= sy1; y++) for (let x = sx0; x <= sx1; x++) { const c = src[y * 320 + x]; if (c === VACIO) continue; R.rect(dx + (x - sx0) * s, dy + (y - sy0) * s, dx + (x - sx0) * s + s - 1, dy + (y - sy0) * s + s - 1, c); } };
  pon(pj, 0, 24, 30, 61, 40, 116, 2);
  // el destello de oro al fondo del pozo
  const gx = (g && g.centro ? g.centro : 112) + DX, gy = (g && g.fondoY ? g.fondoY : 172) - 4;
  for (let r = 1; r < 7; r++) { R.pset(gx + r, gy, C.oro); R.pset(gx - r, gy, C.oro); R.pset(gx, gy + r, C.oro); R.pset(gx, gy - r, C.oro); }
  R.disco(gx, gy, 2, C.oro);
  R.numero('?', 288, 112, { tam: 32, centro: true, rampa: [C.oroL ?? C.oro, C.oro, C.amarillo ?? C.oro, C.naranja ?? C.oro, C.oroS] });
  R.numero('1795', 56, 24, { tam: 16, centro: true });
};
window.__frame = async (t) => { dibujar(t); R.presentar(); };
window.__listo = true;
</script>
</body>
</html>
