<title>Muertos · ep7</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// HW-MUERTOS (frases 25–26). El mapa del mundo: se encienden velas en México, España, Latinoamérica, Filipinas y China.
// Luego un altar de muertos con cempasúchil, velas, calaveras de azúcar, fotos y papel picado, y una familia que sonríe;
// al final de la frase, en la caja, el globo y «2008» (la UNESCO). Luego un camino de pétalos naranjas va de la puerta
// al altar, donde está la comida favorita de cada difunto.
import { preparar, rodar } from '/atomo/plato/escenas/hw-comun.js';
const { E, R, M } = await preparar('hw-muertos');
const { PALA, PR, NARANJA, tramo, lerp } = R;
const m = { otr: M('otros', 0.5), mex: M('mexico', 8), cam: M('camino', 20) };
const SITIOS = [[-99.1, 19.4], [-3.7, 40.4], [-77, -12], [-74, 4.6], [121, 14.6], [116.4, 39.9], [-90.5, 14.6]];
const mapa = (t) => {
  const u = t - m.otr;
  R.cielo(t, { hor: 180, semilla: 8, n: 120 });
  R.pergamino(18, 26, 302, 164, { semilla: 6 });
  const pj = R.proyector(26, 32, 294, 158, -170, 180, -56, 76);
  R.recorte([21, 29, 299, 161]); R.mundo(pj, { tierra: 2.4 }); R.recorte(null);
  SITIOS.forEach(([lo, la], k) => { if (u < 0.6 + k * 0.6) return; const [x, y] = pj(lo, la).map(Math.round); R.vela(x, y - 3, t + k, { r: 9, alto: 4 }); });
};
const FAMILIA = [[70, 30, { peinado: 'coleta', pelo: PALA.PELO_NEGRO, chaqueta: PALA.ROJO, camisa: PALA.BLANCO, falda: PALA.ROJO, largoFalda: 0.4, pantalon: PALA.ROJO, chaqueta_larga: false }], [92, 18, { peinado: 'corto', pelo: PALA.PELO_NEGRO, chaqueta: PALA.AMARILLO, camisa: PALA.BLANCO, pantalon: PALA.AZUL, chaqueta_larga: false }], [254, 30, { peinado: 'corto', pelo: PALA.PELO_BLANCO, barba: 'bigote', chaqueta: PALA.BLANCO, camisa: PALA.BLANCO, pantalon: PALA.MARRON, chaqueta_larga: false, sombrero: 'gorro', colorSombrero: PALA.ORO }]];
const altar = (t, camino = 0) => {
  R.ambiente({ luz: { lado: 1, color: PALA.ANTORCHA[3] }, sombra: PALA.CONTORNO });
  R.interior(t, { luces: [[160, 100]], suelo: 160, tipo: 'madera', radio: 190 });
  R.altar(160, 158, t, { w: 64 });
  for (let k = 0; k < 18; k++) { const x = 160 + Math.round(Math.sin(k * 0.7) * 6) - 2, y = 162 + k; R.pset(x + (k % 3), y, NARANJA[3]); R.pset(x + 2 - (k % 2), y, NARANJA[2]); }
  if (camino > 0) {
    R.rect(286, 108, 312, 160, PALA.ANTORCHA[2]); R.halo(299, 134, 20, [PALA.ANTORCHA[1], PALA.ANTORCHA[2]], 0.6); R.rect(284, 106, 314, 108, PR.MADERA[1]);
    const n = Math.round(camino * 60);
    for (let k = 0; k < n; k++) { const f = k / 60, x = Math.round(lerp(296, 200, f)), y = Math.round(164 + Math.sin(f * 7) * 4); R.pset(x, y, NARANJA[3]); R.pset(x + 1, y + 1, NARANJA[2]); }
    for (const [x, c] of [[124, PALA.ORO], [196, PALA.ROJO]]) { R.rect(x - 5, 142, x + 5, 143, PALA.BLANCO[2]); R.disco(x, 140, 2, c[2]); }
  }
  for (const [x, h, el] of FAMILIA) R.personaje(x, 176, h, { ...el, piel: PALA.PIEL[2] ? PALA.PIEL : PALA.PIEL, t: t + x, dir: x < 160 ? 1 : -1, sonrisa: true, brazoD: x === 254 ? 'ofrece' : undefined });
};
rodar(E, R, [[0, mapa], [m.mex - 0.2, (t) => altar(t)], [m.cam - 0.2, (t) => altar(t, tramo(t, m.cam, m.cam + 4))]], {
  año: 2026,
  caja: (t, e) => R.caja(t, t > m.cam - 3.6 && t < m.cam - 0.2 ? tramo(t, m.cam - 3.6, m.cam - 3.2) : 0, (x, y) => { R.icono('globo', x, y + 5, PALA.AZUL[3], PALA.CONTORNO); R.numero('2008', x + 12, y + 12); }, { energia: e }),
});
</script>
</body>
