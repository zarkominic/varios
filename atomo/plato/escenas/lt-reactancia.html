  if (t > W.Y3500 - 0.1 && t < W.FEELS) cartelNum('3500', 96, 46, t, W.Y3500);
};

// ── 14 · el río tranquilo (rio/general): las manchas se dispersan río abajo; Siona llega corriendo a la orilla; en «dies»
//    sube una columna de motas; en «tells Siona» una mota de oro va hasta ella y la rodea; en «his plan» se vuelve a mirarnos ──
const p14 = (t, op = {}) => {
  const o = { encuadre: 'rio', manchas: lerp(0.55, 1, tramo(t, W.P14, W.FIN)) };
  T.puente(R, t, o);
  // la columna de motas que sube del centro del río en «dies»
  const cm = tramo(t, W.DIES - 0.2, W.DIES + 2.4);
  if (cm > 0) for (let k = 0; k < 24; k++) { const v = ((cm * 1.6 + hh(k, 1, 3)) % 1), x = ri(160 + Math.sin(k * 1.7 + t * 1.5) * (4 + v * 10)), y = ri(110 - v * 80); if (libreAtom(x, y)) mezP(x, y, k % 3 ? H('#fff0a0') : H('#c8f0ff'), (1 - v) * (1 - cm * 0.6)); }
  // Siona corre hasta la orilla y se para; el conjurado fremen llega detrás y se queda a distancia
  const sv = tramo(t, W.P14 + 0.1, W.BEFORE + 0.6), sx = ri(lerp(-18, 132, ease(sv)));
  const gira = t > W.PLAN - 0.1;
  const s = R.actor(T.LT.sionaLT, sx, 154, t, { dir: gira ? -1 : 1, anda: sv > 0 && sv < 1, sorpresa: t > W.TELLS + 0.4 && t < W.PLAN, triste: t > W.DIES && t < W.TELLS + 0.4, sonrisa: gira && !op.quieto });
  const fv = tramo(t, W.DIES, W.TELLS + 1), fx = ri(lerp(-18, 64, ease(fv)));
  R.actor(T.PA.fremen, fx, 154, t, { dir: 1, anda: fv > 0 && fv < 1, sorpresa: t > W.TELLS + 1 && t < W.PLAN });
  // la mota de oro que va hasta Siona y la rodea
  const mv = tramo(t, W.TELLS - 0.2, W.SIONA + 0.8);
  if (mv > 0) { const hx = sx + 7, hy = 124; let x, y; if (mv < 1) { x = lerp(160, hx, ease(mv)); y = lerp(96, hy, ease(mv)) - Math.sin(mv * Math.PI) * 14; } else { const an = (t - W.SIONA - 0.8) * 4; x = hx + Math.cos(an) * 11; y = hy + Math.sin(an) * 5; }
    if (!(t > W.PLAN + 0.4)) { bola(x, y, 3, H('#fff0a0'), 0.45); R.pset(ri(x), ri(y), H('#ffffff')); R.pset(ri(x) + 1, ri(y), H('#ffe880')); }
    else { const d = t - W.PLAN - 0.4; if (d < 0.8) for (let k = 0; k < 8; k++) { const an = k / 8 * Math.PI * 2; mezP(x + Math.cos(an) * d * 16, y + Math.sin(an) * d * 10, H('#fff4c0'), 1 - d / 0.8); } } }
  T.puenteDelante(R, t, o);
};

const efectos = [
  [0.5, 'papel'], [W.ENDING - 0.05, 'golpecito'], [W.ENDING + 0.1, 'brillo'],
  [W.THOUS + 0.3, 'aldea', { k: 0 }], [W.DESC, 'aldea', { k: 2 }], [W.LAST, 'aldea', { k: 4 }], [W.BORN, 'campana'],
  [W.P3 + 0.3, 'pasos'], [W.HATES, 'palmada'], [W.SEE, 'tic'],
  [W.P4 + 0.1, 'pasos'], [W.LETS - 0.1, 'whoosh'],
  [W.P5 + 0.1, 'viento', { dur: 3 }], [W.WAIT - 0.3, 'papel'], [W.Y3000, 'brillo'], [W.CONTROL, 'golpecito'],
  [W.P6 + 0.2, 'pasos'], [W.ENGIN, 'bip'], [W.LOVE, 'brillo'],
  [W.P7 + 0.7, 'pop'], [W.P7 + 1.9, 'boing'], [W.MARRY, 'campana'], [W.MARRY + 0.2, 'publico', { dur: 2 }],
  [W.HIGH, 'pajaros'], [W.RIVER, 'chof'],
  [W.P9, 'carro', { largo: 3.2 }], [W.PROC, 'publico', { dur: 2.5 }],
  [W.DOWN, 'avalancha'], [W.DOWN + 0.3, 'pajaros'], [W.RIVER2, 'chof'],
  [W.P11, 'burbujas'], [W.P11 + 1.5, 'golpecito'], [W.WATER, 'burbujas'],
  [W.P12 + 0.2, 'ola'], [W.APART, 'brillo'],
  [W.Y3500 - 0.2, 'pajaros'], [W.VULN, 'brillo'],
  [W.P14 + 0.2, 'pasos'], [W.DIES, 'brillo'], [W.PLAN, 'pop'],
];

// ── LT-REACTANCIA: la pausa sobre los congelados de lt-puente ──
const atomG = (x, s, t, o = {}) => AT.atom(R, ri(x), ri(s), t, { s: 2, habla: voz(t), ...o });
const fz14 = () => capa('fz14', () => p14(W.FIN - 1 / 30, { quieto: true }));
const fz6 = () => capa('fz6', () => p6(W.LOVE + 0.7));
const fz4 = () => capa('fz4', () => p4(W.LETS + 0.7));
const fz9 = () => capa('fz9', () => p9(W.WORM + 0.3));
const fz1 = () => capa('fz1', () => p1(W.INCLUDED + 0.6));
const fz8 = () => capa('fz8', () => p8(W.BRIDGE + 0.6));
const congela = (b) => { R.copiar(b()); AT.pausa(R, 1); };
const jaula = (x, y, t, vuela, s = 2) => T.pausa(R, ri(x), ri(y), t, { cual: 'jaula', s, vuela });
// ── 1 · el río congelado: Atom (al doble) entra y señala las manchas en «notice»; en «lesson» el anillo y el gusanito ──
const q1 = (t) => {
  R.copiar(fz14()); AT.pausa(R, tramo(t, 0, 0.35));
  const an = tramo(t, 0.2, 1.5), x = lerp(344, 238, ease(an));
  atomG(x, 178, t, { dir: -1, pose: an < 1 ? 'camina' : t > WR.NOTICE + 0.9 ? 'senala' : 'quieto', cara: t > WR.LESSON - 0.3 ? 'sonrisa' : 'normal' });
  const ua = tramo(t, 1.4, WR.LESSON); if (ua > 0) AT.anillo(R, 160, 100, 70, 22, t, ua);
  if (t > WR.LESSON) R.icono('gusano', 152, 64 + flota(t), H('#f0c860'), K, 2);
};
// ── 2 · la audiencia congelada: en «1966» el año; en «reactance» Atom saca la jaula ──
const q2 = (t) => {
  congela(fz6);
  if (t > WR.Y1966 - 0.1) cartelNum('1966', 96, 64, t, WR.Y1966);
  const sa = tramo(t, WR.REACT - 0.5, WR.REACT + 0.2);
  if (sa > 0) jaula(196, 176 + (1 - ease(sa)) * 70, t, 0, 1.6);
  // Atom llega andando desde la derecha; señala el año, se lleva la mano a la barbilla en «psychologist» y saca la jaula
  const ll = tramo(t, WR.R2 + 0.05, WR.R2 + 1.0);
  atomG(lerp(336, 284, ease(ll)), 178, t, { dir: -1, pose: ll < 1 ? 'camina' : sa > 0 && sa < 1 ? 'sostiene' : t > WR.PSYCH - 0.2 && t < WR.REACT - 0.6 ? 'piensa' : t > WR.Y1966 && t < WR.REACT - 0.6 ? 'senala' : 'quieto', cara: t > WR.REACT ? 'sonrisa' : 'normal' });
};
// ── 3 · el Sareer congelado (Siona con el diario): la jaula grande; en «freedom» la señal de prohibido late; en «more»
//    el pájaro empuja la puerta: «!» ──
const q3 = (t) => {
  congela(fz4);
  // el pájaro da dos topetazos a la puerta (en «more» y justo después) y luego la sigue empujando
  const top = (t0) => Math.exp(-(((t - t0) / 0.09) ** 2)) * 0.14;
  const emp = (t > WR.MORE + 0.5 ? 0.05 + Math.abs(Math.sin(t * 9)) * 0.05 : Math.abs(Math.sin(t * 3)) * 0.02) + top(WR.MORE - 0.3) + top(WR.MORE + 0.3);
  const j = jaula(116, 176, t, emp, 2);
  if (t > WR.FREEDOM && t < WR.MORE) { const c = j?.caja ?? [56, 84, 176, 176]; if (Math.floor(t * 4) % 2) AT.anillo(R, c[0] + 24, c[1] + 26, 24, 24, t, 1); }
  if (t > WR.MORE) R.icono('!', 146, 62 + flota(t), H('#ffe060'), K, 3);
  atomG(256, 178, t, { dir: -1, pose: t > WR.FREEDOM ? 'piensa' : 'senala', cara: t > WR.MORE ? 'sorpresa' : 'normal' });
};
// ── 4 · el tablero congelado (el carro y la procesión): en «pushes» el pájaro sale de la jaula y vuela; Atom lo sigue ──
const q4 = (t) => {
  congela(fz9);
  const vu = tramo(t, WR.PUSHES, WR.BACK + 0.6);
  jaula(228, 176, t, vu, 1.6);
  atomG(54, 178, t, { dir: 1, pose: t > WR.WIN ? 'saluda' : 'piensa', cara: t > WR.WIN ? 'sonrisa' : 'normal' });
  if (t > WR.BACK) for (let k = 0; k < 6; k++) { const an = k / 6 * Math.PI * 2 + t * 2, d = tramo(t, WR.BACK, WR.BACK + 0.6) * 14; mezP(210 + Math.cos(an) * d, 50 + Math.sin(an) * d * 0.6, H('#fff4a0'), 1 - tramo(t, WR.BACK, WR.BACK + 1)); }
};
// ── 5 · la maqueta congelada: Leto a color en «knew it»; en «obey» las figuritas de la mesa se inclinan («X»); en
//    «hate obedience» se levantan con el puño en alto ──
const q5 = (t) => {
  congela(fz1);
  const co = tramo(t, WR.KNEW - 0.2, WR.KNEW + 0.4); if (co > 0) T.letoGusano(R, 262, 132, t, { s: 1, dir: -1, mira: [130, 150], sombra: false, habla: t > WR.KNEW && t < WR.OBEY - 0.8 && parla(t) });
  const sale = tramo(t, WR.KNEW + 0.6, WR.OBEY - 1.2), inclina = t > WR.OBEY - 0.9 && t < WR.HATE, alza = t > WR.HATE;
  const FIG = [T.LT.ciudadanoLT, T.LT.ciudadanaLT, T.PA.fremen, T.LT.ciudadanoLT, T.PA.fremenMujer, T.LT.guiaLT];
  if (sale > 0) FIG.forEach((d, k) => { const x = 70 + k * 22, y = ri(162 + (1 - ease(sale)) * 30 + (inclina ? 2 : 0));
    R.actor(d, x, y, t, { dir: 1, triste: inclina, quieto: inclina, enfado: alza, brazos: alza && k % 2 === 0, dedo: alza && k % 2 === 1, salto: alza && t < WR.HATE + 0.5 ? 2 : 0 }); });
  if (inclina && t > WR.OBEY) R.icono('X', 120, 116 + flota(t), H('#e83a3a'), K, 2);
  atomG(296, 180, t, { dir: -1, pose: alza ? 'saluda' : t > WR.OBEY ? 'piensa' : 'senala', cara: alza ? 'sonrisa' : 'normal' });
};
// ── 6 · el arco congelado: en «died» los pájaros de colores salen de debajo del puente hacia el cielo; en «stars» suben
//    naves diminutas con su estela; Atom los despide ──
const q6 = (t) => {
  congela(fz8);
  const u = tramo(t, WR.DIED - 0.4, WR.FIN);
  for (let k = 0; k < 16; k++) { const t0 = WR.DIED - 0.4 + k * 0.12, v = tramo(t, t0, t0 + 2.4); if (v <= 0 || v >= 1) continue;
    const x = ri(lerp(60 + k * 14, 40 + hh(k, 1) * 240, v)), y = ri(lerp(150, 26, v) + Math.sin(v * 9 + k) * 3); if (!libreAtom(x, y)) continue; const a = Math.sin(t * 16 + k) > 0;
    const c1 = k % 2 ? H('#f0d040') : H('#4a8ae8'); R.rect(x - 2, y, x + 3, y + 2, K); R.rect(x - 1, y, x + 2, y + 1, c1); R.pset(x + 3, y, H('#e8a040')); R.pset(x + 2, y, K);
    if (a) { R.linea(x - 1, y - 1, x - 4, y - 4, c1); R.linea(x + 1, y - 1, x + 4, y - 4, c1); } else { R.linea(x - 1, y + 2, x - 4, y + 4, c1); R.linea(x + 1, y + 2, x + 4, y + 4, c1); } }
  const nv = tramo(t, WR.RUN - 0.4, WR.FIN);
  for (let k = 0; k < 12; k++) { const v = tramo(nv, k * 0.06, k * 0.06 + 0.5); if (v <= 0) continue; const x0 = 40 + k * 22, x = ri(x0 + (k - 6) * v * 8), y = ri(110 - v * 90); if (!libreAtom(x, y)) continue;
    R.pset(x, y, H('#ffffff')); for (let i = 1; i < 6; i++) mezP(x - (k - 6) * i * 0.1, y + i * 1.5, H('#c8e0ff'), 0.7 - i * 0.12); }
  if (u > 0) jaula(70, 178, t, 1, 1.2);
  atomG(268, 178, t, { dir: -1, pose: t > WR.EVERYONE ? 'saluda' : 'quieto', cara: t > WR.DIED ? 'sonrisa' : 'normal' });
};
// densidad medida con efectos.cjs: ~54 % del tiempo (antes 33 %); el «tapestop» abre la pausa como en las otras «fíjate»
const efectosR = [[0.05, 'tapestop'], [WR.LESSON, 'brillo'],
  [WR.R2 + 0.2, 'pasos'], [WR.Y1966, 'pop'], [WR.REACT - 0.5, 'zumbido'], [WR.REACT + 0.2, 'golpecito'],
  [WR.FREEDOM, 'aviso'], [WR.MORE - 0.3, 'toc'], [WR.MORE + 0.3, 'toc'],
  [WR.PUSHES - 0.1, 'cerrojo'], [WR.PUSHES + 0.3, 'pajaros'],
  [WR.KNEW, 'brillo'], [WR.OBEY, 'tic'], [WR.HATE, 'palmada'], [WR.HATE + 0.15, 'publico', { dur: 1.2 }],
  [WR.DIED - 0.3, 'pajaros'], [WR.RUN, 'whoosh'], [WR.STARS, 'aldea', { k: 4 }]];
T.rodar(E, R, [[0, q1], [WR.R2, q2], [WR.R3, q3], [WR.R4, q4], [WR.R5, q5], [WR.R6, q6]], { efectos: efectosR });
</script>
