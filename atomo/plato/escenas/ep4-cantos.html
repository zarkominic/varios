<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cantos · ep4</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// EP4-CANTOS (frases 22–23).
//  cantos   en la playa, junto al fuego, un anciano canta a un niño; sobre ellos, las estrellas se unen con líneas
//           doradas y forman un mapa de islas en el aire.
//  bateria  en la caja, una pila tachada.
import { escena } from '/atomo/plato/escena.js';
import { crearAventura, PALA, ELENCO } from '/atomo/plato/kits/pixel-aventura.js';
const E = await escena('ep4-cantos', 'ep04');
const R = await crearAventura(document.getElementById('lienzo'));
const { PAL, tramo } = R;
const M = (k, d) => E.marca(k, d);
const m = { cantos: M('cantos', 0.5), bateria: M('bateria', 3.8) };
const EST = [[70, 30], [100, 46], [132, 34], [160, 52], [192, 38], [222, 56], [250, 40]];

E.iniciar((t) => {
  R.cielo(t, { hor: 130, semilla: 105 });
  R.mar(t, { hor: 130, y1: 146 });
  // arena
  for (let y = 146; y < R.H; y++) for (let x = 0; x < R.W; x++) R.pset(x, y, R.tone(PAL.HULL, 2.4 - (y - 146) * 0.04 + (R.hash2(x, y) - 0.5), x, y));
  // las estrellas del mapa: se unen
  const p = tramo(t, m.cantos + 0.4, m.cantos + 2.6) * (EST.length - 1);
  for (let k = 0; k < EST.length; k++) {
    const [x, y] = EST[k];
    R.pset(x, y, PAL.STAR[4]); R.pset(x - 1, y, PAL.STAR[2]); R.pset(x + 1, y, PAL.STAR[2]); R.pset(x, y - 1, PAL.STAR[2]); R.pset(x, y + 1, PAL.STAR[2]);
    if (k < Math.floor(p)) R.linea(x, y, EST[k + 1][0], EST[k + 1][1], PAL.ORO[3], 2);
    if (k <= p) R.disco(x + 0.5, y + 6.5, 2, PAL.EARTH[3]);
  }
  // fuego
  const fx = 160, fy = 156;
  R.halo(fx, fy - 4, 34 + 2 * Math.sin(t * 13), [PAL.HULL[3], PAL.FIRE[0]], 1);
  for (let k = 0; k < 10; k++) { const h = 4 + 6 * R.hash2(k, Math.floor(t * 12)); R.linea(fx - 4 + k, fy, fx - 4 + k, fy - h, k % 3 ? PAL.FIRE[2] : PAL.FIRE[3]); }
  R.pset(fx, fy - 9, PAL.FIRE[4]);
  // el anciano canta (los brazos suben a ratos), el niño escucha
  const canta = Math.sin(t * 3) > 0.3;
  R.personaje(124, 162, 40, { ...ELENCO.anciano, t, pose: 'sentado', brazoD: canta ? 'arriba' : 'abajo', habla: 1 });
  R.personaje(198, 162, 28, { ...ELENCO.nino, t, pose: 'sentado', dir: -1 });
  const e = E.energia(t);
  R.caja(t, tramo(t, m.bateria - 0.1, m.bateria + 0.3), (x, y) => { R.icono('pila', x + 8, y + 4, PAL.UI[5]); R.icono('X', x + 7, y + 5, PAL.ROJO); }, { energia: e });
  R.companero(t, e);
  R.presentar();
});
</script>
</body>
</html>
