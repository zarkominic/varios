<script type="module">
// DO-RAMAS (frases 9–10), sin cartela, 2019. Cuatro planos:
// 1. el árbol del tiempo, pintado en la escena: el vacío con nebulosas de tres tonos que corren a dos velocidades,
//    galaxias que giran, relojes lejanos con las agujas hacia atrás, engranajes, estrellas que titilan y una fugaz; la
//    línea dorada con pulsos y polvo que fluye; una chispa viaja hacia atrás por ella (la pantalla de la consola la
//    sigue) y, al tocar el pasado («past»), brota la primera rama; Tony y Bruce la miran desde la plataforma de control
//    (chapa con estrías, remaches y rejillas, cables, caja de empalmes que chispea, consola con botones, caja de
//    herramientas, carrito de recortes de rama, balizas); Tony señala el presente: no cambia;
// 2. de cerca y en otro sitio: el nudo de la línea donde brota la rama, grande y latiendo; la rama baja con luz hasta su
//    mundo nuevo, que crece en la punta y gira con su luna («a new branch… its own way»); Tony la sigue por una pasarela
//    colgante (Bruce se queda al principio); detrás, engranajes grandes, un reloj, una galaxia y ramas lejanas;
// 3. el banco del laboratorio: el estuche con las seis gemas y el martillo; Steve llega y Bruce se lo explica;
//    «return each Stone»: las gemas laten;
// 4. el estuche de cerca, visto desde arriba (pegado a la derecha): la mano de Steve entra por el borde derecho (se ve
//    poco brazo) y pone la última gema («exact moment»), se encienden los años bajo cada gema y la mano cierra la tapa
//    por su esquina («no loose branches») y echa el cierre.
// Sonido: 14 efectos sincronizados con lo que se ve (lista al final), ~53 % del tiempo.
import * as T from '/atomo/plato/escenas/do-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('do-ramas');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], bay = (x, y) => (BAY[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
const KK = hex('#1a1014'), BL = 0xffffffff;
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
// fondos fijos en búferes: se pintan una vez (con prev = R.usar(b) y vuelta) y se copian enteros (fondo) o solo lo pintado (pegar)
const BUF = {};
const bufer = (clave, dibuja) => { if (!BUF[clave]) { const b = R.nuevo(), prev = R.usar(b); dibuja(); R.usar(prev); BUF[clave] = b; } return BUF[clave]; };
const fondo = (clave, dibuja) => R.copiar(bufer(clave, dibuja));
const pegar = (clave, dibuja) => { const b = bufer(clave, dibuja), B = R.buf; for (let i = 0; i < 57600; i++) { const c = b[i]; if (c) B[i] = c; } };
// rampa tramada de arriba abajo en [x0..x1]×[y0..y1]
const rampa = (x0, y0, x1, y1, cols) => { const n = cols.length - 1; for (let y = y0; y <= y1; y++) { const u = (y - y0) / Math.max(1, y1 - y0) * n, i = Math.min(n - 1, Math.floor(u)), f = u - i; for (let x = x0; x <= x1; x++) R.pset(x, y, cols[f > bay(x, y) ? i + 1 : i]); } };
// caja con contorno, cara, luz arriba-izquierda y sombra abajo-derecha
const caja = (x0, y0, x1, y1, c, cl, cs) => { R.rect(x0, y0, x1, y1, KK); R.rect(x0 + 1, y0 + 1, x1 - 1, y1 - 1, c); R.rect(x0 + 1, y0 + 1, x1 - 1, y0 + 1, cl); R.rect(x0 + 1, y0 + 1, x0 + 1, y1 - 1, cl); R.rect(x0 + 1, y1 - 1, x1 - 1, y1 - 1, cs); R.rect(x1 - 1, y0 + 1, x1 - 1, y1 - 1, cs); };
// gema facetada de radio s en (x, y); brillo > 0: destellos alrededor
const gema = (x, y, c, s = 3, brillo = 0) => { const cl = mez(c, BL, 0.5), cs = mez(c, KK, 0.45);
  for (let j = -s - 1; j <= s + 1; j++) for (let i = -s - 1; i <= s + 1; i++) { const d = Math.abs(i) + Math.abs(j); if (d > s + 1) continue; R.pset(x + i, y + j, d === s + 1 ? KK : (i + j < 0 ? cl : i + j > 1 ? cs : c)); }
  R.pset(x - 1, y - 1, BL); if (s > 3) R.pset(x - 2, y - 1, BL);
  if (brillo > 0) { const r = Math.round(s + 3 + brillo * 3); for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 + brillo; R.pset(Math.round(x + Math.cos(a) * r), Math.round(y + Math.sin(a) * r), k % 2 ? cl : BL); } } };
const CORA = ['.kk.kk.', 'k##k##k', 'k#h####k'.slice(0, 7), 'k#####k', '.k###k.', '..k#k..', '...k...'];
const corazon = (x, y, c, s = 1) => CORA.forEach((f, j) => { for (let i = 0; i < 7; i++) { const ch = f[i]; if (ch === '.') continue; R.rect(x - 3 * s + i * s, y - 3 * s + j * s, x - 3 * s + i * s + s - 1, y - 3 * s + j * s + s - 1, ch === 'k' ? KK : ch === 'h' ? mez(c, BL, 0.6) : c); } });
// los trajes cuánticos de los Vengadores: blanco con franjas rojas
const QS = { C: hex('#eeeae2'), c: hex('#b4b0a8'), W: hex('#eeeae2'), F: hex('#c8303a'), G: hex('#c8303a'), I: hex('#2a2430'), n: hex('#2a2430'), X: hex('#c8303a'), r: hex('#c8303a') };
// el maletín plateado (en la mano: (x, y) = el asa)
const maletin = (x, y) => { R.rect(x - 2, y - 1, x + 2, y - 1, KK); R.pset(x - 2, y, KK); R.pset(x + 2, y, KK); caja(x - 6, y, x + 6, y + 8, hex('#c0c4cc'), hex('#eef0f4'), hex('#7a7e88')); R.rect(x - 5, y + 3, x + 5, y + 3, hex('#8a8e98')); R.pset(x - 3, y + 2, hex('#e8b830')); R.pset(x + 3, y + 2, hex('#e8b830')); };
const GEMAS = ['#9a4ae8', '#3a8ae8', '#e83a3a', '#e8903a', '#3ac85a', '#f0e040'].map(hex);
// nube de atardecer de tres tonos
const nubeT = (cx, cy, w, s, b, l) => { const bolas = [[0, 0, w * 0.3], [-w * 0.3, w * 0.07, w * 0.22], [w * 0.28, w * 0.06, w * 0.24], [-w * 0.1, -w * 0.12, w * 0.24]];
  for (const [dx, dy, r] of bolas) R.disco(Math.round(cx + dx), Math.round(cy + dy + 1), Math.round(r), s);
  for (const [dx, dy, r] of bolas) R.disco(Math.round(cx + dx), Math.round(cy + dy - 1), Math.round(r * 0.9), b);
  for (const [dx, dy, r] of bolas) R.disco(Math.round(cx + dx + 1), Math.round(cy + dy + 1 + r * 0.35), Math.round(r * 0.55), l); };
// pájaro en uve que aletea (silueta)
const ave = (x, y, t, k, c) => { const a = Math.sin(t * 8 + k) > 0 ? 1 : 0; R.pset(x, y, c); R.pset(x - 1, y - a, c); R.pset(x - 2, y - 1 - a, c); R.pset(x + 1, y - a, c); R.pset(x + 2, y - 1 - a, c); };

const Ra = (f) => en('rama', f), D = (f) => en('devolver', f);
const P2 = Ra(0.576), P3 = D(-0.044), P4 = D(0.485);
const altera = Ra(0.3185), pasado = Ra(0.3596), cambia = Ra(0.478), crea = Ra(0.618), nueva = Ra(0.804), suya = Ra(0.955);
const fin = D(0.157), alguien = D(0.258), devuelve = D(0.333), piedra = D(0.413);
const exacto = D(0.546), vino = D(0.635), sueltas = D(0.7225), ramas = D(0.784), alrededor = D(0.928);

// ── el vacío del tiempo, pintado en la escena (planos 1 y 2) ──
// ruido suave de valor (periódico en x con periodo P celdas, para que las nebulosas den la vuelta sin costura) y fbm
const vn = (x, y, s, P = 1e6) => { const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const g = (i, j) => hh(((i % P) + P) % P, j, s), a = g(xi, yi), b = g(xi + 1, yi), c = g(xi, yi + 1), d = g(xi + 1, yi + 1); return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy; };
const fbm = (x, y, s) => vn(x / 40, y / 40, s, 8) * 0.5 + vn(x / 20, y / 20, s + 1, 16) * 0.3 + vn(x / 10, y / 10, s + 2, 32) * 0.2;
const VAC = ['#06040e', '#0d081d', '#160d2e', '#20133e', '#2c1a50'].map(hex);
const enAtom = (x, y) => x > 272 && y < 48, enAño = (x, y) => y < 17 && x > 16 && x < 174;
// el fondo del vacío (y0..y1): degradado tramado de cinco tonos alrededor de la franja cy, estrellas fijas e hilos lejanos
const vacioBase = (s, y0, y1, cy) => {
  for (let y = y0; y <= y1; y++) for (let x = 0; x < 320; x++) { const v = 0.58 - Math.abs(y - cy) / 170 + (fbm(x, y, s) - 0.5) * 0.9, u = Math.max(0, Math.min(3.999, v * 4.4)), i = Math.floor(u);
    R.pset(x, y, VAC[u - i > bay(x, y) ? Math.min(4, i + 1) : i]); }
  for (let i = 0; i < 7; i++) { const ya = y0 + 10 + hh(i, 1, s) * (y1 - y0 - 20), yb = ya + (hh(i, 2, s) - 0.5) * 70, c = mez(VAC[1], [hex('#5ab0f0'), hex('#c87af0'), hex('#f05a8a')][i % 3], 0.22);
    for (let x = 0; x < 320; x += 1) { const y = Math.round(ya + (yb - ya) * x / 320 + Math.sin(x * 0.02 + i) * 3); if ((x + i) % 3 && y >= y0 && y <= y1 && !enAtom(x, y) && !enAño(x, y)) R.pset(x, y, c); } }
  for (let i = 0; i < 150; i++) { const x = Math.floor(hh(i, 3, s) * 320), y = y0 + Math.floor(hh(i, 4, s) * (y1 - y0)); if (enAtom(x, y) || enAño(x, y)) continue; const g = hh(i, 5, s);
    R.pset(x, y, g > 0.9 ? BL : g > 0.6 ? hex('#c8b8e8') : hex('#5a4a80')); if (g > 0.95) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) R.pset(x + dx, y + dy, hex('#8a78b8')); }
};
// una capa de nebulosa de tres tonos (transparente donde no hay): se pega desplazada para que corra a su velocidad
const capaNebulosa = (s, cols, y0, y1, cy, ancho, umbral) => bufer('neb' + s, () => {
  for (let y = y0; y <= y1; y++) for (let x = 0; x < 320; x++) { const n = fbm(x, y, s) + (vn(x / 5, y / 5, s + 5, 64) - 0.5) * 0.08 - Math.abs(y - cy) / ancho, q = (n - umbral) / 0.05 + bay(x, y) - 0.5;
    if (q < 0) continue; if (q < 1 && ((x + y) & 1)) continue; R.pset(x, y, cols[Math.min(2, Math.floor(q / 1.4))]); } });
const pasarCapa = (b, off, y0, y1) => { const B = R.buf, o = ((Math.round(off) % 320) + 320) % 320;
  for (let y = y0; y <= y1; y++) { const fila = y * 320; for (let x = 0; x < 320; x++) { if (y < 46 && x > 272) continue; const c = b[fila + ((x + o) % 320)]; if (c) B[fila + x] = c; } } };
const NEB_A = ['#1a2a4e', '#24466a', '#3a6e8e'].map(hex), NEB_B = ['#3a1650', '#64246e', '#9a4a8a'].map(hex), NEB_C = ['#2a1240', '#4a1e5e', '#7a3a7e'].map(hex);
// estrellas que titilan y una estrella fugaz de vez en cuando
const titilan = (t, s, y0, y1) => { for (let i = 0; i < 24; i++) { const x = Math.floor(hh(i, 6, s) * 320), y = y0 + Math.floor(hh(i, 7, s) * (y1 - y0)); if (enAtom(x, y) || enAño(x, y)) continue; const v = Math.sin(t * (1.2 + (i % 4) * 0.7) + i * 2.1);
  if (v > 0.2) { R.pset(x, y, BL); if (v > 0.8) { R.pset(x - 1, y, hex('#9a88c8')); R.pset(x + 1, y, hex('#9a88c8')); R.pset(x, y - 1, hex('#9a88c8')); R.pset(x, y + 1, hex('#9a88c8')); } } }
  const f = (t * 0.27 + s * 0.13) % 1; if (f < 0.22) { const u = f / 0.22, x = Math.round(lerp(230, 120, u)), y = Math.round(lerp(22, 62, u)); for (let k = 0; k < 10; k++) R.pset(x + k, y - Math.round(k * 0.36), k < 3 ? BL : hex('#8a78b8')); } };
// una galaxia lejana en espiral que gira despacio
const galaxia = (cx, cy, r, ang, c1, c2) => { for (let i = 4; i < 70; i++) { const rr = i / 70 * r; for (const s of [0, Math.PI]) { const a = ang + s + i * 0.11;
    R.pset(Math.round(cx + Math.cos(a) * rr), Math.round(cy + Math.sin(a) * rr * 0.42), i < 26 ? c1 : (i % 3 ? c2 : c1)); } }
  R.disco(cx + 0.5, cy + 0.5, 2.2, mez(c1, BL, 0.3)); R.pset(cx, cy, BL); };
// un reloj lejano y tenue (las agujas corren hacia atrás: el tiempo que se rebobina)
const relojLejano = (cx, cy, r, t, vel, c) => { const cs = mez(c, VAC[0], 0.45);
  for (let k = 0; k < 48; k++) { const a = k / 48 * Math.PI * 2; R.pset(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r), k % 2 ? c : cs); }
  for (let k = 0; k < 12; k++) { const a = k / 12 * Math.PI * 2, r1 = r - (k % 3 ? 2 : 4); R.linea(Math.round(cx + Math.cos(a) * r1), Math.round(cy + Math.sin(a) * r1), Math.round(cx + Math.cos(a) * (r - 1)), Math.round(cy + Math.sin(a) * (r - 1)), cs); }
  const am = -t * vel - Math.PI / 2, ah = -t * vel / 12 + 0.6; R.linea(cx, cy, Math.round(cx + Math.cos(am) * (r - 3)), Math.round(cy + Math.sin(am) * (r - 3)), c); R.linea(cx, cy, Math.round(cx + Math.cos(ah) * (r * 0.55)), Math.round(cy + Math.sin(ah) * (r * 0.55)), c); R.disco(cx + 0.5, cy + 0.5, 1.2, c); };
// un engranaje lejano que gira (dientes, aro, radios y cubo)
const engranaje = (cx, cy, r, n, ang, c) => { const cs = mez(c, VAC[0], 0.4), cl = mez(c, hex('#c8b8e8'), 0.35);
  for (let k = 0; k < n * 8; k++) { const a = ang + k / (n * 8) * Math.PI * 2, diente = (k % 8) < 4, rr = diente ? r + 2 : r; for (let q = r - 2; q <= rr; q++) R.pset(Math.round(cx + Math.cos(a) * q), Math.round(cy + Math.sin(a) * q), q === rr ? (Math.sin(a) < 0 ? cl : c) : cs); }
  for (let k = 0; k < 5; k++) { const a = ang + k / 5 * Math.PI * 2; R.linea(cx, cy, Math.round(cx + Math.cos(a) * (r - 2)), Math.round(cy + Math.sin(a) * (r - 2)), cs); }
  R.disco(cx + 0.5, cy + 0.5, Math.max(2, r * 0.25), c); R.disco(cx + 0.5, cy + 0.5, Math.max(1, r * 0.12), VAC[0]); };
// una hebra de luz por puntos: halo tramado, cuerpo de color y núcleo claro (w: radio del cuerpo)
const hebra = (pts, w, c, cl) => { const g1 = mez(VAC[1], c, 0.35), g2 = mez(VAC[1], c, 0.18);
  for (const [x, y] of pts) { R.pset(x, y - w - 2, (x + y) & 1 ? g2 : g1); R.pset(x, y + w + 2, (x + y) & 1 ? g2 : g1); R.pset(x, y - w - 1, g1); R.pset(x, y + w + 1, g1); }
  for (const [x, y] of pts) R.rect(x, y - w, x, y + w, c);
  for (const [x, y] of pts) { R.pset(x, y, cl); if (w > 1) R.pset(x, y - 1, cl); } };
const hebraGorda = (pts, w, c, cl) => { const g1 = mez(VAC[1], c, 0.3);
  for (let i = 0; i < pts.length; i += 2) { const [x, y] = pts[i]; R.disco(x + 0.5, y + 0.5, w + 1.6, g1); }
  for (const [x, y] of pts) R.disco(x + 0.5, y + 0.5, w, c); for (const [x, y] of pts) { R.pset(x, y, cl); R.pset(x - 1, y - 1, cl); } };
// un mundo que gira: mar, continentes, nubes que corren más deprisa, luz arriba a la izquierda, terminador tramado y halo
const mundo = (cx, cy, r, t, mar, tierra, s) => { const ri = Math.max(1, Math.round(r));
  for (let a = 0; a < 24; a++) { const an = a / 24 * Math.PI * 2 + t * 0.4; if (a % 2) R.pset(Math.round(cx + Math.cos(an) * (ri + 3)), Math.round(cy + Math.sin(an) * (ri + 3)), mez(mar, BL, 0.4)); }
  R.disco(cx + 0.5, cy + 0.5, ri + 1, KK);
  for (let j = -ri; j <= ri; j++) for (let i = -ri; i <= ri; i++) { if (i * i + j * j > ri * ri) continue; const u = i / (ri + 0.5), v = j / (ri + 0.5), z = Math.sqrt(Math.max(0, 1 - u * u - v * v));
    const lon = Math.asin(Math.max(-1, Math.min(1, u / Math.max(0.2, Math.sqrt(1 - v * v))))), lx = lon * 2.2 + t * 0.5;
    let c = vn(lx * 2, v * 3 + 7, s) > 0.55 ? tierra : mar; if (vn(lx * 3 + t * 0.4, v * 5, s + 9) > 0.7) c = mez(c, BL, 0.7);
    const luz = -u * 0.5 - v * 0.5 + z * 0.7; if (luz < 0.15) c = mez(c, KK, 0.5); else if (luz < 0.32 && bay(cx + i, cy + j) > 0.5) c = mez(c, KK, 0.35); else if (luz > 0.95) c = mez(c, BL, 0.3);
    R.pset(cx + i, cy + j, c); }
  R.pset(cx - Math.round(ri / 2), cy - Math.round(ri / 2), BL); };

// 1 · el árbol: la línea del tiempo cruza el vacío; la chispa viaja hacia atrás y, al tocar el pasado, brota la rama
const Y1 = (x) => 88 + Math.round(3 * Math.sin(x * 0.018 + 0.6));
// la plataforma de control (fija): chapa en perspectiva con estrías, juntas, remaches y una rejilla; borde de aviso;
// la caja de empalmes, los cables, la consola con su pantalla y las dos balizas
const plataforma1 = () => {
  const junta = hex('#0c0916'), filo = hex('#5a5078'), ch = [hex('#2a2440'), hex('#332c4c'), hex('#3c3458')], estria = hex('#4e4670'), rej = [hex('#1a1824'), hex('#3e3a4c')];
  let rs = 150;
  for (let y = 150; y < 180; y++) { const z = y - 150 + 8, fila = Math.floor(80 / z), finF = Math.floor(80 / (z + 1)) !== fila, iniF = Math.floor(80 / (z - 1)) !== fila, w = 30 + (y - 150) * 1.3;
    if (iniF) rs = y;
    for (let x = 0; x < 320; x++) { const u = (x - 160) / w, col = Math.floor(u), fu = (u - col) * w, id = hh(col, fila, 61), rejilla = id < 0.1;
      let c = ch[Math.floor(id * 3) % 3];
      if (rejilla) c = (x + (y & 1)) % 3 ? rej[0] : rej[1];
      else { if (((x + (y >> 1) * 2) & 3) === 0 && (y & 1) === 0) c = estria; if (hh(x >> 1, y, 62) < 0.03) c = filo; }
      if (fu < 1) c = junta; else if (iniF) c = filo; else if (finF) c = junta; else if (fu < 2) c = mez(c, junta, 0.5);
      // remaches en las esquinas de cada placa (bajo el bisel de arriba)
      if (!rejilla && !finF && y - rs === 2 && (Math.floor(fu) === 3 || Math.floor(fu) === Math.floor(w) - 4)) c = hex('#9a92b8');
      else if (!rejilla && !finF && y - rs === 3 && (Math.floor(fu) === 4 || Math.floor(fu) === Math.floor(w) - 3)) c = junta;
      R.pset(x, y, c); }
  }
  // rozaduras claras
