<script type="module">
// SI-GANCHO (frases 1–3), 1985. Cuatro planos, el gag 1 (el puente):
// 1. el castillo de cuento entero: el caballerito cruza la orilla y sube por el puente levadizo; la pastora y su oveja lo
//    saludan desde el camino, el centinela pasea, el molino gira; corta en «too» (3,69). La barra del año queda libre:
//    la banderola alta de la torre del homenaje se cambia por un gallardete corto y el humo se tumba hacia la derecha;
// 2. el puente de lado: anda por las tablas, pisa la tabla suelta («one step too many»), la tabla bascula y cae al foso
//    con un «chof» (salpicón, corona de agua); sale su gorro flotando y burbujas; un pato se acerca; en «freezes» la
//    imagen se congela y se apaga a gris con el símbolo de pausa. Las banderolas de las dos torres, que pisaban el
//    «1985», pasan a gallardetes cortos sentados en la bola de cada cono;
// 3. la pantalla de cerca, el juego congelado: en «box pops up» salta el cuadro de la muerte; la calavera guiña en
//    «joke», se ríe en «died»; la mano del jugador (T.brazo) entra en diagonal desde abajo a la derecha, por delante de
//    la disquetera, se para sobre el teclado, baja y pulsa en «square one» (la tecla se hunde, chasquido); el cuadro se
//    cierra, el juego vuelve a color y la mano descansa encima;
// 4. el escritorio de noche: el disquete con ojos llega corriendo, tarde («if you hadn't saved»); el reloj de pared da
//    media hora hacia atrás («lost half an hour»), el disquete se asusta y en «misstep» se tapa los ojos. La galería de
//    la cortina baja por debajo del año; bajo la mesa, el tablero trasero con veta y la luz que rebota, los laterales de
//    los cajones, la tarima, los cables a una regleta con su luz y un gato que duerme (abre los ojos con el susto).
import * as T from '/atomo/plato/escenas/si-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('si-gancho');
const { tramo, lerp, hex } = R;
const h3 = (a, b) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const en = (k, f) => T.momento(M, k, f);
const C = T.C;
// el «chof» de humo de cuento: bolas blancas que se hinchan con borde gris y se deshacen en motas (u 0–1)
const puf = (x, y, u, s = 1) => {
  if (u <= 0 || u >= 1) return;
  const r0 = (3 + 7 * Math.sin(Math.min(1, u * 1.6) * Math.PI / 2)) * s, se = u > 0.6 ? (u - 0.6) / 0.4 : 0;
  const bolas = [[0, 0, 1], [-1, -0.3, 0.75], [1, -0.25, 0.8], [-0.55, -0.9, 0.7], [0.6, -0.85, 0.65], [0, -1.25, 0.6]];
  for (const pasada of [0, 1, 2]) for (const [dx, dy, k] of bolas) {
    const r = r0 * k * (1 - se * 0.5), cx = x + dx * r0 * (1 + u * 0.4), cy = y + dy * r0 - u * 4 * s;
    if (se > 0 && ((Math.round(cx) + Math.round(cy)) & 1) && pasada === 2) continue;
    R.disco(Math.round(cx), Math.round(cy), Math.max(1, Math.round(pasada === 0 ? r + 1 : pasada === 1 ? r : r * 0.55)), pasada === 0 ? hex('#8a8ea0') : pasada === 1 ? hex('#e8ecf4') : hex('#ffffff'));
  }
  if (se > 0) for (let k = 0; k < 10; k++) { const a = k * 0.63, d = r0 * (1.3 + se * 0.9); R.pset(Math.round(x + Math.cos(a) * d), Math.round(y - r0 * 0.4 + Math.sin(a) * d * 0.7), k % 2 ? hex('#e8ecf4') : hex('#b8bcc8')); }
  for (let k = 0; k < 4; k++) { const a = u * 6 + k * 1.57, d = r0 * 1.2; R.pset(Math.round(x + Math.cos(a) * d), Math.round(y - r0 * 0.5 + Math.sin(a) * d * 0.6), hex('#f8e060')); }
};
// estrellitas de mareo que giran alrededor de una cabeza
const mareo = (x, y, t) => { for (let k = 0; k < 3; k++) { const a = t * 6 + k * 2.1, px = Math.round(x + Math.cos(a) * 7), py = Math.round(y + Math.sin(a) * 2);
  R.pset(px, py, hex('#f8e060')); R.pset(px - 1, py, hex('#e8a830')); R.pset(px + 1, py, hex('#e8a830')); R.pset(px, py - 1, hex('#e8a830')); R.pset(px, py + 1, hex('#e8a830')); } };
// el gorro rojo con pluma del caballerito, suelto (flota, vuela)
const gorro = (x, y, a = 0) => { const k = hex('#1a1420'), r = hex('#c83a3a'), rs = hex('#8a2a2a'), p = hex('#f2eee2');
  R.rect(x - 4, y - 1, x + 4, y + 1, k); R.rect(x - 3, y - 3, x + 2, y, k); R.rect(x - 3, y, x + 3, y, rs); R.rect(x - 2, y - 2, x + 1, y - 1, r); R.pset(x - 2, y - 2, hex('#e85a5a'));
  const fx = x + 2 + Math.round(Math.sin(a) * 1); R.linea(x + 1, y - 2, fx + 3, y - 6, k); R.linea(x + 1, y - 3, fx + 3, y - 7, p); R.pset(fx + 4, y - 7, p); };

// la barra del año libre: borra del cielo lo que no es cielo ni nube (mástiles, banderolas y humo que suben hasta ella);
// el píxel nuevo es el del mismo tramado (Bayer de 4) más cercano de la fila que sea cielo limpio
const CIELO = new Set(['#3a8ade', '#4aa6ea', '#74bef2', '#90caf2', '#a8daf4', '#d0e8ee'].map(hex)), NUBE = new Set(['#a8d6f2', '#d2ecfc', '#ffffff'].map(hex));
const limpiaCielo = (x0, y0, x1, y1) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const q = R.pget(x, y); if (CIELO.has(q) || NUBE.has(q)) continue;
  let s = 0; for (let d = 4; d < 320 && !s; d += 4) { if (x - d >= 0 && CIELO.has(R.pget(x - d, y))) s = R.pget(x - d, y); else if (x + d < 320 && CIELO.has(R.pget(x + d, y))) s = R.pget(x + d, y); } if (s) R.pset(x, y, s); } };
// un gallardete corto sobre la punta dorada de un cono (x, yp = la bola): mástil de 6 px y la tela que ondea, todo por
// debajo de la barra del año
const gallardete = (x, yp, t, c1, c2, largo = 7, m = 6) => { R.pset(x, yp - m - 1, hex('#f2c440')); R.rect(x, yp - m, x, yp - 1, hex('#3e4250'));
  for (let i = 0; i < largo; i++) { const off = Math.round(Math.sin(t * 5 - i * 0.8 + x) * (0.3 + i * 0.12)), al = i < largo - 2 ? 2 : 1;
    for (let j = 0; j < al; j++) R.pset(x + 1 + i, yp - m + off + j, j === 0 ? c1 : (i % 3 === 0 ? c2 : c1)); R.pset(x + 1 + i, yp - m + off + al, c2); } };
const a = (f) => en('foso', f), b = (f) => en('cuadro', f), c = (f) => en('media', f);
const P2 = 3.69, P3 = 8.19, P4 = 13.33;
// p1 · el castillo entero
const p1 = (t) => {
  const g = T.reino(R, t, { encuadre: 'castillo' });
  // la barra del año, libre: fuera la banderola alta de la torre del homenaje y el humo que subía hasta el borde; en su
  // lugar, un gallardete corto en la punta del cono y el humo que se va a la derecha, tumbado por el viento
  limpiaCielo(152, 0, 210, 19);
  gallardete(160, 21, t, hex('#c83a3a'), hex('#f2c440'), 8, 4);
  for (let i = 0; i < 8; i++) { const u = ((t * 0.3 + i / 8) % 1), px = Math.round(180 + u * 34 + Math.sin(t * 1.3 + i) * 1.5), py = Math.round(20 - u * 13), r = 1 + u * 2.4;
    R.disco(px, py, r, u > 0.6 ? hex('#b0b0bc') : hex('#d8d8e0')); if (r > 2) R.pset(px - 1, py - 1, hex('#f0f0f6')); }
  // el caballerito: por la orilla hasta el pie del puente y sube por las tablas
  const u = tramo(t, 0.1, 1.9), v = tramo(t, 1.9, P2 + 0.6);
  const gx = v > 0 ? Math.round(lerp(152, 153, v)) : Math.round(lerp(26, 152, u)), gy = v > 0 ? Math.round(lerp(157, 132, v)) : Math.round(lerp(170, 157, u));
  // la pastora y su oveja en el camino, junto al poste: lo saluda cuando pasa
  const sal = t > 1.0 && t < 2.6;
  T.c_oveja(R, 288, 174, t, { dir: -1, come: true });
  R.actor(EL.pastora, 254, 172, t, { dir: -1, dedo: sal, sonrisa: true, habla: sal && Math.sin(t * 9) > 0 });
  R.actor(EL.graham, gx, gy, t, { dir: 1, anda: (u > 0 && u < 1) || (v > 0 && v < 1), sonrisa: t > 1.2 && t < 2.6 });
  // una mariposa que lo acompaña
  { const mx = gx + 6 + Math.round(Math.sin(t * 3) * 10), my = gy - 32 + Math.round(Math.sin(t * 5) * 4), al = Math.sin(t * 22) > 0;
    R.pset(mx, my, hex('#3a2a1a')); R.pset(mx - 1, my - (al ? 1 : 0), hex('#f8d040')); R.pset(mx + 1, my - (al ? 1 : 0), hex('#f8d040')); R.pset(mx - 1, my + 1, hex('#e8a030')); R.pset(mx + 1, my + 1, hex('#e8a030')); }
  T.reinoDelante(R, t, { encuadre: 'castillo' });
};
// p2 · el puente de lado: la tabla suelta, la caída y el «chof»; luego, todo se congela
const PISA = a(0.79), CAE = PISA + 0.12, AGUA = CAE + 0.42, FR = 6.95;
const TX = 150;   // la tabla suelta, de x 150 a 172
const p2 = (t0) => {
  const t = Math.min(t0, FR);
  const spl = tramo(t, AGUA, AGUA + 1.3);
  T.reino(R, t, { encuadre: 'castillo', camara: 'puente', salpicon: spl, salpiconX: TX + 14, salpiconY: 152 });
  // la barra del año, libre: las banderolas altas de las dos torres (que pisaban el «1985») se cambian por gallardetes
  // cortos sentados en la bola dorada de cada cono
  limpiaCielo(28, 12, 42, 29); limpiaCielo(132, 8, 146, 24);
  gallardete(30, 30, t, hex('#c83a3a'), hex('#f2c440'), 6, 4); gallardete(134, 25, t + 0.5, hex('#5a7ad0'), hex('#f6f2ea'));
  // la tabla suelta: el hueco oscuro y la tabla que bascula
  const giro = tramo(t, PISA, PISA + 0.25), ang = giro * 1.1 - tramo(t, PISA + 0.4, PISA + 1.4) * 0.6;
  if (giro > 0) { R.rect(TX, 128, TX + 22, 133, hex('#1a2a3a')); R.rect(TX, 128, TX + 22, 128, hex('#0e1620')); }
  { const cx = TX + 4, cy = 130, L = 22, ex = cx + Math.cos(ang) * L, ey = cy + Math.sin(ang) * L;
    for (let d = -2; d <= 2; d++) R.linea(cx, cy + d, Math.round(ex - Math.sin(ang) * d), Math.round(ey + Math.cos(ang) * d), d === -2 || d === 2 ? hex('#3a2414') : d === -1 ? hex('#c89058') : hex('#a06a3a'));
    R.pset(cx + 3, cy, C.k); R.pset(Math.round(cx + Math.cos(ang) * 16), Math.round(cy + Math.sin(ang) * 16), C.k); }
  // el caballerito: anda, pisa la tabla, se tambalea y cae
  const ux = tramo(t, P2, PISA), x = Math.round(lerp(70, TX + 7, ux));
  if (t < CAE) R.actor(EL.graham, x, 128, t, { dir: 1, anda: ux > 0 && ux < 1, sonrisa: t < PISA - 0.4, sorpresa: t >= PISA, brazos: t >= PISA });
  else if (t < AGUA + 0.6) {
    const w = tramo(t, CAE, AGUA), y = Math.round(128 + 24 * w * w + 30 * tramo(t, AGUA, AGUA + 0.6));
    R.recorte([0, 0, 319, 152]); R.actor(EL.graham, x + Math.round(w * 4), y, t, { dir: 1, sorpresa: true, brazos: true }); R.recorte(null);
    if (t < AGUA) { R.icono('!', x + 18, y - 34, hex('#f8e060'), C.k); }
  }
  // el gorro que sale flotando, las burbujas y un pato curioso
  if (t > AGUA + 0.7) { const f = t - AGUA - 0.7; gorro(Math.round(TX + 16 + f * 6), 150 + Math.round(Math.sin(f * 4) * 1), f * 3);
    for (let k = 0; k < 4; k++) { const v = ((f * 0.9 + k * 0.27) % 1), bx = TX + 12 + k * 3 + Math.round(Math.sin(v * 9 + k) * 1), by = 160 - Math.round(v * 9); if (v < 0.9) { R.pset(bx, by, hex('#d8eef8')); R.pset(bx + 1, by, hex('#8ac0e0')); } } }
  { const px = Math.round(lerp(250, TX + 34, tramo(t, AGUA + 0.3, FR))), py = 156, k = C.k, bl = hex('#f2eee2'), bs = hex('#c8c4b8');
    R.rect(px - 4, py - 3, px + 4, py, k); R.rect(px - 3, py - 2, px + 3, py - 1, bl); R.rect(px - 3, py - 1, px + 3, py - 1, bs);
    R.rect(px - 5, py - 7, px - 2, py - 3, k); R.rect(px - 4, py - 6, px - 3, py - 4, bl); R.pset(px - 4, py - 5, k); R.rect(px - 7, py - 5, px - 6, py - 4, hex('#e8a030'));
    if (t > AGUA + 1.4) R.icono('?', px - 6, py - 17, hex('#f2eee2'), k); }
  T.reinoDelante(R, t, { encuadre: 'castillo', camara: 'puente' });
  // la congelación: todo pasa a gris y sale el símbolo de pausa
  const gz = tramo(t0, FR + 0.05, FR + 0.45);
  if (gz > 0) {
    for (let y = 0; y < 180; y++) for (let x0 = 0; x0 < 320; x0++) { const q = R.pget(x0, y), r = q & 255, gg = (q >> 8) & 255, bb = (q >> 16) & 255, l = (r * 0.3 + gg * 0.55 + bb * 0.15) * 0.82 + 10;
      R.pset(x0, y, (0xff000000 | (Math.round(bb + (l + 8 - bb) * gz) << 16) | (Math.round(gg + (l - gg) * gz) << 8) | Math.round(r + (l - 4 - r) * gz)) >>> 0); }
    if (gz >= 1) { R.rect(150, 74, 157, 98, C.k); R.rect(163, 74, 170, 98, C.k); R.rect(151, 75, 156, 97, hex('#f2eee2')); R.rect(164, 75, 169, 97, hex('#f2eee2')); }
    if (t0 < FR + 0.5) { const yl = Math.round(lerp(0, 179, tramo(t0, FR + 0.05, FR + 0.45))); R.rect(0, yl, 319, yl + 1, hex('#f2eee2')); }
  }
};
// p3 · la pantalla de cerca: el cuadro de la muerte
const ABRE = 8.56, GUINO = b(0.46), RIE = b(0.63), PULSA = b(0.88), CIERRA = PULSA + 0.25;
const p3 = (t) => {
  const abre = tramo(t, ABRE, ABRE + 0.45) * (1 - tramo(t, CIERRA, CIERRA + 0.3));
  T.muerte(R, t, { encuadre: 'pantalla', camara: 'cerca', congela: 1 - tramo(t, CIERRA + 0.2, CIERRA + 0.6), abre: abre > 0 ? Math.max(0.01, abre) : 0,
    guino: Math.sin(Math.PI * tramo(t, GUINO, GUINO + 0.5)), rie: t > RIE && t < RIE + 0.9 ? 1 : 0, cursor: t > b(0.75) && t < CIERRA });
  // la mano del jugador: entra en diagonal desde abajo a la derecha (por delante de la disquetera), se queda un momento
  // sobre las teclas, baja y pulsa en «square one» (la tecla se hunde y salta un chasquido), y luego descansa encima
  const TK = 207, ent = tramo(t, 10.0, 10.9), baja = tramo(t, 11.4, PULSA - 0.02), dentro = t > PULSA - 0.02 && t < PULSA + 0.3;
  const sube = tramo(t, PULSA + 0.3, PULSA + 0.8), resp = Math.round(Math.sin(t * 2.6));
  if (dentro) { R.rect(TK, 171, TK + 5, 177, hex('#7a7462')); R.rect(TK, 172, TK + 5, 176, hex('#c8c0a8')); R.rect(TK + 1, 173, TK + 4, 175, hex('#bab29a')); }
  if (ent > 0) {
    const e = ent * (2 - ent), wx = Math.round(lerp(312, 228, e) - 6 * baja + 4 * sube), wy = Math.round(lerp(200, 152, e) + 18 * baja + (dentro ? 2 : 0) - 12 * sube + (baja === 0 || sube === 1 ? resp : 0));
    T.brazo(R, wx + 70, wy + 46, wx, wy, '#3a6a9a', -1, { codo: [wx + 36, wy + 24] });
    if (t > PULSA && t < PULSA + 0.35) { const k = C.k, f = hex('#f8e060'); for (const [x0, y0, x1, y1] of [[TK - 2, 174, TK - 6, 175], [TK - 2, 171, TK - 6, 168], [TK, 169, TK - 2, 165]]) { R.linea(x0, y0, x1, y1, f); R.pset(x1, y1, k); } }
  }
};
// p4 · el escritorio: el disquete llega tarde
// la galería y el marco alto de la ventana bajan 9 px (la barra del año queda libre): se repinta el empapelado de arriba
// copiando la misma raya (periodo 12) de la pared de al lado y se vuelve a poner la galería, más baja, sobre las cortinas
const ventanaBaja = (t) => {
  for (let y = 0; y <= 23; y++) for (let x = 0; x <= 68; x++) R.pset(x, y, R.pget(x + 72, y));
  R.rect(0, 22, 67, 27, C.k); R.rect(1, 23, 66, 26, hex('#a85a2a')); R.rect(1, 23, 66, 23, hex('#e8904a')); R.rect(1, 26, 66, 26, hex('#7a3a1a'));
  for (let x = 4; x < 66; x += 6) { R.pset(x, 24, hex('#c8703a')); R.pset(x + 1, 25, hex('#8a4a2a')); }
  R.disco(0, 24, 2, C.k); R.disco(0, 24, 1, hex('#e8c860')); R.disco(67, 24, 2, C.k); R.disco(67, 24, 1, hex('#e8c860')); R.pset(67, 23, hex('#fff0a0'));
  // la sombra de la galería sobre la pared
  for (let x = 68; x < 72; x++) for (let y = 23; y < 29; y++) if (((x + y) & 1) === 0) R.pset(x, y, hex('#3a2826'));
};
// el hueco bajo la mesa: el tablero trasero de madera con su veta, los dos laterales de los cajones en escorzo, la luz
// del monitor que rebota por arriba, la tarima con sombra, los cables que bajan a una regleta con su luz roja y un gato
// que duerme (se despierta con el susto del reloj y vuelve a cerrar los ojos)
const bajoMesa = (t) => {
  const k = C.k, MA = hex('#4a3020'), MS = hex('#2e1e14'), ML = hex('#6a4a30'), MD = hex('#1a100a');
  // el fondo: tablero trasero (y 139–162) con vetas, más claro arriba (la luz que rebota del monitor y del flexo)
  for (let y = 139; y <= 162; y++) for (let x = 111; x <= 213; x++) { const v = 0.55 - (y - 139) * 0.02 + Math.sin(x * 0.35 + Math.sin(y * 0.4 + x * 0.05) * 2) * 0.12;
    R.pset(x, y, v > 0.5 ? (((x + y) & 1) ? ML : MA) : v > 0.25 ? MA : v > 0.05 ? (((x + y) & 1) ? MA : MS) : MS); }
  for (let x = 111; x <= 213; x++) { R.pset(x, 139, hex('#7a5638')); if (x % 3) R.pset(x, 140, hex('#5e4028')); }
  for (const xj of [145, 180]) R.rect(xj, 141, xj, 162, MS);
  // la tarima de abajo (y 163–179), tablas en perspectiva que se abren hacia delante, con sombra en el fondo
  R.rect(105, 163, 219, 179, hex('#3a2416'));
  for (let y = 163; y <= 179; y++) { const f = (y - 163) / 16; for (let x = 105; x <= 219; x++) { const xv = 162 + (x - 162) / (0.6 + f * 0.4), j = ((xv - 105) % 17 + 17) % 17;
    let c = j < 1 ? MD : (h3(Math.floor((xv - 105) / 17), Math.floor(y / 6)) < 0.5 ? hex('#4a3020') : hex('#3e2818'));
    if (y < 166 || ((x + y) & 3) === 0 && y < 170) c = MD; R.pset(x, y, c); } }
  for (let y = 163; y <= 179; y += 6) R.linea(105, y, 219, y, hex('#2a1a10'));
  // los laterales de los cajones, en escorzo
  R.poligono([[105, 139], [111, 141], [111, 163], [105, 172]], MA); R.poligono([[219, 139], [213, 141], [213, 163], [219, 172]], MS);
  R.linea(111, 141, 111, 163, k); R.linea(213, 141, 213, 163, k); for (let y = 144; y < 168; y += 5) { R.pset(107, y, ML); R.pset(108, y + 1, ML); R.pset(217, y, MD); }
  R.linea(105, 172, 111, 163, k); R.linea(219, 172, 213, 163, k);
  // los cables que bajan del ordenador por el pasacables y se enroscan hasta la regleta
  R.disco(196, 141, 2, k); R.pset(196, 141, MD);
  for (let y = 142; y <= 172; y++) { const sw = Math.sin(t * 0.8) * 0.6 * (y - 142) / 30; R.pset(Math.round(196 + Math.sin(y * 0.25) * 2 + sw), y, hex('#1a1a1e')); R.pset(Math.round(198 + Math.sin(y * 0.22 + 1) * 1.5 + sw), y, hex('#3a3a42')); }
  R.linea(197, 172, 186, 174, hex('#1a1a1e')); R.linea(199, 172, 192, 174, hex('#3a3a42'));
