<!doctype html>
<html lang="es">

<title>La gravedad · ep36</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// TU-GRAVEDAD (frases 20–21), cartela «2026»; la barra dice 2026, salvo en las medidas (2023 y, en «2024», 2024).
// Nueve planos, cortados en la palabra inglesa (el 4 es la vista LIBRE hoy/mesa/general, para la frase de >7 s):
// 1. la manzana en el escritorio de Atom (hasta «it,»): en «gravity» empieza a rodar, en «Everything with mass» llega
//    al filo y cae con la flecha roja que crece y bota en la tarima en «around»; el gato da un respingo («!»);
// 2. la pizarra de la gravedad (corta en «and gravity»): el geofísico entra y en «empty room» señala: aparece el hueco
//    cuadrado en la roca y menguan las tres flechas de encima; la geofísica llega por la derecha con la maleta del
//    gravímetro y la deja junto al todoterreno; cuando él le habla ella asiente con una sonrisa (un saltito);
// 3. el corte de cerca (corta en «which»): en «a tiny bit weaker» crece el hueco, se acortan las flechas de encima y
//    la pesa sube un pelo; en «differences of a few parts» una mano (T.brazo) con un lápiz rojo entra por abajo, subraya la cifra 0,00000001 del decorado, destella y se va;
// 4. la mesa de Atom desde arriba (corta en «At heart»): en «extremely sensitive» entra la mano de Atom con la campana
//    del estetoscopio (con su tubo) y la apoya junto a la manzana en «instruments»; salen las ondas y en «pick up» la
//    manzana rueda un pelo;
// 5. el muelle del gravímetro (corta en el silencio tras «difference»): una mano con un lápiz entra y en «weight
//    hanging» da un toque al marco: la pesa bota en su muelle; la mano espera junto a la lupa y, en «feel the
//    difference», la pesa sube un pelo, la aguja se va a 0,3 y el lápiz deja una rayita roja junto a la lupa; se va;
// 6. el gravímetro en la ladera (2023–24, corta en «And in»; gag 6): la geofísica llega con la libreta hasta el trípode
//    (pasa una hoja); el geofísico teclea junto al portátil; en «twelve hundred» canta la cuenta (globo con la cifra); el
//    escarabajo (el del decorado, o.escarabajo) pasa con su bola por delante del trípode, la aguja tiembla, los dos contienen el
//    aire («!») y, al verlo, sonríen y ella lo señala; el escarabajo baja y sale por DELANTE de la caja del portátil;
// 7. el mapa (2026, corta en «Low»): en «September 2026» se pinta la rejilla de 1.242 puntos en zigzag; en
//    «published the results» salen las manchas y en «Reeves himself» la mano del decorado clava una chincheta roja en la
//    grande (o.chincheta) y se va; el borde de la mancha late;
// 8. las esquinas (corta en «lined up»): en «Low density zones» la mancha late; en «right-angled corners» las escuadras
//    entran y se posan en cada esquina recta (sale la cota 35) y, al posarse, cada esquina destella y queda marcada con
//    su cuadradito;
// 9. el trazo de Reeves (hasta el final): en «north wall» la pared norte se enciende; en «beyond the very wall» las
//    manchas salen al otro lado; en «where he had seen» la mano de Reeves (la del decorado) dibuja el trazo azul de las
//    salas; en «doorways» la mancha late con su «?».
import * as T from '/atomo/plato/escenas/tu-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('tu-gravedad');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const N = Math.round;
const ease = (u) => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
const K = hex('#1a1410'), BL = hex('#f8f4e8');
const globo = (x, y, ic, c) => { R.disco(x, y, 7, K); R.disco(x, y, 6, BL); R.pset(x - 5, y + 7, K); R.pset(x - 4, y + 6, BL); R.pset(x - 6, y + 8, K); R.icono(ic, x - (ic === '?' ? 2 : 1), y - 4, c, null, 1); };
const destello = (x, y, r, c = '#fff8d0') => { const C = hex(c); R.linea(x - r, y, x + r, y, C); R.linea(x, y - r, x, y + r, C); const d = N(r * 0.5); R.linea(x - d, y - d, x + d, y + d, C); R.linea(x - d, y + d, x + d, y - d, C); R.pset(x, y, hex('#ffffff')); };
const anillo = (cx, cy, r, c) => { const C = hex(c), n = Math.max(10, N(r * 6)); for (let i = 0; i < n; i++) { if (i % 3 === 2) continue; const a = i / n * Math.PI * 2; R.pset(N(cx + Math.cos(a) * r), N(cy + Math.sin(a) * r), C); } };
const G1 = T.ELENCO_TU.geofisico1TU, G2 = T.ELENCO_TU.geofisica2TU;
const P2 = en('gravedad', 0.1969), P3 = en('gravedad', 0.3855), P4 = en('gravedad', 0.6275), P5 = en('gravedad', 0.7853),
  P6 = en('medidas', 0) - 0.57, P7 = en('medidas', 0.3136), P8 = en('medidas', 0.5632), P9 = en('medidas', 0.7432);

// 1 · la manzana: rueda al filo, cae con la flecha roja y bota en la tarima
const p1 = (t) => {
  const rueda = 0.12 * ease(tramo(t, en('gravedad', 0.03), en('gravedad', 0.1009)));
  const cae = tramo(t, en('gravedad', 0.1009), en('gravedad', 0.18));
  T.hoy(R, t, { encuadre: 'mesa', camara: 'manzana', cae: cae > 0 ? 0.12 + 0.88 * Math.pow(cae, 1.5) : rueda });
  // el gato da un respingo al botar la manzana: «!» encima de él hasta el corte
  const bote = en('gravedad', 0.1737);
  if (t > bote) globo(262, 98 - N(3 * (1 - ease((t - bote) / 0.25))), '!', hex('#d83a2a'));
};

// 2 · la pizarra de la gravedad: el geofísico señala; sale el hueco y menguan las flechas
const p2 = (t) => {
  const hueco = ease(tramo(t, en('gravedad', 0.2863), en('gravedad', 0.315)));
  const o = { encuadre: 'gravedad', flechas: 1, hueco };
  T.ladera(R, t, o);
  const u = ease(tramo(t, P2 + 0.1, en('gravedad', 0.27)));
  const x = N(lerp(-10, 40, u));
  R.actor(G1, x, 162, t, { dir: 1, anda: u > 0 && u < 1, dedo: t > en('gravedad', 0.28) && t < en('gravedad', 0.34), habla: t > en('gravedad', 0.34) && Math.floor(t * 6) % 2 === 0 });
  // la geofísica llega por la derecha con la maleta del gravímetro, la deja en el suelo junto al todoterreno y, en
  // «less rock», escucha a su compañero y asiente con una sonrisa
  const v = ease(tramo(t, P2 + 0.4, en('gravedad', 0.245))), x2 = N(lerp(338, 284, v)), deja = t > en('gravedad', 0.252);
  const m2 = R.actor(G2, x2, 162, t, { dir: -1, anda: v > 0 && v < 1, sostiene: !deja, sonrisa: t > en('gravedad', 0.345), salto: t > en('gravedad', 0.35) && t < en('gravedad', 0.365) && Math.floor(t * 8) % 2 === 0 ? 1 : 0 });
  const maleta = (mx, my) => { R.rect(mx - 6, my - 1, mx + 6, my + 8, K); R.rect(mx - 5, my, mx + 5, my + 7, hex('#7a7a84')); R.rect(mx - 5, my + 3, mx + 5, my + 3, hex('#4a4a54')); R.rect(mx - 2, my - 3, mx + 2, my - 2, K); R.pset(mx - 3, my + 1, hex('#c8c8d0')); };
  if (!deja && m2 && m2.mano) maleta(m2.mano[0], m2.mano[1]); else if (deja) maleta(x2 - 9, 154);
  T.laderaDelante(R, t, o);
};

// 3 · el corte de cerca: el hueco crece, las flechas de encima se acortan; la cifra
const p3 = (t) => {
  // el hueco crece de «gravity» a «weaker»; en «Differences» late un pelo (lo poquito que cambia)
  const late = tramo(t, en('gravedad', 0.5257), en('gravedad', 0.59));
  const hueco = ease(tramo(t, en('gravedad', 0.3958), en('gravedad', 0.5069))) - (late > 0 && late < 1 ? 0.12 * Math.abs(Math.sin(late * Math.PI * 3)) : 0);
  const o = { encuadre: 'gravedad', camara: 'flechas', hueco };
  T.ladera(R, t, o);
  T.laderaDelante(R, t, o);
  // en «100 million» la cifra del decorado (0,00000001, abajo a la izquierda) se subraya y destella
  // una mano con un lápiz rojo entra por abajo a la izquierda, subraya la cifra de izquierda a derecha y se va
  const U0 = en('gravedad', 0.555), q = tramo(t, U0, U0 + 0.7);
  const w = N(lerp(0, 58, ease(q)));
  if (q > 0) { R.linea(18, 108, 18 + w, 108, hex('#d83a2a')); R.linea(18, 109, 18 + w, 109, hex('#d83a2a')); }
  if (q >= 1) { const g = tramo(t, U0 + 0.7, U0 + 1.2); if (g > 0 && g < 1) destello(N(lerp(22, 76, g)), 104, N(2 + 3 * Math.sin(g * Math.PI))); }
  const ent = ease(tramo(t, U0 - 0.6, U0)), sal = ease(tramo(t, U0 + 0.85, U0 + 1.35)), k = ent * (1 - sal);
  if (k > 0.01) { const px = 18 + w, py = 108, wx = N(lerp(px - 30, px - 14, k)), wy = N(lerp(196, py + 10, k));
    T.brazo(R, wx - 34, 214, wx, wy, '#8a5a3a', 1, { codo: [wx - 24, wy + 38] });
    // el lápiz rojo entre los dedos: del puño a la punta, con su mina
    R.linea(wx + 6, wy - 1, px, py, K); R.linea(wx + 7, wy - 1, px + 1, py, hex('#d83a2a')); R.linea(wx + 6, wy - 2, px, py - 1, hex('#e86a5a')); R.pset(px, py, hex('#3a1a10')); }
};

// 4 · la mesa de Atom desde arriba: la mano apoya la campana del estetoscopio junto a la manzana
const p4 = (t) => {
  const rueda = 0.15 * ease(tramo(t, en('gravedad', 0.73), en('gravedad', 0.76)));
  const o = { encuadre: 'mesa', rueda, estetoscopio: false };
  const g = T.hoy(R, t, o) || {};
  const [mx, my] = g.manzana || [244, 122];
  const entra = ease(tramo(t, en('gravedad', 0.6578), en('gravedad', 0.7046))), sale = ease(tramo(t, en('gravedad', 0.76), en('gravedad', 0.78)));
  const k = entra * (1 - sale);
  const bx = N(lerp(150, mx - 16, k)), by = N(lerp(200, my + 4, k));
  if (k > 0.01) {
    // el tubo del estetoscopio: de la campana sale hacia abajo, junto al brazo, hasta el borde
    for (let i = 0; i <= 24; i++) { const u = i / 24, x = N(lerp(bx - 4, bx - 22, u) - Math.sin(u * Math.PI) * 8), y = N(lerp(by + 3, 186, u)); R.disco(x, y, 1, K); R.pset(x, y - 1, hex('#5a606c')); }
    T.brazo(R, bx + 10, 200, bx + 8, by + 8, '#5a8ad0', 1, { codo: [bx + 24, by + 34] });
    const X = bx, Y = by; R.disco(X, Y, 6, K); R.disco(X, Y, 5, hex('#8a909c')); R.disco(X - 1, Y - 1, 4, hex('#c8ced8')); R.disco(X, Y, 2, hex('#eef2f6'));
  }
  if (t > en('gravedad', 0.7046) && k > 0.9) for (const d of [0, 0.5]) { const q = (t * 1.4 + d) % 1; anillo(mx, my, 7 + N(q * 16), q < 0.5 ? '#fff4a0' : '#e8c050'); anillo(mx, my, 8 + N(q * 16), '#5a3a1a'); }
};

// 5 · el muelle: la pesa cuelga y oscila; en «difference» sube un pelo y la aguja se mueve
const p5 = (t) => {
  const u = ease(tramo(t, en('gravedad', 0.948), en('gravedad', 0.962)));
  // en «weight hanging» la mano da un toque al marco con el lápiz y la pesa bota en su muelle (oscilación que se apaga)
  const TOQ = en('gravedad', 0.8542), d = t - TOQ, bota = d > 0 ? 0.35 * Math.exp(-d * 1.3) * Math.abs(Math.sin(d * 7)) : 0;
  T.ladera(R, t, { encuadre: 'gravimetro', camara: 'muelle', hueco: Math.min(1, u + bota), aguja: 0.3 * u + (d > 0 ? 0.25 * Math.exp(-d * 1.3) * Math.sin(d * 7) : 0) });
  // la rayita roja con la que el lápiz marca, en «feel the difference», dónde se ha quedado la aguja (y se queda)
  const MK = en('gravedad', 0.962), raya = tramo(t, MK, MK + 0.4);
  if (raya > 0) { const l = N(5 * raya); R.linea(231, 95, 231 + l, 95, hex('#d83a2a')); R.linea(231, 96, 231 + l, 96, hex('#a82a1a')); }
  // un solo brazo con el lápiz amarillo: entra por abajo a la derecha, da el toque al marco (punta en x 181), espera junto
  // a la lupa con el lápiz levantado (se mece un pelo mientras la pesa bota) y, cuando la aguja se para, marca y se va
  const entra = ease(tramo(t, P5 + 0.2, TOQ - 0.05)), sale = ease(tramo(t, MK + 1.1, MK + 1.7)), k = entra * (1 - sale);
  if (k > 0.01) {
    const espera = ease(tramo(t, TOQ + 0.25, TOQ + 0.9)), marca = ease(tramo(t, MK - 0.45, MK));
    const tap = d > -0.08 && d < 0.12 ? -2 : 0, mece = N(Math.sin(t * 3) * 1.2) * (1 - marca);
    let tx = lerp(181 + tap, 228, espera) + mece, ty = lerp(150, 112, espera);
    tx = lerp(tx, 231 + 5 * raya, marca); ty = lerp(ty, 95, marca);
    const px = N(tx), py = N(ty), wx = N(lerp(px + 80, px + 14, k)), wy = N(lerp(py + 80, py + 9, k));
    T.brazo(R, wx + 44, 214, wx, wy, '#4a6a8a', -1, { codo: [wx + 34, wy + 36] });
    R.linea(wx - 6, wy - 1, px, py, K); R.linea(wx - 7, wy - 1, px - 1, py, hex('#e8b840')); R.linea(wx - 6, wy - 2, px, py - 1, hex('#f8d870')); R.pset(px, py, hex('#3a2a1a')); }
};

// 6 · el gravímetro en la ladera (gag 6): miden; el escarabajo pasa y la aguja tiembla
const p6 = (t) => {
  // el escarabajo es el del decorado (o.escarabajo): cruza por delante del trípode y, desde x 192, laderaDelante lo pasa
  // por DELANTE de la caja del portátil (geo escarabajo [96 + 140e, 160 → 176]), con su rastro en la arena
  const esc = tramo(t, en('medidas', 0.12), en('medidas', 0.33));
  const xe = N(96 + 140 * esc), tiembla = xe > 140 && xe < 182 ? Math.sin((xe - 140) / 42 * Math.PI) : 0;
  const o = { encuadre: 'gravimetro', tiembla, escarabajo: esc };
  T.ladera(R, t, o);
  const susto = tiembla > 0.3, ve = esc > 0.62 && esc < 1;
  // la geofísica llega desde la izquierda con la libreta hasta el trípode; el geofísico apunta en el portátil
  const u = ease(tramo(t, P6 + 0.2, en('medidas', 0.08)));
  const x2 = N(lerp(-16, 112, u));
  const m2 = R.actor(G2, x2, 151, t, { dir: 1, anda: u > 0 && u < 1, sorpresa: susto, sonrisa: ve, sostiene: !ve, dedo: ve });
  if (!ve && m2 && m2.mano) { const [lx, ly] = m2.mano; R.rect(lx - 2, ly - 4, lx + 3, ly + 2, K); R.rect(lx - 1, ly - 3, lx + 2, ly + 1, BL); R.pset(lx, ly - 2, hex('#3a6ad8')); 
    // en «twelve hundred» pasa una hoja de la libreta (el borde que cruza)
    const fl = tramo(t, en('medidas', 0.08), en('medidas', 0.08) + 0.3); if (fl > 0 && fl < 1) R.linea(lx - 1 + N(3 * fl), ly - 4, lx - 1 + N(3 * fl), ly + 1, hex('#b8b0a0')); }
  const m1 = R.actor(G1, 198, 151, t, { dir: 1, sorpresa: susto, sonrisa: ve, sostiene: !susto && !ve ? [212, 140 - (t > P6 + 0.5 && t < P6 + 1.6 && Math.floor(t * 10) % 2 ? 1 : 0)] : false, habla: t > en('medidas', 0.1787) && t < en('medidas', 0.25) && Math.floor(t * 6) % 2 === 0 });
  T.laderaDelante(R, t, o);
  // en «1200» el geofísico canta la cuenta: globo con la cifra
  if (t > en('medidas', 0.1787) && t < en('medidas', 0.31)) { const bx = 222, by = 96; R.rect(bx - 19, by - 9, bx + 19, by + 7, K); R.rect(bx - 18, by - 8, bx + 18, by + 6, BL); R.pset(bx - 14, by + 8, K); R.pset(bx - 15, by + 9, K); R.pset(bx - 14, by + 7, BL);
    R.numero('1200', bx, by + 4, { centro: true }); }
  if (susto) globo(150, 92, '!', hex('#d83a2a'));
};

// 7 · el mapa: la rejilla en zigzag y, al publicar, las manchas
const p7 = (t) => {
  const rejilla = tramo(t, P7 + 0.1, en('medidas', 0.4));
  const manchas = ease(tramo(t, en('medidas', 0.436), en('medidas', 0.4849)));
  // en «Reeves himself» la mano del decorado (o.chincheta) entra por la derecha y clava la chincheta roja en la mancha
  // grande (172, 70) al 0,5 del tramo (con el «toc»), y se va; al clavarla, el borde de la mancha late
  const r0 = en('medidas', 0.5032) + 0.3, k = tramo(t, r0 - 0.8, r0 + 0.8);
  T.ladera(R, t, { encuadre: 'mapa', rejilla: Math.max(0.001, rejilla), manchas, chincheta: k });
  if (k >= 0.5 && Math.floor(t * 4) % 2 === 0) for (let i = 0; i < 90; i++) { const a = i / 90 * Math.PI * 2; if (i % 3) R.pset(N(162 + Math.cos(a) * 30), N(78 + Math.sin(a) * 16), hex('#fff4a0')); }
};

// 8 · las esquinas: la escuadra se posa en cada esquina recta; cota 35
const p8 = (t) => {
  const escuadra = tramo(t, en('medidas', 0.625), en('medidas', 0.70));
  const g = T.ladera(R, t, { encuadre: 'mapa', camara: 'esquinas', escuadra: Math.max(0.001, escuadra) });
  // al posarse, cada esquina recta destella y se marca con su cuadradito de ángulo recto, que se queda
  if (escuadra >= 1 && g.mancha) { const [X0, Y0, X1] = g.mancha, d = t - en('medidas', 0.70);
    for (const [cx, s] of [[X0, 1], [X1, -1]]) { R.linea(cx + s * 3, Y0 + 3, cx + s * 8, Y0 + 3, hex('#fff4a0')); R.linea(cx + s * 3, Y0 + 3, cx + s * 3, Y0 + 8, hex('#fff4a0'));
      R.linea(cx + s * 8, Y0 + 3, cx + s * 8, Y0 + 8, hex('#fff4a0')); R.linea(cx + s * 3, Y0 + 8, cx + s * 8, Y0 + 8, hex('#fff4a0'));
      if (d < 0.5) destello(cx, Y0, N(2 + 5 * Math.sin(Math.min(1, d / 0.5) * Math.PI))); } }
  const q = tramo(t, en('medidas', 0.5781), en('medidas', 0.66));
  if (q > 0 && q < 1) { const r = N(lerp(30, 70, (q * 2) % 1)); for (let i = 0; i < 80; i++) { const a = i / 80 * Math.PI * 2; R.pset(N(186 + Math.cos(a) * r * 1.2), N(78 + Math.sin(a) * r * 0.6), hex('#fff4a0')); } }
};

// 9 · el trazo de Reeves: la pared norte se enciende; las manchas salen al otro lado
const p9 = (t) => {
  const anomalias = ease(tramo(t, en('medidas', 0.8546), en('medidas', 0.9074)));
  // en «where he had seen one of the doorways» la mano de Reeves (la del decorado) dibuja su trazo azul a rayas
  const traza = tramo(t, en('medidas', 0.875), en('medidas', 0.985));
  const o = { encuadre: 'trazo', reeves: traza > 0 ? 1 : 0, traza: Math.max(0.001, traza), anomalias };
  T.ladera(R, t, o);
  T.laderaDelante(R, t, o);
  // en «north wall» la pared norte se enciende (dos rayas que laten)
  if (t > en('medidas', 0.7806) && t < en('medidas', 0.88)) { const c = Math.floor(t * 5) % 2 ? '#fff4a0' : '#f8c040'; R.linea(213, 92, 213, 132, hex(c)); R.linea(214, 92, 214, 132, hex(c)); }
  // (las manchas, ya reforzadas por el decorado en 'trazo': núcleo oscuro y borde tramado)
  if (t > en('medidas', 0.9448)) { const q = (t * 2) % 1; anillo(256, 108, 16 + N(q * 6), '#fff4a0'); if (Math.floor(t * 3) % 2 === 0) globo(256, 78, '?', hex('#3a6ad8')); }
};

const efectos = [
  // 1 · la manzana: cae, bota y el gato se sobresalta
  [en('gravedad', 0.1009), 'whoosh'], [en('gravedad', 0.1737), 'toc'], [en('gravedad', 0.184), 'miau'],
  // 2 · la maleta en el suelo, el dedo y el hueco
  [en('gravedad', 0.252), 'golpecito'], [en('gravedad', 0.2863), 'pop'],
  // 3 · la pesa sube un pelo; el lápiz rojo subraya la cifra
  [en('gravedad', 0.4824), 'tic'], [en('gravedad', 0.555), 'lapiz'],
  // 4 · la campana del estetoscopio en la mesa; la manzana rueda
  [en('gravedad', 0.7046), 'golpecito'], [en('gravedad', 0.7482), 'tic'],
  // 5 · el toque al marco, el muelle que bota, la aguja y la rayita del lápiz
  [en('gravedad', 0.8542), 'golpecito'], [en('gravedad', 0.8542) + 0.12, 'boing'], [en('gravedad', 0.95), 'tic'], [en('gravedad', 0.962), 'lapiz'],
  // 6 · el portátil, la libreta, la cifra, el temblor y el apunte
