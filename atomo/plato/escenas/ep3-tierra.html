<script type="module">
// EP3-TIERRA · episodio 3, frases 55–57 (cartela «+7»), plastilina adulta. Adapta cosmos-plastilina-adulta.html hasta
// «sol», con la cámara del mundo de kits/ep03-cosmos.js (que crea esta escena).
//  0      el fotograma 0 de cosmos-plastilina-adulta (la persona «humano» de pie a la izquierda, la regla de nogal con el

//         se va hacia 1,2 s); la flecha de la regla baja a la fila del centro mientras sale la cartela

//         10⁴, su marca de la regla destella: la madera de la fila se enciende, el rótulo da un respingo y un brillo de
//         latón se abre en el canto), las nubes (cúmulos de arcilla con su sombra a 10⁵ y bancos sobre el mar a 10⁶), el

//  hueco  salto 8 (acaba en la marca): la Tierra se encoge y se va a la izquierda y aparece la Luna, lejos, a su
//         distancia real del apogeo (la cámara en 10^8,25 con el marcador en 10⁸): una onda plateada se cierra sobre ella
//         y su halo, más grande el primer segundo, late una vez; a mitad de frase, los siete planetas a escala caen uno a
//         uno en el hueco y se quedan en fila, ajustados (Saturno con los anillos en «/», dentro de y 80–780); la cinta de
//         costurera se tiende desde lo alto de la Tierra, por encima de los planetas pequeños, hasta tocar con su punta el
//         borde de la Luna; la cámara se acerca de golpe (como un salto) al final de la fila: entre Neptuno y la Luna
//         sobra un pelo (una cota de latón lo marca, encima de la cinta); la cinta se recoge de golpe. El fondo del hueco y
//         del plano medio es el mismo (el resplandor del Sol del hueco)
//  sol    salto 9 (acaba en la marca): la cámara sale hasta el Sol de crearMundo, enorme, con la Tierra como un punto a
//         su lado (los planetas encogen y desaparecen); las Tierras caen en el Sol una tras otra, cada vez más seguidas,
//         y se funden con una onda, como gotas en una pecera; las últimas se funden y todo queda quieto (termina_con)
// Coste: la cámara del plató es fija. Lo quieto son fotos: el plató de la mirilla, los planetas (sprites) y las nubes, al
// cargar; el mundo en cada encuadre quieto (la Tierra entera, el hueco, el plano medio y el Sol), tres fotos que se
// alternan (el hervor), la primera vez que hacen falta. En cada fotograma se dibujan en vivo Atom, la regla y su flecha,
// y lo que se mueve (la flecha de «tú estás aquí», la cinta, la cota); el mundo, solo mientras la cámara se mueve y en las
// paradas del viaje (de 10¹ a 10⁶). Encima de todo, un lienzo 2D («sobre») para la luz del destello de 10⁴.
import * as THREE from 'three';
import { escena } from '/atomo/plato/escena.js';
import { crearPlato, cartela, cl, mix, prog, ss, eio, eoc, eic, azar, muelle } from '/atomo/plato/kits/plastilina-adulta.js';
import { crearMundo, camara, camaraPorTierra, mezclarCamaras, estadoMundo, fotoMundo, aPant, tierraPx, brilloCiudad, brilloLuna, gotasTierras,
  tierrasQueCaen, tiposCosmos, planeta, saturno, cinta, enPlato, fotoPieza, aqui, largoAqui, filaPlanetas,
  lunaMundo, aMundo, PLANETAS, MUNDO, HUECO, FINAL_TIERRA } from '/atomo/plato/kits/ep03-cosmos.js';

const T0 = performance.now();
const perfil = new URLSearchParams(location.search).has('perfil');
const log = (...a) => { if (perfil) console.log(...a, Math.round(performance.now() - T0)); };
const E = await escena('ep3-tierra', 'ep03');
log('escena');
const M = (k) => E.marca(k);
const m = { tierra: M('tierra'), tierraFin: M('tierra_fin'), hueco: M('hueco'), huecoFin: M('hueco_fin'), sol: M('sol'), solFin: M('sol_fin') };
const D = E.duracion, QUIETO = D - 0.6;
const W = 1920, H = 1080;
function calma(t, t1 = QUIETO, d = 0.9) { const a = t1 - d; if (t <= a) return t; const u = Math.min(t - a, d); return a + u - (u * u) / (2 * d); }

// ---------------------------------------------------------------- los saltos (todo sale de las marcas)
// 1–7 en la frase 55: el primero acaba en su marca y el séptimo deja la Tierra entera algo más de un segundo;
// 8 acaba en «hueco» y 9 en «sol». Golpes secos: arrancan con fuerza y frenan en firme (control de movimiento)
const J = 0.32;
const SALTOS = [];
{
  const a1 = m.tierra - J + 0.02, a7 = m.tierraFin - 1.1 - J;
  for (let k = 0; k < 7; k++) { const a = a1 + k * (a7 - a1) / 6; SALTOS.push([a, a + J]); }
  SALTOS.push([m.hueco - J + 0.02, m.hueco + 0.02], [m.sol - J + 0.02, m.sol + 0.02]);
}
const seco = (u) => 1 - Math.pow(1 - cl(u), 4);
function zRegla(t) { let z = 0; for (const [a, b] of SALTOS) z += seco(prog(t, a, b)); return z; }
const enSalto = (t) => SALTOS.some(([a, b]) => t > a - 0.02 && t < b + 0.08);

// frase 56: los planetas caen a mitad de frase, la cinta se tiende, la cámara se acerca al pelo y la cinta se recoge
const L56 = m.huecoFin - m.hueco;
const T = {
  plato: SALTOS[0][0],                             // hasta aquí, el plató; después, el mundo
  b4: SALTOS[3][1],                                // la regla llega a 10⁴: brilla la marca y se enciende la ciudad
  pl0: m.hueco + 0.3 * L56, plPaso: 0.34, plCae: 0.36,
};
// el destello de la marca 10⁴: centrado en la parada en 10⁴ (entre el salto 4 y el 5), no al arrancar el 5
T.b4a = T.b4 - 0.1; T.b4b = SALTOS[4][0] + 0.12;
T.cinta0 = T.pl0 + 6 * T.plPaso + T.plCae + 0.18; T.cinta1 = T.cinta0 + 0.85;
// el acercamiento al pelo es un golpe seco como los saltos; empieza en un fotograma (a 12 por segundo), así el primero
// que se mueve ya va por el 70 % y Saturno sale del cuadro sin pasar sus anillos por la esquina de Atom
T.empuje0 = Math.ceil((T.cinta1 + 0.1) * 12 - 1e-6) / 12; T.empuje1 = T.empuje0 + J;
T.cota0 = T.empuje1 + 0.05; T.cota1 = T.cota0 + 0.4;
T.recoge0 = SALTOS[8][0] - 0.3; T.recoge1 = SALTOS[8][0] - 0.02;
// frase 57: las Tierras caen desde poco después de la marca; las últimas tocan ~1 s antes de quedarse quieto
const GOTAS = gotasTierras({ t0: m.sol + 0.55, t1: m.solFin - 1.4, n: 32, semilla: 11 });

// ---------------------------------------------------------------- el plató
const I = { PER: 0, REG: 1, FLE: 2, AQUI: 3, CINTA: 4, COTA: 5, PLA: 6, SAT: 7 };
const P = await crearPlato({
  piezas: ['humano', 'reglaA', 'flecha', 'flecha', 'cinta', 'cota', 'planeta', 'saturno'],
  tiposExtra: tiposCosmos(['planeta', 'saturno', 'cinta']),
  alfa: true, cartela: E.cartela,
  sombraFondo: ['p0', 'p1'],
  sombras: { p0: ['atomo'] },
  camara: { pos: [0, 3.8, 15.5], mira: [0, 2.3, 0], fov: 28, desenfoque: 44 },
});
log('plato');
const en = (sx, sy, z) => P.punto(sx, sy, z);
const pant = (p) => P.proyectar(p);
const pxU = (pos) => { const a = pant(pos), b = pant([pos[0] + 1, pos[1], pos[2]]); return Math.hypot(b[0] - a[0], b[1] - a[1]); };
const E_PER = 2.4, PER = (() => { const a = en(612, 600, 0.6); return [a[0], 1.0 * E_PER, 0.6]; })();
const E_REG = 1.42, REG = en(1655, 528, 0.4);

// ---------------------------------------------------------------- lo que se prepara después de cargar
// Para que la escena esté lista antes, lo que no hace falta en los primeros fotogramas (las fotos de los planetas y el
// estreno de la cinta, la cota y la flecha de «tú estás aquí») se hace en los fotogramas baratos (el plató, la Tierra
// entera y la espera de la Luna), unas pocas cosas cada vez y al principio del fotograma, antes de dibujarlo (lo que dejan
// en el lienzo del plató se pisa). Un fotograma que necesite algo que aún no está (capturas sueltas o fuera de orden) lo
// hace en ese momento.
const TAREAS = [];
function tarea(nombre, fn, orden = 10) {
  const k = { nombre, fn, hecha: false, orden };
  TAREAS.push(k);
  return () => { if (!k.hecha) { k.hecha = true; const a = performance.now(); k.fn(); log('tarea ' + nombre + ' ' + Math.round(performance.now() - a)); } };
}
const hacer = (k) => { if (!k.hecha) { k.hecha = true; const a = performance.now(); k.fn(); log('tarea ' + k.nombre + ' ' + Math.round(performance.now() - a)); } };
function adelantar(t0, presupuesto = 900) {
  for (const k of TAREAS) { if (performance.now() - t0 > presupuesto) break; hacer(k); }
}

// ---------------------------------------------------------------- capas: el mundo (oculto), el lienzo 2D y el plató
const cont = document.getElementById('escena');
const mundo = crearMundo(cont, { captura: P.captura });
log('mundo');
mundo.lienzo.style.visibility = 'hidden';
const lienzoGL = P.renderer.domElement;
lienzoGL.style.zIndex = '2';
const capa = document.createElement('canvas');
capa.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;display:block;z-index:1';
cont.appendChild(capa);
const g = capa.getContext('2d');
function ajustarCapa() {
  if (capa.width !== lienzoGL.width || capa.height !== lienzoGL.height) { capa.width = lienzoGL.width; capa.height = lienzoGL.height; }
  const k = capa.width / W; g.setTransform(k, 0, 0, k, 0, 0);
}
// encima del plató, un lienzo 2D para la luz del destello de 10⁴ (se borra en cada fotograma)
const sobre = document.createElement('canvas');
sobre.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;display:block;z-index:3;pointer-events:none';
cont.appendChild(sobre);
const gs = sobre.getContext('2d');
function limpiarSobre() {
  if (sobre.width !== lienzoGL.width || sobre.height !== lienzoGL.height) { sobre.width = lienzoGL.width; sobre.height = lienzoGL.height; }
  gs.setTransform(1, 0, 0, 1, 0, 0); gs.clearRect(0, 0, sobre.width, sobre.height);
  const k = sobre.width / W; gs.setTransform(k, 0, 0, k, 0, 0);
}
const pegar = (c, a = 1) => { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.globalAlpha = a; g.drawImage(c, 0, 0, capa.width, capa.height); g.restore(); };
const copia = (c) => { const k = document.createElement('canvas'); k.width = c.width; k.height = c.height; k.getContext('2d').drawImage(c, 0, 0); return k; };

// ---------------------------------------------------------------- Atom (presentador: pequeño, abajo a la izquierda)
const A_Z = 1.0, ATOMO = [230, 780];
const A_ESC = 180 / (2 * (1.68 + 0.16) * pxU(en(...ATOMO, A_Z)));
// en la esquina la cámara lo ve de lado: se gira hacia ella lo que cambia la dirección de la cámara respecto a la de
// su sitio en cosmos (850, 330), donde el giro de siempre se ve bien (como en ep3-lote0-demo)
const CAM = [0, 3.8, 15.5];
const gy = (p) => Math.atan2(CAM[0] - p[0], CAM[2] - p[2]), gp = (p) => Math.atan2(p[1] - CAM[1], Math.hypot(CAM[0] - p[0], CAM[2] - p[2]));
const A_W = en(...ATOMO, A_Z), A_REF = en(850, 330, A_Z);
const A_YAW = gy(A_W) - gy(A_REF), A_PITCH = gp(A_W) - gp(A_REF);
const DT = 1 / 240, TA = [0];
const velA = (t) => (1 + 1.1 * Math.exp(-Math.pow((t - m.tierra) / 0.4, 2)) + 0.9 * Math.exp(-Math.pow((t - m.sol) / 0.4, 2))) * (1 - eio(prog(t, QUIETO - 0.9, QUIETO)));
for (let i = 1; i * DT <= D + 0.2; i++) TA.push(TA[i - 1] + velA((i - 0.5) * DT) * DT);
const tAtomo = (t) => { const x = t / DT, i = Math.min(TA.length - 2, Math.floor(x)); return mix(TA[i], TA[i + 1], x - i); };
// sobre el suelo claro (casas, ciudad, campos) menos resplandor y un velo algo más oscuro detrás
const sueloClaro = (ts, zr) => (ts < T.plato ? 0 : ss(0.3, 0.9, zr) * (1 - ss(5.6, 6.6, zr)));
function estadoAtom(ts) {
  const tz = calma(ts);
  const sx = ATOMO[0], sy = ATOMO[1] + 3 * Math.sin(tz * 1.3) + 2 * Math.sin(tz * 0.7 + 1.0);
  // al empezar cada frase, un brillo (en vez de saltos de alegría)
  const brillo = Math.max(...[m.tierra, m.hueco, m.sol].map((t0) => Math.sin(Math.PI * prog(ts, t0 - 0.15, t0 + 0.6))));
  return { sx, sy, tz, brillo };
}
function atomo(ts, zr) {
  const S = estadoAtom(ts), ta = tAtomo(ts);
  const en0 = ts < QUIETO ? E.energia(ts) : 0;
  const kS = sueloClaro(ts, zr);
  P.atomo({
    pos: en(S.sx, S.sy, A_Z), escala: A_ESC, yaw: -0.15 + A_YAW + 0.08 * Math.sin(S.tz * 0.5), pitch: 0.06 - A_PITCH,
    energia: Math.min(1, en0 + 0.45 * S.brillo), ts: ta, halo: 1 - 0.55 * kS, velo: 0.1 + 0.3 * kS,
  });
  return S;
}

// ---------------------------------------------------------------- la regla
// al llegar a 10⁴, su marca brilla un instante: la madera de esa fila se enciende, el rótulo da un respingo y encima
// (lienzo «sobre») un resplandor ámbar y un brillo de latón en el canto; en la parada de 10⁴, a tope
function destello4(ts) { const u = prog(ts, T.b4a, T.b4b); return u <= 0 || u >= 1 ? 0 : Math.pow(Math.sin(Math.PI * u), 0.8); }
function regla(ts, zr) {
  // la flecha baja de la fila de arriba (el fotograma 0 de cosmos) a la del centro mientras sale la cartela
  const ya = mix(1.5, 0.0, eio(prog(ts, 0.8, 1.45)));
  const fl = destello4(ts);
  const rango = fl > 0.01 ? { de: 4, a: 4, marcas: 1, madera: 1.1 * fl } : null;
  return P.regla({ pieza: I.REG, flecha: I.FLE, pos: REG, escala: E_REG, rot: [0, -0.12, 0], e: zr, ya, actual: zr, lupa: 0.5 + 0.22 * fl, rango, toque: enSalto(ts) });
}
// el resplandor del destello, encima de todo (sin grano: es luz)
function brilloMarca(ts, R) {
  const fl = destello4(ts);
  if (fl < 0.01) return;
  const pL = pant(R.punto(4, 0.12)), pT = pant(R.punto(4, -0.47)), pE = pant(R.punto(4, -0.66, 0.08));
  const fila = Math.hypot(...[0, 1].map((i) => pant(R.punto(5, 0.12))[i] - pL[i]));   // px entre dos filas
  gs.save();
  gs.globalCompositeOperation = 'screen';
  // la fila entera (marcas y rótulo), una banda de luz cálida
  const cx = (pL[0] + pT[0]) / 2, cy = (pL[1] + pT[1]) / 2, rx = Math.abs(pL[0] - pT[0]) * 0.5 + fila * 0.55, ry = fila * 0.36;
  gs.translate(cx, cy); gs.scale(1, ry / rx);
  let h = gs.createRadialGradient(0, 0, 0, 0, 0, rx);
  h.addColorStop(0, `rgba(255,196,120,${0.5 * fl})`); h.addColorStop(0.45, `rgba(240,160,80,${0.3 * fl})`); h.addColorStop(1, 'rgba(220,130,60,0)');
  gs.fillStyle = h; gs.beginPath(); gs.arc(0, 0, rx, 0, 2 * Math.PI); gs.fill();
  gs.setTransform(sobre.width / W, 0, 0, sobre.width / W, 0, 0);
  // el rótulo, más encendido
  h = gs.createRadialGradient(pL[0], pL[1], 0, pL[0], pL[1], fila * 0.42);
  h.addColorStop(0, `rgba(255,226,170,${0.3 * fl})`); h.addColorStop(1, 'rgba(255,200,130,0)');
  gs.fillStyle = h; gs.beginPath(); gs.arc(pL[0], pL[1], fila * 0.42, 0, 2 * Math.PI); gs.fill();
  // un brillo de latón en el canto, a la altura de la marca: una estrella de cuatro puntas que se abre y se cierra
  const L = fila * 0.36 * fl, Lv = L * 0.7;
  const rayo = (dx, dy, l, w) => {
    const r = gs.createLinearGradient(pE[0] - dx * l, pE[1] - dy * l, pE[0] + dx * l, pE[1] + dy * l);
    r.addColorStop(0, 'rgba(255,230,170,0)'); r.addColorStop(0.5, `rgba(255,244,214,${0.95 * fl})`); r.addColorStop(1, 'rgba(255,230,170,0)');
    gs.fillStyle = r; gs.beginPath();
    gs.moveTo(pE[0] - dx * l, pE[1] - dy * l); gs.lineTo(pE[0] - dy * w, pE[1] + dx * w); gs.lineTo(pE[0] + dx * l, pE[1] + dy * l); gs.lineTo(pE[0] + dy * w, pE[1] - dx * w);
    gs.closePath(); gs.fill();
  };
  rayo(1, 0, L, 3.2); rayo(0, 1, Lv, 3.2);
  h = gs.createRadialGradient(pE[0], pE[1], 0, pE[0], pE[1], 16);
  h.addColorStop(0, `rgba(255,248,225,${0.9 * fl})`); h.addColorStop(1, 'rgba(255,220,150,0)');
  gs.fillStyle = h; gs.beginPath(); gs.arc(pE[0], pE[1], 16, 0, 2 * Math.PI); gs.fill();
  gs.restore();
}

// ?guias: sin cartela, y en window.__guias el centro, la coronilla y la suela de la persona en píxeles (guias-humano.py)
const GUIAS = new URLSearchParams(location.search).has('guias');
// ---------------------------------------------------------------- la persona (plató)
function persona(ts) {
  const tz = calma(ts);
  const resp = 0.008 * Math.sin(tz * 2.4);
  P.pieza(I.PER, { pos: PER, escala: E_PER, sq: [1, 1 + resp, 1], rot: [0.02, 0.18, 0], postura: 'de pie', huellaFija: [0.37, 0.21, 0.0] });
}
// la foto del plató para la mirilla del primer salto (solo la persona, sin viñeta ni grano). Es la primera tarea: se hace
// al principio del primer fotograma del plató, que de todos modos estrena los programas de la persona
const fotoPlato = tarea('foto del plató', () => {
  P.fotograma(T.plato); P.limpiar();
  persona(T.plato);
  P.U.uPost.value = 0;
  P.render(Math.floor(T.plato * 12 + 1e-6));
  P.U.uPost.value = 1;
  mundo.inserto(copia(lienzoGL));
}, 0);

// ---------------------------------------------------------------- los planetas: fotos (sprites) al cargar
// Cada uno de cara a la cámara en el centro del plató, al tamaño más grande que se va a ver (el plano medio, z = 8), salvo
// Saturno, cuyos anillos no caben enteros a ese tamaño (se amplía un 26 % en el plano medio, donde se ve a medias).
const C_HUECO = camara(8, { hueco: true });
const Z_MEDIO = 7.65;
// plano medio (detalle): Neptuno grande, el pelo (entre Neptuno y la Luna, ~210 px) en x = 975 y la Luna; Urano se ve a
// medias en el borde y Saturno, anillos incluidos, queda fuera del cuadro
const C_MEDIO = (() => {
  const C0 = camaraPorTierra(Z_MEDIO, [0, HUECO.tierra[1]]);
  const f = filaPlanetas(C0);
  const x = (f.sobra[0] + f.sobra[1]) / 2;
  return camaraPorTierra(Z_MEDIO, [975 - x, HUECO.tierra[1]]);
})();
// los anillos, muy inclinados pero en «/» y a 57° (no 70°): no pasan de y 80–780 en el hueco (dentro de 60–880) y, al
// acercarse la cámara, su mitad de abajo queda a la izquierda de Saturno, que sale del cuadro antes de la esquina de Atom
// (rotAnillos del kit, con el ángulo en «/», enseñaría la cara de abajo, sin luz: aquí la misma cuenta con la otra cara)
function rotAnillosB(angulo, apertura) {
  const c = P.punto(960, 540, 0), d = P.punto(1060, 540, 0), e = P.punto(960, 440, 0);
  const der = new THREE.Vector3(d[0] - c[0], d[1] - c[1], d[2] - c[2]).normalize();
  const arr = new THREE.Vector3(e[0] - c[0], e[1] - c[1], e[2] - c[2]).normalize();
  const hacia = new THREE.Vector3().crossVectors(der, arr).normalize();
  const mayor = der.clone().multiplyScalar(Math.cos(angulo)).addScaledVector(arr, -Math.sin(angulo)).normalize();
  const perp = new THREE.Vector3().crossVectors(hacia, mayor).normalize();
  const ab = Math.asin(cl(apertura, 0, 1));
  const normal = perp.clone().multiplyScalar(Math.cos(ab)).addScaledVector(hacia, Math.sin(ab)).normalize();
  const z = new THREE.Vector3().crossVectors(mayor, normal).normalize();
  const eu = new THREE.Euler().setFromRotationMatrix(new THREE.Matrix4().makeBasis(mayor, normal, z), 'YXZ');
  return [eu.x, eu.y, eu.z];
}
const ROT_SAT = rotAnillosB(-57 * Math.PI / 180, 0.2);
// Las fotos de los planetas no hacen falta hasta la frase 56: se hacen después de cargar (ver «lo que se prepara después
// de cargar»). Júpiter no se ve nunca más grande que en el hueco (en el acercamiento sale del cuadro antes de crecer)
const SPR = PLANETAS.map((p) => {
  const rMax = p.d / 2 / C_MEDIO.mpp;

    h.addColorStop(0, `rgba(120,160,220,${0.42 * kL})`); h.addColorStop(0.4, `rgba(80,120,190,${0.16 * kL})`); h.addColorStop(1, 'rgba(60,90,160,0)');
    g.fillStyle = h; g.beginPath(); g.arc(tp[0], tp[1], R, 0, 2 * Math.PI); g.fill();
    g.restore();
  }
  planetas(ts, C);
  if (ts > GOTAS[0].t - 0.1) {
    tierrasQueCaen(g, spriteTierra(), { t: ts, gotas: GOTAS, sol: FINAL_TIERRA.sol, rTierra: Math.max(MUNDO.R_TIERRA / C.mpp, 4.5) });
  }
  // el plató encima: Atom, la regla y lo que se mueve
  P.limpiar();
  atomo(ts, zr);
  const R = regla(ts, zr);
  flechaAqui(ts, zr, C);
  laCinta(ts, C);
  laCota(ts, C);
  P.render(nf, { fondo: false });
  brilloMarca(ts, R);
}

  P.render(0, { fondo: false });
}
