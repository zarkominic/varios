<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cartago · ep5</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// RM-CARTAGO (frases 17–18). Cartela «218». El mapa: la mancha roja de Roma llena Italia y la amarilla de Cartago se
// extiende por África e Hispania; al tocarse, espadas en la caja. Luego los Alpes nevados: una fila de elefantes con
// soldados sube la ladera mientras nieva.
import { preparar, rodar } from '/atomo/plato/escenas/rm-comun.js';
const { E, R, M } = await preparar('rm-cartago');
const { PALA, PR, ELENCO, tramo, lerp } = R;
const m = { car: M('cartago', 1.5), alp: M('alpes', 7) };
const mapa = (t) => {
  R.mapa(t, { italia: tramo(t, m.car, m.car + 2), cartago: tramo(t, m.car + 1.5, m.car + 3.5), colorImperio: PALA.ROJO });
  R.punto(...R.lugar('roma'), t, PALA.ROJO); R.punto(...R.lugar('cartago'), t, PALA.AMARILLO);
  if (t > m.alp + 0.8) R.ruta([R.lugar('cartago'), R.lugar('cartagena'), R.lugar([2, 41.5]), R.lugar('alpes')], tramo(t, m.alp + 0.8, m.alp + 3.4), PALA.AMARILLO[3]);
};
const alpes = (t) => {
  R.cieloR(t, 'dia', { hor: 140, nubes: { n: 3 } });
  const monte = (cx, h, w, l) => R.poligono([[cx - w, 150], [cx, 150 - h], [cx + w, 150]], (x, y) => { const nieve = y < 150 - h * 0.55 + 4 * Math.sin(x * 0.4); return R.tone(nieve ? PR.NIEVE : PR.ROCA, l + (x < cx ? 0.8 : -0.4), x, y); });
  monte(60, 110, 90, 1.6); monte(220, 130, 110, 1.8); monte(320, 90, 80, 1.4);
  R.poligono([[0, 180], [0, 150], [320, 96], [320, 180]], (x, y) => R.tone(PR.NIEVE, 2.4 - (y - 96) * 0.008, x, y));
  const u = t - m.alp;
  for (let k = 0; k < 5; k++) {
    const p = ((u * 0.06 + k * 0.2) % 1.2) - 0.1, x = lerp(-30, 350, p), y = 150 - (x / 320) * 54 + 20;
    if (k % 2 === 0) { R.elefante(x, y, t + k, { esc: 0.75, anda: true, manta: PALA.AMARILLO }); R.personaje(x - 1, y - 21, 22, { ...ELENCO.legionario, chaqueta: PALA.AMARILLO, camisa: PALA.AMARILLO, falda: PALA.AMARILLO, capa: null, sombrero: 'no', pelo: PALA.PELO_NEGRO, piel: PALA.PIEL_OSCURA, t, pose: 'sentado' }); }
    else R.personaje(x, y, 30, { ...ELENCO.legionario, chaqueta: PALA.AMARILLO, camisa: PALA.AMARILLO, falda: PALA.AMARILLO, capa: PALA.ROJO, piel: PALA.PIEL_OSCURA, t, anda: t * 6, objeto: 'gladio' });
  }
  for (let k = 0; k < 90; k++) { const x = (k * 37 + t * 8 + Math.sin(t + k) * 4) % R.W, y = (k * 53 + t * 22) % R.H; R.pset(Math.round(x), Math.round(y), PR.NIEVE[3]); }
};
rodar(E, R, [[0, mapa], [m.alp + 3.8, alpes]], { cartela: '218', caja: (t, e) => R.caja(t, t > m.car + 3.6 && t < m.alp ? tramo(t, m.car + 3.6, m.car + 4) : 0, (x, y) => R.icono('espadas', x + 8, y, undefined, undefined, 2), { energia: e }) });
</script>
</body>
</html>
