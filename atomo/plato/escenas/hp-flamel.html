<script type="module">
// HP-FLAMEL (frase 31), París hacia 1400, y hoy. Cuatro planos:
// 1. (0 → «who died», 5,7 s) París hacia 1400: el escribano Flamel copia en su puesto, con la pluma en el libro abierto
//    sobre el atril; un cliente entra por la calle (las palomas se le espantan), Flamel moja la pluma en «stone», levanta
//    el libro acabado en «existed» y se lo da al cliente en «scribe».
// 2. (→ «The legend», 5,4 s) la fachada de piedra de su casa, subida 14 px y corrida 24 a la izquierda: a la derecha, la
//    esquina en fuga (cielo tramado con nubes y pájaros, Notre-Dame en la bruma, casas de entramado con ventanas que
//    titilan, ropa tendida y paseantes diminutos que van y vienen); abajo, una calle honda de adoquines con el arroyo,
//    un charco que refleja el cielo, paja, una carretilla con tonel, sacos y una paloma, y un paseante con cesto por
//    detrás. Flamel llega con su libro (salpica al pisar el charco), abre la puerta en «house»; en «1407» el año grabado
//    brilla y él entra; en «still standing» un fogonazo salta a hoy: la casa es un restaurante con toldos y escaparates
//    encendidos, acera de losas, farola moderna en la esquina, bici y bolardos; dos turistas, uno señala el año y el otro
//    hace la foto (flash en «standing»).
// 3. (→ «took hold», 6,6 s) la leyenda, en la mesa de las botellas: el alquimista, con cabeza y hombros sobre el
//    tablero, sostiene la piedra roja a su lado (nunca delante de la cara); la sube por encima del hombro, brilla en
//    «philosopher's stone» y hace latir las botellas; se vuelve y la baja por su izquierda hacia el lingote de plomo en
//    «metal», que se vuelve oro en «gold» y suelta tres monedas; en «eternal life» la flor mustia de la maceta florece.
// 4. (→ fin, 6,1 s) la lápida en el museo, hoy: zócalo de madera con moldura y cuarterones, focos de techo con sus conos
//    sobre los cuadros, la vitrina del manuscrito con su brillo, la puerta a la sala de al lado con visitantes pequeños
//    que cruzan y el parqué encerado con reflejos y manchas de luz. Una guía espera junto al cordón; entran dos
//    visitantes; en «tombstone» la guía señala y se enciende la placa con «1418»; en «museum» el niño salta («!»).
import * as T from '/atomo/plato/escenas/hp-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hp-flamel');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const P = T.PIEZAS_HP, C = T.C, K = hex('#141018');
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255, r2 = c2 & 255, g2 = (c2 >>> 8) & 255, b2 = (c2 >>> 16) & 255; return (0xff000000 | (Math.round(b1 + (b2 - b1) * a) << 16) | (Math.round(g1 + (g2 - g1) * a) << 8) | Math.round(r1 + (r2 - r1) * a)) >>> 0; };
// un halo tramado (no tapa: puntea) alrededor de (cx, cy)
const hsh = (x, y, k) => { const v = Math.sin(x * 12.9898 + y * 78.233 + k * 37.719) * 43758.5453; return v - Math.floor(v); };
const halo = (cx, cy, r, c, k = 0) => { for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++) { const d = Math.hypot(x - cx, y - cy) / r; if (d < 1 && ((x + y) & 1) && hsh(x, y, k % 3) < (1 - d) * (1 - d) * 1.4 + 0.08) R.pset(x, y, c); } };
// destellos en cruz que giran alrededor de (cx, cy)
const chispas = (cx, cy, r, t, c = hex('#fff4c0'), n = 5) => { for (let k = 0; k < n; k++) { const a = k * 6.283 / n + t * 3, x = Math.round(cx + Math.cos(a) * r), y = Math.round(cy + Math.sin(a) * r * 0.8); if (Math.sin(t * 11 + k * 2) > -0.2) { R.pset(x, y, c); R.pset(x - 1, y, c); R.pset(x + 1, y, c); R.pset(x, y - 1, c); R.pset(x, y + 1, c); } } };
// un sprite de letras con su paleta (s: escala)
const pinta = (g, x0, y0, pal, s = 1) => { for (let j = 0; j < g.length; j++) for (let i = 0; i < g[j].length; i++) { const c = pal[g[j][i]]; if (c != null) R.rect(x0 + i * s, y0 + j * s, x0 + i * s + s - 1, y0 + j * s + s - 1, c); } };

// la lupa grande: aumenta k veces lo que hay debajo (copia antes los píxeles), aro de latón con su luz, el reflejo del
// cristal y el mango de madera hacia la mano (mano = [x, y]) o hacia donde se diga
const lente = (cx, cy, r, k = 2.5, mano = null) => {
  cx = Math.round(cx); cy = Math.round(cy);
  const n = 2 * r + 1, S = new Array(n * n);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) S[j * n + i] = R.pget(cx - r + i, cy - r + j);
  if (mano) {
    const [hx, hy] = mano, a = Math.atan2(hy - cy, hx - cx), L = Math.hypot(hx - cx, hy - cy);
    for (let d = r + 1; d <= L + 1; d += 0.5) R.disco(Math.round(cx + Math.cos(a) * d), Math.round(cy + Math.sin(a) * d), 2, K);
    for (let d = r + 1; d <= L; d += 0.5) { const x = Math.round(cx + Math.cos(a) * d), y = Math.round(cy + Math.sin(a) * d); R.disco(x, y, 1, d < r + 5 ? hex('#c8902a') : hex('#7a4422')); if (d > r + 5) R.pset(x, y - 1, hex('#a86a3a')); }
  }
  for (let j = -r - 2; j <= r + 2; j++) for (let i = -r - 2; i <= r + 2; i++) {
    const d = Math.hypot(i, j);
    if (d <= r - 2.5) {
      let c = S[Math.round(r + j / k) * n + Math.round(r + i / k)] || K;
      c = mez(c, hex('#e4f2ff'), 0.1);
      const diag = i + j;
      if ((diag < -r * 0.85 && diag > -r * 1.05) || (diag < -r * 1.2 && diag > -r * 1.28)) c = mez(c, hex('#ffffff'), 0.55);
      R.pset(cx + i, cy + j, c);
    } else if (d <= r - 1.5) R.pset(cx + i, cy + j, hex('#6a4a18'));
    else if (d <= r + 0.9) { const luz = i + j; R.pset(cx + i, cy + j, luz < -r * 0.6 ? hex('#fff0b0') : luz < r * 0.3 ? hex('#e8b440') : hex('#a8701e')); }
    else if (d <= r + 1.9) R.pset(cx + i, cy + j, K);
  }
};
// la moto en miniatura (12 × 7), tan pequeña que solo se ve con la lupa
const MOTO_MINI = ['.....kk.....', '....kAAk.kk.', '..kkAAAAkOk.', '.kKkkkkkkKk.', 'kKlKk..kKlKk', 'kKKKk..kKKKk', '.kkk....kkk.'];
const motoMini = (x, y, faro = false) => pinta(MOTO_MINI, x, y, { k: K, A: hex('#d8283a'), K: hex('#4a4a56'), l: hex('#d8d8e8'), O: hex(faro ? '#fff8c0' : '#c8a040') });

const P2 = en('flamel', 0.232), P3 = en('flamel', 0.470), P4 = en('flamel', 0.761);
const piedraT = en('flamel', 0.080), existio = en('flamel', 0.130), escriba = en('flamel', 0.206), casaT = en('flamel', 0.318), anio = en('flamel', 0.352), sigue = en('flamel', 0.398), pie = en('flamel', 0.428);
const filo = en('flamel', 0.528), metal = en('flamel', 0.631), oro = en('flamel', 0.660), eterna = en('flamel', 0.707), tumba = en('flamel', 0.874), museo = en('flamel', 0.956);
const ESC = EL.escribano, CLIENTE = { C: hex('#7a4a2a'), c: hex('#5a3418') }, ALQ = { C: hex('#5a2a6a'), c: hex('#3a1a4a') };
// el atril de copista sobre el mostrador con el libro abierto: renglones hechos en la página derecha y n en la izquierda
const atrilLibro = (n) => {
  R.poligono([[160, 145], [196, 145], [192, 137], [164, 137]], hex('#5a3418')); R.linea(160, 145, 196, 145, K); R.linea(164, 137, 192, 137, hex('#8a5a30'));
  R.poligono([[163, 138], [193, 138], [190, 126], [166, 126]], K);
  R.poligono([[165, 137], [177, 137], [177, 127], [167, 127]], hex('#f4ead0')); R.poligono([[179, 137], [191, 137], [189, 127], [179, 127]], hex('#f4ead0'));
  R.linea(178, 127, 178, 137, hex('#a89070')); R.linea(165, 137, 191, 137, hex('#c8b890'));
  R.rect(180, 128, 182, 130, hex('#c8283a')); R.pset(181, 129, hex('#f0c040'));
  for (let i = 0; i < 4; i++) R.linea(184 - (i < 1 ? 0 : 4), 129 + i * 2, 188 - (i & 1), 129 + i * 2, hex('#3a3040'));
  for (let i = 0; i < Math.min(5, n); i++) R.linea(168, 129 + i * 2, 168 + (i === Math.floor(n) ? Math.round((n % 1) * 7) : 7), 129 + i * 2, hex('#3a3040'));
};
// la pluma de ganso en la mano (la punta en la mano)
const pluma = (mx, my) => { R.linea(mx, my, mx + 4, my - 8, K); R.linea(mx + 1, my - 1, mx + 5, my - 9, hex('#f4f0e8')); R.linea(mx + 2, my - 3, mx + 5, my - 7, hex('#d8d0c0')); R.pset(mx, my + 1, hex('#1a1a2a')); };
// una paloma que picotea y, al pasar alguien, echa a volar
const paloma = (x, y, t, vuela) => {
  if (vuela > 0) { const xx = Math.round(x - vuela * 60), yy = Math.round(y - vuela * 70 + Math.sin(vuela * 9) * 3), a = Math.sin(t * 30 + x) > 0; R.rect(xx - 2, yy, xx + 2, yy + 1, hex('#8a8a96')); R.pset(xx - 3, yy, hex('#4a4a56')); R.linea(xx - 1, yy, xx + 2, yy + (a ? -3 : 3), hex('#b8b8c4')); return; }
  const pica = Math.sin(t * 5 + x) > 0.6 ? 1 : 0;
  R.rect(x - 2, y - 3, x + 2, y - 1, hex('#8a8a96')); R.rect(x + 1, y - 3, x + 2, y - 2, hex('#b8b8c4')); R.pset(x - 3, y - 3 + pica, hex('#4a4a56')); R.pset(x - 3, y - 4 + pica, hex('#4a4a56')); R.pset(x - 4, y - 3 + pica, hex('#e8a040')); R.pset(x - 1, y, hex('#e86a4a')); R.pset(x + 1, y, hex('#e86a4a'));
};
const p1 = (t) => {
  T.real(R, t, { encuadre: 'paris' });
  // el cliente entra por la calle desde la izquierda y espera delante del puesto; con el libro, se vuelve y se va
  const u = tramo(t, 0.3, 2.8), va = tramo(t, escriba + 0.35, P2 + 0.6), cx = Math.round(lerp(-16, 104, u) - va * 70);
  const tiene = t > escriba + 0.05;
  const rc = R.actor(ESC, cx, 168, t, { pal: CLIENTE, dir: va > 0 ? -1 : 1, anda: (u > 0 && u < 1) || va > 0, habla: u >= 1 && t < existio && Math.sin(t * 8) > 0, sonrisa: tiene, sostiene: tiene ? true : false });
  if (tiene) P.libro(R, rc.mano[0], rc.mano[1] + 5, {});
  // las palomas de la calle se espantan cuando pasa el cliente
  for (const [px, py, k] of [[38, 170, 0], [54, 172, 1], [74, 169, 2]]) paloma(px, py, t, tramo(t, 0.9 + k * 0.25 + px / 120, 2.6 + k * 0.25 + px / 120));
  // Flamel copia: la pluma corre por el renglón; en «stone» la moja en el tintero; en «existed» levanta el libro acabado
  const fx = 146, escribe = t < existio - 0.2 && !(t > piedraT - 0.25 && t < piedraT + 0.35);
  const ens = t > existio - 0.2 && t < escriba + 0.05, da = t > escriba - 0.5 && t < escriba + 0.05;
  const mojar = t > piedraT - 0.25 && t < piedraT + 0.35;
  const obj = escribe ? [168 + ((t * 1.6) % 1) * 7, 132 + Math.floor((t * 1.6) % 5) * 2] : mojar ? [199, 138] : da ? [fx - 4, 134] : ens ? [fx + 17, 124] : [fx + 15, 138];
  const rf = R.actor(ESC, fx, 158, t, { dir: da ? -1 : 1, sostiene: obj, sonrisa: ens, habla: da && Math.sin(t * 9) > 0 });
  T.realDelante(R, t, { encuadre: 'paris' });
  atrilLibro(ens || t > escriba ? 5 : Math.min(5, t * 1.6));
  // el tintero y, en la mano, la pluma o el libro
  R.rect(196, 139, 202, 145, K); R.rect(197, 140, 201, 144, hex('#2a3a6a')); R.rect(197, 140, 201, 140, hex('#5a6aa8'));
  if (ens || da) { if (ens) halo(rf.mano[0], rf.mano[1] - 4, 11, hex('#ffe890'), Math.floor(t * 6)); P.libro(R, rf.mano[0], rf.mano[1] + 5, {}); }
  else if (t < escriba) pluma(rf.mano[0], rf.mano[1]);
};
// sube dy filas y corre dx px a la izquierda lo ya pintado en el búfer en uso (la fachada), para ganar calle por abajo y
// sitio para la esquina a la derecha (lo que queda sin pintar se vuelve a pintar después)
const subir = (dy, dx) => { const B = R.buf; for (let y = 0; y < 180 - dy; y++) B.copyWithin(y * 320, (y + dy) * 320 + dx, (y + dy) * 320 + 320); };
const AD = [hex('#7a7064'), hex('#5a524a'), hex('#9a9084'), hex('#3a342e')];
// el empedrado de la calle (de y0 a y1): filas que crecen hacia delante, luz arriba e izquierda y junta oscura
const empedrado = (y0, y1, hoy) => {
  for (let y = y0, fila = 0; y <= y1; fila++) {
    const alto = 3 + Math.floor((y - y0) / 8), w = Math.round(alto * 2.6) + 2, off = (fila & 1) ? (w >> 1) : 0;
    for (let yy = y; yy < y + alto && yy <= y1; yy++) { const ly = yy - y; for (let x = 0; x < 320; x++) {
      const xx = x + off, i = Math.floor(xx / w), lx = xx - i * w, v = hsh(i, fila, 3);
      let c = v < 0.3 ? AD[1] : v > 0.78 ? AD[2] : AD[0];
      if (hoy) c = mez(c, hex('#6a6a72'), 0.3);
      if (lx === 0 || ly === alto - 1) c = AD[3]; else if (ly === 0 || lx === 1) c = mez(c, hex('#e8e0d0'), 0.22); else if (lx === w - 1 || ly === alto - 2) c = mez(c, K, 0.18);
      R.pset(x, yy, c); } }
    y += alto;
  }
};
// un paseante pequeño (de fondo): hgt de alto, con la ropa y el pelo; anda si anda
const mini = (x, y, hgt, t, ropa, pelo, anda = true, fase = 0) => {
  x = Math.round(x); y = Math.round(y);
  const r = Math.max(1, Math.round(hgt * 0.14)), paso = anda && Math.sin(t * 8 + fase) > 0 ? 1 : 0, hy = y - hgt + r, c0 = hy + r + 1, c1 = y - Math.max(2, Math.round(hgt * 0.3)), w = Math.max(1, Math.round(hgt * 0.17));
  R.linea(x - 1, c1, x - 1 - paso, y, K); R.linea(x + 1, c1, x + 1 + (anda ? 1 - paso : 0), y, K);
  R.poligono([[x - w, c0], [x + w, c0], [x + w + 1, c1], [x - w - 1, c1]], ropa); R.linea(x - w, c0, x - w - 1, c1, mez(ropa, hex('#ffffff'), 0.25));
  R.disco(x, hy, r, hex('#e8b890')); R.linea(x - r, hy - r, x + r, hy - r, pelo); R.pset(x - r, hy - r + 1, pelo);
};
// la esquina de la calle a la derecha (x 267–319): cielo tramado con nubes de tres tonos y pájaros, Notre-Dame en la
// bruma, la casa del fondo, la fila de casas de la calle de al lado en fuga hacia (290, 122) con su entramado y sus
// ventanas, el empedrado que se estrecha y dos paseantes que van y vienen, más pequeños cuanto más lejos
const esquina = (t, hoy) => {
  R.recorte([267, 0, 319, 151]);
  const CI = [hex('#6a9ad0'), hex('#86b0de'), hex('#a8c8e6'), hex('#d0e0ec')];
  for (let y = 0; y <= 124; y++) for (let x = 267; x < 320; x++) { const u = y / 105 * 3 + (((x + y) & 1) ? 0.3 : -0.3); R.pset(x, y, CI[Math.max(0, Math.min(3, Math.floor(u)))]); }
  for (const [k, cy, w, v] of [[0, 16, 18, 1.2], [1, 50, 12, 2.4], [2, 72, 14, 3.6]]) { const cx = 256 + ((t * v + k * 29) % 80);
    R.disco(cx, cy + 2, w * 0.45, hex('#b0bccc')); R.disco(cx - w * 0.45, cy + 3, w * 0.3, hex('#b0bccc')); R.disco(cx + w * 0.5, cy + 3, w * 0.28, hex('#b0bccc'));
    R.disco(cx, cy, w * 0.4, hex('#e2e8f0')); R.disco(cx + w * 0.4, cy + 1, w * 0.3, hex('#e2e8f0')); R.disco(cx - 2, cy - 2, w * 0.24, hex('#ffffff')); }
  for (let k = 0; k < 3; k++) { const bx = Math.round(330 - ((t * 9 + k * 23) % 70)), by = 56 + k * 5 + Math.round(Math.sin(t * 2 + k) * 2), a = Math.sin(t * 14 + k * 2) > 0 ? -1 : 1; R.pset(bx, by, K); R.pset(bx - 1, by + a, K); R.pset(bx + 1, by + a, K); }
  // Notre-Dame a lo lejos, en la bruma: las dos torres, el rosetón y la aguja
  const L = hex('#9aa6b8'), LS = hex('#8a96aa');
  R.poligono([[268, 104], [278, 104], [278, 82], [268, 82]], L); R.poligono([[281, 104], [291, 104], [291, 82], [281, 82]], L); R.poligono([[276, 104], [283, 104], [283, 92], [276, 92]], LS);
  R.disco(279.5, 97, 2, LS); R.linea(286, 70, 286, 82, LS); for (const tx of [268, 281]) { for (let x = tx; x <= tx + 10; x += 2) R.pset(x, 81, L); R.linea(tx + 3, 85, tx + 3, 92, LS); R.linea(tx + 7, 85, tx + 7, 92, LS); }
  for (let x = 267; x < 292; x++) { const y = 100 + Math.round(Math.sin(x * 0.7) * 1.5); R.linea(x, y, x, 106, (x & 1) ? LS : L); }
  // la casa del fondo de la calle, con su ventana encendida
  R.poligono([[267, 106], [290, 99], [290, 124], [267, 124]], hex('#c8b490')); R.linea(267, 106, 290, 99, hex('#5a3a30')); R.linea(267, 115, 290, 112, hex('#6a4a30')); R.linea(278, 103, 278, 124, hex('#6a4a30'));
  for (const [x, k] of [[271, 0], [283, 1]]) R.poligono([[x, 117], [x + 4, 116], [x + 4, 121], [x, 121]], Math.sin(t * 3 + k * 2) > -0.6 ? hex('#ffd890') : hex('#e8b060'));
  // la fila de casas de la derecha, en fuga: tejado de tejas, entramado de madera y ventanas
  const top = (x) => lerp(54, 100, (319 - x) / 29), bot = (x) => lerp(151, 124, (319 - x) / 29);
  R.poligono([[319, 46], [319, 54], [290, 100], [290, 96]], hex('#6a3a30')); for (let k = 0; k < 6; k++) { const x = 319 - k * 5; R.linea(x, top(x) - 7 + k, x - 2, top(x - 2), hex('#4a2620')); } R.linea(319, 54, 290, 100, hex('#2a1a18'));
  R.poligono([[319, 54], [290, 100], [290, 124], [319, 151]], hex('#dccba8'));
  for (let y = 54; y < 151; y++) for (let x = 290; x < 320; x++) if (y > top(x) && y < bot(x) && hsh(x, y, 6) > 0.9) R.pset(x, y, hex('#c8b490'));
  for (const v of [0.32, 0.6, 0.86]) R.linea(319, lerp(54, 151, v), 290, lerp(100, 124, v), hex('#5a3a24'));
  for (const u of [0.06, 0.3, 0.52, 0.72, 0.88]) { const x = Math.round(lerp(319, 290, u)); R.linea(x, top(x), x, bot(x), hex('#5a3a24')); }
  for (const [u, v, k] of [[0.18, 0.4, 0], [0.42, 0.42, 1], [0.62, 0.43, 2], [0.18, 0.7, 3], [0.62, 0.7, 4]]) { const x = Math.round(lerp(319, 290, u)), y = Math.round(lerp(top(x), bot(x), v)), w = Math.max(1, Math.round(4 * (1 - u))), hh = Math.max(3, Math.round(9 * (1 - u * 0.6)));
    const luz = Math.sin(t * 2 + k * 1.7) > -0.3 ? hex('#ffd890') : hex('#e8a860'); R.poligono([[x - w, y], [x + w, y], [x + w, y + hh], [x - w, y + hh]], hoy ? hex('#f0e0b0') : luz); R.linea(x - w, y + Math.round(hh / 2), x + w, y + Math.round(hh / 2), hex('#5a3a24')); R.linea(x - w - 1, y + hh + 1, x + w + 1, y + hh + 1, hex('#5a3a24')); }
  // el empedrado de la calle de al lado, que se estrecha hacia el fondo
  R.poligono([[267, 151], [319, 151], [290, 124], [267, 124]], AD[0]);
  for (let k = 0; k < 8; k++) { const y = Math.round(124 + (151 - 124) * (k / 8) ** 1.4); R.linea(267, y, 319, y, AD[3]); }
