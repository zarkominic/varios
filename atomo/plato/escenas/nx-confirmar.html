import * as T from '/atomo/plato/escenas/nx-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';

const K = T.C.k ?? hex('#1c1222'), BLANCO = hex('#f6f2e6'), ROJO = hex('#d8343a'), ROJOS = hex('#8a1c24'), AMBAR = hex('#ffc84a'), CARBON = hex('#17131a'), CARBONL = hex('#4a4250');

// 1 · la nota de prensa y el sello de «?»

    R.disco(cx, cy, 12, K); R.disco(cx, cy, 11, hex('#2a5a44')); aro(cx, cy, 11, BLANCO, t + k); aro(cx, cy, 10, BLANCO, t + k); R.icono('lupa', cx - 3, cy - 4, hex('#9cc8ac'), hex('#1e4434')); }
  // …y aún llega otra nota de prensa: el montón crece, la revista sigue cerrada

// 3 · nadie ha datado la madera: los sobres van de camino y los matraces siguen vacíos
const madero = (x, y) => { const P = [[-9, -1], [-4, -6], [6, -5], [10, 0], [5, 5], [-6, 4]]; for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1], [2, 0], [-2, 0], [0, 2], [0, -2]]) R.poligono(P.map(([a2, b2]) => [x + a2 + dx, y + b2 + dy]), AMBAR);
  R.poligono(P.map(([a2, b2]) => [x + a2, y + b2]), CARBON); R.linea(x - 6, y - 1, x + 5, y - 3, CARBONL); R.linea(x - 3, y + 2, x + 6, y + 1, CARBONL); R.pset(x - 1, y - 4, CARBONL); R.pset(x + 2, y + 3, hex('#7a3a2a')); };
// azar fijo, ruido suave, trama de Bayer y degradado tramado (para la goma de las cintas, la roca y el crepúsculo)
const az = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const vn = (x, y, k = 0) => { const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy); return lerp(lerp(az(xi, yi, k), az(xi + 1, yi, k), sx), lerp(az(xi, yi + 1, k), az(xi + 1, yi + 1, k), sx), sy); };
const B4M = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], b4 = (x, y) => (B4M[((y & 3) << 2) | (x & 3)] + 0.5) / 16;
const grad = (S, v, x, y) => { let i = 0; while (i < S.length - 2 && v >= S[i + 1][0]) i++; return (v - S[i][0]) / (S[i + 1][0] - S[i][0]) > b4(x, y) ? S[i + 1][1] : S[i][1]; };
const paradas = (L) => L.map(([p, c]) => [p, hex(c)]);
// LA GOMA DE LAS TRES CINTAS, repintada por la escena encima del decorado (allí las marcas corren siempre, y no se ve
// que la cinta arranque ni se pare). Todo lo de la goma —costillas cada 9 px con su luz y su sombra, flechas gastadas,

const GOMA = hex('#2a2c35'), GOMAD = hex('#17181e'), GOMAL = hex('#5e6274'), GOMAT = hex('#333640'), ACE = ['#5c6474', '#98a0b0', '#e4e9f2', '#98a0b0', '#5c6474'].map(hex);

      if (j === 0 || j >= alto - 1) c = GOMAD; else if (j === 1) c = GOMAL;

        if (q >= 29 && q <= 36 && (m === 36 - q || m === 35 - q) && m < 7 && r > 1) c = hex('#8c7c3e');   // la flecha de sentido, gastada

};
const p3 = (t) => {
