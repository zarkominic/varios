// Todo se compone en 2D (crearPost al final). Las composiciones quietas son fotos (el vaso, los glóbulos que pasan, el

// ---------------------------------------------------------------- piezas propias de la página
// el glóbulo rojo (lo que daría ep03-sangre.js): disco bicóncavo de radio 1 con la cara hacia +z, de arcilla roja
// translúcida, el borde grueso (0,6) y el centro hundido (~0,3)
const GLOBULO = { radio: 1.04, glifos: [], glsl: /* glsl */`
float pz_globulo(vec3 q, vec4 T, out float m) {
  m = 0.0;
  float r = length(q.xy);
  float toro = length(vec2(r - 0.68, q.z)) - 0.3;
  float disco = length(vec2(max(r - 0.66, 0.0), q.z)) - 0.12;
  return smin(toro, disco, 0.24) + 0.006 * sin(q.x * 11.0 + 1.0) * sin(q.y * 9.0);
}
float pzc_globulo(vec3 q, vec4 T) { float r = length(q.xy); return min(length(vec2(r - 0.68, q.z)) - 0.26, length(vec2(max(r - 0.66, 0.0), q.z)) - 0.09); }
vec3 pzcol_globulo(vec3 q, vec4 T, float m) {
  float r = length(q.xy);
  float hoyo = 1.0 - smoothstep(0.25, 0.62, r);
  gTr = 0.55;
  gG = vec3(sin(q.y * 31.0), sin(q.x * 27.0 + 1.3), 0.0) * 0.02;
  return mix(vec3(0.47, 0.075, 0.045), vec3(0.36, 0.05, 0.035), hoyo) * (0.92 + 0.14 * vnoise(q * 6.0));
}
` };
// el vaso sanguíneo abierto a lo largo: medio tubo (la mitad de atrás, z < 0) de radio 1 y pared de 0,18, eje en x,

const VASO = { radio: 3.4, glifos: [], glsl: /* glsl */`
float pz_vaso(vec3 q, vec4 T, out float m) {
  float rr = length(q.yz);
  float d = abs(rr - 1.0) - 0.09;
  d = smax(d, q.z + 0.02, 0.03);
  d = smax(d, abs(q.x) - 3.2, 0.05);
  m = q.z > -0.07 ? 1.0 : (rr < 1.0 ? 0.0 : 2.0);
  return d + 0.008 * sin(q.x * 7.0 + 2.0 * q.y) * sin(q.y * 5.0);
}
float pzc_vaso(vec3 q, vec4 T) { float rr = length(q.yz); return max(max(abs(rr - 1.0) - 0.06, q.z + 0.05), abs(q.x) - 3.1); }
vec3 pzcol_vaso(vec3 q, vec4 T, float m) {
  float v = 0.92 + 0.14 * vnoise(q * 5.0);
  gTr = 0.35;
  float rr = length(q.yz);
  if (m > 1.5) return vec3(0.30, 0.075, 0.05) * v;
  if (m > 0.5) {
    // el corte: íntima clara, media muscular roja, adventicia crema

}

float pz_aro(vec3 q, vec4 T, out float m) { m = 0.0; return length(vec2(length(q.xy) - 1.0, q.z)) - 0.075; }
float pzc_aro(vec3 q, vec4 T) { return length(vec2(length(q.xy) - 1.0, q.z)) - 0.06; }
vec3 pzcol_aro(vec3 q, vec4 T, float m) { gBri = 3.0; return C_BRASS * (0.93 + 0.12 * vnoise(q * 12.0)); }
` };

const PIEZAS = ['reglaA', 'flecha', 'vaso', 'globulo', 'virus', 'instrumento', 'aro', 'onda', 'moneda', 'guante', 'guante', 'glifo:?'];

  if (capa.width !== lienzoGL.width || capa.height !== lienzoGL.height) { capa.width = lienzoGL.width; capa.height = lienzoGL.height; }
  const k = capa.width / W; g.setTransform(k, 0, 0, k, 0, 0);
}
const lienzo = () => { const c = document.createElement('canvas'); c.width = lienzoGL.width; c.height = lienzoGL.height; return c; };
const KK = () => lienzoGL.width / W;
// un trozo de lo que hay en el lienzo de WebGL (en px de diseño)
function recorte(x, y, w, h, src = lienzoGL) {
  const k = KK(), c = document.createElement('canvas');
  c.width = Math.ceil(w * k); c.height = Math.ceil(h * k);
  c.getContext('2d').drawImage(src, x * k, y * k, w * k, h * k, 0, 0, c.width, c.height);
  return c;
}
// la misma foto con un círculo desenfocado
function desenfocar(f, cx, cy, r, b) {
  const c = lienzo(), gc = c.getContext('2d'), k = KK();
  gc.drawImage(f, 0, 0);
  gc.save(); gc.beginPath(); gc.arc(cx * k, cy * k, r * k, 0, Math.PI * 2); gc.clip();
  gc.filter = `blur(${b * k}px)`; gc.drawImage(f, 0, 0); gc.restore();
  return c;
}

// ---------------------------------------------------------------- Atom y la regla
function atomo(ts) {
  const z = tz(ts);
  P.atomo({
    pos: [SITIO[0], SITIO[1] + 0.006 * Math.sin(z * 1.1), SITIO[2]], escala: A_ESC,
    yaw: -0.15 + 0.08 * Math.sin(z * 0.5), pitch: 0.06,
    energia: ts < FIN ? E.energia(ts) : 0, ts: z,
    // sobre el rojo del glóbulo (detalle), el velo oscuro de su halo algo más fuerte
  });
}
const REGLA_QUIETA = T.regla[1] + 0.2;
function reglaEn(e, toque = false) {
  return P.regla({ pieza: I.REG, flecha: I.FLE, pos: REG, escala: E_REG, rot: [0, -0.12, 0], e, ya: YA, actual: Math.round(e), marca: e, lupa: 0.5, toque });
}

  const u = eio(prog(ts, T.regla[0], T.regla[1]));
  reglaEn(-5 - 2 * u, u > 0 && u < 1);
}

// ---------------------------------------------------------------- fotos
const FOTO = {};
// la regla quieta (en 10⁻⁵ y en 10⁻⁷), sobre transparente
function capaRegla(e) {
  const k = 'R' + e;
  if (FOTO[k]) return FOTO[k];
  P.fotograma(0); P.limpiar(); reglaEn(e); P.render(907 + e, { fondo: false });
  return (FOTO[k] = foto(P));
}
// A: el vaso con la mota (desenfocada) y los recortes de los glóbulos
{
  P.fotograma(0); P.limpiar();
  P.pieza(I.VASO, VASO_A);
  virus(P, I.VIR, MOTA);
  P.render(900);
  FOTO.A = desenfocar(foto(P), 960, 540, 40, 3.5);
}
window.__carga.push(['vaso', Math.round(performance.now())]);
FOTO.spr = GLO_SPR.rot.map((rot, j) => {
  P.fotograma(0); P.limpiar();
  P.pieza(I.GLO, { pos: GLO_SPR.pos, escala: GLO_SPR.escala, rot });
  P.render(910 + j, { fondo: false });
  return recorte(960 - SPR_R, 540 - SPR_R, 2 * SPR_R, 2 * SPR_R);
});
// los recortes desenfocados y oscurecidos (los de delante y los del fondo)
const SPR_VAR = new Map();
function sprite(k, blur, os) {
  const key = `${k}|${blur}|${os}`;

// ---------------------------------------------------------------- 2D: los glóbulos, la mirilla, el visor, la onda
function globulosA(gx, ts) {
  for (const c of CARRILES) {
    const x = c.x0 + c.v * ts, y = c.y + 6 * Math.sin(ts * 2.1 + c.x0), s = c.s * (240 / (2 * 120));
    const r = SPR_R * s;

}
// el vaso de un instante, entero (para la mirilla)
let VASO_T = null;
function vasoEn(ts) {

// el general con el virus enfocándose (u: 0 borroso … 1 nítido) y su halo
let B_T = null;
function generalEn(u) {

  if (!B_T) B_T = lienzo();

  gx.setTransform(1, 0, 0, 1, 0, 0);

  gr.addColorStop(0, `rgba(255,226,180,${0.2 + 0.12 * u})`); gr.addColorStop(1, 'rgba(255,214,160,0)');
  gx.fillStyle = gr; gx.fillRect(x - 60, y - 60, 120, 120);
  gx.globalCompositeOperation = 'source-over';

}
// mirilla (como los saltos de prueba-plastilina-adulta y ep3-adn): la foto vieja se hunde hacia F y la nueva llega en
// un círculo que se abre; A: el punto de la nueva que acaba en el centro del círculo (y en su sitio)
function mirilla(u, viejo, nuevo, F, A = [W / 2, H / 2]) {
  const pu = eio(cl(u / 0.8)), px = mix(F[0], A[0], pu), py = mix(F[1], A[1], pu);
  const r = 1500 * eio(prog(u, 0, 0.62));
  const lejos = Math.max(Math.hypot(px, py), Math.hypot(W - px, py), Math.hypot(px, H - py), Math.hypot(W - px, H - py));
  const rr = Math.min(r, lejos + 60);
  const cubre = Math.max(Math.min(px, rr) / A[0], Math.min(W - px, rr) / (W - A[0]), Math.min(py, rr) / A[1], Math.min(H - py, rr) / (H - A[1]));
  const sO = Math.pow(10, 0.5 * eio(cl(u / 0.7))), sN = Math.max(mix(0.8, 1, seco(prog(u, 0.05, 0.85))), cubre);
  g.save();
  g.save(); g.translate(px, py); g.scale(sO, sO); g.translate(-F[0], -F[1]); g.drawImage(viejo, 0, 0, W, H); g.restore();
  if (r > 2) {
    g.save(); g.shadowColor = 'rgba(0,0,0,0.75)'; g.shadowBlur = 46; g.fillStyle = '#0b0c0f';
    g.beginPath(); g.arc(px, py, rr, 0, Math.PI * 2); g.fill(); g.restore();
    g.save(); g.beginPath(); g.arc(px, py, rr, 0, Math.PI * 2); g.clip();
    g.translate(px, py); g.scale(sN, sN); g.translate(-A[0], -A[1]);
    g.drawImage(nuevo, 0, 0, W, H);
    g.restore();
    if (r < lejos) { g.strokeStyle = 'rgba(0,0,0,0.45)'; g.lineWidth = 10; g.filter = 'blur(4px)'; g.beginPath(); g.arc(px, py, r, 0, Math.PI * 2); g.stroke(); g.filter = 'none'; }
  }
  g.restore();
}
// una foto con un empuje (zoom z alrededor de c)
function empujar(f, z, c) {

// el microscopio: la rueda gira sin parar (rad) y el visor no se aclara
const ruedaEn = (ts) => 1.9 * (ts - T.micro) + 0.5 * Math.sin(2.3 * (ts - T.micro));
function visor(ts, ocular) {
  const u = prog(ts, T.visor[0], T.visor[1]);
  if (u <= 0) return;
  const s = eob(u, 1.6), [cx, cy] = VISOR.c, ri = VISOR.ri * s;
  // el haz que sale del ocular hacia el visor
  const ang = Math.atan2(cy - ocular[1], cx - ocular[0]), dd = Math.hypot(cx - ocular[0], cy - ocular[1]);
  const ab = Math.asin(Math.min(0.99, VISOR.r * s / dd));
  g.save();
  g.globalAlpha = 0.1 * cl(u * 2);
  g.fillStyle = 'rgb(255,232,190)';
  g.beginPath(); g.moveTo(ocular[0], ocular[1]);
  g.lineTo(ocular[0] + Math.cos(ang - ab) * dd, ocular[1] + Math.sin(ang - ab) * dd);
  g.lineTo(ocular[0] + Math.cos(ang + ab) * dd, ocular[1] + Math.sin(ang + ab) * dd);
  g.closePath(); g.fill();
  g.restore();
  // el campo claro y el virus borroso (una mancha oscura que respira con la rueda, nunca nítida)
  g.save();
  g.beginPath(); g.arc(cx, cy, ri, 0, Math.PI * 2); g.clip();
  const gr = g.createRadialGradient(cx - 40, cy - 50, 10, cx, cy, ri);
  gr.addColorStop(0, '#f2e3c4'); gr.addColorStop(0.7, '#d9c39c'); gr.addColorStop(1, '#8c7556');
  g.fillStyle = gr; g.fillRect(cx - ri, cy - ri, 2 * ri, 2 * ri);
  const bl = 15 + 6 * Math.sin(2.3 * (ts - T.micro) + 0.6), dv = 170 * s;
  g.filter = `blur(${bl * KK()}px) grayscale(0.7) brightness(0.42) contrast(1.3)`;
  g.globalAlpha = 0.85;
  g.drawImage(FOTO.virusSpr, cx - dv / 2 + 4 * Math.sin(ts * 3.1), cy - dv / 2 + 3 * Math.cos(ts * 2.7), dv, dv);
  g.filter = 'none'; g.globalAlpha = 1;
  // viñeta del ocular
  const vg = g.createRadialGradient(cx, cy, ri * 0.55, cx, cy, ri);
  vg.addColorStop(0, 'rgba(20,14,8,0)'); vg.addColorStop(1, 'rgba(20,14,8,0.55)');
  g.fillStyle = vg; g.fillRect(cx - ri, cy - ri, 2 * ri, 2 * ri);
  g.restore();

  g.save(); g.translate(cx, cy); g.scale(s, s); g.translate(-cx, -cy); g.drawImage(FOTO.aro, 0, 0, W, H); g.restore();
}
// la onda que viaja: la foto de dos periodos repetida desde la izquierda hasta el frente (xf), desplazada con él; esc:
// su tamaño (1 en C2, ½ en F); alfa(x): cuánto se ve en cada x (px de pantalla); yc: su eje
let ONDA_T = null;
function ondaViaja(xf, esc, yc, alfa, cola = -1e9) {
  fotoOnda();
  if (!ONDA_T) ONDA_T = lienzo();
  const gx = ONDA_T.getContext('2d'), k = KK();
  gx.setTransform(1, 0, 0, 1, 0, 0); gx.clearRect(0, 0, ONDA_T.width, ONDA_T.height);
  gx.setTransform(k, 0, 0, k, 0, 0);
  const P2 = 2 * LAMBDA * esc, h = 2 * OH * esc;
  for (let x = xf - P2; x > -P2 - 10; x -= P2) {
    if (x + P2 < cola) break;
    gx.drawImage(FOTO.ondaBrillo, x, yc - h / 2, P2, h);
  }
  // el brillo se suma; el alambre encima
  gx.globalCompositeOperation = 'source-over';
  for (let x = xf - P2; x > -P2 - 10; x -= P2) {
    if (x + P2 < cola) break;
    gx.drawImage(FOTO.onda, x, yc - h / 2, P2, h);
  }
  // el frente, la cola y lo que se apaga: una máscara horizontal
  gx.globalCompositeOperation = 'destination-in';
  const gr = gx.createLinearGradient(0, 0, W, 0);
  for (let i = 0; i <= 48; i++) { const x = (i / 48) * W; gr.addColorStop(i / 48, `rgba(0,0,0,${cl(alfa(x))})`); }
  gx.fillStyle = gr; gx.fillRect(0, 0, W, H);
  gx.globalCompositeOperation = 'source-over';
  g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.55; g.drawImage(ONDA_T, 0, 0, W, H); g.restore();
  g.drawImage(ONDA_T, 0, 0, W, H);
}
const V_ONDA = 640;                                       // px/s
const frenteC2 = (ts) => -60 + V_ONDA * (ts - T.ondaC);
function planoC2(ts) {
  fotoC2();
  g.drawImage(FOTO.P, 0, 0, W, H);
  // el virus: nítido hasta que la onda le pasa por encima; después, borroso (sin forma)
  const xf = frenteC2(ts), R = VIR_C2_PX;
  const u = ss(960 - R * 0.6, 960 + R * 1.6, xf);
  g.drawImage(FOTO.c2n, 960 - R, 540 - R, 2 * R, 2 * R);
  if (u > 0) { g.globalAlpha = u; g.drawImage(FOTO.c2b, 960 - R, 540 - R, 2 * R, 2 * R); g.globalAlpha = 1; }
  ondaViaja(xf, 1, 540, (x) => 1 - ss(xf - 160, xf, x));
}
function planoF(ts) {
  g.drawImage(fotoF(), 0, 0, W, H);
  // la cola de la onda cruza y la luz se apaga al acercarse al borde derecho
  const cola = 180 + 760 * (ts - T.vuelta);
  const apaga = 1 - ss(m.lF - 0.5, m.lF + 0.1, ts);
  if (apaga <= 0) return;
  // (la onda corre con su cola: el frente queda siempre fuera, a la derecha)
  ondaViaja(cola + 2 * W, 0.5, 540, (x) => apaga * ss(cola, cola + 90, x) * (1 - ss(1020, 1460, x)), cola);

// G: los guantes tantean la moneda (en vivo); el derecho frota en círculos y el izquierdo la sujeta y da toquecitos
function planoG(ts) {
  const u = ts - T.guantes;
  const ent = 1 - seco(prog(ts, T.guantes - 0.05, T.guantes + 0.35));   // llegan un poco desde abajo
  const mon = moneda(P, I.MON, { ...MON, rot: [MON.rot[0] + 0.03 * Math.sin(u * 3.4), MON.rot[1] + 0.05 * Math.sin(u * 2.2), MON.rot[2] + 0.03 * Math.sin(u * 4.4)] });
  // derecho: la muñeca abajo a la derecha, los dedos hacia la cara de la moneda
  const fr = 1.4 * Math.PI * 2 * u / 1.6;
  const pD = en(1272 + 26 * Math.cos(fr), 935 + 70 * ent + 20 * Math.sin(fr), 3.45);
  guante(P, I.GD, { lado: 'der', pos: pD, escala: G_ESC, rot: [-0.22, -0.15, 0.5 + 0.07 * Math.sin(fr)] });
  // izquierdo: abajo a la izquierda, sujeta el canto; toquecitos
  const tq = Math.max(0, Math.sin(u * 2 * Math.PI * 1.6));
  const pI = en(565 - 8 * tq, 1000 + 90 * ent - 14 * tq, 3.4 + 0.1 * tq);
  guante(P, I.GI, { lado: 'izq', pos: pI, escala: G_ESC, rot: [-0.16 - 0.06 * tq, 0.12, -0.45], sq: [1, 1 - 0.04 * tq, 1 + 0.03 * tq] });
  // el «?»
  const b = brote(ts, T.pregunta, 0.3, 0.12);
  if (b > 0) P.pieza(I.PREG, { pos: PREG.pos, escala: PREG.escala * b, rot: [PREG.rot[0], PREG.rot[1] + 0.1 * Math.sin(ts * 2.4), PREG.rot[2]], color: 3 });
  return mon;
}
// sombra 2D de lo vivo sobre el telón (sin la de Atom)
let SOMBRA_T = null;

// ---------------------------------------------------------------- lo vivo de un instante (sobre transparente, en lienzoGL)
function vivo(ts, mas = null) {
  P.fotograma(ts); P.limpiar();
  atomo(ts);
  if (ts < REGLA_QUIETA && ts >= T.regla[0]) reglaViva(ts);
  if (ts < 1.3) cartela(P, ts, E.cartela);
  const r = mas ? mas(ts) : null;
  P.render(Math.floor(ts * 12 + 1e-6), { fondo: false });
  return r;
}

// ---------------------------------------------------------------- fotograma
// las fotos se hacen en fotogramas baratos poco antes de hacer falta, una por fotograma (al renderizar en orden); si se
// pide un instante posterior sin pasar por ellos, se hacen todas las pendientes
const PREPARAR = [[0.25, fotoB], [0.6, () => capaRegla(-7)], [T.det - 1.8, fotoB2], [T.micro - 1.2, fotoC], [T.micro - 0.6, fotoPlato],
  [T.ondaC - 2.0, fotoC2], [T.ondaC - 1.2, fotoOnda], [T.guantes + 1.2, fotoF]];
function preparar(ts) { for (const [t0, f] of PREPARAR) if (ts >= t0) f(); }
function dibujar(t) {
  const ts = Math.min(t, D - 0.3);
  preparar(ts);
  ajustarCapa();
  const nf = Math.floor(ts * 12 + 1e-6);
  const pl = plano(ts);
  if (pl === 'C') {
    ponerInstrumentos(UI, { rueda: ruedaEn(ts) });
    const mic = vivo(ts, () => instrumento(P, I.MIC, MIC));
    g.drawImage(FOTO.C, 0, 0, W, H);
    exposicion(nf);
    visor(ts, pant(mic.punto('ocular')));
    g.drawImage(lienzoGL, 0, 0, W, H);
  } else if (pl === 'G') {
    vivo(ts, planoG);
    g.drawImage(fotoPlato(), 0, 0, W, H);
    sombraViva();
    g.drawImage(lienzoGL, 0, 0, W, H);
  } else {
    vivo(ts);
    if (pl === 'A') { g.drawImage(vasoEn(ts), 0, 0, W, H); exposicion(nf); }
    else if (pl === 'S1') {
      const u = prog(ts, T.s1[0], T.s1[1]);
      mirilla(u, vasoEn(ts), generalEn(eio(prog(ts, T.foco[0], T.foco[1]))), [960, 540], VIR_B_PX);
    } else if (pl === 'B') {
      empujar(generalEn(eio(prog(ts, T.foco[0], T.foco[1]))), 1 + 0.045 * eio(prog(ts, T.s1[1], T.empuje[0])), VIR_B_PX);
      exposicion(nf);
    } else if (pl === 'BP') {
      empujar(generalEn(1), 1.045 + 0.6 * eic(prog(ts, T.empuje[0], T.empuje[1])), VIR_B_PX);
    } else if (pl === 'B2') {
      empujar(fotoB2(), 1 + 0.035 * prog(ts, T.det, T.micro), VIR_B2_PX);
      exposicion(nf);
    } else if (pl === 'C2') planoC2(ts);
    else if (pl === 'F') planoF(ts);
    g.drawImage(lienzoGL, 0, 0, W, H);
  }
  // la regla quieta es una capa encima de todo; mientras corre la escala, va viva (en lo vivo)
  if (ts < T.regla[0]) g.drawImage(capaRegla(-5), 0, 0, W, H);
  else if (ts >= REGLA_QUIETA) g.drawImage(capaRegla(-7), 0, 0, W, H);
  POST.aplicar(g, nf);
}
