<script type="module">
// AT-NINTENDO (frase 19), 1985, cartela «1985». Cuatro planos:
// 1. (ny85) la calle nevada de Nueva York: el dependiente sale de la juguetería con la campanilla y saluda; la familia
//    llega por la acera, el niño corre delante y salta junto al escaparate en «feet»; un comprador sale con su consola
//    en caja (el dependiente le aguanta la puerta, efecto «puerta») y se va por la derecha; los taxis pasan por delante;
// 2. (mapa, encuadrado algo a la izquierda para que la esquina de Atom quede en el Atlántico) el carguero con humo y dos gaviotas cruza el Pacífico hasta la costa en «arrived», la consola gris viaja
//    por la ruta roja y en «United States» cae la chincheta de Nueva York; destello en «Nintendo's»;
// 3. (ny85 escaparate, la cámara corrida 32 px: el cristal sale por la izquierda y acaba en x 270; a la derecha la
//    pared de ladrillo, tranquila arriba, con el farol que tiembla y su gorrión, la placa del número y un abeto con luces)
//    la familia ante el cristal y una señora con su bolsa que pasa por detrás mirando el escaparate:
//    en «approved» salen los vistos verdes en las cajas, en «seal» el sello dorado echa rayos, el niño salta y aplaude;
//    el padre señala el sello en «quality» y habla con la madre;
// 4. (juntas/gráfica) una gráfica propia: 83 alta, 84–85 hundidas con el montón de cartuchos del «chaos»; en «came
//    back» crecen 86–89, cada barra con su sello, y en «bigger than ever» la última pasa la raya del pico de 1983
//    (destello y «!»); el presentador, a la derecha, lleva el puntero láser que sigue las barras y celebra al final;
//    la barra del año va de 1985 a 1989.
import * as T from '/atomo/plato/escenas/at-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
import { ELENCO_AT } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('at-nintendo');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const A = ELENCO_AT, PZ = T.PIEZAS_AT, K = hex('#24222c'), BL = hex('#ffffff');
const pl = (o) => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, hex(v)]));   // paleta de cadenas → colores
const H = (x, y, s = 0) => { const v = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453; return v - Math.floor(v); };
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], bay = (x, y) => (BAY[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
// capa fija en un búfer: entera (copia) o encima (solo los píxeles pintados)
const cache = {};
const capa = (clave, pinta, encima = false) => { if (!cache[clave]) { const b = R.nuevo(), prev = R.usar(b); pinta(); R.usar(prev); cache[clave] = b; }
  if (!encima) { R.copiar(cache[clave]); return; } const B = R.buf, b = cache[clave]; for (let i = 0; i < b.length; i++) if (b[i]) B[i] = b[i]; };
// destello de cuatro puntas (u 0–1: crece y se apaga)
const destello = (x, y, u, c = hex('#fff6b0')) => { if (u <= 0 || u >= 1) return; const l = Math.round(2 + Math.sin(u * Math.PI) * 7), m = Math.floor(l / 2);
  for (let i = -l; i <= l; i++) { R.pset(x + i, y, c); R.pset(x, y + i, c); } for (let i = -m; i <= m; i++) { R.pset(x + i, y + i, BL); R.pset(x + i, y - i, BL); } R.disco(x, y, 1, BL); };
// nube de tres tonos (sombra, cuerpo, luz) de ancho w; ok(x, y) dice dónde se puede pintar (el cielo)
const nube = (x0, y0, w, [S, Cc, L], ok = () => true) => {
  const bs = [[0.2, 0.62, 0.2], [0.42, 0.4, 0.27], [0.66, 0.5, 0.24], [0.85, 0.66, 0.15]].map(([a, b, r]) => [a * w, b * w * 0.4, r * w]), h = Math.round(w * 0.36);
  for (let j = 0; j <= h; j++) for (let i = 0; i <= w; i++) {
    let dm = 9, dy = 0; for (const [cx, cy, r] of bs) { const d = Math.hypot(i - cx, (j - cy) * 1.7) / r; if (d < dm) { dm = d; dy = (j - cy) / r; } }
    if (dm > 1) continue; const x = Math.round(x0 + i), y = Math.round(y0 + j); if (x < 0 || x > 319 || !ok(x, y)) continue;
    R.pset(x, y, j > h * 0.66 - (bay(x, y) > 0.5 ? 1 : 0) ? S : dy < -0.45 && dm > 0.55 ? L : dm > 0.86 && bay(x, y) < 0.45 ? L : Cc); } };
// cielo tramado en cuatro tonos, de y 0 a y1 (las bandas se funden con la trama de Bayer)
const cieloTramado = (y1, cs) => { for (let y = 0; y <= y1; y++) for (let x = 0; x < 320; x++) { const u = y / y1 * (cs.length - 1.001), k = Math.floor(u), f = u - k;
  R.pset(x, y, f > bay(x, y) ? cs[k + 1] : cs[k]); } };
// un cuervo pequeño que aletea
const cuervo = (x, y, t) => { const a = Math.sin(t * 9 + x) > 0; R.pset(x, y, K); R.pset(x + 1, y, K); R.pset(x - 1, y + (a ? -1 : 1), K); R.pset(x + 2, y + (a ? -1 : 1), K); R.pset(x - 2, y + (a ? -2 : 1), K); R.pset(x + 3, y + (a ? -2 : 1), K); };
const papel = (x, y) => { R.rect(x, y, x + 8, y + 10, K); R.rect(x + 1, y + 1, x + 7, y + 9, hex('#f6f0dc')); for (const j of [3, 5, 7]) R.rect(x + 2, y + j, x + 6, y + j, hex('#a8a090')); R.pset(x + 6, y + 8, hex('#c8303a')); R.pset(x + 5, y + 8, hex('#c8303a')); };
// la cámara de televisión al hombro (mira hacia dir) con su piloto rojo
const camaraTV = (x, y, dir, t) => { const x0 = dir > 0 ? x - 4 : x - 8; R.rect(x0, y - 4, x0 + 12, y + 2, K); R.rect(x0 + 1, y - 3, x0 + 11, y + 1, hex('#4a4a56')); R.rect(x0 + 1, y - 3, x0 + 11, y - 3, hex('#7a7a88'));
  const lx = dir > 0 ? x0 + 13 : x0 - 3; R.rect(lx, y - 3, lx + 2, y + 1, K); R.pset(lx + 1, y - 1, hex('#6a9ad8')); R.rect(x0 + 3, y - 6, x0 + 8, y - 5, K); if (Math.sin(t * 6) > 0) R.pset(dir > 0 ? x0 + 2 : x0 + 10, y - 2, hex('#e83a3a')); };

const a = (f) => en('nintendo', f);
const P2 = a(0.2245), P3 = a(0.4395), P4 = a(0.7902);
const pies = a(0.096), llega = a(0.285), estados = a(0.347), nint = a(0.391);
const aprob = a(0.512), sello = a(0.6385), calidad = a(0.664), resp = a(0.714);
const vuelven = a(0.8636), vino = a(0.9104), mayor = a(0.9424);
const SALE = 3.5;   // el comprador sale por la puerta
const NY = { encuadre: 'ny85' }, NYE = { encuadre: 'ny85', camara: 'escaparate' };
// la bolsa de papel de la madre, colgada de la mano
// la caja de la consola recién comprada (gris, con la franja roja y la foto), en la mano
const cajaNES = ([x, y]) => { R.rect(x - 6, y - 7, x + 6, y + 2, K); R.rect(x - 5, y - 6, x + 5, y + 1, hex('#c8c8d2')); R.rect(x - 5, y - 6, x + 5, y - 6, hex('#e8e8f0'));
  R.rect(x - 5, y - 4, x + 5, y - 3, hex('#c8303a')); R.rect(x - 3, y - 2, x + 1, y, hex('#5a5a66')); R.pset(x + 3, y - 1, hex('#e8b830')); R.rect(x + 5, y - 6, x + 5, y + 1, hex('#9a9aa6')); };
const bolsa = ([x, y]) => { R.rect(x - 4, y - 1, x + 3, y + 8, K); R.rect(x - 3, y, x + 2, y + 7, hex('#b8925a')); R.rect(x - 3, y, x + 2, y + 1, hex('#d8b47a')); R.pset(x - 2, y - 2, K); R.pset(x + 1, y - 2, K); R.rect(x - 2, y + 3, x + 1, y + 5, hex('#c8303a')); };
// 1 · la calle
const p1 = (t) => {
  T.mundo(R, t, NY);
  // un comprador sale de la juguetería con su consola en caja (las familias vuelven a comprar) y se va por la derecha;
  // va detrás del dependiente, que le aguanta la puerta
  if (t > SALE) { const c = tramo(t, SALE, SALE + 2.4), rc = R.actor(A.comprador, Math.round(lerp(222, 334, c)), 148, t, { dir: 1, anda: c < 1, sostiene: true, sonrisa: true }); cajaNES(rc.mano); }
  const s = tramo(t, 1.5, 2.2);
  R.actor(A.dependiente, Math.round(lerp(214, 232, s)), Math.round(lerp(140, 150, s)), t, { dir: -1, anda: s > 0 && s < 1, sonrisa: true, habla: t > 2.4 && t < SALE && Math.sin(t * 9) > 0, brazos: t > SALE && t < SALE + 0.8, dedo: t > SALE + 0.8 });
  const m = tramo(t, 0.7, P2 - 1.2), xm = Math.round(lerp(-50, 100, m)), xp = Math.round(lerp(-30, 122, m));
  const rm = R.actor(A.madre85, xm, 151, t, { dir: 1, anda: m > 0 && m < 1, sostiene: true, sonrisa: m >= 1 }); bolsa(rm.mano);
  R.actor(A.padre85, xp, 150, t, { dir: 1, anda: m > 0 && m < 1, habla: m >= 1 && Math.sin(t * 8) > 0 });
  const k = tramo(t, 0.4, pies - 0.15), xn = Math.round(lerp(-14, 154, k));
  const sj = t > pies - 0.1 && t < pies + 0.4 ? Math.round(Math.sin((t - pies + 0.1) / 0.5 * Math.PI) * 5) : 0;
  R.actor(A.nino85, xn, 149, t, { dir: 1, anda: k > 0 && k < 1, salto: sj, sorpresa: k >= 1 && t < pies + 0.4, sonrisa: t > pies + 0.4, dedo: t > pies + 0.4 });
  T.mundoDelante(R, t, NY);
};
// el carguero con las cajas de consolas (popa a la izquierda, x proa): casco, puente, chimenea con humo y espuma
const barco = (x, y, t) => {
  for (let k = 0; k < 5; k++) { const f = ((t * 0.8 + k * 0.2) % 1), hx = x - 6 - Math.round(f * 12), hy = y - 15 - Math.round(f * 7); R.disco(hx, hy, 1 + Math.round(f * 2), mez(hex('#5a5a66'), hex('#c8ccd8'), f)); }
  R.poligono([[x - 13, y - 5], [x + 11, y - 5], [x + 8, y + 1], [x - 11, y + 1]], K); R.poligono([[x - 12, y - 4], [x + 9, y - 4], [x + 7, y], [x - 10, y]], hex('#3a4a6a'));
  R.rect(x - 12, y - 4, x + 9, y - 4, hex('#c8303a')); R.rect(x - 10, y, x + 7, y, hex('#24304a'));
  R.rect(x - 11, y - 10, x - 5, y - 5, K); R.rect(x - 10, y - 9, x - 6, y - 5, hex('#f2eee2')); R.pset(x - 9, y - 8, hex('#6a9ad8')); R.pset(x - 7, y - 8, hex('#6a9ad8'));
  R.rect(x - 8, y - 14, x - 6, y - 10, K); R.rect(x - 8, y - 13, x - 6, y - 13, hex('#c8303a'));
  for (const [cx, c] of [[-3, '#c8c8d2'], [1, '#9a9aa6'], [5, '#c8c8d2']]) { R.rect(x + cx, y - 9, x + cx + 3, y - 5, K); R.rect(x + cx, y - 8, x + cx + 2, y - 5, hex(c)); R.pset(x + cx + 1, y - 7, hex('#c8303a')); }
  for (let i = 0; i < 4; i++) R.pset(x + 10 + i, y + (i + Math.floor(t * 6)) % 2, i % 2 ? hex('#e8f0f6') : BL);
};
// 2 · el mapa: del Pacífico a Nueva York
const p2 = (t) => {
  // el mapa algo corrido a la izquierda: la esquina de Atom (arriba a la derecha) queda en el Atlántico, sin costa
  const P = T.mapa(R, t, { zoom: 1, centro: [-89, 37.5], rosa: [282, 100] });
  const [sx, sy] = P([-122.4, 37.8]).map(Math.round), [nx, ny] = P([-74.0, 40.7]).map(Math.round);
  const b = tramo(t, P2, llega), bx = Math.round(lerp(20, Math.max(34, sx - 10), b)), by = sy + 10 + Math.round(Math.sin(t * 4));
  if (b < 1) for (let i = 1; i < 7; i++) { R.pset(bx - 4 - i * 3, by + 1 + (i % 2), hex('#e8f0f6')); R.pset(bx - 5 - i * 3, by + 2, hex('#c8d8e8')); }
  if (t < llega + 0.5) barco(bx, by, t);
  // dos gaviotas siguen al barco y luego se van tierra adentro
  for (let k = 0; k < 2; k++) { const gx = Math.round(bx - 6 + k * 14 + (t - P2) * (b < 1 ? 2 : 14) + Math.sin(t * 2 + k) * 3), gy = by - 26 - k * 5 + Math.round(Math.sin(t * 3 + k * 2) * 2);
    const al = Math.sin(t * 10 + k * 3) > 0 ? -1 : 0; R.pset(gx, gy, BL); R.pset(gx - 1, gy + al, BL); R.pset(gx + 1, gy + al, BL); R.pset(gx - 2, gy + al - (al ? 0 : -1), hex('#c8d0d8')); R.pset(gx + 2, gy + al - (al ? 0 : -1), hex('#c8d0d8')); }
  const fin = [nx - 22, ny - 6];
  const pts = [[sx + 2, sy + 4], [Math.round(lerp(sx, fin[0], 0.35)), Math.round(lerp(sy, fin[1], 0.35)) - 16], [Math.round(lerp(sx, fin[0], 0.7)), Math.round(lerp(sy, fin[1], 0.7)) - 12], fin];
  const v = tramo(t, llega + 0.1, estados - 0.1);
  if (v > 0) R.ruta(pts, v, hex('#c8303a'), { grueso: 1, flecha: false });
  const L = []; let tot = 0; for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); L.push(d); tot += d; }
  let q = tot * v, i = 0; while (i < L.length - 1 && q > L[i]) { q -= L[i]; i++; }
  const f = Math.min(1, q / L[i]), cx = Math.round(lerp(pts[i][0], pts[i + 1][0], f)), cy = Math.round(lerp(pts[i][1], pts[i + 1][1], f));
  if (t > llega - 0.1) { const salta = v > 0 && v < 1 ? Math.round(Math.abs(Math.sin(t * 9)) * 2) : 0; R.rect(cx - 15, cy + 5, cx + 15, cy + 6, hex('#8a7a5a')); PZ.consolaGris(R, cx, cy + 4 - salta, {}); }
  if (t > estados - 0.3) T.chincheta(R, nx + 4, ny + 2, t, hex('#c8303a'), { baja: tramo(t, estados - 0.3, estados), pulso: t > estados + 0.4 });
  destello(fin[0] + 12, fin[1] - 12, tramo(t, nint, nint + 0.7));
};
// 3 · el escaparate
// la cámara del escaparate corrida 32 px a la derecha (el cristal sale por la izquierda y acaba en x 270): se corre la
// imagen del decorado (un recorrido) y lo que queda libre a la derecha (x 288–319) se rellena con su borde de ladrillo
const corre32 = () => { const B = R.buf; for (let y = 0; y < 180; y++) { const o = y * 320;
  for (let x = 0; x < 288; x++) B[o + x] = B[o + x + 32]; for (let x = 288; x < 320; x++) B[o + x] = B[o + 304 + ((x - 288) & 15)]; } };
// la pared de la derecha (x 275–319): ladrillo tranquilo arriba (el toldo acaba en x 274, la esquina de Atom queda
// lisa de ladrillo), un farol de pared con su halo cálido que tiembla y un gorrión que picotea la nieve de su sombrerete,
// la placa de latón con el número y un abeto con luces en su maceta, sobre el montón de nieve
const LAD = ['#b08a64', '#b8926c', '#a8825e', '#9a7656'].map(hex);
const ladrillo = (x0, y0, x1, y1) => { for (let y = y0; y <= y1; y++) { const fila = y >> 2;
  for (let x = x0; x <= x1; x++) { const dx = x + (fila & 1) * 4; if ((y & 3) === 3 || (dx & 7) === 7) { R.pset(x, y, LAD[3]); continue; }
    const v = H(dx >> 3, fila, 17); R.pset(x, y, v < 0.2 ? LAD[2] : v > 0.82 ? LAD[1] : H(x, y, 20) < 0.05 ? LAD[2] : (y & 3) === 0 && v > 0.5 ? LAD[1] : LAD[0]); } } };
const paredDerecha = (t) => {
  const { rect, pset, disco, linea } = R;
  ladrillo(275, 0, 319, 172);
  // el canto del toldo, cortado limpio con su sombra y el soporte de hierro
  rect(275, 15, 275, 25, hex('#6a5a4a')); rect(276, 16, 277, 26, LAD[3]); linea(270, 26, 275, 14, hex('#3a3a40'));
  // la sombra que deja el marco del escaparate en la pared y la nieve que se junta en la cornisa de abajo
  for (let y = 26; y <= 172; y++) if (bay(275, y) < 0.6) pset(275, y, mez(LAD[0], hex('#5a4030'), 0.5));
  // el halo cálido del farol sobre el ladrillo (tiembla con la llama)
  const fx = 298, fy = 66, fl = 0.85 + Math.sin(t * 7) * 0.08 + Math.sin(t * 17.3) * 0.05;
  for (let y = 46; y <= 92; y++) for (let x = 276; x <= 319; x++) { const d = Math.hypot(x - fx, (y - fy) * 1.2) / 24; if (d >= 1) continue;
    const a = (1 - d) * (1 - d) * 0.55 * fl; if (a > bay(x, y) * 0.6) pset(x, y, mez(R.buf[y * 320 + x], hex('#ffd890'), a)); }
  // el brazo de hierro y el farol: tejadillo con nieve, cristales con la llama, base
  rect(306, 52, 316, 52, hex('#2a2a30')); rect(316, 50, 317, 56, hex('#2a2a30')); linea(306, 53, 313, 58, hex('#2a2a30'));
  rect(292, 54, 304, 55, hex('#2a2a30')); rect(294, 52, 302, 53, hex('#3a3a42')); rect(297, 50, 299, 51, hex('#2a2a30'));
  rect(292, 51, 304, 52, hex('#eef4f8')); pset(291, 52, hex('#d8e6f2')); pset(305, 52, hex('#d8e6f2')); rect(295, 50, 301, 50, MC_BL);
  rect(293, 56, 303, 74, hex('#2a2a30'));
  const vid = [hex('#ffe9a8'), hex('#ffd070'), hex('#f0a840')];
  for (let y = 57; y <= 73; y++) for (let x = 294; x <= 302; x++) { if (x === 298) { pset(x, y, hex('#3a3a42')); continue; }
    const d = Math.hypot(x - 298, (y - 66 + Math.sin(t * 9) * 0.6) * 0.7); pset(x, y, d < 2.5 * fl ? MC_BL : d < 4.5 ? vid[0] : d < 6.5 ? vid[1] : vid[2]); }
  pset(295, 58, MC_BL); pset(295, 59, vid[0]);
  rect(292, 75, 304, 76, hex('#2a2a30')); rect(296, 77, 300, 78, hex('#2a2a30')); pset(298, 79, hex('#2a2a30'));
  for (const [x, L] of [[293, 3], [297, 2], [303, 4]]) for (let j = 0; j < L; j++) pset(x, 77 + j, j < L - 1 ? hex('#d8e6f2') : MC_BL);
  // el gorrión sobre el sombrerete: picotea la nieve, se sacude y vuelve
  { const pk = Math.sin(t * 2.3) > 0.4 && Math.sin(t * 13) > 0, gx = 300 + Math.round(Math.sin(t * 0.6) * 2), gy = 49;
    rect(gx - 2, gy - 2, gx + 1, gy, hex('#7a5a3a')); pset(gx - 1, gy - 2, hex('#a8845a')); pset(gx - 3, gy - 1, hex('#5a3a2a')); pset(gx - 4, gy - 1, hex('#5a3a2a'));
    const cx = gx + 2, cy = pk ? gy - 1 : gy - 3; rect(cx - 1, cy, cx, cy + 1, hex('#6a4a2a')); pset(cx, cy, K); pset(cx + 1, cy + (pk ? 1 : 0), hex('#e8b830'));
    pset(gx - 1, gy + 1, hex('#c8903a')); pset(gx + 1, gy + 1, hex('#c8903a')); }
  // la placa de latón con el número de la calle
  rect(290, 85, 308, 95, hex('#6a4a1a')); rect(291, 86, 307, 94, hex('#c8a040')); rect(291, 86, 307, 86, hex('#f0d880')); rect(291, 94, 307, 94, hex('#8a6a20'));
  R.numero('85', 299, 87, { color: hex('#3a2a10'), centro: true, sombra: false, fina: true });
  if ((t % 3.2) < 0.5) { const sx = 291 + Math.round((t % 3.2) / 0.5 * 16); pset(sx, 87, MC_BL); pset(sx + 1, 88, hex('#fff0c0')); }
  // el abeto en su maceta de madera junto a la pared: ramas en pisos con nieve encima y luces que se encienden por turnos
  rect(291, 156, 309, 171, hex('#5a3a22')); rect(291, 156, 309, 157, hex('#8a5a32')); for (const x of [295, 300, 305]) rect(x, 158, x, 171, hex('#3e2816')); rect(291, 163, 309, 163, hex('#c8a040'));
