<body>
<canvas id="lienzo"></canvas>
<script type="module">
// Prueba de identidad · pixel art (a partir de estilos/17-pixel-art.html).
// Escena de 320×180 píxeles reales escalada ×6 sin suavizado, paletas cerradas y tramado Bayer.
// Todo se mueve a saltos de píxel entero y los sprites se animan por fotogramas (12–15 por segundo).
//  · [hola] Atom da un bote (fotogramas de salto y aplastamiento).
//  · [atom] «power-up»: parpadea entre su tamaño y uno mayor, se queda grande, brilla y acelera.
//  · [bloques] caen átomos pequeños a golpes de rejilla, como piezas, y encajan a su alrededor.
//  · [explico] aparece una pizarrita con una «?» de tiza; [escuela] cambia a «!» con un destello.
//  · [saltos]→[pelo] cuatro «niveles»: cada salto amplía la imagen ×10 a vecino más próximo (los píxeles
//    crecen en bloques) y la siguiente se funde con tramado; golpe con sacudida en cada llegada.
//  · [decima]→[milimetro] la cota se traza píxel a píxel y salta el rótulo «10⁻⁴ m».
import { escena } from '/atomo/plato/escena.js';

const E = await escena('prueba-pixel', 'prueba');
const M = (k) => E.marca(k);
const DUR = E.duracion;
const captura = new URLSearchParams(location.search).has('captura');

const W = 320, H = 180, TAU = Math.PI * 2;
const T_HOLA = M('hola'), T_ATOM = M('atom'), T_ATOM_FIN = M('atom_fin');
const T_BLOQ = M('bloques'), T_EXPL = M('explico'), T_ESC = M('escuela');
const T_SALT = M('saltos'), T_PELO = M('pelo'), T_DEC = M('decima'), T_MILI = M('milimetro');
const T_MILI_FIN = M('milimetro_fin');
const T_QUIETO = DUR - 0.6;           // la voz acaba aquí: desde este instante nada se mueve
const FPS_S = 15;                     // fotogramas por segundo de los sprites
const fot = (t) => Math.floor(t * FPS_S);   // número de fotograma de sprite

// ── paleta cerrada (la del demo y rampas nuevas para piel, pelo, ropa y pizarra) ──
const hex = (h) => { const n = parseInt(h.slice(1), 16); return (0xff000000 | ((n & 255) << 16) | (n & 0xff00) | (n >> 16)) >>> 0; };
const pal = (a) => a.map(hex);
const SKY = pal(['#06071a', '#0a0d24', '#0e1330', '#13193c', '#182048', '#1e2855', '#253162', '#2d3b6d', '#374678', '#425182', '#4f5d8d', '#5e6a97']);
const STAR = pal(['#3c4a7e', '#5f6ea3', '#9fb2e0', '#dbe6ff', '#ffffff']);
const WARM = pal(['#7a5a6a', '#d9a27a', '#ffd9a8']);
const COOL = pal(['#4a6aa8', '#9cc4ff', '#e6f3ff']);
const FARC = pal(['#161d42', '#1d2650', '#28336a', '#4a5590', '#7781b4', '#a9b2da']);
const MIST = pal(['#33406f', '#425083']);
const MIDC = pal(['#0f1431', '#141a3b', '#232d5c', '#34427a']);
const FGC = pal(['#05060f', '#080a1b', '#0c0f25', '#1a234c', '#33427a', '#5a6aa3']);
const WATER = pal(['#05071a', '#0a1029', '#111a3b', '#1b2750', '#293a6b', '#40548b', '#6d80b6']);
const UI = pal(['#05060f', '#0b0e24', '#131a3c', '#1d2650', '#9a8063', '#e4cf96', '#fff6dc', '#ffcf5a', '#8fb8ff', '#3a4a86']);
const ATOM = pal(['#ff7a5c', '#ffcf5a', '#fff3d0', '#2c4380', '#e8f4ff', '#7fa6f0', '#c94558', '#8ea6dc']);
const GLOW = pal(['#3a4a86', '#5e72b4', '#8fa2dc']);
const SKIN = pal(['#2a1420', '#55263a', '#8a4148', '#bd6a5c', '#e09a7a', '#f6c7a0', '#ffe6cc']);
const HAIR = pal(['#120a10', '#2a1518', '#4a2620', '#74402c', '#a3633c', '#cf9256', '#f3c98a']);
const SHIRT = pal(['#0d1f33', '#163d55', '#1f6273', '#2f8f8a', '#5cc2a0', '#a8ecc4']);
const PANTS = pal(['#0b0d22', '#141a3d', '#20295a', '#2f3c7a', '#46579e']);
const SHOE = pal(['#140b10', '#3a1f22', '#6a3a30']);
const BOARD = pal(['#0a1712', '#123024', '#1c4a36', '#2a6a4c']);
const WOOD = pal(['#2a160d', '#55301a', '#8a5a2e', '#c08a4c']);
const CHALK = pal(['#7f9a8a', '#c4d8c8', '#f0f8ee']);
const INK = hex('#05060f'), BLANCO = hex('#ffffff');

// ── utilidades (del demo) ────────────────────────────────────────────────────
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function vnoise(x, y) {
  const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const v00 = hash2(x0, y0), v10 = hash2(x0 + 1, y0), v01 = hash2(x0, y0 + 1), v11 = hash2(x0 + 1, y0 + 1);

  return top + (bot - top) * sy;
}
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const b4 = (x, y) => (B4[((y & 3) << 2) | (x & 3)] + 0.5) / 16;
const B2 = [0, 2, 3, 1];
const b2 = (x, y) => (B2[((y & 1) << 1) | (x & 1)] + 0.5) / 4;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = (a, b, v) => { const p = clamp((v - a) / (b - a), 0, 1); return p * p * (3 - 2 * p); };

const mix = (a, b, x) => a + (b - a) * x;

const tone = (ramp, v, x, y) => { let l = Math.floor(v); if (v - l > b2(x, y)) l++; return ramp[clamp(l, 0, ramp.length - 1)]; };

// ── búferes ──────────────────────────────────────────────────────────────────
const lienzo = document.getElementById('lienzo');
const ctx = lienzo.getContext('2d');
const bajo = document.createElement('canvas'); bajo.width = W; bajo.height = H;
const bctx = bajo.getContext('2d');
const imagen = bctx.createImageData(W, H);
const buf = new Uint32Array(imagen.data.buffer);

const pset = (x, y, c) => { x |= 0; y |= 0; if (x >= 0 && x < W && y >= 0 && y < H) dst[y * W + x] = c; };

function rect(x0, y0, x1, y1, c) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) pset(x, y, c); }
const nuevoNivel = () => new Uint32Array(W * H);

// ── tipografía a mano: solo «10», exponentes, «m», «?» y «!» ─────────────────
const G57 = {

  '1': ['  #  ', ' ##  ', '# #  ', '  #  ', '  #  ', '  #  ', '#####'],
  'm': ['     ', '     ', '## # ', '# # #', '# # #', '# # #', '# # #'],
};
const G35 = {
  '0': ['###', '# #', '# #', '# #', '###'], '1': [' # ', '## ', ' # ', ' # ', '###'],
  '2': ['## ', '  #', ' # ', '#  ', '###'], '3': ['## ', '  #', ' # ', '  #', '## '],
  '4': ['# #', '# #', '###', '  #', '  #'], '−': ['   ', '   ', '###', '   ', '   '],

function glifo(g, x, y, e, c) {
  for (let j = 0; j < g.length; j++) for (let i = 0; i < g[j].length; i++) if (g[j][i] === '#') rect(x + i * e, y + j * e, x + i * e + e - 1, y + j * e + e - 1, c);
}
// ancho en píxeles de «10^exp m» a escala e
const anchoPot = (exp, e = 1) => (5 + 1 + 5 + 1 + exp.length * 4 - 1 + 3 + 5) * e;
// «10» + exponente volado + «m»; (x, y) = esquina superior izquierda de los dígitos grandes
function potencia(exp, x, y, e, c, sombra) {
  const pinta = (ox, oy, col) => {
    glifo(G57['1'], ox, oy, e, col); glifo(G57['0'], ox + 6 * e, oy, e, col);
    let xe = ox + 12 * e;
    for (const ch of exp) { glifo(G35[ch], xe, oy - 2 * e, e, col); xe += 4 * e; }
    glifo(G57.m, xe + 2 * e, oy, e, col);
  };
  if (sombra != null) pinta(x + e, y + e, sombra);
  pinta(x, y, c);
}
const EXP = ['0', '−1', '−2', '−3', '−4'];

// ════════════════════════════════════════════════════════════════════════════
//  NIVEL 0 (10⁰ m): paisaje nocturno del demo, con la persona en una loma
// ════════════════════════════════════════════════════════════════════════════
const SKY_ROWS = 132, HOR = 130, LAGO_Y = 139;
const fgTop = (x) => Math.round(150 - 12 * Math.exp(-Math.pow((x - 104) / 46, 2)) - 3 * Math.exp(-Math.pow((x - 300) / 40, 2)) + 1.2 * Math.sin(x * 0.08 + 0.4));
function milkyAt(fx, fy) {
  const s = fx * 0.574 + fy * 0.819 - 20, along = fx * 0.819 - fy * 0.574;
  const n1 = vnoise(fx * 0.06 + 7, fy * 0.06 + 3), n2 = vnoise(fx * 0.15 + 1, fy * 0.15 + 9);
  const width = 22 + 7 * Math.sin(along * 0.022);
  let v = Math.exp(-(s * s) / (width * width)) * (0.45 + 0.75 * (0.65 * n1 + 0.35 * n2));
  v -= 0.55 * Math.exp(-((s - 4) * (s - 4)) / 28) * smooth(0.45, 0.7, n2);
  return Math.max(0, v);
}
const ESTATICO0 = nuevoNivel();       // cielo, montañas, bruma y colinas: no cambian
const FG0 = nuevoNivel();             // loma del primer plano (se pinta encima del lago)
const ESTRELLAS = [];
{
  dst = ESTATICO0;
  // cielo: degradado + Vía Láctea (fija), con un resplandor suave donde flota Atom
  for (let y = 0; y < SKY_ROWS; y++) for (let x = 0; x < W; x++) {
    let v = 7.1 * Math.pow(Math.min(1, (y + 0.5) / HOR), 1.75) + 0.12;
    v += 1.3 * milkyAt(x - 150, y - 70);
    const da = Math.hypot(x - 150, y - 80);
    v += 1.1 * Math.exp(-da / 40);
    let l = Math.floor(v); if (v - l > b2(x, y)) l++;
    ESTATICO0[y * W + x] = SKY[l > 11 ? 11 : l];
  }
  const rnd = mulberry32(20241017);
  let guard = 0;
  while (ESTRELLAS.length < 260 && guard++ < 20000) {
    const x = Math.floor(rnd() * W), y = Math.floor(rnd() * 118);
    if (rnd() > 0.3 + 0.9 * milkyAt(x - 150, y - 70)) continue;
    const q = rnd();
    ESTRELLAS.push({ x, y, type: q < 0.7 ? 0 : q < 0.93 ? 1 : 2, tint: rnd() < 0.16 ? 1 : rnd() < 0.12 ? 2 : 0, k: 1 + Math.floor(rnd() * 3), ph: Math.floor(rnd() * 8) });
  }
  // montañas lejanas con nieve (del demo)
  const picos = [[-16, 110, 1, 1], [14, 105, 0.9, 1.1], [44, 112, 1, 0.9], [72, 108, 0.9, 1.0], [101, 117, 1, 1], [131, 120, 0.9, 1], [160, 114, 1.1, 0.9], [188, 106, 1, 1.1], [216, 99, 0.95, 0.85], [246, 109, 1, 1], [278, 115, 0.9, 1], [306, 103, 1.1, 1], [336, 110, 1, 1]];
  const raw = (x) => { let h = 999; for (const [px, py, sl, sr] of picos) h = Math.min(h, py + (x < px ? (px - x) * sl : (x - px) * sr)); return h; };
  const top = new Int16Array(W + 2);
  for (let x = -1; x <= W; x++) top[x + 1] = Math.min(SKY_ROWS - 1, Math.round(raw(x) + (vnoise(x * 0.4, 3.3) - 0.5) * 3));
  const LX = 150;
  for (let x = 0; x < W; x++) {
    const t0 = top[x + 1], sl = top[x + 2] - top[x];
    const lit = x < LX ? sl < 0 : sl > 0, flat = sl === 0;
    const snow = 112.5 + (vnoise(x * 0.3, 8) - 0.5) * 4;
    for (let y = t0; y < H; y++) {
      let c; const depth = y - t0;
      if (y < snow) {
        const tex = vnoise(x * 0.9, y * 0.35 + 4) > 0.62;
        c = lit ? (depth === 0 ? FARC[5] : tex ? FARC[3] : FARC[4]) : (depth === 0 && !flat ? FARC[4] : tex ? FARC[2] : FARC[3]);
        if (y > snow - 1.5 && b2(x, y) > 0.5) c = lit ? FARC[2] : FARC[1];
      } else {
        c = lit ? (depth < 2 ? FARC[3] : FARC[2]) : (depth === 0 ? FARC[2] : FARC[1]);
        if (!lit && depth > 1 && vnoise(x * 0.7, y * 0.5) > 0.7) c = FARC[0];
        if (lit && depth > 3 && vnoise(x * 0.8, y * 0.4 + 2) > 0.66) c = FARC[1];
      }
      if (y > 120) { const hz = (y - 120) / 8; if (hz > b4(x, y)) c = hz > 0.6 + 0.4 * b2(x, y) ? MIST[0] : FARC[2]; }
      ESTATICO0[y * W + x] = c;
    }
  }
  // bruma al pie de las montañas (fija)
  for (let y = 120; y < 136; y++) {
    const env = 1 - ((y - 128) / 8) ** 2;
    if (env <= 0) continue;
    for (let x = 0; x < W; x++) {
      const X = (x - 30) / 13, d = (0.7 * vnoise(X + 40, y / 4) + 0.3 * vnoise(X * 2.5, y / 2 + 3)) * env;
      if (d < 0.36) continue;
      if (d > 0.5 || b2(x, y) > 0.5) ESTATICO0[y * W + x] = d > 0.55 ? MIST[1] : MIST[0];
    }
  }
  // colinas medias con pinos (del demo)
  const midTop = (x) => Math.round(133 + 2.4 * Math.sin(x * 0.045 + 0.8) + 1.5 * Math.sin(x * 0.12 + 2));
  const m = new Uint8Array(W * H);
  const plot = (x, y, v) => { if (x >= 0 && x < W && y >= 0 && y < H) m[y * W + x] = v; };
  for (let x = 0; x < W; x++) for (let y = midTop(x); y < LAGO_Y; y++) m[y * W + x] = 1;
  const rp = mulberry32(7);
  for (let x = -12; x < W + 12;) {
    const h = 8 + Math.floor(rp() * 9), base = midTop(x) + 1, lean = rp() < 0.5 ? 0 : 1;
    for (let r = 0; r < h; r++) {
      const hw = r >= h - 2 ? 0 : Math.floor((r % 4) * 0.55 + r * 0.24 + 0.25);
      for (let k = -hw; k <= hw + (hw > 1 ? lean : 0); k++) plot(x + k, base - h + r, 2);
    }
    x += 4 + Math.floor(rp() * 8);
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x; if (!m[i]) continue;
    const up = y > 0 ? m[i - W] : 0, side = x < LX ? m[i + 1] : m[i - 1], opp = x < LX ? m[i - 1] : m[i + 1];
    ESTATICO0[i] = m[i] === 2 ? ((!up || (!side && opp)) ? MIDC[3] : MIDC[0]) : (!up ? MIDC[2] : (y - midTop(x) < 2 && b2(x, y) > 0.5 ? MIDC[2] : MIDC[1]));

  // loma del primer plano
  const rf = mulberry32(5);
  for (let x = 0; x < W; x++) {
    const t0 = fgTop(x), sl = fgTop(x + 1) - fgTop(x - 1);
    for (let y = t0; y < H; y++) {
      const d = y - t0;

}
const HIERBA = [];
{
  const rnd = mulberry32(99);
  for (let x = 0; x < W; x += 1 + Math.floor(rnd() * 3)) { if (rnd() < 0.45) continue; HIERBA.push({ x, h: 1 + Math.floor(rnd() * 3), ph: rnd() < 0.5 ? 0 : 1 }); }

// lago: refleja lo pintado sobre la orilla, con ondas que cambian a fotogramas
function dibujarLago(f) {
  const ph = f * 0.42;
  for (let y = LAGO_Y; y < H; y++) {
    const dy = y - LAGO_Y, ym = LAGO_Y - 1 - Math.floor(dy * 1.4);
    const off = dy < 2 ? 0 : Math.round(Math.sin(ph * 2 + dy * 1.7));
    const rs = Math.floor(hash2(y, 41) * 5);
    for (let x = 0; x < W; x++) {
      let v = 3.0 - dy * 0.12;
      if (ym >= 0) {
        const c = dst[ym * W + clamp(x + off, 0, W - 1)];
        v += ((((c & 255) * 0.3 + ((c >>> 8) & 255) * 0.59 + ((c >>> 16) & 255) * 0.11) / 255) - 0.2) * 7;
      }

    const R = s.tint === 1 ? WARM : s.tint === 2 ? COOL : null;
    if (s.type === 0) { if (tw) pset(s.x, s.y, STAR[1]); }
    else if (s.type === 1) pset(s.x, s.y, R ? R[1 + tw] : STAR[2 + tw]);
    else {
      pset(s.x, s.y, R ? R[2] : STAR[4]);
      if (tw) { const g = R ? R[0] : STAR[1]; pset(s.x - 1, s.y, g); pset(s.x + 1, s.y, g); pset(s.x, s.y - 1, g); pset(s.x, s.y + 1, g); }

  for (let i = LAGO_Y - 30; i < H; i++) for (let x = 0; x < W; x++) { const c = FG0[i * W + x]; if (c) dst[i * W + x] = c; }

    const base = fgTop(g.x) - 1;

// ── la persona: formas rasterizadas a 1× con contorno, sombreado en rampas y luz de Atom ──
const dCirc = (x, y, cx, cy, r) => Math.hypot(x - cx, y - cy) - r;
function dCap(x, y, ax, ay, bx, by, ra, rb = ra) {

const MATS = { 1: SKIN, 2: HAIR, 3: SHIRT, 4: PANTS, 5: SHOE };
const BASE_MAT = { 1: 4, 2: 2.4, 3: 2.6, 4: 2.2, 5: 1.2 };
// piezas en orden de prioridad (la primera que contiene el píxel manda)
function piezasPersona(res) {

  const dpr = captura ? 1 : Math.min(window.devicePixelRatio || 1, 2);
  const vw = window.innerWidth, vh = window.innerHeight;
  const cw = Math.max(1, Math.round(vw * dpr)), ch = Math.max(1, Math.round(vh * dpr));
  lienzo.width = cw; lienzo.height = ch;
  lienzo.style.width = vw + 'px'; lienzo.style.height = vh + 'px';
  const s = Math.min(cw / W, ch / H);
  const w = Math.round(W * s), h = Math.round(H * s);
  vista = { s, w, h, x: Math.floor((cw - w) / 2), y: Math.floor((ch - h) / 2), cw, ch };
  const k = Math.ceil(s - 1e-6);
  if (Math.abs(s - Math.round(s)) < 1e-6 || s < 1) medio = null;
  else { medio = document.createElement('canvas'); medio.width = W * k; medio.height = H * k; mctx = medio.getContext('2d'); }
}
function presentar() {
  bctx.putImageData(imagen, 0, 0);
  ctx.fillStyle = '#04050d';
  ctx.fillRect(0, 0, vista.cw, vista.ch);
  if (!medio) {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(bajo, 0, 0, W, H, vista.x, vista.y, vista.w, vista.h);
  } else {
    mctx.imageSmoothingEnabled = false;
    mctx.drawImage(bajo, 0, 0, medio.width, medio.height);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(medio, 0, 0, medio.width, medio.height, vista.x, vista.y, vista.w, vista.h);
  }
}
function dibujar(t) { render(t); presentar(); }

ajustar();
if (!captura) window.addEventListener('resize', ajustar);
window.__pixel = { SALTO, LLEGA };
dibujar(0);
E.iniciar(dibujar);
</script>
