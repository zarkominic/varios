<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Miniatura · ep18</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// SI-MINIATURA · la miniatura del episodio 18 (se captura en t = 1, 1280 × 720). Dos mundos partidos por una diagonal:
// a la izquierda, el castillo de cuento con el caballerito al doble cayendo al foso con un «chof»; a la derecha, la
// pantalla de la muerte con el cuadro y la calavera que guiña. Abajo, el disquete con ojos al doble, corriendo a guardar
// con cara de susto. Arriba en el centro, «100» y una calavera (cien maneras de morir). Sin palabras.
import { crearRoma } from '/atomo/plato/kits/pixel-roma.js';
import { conChibi, ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
import { hex } from '/atomo/plato/kits/pixel-retro.js';
import * as T from '/atomo/plato/escenas/si-comun.js';
const R = conChibi(await crearRoma(document.getElementById('lienzo')));
const izq = R.nuevo(), der = R.nuevo(), pj = R.nuevo(), VACIO = 0x01020304;
const corte = (y) => 168 + Math.round((179 - y) * 0.22);   // la diagonal: arriba más a la derecha
const pon = (src, sx0, sx1, sy0, sy1, dx, dy, s = 2) => { for (let y = sy0; y <= sy1; y++) for (let x = sx0; x <= sx1; x++) { const c = src[y * 320 + x]; if (c === VACIO) continue; R.rect(dx + (x - sx0) * s, dy + (y - sy0) * s, dx + (x - sx0) * s + s - 1, dy + (y - sy0) * s + s - 1, c); } };
const dibujar = (t) => {
  let prev = R.usar(izq); T.reino(R, t, { encuadre: 'castillo', salpicon: 0.3, salpiconX: 106, salpiconY: 142 });
  R.usar(der); T.muerte(R, t, { encuadre: 'pantalla', camara: 'cerca', guino: 1 });
  R.usar(pj); pj.fill(VACIO); R.actor(EL.graham, 12, 60, 0.5, { dir: 1, sorpresa: true, brazos: true, quieto: true });
  R.usar(prev);
  const B = R.buf;
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) B[y * 320 + x] = x < corte(y) ? izq[y * 320 + x] : der[y * 320 + Math.max(0, x - 112)];
  for (let y = 0; y < 180; y++) { const x = corte(y); R.pset(x - 1, y, T.C.k); R.pset(x, y, T.C.hueso); R.pset(x + 1, y, T.C.hueso); R.pset(x + 2, y, T.C.k); }
  // el caballerito al doble, en el aire sobre el foso, un poco ladeado: cae
  pon(pj, 6, 34, 30, 61, 76, 62, 2);
  // el disquete con ojos al doble, corriendo a guardar con cara de susto
  T.disquete(R, 214, 172, t, { s: 2, corre: 1, dir: 1, expresion: 'susto' });
  // arriba: «100» y una calavera pequeña
  const x0 = 98, y0 = 14, x1 = 196, y1 = 50, oro = hex('#e8b830'), oroS = hex('#8a5a10'), fondo = hex('#1a1030');
  R.rect(x0 - 2, y0 - 2, x1 + 2, y1 + 2, T.C.k); R.rect(x0 - 1, y0 - 1, x1 + 1, y1 + 1, oroS); R.rect(x0, y0, x1, y1, oro); R.rect(x0 + 3, y0 + 3, x1 - 3, y1 - 3, fondo);
  R.numero('100', x0 + 36, y1 - 7, { tam: 26, centro: true });
  const cx = 176, cy = 32, hueso = T.C.hueso, hS = T.C.huesoS;
  R.disco(cx, cy - 3, 9, hueso); R.rect(cx - 6, cy + 3, cx + 6, cy + 9, hueso); R.rect(cx - 6, cy + 8, cx + 6, cy + 9, hS);
  R.disco(cx - 4, cy - 3, 3, fondo); R.rect(cx + 2, cy - 3, cx + 7, cy - 2, fondo); R.rect(cx - 1, cy + 1, cx + 1, cy + 3, fondo);
  for (let i = -1; i <= 1; i++) R.rect(cx + i * 3, cy + 7, cx + i * 3, cy + 9, fondo);
};
window.__frame = async (t) => { dibujar(t); R.presentar(); };
window.__listo = true;
</script>
</body>
</html>
