// CONTINUIDAD

const T0 = performance.now();
window.__carga = [];

const E = await escena('ep3-mapa', 'ep03');
const M = (k) => E.marca(k);
const m = { il: M('ilustracion', 0.5), ilFin: M('ilustracion_fin', 10.264), so: M('sofa', 10.814), soFin: M('sofa_fin', 17.156) };
const D = E.duracion, QUIETO = D - 0.6;

// ---------------------------------------------------------------- tiempos (todo sale de las marcas)
const T = {

  lienzo: [m.il - 0.2, m.il + 0.6],                     // la trama del lienzo

T.empuje = [m.il + 0.7, T.B];                           // la cámara se acerca despacio al cuadro

const LA = T.B - m.il;
T.pincel = { entra: [m.il + 0.20 * LA, m.il + 0.33 * LA], toca: m.il + 0.37 * LA, pinta: [m.il + 0.39 * LA, m.il + 0.53 * LA], sale: [m.il + 0.57 * LA, m.il + 0.78 * LA] };
// el mapa: puntos uno a uno y cada vez más deprisa; nubes; al final, la espiral entera

// ---------------------------------------------------------------- piezas propias (sencillas)
// el marco dorado: un aro rectangular de moldura dorada (hueco de 1 × 0,842; moldura de 0,07: un filete, una fila de
// perlas, una media caña hundida y un bocel), con una roseta en cada esquina
const MARCO = { radio: 0.8, glifos: [], glsl: /* glsl */`
const float MH = 0.421;
float mcAlto(float u) {
  float h = 0.013;
  h += 0.028 * sin(3.1416 * clamp((u - 0.045) / 0.025, 0.0, 1.0));
  h -= 0.006 * sin(3.1416 * clamp((u - 0.024) / 0.021, 0.0, 1.0));
  return h;
}
float pz_marco(vec3 q, vec4 T, out float m) {
  vec2 b = vec2(0.5, MH);
  float u = sdRoundRect(q.xy, b, 0.004);              // > 0 fuera del hueco: lo ancho de la moldura
  float d = max(abs(u - 0.035) - 0.035, max(q.z - mcAlto(u), -q.z - 0.02)) * 0.85;
  // las perlas, a lo largo del canto de dentro
  float tt = (abs(q.x) - b.x > abs(q.y) - b.y) ? q.y : q.x;
  float cel = (fract(tt / 0.021 + 0.5) - 0.5) * 0.021;
  float perla = length(vec3(cel, u - 0.017, q.z - 0.015)) - 0.0068;
  m = 0.0;
  if (perla < d) m = 1.0;
  d = min(d, perla);
  // rosetas en las esquinas de fuera
  vec2 c = abs(q.xy) - (b + 0.035);
  float an = atan(c.y, c.x);
  float ro = length(vec3(c, (q.z - 0.03) * 1.3)) - 0.03 - 0.006 * sin(an * 8.0);
  if (ro < d) m = 2.0;
  return smin(d, ro, 0.008);
}
float pzc_marco(vec3 q, vec4 T) { vec2 b = vec2(0.5, MH); float u = sdRoundRect(q.xy, b, 0.004); return max(abs(u - 0.035) - 0.03, abs(q.z - 0.004) - 0.014); }
vec3 pzcol_marco(vec3 q, vec4 T, float m) {
  vec2 b = vec2(0.5, MH);
  float u = sdRoundRect(q.xy, b, 0.004);
  vec3 oro = vec3(0.52, 0.33, 0.085) * (0.9 + 0.16 * vnoise(q * 70.0));
  // la media caña, más oscura (el oro viejo se queda en los huecos); estrías finas en el bocel
  float cana = sin(3.1416 * clamp((u - 0.024) / 0.021, 0.0, 1.0));
  oro *= 1.0 - 0.45 * cana;
  oro *= 0.94 + 0.08 * sin(u * 1400.0) * step(0.047, u);
  if (m > 0.5) oro = vec3(0.58, 0.37, 0.10);
  gBri = 3.0;
  return oro;
}
` };
// el pincel: la punta en el origen, el mango hacia +y (pelo de 0 a 0,22, virola de latón hasta 0,37, mango hasta 1,5)
const PINCEL = { radio: 1.6, glifos: [], glsl: /* glsl */`
float pz_pincel(vec3 q, vec4 T, out float m) {
  // el pelo: un mechón que se afina hacia la punta (y se dobla un poco al apretar: T.x)
  vec3 p = q;
  float apr = T.x;
  p.x -= apr * 0.05 * (1.0 - smoothstep(0.0, 0.2, p.y)) * (1.0 - smoothstep(0.0, 0.2, p.y));
  float pelo = capsulaC(p, vec3(0.0, 0.012, 0.0), vec3(0.0, 0.23, 0.0), 0.012 + 0.02 * apr, 0.05);
  float vir = capsulaC(q, vec3(0.0, 0.22, 0.0), vec3(0.0, 0.38, 0.0), 0.05, 0.047);
  vir -= 0.004 * smoothstep(0.004, 0.0, abs(q.y - 0.3) - 0.008);
  float mango = capsulaC(q, vec3(0.0, 0.38, 0.0), vec3(0.0, 1.48, 0.0), 0.05, 0.024);
  mango = smin(mango, capsulaC(q, vec3(0.0, 0.4, 0.0), vec3(0.0, 0.62, 0.0), 0.058, 0.05), 0.04);
  float d = pelo; m = 0.0;
  if (vir < d) { d = vir; m = 1.0; }
  if (mango < d) { d = mango; m = 2.0; }
  return d;
}
float pzc_pincel(vec3 q, vec4 T) { return capsulaC(q, vec3(0.0, 0.05, 0.0), vec3(0.0, 1.45, 0.0), 0.02, 0.02); }
vec3 pzcol_pincel(vec3 q, vec4 T, float m) {
  if (m > 1.5) { gBri = 2.0; return vec3(0.30, 0.075, 0.035) * (0.9 + 0.1 * vnoise(q * 30.0)); }      // mango lacado
  if (m > 0.5) { gBri = 3.0; return vec3(0.47, 0.30, 0.085) * (0.9 + 0.2 * vnoise(q * 40.0)); }      // virola de latón
  // el pelo: crema, con la pintura de luz (ámbar clara) en la punta
  float pin = 1.0 - smoothstep(0.07, 0.12, q.y);
  vec3 c = mix(vec3(0.42, 0.33, 0.20), vec3(0.95, 0.72, 0.36), pin);
  gEm = vec3(0.30, 0.17, 0.05) * pin;
  gBri = 0.8;
  return c * (0.9 + 0.15 * sin(atan(q.z, q.x) * 30.0));
}
` };
// el satélite: cuerpo de lámina dorada, dos alas de paneles solares, un telescopio (de cara a +z) y una antenita
const SATELITE = { radio: 1.5, glifos: [], glsl: /* glsl */`
float pz_satelite(vec3 q, vec4 T, out float m) {
  float cuerpo = sdRoundBox(q, vec3(0.2, 0.24, 0.2), 0.03);
  // lámina arrugada (en la forma, muy poco)
  cuerpo -= 0.006 * vnoise(q * 18.0);
  vec3 a = vec3(abs(q.x), q.y, q.z);
  float brazo = sdCapsule(a, vec3(0.2, 0.0, 0.0), vec3(0.36, 0.0, 0.0), 0.02);
  float ala = sdRoundBox(a - vec3(0.86, 0.0, 0.0), vec3(0.5, 0.26, 0.012), 0.008);
  float tubo = max(length(q.xy - vec2(0.0, 0.04)) - 0.12, abs(q.z - 0.32) - 0.13);
  tubo = max(tubo, -(length(q.xy - vec2(0.0, 0.04)) - 0.095) * step(0.36, q.z));
  float plato = max(abs(length(q - vec3(0.0, 0.5, -0.05)) - 0.16) - 0.012, q.y - 0.43);
  plato = min(plato, sdCapsule(q, vec3(0.0, 0.24, -0.05), vec3(0.0, 0.36, -0.05), 0.012));
  float d = cuerpo; m = 0.0;
  if (brazo < d) { d = brazo; m = 1.0; }
  if (ala < d) { d = ala; m = 2.0; }
  if (tubo < d) { d = tubo; m = 3.0; }
  if (plato < d) { d = plato; m = 4.0; }
  return d;
}
float pzc_satelite(vec3 q, vec4 T) { vec3 a = vec3(abs(q.x), q.y, q.z); return min(sdRoundBox(q, vec3(0.18, 0.22, 0.18), 0.02), sdRoundBox(a - vec3(0.86, 0.0, 0.0), vec3(0.48, 0.24, 0.006), 0.004)); }
vec3 pzcol_satelite(vec3 q, vec4 T, float m) {
  if (m > 3.5) { gBri = 1.6; return vec3(0.58, 0.54, 0.46); }
  if (m > 2.5) {
    // el tubo, crema; la lente, oscura con un aro ámbar
    float r = length(q.xy - vec2(0.0, 0.04));
    if (q.z > 0.43 && r < 0.1) { gBri = 3.0; gEm = vec3(0.10, 0.05, 0.015) * T.x; return vec3(0.02, 0.03, 0.05); }
    gBri = 1.4; return vec3(0.58, 0.54, 0.46) * (0.95 + 0.06 * vnoise(q * 30.0));
  }
  if (m > 1.5) {
    // paneles: celdas azul pizarra con rejilla crema y marco de latón
    vec3 a = vec3(abs(q.x) - 0.86, q.y, q.z);
    vec2 g = abs(fract(vec2(a.x * 6.0, a.y * 6.0) + 0.5) - 0.5);
    float rej = 1.0 - smoothstep(0.03, 0.06, min(g.x, g.y));
    float borde = step(0.47, abs(a.x)) + step(0.235, abs(a.y));
    vec3 c = mix(vec3(0.05, 0.075, 0.14), vec3(0.45, 0.42, 0.36), 0.55 * rej);
    if (borde > 0.5) c = vec3(0.47, 0.30, 0.085);
    gBri = 2.6;
    return c;
  }
  if (m > 0.5) { gBri = 3.0; return vec3(0.47, 0.30, 0.085); }
  // lámina dorada arrugada
  gBri = 3.0;
  gG = vec3(vnoise(q * 25.0) - 0.5, vnoise(q * 25.0 + 3.1) - 0.5, vnoise(q * 25.0 + 6.2) - 0.5) * 0.06;
  return vec3(0.60, 0.38, 0.09) * (0.82 + 0.3 * vnoise(q * 14.0));
}
` };
// la antena de radio: un plato (paraboloide) que mira a +y, con su bocina en el foco y tres patas, sobre una horquilla y
// un pie (el pie hasta y = −0,95); T.x: el giro del plato hacia arriba/abajo (radianes, alrededor de x)
const ANTENA = { radio: 1.25, glifos: [], glsl: /* glsl */`
float pz_antena(vec3 q, vec4 T, out float m) {
  // el pie y la horquilla (no giran)
  float pie = capsulaC(q, vec3(0.0, -0.95, 0.0), vec3(0.0, -0.32, 0.0), 0.15, 0.09);
  pie = smin(pie, sdRoundBox(q - vec3(0.0, -0.92, 0.0), vec3(0.3, 0.04, 0.3), 0.03), 0.04);
  vec3 a = vec3(abs(q.x), q.y, q.z);
  float hor = sdRoundBox(a - vec3(0.2, -0.2, 0.0), vec3(0.03, 0.14, 0.05), 0.015);
  hor = smin(hor, sdRoundBox(q - vec3(0.0, -0.32, 0.0), vec3(0.23, 0.035, 0.06), 0.015), 0.02);
  // el plato, girado T.x alrededor de x por el eje de la horquilla (y = −0,12)
  vec3 p = q - vec3(0.0, -0.12, 0.0);
  float c = cos(T.x), s = sin(T.x);
  p.yz = mat2(c, s, -s, c) * p.yz;
  float r = length(p.xz);
  float y0 = r * r / (4.0 * 0.32);                       // paraboloide de foco 0,32
  float plato = max(abs(p.y - y0 - 0.02) * 0.75 - 0.016, r - 0.62);
  float cuello = capsulaC(p, vec3(0.0, -0.02, 0.0), vec3(0.0, 0.06, 0.0), 0.08, 0.06);
  float boc = capsulaC(p, vec3(0.0, 0.27, 0.0), vec3(0.0, 0.37, 0.0), 0.035, 0.05);
  float patas = 1e5;
  for (int k = 0; k < 3; k++) {
    float an = 6.2832 * float(k) / 3.0 + 0.5;
    patas = min(patas, sdCapsule(p, vec3(cos(an) * 0.58, 0.29, sin(an) * 0.58), vec3(0.0, 0.3, 0.0), 0.011));
  }
  float d = pie; m = 0.0;
  if (hor < d) { d = hor; m = 0.0; }
  d = min(d, hor);
  if (plato < d) { d = plato; m = 1.0; }
  if (cuello < d) { d = cuello; m = 2.0; }
  if (boc < d) { d = boc; m = 2.0; }
  if (patas < d) { d = patas; m = 2.0; }
  return d;
}
float pzc_antena(vec3 q, vec4 T) { return capsulaC(q, vec3(0.0, -0.9, 0.0), vec3(0.0, -0.35, 0.0), 0.12, 0.07); }
vec3 pzcol_antena(vec3 q, vec4 T, float m) {
  if (m > 1.5) { gBri = 3.0; return vec3(0.47, 0.30, 0.085); }
  if (m > 0.5) {
    // el plato: crema con las juntas de los paneles (anillos y radios)
    vec3 p = q - vec3(0.0, -0.12, 0.0);
    float c = cos(T.x), s = sin(T.x);
    p.yz = mat2(c, s, -s, c) * p.yz;
    float r = length(p.xz), an = atan(p.z, p.x);
    float j = max(1.0 - smoothstep(0.004, 0.009, abs(fract(r * 6.0) - 0.5) / 6.0 * 1.0 + 0.0), 1.0 - smoothstep(0.004, 0.01, abs(fract(an * 1.9099) - 0.5) * r * 0.5));
    gBri = 1.5;
    return vec3(0.60, 0.56, 0.48) * (1.0 - 0.25 * j) * (0.95 + 0.06 * vnoise(q * 20.0));
  }
  gBri = 1.2;
  return vec3(0.42, 0.13, 0.06) * (0.9 + 0.12 * vnoise(q * 12.0));
}
` };

// ---------------------------------------------------------------- el plató
// (continuidad) la persona, la regla y su flecha en los huecos 0, 1 y 2, como en ep3-tierra y ep3-sol
const I = { PER: 0, REG: 1, FLE: 2, VEN: 3, SOFA: 4, BOL: 5, REL: 6, MARCO: 7, PIN: 8, SAT: 9, ANT: 10, LUNA: 11 };
const IS = { persona: I.PER, ventana: I.VEN, sofa: I.SOFA, bol: I.BOL, reloj: I.REL };
await cargarFuenteCartela();
const P = await crearPlato({

const RAYAS = hornearRayas();
const en = (sx, sy, z) => P.punto(sx, sy, z);

const pxU = (pos) => { const a = pant(pos), b = pant([pos[0] + 1, pos[1], pos[2]]); return Math.hypot(b[0] - a[0], b[1] - a[1]); };

// ---------------------------------------------------------------- capas: el mundo (oculto) y el lienzo 2D encima
const cont = document.getElementById('escena');
const mundo = crearMundo(cont, { captura: P.captura });
mundo.lienzo.style.visibility = 'hidden';
marcaCarga('mundo');
const lienzoGL = P.renderer.domElement;
lienzoGL.style.visibility = 'hidden';
const capa = document.createElement('canvas');
capa.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;display:block;z-index:3';

  const L = (pts) => { let s = 0; for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return s; };
  if (u1 > 0) rayo(gg, ida, { hasta: u1 * L(ida), grosor: 5, cabeza: u1 < 1 ? 1 : 0 });
  if (u2 > 0) rayo(gg, vuelta, { hasta: u2 * L(vuelta), grosor: 5, cabeza: u2 < 1 ? 1 : 0 });
  gg.restore();
}
function salonCompuesto(n, ts, cual) {
  const S = F(cual);
  const h = S.info.ventana.hueco;
  const tc = Math.min(ts, TQ);
  cieloVentana(g, h, { t: tc, rayas: RAYAS, encima: cual === 'cerca' ? (gg) => tierraLuna(gg, h, ts) : null });
  g.drawImage(S.foto, 0, 0, W, H);
  vidrioVentana(g, h);
  sombrasPresentador(0.8);
  P.limpiar();
  let min = 0, rel = null;
  if (cual === 'cerca') {
    const u = prog(ts, T.reloj[0], T.reloj[1]);
    min = 60 * eio(u);
    if (u > 0) rel = salonReloj(min);
  }
  atomo(ts);
  reglaEn();
  P.render(n, { fondo: false });
  pegarGL();
  if (rel) relojAmbar(g, rel, min);
}
// el reloj de la pared, en vivo (encima de su foto): las agujas y la cuña de la hora que pasa
function salonReloj(min) {
  return salon(P, { reloj: I.REL }, { encuadre: 'cerca', reloj: { minutos: min, sector: min > 0.2 ? [0, min] : null } }).reloj;
}
// ---------------------------------------------------------------- al cargar: las fotos y los estrenos
F('marco');
marcaCarga('marco');
F('tierra'); F('luna');
marcaCarga('tierra y luna');
F('cerca');
marcaCarga('salón cerca');
F('general');
marcaCarga('salón general');
// (coste) se estrenan los programas de lo que va en vivo (su primer dibujo compila en SwiftShader)
P.fotograma(0); P.limpiar();
atomo(0); reglaEn();
P.pieza(I.PIN, { pos: en(100, 100, 2), escala: 0.05 });
P.pieza(I.SAT, { pos: en(200, 100, 2), escala: 0.05 });
P.pieza(I.ANT, { pos: en(300, 100, 2), escala: 0.05 });
P.render(0, { fondo: false });
marcaCarga('estrenos');

// ---------------------------------------------------------------- dibujar
function dibujar(t) {
  ajustarCapa();
  const n = P.fotograma(t, D), ts = n / 12;
  g.fillStyle = '#05060b'; g.fillRect(0, 0, W, H);
  let plano;
  if (ts < T.B) { tramo1(n, ts); plano = 'cuadro'; }
  else if (ts < T.C1) { tramo2(n, ts); plano = 'mapa'; }
  else if (ts < T.C2) { salonCompuesto(n, ts, 'cerca'); plano = 'cerca'; }
  else { salonCompuesto(n, ts, 'general'); plano = 'general'; }
  parpadeo(n);
  POST.aplicar(g, n);
  window.__plano = plano;
}
window.__fin = {
  final: 'cieloVentana(t = TQ) + foto de salon(P, I, { encuadre: "general", reloj: { minutos: 60, sector: [0, 60] } }) con relojAmbar(60) y luzSalon(foco: la cabeza) + vidrioVentana + sombrasPresentador(0,8); regla e 21; Atom (230, 780); parpadeo y crearPost',
  TQ, n: Math.floor((D - QUIETO_KIT) * 12 + 1e-6), tiempos: T,
  atomo: (() => { const S = estadoAtom(D); return { tz: S.tz, ta: tabla(TA, D) }; })(),
};
marcaCarga('listo');
E.iniciar(dibujar, { paso: 1 / 12 });
