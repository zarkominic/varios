<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ep38 · miniatura del Short 1</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// MC-SHORT1-MINIATURA · ep38, vertical: todo lo que cuenta en la columna central (x 110–210), que es lo que queda en 9:16.
// El gancho: el Mary Celeste solo en el Atlántico gris, centrado; Deveau al doble, delante, con el catalejo bajado.
import { crearRoma } from '/atomo/plato/kits/pixel-roma.js';
import { conChibi, ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
import * as T from '/atomo/plato/escenas/mc-comun.js';
import { figura, grado, halo, cifra, desplazar } from '/atomo/plato/escenas/mini-chibi.js';
const R = conChibi(await crearRoma(document.getElementById('lienzo')));
const H = (c) => (0xff000000 | (parseInt(c.slice(5, 7), 16) << 16) | (parseInt(c.slice(3, 5), 16) << 8) | parseInt(c.slice(1, 3), 16)) >>> 0;
const K = H('#0c0c12');
const catalejo = (R, [x, y]) => {
  x -= 2; y -= 1; const inc = -2;
  R.linea(x - 3, y + 1, x + 10, y + 1 + inc, K); R.linea(x - 3, y, x + 10, y + inc, H('#a8822e'));
  R.linea(x - 3, y - 1, x + 10, y - 1 + inc, H('#e8c860')); R.linea(x - 3, y - 2, x + 10, y - 2 + inc, K);
  R.rect(x + 3, y - 2, x + 3, y + 1, K);
  R.rect(x + 9, y - 3 + inc, x + 11, y + 2 + inc, K); R.rect(x + 10, y - 2 + inc, x + 10, y + 1 + inc, H('#f2e4a0'));
  R.pset(x + 1, y - 1, H('#fff6d0')); R.pset(x + 6, y - 2, H('#fff6d0'));
};
const dibujar = (t) => {
  const o = { encuadre: 'alta', luz: 'gris', velas: 'pocas', bandazo: 0.5 };
  T.mar(R, t, o); T.marDelante(R, t, o); desplazar(R, -30);
  grado(R, { tinte: '#16222e', f: 0.2, desde: 0.55, max: 0.6 });
  halo(R, 160, 95, 60, 60, '#f4ecd8', 0.24);
  halo(R, 150, 160, 36, 40, '#9ac0e0', 0.30);
  figura(R, EL.deveauMC, 144, 200, t, { dir: 1, sorpresa: true, sostiene: [73, 81], cosa: catalejo }, 2);
  cifra(R, '1872', 132, 16, 14);
};
window.__frame = async (t) => { dibujar(t); R.presentar(); };
window.__listo = true;
</script>
</body>
</html>
