  for (let y = 130; y < 180; y++) for (let x = 0; x < 320; x++) { const n = az(x * 2.1 + y * 5.3); R.pset(x, y, n < 0.14 ? H('#6a7a34') : n > 0.9 ? H('#c8a048') : (x + (y >> 1)) % 7 === 0 ? H('#8a7c5a') : y % 6 === 0 && (x & 3) === 1 ? H('#9a8a64') : H('#8a9248')); }
});
// la multitud en filas de bustos (de atrás adelante): o.viva ríen, saludan, tiran el tricornio, agitan banderitas
const TIPOS3 = ['peluca', 'rizos', 'mujer', 'calvo', 'marinero'], ROPA3 = ['#2a3a6a', '#7a5a3a', '#5a7a4a', '#8a2a2a', '#3a3a4a', '#c8a060', '#5a3a6a', '#2a5a5a'], PELO3 = ['#e8e4dc', '#5a3418', '#8a5428', '#2a1c14', '#c8904c'];
const hh3 = (k, f, n) => az(k * 31.7 + f * 7.3 + n * 1.91);
const multitud3 = (t, viva, ve) => { const K = H('#140c18');
  for (let fila = 0; fila < 5; fila++) for (let k = 0; k < 27; k++) {
    const x = Math.round(k * 12.2 - 8 + (fila % 2) * 6 + (hh3(k, fila, 4) - 0.5) * 5);
    if (fila < 4 && x + 9 > MX - 15 && x < MX + 8) continue;   // el hueco alrededor del pie del mástil (la fila de delante pasa por delante)

  // marinero, quedan las muescas claras que han abierto los tacos
  const sube = R.easeIO(tramo(t, P3 - 0.1, cambia - 0.2)), resb = tramo(t, P3 + 0.25, P3 + 0.6), dy = Math.round(Math.sin(resb * Math.PI) * 7);
  const y = Math.round(lerp(190, 78, sube)) + dy, arriba = sube >= 1;
  for (let yy = 26; yy < 180; yy++) { const w = yy < 60 ? 2 : 3, g = (yy * 2 + Math.floor(t * 20)) % 31;
    for (let i = -w; i <= w; i++) R.pset(MX + i, yy, i === -w ? H('#1c120a') : i === w ? H('#140c06') : i === w - 1 ? H('#2e1e12') : H('#3e2a1a'));
    // la grasa: un brillo húmedo continuo por el canto que da la luz, con destellos que bajan, y un reflejo tenue enfrente
    R.pset(MX - w + 1, yy, g < 5 ? H('#fffbe0') : g < 9 ? H('#f0e2a8') : H('#c8b078')); if (g < 3) R.pset(MX - w + 2, yy, H('#e0d098'));
    if (yy % 4 !== 0) R.pset(MX + w - 1, yy, H('#5a4a30')); }
  // goterones de grasa que resbalan por los dos cantos (un bulto claro que baja y deja el reguero)
  for (let k = 0; k < 4; k++) { const u = (t * 0.35 + k / 4) % 1, gy = Math.round(36 + k * 13 + u * 70), lado = k % 2 ? 1 : -1, ex = MX + lado * 4;
    R.pset(ex, gy, H('#e8d898')); R.pset(ex, gy + 1, H('#fff4c8')); R.pset(ex, gy - 1, H('#c8b078')); R.pset(ex, gy - 2, H('#a89060')); }

  for (let yy = y + 5, k = 0; yy < 180; yy += 6 + (k % 3), k++) { const nx = k % 2 ? MX : MX - 2; R.pset(nx, yy, H('#d8aa70')); R.pset(nx + 1, yy, H('#b88a58')); R.pset(nx, yy + 1, H('#1c120a')); }
