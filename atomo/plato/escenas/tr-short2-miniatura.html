<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Miniatura vertical · ep23 Short 2</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// TR-SHORT2-MINIATURA · miniatura vertical del Short 2 del ep23, «En Babilonia abofeteaban al rey cada Año Nuevo». En el
// templo de Babilonia, el rey al triple, de rodillas no: de pie, sin corona, con cara triste y una lágrima; la corona
// cae a su lado; arriba, «4000» dorado (los años de la fiesta) y, al lado de la cara, un «!» de golpe cómico.
// Todo lo que cuenta va en la columna central x 110–210 (lo que queda en 9:16). Sin palabras: solo cifras y símbolos.
import { crearRoma } from '/atomo/plato/kits/pixel-roma.js';
import { conChibi, ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
import { hex } from '/atomo/plato/kits/pixel-retro.js';
import * as T from '/atomo/plato/escenas/tr-comun.js';
const R = conChibi(await crearRoma(document.getElementById('lienzo')));
const fondo = R.nuevo(), pj = R.nuevo(), tmp = R.nuevo(), VACIO = 0x01020304, K = hex('#0c0814');
const pon = (src, sx0, sx1, sy0, sy1, dx, dy, s = 2) => { for (let y = sy0; y <= sy1; y++) for (let x = sx0; x <= sx1; x++) { const c = src[y * 320 + x]; if (c === VACIO) continue; R.rect(dx + (x - sx0) * s, dy + (y - sy0) * s, dx + (x - sx0) * s + s - 1, dy + (y - sy0) * s + s - 1, c); } };
const contorno = (b, c = K) => { const m = b.slice(); for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) { if (m[y * 320 + x] !== VACIO) continue; if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, d]) => { const X = x + a, Y = y + d; return X >= 0 && X < 320 && Y >= 0 && Y < 180 && m[Y * 320 + X] !== VACIO; })) b[y * 320 + x] = c; } };
const vuelca = (b) => { for (let k = 0; k < 320 * 180; k++) if (b[k] !== VACIO) R.buf[k] = b[k]; };
const mezcla = (a, b, f) => { let r = 0; for (const sh of [0, 8, 16]) r |= (Math.round(((a >>> sh) & 255) * f + ((b >>> sh) & 255) * (1 - f)) & 255) << sh; return (0xff000000 | r) >>> 0; };
const brillo = (cx, cy, r, c, f = 0.5) => { for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++) { if (x < 0 || x > 319 || y < 0 || y > 179) continue; const d = Math.hypot(x - cx, y - cy) / r; if (d < 1) R.buf[y * 320 + x] = mezcla(c, R.buf[y * 320 + x], f * (1 - d) * (1 - d)); } };
const elipse = (cx, cy, rx, ry, c) => { for (let y = Math.floor(cy - ry); y <= cy + ry; y++) for (let x = Math.floor(cx - rx); x <= cx + rx; x++) if (((x + 0.5 - cx) / rx) ** 2 + ((y + 0.5 - cy) / ry) ** 2 <= 1) R.pset(x, y, c); };
const trazo = (x0, y0, x1, y1, r, c) => { const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) * 2); for (let k = 0; k <= n; k++) { const u = k / n; elipse(x0 + (x1 - x0) * u, y0 + (y1 - y0) * u, r, r, c); } };
// lo que pinta «pinta» en un búfer aparte, medido y copiado a escala s, centrado en cx y con la base en «base», con filo
const grande = (pinta, cx, base, s, filo) => {
  R.usar(pj); pj.fill(VACIO); pinta(); R.usar(null);
  let x0 = 320, x1 = 0, y0 = 180, y1 = 0; for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) if (pj[y * 320 + x] !== VACIO) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  R.usar(tmp); tmp.fill(VACIO); pon(pj, x0, x1, y0, y1, Math.round(cx - (x1 - x0 + 1) * s / 2), base - (y1 - y0 + 1) * s, s); contorno(tmp, filo); R.usar(null); vuelca(tmp);
};
// el fondo de un decorado, desplazado dx (para centrar lo importante en la columna) y oscurecido hacia «tono»
const pinta_fondo = (f, dx, tono, k) => { R.usar(fondo); f(); R.usar(null); for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) { const sx = Math.max(0, Math.min(319, x + dx)); R.buf[y * 320 + x] = mezcla(tono, fondo[y * 320 + sx], k); } };

const dibujar = (t) => {
  pinta_fondo(() => T.anuevo(R, t, { encuadre: 'babilonia', camara: 'altar', insignias: false }), 0, hex('#100820'), 0.3);
  brillo(160, 26, 42, hex('#fff0a0'), 0.45);
  R.numero('4000', 160, 36, { tam: 16, centro: true });
  brillo(160, 120, 44, hex('#ffd8a0'), 0.35);
  grande(() => R.actor(EL.reyBabilonia, 60, 70, 0.5, { quieto: true, dir: 1, corona: false, triste: true }), 156, 178, 3, hex('#ffe8b0'));
  // la lágrima y las estrellitas del golpe cómico
  elipse(173, 125, 1.6, 2.4, hex('#0c3a6a')); elipse(173, 125, 1, 1.8, hex('#8ad0ff'));
  R.icono('!', 196, 66, hex('#ffe08a'), K, 2);
  for (const [x, y] of [[124, 70], [190, 92], [130, 56]]) { R.pset(x, y, hex('#ffffff')); for (const [a, b] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) R.pset(x + a, y + b, hex('#ffe08a')); }
};
window.__frame = async (t) => { dibujar(t); R.presentar(); };
window.__listo = true;
</script>
</body>
</html>
