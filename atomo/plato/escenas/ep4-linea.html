<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tordesillas · ep4</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// EP4-LINEA (frases 33–34), cartela 1494.
//  reparto  sobre el pergamino (Atlántico en el centro), una pluma traza una línea de polo a polo; una bandera
//           española a la izquierda (oeste) y otra portuguesa a la derecha (este).
//  nadie    la línea tiembla y se desplaza a un lado y a otro, como la longitud punteada del ancla; «?» en la caja.
import { escena } from '/atomo/plato/escena.js';
import { crearRetro } from '/atomo/plato/kits/pixel-retro.js';
const E = await escena('ep4-linea', 'ep04');
const R = await crearRetro(document.getElementById('lienzo'));
const { PAL, tramo, lerp } = R;
const M = (k, d) => E.marca(k, d);
const m = { reparto: M('reparto', 1.5), nadie: M('nadie', 7.5) };

// banderita de mástil clavada en el mapa
const banderita = (x, y, t, tipo) => {
  R.rect(x, y, x, y + 16, PAL.HULL[1]);
  R.bandera(x, y, t, tipo, 1, 0.9);
};
E.iniciar((t) => {
  R.secuencia(t, [[0, (t) => R.cartela(t, '1494')], [1.2, (t) => {
    R.mesa(t, { luz: [60, 20] });
    R.pergamino(20, 12, 300, 148, { luz: [60, 20], semilla: 23 });
    const pj = R.proyector(26, 18, 294, 142, -110, 60, -50, 70);
    R.recorte([26, 18, 294, 142]); R.mundo(pj, { tierra: 2.4 }); R.recorte(null);
    R.rosa(270, 124, 9);
    // la línea de Tordesillas (≈ 46° O); tras «nadie», tiembla y se desplaza
    const deriva = tramo(t, m.nadie + 0.3, m.nadie + 1) * (14 * Math.sin(t * 1.7) + 6 * Math.sin(t * 4.3));
    const [lx] = pj(-46 + deriva, 0);
    const p = tramo(t, m.reparto + 0.3, m.reparto + 2.6);
    const y0 = 18, y1 = lerp(18, 142, p);
    for (let y = y0; y <= y1; y++) {
      const dx = Math.round(tramo(t, m.nadie + 0.3, m.nadie + 1) * 1.5 * Math.sin(y * 0.5 + t * 20));
      R.pset(lx + dx, y, PAL.ROJO); R.pset(lx + dx + 1, y, PAL.OBS[3]);
    }
    // la pluma que traza
    if (p > 0 && p < 1) { R.linea(lx + 1, y1, lx + 12, y1 - 20, PAL.MOON[4]); R.linea(lx + 2, y1, lx + 13, y1 - 20, PAL.MOON[2]); R.pset(lx, y1, PAL.INK); }
    if (p >= 1) { banderita(lx - 40, 66, t, 'espana'); banderita(lx + 40, 50, t, 'estandarte'); }
  }]]);
  const e = E.energia(t);
  R.caja(t, t > m.nadie ? tramo(t, m.nadie + 0.6, m.nadie + 1) : 0, (x, y) => R.icono('?', x + 6, y, undefined, undefined, 2), { energia: e });
  if (t > 1.3) R.companero(t, e);
  R.presentar();
});
</script>
</body>
</html>
