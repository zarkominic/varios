<script type="module">
// OV-HOLA (frase 4). F: la sala de hoy de noche, con el ordenador encendido y la carpeta abierta; la persona saluda y Atom
// se presenta.
import { preparar, rodar, salaHoy, visto, C } from '/atomo/plato/escenas/ov-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await preparar('ov-hola');
const pantalla = (R, x0, y0, x1, y1, t) => { R.rect(x0 + 4, y0 + 4, x0 + 24, y0 + 28, C.ocre); R.icono('?', x0 + 11, y0 + 12, C.k, C.ocre); R.rect(x0 + 30, y0 + 4, x1 - 4, y0 + 6, C.grisL); R.rect(x0 + 30, y0 + 10, x1 - 10, y0 + 12, C.grisL); R.rect(x0 + 30, y0 + 16, x1 - 6, y0 + 18, C.grisL); };
const plano = (t) => { salaHoy(R, t, { pantalla }); R.actor(EL.sudadera, 130, 160, t, { dir: 1, saluda: t > M('hola', 0.5) + 0.3 && t < 4, sonrisa: true }); };
rodar(E, R, [[0, plano]], { año: 2026 });
</script>
