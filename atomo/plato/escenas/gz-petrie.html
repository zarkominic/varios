<script type="module">
// GZ-PETRIE (frase 26), Hawara 1888 (barra 1888; en el último plano el tiempo corre de 100 a 1888). Cinco planos:
// 1. (LOCAL) la pirámide de adobe de Amenemhat III de cerca, erosionada como en el plano 4 (perfil comido, cima roma,
//    regueros de lluvia, el núcleo a la vista donde se cayó la piel, derrubios), con cúmulos de tres tonos a tres
//    velocidades, cirros y milanos; delante, el campo de esquirlas con montones, una zanja donde cavan tres hombres,
//    cascotes de tamaños distintos con su sombra, cestas, huellas, las estacas y el teodolito; Petrie llega con un
//    trabajador y en «pyramid» la señala; luego apunta en su cuaderno. Corta en «from».
// 2. (LOCAL) delante de la tienda de Petrie (la lona ondea: pliegues que corren, costados que se hinchan y el bajo que
//    aletea; vientos con sus estacas a la vista; la pirámide lejos, erosionada y al sol por la derecha como en 1 y 4)
//    : la mesa de campaña con su sombra, cuadernos, cascos y la cabeza de granito del rey; esteras, cajas
//    abiertas con paja y vasijas, cascotes y huellas; Petrie mira la cabeza con la lupa y en «3,800» sale la cifra; en
//    «1888» deja la lupa y se va a cavar. Corta en «British».
// 3. hawara/petrie/zanja, con la pared repintada aquí encima: estratos ondulados (esquirlas, arena con laminillas,
//    limo con raíces y un hogar de ceniza, cascotes de caliza, adobe en hiladas, tierra con cerámica), marcas de pico,
//    un cordel de nivel con estacas, y en los taludes piedras, un escalón con su cesta y un pico clavado. Petrie cava
//    (golpe en «dug»), saltan esquirlas, la polea sube la cesta; en «found under» asoma en la losa un muro de sillares
//    en su surco (filo claro, juntas, canto en sombra) que dobla en esquina hacia el fondo, y Petrie lo señala.
//    Corta en «the footprint».
// 4. hawara/petrie (huella 0: la huella se pinta aquí): en «footprint»–«long» los cimientos del edificio salen en
//    relieve (cara de arriba al sol con su filo claro, juntas, canto y sombra arrojada), de nuestros pies hasta lo lejos,
//    sin pisar a los que cavan; primer término con esquirlas grandes, una cesta, un pico y la sombra de Petrie. Petrie
//    los señala, levanta los brazos y apunta en su cuaderno; un trabajador pasa con su cesta. Corta en «taken».
// 5. hawara/lago (2.ª vez): el laberinto tal como era, que se desvanece en la bruma mientras unas barcazas cargadas de
//    sillares se lo llevan piedra a piedra; la barra del año corre de 100 a 1888.
import * as T from '/atomo/plato/escenas/gz-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('gz-petrie');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const K = T.C.k, BL = hex('#fbf6e6');
const h = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const BY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const RA = (...c) => c.map(hex);
const tono = (r, v, x, y) => r[Math.max(0, Math.min(r.length - 1, Math.floor(v + BY[(y & 3) * 4 + (x & 3)] / 16)))];
// lo fijo de un plano se pinta una vez en su búfer y se copia en cada fotograma
const fijo = (pinta) => { let b = null; return () => { if (!b) { b = R.nuevo(); const prev = R.usar(b); pinta(); R.usar(prev); } R.copiar(b); }; };
// una capa con huecos que solo cubre las filas y0–y1 (lo que no se pinta deja ver lo de detrás: las nubes pasan por
// detrás de la pirámide; lo de delante tapa a quien pasa por detrás)
const capa = (y0, y1, pinta) => { let b = null; return () => { if (!b) { b = R.nuevo(); const prev = R.usar(b); pinta(); R.usar(prev); } const D = R.buf; for (let i = y0 * 320; i < (y1 + 1) * 320; i++) if (b[i]) D[i] = b[i]; }; };
// cielo tramado de seis tonos hasta y1
const cieloT = (y1, r) => { for (let y = 0; y < y1; y++) for (let x = 0; x < 320; x++) R.pset(x, y, tono(r, (y / y1) * (r.length - 0.4) + (h(x >> 3, y >> 2, 3) - 0.5) * 0.35, x, y)); };
// nubes de tres tonos a tres velocidades (la fila alta no entra en la esquina de Atom)
const nubes = (t, filas) => { for (const [x0, y, w, v, ancho] of filas) { const A = ancho ?? 380; R.nube(((x0 + t * v) % A + A) % A - 30, y, w); } };
// el rollo de papiro abierto en la mano (x, y): abierto 0–1
const rollo = (x, y, ab = 1, escrito = 0) => { const w = Math.round(3 + 8 * ab); R.rect(x - 1, y - 5, x + w + 1, y + 2, K); R.rect(x, y - 4, x + w, y + 1, hex('#f0e2b8')); R.rect(x, y + 1, x + w, y + 1, hex('#c8b488'));
  for (let i = 2; i < w - 1; i++) if (i / (w - 2) < escrito && i % 2 === 0) { R.pset(x + i, y - 3, hex('#3a2a1a')); if (i % 4 === 0) R.pset(x + i, y - 1, hex('#3a2a1a')); }
  R.rect(x - 2, y - 6, x - 1, y + 3, hex('#8a5a2a')); R.rect(x + w + 1, y - 6, x + w + 2, y + 3, hex('#8a5a2a')); R.pset(x - 2, y - 6, hex('#c88a4a')); R.pset(x + w + 1, y - 6, hex('#c88a4a')); };
// el candil de barro con su llama (x, y = la mano)
const candil = (x, y, t, k = 0) => { R.rect(x - 4, y - 1, x + 4, y + 2, K); R.rect(x - 3, y - 1, x + 3, y + 1, hex('#b8703a')); R.rect(x - 3, y - 1, x + 1, y - 1, hex('#d8925a')); R.pset(x + 4, y - 2, K);
  const f = Math.sin(t * 17 + k) > 0 ? 1 : 0; R.halo(x + 4, y - 4, 7, [hex('#5a3a1a'), hex('#a8642a'), hex('#e8a040')], 0.9);
  R.pset(x + 4, y - 3, hex('#ffd060')); R.pset(x + 4 + f, y - 4, hex('#ffe890')); R.pset(x + 4, y - 5 - f, hex('#fff4c0')); };
// el sombrero de viaje (pétaso) suelto: f = fotograma del giro (0 de frente, 1 de canto)
const PETASO = ['.....kkkkk.....', '....kJJJjJk....', '...kJjJJJJJk...', 'kkkkkkkkkkkkkkk', 'kJJJJJJJJJJJJJk', '.kkkkkkkkkkkkk.'];
const PETASO_C = ['..kkkkkkkkkkk..', 'kkJJJJjJJJJJJkk', '.kkkkkkkkkkkkk.'];
const sombrero = (x, y, f, dir = 1) => R.dibujo(f ? PETASO_C : PETASO, x, y - (f ? 3 : 6), dir, { k: K, J: hex('#c8a46a'), j: hex('#e0c08a') });
// globo de pensamiento (cx, cy) con su cola hacia (hx, hy); u 0–1 crece
const globo = (cx, cy, w, hh, hx, hy, u) => { if (u <= 0) return; const s = Math.min(1, u * 1.4), W = w * s, H = hh * s; const P = (d) => Array.from({ length: 28 }, (_, i) => [cx + Math.cos(i / 28 * 6.283) * (W / 2 + d), cy + Math.sin(i / 28 * 6.283) * (H / 2 + d)]);
  R.poligono(P(1), K); R.poligono(P(0), BL); R.poligono(P(0).filter((_, i) => i > 3 && i < 12).map(([x, y]) => [x, y]).concat([[cx, cy]]), hex('#e8e0cc'));
  for (const [k, r] of [[0.45, 3], [0.75, 2]]) { const x = Math.round(cx + (hx - cx) * k), y = Math.round(cy + H / 2 + (hy - cy - H / 2) * k); R.disco(x, y, r + 1, K); R.disco(x, y, r, BL); } };

const P2 = en('petrie', .254), P3 = en('petrie', .453), P4 = en('petrie', .673), P5 = en('petrie', .883);
const piram = en('petrie', .143), tres8 = en('petrie', .289), y1888 = en('petrie', .400), dug = en('petrie', .546), found = en('petrie', .576), chips = en('petrie', .657);
const huella = en('petrie', .686), largo = en('petrie', .765), todo = en('petrie', .801), stone = en('petrie', .977);
const CIELO = RA('#7aa6d8', '#90b4de', '#a8c4e2', '#c2d2e2', '#dcdcd2', '#ece2c8');
const ESQ = RA('#fbf6e6', '#ece2c8', '#d8ccae', '#c0b090', '#a8967a');
const libreta = (x, y, abierta = true) => { R.rect(x - 1, y - 5, x + 8, y + 1, K); R.rect(x, y - 4, x + 7, y, abierta ? hex('#f4ecd4') : hex('#4a3a2a')); if (abierta) { R.rect(x + 3, y - 4, x + 4, y, hex('#c8bc9a')); R.pset(x + 1, y - 2, hex('#6a6a7a')); R.pset(x + 5, y - 3, hex('#6a6a7a')); } };
const pico = (x, y, a) => { const ex = x + Math.cos(a) * 14, ey = y + Math.sin(a) * 14, px = -Math.sin(a), py = Math.cos(a);
  R.linea(x, y, ex, ey, K); R.linea(x + 1, y, ex + 1, ey, hex('#8a5a32'));
  R.linea(Math.round(ex - px * 6), Math.round(ey - py * 6), Math.round(ex + px * 6), Math.round(ey + py * 6), K); R.linea(Math.round(ex - px * 5 - 1), Math.round(ey - py * 5), Math.round(ex + px * 5 - 1), Math.round(ey + py * 5), hex('#9aa0a8')); };
const esquirlas = (t, x0, y0, t0, n = 7) => { const s = t - t0; if (s < 0 || s > 0.7) return; for (let k = 0; k < n; k++) { const vx = (h(k, 1, t0) - 0.5) * 70, vy = -30 - h(k, 2, t0) * 40; R.rect(Math.round(x0 + vx * s), Math.round(y0 + vy * s + 120 * s * s), Math.round(x0 + vx * s) + 1, Math.round(y0 + vy * s + 120 * s * s), k % 2 ? BL : hex('#d8ccae')); } };
const palmera = (x, y, t, k = 0) => { const s = Math.round(Math.sin(t * 1.4 + k) * 1.5); for (let j = 0; j < 22; j++) R.rect(x + Math.round(j * 0.15), y - j, x + 1 + Math.round(j * 0.15), y - j, j % 3 ? hex('#7a5a3a') : hex('#5a3e24'));
  const cx = x + 3, cy = y - 22; for (const [dx, dy] of [[-12, 5], [-9, -3], [-3, -7], [5, -6], [11, -1], [12, 6], [6, 4], [-6, 4]]) { R.linea(cx, cy, cx + dx + s, cy + dy, hex('#2a6a2a')); R.linea(cx, cy + 1, cx + dx + s, cy + dy + 1, hex('#4a9a3a')); } };
// ── lo común de los planos 1–4: nubes, milanos, piedras y cestas ──
const N0 = hex('#ffffff'), N1 = hex('#e6eef6'), N2 = hex('#b6c8de');
const MAD = hex('#9a6a3e'), MADS = hex('#6a4626'), MADL = hex('#c48c54');
const PIE = RA('#fbf5e4', '#ebe1c6', '#d0c2a0', '#a89678', '#7a6a56');
// un cúmulo de tres tonos (luz arriba a la izquierda, cuerpo, sombra abajo) con la base plana
const cumulo = (cx, cy, w, sem) => { const r = Math.max(3, w * 0.24), n = w > 26 ? 5 : 3, D = [];
  for (let i = 0; i < n; i++) { const u = i / (n - 1) - 0.5; D.push([cx + u * w * 0.8, cy - (1 - Math.abs(u) * 1.5) * r * 0.65 - h(i, sem, 425) * 2, r * (0.7 + (0.5 - Math.abs(u)) * 0.7)]); }
  const den = (x, y) => { for (const [a, b, rr] of D) if ((x - a) ** 2 + (y - b) ** 2 <= rr * rr) return true; return false; }, base = cy + r * 0.5;
  for (let y = Math.floor(cy - r * 2); y <= base; y++) for (let x = Math.floor(cx - w / 2 - r); x <= cx + w / 2 + r; x++) { if (x < 0 || x > 319 || !den(x, y)) continue;
    R.pset(x, y, y > base - 2 || !den(x - 1, y + 2) ? N2 : !den(x + 1, y - 2) || (!den(x + 2, y - 3) && BY[(y & 3) * 4 + (x & 3)] < 8) ? N0 : N1); } };
// tres capas de cúmulos: lejos pequeños y lentos, cerca grandes y rápidos (las cimas por debajo de y 46: la esquina de
// Atom y la barra del año quedan tranquilas). capas: [y, ancho, velocidad, cuántas, semilla]
const cumulos = (t, capas) => capas.forEach(([cy, w, v, n, sem]) => { for (let k = 0; k < n; k++) { const x = ((h(k, sem, 7) * 440 + k * 170 + t * v) % 460) - 70; cumulo(x, cy + Math.round(h(k, sem, 8) * 4) - 2, w + Math.round(h(k, sem, 9) * 8), k + sem * 5); } });
// cirros: velos finos y lejanos que apenas se mueven (por debajo de la barra del año y fuera de la esquina de Atom)
const cirros = (t, y0, sem) => { for (let k = 0; k < 3; k++) { const w = 36 + Math.round(h(k, 5, sem) * 30), x0 = ((h(k, 6, sem) * 300 + t * (0.6 + k * 0.25)) % 330) - 70, y = y0 + k * 8;
  for (let i = 0; i < w; i++) { const x = Math.round(x0 + i); if (x < 0 || x > 262 || h(i >> 2, k, sem + 1) < 0.25) continue; const e = Math.sin(i / w * Math.PI); if (e > 0.25 && BY[(y & 3) * 4 + (x & 3)] < e * 14) R.pset(x, y, N1); if (e > 0.6 && i % 3 && x + 4 < 263) R.pset(x + 4, y - 1, N0); } } };
// un milano que planea en círculos y alguna vez bate las alas (cx, cy el centro del giro)
const milano = (cx, cy, rx, ry, t, k) => { const a = t * 0.32 + k * 2.4, x = Math.round(cx + Math.cos(a) * rx), y = Math.round(cy + Math.sin(a) * ry), b = Math.sin(t * 1.9 + k * 3) > 0.6 ? 1 : 0, d = Math.sin(a) > 0 ? -1 : 1, c = hex('#3a2a2a');
  for (let i = -4; i <= 4; i++) R.pset(x + i, y - (Math.abs(i) >= 3 ? b : 0) + (Math.abs(i) === 4 ? 1 - b : 0), c);
  R.pset(x + d, y - 1, c); R.pset(x - d, y + 1, c); R.pset(x - d * 2, y + 1, hex('#6a4a3a')); R.pset(x - d * 2, y + 2, c); };
// una piedra de canto irregular, con la luz arriba a la derecha (el sol), su contorno y su sombra arrojada a la izquierda
const piedra = (cx, cy, r, sem, ramp = PIE, somb = null) => { const P = []; for (let i = 0; i < 7; i++) { const a = i / 7 * 6.283 + h(i, sem, 61) * 0.6, rr = r * (0.72 + h(i, sem, 62) * 0.4); P.push([cx + Math.cos(a) * rr * 1.3, cy + Math.sin(a) * rr * 0.75]); }
  if (somb) R.poligono(P.map(([x, y]) => [x - r * 0.6 - 1, y + r * 0.3 + 1]), somb);
  R.poligono(P.map(([x, y]) => [x + (x > cx ? 0.9 : -0.9), y + (y > cy ? 0.9 : -0.9)]), ramp[ramp.length - 1]);
  R.poligono(P, (x, y) => tono(ramp, 1 + (y - cy) / r * 1.3 - (x - cx) / r * 0.6 + (h(x, y, sem) - 0.5) * 0.5, x, y)); };
// una cesta de palma (x el centro, y la base), llena de esquirlas o vacía
const cesta = (x, y, w = 7, llena = true) => { for (let j = 0; j <= w; j++) { const ww = w - Math.round(Math.abs(j - w / 2) * 0.3); for (let i = -ww; i <= ww; i++) R.pset(x + i, y - j, Math.abs(i) === ww || j === 0 ? K : (i + j) % 3 === 0 ? MADS : j % 3 === 0 ? MADL : MAD); }
  R.linea(x - w + 1, y - w - 1, x - w + 1, y - w + 2, MADS); R.linea(x + w - 1, y - w - 1, x + w - 1, y - w + 2, MADS);
  if (llena) for (let i = -w + 2; i <= w - 2; i++) for (let j = 0; j < 3 - Math.abs(i) / (w - 1) * 2; j++) R.pset(x + i, y - w - 1 - j, h(i, x + j, 60) < 0.35 ? ESQ[2] : h(i, j, 63) < 0.2 ? BL : ESQ[1]); };
// un pico tumbado en el suelo (x, y el extremo del mango)
const picoSuelo = (x, y, d = 1) => { R.linea(x, y, x + 18 * d, y - 4, K); R.linea(x, y - 1, x + 18 * d, y - 5, MAD); R.pset(x + 2 * d, y - 1, MADL);
  R.linea(x + 16 * d, y - 10, x + 21 * d, y + 1, K); R.linea(x + 17 * d, y - 10, x + 21 * d, y - 1, hex('#9aa0a8')); R.pset(x + 17 * d, y - 9, hex('#d8dce4')); for (let i = 0; i < 6; i++) R.pset(x + 14 * d - i * 3 * d, y + 1 - Math.round(i * 0.3) + 1, ESQ[3]); };
// unas huellas de pies en la tierra, de (x0, y0) a (x1, y1)
const huellas = (x0, y0, x1, y1, n, c) => { for (let i = 0; i < n; i++) { const u = i / (n - 1), x = Math.round(lerp(x0, x1, u)), y = Math.round(lerp(y0, y1, u)) + (i & 1 ? 2 : 0); R.pset(x, y, c); R.pset(x + 1, y, c); R.pset(x + 1, y - 1, c); } };
// la sombra de un personaje sobre la tierra (tramada; el sol cae de arriba a la derecha)
const sombraPie = (x, y, w, c) => { for (let yy = y - 2; yy <= y + 2; yy++) for (let xx = x - w - 6; xx <= x + w; xx++) { const q = ((xx - x + 3) / (w + 3)) ** 2 + ((yy - y) / 2.6) ** 2; if (q < 1 && BY[(yy & 3) * 4 + (xx & 3)] < 12) R.pset(xx, yy, c); } };

// ── plano 1: la pirámide de adobe de cerca ──
const ADO = RA('#dcb88e', '#c49a6e', '#b08a60', '#9a7650', '#7e5e40', '#664a32');      // la cara al sol
const ADOS = RA('#9a7654', '#86644a', '#74543a', '#5e442e', '#4a3424', '#382618');     // la cara en sombra
const fondo1 = fijo(() => {
  cieloT(106, CIELO);
  for (let x = 0; x < 320; x++) { const yr = 100 + Math.round(Math.sin(x * 0.04) * 2 + h(x >> 3, 0, 2) * 2); for (let y = yr; y < 108; y++) R.pset(x, y, tono(RA('#d0c4a4', '#c4b494', '#b8a684'), (y - yr) / 3, x, y)); }
  R.rect(232, 104, 319, 107, hex('#4a8a5a')); for (let x = 232; x < 320; x += 2) R.pset(x, 104, hex('#7ab06a'));
  for (let y = 108; y < 140; y++) for (let x = 0; x < 320; x++) R.pset(x, y, tono(ESQ, 2 + (h(x >> 1, y >> 1, 15) - 0.5) * 1.6, x, y));
});
const SOMB1 = hex('#b8aa8e');
const frente1 = capa(30, 179, () => {
  // la pirámide de adobe derruida: perfil comido, cima roma, regueros, el núcleo donde se cayó la piel y los derrubios
  const ap = 132, top = 42, base = 130;
  const perfil = (x) => { const d = Math.abs(x - ap); return top + Math.max(0, d - 18) * 0.8 + (h(x >> 2, 2, 31) - 0.5) * 6 + (h(x >> 1, 4, 31) - 0.5) * 2 + (d < 18 ? h(x >> 1, 3, 31) * 4 : 0)
    + Math.max(0, 12 - Math.abs(x - 78) * 0.7) + Math.max(0, 8 - Math.abs(x - 196) * 0.6) - Math.max(0, 4 - Math.abs(x - 112) * 0.5); };
  const yp = []; for (let x = 0; x < 320; x++) yp[x] = Math.round(perfil(x));
  const regueros = [30, 48, 66, 92, 116, 150, 170, 190, 214, 238];
  const nucleos = [[104, 72, 20, 14], [180, 98, 16, 10], [58, 106, 12, 8]];   // [cx, cy, rx, ry]: el núcleo a la vista
  for (let x = 0; x < 320; x++) { if (yp[x] >= base) continue;
    for (let y = yp[x]; y <= base; y++) {
      const lit = x > ap - (y - top) * 0.12, fila = (y - top) >> 2, bx = (x + (fila & 1) * 5) % 10, junta = ((y - top) & 3) === 3 || bx === 0;
      let v = 1 + (y - top) / (base - top) * 1.1 + (h(x >> 1, y >> 1, 32) - 0.5) * 1.2;
      const lavado = h(x >> 3, y >> 3, 33) < 0.55;   // la piel lavada: las hiladas solo asoman a ratos
      if (junta && !lavado) v += 1.6; else if (junta && h(x, y, 34) < 0.3) v += 0.8;
      for (const gx of regueros) { const c = gx + Math.sin(y * 0.16 + gx) * 2.5 + (y - top) * (gx < ap ? -0.08 : 0.08), dd = x - c; if (y < yp[gx] + 5) continue;
        if (Math.abs(dd) < 1.2) v += 2.1; else if (dd >= 1.2 && dd < 2.4) v -= 1; else if (dd > -2.4 && dd <= -1.2) v += 0.7; }
      for (const [cx, cy, rx, ry] of nucleos) { const q = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 + (h(x >> 1, y >> 1, 35) - 0.5) * 0.3;
        if (q < 1) { v = 2.3 + (junta ? 1.7 : 0) + (h(x >> 1, y, 36) - 0.5) * 1.1; if (y < cy - ry * 0.5 && q > 0.5) v += 1.6; }   // dentro, hiladas oscuras; arriba, la sombra del borde
        else if (q < 1.3 && y > cy) v -= 1.1; }   // el canto roto de abajo, al sol
      if (base - y < 9 + h(x >> 2, 6, 37) * 7) v = 0.5 + h(x >> 1, y >> 1, 38) * 1.6 + (y - (base - 14)) * 0.08;   // los derrubios
