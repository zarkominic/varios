<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saqueo · ep5</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// RM-SAQUEO (frase 36). Cartela «410». De noche, la muralla de Roma: la puerta se abre y entran los godos; dentro
// brillan los fuegos; «800» en la caja. Luego, al anochecer, barcos vándalos en la orilla y gente cargando sacos y
// cofres; la barra salta a 455.
import { preparar, rodar } from '/atomo/plato/escenas/rm-comun.js';
const { E, R, M } = await preparar('rm-saqueo');
const { PALA, PR, ELENCO, tramo, lerp } = R;
const m0 = M('saqueo', 1.5), dur = E.duracion ?? 12, t1 = m0 + (dur - m0) * 0.62;
const godo = (i) => ({ ...ELENCO.barbaro, pelo: [PALA.PELO_RUBIO, PALA.PELO_ROJO, PALA.PELO_CASTANO][i % 3], chaqueta: [PALA.VERDE, PALA.AZUL, PALA.MARRON][i % 3], camisa: [PALA.VERDE, PALA.AZUL, PALA.MARRON][i % 3], barba: ['bigote', 'poblada', 'perilla'][i % 3], objeto: i % 2 ? 'gladio' : undefined });
const muralla = (t) => {
  R.ambiente({ luz: { lado: 1, color: PALA.ANTORCHA[2] }, sombra: PALA.CONTORNO });
  R.cielo(t, { luna: [60, 30, 9], hor: 130, semilla: 41 });
  R.halo(200, 90, 60, [PALA.ANTORCHA[0], PALA.ANTORCHA[1]], 0.7);
  R.skyline(84, { semilla: 5, color: PALA.CONTORNO, borde: PALA.ANTORCHA[1] });
  const ab = tramo(t, m0 + 0.5, m0 + 2);
  R.muralla(0, 319, 140, 60, { luz: 1.3, puerta: [200, 30, ab], dentro: (x, y) => R.tone(PALA.ANTORCHA, 1 + (y - 100) * 0.03 + Math.sin(t * 9 + x) * 0.4, x, y) });
  for (const x of [120, 280]) R.antorcha(x, 104, t);
  R.suelo(140, PR.ROCA, { luz: 1 });
  for (let k = 0; k < 7; k++) { const p = tramo(t, m0 + 1.5 + k * 0.4, m0 + 4.5 + k * 0.4); if (p <= 0) continue; R.personaje(lerp(30 + k * 18, 200, p), lerp(176, 140, p), lerp(28, 18, p), { ...godo(k), t: t + k, anda: p < 1 ? t * 7 : null, dir: 1 }); }
};
const vandalos = (t) => {
  R.cieloR(t, 'tarde', { hor: 110, sol: [40, 104, 9] });
  R.mar(t, { hor: 110, y1: 138 });
  R.trirreme(110, 128, t, { esc: 0.9, vela: PALA.AZUL, carga: true }); R.trirreme(240, 122, t, { esc: 0.7, vela: PALA.AZUL, carga: true });
  R.suelo(138, PR.PAJA, { luz: 2.4 });
  for (let k = 0; k < 5; k++) { const f = ((t - t1) * 0.12 + k / 5) % 1; R.personaje(lerp(310, 160, f), 170 - (k & 1) * 6, 26, { ...godo(k + 1), t: t + k, dir: -1, anda: t * 7, objeto: 'saco', pose: 'pie' }); }
  R.cofre(290, 166, t, { w: 18 });
};
rodar(E, R, [[0, muralla], [t1, vandalos]], { cartela: '410', año: (t) => (t < t1 ? 410 : 455), caja: (t, e) => R.caja(t, t > m0 + 2.5 && t < t1 ? tramo(t, m0 + 2.5, m0 + 2.9) : 0, (x, y) => R.numero('800', x + 6, y + 12), { energia: e }) });
</script>
</body>
</html>
