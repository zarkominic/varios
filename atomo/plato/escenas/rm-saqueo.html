<title>Saqueo · ep5</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// RM-SAQUEO (frases 50–51). Cartela «410». De noche, una ciudad amurallada: la puerta se abre y entran los godos; dentro
// brillan los fuegos; «800» en la caja. Luego, al anochecer, barcos vándalos en la orilla y gente cargando sacos y
// cofres de oro; en la caja cuentan los días hasta «14».
import { preparar, rodar } from '/atomo/plato/escenas/rm-comun.js';
const { E, R, M } = await preparar('rm-saqueo');
const { PALA, PR, ELENCO, tramo, lerp } = R;
const m = { god: M('godos', 1.5), van: M('vandalos', 7) };
const godo = (i) => ({ ...ELENCO.barbaro, pelo: [PALA.PELO_RUBIO, PALA.PELO_ROJO, PALA.PELO_CASTANO][i % 3], chaqueta: [PALA.VERDE, PALA.AZUL, PALA.MARRON][i % 3], camisa: [PALA.VERDE, PALA.AZUL, PALA.MARRON][i % 3], barba: ['bigote', 'poblada', 'perilla'][i % 3], objeto: i % 2 ? 'gladio' : undefined });
const muralla = (t) => {
  R.cielo(t, { luna: [60, 30, 9], hor: 130, semilla: 41 });
  R.halo(200, 90, 60, [PALA.ANTORCHA[0], PALA.ANTORCHA[1]], 0.7);
  R.skyline(84, { semilla: 5, color: PALA.CONTORNO, borde: PALA.ANTORCHA[1] });
  const ab = tramo(t, m.god + 1, m.god + 2.5);
  R.muralla(0, 319, 140, 60, { luz: 1.3, puerta: [200, 30, ab], dentro: (x, y) => R.tone(PALA.ANTORCHA, 1 + (y - 100) * 0.03 + Math.sin(t * 9 + x) * 0.4, x, y) });
  for (const x of [120, 280]) R.antorcha(x, 104, t);
  R.suelo(140, PR.ROCA, { luz: 1 });
  for (let k = 0; k < 6; k++) { const p = tramo(t, m.god + 2 + k * 0.5, m.god + 5 + k * 0.5); if (p <= 0) continue; R.personaje(lerp(30 + k * 20, 200, p), lerp(176, 140, p), lerp(38, 26, p), { ...godo(k), t: t + k, anda: p < 1 ? t * 7 : null, dir: 1 }); }
};
const vandalos = (t) => {
  R.cieloR(t, 'tarde', { hor: 110, sol: [40, 104, 9] });
  R.mar(t, { hor: 110, y1: 138 });
  R.trirreme(110, 128, t, { esc: 1.2, vela: PALA.AZUL, carga: true }); R.trirreme(240, 122, t, { esc: 0.9, vela: PALA.AZUL, carga: true });
  R.suelo(138, PR.PAJA, { luz: 2.4 });
  for (let k = 0; k < 4; k++) { const f = ((t - m.van) * 0.12 + k / 4) % 1; R.personaje(lerp(310, 170, f), 170 - (k & 1) * 6, 34, { ...godo(k + 1), t: t + k, dir: -1, anda: t * 7, objeto: 'saco', pose: 'pie' }); }
  R.cofre(290, 166, t, { w: 26 }); R.cofre(60, 170, t, { w: 22 });
};
rodar(E, R, [[0, muralla], [m.van - 0.2, vandalos]], { cartela: '410', caja: (t, e) => R.caja(t, t > m.god + 3 ? tramo(t, m.god + 3, m.god + 3.4) : 0, (x, y) => { if (t < m.van - 0.2) R.numero('800', x + 6, y + 12); else { R.icono('arena', x + 2, y + 4); R.numero(String(Math.max(1, Math.round(14 * tramo(t, m.van + 1, m.van + 5)))), x + 14, y + 12); } }, { energia: e }) });
</script>
</body>
</html>
