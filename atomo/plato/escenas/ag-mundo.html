// AG-MUNDO (frase 36). Mapa del Atlántico: puntos de oferta que se encienden en EE. UU., luego en Europa y hacia el sur.
import { preparar, rodar, mapaAg } from '/atomo/plato/escenas/ag-comun.js';
const { E, R, M } = await preparar('ag-mundo');
const m0 = M('mundo', 0.5), L = E.duracion - m0;
rodar(E, R, [[0, (t) => mapaAg(R, t, { ofertas: R.tramo(t - m0, 0.1 * L, 0.7 * L) })]], { año: 2015 });
