<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Astrónomos y carpintero · ep4</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// EP4-LUNA (frases 61–62), cartela 1764.
//  astronomos  un observatorio de noche: dos astrónomos con un telescopio largo apuntan a la Luna, que avanza entre
//              las estrellas como la aguja de un reloj (una esfera de reloj tenue dibujada en el cielo).
//  harrison    un taller con una vela: un carpintero con delantal entre engranajes de madera que giran.
import { escena } from '/atomo/plato/escena.js';
import { crearRetro } from '/atomo/plato/kits/pixel-retro.js';
const E = await escena('ep4-luna', 'ep04');
const R = await crearRetro(document.getElementById('lienzo'));
const { PAL, tramo, lerp } = R;
const M = (k, d) => E.marca(k, d);
const m = { astr: M('astronomos', 1.5), harrison: M('harrison', 8) };

const observatorio = (t) => {
  // la Luna avanza por un arco de esfera de reloj trazado en el cielo
  const a = -2.4 + 0.12 * (t - m.astr);
  const cx = 190, cy = 120, r = 90;
  const lx = Math.round(cx + Math.cos(a) * r), ly = Math.round(cy + Math.sin(a) * r);
  R.cielo(t, { luna: [lx, ly, 10], hor: 150, semilla: 67 });
  R.anillo(cx, cy, r, PAL.FARC[3], 6);
  for (let k = 0; k < 12; k++) { const b = k / 12 * Math.PI * 2; R.pset(Math.round(cx + Math.cos(b) * (r - 4)), Math.round(cy + Math.sin(b) * (r - 4)), PAL.FARC[4]); }
  // cúpula del observatorio y el telescopio
  for (let y = 120; y < R.H; y++) for (let x = 0; x < 140; x++) if (Math.hypot(x - 60, (y - 150) * 1.1) < 64 || y > 150) R.pset(x, y, R.tone(PAL.MIDC, 1.2 + (x - 20) / 120, x, y));
  R.linea(72, 118, 128, 74, PAL.ORO[2]); R.linea(72, 119, 128, 75, PAL.ORO[2]); R.linea(73, 120, 129, 76, PAL.ORO[1]);
  R.figura(60, 150, 34, { sombrero: 'pelo', pose: 'mide', luz: 1 });
  R.figura(100, 150, 32, { sombrero: 'sombrero', pose: 'senala', luz: 1 });
};
const engranaje = (cx, cy, r, a, dientes) => {
  R.disco(cx, cy, r, (x, y, d) => R.tone(PAL.HULL, 4.4 - d * 1.4 - (x - cx) / (r * 2), x, y));
  for (let k = 0; k < dientes; k++) { const b = a + k / dientes * Math.PI * 2; R.disco(cx + Math.cos(b) * (r + 2), cy + Math.sin(b) * (r + 2), 2, PAL.HULL[4]); }
  R.disco(cx, cy, r * 0.3, PAL.HULL[2]); R.disco(cx, cy, 1.5, PAL.ORO[4]);
};
const taller = (t) => {
  R.interior(t, { luces: [[180, 50]], tipo: 'madera', suelo: 136, radio: 160 });
  R.vela(180, 70, t, { r: 26 });
  R.rect(140, 110, 300, 116, PAL.HULL[4]); R.rect(146, 116, 152, 160, PAL.HULL[2]); R.rect(288, 116, 294, 160, PAL.HULL[2]);
  const w = (t - m.harrison) * 0.8;
  engranaje(230, 92, 16, w, 12); engranaje(258, 82, 9, -w * 1.8 + 0.2, 7); engranaje(208, 72, 8, -w * 2 + 0.5, 6);
  R.figura(110, 160, 50, { sombrero: 'pelo', delantal: true, pose: 'senala', luz: 1 });
};

E.iniciar((t) => {
  R.secuencia(t, [[0, (t) => R.cartela(t, '1764')], [1.2, observatorio], [m.harrison - 0.2, taller]]);
  if (t > 1.3) R.companero(t, E.energia(t));
  R.presentar();
});
</script>
</body>
</html>
