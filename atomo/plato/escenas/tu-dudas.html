<canvas id="lienzo"></canvas>
<script type="module">
// TU-DUDAS (frase 22), sin cartela; la barra dice 2026. Tres planos, cortados en la palabra inglesa:
// 1. los tres cortes (corta antes de «and a low»): las agujas apenas se mueven en la banda gris; por la abertura de la
//    tienda cruzan un geofísico lejano con su jalón y un milano; en «isn't proof» sale una «?» sobre cada corte, una tras
//    otra, y en «very limit» la mano da dos golpecitos con el lápiz al aparato de en medio;
// 2. la aguja de cerca (corta antes de «Other»): la esfera dentro de la tienda, con la LONA alrededor (paños con
//    costuras dobles y puntadas, pliegues, el dobladillo, manchas de agua, el borde con ojales atado con cordón al
//    palo) y, alrededor del aparato, el cable que sube a una alcayata atornillada (con su sombra), cuelga y baja por
//    la derecha con sus grapas hasta su rollo colgado de un clavo, el cable rojo, la etiqueta con su número colgada de
//    un tornillo (con su sombra); vive la sombra del viento que cruza
//    la lona, la etiqueta que se mece y una mosca que pasea. Tras «detect» un nudillo (T.brazo) da un golpecito al
//    cristal, la aguja salta, oscila y vuelve a la banda de ruido; en «room», «rubble-filled passage» y «cracked rock»
//    llegan las tres posibilidades en tarjetas y cada una se clava con su chincheta;
// 3. LA LADERA DESDE ARRIBA, MIRANDO AL VALLE (hasta el final; composición propia, en su búfer, sin horizonte ni
//    todoterreno): arriba el fondo del valle con el sendero, los turistas que pasan, el microbús, la caseta del guarda
//    y la ENTRADA DE LA TUMBA (el recinto de sillares con la escalera que baja a oscuras y el toldo, con algún flash);
//    el pie del monte con los cascotes; la ladera con su relieve, regueros, losas, matas, el BARRANCO seco que baja
//    serpenteando por la izquierda y la REJILLA DE MEDIDAS (cuerdas
//    en perspectiva, estacas, jalones y banderitas que ondean, la cinta métrica); delante, la roca con la cantimplora y
//    el carrete de cinta y, a la derecha, una piedra con su mata. Pasan el polvo, las sombras de dos nubes y la del
//    milano. Los dos
//    geofísicos bajan por la derecha, él con la maleta y ella con banderitas; en «more data» ella pregunta («?») y clava
//    una banderita nueva y él deja la maleta; en «before concluding» él niega con la cabeza y, al acabar, los dos dan
//    media vuelta y suben otra vez a medir (él recoge la maleta).
import * as T from '/atomo/plato/escenas/tu-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('tu-dudas');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const N = Math.round;
const ease = (u) => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
const K = hex('#1a1410'), BL = hex('#f8f4e8');
const globo = (x, y, ic, c) => { R.disco(x, y, 7, K); R.disco(x, y, 6, BL); R.pset(x - 5, y + 7, K); R.pset(x - 4, y + 6, BL); R.pset(x - 6, y + 8, K); R.icono(ic, x - (ic === '?' ? 2 : 1), y - 4, c, null, 1); };
const G1 = T.ELENCO_TU.geofisico1TU, G2 = T.ELENCO_TU.geofisica2TU;
// los pies de los geofísicos en el plano 3: la ladera sube hacia la derecha (abajo en pantalla, más cerca)
const pie = (x) => N(156 + 0.12 * (x - 240));
const P2 = en('escombro', 0.3463), P3 = en('escombro', 0.7271);

// 1 · los tres cortes
const p1 = (t) => {
  T.ladera(R, t, { encuadre: 'cortes' });
  // vida por la abertura de la tienda (recortada a su hueco): un geofísico lejano cruza la ladera con su jalón y un
  // milano planea; los dos, de pocos píxeles, como la gente pequeña del decorado
  R.recorte([187, 5, 253, 43]);
  { const x = N(250 - ((t * 5) % 80)), y = 38, p = Math.floor(t * 6) % 2; R.pset(x, y - 5, hex('#2a1a10')); R.pset(x, y - 4, hex('#d8a878')); R.linea(x, y - 3, x, y - 2, hex('#4a6a3a')); R.pset(x - 1 + p, y - 1, hex('#3a2a1a')); R.pset(x + 1 - p, y - 1, hex('#3a2a1a'));
    R.linea(x + 2, y - 7, x + 2, y - 1, hex('#5a4a3a')); R.pset(x + 3, y - 7, hex('#d83a2a')); }
  { const x = N(188 + ((t * 9) % 70)), y = N(14 + Math.sin(t * 0.8) * 3), a = Math.floor(t * 3) % 2; R.pset(x, y, hex('#3a2a20')); R.pset(x - 1, y - a, hex('#3a2a20')); R.pset(x + 1, y - a, hex('#3a2a20')); R.pset(x - 2, y - 1 + a, hex('#3a2a20')); R.pset(x + 2, y - 1 + a, hex('#3a2a20')); }
  R.recorte(null);
  // en «isn't proof» sale una «?» sobre cada corte, una tras otra
  [[57, 0.0291], [160, 0.06], [263, 0.0963]].forEach(([x, f]) => { if (t > en('escombro', f)) { const s = N(3 * (1 - ease(tramo(t, en('escombro', f), en('escombro', f) + 0.25)))); globo(x, 30 + s, '?', hex('#3a6ad8')); } });
  // en «very limit» la mano da dos golpecitos con el lápiz al cristal del aparato de en medio
  const entra = ease(tramo(t, en('escombro', 0.13), en('escombro', 0.1898))), sale = ease(tramo(t, en('escombro', 0.31), en('escombro', 0.3463)));
  const k = entra * (1 - sale);
  if (k > 0.01) { const d = t - en('escombro', 0.1898), tap = (d > 0 && d < 0.15) || (d > 0.35 && d < 0.5) ? 3 : 0;
    const hx = N(lerp(260, 178, k)), hy = N(lerp(210, 160 + tap, k));
    R.linea(hx - 10, hy - 8, hx - 2, hy, hex('#2a2a34')); R.linea(hx - 9, hy - 8, hx - 1, hy, hex('#d8a040')); R.pset(hx - 11, hy - 9, hex('#3a3a3a'));
    T.brazo(R, hx + 50, 214, hx + 4, hy + 2, '#4a6a8a', -1, { codo: [hx + 34, hy + 34] }); }
};

// ── lo común de los planos 2 y 3: las rampas del decorado, un ruido fijo y la mezcla de dos colores ──
const Hs = (a) => a.map(hex);
const ROCA = Hs(['#5a4430', '#72563c', '#8a6a4a', '#a28058', '#ba966a', '#d0ac80', '#e0c296', '#ecd6b0', '#f6e8cc']);
const LONA = Hs(['#7a6a4c', '#8a7a5a', '#a8966e', '#c4b088', '#d8c8a0', '#ebdcb8']);
const PIEDRA = Hs(['#3e362e', '#5e5246', '#7e7060', '#9c8e7a', '#b8aa94', '#d2c6b0', '#e6dccb']);
const GRAVA = Hs(['#8e8476', '#a69a8a', '#bcb09e', '#d0c4b0', '#e2d8c4']);
const MET = Hs(['#3a3e48', '#5a606c', '#7e8592', '#a6adb8', '#d0d6de']);
const hh = (x, y, s) => R.hash2(x + s * 7919, y - s * 3571);
const mez = (c, d, a) => { const f = (s) => Math.round(((c >>> s) & 255) * (1 - a) + ((d >>> s) & 255) * a); return (0xff000000 | (f(16) << 16) | (f(8) << 8) | f(0)) >>> 0; };
const SOM = hex('#3a2414');
const oscurece = (x, y, a) => R.pset(x, y, mez(R.pget(x, y), SOM, a));

// LA LONA DE LA TIENDA del plano 2, pintada una vez en su búfer y copiada solo donde el decorado deja la pared lisa
// (arriba y 0–39, la columna de la derecha x 275–319 y la tira x 30–45 entre el palo y el aparato): paños con costuras
// dobles y puntadas, la trama del tejido, pliegues, la sombra bajo la cumbrera, el dobladillo y manchas de agua; en la
// esquina de Atom y bajo el año, solo la trama (sin costuras ni pliegues fuertes)
let bLona = null;
const lona = () => {
  if (bLona) return bLona;
  bLona = R.nuevo(); const prev = R.usar(bLona);
  const calma = (x, y) => (x >= 270 && y <= 48) || (x <= 182 && y <= 22);
  for (let y = 0; y < 180; y++) for (let x = 30; x < 320; x++) {
    if (x > 45 && x < 275 && y >= 40) continue;
    const q = calma(x, y);
    let v = 3.6 + (((x ^ y) & 1) ? 0.13 : -0.13) + (y % 3 === 0 ? -0.12 : 0) + (hh(x, y, 1) - 0.5) * 0.24;
    v -= Math.max(0, 18 - y) / 18 * 0.75;
    v += (q ? 0.12 : 0.55 * (y < 40 ? 1 : 0.7)) * Math.sin(x / 6.5 + 0.9 * Math.sin(y / 13));
    if (!q) {
      for (const sx of [62, 126, 190, 254, 300]) { if ((sx === 62 && y < 24) || (sx === 300 && y < 52)) continue; const d = x - sx;
        if (d === 0) v = 1.4; else if (d === 1) v = 2.5; else if (d === -1) v = 4.7; else if ((d === 3 || d === -3) && y % 4 < 2) v = 2.3; }
      if (y === 35 && x < 270) v = 1.8; else if (y === 36 && x < 270) v = 4.6; else if (y === 33 && x < 270 && x % 4 < 2) v = 2.4;
      for (const [cx, cy, r] of [[110, 28, 7], [302, 146, 8], [38, 128, 5], [232, 13, 5], [296, 96, 5]]) { const d = Math.hypot(x - cx, (y - cy) * 1.3); if (d < r) v -= 0.3; if (Math.abs(d - r) < 0.7) v -= 0.55; }
    }
    R.pset(x, y, R.tone(LONA, v, x, y));
  }
  // el borde de la lona, enrollado junto al palo, con sus ojales de latón
  for (let y = 0; y < 180; y++) { R.pset(30, y, LONA[0]); R.pset(31, y, LONA[2]); R.pset(32, y, LONA[5]); R.pset(33, y, LONA[3]); }
  for (let y = 30; y < 178; y += 14) { R.disco(38, y, 2.2, hex('#8a6a2a')); R.pset(38, y, LONA[0]); R.pset(37, y - 1, hex('#e8c870')); R.pset(39, y + 1, hex('#5a4018')); }
  R.usar(prev); return bLona;
};
const verLona = (t) => {
  const D = R.buf, L = lona();
  for (let y = 0; y < 180; y++) { const i = y * 320;
    if (y < 40) D.set(L.subarray(i + 30, i + 320), i + 30);
    else { D.set(L.subarray(i + 30, i + 46), i + 30); D.set(L.subarray(i + 275, i + 320), i + 275); } }
  // el cordón que ata cada ojal al palo, en zigzag
  for (let y = 30; y < 178; y += 14) { R.linea(36, y, 27, y + 5, hex('#5a4a2a')); R.linea(36, y - 1, 27, y + 4, hex('#d8c08a')); R.linea(27, y + 5, 36, y + 11, hex('#5a4a2a')); R.linea(27, y + 4, 36, y + 10, hex('#c8b07a')); }
  // la sombra del viento: un viento (la cuerda de fuera) que se mece y se ve a través de la lona
  const s = Math.sin(t * 1.3) * 3 + Math.sin(t * 3.1);
  for (let y = 0; y < 40; y++) { const x = N(198 + s + (y / 39) * (54 + s * 0.6)); oscurece(x, y, 0.22); oscurece(x + 1, y, 0.16); }
  // la alcayata atornillada a la lona con su sombra, y el cable negro: sale de lo alto del aparato, sube, da la
  // vuelta a la alcayata, cuelga (se mece) y baja pegado a la derecha del aparato hasta el rollo de abajo
  for (const [dx, dy] of [[-1, 1], [-2, 2], [0, 2], [-1, 3]]) oscurece(264 + dx, 22 + dy, 0.4);
  R.disco(264, 22, 2.2, MET[2]); R.pset(263, 21, MET[4]); R.linea(263, 23, 265, 21, MET[0]);
  const K2 = hex('#1c1a1e'), K3 = hex('#4a4652'), sag = 3 + Math.sin(t * 1.7) * 1.2;
  const curva = (pts, c, c2) => { for (let i = 0; i + 1 < pts.length; i++) { R.linea(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], c); if (c2) R.linea(pts[i][0], pts[i][1] - 1, pts[i + 1][0], pts[i + 1][1] - 1, c2); } };
  curva([[244, 40], [246, 33], [252, 27], [259, 24], [264, 25]], K2, K3);
  const cuelga = []; for (let k = 0; k <= 6; k++) { const u = k / 6; cuelga.push([N(264 + u * 12), N(25 + u * 9 + Math.sin(u * Math.PI) * sag)]); } curva(cuelga, K2, K3);
  for (let y = 34; y < 168; y++) R.pset(276 + (Math.sin(y * 0.11) > 0.6 ? 1 : 0), y, K2);
  // el cable rojo: sale del costado del aparato y baja junto al negro
  R.linea(275, 116, 277, 118, hex('#b02a20')); for (let y = 118; y < 168; y++) R.pset(277 + (Math.sin(y * 0.11) > 0.6 ? 1 : 0), y, hex('#c83a2a'));
  // las grapas blancas que sujetan los cables a la lona
  for (const y of [60, 100, 142]) { R.rect(275, y, 279, y + 1, hex('#e8e4d8')); R.pset(275, y + 1, hex('#8a8478')); }
  // el rollo de cable colgado abajo a la derecha (debajo de las tarjetas)
  // (colgado de un clavo, más alto que ancho, con su sombra)
  for (let a = 0; a < 30; a++) { const g = a / 30 * Math.PI * 2; oscurece(N(297 + Math.cos(g) * 5), N(176 + Math.sin(g) * 5), 0.25); }
  for (const [r, c] of [[5, K2], [4.2, hex('#c83a2a')], [3.4, K2]]) for (let a = 0; a < 40; a++) { const g = a / 40 * Math.PI * 2; R.pset(N(298 + Math.cos(g) * r * 0.8), N(174 + Math.sin(g) * r), c); }
  R.linea(277, 168, 294, 171, K2); R.linea(278, 169, 294, 172, hex('#c83a2a'));
  oscurece(297, 170, 0.45); R.pset(298, 169, MET[3]); R.pset(299, 169, MET[1]); R.pset(298, 168, MET[4]);
  // LA ETIQUETA con su número, colgada de un tornillo (con su sombra) y que se mece un pelo
  const e = N(Math.sin(t * 1.1 + 0.5) * 1.2), ex = 202 + e, ey = 22;
  for (const [dx, dy] of [[-1, 1], [-2, 2], [0, 2]]) oscurece(216 + dx, 15 + dy, 0.4);
  R.disco(216, 15, 2, MET[3]); R.linea(215, 15, 217, 15, MET[0]); R.pset(215, 14, MET[4]);
  R.linea(216, 16, ex + 5, ey, hex('#6a5a3a')); R.linea(216, 16, ex + 23, ey, hex('#6a5a3a'));
  R.rect(ex - 1, ey + 1, ex + 27, ey + 12, mez(LONA[2], SOM, 0.35));
  R.rect(ex, ey, ex + 28, ey + 11, hex('#f4f0e2')); R.rect(ex, ey, ex + 28, ey + 1, hex('#c83a2a')); R.rect(ex + 28, ey, ex + 28, ey + 11, hex('#c8c0aa'));
  R.disco(ex + 4, ey + 3, 1, hex('#8a8478'));
  R.numero('042', ex + 7, ey + 10, { color: hex('#1a1410'), sombra: false, fina: true });
  // una mosca que pasea por la lona (y se va)
  { const c = (t * 0.17) % 1; if (c < 0.55) { const u = c / 0.55, fx = N(70 + u * 70 + Math.sin(u * 19) * 3), fy = N(30 + Math.sin(u * 11) * 3), a = Math.floor(t * 20) % 2;
    R.pset(fx, fy, hex('#1a1418')); R.pset(fx + 1, fy, hex('#2a2428')); R.pset(fx, fy - 1 - a, hex('#c8d0d8')); R.pset(fx + 1, fy - 1, hex('#e0e6ea')); } }
};

// 2 · la aguja de cerca: apenas asoma; salen las tres posibilidades
const p2 = (t) => {
  // en «detect» un nudillo da un golpecito al cristal: la aguja salta, oscila y vuelve a quedarse en la banda de ruido
  const TQ = en('escombro', 0.395), dq = t - TQ, salto = dq > 0 ? 0.5 * Math.exp(-dq * 2.2) * Math.sin(dq * 9) : 0;
  const aguja = 0.4 * ease(tramo(t, P2 + 0.2, en('escombro', 0.62))) + 0.04 * Math.sin(t * 9) + salto;
  T.ladera(R, t, { encuadre: 'cortes', camara: 'aguja', aguja });
  verLona(t);
  const entra = ease(tramo(t, P2, TQ - 0.05)), sale = ease(tramo(t, TQ + 0.35, TQ + 0.95)), k = entra * (1 - sale);
  if (k > 0.01) { const tap = dq > -0.06 && dq < 0.1 ? -3 : 0, wx = N(lerp(320, 252 + tap, k)), wy = N(lerp(216, 150, k));
    T.brazo(R, wx + 44, 214, wx, wy, '#6a5a3a', -1, { codo: [wx + 36, wy + 30] });
    if (tap) for (const [dx, dy] of [[-16, -8], [-18, 0], [-16, 8]]) R.linea(wx + dx, wy + dy, wx + dx - 4, wy + dy + Math.sign(dy) * 2, hex('#f8f4e8')); }
  // las tres posibilidades, en tarjetas a la derecha del aparato: cuarto vacío, pasillo con cascotes y roca agrietada
  const RO = hex('#b8905a'), RS = hex('#8a6a3a'), RL = hex('#d8b880');
  [[0.4938, 0], [0.5457, 1], [0.6517, 2]].forEach(([f, k]) => {
    const t0 = en('escombro', f); if (t < t0) return;
    const s = ease(tramo(t, t0, t0 + 0.25)), x0 = 280, y0 = 50 + k * 42 - N(6 * (1 - s));
    R.rect(x0 - 1, y0 - 1, x0 + 36, y0 + 34, K);
    // cada tarjeta llega con su chincheta, que se clava arriba en el centro (se dibuja después de la tarjeta)
    const pin = () => T.chincheta(R, x0 + 18, y0 + 4, t, k === 1 ? hex('#3a8ad8') : hex('#d83a2a'), { baja: 0.9 + 0.1 * ease(tramo(t, t0 + 0.1, t0 + 0.35)) }); R.rect(x0, y0, x0 + 35, y0 + 33, RO);
    for (let j = 0; j < 34; j += 4) for (let i = (j / 4 % 2) * 4; i < 36; i += 8) { R.pset(x0 + i, y0 + j, RS); R.pset(x0 + i + 1, y0 + j, RL); }
    if (k === 0) { R.rect(x0 + 8, y0 + 10, x0 + 27, y0 + 23, K); R.rect(x0 + 9, y0 + 11, x0 + 26, y0 + 22, hex('#f4ecd8')); }
    if (k === 1) { R.rect(x0 + 3, y0 + 13, x0 + 32, y0 + 21, K); R.rect(x0 + 4, y0 + 14, x0 + 31, y0 + 20, hex('#f4ecd8'));
      for (let i = 0; i < 9; i++) R.disco(x0 + 6 + i * 3, y0 + 19 - (i % 3), 2 - (i % 2), i % 2 ? RS : hex('#a07a48')); }
    if (k === 2) { const C = hex('#2a1a10'); R.linea(x0 + 4, y0 + 6, x0 + 16, y0 + 16, C); R.linea(x0 + 16, y0 + 16, x0 + 30, y0 + 5, C); R.linea(x0 + 16, y0 + 16, x0 + 13, y0 + 30, C); R.linea(x0 + 22, y0 + 10, x0 + 31, y0 + 24, C); }
    pin();
  });
};

// 3 · LA LADERA DESDE ARRIBA, mirando al valle y a la entrada de la tumba (composición propia del plano, sin horizonte;
// el fondo fijo va en su búfer y lo vivo encima)
const pieMonte = (x) => N(55 + 5 * Math.sin(x / 37 + 1) + 2.5 * Math.sin(x / 13));          // donde el monte toca el valle
const senda = (x) => 38 + 0.02 * x + 3 * Math.sin(x / 45);                                     // el sendero del valle
const VP = [165, -140], cuerdaX = (xb, y) => VP[0] + (xb - VP[0]) * (y - VP[1]) / (180 - VP[1]);   // la rejilla en perspectiva
const BASES = [120, 200, 280, 360, 440], FILAS = [92, 114, 144];
// el barranco seco que baja serpenteando por la izquierda hasta el valle (centro y ancho a cada altura)
const barX = (y) => 46 + (180 - y) * 0.5 + 9 * Math.sin(y / 15), barW = (y) => 3 + (y - 56) / 16;
// el relieve de la ladera (lomas y vaguadas): se sombrea con su pendiente, con el sol a la derecha
const relieve = (x, y) => 6 * Math.sin(x / 31 + 0.5 * Math.sin(y / 17)) + 4 * Math.sin(x / 13 + y / 23) + 3 * Math.sin((x + y) / 47);
const losa = (x, y, w, h2) => {
  for (let j = -h2 - 1; j <= h2 + 2; j++) for (let i = -w - 3; i <= w; i++) if ((i + 2) ** 2 / (w * w) + (j - 2) ** 2 / (h2 * h2) < 1) oscurece(x + i, y + j, 0.35);
  for (let j = -h2; j <= h2; j++) for (let i = -w; i <= w; i++) { const d = i * i / (w * w) + j * j / (h2 * h2); if (d >= 1) continue;
    let v = 6.4 - j / h2 * 1.1 + i / w * 0.5 + (hh(x + i, y + j, 9) - 0.5) * 0.5; if (d > 0.72 && (j > 0 || i < 0)) v -= 1.6; if (j === -h2 + 1 && d < 0.8) v += 1;
    R.pset(x + i, y + j, R.tone(ROCA, v, x + i, y + j)); }
  R.linea(x - (w >> 1), y - 1, x + 1, y + (h2 >> 1), ROCA[3]); R.linea(x + 2, y - (h2 >> 1), x + (w >> 1), y, ROCA[3]);
};
const piedra = (x, y, r) => { oscurece(x - 1, y + 1, 0.4); if (r > 1) { R.disco(x - 0.5, y + 1, r, mez(R.pget(x, y), SOM, 0.3)); R.disco(x, y, r, ROCA[4]); R.disco(x + 0.4, y - 0.4, r * 0.6, ROCA[6]); }

const mata = (x, y, e) => { const cs = Hs(['#5a4a28', '#7a6a38', '#9a8a4a', '#b8a868']);
