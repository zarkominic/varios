  for (let k = 0; k < 12; k++) { const sx = c0 + 6 + k * 4; R.rect(sx, 94, sx + 2, 96, (arranca >= 1 ? k === 0 : k === 11) ? hex('#d03a3a') : hex('#a8a090')); }
  // la hoja del 31 se levanta en la esquina y cae girando hasta el suelo
  if (arranca > 0 && arranca < 1) { const lev = Math.round(arranca * 20); R.poligono([[c1, 103 - lev], [c1 - lev, 103], [c1, 103]], hex('#c8c0b0')); R.poligono([[c1 - lev, 103], [c1 + 2, 103 - lev - 2], [c1 + 4, 106]], hex('#f8f4ea')); }
  if (cae > 0 && cae < 1) { const x = lerp(104, 190, cae) + Math.sin(cae * 9) * 8, y = lerp(100, 170, cae * cae), an = cae * 7, w = 9 * Math.abs(Math.cos(an)) + 2, hgt = 7;
    R.poligono([[x - w, y - hgt], [x + w, y - hgt + 3], [x + w, y + hgt], [x - w, y + hgt - 3]], hex('#f4f0e6')); R.linea(Math.round(x - w + 2), Math.round(y), Math.round(x + w - 2), Math.round(y + 1), hex('#3a2e44')); }
  if (cae >= 1) { R.poligono([[182, 172], [200, 170], [202, 176], [184, 178]], hex('#f4f0e6')); R.linea(186, 174, 198, 173, hex('#3a2e44')); }
  // LA LATA DE PELÍCULA de canto, con su etiqueta «1931», la cadena y el candado (se abre en «2027»)
  // las agujas del reloj: casi medianoche, y en «2027» las doce
  { const mm = nuevo ? 0 : -0.03 + tramo(t, P10, y2027) * 0.025, am = mm * Math.PI * 2 - Math.PI / 2, ah = mm / 12 * Math.PI * 2 - Math.PI / 2; R.linea(142, 52, Math.round(142 + Math.cos(am) * 9), Math.round(52 + Math.sin(am) * 9), K); R.linea(142, 52, Math.round(142 + Math.cos(ah) * 6), Math.round(52 + Math.sin(ah) * 6), K); R.pset(142, 52, hex('#c83a3a')); }
  const [lx, ly] = [150, 102], libre = tramo(t, y2027 + 0.05, y2027 + 0.5);
  R.disco(lx, ly, 16, K); R.disco(lx, ly, 15, hex('#7a7e88')); R.disco(lx, ly, 13, hex('#9aa0aa')); R.disco(lx - 3, ly - 3, 7, hex('#b8bec8')); R.disco(lx, ly, 3, hex('#5a5e68'));
  for (let k = 0; k < 24; k++) { const a = k / 24 * Math.PI * 2; R.pset(Math.round(lx + Math.cos(a) * 11), Math.round(ly + Math.sin(a) * 11), hex('#6a6e78')); }
  R.rect(lx - 17, ly - 4, lx + 17, ly + 4, K); R.rect(lx - 16, ly - 3, lx + 16, ly + 3, hex('#f0e6c8')); R.numero('1931', lx, ly + 3, { centro: true, fina: true, rampa: pal('#3a2a1a', '#5a3a22', '#7a4a2a', '#8a5a32') });
  if (libre < 1) { const cy = Math.round(libre * 30); for (let y = ly - 16; y <= 117; y += 2) { const yy = y + cy; if (yy > 117) continue; R.rect(lx + 8, yy, lx + 10, yy + 1, hex('#5a5e68')); R.pset(lx + 9, yy, hex('#c8ccd4')); } }
  { const kx = lx + 9, ky = 118 + Math.round(libre * 50), arco = Math.round(libre * 4); if (ky < 178) { R.rect(kx - 5, ky, kx + 5, ky + 9, K); R.rect(kx - 4, ky + 1, kx + 4, ky + 8, hex('#c89a30')); R.rect(kx - 4, ky + 1, kx + 4, ky + 2, hex('#f0d070')); R.rect(kx, ky + 4, kx, ky + 6, K);
      for (let a = 0; a <= 8; a++) { const an = Math.PI + a / 8 * Math.PI; R.pset(Math.round(kx + Math.cos(an) * 3) + (a > 4 ? arco : 0), Math.round(ky - 1 + Math.sin(an) * 4) - (a > 4 ? arco : 0), hex('#c8ccd4')); } } }
  // la película sale libre de la lata y cae por la cómoda haciendo bucles
  if (libre > 0) { const L = Math.round(libre * 70); for (let k = 0; k < L; k++) { const x = lx + 16 + Math.round(Math.sin(k * 0.12 + t) * 6 + k * 0.25), y = ly + k * 0.9; for (let i = 0; i < 5; i++) R.pset(x + i, Math.round(y), i === 0 || i === 4 ? ((k % 3 === 0) ? hex('#d8d0c0') : hex('#1a1612')) : k % 6 === 0 ? hex('#1a1612') : hex('#6a5a42')); } }
  // ATOM: da un toque al candado en «public domain», arranca la hoja en «January 1st» y celebra en «2027»
  const va = tramo(t, domain + 1.0, january - 0.4), axx = Math.round(lerp(112, 120, va)), toque = t > domain - 0.1 && t < domain + 0.6, tira = t > january - 0.5 && t < january + 0.2, fiesta = t > y2027;
  const salta = fiesta && t < y2027 + 1 ? Math.round(Math.abs(Math.sin((t - y2027) * 9)) * 4) : 0;
  T.AT.atom(R, axx, 118 - salta, t, { s: 2, dir: t < domain + 1.0 ? 1 : -1, pose: va > 0 && va < 1 ? 'camina' : toque ? 'senala' : tira ? 'sostiene' : fiesta ? 'brazos' : 'quieto', cara: fiesta ? 'sonrisa' : toque ? 'sorpresa' : 'normal', habla: voz(t) });
  if (fiesta) for (let k = 0; k < 26; k++) { const u = cl((t - y2027 - hh(k, 1) * 0.3) / 1.6), x = 120 + Math.cos(k * 2.4) * u * 70, y = 80 - Math.sin(hh(k, 2) * 3) * u * 50 + u * u * 80; if (u > 0 && u < 1) R.rect(Math.round(x), Math.round(y), Math.round(x) + 1, Math.round(y), hex(['#ff6a8a', '#6ad8ff', '#ffe060', '#8aff8a'][k % 4])); }
};

// ── 11 · el escaparate de la librería, 1818 ────────────────────────────────────────────────────────────────────────
const p11 = (t) => {
  const o = { encuadre: 'imprenta', camara: 'escaparate', tomos: true, carro: false };
  T.ciudad(R, t, o);
  // Mary pasa por detrás, de derecha a izquierda, sin que nadie la mire
  const mp = tramo(t, P11 + 0.2, P12 - 0.1), mx = Math.round(lerp(300, 150, mp));
  R.actor(MS.maryMS, mx, 154, t, { dir: -1, anda: mp > 0 && mp < 1 });
  // la pareja delante del escaparate: ella señala los tomos en «story»; a él le sale un «?» en «who imagined him»
  R.actor(MS.damaMS, 122, 157, t, { dir: -1, dedo: t > story - 0.2 && t < who, habla: t > P11 + 0.4 && t < story - 0.3 && Math.sin(t * 10) > 0, sonrisa: t < story });
  const duda = t > who - 0.1;
  R.actor(MS.caballeroMS, 92, 157, t, { dir: 1, sorpresa: duda, habla: t > story && t < who - 0.2 && Math.sin(t * 9) > 0 });
  if (duda) { const sube = Math.round(Math.min(1, (t - who + 0.1) / 0.25) * 5); R.icono('?', 85, 104 - sube, hex('#ffe070'), K, 2); }
  T.ciudadDelante(R, t, o);
};

// ── 12 · dentro de la imprenta: Mary y su libro ────────────────────────────────────────────────────────────────────
const p12 = (t) => {
  const o = { encuadre: 'imprenta', tomos: true };
  T.ciudad(R, t, o);
  const entra = tramo(t, P12, P12 + 0.8), mx = Math.round(lerp(40, 96, entra)), vuela = tramo(t, braver - 0.3, braver), tiene = vuela >= 1;
  // el librero, detrás del mostrador, le tiende un tomito; ella, triste en «sadder», lo mira; en «braver» se lo lanza
  // por encima del mostrador y ella lo coge y lo alza con una sonrisa
  const tiende = t > sadder - 0.5;
  const rl = R.actor(MS.caballeroMS, 190, 144, t, { dir: -1, sostiene: tiende && vuela === 0 ? [176, 120] : undefined, sonrisa: t > braver, habla: t < sadder - 0.4 && Math.sin(t * 9) > 0 });
  const alza = tramo(t, braver, braver + 0.4);
  const rm = R.actor(MS.maryMS, mx, 150, t, { dir: 1, anda: entra > 0 && entra < 1, triste: t > sadder - 0.25 && !tiene, sonrisa: tiene, sostiene: tiene ? [mx + 16, 110 - Math.round(alza * 10)] : undefined });
  T.ciudadDelante(R, t, o);
  const TOMO = [hex('#7a2a22'), hex('#4e1a16')];
  if (tiende && vuela === 0 && rl && rl.mano) { const [hx, hy] = rl.mano.map(Math.round); T.d_tomito(R, hx, hy + 2, TOMO, { w: 10, al: 13 }); }
  if (vuela > 0 && vuela < 1) { const x = lerp(176, mx + 16, vuela), y = lerp(122, 124, vuela) - Math.sin(vuela * Math.PI) * 18; T.d_tomito(R, Math.round(x), Math.round(y), TOMO, { w: 10, al: 13 }); }
  if (tiene && rm && rm.mano) { const [hx, hy] = rm.mano.map(Math.round); halo(hx, hy - 5, 18, hex('#ffe0a0'), 0.4 * alza); T.d_tomito(R, hx, hy + 2, TOMO, { w: 10, al: 13 });
    for (let k = 0; k < 6; k++) { const a = t * 2 + k, rr = 9 + Math.sin(t * 5 + k) * 2; if (alza > 0.5) tine(hx + Math.cos(a) * rr, hy - 5 + Math.sin(a) * rr * 0.7, hex('#fff6c8'), 0.8); } }
};
