<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dos números · ep4</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// EP4-NUMEROS (frases 11–13), cartela 0°.
//  numeros  el mapa del ancla, en blanco: solo el mundo y la cuadrícula. «2» en la caja.
//  latitud  se traza la latitud (firme) y luego la longitud (punteada, tiembla); la X en el cruce.
//  polar    de noche en cubierta, un marinero mide la Polar con un sextante; el barco baja al sur: la Polar baja
//           con él y la caja cuenta los grados (40° → 20°).
import { escena } from '/atomo/plato/escena.js';
import { crearRetro } from '/atomo/plato/kits/pixel-retro.js';
const E = await escena('ep4-numeros', 'ep04');
const R = await crearRetro(document.getElementById('lienzo'));
const { PAL, tramo, lerp } = R;
const M = (k, d) => E.marca(k, d);
const m = { numeros: M('numeros', 1.5), latitud: M('latitud', 4.5), polar: M('polar', 10) };
const lonMark = m.latitud + (E.marca('latitud_fin', m.latitud + 4) - m.latitud) * 0.5;

const mapa = (t) => R.ancla(t, { lineas: [tramo(t, m.latitud + 0.2, m.latitud + 1.2), tramo(t, lonMark, lonMark + 1)], tiembla: tramo(t, lonMark + 1, lonMark + 1.6) });
const lat = (t) => lerp(40, 20, tramo(t, m.polar + 2.2, m.polar + 4.6));
const cubierta = (t) => {
  const a = lat(t);
  R.cielo(t, { hor: 120, semilla: 61 });
  R.mar(t, { hor: 120 });
  // la Polar: su altura sobre el horizonte = la latitud
  const py = Math.round(120 - a * 2.4), px = 120;
  R.halo(px, py, 7, [PAL.FARC[3], PAL.COOL[0]], 1);
  R.pset(px, py, PAL.STAR[4]); for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1], [2, 0], [-2, 0], [0, 2], [0, -2]]) R.pset(px + dx, py + dy, Math.abs(dx + dy) > 1 ? PAL.COOL[0] : PAL.COOL[1]);
  // cubierta y marinero que mide
  for (let y = 142; y < R.H; y++) for (let x = 0; x < R.W; x++) R.pset(x, y, R.tone(PAL.HULL, 2.2 - (y - 142) * 0.05 + (x % 18 === 0 ? -1 : 0), x, y));
  R.rect(0, 136, R.W, 141, PAL.HULL[2]); R.rect(0, 136, R.W, 136, PAL.HULL[4]);
  const f = R.figura(210, 142, 50, { sombrero: 'sombrero', pose: 'mide', objeto: 'sextante', dir: -1 });
  // la visual del sextante hacia la estrella y el horizonte (punteadas)
  const [ex, ey] = f.cabeza;
  R.linea(ex - 4, ey, px, py, PAL.ORO[3], 3);
  R.linea(ex - 4, ey, 20, 120, PAL.ORO[1], 3);
};

E.iniciar((t) => {
  R.secuencia(t, [[0, (t) => R.cartela(t, '0°')], [1.2, mapa], [m.polar - 0.2, cubierta]]);
  const e = E.energia(t);
  const enCaja = t < m.latitud ? tramo(t, m.numeros + 0.3, m.numeros + 0.7) : t > m.polar + 1 ? tramo(t, m.polar + 1, m.polar + 1.4) : 0;
  R.caja(t, enCaja, (x, y) => {
    if (t < m.latitud) R.numero('2', x + 6, y + 12);
    else R.numero(Math.round(lat(t)) + '°', x + 6, y + 12);
  }, { energia: e });
  if (t > 1.3) R.companero(t, e);
  R.presentar();
});
</script>
</body>
</html>
