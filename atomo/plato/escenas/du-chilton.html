<script type="module">
// DU-CHILTON (frases 13–14), 1965, cartela «1965». Siete planos (la cartela tapa los primeros 1,3 s):
// 1. la cocina de los Herbert: suena el teléfono de pared, Herbert lo coge y se queda de piedra; en el globo, quien
//    llama: Lanier; Herbert salta y Beverly deja de teclear y levanta los brazos;
// 2. inserto: la mesa de Lanier vista desde su sillón (al fondo, la pared con la estantería, el plano azul, la ventana
//    y, de pie en el tablero, manuales, teléfono, taza y lámpara verde; delante, el vade de secante con bandas de cuero);
//    su mano izquierda trae la revista y la señala; la derecha (entra por abajo) escribe 7500 en el cheque, lo firma y
//    lo empuja hacia la revista;  3. la editorial Chilton: Lanier lee la revista en su mesa (en el globo, la
//    duna) mientras un empleado llega con una torre de manuales de coches y se la planta en la mesa: Lanier da un bote;
// 4. el estante (gag 5): la mano sube el libro de la duna desde el borde de abajo y lo suelta con un empujón (entra
//    solo en su hueco entre los manuales; el brazo no pasa de y 141) y, con «ornithopter», un manual con alas
//    pasa aleteando;  5. la imprenta: el impresor le da el primer ejemplar a Lanier, que lo levanta: la etiqueta
//    «5.95»;  6. la librería: la pila casi no baja; un lector duda y se va a otra mesa, una araña baja sobre la pila,
//    una lectora se lleva por fin uno;  7. inserto: la caja de cartón en la mesa de Lanier (papel pintado, friso, perchero
//    de pie, calendario, cajones con tirador, etiqueta y cerradura; el sol rayado de la persiana y motas de polvo): mete
//    su taza, su coche de juguete y, lo último, el libro; y se la lleva: queda el rectángulo limpio de polvo, una hoja
//    que se posa y la lámpara, que se apaga.
import * as T from '/atomo/plato/escenas/du-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('du-chilton');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const PZ = T.PIEZAS_DU, k = T.C.k, TWEED = '#9a8a5e', PANA = '#a8743c';
const hh = (x, y, s = 0) => { const v = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453; return v - Math.floor(v); };
const CAPAS = {}; const capa = (id, dib) => { if (!CAPAS[id]) { const bb = R.nuevo(), prev = R.usar(bb); dib(); R.usar(prev); CAPAS[id] = bb; } R.copiar(CAPAS[id]); };
// posición entre claves [t, x, y…], con arranque y frenada suaves
const kf = (t, K) => { if (t <= K[0][0]) return K[0].slice(1); for (let i = 1; i < K.length; i++) if (t <= K[i][0]) { const u = (t - K[i - 1][0]) / (K[i][0] - K[i - 1][0]), e = u * u * (3 - 2 * u); return K[i].slice(1).map((v, j) => K[i - 1][j + 1] + (v - K[i - 1][j + 1]) * e); } return K[K.length - 1].slice(1); };
const lin = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));   // tramo() frena al arrancar y al llegar; esto no
const caja = (x0, y0, x1, y1, c) => { R.rect(x0, y0, x1, y1, k); R.rect(x0 + 1, y0 + 1, x1 - 1, y1 - 1, c); };
const chispa = (x, y, r, c = hex('#fff8d0')) => { R.pset(x, y, c); for (let i = 1; i <= r; i++) { R.pset(x + i, y, c); R.pset(x - i, y, c); R.pset(x, y + i, c); R.pset(x, y - i, c); } };
// el libro en pequeño, para las manos de los chibis y las pilas (9 × 10)
const librito = (x, y) => { caja(x - 5, y - 13, x + 5, y, hex('#1e2a5e')); R.rect(x - 4, y - 5, x + 4, y - 1, hex('#f08a2a')); R.rect(x - 2, y - 6, x + 1, y - 6, hex('#f08a2a')); R.rect(x + 1, y - 4, x + 4, y - 1, hex('#c8643a')); R.rect(x - 3, y - 11, x - 2, y - 10, hex('#f6e4b0')); R.pset(x + 2, y - 9, hex('#f6c468')); R.rect(x - 5, y - 13, x - 5, y, hex('#141c44')); };

const a = (f) => en('chilton', f), b = (f) => en('sale', f);
const P2 = a(0.1855), P3 = a(0.501), P4 = a(0.775), P5 = b(0), P6 = b(0.378), P7 = b(0.715);

// ── 1 · la cocina: llega la noticia por teléfono ──
const O1 = { encuadre: 'entrada', camara: 'cocina' };
const coge = a(0.024), filadelfia = a(0.05), llama = a(0.112), salta = a(0.14);
const p1 = (t) => {
  const g = T.casa(R, t, O1), [tx, ty] = g.telefono ?? [296, 70];
  if (t < coge && Math.sin(t * 18) > -0.2) for (const d of [-1, 1]) for (let i = 0; i < 3; i++) R.linea(tx + 4 + d * (10 + i * 3), ty + 2 - i * 2, tx + 4 + d * (10 + i * 3), ty + 10 + i * 2, hex('#f8d040'));
  const mira = t > filadelfia - 0.2;
  R.actor(EL.beverly, 166, 146, t, { dir: mira ? 1 : -1, sorpresa: mira && t < salta, sonrisa: t >= salta, brazos: t > salta + 0.25 });
  const u = tramo(t, 0.9, coge - 0.1), hx = Math.round(lerp(250, 276, u));

  if (t >= coge) { const [mx, my] = H.mano;   // el auricular y su cable rizado hasta el teléfono
    for (let i = 0; i <= 26; i++) { const p = i / 26; R.pset(Math.round(lerp(tx + 2, mx + 1, p) + Math.sin(i * 1.6)), Math.round(lerp(ty + 16, my, p) + Math.sin(p * Math.PI) * 10), k); }
    R.rect(mx - 1, my - 6, mx + 2, my + 2, k); R.rect(mx, my - 5, mx + 1, my + 1, hex('#4a4a58')); }
  if (t > filadelfia && t < llama) R.icono('!', hx + 5, 112 - sj, hex('#f8d040'), k, 1);
  // quién llama: el globo con Lanier al teléfono, en su despacho de Filadelfia
  const gl = tramo(t, llama, llama + 0.25);
  if (gl > 0) { const gx = 252, gy = 76, r = Math.round(18 * gl);
    R.poligono([[gx + 14, gy - 4], [gx + 30, gy + 2], [gx + 14, gy + 6]], k); R.disco(gx, gy, r + 1, k); R.disco(gx, gy, r, hex('#dfe9f0')); R.poligono([[gx + 14, gy - 2], [gx + 27, gy + 2], [gx + 14, gy + 4]], hex('#dfe9f0'));
    if (gl >= 1) { R.recorte([gx - 17, gy - 17, gx + 17, gy + 17]); for (let y = gy + 10; y <= gy + 17; y++) for (let x = gx - 14; x <= gx + 14; x++) if (Math.hypot(x - gx, y - gy) < 18) R.pset(x, y, hex('#9aa8ae'));
      for (let i = 0; i < 4; i++) PZ.manual(R, gx - 13 + i * 6, gy + 2, { lomo: true, color: ['#c8473a', '#3a6ab0', '#3e8a5a', '#d89a2a'][i] }); R.linea(gx - 17, gy + 3, gx + 10, gy + 3, hex('#8a6a3c'));
      const La = R.actor(EL.lanier, gx - 6, gy + 15, t, { dir: 1, habla: Math.sin(t * 10) > 0, sostiene: [gx + 10, gy - 2], sonrisa: true }); R.rect(La.mano[0] - 1, La.mano[1] - 5, La.mano[0] + 2, La.mano[1] + 2, k); R.rect(La.mano[0], La.mano[1] - 4, La.mano[0] + 1, La.mano[1] + 1, hex('#4a4a58')); R.recorte(null); } }
  T.casaDelante(R, t, O1);
};

// ── 3 · Chilton: una editorial de manuales de coches ──
const O3 = { encuadre: 'chilton' };
const chilton = a(0.56), planta = a(0.682), manuales = a(0.712);
const COLM = ['#c8473a', '#3a6ab0', '#3e8a5a', '#d89a2a', '#7a4a9a', '#c8473a'];
const torre = (x, y, n, bal = 0) => { for (let i = 0; i < n; i++) { const yy = y - i * 4, dx = Math.round(bal * i * 0.5) + (i % 2); caja(x - 7 + dx, yy - 4, x + 7 + dx, yy, hex(COLM[i])); R.rect(x - 6 + dx, yy - 3, x - 4 + dx, yy - 1, hex('#f6f6f6')); R.pset(x + 5 + dx, yy - 2, hex('#f6eed8')); } };
const p3 = (t) => {
  T.editoriales(R, t, O3);

  if (t > chilton && t < chilton + 1.3) for (const [x, y, f] of [[36, 46, 0], [84, 62, 1], [128, 44, 2], [60, 92, 3], [112, 78, 4]]) if (Math.sin((t - chilton) * 9 - f) > 0.5) chispa(x, y, 2);
  const ud = tramo(t, planta - 0.3, planta), bote = t > planta ? Math.round(Math.abs(Math.sin((t - planta) * 9)) * 4 * (1 - tramo(t, planta, planta + 0.7))) : 0, tras = t > planta + 0.9;
  const L = R.actor(EL.lanier, 112, 146, t, { dir: 1, sostiene: bote ? [128, 112] : true, sorpresa: t > planta && !tras, sonrisa: tras, salto: bote });
  PZ.revista(R, L.mano[0] + 6, L.mano[1] + 9 + (t < planta || tras ? Math.round(Math.sin(t * 2.6)) : 0), {});
  T.editorialesDelante(R, t, O3);
  // el empleado con la torre de manuales
  const v = tramo(t, P3 + 0.15, planta - 0.5), ex = Math.round(lerp(326, 184, v)), bal = Math.sin(t * 6) * (v > 0 && v < 1 ? 1 : 0.3);
  const Em = R.actor(EL.oficinista, ex, 163, t, { dir: -1, anda: v > 0 && v < 1, sostiene: ud < 1, dedo: t > manuales && t < manuales + 0.9, sonrisa: ud >= 1, habla: t > manuales && Math.sin(t * 9) > 0 });
  const q0 = [Em.mano[0] - 6, Em.mano[1] + 2], tx = Math.round(lerp(q0[0], 150, ud)), ty = Math.round(lerp(q0[1], 139, ud) - Math.sin(ud * Math.PI) * 10) - (ud >= 1 ? Math.round(bote / 2) : 0);
  torre(tx, ty, 6, ud >= 1 ? 0 : bal);
  if (ud >= 1 && t < planta + 0.35) for (const d of [-1, 1]) { R.linea(150 + d * 12, 136, 150 + d * 18, 132, hex('#f6f6f6')); R.linea(150 + d * 12, 128, 150 + d * 19, 126, hex('#f6f6f6')); }
  // lo que lee Lanier mientras tanto: una duna bajo dos lunas
  const gl = tramo(t, P3 + 0.5, P3 + 0.8) - tramo(t, planta - 0.2, planta);
  if (gl > 0.5) { const gx = 148, gy = 88; R.disco(132, 113, 1, k); R.disco(136, 108, 2, k); R.disco(136, 108, 1, hex('#f6f6f6'));
    for (const [c, d] of [[k, 0], [hex('#f6f6f6'), 1]]) { R.rect(gx - 15 + d, gy - 13 + d, gx + 15 - d, gy + 13 - d, c); R.rect(gx - 17 + d, gy - 10 + d, gx + 17 - d, gy + 10 - d, c); }
    R.rect(gx - 14, gy - 10, gx + 14, gy + 10, hex('#1e2a5e')); R.poligono([[gx - 14, gy + 10], [gx - 14, gy + 4], [gx - 2, gy - 3], [gx + 6, gy + 3], [gx + 14, gy], [gx + 14, gy + 10]], hex('#f08a2a')); R.poligono([[gx - 2, gy - 3], [gx + 6, gy + 3], [gx + 2, gy + 10], [gx - 6, gy + 10]], hex('#c8643a'));
    R.disco(gx + 8, gy - 6, 2, hex('#f6e4b0')); R.disco(gx + 2, gy - 8, 1, hex('#f6c468')); R.pset(gx - 9, gy - 7, hex('#f6f6f6')); R.pset(gx - 5, gy - 4, hex('#f6f6f6')); }
};

// ── 2 · inserto: la mesa de Lanier desde su sillón: la revista y el cheque de 7500 ──
const mez = (c1, c2, a) => { const f = (s) => Math.round(((c1 >>> s) & 255) + (((c2 >>> s) & 255) - ((c1 >>> s) & 255)) * a) << s; return (0xff000000 | f(16) | f(8) | f(0)) >>> 0; };
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], bay = (x, y) => (BAY[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
const LIN = ['#d8c8a0', '#cdbc92', '#e6d9b4', '#bfae84'].map(hex);   // el linóleo crema del tablero (como en el plano 3)
// el teléfono negro de la mesa (x, y: la esquina de la base; so: el color de su sombra)
const tel8 = (x, y, so) => { R.rect(x - 2, y + 13, x + 36, y + 14, so); caja(x, y, x + 32, y + 12, hex('#2a2832')); R.rect(x + 2, y + 2, x + 30, y + 2, hex('#4a4856')); R.disco(x + 16, y + 6, 4, hex('#d0d4de')); R.disco(x + 16, y + 6, 2, hex('#2a2832'));
  caja(x - 4, y - 7, x + 36, y - 1, hex('#2a2832')); R.rect(x - 2, y - 6, x + 34, y - 6, hex('#4a4856')); caja(x - 5, y - 4, x + 3, y + 3, hex('#2a2832')); caja(x + 29, y - 4, x + 37, y + 3, hex('#2a2832')); };
const VL = (y) => Math.round(100 - (y - 78) * 0.12), VR = (y) => Math.round(288 + (y - 78) * 0.12);   // los lados del vade
const mesa3 = () => {
  const PW = ['#e9e2c6', '#e0d8b8', '#f1ebd6'].map(hex), ZO = ['#9fb0bc', '#8ea0ae', '#b4c4ce', '#6e808e'].map(hex), SO = LIN[3], LUZ = hex('#fff2b0'), SOM = hex('#8a7a5a'), W = hex('#f6f6f6');
  // la pared del fondo: papel crema de rayas finas (liso bajo Atom y bajo el año) y el zócalo azulado de paneles
  for (let y = 0; y < 40; y++) for (let x = 0; x < 320; x++) { const q = hh(x, y, 21); R.pset(x, y, q > 0.95 ? PW[1] : q < 0.04 ? PW[2] : x % 12 === 5 && y > 20 && x < 270 ? PW[1] : PW[0]); }
  for (let y = 40; y < 62; y++) for (let x = 0; x < 320; x++) { const q = hh(x, y, 22), j = x % 40;
    R.pset(x, y, y === 40 ? ZO[3] : y === 41 ? ZO[2] : y > 58 ? ((x + y) % 2 ? ZO[3] : ZO[1]) : j === 0 ? ZO[3] : j === 1 ? ZO[2] : (j === 6 || j === 35) && y > 44 && y < 57 ? ZO[1] : (y === 45 || y === 56) && j > 6 && j < 35 ? ZO[1] : q > 0.93 ? ZO[1] : ZO[0]); }
  // el tablero: linóleo crema con vetas, un reflejo en diagonal, el charco de luz de la lámpara y la sombra de quien escribe
  for (let y = 62; y < 180; y++) for (let x = 0; x < 320; x++) { const r = hh(Math.floor(x / 11), y, 3), q = hh(x, y, 5), dl = Math.hypot((x - 292) / 64, (y - 76) / 30), s = (x + y * 2) % 190, by = bay(x, y);
    let c = r > 0.86 ? LIN[2] : r < 0.12 ? LIN[1] : q > 0.96 ? LIN[3] : LIN[0];
    if ((s > 70 && s < 84 && by < 0.32) || (s > 90 && s < 95 && by < 0.2)) c = LIN[2];
    if (dl < 1 && by < (1 - dl) * 1.1) c = mez(c, LUZ, 0.65);
    if (y > 146 && by < (y - 146) / 80) c = mez(c, SOM, 0.3);
    if (y < 70 && by < (70 - y) / 14) c = mez(c, SOM, 0.25);
    R.pset(x, y, c); }
  R.rect(0, 62, 319, 62, hex('#e0e4e8')); R.rect(0, 63, 319, 63, hex('#8a7e60'));
  // la estantería de manuales del fondo (dos baldas)
  caja(-1, 22, 114, 61, hex('#8a6a3c')); R.rect(0, 23, 113, 23, hex('#b08a50'));
  for (const y0 of [25, 44]) { R.rect(2, y0, 111, y0 + 14, hex('#3a2a1c')); R.rect(2, y0, 111, y0 + 1, hex('#2a1c12')); let x = 3, i = 0;
    while (x < 107) { const w = 2 + Math.floor(hh(i, y0, 7) * 3), al = 9 + Math.floor(hh(i, y0, 8) * 4), c = hex(COLM[Math.floor(hh(Math.floor(i / 3), y0, 9) * 6)]);
      if (hh(i, y0, 10) > 0.1) { R.rect(x, y0 + 14 - al, x + w, y0 + 14, c); R.rect(x, y0 + 17 - al, x + w, y0 + 17 - al, W); R.rect(x, y0 + 11, x + w, y0 + 11, W); R.rect(x + w, y0 + 14 - al, x + w, y0 + 14, mez(c, k, 0.45)); }
      else { R.disco(x + 2, y0 + 11, 3, hex('#8c90a4')); R.disco(x + 2, y0 + 11, 1, hex('#3a2a1c')); x += 3; }
      x += w + 1; i++; }
    R.rect(2, y0 + 15, 111, y0 + 15, hex('#b08a50')); R.rect(2, y0 + 16, 111, y0 + 16, hex('#6a4e28')); }
  // el plano azul de un coche y el calendario
  caja(124, 18, 160, 42, hex('#f0ece0')); R.rect(126, 20, 158, 40, hex('#2a4a8a')); for (let x = 128; x < 158; x += 5) for (let y = 22; y < 40; y += 5) R.pset(x, y, hex('#4a6aa8'));
  { const B = hex('#dfe9f6'); R.linea(131, 33, 153, 33, B); R.linea(134, 33, 138, 27, B); R.linea(138, 27, 147, 27, B); R.linea(147, 27, 151, 33, B); for (const x of [136, 149]) { R.disco(x, 34, 2, B); R.pset(x, 34, hex('#2a4a8a')); } R.linea(131, 38, 153, 38, hex('#8aa4d0')); R.pset(131, 37, B); R.pset(153, 37, B); }
  R.rect(161, 20, 161, 43, PW[1]); R.rect(126, 43, 161, 43, ZO[3]);
  R.pset(179, 17, k); caja(170, 19, 188, 43, W); R.rect(171, 20, 187, 25, hex('#c8473a')); for (const x of [174, 179, 184]) R.pset(x, 19, hex('#c8ccd8')); R.numero('7', 179, 35, { fina: true, centro: true, color: hex('#2a1c14') }); for (let i = 0; i < 5; i++) R.pset(173 + i * 3, 40, hex('#a8a898'));
  // el marco de la ventana (el cristal lo pinta ventana3)
  caja(200, 6, 268, 52, hex('#f0ece0')); R.rect(203, 9, 265, 49, k); R.rect(198, 52, 270, 54, k); R.rect(199, 53, 269, 53, hex('#f0ece0')); R.rect(269, 8, 269, 51, PW[1]);
  // de pie al fondo de la mesa: manuales con la llave inglesa encima, el teléfono, el bote de lápices, la taza, el coche de juguete, el tintero y el sello
  R.rect(5, 73, 52, 74, SO); for (let i = 0; i < 4; i++) { const y = 72 - i * 6, d = [0, 2, -1, 1][i], c = hex(COLM[i + 1]); caja(6 + d, y - 6, 48 + d, y, c); R.rect(7 + d, y - 5, 47 + d, y - 5, mez(c, W, 0.4)); R.rect(40 + d, y - 5, 47 + d, y - 1, hex('#f0e8d0')); R.rect(41 + d, y - 3, 47 + d, y - 3, hex('#c8c0a8')); R.rect(12 + d, y - 4, 15 + d, y - 2, W); }
  caja(12, 44, 40, 47, hex('#c8ccd8')); R.rect(13, 45, 39, 45, W); caja(8, 42, 14, 49, hex('#c8ccd8')); R.rect(8, 45, 10, 46, PW[0]); caja(38, 42, 44, 49, hex('#c8ccd8')); R.rect(42, 45, 44, 46, hex('#3a2a1c'));
  tel8(60, 60, SO);
  R.rect(104, 73, 119, 74, SO); for (const [x0, x1, y1, c] of [[107, 106, 45, '#f0c030'], [110, 111, 43, '#3a6ab0'], [113, 116, 46, '#3e8a5a']]) { R.linea(x0, 58, x1, y1, hex(c)); R.linea(x0 + 1, 58, x1 + 1, y1, k); R.pset(x1, y1 - 1, k); }
  caja(104, 56, 116, 72, hex('#c8473a')); R.rect(105, 57, 115, 58, hex('#8a1e26')); R.rect(106, 60, 107, 70, hex('#f08a8a'));
  R.rect(134, 73, 152, 74, SO); taza8(142, 72);
  R.rect(162, 73, 192, 74, SO); coche8(176, 73);
  R.rect(203, 73, 218, 74, SO); caja(204, 62, 216, 72, hex('#1e2a5e')); R.rect(205, 63, 206, 70, hex('#4a5a9a')); caja(207, 58, 213, 62, hex('#2a2832')); R.rect(206, 66, 214, 69, hex('#f0e8d0'));
  R.rect(223, 73, 235, 74, SO); caja(224, 67, 234, 72, hex('#8a6a3c')); caja(227, 58, 231, 67, hex('#a8824a')); R.disco(229, 57, 3, k); R.disco(229, 57, 2, hex('#c8473a')); R.pset(228, 56, hex('#f08a8a'));
