<script type="module">
// LT-FUTURO (frase 15), LA PAUSA «fíjate» del descuento temporal, sin año. Siete planos:
// (en todos: el polvo suspendido en el aire congelado destella por turnos)
// 1. la sombra congelada (p15): Atom al doble entra y señala; «?» en «why no one else»; al final se encoge de hombros;
// 2. el desierto congelado (p12): Atom entra andando y saca la balanza en «temporal discounting»; la balanza se mece;
// 3. las dunas congeladas (p1): la balanza grande; destella la moneda en «today»; el cofre lejano en «big one»;
// 4. el oasis congelado al atardecer (decorado propio: peña con torre en ruinas, aldea con casas, atrapavientos, palmeras y
//    aldeanos parados a medio gesto; tienda, carro y rocas delante): la tormenta del «100» lejos; el aldeano a color deja
//    el farol, la mira, se encoge de hombros y en «at night» se acuesta y se duerme; cae la noche (estrellas y luna);
// 5. el zoco congelado de Arrakeen (decorado propio: fachadas con arcos, tres puestos, calle de losas): el dulce que tienta
//    brilla; en «save» la moneda de Atom salta al puesto de los dulces; T.pausa 'planeta' con su reloj en «planet»;
// 6. el camino de oro al amanecer (decorado propio: cornisa, oasis, sietch en la peña, calzada dorada hacia el sol): el
//    mundo se descongela en «exact opposite»; Leto señala y asoman de luz los que no han nacido, de cerca al horizonte;
// 7. el trance dorado congelado (p8): la balanza; los de luz suben al plato y en «weigh more» lo hunden.
import * as T from '/atomo/plato/escenas/lt-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('lt-futuro');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const TS = { P2: 4.0, CAPT: 4.52, LAW: 6.02, AMONG: 7.76, GURNEY: 8.38, P3: 9.98, TEST: 12.76, JESS: 14.3, ORDERS: 14.76, P4: 16.56, SWALLOW: 19.46, SPICE: 20.62, KILL: 21.94, P5: 23.0, WAKE: 24.12, TRANCE: 26.21, FURTHER: 27.19, P6: 28.33, EVERY: 29.75, END: 32.71, P7: 34.03, STAG: 34.69, EXT: 36.89, P8: 38.81, ONE: 39.37, GOLD: 41.23, WALK: 42.61, P9: 44.11, THOUS: 45.15, HARD: 46.93, P10: 48.49, NEVER: 49.37, SAVIOR: 50.97, P11: 52.31, REFUSED: 52.61, PRICE: 53.65, LETO: 54.49, DECIDES: 56.89, P12: 58.5, LETS: 61.5, TROUT: 62.44, WORMS: 63.99, P13: 64.82, COVER: 66.05, LIVING: 67.9, P14: 70.17, INVIN: 71.14, FASTER: 72.56, LIVE: 74.17, P15: 76.2, BACK: 77.05, CENT: 80.5, CENT2: 81.05, WORM: 82.26, FIN: 83.327 };
const TF = { WHY: en('fijate2', 0.0549), Q2: en('fijate2', 0.1593), DISC: en('fijate2', 0.1917), Q3: en('fijate2', 0.2982), TODAY: en('fijate2', 0.4059), BIG: en('fijate2', 0.4517), Q4: en('fijate2', 0.4635), THREAT: en('fijate2', 0.5050), HUNDRED: en('fijate2', 0.5141), NIGHT: en('fijate2', 0.6013), Q5: en('fijate2', 0.6385), SAVE: en('fijate2', 0.6950), PLANET: en('fijate2', 0.7440), Q6: en('fijate2', 0.7828), OPP: en('fijate2', 0.8016), PEOPLE: en('fijate2', 0.8522), BORN: en('fijate2', 0.8920), Q7: en('fijate2', 0.9076), SCALE: en('fijate2', 0.9163), WEIGH: en('fijate2', 0.9588) };

const H = hex, K = H('#1a1424'), ri = Math.round, ease = (u) => u * u * (3 - 2 * u), cl = (v, a, b) => Math.max(a, Math.min(b, v));
const LT = T.LT, PA = T.PA, AT = T.AT;
const hh = (a, b, c = 0) => { let n = (a * 374761393 + b * 668265263 + c * 1442695041) | 0; n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
const BAY = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const tono = (cols, v, x, y) => { const n = cols.length - 1; v = Math.max(0, Math.min(n, v)); let l = Math.floor(v); if (v - l > BAY[y & 3][x & 3] / 16) l++; return cols[Math.min(n, l)]; };
const pal = (...a) => a.map(H);
const FIJOS = {};
const horno = (k, f) => { if (!FIJOS[k]) { const b = R.nuevo(), prev = R.usar(b); f(); R.usar(prev); FIJOS[k] = b; } return FIJOS[k]; };
const pegar = (b, y0 = 0, y1 = 179) => { const D = R.buf; for (let i = y0 * 320; i < (y1 + 1) * 320; i++) { const c = b[i]; if (c) D[i] = c; } };
const flota = (t, k = 0) => Math.round(Math.sin(t * 2.4 + k) * 1.5);
const ps = (x, y, c) => R.pset(ri(x), ri(y), c);
const bola = (x, y, r, c, a) => { for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) if (i * i + j * j <= r * r + 0.5) mezP(x + i, y + j, c, a); };
const mezP = (x, y, c, a) => { x = ri(x); y = ri(y); if (x < 0 || y < 0 || x > 319 || y > 179) return; R.pset(x, y, mez(R.pget(x, y), c, a)); };
const libreAtom = (x, y) => !(x > 268 && y < 50) && !(x > 14 && x < 176 && y < 22);
// un pájaro (V de 5 px) que aletea
const pajaro = (x, y, t, c = K, f = 0) => { x = ri(x); y = ri(y); if (!libreAtom(x, y)) return; const a = Math.sin(t * 14 + f) > 0;
  R.pset(x, y, c); R.pset(x - 1, y - (a ? 1 : 0), c); R.pset(x + 1, y - (a ? 1 : 0), c); R.pset(x - 2, y - (a ? 2 : 0), c); R.pset(x + 2, y - (a ? 2 : 0), c); };
// nube de bolitas de tres tonos
const nube = (x, y, w, cols, k) => { const n = Math.max(3, ri(w / 6)); for (let i = 0; i < n; i++) { const cx = ri(x + i * w / n), r = 3 + ri(hh(k, i, 7) * 3); R.disco(cx, y + 1, r, cols[0]); }
  for (let i = 0; i < n; i++) { const cx = ri(x + i * w / n), r = 3 + ri(hh(k, i, 7) * 3); R.disco(cx, y, r - 1, cols[1]); R.disco(cx - 1, y - 1, Math.max(1, r - 2), cols[2]); } };
// nubes a tres velocidades (lista [x0, y, ancho, vel]); nunca en la esquina de Atom ni sobre el año
const nubes = (t, lista, cols, sem = 0) => lista.forEach(([x0, y, w, v], k) => { const x = (((x0 + t * v + sem * 37) % 420) + 420) % 420 - 60;
  if (x + w > 262 && y < 52) return; if (x < 178 && y < 26) return; nube(x, y, w, cols[k % cols.length], k + sem); });
// un cielo tramado en búfer: degradado con dither, halo del sol, y velos
const pintaCielo = (cols, y0, y1, sol, k = 0) => { for (let y = y0; y <= y1; y++) for (let x = 0; x < 320; x++) {
  let v = (y - y0) / Math.max(1, y1 - y0) * (cols.length - 1) + (hh(x >> 2, y >> 1, k) - 0.5) * 0.35 + Math.sin(x * 0.03 + y * 0.2 + k) * 0.15;
  if (sol) { const d = Math.hypot(x - sol[0], (y - sol[1]) * 1.3); if (d < sol[2]) { R.pset(x, y, d < sol[2] - 2 ? H('#fff6d0') : H('#ffe08a')); continue; } if (d < sol[2] * 5) v += (1 - d / (sol[2] * 5)) * 1.6; }
  R.pset(x, y, tono(cols, v, x, y)); } };
// una capa de dunas: cresta y(x); por debajo, cara a la luz o en sombra según la pendiente, filo claro, rizaduras y punteado
const crestaY = (c, X) => c.y + c.amp * (0.55 * Math.sin(X * c.f + c.ph) + 0.3 * Math.sin(X * c.f * 2.3 + c.ph * 1.7) - 0.25 * Math.abs(Math.sin(X * c.f * 0.6 + c.ph)));
const pintaCapa = (c, xo = 0, yfin = 180) => { for (let x = 0; x < 320; x++) { const X = x + xo, y0 = Math.ceil(crestaY(c, X)), sl = crestaY(c, X + 1.5) - crestaY(c, X - 1.5);
  for (let y = Math.max(0, y0); y < yfin; y++) { const d = y - y0; let v = c.v - sl * c.luz + (d < 1 ? 1.4 : d < 3 ? 0.5 : 0) - Math.min(d, 40) * (c.cae ?? 0.02);
    const rip = Math.sin(X * 0.31 + y * 1.75 + Math.sin(X * 0.045 + y * 0.12) * 4); if (d > 2 && rip > 0.84) v += 0.8; else if (d > 2 && rip < -0.9) v -= 0.6;
    v += (hh(X, y, c.k ?? 0) - 0.5) * 0.55; R.pset(x, y, tono(c.cols, v, X, y)); } } };
// una roca de basalto (mancha irregular con luz arriba a la izquierda, grietas y filo)
const roca = (cx, cy, rx, ry, cols, k = 0) => { for (let j = -ry; j <= ry; j++) for (let i = -rx; i <= rx; i++) {
  const a = Math.atan2(j, i), rr = 1 + 0.18 * Math.sin(a * 3 + k) + 0.12 * Math.sin(a * 7 + k * 2), e = Math.hypot(i / rx, j / ry) / rr; if (e > 1 || j > ry * 0.7) continue;
  let v = 2.4 - j / ry * 1.2 - i / rx * 0.6 + (hh(cx + i, cy + j, k) - 0.5) * 0.8 + (e > 0.9 ? -1 : 0); const cc = (i + 400 + ri(Math.sin(j * 0.15 + k) * 2)) % 9; if (cc === 0) v -= 1.3; else if (cc === 1) v += 0.7; if ((j + 400) % 13 === 0 && hh(i >> 3, j, k) > 0.5) v -= 0.9;
  R.pset(cx + i, cy + j, tono(cols, v, cx + i, cy + j)); } };
// sombra tramada en el suelo
const sombraSuelo = (cx, cy, rx, ry, a = 0.45) => { for (let j = -ry; j <= ry; j++) for (let i = -rx; i <= rx; i++) if ((i / rx) ** 2 + (j / ry) ** 2 <= 1 && ((i + j) & 1) === 0) mezP(cx + i, cy + j, H('#2a1a20'), a); };
// arena que vuela de una cresta (granos claros que se van con el viento)
const arenaVuela = (t, pts, c, n = 14, vx = 22) => pts.forEach(([x0, y0], q) => { for (let k = 0; k < n; k++) { const f = (t * (0.5 + hh(k, q, 3) * 0.6) + hh(k, q, 4)) % 1;
  const x = x0 + f * vx * (1 + hh(k, q, 5)), y = y0 - Math.sin(f * 3) * 3 - hh(k, q, 6) * 3 + f * 2; if (f < 0.9) mezP(x, y, c, 0.7 - f * 0.6); } });
// un personaje en tinte de visión (fantasma azul y translúcido)
let TMP = null;
const fantasma = (def, x, suelo, t, o = {}, a = 0.6, tin = H('#9ad8ff'), mt = 0.55) => { x = ri(x); suelo = ri(suelo); if (!TMP) TMP = R.nuevo(); TMP.fill(0); const prev = R.usar(TMP); R.actor(def, x, suelo, t, o); R.usar(prev);
  for (let y = Math.max(0, suelo - 46); y < Math.min(180, suelo + 2); y++) for (let xx = Math.max(0, x - 12); xx < Math.min(320, x + 34); xx++) { const c = TMP[y * 320 + xx]; if (c) mezP(xx, y, mez(c, tin, mt), a * (0.85 + 0.15 * Math.sin(t * 5 + y * 0.6))); } };
// la cicatriz morada de Gurney (en la mejilla, según adónde mire)
const cicatriz = (g, dir) => { const x0 = g.cabeza[0] - 7, y0 = g.cabeza[1]; for (const [i, j] of [[7, 7], [7, 8], [6, 9], [8, 6]]) R.pset(dir > 0 ? x0 + i : x0 + 14 - i, y0 + j, H('#8a3a8a')); };
// gente diminuta (3 × 6) para las visiones; de rodillas con kn
const gentecilla = (x, y, c, kn = 0, cab = H('#e8c8a0')) => { x = ri(x); y = ri(y); const h = kn ? 3 : 5; R.rect(x - 1, y - h, x + 1, y, c); R.pset(x, y - h - 1, cab); R.pset(x - 1, y - h, mez(c, K, 0.3)); if (!kn) { R.pset(x - 1, y, K); R.pset(x + 1, y, K); } };

// ── EL VACÍO DE LA VISIÓN (fondo de los planos 6, 7, 9, 10 y 11): nebulosa tramada, estrellas en dos capas y galaxias ──
const NEB = pal('#04051a', '#080c28', '#0e1440', '#161e58', '#22306e', '#34408a', '#4a4ea0', '#6a5cb0');
const vacio = (k = 0) => horno('vacio' + k, () => {
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) { const n = Math.sin(x * 0.021 + y * 0.013 + k) * 0.9 + Math.sin(x * 0.047 - y * 0.031 + k * 2) * 0.7 + Math.sin(x * 0.11 + y * 0.07) * 0.3 + Math.sin((x + y) * 0.009 + k * 3) * 1.2;
    let v = 1.4 + n * 0.9 + (hh(x >> 1, y >> 1, 9 + k) - 0.5) * 0.5 - Math.max(0, 40 - y) * 0.02; R.pset(x, y, tono(NEB, v, x, y)); }
  for (let s = 0; s < 260; s++) { const x = ri(hh(s, 1, k) * 319), y = ri(hh(s, 2, k) * 179); if (!libreAtom(x, y)) continue; R.pset(x, y, hh(s, 3, k) > 0.8 ? H('#ffffff') : H('#8a9ad8')); }
  for (let g = 0; g < 2; g++) { const gx = 40 + hh(g, 4, k) * 200, gy = 50 + hh(g, 5, k) * 70; for (let a = 0; a < 46; a++) { const an = a * 0.4, r = a * 0.16; mezP(gx + Math.cos(an) * r * 1.6, gy + Math.sin(an) * r * 0.6, H('#c8b8f0'), 0.3); mezP(gx - Math.cos(an) * r * 1.6, gy - Math.sin(an) * r * 0.6, H('#c8b8f0'), 0.3); } mezP(gx, gy, H('#ffffff'), 0.8); mezP(gx + 1, gy, H('#e8e0ff'), 0.5); }
});
// estrellas que titilan y motas de luz que suben (vida del vacío)
const vivoVacio = (t, k = 0, oro = 0) => { for (let s = 0; s < 40; s++) { const x = ri(hh(s, 11, k) * 319), y = ri(hh(s, 12, k) * 179); if (!libreAtom(x, y)) continue; const b = Math.sin(t * (1.5 + hh(s, 13, k) * 3) + s);
    if (b > 0.4) { R.pset(x, y, H('#ffffff')); if (b > 0.85) { mezP(x - 1, y, H('#a8c8ff'), 0.6); mezP(x + 1, y, H('#a8c8ff'), 0.6); mezP(x, y - 1, H('#a8c8ff'), 0.6); mezP(x, y + 1, H('#a8c8ff'), 0.6); } } }
  for (let m = 0; m < 16; m++) { const f = (t * (0.05 + hh(m, 14, k) * 0.05) + hh(m, 15, k)) % 1, x = hh(m, 16, k) * 320 + Math.sin(t + m) * 6, y = 182 - f * 190; if (libreAtom(x, y)) mezP(x, y, m < oro * 16 ? H('#ffd870') : H('#8ad8ff'), 0.5 * Math.sin(f * Math.PI)); } };

// ══ 1 · LAS DUNAS AL OCASO: Leto sube solo la duna; en la roca, unos ojos azules y una cabeza que se esconde ══
const OCASO = pal('#2a1e4a', '#422a62', '#663a6e', '#94486c', '#c45a62', '#e47c58', '#f2a65a', '#f8cc7c');
const NUB1 = [pal('#5a3264', '#9a4e72', '#e69a7c'), pal('#4a2c5c', '#7e4270', '#c46a72'), pal('#6a3a6a', '#b4607a', '#f4b48a')];
const D1 = [{ y: 104, amp: 3, f: 0.045, ph: 1, v: 2.2, luz: 1.2, cols: pal('#5a2e3a', '#7a3e40', '#9a5444', '#b86e4a', '#d08a56', '#e4a86a'), k: 1 },
  { y: 118, amp: 7, f: 0.03, ph: 2.4, v: 2.6, luz: 1.4, cols: pal('#5a2e34', '#82443c', '#a85c44', '#c87a4c', '#e09a5a', '#f0b870'), k: 2 },
  { y: 136, amp: 9, f: 0.022, ph: 4.1, v: 2.8, luz: 1.6, cols: pal('#5a2c2c', '#864634', '#b0623c', '#d08446', '#eaa456', '#f8c470', '#fff0b0'), k: 3 },
  { y: 158, amp: 7, f: 0.017, ph: 0.6, v: 3.0, luz: 1.8, cols: pal('#4a2626', '#7a3e2c', '#a85c34', '#cc7e40', '#e8a050', '#f8c46a', '#fff0b0'), k: 4 }];
const BAS = pal('#140e1a', '#22182a', '#342438', '#4a3444', '#664a52', '#8a6462');
const cielo1 = () => horno('cielo1', () => { pintaCielo(OCASO, 0, 112, [74, 98, 9], 1);
  // mesetas lejanas en el horizonte
  for (let x = 0; x < 320; x++) { const m = 98 - Math.max(0, Math.sin(x * 0.03 + 1) * 6 + Math.sin(x * 0.09) * 2) * (x > 150 && x < 250 ? 1 : 0.4); for (let y = ri(m); y < 106; y++) R.pset(x, y, tono(pal('#4a2a4a', '#5e3454', '#74405a'), 1 + (hh(x, y, 2) - 0.5) + (y - m) * 0.1, x, y)); } });
const dunas1 = () => horno('dunas1', () => { D1.forEach((c) => pintaCapa(c));
  // la cresta de basalto de la derecha (donde vigilan) y peñas sueltas
  roca(262, 112, 62, 50, BAS, 3); roca(222, 126, 26, 18, BAS, 5); roca(300, 140, 30, 24, BAS, 7);
  // huellas viejas y matas secas
  for (let k = 0; k < 6; k++) { const x = 18 + k * 14, y = ri(crestaY(D1[3], x)) + 6; R.pset(x, y, H('#8a4a30')); R.pset(x + 1, y, H('#8a4a30')); }
  for (const [mx, my, s] of [[40, 168, 1], [150, 174, 1.4], [196, 164, 1], [112, 162, 0.8], [8, 176, 1.6]]) for (let k = -3; k <= 3; k++) { R.linea(mx, my, ri(mx + k * 2 * s), ri(my - (6 - Math.abs(k)) * s), H('#5a3a22')); R.pset(ri(mx + k * 2 * s), ri(my - (6 - Math.abs(k)) * s), H('#a8804a')); }
  for (let k = 0; k < 40; k++) { const x = ri(hh(k, 1, 19) * 320), y = 160 + ri(hh(k, 2, 19) * 19); R.rect(x, y, x + 1, y, H('#6a3a24')); R.pset(x, y - 1, H('#e8a868')); } });
const suelo1 = (x) => ri(crestaY(D1[3], x + 7)) + 1;
const p1 = (t) => {
  R.copiar(cielo1());
  nubes(t, [[10, 40, 40, 3], [120, 30, 50, 1.5], [200, 66, 36, 5], [60, 74, 28, 7], [250, 80, 30, 2.5]], NUB1, 1);
  for (let k = 0; k < 5; k++) pajaro(((60 + k * 40 + t * (6 + k)) % 340) - 10, 52 + k * 5 + Math.sin(t + k) * 2, t, H('#3a1e30'), k);
  // el vigía de la roca (detrás de la peña: se asoma en «alone» y se esconde)
  const asoma = tramo(t, 2.5, 2.9) - tramo(t, 3.35, 3.7);
  if (asoma > 0) R.actor(PA.fremen, 246, 73 + ri((1 - asoma) * 14), t, { dir: -1, quieto: true });
  pegar(dunas1());
  // ojos azules que parpadean entre las peñas
  for (const [ex, ey, f] of [[214, 116, 0], [286, 132, 1.3]]) if (t > 1.2 && Math.sin(t * 2 + f) > -0.6 && (t + f) % 1.7 > 0.12) { R.pset(ex, ey, H('#6ac8ff')); R.pset(ex + 3, ey, H('#6ac8ff')); mezP(ex, ey - 1, H('#3a8ad8'), 0.5); mezP(ex + 3, ey - 1, H('#3a8ad8'), 0.5); }
  arenaVuela(t, [[60, ri(crestaY(D1[2], 60))], [150, ri(crestaY(D1[2], 150))], [100, ri(crestaY(D1[3], 100))]], H('#ffe0a0'), 12, 26);
  // Leto sube la duna; en «alone» se para y mira atrás (no ve a nadie) y sigue
  const u = tramo(t, 0, 2.45) * 0.7 + tramo(t, 3.5, 4.0) * 0.3, x = ri(lerp(18, 156, u)), mira = t > 2.55 && t < 3.45;
  for (let q = 22; q < x - 4; q += 6) { const y = suelo1(q) + ((q / 6) % 2 ? 0 : 2); R.rect(q + 6, y, q + 8, y + 1, H('#7a3a24')); R.pset(q + 6, y - 1, H('#5a2a1a')); }
  // un ratón canguro cruza a saltos por delante

// ══ 15 · LA SOMBRA (tarde dorada): Leto se para y se mira las manos; su sombra se alarga y en «sandworm» es la de un gusano ══
const TARDE = pal('#4a3a6a', '#6a4a78', '#8e5a78', '#b46e70', '#d88a66', '#ecaa66', '#f6c676', '#fae29a');

  if (!o.quieto) for (let k = 0; k < 4; k++) pajaro(((100 + k * 50 + t * (5 + k)) % 340) - 10, 70 + k * 6, t, H('#3a2030'), k);

const atomG = (x, s, t, o = {}) => AT.atom(R, x, s, t, { s: 2, habla: voz(t), ...o });

const q2 = (t) => {
