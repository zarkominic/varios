<canvas id="lienzo"></canvas>
<script type="module">
// _REPARTO-MC · hoja estática del reparto del episodio 38 (El Mary Celeste), a escala 1 y al doble, sobre fondo neutro.
import { crearRoma } from '/atomo/plato/kits/pixel-roma.js';
import { conChibi, ELENCO_MC as EL } from '/atomo/plato/kits/pixel-chibi.js';
import { hex } from '/atomo/plato/kits/pixel-retro.js';
const R = conChibi(await crearRoma(document.getElementById('lienzo')));
const F1 = ['briggsMC', 'sarahMC', 'sophiaMC', 'arthurMC', 'abuelaMC', 'morehouseMC', 'deveauMC', 'wrightMC', 'marineroMC', 'estibadorMC', 'pintorMC'];
const F2 = ['sollyfloodMC', 'doyleMC', 'parkerMC', 'sellaMC', 'rowbothamMC', 'mairMC', 'buzoMC'];
window.__frame = async (t) => {
  R.rect(0, 0, 319, 179, hex('#e8e4dc'));
  F1.forEach((k, i) => R.actor(EL[k], 6 + i * 28, 70, 0, { quieto: true, parpadea: false }));
  F2.forEach((k, i) => R.actor(EL[k], 6 + i * 28, 140, 0, { quieto: true, parpadea: false }));
  R.rect(0, 71, 319, 72, hex('#c8c0b0')); R.rect(0, 141, 319, 142, hex('#c8c0b0'));
  R.presentar();
};
window.__listo = true;
</script>
