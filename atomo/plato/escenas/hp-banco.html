  { const u = tramo(t, P3 + 0.1, P3 + 1.6), mx = Math.round(lerp(20, 300, u)), my = 172 - (Math.floor(t * 14) % 2); if (u > 0 && u < 1) { R.rect(mx - 2, my - 2, mx + 2, my, hex('#6a5e58')); R.rect(mx - 1, my - 3, mx + 1, my - 3, hex('#6a5e58')); R.pset(mx + 3, my - 1, hex('#8a7e78')); R.pset(mx + 3, my - 2, K); R.pset(mx + 2, my - 4, hex('#c89a9a')); R.linea(mx - 3, my, mx - 6, my - 1, hex('#c89a9a')); } }

  { const u = tramo(t, P3 + 0.6, P3 + 2.2); if (u > 0 && u < 1) { R.recorte([20, 30, 60, 96]); const ox = Math.round(lerp(12, 70, u)), oy = Math.round(60 - Math.sin(u * Math.PI) * 8); for (let k = -1; k <= 1; k++) { R.pset(ox + k, oy, hex('#14101c')); } R.pset(ox, oy - 1, hex('#14101c')); const al = Math.sin(t * 16) > 0; R.linea(ox - 4, oy + (al ? -2 : 1), ox - 1, oy, hex('#14101c')); R.linea(ox + 1, oy, ox + 4, oy + (al ? -2 : 1), hex('#14101c')); R.recorte(null); } }

// el plano 4: OTRA composición, el espejo en contrapicado y de cerca. El marco dorado sube cortado por arriba y por los

const roba = a(0.575), puesto = a(0.6), duda = a(0.62);

const ORO = ['#4a300c', '#7a5414', '#a8781e', '#d8a830', '#f0cc58', '#fff0a0'].map(hex);

let fondo4 = null;

  for (let y = 0; y <= 146; y++) { const x0 = Math.ceil(e4L(y)), x1 = Math.floor(e4R(y)); for (let x = x0; x <= x1; x++) {

    if (y < 116) { const fila = Math.floor(y / 9), jx = (x + (fila & 1) * 9) % 18; if (y % 9 === 0 || jx === 0) l -= 0.1; else l += 0.05 * hs(Math.floor((x + (fila & 1) * 9) / 18), fila); }
