<script type="module">
// MS-VOLCAN (frase 14), LA PAUSA «fíjate» del año sin verano. Seis planos sobre planos congelados de ms-lago (las mismas
// funciones de plano, idénticas):

// 3. el Jura congelado (p2): el globo grande en el centro, en su peana; el volcán pequeño en el borde izquierdo; en «ash»
//    su penacho llega al globo y una banda de ceniza de tres grises lo rodea; en «planet's» se cierra y el globo se agrisa;
// 4. la salita congelada (p8): el termómetro grande baja en «dropped»; «-0.5» en «half a degree»; la hoja «12» en «year»;
// 5. el prado congelado (p6): «1816»; el maizal nevado (T.pausa 'volcan' con o.nieve) en «snowed»; copos; Atom tirita;
//    «X» en «harvests failed»;
// 6. las viñas congeladas (p5): la hoja de 1816 con el sol; en «without a summer» se tacha con una X roja.
import * as T from '/atomo/plato/escenas/ms-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('ms-volcan');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const K = hex('#1a1424'), ri = Math.round, ease = (u) => u * u * (3 - 2 * u), voz = (t) => E.energia?.(t) ?? 0, MS = T.MS, AT = T.AT;
const hh = (a, b, c = 0) => { let n = (a * 374761393 + b * 668265263 + c * 1442695041) | 0; n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
const BAY = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const tono = (cols, v, x, y) => { const n = cols.length - 1; v = Math.max(0, Math.min(n, v)); let l = Math.floor(v); if (v - l > BAY[y & 3][x & 3] / 16) l++; return cols[Math.min(n, l)]; };
const pal = (...a) => a.map(hex);
const cl = (v) => Math.max(0, Math.min(1, v));
const capas = {};
const capa = (k, f) => { if (!capas[k]) { const b = R.nuevo(); const prev = R.usar(b); f(); R.usar(prev); capas[k] = b; } return capas[k]; };
const pegar = (b) => { const D = R.buf; for (let i = 0; i < 57600; i++) { const c = b[i]; if (c) D[i] = c; } };
const tine = (x, y, c, a) => { x = ri(x); y = ri(y); if (x < 0 || x > 319 || y < 0 || y > 179) return; R.pset(x, y, mez(R.pget(x, y), c, a)); };
const halo = (cx, cy, r, c, a) => { cx = ri(cx); cy = ri(cy);
  for (let y = Math.max(0, cy - r); y <= Math.min(179, cy + r); y++) for (let x = Math.max(0, cx - r); x <= Math.min(319, cx + r); x++) {
    const d = Math.hypot(x - cx, y - cy) / r; if (d >= 1) continue; const q = Math.floor(((1 - d) * (1 - d)) * 4 + BAY[y & 3][x & 3] / 16) / 4; if (q > 0) R.pset(x, y, mez(R.pget(x, y), c, Math.min(0.9, q * a))); } };
// tiñe todo el lienzo hacia c (a 0–1)
const velo = (c, a, y0 = 0, y1 = 179) => { if (a <= 0) return; const B = R.buf, cr = c & 255, cg = (c >>> 8) & 255, cb = (c >>> 16) & 255;
  for (let i = y0 * 320; i < (y1 + 1) * 320; i++) { const v = B[i], r = v & 255, g = (v >>> 8) & 255, b = (v >>> 16) & 255;
    B[i] = (0xff000000 | (Math.round(b + (cb - b) * a) << 16) | (Math.round(g + (cg - g) * a) << 8) | Math.round(r + (cr - r) * a)) >>> 0; } };
// nube de bolitas en tres tonos (sombra, cuerpo, luz)
const nube = (cx, cy, w, cols, k) => { const n = Math.max(3, Math.round(w / 7)), X = (i) => ri(cx - w / 2 + (i + 0.5) * w / n), al = (i) => Math.sin(Math.PI * (i + 0.5) / n),
    r = (i) => 3 + hh(k, i, 3) * 2.5 + al(i) * Math.min(7, w * 0.09), Y = (i) => ri(cy - al(i) * w * 0.07 - hh(k, i, 4) * 2);
  for (let i = 0; i < n; i++) R.disco(X(i), Y(i) + 1, ri(r(i)), cols[0]);
  for (let i = 0; i < n; i++) R.disco(X(i), Y(i), ri(r(i) - 1), cols[1]);
  for (let i = 0; i < n; i++) R.disco(X(i) - 1, Y(i) - 2, Math.max(1, ri(r(i) - 3)), cols[2]);
  for (let x = ri(cx - w / 2); x <= ri(cx + w / 2); x++) { R.pset(x, ri(cy) + 2, cols[0]); R.pset(x, ri(cy) + 3, cols[0]); } };
// tres capas de nubes a tres velocidades (cúmulos grandes y lentos abajo, medianos en medio, borreguitos rápidos arriba)
const nubes = (t, y0, y1, C3, sem = 0, v = 1) => {
  for (let k = 0; k < 3; k++) { const w = 90 + hh(k, 1, sem) * 50, x = ((hh(k, 2, sem) * 480 + t * 2 * v + k * 160) % 480) - 80; nube(x, y1 - 8 - hh(k, 3, sem) * 6, w, C3[0], k + sem); }
  for (let k = 0; k < 4; k++) { const w = 40 + hh(k, 4, sem) * 34, x = ((hh(k, 5, sem) * 420 + t * 5 * v + k * 105) % 420) - 50; nube(x, (y0 + y1) / 2 + hh(k, 6, sem) * 14 - 7, w, C3[1], k + 9 + sem); }
  for (let k = 0; k < 4; k++) { const w = 14 + hh(k, 7, sem) * 14, x = ((hh(k, 8, sem) * 380 + t * 11 * v + k * 95) % 380) - 30; nube(x, y0 + 4 + hh(k, 9, sem) * 12, w, C3[2], k + 19 + sem); } };
// un pájaro que aletea
const ave = (x, y, t, c, f = 0) => { x = ri(x); y = ri(y); const a = Math.sin(t * 12 + f) > 0; R.pset(x, y, c); R.pset(x - 1, y - (a ? 1 : 0), c); R.pset(x + 1, y - (a ? 1 : 0), c); R.pset(x - 2, y - (a ? 2 : 0), c); R.pset(x + 2, y - (a ? 2 : 0), c); };
// lluvia en diagonal (n gotas en la caja), de color c

  for (let k = 0; k < n; k++) { const x = x0 + ((hh(k, 1, sem) * W + t * v * dx) % W), y = y0 + ((hh(k, 2, sem) * H + t * v) % H);
    for (let j = 0; j < lar; j++) tine(x - j * dx, y - j, c, a); } };

const sierra = (yb, picos, cols, nieve = 0.5, sem = 0) => {
  for (let x = 0; x < 320; x++) { let a = 0, pk = 0; for (const [px, al, w] of picos) { const v = al * (1 - Math.abs(x - px) / w); if (v > a) { a = v; pk = px; } }
    a += Math.sin(x * 0.37 + sem) * 1.3 + (hh(x >> 1, 5, sem) - 0.5) * 2.4; if (a <= 0) continue;
    const top = ri(yb - a), luz = x < pk, linea = a * nieve;

      const canal = Math.sin((x + y * (luz ? 0.9 : -0.9)) * 0.55 + hh(x >> 3, 1, sem) * 6) > 0.86;
      const enNieve = alt > a - linea - (hh(x, 3, sem) * 5) + (canal ? 4 : 0);
      let c;
      if (borde) c = enNieve ? cols[6] : cols[3];
      else if (enNieve) c = canal ? cols[4] : luz ? (hh(x, y, sem) > 0.85 ? cols[5] : cols[6]) : (hh(x, y, sem) > 0.8 ? cols[4] : cols[5]);
      else c = canal ? cols[0] : luz ? tono([cols[1], cols[2], cols[3]], 1.2 + hh(x >> 1, y >> 1, sem) * 0.9, x, y) : tono([cols[0], cols[1], cols[2]], 0.9 + hh(x >> 1, y >> 1, sem), x, y);
      const br = cl((alt < 10 ? (10 - alt) / 10 : 0) * 0.7);
      R.pset(x, y, br > 0 ? mez(c, cols[7], br) : c); } } };
// un pino: copa en pisos con luz a la izquierda (cols: D, S, M, L)
const pino = (x, yb, a, cols, k = 0) => { x = ri(x); yb = ri(yb); R.rect(x, yb - 3, x + 1, yb, hex('#3a2a1c'));
  for (let j = 0; j < a; j++) { const piso = j % 5, w = Math.max(0, ri(j * 0.34 + piso * 0.5 - 1)), y = yb - 3 - a + j;
    for (let i = -w; i <= w + 1; i++) R.pset(x + i, y, (i === -w || i === w + 1) && j > 2 ? cols[0] : piso === 4 ? cols[1] : i < -w * 0.25 ? cols[3] : i > w * 0.45 ? cols[1] : cols[2]); }
  R.pset(x, yb - 3 - a, cols[3]); };
// un álamo que se mece (copa alta y estrecha), v: el viento
const alamo = (x, yb, a, t, v, cols, k = 0) => { x = ri(x); R.rect(x - 1, yb - ri(a * 0.3), x, yb, hex('#4a3a2a'));
  for (let j = 0; j < a; j++) { const y = yb - ri(a * 0.18) - j, u = j / a, w = ri(Math.sin(u * Math.PI) * a * 0.14 + 1), m = ri(Math.sin(t * 2.2 + k) * v * u * u * 3);
    for (let i = -w; i <= w; i++) { const n = hh(x + i, y, k); R.pset(x + i + m, y, i === -w || i === w ? cols[0] : n > 0.8 ? cols[3] : i < 0 ? cols[2] : n < 0.3 ? cols[0] : cols[1]); } } };
// el bebé William: un hatillo de lino con encaje, la carita y una manita que se mueve
const bebe = (x, y, t, k = 0) => { x = ri(x); y = ri(y); const L = hex('#f4efe2'), LS = hex('#c8c0ae'), EN = hex('#ffffff'), PI = hex('#f6c8a0');
  R.rect(x - 5, y - 3, x + 4, y + 2, K); R.rect(x - 4, y - 2, x + 3, y + 1, L); R.linea(x - 4, y + 1, x + 3, y + 1, LS); R.linea(x - 4, y - 2, x - 4, y + 1, LS);
  for (const i of [-3, -1, 1]) R.pset(x + i, y - 3, EN);
  R.rect(x + 1, y - 3, x + 3, y - 1, PI); R.pset(x + 2, y - 2, K); R.pset(x + 1, y - 4, hex('#c8905a')); R.pset(x + 2, y - 4, hex('#c8905a'));

// un corazón pequeño

// lo que se ve por un hueco (una ventana, un cristal): f dibuja en un búfer aparte y se pega solo dentro de [x0, y0, x1, y1]
// (salta(x, y): píxeles que no se pegan, como los montantes); a > 0: se mezcla con lo de detrás (el vaho del cristal)

const s = (f) => 1.5 + 28.134 * f, l = (f) => 30.034 + 18.122 * f;

const NUB_G = [pal('#6a7282', '#8a92a0', '#a8aeb8'), pal('#7a8290', '#9aa2ae', '#bcc2ca'), pal('#8e96a2', '#b0b6c0', '#d0d4da')];

// ═══ 1 · el coche de posta por los Alpes: Mary con William en brazos (la ventanilla) ═══════════════════════════════
const CIELO1 = pal('#6e7c92', '#7e8ca0', '#909cae', '#a4aebc', '#b8c0c8');

  // los Alpes lejos, nevados, con bruma al pie (la esquina de Atom queda en cielo)

  const VE = pal('#1e3428', '#2e4a3a', '#3e6050', '#5a7c68'), OR = hex('#c8a040'), ORL = hex('#f0d080'), MAD = pal('#3a2414', '#5a3a20', '#7a5230');

      R.pset(xx, yy, b ? K : yy === by - 64 || (yy === by - 30 && xx > x + 12 && xx < x + 88) ? OR : xx < x + 10 ? VE[3] : xx > x + 90 ? VE[0] : tono(VE, 1.6 + (yy < by - 50 ? 0.6 : 0) + hh(xx >> 2, yy >> 2, 4) * 0.4, xx, yy)); } }
