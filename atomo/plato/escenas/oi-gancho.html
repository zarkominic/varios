// OI-GANCHO (frases 1–3), 1795, cartela «1795». Siete planos:
// 1. la bahía de Mahone: el muchacho rema desde la izquierda hacia la isla de robles (goleta, pescador, foca, gaviotas);
// 2. la llegada a la playa de la isla (otro encuadre: la cámara en la orilla): la barca entra remando, en «and a teenager»
//    Daniel mira por encima del hombro y señala la isla; la quilla vara en la arena, salta a la playa y señala los robles

// 3. el mapa de papel: un brillo dorado marca Nueva Escocia, el aro grueso (filo oscuro, late) se cierra sobre la bahía de
//    Mahone, cae la chincheta grande con su sombra y llega un velero por el Atlántico (corta en «in Mahone Bay»);
// 4. el claro: Daniel llega, ve el hoyo hundido, «?», da un saltito y la tierra blanda cede (corta en «In a clearing»);
// 5. inserto: la rama del roble y la vieja polea; la mano (T.brazo) coge el chicote desde el principio y tira dos veces:

//    musgo y huecos, tocón y setas (corta en «and from a branch»);
// 6. la boca del pozo en 1795: vuelve con dos amigos; uno cava dentro, Daniel tira de la soga, la losa asoma por el
//    brocal y el otro la coge a la cintura y se la lleva; la gaviota roba el bocadillo de la cesta (gag) (corta en «He comes back»);

// Sonido (pulido): viento de la bahía, remos, olas, el aro y la ruta del mapa, crujidos de la polea y paladas, al 40–55 %.
import * as T from '/atomo/plato/escenas/oi-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('oi-gancho');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };

// fondo fijo en un búfer (se pinta una vez y se copia en cada fotograma; R.usar(prev), nunca R.usar() a secas)
const FIJO = {};

const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

  for (let x = x0; x <= x1; x++) R.pset(x, y, f * 16 > BAY[(y & 3) * 4 + (x & 3)] + 0.5 ? cols[i + 1] : cols[i]); } };

const nube = (cx, cy, w, c3) => { const b = [[0, 0, .32], [-.32, .07, .23], [.31, .06, .25], [-.12, -.12, .25], [.15, -.09, .22], [.5, .12, .14], [-.5, .12, .13]];
  for (const [dx, dy, r] of b) R.disco(Math.round(cx + dx * w), Math.round(cy + dy * w + 2), Math.round(r * w), c3[0]);
  for (const [dx, dy, r] of b) R.disco(Math.round(cx + dx * w), Math.round(cy + dy * w), Math.round(r * w), c3[1]);

const nubes = (t, lista, c3, xmax = 320) => { for (const [x0, y, w, v] of lista) { const span = Math.min(xmax, y - w * .4 < 54 ? 262 - w * .6 : 320 + w * .6) + w * .6; const x = ((x0 + t * v) % span + span) % span - w * .6; nube(x, y, w, c3); } };
