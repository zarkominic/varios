<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Muestra v3 · ep5</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// RM3-MUESTRA · muestra de la v3 (frases 5–7: el mapa antes de la historia).
//  mapa    el Mediterráneo entero; el mar se ilumina («Mediterranean»), luego la bota («Italy»); zoom a Italia, el Tíber
//          se dibuja desde la fuente, salen las siete colinas y zoom hasta Roma.
//  aldea   la aldea al atardecer, por capas: montes lejanos, colinas con cabañas y humo, el Tíber que refleja el cielo,
//          pastores pequeños con contraluz y sombra, ovejas, un perro y pájaros. La cámara se desliza despacio.
//  barra   sobre el mapa en penumbra, la barra de tiempo se enciende por tramos (un rey, dos cónsules, un emperador)
//          y sube a su sitio arriba, con el marcador en 753.
import { preparar, rodar } from '/atomo/plato/escenas/rm-comun.js';
const { E, R } = await preparar('rm3-muestra');
const { PALA, PR, ELENCO, tramo, lerp, clamp } = R;
const SOL = R.hex('#ffb060');
const luz = { lado: 1, color: SOL };
const mapa = (t) => {
  let v = R.VISTAS.mundo;
  if (t > 7.6) v = R.entre(R.VISTAS.mundo, R.VISTAS.italia, tramo(t, 7.6, 9.8));
  if (t > 13.4) v = R.entre(R.VISTAS.italia, R.VISTAS.roma, tramo(t, 13.4, 15.2));
  const pulso = (a, b) => (t > a && t < b ? 0.5 + 0.5 * Math.sin((t - a) * 5) : 0) * clamp((b - t) * 2, 0, 1);
  R.mapa(t, { vista: v, luzMar: pulso(2.2, 5.6), luzItalia: t > 6 ? Math.min(1, (t - 6) * 2) * (t < 12 ? 1 : clamp(13 - t, 0, 1)) : 0, tiber: tramo(t, 10.4, 12), colinas: tramo(t, 12.6, 13.6) });
  if (t > 14.2) R.punto(...R.lugar('roma', undefined, v), t, PALA.ROJO, 3);
};
const aldea = (t) => {
  const pan = (t - 15) * 2.2;
  R.cieloR(t, 'tarde', { sol: [236, 96, 10], nubes: { n: 4, vel: 1.5 } });
  // montes lejanos (con la neblina del atardecer) y colinas medias con cabañas
  for (let x = 0; x < R.W; x++) {
    const xx = x + pan * 0.2, top = Math.round(92 - 14 * (0.5 + 0.5 * Math.sin(xx * 0.018 + 1)) - 6 * R.vnoise(xx * 0.05, 3));
    for (let y = top; y < 130; y++) R.pset(x, y, R.tone([PALA.PURPURA[1], PALA.PURPURA[2], R.hex('#b0506a')], 2 - (y - top) * 0.03 + (y === top ? 1 : 0), x, y));
  }
  for (let x = 0; x < R.W; x++) {
    const xx = x + pan * 0.5, colina = Math.round(118 - 16 * Math.abs(Math.sin(xx * 0.022)) - 4 * R.vnoise(xx * 0.08, 1));
    for (let y = colina; y < 140; y++) { const borde = y < colina + 1; R.pset(x, y, borde ? SOL : R.tone(PR.HIERBA, 1.2 + (y - colina) * 0.03 + (R.hash2(x >> 1, y >> 1) - 0.5) * 0.5, x, y)); }
  }
  for (const [x0, s] of [[60, 0.45], [104, 0.4], [150, 0.5], [212, 0.45], [262, 0.42]]) {
    const x = x0 - pan * 0.5, xx = x + pan * 0.5, colina = Math.round(118 - 16 * Math.abs(Math.sin(xx * 0.022)) - 4 * R.vnoise(xx * 0.08, 1));
    R.cabana(Math.round(x), colina + 3, s, t, { humo: x0 % 3 === 0 });
  }
  // el Tíber: refleja el cielo, con ondas y un brillo del sol
  for (let y = 138; y < 152; y++) for (let x = 0; x < R.W; x++) {
    const onda = Math.sin(x * 0.25 + y * 1.3 - t * 3) > 0.75, brillo = Math.abs(x - 236 + (y - 138) * 0.2) < 6 - (y - 138) * 0.3 && R.b4(x, y) < 0.5;
    R.pset(x, y, brillo ? SOL : onda && R.b4(x, y) < 0.5 ? PR.TARDE[3] : R.tone(PR.MAR, 1.4 + (y - 138) * 0.12 + (onda ? 1.2 : 0), x, y));
  }
  for (let x = 0; x < R.W; x++) R.pset(x, 138, PR.HIERBA[0]);
  // orilla de delante con juncos
  for (let y = 152; y < R.H; y++) for (let x = 0; x < R.W; x++) R.pset(x, y, R.tone(PR.HIERBA, 1.6 + (y - 152) * 0.03 + (R.hash2(x >> 1, y) - 0.5) * 0.6, x, y));
  for (let k = 0; k < 26; k++) { const x = (k * 37 + 11) % R.W, h = 4 + (k % 4), sw = Math.round(Math.sin(t * 2 + k) * 0.8); R.linea(x, 153, x + sw, 153 - h, PR.HIERBA[k % 2 ? 3 : 4]); if (k % 3 === 0) R.pset(x + sw, 152 - h, SOL); }
  // pastores pequeños con contraluz y sombra, ovejas y un perro
  const pastor = (c, pelo) => ({ peinado: 'corto', pelo, chaqueta: c, camisa: c, falda: c, antebrazo: PALA.PIEL, pantalon: PALA.PIEL, sandalias: true, chaqueta_larga: false, faja: PALA.MARRON, luz, sombra: PR.HIERBA[0] });
  R.personaje(150 + Math.sin(t * 0.4) * 4, 168, 28, { ...pastor(PALA.MARRON, PALA.PELO_NEGRO), t, objeto: 'pala', dir: -1 });
  R.personaje(lerp(210, 190, tramo(t, 15.4, 18)), 172, 26, { ...pastor(PALA.AZUL, PALA.PELO_CASTANO), t, anda: t < 18 ? t * 7 : null, dir: -1, sonrisa: true });
  [[90, 166], [108, 170], [124, 165], [256, 168]].forEach(([x, y], i) => R.oveja(x + Math.sin(t * 0.5 + i) * 3, y, t + i, { dir: i % 2 ? -1 : 1 }));
  R.perro(176, 174, t, { duerme: true });
  for (let k = 0; k < 4; k++) { const x = (k * 70 + t * 10) % 340 - 10, y = 40 + 8 * Math.sin(k * 2 + t * 0.6), a = Math.sin(t * 9 + k) > 0 ? 1 : 0; R.pset(Math.round(x), Math.round(y), PALA.CONTORNO); R.pset(Math.round(x) - 1, Math.round(y) - a, PALA.CONTORNO); R.pset(Math.round(x) + 1, Math.round(y) - a, PALA.CONTORNO); }
};
const barra = (t) => {
  R.cielo(t, { luna: [270, 34, 9], hor: 180, semilla: 21 });
  R.skyline(150, { semilla: 4, color: PALA.CONTORNO, borde: PALA.PURPURA[0] });
  R.colinas(168, { amp: 5, luz: 0.5, rampa: PR.HIERBA });
  const sube = tramo(t, 28.3, 29.6), y = Math.round(lerp(112, 8, sube)), alto = Math.round(lerp(7, 3, sube));
  const enc = clamp((t - 20.6) / 0.5, 0, 1) + clamp((t - 21.9) / 0.5, 0, 1) + clamp((t - 25.6) / 0.5, 0, 1);
  R.barraTiempo(t, sube > 0.95 ? -753 : null, { y, alto, encendidos: enc, iconos: sube > 0.95 });
  if (sube < 0.3) {
    const X = (a) => Math.round(40 + (a + 753) / 1229 * 240), sy = y - 2;
    const toga = { ...ELENCO.senador, luz, sombra: PALA.CONTORNO };
    if (enc > 0.5) R.personaje((X(-753) + X(-509)) / 2, sy, 26, { ...toga, sombrero: 'corona', capa: PALA.ROJO, banda: PALA.ORO, pelo: PALA.PELO_NEGRO, barba: 'poblada', t });
    if (enc > 1.5) { R.personaje((X(-509) + X(-27)) / 2 - 10, sy, 26, { ...toga, pelo: PALA.PELO_CASTANO, t, dir: 1 }); R.personaje((X(-509) + X(-27)) / 2 + 10, sy, 26, { ...toga, pelo: PALA.PELO_BLANCO, t, dir: -1 }); }
    if (enc > 2.5) R.personaje((X(-27) + X(476)) / 2, sy, 26, { ...ELENCO.cesar, luz, sombra: PALA.CONTORNO, t });
  }
};
rodar(E, R, [[0, mapa], [15.4, aldea, 'iris'], [18.3, barra]]);
</script>
</body>
</html>
