<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sequia · ep8</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// EG-SEQUIA (frases 19–20). Cartela «2181». El río bajo entre bancos de barro, los campos agrietados y los silos vacíos;
// el faraón preocupado y un campesino triste. Luego el mapa: Egipto se rompe en trozos de colores que se separan.
import { preparar, rodar, nilo, mapaEg, EL, C, pan, trote } from '/atomo/plato/escenas/eg-comun.js';
const { E, R, M } = await preparar('eg-sequia');
const m = { seq: M('sequia', 1.5), rom: M('rompe', 12) };
const seca = (t) => {
  const u = t - m.seq, { tramo, lerp } = R;
  nilo(R, t, { nivel: 0, seco: true, silos: 0, barcas: false });
  // cesto con las últimas hogazas
  R.rect(206, 139, 222, 145, C.trigoS); R.rect(205, 138, 223, 138, C.k); pan(R, 210, 137); if (u < 4.4) pan(R, 217, 137);
  R.actor(EL.faraon, 140, 145, t, { triste: true });
  // gag: un ladrón flaco llega de puntillas, coge una hogaza y escapa; el campesino sale detrás
  const llega = tramo(u, 3, 4.3), huye = tramo(u, 4.6, 6.2);
  if (u > 3 && huye < 1) {
    const x = Math.round(huye > 0 ? lerp(226, 350, huye) : lerp(340, 226, llega));
    R.actor(EL.campesino, x, 145, t, { dir: huye > 0 ? 1 : -1, salto: llega < 1 || huye > 0 ? trote(t) : 0, sonrisa: huye > 0, dedo: huye > 0, pal: { T: R.hex('#a89a7a'), H: R.hex('#2a2430') } });
    if (huye > 0) pan(R, x + 15, 112);
  }
  const persigue = tramo(u, 5, 6.6);
  R.actor(EL.campesino, Math.round(lerp(176, 360, persigue)), 145, t, { dir: u > 4.6 ? 1 : -1, triste: u < 4.5, sorpresa: u > 4.5 && u < 5, manos: false, enfado: u >= 5, salto: persigue > 0 && persigue < 1 ? trote(t + 0.1) : 0 });
};
const rota = (t) => mapaEg(R, t, { vista: R.VISTAS.nilo, verde: true, trozos: R.tramo(t - m.rom, 0.3, 2.5) });
rodar(E, R, [[0, seca], [m.rom - 0.2, rota]], { cartela: '2181', año: -2181 });
</script>
</body>
</html>
