<script type="module">
// TH-PRUEBAS (frases 37–38). Cuatro planos:
// 1 la balanza, en la sala de pesas y medidas de un instituto (pared de enlucido con su zócalo de friso, suelo de
//   baldosas, ventana con el campus, el árbol que se mece, una nube y un pájaro; el haz de sol con motas de polvo y la
//   mancha de luz en el suelo, donde un gato bosteza; el encerado con «1 = 1», la campana de errores y «±0,001»; carteles
//   con pictogramas, la tabla periódica, la balda de las pesas con el kilo bajo su campana, el reloj regulador con su
//   péndulo; al fondo, una técnica pesa en la balanza de precisión, cuya pantallita duda y se queda en 1000, y levanta el
//   dedo). La balanza, grande sobre la mesa de granito, se mece vacía; una mano deja un resultado en el platillo
//   izquierdo («in science») y se inclina; otra deja otro en el derecho («a result») y la balanza busca el equilibrio:
//   se pasa, vuelve y se asienta, y el fiel se queda en la marca verde. Cuando la voz dice «the proof», la mano trae dos
//   archivadores con el sello «✓» encima, los deja, levanta el sello y lo estampa («behind it»): ese platillo baja, el
//   otro sube y sobre el resultado solo sale un bocadillo con una «?»;
// 2 el laboratorio: Erika entra con su lupa; un vendedor llega con una caja de regalo y la levanta entre destellos
//   («what are you promising?»); ella la ignora, levanta la lupa hacia la pantalla de controles y, cuando la voz dice
//   «checked», sale el «✓»; a la caja se le abre la tapa y salta un muelle con una «?» (gag); al fondo, un técnico
//   trabaja junto a las cajas Edison;
// 3 el espacio: una estrella forja átomos que vuelan en arco hasta una gota de sangre y la llenan de puntos de colores;
//   al llegar, cada átomo enseña su número (26, 8, 6, 1, 7: «atoms you can measure»); la gota late cuando la voz dice
//   «blood»; un cometa cruza el fondo;
// 4 la gota gigante: baja una caja de regalo entre destellos («promises you a miracle») y le salta una «?»; una mano
//   pasa una lupa por la gota, que deja ver las moléculas grandes, y cuando la voz dice «proof» sale el «✓».
import * as T from '/atomo/plato/escenas/th-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('th-pruebas');
const { tramo, lerp, hex } = R;
const C = T.C;
const en = (k, f) => T.momento(M, k, f);
const a = (f) => en('prueba', f), b = (f) => en('milagro', f);
const lin = (t, t0, t1) => Math.max(0, Math.min(1, (t - t0) / (t1 - t0)));   // a paso constante (para andar)
const P2 = a(0.5), P3 = b(0), P4 = b(0.55);
const h = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };

// ── piezas de esta escena ──────────────────────────────────────────────────────────────────────────────────────────
// la mano canónica con la manga (bata blanca) que llega hasta el borde de la pantalla
function manoLarga(x, y, dir, manga = '#f4f4f8') { T.mano(R, x, y, dir, manga); const m = hex(manga), x0 = dir > 0 ? 0 : x + 43, x1 = dir > 0 ? x - 43 : 319; if (x1 >= x0) { R.rect(x0, y - 2, x1, y + 2, m); R.rect(x0, y - 3, x1, y - 3, C.k); R.rect(x0, y + 3, x1, y + 3, C.k); } }
// una hoja de resultados (x, y: centro de abajo)
function hoja(x, y) { R.rect(x - 7, y - 16, x + 7, y, C.k); R.rect(x - 6, y - 15, x + 6, y - 1, C.blanco); for (let k = 0; k < 4; k++) R.rect(x - 4, y - 13 + k * 3, x + 4 - (k % 2) * 3, y - 13 + k * 3, k === 1 ? C.rojo : hex('#9aa0ac')); }
// el archivador (x, y: centro de abajo)
function archivador(x, y, col) { R.rect(x - 9, y - 8, x + 9, y, C.k); R.rect(x - 8, y - 7, x + 8, y - 1, col); R.rect(x - 8, y - 7, x - 6, y - 1, hex('#2a2a3a')); R.rect(x - 2, y - 5, x + 5, y - 3, C.blanco); }
// el sello verde con el «✓» (x, y: centro de abajo)
function sello(x, y) { R.disco(x, y - 7, 7, C.k); R.disco(x, y - 7, 6, hex('#3a8a4a')); T.visto(R, x - 5, y - 10, 1); }
// la caja de regalo con lazo (x, y: centro de abajo); o.abre (0–1) levanta la tapa y saca el muelle con la «?»
function regalo(x, y, t, s = 1, abre = 0) {
  const { rect, disco, linea } = R, w = Math.round(12 * s), hgt = Math.round(16 * s), tapa = Math.round(abre * 10 * s);
  rect(x - w, y - hgt, x + w, y, C.k); rect(x - w + 1, y - hgt + 1, x + w - 1, y - 1, hex('#e84a8a')); rect(x - 2, y - hgt + 1, x + 1, y - 1, C.oroL);
  if (abre > 0) { const top = y - hgt - Math.round(abre * 34 * s), rr = Math.max(6, Math.round(7 * s)); for (let k = 0; k < 7; k++) { const yy = Math.round(lerp(y - hgt, top + rr, k / 6)); linea(x - 3, yy, x + 3, yy - 2, C.metalD); } }
  rect(x - w - 2, y - hgt - 5 - tapa, x + w + 2, y - hgt - tapa, C.k); rect(x - w - 1, y - hgt - 4 - tapa, x + w + 1, y - hgt - 1 - tapa, hex('#f06aa0')); rect(x - 2, y - hgt - 4 - tapa, x + 1, y - hgt - 1 - tapa, C.oroL);
  disco(x - 4, y - hgt - 8 - tapa, 3, C.oroL); disco(x + 3, y - hgt - 8 - tapa, 3, C.oroL); R.pset(x - 4, y - hgt - 8 - tapa, C.oro); R.pset(x + 3, y - hgt - 8 - tapa, C.oro);
  if (abre > 0) { const top = y - hgt - Math.round(abre * 34 * s), rr = Math.max(6, Math.round(7 * s)), g = s > 1 ? 2 : 1; disco(x, top, rr + 1, C.k); disco(x, top, rr, C.blanco); R.icono('?', x - (g === 2 ? 5 : 2), top - (g === 2 ? 7 : 3), C.rojo, C.blanco, g); }
}
// destellos que salen alrededor de (x, y)
function destellos(x, y, t, n = 6, r = 20) { for (let k = 0; k < n; k++) { if (Math.sin(t * 7 + k * 2.3) < 0.2) continue; const ang = k / n * Math.PI * 2 + t * 0.6, px = Math.round(x + Math.cos(ang) * r), py = Math.round(y + Math.sin(ang) * r * 0.8); R.pset(px, py, C.blanco); for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) R.pset(px + dx, py + dy, C.oroL); } }

// ── 1 · la balanza: el resultado y la prueba ───────────────────────────────────────────────────────────────────────
// la sala de pesas y medidas: colores propios (enlucido crema, zócalo verde salvia, suelo de baldosa gris, granito)
const pal1 = (o) => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, hex(v)]));
const S1 = pal1({
  pared: '#ebe4d2', paredS: '#ddd4be', paredL: '#f6f1e6', paredM: '#cfc5ac',
  zoc: '#76a092', zocS: '#5e8678', zocL: '#96bcae', zocD: '#466a5e', rodapie: '#3a564c', rodapieL: '#5a7a6e',
  suelo1: '#aab2bd', suelo2: '#959eaa', sueloJ: '#7e8794', sueloL: '#c2c9d2',
  piz: '#2a3a34', pizL: '#344640', borron: '#34473f', tiza: '#e4ece6', tizaS: '#a8b8ac', tizaA: '#f0d878', tizaR: '#f0707a',
  gran: '#3e3e4a', granL: '#585868', granD: '#2c2c36', granB: '#7a7a8a', granF: '#24242c',
  marco: '#f2eee4', marcoS: '#c8c0ae', persiana: '#e8dcc0', persianaS: '#c8b894',
  terciopelo: '#8a2a3a', terciopeloS: '#5e1a26', laton: '#d8a840', latonS: '#9a7220', latonL: '#f8e0a0',
  caoba: '#7a4228', caobaS: '#4e2818', caobaL: '#a05a34', esfera: '#f4efe0',
  radiador: '#e8e2d4', radiadorS: '#bfb6a2', radiadorL: '#fbf8f0', vidrio: '#d8ecf0', vidrioS: '#9cc4d4',
  mueble: '#dcdcd4', muebleS: '#b4b4ac', resina: '#2e2e36', resinaL: '#5a5a66', lcd: '#1a2a20', lcdL: '#8ae08a',
  sol: '#ffeeb0', hoja: '#3a6a3a', azulP: '#2a5ab8', azulPS: '#1c3a80',
});
const mezcla1 = (c, d, a) => { let r = 0xff000000; for (const s of [0, 8, 16]) { const p = (c >>> s) & 255, q = (d >>> s) & 255; r |= Math.round(p + (q - p) * a) << s; } return r >>> 0; };
// cifras de 3 × 5 (y «°», «%», «±», «=», «,»): números del encerado, de las pantallitas y de los carteles
const DIG1 = { 0: '111101101101111', 1: '010110010010111', 2: '111001111100111', 3: '111001111001111', 4: '101101111001001', 5: '111100111001111', 6: '111100111101111', 7: '111001001001001', 8: '111101111101111', 9: '111101111001111', '°': '010101010000000', '%': '101001010100101', '±': '010111010000111', '=': '000111000111000', ',': '000000000010100' };
function cifras1(s, x, y, c, g = 1, o = 0) { for (const ch of String(s)) { const m = DIG1[ch]; if (m) for (let j = 0; j < 5; j++) for (let i = 0; i < 3; i++) if (m[j * 3 + i] === '1' && h(x + i, y + j, 930 + o) < (o ? 0.86 : 2)) R.rect(x + i * g, y + j * g, x + i * g + g - 1, y + j * g + g - 1, c); x += (ch === ',' ? 3 : 4) * g; } }
// un trazo de tiza: la línea con huecos, como la tiza sobre la pizarra
const tiza1 = (x0, y0, x1, y1, c) => R.linea(x0, y0, x1, y1, (x, y) => (h(x, y, 931) < 0.86 ? c : null));

// la balanza: el fiel (pivote) en (160, 46), brazos de 70 px y platillos colgados 44 px por debajo
const PX = 160, PY = 46, BRAZO = 70, CUELGA = 44;
// la voz: «in science» (deja el primer resultado), «a result» (el segundo: se nivela), «the proof» (los archivadores) y
// «behind it» (la mano estampa el sello «✓» encima)
const DEJA0 = a(0.105), DEJA1 = a(0.21), DEJA2 = a(0.406), SELLA = a(0.455);
const VIAJES = [[DEJA0 - 0.8, DEJA0, DEJA0 + 0.55, -1], [DEJA1 - 0.75, DEJA1, DEJA1 + 0.55, 1], [DEJA2 - 0.7, DEJA2, P2 + 0.25, 1]];   // [sale, deja, vuelve, lado]
const CARGAS = [[DEJA0, -0.13, -1], [DEJA1, 0.13, 1], [DEJA2, 0.15, 1], [SELLA, 0.07, 1]];   // [cuándo, cuánto se inclina, platillo]
const Q = SELLA + 0.08;   // la «?» sobre el resultado que no tiene nada detrás
// la respuesta de la balanza a cada carga: se pasa, vuelve y se asienta (busca el equilibrio)
const muelle = (u) => (u <= 0 ? 0 : 1 - Math.exp(-3.2 * u) * (Math.cos(8 * u) + 0.4 * Math.sin(8 * u)));
const angulo = (t) => CARGAS.reduce((s, [t0, d]) => s + d * muelle(t - t0), 0.05 * Math.exp(-0.9 * t) * Math.sin(4.4 * t + 0.5));
// el vaivén de cada platillo en sus cadenas tras un golpe (px)
const vaiven = (t, lado) => CARGAS.reduce((s, [t0, , l]) => s + (t > t0 ? (l === lado ? 2.4 : 1) * Math.exp(-2.2 * (t - t0)) * Math.sin(9 * (t - t0)) : 0), 0);

// lo que no se mueve de la sala, pintado una vez: la pared de enlucido con su cornisa y su zócalo de friso, el suelo de
// baldosas en perspectiva, la ventana (marco, alféizar, persiana), el radiador, los carteles, el encerado con sus tizas,
// la tabla periódica, la balda de las pesas, la caja del reloj, la encimera con la balanza de precisión, la mesa de
// granito con su estructura de acero y lo que hay encima y debajo, y la base y la columna de la balanza
function fondoSala() {
  const { rect, pset, disco, linea, poligono } = R;
  // la pared: cornisa, manchas tramadas del enlucido y motas (casi nada junto a la barra del año y junto a Atom), y una grieta
  rect(0, 0, 319, 109, S1.pared);
  rect(0, 0, 319, 2, S1.paredM); rect(0, 3, 319, 3, S1.paredL); rect(0, 4, 319, 4, S1.paredS);
  for (let y = 5; y < 81; y++) for (let x = 0; x < 320; x++) {
    const calma = (y < 22 && x < 196) || (x > 272 && y < 50), n = h(x >> 3, y >> 3, 900) * 0.55 + h(x >> 2, y >> 2, 901) * 0.45;
    if (y < 8 && ((x + y) & 1)) pset(x, y, S1.paredS);
    else if (!calma && n > 0.8 && ((x + y) & 1) === 0) pset(x, y, S1.paredS);
    else if (h(x, y, 902) < (calma ? 0.003 : 0.012)) pset(x, y, h(x, y, 903) < 0.6 ? S1.paredS : S1.paredL);
  }
  for (const [x0, y0, x1, y1] of [[226, 64, 223, 69], [223, 69, 225, 74], [225, 74, 222, 79]]) linea(x0, y0, x1, y1, S1.paredM);
  // el zócalo: el listón de madera, el friso de tablillas verdes (con algún roce) y el rodapié
  rect(0, 81, 319, 81, C.maderaL); rect(0, 82, 319, 83, C.madera); rect(0, 84, 319, 84, C.maderaS);
  rect(0, 85, 319, 105, S1.zoc); rect(0, 85, 319, 85, S1.zocD);
  for (let x = 3; x < 320; x += 6) { rect(x, 86, x, 105, S1.zocS); rect(x + 1, 86, x + 1, 105, S1.zocL); }
  for (let k = 0; k < 14; k++) { const x = Math.round(h(k, 1, 905) * 316), y = 88 + Math.round(h(k, 2, 905) * 14); rect(x, y, x + 2 + Math.round(h(k, 3, 905) * 4), y, S1.zocD); }
  rect(0, 106, 319, 109, S1.rodapie); rect(0, 106, 319, 106, S1.rodapieL);
  // el enchufe y el interruptor en el friso
  for (const x of [104, 236]) { rect(x, 92, x + 6, 98, C.k); rect(x + 1, 93, x + 5, 97, S1.marco); pset(x + 2, 95, C.k); pset(x + 4, 95, C.k); }
  // el suelo de baldosas grises en perspectiva (el horizonte en y 40): juntas, alguna pieza gastada y motas
  const fila = (y) => Math.floor(1400 / (y - 40)), col = (x, y) => Math.floor((x - 160) / (y - 40) * 8);
  for (let y = 110; y < 180; y++) { const f = fila(y), junta = fila(y - 1) !== f; for (let x = 0; x < 320; x++) { const c = col(x, y);
    let k = (f + c) & 1 ? S1.suelo1 : S1.suelo2;
    if (junta || col(x - 1, y) !== c) k = S1.sueloJ; else if (h(f, c, 910) < 0.14) k = mezcla1(k, C.k, 0.07); else if (h(x, y, 911) < 0.025) k = S1.sueloL;
    pset(x, y, k); } }
  rect(0, 110, 319, 110, S1.sueloJ);
  // la sombra bajo la mesa
  poligono([[50, 150], [272, 150], [282, 179], [40, 179]], (x, y) => mezcla1(R.pget(x, y), C.k, 0.32));

  // la ventana de guillotina: marco de madera pintada, el alféizar y la persiana enrollable a medio bajar (el paisaje y los
  // travesaños se pintan en cada fotograma)
  rect(2, 16, 51, 79, C.k); rect(3, 17, 50, 78, S1.marco); rect(3, 17, 50, 17, C.blanco); rect(50, 18, 50, 78, S1.marcoS);
  rect(6, 21, 47, 76, C.k);
  rect(4, 17, 49, 21, C.k); rect(5, 18, 48, 20, S1.persiana); rect(5, 18, 48, 18, C.blanco); rect(5, 20, 48, 20, S1.persianaS);
  rect(7, 22, 46, 27, S1.persiana); for (let y = 23; y < 27; y += 2) rect(7, y, 46, y, S1.persianaS); rect(7, 27, 46, 27, C.k);
  rect(23, 27, 29, 28, C.k); rect(24, 27, 28, 27, S1.persianaS);
  rect(0, 79, 55, 82, C.k); rect(1, 79, 54, 81, S1.marco); rect(1, 79, 54, 79, C.blanco); rect(0, 83, 55, 84, S1.zocD);
  // el radiador de hierro bajo la ventana: las columnas con su luz y su sombra, la llave roja y el tubo
  rect(6, 88, 48, 106, C.k);
  for (let x = 7; x < 48; x += 4) { rect(x, 88, x + 2, 106, S1.radiador); pset(x, 88, C.k); pset(x + 2, 88, C.k); rect(x, 89, x, 105, S1.radiadorL); rect(x + 2, 90, x + 2, 105, S1.radiadorS); rect(x + 3, 90, x + 3, 104, C.k); }
  rect(6, 91, 48, 91, S1.radiadorS); rect(6, 103, 48, 103, S1.radiadorS);
  rect(8, 107, 10, 109, C.k); rect(44, 107, 46, 109, C.k);
  rect(50, 98, 53, 110, C.k); rect(51, 98, 52, 110, C.metalS); rect(49, 96, 54, 97, C.k); rect(50, 95, 53, 95, C.rojo);

  // los carteles con pictogramas (sin letras), con sus chinchetas: la balanza en azul, el de usar guantes para tocar las
  // pesas y el triángulo de aviso
  rect(55, 16, 83, 41, C.k); rect(56, 17, 82, 40, S1.marco); rect(58, 19, 80, 38, S1.azulP); rect(58, 19, 80, 19, hex('#4a78d0'));
  R.icono('balanza', 62, 21, C.blanco, S1.azulPS, 2); rect(61, 36, 77, 36, hex('#8ab0e8'));
  for (const [x, y, c] of [[56, 17, C.rojo], [82, 17, C.amarillo], [56, 40, C.verdeL], [82, 40, C.rojo]]) pset(x, y, c);
  disco(62.5, 52.5, 7.5, C.k); disco(62.5, 52.5, 6.5, S1.azulP); disco(62.5, 52.5, 6.5, (x, y) => (y < 49 ? hex('#3a6ac8') : S1.azulP));
  R.dibujo(['.#.#.#..', '.#.#.#..', '.######.', '.#######', '.######.', '..####..', '..####..'], 58, 49, 1, { '#': C.blanco });
  poligono([[77, 44], [70, 58], [84, 58]], C.k); poligono([[77, 46], [72, 57], [82, 57]], C.amarillo); rect(77, 49, 77, 53, C.k); pset(77, 55, C.k);
  // el encerado: el marco de madera, la pizarra con borrones de lo que se borró, la repisa con las tizas y el borrador,
  // y lo escrito: «1 = 1», una pesa con su asa, una regla con sus marcas, la campana de los errores con «±» y «0,001», «20°»
  rect(104, 22, 216, 77, C.k); rect(105, 23, 215, 76, C.madera); rect(105, 23, 215, 23, C.maderaL); rect(215, 24, 215, 76, C.maderaS);
  rect(108, 26, 212, 73, C.k); rect(109, 27, 211, 72, S1.piz);
  for (let y = 27; y < 73; y++) for (let x = 109; x < 212; x++) { const n = h(x >> 3, y >> 2, 920) * 0.6 + h(x >> 1, y >> 1, 921) * 0.4; if (n > 0.72 && ((x + y) & 1)) pset(x, y, S1.borron); else if (h(x, y, 922) < 0.02) pset(x, y, S1.pizL); }
  cifras1('1=1', 114, 29, S1.tiza, 2, 1);
  tiza1(114, 70, 128, 70, S1.tiza); tiza1(114, 70, 117, 61, S1.tiza); tiza1(128, 70, 125, 61, S1.tiza); tiza1(117, 61, 125, 61, S1.tiza); R.anillo(121.5, 58.5, 2.6, S1.tiza); cifras1('1', 120, 63, S1.tizaA);
  tiza1(133, 59, 151, 59, S1.tiza); tiza1(133, 64, 151, 64, S1.tiza); tiza1(133, 59, 133, 64, S1.tiza); tiza1(151, 59, 151, 64, S1.tiza);
  for (let x = 135; x < 151; x += 2) tiza1(x, 60, x, x % 8 === 7 ? 62 : 60, S1.tizaS); cifras1('0', 132, 66, S1.tizaS); cifras1('8', 148, 66, S1.tizaS);
  tiza1(171, 71, 209, 71, S1.tiza); for (let x = 172; x < 208; x++) { const g = (xx) => Math.round(68 - 12 * Math.exp(-(((xx - 190) / 5) ** 2))); tiza1(x, g(x), x + 1, g(x + 1), S1.tiza); }
  for (let y = 58; y < 70; y += 3) pset(190, y, S1.tizaA); for (const x of [185, 195]) pset(x, 70, S1.tizaR);
  cifras1('±0,001', 168, 29, S1.tiza); cifras1('20°', 198, 29, S1.tizaA); tiza1(168, 36, 192, 36, S1.tizaS);
  rect(104, 77, 216, 79, C.k); rect(104, 77, 216, 77, C.maderaL); rect(105, 78, 215, 78, C.madera);
  for (const [x, c] of [[122, S1.tiza], [128, S1.tizaA], [196, S1.tizaR], [201, S1.tiza]]) rect(x, 76, x + 3, 76, c);
  rect(176, 74, 185, 76, C.k); rect(177, 74, 184, 74, C.maderaL); rect(177, 75, 184, 76, hex('#5a5a66'));

// la luz de la ventana: el haz que baja en diagonal hasta el suelo (rayos que tiemblan despacio y motas de polvo que
// flotan dentro) y la mancha de sol en las baldosas, cruzada por la sombra de los travesaños y de las hojas del árbol
function luz1(t) {
  const m = Math.sin(t * 1.4) * 1.5, brillo = 0.6 + Math.sin(t * 0.6) * 0.03;
  R.poligono([[-6, 80], [47, 80], [42, 112], [14, 179], [-30, 179]], (x, y) => {

    if (Math.abs(u - 0.5) < 0.04 || Math.abs(v - 0.55) < 0.035) return mezcla1(c, S1.sol, 0.18);

  R.rect(x - 21, y, x + 22, y, C.oroL); R.rect(x - 14, y + 4, x + 16, y + 4, C.oroS); R.pset(x - 11, y + 2, C.oroL); R.pset(x - 10, y + 2, C.blanco);

// el brazo de la balanza: una barra que se afina hacia los extremos, con su luz arriba y su sombra abajo, los remates
// de los extremos y el pivote
function brazo1(a) {
  const ca = Math.cos(a), sa = Math.sin(a), P = (d, w) => [PX + ca * d - sa * w, PY + sa * d + ca * w];
  const ex = Math.round(ca * BRAZO), ey = Math.round(sa * BRAZO), L = [PX - ex, PY - ey], D = [PX + ex, PY + ey];
  const forma = (g) => [P(-BRAZO, -1.6 - g), P(0, -3.4 - g), P(BRAZO, -1.6 - g), P(BRAZO, 1.6 + g), P(0, 3.4 + g), P(-BRAZO, 1.6 + g)];
  R.poligono(forma(1), C.k); R.poligono(forma(0), C.oro);
  for (const s of [-1, 1]) { R.linea(...P(s * (BRAZO - 3), -1), ...P(s * 7, -2.4), C.oroL); R.linea(...P(s * (BRAZO - 3), 1), ...P(s * 7, 2.4), C.oroS); }
  for (const [x, y] of [L, D]) { R.disco(x + 0.5, y + 0.5, 3, C.k); R.disco(x + 0.5, y + 0.5, 2, C.oro); R.pset(x, y - 1, C.oroL); }
  R.disco(PX + 0.5, PY + 0.5, 5, C.k); R.disco(PX + 0.5, PY + 0.5, 4, C.oro); R.disco(PX + 0.5, PY + 0.5, 2, C.oroL); R.pset(PX, PY, C.oroS);
  return [L, D];
}
// el bocadillo blanco con la «?» roja (x: centro; y: abajo, la punta)
function duda1(x, y) {

  R.rect(x - 1, y - 4, x + 1, y - 3, C.k); R.pset(x, y - 2, C.k); R.pset(x, y - 4, C.blanco);
  R.icono('?', x - 5, y - 20, C.rojo, C.rojoS, 2);
}

const p1 = (t) => {
  if (!SALA1) { SALA1 = R.nuevo(); const prev = R.usar(SALA1); fondoSala(); R.usar(prev); }

  const ang = angulo(t);

  if (t > Q) { const s = Math.round(Math.max(0, 1 - (t - Q) * 5) * 3); duda1(lx, ly - 18 - s); }

  for (const [k, [t0, t1, t2, lado]] of VIAJES.entries()) {

};

// ── 2 · el laboratorio: ¿quién lo ha comprobado? ──────────────────────────────────────────────────────────────────

// ── 3 · las estrellas forjan los átomos (de eso estamos hechos) ───────────────────────────────────────────────────
const MIDE = b(0.21), SANGRE = b(0.36);   // «measure»; «blood»
const NUMS = [['26', 176, 92], ['8', 248, 104], ['6', 182, 150], ['1', 256, 144], ['7', 214, 82]];
const p3 = (t) => {
  const { rect, pset, disco, linea } = R;

  for (const [gx0, gy0] of [[120, 150], [290, 70]]) { for (let i = -6; i <= 6; i++) pset(gx0 + i, gy0 + Math.round(i * 0.3), Math.abs(i) < 3 ? hex('#8a7aa8') : hex('#3a3456')); pset(gx0, gy0, hex('#d8c8f0')); }   // dos galaxias lejanas
  for (let k = 0; k < 110; k++) { const x = Math.round(h(k, 1, 7) * 320), y = Math.round(h(k, 2, 7) * 180); pset(x, y, Math.sin(t * 3 + k) > 0.6 ? C.blanco : hex('#6a6a8a')); }
  { const u = lin(t, P3 + 0.4, P4 + 1.0), cx = Math.round(lerp(330, -20, u)), cy = Math.round(lerp(150, 120, u)); for (let i = 0; i < 14; i++) pset(cx + i, cy + Math.round(i * 0.1), i < 2 ? C.blanco : hex('#8ab0e0')); }   // el cometa

  for (let k = 0; k < 16; k++) { const an = k / 16 * 6.28 + t * 0.3, r = 33 + Math.sin(t * 5 + k * 1.7) * 3; pset(Math.round(sx + Math.cos(an) * r), Math.round(sy + Math.sin(an) * r), hex('#ff6a2a')); }
  // la gota de sangre que se va llenando

  for (let j = -Math.round(2.1 * r); j <= r; j++) { const w = j >= 0 ? Math.sqrt(Math.max(0, r * r - j * j)) : r * (1 + j / (2.1 * r)); const a0 = Math.round(w); rect(gx - a0 - 1, gy + j, gx + a0 + 1, gy + j, C.k); }

  for (let k = 0; k < 8; k++) { const f = ((t - P3) * 0.55 + k / 8) % 1; if (t < P3 + 0.2) continue; const sube = k % 4 === 3, [dx, dy] = sube ? [262, 50] : [gx - 8 + (k % 3) * 8, gy + 4], x = Math.round(lerp(sx + 20, dx, f)), y = Math.round(lerp(sy, dy, f) - Math.sin(f * Math.PI) * (sube ? 18 : 40));
    if (f > 0.96 || (sube && x > 264)) continue; disco(x, y, 2, hex('#8ab0ff')); for (let q = 0; q < 6.28; q += 0.6) pset(Math.round(x + Math.cos(q + t * 6) * 5), Math.round(y + Math.sin(q + t * 6) * 2), hex('#c8d8ff')); }
