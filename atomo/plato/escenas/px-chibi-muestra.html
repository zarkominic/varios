<canvas id="lienzo"></canvas>
<script type="module">
// MUESTRA CHIBI (5 s). El puerto del Pireo en la antigua Atenas, con el detalle del vídeo de referencia: colores planos
// (un tono de luz y uno de sombra por pieza), contorno oscuro limpio y nada de ruido. Un trirreme atracado con su ojo
// pintado, remos y público en cubierta; ánforas, cajas y norays en el muelle; una estoa pintada a la derecha y la
// Acrópolis al fondo. Sócrates (cabezón, calvo y barbudo) explica algo con el dedo en alto; el ciudadano se sorprende
// y da un salto («!»); el público del barco se ríe y saluda. Personajes dibujados píxel a píxel (no por código).
import { crearRetro, hex } from '/atomo/plato/kits/pixel-retro.js';
const R = await crearRetro(document.getElementById('lienzo'));
const { pset, rect, linea, poligono, disco } = R;
const DUR = 5;

// ── paleta plana ─────────────────────────────────────────────────────────────────────────────────────────────────
const C = Object.fromEntries(Object.entries({
  k: '#1c1222', cielo1: '#5cb6f2', cielo2: '#7cc6f6', cielo3: '#a2d8fa', nube: '#ffffff', nubeS: '#d2ecfc', nubeS2: '#a8d6f2',
  colina: '#94a4c8', colinaS: '#7a88b0', colinaL: '#b4c0dc', marmolL: '#f6f2ea', marmol: '#dcd6ca', marmolS: '#aaa293',
  mar1: '#2a64b0', mar2: '#3678c4', mar3: '#4f94d8', marL: '#cfe8ff', marHondo: '#1b4486', marHondo2: '#22549c',
  mad0: '#3a2214', mad1: '#5e3a1e', mad2: '#83552c', mad3: '#a8743c', mad4: '#c8955a',
  casco0: '#3c2014', casco1: '#5a3018', casco2: '#7a4422', franja: '#c83a3a', franjaS: '#8e2424',
  bronce: '#d29a34', bronceS: '#94621a', vela: '#f0e4c4', velaS: '#cbb88c', cuerda: '#b8985e',
  terra: '#c25a2c', terraL: '#e88450', terraS: '#8a3a1a', negroFig: '#2a1810',
  azulPint: '#2e5aa8', rojoPint: '#b8322e', oro: '#e8b830', hierro: '#5a5a6a', hierroL: '#8c8ca0', hierroS: '#3a3a48',
  gaviota: '#ffffff', gaviotaS: '#b8c4d4',
}).map(([k, v]) => [k, hex(v)]));
// paleta de los personajes (letras de los dibujos)
const P = Object.fromEntries(Object.entries({
  k: '#1c1222', S: '#f6c290', s: '#d48a5a', W: '#f6f6f6', w: '#b8bccc', T: '#ece0bc', t: '#bfae80', B: '#93603a', b: '#64401f',
  L: '#6a4020', m: '#7a2026', H: '#2c2232', h: '#54466a', A: '#3e74d4', a: '#2a50a0', Q: '#d24040', q: '#922828', E: '#ffffff',
  o: '#f0c040', G: '#7a4a24',
}).map(([k, v]) => [k, hex(v)]));

// dibuja una rejilla de letras (dir = −1 la voltea)
const dibujo = (filas, x, y, dir = 1, pal = P) => filas.forEach((f, j) => { for (let i = 0; i < f.length; i++) { const c = pal[f[i]]; if (c == null) continue; pset(Math.round(x + (dir > 0 ? i : f.length - 1 - i)), Math.round(y + j), c); } });

// ── personajes (15 px de ancho; cabeza de 14 y cuerpo de 14: cabezones, como en la referencia) ──────────────────────
const CAB_SOC = [
  '....kkkkkk.....',
  '..kkSSSSSSkk...',
  '.kSSSSSSSSSSk..',
  'kWWSSSSSSSSSSk.',
  'kWWSSSSSSSSSSk.',
  'kWWsSSSSSSSSSk.',
  'kWWsSSSSSSSSSSk',
  'kWWWSSSSSSSSsk.',
  '.kWWWWWWWWWWWk.',
  '.kWWWWWWWWWWWk.',
  '..kWWWWWwWWWk..',
  '..kWWWWWWWWWk..',
  '...kWWWWWWWk...',
  '....kkWWWkk....',
];
const CUERPO_SOC = [
  '...kkTTTTBBkk..',
  '..kTTTTTBBBBTk.',
  '.kSkTTTBBBBTkSk',
  '.kSkTTBBBBTTkSk',
  '.kSkTBBBBTTTkSk',
  '.kskBBBBTTTTksk',
  '..kkBBBTTTTTkk.',
  '...kBBTTTTTTk..',
  '...kbBttttttk..',
  '...kbbttttttk..',
  '....kkkkkkkk...',
  '.....kSk.kSk...',
  '.....kSk.kSk...',
  '....kLLk.kLLk..',
];
const CAB_CIU = [
  '...kkkkkkkk....',
  '..kHhHHhHHhkk..',
  '.kHHhHhHHhHHHk.',
  'kHhHHHHHHHHhHk.',
  'kHHHHSSSSSSSSk.',
  'kHHHsSSSSSSSSk.',
  'kHHssSSSSSSSSSk',
  'kHHsSSSSSSSSsk.',
  '.kHSSSSSSSSSSk.',
  '.kSSSSSSSSSSk..',
  '..kSSSSSSSSsk..',
  '...kksSSSSkk...',
  '.....kkkkk.....',
];
const CUERPO_CIU = [
  '...kkAAAAAkk...',
  '..kQoAAAAAAAk..',
  '.kQQkAAaAAAkSk.',
  '.kQQkAAaAAAkSk.',
  '.kQqkGGGGGGkSk.',
  '.kQqkAaAAaAksk.',
  '.kqqkAaAAaAkk..',
  '.kqqkaAAaAAk...',
  '..kqkaaaaaak...',
  '...kkkkkkkk....',
  '....kSk.kSk....',
  '....kLk.kLk....',
  '...kLLk.kLLk...',
];
// variantes sin el brazo que se levanta (se borra la columna del brazo, se deja el contorno del cuerpo)
const sinBrazo = (filas, i0, j0, j1) => filas.map((f, j) => (j >= j0 && j <= j1 ? f.slice(0, i0) + 'k' + '.'.repeat(f.length - i0 - 1) : f));
const CUERPO_SOC_DEDO = sinBrazo(CUERPO_SOC, 12, 2, 5);
const CUERPO_CIU_BRAZOS = sinBrazo(CUERPO_CIU, 11, 2, 5);
// cara: ojos, cejas y boca encima de la cabeza (x relativo a la rejilla, mirando a la derecha)
const cara = (x, y, dir, o) => {
  const px = (i, j, c) => pset(Math.round(x + (dir > 0 ? i : 14 - i)), Math.round(y + j), c);
  const ey = o.ojosY ?? 5, cejaY = ey - 1 - (o.sorpresa ? 1 : 0);
  for (const ex of [8, 12]) {
    if (o.sorpresa) { px(ex, ey, P.E); px(ex, ey + 1, P.k); px(ex - 1, ey, P.k); px(ex - 1, ey + 1, P.E); }
    else if (o.parpadea) px(ex, ey + 1, P.k);
    else { px(ex, ey, P.k); px(ex, ey + 1, P.k); }
    px(ex - 1, cejaY, o.ceja); px(ex, cejaY, o.ceja);
  }
  const my = o.bocaY ?? 9;
  if (o.sorpresa) { px(10, my, P.k); px(11, my, P.k); px(10, my + 1, P.m); px(11, my + 1, P.m); px(10, my + 2, P.k); px(11, my + 2, P.k); }
  else if (o.habla) { px(9, my, P.k); px(10, my, P.k); px(11, my, P.k); px(10, my + 1, P.m); }
  else if (o.sonrisa) { px(9, my, P.k); px(10, my + 1, P.k); px(11, my + 1, P.k); px(12, my, P.k); }
  else { px(10, my, P.k); px(11, my, P.k); }
};
// brazo levantado (el dedo índice arriba) o los dos (sorpresa): columnas de piel con su contorno
const brazoArriba = (x, yHombro, yMano, abierta = false) => {
  for (let y = yMano; y <= yHombro; y++) { pset(x - 1, y, P.k); pset(x, y, P.S); pset(x + 1, y, y < yMano + 3 ? P.S : P.s); pset(x + 2, y, P.k); }
  if (abierta) { rect(x - 1, yMano - 3, x + 2, yMano - 1, P.k); rect(x, yMano - 2, x + 1, yMano - 1, P.S); pset(x - 1, yMano - 3, P.S); pset(x + 2, yMano - 3, P.S); pset(x - 2, yMano - 4, P.k); pset(x + 3, yMano - 4, P.k); return; }
  pset(x, yMano - 1, P.k); pset(x + 1, yMano - 1, P.k); pset(x + 1, yMano - 3, P.k); pset(x + 1, yMano - 2, P.S); pset(x + 2, yMano - 2, P.k); pset(x, yMano - 2, P.k);
};
const socrates = (x, suelo, t, o) => {
  const resp = Math.sin(t * 3) > 0.7 ? 1 : 0, yC = suelo - 14, yH = yC - 13 + resp;
  dibujo(o.dedo ? CUERPO_SOC_DEDO : CUERPO_SOC, x, yC, 1);
  if (o.dedo) brazoArriba(x + 14, yC + 3, yH - 3);
  dibujo(CAB_SOC, x, yH, 1);
  cara(x, yH, 1, { ceja: P.w, habla: o.habla, sonrisa: o.sonrisa, parpadea: (t % 2.3) < 0.1, bocaY: 9 });
};
const ciudadano = (x, suelo, t, o) => {
  const salto = o.salto ?? 0, yC = suelo - 13 - salto, yH = yC - 12;
  dibujo(o.sorpresa ? CUERPO_CIU_BRAZOS : CUERPO_CIU, x, yC, -1);
  if (o.sorpresa) { brazoArriba(x + 1, yC + 3, yH + 1, true); brazoArriba(x + 12, yC + 3, yH + 1, true); }
  dibujo(CAB_CIU, x, yH, -1);
  cara(x, yH, -1, { ceja: P.H, sorpresa: o.sorpresa, sonrisa: o.sonrisa, parpadea: (t % 2.9) < 0.1, ojosY: 6, bocaY: 9 });
  pset(x + 4, yH + 8, P.s); pset(x + 9, yH + 8, P.s);   // mejillas
  if (salto > 0) for (let i = -5; i <= 5; i++) if (Math.abs(i) > 2 - salto * 0.2) pset(x + 7 + i, suelo + 1, C.mad1);
};

// ── público del barco (bustos de frente, 9 × 12) ──
const BUSTOS = {
  rizos: ['..kkkkk..', '.kHhHhHk.', 'kHhHHHhHk', 'kHSSSSSHk', 'kSeSSSeSk', 'kSSSsSSSk', '.kSSmSSk.', '..kSSSk..', '.kkCCCkk.', 'kCCCCCCCk', 'kCcCCCcCk', 'kCcCCCcCk'],
  calvo: ['..kkkkk..', '.kSSSSSk.', 'kWSSSSSWk', 'kWSSSSSWk', 'kSeSSSeSk', 'kSSSsSSSk', 'kWWWmWWWk', '.kWWWWWk.', '.kkWWWkk.', 'kCCCCCCCk', 'kCcCCCcCk', 'kCcCCCcCk'],
  mujer: ['...kkk...', '..kHHHk..', '.kVVVVVk.', 'kVHHHHHVk', 'kVSSSSSVk', 'kVeSSSeVk', 'kVSSsSSVk', 'kVSSmSSVk', 'kVkSSSkVk', '.kkCoCkk.', 'kCCCCCCCk', 'kCcCCCcCk'],
  soldado: ['..kRRRk..', '.kRRRRRk.', '..kZZZk..', '.kZZzZZk.', 'kZZZZZZZk', 'kZkSSSkZk', 'kZeSSSeZk', 'kZSSsSSZk', 'kZkSmSkZk', '.kkkkkkk.', 'kCCCCCCCk', 'kCcCCCcCk'],
  marinero: ['...kkk...', '..kPPPk..', '.kPPpPPk.', 'kPPPPPPPk', 'kHSSSSSHk', 'kSeSSSeSk', 'kSSSsSSSk', '.kSSmSSk.', '..kkkkk..', '.kCCCCCk.', 'kCcCCCcCk', 'kCcCCCcCk'],
};
const BOCA = { rizos: [4, 6], calvo: [4, 6], mujer: [4, 7], soldado: [4, 8], marinero: [4, 7] };
const tela = (a, b) => ({ C: hex(a), c: hex(b) });
const PUBLICO = [
  ['marinero', { ...tela('#3e74d4', '#2a50a0'), H: hex('#5a3418'), P: hex('#a8743c'), p: hex('#7a5028') }, 48],
  ['mujer', { ...tela('#8050b8', '#52287e'), H: hex('#2c2232'), V: hex('#f0e4c4') }, 68],
  ['calvo', { ...tela('#ece0bc', '#bfae80') }, 88],
  ['soldado', { ...tela('#d24040', '#922828'), R: hex('#d24040'), Z: hex('#d29a34'), z: hex('#f0c868') }, 108],
  ['rizos', { ...tela('#46a04a', '#246a34'), H: hex('#a03a24'), h: hex('#d86a3a') }, 128],
  ['mujer', { ...tela('#d27a30', '#a04a14'), H: hex('#c8a038'), V: hex('#cfe8ff') }, 148],
  ['rizos', { ...tela('#ece0bc', '#bfae80'), H: hex('#2c2232'), h: hex('#54466a') }, 168],
];
// ── fondo ─────────────────────────────────────────────────────────────────────────────────────────────────────────
const nube = (cx, cy, w) => {
  const bolas = [[0, 0, w * 0.32], [-w * 0.32, w * 0.06, w * 0.24], [w * 0.3, w * 0.05, w * 0.26], [-w * 0.1, -w * 0.12, w * 0.26], [w * 0.14, -w * 0.08, w * 0.22]];
  for (const [dx, dy, r] of bolas) disco(Math.round(cx + dx), Math.round(cy + dy + 1), Math.round(r), C.nubeS2);
  for (const [dx, dy, r] of bolas) disco(Math.round(cx + dx), Math.round(cy + dy), Math.round(r), C.nubeS);
  for (const [dx, dy, r] of bolas) disco(Math.round(cx + dx - 1), Math.round(cy + dy - 2), Math.round(r * 0.8), C.nube);
  rect(Math.round(cx - w * 0.55), Math.round(cy + w * 0.18), Math.round(cx + w * 0.55), Math.round(cy + w * 0.3), C.nubeS);
};
const cielo = (t) => {
  for (let y = 0; y < 92; y++) rect(0, y, 319, y, y < 30 ? C.cielo1 : y < 62 ? C.cielo2 : C.cielo3);
  for (const [x0, y, w, v] of [[30, 20, 46, 2], [150, 12, 60, 1.4], [270, 26, 40, 2.4], [210, 50, 30, 1.8], [80, 56, 26, 2.2]]) nube(((x0 + t * v) % 380) - 30, y, w);
};
const acropolis = () => {
  poligono([[196, 92], [222, 74], [262, 70], [296, 76], [320, 86], [320, 92]], C.colina);
  poligono([[262, 70], [296, 76], [320, 86], [320, 92], [276, 92]], C.colinaS);
  linea(222, 74, 262, 70, C.colinaL);
  rect(232, 63, 266, 70, C.marmol); rect(232, 63, 266, 63, C.marmolL); poligono([[230, 63], [249, 56], [268, 63]], C.marmolL);
  for (let x = 234; x <= 264; x += 3) rect(x, 64, x, 70, C.marmolS);
  for (let x = 0; x < 196; x++) { const y = 88 + Math.round(2 * Math.sin(x * 0.05)); rect(x, y, x, 91, x % 37 < 3 ? C.colinaL : C.colinaS); }
};
const mar = (t) => {
  for (let y = 92; y < 132; y++) rect(0, y, 319, y, y < 100 ? C.mar3 : y < 114 ? C.mar2 : C.mar1);
  for (let k = 0; k < 26; k++) { const y = 94 + (k * 7) % 36, x = ((k * 53 + t * (6 + (k % 3) * 3)) % 340) - 10, w = 3 + (k % 4); rect(Math.round(x), y, Math.round(x + w), y, C.marL); if (k % 2) rect(Math.round(x + 2), y + 1, Math.round(x + w + 2), y + 1, C.mar3); }
};
const trirreme = (t) => {
  const b = Math.round(Math.sin(t * 1.6));
  const yb = (y) => y + b;
  // casco: popa curva a la izquierda, espolón de bronce a la derecha
  const casco = [[18, yb(88)], [24, yb(96)], [34, yb(104)], [196, yb(104)], [208, yb(110)], [204, yb(124)], [40, yb(124)], [26, yb(114)]];
  poligono(casco, C.casco1);
  poligono([[34, yb(104)], [196, yb(104)], [204, yb(108)], [30, yb(108)]], C.casco2);
  rect(30, yb(112), 204, yb(114), C.franja); rect(30, yb(114), 204, yb(114), C.franjaS);
  for (let i = 0; i < casco.length; i++) linea(casco[i][0], casco[i][1], casco[(i + 1) % casco.length][0], casco[(i + 1) % casco.length][1], C.k);
  for (let x = 40; x < 196; x += 6) pset(x, yb(106), C.casco0);
  // popa en voluta
  for (let k = 0; k < 6; k++) pset(18 - Math.round(Math.sin(k * 0.6) * 3), yb(88 - k), C.casco1);
  disco(14, yb(82), 3, C.casco1); disco(14, yb(82), 1, C.casco0);
  // espolón de bronce y ojo pintado
  poligono([[204, yb(118)], [216, yb(120)], [204, yb(123)]], C.bronce); linea(204, yb(123), 216, yb(120), C.bronceS);
  disco(194, yb(109), 3, C.k); disco(194, yb(109), 2, C.nube); disco(195, yb(109), 1, C.k); pset(192, yb(108), C.franja);
  // portillas y remos (entran en el agua, que el muelle tapa)
  for (let x = 46; x <= 186; x += 9) { rect(x, yb(117), x + 2, yb(119), C.k); linea(x + 1, yb(119), x - 6, yb(131), C.mad3); linea(x + 2, yb(119), x - 5, yb(131), C.mad2); }
  // mástil, verga con la vela recogida y gallardete
  rect(108, yb(36), 110, yb(104), C.mad2); rect(108, yb(36), 108, yb(104), C.mad3); rect(111, yb(36), 111, yb(104), C.k);
  rect(76, yb(44), 144, yb(46), C.mad2); rect(76, yb(44), 144, yb(44), C.mad3);
  for (let x = 78; x < 142; x++) { const h = 3 + Math.round(Math.sin(x * 0.5) * 1); rect(x, yb(47), x, yb(47 + h), (x % 6 < 3) ? C.vela : C.velaS); pset(x, yb(48 + h), C.k); }
  linea(110, yb(36), 26, yb(90), C.cuerda); linea(110, yb(36), 200, yb(104), C.cuerda);
  for (let i = 0; i < 16; i++) { const y = yb(34) + Math.round(Math.sin(t * 9 - i * 0.6) * 1.5) + (i > 8 ? 1 : 0); rect(111 + i, y, 111 + i, y + Math.max(1, 3 - Math.floor(i / 6)), C.franja); }
  // borda y público en cubierta: bustos dibujados uno a uno, que parpadean, se ríen y saludan
  PUBLICO.forEach(([tipo, pal, x], k) => {
    const salto = t > 3 ? Math.round(Math.max(0, Math.sin(t * 8 + k * 1.3)) * 2) : 0, y = yb(92) - salto;
    const ojos = (t + k * 0.7) % 2.6 < 0.1 ? 'S' : 'k', rie = t > 3.1;
    dibujo(BUSTOS[tipo], x - 4, y, 1, { ...P, ...pal, e: P[ojos], m: rie ? P.m : P.k });
    if (rie) { const [mx, my] = BOCA[tipo]; pset(x - 4 + mx - 1, y + my, P.k); pset(x - 4 + mx + 1, y + my, P.k); pset(x - 4 + mx, y + my + 1, P.k); }
    if (t > 2.7 && k % 2 === 0) { const ay = y + 3 - Math.round(Math.abs(Math.sin(t * 10 + k)) * 2); for (let yy = ay; yy <= y + 10; yy++) { pset(x + 5, yy, P.k); pset(x + 6, yy, P.S); pset(x + 7, yy, P.k); } rect(x + 5, ay - 2, x + 7, ay - 1, P.k); pset(x + 6, ay - 1, P.S); }
  });
  rect(34, yb(104), 196, yb(104), C.k); rect(34, yb(103), 196, yb(103), C.mad3);
};
const velero = (x, y, t, s) => { const b = Math.round(Math.sin(t * 1.5 + x) * 0.6); poligono([[x - 6 * s, y + b], [x + 6 * s, y + b], [x + 4 * s, y + 2 * s + b], [x - 4 * s, y + 2 * s + b]], C.mad1); rect(x, y - 9 * s + b, x, y + b, C.mad1); poligono([[x + 1, y - 9 * s + b], [x + 5 * s, y - 1 + b], [x + 1, y - 1 + b]], C.vela); poligono([[x - 1, y - 7 * s + b], [x - 4 * s, y - 1 + b], [x - 1, y - 1 + b]], C.velaS); };
const barcoMercante = (t) => {
  const b = Math.round(Math.sin(t * 1.3 + 1));
  poligono([[232, 96 + b], [300, 96 + b], [292, 106 + b], [240, 106 + b]], C.mad2); rect(240, 96 + b, 292, 97 + b, C.mad4);
  linea(232, 96 + b, 240, 106 + b, C.k); linea(300, 96 + b, 292, 106 + b, C.k); linea(240, 106 + b, 292, 106 + b, C.k);
  rect(265, 66 + b, 266, 96 + b, C.mad1);
  poligono([[252, 70 + b], [280, 70 + b], [282, 92 + b], [250, 92 + b]], C.vela); poligono([[266, 70 + b], [280, 70 + b], [282, 92 + b], [266, 92 + b]], C.velaS);
  for (let x = 254; x < 280; x += 6) rect(x, 72 + b, x, 90 + b, C.velaS);
};
const muelle = (t) => {
  // tablas del suelo del muelle (el escenario)
  for (let y = 132; y < 146; y++) rect(0, y, 319, y, (y - 132) % 4 === 0 ? C.mad1 : (y - 132) % 4 === 1 ? C.mad4 : C.mad3);
  for (let f = 0; f < 4; f++) for (let x = (f * 23) % 40; x < 320; x += 40) { rect(x, 132 + f * 4 + 1, x, 132 + f * 4 + 3, C.mad1); pset(x + 2, 132 + f * 4 + 2, C.mad0); pset(x - 3, 132 + f * 4 + 2, C.mad0); }
  rect(0, 131, 319, 131, C.k); rect(0, 146, 319, 147, C.mad0); rect(0, 148, 319, 151, C.mad1);
  for (let x = 6; x < 320; x += 26) { rect(x, 148, x + 4, 158, C.mad1); rect(x, 148, x, 158, C.mad2); rect(x + 5, 148, x + 5, 158, C.k); }
  // agua de delante

  for (let k = 0; k < 14; k++) { const y = 160 + (k * 5) % 18, x = ((k * 71 - t * 8) % 340 + 340) % 340 - 10; rect(Math.round(x), y, Math.round(x + 4), y, C.mar2); }

const gaviota = (x, y, t, k) => { const a = Math.sin(t * 9 + k) > 0; pset(x, y, C.gaviota); pset(x - 1, y - (a ? 1 : 0), C.gaviota); pset(x - 2, y - (a ? 2 : 0), C.gaviota); pset(x + 1, y - (a ? 1 : 0), C.gaviota); pset(x + 2, y - (a ? 2 : 0), C.gaviota); pset(x, y + 1, C.gaviotaS); };
