// la ficha de la lista, grande (sin letras): cabecera con la tira y las tijeras, cinco filas con su icono, dos rayas de

const p1 = (t) => {

  if (u > 0 && suelta < 1) { const s2 = suelta * suelta, hx = fx + 99 + Math.round(s2 * 54), hy = fy + 7 + Math.round(s2 * 48); T.brazo(R, hx + 66, hy + 86, hx, hy, '#3a4a6a', -1, { codo: [hx + 40, hy + 40] }); }
  // la snitch revolotea por la izquierda, llega y se posa en la esquina de la ficha
  const v = tramo(t, clava + 0.4, comienza);
  T.snitch(R, Math.round(lerp(44, fx + 10, v)) + (v < 1 ? Math.sin(t * 3) * 6 : 0), Math.round(lerp(98, fy - 2, v)), t, { vuela: v < 1 ? 0.7 : 0, cara: t > tacha && t < comienza ? 'susto' : 'feliz' });
};
// las tijeras grandes de montaje: eje en (px, py), las hojas hacia el ángulo ang, abiertas ab radianes; cada hoja de acero
// de 22 px con su filo de luz y su sombra, y detrás del eje los dos ojos rojos que coge la mano
const tijeras = (px, py, ang, ab, t) => {
  for (const sg of [1, -1]) { const a = ang + sg * ab / 2, ca = Math.cos(a), sa = Math.sin(a), nx = -sa * sg, ny = ca * sg, L = 22, tip = [px + ca * L, py + sa * L];
    const pts = (g) => [[px + nx * (2.4 + g) - ca * g, py + ny * (2.4 + g) - sa * g], [tip[0] + ca * g, tip[1] + sa * g], [px - nx * (1.4 + g) - ca * g, py - ny * (1.4 + g) - sa * g]].map(([x, y]) => [Math.round(x), Math.round(y)]);
    const ox = Math.round(px - ca * 9 + nx * 2), oy = Math.round(py - sa * 9 + ny * 2);
    for (let w = -1; w <= 1; w++) R.linea(px, py + w, ox, oy + w, K); R.linea(px, py, ox, oy, hex('#5a6272'));
    R.disco(ox, oy, 5, K); R.disco(ox, oy, 4, ROJO); R.disco(ox, oy, 2, K); R.pset(ox - 2, oy - 2, hex('#ff8a8a'));
    R.poligono(pts(1), K); R.poligono(pts(0), hex('#c4ccd8'));
    R.linea(Math.round(px + nx * 1.6), Math.round(py + ny * 1.6), Math.round(tip[0]), Math.round(tip[1]), hex('#f6f8ff'));
    R.linea(Math.round(px - nx * 0.8), Math.round(py - ny * 0.8), Math.round(tip[0] - nx * 0.6), Math.round(tip[1] - ny * 0.6), hex('#7c86a0'));
    const g = (t * 1.3 + (sg > 0 ? 0 : 0.5)) % 1; R.pset(Math.round(px + ca * L * g + nx), Math.round(py + sa * L * g + ny), hex('#ffffff')); }
  R.disco(px, py, 2, K); R.pset(px, py, hex('#e8c040'));
};
// la chispa del corte (u: 0–1): la estrella blanca y amarilla que crece y las chispitas que saltan y caen
const chispa = (x, y, u) => { const r = Math.round(2 + u * 6), c = u < 0.5 ? hex('#ffffff') : hex('#ffe070'), d = Math.round(r * 0.6);
  R.linea(x - r, y, x + r, y, c); R.linea(x, y - r, x, y + r, c); R.linea(x - d, y - d, x + d, y + d, hex('#ffd040')); R.linea(x - d, y + d, x + d, y - d, hex('#ffd040')); R.disco(x, y, u < 0.5 ? 2 : 1, hex('#ffffff'));
  for (let k = 0; k < 7; k++) { const a = k * 0.9 + 0.3, q = u * 14; R.pset(Math.round(x + Math.cos(a) * q), Math.round(y + Math.sin(a) * q + u * u * 8), hex('#ffe070')); } };
const p2 = (t) => {
  const cortada = t > corta;
  // el visor: corre la toma de Peeves (sepia, con su grano y su raya) y después de cortar, la toma siguiente sin él
  const visor = (R, t, cl) => { const [x0, y0, x1, y1] = cl, fl = Math.sin(t * 40) > 0 ? 1 : 0;
    for (let y = y0; y <= y1; y++) R.rect(x0, y, x1, y, cortada ? hex(y < y0 + 28 ? '#6a6a8a' : '#4a3a2a') : hex(['#c8a878', '#bc9c6c'][(y >> 2) & 1]));
    if (!cortada) { R.rect(x0 + 6, y1 - 10, x1 - 6, y1, hex('#8a6a42')); R.actor(EL.peeves, ((x0 + x1) >> 1) - 7 + Math.round(Math.sin(t * 3) * 8), y1 - 8 + Math.round(Math.sin(t * 5) * 2), t, { opaco: true, sonrisa: true, dedo: Math.sin(t * 4) > 0 }); }
    else { R.rect(x0, y1 - 12, x1, y1, hex('#5a4a3a')); R.actor(EL.harry, ((x0 + x1) >> 1) - 7, y1 - 4, t, { dir: 1, anda: true }); }
    for (let k = 0; k < 9; k++) R.pset(x0 + ((k * 37 + Math.floor(t * 24) * 11) % (x1 - x0)), y0 + ((k * 23 + Math.floor(t * 24) * 7) % (y1 - y0)), hex('#f8f0e0'));
    if (fl) R.linea(x0 + ((Math.floor(t * 6) * 13) % (x1 - x0)), y0, x0 + ((Math.floor(t * 6) * 13) % (x1 - x0)), y1, hex('#e8dcc0')); };
  const g = T.hoy(R, t, { encuadre: 'montaje', camara: 'moviola', pantalla: visor, gira: cortada ? 0.3 : 1 });
  // los recortes que ya estaban en el suelo, a la derecha
  // (luz: el trozo cortado lleva un filo claro para que se lea sobre la mesa y el suelo oscuros)
  const trozo = (x, y, ang, sil, luz) => { const c = Math.cos(ang), s = Math.sin(ang);
    for (const borde of luz ? [2, 1, 0] : [1, 0]) for (let i = -12; i <= 12; i += 0.5) for (let j = -7; j <= 7; j += 0.5) { if (borde < 2 && (Math.abs(i) > 11 || Math.abs(j) > 6)) continue; if (!borde && (Math.abs(i) > 10 || Math.abs(j) > 5)) continue; const X = Math.round(x + c * i - s * j), Y = Math.round(y + s * i + c * j);
      if (borde === 2) { R.pset(X, Y, hex('#f8e4b0')); continue; }
      const fant = sil && ((Math.hypot(i, j + 0.6) < 2.8) || (Math.abs(i) < 2.2 && j > 0 && j < 3)), ojo = sil && Math.abs(Math.abs(i) - 1) < 0.5 && Math.abs(j + 0.8) < 0.5;
      R.pset(X, Y, borde ? K : Math.abs(j) > 3.5 ? ((Math.floor(i) & 2) ? hex('#2a1e14') : hex('#e8dcc0')) : ojo ? K : fant ? hex('#f4f6ff') : Math.abs(i) < 0.6 || Math.abs(Math.abs(i) - 6) < 0.6 ? hex('#3a2818') : hex('#7a5632')); } };
  [[262, 170, 0.3, false], [300, 172, -0.5, false], [282, 176, 1.2, false], [312, 165, 0.9, false]].forEach(([x, y, a, s]) => trozo(x, y, a, s));
  // el trozo de Peeves: cuelga de la empalmadora, se corta, resbala por la mesa y cae al suelo; la snitch lo recoge
  const r = tramo(t, corta + 0.05, corta + 0.8), f = tramo(t, corta + 0.8, cae), lev = tramo(t, coge, coge + 0.8);
  let tx = 132, ty = 132, ta = 1.57;
  if (r > 0) { tx = lerp(132, 244, r); ty = lerp(132, 126, r); ta = lerp(1.57, 0.2, r); }
  if (f > 0) { tx = lerp(244, 286, f); ty = 126 + (172 - 126) * f * f; ta = 0.2 + f * 2.2; }
  if (lev > 0) { tx = lerp(286, 236, lev); ty = lerp(172, 60, lev) + Math.sin(lev * 9) * 3; ta = 2.4 + Math.sin(t * 8) * 0.3; }
  trozo(tx, ty, ta, true, t > corta);
  // el polvo que levanta al caer al suelo
  const pol = tramo(t, cae, cae + 0.5); if (pol > 0 && pol < 1) for (let k = 0; k < 8; k++) { const a = 3.3 + k * 0.4, q = 4 + pol * 10; R.pset(Math.round(286 + Math.cos(a) * q * 1.4), Math.round(174 + Math.sin(a) * q * 0.4 - pol * 3), hex(pol < 0.5 ? '#e8dcc0' : '#a89878')); }
  const bajada = tramo(t, cae - 0.1, coge);
  const sx = lev > 0 ? tx : lerp(300, 286, bajada) + (bajada < 1 ? Math.sin(t * 3) * 6 : 0), sy = lev > 0 ? ty - 9 : lerp(70, 163, bajada);
  T.snitch(R, sx, sy, t, { vuela: 0.2, cara: lev > 0 ? 'feliz' : 'normal' });
  T.hoyDelante(R, t, { encuadre: 'montaje', camara: 'moviola' });
  // la mano con las tijeras: entra desde abajo a la izquierda hasta la tira, justo bajo el canto de la mesa; abre y cierra
  // las hojas, en «ended» las cierra del todo sobre la tira (con su chispa) y se va
  const m = tramo(t, mano2, corta - 0.3) - tramo(t, corta + 0.45, corta + 1.25);
  if (m > 0) { const e = m * m * (3 - 2 * m), hx = Math.round(lerp(58, 102, e)), hy = Math.round(lerp(204, 146, e));
    const ab = t < corta - 0.32 ? 0.2 + 0.22 * Math.abs(Math.sin(t * 7)) : t < corta - 0.06 ? 0.55 : t < corta ? 0.55 * (corta - t) / 0.06 : 0;
    tijeras(hx + 14, hy - 6, -0.36, ab, t);
    T.brazo(R, 20, 214, hx, hy, '#c8a878', 1, { codo: [hx - 30, hy + 40] }); }
  // la chispa del corte, donde se cierran las hojas sobre la tira
  const ch = tramo(t, corta, corta + 0.4); if (ch > 0 && ch < 1) chispa(133, 134, ch);
};
const efectos = [[trae + 0.1, 'papel'], [clava, 'pop'], [tacha + 0.2, 'lapiz'], [P2 + 0.2, 'zumbido'], [corta, 'golpecito'], [cae, 'papel'], [coge + 0.1, 'brillo']];
T.rodar(E, R, [[0, p1], [P2, p2]], { efectos, año: (t) => (t < P2 ? 2026 : 2001) });
</script>
