<title>Archivos · ep10</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// OV-ARCHIVOS (frase 3), hoy. Tres planos:
// 1. el Pentágono desde el aire al amanecer: coches por la autopista y, poco a poco, se encienden las ventanas;
// 2. la sala del archivo: una archivera llega andando con una carpeta, se para ante un archivador y abre el cajón, del que
//    sale luz dorada;
// 3. el cajón desde arriba: un dedo recorre las pestañas, unas con «✓» (resueltos) y otras con «?» (sin resolver), y
//    sube una carpeta con «?»: como este, que sigue esperando una respuesta.
import { preparar, rodar, pentagono, archivoSala, carrito, cajonArriba } from '/atomo/plato/escenas/ov-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await preparar('ov-archivos');
const { tramo, lerp } = R;
const P2 = 5.6, P3 = 11, para = P2 + 2.8, abre = (t) => tramo(t, para + 0.3, para + 1.1);
const dedo = (t) => tramo(t, P3 + 0.4, P3 + 3.2), saca = (t) => tramo(t, P3 + 3.6, P3 + 4.8);
const aire = (t) => pentagono(R, t, { luces: 0.15 + 0.7 * tramo(t, 0.5, P2) });
const sala = (t) => {
  archivoSala(R, t, { cajon: 4, abre: abre(t) });
  carrito(R, 250, 162, t);
  const x = Math.round(lerp(-16, 142, tramo(t, P2 + 0.1, para)));
  R.actor(EL.agenta, x, 160, t, { dir: 1, anda: t < para, dedo: t > para && t < para + 1.2, sorpresa: t > para + 1.3 && t < para + 2.4 });
};
const cajon = (t) => cajonArriba(R, t, { dedo: t < P3 + 3.4 ? dedo(t) : -1, saca: saca(t) });
rodar(E, R, [[0, aire], [P2, sala], [P3, cajon]], {
  efectos: [[para + 0.3, 'cerrojo'], ...Array.from({ length: 8 }, (_, k) => [P3 + 0.5 + k * 0.34, 'tic']), [P3 + 3.6, 'papel']],
  año: 2026,
});
</script>
</body>
</html>
