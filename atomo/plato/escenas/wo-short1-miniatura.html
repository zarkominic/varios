<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ep37 · miniatura del Short 1</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// WO-SHORT1-MINIATURA · ep37, vertical: todo lo que cuenta en la columna central (x 110–210), que es lo que queda en 9:16.
// El gancho: el listado con «6EQUJ5» rodeado en rojo y el «Wow!», centrado; Ehman al triple, sorprendido, debajo.
import { crearRoma } from '/atomo/plato/kits/pixel-roma.js';
import { conChibi, ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
import * as T from '/atomo/plato/escenas/wo-comun.js';
import { figura, grado, halo, cifra } from '/atomo/plato/escenas/mini-chibi.js';
const R = conChibi(await crearRoma(document.getElementById('lienzo')));
const dibujar = (t) => {
  const o = { encuadre: 'campo', luz: 'noche' };
  T.oreja(R, t, o); T.orejaDelante(R, t, o);
  grado(R, { tinte: '#0a1838', f: 0.22, desde: 0.6, max: 0.62 });
  halo(R, 160, 80, 70, 84, '#fff0c8', 0.32);
  T.piezaListado(R, 96, 26, { s: 2, rodea: 1, wow: 1, resalta: 1, sombra: true, recorte: [104, 26, 270, 150] });
  halo(R, 160, 150, 50, 40, '#9ac8ff', 0.25);
  figura(R, EL.ehmanWO, 132, 214, t, { dir: 1, sorpresa: true }, 3);
  cifra(R, '1977', 132, 16, 14);
};
window.__frame = async (t) => { dibujar(t); R.presentar(); };
window.__listo = true;
</script>
</body>
</html>
