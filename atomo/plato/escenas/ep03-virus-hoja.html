<title>Hoja del kit ep03-virus</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
// HOJA DE PRUEBA de kits/ep03-virus.js (lo crea ep3-virus). __frame(0): las piezas y variantes juntas en el plató;
// __frame(k), k = 1…5: cada una sola y grande (1 virus · 2 onda · 3 moneda · 4 guante derecho · 5 guante izquierdo).
import { crearPlato, crearPost } from '/atomo/plato/kits/plastilina-adulta.js';
import { tiposVirus, uniformesVirus, virus, onda, moneda, guante, VIRUS_MEDIDAS } from '/atomo/plato/kits/ep03-virus.js';
const UV = uniformesVirus();
const P = await crearPlato({
  piezas: ['virus', 'onda', 'moneda', 'guante', 'guante'], tiposExtra: tiposVirus(), uniformes: UV,
  atomo: false, alfa: true, post: false, sombraFondo: ['p0', 'p2', 'p3', 'p4'],
  camara: { pos: [0, 3.8, 15.5], mira: [0, 2.3, 0], fov: 28, desenfoque: 44 },
});
const POST = crearPost();
const en = (sx, sy, z) => P.punto(sx, sy, z);
const pxU = (p) => { const a = P.proyectar(p), b = P.proyectar([p[0] + 1, p[1], p[2]]); return Math.hypot(b[0] - a[0], b[1] - a[1]); };
const esc = (sx, sy, z, px, lu) => px / (lu * pxU(en(sx, sy, z)));
const CEL = [
  null,
  () => virus(P, 0, { pos: en(960, 520, 2), escala: esc(960, 520, 2, 700, 2 * VIRUS_MEDIDAS.PUAS), rot: [0.3, 0.5, 0] }),
  () => onda(P, 1, UV, { pos: en(960, 520, 2), escala: esc(960, 520, 2, 1400, 7.2), lambda: 2, amplitud: 0.35, largo: 3.6 }),
  () => moneda(P, 2, { pos: en(960, 520, 2), escala: esc(960, 520, 2, 800, 2), rot: [-0.05, 0.25, 0] }),
  () => guante(P, 3, { lado: 'der', pos: en(960, 1000, 2.5), escala: esc(960, 600, 2.5, 640, 1.5), rot: [-0.1, 0.0, 0.15] }),
  () => guante(P, 4, { lado: 'izq', pos: en(960, 1000, 2.5), escala: esc(960, 600, 2.5, 640, 1.5), rot: [-0.1, 0.0, -0.15] }),
];
function todas() {
  virus(P, 0, { pos: en(330, 330, 1), escala: esc(330, 330, 1, 260, 2 * VIRUS_MEDIDAS.PUAS), rot: [0.3, 0.5, 0] });
  onda(P, 1, UV, { pos: en(960, 250, 0.5), escala: esc(960, 250, 0.5, 820, 7.2), lambda: 2, amplitud: 0.35, largo: 3.6 });
  moneda(P, 2, { pos: en(1560, 330, 1), escala: esc(1560, 330, 1, 300, 2), rot: [-0.05, 0.25, 0] });
  guante(P, 3, { lado: 'der', pos: en(760, 1000, 1.5), escala: esc(760, 700, 1.5, 380, 1.5), rot: [-0.1, 0, 0.12] });
  guante(P, 4, { lado: 'izq', pos: en(1160, 1000, 1.5), escala: esc(1160, 700, 1.5, 380, 1.5), rot: [-0.1, 0, -0.12] });
}
const cont = document.getElementById('escena'), gl = P.renderer.domElement;
const capa = document.createElement('canvas'); capa.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%';
cont.appendChild(capa);
const g = capa.getContext('2d');
window.__frame = async (t) => {
  const k = Math.round(t);
  P.fotograma(0); P.limpiar();
  (CEL[k] ?? todas)();
  P.render(1);
  capa.width = gl.width; capa.height = gl.height;
  g.setTransform(gl.width / 1920, 0, 0, gl.width / 1920, 0, 0);
  g.drawImage(gl, 0, 0, 1920, 1080);
  POST.aplicar(g, 1);
};
await window.__frame(0);
window.__listo = true;
</script>
</body>
</html>
