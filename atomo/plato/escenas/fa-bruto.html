<script type="module">
// FA-BRUTO (frases 7–8), 1905, cartela «1905». Seis planos:
// 1. «…go back to 1905»: el campo embarrado de una universidad del este (campo1905 'general', sin su melé): la cuña de
//    once chibis de naranja en uve (el del balón dentro) avanza contra la línea de siete de azul en diagonal y choca en
//    «1905»: salta el barro en abanico con gotas del charco, la línea azul cede; el árbitro de bombín la sigue y pita;
//    el aguador corre por la banda con su cubo, el entrenador grita con el megáfono y el fotógrafo dispara el magnesio;
// 2. corta en «When»: desde la banda (campo1905 'banda'), el árbitro pita el final de la jugada; dos compañeros llevan a
//    uno que cojea hacia el banco, otro de azul se frota la cabeza y se va renqueando; en «badly hurt» llega el médico con
//    el maletín y lo atiende (sin sangre ni morbo);
// 3. corta en «and some schools»: inserto nuevo: la hoja del mapa, cerrada sobre Boston–Nueva York–Filadelfia, sobre el
//    escritorio de roble (tintero con pluma, salvadera, caja de chinchetas, lupa, dos recortes de prensa de barras y la
//    taza que humea); caen las chinchetas de seis universidades con su balón; en «Columbia» la lupa se desliza hasta
//    Nueva York y la suya late; en «stopped playing» sale volando, queda una X roja y la lupa se retira;
// 4. corta antes de «President»: el despacho entero (casaBlanca 'despacho'), la gente a ras de suelo a su escala:
//    Roosevelt mira por la ventana, se vuelve y cruza hasta la mesa; en «loved the sport» lanza el balón, bota en la
//    mesa junto al osito (al osito se le cae el casco sobre los ojos: gag) y le vuelve a las manos; en «son» señala
//    sonriendo la foto del equipo en su marco sobre la mesa (le cruza un destello); entra por la izquierda el secretario
//    con las tres cartas lacradas; Roosevelt se vuelve hacia él y le habla;
// 5. corta en «called»: la Casa Blanca por fuera, con el cielo vivo encima del del decorado (cirros, seis nubes de tres
//    tonos a tres velocidades y una bandada de gansos en uve, recortado al cielo) y un medallón ovalado en el frontón;
//    llegan los representantes, cada uno en su nombre (bufanda carmesí en «Harvard», azul en «Yale», naranja en
//    «Princeton»), se saludan y en «White House» cruzan la verja; el coche de caballos y el automóvil, por delante;
// 6. corta tras «October 9th»: el comedor de la Casa Blanca (fondo local): el calendario en el 9; los tres invitados
//    sentados en sillas de respaldo alto DETRÁS de la mesa (la mesa se pinta después y los tapa de cintura abajo) charlan;
//    el mayordomo llega por detrás de las sillas con la sopera humeante; Roosevelt, de pie en la cabecera, señala el
//    balón embarrado y en «clean up the game» da un golpe en la mesa: salta la vajilla, la tapa de la sopera y el balón;
//    los tres se sobresaltan, asienten uno tras otro y al final levantan la copa.
import * as T from '/atomo/plato/escenas/fa-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('fa-bruto');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const h = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const cl = (v) => Math.max(0, Math.min(1, v));
const pal = (o) => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, hex(v)]));
const K = T.C.k;
const a = (f) => en('bruto', f), b = (f) => en('roosevelt', f);
const P2 = a(0.292), P3 = a(0.689), P4 = b(-0.02), P5 = b(0.427), P6 = b(0.80);
const CHOQUE = a(0.181), PITA = P2 + 0.25, BADLY = a(0.592), COLUMBIA = a(0.798), STOP = a(0.882);
const GIRA = b(0.04), LANZA = b(0.156), COGE = b(0.213), SON = b(0.256), HARVARD = b(0.299), SECRE = b(0.356);
const N1 = b(0.524), N2 = b(0.594), N3 = b(0.638), CASA = b(0.70), LIMPIA = b(0.915);
// los dos equipos de 1905 (los mismos colores que el montón del decorado): naranja y negro contra azul
const NAR = pal({ C: '#d0782a', c: '#2a2430', W: '#d0782a' }), AZU = pal({ C: '#2a4a8a', c: '#c8c0a8', W: '#2a4a8a' });
const ARBITRO = { ...EL.periodista, pal: { ...EL.periodista.pal, ...pal({ C: '#e8e4d8', c: '#c8c4b8', W: '#e8e4d8' }) } };
const ENTRENADOR = { ...EL.periodista, tocado: 'gorra', pal: { ...EL.periodista.pal, ...pal({ C: '#4a3a2a', c: '#3a2c20', H: '#2a2018' }) } };
const MEDICO = { ...EL.rector, tocado: 'chistera' };
// barro en la ropa (unas manchas fijas por jugador)
const barro = (x, suelo, k) => { for (let n = 0; n < 7; n++) { const i = 2 + Math.floor(h(k, n, 1) * 11), j = 2 + Math.floor(h(k, n, 2) * 16); R.pset(x + i, suelo - j, n % 3 ? hex('#5a4028') : hex('#3e2c1c')); } };
// el silbato y el cubo, en la mano
const cubo = (x, y) => { R.rect(x, y - 6, x + 5, y, K); R.rect(x + 1, y - 5, x + 4, y - 1, hex('#8a8e96')); R.rect(x + 1, y - 5, x + 4, y - 5, hex('#b8bcc4')); R.linea(x, y - 7, x + 5, y - 7, hex('#4a4a52')); R.pset(x + 2, y - 4, hex('#6ab0d8')); };

// 1 · la cuña de 1905
// la cuña de once (naranja) en uve, con la punta delante y el del balón dentro; la línea de siete (azul) que la espera
const CUNA = [[0, 0], [-13, -7], [-13, 7], [-26, -14], [-26, 14], [-39, -21], [-39, 21], [-24, 0], [-37, -7], [-37, 7], [-50, 0]];
const LINEA = [[-12, -21], [-8, -14], [-4, -7], [-1, 0], [3, 7], [7, 14], [11, 21]];
const cuna = (t) => {
  const yA = 138, xI = 104, xC = 214;   // la punta: x de salida y x del choque (su pecho toca la línea azul en 228)
  const avanza = tramo(t, 0.9, CHOQUE), tras = Math.max(0, t - CHOQUE), empuje = Math.min(14, tras * 7);
  const xa = Math.round(lerp(xI, xC, avanza * avanza * (3 - 2 * avanza)) + empuje), mueve = avanza > 0 && avanza < 1;
  const tiembla = tras > 0 && tras < 1.6 ? Math.round(Math.sin(t * 40)) : 0;
  const gente = [];
  // el árbitro de bombín que sigue la jugada por detrás
  gente.push({ y: 114, f: () => { const ax = Math.round(xa - 70 + empuje * 0.3); R.actor(ARBITRO, ax, 114, t, { dir: 1, anda: mueve, dedo: tras > 0.3 && tras < 1.4, habla: tras > 0.3 && tras < 1.4 }); if (tras > 0.3 && tras < 1.4) { R.rect(ax + 9, 97, ax + 11, 98, hex('#c8c8d0')); R.pset(ax + 8, 98, K); } } });
  CUNA.forEach(([dx, dy], k) => gente.push({ y: yA + dy, f: () => {
    const x = xa + dx + (tras > 0 && k < 3 ? tiembla : 0), y = yA + dy;

    if (k === 7) T.balon(R, x + 13, y - 11, t, { epoca: '1906', ang: 0.3 });
  } }));
  LINEA.forEach(([dx, dy], k) => gente.push({ y: yA + dy, f: () => {
    const cede = Math.round(empuje * (1 - Math.abs(k - 3) / 4)), x = 230 + dx + cede - (tras > 0 && k > 1 && k < 5 ? tiembla : 0), y = yA + dy;
    R.actor(EL.jugador1905, x, y, t, { dir: -1, pal: AZU, anda: tras > 0 && tras < 2.2 && k % 2 === 0, sorpresa: tras > 0 && tras < 0.8, enfado: tras >= 0.8 || t < CHOQUE - 0.6 }); barro(x, y, 40 + k);
  } }));

  for (const [dx, dy] of LINEA) for (let i = 1; i < 14; i++) if ((i + dy) % 2 === 0) R.pset(230 + dx + i, yA + dy + 1, hex('#2a1e14'));
  gente.sort((p, q) => p.y - q.y).forEach((g) => g.f());
  // el barro que levantan los pies mientras avanzan (salta hacia atrás) y el que estalla en el choque
  if (mueve || (tras > 0 && tras < 2.4)) for (let k = 0; k < 18; k++) { const [dx, dy] = CUNA[k % 11], ph = (t * 2.2 + h(k, 1, 7)) % 1, x = Math.round(xa + dx + 2 - ph * (10 + h(k, 2, 7) * 12)), y = Math.round(yA + dy - 2 - ph * 9 + ph * ph * 12); R.pset(x, y, k % 3 ? hex('#3e2c1c') : hex('#6a5038')); }
  if (tras > 0 && tras < 1.4) {
    // el choque: la salpicadura de barro en abanico (terrones de 2 px con brillo de agua) y la onda en el suelo
    const u = tras / 1.4;
    for (let k = 0; k < 56; k++) {
      const a = -Math.PI / 2 + (h(k, 3, 7) - 0.5) * 2.8, v = 26 + h(k, 4, 7) * 46, x0 = 226 + Math.round((h(k, 6, 7) - 0.5) * 8), y0 = yA + Math.round((h(k, 5, 7) - 0.5) * 34) - 10;
      const x = Math.round(x0 + Math.cos(a) * v * u * 1.2), y = Math.round(y0 + Math.sin(a) * v * u + 80 * u * u);
      if (y > y0 + 26) continue;
      if (k % 4 === 0) { R.pset(x, y, hex('#b8c4cc')); R.pset(x, y + 1, hex('#8a98a4')); continue; }   // gotas de agua del charco
      R.rect(x - 1, y - 1, x + 2, y + 1, hex('#1e140a')); R.rect(x, y, x + 1, y, hex('#8a7050')); R.pset(x, y - 1, hex('#c8b490')); if (k % 3 === 0) { R.pset(x + 3, y + 1, hex('#1e140a')); R.pset(x - 2, y + 2, hex('#6a5038')); }
    }
    if (u < 0.6) for (let a = 0; a < Math.PI * 2; a += 0.2) { const r = 6 + u * 30, x = Math.round(228 + Math.cos(a) * r), y = Math.round(yA + 2 + Math.sin(a) * r * 0.25); R.pset(x, y, hex('#6a5038')); }
  }
};
const p1 = (t) => {
  T.campo1905(R, t);
  cuna(t);
  // el fotógrafo con su cámara de cajón en el trípode y el fogonazo de magnesio en el choque
  const fx = 22, fs = 176; R.linea(fx + 20, fs, fx + 24, fs - 14, hex('#4a3a2a')); R.linea(fx + 28, fs, fx + 24, fs - 14, hex('#4a3a2a')); R.linea(fx + 24, fs, fx + 24, fs - 14, hex('#3a2a1a'));
  R.rect(fx + 19, fs - 22, fx + 29, fs - 14, K); R.rect(fx + 20, fs - 21, fx + 28, fs - 15, hex('#5a3a22')); R.rect(fx + 20, fs - 21, fx + 28, fs - 21, hex('#7a5232')); R.rect(fx + 29, fs - 20, fx + 31, fs - 16, K); R.pset(fx + 30, fs - 18, hex('#8ab0c8'));
  R.actor(EL.periodista, fx, fs, t, { dir: 1, dedo: t > CHOQUE - 0.6 && t < CHOQUE + 0.4, sorpresa: t > CHOQUE + 0.1 && t < CHOQUE + 1.2 });
  const fl = t - CHOQUE - 0.05; if (fl > 0 && fl < 0.9) { const r = Math.round(2 + fl * 10); for (let k = 0; k < 14; k++) { const an = k / 14 * 6.28; R.pset(Math.round(fx + 16 + Math.cos(an) * r), Math.round(fs - 30 + Math.sin(an) * r * 0.7), fl < 0.3 ? T.C.blanco : hex('#c8c8c0')); } if (fl < 0.2) R.disco(fx + 16, fs - 30, 3, T.C.blanco); }
  // el aguador corre por la banda con el cubo y se para a mirar
  const u = tramo(t, 0.5, CHOQUE - 0.6), xa = Math.round(lerp(-18, 92, u));
  R.actor(EL.chico, xa, 166, t, { dir: 1, anda: u > 0 && u < 1, sorpresa: t > CHOQUE && t < CHOQUE + 1.4 }); cubo(xa + 13, 160);
  // el entrenador grita a los suyos con el megáfono de cartón
  const ex = 252, es = 174, grita = Math.sin(t * 8) > -0.2;
  R.actor(ENTRENADOR, ex, es, t, { dir: -1, habla: grita, enfado: t > CHOQUE }); barro(ex, es, 9);
  R.poligono([[ex + 4, es - 17], [ex + 4, es - 14], [ex - 6, es - 11], [ex - 6, es - 20]], hex('#c8b080')); R.linea(ex - 6, es - 20, ex - 6, es - 11, hex('#8a7448')); R.linea(ex + 4, es - 17, ex - 6, es - 20, hex('#e0cc9c'));
  if (grita && Math.floor(t * 6) % 2) for (const dy of [-19, -15, -11]) R.pset(ex - 9, es + dy, hex('#e8e8e0'));
};

// 2 · después de la jugada: los doloridos y el médico
const p2 = (t) => {
  T.campo1905(R, t, { encuadre: 'banda' });
  // el árbitro pita el final de la jugada con el silbato en la boca
  const pita = t > PITA && t < PITA + 0.9;
  R.actor(ARBITRO, 170, 150, t, { dir: -1, dedo: pita, habla: pita }); if (pita) { R.rect(170, 133, 172, 134, hex('#c8c8d0')); R.pset(169, 134, K); }
  // el de azul se frota la cabeza y se va renqueando hacia la derecha
  const v = tramo(t, BADLY - 1.2, P3), xb = Math.round(lerp(236, 300, v)), cojea = v > 0 && v < 1;
  R.actor(EL.jugador1905, xb, 158 + (cojea && Math.floor(t * 3) % 2 ? 1 : 0), t, { dir: 1, pal: AZU, triste: true, dedo: !cojea, anda: cojea && Math.floor(t * 3) % 2 === 0 }); barro(xb, 158, 4);
  // dos compañeros llevan al que cojea hacia el banco
  const w = tramo(t, P2 + 0.3, BADLY), gx = Math.round(lerp(30, 118, w)), gy = Math.round(lerp(172, 164, w)), anda = w > 0 && w < 1;
  R.actor(EL.jugador1905, gx - 13, gy - 2, t, { dir: 1, pal: NAR, anda }); barro(gx - 13, gy - 2, 1);
  R.actor(EL.jugador1905, gx, gy, t, { dir: 1, pal: NAR, triste: true, anda: anda && Math.floor(t * 2.5) % 2 === 0 }); barro(gx, gy, 2);
  R.actor(EL.jugador1905, gx + 13, gy + 1, t, { dir: 1, pal: NAR, anda, habla: !anda && Math.sin(t * 6) > 0 }); barro(gx + 13, gy + 1, 3);
  // los brazos por los hombros del herido
  R.linea(gx - 1, gy - 10, gx + 3, gy - 11, NAR.C); R.linea(gx + 12, gy - 11, gx + 15, gy - 10, NAR.C);
  // el médico llega con el maletín en «badly hurt» y lo atiende
  const d = tramo(t, BADLY - 1.6, BADLY + 0.2), dx = Math.round(lerp(336, gx + 30, d));
  R.actor(MEDICO, dx, gy + 3, t, { dir: -1, anda: d > 0 && d < 1, dedo: d >= 1 && Math.sin(t * 3) > 0, habla: d >= 1 && Math.sin(t * 5) > 0.3 });
  const mx = dx - 2, my = gy - 4; R.rect(mx, my - 5, mx + 7, my, K); R.rect(mx + 1, my - 4, mx + 6, my - 1, hex('#3a2418')); R.rect(mx + 1, my - 4, mx + 6, my - 4, hex('#5a3a24')); R.rect(mx + 3, my - 7, mx + 4, my - 6, K); R.pset(mx + 5, my - 3, hex('#c8a040'));
};

// 3 · el mapa: Columbia lo deja
const U = [
  ['harvard', [-71.12, 42.37], '#a8283a'], ['yale', [-72.93, 41.31], '#1e3a8a'], ['cornell', [-76.48, 42.45], '#c83a2a'],
  ['princeton', [-74.66, 40.35], '#e8782a'], ['penn', [-75.19, 39.95], '#3a2a8a'], ['columbia', [-73.96, 40.81], '#6aa8e8'],
];
// el mapa, más cerrado sobre Boston–Nueva York–Filadelfia, recortado como una hoja suelta sobre el escritorio de roble
// de 1905 (búfer fijo): a su alrededor, el tintero con la pluma, la caja de chinchetas, la lupa, los recortes de prensa
// (titulares de barras, sin letras) y la taza de café que humea
const HOJA = [70, 24, 250, 158];
let mesa3 = null, mapa3 = null;
const mesaFija = () => {
  if (mesa3) return mesa3;
  mesa3 = R.nuevo(); const prev = R.usar(mesa3);
  // el roble: tablas horizontales con vetas que ondulan, nudos y juntas, y la luz de la lámpara desde arriba a la izquierda
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) {
    const tabla = Math.floor(y / 30), yy = y % 30, v = Math.sin(x * 0.045 + tabla * 2.1 + Math.sin(x * 0.013 + tabla) * 3 + yy * 0.42), n = h(x >> 2, y, 11 + tabla);
    const luz = 1 - Math.hypot((x - 60) / 320, (y - 10) / 220), d = luz + (h(x, y, 12) - 0.5) * 0.12;
    let c = v > 0.72 ? '#6a4224' : v > 0.1 ? (d > 0.72 ? '#a8723e' : '#946234') : (d > 0.72 ? '#b47c46' : '#8a5a30');
    if (n < 0.06) c = '#7a4c28'; if (yy === 0) c = '#3e2414'; if (yy === 1) c = '#c08a52';
    if (d < 0.5 && (x + y) % 2 === 0) c = c === '#3e2414' ? c : '#7a4e2a';
    R.pset(x, y, hex(c));
  }
  for (const [nx, ny] of [[30, 98], [286, 22], [210, 172], [12, 160]]) { R.disco(nx, ny, 3, hex('#5a3418')); R.disco(nx, ny, 1.5, hex('#3e2414')); for (let i = -9; i <= 9; i++) R.pset(nx + i, ny + (Math.abs(i) > 3 ? 0 : (i < 0 ? -4 : 4)), hex('#6a4224')); }
  // la sombra de la hoja del mapa sobre la mesa
  for (let y = HOJA[1] + 2; y <= HOJA[3] + 6; y++) for (let x = HOJA[0] + 2; x <= HOJA[2] + 6; x++) if ((x + y) % 2 === 0 || (x > HOJA[2] + 3 && y > HOJA[1] + 6) || (y > HOJA[3] + 3 && x > HOJA[0] + 6)) R.pset(x, y, hex('#4a2c16'));
  // el margen de papel de la hoja, amarillento, con su filete y las marcas de los dobleces
  R.rect(HOJA[0] - 5, HOJA[1] - 5, HOJA[2] + 5, HOJA[3] + 5, hex('#5a4a34')); R.rect(HOJA[0] - 4, HOJA[1] - 4, HOJA[2] + 4, HOJA[3] + 4, hex('#e6d6b0'));
  for (let y = HOJA[1] - 4; y <= HOJA[3] + 4; y++) for (let x = HOJA[0] - 4; x <= HOJA[2] + 4; x++) if (h(x, y, 13) < 0.12) R.pset(x, y, hex('#d8c69c'));
  R.rect(HOJA[0] - 2, HOJA[1] - 2, HOJA[2] + 2, HOJA[1] - 2, hex('#7a6a4a')); R.rect(HOJA[0] - 2, HOJA[3] + 2, HOJA[2] + 2, HOJA[3] + 2, hex('#7a6a4a')); R.rect(HOJA[0] - 2, HOJA[1] - 2, HOJA[0] - 2, HOJA[3] + 2, hex('#7a6a4a')); R.rect(HOJA[2] + 2, HOJA[1] - 2, HOJA[2] + 2, HOJA[3] + 2, hex('#7a6a4a'));
  for (let x = HOJA[0] - 4; x <= HOJA[2] + 4; x += 3) { R.pset(x, HOJA[1] - 4, hex('#f2e6c8')); R.pset(x + 1, HOJA[3] + 4, hex('#c8b488')); }
  // a la izquierda, arriba: la bandeja de latón con el tintero de cristal tallado y la pluma de ave
  R.rect(8, 50, 54, 76, K); R.rect(9, 51, 53, 75, hex('#b8923a')); R.rect(9, 51, 53, 52, hex('#e8c860')); R.rect(10, 73, 53, 75, hex('#7a5a1e')); for (let x = 12; x < 52; x += 4) R.pset(x, 62, hex('#d8b04a'));
  for (let j = -7; j <= 7; j++) for (let i = -10; i <= 10; i++) { const d = (i / 10) ** 2 + (j / 7) ** 2; if (d > 1) continue; R.pset(24 + i, 65 + j, d > 0.8 ? K : j > -2 ? (i < -5 ? hex('#3a3a52') : hex('#1e1e2c')) : i + j < -6 ? hex('#d8e8f0') : hex('#8aa4b4')); }
  for (let i = -8; i <= 8; i += 3) R.pset(24 + i, 67, hex('#4a4a66')); R.pset(18, 62, T.C.blanco); R.pset(19, 61, T.C.blanco);
  R.rect(19, 54, 29, 59, K); R.rect(20, 55, 28, 58, hex('#c8a040')); R.rect(20, 55, 28, 55, hex('#f0d878')); R.rect(21, 58, 27, 58, hex('#8a6a2a'));
  // la salvadera de latón, con sus agujeritos
  R.disco(44, 66, 6, K); R.disco(44, 66, 5, hex('#b8923a')); R.disco(43, 65, 3, hex('#e0c060')); for (const [i, j] of [[-2, -1], [0, -2], [2, -1], [-1, 1], [1, 1]]) R.pset(44 + i, 65 + j, hex('#5a4214'));
