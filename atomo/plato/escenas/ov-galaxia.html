<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Galaxia · ep10</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// OV-GALAXIA (frases 39–40). Zoom fuera desde la Tierra hasta la galaxia; las estrellas se encienden y alrededor de muchas
// giran planetas. Luego la sala de hoy: la persona abre un archivo nuevo con una lupa.
import { preparar, rodar, galaxia, salaHoy, C } from '/atomo/plato/escenas/ov-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await preparar('ov-galaxia');
const { tramo } = R;
const m = { g: M('galaxia', 0.5), i: M('investigador', 14.8) };
const espacio = (t) => galaxia(R, t, tramo(t, m.g, m.i - 2));
const pantalla = (R, x0, y0, x1, y1, t) => { R.rect(x0 + 6, y0 + 4, x0 + 30, y0 + 28, C.ocre); R.icono('?', x0 + 15, y0 + 12, C.k, C.ocre); for (let k = 0; k < 4; k++) R.rect(x0 + 34, y0 + 6 + k * 6, x1 - 6 - (k % 2) * 8, y0 + 7 + k * 6, C.grisL); };
const lupa = (t) => {
  salaHoy(R, t, { pantalla });
  R.actor(EL.sudadera, 130, 160, t, { dir: 1, dedo: true, sonrisa: t > m.i + 4 });
  const lx = 156 + Math.round(Math.sin(t * 1.5) * 10), ly = 86 + Math.round(Math.cos(t * 1.2) * 5);
  R.disco(lx, ly, 7, C.k); R.disco(lx, ly, 6, R.hex('#a8d8f0')); R.pset(lx - 2, ly - 3, C.blanco); R.linea(lx + 5, ly + 5, lx + 11, ly + 11, C.maderaS);
};
rodar(E, R, [[0, espacio], [m.i - 0.3, lupa]], { efectos: [[m.g + 2, 'whoosh']], año: 2026 });
</script>
</body>
</html>
