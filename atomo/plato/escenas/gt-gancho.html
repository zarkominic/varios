const atomPeq = (x, y, t, e, r = 11) => { x = Math.round(x); y = Math.round(y); for (let j = -18; j <= 18; j++) for (let i = -18; i <= 18; i++) { const gg = 1 - Math.hypot(i, j) / 17.5; if (gg > 0.3 && ((i + j) & 1 || gg > 0.6)) R.pset(x + i, y + j, gg > 0.7 ? R.PAL.GLOW[1] : R.PAL.GLOW[0]); } R.atomo(x, y, t, { r, orbita: R.PAL.ATOM[7], energia: e }); };
const SNAP6 = new Uint32Array(57 * 18);
const C6 = pal({ gris: '#c8c8d4', grisL: '#ececf4', grisS: '#8a8a9c', grisD: '#5a5a6c', negro: '#26262f', cable: '#2e2e38', cableL: '#5a5a6a', ledV: '#4ae06a', ledR: '#ff5a4a', mando: '#4a4a5c', mandoL: '#6a6a80', mandoS: '#30303c' });
// la consola sin marca de la esquina (tapa el teléfono liso del decorado, x 286–312, y 156–170): la tapa con su ranura,
// el piloto verde que parpadea cuando el coche corre, dos tomas de mando y el cable que se va por la derecha
const consola = (t) => {
  for (let y = 172; y <= 174; y++) for (let x = 286; x <= 314; x++) if (b4(x, y) < 0.5) R.pset(x, y, mez(R.pget(x, y), K, 0.35));
  R.rect(284, 154, 314, 172, K);
  R.rect(285, 155, 313, 160, C6.grisL); R.rect(285, 161, 313, 171, C6.gris); R.rect(285, 170, 313, 171, C6.grisS); R.rect(313, 155, 313, 171, C6.grisS);
  for (let x = 287; x <= 311; x += 3) R.pset(x, 157, C6.grisS);
  R.rect(289, 158, 305, 158, C6.negro); R.rect(289, 159, 305, 159, C6.grisD);
  R.rect(288, 164, 291, 167, C6.negro); R.rect(294, 164, 297, 167, C6.negro); R.pset(289, 165, C6.grisD); R.pset(295, 165, C6.grisD);
  R.rect(301, 163, 310, 168, C6.grisS); R.rect(302, 164, 309, 167, C6.gris); R.rect(302, 164, 309, 164, C6.grisL);
  const on = t < arr ? true : Math.floor(t * (t > loco ? 14 : 6)) % 2 === 0;
  R.rect(309, 157, 310, 158, on ? C6.ledV : hex('#1e5a2a')); if (on) { R.pset(308, 157, hex('#c8ffd0')); R.pset(311, 158, hex('#2a8a3a')); }
  R.pset(306, 166, t > toca ? C6.ledR : C6.grisD);
  for (let x = 314; x <= 319; x++) { const y = 166 + Math.round(Math.sin(x * 0.9) * 1.5); R.pset(x, y, C6.cable); R.pset(x, y - 1, C6.cableL); }
};
// el mando sin marca, más arriba y entero: tumbado sobre la tabla con su cable rizado; en «went crazy» vibra y se le
// encienden los botones
const mando = (t) => {
  const vib = t > loco && t < vuelve ? (Math.floor(t * 30) % 2 ? 1 : -1) : 0, x0 = 18 + vib, y0 = 150;
  for (let k = 0; k < 18; k++) { const x = x0 + 2 - k, y = y0 + 9 + Math.round(Math.sin(k * 1.3 + (vib ? t * 20 : 0)) * 1.5); R.pset(x, y, C6.cable); R.pset(x, y + 1, C6.cableL); }
  for (let y = 0; y <= 14; y++) for (let x = 0; x <= 34; x++) { const v = (y - 8) / 7, d = Math.min(Math.hypot((x - 8) / 8, v), Math.hypot((x - 26) / 8, v), Math.abs(x - 17) < 11 && y >= 2 && y <= 12 ? 0 : 9);
    if (d > 1) continue; R.pset(x0 + x, y0 + y, d > 0.86 ? K : y < 5 ? C6.mandoL : y > 11 ? C6.mandoS : C6.mando); }
  for (let x = 1; x <= 33; x++) if (b4(x, 0) < 0.6) R.pset(x0 + x, y0 + 16, mez(R.pget(x0 + x, y0 + 16), K, 0.3));
  R.rect(x0 + 5, y0 + 7, x0 + 11, y0 + 8, C6.negro); R.rect(x0 + 7, y0 + 5, x0 + 9, y0 + 10, C6.negro); R.pset(x0 + 8, y0 + 6, C6.mandoL);
  R.rect(x0 + 14, y0 + 5, x0 + 16, y0 + 5, C6.grisS); R.rect(x0 + 19, y0 + 5, x0 + 21, y0 + 5, C6.grisS);
  const btn = [['#e04a4a', 26, 5], ['#4a8ae0', 30, 8], ['#4ae06a', 26, 11], ['#f0c040', 22, 8]];
  btn.forEach(([cc, bx, by], i) => { const lit = vib && Math.floor(t * 12 + i) % 4 === 0; R.disco(x0 + bx, y0 + by, 2, K); R.pset(x0 + bx, y0 + by, lit ? BL : hex(cc)); R.pset(x0 + bx - 1, y0 + by - 1, hex(cc)); R.pset(x0 + bx, y0 + by - 1, lit ? hex('#fff6c0') : hex(cc)); });
  if (vib) for (const s of [-1, 1]) for (let k = 0; k < 3; k++) R.pset(x0 + 17 + s * (20 + k), y0 + 4 + k * 3, hex('#fff6c0'));
};
const p6 = (t) => {
  const A = ANG(t), marcha = t > arr;
  const o = { encuadre: 'estudio', camara: 'mesa', coche: marcha ? 'persigue' : 'para', vueltas: marcha ? A / t : 1 };
  const geo = T.hoy(R, t, o);
  consola(t);
  // el humo de las ruedas cuando se vuelve loco
  if (t > loco) for (let k = 1; k <= 5; k++) { const [x, y] = pista(ANG(t - k * 0.07)); R.disco(Math.round(x), Math.round(y - 2), 1 + k * 0.5, mez(hex('#d8d8e0'), hex('#8a8a96'), k / 6)); }
  // el mando caído del decorado (x 20–76, y 162–179) queda cortado por el borde: se guarda lo de debajo y se repone
  for (let y = 162; y <= 179; y++) for (let x = 20; x <= 76; x++) SNAP6[(y - 162) * 57 + x - 20] = R.pget(x, y);
  T.hoyDelante(R, t, o);
  for (let y = 162; y <= 179; y++) for (let x = 20; x <= 76; x++) R.pset(x, y, SNAP6[(y - 162) * 57 + x - 20]);
  mando(t);
  // Atom: baja de su esquina, toca el coche, huye por delante y, en «went crazy», se vuelve volando a su esquina
  const [cx0, cy0] = [112, 140];
  let ax, ay;
  if (t < toca) { const u = tramo(t, P6, toca - 0.05), e = u * u * (3 - 2 * u); ax = lerp(297, cx0 + 4, e); ay = lerp(24, cy0, e) - Math.sin(u * Math.PI) * 10; }
  else if (t < arr + 0.05) { ax = cx0 + 4; ay = cy0 + Math.round(Math.sin(tramo(t, toca, arr) * Math.PI) * 4); }
  else { const lead = 0.95 * tramo(t, arr, arr + 0.5) - (t > loco ? 0.45 * tramo(t, loco, loco + 1) : 0), a = A + lead, [px, py] = pista(a);
    const salta = t > loco ? Math.abs(Math.sin(t * 14)) * 3 : 0; ax = lerp(cx0 + 4, px, tramo(t, arr, arr + 0.4)); ay = lerp(cy0, py - 18 - Math.max(0, -Math.sin(a)) * 8 - salta, tramo(t, arr, arr + 0.4)); }
  if (t > vuelve) { const u = tramo(t, vuelve, E.duracion - 0.12), e = u * u; ax = lerp(ax, 297, e); ay = lerp(ay, 24, e); }
  atomPeq(ax, ay, t, t > loco ? 0.9 : 0.5, 10);
  if (t > loco && t < vuelve) { R.icono('!', Math.round(ax) - 1, Math.round(ay) - 26, hex('#ffe890'), K, 2); for (const s of [-1, 1]) { const u = (t * 3) % 1; R.pset(Math.round(ax + s * (9 + u * 4)), Math.round(ay - 8 + u * 6), hex('#8ad0ff')); } }
  if (t > toca && t < arr + 0.3) for (let k = 0; k < 8; k++) { const an = k * Math.PI / 4, r = 4 + tramo(t, toca, arr + 0.3) * 12; R.pset(Math.round(cx0 + Math.cos(an) * r), Math.round(cy0 + 14 + Math.sin(an) * r * 0.6), hex('#fff6c0')); }
};

const efectos = [[0.75, 'tecleo'], [golpe, 'campana'], [estudio, 'puerta'], [bicho, 'boing'], [sello, 'sello'], [arruga, 'papel'], [cae + 0.45, 'golpecito'], [abre3, 'papel'],
  [progr + 0.05, 'palmada'], [indus + 0.05, 'motor'], [P5 + 0.05, 'ring'], [escandalo - 0.2, 'pop'], [dos - 0.1, 'puerta'], [nyc + 0.4, 'claxon'],
  [toca, 'interruptor'], [arr, 'arranque'], [loco, 'whoosh'], [vuelve + 0.1, 'whoosh']];
const año = (t) => t < P2 ? 2013 : t < P3 ? 1990 : t < P4 ? 1996 : t < P5 ? 1995 : t < dos ? 1997 : t < P6 ? 1998 : 2026;
T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3], [P4, p4], [P5, p5], [P6, p6]], { efectos, año });
