<script type="module">
// FA-DERIVA (frase 19), sin cartela. Tres planos:
// 1. (0–«So») desde la pasarela bajo el techo: dos técnicos miran el campo; un pase cruza y su punta queda un poco
//    torcida hacia un lado («pointing slightly to one side»: la flechita de la punta frente a la trayectoria);
// 2. («So»–«while») el campo visto desde arriba: el pase largo de un diestro se curva un poco a la derecha («right»), y el
//    de un zurdo, a la izquierda («left»), cada uno con su manita en el lado del brazo que lanza. Encima del decorado, el
//    césped repintado (franjas de corte de dos verdes, desgaste tramado entre las marcas y junto a las líneas, el escudo
//    del centro con su balón y dos estrellas) y la banda de arriba más iluminada. Dos jugadas en formación (chibis vistos
//    desde arriba): línea contra defensa que empuja al saque, el quarterback que retrocede y lanza, el receptor que corre
//    hasta el final de cada curva y coge el balón al llegar, el defensa y el profundo que llegan tarde y el árbitro que se
//    acerca; arriba, la cuerda con sus postes y banderines, dos cámaras de la tele que siguen el balón y los banquillos
//    de pie, que saltan al coger su receptor; abajo, la cadena de las diez yardas con sus operarios, que avanza;
// 3. («while»–fin) la Tierra que gira en el espacio, con el campo diminuto encima: un pase de «60» yardas se desvía solo
//    «4″» («about 4 inches»). El espacio va en un búfer fijo: degradado tramado con la Vía Láctea y sus franjas de polvo,
//    una nebulosa violeta (abajo) y otra verdeazulada (a la izquierda), el resplandor del Sol que asoma por la izquierda
//    (de ahí viene la luz), una galaxia de canto y Marte; encima, los rayos del Sol que laten, estrellas de tres brillos que
//    titilan con destellos en cruz, una estrella fugaz al empezar, la Luna con mares y cráteres que avanza despacio y un
//    satélite con paneles de celdas y un brillo que los recorre.
import * as T from '/atomo/plato/escenas/fa-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('fa-deriva');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const K = hex('#1a1420'), BL = hex('#ffffff'), CI = hex('#8ad8f0'), CIs = hex('#2a6a90'), AM = hex('#f0d878'), RO = hex('#e04a3a'), ROs = hex('#7a1e1e');
const hs = (a, b, c = 0) => { const s = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return s - Math.floor(s); };
// un punto de un pase en parábola (u 0–1) y la tangente: [x, y, ángulo]
const arco = (u, x0, y0, x1, y1, h) => { const x = lerp(x0, x1, u), y = lerp(y0, y1, u) - h * 4 * u * (1 - u); return [x, y, Math.atan2((y1 - y0) - h * 4 * (1 - 2 * u), x1 - x0)]; };
// flecha de un píxel con su punta, y la gruesa con sombra
const flecha = (x0, y0, x1, y1, c, s = 3) => { R.linea(x0, y0, x1, y1, c); const a = Math.atan2(y1 - y0, x1 - x0);
  R.linea(x1, y1, Math.round(x1 - Math.cos(a - 0.55) * s), Math.round(y1 - Math.sin(a - 0.55) * s), c); R.linea(x1, y1, Math.round(x1 - Math.cos(a + 0.55) * s), Math.round(y1 - Math.sin(a + 0.55) * s), c); };
const flechaG = (x0, y0, x1, y1, c, cs = K) => { for (const [dx, dy] of [[1, 1], [1, 2], [0, 2]]) flecha(x0 + dx, y0 + dy, x1 + dx, y1 + dy, cs, 5); flecha(x0, y0, x1, y1, c, 5); flecha(x0, y0 + 1, x1, y1 + 1, c, 5); };
// oscurece un rectángulo (luz apagada), píxel a píxel, respetando lo que hay
const oscurece = (x0, y0, x1, y1, a) => { for (let y = Math.max(0, y0); y <= Math.min(179, y1); y++) for (let x = Math.max(0, x0); x <= Math.min(319, x1); x++) { const c = R.pget(x, y);
  R.pset(x, y, ((255 << 24) | (Math.round(((c >> 16) & 255) * a) << 16) | (Math.round(((c >> 8) & 255) * a) << 8) | Math.round((c & 255) * a)) >>> 0); } };
const mezcla = (c, d, a) => ((255 << 24) | (Math.round(((c >> 16) & 255) * (1 - a) + ((d >> 16) & 255) * a) << 16) | (Math.round(((c >> 8) & 255) * (1 - a) + ((d >> 8) & 255) * a) << 8) | Math.round((c & 255) * (1 - a) + (d & 255) * a)) >>> 0;
const aclara = (x, y, c, a) => R.pset(x, y, mezcla(R.pget(x, y), c, a));
// líneas de viento que corren (el aire que llega): n rachas de un píxel en la caja, en la dirección (dx, dy)
const rachas = (x0, y0, x1, y1, t, dx, dy, n, c, vel = 60, largo = 8) => { for (let k = 0; k < n; k++) { const w = x1 - x0, hh = y1 - y0, f = ((hs(k, 1) * w + t * vel) % w + w) % w;
  const x = dx > 0 ? x0 + f : x1 - f, y = y0 + hs(k, 2) * hh + (dy * f) / Math.max(1, Math.abs(dx)) * 0; const l = largo * (0.6 + hs(k, 3) * 0.8);
  R.linea(Math.round(x), Math.round(y), Math.round(x - dx * l), Math.round(y - dy * l), (k % 3) ? c : BL); } };
// un balón de una época intermedia (pintado aquí, con el mismo sombreado de cuatro tonos que T.balon)
const PELOTA = { '1924': { L: 6.4, W: 3.9, pu: 0.62, cu: ['#4e2812', '#743c1c', '#9a5628', '#bc743e', '#e2a870'], co: ['#f2eadc', '#bcae94'], bo: '#2a160a' },
  '1934': { L: 6.2, W: 3.6, pu: 0.85, cu: ['#4a2010', '#70341a', '#964a26', '#b8683a', '#e6a070'], co: ['#f6f0e4', '#c4b8a0'], bo: '#28120a' } };
for (const k in PELOTA) { PELOTA[k].cu = PELOTA[k].cu.map(hex); PELOTA[k].co = PELOTA[k].co.map(hex); PELOTA[k].bo = hex(PELOTA[k].bo); }
const pelota = (x, y, ep, s, ang = 0) => { const e = PELOTA[ep], L = e.L * s, W = e.W * s, ca = Math.cos(ang), sa = Math.sin(ang), rb = Math.ceil(L + 1);
  for (let py = Math.floor(y - rb); py <= Math.ceil(y + rb); py++) for (let px = Math.floor(x - rb); px <= Math.ceil(x + rb); px++) {
    const dx = px + 0.5 - x, dy = py + 0.5 - y, u = (dx * ca + dy * sa) / L, v = -dx * sa + dy * ca, a = Math.abs(u); if (a >= 1) continue;
    const r = W * ((1 - e.pu) * Math.sqrt(1 - a * a) + e.pu * (1 - a * a)); if (Math.abs(v) >= r) continue;
    if (r - Math.abs(v) < 0.9 || (1 - a) * L < 0.8) { R.pset(px, py, e.bo); continue; }
    const nv = v / r, nu = u * 0.7, nz = Math.sqrt(Math.max(0, 1 - nv * nv - nu * nu * 0.5)), nx = nu * ca - nv * sa, ny = nu * sa + nv * ca, luz = Math.max(0, -0.5 * nx - 0.72 * ny + 0.48 * nz);
    let q = 0.25 + luz * 3.1 + (hs(px, py, 7) - 0.5) * 0.8; let c = e.cu[Math.max(0, Math.min(3, Math.floor(q)))]; if (luz > 0.92) c = e.cu[4];
    const d = v + r * 0.32; if (a < 0.44 && Math.abs(d) < 0.7 * s) c = e.co[1]; else if (a < 0.44 && Math.abs(d) < 1.5 * s && ((u * L / (1.6 * s)) % 1 + 1) % 1 < 0.45) c = e.co[0];
    else if (Math.abs(v - r * 0.35) < 0.35 * s && a < 0.9) c = e.cu[Math.max(0, Math.floor(q) - 2)];
    R.pset(px, py, c); } };

const d = (f) => en('deriva', f), P2 = d(0.299), P3 = d(0.676);
// 1 · desde la pasarela: la punta un poco de lado
const lado = d(0.18);
const p1 = (t) => {
  T.estadioHoy(R, t, { encuadre: 'antenas' });
  // el pase allá abajo, en el campo (y 70–112): el balón diminuto y su trayectoria; la punta, un poco de lado
  const u = (tramo(t, 0.2, P2 - 0.2)), x = lerp(90, 236, u), y = lerp(96, 84, u) - Math.sin(u * Math.PI) * 6;
  R.recorte([0, 68, 319, 114]);
  for (let k = 0; k < 60 * u; k++) { const w = k / 60, px = lerp(90, 236, w), py = lerp(96, 84, w) - Math.sin(w * Math.PI) * 6; if (k % 2 === 0) R.pset(Math.round(px), Math.round(py), BL); }
  const pa = Math.atan2(-12, 146), ld = tramo(t, lado - 0.3, lado + 0.3), ang = pa + 0.35 * ld;
  T.balon(R, Math.round(x), Math.round(y), t, { s: 1, ang, gira: 6 });
  if (ld > 0) { flecha(Math.round(x + 4), Math.round(y), Math.round(x + 4 + Math.cos(pa) * 16), Math.round(y + Math.sin(pa) * 16), hex('#c8d0d8'), 2); flecha(Math.round(x + 4), Math.round(y), Math.round(x + 4 + Math.cos(ang) * 16), Math.round(y + Math.sin(ang) * 16), AM, 3); }
  R.recorte(null);
  // los dos técnicos de la pasarela: uno sigue el pase con el dedo, el otro apunta en la tableta
  const tu = tramo(t, 0.3, lado);
  R.actor(EL.tecnico, Math.round(lerp(110, 150, tu)), 148, t, { dir: 1, anda: tu > 0 && tu < 1, dedo: t > lado - 0.2, sorpresa: t > lado + 0.4 && t < lado + 1.2 });
  R.actor(EL.tecnica, 196, 149, t, { dir: -1, habla: t > lado + 0.8 && Math.sin(t * 7) > 0, sonrisa: t > lado + 1.6 });
};
// 2 · desde arriba: el diestro curva a la derecha, el zurdo a la izquierda
const r0 = d(0.33), r1 = d(0.51), l0 = d(0.53), l1 = d(0.64);
const CC = T.C, VER = hex('#3a6a2a');
// un chibi visto desde arriba (unos 9 px): sombra, hombreras con su luz y su sombra, brazos con la mano, y el casco (o la
// gorra) con su raya y la rejilla hacia donde mira; o.corre mueve los pies, o.brazos los levanta (celebra), o.salta lo
// despega del suelo (la sombra se aleja)
const chibiA = (x, y, col, colS, casco, mira, t, k, o = {}) => {
  x = Math.round(x); y = Math.round(y); const sa = o.salta ? Math.round(Math.abs(Math.sin(t * 9 + k)) * 2) : 0;
  for (let j = -2; j <= 2; j++) for (let i = -4; i <= 4; i++) if ((i / 4.5) ** 2 + (j / 2.5) ** 2 < 1) aclara(x + i + 2 + sa, y + j + 2 + sa, hex('#10281a'), 0.45);
  if (o.corre) { const p = Math.sin(t * 16 + k) > 0 ? 1 : -1; R.pset(x - mira * 4, y + p, K); R.pset(x - mira * 3, y - p, hex('#3a3a44')); }
  const pi = k % 3 === 0 ? hex('#8a5a3a') : k % 3 === 1 ? hex('#e0b090') : hex('#5a3a24');
  if (o.brazos) { const b = Math.sin(t * 10 + k) > 0 ? 1 : 0; for (const s of [-1, 1]) { R.pset(x + mira * 2, y + s * (3 + b), col); R.pset(x + mira * 3, y + s * (4 + b), pi); } }
  else for (const s of [-1, 1]) { R.pset(x + mira, y + s * 3, colS); R.pset(x + mira * 2, y + s * 3, pi); }
  R.rect(x - 2, y - 2, x + 2, y + 2, K); R.rect(x - 1, y - 3, x + 1, y + 3, K);
  R.rect(x - 1, y - 2, x + 1, y + 2, col); R.pset(x - 1, y + 2, colS); R.pset(x, y + 2, colS); R.pset(x + 1, y + 1, colS); R.pset(x - 1, y - 2, mezcla(col, BL, 0.4));
  if (o.rayas) for (let j = -2; j <= 2; j += 2) R.pset(x + (j ? 1 : -1), y + j, K);
  R.disco(x, y, 1, casco); R.pset(x - mira, y, mezcla(casco, BL, 0.5)); R.pset(x + mira * 2, y, o.rayas ? casco : hex('#c8c8d0')); };
// el césped repintado encima del decorado (precalculado una vez): las franjas de corte de cinco yardas en dos verdes bien
// distintos, el desgaste entre las marcas del centro y alrededor de las líneas de cinco yardas (tierra tramada), el
// escudo del centro del campo (un óvalo con un balón y dos estrellas, sin letras) y la luz que baja hacia la banda de
// arriba, que deja de estar tan a oscuras (un recorrido de la pantalla por fotograma)
let CAPA = null;
const capaCesped = () => {
  const mul = new Float32Array(57600).fill(1), mA = new Float32Array(57600), mC = new Float64Array(57600);
  const TIE1 = hex('#9a8a52'), TIE2 = hex('#6e5e38'), ESC = [hex('#0e4a4a'), hex('#1e8a8a'), hex('#e8e0c8'), hex('#8a4a24'), hex('#b86e3a'), hex('#f2eee2'), hex('#f0d040')];
  for (let y = 19; y < 48; y++) for (let x = 0; x < 320; x++) { const f = (y - 19) / 28; mul[y * 320 + x] = 1.1 + Math.floor((0.55 * f) * 6 + trama(x, y)) / 6; }
  for (let y = 50; y < 168; y++) for (let x = 0; x < 300; x++) { const i = y * 320 + x, fr = Math.floor((x - 120) / 18 + 100) % 2;
    mul[i] = fr ? 1.14 : 0.84;
    // el desgaste: más pisado entre las marcas del centro y cerca de la yarda 50; rozaduras junto a cada línea de cinco
    const cen = Math.max(0, 1 - Math.abs(y - 109) / 18) * Math.max(0.35, 1 - Math.abs(x - 120) / 190) * 1.15;
    const lin = Math.max(0, 1 - Math.min(((x - 120) % 18 + 18) % 18, 18 - ((x - 120) % 18 + 18) % 18) / 4) * 0.55 + Math.max(0, 1 - Math.min(Math.abs(y - 99), Math.abs(y - 119)) / 4) * 0.5, sal = Math.max(0, 1 - Math.hypot((x - 40) / 16, (Math.min(Math.abs(y - 86), Math.abs(y - 140))) / 12)) * 0.8;
    const w = Math.max(cen, lin, sal) * (vn(x / 4, y / 3, 60) * 0.8 + vn(x / 1.5, y / 1.5, 61) * 0.4);
    if (w > 0.2 + trama(x, y) * 0.42) { mA[i] = w > 0.6 ? 0.72 : 0.5; mC[i] = w > 0.55 ? TIE2 : TIE1; mul[i] = 1; } }
  // el escudo del centro: el borde oscuro, el anillo del color del equipo, el fondo claro y el balón con sus cordones
  for (let y = 96; y <= 122; y++) for (let x = 98; x <= 142; x++) { const e = ((x - 120) / 20) ** 2 + ((y - 109) / 12) ** 2; if (e > 1) continue; const i = y * 320 + x;
    let c = e > 0.82 ? ESC[0] : e > 0.6 ? ESC[1] : ESC[2]; const b = ((x - 120) / 9) ** 2 + ((y - 109) / 4.5) ** 2;
    if (b < 1) c = b > 0.7 ? ESC[3] : (x - 120) + (y - 109) * 1.5 < -4 ? ESC[4] : ESC[3];
    if (Math.abs(y - 109) <= 0 && Math.abs(x - 120) <= 4) c = ESC[5]; if (b < 1 && Math.abs(y - 109) === 1 && Math.abs(x - 120) <= 4 && (x & 1) === 0) c = ESC[5];
    for (const sx of [104, 136]) { const dx = Math.abs(x - sx), dy = Math.abs(y - 109); if ((dx === 0 && dy <= 2) || (dy === 0 && dx <= 2) || (dx === 1 && dy === 1)) c = ESC[6]; }
    mA[i] = 0.82; mC[i] = c; mul[i] = 1; }
  return { mul, mA, mC };
};
const pintaCapa = () => { const { mul, mA, mC } = CAPA;
  for (let y = 19; y < 168; y++) for (let x = 0; x < 300; x++) { const i = y * 320 + x; if (mul[i] === 1 && mA[i] === 0) continue; let c = R.pget(x, y);
    const r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255; if (y >= 48 && r > 190 && g > 190 && b > 170) continue;   // las líneas de cal se quedan
    if (mA[i] > 0) c = mezcla(c, mC[i], mA[i]);
    else { const m = mul[i]; c = ((255 << 24) | (Math.min(255, Math.round(r * m)) << 16) | (Math.min(255, Math.round(g * m)) << 8) | Math.min(255, Math.round(b * m))) >>> 0; }
    R.pset(x, y, c); } };
const p2 = (t) => {
  const A = T.labGiro(R, t, { encuadre: 'arriba' }), X = (yd) => A.x50 + (yd - 50) * A.yarda;
  if (!CAPA) CAPA = capaCesped();
  pintaCapa();
  // la cuerda de la banda entre sus postes (con su banderín de cada poste que ondea), justo antes de la línea
  for (let x = 0; x < 320; x++) { const y = 45 + Math.round(Math.sin(x * 0.2 + t * 2) * 0.4 + Math.sin((x % 32) / 32 * Math.PI) * 0.6); R.pset(x, y, (x + Math.floor(t * 3)) % 4 ? hex('#e8d8a0') : hex('#b8a070')); }
  for (let x = 8; x < 320; x += 32) { R.rect(x - 1, 44, x + 1, 46, K); R.pset(x, 44, hex('#f0d040')); R.pset(x - 1, 45, hex('#a8a8b0')); const o = Math.sin(t * 5 + x) > 0 ? 1 : 0; R.pset(x + 2, 43 + o, CC.naranja); R.pset(x + 3, 43, CC.naranja); }
  // las dos cámaras de la tele en la banda (vistas desde arriba: trípode, cuerpo con su visera y el objetivo que sigue
  // al balón) con su operario detrás, y el cable que serpentea hasta la grada
  let bxSeg = 120;
  const tA = tramo(t, r0, r1), tB = tramo(t, l0, l1); bxSeg = t < l0 - 0.3 ? lerp(X(25), X(85), tA) : lerp(X(25), X(85), tB);
  for (const [cx, k] of [[16, 0], [258, 1]]) { const cy = 40, a = Math.atan2(70, bxSeg - cx), ox = Math.round(Math.cos(a) * 4), oy = Math.round(Math.sin(a) * 4);
    for (const [lx, ly] of [[-3, -2], [3, -2], [0, 3]]) R.linea(cx, cy, cx + lx, cy + ly, hex('#2a2a30'));
    R.rect(cx - 2, cy - 2, cx + 2, cy + 1, K); R.rect(cx - 1, cy - 2, cx + 1, cy, hex('#5a5a66')); R.pset(cx - 1, cy - 2, hex('#8a8a96'));
    R.linea(cx, cy, cx + ox, cy + oy, hex('#1a1a20')); R.pset(cx + ox, cy + oy, Math.floor(t * 2 + k) % 3 ? hex('#4a8ac8') : hex('#c8e8ff')); R.pset(cx - 1, cy - 3, Math.floor(t * 2) % 2 ? RO : ROs);
    chibiA(cx + (k ? 7 : -6), cy - 4, hex('#2a2a34'), hex('#1a1a20'), hex('#1a1a20'), k ? -1 : 1, t, 30 + k);
    for (let i = 0; i < 18; i++) R.pset(cx + (k ? 8 + i : -8 - i) , Math.round(cy - 10 - Math.sin(i * 0.5) * 2), hex('#1a1a20')); }
  // la línea recta de referencia de cada pase y el rastro de la curva real (debajo de los jugadores)
  const carril = (t0, t1, y0, signo, col) => { const u = tramo(t, t0, t1), x0 = X(25), x1 = X(85), dev = signo * 10, P = (w) => [lerp(x0, x1, w), y0 + dev * w * w];
    for (let x = x0; x <= x1; x += 6) { R.rect(Math.round(x), y0, Math.round(x) + 2, y0, BL); R.rect(Math.round(x), y0 + 1, Math.round(x) + 2, y0 + 1, VER); }
    for (let w = 0; w <= u; w += 0.006) { const [px, py] = P(w); R.rect(Math.round(px), Math.round(py) + 1, Math.round(px), Math.round(py) + 2, K); R.rect(Math.round(px), Math.round(py) - 1, Math.round(px), Math.round(py), col); }
    return { u, x0, x1, dev, P }; };
  const LA = carril(r0, r1, 86, 1, hex('#1e8a8a')), LB = carril(l0, l1, 140, -1, hex('#c83a3a'));
  // cada jugada: la línea (tres), la defensa (tres) que empuja al saque, el quarterback que retrocede y lanza, el
  // receptor que corre su ruta hasta el final de la curva justo cuando llega el balón, el defensa que lo persigue tarde
  // y el profundo que cierra; después del pase, la línea se relaja y el receptor frena con el balón en las manos
  const DEF = hex('#e8e0d0'), DEFs = hex('#a8a090'), DEFc = hex('#2a3458');
  const jugada = (L, t0, t1, y0, signo, col, colS, casco, k) => {
    const sn = t0 - 0.9, en = tramo(t, sn, sn + 0.4), x0 = L.x0, xe = L.x1, ye = y0 + L.dev, fin = t > t1;
    for (let i = -1; i <= 1; i++) { const j = Math.sin(t * 13 + i * 2 + k) * (en > 0 && !fin ? 0.6 : 0);
      chibiA(x0 + 9 - en * 2 + j, y0 + i * 9, col, colS, casco, 1, t, k + i + 1);
      chibiA(x0 + 19 - en * 4 - j, y0 + i * 9 + i * 2 * en, DEF, DEFs, DEFc, -1, t, k + i + 5, { corre: en > 0 && en < 1 }); }
    // el árbitro detrás de la jugada, que sigue el pase con la vista y da unos pasos hacia el receptor
