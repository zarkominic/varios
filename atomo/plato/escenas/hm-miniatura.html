<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ep43 · miniatura</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// HM-MINIATURA · ep43, canon de miniatura del 43 (a partir del canal de Farid Dieck): el personaje a la izquierda (Haymitch
// a los 16, en el prado al atardecer con las ocas y la bolsa de gominolas rojas), Atom grande y pensativo a la derecha
// sobre su estudio, un corte en diagonal entre los dos y «HAYMITCH» en letras de pixel grandes.
import { crearRoma } from '/atomo/plato/kits/pixel-roma.js';
import { conChibi, ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
import { hex } from '/atomo/plato/kits/pixel-retro.js';
import { prado, pradoDelante, estudio } from '/atomo/plato/escenas/hm-comun.js';
import * as AT from '/atomo/plato/escenas/atom-personaje.js';
import { figura, grado, halo } from '/atomo/plato/escenas/mini-chibi.js';
const R = conChibi(await crearRoma(document.getElementById('lienzo')));
// letras de pixel (5 × 7) para las 1–3 palabras de la miniatura
const F = {
  H: ['#...#', '#...#', '#...#', '#####', '#...#', '#...#', '#...#'], A: ['.###.', '#...#', '#...#', '#####', '#...#', '#...#', '#...#'],
  Y: ['#...#', '#...#', '.#.#.', '..#..', '..#..', '..#..', '..#..'], M: ['#...#', '##.##', '#.#.#', '#.#.#', '#...#', '#...#', '#...#'],
  I: ['#####', '..#..', '..#..', '..#..', '..#..', '..#..', '#####'], T: ['#####', '..#..', '..#..', '..#..', '..#..', '..#..', '..#..'],
  C: ['.####', '#....', '#....', '#....', '#....', '#....', '.####'],
};
// gruesas, con contorno oscuro y sombra dura, como los títulos de las miniaturas de relato
const palabra = (txt, x, y, s, c, sombra) => {
  const celdas = []; let cx = x;
  for (const ch of txt) { const g = F[ch]; for (let j = 0; j < 7; j++) for (let i = 0; i < 5; i++) if (g[j][i] === '#') celdas.push([cx + i * s, y + j * s]); cx += 6 * s; }
  for (const [px, py] of celdas) R.rect(px - 1 + 3, py - 1 + 3, px + s + 1 + 3, py + s + 1 + 3, sombra);   // sombra
  for (const [px, py] of celdas) R.rect(px - 2, py - 2, px + s + 1, py + s + 1, hex('#1a1020'));            // contorno
  for (const [px, py] of celdas) R.rect(px, py, px + s - 1, py + s - 1, c);
  for (const [px, py] of celdas) R.rect(px, py, px + s - 1, py, hex('#ffffff'));                         // brillo arriba
};
const dibujar = (t) => {
  // derecha: el estudio de Atom de noche; izquierda: el prado al atardecer; corte en diagonal
  const b = R.nuevo(), prev = R.usar(b); estudio(R, t, { encuadre: 'estudio', camara: 'mesa' }); R.usar(prev);
  const o = { encuadre: 'prado', camara: 'cerca', luz: 'tarde', sol: 0.7, gominolas: false };   // la bolsa va en su mano, no en el suelo
  prado(R, t, o);
  figura(R, EL.haymitch, 96, 162, t, { dir: 1, sostiene: true }, 2);
  // la bolsa de gominolas en su mano: roja, con lazo dorado, como la del decorado (o.gominolas)
  { const bx = 130, by = 144, RJ = hex('#d0283a'), RO = hex('#8a1424'), BR = hex('#ff6a70'), OR = hex('#f0c040'), K = hex('#1a1020');
    R.poligono([[bx, by + 3], [bx + 10, by + 3], [bx + 11, by + 13], [bx - 1, by + 13]], K); R.poligono([[bx + 1, by + 4], [bx + 9, by + 4], [bx + 10, by + 12], [bx, by + 12]], RJ);
    R.rect(bx + 7, by + 5, bx + 9, by + 12, RO); R.rect(bx + 1, by + 5, bx + 2, by + 9, BR);                       // sombra y brillo del celofán
    R.poligono([[bx + 3, by - 1], [bx + 7, by - 1], [bx + 6, by + 3], [bx + 4, by + 3]], K); R.rect(bx + 4, by, bx + 6, by + 2, RJ);   // el cuello fruncido
    R.rect(bx + 2, by + 2, bx + 8, by + 3, OR); R.pset(bx + 1, by + 1, OR); R.pset(bx + 9, by + 1, OR); R.pset(bx + 1, by + 4, OR); R.pset(bx + 9, by + 4, OR);   // el lazo
    if (Math.sin(t * 4) > 0.2) R.pset(bx + 5, by + 2, hex('#fff8d0'));
    for (const [i, j, c] of [[3, 7, '#f0e070'], [6, 8, '#7ad070'], [4, 10, '#f0a040']]) R.pset(bx + i, by + j, hex(c)); }
  pradoDelante(R, t, o);
  const B = R.buf; for (let y = 0; y < 180; y++) { const xd = 190 + Math.round((180 - y) * 0.28); for (let x = xd; x < 320; x++) B[y * 320 + x] = b[y * 320 + x]; for (let k = -1; k <= 1; k++) R.pset(xd + k, y, hex('#f4f0e4')); }
  grado(R, { cx: 160, cy: 100, tinte: '#0a0612', f: 0.18, desde: 0.5, max: 0.75 });
  halo(R, 262, 110, 46, 46, '#fff0c0', 0.28);
  AT.atom(R, 262, 160, t, { s: 4, pose: 'piensa', dir: -1, cara: 'triste' });
  palabra('HAYMITCH', 12, 14, 4, hex('#f4f0e4'), hex('#2a1a24'));
};
window.__frame = async (t) => { dibujar(t); R.presentar(); };
window.__listo = true;
</script>
</body>
</html>
