<script type="module">
// GT-DISENO (frases 8–9), 1995, cartela «1995». Seis planos (encuadres-ep31.md):
// 1. la oficina de DMA de noche con la ventana a la calle (A oficina, vista 'calle', 2.ª vez): Dailly entra con el montón
//    carpeta roja del documento y la deja en la mesa principal (pintada aquí: de noche no se veía) en «design»; Jones
//    explica con el dedo y en «new game» dice «coche» (bocadillo); Penn se acerca con el café;
// 2. el documento de diseño de cerca, desde arriba (LOCAL: mesa de formica con taza, disquetes, calculadora, regla): la
//    mano con el lápiz dibuja la persecución en «races and chases» y las calles en «cities seen from above»;
// 3. la ciudad de juguete desde arriba (D arriba): las calles llenas de coches y gente; en «one simple idea» se apaga el
//    resto y queda la luz sobre el aparcamiento, y en «get out of your car… any other» el muñequito cambia de coche;
// 4. gag 3, el botón rojo (D arriba/boton): Jones salta y lo aplasta en «switching cars»; en el monitor el muñequito
//    cambia de coche; Dailly se ríe; Penn entra con la taza y en «its name» dice «coche»;
// 5. el coche de policía de juguete en la mesa de pruebas (LOCAL, de noche): en «robbers» el coche rojo pasa como una
//    bala por detrás y el policía ni se mueve; en «the cop» bosteza; en «wasn't much fun» se le apagan las luces;
// 6. las tres cabinas de prueba en corte (LOCAL, pasillo con la señal de salida): los tres se aburren; en «rather run
//    away» giran el volante, en sus pantallas el coche huye y la señal de salida se enciende; los tres saltan.
import * as T from '/atomo/plato/escenas/gt-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('gt-diseno');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const h = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const mez = (a, b, k) => { let r = 0; for (const s of [0, 8, 16]) r |= Math.round(((a >>> s) & 255) * (1 - k) + ((b >>> s) & 255) * k) << s; return (r | 0xff000000) >>> 0; };
const tin = (x, y, c, a) => { x = Math.round(x); y = Math.round(y); if (x < 0 || x > 319 || y < 0 || y > 179) return; R.pset(x, y, mez(R.pget(x, y), c, a)); };
const CAPAS = {};
const capa = (k, dib) => { if (!CAPAS[k]) { const b = R.nuevo(), prev = R.usar(b); dib(); R.usar(prev); CAPAS[k] = b; } R.copiar(CAPAS[k]); };
const sube = (u) => u * u * (3 - 2 * u);
const sin = (t, w) => Math.sin(t * w) > 0;
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const b4 = (x, y) => (B4[((y & 3) << 2) | (x & 3)] + 0.5) / 16;
const tono = (r, v, x, y) => { let l = Math.floor(v); if (v - l > b4(x, y)) l++; return r[l < 0 ? 0 : l >= r.length ? r.length - 1 : l]; };
const Q = Object.fromEntries(Object.entries({
  k: '#17151d', bl: '#f4f4ee', crema: '#efe6cc', papel: '#f2ecd8', papelS: '#d8ceb4', papelL: '#fbf8ee', raya: '#a8b4c8', lapiz: '#6a6a78',
  haya: '#d0a872', hayaS: '#a6804e', hayaL: '#e4c290', hayaD: '#7a5a34',
  form: '#a8b4a4', formS: '#8a9888', formL: '#c2ccbc', formD: '#6a7868',
  bloque: '#cfcab4', bloqueS: '#b6b09a', bloqueL: '#dedac6', bloqueJ: '#a8a28c',
  noche0: '#1e2438', noche1: '#2a3250', noche2: '#3a4466', noche3: '#4e5a80',
  moq: '#5c6880', moqS: '#4a5468', moqL: '#6e7a92',
  beige: '#d8ccb0', beigeS: '#a89c80', beigeL: '#ece2c8', beigeD: '#7c725e',
  verde: '#3a8a4a', verdeL: '#5ab85a', verdeS: '#2a6a36', verdeN: '#2ae06a',
  piel: '#f6c290', pielS: '#d48a5a', rojo: '#d8303a', rojoS: '#8a1e26', rojoL: '#f06a5a',
  azul: '#3a6ad8', azulS: '#24449a', azulL: '#7a9ae8', oro: '#f0c040', oroS: '#a87a18', oroL: '#ffe890',
  gris: '#8a8c90', grisS: '#5e6064', grisL: '#b8bac0', grisD: '#3a3c44', acero: '#9aa0aa', aceroS: '#6e7480', aceroL: '#c4c8d0',
  pant0: '#0e1a2e', pant1: '#16284a', pant2: '#22406e', fos: '#5ae07a', fosS: '#2a8a4a',
  asf: '#55585f', asfS: '#44474e', asfL: '#686b72', acera: '#b8b8b0', aceraS: '#98988e',
  manila: '#e8c888', manilaS: '#c8a460', manilaL: '#f4dca8', nogal: '#6a4428', nogalS: '#4a2e1a',
  lluvia: '#9ab0c8', sodio: '#f0a040', sodioL: '#ffd890',
}).map(([k, v]) => [k, hex(v)]));
// un rectángulo con borde negro y relleno
const caja = (x0, y0, x1, y1, c, borde = Q.k) => { R.rect(x0, y0, x1, y1, borde); R.rect(x0 + 1, y0 + 1, x1 - 1, y1 - 1, c); };
// el bocadillo con un icono a doble tamaño (x, y = la punta de abajo)
const globo = (x, y, ic, col = Q.k) => { x = Math.round(x); y = Math.round(y); R.rect(x - 8, y - 20, x + 8, y - 3, Q.k); R.rect(x - 9, y - 19, x + 9, y - 4, Q.k); R.rect(x - 7, y - 19, x + 7, y - 4, Q.bl); R.rect(x - 8, y - 18, x + 8, y - 5, Q.bl); R.rect(x - 1, y - 3, x + 1, y - 2, Q.k); R.pset(x, y - 1, Q.k); R.pset(x, y - 3, Q.bl); R.icono(ic, x - (ic === '!' ? 3 : ic === 'coche' || ic === 'bichito' ? 7 : 5), y - 18, col, Q.bl, 2); };
// vapor que sube de una taza (x, y = el borde de la taza)
const vapor = (x, y, t, n = 3) => { for (let k = 0; k < n; k++) { const f = ((t * 0.7 + k / n) % 1), yy = y - 2 - f * 14, xx = x + Math.sin(t * 3 + k * 2 + f * 6) * 2; if (f < 0.85) tin(xx, yy, Q.bl, 0.55 * (1 - f)); tin(xx + 1, yy - 1, Q.bl, 0.35 * (1 - f)); } };
// gotas que resbalan por un cristal (dentro del rectángulo dado)
const gotas = (x0, y0, x1, y1, t, n = 10, c = Q.lluvia) => { for (let k = 0; k < n; k++) { const x = x0 + Math.floor(h(k, 3, 9) * (x1 - x0)), y = y0 + ((t * (14 + h(k, 5) * 20) + h(k, 7) * 80) % (y1 - y0)); R.pset(x, Math.round(y), c); R.pset(x, Math.round(y) - 1, mez(c, Q.k, 0.3)); } };
const rayasLluvia = (x0, y0, x1, y1, t, c = Q.lluvia, n = 26) => { for (let k = 0; k < n; k++) { const x = x0 + ((h(k, 1) * (x1 - x0) + t * 40) % (x1 - x0)), y = y0 + ((h(k, 2) * (y1 - y0) + t * 160) % (y1 - y0)); for (let j = 0; j < 4; j++) if (y + j <= y1) R.pset(Math.round(x - j * 0.5), Math.round(y + j), c); } };

const a = (f) => en('diseno', f), b = (f) => en('boton', f);
const P2 = a(0.248), P3 = a(0.555), P4 = a(1.005), P5 = b(0.298), P6 = b(0.80);

// ── 1 · la oficina de noche: el documento llega a la mesa ───────────────────────────────────────────────────────
const deja = a(0.135), juego = a(0.18);
const hojas = (x, y) => { caja(x - 9, y - 7, x + 9, y, Q.papel); for (let k = 0; k < 3; k++) R.rect(x - 8, y - 2 + k * 0, x + 8, y - 2, Q.papelS); caja(x - 10, y - 9, x + 8, y - 4, Q.rojo); R.rect(x - 9, y - 8, x + 7, y - 8, Q.rojoL); R.rect(x - 4, y - 7, x + 2, y - 6, Q.oroL); for (let k = 0; k < 4; k++) R.pset(x - 8 + k * 5, y - 4, Q.aceroL); };
const p1 = (t) => {
  const o = { encuadre: 'oficina', vista: 'calle', noche: true, pantalla: 'codigo', lluvia: 0.6 };
  T.dundee(R, t, o);
  // Jones, ante la pizarra: explica con el dedo y, cuando llega el documento, se vuelve y sonríe
  const vuelve = t > deja - 0.2;
  R.actor(EL.jonesGT, 112, 150, t, { dir: vuelve ? 1 : -1, dedo: !vuelve || (t > juego && t < juego + 1.2), habla: t > 1.5 && t < deja && sin(t, 7), sonrisa: t > juego, salto: t > juego && t < juego + 0.3 ? 2 : 0 });
  // Dailly entra por la izquierda con el montón de hojas y lo deja en la esquina de la mesa
  const u = tramo(t, 1.3, deja - 0.4), dx = Math.round(lerp(-20, 160, sube(u))), lleva = t < deja;
  const d = R.actor(EL.daillyGT, dx, 150, t, { dir: 1, anda: u > 0 && u < 1, sostiene: lleva ? (u < 1 ? true : [180, 128]) : false, sonrisa: t > juego, habla: t > deja + 0.3 && t < juego + 0.8 && sin(t, 8) });
  if (lleva) hojas(d.mano[0] + 3, d.mano[1] + 3); else hojas(190, 131);
  // Penn, junto al archivador, sopla el café y se acerca un paso cuando llega el documento
  const pv = tramo(t, deja, deja + 0.9);
  const pn = R.actor(EL.pennGT, Math.round(lerp(292, 280, pv)), 150, t, { dir: -1, anda: pv > 0 && pv < 1, sostiene: true, sonrisa: t > juego + 0.2 });
  { const [mx, my] = pn.mano; caja(mx - 3, my - 4, mx + 2, my + 1, Q.bl); R.rect(mx - 2, my - 3, mx + 1, my - 3, hex('#6a3a1a')); vapor(mx, my - 4, t, 2); }
  if (t > a(0.18) && t < a(0.18) + 1.3) globo(119, 120, 'coche', Q.rojo);
  T.dundeeDelante(R, t, o);
};

// ── 2 · el documento de diseño de cerca, desde arriba ───────────────────────────────────────────────────────────
const RAYA = (x, y, w, c = Q.raya) => { for (let i = 0; i < w; i++) R.pset(x + i, y + Math.round(Math.sin(i * 0.9 + x) * 0.6), c); };
const cocheArriba = (cx, cy, c, cs, poli) => {   // un coche visto desde arriba, dibujado a lápiz de colores (12 × 20)
  R.rect(cx - 6, cy - 10, cx + 6, cy + 10, Q.lapiz); R.rect(cx - 5, cy - 9, cx + 5, cy + 9, c); R.rect(cx + 3, cy - 9, cx + 5, cy + 9, cs);
  R.rect(cx - 4, cy - 6, cx + 4, cy - 3, Q.pant2); R.rect(cx - 4, cy + 4, cx + 4, cy + 6, Q.pant2); R.rect(cx - 3, cy - 6, cx - 2, cy - 5, Q.azulL);
  for (const [dx, dy] of [[-7, -6], [6, -6], [-7, 5], [6, 5]]) R.rect(cx + dx, cy + dy, cx + dx + 1, cy + dy + 3, Q.k);
  if (poli) { R.rect(cx - 3, cy - 1, cx - 1, cy + 1, Q.rojo); R.rect(cx + 1, cy - 1, cx + 3, cy + 1, Q.azul); }
};
const mesa2 = () => {
  // la mesa de formica verde gris con su moteado, el canto de haya abajo y el charco de luz del flexo
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) { const v = 1.6 + h(x, y, 2) * 0.5 - Math.hypot(x - 150, y - 80) / 260; R.pset(x, y, tono([Q.formD, Q.formS, Q.form, Q.formL], v, x, y)); if (h(x, y, 5) > 0.985) R.pset(x, y, Q.formD); }
  R.rect(0, 172, 319, 179, Q.hayaS); R.rect(0, 172, 319, 172, Q.hayaL); for (let x = 0; x < 320; x += 1) if (h(x, 1) > 0.6) R.pset(x, 175 + Math.round(h(x, 2) * 3), Q.hayaD);
  // el cuaderno de anillas abierto: dos páginas con sombra
  R.rect(66, 30, 258, 166, mez(Q.formD, Q.k, 0.3));
  for (const [x0, x1] of [[60, 156], [164, 252]]) { caja(x0, 24, x1, 162, Q.papel, Q.papelS); for (let y = 34; y < 160; y += 7) R.rect(x0 + 3, y, x1 - 3, y, mez(Q.papel, Q.raya, 0.35)); }
  R.rect(60, 24, 62, 162, Q.papelS); R.rect(250, 24, 252, 162, Q.papelS);
  for (let y = 28; y < 160; y += 8) { R.disco(160, y + 2, 3, Q.k); R.disco(160, y + 2, 2, Q.aceroL); R.pset(161, y + 1, Q.bl); }
  // página izquierda: el título con los dos coches (el rojo que huye y el de policía) y el relámpago entre ellos
  R.rect(70, 30, 148, 62, mez(Q.papel, Q.oroL, 0.4)); R.rect(70, 30, 148, 30, Q.papelS); R.rect(70, 62, 148, 62, Q.papelS);
  cocheArriba(86, 46, Q.rojo, Q.rojoS, false); cocheArriba(132, 46, Q.bl, Q.grisL, true);
  for (const [x, y] of [[106, 38], [109, 42], [105, 45], [110, 49], [106, 53], [109, 56]]) R.rect(x, y, x + 2, y + 2, Q.oro);
  R.rect(100, 38, 102, 54, Q.k); R.rect(114, 38, 116, 54, Q.k); for (let j = 0; j < 6; j++) { R.pset(98 - (j % 2), 40 + j * 3, Q.k); R.pset(118 + (j % 2), 40 + j * 3, Q.k); }
  // rayas (en vez de letras) y dos recuadros con bocetos
  for (let k = 0; k < 4; k++) RAYA(70, 70 + k * 7, 60 + (k % 2) * 16, Q.lapiz);
  caja(70, 100, 104, 128, Q.papelL, Q.lapiz); cocheArriba(80, 114, Q.azul, Q.azulS, false); R.linea(86, 114, 100, 104, Q.lapiz); R.disco(100, 118, 2, Q.lapiz);
  caja(112, 100, 148, 128, Q.papelL, Q.lapiz); for (let k = 0; k < 3; k++) R.rect(116 + k * 10, 108, 122 + k * 10, 120, [Q.oro, Q.verde, Q.azul][k]);
  for (let k = 0; k < 3; k++) RAYA(70, 136 + k * 7, 50 + k * 12, Q.lapiz);
  R.rect(132, 148, 150, 158, Q.k); R.rect(133, 149, 149, 157, Q.bl); R.numero('1995', 134, 156, { fina: true });
  // página derecha: el plano de la ciudad vista desde arriba (manzanas con trama, calles, el río) a medio dibujar
  for (let y = 32; y <= 150; y++) for (let x = 172; x <= 244; x++) { const cx = (x - 172) % 26, cy = (y - 32) % 30; if (cx > 6 && cy > 6) { if ((x + y) % 4 === 0) R.pset(x, y, Q.lapiz); if (cx === 7 || cy === 7 || cx === 25 || cy === 29) R.pset(x, y, Q.lapiz); } }
  for (let y = 32; y <= 150; y++) for (let x = 230; x <= 236; x++) if (y < 92) R.pset(x, y, mez(Q.papel, Q.azulL, 0.6));
  // la taza de té vista desde arriba, la mancha de otra taza en el papel y los disquetes
  R.disco(30, 56, 15, Q.k); R.disco(30, 56, 14, Q.bl); R.disco(30, 56, 11, Q.beigeS); R.disco(30, 56, 10, hex('#8a5a2a')); R.disco(27, 53, 3, hex('#a8743a'));
  R.rect(44, 52, 50, 60, Q.k); R.rect(45, 53, 49, 59, Q.bl);
  for (let a2 = 0; a2 < 6.28; a2 += 0.05) { const x = Math.round(214 + Math.cos(a2) * 11), y = Math.round(140 + Math.sin(a2) * 11); if (h(x, y) > 0.3) R.pset(x, y, mez(Q.papel, hex('#8a5a2a'), 0.35)); }
  for (let k = 0; k < 3; k++) { const x0 = 12 + k * 3, y0 = 100 + k * 5; caja(x0, y0, x0 + 30, y0 + 30, [hex('#2a2a36'), hex('#3a5aa8'), hex('#c83a3a')][k]); R.rect(x0 + 8, y0 + 1, x0 + 22, y0 + 10, Q.aceroL); R.rect(x0 + 16, y0 + 3, x0 + 19, y0 + 8, Q.grisS); R.rect(x0 + 5, y0 + 15, x0 + 25, y0 + 28, Q.bl); }
  R.numero('3', 26, 141, { fina: true });
  // la calculadora con sus cifras, la regla, la goma y las virutas del sacapuntas
  caja(268, 108, 304, 160, Q.grisD); R.rect(272, 112, 300, 122, hex('#9ab08a')); R.numero('1995', 274, 121, { fina: true });
  for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) caja(272 + i * 7, 126 + j * 8, 277 + i * 7, 131 + j * 8, i === 3 ? Q.oro : Q.grisL);
  R.rect(178, 166, 318, 171, Q.k); R.rect(179, 166, 317, 170, Q.oroL); for (let x = 182; x < 316; x += 4) R.rect(x, 166, x, x % 20 === 2 ? 169 : 167, Q.oroS);
  caja(270, 70, 290, 80, hex('#f0a0b0')); R.rect(271, 71, 289, 72, hex('#ffc8d0'));
  for (let k = 0; k < 9; k++) { const x = 286 + Math.round(h(k, 4) * 24), y = 86 + Math.round(h(k, 6) * 14); R.pset(x, y, Q.hayaL); R.pset(x + 1, y, Q.hayaS); }
  // el coche rojo de juguete visto desde arriba, aparcado junto al cuaderno
  { const cx = 290, cy = 60; R.rect(cx - 7, cy - 12, cx + 7, cy + 12, Q.k); R.rect(cx - 6, cy - 11, cx + 6, cy + 11, Q.rojo); R.rect(cx + 3, cy - 11, cx + 6, cy + 11, Q.rojoS); R.rect(cx - 4, cy - 7, cx + 4, cy - 3, Q.pant2); R.rect(cx - 4, cy + 4, cx + 4, cy + 7, Q.pant2); R.rect(cx - 5, cy - 1, cx + 5, cy, Q.bl); }
};
// el lápiz en la mano: punta (px, py); la mano canónica con su brazo entra desde abajo a la derecha
const lapizMano = (px, py, t) => {
  px = Math.round(px); py = Math.round(py);
  T.brazo(R, px + 34, 198, px + 16, py + 10, '#3a4a6a', -1, { codo: [px + 32, py + 30] });
  R.linea(px, py, px + 9, py + 7, Q.k); R.linea(px + 1, py - 1, px + 10, py + 6, Q.oro); R.linea(px + 1, py, px + 10, py + 7, Q.oroS); R.pset(px, py, Q.k); R.pset(px + 1, py, Q.beige);
};
const lazo = (u) => {   // el recorrido de la persecución que dibuja el lápiz, de un coche al otro, en la página izquierda
  const pts = []; for (let i = 0; i <= 40; i++) { const s = i / 40; pts.push([88 + 44 * s + Math.sin(s * 9) * 4, 150 + Math.cos(s * 6.3) * 5 - 16 * s]); }
  const n = Math.round(u * 40); return [pts.slice(0, n + 1), pts[n]];
};
const dibuja = a(0.36), cambia = a(0.44), calles = a(0.455), arriba = a(0.53);
const p2 = (t) => {
  capa('mesa2', mesa2);
  // el vapor de la taza y la luz del flexo que tiembla un poco
  vapor(30, 46, t, 4);
  // el lápiz dibuja el recorrido de la persecución (rayas rojas) y luego, en la otra página, las calles
  const u = tramo(t, dibuja, cambia - 0.1);
  const [pts, punta] = lazo(u);
  for (let i = 0; i < pts.length; i++) if (i % 3 !== 2) { R.rect(Math.round(pts[i][0]), Math.round(pts[i][1]), Math.round(pts[i][0]) + 1, Math.round(pts[i][1]) + 1, Q.rojo); }
  if (u >= 1) { const [x, y] = pts[pts.length - 1]; R.linea(x, y, x - 4, y + 3, Q.rojo); R.linea(x, y, x - 4, y - 3, Q.rojo); }
  const v = tramo(t, calles, arriba);
  // las dos calles nuevas del plano: una horizontal y una vertical, que se alargan con el lápiz
  const cx1 = Math.round(lerp(172, 244, Math.min(1, v * 1.6))), cy1 = Math.round(lerp(126, 152, Math.max(0, v * 1.6 - 0.6)));
  if (v > 0) { R.rect(172, 126, cx1, 127, Q.k); R.rect(172, 125, cx1, 125, Q.lapiz); }
  if (v > 0.38) { R.rect(196, 126, 197, cy1, Q.k); }
  // cuando acaba el plano, cochecitos en las calles nuevas
  if (v >= 1) for (const [x, y, c] of [[180, 125, Q.rojo], [222, 125, Q.azul], [195, 140, Q.oro]]) R.rect(x, y, x + 3, y + 2, c);
  // la mano: espera, dibuja el lazo, cruza a la otra página y dibuja las calles; luego se retira un poco
  let px, py;
  if (t < dibuja) { const e = tramo(t, P2, dibuja); px = lerp(150, 88, sube(e)); py = lerp(166, 155, sube(e)); }
  else if (t < cambia) { px = punta[0]; py = punta[1]; }
  else if (t < calles) { const e = tramo(t, cambia, calles); px = lerp(punta[0], 172, sube(e)); py = lerp(punta[1], 126, sube(e)); }
  else if (v < 0.38) { px = cx1; py = 126; }
  else if (v < 1) { px = 196; py = cy1; }
