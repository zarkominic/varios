// HP-BANQUETE (frase 17), 1991, sin cartela. Cuatro planos:
// 1. el Gran Comedor en diagonal desde la esquina de las puertas (fondo local, otra cámara que hp-mesa): la pared larga con
//    ventanales y los cuatro estandartes que se mecen, el testero con la vidriera, la mesa alta al fondo a la derecha y las
//    cuatro mesas de las casas cruzando el cuadro en diagonal (alumnos en bustos y de espaldas), la alfombra del pasillo,
//    velas que flotan, nubes del techo y un fantasma; en «feast» la comida aparece fuente a fuente con un destello;
//    McGonagall cruza el estrado con el sombrero, lo deja en el taburete en «hat» y desenrolla la lista en «names»;
//    Hermione, la primera de la fila del pasillo, echa a andar hacia el estrado; corta en «sings»;
// 2. la mesa de los profesores de cerca: el sombrero canta en el taburete (notas que suben) y la snitch se tapa los oídos
//    (gag 4); en «done» calla y los de primero aplauden; Dumbledore se levanta en «stands», sonríe en «smiles» y abre los
//    brazos en «says»; Snape frunce el ceño; corta antes de «Nitwit»;
// 3. (fondo local) desde la mesa de Gryffindor: los cuatro globos sin letras salen de Dumbledore, uno en cada palabra
//    (Nitwit, Blubber, Oddment, Tweak); Ron se queda con el muslo en el aire, Hermione con un «?», el sapo de Neville salta
//    a la mesa; en «sits» Dumbledore se sienta y los globos se van;
// 4. lo alto de la torre de noche, «as if nothing had happened»: detrás, nubes de tres tonos a tres velocidades, los
//    montes, el bosque en dos tonos, el lago con el reflejo de la luna, las otras torres con ventanas que parpadean,
//    murciélagos y lechuzas; en la azotea, el banco con mantas, libros y una taza que humea, el farol y un charco con la
//    luna; Ron llega por detrás del banco, se sienta, bosteza estirándose y se duerme; Harry cruza y mira por el telescopio.
import * as T from '/atomo/plato/escenas/hp-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hp-banquete');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const s = (f) => en('sombrero', f);
const P2 = s(0.219), P3 = s(0.602), P4 = s(0.878);
const FEAST = s(0.035), HAT = s(0.107), NAMES = s(0.153), SINGS = s(0.227), DONE = s(0.361), STANDS = s(0.409), SMILES = s(0.451), SAYS = s(0.493);
const W = [s(0.646), s(0.698), s(0.749), s(0.803)], SITS = s(0.853);
const PZ = T.PIEZAS_HP;
const H = (a, b, k) => { let n = (a * 374761393 + b * 668265263 + k * 1442695041) | 0; n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], bay = (x, y) => (B4[((y & 3) << 2) | (x & 3)] + 0.5) / 16;
const mez = (c, d, a) => { const ch = (k) => Math.round(((c >>> k) & 255) * (1 - a) + ((d >>> k) & 255) * a); return ((255 << 24) | (ch(16) << 16) | (ch(8) << 8) | ch(0)) >>> 0; };
const tine = (x, y, c, a) => { const p = R.pget(x, y); if (p) R.pset(x, y, mez(p, c, a)); };
const K = hex('#1a1424'), ORO = hex('#f0c040'), OROS = hex('#a87a20'), CREMA = hex('#fff4d8');
// la nota musical (♪) con su sombra
const nota = (x, y, c) => { x = Math.round(x); y = Math.round(y); for (const [d, col] of [[1, K], [0, c]]) { R.rect(x + d, y + d - 1, x + d + 2, y + d + 1, col); R.rect(x + d + 2, y + d - 7, x + d + 2, y + d, col); R.rect(x + d + 3, y + d - 7, x + d + 4, y + d - 6, col); R.pset(x + d + 5, y + d - 5, col); } };
// la Z del sueño (símbolo)
const zeta = (x, y, c, e = 1) => { x = Math.round(x); y = Math.round(y); for (const [d, col] of [[1, K], [0, c]]) { R.rect(x + d, y + d, x + d + 3 * e, y + d + e - 1, col); R.rect(x + d + 2 * e, y + d + e, x + d + 3 * e - 1, y + d + 2 * e - 1, col); R.rect(x + d + e, y + d + 2 * e, x + d + 2 * e - 1, y + d + 3 * e - 1, col); R.rect(x + d, y + d + 3 * e, x + d + 3 * e, y + d + 4 * e - 1, col); } };
// el destello de cuatro puntas
const chispa = (x, y, r, c) => { x = Math.round(x); y = Math.round(y); R.linea(x - r, y, x + r, y, c); R.linea(x, y - r, x, y + r, c); R.pset(x, y, CREMA); };
// el globo de palabras SIN letras: cada uno con su símbolo (!, estrella, espiral, ?); (x, y) = la punta de la cola
const globo = (x, y, u, k, t) => {
  if (u <= 0) return; const e = Math.min(1, u * 2.2), w = Math.round(4 + 10 * e), h = Math.round(4 + 8 * e), cx = x + (k % 2 ? 10 : -10), cy = y - 8 - h;
  R.poligono([[x, y], [cx - 4, cy + h - 2], [cx + 4, cy + h - 2]], K); R.disco(cx, cy, 0, K);
  R.rect(cx - w - 1, cy - h, cx + w + 1, cy + h, K); R.rect(cx - w, cy - h - 1, cx + w, cy + h + 1, K);
  R.rect(cx - w, cy - h + 1, cx + w, cy + h - 1, CREMA); R.rect(cx - w + 1, cy - h, cx + w - 1, cy + h, CREMA);
  R.poligono([[x + 1, y - 2], [cx - 2, cy + h - 1], [cx + 2, cy + h - 1]], CREMA);
  R.rect(cx - w + 1, cy + h - 1, cx + w - 1, cy + h, hex('#d8c8a8'));
  if (e < 1) return;
  const col = [hex('#d83a3a'), hex('#e8a020'), hex('#7a3aa8'), hex('#2a6ad8')][k];
  if (k === 0) R.icono('!', cx - 4, cy - 7, col, K, 2);
  else if (k === 3) R.icono('?', cx - 4, cy - 7, col, K, 2);
  else if (k === 1) { const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5 + Math.sin(t * 3) * 0.1, r = i % 2 ? 3 : 7; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } R.poligono(p, col); R.pset(cx - 1, cy - 2, CREMA); }
  else { for (let a = 0; a < 15; a += 0.12) { const r = a * 0.5; R.rect(Math.round(cx + Math.cos(a + t * 4) * r), Math.round(cy + Math.sin(a + t * 4) * r), Math.round(cx + Math.cos(a + t * 4) * r), Math.round(cy + Math.sin(a + t * 4) * r) + 1, col); } }
};

// 1 · el Gran Comedor en diagonal, desde la esquina de las puertas (fondo local, otra cámara que hp-mesa): la pared larga
//     con sus ventanales y estandartes se aleja hacia la derecha, el testero con la vidriera y la mesa alta al fondo a la
//     derecha, y las cuatro mesas de las casas cruzan el cuadro en diagonal hacia el estrado
const X0 = -97, Y0 = 120.2, AU = 2.4, CU = -0.5, BV = 1.9, DV = 1.25, UE = 124, UD = 112, ZD = 7, DET = AU * DV - BV * CU;
const PJ = (u, v, z = 0) => [X0 + AU * u + BV * v, Y0 + CU * u + DV * v - z];
const suelo1 = (x, y) => { const dx = x - X0, dy = y - Y0; return [(dx * DV - BV * dy) / DET, (AU * dy - CU * dx) / DET]; };
const ANT1 = [[...PJ(115, 0, 26).map(Math.round), 1], [...PJ(UE, 58, 30).map(Math.round), 2]];   // las antorchas (pared larga y testero)
const CASAS = ['#a8202a', '#e8b830', '#1e6a3a', '#2a4a9a'].map(hex), MESAS1 = [12, 32, 52, 72];
const PELOS1 = ['#3a2418', '#c8a060', '#1c1424', '#a8501e', '#6a4a2a', '#e0c890'].map(hex);
const TELAS1 = ['#3a2418', '#c8a060', '#1c1424', '#a8501e', '#6a4a2a', '#e0c890'].map((c) => T.tela('#2a2a36', '#1c1c26', { H: c, h: '#5a3a24', V: c, W: c }));
// una capa como lista de píxeles (se pega sin recorrer toda la pantalla)
const lista = (clave, pinta) => { if (cache[clave]) return cache[clave]; const b = R.nuevo(), prev = R.usar(b); pinta(); R.usar(prev); const idx = [], col = [];
  for (let i = 0; i < b.length; i++) if (b[i]) { idx.push(i); col.push(b[i]); } return (cache[clave] = { idx: Int32Array.from(idx), col: Uint32Array.from(col) }); };
const pega = (l) => { const B = R.buf; for (let k = 0; k < l.idx.length; k++) B[l.idx[k]] = l.col[k]; };
const fuera1 = (x, y) => (x >= 270 && y <= 48) || (x >= 14 && x <= 176 && y <= 17);   // la zona de Atom y la barra del año
// el techo encantado: cielo tramado con la vía láctea y estrellas
const pintaCielo1 = () => {
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) { const u = y / 70 + (H(x >> 3, y >> 2, 21) - 0.5) * 0.25, b = bay(x, y);
    let c = u > 0.66 + b * 0.3 ? hex('#2a3270') : u > 0.2 + b * 0.4 ? hex('#1c2252') : hex('#121638');
    const dv = Math.abs(y - (8 + x * 0.16)); if (dv < 9 && H(x, y, 22) < 0.45 * (1 - dv / 9)) c = H(x, y, 23) < 0.3 ? hex('#4a5490') : hex('#323c74'); R.pset(x, y, c); }
  for (let i = 0; i < 110; i++) { const x = Math.floor(H(i, 1, 24) * 320), y = Math.floor(H(i, 2, 24) * 70); if (fuera1(x, y)) continue; R.pset(x, y, H(i, 3, 24) < 0.25 ? hex('#fff4c8') : hex('#8a9ad0')); }
};
const ESTRELLAS1 = Array.from({ length: 26 }, (_, i) => [Math.floor(H(i, 5, 25) * 320), Math.floor(H(i, 6, 25) * 60)]).filter(([x, y]) => !fuera1(x, y));
// las nubes del techo: tres tonos, tres capas a tres velocidades
const NUB1 = [[0, 22, 40, 2.2, 0], [190, 30, 52, 2.2, 0], [90, 40, 46, 4.2, 1], [260, 46, 36, 4.2, 1], [40, 54, 58, 6.8, 2], [220, 60, 44, 6.8, 2]];
const TONOS1 = [[hex('#1e2450'), hex('#2a3264'), hex('#3a4478')], [hex('#262c5c'), hex('#363e74'), hex('#4c5690')], [hex('#2e3668'), hex('#444e88'), hex('#6470a8')]];
const nubes1 = (t) => { for (const [x0, y, w, vel, k] of NUB1) { const x = ((x0 + t * vel) % 420 + 420) % 420 - 60, [c0, c1, c2] = TONOS1[k];
  for (const [dy, dr, c] of [[0, 0, c0], [-1, -1, c1], [-2, -2.2, c2]]) for (let i = 0; i <= w; i += 5) { const r = 2.5 + 4.5 * Math.sin((i / w) * Math.PI) + dr; if (r < 1) continue; const cx = x + i - (dy ? 1 : 0), cy = y + dy - (r * 0.3);
    for (let yy = Math.floor(cy - r); yy <= cy + r * 0.6; yy++) for (let xx = Math.floor(cx - r); xx <= cx + r; xx++) if (xx >= 0 && xx < 320 && yy >= 0 && !fuera1(xx, yy) && Math.hypot(xx - cx, (yy - cy) * 1.3) <= r) R.pset(xx, yy, c); } } };
// la sala: pared larga, testero, suelo enlosado con la alfombra del pasillo, el estrado y las sillas de los profesores
const pintaSala1 = () => {
  const ventW = [52, 70, 88, 106], dentroV = (d, z, z0, z1, a) => { if (Math.abs(d) > 4.6) return 0; const top = z1 + a * Math.sqrt(1 - Math.abs(d) / 4.6); return z >= z0 && z <= top ? (Math.abs(d) > 3.7 || z < z0 + 1.2 || z > top - 1.1 ? 1 : 2) : 0; };
  const piedra = (x, y, a, z, ancho, sem) => { const fila = Math.floor(z / 4), ao = a + (fila & 1) * ancho / 2, j = z % 4 < 0.95 || ao % ancho < 0.45, q = H(Math.floor(ao / ancho), fila, sem), r = H(x, y, sem + 1);
    let c = j ? hex('#2e2c40') : q < 0.25 ? hex('#4e4c66') : q > 0.8 ? hex('#6a6884') : hex('#5c5a76'); if (!j && z % 4 > 3) c = hex('#74728e'); if (!j && r < 0.05) c = hex('#46445e'); if (j && r > 0.94) c = hex('#3a5a3a');
    const luz = Math.max(0, 0.3 - z / 120); if (luz > bay(x, y) * 0.6) c = mez(c, hex('#d8a060'), luz); return c; };
  const cornisa = (x, a, z) => z > 45 ? hex('#9a98b8') : z > 44 ? hex('#7a7898') : Math.floor(a * 1.4) % 3 === 0 ? hex('#3a3858') : hex('#5a5878');
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) {
    let c = 0; const uw = (x - X0) / AU, zw = Y0 + CU * uw - y, ve = (x - X0 - AU * UE) / BV, ze = Y0 + CU * UE + DV * ve - y, [uf, vf] = suelo1(x, y);
    if (uw <= UE && zw >= 0 && zw <= 46.5) {
      c = zw > 43 ? cornisa(x, uw, zw) : piedra(x, y, uw, zw, 7, 31);
      for (const uc of ventW) { const k = dentroV(uw - uc, zw, 11, 32, 9); if (k === 1) c = (x + y) % 5 ? hex('#8a88a4') : hex('#7a7894'); else if (k === 2) { const a = (x + y) % 6, b = (x - y + 600) % 6; c = Math.abs(uw - uc) < 0.3 ? hex('#4a4866') : a === 0 || b === 0 ? hex('#141a38') : zw > 30 && H(x, y, 33) < 0.3 ? hex('#4a5aa0') : hex('#24306a'); } }
      for (const uc of ventW) if (Math.abs(uw - uc) <= 5.6 && zw >= 9 && zw < 10.6) c = zw > 10 ? hex('#a8a6c0') : hex('#6a6884');   // el alféizar
    } else if (ve >= 0 && ze >= 0 && ze <= 46.5) {
      c = ze > 43 ? cornisa(x, ve, ze) : piedra(x, y, ve, ze, 7, 35);
      // la vidriera grande del testero, detrás de la mesa alta
      const k = dentroV((ve - 26) * 0.62, ze, 16, 34, 10); if (k === 1) c = (x + y) % 5 ? hex('#9a98b4') : hex('#7a7894');
      else if (k === 2) { const a = (x + 2 * y) % 7, b = (x - 2 * y + 700) % 7, cel = H(Math.floor((x + 2 * y) / 7), Math.floor((x - 2 * y + 700) / 7), 36); c = Math.abs(ve - 26) < 0.4 ? hex('#4a4866') : a === 0 || b === 0 ? hex('#141228') : cel < 0.3 ? hex('#2a4a9a') : cel < 0.5 ? hex('#c8962a') : cel < 0.65 ? hex('#8a2028') : cel < 0.8 ? hex('#2a6a4a') : hex('#3a5ab0'); }
    } else if (vf >= 0 && uf <= UE && uf > -20) {
      // las losas, con la sombra de las mesas y el reflejo cálido de las velas
      const tu = Math.floor(uf / 8), tv = Math.floor(vf / 6), j = ((uf % 8) + 8) % 8 < 0.45 || ((vf % 6) + 6) % 6 < 0.7, q = H(tu, tv, 37);
      c = j ? hex('#2a2834') : q < 0.3 ? hex('#4a4656') : q < 0.65 ? hex('#544f62') : hex('#5e5a6e'); if (!j && H(x, y, 38) < 0.05) c = hex('#6e6a80'); if (!j && H(x, y, 39) < 0.03) c = hex('#3e3a4a');
      if (!j && (H(tu, tv, 40) < 0.2) && bay(x, y) < 0.25) c = mez(c, hex('#d8a060'), 0.3);
      if (vf > 38.6 && vf < 41.4 && uf < UD && uf > -10) { const b = vf < 39.1 || vf > 40.9; c = b ? (Math.floor(uf * 1.5) % 2 ? hex('#c8a040') : hex('#a87a20')) : (Math.floor(uf * 0.9) % 5 === 0 ? hex('#b03030') : (x + y) % 9 === 0 ? hex('#6a1218') : hex('#8a1a20')); }
      for (const vc of MESAS1) if (Math.abs(vf - vc) < 3.6 && uf > 9 && uf < 107) c = mez(c, hex('#0c0a14'), 0.45);
    }
    // el estrado: la tarima de tablas y su frente de cuarterones
    const [ud, vd] = suelo1(x, y + ZD);
    if (ud >= UD && ud <= UE && vd >= 0 && (ve < 0 || ze < 0 || ze > 46.5 ? true : ze < ZD)) { const j = vd % 3 < 0.4 || ud < UD + 0.5; c = ud < UD + 0.5 ? hex('#c08a50') : j ? hex('#4a2e1a') : H(Math.floor(vd / 3), Math.floor(ud / 5), 41) < 0.5 ? hex('#6a4426') : hex('#7a5030'); }
    const vfr = (x - X0 - AU * UD) / BV, zfr = Y0 + CU * UD + DV * vfr - y;
    if (vfr >= 0 && zfr >= 0 && zfr <= ZD) { const pv = vfr % 8; c = zfr > ZD - 1 ? hex('#a87a20') : zfr < 0.9 ? hex('#24160c') : pv < 0.6 ? hex('#2a1a0e') : zfr > ZD - 2 || pv < 1.1 ? hex('#5a3a22') : hex('#4a2e1a'); if (pv > 3.6 && pv < 4.4 && zfr > 2.5 && zfr < 4.5) c = hex('#c89a4a'); }
    if (c) R.pset(x, y, c);

  // los peldaños del pasillo al estrado
  for (let s = 0; s < 2; s++) { const z = (s + 1) * ZD / 3, u0 = UD - 2 + s * 1; R.poligono([PJ(u0, 37, z), PJ(UD, 37, z), PJ(UD, 43, z), PJ(u0, 43, z)], hex('#8a5a34')); R.poligono([PJ(u0, 43, z), PJ(u0, 37, z), PJ(u0, 37, z - ZD / 3), PJ(u0, 43, z - ZD / 3)], hex('#4a2e1a')); R.linea(...PJ(u0, 37, z).map(Math.round), ...PJ(u0, 43, z).map(Math.round), hex('#c08a50')); }
  // las sillas de respaldo alto detrás de la mesa alta (el sillón dorado en medio)
  for (const v of [13, 20, 27, 34, 41, 48]) { const oro = v === 27, z1 = ZD + (oro ? 32 : 25), w = oro ? 3.2 : 2.5;
    R.poligono([PJ(123, v - w, ZD), PJ(123, v - w, z1), PJ(123, v, z1 + 4), PJ(123, v + w, z1), PJ(123, v + w, ZD)], oro ? hex('#a87a20') : hex('#3a2414'));
    R.poligono([PJ(123, v - w + 0.9, ZD + 8), PJ(123, v - w + 0.9, z1 - 1.5), PJ(123, v, z1 + 2), PJ(123, v + w - 0.9, z1 - 1.5), PJ(123, v + w - 0.9, ZD + 8)], oro ? hex('#8a1a20') : hex('#5a3a22'));
    const [tx, ty] = PJ(123, v, z1 + 4); R.pset(Math.round(tx), Math.round(ty), oro ? hex('#fff0a0') : hex('#8a5a34')); if (oro) { R.disco(tx, ty + 7, 1.6, hex('#f0c040')); R.pset(Math.round(tx), Math.round(ty) + 6, CREMA); } }
  // los soportes de las antorchas del testero
  for (const [x, y] of ANT1) { R.rect(x - 1, y, x + 1, y + 7, hex('#2a1c10')); R.rect(x - 2, y - 1, x + 2, y, hex('#4a3420')); }
};
// la mesa alta: mantel con pliegues y ribete de oro, el paño rojo con el escudo, platos, copas y dos candelabros
const pintaAlta1 = () => {
  const zt = ZD + 11;
  R.poligono([PJ(115, 9, zt), PJ(118, 9, zt), PJ(118, 61, zt), PJ(115, 61, zt)], (x, y) => H(x, y, 42) < 0.06 ? hex('#d8ccb0') : hex('#f0e6cc'));
  R.poligono([PJ(115, 9, zt), PJ(115, 61, zt), PJ(115, 61, ZD), PJ(115, 9, ZD)], (x, y) => { const v = (x - X0 - AU * 115) / BV, z = Y0 + CU * 115 + DV * v - y;
    if (z > zt - 1) return CREMA; if (z > zt - 2.6) return Math.floor(v * 2) % 2 ? ORO : OROS; if (z < ZD + 1.2) return (x % 2) ? ORO : hex('#c8b890');
    if (v > 25 && v < 33) return z > zt - 4 ? hex('#a82a2a') : Math.hypot(v - 29, (z - 11) * 0.5) < 1.6 ? ORO : hex('#8a1a20');
    return v % 3 < 0.7 ? hex('#c8bc9c') : v % 3 < 1.6 ? hex('#e8dcc0') : hex('#dcd0b0'); });

  for (let v = 11; v < 60; v += 4.5) { if (v > 24 && v < 34) continue; const [x, y] = PJ(116.5, v, zt).map(Math.round); R.rect(x - 2, y, x + 2, y, OROS); R.rect(x - 1, y, x + 1, y, ORO); const [gx, gy] = PJ(117.2, v + 2, zt).map(Math.round); R.rect(gx, gy - 3, gx + 1, gy - 1, ORO); R.pset(gx, gy, OROS); }
  for (const v of [37.5, 55]) { const [x, y] = PJ(116.5, v, zt).map(Math.round); R.rect(x, y - 7, x, y, OROS); R.rect(x - 3, y - 5, x + 3, y - 5, OROS); for (const d of [-3, 0, 3]) R.rect(x + d, y - 9, x + d, y - 6, CREMA); R.rect(x - 1, y, x + 1, y, ORO); }
};
// una mesa de las casas: la tabla con vetas, el canto, las patas, platos dorados, copas y el banco de delante
