//    «11» y en «behind-the-scenes» la cámara de cine (en el último marco, el Rondador MAYOR del episodio: pelo blanco,

import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('dd-gancho');

const en = (k, f) => T.momento(M, k, f);

const MOVES = 1.74, VOICE = 4.35, VANISH = 7.05, LIFTS = 9.83, WAKE = 12.85, TRAILER = 16.58, PIECES = 20.0, PUZZLE = 20.92, WORLD = 22.02, TOGETHER = 25.07, ELEVEN = 26.89, BEHIND = 29.09, RATING = 30.91, NUMBERS = 32.39;

// ── 2. El búnker: Banner graba y la luz verde lo traga ──

  const f = tramo(t, VANISH - 0.25, VANISH) * (1 - tramo(t, VANISH + 0.05, VANISH + 0.4));
  if (f > 0) for (let y = 24; y <= 160; y++) { const w = Math.round((3 + 13 * f) * (0.45 + 0.55 * (y - 24) / 136)); R.linea(147 - w, y, 147 + w, y, hex('#3ae88a')); R.linea(147 - Math.round(w / 2), y, 147 + Math.round(w / 2), y, hex('#d2ffe6')); }

// ── 3. GOLPE: INSERTO DE LA CÁMARA DE VÍDEO en su trípode (otra composición: el aparato de cerca, de lado, con la pantalla

// imagen se rasga, un destello y queda el símbolo humeante; la cámara tiembla con el rugido y los papeles suben ──

    const pn = x >> 6; if (hs(pn, 77) > 0.35 && y > 32 && y < 32 + 50 * hs(pn, 78) + 20 && Math.abs((x & 63) - 20 - 20 * hs(pn, 79)) < 6 + (y - 32) * 0.12) l -= 0.16;   // la humedad que baja
    const q = l + (b4(x, y) - 0.5) * 0.2, c = q < 0.38 ? W0 : q < 0.52 ? W1 : q < 0.66 ? W2 : W3;
    R.pset(x, y, (x & 63) === 0 || y === 70 ? JD : (x & 63) === 1 || y === 71 ? JL : c);
  }
  for (let k = 0; k < 40; k++) { const x = Math.floor(hs(k, 5) * 320), y = 34 + Math.floor(hs(k, 6) * 90); R.pset(x, y, JD); R.pset(x + 1, y, W0); }   // poros y desconchones
  // la tubería del techo (y 24–30) con sus abrazaderas y su sombra
  const TU = ['#2a2c30', '#4a4e56', '#7a808a', '#9aa0aa', '#6a707a', '#4a4e56', '#2a2c30'].map(hex);
  // (la tubería acaba en un codo que sube al techo en x 262–268: la esquina de Atom, x 278–318, queda de pared lisa de hormigón)
  for (let x = 0; x < 269; x++) { for (let j = 0; j < 7; j++) R.pset(x, 24 + j, TU[j]); if (b4(x, 31) < 0.5) R.pset(x, 31, JD); if (b4(x, 32) < 0.25) R.pset(x, 32, W0); }
  for (let y = 0; y < 31; y++) for (let j = 0; j < 7; j++) R.pset(262 + j, y, y > 23 && j + y > 30 ? TU[6] : TU[j]);
  R.rect(260, 8, 270, 11, hex('#1e2024')); R.linea(261, 9, 269, 9, hex('#5a5e66'));
  for (let x = 14; x < 260; x += 52) { R.rect(x, 22, x + 3, 32, hex('#1e2024')); R.rect(x + 1, 23, x + 1, 31, hex('#5a5e66')); R.pset(x + 1, 34, JD); }
  // el cuadro eléctrico de la izquierda, con su tubo que sube a la tubería y el triángulo de aviso
  R.rect(8, 38, 42, 64, hex('#1e2024')); R.rect(9, 39, 41, 63, hex('#6a7078')); R.rect(9, 39, 41, 40, hex('#9aa0a8')); R.rect(40, 41, 41, 63, hex('#4a4e56'));
  R.linea(25, 40, 25, 62, hex('#4a4e56')); R.rect(37, 49, 38, 53, hex('#2a2c30'));
  R.poligono([[17, 44], [22, 54], [12, 54]], hex('#e8c43a')); R.linea(17, 44, 12, 54, hex('#8a6a1a')); R.pset(17, 48, K); R.pset(17, 49, K); R.pset(17, 51, K);
  R.rect(30, 32, 32, 38, hex('#3a3e44')); R.pset(31, 33, hex('#7a808a'));
  for (let k = 0; k < 4; k++) R.rect(28 + k * 3, 57, 29 + k * 3, 61, hex('#2a2c30'));
  // el fluorescente (x 186–262, y 36–41): la carcasa; el tubo lo enciende la vida
  R.rect(184, 35, 264, 42, hex('#2a2c30')); R.rect(185, 36, 263, 37, hex('#6a707a')); R.linea(196, 33, 196, 35, hex('#3a3e44')); R.linea(252, 33, 252, 35, hex('#3a3e44'));
  // la franja amarilla y negra al pie de la pared

  // el suelo de losas en perspectiva, con grietas y manchas
  for (let y = 132; y < 180; y++) for (let x = 0; x < 320; x++) {

  R.rect(233, 105, 236, 149, hex('#5a4a26')); R.rect(300, 105, 303, 149, hex('#5a4a26'));

  R.rect(10, 166, 38, 168, hex('#1c1d19'));

  R.usar(prev); return b;
};
// la pantalla abatible: lo que graba la cámara (el búnker en pequeño, Hulk, el desgarro, el destello, el símbolo)

    if (lx >= 258 && lx <= 276 && ly >= 72 && ly <= 92) c = lx === 258 || lx === 276 || ly === 72 || ly === 92 ? hex('#1c1d1f') : Math.abs(ly - (84 - Math.round(Math.sin((lx + t * 30) * 0.5) * 4))) < 1 ? VD : hex('#0e1a12');   // el monitor
    const d = Math.hypot(x - cx, (y - cy) * 1.25) / 34; if (d < 1) { const f = (1 - d) * glow; if (b4(x, y) < f * 1.6) c = mez(c, f > 0.55 ? VDL : VD, Math.min(0.85, f * 1.1)); }
