<script type="module">
// HP-RATA (frase 25), sin cartela, 1997 en la barra. Cuatro planos:
// 1. El compartimento del expreso: Ron, sentado, saca a Scabbers dormida de su regazo y se la enseña a Harry («Ron's rat
//    Scabbers»); con «hand-me-down from Percy» se encoge de hombros y la vuelve a dejar; entra el carrito de las golosinas.
//    La señora del carrito lo empuja por el pasillo, se para y le da a Harry una caja de ranas de chocolate a cambio de una
//    moneda. Corta en «old».
// 2. Inserto en picado de la mesita (gag 6), sin la ventana centrada: Scabbers, grande, duerme hecha una bola (vieja, con
//    calvas) entre las golosinas (ranas de chocolate, una que se escapa a saltos, grageas, calderos, empanadillas, zumo que
//    tiembla); por la ventana del fondo corren el campo y los postes, cuya sombra barre la mesa; el brazo de Ron entra por
//    la derecha, se lleva el bocadillo y lo devuelve mordido; la snitch llega con la lupa y le repasa el pelo; en «find out
//    why» la rata abre un ojo (enorme en la lupa), la snitch se asusta y huye, y la rata lo vuelve a cerrar. Debajo de la
//    mesa, la alfombra con el baúl de Harry y la bolsa de golosinas volcada. Corta en «And».
// 3. La chimenea de la sala común: Neville lee en la butaca la carta de su abuela con el sapo en el regazo; el sapo salta a
//    la alfombra, Neville se levanta (la carta cae), lo persigue y lo coge, sonriendo; Hermione pasa página en la otra butaca;
//    el gato de la alfombra sigue al sapo con la mirada y da un respingo (maúlla) cuando cae a su lado. El sapo se pinta una
//    sola vez (en vuelo, antes del decorado de delante; en la alfombra, después). Corta en «the answer».
// 4. El escaparate de la tienda de túnicas: Neville, con su sapo, pasea de la mano de su abuela (el sombrero con el buitre,
//    insinuado, y otro igual expuesto en el escaparate); un mago con un paquete pasa por delante y una lechuza cruza con
//    otro; se paran, ella le pone la mano en el hombro, la costurera abre la puerta (la puerta y la campanilla) y les hace
//    pasar.
import * as T from '/atomo/plato/escenas/hp-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hp-rata');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const mix = (c, d, a) => { const ch = (s) => Math.round(((c >>> s) & 255) * (1 - a) + ((d >>> s) & 255) * a); return ((255 << 24) | (ch(16) << 16) | (ch(8) << 8) | ch(0)) >>> 0; };
// un halo de luz tramado alrededor de (x, y): aclara hacia col en la proporción a, que cae hacia el borde
const halo = (x, y, r, col, a) => { for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) { const d = Math.hypot(i, j); if (d > r) continue; const X = Math.round(x + i), Y = Math.round(y + j); if (X < 0 || X > 319 || Y < 0 || Y > 179) continue; R.pset(X, Y, mix(R.pget(X, Y), col, a * (1 - d / r))); } };

const K = hex('#14111a');
const PIEZAS_HP = T.PIEZAS_HP;

const a = (f) => en('rata', f);
const P2 = a(0.23), P3 = a(0.463), P4 = a(0.755);

// la caja pentagonal de la rana de chocolate (morada con la rana dorada), centro de abajo en (x, y)
const cajaRana = (x, y) => { R.rect(x - 4, y - 6, x + 4, y, K); R.rect(x - 3, y - 5, x + 3, y - 1, hex('#7a3aa8')); R.rect(x - 3, y - 5, x + 3, y - 5, hex('#a86ad0')); R.pset(x, y - 3, hex('#e8c040')); R.pset(x - 1, y - 2, hex('#e8c040')); R.pset(x + 1, y - 2, hex('#e8c040')); R.pset(x + 3, y - 2, hex('#4a2070')); };
const p1 = (t) => {
  const cu = tramo(t, 0.3, 2.6), g = T.hogwarts(R, t, { encuadre: 'tren', carrito: cu });
  // la señora del carrito: lo empuja desde detrás y, parada, le ofrece a Harry una caja de ranas de chocolate
  const cx = Math.round(lerp(345, 200, Math.min(1, Math.max(0, cu)))), ofrece = t > 2.8 && t < 3.7, sx = cx + 26;
  const sen = R.actor(EL.costurera, sx, 176, t, { dir: ofrece ? 1 : -1, anda: cu > 0 && cu < 1, sostiene: ofrece ? [sx + 14, 146] : cu < 1 ? [cx + 18, 156] : false, sonrisa: cu >= 1, habla: ofrece && Math.sin(t * 9) > 0, pal: { C: '#6a3a6a', c: '#4a2a4a' } });
  if (ofrece) cajaRana(sen.mano[0], sen.mano[1] + 4);
  const compra = 3.7;
  const rx = 46, sube = t > enseña && t < baja;
  const ron = R.actor(EL.ron, rx, 140, t, { dir: 1, sostiene: sube ? [rx + 22, 112] : [rx + 16, 126], sonrisa: sube, habla: t > enseña + 0.3 && t < baja && Math.sin(t * 10) > 0, triste: t > baja && t < baja + 0.8 });
  const [mx, my] = ron.mano, resp = Math.sin(t * 3) > 0 ? 1 : 0;
  PIEZAS_HP.rata(R, mx + 2, my + 4 - resp, {});
  const hp = R.actor(EL.harry, 258, 140, t, { dir: -1, sonrisa: t > enseña + 0.4, sorpresa: t > enseña && t < enseña + 0.4, dedo: t > enseña + 0.5 && t < enseña + 1.2, sostiene: t > 2.9 ? [244, 124] : false });

  if (t > compra - 0.05 && t < compra + 0.15) brilla(hp.mano[0] - 3, hp.mano[1] - 3, 1, hex('#fff0a0'));
  T.hogwartsDelante(R, t, { encuadre: 'tren', carrito: tramo(t, 0.3, 2.6) });
};
// el plano 2: inserto en picado de la mesita del compartimento, con la rata grande hecha una bola entre las golosinas
const entra = a(0.25), ojo = a(0.396), huye = a(0.43);
const hh = (x, y, k) => { let n = (x * 374761393 + y * 668265263 + k * 1442695041) | 0; n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };

let B2 = null;

  rect(20, 46, 258, 46, hex('#c8a040')); rect(20, 47, 258, 47, hex('#8a6a20')); for (const x of [30, 139, 248]) { rect(x - 1, 45, x + 1, 47, hex('#e8c860')); pset(x, 45, hex('#fff0b0')); }
  rect(136, 12, 142, 15, K); rect(137, 13, 141, 14, hex('#e8c060'));
  // las cortinas verdes recogidas, con sus pliegues y el alzapaños dorado
  const cortina = (x0, x1, lado) => { for (let y = 8; y < 58; y++) { const ancho = x1 - x0 - (y > 30 && y < 40 ? 3 : 0); for (let x = x0; x <= x0 + ancho; x++) { const u = (x - x0) / ancho, f = Math.sin(u * Math.PI * 4 + y * 0.03 * lado); pset(x, y, x === x0 || x === x0 + ancho ? K : f > 0.55 ? hex('#3e8a54') : f > -0.3 ? hex('#2a6a3c') : hex('#1a4a2a')); } }
    rect(x0, 33, x1 - 2, 36, K); rect(x0 + 1, 34, x1 - 3, 35, hex('#e8b830')); pset(x0 + 3, 34, hex('#fff0b0')); for (let x = x0 + 1; x < x1 - 1; x += 2) pset(x, 57, hex('#c8a040')); };
  cortina(4, 26, 1); cortina(252, 274, -1);
  // los asientos de terciopelo rojo a los lados de la mesa, capitoné con botones
  for (let y = 56; y < 146; y++) for (let x = 0; x < 320; x++) { if (x >= tabI(Math.min(y, 138)) - 1 && x <= tabD(Math.min(y, 138)) + 1) continue; const d = ((x + y) % 12 === 0 || (x - y + 600) % 12 === 0); pset(x, y, d ? hex('#5a0e16') : mix(hex('#8a1a24'), hex('#a82a32'), hh(x, y, 3) * 0.5 + (Math.sin(x * 0.5) > 0.7 ? 0.3 : 0))); if ((x + y) % 12 === 0 && (x - y + 600) % 12 === 0) { pset(x, y, hex('#c8a040')); } }
  // el tablero: cinco tablas que se abren hacia la cámara, vetas, nudos y la mancha de sol que entra por la ventana
  const TA = hex('#6a3420'), TB = hex('#8e4c2a'), TL = hex('#b8703e'), VE = hex('#552814');
  for (let y = 56; y <= 138; y++) { const xi = Math.ceil(tabI(y)), xd = Math.floor(tabD(y)), w = xd - xi;
    for (let x = xi; x <= xd; x++) { const u = (x - xi) / w * 5, tabla = Math.floor(u), fr = u - tabla;
      let c = mix(TA, TB, 0.55 + 0.25 * Math.sin(fr * 40 + Math.sin(y * 0.09 + tabla * 2) * 2.2 + tabla) + (hh(x, y, 4) - 0.5) * 0.18);
      if (Math.sin(fr * 61 + Math.sin(y * 0.06 + tabla) * 3) > 0.93) c = VE;
      const kn = Math.hypot((fr - 0.5) * 30, (y - 70 - tabla * 13) * 0.8); if (tabla % 2 && kn < 3) c = kn < 1.4 ? hex('#3a1a0c') : VE;
      // el sol de la ventana: una franja ancha inclinada que se apaga hacia delante
      const sx = x - (y - 56) * 0.9; if (sx > 52 && sx < 236) c = mix(c, TL, 0.42 * (1 - (y - 56) / 95) * Math.min(1, (sx - 52) / 10, (236 - sx) / 10));
      if (fr < 0.012 * 5 / w * 40 || x === xi) c = hex('#3a1a0c');
      pset(x, y, c); }
    pset(xi - 1, y, K); pset(xd + 1, y, K); }
  rect(24, 56, 296, 56, hex('#2a1008')); rect(24, 57, 296, 57, hex('#4a2010'));
  // el canto de delante, con su filo de luz y el listón de latón
  rect(2, 139, 318, 146, K); rect(3, 139, 317, 139, hex('#c88050')); for (let x = 3; x <= 317; x++) for (let y = 140; y <= 144; y++) pset(x, y, mix(hex('#5a2818'), hex('#7a3a20'), 0.5 + 0.4 * Math.sin(x * 0.13 + y * 0.6 + Math.sin(x * 0.02) * 3) + (hh(x, y, 5) - 0.5) * 0.2));
  rect(3, 145, 317, 145, hex('#a8802a'));
  // la alfombra del compartimento (rombos dorados) con la sombra de la mesa
  for (let y = 147; y < 180; y++) for (let x = 0; x < 320; x++) { const r = ((x + y * 2) % 18 === 0 || (x - y * 2 + 720) % 18 === 0); let c = r ? hex('#8a6a30') : mix(hex('#6a161c'), hex('#82222a'), hh(x, y, 6) * 0.6 + (((x >> 1) + y) % 3 === 0 ? 0.25 : 0)); c = mix(c, K, Math.max(0, 0.6 * (1 - (y - 147) / 13))); pset(x, y, c); }
  rect(0, 146, 319, 146, K);
  // el baúl de Harry en el suelo, a la izquierda: tapa de cuero con correas, esquinas de latón y una pluma blanca de Hedwig
  rect(10, 155, 92, 183, hex('#3a0c10')); rect(6, 151, 88, 182, K);
  for (let y = 152; y < 180; y++) for (let x = 7; x < 88; x++) pset(x, y, mix(hex('#5a3418'), hex('#7a4a24'), 0.5 + 0.3 * Math.sin(x * 0.4 + y * 0.9) * hh(x, y, 7) + (y < 155 ? 0.35 : 0)));
  for (const cx of [26, 66]) { rect(cx - 2, 152, cx + 2, 179, K); rect(cx - 1, 152, cx + 1, 179, hex('#3a2010')); rect(cx - 3, 162, cx + 3, 167, hex('#c8a040')); rect(cx - 2, 163, cx + 2, 166, K); rect(cx - 1, 164, cx + 1, 165, hex('#e8c860')); }
  for (const [x, y, dx] of [[7, 152, 1], [87, 152, -1]]) for (let k = 0; k < 6; k++) rect(Math.min(x, x + dx * (5 - k)), y + k, Math.max(x, x + dx * (5 - k)), y + k, hex('#c8a040'));
  rect(40, 158, 54, 168, K); rect(41, 159, 53, 167, hex('#e8dcc0')); rect(42, 161, 51, 161, hex('#b8a888')); rect(42, 164, 48, 164, hex('#b8a888'));
  linea(72, 172, 82, 168, hex('#f2eee2')); linea(72, 173, 81, 170, hex('#c8c0b0')); pset(71, 173, hex('#8a8a96'));
  // la bolsa de papel de las golosinas, volcada en el suelo a la derecha, con lo que se ha salido
  poligono([[232, 156], [262, 152], [268, 172], [238, 177]], K); poligono([[233, 157], [261, 153], [266, 171], [239, 175]], hex('#c09060'));
  for (let k = 0; k < 4; k++) linea(238 + k * 7, 158 - k, 243 + k * 7, 174 - k, hex('#a07448')); linea(233, 157, 261, 153, hex('#e0b888'));
  rect(222, 160, 230, 168, K); rect(223, 161, 229, 167, hex('#7a3aa8')); pset(226, 164, hex('#e8c040'));
  for (let k = 0; k < 14; k++) { const x = 200 + Math.round(hh(k, 1, 8) * 30), y = 160 + Math.round(hh(k, 2, 8) * 16); rect(x, y, x + 1, y, [hex('#e84a4a'), hex('#f0d040'), hex('#5ac05a'), hex('#f0f0e0'), hex('#a060d0')][k % 5]); }
  linea(272, 170, 292, 160, K); linea(272, 171, 292, 161, K); linea(273, 169, 291, 160, hex('#3a3040')); pset(282, 164, hex('#7a7090')); linea(274, 173, 293, 164, mix(hex('#6a161c'), K, 0.5));
};
// la rata hecha una bola, vista desde arriba: centro (x, y); resp sube el lomo al respirar; abre: el ojo abierto; alza:
// levanta la cabeza; t para los bigotes y la punta de la cola
const rataBola = (x, y, t, resp, abre, alza) => {
  const { pset, disco, linea } = R;
  // la sombra: una elipse baja de 2 px pegada al tablero, justo bajo la panza
  for (let i = -24; i <= 28; i++) for (let j = 0; j < 2; j++) { const X = x + i, Y = y + 16 + j; if (Math.abs(i - 2) / 26 + j * 0.25 < 1) pset(X, Y, mix(R.pget(X, Y), K, 0.4)); }
  // la cola rosa, que rodea la bola por delante, con sus anillos (la punta se mueve)
  const cola = (u) => { const a = Math.PI * (1.1 - u * 0.95); return [x - 2 + Math.cos(a) * 22, y + 6 + Math.sin(a) * 11 + u * 2]; };
  for (let k = 0; k <= 40; k++) { const u = k / 40; let [cx, cy] = cola(u); if (u > 0.85) cy += Math.sin(t * 3) * (u - 0.85) * 12; const r = u < 0.6 ? 1 : 0; disco(Math.round(cx), Math.round(cy), r + 1, K); }
  for (let k = 0; k <= 40; k++) { const u = k / 40; let [cx, cy] = cola(u); if (u > 0.85) cy += Math.sin(t * 3) * (u - 0.85) * 12; const c = k % 4 === 0 ? hex('#b06a74') : hex('#e0a0a8'); if (u < 0.6) disco(Math.round(cx), Math.round(cy), 1, c); else pset(Math.round(cx), Math.round(cy), c); }
  // el cuerpo: pelo gris pardo, luz desde la ventana (arriba), mechones y dos calvas de rata vieja
  const ry = 15 + resp, F0 = hex('#3e342e'), F1 = hex('#5e5046'), F2 = hex('#7e6e60'), F3 = hex('#9e8e7c'), F4 = hex('#bcae98');
  for (let j = -ry - 1; j <= ry + 1; j++) for (let i = -21; i <= 21; i++) { const d = (i / 20) ** 2 + (j / ry) ** 2; if (d > 1.09) continue; const X = x + i, Y = y + j;
    if (d > 0.93) { pset(X, Y, K); continue; }
    let s = 0.55 - 0.5 * (j / ry) - 0.15 * (i / 20) - 0.25 * d + (hh(X >> 1, Y, 9) - 0.5) * 0.25;
    if (((i * 2 + j * 3 + 400) % 7 === 0) && hh(X, Y, 10) < 0.6) s -= 0.25;   // los mechones
    let c = s > 0.8 ? F4 : s > 0.5 ? F3 : s > 0.2 ? F2 : s > -0.1 ? F1 : F0;
    if (Math.hypot(i + 8, j + 3) < 2.6 || Math.hypot(i - 4, j - 6) < 2) c = hex('#a8908a');   // calvas
    pset(X, Y, c); }
  // la raya del lomo que marca la curva de la bola
  for (let k = 0; k <= 24; k++) { const u = k / 24, a = Math.PI * (1.05 + u * 0.75); pset(Math.round(x - 2 + Math.cos(a) * 13), Math.round(y + 2 + Math.sin(a) * 10 - resp * 0.5), F1); }
  // la cabeza, metida a la derecha, con el hocico hacia delante
  const hx = x + 12, hy = y + 7 - alza;
  for (let j = -8; j <= 8; j++) for (let i = -10; i <= 12; i++) { const ii = i < 0 ? i / 9 : i / 10, d = ii * ii + (j / 7) ** 2 - (i > 4 ? (i - 4) * 0.02 * j : 0); if (d > 1.08) continue; const X = hx + i, Y = hy + j;
    if (d > 0.9) { pset(X, Y, K); continue; } const s = 0.6 - 0.5 * (j / 7) + (hh(X, Y, 11) - 0.5) * 0.2; pset(X, Y, s > 0.75 ? F4 : s > 0.45 ? F3 : s > 0.15 ? F2 : F1); }
  // la oreja (rosa por dentro), que da un tirón de vez en cuando
  const tir = abre || Math.sin(t * 1.7) > 0.97 ? 1 : 0, ox = hx - 3 - tir, oy = hy - 7 - tir;
  disco(ox, oy, 4, K); disco(ox, oy, 3, F2); disco(ox + 1, oy + 1, 2, hex('#d88a92')); pset(ox - 1, oy - 2, F4);
  // el hocico: la nariz rosa con su brillo, los bigotes que tiemblan y la patita delantera, a la que le falta un dedo
  const nx = hx + 11, ny = hy + 3;
  disco(nx, ny, 2, K); disco(nx, ny, 1, hex('#e89aa0')); pset(nx, ny - 1, hex('#ffd0d8'));
  const bg = Math.round(Math.sin(t * 7) * 1);

  for (const [dx, dy] of [[-2, -4], [-3, 2]]) linea(nx - 3, ny + 1, nx - 3 + dx - 6, ny + dy + 1, hex('#a89888'));
  const px = hx + 4, py = hy + 8; pset(px, py, hex('#e0a0a8')); pset(px + 1, py, hex('#e0a0a8')); pset(px - 1, py + 1, hex('#d08890')); pset(px + 1, py + 1, hex('#d08890')); pset(px, py + 1, K);
  // el ojo: una raya cerrada o abierto de golpe (negro con su brillo)
  const ex = hx + 4, ey = hy - 2;
  if (!abre) { linea(ex - 2, ey, ex + 2, ey, K); pset(ex - 3, ey - 1, F1); pset(ex + 3, ey - 1, F1); }
  else { disco(ex, ey, 2, K); pset(ex - 1, ey - 1, hex('#ffffff')); pset(ex + 1, ey, hex('#6a2a2a')); }
  return [ex, ey];

// el bocadillo de Ron (pan, carne y lechuga), visto desde arriba; mordido le quita un mordisco de la esquina
