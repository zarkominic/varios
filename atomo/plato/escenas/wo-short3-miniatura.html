<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ep37 · miniatura del Short 3</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// WO-SHORT3-MINIATURA · ep37, vertical: todo lo que cuenta en la columna central (x 110–210), que es lo que queda en 9:16.
// La segunda oreja: las dos bocinas de la gran oreja, de noche; Ehman al doble, sorprendido, entre ellas.
import { crearRoma } from '/atomo/plato/kits/pixel-roma.js';
import { conChibi, ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
import * as T from '/atomo/plato/escenas/wo-comun.js';
import { figura, grado, halo, cifra } from '/atomo/plato/escenas/mini-chibi.js';
const R = conChibi(await crearRoma(document.getElementById('lienzo')));
const dibujar = (t) => {
  const o = { encuadre: 'caseta', camara: 'bocinas', luz: 'noche' };
  T.oreja(R, t, o); T.orejaDelante(R, t, o);
  grado(R, { tinte: '#0a1838', f: 0.2, desde: 0.6, max: 0.6 });
  halo(R, 160, 130, 46, 50, '#9ac8ff', 0.28);
  figura(R, EL.ehmanWO, 160, 178, t, { dir: 1, sorpresa: true }, 2);
  cifra(R, '1977', 132, 16, 14);
};
window.__frame = async (t) => { dibujar(t); R.presentar(); };
window.__listo = true;
</script>
</body>
</html>
