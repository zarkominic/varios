<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ep40 · short 2 · miniatura</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// AK-SHORT2-MINIATURA · ep40, vertical: lo que cuenta en la columna central (x 110–210). Con chibis, sin palabras.
import { crearRoma } from '/atomo/plato/kits/pixel-roma.js';
import { conChibi, ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
import { fondo, fondoDelante } from '/atomo/plato/escenas/ak-comun.js';
import { figura, grado, halo, cifra, desplazar } from '/atomo/plato/escenas/mini-chibi.js';
const R = conChibi(await crearRoma(document.getElementById('lienzo')));
const dibujar = (t) => {
  const o = { encuadre: 'naufragio', siluetas: 0.55, pulpo: false };
  fondo(R, t, o); fondoDelante(R, t, o); desplazar(R, -40);
  grado(R, { cx: 170, cy: 120, tinte: '#040c18', f: 0.25, desde: 0.4, max: 0.75 });
  halo(R, 186, 128, 34, 40, '#9ad0f0', 0.3);
  figura(R, EL.stadiatisAK, 132, 176, t, { dir: 1, sorpresa: true }, 2);
  cifra(R, '1900', 160, 18, 14);
};
window.__frame = async (t) => { dibujar(t); R.presentar(); };
window.__listo = true;
</script>
</body>
</html>
