<script type="module">
// GZ-MUONES (frase 12). Qué son los muones y cómo hacen una radiografía con el cielo. Cuatro planos, en estilo real:
// 1. la atmósfera desde muy alto (la Tierra curva con el Nilo, el delta y el mar): unos muones diminutos caen (un anillo
//    señala uno en «tiny»); en «cosmic rays» baja un rayo cósmico y en «hit the air» choca y nace la cascada de muones;
// 2. (en «they») un corte de paisaje: cielo con nubes de tres tonos a tres velocidades, golondrinas y un halcón; la bruma
//    del horizonte con la meseta y sus tres pirámides lejos; una casa abierta con su gato y un gran sillar; delante, una
//    cerca de palos, matas que se mecen, guijarros, ondas y dos cántaros; la lluvia ámbar lo atraviesa todo (un turista
//    pasa sin enterarse, dejando huellas); en «stone» un muon cruza el sillar brillando; en «Stone stops some» siete muones
//    se paran dentro del sillar con un chispazo y se quedan latiendo como brasas; luego uno atraviesa al gato, que se
//    vuelve a mirar («?»);  3. (en «So») un corte de pirámide: hiladas y sillares de tamaños distintos, perfil escalonado
//    con la piel de caliza clara cortada, la Gran Galería y el pasillo de bajada tenues; detrás, nubes en parallax, la
//    meseta y las otras dos pirámides; al pie, cascotes y guijarros; el japonés deja el detector en la cámara; los muones
//    que vienen por el hueco llegan muchos más que los que vienen por la roca (los dos conos y sus cuentas); él señala el
//    hueco; fuera, un camellero pasa con su camello y deja huellas;  4. (en «It's») la mesa de luz del laboratorio
//    (cartel de pictogramas, contador de muones que no para, ventilador que gira; abajo, armarios con pegatina de
//    pictograma, cajones, rejilla, golpes y óxido, y delante el taburete, la caja de placas, la bata colgada y la regleta):
//    una mano desliza la placa de emulsión; por detrás del banco llega la investigadora (asoma de cintura para arriba);
//    en «X-ray» se enciende la mesa, aparece la mancha clara y ella se sorprende; en «sky» la señala sonriendo; por la
//    ventana, el cielo de Giza.
import * as T from '/atomo/plato/escenas/gz-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('gz-muones');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const C = T.C, { pset, rect, linea, disco, poligono } = R;
const h = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };

// la zona de Atom y la barra del año se quedan tranquilas: lo que se mueve no entra ahí
const libre = (x, y) => !((x >= 274 && y <= 47) || (x >= 16 && x <= 174 && y <= 16));
const ps = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (libre(x, y)) pset(x, y, c); };
const fijo = new Map();
const capa = (k, f) => { if (!fijo.has(k)) { const b = R.nuevo(), prev = R.usar(b); f(); R.usar(prev); fijo.set(k, b); } return fijo.get(k); };

// una nube de tres bultos, en tres tonos (P: sombra, medio, luz), con el fondo plano

  const a = Math.round(w * 0.34);

// ¿este píxel es todavía el cielo del búfer b? (las nubes pasan por detrás de lo que hay delante)
const esCielo = (b, bc) => (x, y) => x >= 0 && x < 320 && y >= 0 && y < 180 && b[y * 320 + x] === bc[y * 320 + x];
// la pirámide de piedra: hiladas de 3 px con su canto de luz y su junta, sillares escalonados, desconchones; la cara de
// la izquierda al sol y la de la derecha en sombra (arista en ar), la cima plana con el mástil (Keops)

// la lluvia de muones: rayitas que caen casi en vertical, cabeza clara, dos píxeles ámbar y cola tramada;
// o.borde: un filo oscuro a la izquierda (para que se lean sobre piedra o arena clara)
const MU = { l: hex('#fff6c8'), m: C.muon, s: hex('#c88a20'), k: hex('#3a2208') };
const muon = (x, y, n = 7, dx = 0.18, borde = false) => {
  for (let i = n - 1; i >= 0; i--) { const xx = Math.round(x - dx * i), yy = Math.round(y - i);

};
const lluvia = (t, n, [x0, y0, x1, y1], o = {}) => {
  const alto = y1 - y0 + 24, dx = o.dx ?? 0.18;
  for (let k = 0; k < n; k++) {
    const v = (o.v ?? 150) * (0.75 + h(k, 1, 4) * 0.5), y = y0 - 8 + ((t * v + h(k, 2, 4) * 900) % alto), x = x0 + h(k, 3, 4) * (x1 - x0) + dx * (y - y0);

// un camello (22 px de alto): joroba con su manta, cuello curvo, cabeza que cabecea, patas que se cruzan al andar y la
// cola que se mueve; x = centro del cuerpo, dir = hacia dónde mira. Devuelve dónde va el ronzal (la cabeza).
const CAM = { k: hex('#2a1a10'), a: hex('#c8995a'), s: hex('#9a7040'), l: hex('#e4c088'), m1: hex('#b83a2a'), m2: hex('#2a5a9a'), m3: hex('#e8c040') };

  const P = CAM; x = Math.round(x); const X = (i) => x + i * dir, ph = t * 5 + k, p = anda ? Math.sin(ph) : 0, cab = anda ? Math.round(Math.sin(ph * 2)) : Math.round(Math.sin(t * 1.3 + k) * 0.8);
  for (const [i0, f, c] of [[-6, -p, P.s], [5, p, P.s], [-4, p, P.a], [7, -p, P.a]]) { const pie = Math.round(f * 2); linea(X(i0), suelo - 10, X(i0 + pie), suelo - 1, P.k); linea(X(i0) + dir, suelo - 10, X(i0 + pie) + dir, suelo - 1, c); rect(Math.min(X(i0 + pie), X(i0 + pie + 1)), suelo - 1, Math.max(X(i0 + pie), X(i0 + pie + 1)) + 1, suelo, P.k); }
  elipse(x, suelo - 13, 10, 4, P.k); elipse(X(-1), suelo - 17, 6, 4, P.k);
  elipse(x, suelo - 13, 9, 3, P.a); elipse(X(-1), suelo - 17, 5, 3, P.a);
  rect(x - 7, suelo - 11, x + 7, suelo - 11, P.s); rect(X(-3) - 1, suelo - 20, X(-3) + 2, suelo - 20, P.l);
  for (let i = -4; i <= 3; i++) { pset(X(i - 1), suelo - 16, [P.m1, P.m3, P.m2][(i + 8) % 3]); pset(X(i - 1), suelo - 15, P.m1); if (i % 2 === 0) pset(X(i - 1), suelo - 14, P.m3); }
  for (let j = 0; j < 9; j++) { const nx = X(9 + Math.round(j * 0.5)), ny = suelo - 13 - j + (j > 5 ? cab : 0); rect(Math.min(nx, nx + dir * 2), ny, Math.max(nx, nx + dir * 2), ny, j < 2 ? P.s : P.a); pset(nx - dir, ny, P.k); }

  rect(Math.min(hx - dir, X(18)), hy - 1, Math.max(hx - dir, X(18)), hy + 2, P.k); rect(Math.min(hx, X(17)), hy, Math.max(hx, X(17)), hy + 1, P.a); pset(X(15), hy, P.k); pset(X(17), hy + 1, P.s); pset(X(13), hy - 2, P.s);
  const cl = Math.round(Math.sin(t * 3 + k) * 1.5); linea(X(-10), suelo - 14, X(-11) + cl * dir, suelo - 8, P.k); pset(X(-11) + cl * dir, suelo - 7, P.s);

};
// una caja de madera con flejes (lo que se lleva en la mano: x centro, y base)

const w = (s) => en('muones', (s - 0.5) / 18.646);
const P2 = w(5.40), P3 = w(10.39), P4 = w(17.23);
const tiny = w(1.82), rayo = w(3.40), choca = w(4.28), piedra = w(7.46), frena = w(8.83), pone = w(10.87), mas = w(13.05), hueco = w(14.19), roca = w(15.91), rx = w(18.03), sky = w(18.65);
// ── plano 1: la atmósfera desde muy alto ──
const ESP = H('#010208 #02050f #050a1c #0a142e #10204a'), ATM = H('#16306a #2456a0 #3a86cc #6abce8 #b8ecff');
const DES = H('#8a6a40 #a8844e #c09a5e #d4b06e #e2c488'), MAR = H('#163a6e #1e4a86 #2a5e9c'), VER = H('#2a5a2a #3a7234 #5a8a3a');
const TC = [160, 640], TR = 556;
const fondoAlto = () => capa('alto', () => {
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) {
    const d = Math.hypot(x - TC[0], y - TC[1]);
    if (d > TR + 12) { pset(x, y, tono(ESP, 4.2 - (d - TR) / 30 + (h(x >> 3, y >> 3, 1) - 0.5) * 0.3, x, y)); continue; }
    if (d > TR) { pset(x, y, tono(ATM, (TR + 12 - d) / 12 * 4.2, x, y)); continue; }

  }

  for (let k = 0; k < 14; k++) { const cx = Math.round(10 + h(k, 1, 77) * 300), cy = Math.round(104 + h(k, 2, 77) * 70), rx = 8 + h(k, 3, 77) * 18, ry = 1.5 + h(k, 4, 77) * 2.5, sl = (h(k, 5, 77) - 0.5) * 0.4;

      if (dd < 1 && Math.hypot(x - TC[0], y - TC[1]) < TR - 2) pset(x, y, som ? mix(R.pget(x, y), C.k, 0.22) : dd < 0.55 ? C.blanco : (x + y) & 1 ? hex('#dfe8f0') : mix(R.pget(x, y), C.blanco, 0.5)); } }

});
const HIT = [176, 76];
const p1 = (t) => {

    if (k === 2) { const a = tramo(t, tiny - 0.2, tiny + 0.2) * (1 - tramo(t, tiny + 1.4, tiny + 1.8)); if (a > 0) { const r = Math.round(4 + a * 5); R.anillo(Math.round(x), Math.round(y) - 2, r, hex('#fff0c0'), 0); R.anillo(Math.round(x), Math.round(y) - 2, r + 1, hex('#c88a20'), 2); } } }

// ── plano 2: la nube, la casa y el sillar ──
const CM = H('#2a4a8a #34589a #3e66a8 #4c76b6 #5c88c2 #7aa0d0');
