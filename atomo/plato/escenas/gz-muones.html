// GZ-MUONES (frase 12). Qué son los muones y cómo hacen una radiografía con el cielo. Cuatro planos, en estilo real:
// 1. la atmósfera desde muy alto (la Tierra curva con el Nilo, el delta y el mar): unos muones diminutos caen (un anillo

//    atraviesa todo (un turista pasa sin enterarse); en «stone» un muon cruza el sillar brillando; en «Stone stops some»

//    pictogramas en la pared): una mano desliza la placa de emulsión; por detrás del banco llega la investigadora; en
//    «X-ray» se enciende la mesa, aparece la mancha clara y ella se sorprende; en «sky» la señala sonriendo; por la
//    ventana, el cielo de Giza.

// un camello (22 px de alto): joroba con su manta, cuello curvo, cabeza que cabecea, patas que se cruzan al andar y la

// ── plano 1: la atmósfera desde muy alto ──
