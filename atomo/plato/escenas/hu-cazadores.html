<title>Los cazahuracanes · ep12</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>

<body>
<canvas id="lienzo"></canvas>
<script type="module">
// HU-CAZADORES (frase 16), 1943, cartela «1943». Cuatro planos (6,5, 5,9, 4,5 y 4,4 s), todos con acción y vida de fondo:
// 1. la pista de Bryan con la tormenta encima: la AT-6 baja zarandeada por las rachas mientras la baliza del camión de
//    bomberos de guardia gira; toca tierra en «lands» levantando polvo y rueda frenando hasta pararse al acabar «safely»;
//    los dos cadetes británicos de la apuesta, en el margen de la derecha, se sorprenden al tocar y uno aplaude; se abre
//    la cubierta, el navegante se levanta en la cabina de atrás, salta al ala y de ahí a la pista con su taza humeante y
//    va hacia los cadetes; el oficial meteorológico, que esperaba en el margen de la izquierda sujetándose la gorra, corre
//    con su maletín, sube al ala en «weather officer» (un cadete lo señala), salta por encima del borde y se deja caer en
//    la cabina de atrás; el navegante levanta la taza ante los cadetes y charlan; se cierra la cubierta y en «into the
//    eye» la avioneta corre, levanta la cola y pasa por detrás de ellos (se cubren del chorro de la hélice), despega en
//    «a second» y trepa hacia la tormenta, que relampaguea en «second» y en «time» (los rayos, recortados al cielo y por
//    detrás de la avioneta); los tres la despiden con los brazos;
// 2. (corta al acabar «time.») delante del hangar: Duckworth repasa su avioneta con la tablilla (dos golpecitos al ala)
//    mientras el mecánico de guardia sale del hangar con el extintor y se planta a un lado; en «historians» baja colgada
//    la ficha vieja de 1943 (la cifra, fina y dentro del tablero) con el vaso de whisky de la apuesta, en «doubt» le salta una «?» y en «the bet» un sello rojo
//    en aspa la tacha; la ficha se suelta y cae revoloteando; en «simply wanted» Duckworth gira la hélice a mano dos veces
//    y se aparta, en «test» el motor tose una bocanada de humo (el mecánico levanta la boquilla del extintor, sorprendido)
//    y arranca; en «plane» Duckworth levanta el pulgar (un visto verde) y el chorro de la hélice barre polvo y briznas
//    mientras el mecánico se sujeta la gorra; dentro del hangar, los mecánicos trabajan en la otra AT-6;
// 3. (corta en «That day») años después (la barra corre a 1947): el morro de cristal de un gran cuatrimotor plateado de
//    reconocimiento, de cerca; un pintor subido a la escalera pinta el emblema (un círculo azul con la espiral blanca, la
//    avioneta y el aro dorado, sin letras) pincelada a pincelada con las palabras; debajo, Duckworth lo señala en
//    «founding» y se vuelve a comentarlo con los otros en «legend», el navegante sorbe su café y el oficial se asombra;
//    en «Hurricane Hunters» el emblema brilla y los tres aplauden; por la franja lejana de la pista, por encima de sus
//    cabezas, pasa el jeep de «sígame» con su banderola a cuadros; en «Pilots» el piloto saluda desde la cabina y llegan dos tripulantes con sus paracaídas;
// 4. (corta en «Pilots») la plataforma de Bryan con la tormenta grande: una fila de aviones de reconocimiento (la AT-6, un
//    bimotor verde oliva y el cuatrimotor plateado) sube por detrás de los hangares y se mete uno tras otro en la tormenta
//    (la barra corre hasta 1953); Duckworth saluda en «on purpose»; el oficial, apartado a la derecha junto a su bombona
//    de hidrógeno con la manguera, desconecta el globo sonda y lo suelta en «measure», y sube
//    meciéndose, y en «from the inside» un relámpago enciende la tormenta y deja ver las siluetas de los aviones dentro.
import * as T from '/atomo/plato/escenas/hu-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hu-cazadores');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const C = T.C, K = C.k;
const lin = (t, a0, a1) => Math.max(0, Math.min(1, (t - a0) / (a1 - a0)));
const suave = (u) => { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); };
const entre = (t, a0, a1) => t >= a0 && t < a1;
const parp = (t, v = 6) => Math.sin(t * v) > 0;
const ruido = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const umbral = (x, y) => (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
const rgb = (c) => [c & 255, (c >>> 8) & 255, (c >>> 16) & 255];
const mezcla = (a, b, f) => { const [ar, ag, ab] = rgb(a), [br, bg, bb] = rgb(b); return (0xff000000 | (Math.round(ab + (bb - ab) * f) << 16) | (Math.round(ag + (bg - ag) * f) << 8) | Math.round(ar + (br - ar) * f)) >>> 0; };
const luz = (c) => { const [r, g, b] = rgb(c); return 0.3 * r + 0.59 * g + 0.11 * b; };
// la zona de Atom y la de la barra del año, que quedan tranquilas
const enAtom = (x, y) => x >= 276 && y <= 46;

const a = (f) => en('cazadores', f);
// cortes: al acabar «time.» (7,8: el primer plano queda en 6,5 s), «That» (13,75) y «Pilots» (18,2)
const P2 = a(0.3088), P3 = a(0.598), P4 = a(0.8185);
const duck = a(0.0891), aterriza = a(0.1087), salvo = a(0.1253), oficial = a(0.1998), ojoT = a(0.2361), ojoW = a(0.2587), unaW = a(0.2734), segunda = a(0.2841), vez = a(0.2969);
const historiadores = a(0.3653), duda = a(0.426), apuesta = a(0.4496), simple = a(0.4956), quiso = a(0.5123), probar = a(0.5348), avionT = a(0.5564);
const dia = a(0.6013), funda = a(0.6503), leyenda = a(0.6669), cazaH = a(0.7179), cazadoresT = a(0.7365), pilotos = a(0.7934);
const proposito = a(0.8816), medir = a(0.9159), dentroT = a(0.961);
// la taza del navegante, con su vapor (que el viento tumba)
const taza = (x, y, t, viento = 1) => { R.rect(x - 2, y - 3, x + 1, y, K); R.rect(x - 1, y - 2, x, y - 1, C.blanco); R.pset(x + 2, y - 2, K);
  for (let k = 0; k < 3; k++) { const u = (t * 1.4 + k / 3) % 1; if (u > 0.8) continue; R.pset(Math.round(x - u * 6 * viento + Math.sin(t * 5 + k) * 0.6), Math.round(y - 4 - u * 5), hex('#e8ecf0')); } };
// el maletín de instrumentos del oficial meteorológico
const maletin = (x, y) => { R.rect(x, y - 4, x + 6, y, K); R.rect(x + 1, y - 3, x + 5, y - 1, hex('#6a4a2a')); R.rect(x + 1, y - 3, x + 5, y - 3, hex('#8a6a3a')); R.rect(x + 2, y - 6, x + 4, y - 5, K); R.pset(x + 3, y - 2, C.oro); };
// la mano que cuelga al andar: dónde lleva algo un personaje (x, suelo, dir)
const enMano = (x, suelo, dir) => [dir > 0 ? x + 12 : x + 2, suelo - 8];

// ── 1 · aterriza, cambia de pasajero y despega otra vez hacia la tormenta ───────────────────────────────────────────
// la avioneta llega a 65 px/s, toca en «lands» y rueda 30 px frenando hasta pararse al acabar «safely»
const toca = aterriza, para = toca + 0.92, abre = para + 0.06, saleN = abre + 0.06, enAlaN = saleN + 0.22, bajaN = enAlaN + 0.2, andaN = bajaN + 0.28;
const corre0 = para - 0.14, llegaO = oficial + 0.1, sube = llegaO + 0.04, alBorde = sube + 0.16, dentroO = alBorde + 0.3, cierra = dentroO + 0.06, rueda = cierra + 0.08;
const despega = unaW - 0.05, rayo1 = segunda, rayo2 = vez;
const XPARA = 158;
const xAvion = (t) => {
  if (t < toca) return lerp(-30, 128, lin(t, 1.3, toca));
  if (t < para) { const d = t - toca, T0 = para - toca, v0 = 2 * 30 / T0; return 128 + v0 * d - v0 / (2 * T0) * d * d; }
  if (t < rueda) return XPARA;
  const u = (t - rueda) / 1.3; return XPARA + 170 * u * u;
};
// un punto de la avioneta parada (u hacia el morro, v hacia abajo, a s 2, en la actitud de tres puntos) en pantalla
const enAvion = (u, v) => { const th = -0.19, s = 2, sl = T.pistaY(XPARA); return [XPARA + u * s * Math.cos(th) - v * s * Math.sin(th), sl + u * s * Math.sin(th) + v * s * Math.cos(th)]; };
const [ASX, ASY] = enAvion(-7.1, -12.6);   // el asiento de atrás, en el borde de la cabina
const [ALX, ALY] = enAvion(-3.6, -5.4);    // el ala, junto a la raíz, donde se pisa
const ACT = (cx) => Math.round(cx) - 7;     // x de un personaje (15 px de ancho) con el centro en cx
// alguien que entra o sale de la cabina de atrás: hundido h px por debajo del borde (lo de debajo, tapado por el costado)
const enCabina = (def, h, t, o) => { R.recorte([0, 0, 319, Math.round(ASY) - 1]); const r = R.actor(def, ACT(ASX), Math.round(ASY) + Math.round(h), t, { dir: 1, ...o }); R.recorte(null); return r; };
// los dos cadetes británicos de la apuesta, en el margen de la derecha
const CADETES = [[EL.britanico, 226, 0], [EL.britanico2, 248, 1]];
const p1 = (t) => {
  T.aerodromo(R, t, { encuadre: 'pista', tormenta: 0.82 });
  // el camión de bomberos de guardia: la baliza gira mientras la avioneta toma tierra y se apaga cuando para
  if (t < para + 0.3 && Math.floor(t * 6) % 2 === 0) { R.rect(181, 120, 182, 121, hex('#ff4a3a')); R.pset(180, 121, hex('#ffb0a0')); R.pset(183, 121, hex('#ffb0a0')); }
  const x = xAvion(t), suelo = T.pistaY(x);
  // la altura: baja planeando hasta tocar; después de rodar, se va al aire y trepa hacia la tormenta
  const alt = t < toca ? 44 * Math.pow(1 - lin(t, 1.2, toca), 1.25) : t > despega ? 36 * Math.pow(lin(t, despega, despega + 0.6), 1.5) + Math.max(0, t - despega - 0.6) * 40 : 0;
  const enVuelo = alt > 0.5;
  const inclina = t < toca ? lerp(0.06, 0.14, lin(t, toca - 0.6, toca)) : t < rueda ? lerp(0.12, 0.19, lin(t, toca, toca + 0.5)) : t < despega ? lerp(0.19, 0, lin(t, rueda + 0.15, rueda + 0.5)) : 0.14;
  const helice = t < toca ? 0.75 : t < rueda - 0.15 ? lerp(0.75, 0.3, lin(t, toca, para)) : 1;
  const copiloto = t < saleN ? EL.navegante : t > dentroO ? EL.meteorologo : null;
  const polvo = t > toca && t < toca + 0.8 ? 1 - lin(t, toca, toca + 0.8) : t > rueda + 0.15 && t < despega + 0.3 ? 0.85 : 0;
  // los relámpagos de «second time», en la tormenta: se pintan antes que la avioneta, que queda por delante
  const rl = entre(t, rayo1, rayo1 + 0.16) || entre(t, rayo2, rayo2 + 0.1);
  if (rl) { R.recorte([0, 0, 319, 97]);   // recortados al cielo: no bajan por delante de la arboleda del horizonte
    let px = t < rayo2 ? 268 : 226, py = t < rayo2 ? 62 : 70; for (let i = 0; i < (t < rayo2 ? 8 : 6); i++) { const nx = px + (ruido(i, t < rayo2 ? 3 : 5, 41) - 0.5) * 10, ny = py + 6; R.linea(Math.round(px), py, Math.round(nx), ny, hex('#f4f0ff')); R.linea(Math.round(px) + 1, py, Math.round(nx) + 1, ny, hex('#b8a8f8')); px = nx; py = ny; }
    R.recorte(null); }
  T.at6(R, Math.round(x), Math.round(suelo - alt), t, { s: 2, dir: 1, piloto: EL.duckworth, copiloto, helice, inclina, vuelo: enVuelo, suelo: alt < 30 ? suelo : undefined, tren: t > despega + 0.3 ? 1 - lin(t, despega + 0.3, despega + 0.7) : 1,
    sacude: t < toca ? 0.4 * (1 - lin(t, toca - 0.5, toca)) : t > despega ? 0.22 : 0, abierta: t > abre && t < cierra, polvo });
  // el destello del relámpago también aclara la avioneta
  if (rl) T.tinte(R, 16, 110, [235, 235, 255], 0.18);
  // el oficial meteorológico: espera en el margen sujetándose la gorra; cuando la avioneta para, corre con su maletín, sube
  // al ala en «weather officer», pasa al borde de la cabina de atrás y se mete (el costado le va tapando)
  if (t < dentroO) {
    if (t < sube) {
      const c = lin(t, corre0, llegaO), xo = Math.round(lerp(12, ACT(ALX) - 10, c)), so = T.pistaY(xo + 7, 0.96);
      R.actor(EL.meteorologo, xo, so, t, { dir: 1, anda: c > 0 && c < 1, dedo: c === 0 && Math.sin(t * 2.3) > -0.2, sorpresa: entre(t, toca, toca + 0.4), sonrisa: entre(t, para - 0.3, corre0 + 0.1) });
      if (c === 0) maletin(xo + 15, so); else { const [hx, hy] = enMano(xo, so, 1); maletin(hx - 2, hy + 3); }
    } else if (t < alBorde) {   // el salto al ala
      const u = lin(t, sube, sube + 0.12), xo = Math.round(lerp(ACT(ALX) - 10, ACT(ALX), u)), so = Math.round(lerp(T.pistaY(ACT(ALX) - 3, 0.96), ALY, u)) - Math.round(Math.sin(u * Math.PI) * 5);
      R.actor(EL.meteorologo, xo, so, t, { dir: 1, habla: u >= 1 && parp(t, 9) }); const [hx, hy] = enMano(xo, so, 1); maletin(hx - 2, hy + 3);
    } else {                    // del ala salta por encima del borde y se deja caer dentro de la cabina de atrás
      const u = lin(t, alBorde, alBorde + 0.14), hunde = lin(t, alBorde + 0.14, dentroO);
      if (u < 1) { const xo = Math.round(lerp(ACT(ALX), ACT(ASX), u)), so = Math.round(lerp(ALY, ASY + 8, u) - Math.sin(u * Math.PI) * 16);
        if (u > 0.5) R.recorte([0, 0, 319, Math.round(ASY) - 1]); R.actor(EL.meteorologo, xo, so, t, { dir: 1 }); R.recorte(null); if (u <= 0.5) { const [hx, hy] = enMano(xo, so, 1); maletin(hx - 2, hy + 3); } }
      else enCabina(EL.meteorologo, lerp(8, 24, hunde), t, { sonrisa: true });
    }
  }
  // el navegante: se levanta de la cabina de atrás, pasa al ala y salta a la pista con su taza humeante; va hacia los
  // cadetes británicos de la apuesta, les levanta la taza (la ha ganado) y despide con ellos la avioneta
  const llegaN = andaN + 1.2, brindis = entre(t, llegaN, llegaN + 0.4);
  if (t > saleN) {
    if (t < enAlaN) enCabina(EL.navegante, lerp(24, 8, suave(lin(t, saleN, enAlaN))), t, {});
    else if (t < bajaN) { const u = lin(t, enAlaN, enAlaN + 0.12), xo = Math.round(lerp(ACT(ASX), ACT(ALX), u)), so = Math.round(lerp(ASY + 8, ALY, u) - Math.sin(u * Math.PI) * 16);
      if (u < 0.5) R.recorte([0, 0, 319, Math.round(ASY) - 1]); R.actor(EL.navegante, xo, so, t, { dir: 1 }); R.recorte(null); if (u >= 0.5) { const [hx, hy] = enMano(xo, so, 1); taza(hx, hy, t, 1); } }
    else {
      const salta = lin(t, bajaN, andaN), anda = lin(t, andaN, llegaN), x0 = ACT(ALX) + 4;
      const nx = salta < 1 ? Math.round(lerp(ACT(ALX), x0, salta)) : Math.round(lerp(x0, 202, anda)), ns = salta < 1 ? Math.round(lerp(ALY, T.pistaY(x0 + 7, 0.96) + 5, salta) - Math.sin(salta * Math.PI) * 7) : T.pistaY(nx + 7, 0.96) + 5;
      const despide = t > despega + 0.3, saluda = despide && Math.floor(t * 3 + 1) % 2 === 0;
      R.actor(EL.navegante, nx, ns, t, { dir: 1, anda: anda > 0 && anda < 1, salto: salta > 0.9 && salta < 1 ? 1 : 0, brazos: saluda, dedo: brindis, sorpresa: entre(t, despega - 0.2, despega + 0.3), habla: entre(t, llegaN + 0.4, despega - 0.2) && parp(t, 9), sonrisa: despide || brindis });
      if (!saluda) { const [hx, hy] = brindis ? [nx + 15, ns - 29] : enMano(nx, ns, 1); taza(hx, hy, t, 1); }
    }
  }
  // los cadetes británicos de la apuesta: miran el aterrizaje, se sorprenden al tocar, aplauden en «safely» (pierden la
  // apuesta), uno señala al oficial en «weather officer», reciben al navegante, se cubren del chorro de la hélice cuando
  // la avioneta pasa por detrás de ellos y la despiden con los brazos cuando se va hacia la tormenta («a second time»)
  for (const [def, cx, k] of CADETES) {
    const pasa = entre(t, despega - 0.2, despega + 0.3), despiden = t > despega + 0.3;
    R.actor(def, cx, T.pistaY(cx + 7, 0.96) + 10 + k, t, { dir: pasa || despiden ? 1 : -1, sorpresa: entre(t, toca - 0.05, toca + 0.4) || pasa, manos: pasa,
      brazos: (entre(t, salvo, para + 0.4) && k === 0 && Math.floor(t * 7) % 2 === 0) || (despiden && Math.floor(t * 3 + k) % 2 === 0),
      dedo: (k === 1 && entre(t, oficial - 0.05, oficial + 0.6)) || (k === 0 && entre(t, duck - 0.1, toca - 0.1)),
      habla: (entre(t, para + 0.4, oficial - 0.1) || entre(t, llegaN + 0.4, despega - 0.2)) && parp(t, 8 + k), sonrisa: entre(t, salvo, para + 0.6) || despiden || brindis });
  }
};

// ── 2 · delante del hangar: la duda de los historiadores y la prueba del avión ──────────────────────────────────────
const golpe1 = P2 + 0.75, golpe2 = P2 + 1.05, llegaH = simple - 0.55, tira1 = simple, tira2 = quiso, atras = quiso + 0.3;
// la ficha vieja de la apuesta (1943): el vaso de whisky que se apostó; preg 0–1, la «?» de la duda que salta encima
// («doubt»); sello 0–1, el aspa roja que la tacha («the bet»); cae > 0, suelta del cordel
const fichaVieja = (x, y, t, preg, sello, cae) => {
  const { rect, pset, linea } = R;
  // el cordel y la chincheta de arriba
  if (cae === 0) { linea(x + 26, y - 14, x + 26, y, hex('#8a7a5a')); R.disco(x + 26, y - 1, 2, K); R.disco(x + 26, y - 1, 1, C.rojo); }
  rect(x + 2, y + 2, x + 54, y + 36, hex('#5a5040'));   // su sombra
  rect(x, y, x + 52, y + 34, K); rect(x + 1, y + 1, x + 51, y + 33, hex('#e8d8b4'));
  for (let j = y + 2; j < y + 33; j++) for (let i = x + 2; i < x + 51; i++) { const n = ruido(i, j, 77); if (n > 0.86) pset(i, j, hex('#d8c49a')); else if (n < 0.05) pset(i, j, hex('#c8b48a')); }
  rect(x + 1, y + 30, x + 51, y + 33, hex('#d8c49a')); rect(x + 48, y + 1, x + 51, y + 4, hex('#c8b48a')); pset(x + 48, y + 4, K);   // el borde gastado y la esquina doblada
  rect(x + 3, y + 4, x + 22, y + 4, hex('#b8a47a')); rect(x + 3, y + 7, x + 16, y + 7, hex('#b8a47a'));   // renglones de la ficha, sin letras
  R.numero('1943', x + 37, y + 11, { color: hex('#7a5a3a'), sombra: false, centro: true, fina: true });
  // el vaso de la apuesta: un vaso bajo con whisky y hielo, con su brillo
  rect(x + 8, y + 12, x + 22, y + 29, K); rect(x + 9, y + 13, x + 21, y + 28, hex('#e8f0f4')); rect(x + 9, y + 19, x + 21, y + 28, hex('#d8902a')); rect(x + 9, y + 19, x + 21, y + 19, hex('#f0b850'));
  rect(x + 11, y + 16, x + 14, y + 19, hex('#f4fcff')); rect(x + 11, y + 16, x + 11, y + 19, hex('#b8d8e8')); rect(x + 16, y + 21, x + 18, y + 23, hex('#f8d890')); pset(x + 20, y + 14, C.blanco); pset(x + 20, y + 15, C.blanco); rect(x + 9, y + 28, x + 21, y + 28, hex('#a86818'));
  // la «?» de la duda: salta con un rebote al aparecer
  if (preg > 0) { const b = preg < 1 ? Math.round(Math.sin(preg * Math.PI) * 4) : 0; R.icono('?', x + 30, y + 15 - b, hex('#5a3a1a'), hex('#c8b48a'), 2); }
  // el sello rojo en aspa, con su tinta salpicada
  if (sello > 0) { const e = Math.min(1, sello); for (let k = -1; k <= 1; k++) { linea(x + 5, y + 7 + k, Math.round(x + 5 + 42 * e), Math.round(y + 7 + 22 * e) + k, hex('#c8282a')); linea(x + 47, y + 7 + k, Math.round(x + 47 - 42 * e), Math.round(y + 7 + 22 * e) + k, hex('#c8282a')); }
    if (e >= 1) for (let k = 0; k < 8; k++) pset(x + 7 + ((ruido(k, 1, 33) * 38) | 0), y + 4 + ((ruido(k, 2, 33) * 26) | 0), hex('#c8282a')); }
};
// el mecánico de guardia contra incendios, con el mono azul de faena y la gorra; lleva el extintor rojo

const PINTOR = { ...EL.tecnico, tocado: 'gorra' }, PAL_PINTOR = { C: hex('#e8e4dc'), c: hex('#c0bcb4'), F: hex('#e8e4dc'), W: hex('#e8e4dc'), o: hex('#c84a3a') };
const TRIP = { C: hex('#7a4a2a'), c: hex('#5a341c'), F: hex('#5e6a44'), W: hex('#d8cca8') };
const año3 = (t) => Math.round(lerp(1943, 1947, suave(lin(t, P3 + 0.05, funda))));
// el jeep del aeródromo, verde oliva, con el conductor, la rueda de repuesto y la banderola a cuadros de «sígame»
const jeep = (x, y, t) => { const { rect, pset } = R;

  rect(x, y - 7, x + 18, y - 2, K); rect(x + 1, y - 6, x + 17, y - 3, hex('#5e6a44')); rect(x + 1, y - 6, x + 17, y - 6, hex('#7a8658')); rect(x + 12, y - 10, x + 13, y - 7, K); rect(x + 13, y - 10, x + 15, y - 10, hex('#8a9ab8'));
  rect(x - 2, y - 6, x, y - 3, K); pset(x - 1, y - 5, hex('#46502e')); pset(x + 18, y - 4, hex('#fff2b0'));
  rect(x + 6, y - 11, x + 8, y - 8, hex('#e8b48a')); rect(x + 6, y - 12, x + 8, y - 11, hex('#5e6a44')); pset(x + 7, y - 9, K);
  rect(x + 2, y - 15, x + 2, y - 7, K); for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) pset(x + 3 + i + (Math.floor(t * 8) % 2 && i > 1 ? 0 : 0), y - 15 + j, (i + j) % 2 ? hex('#c83a3a') : C.blanco);
  for (const wx of [x + 4, x + 14]) { R.disco(wx, y - 1, 2, K); pset(wx, y - 1, hex('#6a6a70')); } };
const p3 = (t) => {
  T.aerodromo(R, t, { encuadre: 'pista', tormenta: 0.5 });

  for (let y = 138; y < 158; y++) for (let x = 20; x < 320; x++) { const f = 1 - Math.abs(y - 148) / 10; if (umbral(x, y) < f * 0.75) R.pset(x, y, mezcla(R.pget(x, y), hex('#2a2a36'), 0.35)); }

  // jeep de «sígame» con su polvareda

  if (pinta && punta) { const [hx, hy] = r.mano, px = Math.round(punta[0]), py = Math.round(punta[1]); R.linea(hx + 1, hy, px - 1, py, hex('#8a5a2a')); R.linea(hx + 1, hy + 1, px - 1, py + 1, hex('#5a3418')); R.rect(px - 1, py - 1, px + 1, py + 1, K); R.pset(px, py, p < 0.3 ? hex('#5a9ae0') : p < 0.55 ? C.blanco : p < 0.75 ? hex('#14204a') : C.oro); }

  const fiesta = t > cazadoresT - 0.05, sorbo = !fiesta && ((t - P3) % 1.6) > 1.05;
  R.actor(EL.duckworth, 150, 166, t, { dir: entre(t, leyenda + 0.1, cazaH - 0.1) ? 1 : -1, dedo: entre(t, funda - 0.1, leyenda + 0.1) || (fiesta && Math.floor(t * 2.5) % 2 === 0), habla: entre(t, leyenda + 0.1, cazaH - 0.1) && parp(t, 9), sonrisa: fiesta || t < funda });
  const rn = R.actor(EL.navegante, 172, 167, t, { dir: -1, brazos: fiesta && Math.floor(t * 4) % 2 === 0, dedo: sorbo, sonrisa: fiesta });
  if (!(fiesta && Math.floor(t * 4) % 2 === 0)) { const [hx, hy] = sorbo ? [rn.mano[0] + 3, rn.mano[1] + 15] : enMano(172, 167, -1); taza(hx, hy, t, 0.3); }
  R.actor(EL.meteorologo, 194, 166, t, { dir: -1, brazos: fiesta && Math.floor(t * 4 + 2) % 2 === 0, sorpresa: entre(t, leyenda, leyenda + 0.5), sonrisa: fiesta });
  // «Pilots»: dos tripulantes llegan con sus paracaídas a la espalda
  const v = lin(t, pilotos - 0.35, P4 + 0.3);
  if (v > 0) for (const [k, dx] of [[0, 0], [1, -20]]) { const x = Math.round(lerp(-20, 44, v) + dx), s = 167 + k; R.actor(EL.navegante, x, s, t, { dir: 1, anda: true, pal: TRIP }); R.rect(x - 1, s - 20, x + 3, s - 13, K); R.rect(x, s - 19, x + 2, s - 14, hex('#c8c0a0')); }
};

// ── 4 · una fila de aviones de reconocimiento se mete en la tormenta ────────────────────────────────────────────────
// los aviones se pintan en una capa aparte y solo se pasan donde detrás hay cielo azul: salen por detrás de los hangares
// y se meten en las nubes de la tormenta
let capa = null;
const cieloAzul = (c) => { const [r, g, b] = rgb(c); return b - r > 55 && b > 150; };
// el gris azulado de las nubes de la tormenta (no los edificios de delante)
const nubeGris = (c) => { const [r, g, b] = rgb(c); return Math.abs(r - g) < 20 && b >= r - 4 && b - r < 50; };
const conMascara = (dibuja, siluetas) => {
  if (!capa) capa = R.nuevo();
  const B = R.buf; capa.set(B); const prev = R.usar(capa); dibuja(); R.usar(prev);
  for (let i = 0; i < 57600; i++) if (capa[i] !== B[i]) { if (cieloAzul(B[i])) B[i] = capa[i]; else if (siluetas && i < 76 * 320 && i % 320 > 128 && nubeGris(B[i])) B[i] = hex('#2a2838'); }
};
// el bimotor verde oliva (morro a la derecha): fuselaje, morro de cristal, deriva doble, ala de gaviota y el motor con
// la hélice; s 1 mide unos 38 px
const bimotor = (x, y, t) => { const { rect, pset, disco, linea } = R;
  R.poligono([[x - 19, y - 1], [x - 21, y - 9], [x - 17, y - 9], [x - 14, y - 1]], K); R.poligono([[x - 19, y - 2], [x - 20, y - 8], [x - 18, y - 8], [x - 15, y - 2]], hex('#5e6a44'));
  rect(x - 22, y - 1, x - 12, y, K);
  rect(x - 18, y - 3, x + 14, y + 3, K); rect(x - 17, y - 2, x + 13, y + 2, hex('#5e6a44')); rect(x - 17, y + 1, x + 13, y + 2, hex('#a8a89a')); rect(x - 17, y - 2, x + 13, y - 2, hex('#7a8658'));
  rect(x + 14, y - 2, x + 18, y + 2, K); rect(x + 14, y - 1, x + 17, y + 1, hex('#3a5a8a')); pset(x + 15, y - 1, hex('#a8c8e8'));
  rect(x + 4, y - 4, x + 9, y - 3, K); rect(x + 5, y - 4, x + 8, y - 4, hex('#3a5a8a'));
  linea(x - 6, y, x + 8, y - 1, K); linea(x - 6, y + 1, x + 8, y, hex('#46502e'));
  rect(x + 2, y - 2, x + 10, y + 3, K); rect(x + 3, y - 1, x + 9, y + 2, hex('#5e6a44')); rect(x + 9, y - 1, x + 9, y + 2, hex('#2a2a32'));
  for (let j = -5; j <= 6; j++) if ((j + Math.floor(t * 30)) % 3) pset(x + 11, y + j, hex('#c8ccd4'));
  disco(x - 9, y, 1, hex('#2a4a9a')); pset(x - 9, y, C.blanco); };
// el cuatrimotor plateado (morro a la derecha): fuselaje largo, morro de cristal en bala, la deriva alta, el ala con los
// motores y las hélices; s 1 mide unos 54 px
const cuatrimotor = (x, y, t) => { const { rect, pset, linea } = R;
  R.poligono([[x - 26, y - 2], [x - 24, y - 15], [x - 19, y - 15], [x - 15, y - 2]], K); R.poligono([[x - 25, y - 3], [x - 23, y - 14], [x - 20, y - 14], [x - 16, y - 3]], ALU[2]);
  rect(x - 31, y - 1, x - 18, y, K);
  rect(x - 27, y - 4, x + 22, y + 3, K); rect(x - 26, y - 3, x + 21, y + 2, ALU[2]); rect(x - 26, y - 3, x + 21, y - 3, ALU[0]); rect(x - 26, y + 1, x + 21, y + 2, ALU[3]);
  R.poligono([[x + 21, y - 4], [x + 26, y - 2], [x + 27, y + 1], [x + 21, y + 3]], K); rect(x + 22, y - 2, x + 25, y + 1, hex('#3a5a8a')); pset(x + 23, y - 2, hex('#a8c8e8'));
  linea(x - 8, y + 1, x + 9, y + 1, K); linea(x - 8, y + 2, x + 9, y + 2, ALU[4]);
  for (const ex of [x + 1, x + 6]) { rect(ex - 3, y + 1, ex + 4, y + 5, K); rect(ex - 2, y + 2, ex + 3, y + 4, ALU[3]); }
  for (let j = -4; j <= 9; j++) if ((j + Math.floor(t * 30)) % 3) { pset(x + 11, y + j, hex('#c8ccd4')); }
  pset(x - 12, y - 4, ALU[4]); pset(x - 2, y - 4, ALU[4]); R.disco(x - 14, y, 1, hex('#2a4a9a')); pset(x - 14, y, C.blanco); };
const año4 = (t) => Math.round(lerp(1947, 1953, lin(t, P4, E.duracion)));
const p4 = (t) => {
  T.aerodromo(R, t, { tormenta: 0.88 });
  // la fila: cada avión sale por detrás de los hangares, sube y se mete en la tormenta
  const vuelo = (t0, v, dy) => { const d = t - t0; if (d < 0) return null; const x = -36 + v * d, y = (x < 110 ? 31 : 31 + Math.min(32, (x - 110) * 0.34)) + dy; return [Math.round(x), Math.round(y + Math.sin(t * 3 + t0) * 0.8)]; };
  const fl = entre(t, dentroT - 0.04, dentroT + 0.16) || entre(t, dentroT + 0.24, dentroT + 0.34);
  const A = vuelo(P4 - 0.3, 88, 0), B2 = vuelo(P4 + 0.35, 88, 0), C4 = vuelo(P4 + 1.05, 88, 2);
  conMascara(() => {
    if (A) T.at6(R, A[0], A[1] + 4, t, { s: 0.8, dir: 1, vuelo: true, helice: 1, inclina: A[0] > 110 ? -0.18 : 0.04 });
    if (B2) bimotor(B2[0], B2[1], t);

  if (fl) { const sil = hex('#2a2838'); for (let y = 16; y < 84; y++) for (let x = 128; x < 320; x++) { if (enAtom(x, y)) continue; const c = R.pget(x, y); if (c !== sil && nubeGris(c) && umbral(x, y) < 0.6) R.pset(x, y, mezcla(c, hex('#e8e4ff'), 0.45)); } }
  // en la plataforma: el navegante con su taza, Duckworth que saluda y el oficial que suelta el globo sonda
  R.actor(EL.navegante, 84, 156, t, { dir: 1, brazos: entre(t, P4 + 0.3, P4 + 1.4) && Math.floor(t * 3) % 2 === 0, sorpresa: fl, sonrisa: t > dentroT + 0.4 });
  if (!(entre(t, P4 + 0.3, P4 + 1.4) && Math.floor(t * 3) % 2 === 0)) { const [hx, hy] = enMano(84, 156, 1); taza(hx, hy, t, 1); }
  R.actor(EL.duckworth, 112, 158, t, { dir: 1, dedo: entre(t, proposito - 0.1, proposito + 1.0), sorpresa: fl, sonrisa: t > dentroT + 0.4 });
  // el oficial, apartado a la derecha con su bombona de hidrógeno (gris, con la franja roja, el manómetro y la manguera
  // que infla el globo hasta que lo suelta)
  const suelta = t > medir, BX = 206;
  R.rect(BX, 146, BX + 5, 161, K); R.rect(BX + 1, 147, BX + 4, 160, hex('#7a8690')); R.rect(BX + 1, 147, BX + 1, 160, hex('#a8b4bc')); R.rect(BX + 4, 148, BX + 4, 160, hex('#5a646e'));
  R.rect(BX + 1, 150, BX + 4, 151, hex('#c83a2a')); R.rect(BX + 2, 143, BX + 3, 145, K); R.rect(BX + 1, 142, BX + 4, 142, hex('#c8a040')); R.disco(BX + 6, 143, 1, K); R.pset(BX + 6, 143, C.blanco);
  R.rect(BX - 1, 161, BX + 7, 161, hex('#6a6458'));
  const ro = R.actor(EL.meteorologo, 186, 160, t, { dir: 1, dedo: !suelta || entre(t, medir, medir + 0.3), sorpresa: fl, sonrisa: entre(t, medir + 0.3, dentroT) });
  // el globo sonda: blanco, con su cordel y la cajita del instrumento; sube meciéndose y el viento lo lleva a la izquierda
  const sube = Math.max(0, t - medir), bx = Math.round(ro.mano[0] + 2 - sube * 9 + Math.sin(t * 2.2) * 2 * Math.min(1, sube)), by = Math.round(ro.mano[1] - 12 - sube * 30);
  if (t < medir - 0.25) { R.linea(BX + 2, 142, BX - 2, 136, hex('#3a3a40')); R.linea(BX - 2, 136, bx + 1, by + 6, hex('#3a3a40')); }
  R.linea(bx, by + 5, bx + Math.round(Math.sin(t * 2.2 + 1)), by + 14, hex('#e8e4dc')); R.rect(bx - 1, by + 14, bx + 1, by + 16, K); R.pset(bx, by + 15, hex('#c8a040'));
  R.disco(bx, by, 6, K); R.disco(bx, by, 5, hex('#e8ecf0')); R.disco(bx - 1, by - 1, 3, C.blanco); R.pset(bx - 2, by - 3, C.blanco); R.rect(bx + 2, by + 1, bx + 4, by + 3, hex('#c8ccd8'));
};

const efectos = [[1.6, 'motor', { dur: 1.6 }], [toca, 'golpecito'], [salvo + 0.05, 'palmada'], [abre, 'cerrojo'], [sube, 'golpecito'], [cierra, 'cerrojo'], [rueda, 'motor', { dur: 1.2 }], [despega + 0.05, 'whoosh'], [rayo1, 'trueno'],
  [historiadores, 'papel'], [golpe1, 'toc'], [golpe2, 'toc'], [duda, 'pop'], [apuesta - 0.04, 'sello'], [apuesta + 0.6, 'papel'], [tira1, 'golpecito'], [tira2, 'golpecito'], [probar - 0.05, 'arranque'], [avionT + 0.15, 'brillo'],
  [funda, 'lapiz'], [cazadoresT, 'brillo'], [cazadoresT + 0.32, 'palmada'], [pilotos + 0.05, 'pop'],
  [P4 + 0.1, 'motor', { dur: 1.2 }], [dentroT - 0.04, 'trueno']];
T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3], [P4, p4]], { cartela: '1943', efectos, año: (t) => (t < P3 ? 1943 : t < P4 ? año3(t) : año4(t)) });
