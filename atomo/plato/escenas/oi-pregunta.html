  const baja = ease(tramo(t, P3 - 0.2, en('pregunta', 0.807) - 0.3)), huye = ease(tramo(t, en('pregunta', 0.807), en('pregunta', 0.807) + 2.4)), y = Math.round(lerp(lerp(96, yF - 8, baja), 60, huye));

  const q = tramo(t, en('pregunta', 0.678) - 0.2, en('pregunta', 0.678) + 0.2); if (q > 0) { const yy = Math.round(lerp(150, 136, ease(q)) + Math.sin(t * 2.5) * 2); R.icono('?', 50, yy - 20, T.C.oro, hex('#1a1206'), 4); }

  R.actor(EL.operaria, 140, 52, t, { dir: -1, habla: t < en('pregunta', 0.678) && Math.sin(t * 7) > 0, dedo: t > en('pregunta', 0.807), sorpresa: t > en('pregunta', 0.807) + 0.3 });
};
