const chincheta = (x, y) => { R.disco(x, y, 3, K0); R.disco(x, y, 2, hex('#d83a3a')); R.pset(x - 1, y - 1, hex('#ff9a9a')); R.pset(x + 1, y + 3, hex('#5a1a1a')); };

  // Katniss en primer término a la izquierda, de cara al lago, cantando
  const kx = 40, ks = 160, llega = t > REACH;
  R.actor(EL.katniss, kx, ks, t, { dir: 1, habla: !llega && Math.sin(t * 9) > -0.2, sonrisa: llega, brazos: llega && t < REACH + 0.6 });
  const kc = [kx + 8, ks - 20];                               // su boca, más o menos
  // sus notas salen hacia el lago y se pierden en la bruma
  for (let i = 0; i < 4; i++) { const t0 = P3 + 0.2 + i * 0.5; notaVuela(kc[0] + 6, kc[1] - 2, 120 + i * 22, 70 + (i % 2) * 8, tramo(t, t0, t0 + 1.6), hex('#fffbe8'), i); }
  // la hilera de notas que cruza el lago desde el árbol viejo hasta ella («more than sixty years»)
  for (let i = 0; i < 9; i++) { const t0 = TRAVEL - 0.1 + i * 0.22; notaVuela(236, 50 + (i % 3) * 5, kc[0] + 2, kc[1] - 4, tramo(t, t0, t0 + 1.5), i % 2 ? ORO : hex('#fffbe8'), i, i % 3 === 0, 2); }
  // en «reach her», las notas giran alrededor de ella y brillan
  const g = tramo(t, REACH - 0.2, REACH + 0.8);
  if (g > 0) { for (let i = 0; i < 5; i++) { const ang = t * 3 + i * 1.26, rxx = 16 * (1 - g * 0.3); R.icono(i % 2 ? 'nota2' : 'nota', Math.round(kc[0] + Math.cos(ang) * rxx - 2), Math.round(ks - 14 + Math.sin(ang) * 9 - 6), i % 2 ? ORO : hex('#fffbe8'), K0, 1); }
    halo(kc[0], ks - 14, 18, 0.25 * g); if (t < REACH + 1.2) destello(kc[0] + 11, ks - 30, 3, t); }
  MATAS.filter((m) => m[1] > 160 && (m[0] < 36 || m[0] > 64)).forEach(mata);
  // delante: prímulas y matas de hierba alta que se mecen con la brisa del lago
  for (const [x, y] of [[18, 166], [30, 172], [72, 170], [84, 164], [62, 176]]) { const m = Math.round(Math.sin(t * 1.5 + x) * 1); R.linea(x, y, x + m, y - 4, A('#4a6a32')); R.disco(x + m, y - 5, 1, hex('#f8e070')); R.pset(x + m, y - 5, hex('#d89a30')); }
  for (let k = 0; k < 9; k++) { const x = Math.round(4 + hh(k, 1, 47) * 312), a = 8 + Math.round(hh(k, 2, 47) * 6), m = Math.sin(t * 1.6 + x * 0.1); if (x > 34 && x < 66) continue;
    for (let bl = -2; bl <= 2; bl++) for (let j = 0; j < a - Math.abs(bl); j++) R.pset(Math.round(x + bl + m * j / a * 2 + bl * j * 0.15), 179 - j, A(j > a * 0.6 ? '#a8b86a' : bl % 2 ? '#2e4a22' : '#4a6a32')); }
  // motas de luz del amanecer que flotan
  for (let k = 0; k < 8; k++) { const x = Math.round((hh(k, 1, 48) * 320 + t * 4) % 320), y = Math.round(100 + hh(k, 2, 48) * 60 + Math.sin(t + k) * 4); if (Math.sin(t * 2 + k * 1.9) > 0.3) R.pset(x, y, hex('#fff0d0')); }
};
const efectos = [[PINA, 'golpecito'], [BAIRD, 'lapiz'], [PINB, 'golpecito'], [HILO + 0.3, 'brillo'], [b(0) + 0.5, 'silbato'], [MOCKJ - 0.3, 'whoosh'], [TRAVEL, 'brillo'], [REACH, 'brillo']];
const año = (t) => (t < P2 ? null : t < P3 ? 10 : 75);
T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3]], { efectos, año });
