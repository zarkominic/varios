// ---------------------------------------------------------------- la mirilla (la de ep3-proton, ya entera)
function mirilla(dc, ts) {
  const { c, r } = MIRILLA, d = pant(DIAL);
  dc.save();
  const fi = Math.atan2(d[1] - c[1], d[0] - c[0]), dl = Math.hypot(c[0] - d[0], c[1] - d[1]);
  const al = Math.acos(Math.min(0.99, r / dl));
  dc.globalAlpha = 0.5;
  dc.fillStyle = 'rgba(255,236,200,0.08)'; dc.strokeStyle = 'rgba(232,210,170,0.55)'; dc.lineWidth = 2;
  dc.beginPath(); dc.moveTo(d[0], d[1]);
  const pA = [c[0] + r * Math.cos(fi + al), c[1] + r * Math.sin(fi + al)];
  const pB = [c[0] + r * Math.cos(fi - al), c[1] + r * Math.sin(fi - al)];
  dc.lineTo(...pA); dc.lineTo(...pB); dc.closePath(); dc.fill();
  dc.beginPath(); dc.moveTo(d[0], d[1]); dc.lineTo(...pA); dc.moveTo(d[0], d[1]); dc.lineTo(...pB); dc.stroke();
  dc.globalAlpha = 1;
  dc.fillStyle = 'rgba(0,0,0,0.35)'; dc.beginPath(); dc.arc(c[0] + 8, c[1] + 12, r + 14, 0, 2 * Math.PI); dc.fill();
  dc.save(); dc.beginPath(); dc.arc(c[0], c[1], r, 0, 2 * Math.PI); dc.clip();
  dc.fillStyle = '#d9cdb4'; dc.fillRect(c[0] - r, c[1] - r, 2 * r, 2 * r);
  dc.drawImage(F('esfera'), 0, 0, W, H);
  dc.restore();
  const pul = 0.8 + 0.2 * Math.sin((PRO_QUIETO + Math.min(ts, T.zoom[0])) * 5.0);
  resplandor(dc, ESFERA.px[0], ESFERA.px[1], 95, { fuerza: 0.75 * pul });
  const gr = dc.createLinearGradient(c[0] - r, c[1] - r, c[0] + r, c[1] + r);
  gr.addColorStop(0, '#e2c27c'); gr.addColorStop(0.45, '#a77d35'); gr.addColorStop(1, '#5e4218');
  dc.strokeStyle = gr; dc.lineWidth = 16;
  dc.beginPath(); dc.arc(c[0], c[1], r + 6, 0, 2 * Math.PI); dc.stroke();
  dc.strokeStyle = 'rgba(255,240,200,0.35)'; dc.lineWidth = 2;
  dc.beginPath(); dc.arc(c[0], c[1], r - 1, Math.PI * 1.05, Math.PI * 1.6); dc.stroke();
  dc.restore();
  resplandor(dc, d[0], d[1], 40, { fuerza: 0.5 });
}

// (coste) toda la niebla 2D se pinta en un lienzo a un cuarto de resolución (es blanda) y se pega ampliada: neblina(fn)
const BAJA = 4, lienzoBajo = document.createElement('canvas');
lienzoBajo.width = W / BAJA; lienzoBajo.height = H / BAJA;
const gb = lienzoBajo.getContext('2d');
function neblina(fn) {
  gb.setTransform(1, 0, 0, 1, 0, 0); gb.clearRect(0, 0, lienzoBajo.width, lienzoBajo.height);
  gb.setTransform(1 / BAJA, 0, 0, 1 / BAJA, 0, 0);
  if (fn(gb) === false) return;

// las bocanadas que pasan de largo al hundirse (como la nube de ep3-proton, en gris): cada una a su profundidad zi; con
// el avance S, su distancia al centro y su tamaño crecen como S / zi
function nieblaPasa(dc, S, k, c = [960, 540]) {
  if (k < 0.01) return false;
  for (let i = 0; i < 30; i++) {
    const zi = Math.exp(Math.log(1.3) + (Math.log(40) - Math.log(1.3)) * azar(i, 61)), f = S / zi;
    if (f < 0.3 || f > 5) continue;
    const al = k * Math.exp(-Math.pow((Math.log(f) - 0.25) / 0.7, 2));
    const a = 2 * Math.PI * azar(i, 62), rr = (60 + 340 * azar(i, 63)) * f;
    const x = c[0] + Math.cos(a) * rr, y = c[1] + Math.sin(a) * rr * 0.86, R = Math.min(520, (60 + 110 * azar(i, 64)) * f);
    if (x + R < 0 || x - R > W || y + R < 0 || y - R > H) continue;
    const oscura = azar(i, 65) < 0.3;
    const col = oscura ? '70,76,92' : '214,218,228';
    const gr = dc.createRadialGradient(x, y, 0, x, y, R);
    gr.addColorStop(0, `rgba(${col},${(oscura ? 0.2 : 0.3) * al})`); gr.addColorStop(0.5, `rgba(${col},${(oscura ? 0.08 : 0.12) * al})`); gr.addColorStop(1, `rgba(${col},0)`);
    dc.fillStyle = gr; dc.fillRect(x - R, y - R, 2 * R, 2 * R);
  }
}
// la niebla que baja (la cámara sube): bocanadas estiradas en vertical según la velocidad
function nieblaSube(dc, Y, v, k) {
  if (k < 0.01) return false;
  const est = 1 + Math.min(3.5, v / 900);
  for (let i = 0; i < 18; i++) {
    const x = 1920 * azar(i, 81), y = ((azar(i, 82) * 1800 + Y * (0.6 + 0.8 * azar(i, 84))) % 1800) - 360;
    const R = 80 + 170 * azar(i, 83), oscura = azar(i, 85) < 0.3;
    const col = oscura ? '70,76,92' : '214,218,228';
    dc.save(); dc.translate(x, y); dc.scale(1, est);
    const gr = dc.createRadialGradient(0, 0, 0, 0, 0, R);
    gr.addColorStop(0, `rgba(${col},${(oscura ? 0.18 : 0.26) * k})`); gr.addColorStop(1, `rgba(${col},0)`);
    dc.fillStyle = gr; dc.fillRect(-R, -R, 2 * R, 2 * R);
    dc.restore();
  }
}
// bruma que deriva despacio, encima de lo que se ve en la niebla (muy tenue: no tapa)
function bruma(dc, ts, k = 1) {
  if (k < 0.01) return false;
  const t = Math.min(ts, QUIETO);
  for (let i = 0; i < 9; i++) {
    const x = ((azar(i, 91) * 2400 + t * (14 + 22 * azar(i, 92))) % 2400) - 240, y = 120 + 820 * azar(i, 93);
    const R = 220 + 260 * azar(i, 94);
    const gr = dc.createRadialGradient(x, y, 0, x, y, R);
    gr.addColorStop(0, `rgba(208,212,222,${0.07 * k})`); gr.addColorStop(1, 'rgba(208,212,222,0)');
    dc.fillStyle = gr; dc.fillRect(x - R, y - R, 2 * R, 2 * R);
  }
}
// las motas de la nube de electrones (electrones que giran, como las de nubeElectrones de ep03-tocar.js, sin su neblina,
// que va horneada en la foto del átomo): pequeñas y nítidas, con una estela corta
const MOTAS = (() => {
  const r = mulberry32(905), lista = [];
  const conj = (geo, forma, n, k) => {
    const { centro, ejeX, ejeY } = geo, rIn = geo.interior ?? 0.6, rEx = geo.exterior ?? 1.06;
    for (let i = 0; i < n; i++) {
      const rr = forma === 'anillo' ? rIn + (rEx - rIn) * (r() + r() + r()) / 3 : 1 - 0.45 * Math.pow(r(), 1.6);
      lista.push({ c: centro, ax: ejeX, ay: ejeY, th0: r() * 2 * Math.PI, rr, w: (0.3 + 0.5 * r()) * (r() < 0.5 ? -1 : 1), sz: 0.8 + 1.3 * r() * r(), k });
    }
  };
  conj(GEO_EST.anillo, 'anillo', 240, NUBE_A.fuerza);
  conj(GEO_EST.bola, 'bola', 300, Math.min(1, NUBE_B.fuerza));
  return lista;
})();
function motas(dc, t, k = 1) {
  dc.save(); dc.lineCap = 'round';
  const en2 = (M, th) => [M.c[0] + (M.ax[0] * Math.cos(th) + M.ay[0] * Math.sin(th)) * M.rr, M.c[1] + (M.ax[1] * Math.cos(th) + M.ay[1] * Math.sin(th)) * M.rr];
  for (const M of MOTAS) {
    const th = M.th0 + M.w * t, v = M.k * k;
    const [x, y] = en2(M, th), [x2, y2] = en2(M, th - M.w * 0.08);
    dc.strokeStyle = `rgba(255,190,110,${0.25 * v})`; dc.lineWidth = M.sz;
    dc.beginPath(); dc.moveTo(x2, y2); dc.lineTo(x, y); dc.stroke();
    dc.fillStyle = `rgba(255,212,150,${0.6 * v})`;
    dc.beginPath(); dc.arc(x, y, M.sz, 0, 2 * Math.PI); dc.fill();
  }
  dc.restore();
}

// ---------------------------------------------------------------- los tramos
// A · la mirilla, el remolino y la niebla
const ZMAX = 18;
function camA(ts) {
  const u = prog(ts, T.zoom[0], T.zoom[1]);
  return { u, Z: Math.pow(ZMAX, Math.pow(u, 1.7)), Q: [mix(RP[0], 960, eio(u)), mix(RP[1], 540, eio(u))] };
}
function tramoA(n, ts) {
  const C = camA(ts);
  const kF = ss(5, 12, C.Z);
  if (C.u <= 0) { pintar(F('persona')); mirilla(g, ts); }
  else if (kF < 1) {
    conCam(C.Z, RP, C.Q, () => g.drawImage(F('inicio'), 0, 0, W, H));
    // el remolino vivo: gira cada vez más deprisa y crece con el empuje (en su sitio: el mismo tamaño que el de la foto)
    const kR = ss(1.6, 2.6, C.Z) * (1 - ss(6, 11, C.Z));
    if (kR > 0.01) {
      P.limpiar();
      P.pieza(I.REM, { pos: en(C.Q[0], C.Q[1], ESFERA.rem.pos[2]), escala: ESFERA.rem.escala * C.Z, rot: [0, 0, 0.4 + 7 * eic(prog(ts, 0.75, 1.65))] });
      P.render(n, { fondo: false });
      pegarGL(kR);
      resplandor(g, C.Q[0], C.Q[1], 95 * C.Z, { fuerza: 0.5 * kR * (1 - ss(4, 9, C.Z)) });
    }
  }
  if (kF > 0.001) pintar(F('niebla'), kF);
  // bajamos: las bocanadas pasan de largo
  const S = Math.exp(Math.log(34) * prog(ts, T.pasa[0], T.pasa[1]));
  const kP = ss(T.pasa[0], T.pasa[0] + 0.4, ts) * (1 - ss(T.pasa[1] - 0.5, T.pasa[1], ts)), kB = ss(T.pasa[1] - 0.6, T.pasa[1], ts);
  neblina((dc) => { const a = nieblaPasa(dc, S, kP), b = bruma(dc, ts, kB); return a !== false || b !== false; });
  parpadeo(n);
}
// B · el átomo inflado y el árbol; a mitad de frase, el empuje hasta el árbol
function camB(ts) {
  const u = prog(ts, T.empuje[0], T.empuje[1]);
  const Z = mix(1, ZB, eio(u)) * (1 + 0.035 * prog(ts, T.empuje[1], T.corteSuelo));
  const Q = [mix(ARB_C[0], ARB_Q[0], eio(u)), mix(ARB_C[1], ARB_Q[1], eio(u))];
  return { u, Z, Q };
}
function inflado(ts) {
  const u = prog(ts, T.infla[0], T.infla[1]);
  if (u <= 0) return 0;
  const s = u < 1 ? 0.03 + 0.97 * eob(u, 1.6) : 1 + 0.08 * muelle(ts - T.infla[1], 2.0, 5.5);
  return s * (1 + 0.06 * eoc(prog(ts, T.infla[1], T.corteSuelo)));   // y se sigue hinchando, despacio
}
function tramoB(n, ts) {
  const C = camB(ts);
  const desenf = ss(1.15, 2.2, C.Z);
  conCam(C.Z, ARB_C, C.Q, () => g.drawImage(F('niebla'), 0, 0, W, H));
  // el átomo: se infla desde un punto (la onda empuja la niebla) y, con el empuje, se desenfoca
  const s = inflado(ts);
  if (s > 0.001) {
    // (coste) el átomo con su halo y la neblina de su nube es una foto (y otra desenfocada, para el empuje); en vivo, solo
    // las motas que giran
    conCam(C.Z, ARB_C, C.Q, () => {
      g.translate(BC[0], BC[1]); g.scale(s, s); g.translate(-BC[0], -BC[1]);
      if (desenf < 1) pintar(F('atomo'), 1);
      if (desenf > 0) pintar(F('atomoB'), desenf);
      motas(g, Math.min(ts, QUIETO), 1 - 0.5 * desenf);
    });
  }
  const uo = prog(ts, T.infla[0], T.infla[1] + 0.5);
  // el árbol: brota de su terrón (de lejos, foto pequeña); con el empuje, se funde con su foto de cerca
  const ub = prog(ts, T.brota[0], T.brota[1]);
  if (ub > 0) {
    const kG = ss(1.5, 2.2, C.Z);
    if (kG < 1) conCam(C.Z, ARB_C, C.Q, () => {
      const sy = ub < 1 ? eob(ub, 1.5) : 1, sx = mix(0.55, 1, ss(0, 0.6, ub));
      g.globalAlpha = 1 - kG;
      g.translate(ARB_BASE[0], ARB_BASE[1]); g.scale(sx, sy); g.translate(-ARB_BASE[0], -ARB_BASE[1]);
      g.drawImage(F('arbol'), 0, 0, W, H);
    });
    if (kG > 0) conCam(C.Z / ZB, ARB_Q, C.Q, () => { g.globalAlpha = kG; g.drawImage(F('arbolG'), 0, 0, W, H); });
  }
  neblina((dc) => { if (uo > 0 && uo < 1) nieblaPasa(dc, Math.exp(Math.log(8) * uo), Math.sin(Math.PI * uo) * 0.8, BC); bruma(dc, ts); });
  parpadeo(n);
}
// C · el suelo que parpadea y el «?»
function tramoC(n, ts) {
  pintar(F('niebla'));
  const b = ESTADO_SUELO(n);
  let vivo = null;
  if (ts < T.preg[0]) pintar(F(b ? 'sueloB' : 'sueloL'));
  else if (ts < T.asienta) vivo = () => { P.pieza(I.SUE, { ...SUE, color: b }); P.pieza(I.PRG, opPregunta(ts)); };
  else pintar(F(b ? 'sueloBQ' : 'sueloLQ'));
  return vivo;
}
// E · la vuelta y la subida, hasta el plató
function tramoE(n, ts) {
  const kP = ss(T.plato[0], T.plato[1], ts);
  if (kP > 0) pintar(F('plato'));
  pintar(F('niebla'), 1 - kP);
  // la vuelta: el suelo y el «?» se van por abajo, con estela
  const u = prog(ts, T.vuelta[0], T.vuelta[1]);
  if (u < 1) {
    const f = F(ESTADO_SUELO(n) ? 'sueloBQ' : 'sueloLQ');
    const dy = 1350 * eic(u), giro = -0.05 * eic(u);
    for (let j = 3; j >= 0; j--) {
      g.save();
      g.globalAlpha = (j ? 0.22 : 1) * (1 - ss(0.75, 1, u));
      g.translate(880, 580 + dy - j * 60 * u); g.rotate(giro); g.translate(-880, -580);
      g.drawImage(f, 0, 0, W, H);
      g.restore();
    }
  }
  // subimos: la niebla pasa hacia abajo
  const R = estadoRegla(ts), R1 = estadoRegla(ts + 1 / 12);
  const Y = 2600 * (R.ac + 35) / 35 + 500 * eic(u), v = 12 * (2600 * (R1.ac - R.ac) / 35);
  const kS = ss(T.vuelta[0], T.vuelta[0] + 0.3, ts) * (1 - ss(T.plato[0] + 0.1, T.plato[1], ts));
  neblina((dc) => { const a = nieblaSube(dc, Y, v, kS), b = bruma(dc, ts, 1 - kP); return a !== false || b !== false; });
  parpadeo(n, 1 - kP);
}
// ---------------------------------------------------------------- fotograma
function dibujar(t) {
  const t0 = performance.now();
  const n = P.fotograma(t, D), ts = n / 12;
  ajustarCapa();
  hechas = [];
  let t2 = 0;
  // el último fotograma quieto es la foto 'final' (el plató entero con el hervor del fotograma 0 de ep3-tierra)
  const nr = ts >= QUIETO ? 0 : n;
  if (ts >= QUIETO) pintar(F('final'));
  else {
    let vivo = null;
    if (ts < T.infla[0]) tramoA(n, ts);
    else if (ts < T.corteSuelo) tramoB(n, ts);
    else if (ts < T.vuelta[0]) { vivo = tramoC(n, ts); neblina((dc) => bruma(dc, ts)); parpadeo(n); }
    else tramoE(n, ts);
    // encima: la regla (foto si está quieta; después de subir ya va en la foto del plató) y, en una pasada, lo vivo,
    // la regla si se mueve y Atom
    const R = estadoRegla(ts);
    if (!R.mov && ts < T.sube[0]) pintar(F(R.ac > -25 ? 'r15' : 'r35'), 1, DX_REG * R.dx);
    t2 = performance.now();
    P.limpiar();
    if (vivo) vivo();
    if (R.mov) P.regla(opRegla(R));
    ponerAtomo(ts, niebla(ts));
    P.render(n, { fondo: false });
    pegarGL();
    // tres fotogramas de fundido a la foto final (aparecen las sombras de Atom en el ciclorama)
    if (ts >= QUIETO - 0.25) pintar(F('final'), ss(QUIETO - 0.25, QUIETO, ts + 1 / 24));
  }
  POST.aplicar(g, nr);
  const t3 = performance.now();
  if (!hechas.length) {
    const pendiente = PREPARAR.find(([a, nombre, b]) => ts >= a && ts < b && !FOTOS[nombre]);
    if (pendiente) F(pendiente[1]);
  }
  window.__tiempos = { ms: Math.round(performance.now() - t0), d2: t2 ? Math.round(t2 - t0) : 0, gl: t2 ? Math.round(t3 - t2) : 0, fotos: hechas };
}
// para atomo/herramientas/guias-humano.py: centro, coronilla y suela de la persona de pie (px)
function guias(h) {
  if (!h) return;
  const c = pant(h.mundo([0, HUMANO.CORONILLA, -0.01])), su = pant(h.mundo([0, -1, 0.05])), ce = pant(h.mundo([0, 0, 0]));
  window.__guias = { x: Math.round(ce[0]), coronilla: Math.round(c[1]), suela: Math.round(su[1]) };
}

// ---------------------------------------------------------------- al cargar: lo del fotograma 0
P.fotograma(0);
F('persona'); marcaCarga('persona');
F('esfera'); F('r15'); marcaCarga('esfera y regla');
// estrena Atom y la regla viva (para que ningún fotograma pague su compilación)
P.limpiar(); P.regla(opRegla(estadoRegla(0))); ponerAtomo(0, 0); P.render(0, { fondo: false });
marcaCarga('listo');
window.__inicio = { BASCULA, PERSONA: PERSONA0, POSE_F, MIRILLA, DIAL, REGLA: opRegla(reglaFija(-15)), SITIO, A_ESC: A_ESC0, fase: PRO_TZ };
window.__fin = { PERSONA: { pos: PER, escala: E_PER, rot: [0.02, 0.18, 0], postura: 'de pie' }, REGLA: opRegla(REGLA_FIN),
  ATOMO: { sitio: [230, 781.68], escala: A_ESC1, yaw: -0.15 + A_YAW, pitch: 0.06 - A_PITCH, fase: 0 } };
E.iniciar(dibujar, { paso: 1 / 12 });
</script>
