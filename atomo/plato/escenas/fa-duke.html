  for (let i = 0; i + 1 < tops.length; i++) { const [xa, ya] = tops[i], [xb, yb] = tops[i + 1]; for (let k = 0; k <= 20; k++) { const u = k / 20; pset(Math.round(lerp(xa, xb, u)), Math.round(lerp(ya, yb, u) + Math.sin(u * Math.PI) * 3), K); } }
  // el camión: el operario cierra la puerta (con la última caja dentro), brillan los dos escudos en «both team names»,
  // arranca, pita para despedirse y se aleja por la carretera hasta el horizonte mientras amanece
  const u = suave(tramo(t, ARRANCA, E.duracion + 1.6)), d = lerp(0.98, 0.16, u), by = VY + d * 80, cx = Math.round(centro(by) + ancho(by) * 0.45);
  const abre = 1 - tramo(t, CIERRA - 0.35, CIERRA), brilla = tramo(t, NOMBRES, NOMBRES + 0.2) - tramo(t, NOMBRES + 0.5, NOMBRES + 0.9), anda = t > ARRANCA;
  if (anda) for (let k = 0; k < 6; k++) { const v = ((t - ARRANCA) * 1.5 + k / 6) % 1; disco(Math.round(cx - 20 * d - v * 10), Math.round(by - 2 - v * 8), Math.max(1, Math.round((1 + v * 3) * d)), mezcla(hex('#8a8a9a'), hex('#c8c0c8'), v)); }
  camion(cx, Math.round(by), d, t, abre, Math.max(0, brilla), anda);
  const q = ruta(t, [[P4, 268, 176], [CIERRA + 0.2, 268, 176], [CIERRA + 0.9, 292, 172]], false);
  R.actor(EL.obrero, q.x, q.s, t, { dir: t < CIERRA + 0.2 ? -1 : -1, anda: q.mv, dedo: t > CIERRA - 0.4 && t < CIERRA + 0.1, brazos: t > ARRANCA + 0.3 && Math.sin(t * 6) > -0.3, sonrisa: t > CIERRA });
  if (t > CLAXON && t < CLAXON + 0.6 && Math.floor(t * 8) % 2) R.icono('!', cx - 2, Math.round(by - 44 * d - 10), K, hex('#f6f2ea'));
};

const año = (t) => (t >= P2 && t < P3 ? 1925 : 2026);
const efectos = [[STAMP1, 'sello'], [DUKE, 'brillo'], [STAMP2, 'golpecito'], [CAE - 0.05, 'silbato'], [RUN + 0.35, 'palmada'], [DOS, 'bip'], [SUENA, 'ring'], [CIERRA, 'puerta'], [ARRANCA, 'arranque'], [CLAXON, 'claxon']];
T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3], [P4, p4]], { efectos, año });
