<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Momia · ep8</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// EG-MOMIA (frases 27–28). El taller de embalsamar a la luz de las antorchas: la momia vendada en su mesa, el sacerdote
// con máscara de chacal, el montón de sal, la cesta y los cuatro vasos. Luego el gancho; en la caja, «70» días.
import { preparar, rodar, tumba, EL } from '/atomo/plato/escenas/eg-comun.js';
const { E, R, M } = await preparar('eg-momia');
const m = { mue: M('muerte', 0.5), mom: M('momia', 8) };
const taller = (t, gancho) => {
  tumba(R, t, { modo: 'taller', gancho });
  R.actor(EL.chacal, 132, 145, t, { brazos: gancho && Math.sin(t * 3) > 0 });
  R.actor(EL.calvo, 196, 145, t, { dir: -1, dedo: gancho });
};
rodar(E, R, [[0, (t) => taller(t, false)], [m.mom - 0.2, (t) => taller(t, true)]], {
  año: -1300,
  caja: (t, e) => R.caja(t, t > m.mom + 0.5 ? R.tramo(t, m.mom + 0.5, m.mom + 0.9) : 0, (x, y) => { R.icono('reloj', x, y + 5, undefined, undefined, 1); R.numero('70', x + 12, y + 12); }, { energia: e }),
});
</script>
</body>
</html>
