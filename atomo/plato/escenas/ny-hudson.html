<script type="module">
// NY-HUDSON (frases 8–9), 1609 → 1613, cartela «1609». Cinco planos:
// 1. (fondo local) el río ancho visto de través, desde la orilla de enfrente: las Palisades de columnas de basalto de
//    lado a lado (repisas con matas, grietas, el pedregal al pie y su reflejo roto), las Highlands detrás; el Halve Maen,
//    pequeño, baja por el agua con Hudson en la proa mirando con el catalejo y dos marineros; delante, en la canoa, dos
//    lenapes (chibis) reman, y al verlo («another ship arrives») paran: uno alza la pala y el otro lo señala; juncos y
//    una garza en la orilla de este lado;
// 2. (fondo local) el barco de cerca, de costado, con las Palisades detrás (columnas con luz y sombra, repisas, matas y
//    arbolitos, la cascada que cae y el pedregal) y los montes con relieve: Hudson en la proa con el catalejo se vuelve al
//    oír su nombre; un marinero echa la sonda (el plomo cae al agua); otro iza la tricolor holandesa en «Dutch»;
// 3. el mapa del valle del Hudson, más cerca: el río ancho de Nueva York a Albany, con los Catskills, las Highlands, los
//    Shawangunks y los Taconic, bosques, colinas, marismas y poblados lenapes y mohicanos que humean; el barquito sube por
//    el cauce y la ruta se dibuja hasta Albany («his name», chincheta); en «Fur traders follow», dos barquitos detrás; la
//    mariquita del mapa se tapa en este plano (en el canto de madera se leía como una mancha suelta);
// 4. (fondo local) la playa del trueque, 1613: un lenape trae un fardo de pieles (pardas y grises, atadas, con la cola
//    colgando) y lo deja; el patrón holandés le da un caldero; Juan Rodríguez, de pie en la barca, salta a la arena con sus dos
//    hachas de trueque, deja huellas, las deja en la arena y saluda en «Juan Rodríguez»; delante, barriles, cajas, un
//    rollo de cuerda y un cangrejo, todo con su sombra;
// 5. (fondo local) la orilla al atardecer, desde el agua: el claro con la cabaña a medio hacer, los fardos, el fuego y el
//    tocón con el hacha; el barco se va por la derecha en primer término (un marinero se despide desde la popa);
//    Rodríguez le dice adiós, saca el hacha del tocón («first») y dos lenapes salen de detrás de los árboles a
//    saludarlo («resident of the island»); un castor cruza nadando.
import * as T from '/atomo/plato/escenas/ny-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('ny-hudson');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const BY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], um = (x, y) => (BY[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
const H = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const grad = (x, y, cols, f) => { const g = Math.max(0, Math.min(cols.length - 1.001, f * (cols.length - 1))), i = Math.floor(g); return g - i > um(x, y) ? cols[i + 1] : cols[i]; };
const X = (o) => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, Array.isArray(v) ? v.map(hex) : hex(v)]));
const K = X({
  k: '#1c1424', blanco: '#f4f0e6', crema: '#e8dcb8', cremaS: '#c8b890', papel: '#efe4c4', papelS: '#d4c49c', papelL: '#fbf4dc',
  cielo: ['#3a78c4', '#4686ce', '#5694d6', '#68a4de', '#7cb2e4', '#94c2ea', '#b0d2ec', '#cde0ea'],
  sierra: '#7f9cbc', sierraS: '#6a86a8', sierraL: '#a4bcd4', sierraB: '#6a8aa4', bruma: '#bccee0',
  monte: '#6a8c98', monteL: '#90acb4', monteS: '#4e6e80', monteB: '#4a6a5c',
  agua: ['#7ab0cc', '#5e98ba', '#4a84aa', '#3a6e8e', '#2e5c7a', '#24506a'], aguaL: '#a8d0e0', aguaS: '#1e4258', espuma: '#eef4f2',
  bosque: '#3a6a3a', bosqueS: '#28502c', bosqueL: '#5a8a4a', bosqueLL: '#86b060', hierba: '#6a9a44', hierbaS: '#4e7a34', hierbaL: '#90bc5a',
  roca: '#7a7a82', rocaS: '#55555e', rocaL: '#a2a2a8', arena: '#e2cc94', arenaS: '#c4a870', arenaL: '#f2e2b4',
  // el basalto de las Palisades: gris pardo, con liquen y óxido
  bas: '#857a76', basL: '#a69c94', basLL: '#c6bcb0', basS: '#5e5454', basK: '#3a3238', liquen: '#b0a468', oxido: '#9a6a4a',
  tierra: '#8a6440', tierraS: '#6a4a2c', tierraL: '#aa8458', madera: '#8a5a34', maderaS: '#5e3a20', maderaL: '#b07a48',
  piel: '#7a5634', pielS: '#523820', pielL: '#9c7448', gris: '#8a8478', grisS: '#5e5a50', grisL: '#b6b0a0',
  rojo: '#c8303a', rojoS: '#8a1e26', rojoL: '#f06a5a', naranja: '#e8783a', azul: '#2a4a9a', carne: '#f0c8a0',
  oro: '#e8b830', oroS: '#a8801c', oroL: '#fff0a0', cobre: '#c8784a', cobreL: '#f0b080', cobreS: '#8a4a2a', flor1: '#f0e8f0', flor2: '#f08aa8', flor3: '#f2d24a',
  garza: '#8e9cb2', garzaL: '#c8d2de', garzaS: '#5a687e', pico: '#e8c040',
  // el mapa (tinta y grabados sobre el papel)
  tinta: '#6a5238', tintaS: '#8a7254', mL: '#f2e4be', mM: '#d6c092', mS: '#987a50', mB: '#5e7e3e', mBS: '#40602e', mBL: '#86a252',
  mAgua: '#7aa0b8', junco: '#6e8a3e', rio: '#4a7aa8', rioS: '#2a4a7a', rioL: '#7aa4c8', humo: '#b8b0a4', humoL: '#dcd6cc',
  // la tarde del plano 5
  tarde: ['#4a4a8a', '#6a5a9e', '#9a6aa6', '#c87a9a', '#e8908a', '#f4a87e', '#f8c486', '#fbd89a'],
  sol: '#fff0b8', solL: '#ffe080', solH: '#f8b878',
  tMonteL: '#b48ca8', tMonte: '#9a7a9e', tMonteS: '#7a6488', tMonteB: '#6a5a6e', tBruma: '#d8a8a8',
  tBosqueLL: '#c8b45a', tBosqueL: '#8a8a42', tBosque: '#5a6a36', tBosqueS: '#36442a',
  tHierba: '#8a8a40', tHierbaS: '#5e6a32', tHierbaL: '#b4a650', tArena: '#e8b888', tArenaS: '#c08a68', tArenaL: '#f6d0a0',
  tAgua: ['#c4949a', '#a47e98', '#846e94', '#68608a', '#505078'], tBrillo: '#fcd090', nubT: '#f8c4b4', nubTS: '#d8909c', nubTL: '#fde4d4',
});
// mezcla dos colores del lienzo en la proporción a (0–1)
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
// un fondo fijo pintado una vez en su búfer (R.usar devuelve el anterior: nunca R.usar() a secas)
const BUF = new Map();
const fijo = (clave, pinta) => { let b = BUF.get(clave); if (!b) { b = R.nuevo(); const prev = R.usar(b); pinta(); R.usar(prev); BUF.set(clave, b); } R.copiar(b); };
// nubes de tres tonos: [x0, y, w, v]; avanzan desde t0; ninguna llega a la zona de Atom (se paran antes de x 250 si van altas)
const nubes = (t, t0, L) => { for (const [x0, y, w, v] of L) { let x = x0 + (t - t0) * v; if (y < 54 && x > 250 - w * 0.6) x = 250 - w * 0.6; R.nube(Math.round(x), y, w); } };
// las nubes rosadas de la tarde (tres tonos), con la misma regla
const nubesT = (t, t0, L) => { for (const [x0, y, w, v] of L) { let x = x0 + (t - t0) * v; if (y < 54 && x > 250 - w * 0.6) x = 250 - w * 0.6; x = Math.round(x);
  const B = [[0, 0, w * 0.3], [-w * 0.3, w * 0.07, w * 0.22], [w * 0.3, w * 0.06, w * 0.24], [-w * 0.1, -w * 0.1, w * 0.24], [w * 0.14, -w * 0.07, w * 0.2]];
  for (const [dx, dy, r] of B) R.disco(Math.round(x + dx), Math.round(y + dy + 1), Math.round(r), K.nubTS);
  for (const [dx, dy, r] of B) R.disco(Math.round(x + dx), Math.round(y + dy), Math.round(r), K.nubT);
  for (const [dx, dy, r] of B) R.disco(Math.round(x + dx - 1), Math.round(y + dy - 1), Math.max(1, Math.round(r * 0.55)), K.nubTL); } };
const gaviotas = (t, L) => { for (const [x0, y0, v, k] of L) { const x = Math.round(((x0 + t * v) % 380 + 380) % 380 - 30), y = Math.round(y0 + Math.sin(t * 0.9 + k * 2) * 3); if (x > 266 && y < 50) continue; R.gaviota(x, y, t, k); } };
// cielo tramado de arriba (y0) abajo (y1) con cirros quietos (de los dos tonos más claros de la paleta)
const cieloFijo = (y1, cols = K.cielo) => { for (let y = 0; y <= y1; y++) for (let x = 0; x < 320; x++) R.pset(x, y, grad(x, y, cols, y / y1));
  for (let k = 0; k < 7; k++) { const cx = 20 + k * 37 + Math.round(H(k, 1) * 20), cy = 20 + Math.round(H(k, 2) * (y1 * 0.5)); if (cx > 262 && cy < 52) continue; for (let i = -14; i <= 14; i++) if (H(i, k) > 0.35) R.pset(cx + i, cy + Math.round(i * 0.12), cols[Math.min(cols.length - 1, cols.length - 2 + (i & 1))]); } };
// copa de árbol de tres tonos (luz arriba a la izquierda); pal: [luz viva, luz, medio, sombra]
const VERDE = [K.bosqueLL, K.bosqueL, K.bosque, K.bosqueS], OCRE = [K.tBosqueLL, K.tBosqueL, K.tBosque, K.tBosqueS];
const copa = (cx, cy, r, s = 0, pal = VERDE) => { const B = [[0, 0, 1], [-0.62, 0.28, 0.62], [0.62, 0.24, 0.66], [-0.3, -0.52, 0.56], [0.36, -0.46, 0.52], [0, 0.5, 0.6]].map(([a, b2, q]) => [Math.round(cx + a * r), Math.round(cy + b2 * r), Math.max(2, Math.round(q * r * (0.85 + H(a * 9, s, 3) * 0.3)))]);
  for (const [x, y, q] of B) R.disco(x, y, q + 1, K.k);
  for (const [x, y, q] of B) for (let j = -q; j <= q; j++) for (let i = -q; i <= q; i++) { if (i * i + j * j > q * q) continue; const gx = x + i, gy = y + j, l = (-(gx - cx) - (gy - cy) * 1.2) / (r * 1.6) + (-i - j) / (q * 3) + (H(gx >> 1, gy >> 1, s) - 0.5) * 0.7; R.pset(gx, gy, l > 0.5 ? pal[0] : l > 0.1 ? pal[1] : l > -0.4 ? pal[2] : pal[3]); }
  for (let k = 0; k < r * 2; k++) { const a = H(k, s, 7) * 6.28, d = H(k, s, 8) * r * 0.9, x = Math.round(cx + Math.cos(a) * d), y = Math.round(cy + Math.sin(a) * d); if (R.pget(x, y) !== K.k) { R.pset(x, y, pal[3]); R.pset(x - 1, y - 1, pal[0]); } } };
const tronco = (x, y0, y1, w = 3) => { for (let y = y0; y <= y1; y++) for (let i = -w; i <= w; i++) R.pset(x + i, y, Math.abs(i) === w ? K.k : i < -w / 3 ? K.maderaL : (H(i, y >> 2, x) < 0.25 ? K.maderaS : K.madera)); };
// agua con vetas que corren (vivo): en [x0, y0, x1, y1], v px/s
const vetas = (t, x0, y0, x1, y1, n, v = 6, cl = K.aguaL, cs = K.espuma) => { for (let k = 0; k < n; k++) { const y = y0 + Math.floor(H(k, 9) * (y1 - y0)), f = (y - y0) / Math.max(1, y1 - y0), L = 2 + Math.round(f * 6), x = x0 + ((H(k, 8) * (x1 - x0) + t * v * (0.6 + f)) % (x1 - x0)); R.linea(Math.round(x), y, Math.round(x + L), y, k % 3 ? cl : cs); } };
// una sierra con relieve: las laderas que miran a la izquierda (al sol) más claras, las otras en sombra con barrancos,
// manchas de bosque y la bruma que la aclara abajo. hF(x): la cresta; y1: el pie; pal: [luz, medio, sombra, bosque, bruma]
const sierra = (x0, x1, hF, y1, pal, sem = 1) => { for (let x = x0; x <= x1; x++) { const h = Math.round(hF(x)), d = hF(x + 2) - hF(x - 2);
  for (let y = h; y <= y1; y++) { const f = (y - h) / Math.max(1, y1 - h);
    let c = d < -0.5 ? pal[0] : d > 0.5 ? pal[2] : pal[1];
    if (d > 0.2 && (x * 2 + (y - h) * 3 + Math.round(H(x >> 2, y >> 2, sem) * 3)) % 9 === 0) c = pal[2];
    else if (d < -0.2 && (x * 2 - (y - h) * 3 + 99) % 11 === 0 && f > 0.12) c = pal[1];
    if (H(x, y, sem + 9) < 0.08) c = c === pal[2] ? pal[1] : pal[2]; else if (H(x, y, sem + 10) < 0.05) c = pal[0];
    if (f > 0.3 && H(x >> 1, y >> 1, sem + 3) < 0.26) { c = pal[3]; if (H(x, y, sem + 11) < 0.3) c = pal[2]; }
    if (y === h) c = d < 0 ? pal[0] : pal[1];
    if (f > 0.55 && um(x, y) < (f - 0.55) * 1.7) c = pal[4];
    R.pset(x, y, c); } }
  // los espolones: de cada cumbre baja una arista con su lado de luz y su lado de sombra
  for (let x = x0 + 3; x <= x1 - 3; x++) { const h = hF(x); if (!(h < hF(x - 3) && h <= hF(x + 3))) continue; const L = Math.round((y1 - h) * 0.75);
    for (let j = 2; j < L; j++) { const ly = Math.round(h + j); if (ly > y1 - 3) break; const lx = Math.round(x - j * 0.9 - Math.sin(j * 0.5)), rx = Math.round(x + j * 1.2 + Math.sin(j * 0.4));
      R.pset(lx, ly, pal[0]); R.pset(lx + 1, ly, pal[2]); if (rx <= x1) { R.pset(rx, ly, pal[2]); R.pset(rx - 1, ly, pal[1]); } } }
  // los barrancos: surcos que bajan de la cresta, con su canto de luz
  for (let x = x0 + 5; x < x1 - 2; x += 8 + Math.floor(H(x, 1, sem) * 8)) { const h = hF(x), L = (y1 - h) * (0.3 + H(x, 2, sem) * 0.4);
    for (let j = 0; j < L; j++) { const px = Math.round(x + Math.sin(j * 0.35 + x) * 1.5), py = Math.round(h + 3 + j); if (py > y1 - 2) break; R.pset(px, py, pal[2]); R.pset(px - 1, py, pal[0]); } }
};
// las Palisades: columnas de basalto (cada una con su arista de luz, su cara en sombra, juntas horizontales, liquen y
// óxido), el bosque de la cresta, repisas con matas y arbolitos, grietas con hierba y el pedregal del pie con árboles.
// x0–x1; top(x): la cresta; base: el pie (el agua); sem: semilla; esc: escala (1 de cerca, 0,8 más lejos)
const palisades = (x0, x1, top, base, sem = 1, esc = 1) => {
  for (let cx = x0, k = 0; cx < x1; k++) {
    const w = Math.max(3, Math.round((4 + H(k, 1, sem) * 4) * esc)), tc = Math.round(top(cx + w / 2) + H(k, 2, sem) * 3 * esc);
    const J = new Set(); for (let y = tc + 3 + Math.round(H(k, 3, sem) * 8 * esc); y < base - 2; y += Math.max(4, Math.round((7 + H(k, y, sem) * 9) * esc))) J.add(y);
    for (let x = cx; x < Math.min(x1, cx + w); x++) { const i = x - cx;
      for (let y = tc; y < base; y++) { const f = (y - tc) / Math.max(1, base - tc);
        let c = i === 0 ? K.basK : i === 1 ? K.basLL : i === 2 && w > 4 ? K.basL : i === w - 1 ? K.basS : H(x, y >> 1, sem + 5) < 0.16 ? K.basS : H(x, y, sem + 6) < 0.07 ? K.basL : K.bas;
        if (J.has(y) && i > 0) c = K.basK; else if (J.has(y - 1) && i > 0 && i < w - 1) c = K.basL;
        if (c !== K.basK && f > 0.5 && um(x, y) < (f - 0.5) * 1.5) c = K.basS;
        if (i > 0 && H(x >> 1, y >> 2, sem + 7) < 0.045) c = K.liquen; else if (i > 1 && H(x, y >> 3, sem + 8) < 0.025) c = K.oxido;
        R.pset(x, y, c); } }
    cx += w; }
  // las grietas, con hierba que asoma
  for (let k = 0; k < (x1 - x0) / 16; k++) { let x = x0 + 4 + Math.floor(H(k, 21, sem) * (x1 - x0 - 8)); const t0 = top(x), y0 = Math.round(t0 + 8 + H(k, 22, sem) * (base - t0) * 0.45), n = Math.round((8 + H(k, 23, sem) * 14) * esc);
    for (let j = 0; j < n && y0 + j < base - 6; j++) { if (H(k, j, sem + 24) < 0.3) x += H(k, j, sem + 25) < 0.5 ? -1 : 1; R.pset(x, y0 + j, K.basK); R.pset(x + 1, y0 + j, K.basL);
      if (H(k, j, sem + 26) < 0.16) { R.pset(x - 1, y0 + j, K.hierbaS); R.pset(x - 2, y0 + j - 1, K.hierba); R.pset(x - 1, y0 + j - 1, K.hierbaL); } } }
  // dos hileras de repisas, rotas: canto claro, sombra debajo, matas encima y algún arbolito
  for (const fy of [0.36, 0.62]) for (let x = x0 + 3 + Math.round(H(fy * 9, 1, sem) * 10), k = 0; x < x1 - 8; k++) { const L = 5 + Math.round(H(k, 11 + fy * 7, sem) * 9), t0 = top(x), y = Math.round(t0 + (base - t0) * fy + (H(k, 12, sem) - 0.5) * 6);
    if (y > t0 + 6 && y < base - 8) { R.linea(x, y, x + L, y, K.basLL); R.linea(x, y + 1, x + L, y + 1, K.basK); R.linea(x + 1, y + 2, x + L - 1, y + 2, K.basS);
      for (let i = 0; i <= L; i++) { const hh = Math.floor(H(x + i, y, sem + 9) * 3.4); for (let j = 1; j <= hh; j++) R.pset(x + i, y - j, j === hh ? K.hierbaL : j === 1 ? K.hierbaS : K.hierba); if (H(x + i, y, sem + 10) < 0.08) R.pset(x + i, y - hh - 1, K.flor1); }
      if (H(k, 14 + fy, sem) < 0.42) { const tx = x + Math.round(L / 2); R.linea(tx, y - 1, tx, y - 4, K.maderaS); copa(tx, y - 5 - Math.round(2 * esc), Math.max(2, Math.round(3.4 * esc)), k * 7 + sem); } }
    x += L + 7 + Math.round(H(k, 15 + fy, sem) * 16); }
  // la cresta: el bosque de encima, con copas
  for (let x = x0; x < x1; x++) { const t0 = Math.round(top(x)), hh = Math.round((4 + H(x >> 2, 1, sem) * 4) * esc); for (let y = t0 - hh; y <= t0 + Math.ceil(3 * esc) + 1; y++) R.pset(x, y, H(x >> 1, y, sem + 2) < 0.3 ? K.bosqueL : H(x, y, sem + 3) < 0.3 ? K.bosqueS : K.bosque); R.pset(x, t0 - hh - 1, K.k); }
  for (let x = x0 + 3, k = 0; x < x1 - 2; k++) { copa(x, Math.round(top(x)) - Math.round(4 * esc), Math.max(2, Math.round((3 + H(k, 51, sem) * 3) * esc)), k + sem * 13); x += Math.round((7 + H(k, 52, sem) * 6) * esc); }
  // el pedregal del pie: bloques caídos de tres tonos, con árboles
  const talud = (x) => Math.round((5 + Math.sin(x * 0.13 + sem) * 2 + H(x >> 3, 1, sem) * 3) * esc + 2);
  for (let x = x0; x < x1; x++) { const th = talud(x); for (let y = base - th; y < base; y++) R.pset(x, y, um(x, y) < 0.55 ? K.basS : K.basK); }
  for (let k = 0; k < (x1 - x0) * 0.9; k++) { const x = x0 + Math.floor(H(k, 31, sem) * (x1 - x0)), th = talud(x), y = base - 1 - Math.floor(H(k, 32, sem) * th), r = 1 + Math.floor(H(k, 33, sem) * 2.2 * esc);
    R.disco(x, y, r, K.basK); if (r > 1) R.disco(x, y, r - 1, H(k, 34, sem) < 0.5 ? K.bas : K.basL); R.pset(x - (r >> 1), y - (r >> 1), K.basLL); }
  for (let k = 0; k < (x1 - x0) / 24; k++) { const x = x0 + 6 + Math.floor(H(k, 41, sem) * (x1 - x0 - 12)), y = base - talud(x) + 2; R.linea(x, y - 4, x, y, K.maderaS); copa(x, y - Math.round(6 * esc), Math.max(2, Math.round((3.5 + H(k, 42, sem) * 2) * esc)), k + 70 + sem); }
};
