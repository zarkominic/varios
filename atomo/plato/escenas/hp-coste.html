<script type="module">
// HP-COSTE (frase 9), 2026. Tres planos:
// 1. el banco de los duendes: el contable entra con su libreta a «small project» junto a un montoncito de monedas; el duende
//    del mostrador le echa monedas y desde «spent nearly» la montaña crece; a «$200 million» aparece la cifra dorada y el
//    contable se sorprende y apunta; corta en «halfway»;
// 2. el monitor del plató con el parte de producción a toda pantalla (la tira de película que corre, la torre de monedas
//    del gasto, la barra grande del rodaje y la fila de claquetas): la barra llega a la mitad y se enciende el 50% a
//    «halfway»; detrás, el plató enfocado (la parrilla con los focos y sus haces, el muro del Gran Comedor con el ventanal,
//    el estandarte y las antorchas, el andamio con el pintor del rodillo, la tarima con los sacos y un tramoyista que lleva
//    un tablón hasta el andamio) y el suelo de hormigón con juntas, cintas, cables y el reflejo de la pantalla; el
//    contable entra por delante de las sillas vacías hasta su marca, señala la barra y luego abre la libreta y apunta;
//    el director, de pie junto al foco a la derecha, señala, levanta la claqueta y la da a «Season 2»: en la pantalla cae
//    un 2 dorado (el contable lo apunta en rojo) y a «Chamber of Secrets» aparece la puerta redonda de la serpiente, a la
//    que se le encienden los ojos; el contable pone un visto; corta en «is already»;
// 3. el corcho: la fan, de pie en el primer peldaño de la escalera de tijera (por delante de los largueros), sube la
//    ficha del 2 en la mano y la clava a «underway»; a «although» le vibra el móvil y lo saca; a «won't» se vuelve y tacha
//    el «+1» (un año) con el rotulador y a «every year» da la vuelta al reloj de arena de la bandeja, que empieza a correr;
//    se queda triste.
import * as T from '/atomo/plato/escenas/hp-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hp-coste');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const C = T.C, PZ = T.PIEZAS_HP;
const lin = (t, a0, a1) => Math.max(0, Math.min(1, (t - a0) / (a1 - a0)));
const suave = (u) => u * u * (3 - 2 * u);
const parp = (t, v = 7) => Math.sin(t * v) > 0;
const hs = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
// rectángulo que respeta R.recorte (para lo que va dentro de una pantalla o un cristal)
const rr = (x0, y0, x1, y1, c) => { x0 = Math.round(x0); x1 = Math.round(x1); for (let y = Math.round(y0); y <= Math.round(y1); y++) R.linea(x0, y, x1, y, c); };
const mez = (c, d, a) => { const ch = (s) => Math.round(((c >>> s) & 255) * (1 - a) + ((d >>> s) & 255) * a); return ((255 << 24) | (ch(16) << 16) | (ch(8) << 8) | ch(0)) >>> 0; };
const tine = (x, y, c, a) => { const p = R.pget(x, y); if (p) R.pset(x, y, mez(p, c, a)); };
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
const b4 = (x, y) => B4[((y & 3) << 2) | (x & 3)];
const K = hex('#14101c');
// una nota musical insinuada (cabeza, plica y corchete), con su contorno
const nota = (x, y, c, k = 0) => { x = Math.round(x); y = Math.round(y);
  R.rect(x - 1, y - 1, x + 4, y + 3, K); R.rect(x + 2, y - 8, x + 4, y, K); if (k % 2 === 0) R.rect(x + 4, y - 8, x + 6, y - 4, K);
  R.rect(x, y, x + 3, y + 2, c); R.pset(x, y, hex('#fff8dc')); R.rect(x + 3, y - 7, x + 3, y, c); if (k % 2 === 0) { R.pset(x + 4, y - 7, c); R.pset(x + 5, y - 6, c); R.pset(x + 5, y - 5, c); } };
// un haz de luz: tiñe el triángulo (x0, y0)–(xa, ya)–(xb, yb) hacia c, más fuerte cerca del foco
const haz = (x0, y0, xa, ya, xb, yb, c, a) => {
  const mnx = Math.max(0, Math.floor(Math.min(x0, xa, xb))), mxx = Math.min(319, Math.ceil(Math.max(x0, xa, xb))), mny = Math.max(0, Math.floor(Math.min(y0, ya, yb))), mxy = Math.min(179, Math.ceil(Math.max(y0, ya, yb)));
  const s = (px, py, ax, ay, bx, by) => (px - bx) * (ay - by) - (ax - bx) * (py - by);
  for (let y = mny; y <= mxy; y++) for (let x = mnx; x <= mxx; x++) {
    const d1 = s(x, y, x0, y0, xa, ya), d2 = s(x, y, xa, ya, xb, yb), d3 = s(x, y, xb, yb, x0, y0);
    if ((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0)) continue;
    const dd = Math.hypot(x - x0, y - y0) / Math.hypot((xa + xb) / 2 - x0, (ya + yb) / 2 - y0);
    tine(x, y, c, a * (1 - dd * 0.6) * (b4(x, y) < 0.85 ? 1 : 0.5));
  }
};
const lechuzaCarta = (x, y, t, s = 1) => { PZ.carta(R, Math.round(x), Math.round(y + 6 * s), { s }); PZ.lechuza(R, Math.round(x), Math.round(y), { vuela: true, t, s }); };

const a = (f) => en('coste', f);
const P2 = a(.412), P3 = a(.710);
const pequeno = a(.029), segun = a(.115), cuentas = a(.221), gastado = a(.295), dolares = a(.336), millones = a(.382);
const mitad = a(.412), rodaje = a(.494), temporada = a(.554), dos = a(.572), camara = a(.628), secretos = a(.664);
const enMarcha = a(.738), aunque = a(.801), avisa = a(.854), no = a(.906), cadaAno = a(.949);

// la montaña de monedas (cima en base − h), con su brillo
const montana = (cx, base, h, t) => {
  const top = base - h;
  for (let y = Math.round(top); y <= base; y++) { const w = Math.round((y - top) * 1.5 + 3);
    for (let x = cx - w; x <= cx + w; x++) { const e = x === cx - w || x === cx + w || y === Math.round(top); const n = hs(x >> 1, y >> 1, 3);
      R.pset(x, y, e ? K : n > 0.82 ? hex('#fff0a0') : n > 0.45 ? hex('#f0c040') : n > 0.15 ? hex('#d09a28') : hex('#8a5a14')); } }
  for (let k = 0; k < 14; k++) { const yy = Math.round(top + 4 + hs(k, 1) * (h - 4)), ww = (yy - top) * 1.5, xx = Math.round(cx + (hs(k, 2) - 0.5) * 2 * ww * 0.8); if (h > 6) PZ.moneda(R, xx, yy + 3); }
  for (let k = 0; k < 4; k++) { const s = Math.sin(t * 5 + k * 1.7); if (s > 0.6) { const xx = Math.round(cx + (hs(k, 7) - 0.5) * h * 1.6), yy = Math.round(top + 3 + hs(k, 8) * h * 0.7); R.pset(xx, yy - 2, hex('#ffffff')); R.pset(xx - 2, yy, hex('#ffffff')); R.pset(xx + 2, yy, hex('#ffffff')); R.pset(xx, yy + 2, hex('#ffffff')); R.pset(xx, yy, hex('#fffbe0')); } }
  R.rect(cx - Math.round(h * 1.5 + 3) - 2, base + 1, cx + Math.round(h * 1.5 + 3) + 2, base + 2, hex('#3a2a20'));
};

const p1 = (t) => {
  const o = { encuadre: 'banco' };
  T.diagon(R, t, o);
  const h = lerp(5, 9, lin(t, 0.6, gastado)) + 4 * lin(t, 3.3, 3.8) + 42 * suave(lin(t, gastado - 0.1, millones + 0.2));
  const cx = 128, base = 168;
  montana(cx, base, h, t);
  // las monedas que lanza el duende, más deprisa desde «spent»
  const lanz = []; for (let s = 0.9; s < P2; s += s < gastado ? 0.42 : 0.13) lanz.push(s);
  lanz.forEach((s0, k) => { const u = (t - s0) / 0.55; if (u <= 0 || u >= 1) return; const tx = cx + (hs(k, 9) - 0.5) * 20, ty = base - h;
    PZ.moneda(R, Math.round(lerp(200, tx, u)), Math.round(lerp(110, ty, u) - Math.sin(u * Math.PI) * 26)); });
  // el contable entra, apunta en su libreta y se sorprende con la cifra
  const u = suave(lin(t, 0.2, pequeno + 1.2)), x = Math.round(lerp(-18, 28, u));
  R.actor(EL.contable, x, 162, t, { dir: 1, anda: u > 0 && u < 1, habla: t > segun && t < cuentas + 0.6 && parp(t, 8), dedo: (t > segun + 0.2 && t < cuentas) || t > millones, sorpresa: t > dolares && t < millones + 0.1 });
  // el duende detrás del mostrador lanza las monedas
  const lanza = lanz.some((s0) => t > s0 - 0.12 && t < s0 + 0.08);
  R.actor(EL.duende, 208, 126, t, { dir: -1, sostiene: [196, lanza ? 106 : 116], habla: t > gastado && parp(t, 9), sonrisa: t > dolares });
  T.diagonDelante(R, t, o);
  // un duende trae una carretilla de monedas, la vuelca en el montón y se vuelve
  { const ida = suave(lin(t, 0.5, 2.9)), vuelta = suave(lin(t, 4.6, 6.6)), bx = Math.round(lerp(-44, 66, ida) - vuelta * 120), vuelca = lin(t, 3.0, 3.5) * (1 - lin(t, 4.2, 4.6));
    const dir = t > 4.6 ? -1 : 1, an = t > 4.6 && t < 6.6;
    R.actor(EL.duende, bx, 176, t, { dir, anda: (ida > 0 && ida < 1) || an, sonrisa: t > 3.5, salto: vuelca > 0 && vuelca < 1 ? 1 : 0 });
    const wx = dir > 0 ? bx + 14 : bx - 34, ty = 160 - Math.round(vuelca * 4);
    R.linea(dir > 0 ? bx + 12 : bx + 2, 166, dir > 0 ? wx + 4 : wx + 16, ty + 3, K);
    R.poligono([[wx, ty], [wx + 20, ty - Math.round(vuelca * 6)], [wx + 17, ty + 8], [wx + 3, ty + 8]], K); R.poligono([[wx + 1, ty + 1], [wx + 19, ty + 1 - Math.round(vuelca * 6)], [wx + 16, ty + 7], [wx + 4, ty + 7]], hex('#6a7480'));
    const ll = t < 3.2 ? 1 : 0; if (ll) for (let k = 0; k < 6; k++) PZ.moneda(R, wx + 4 + k * 3, ty + 1 - (k % 2));
    R.disco(wx + (dir > 0 ? 18 : 2), 171, 4, K); R.disco(wx + (dir > 0 ? 18 : 2), 171, 2, hex('#8a6038')); R.linea(wx + 3, ty + 8, wx + 4, 174, K); }
  for (let k = 0; k < 8; k++) { const u = (t - 3.05 - k * 0.05) / 0.45; if (u <= 0 || u >= 1) continue; PZ.moneda(R, Math.round(lerp(98, 112 + k * 2, u)), Math.round(lerp(156, 166 - h * 0.6, u) - Math.sin(u * Math.PI) * 10)); }
  // la cifra: $200000000
  const c = suave(lin(t, dolares - 0.1, dolares + 0.35));
  if (c > 0) { const y = Math.round(lerp(112, 96, c)); R.rect(74, y - 12, 182, y + 3, K); R.rect(75, y - 11, 181, y + 2, hex('#2a1a3a')); R.rect(75, y - 11, 181, y - 11, hex('#e8b830')); R.rect(75, y + 2, 181, y + 2, hex('#a87a18'));
    R.numero('$', 84, y + 1, { tam: 8 }); T.a_cifras(R, '200000000', 134, y + 1); }
};

// la claqueta en la mano: cuerpo negro con el 2 y el palo de rayas que se abre (abre 0–1)
const claqueta = (x, y, abre) => {
  R.rect(x - 7, y - 4, x + 8, y + 7, K); R.rect(x - 6, y - 3, x + 7, y + 6, hex('#22222a')); R.rect(x - 6, y - 3, x + 7, y - 3, hex('#4a4a58'));
  R.numero('2', x + 1, y + 6, { tam: 8, centro: true });
  const an = -abre * 0.5, c = Math.cos(an), s = Math.sin(an), P = (i, j) => [Math.round(x - 7 + i * c - j * s), Math.round(y - 5 + i * s + j * c)];
  R.poligono([P(0, -3), P(16, -3), P(16, 0), P(0, 0)], K);
  for (let i = 0; i < 16; i += 4) R.poligono([P(i, -2), P(i + 2, -2), P(i + 2, -1), P(i, -1)], hex('#f4f0e4'));
};
const pantalla = (t) => (R2, tt, cl) => {
  const [x0, y0, x1, y1] = cl, cx = (x0 + x1) >> 1;
  if (tt < camara - 0.15) {
    // el parte de producción a toda pantalla: papel cuadriculado azul, la tira de película que corre arriba, la torre de
    // monedas del gasto a la izquierda, la barra grande del rodaje que se llena hasta la mitad (el 50 % se enciende a
    // «halfway») y la fila de claquetas de los bloques rodados, que se van marcando
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const rej = (x - x0) % 8 === 0 || (y - y0) % 8 === 0;
      R.pset(x, y, rej ? hex('#24305a') : mez(hex('#101834'), hex('#1a2448'), (y - y0) / (y1 - y0) + (b4(x, y) - 0.5) * 0.35)); }
    for (let y = y0 + 1; y <= y1; y += 3) for (let x = x0; x <= x1; x += 2) tine(x, y, hex('#000010'), 0.18);
    // la tira de película (y0+2 … y0+12) con sus fotogramas: velas, almenas y estrellas que pasan
    rr(x0, y0 + 2, x1, y0 + 12, hex('#0a0a10'));
    const desl = Math.floor(tt * 14) % 6; for (let x = x0 - 6 + (6 - desl); x <= x1; x += 6) { R.pset(x, y0 + 3, hex('#c8c8d0')); R.pset(x + 1, y0 + 3, hex('#c8c8d0')); R.pset(x, y0 + 11, hex('#c8c8d0')); R.pset(x + 1, y0 + 11, hex('#c8c8d0')); }
    const fd = Math.floor(tt * 14) % 18; for (let i = -1; i < 9; i++) { const fx = x0 + 2 + i * 18 - fd; if (fx > x1) break; const k = (i + Math.floor(tt * 14 / 18)) % 3;
      rr(fx, y0 + 5, fx + 14, y0 + 9, k === 0 ? hex('#3a2a4a') : k === 1 ? hex('#1a2a4a') : hex('#2a3a2a'));
      if (k === 0) for (let j = 0; j < 3; j++) { R.linea(fx + 3 + j * 4, y0 + 7, fx + 3 + j * 4, y0 + 9, hex('#f4ecd8')); R.pset(fx + 3 + j * 4, y0 + 6, hex('#ffd36a')); }
      else if (k === 1) { R.linea(fx + 2, y0 + 9, fx + 12, y0 + 9, hex('#0a0c1e')); for (let j = 0; j < 4; j++) R.linea(fx + 3 + j * 3, y0 + 7 - (j % 2), fx + 3 + j * 3, y0 + 9, hex('#0a0c1e')); R.pset(fx + 11, y0 + 5, hex('#f0ecd8')); }
      else { R.pset(fx + 4, y0 + 6, hex('#fff4b0')); R.pset(fx + 9, y0 + 8, hex('#fff4b0')); R.linea(fx + 6, y0 + 9, fx + 12, y0 + 7, hex('#6ad08a')); } }
    // la torre de monedas del gasto (crece un poco al principio del plano), con su brillo que corre
    const tb = y1 - 12, alto = Math.round(lerp(26, 34, suave(lin(tt, mitad - 0.2, rodaje + 0.2)))), tx = x0 + 15;
    for (let k = 0; k < alto; k += 2) { const yy = tb - k, w = 9 - ((k >> 1) % 3 === 0 ? 0 : 1);
      R.linea(tx - w, yy, tx + w, yy, hex('#8a5a14')); R.linea(tx - w + 1, yy - 1, tx + w - 1, yy - 1, (k >> 1) % 2 ? hex('#f0c040') : hex('#d09a28')); R.pset(tx - w + 2, yy - 1, hex('#fff0a0')); }
    { const by = tb - ((Math.floor(tt * 10) * 2) % alto); R.linea(tx - 7, by - 1, tx - 3, by - 1, hex('#ffffff')); }
    R.linea(tx - 11, tb + 1, tx + 11, tb + 1, hex('#e8eef6'));
    // la monedita que cae en la torre cada poco
    { const u = (tt * 1.3) % 1, my = Math.round(lerp(y0 + 14, tb - alto - 2, suave(u))); if (u < 0.9) { R.linea(tx - 3, my, tx + 3, my, hex('#8a5a14')); R.linea(tx - 2, my - 1, tx + 2, my - 1, hex('#fff0a0')); } }
    // la barra del rodaje: marco claro, el fondo con su raya, el relleno de oro con las juntas de los rollos y su brillo
    const bx0 = x0 + 34, bx1 = x1 - 8, byA = y0 + 22, byB = y0 + 38, p = lerp(0.36, 0.5, suave(lin(tt, mitad - 0.1, rodaje + 0.3)));
    rr(bx0 - 2, byA - 2, bx1 + 2, byB + 2, hex('#e8eef6')); rr(bx0 - 1, byA - 1, bx1 + 1, byB + 1, hex('#0a0a14')); rr(bx0, byA, bx1, byB, hex('#1a1a2a'));
    for (let y = byA; y <= byB; y++) for (let x = bx0; x <= bx1; x++) if (((x + y) & 3) === 0) R.pset(x, y, hex('#242438'));
    const fx = Math.round(bx0 + (bx1 - bx0) * p);
    for (let x = bx0; x <= fx; x++) for (let y = byA; y <= byB; y++) { const v = (y - byA) / (byB - byA); let c = v < 0.2 ? hex('#fff0a0') : v < 0.6 ? hex('#f0c040') : v < 0.85 ? hex('#d09a28') : hex('#8a5a14'); if ((x - bx0) % 9 === 0) c = hex('#8a5a14'); R.pset(x, y, c); }
    { const sx = bx0 + Math.round(((tt * 40) % (fx - bx0 + 20))) - 10; R.recorte([bx0, byA, fx, byB]); for (let j = 0; j < 4; j++) R.linea(sx + j, byA + 1, sx + j - 4, byB - 1, hex('#fffbe0')); R.recorte(cl); }
    // la marca de la mitad: raya discontinua, flecha roja y el 50% que se enciende al llegar
    const mxm = Math.round((bx0 + bx1) / 2), llega = p >= 0.495;
    for (let y = byA - 6; y <= byB + 4; y += 2) R.pset(mxm, y, llega && parp(tt, 9) ? hex('#ffffff') : hex('#ff6060'));
    R.poligono([[mxm - 3, byA - 8], [mxm + 3, byA - 8], [mxm, byA - 4]], hex('#ff4040'));
    if (llega) { R.numero('50%', mxm + 22, byA - 3, { centro: true }); if (tt < rodaje + 1.2) for (let k = 0; k < 8; k++) { const r = (tt - (rodaje + 0.3)) * 30; if (r > 0) R.pset(Math.round(mxm + Math.cos(k * 0.8) * r), Math.round((byA + byB) / 2 + Math.sin(k * 0.8) * r * 0.6), hex('#fff4b0')); } }
    // la fila de claquetas: los bloques de rodaje; los rodados se marcan en oro a medida que avanza la barra
    for (let i = 0; i < 8; i++) { const cx0 = bx0 + 2 + i * 11, cy0 = byB + 6, hecha = (i + 0.5) / 8 < p;
      rr(cx0, cy0 + 2, cx0 + 8, cy0 + 7, hecha ? hex('#f0c040') : hex('#3a3a52')); rr(cx0, cy0, cx0 + 8, cy0 + 1, hecha ? hex('#fff0a0') : hex('#5a5a72'));
      R.pset(cx0 + 2, cy0, hex('#0a0a14')); R.pset(cx0 + 5, cy0, hex('#0a0a14')); if (hecha) { R.pset(cx0 + 3, cy0 + 5, hex('#2a6a2a')); R.pset(cx0 + 4, cy0 + 6, hex('#2a6a2a')); R.pset(cx0 + 5, cy0 + 4, hex('#2a6a2a')); R.pset(cx0 + 6, cy0 + 3, hex('#2a6a2a')); } }
    // a «Season 2» cae el 2 dorado en la mitad que falta de la barra
    if (tt > temporada - 0.2) { const s = suave(lin(tt, temporada - 0.2, dos)), dx = Math.round((mxm + bx1) / 2); for (let y = byA; y <= byB; y++) for (let x = mxm + 1; x <= bx1; x++) if (b4(x, y) < 0.6 * s) tine(x, y, hex('#3a2a10'), 0.6);
      R.numero('2', dx, Math.round(lerp(y0 - 4, y0 + 44, s)), { tam: 32, centro: true }); if (tt > dos && tt < dos + 0.4) for (let k = 0; k < 8; k++) R.pset(Math.round(dx + Math.cos(k * 0.8) * (tt - dos) * 60), Math.round(y0 + 30 + Math.sin(k * 0.8) * (tt - dos) * 40), hex('#fff4b0')); }
  } else {
    // la cámara secreta: el muro de piedra verde y la puerta redonda con la serpiente; a «Secrets» le brillan los ojos
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const fila = Math.floor((y - y0) / 7), junta = (y - y0) % 7 === 0 || (x + fila * 9) % 18 === 0; R.pset(x, y, junta ? hex('#0e1a14') : mez(hex('#1e3a2a'), hex('#2a4a36'), hs(x >> 2, y >> 2, 5) * 0.6)); }
    const r = 24, cy = (y0 + y1) >> 1; R.disco(cx, cy, r + 3, K); R.disco(cx, cy, r + 2, hex('#5a6a5a')); R.disco(cx, cy, r, hex('#3a4a3e'));

const p2 = (t) => {
  const o = { encuadre: 'plato', camara: 'monitor', pantalla: pantalla(t) };
  T.hoy(R, t, o);
  fondoPlato(t); sillasPlato(); sueloPlato(t, t > camara - 0.15);
  // el contable llega por delante de las sillas vacías hasta su marca de cinta azul, señala la barra mientras sube y
  // luego abre la libreta y apunta (las cifras, el 2 de la segunda temporada y el visto de «Chamber»); el director, de pie
  // junto al foco, señala la barra, levanta la claqueta, la da a «Season 2» (golpe con sus rayitas) y la baja
  const ll = suave(lin(t, P2, P2 + 1.5)), cxx = Math.round(lerp(-14, 92, ll)), apunta = t > rodaje + 0.3;
  const c = R.actor(EL.contable, cxx, 176, t, { dir: 1, anda: ll > 0 && ll < 1, habla: t > P2 + 1.5 && t < rodaje + 0.3 && parp(t, 8), sorpresa: t > dos && t < dos + 0.7,
    dedo: t > P2 + 1.6 && !apunta, sostiene: apunta ? [111, 160] : undefined, sonrisa: t > secretos + 0.3 });
  if (apunta) { const [hx, hy] = c.mano, esc = (t > rodaje + 0.5 && t < dos - 0.1) || (t > dos + 0.2 && t < dos + 0.8) || (t > camara + 0.2 && t < camara + 0.8); libreta(hx, hy, t, lin(t, rodaje + 0.5, dos), esc); }
  const conClaq = t > rodaje + 0.1 && t < camara + 0.5, golpe = t > dos - 0.12 && t < dos + 0.25 ? 2 : 0;
  const d = R.actor(EL.director, 270, 168, t, { dir: -1, dedo: (t > mitad && t < rodaje) || t > secretos, habla: ((t > mitad && t < rodaje) || t > secretos) && parp(t, 7), sostiene: conClaq ? [254, 138 + golpe * 2] : undefined, sonrisa: t > dos });
  if (conClaq) { const ab = t < temporada - 0.3 ? lin(t, rodaje + 0.1, rodaje + 0.5) : 1 - lin(t, dos - 0.12, dos); const [hx, hy] = d.mano; claqueta(hx - 6, hy - 6, ab);
    if (t > dos && t < dos + 0.35) { const r = Math.round(3 + (t - dos) * 20); for (const [dx, dy] of [[-1, -1], [0, -1], [1, -1], [-1, 0]]) R.linea(hx - 6 + dx * (r + 6), hy - 11 + dy * r, hx - 6 + dx * (r + 9), hy - 11 + dy * (r + 3), hex('#fff4b0')); } }
};

const p3 = (t) => {
  T.hoy(R, t, { encuadre: 'corcho' });
  // las fichas: el 2 (sube en la mano de la fan y se clava a «underway»), el +1 (un año, a la izquierda) y el reloj de
  // arena en la bandeja de la escalera
  const clava = t > enMarcha;
  const ficha2 = (x, y) => { R.rect(x + 2, y + 2, x + 28, y + 34, hex('#3a2a1a')); R.rect(x, y, x + 26, y + 32, K); R.rect(x + 1, y + 1, x + 25, y + 31, hex('#f4ecd4'));
    R.numero('2', x + 14, y + 22, { tam: 16, centro: true }); for (let k = 0; k < 14; k++) R.pset(x + 6 + k, y + 27 + Math.round(Math.sin(k * 0.9) * 1.5), hex('#2a8a4a')); R.pset(x + 20, y + 26, hex('#2a8a4a')); };
  if (clava) { ficha2(198, 93); R.disco(211, 94, 2, K); R.disco(211, 94, 1, hex('#e83030')); }
  const PX = 146, PY = 94;
  R.rect(PX + 2, PY + 2, PX + 28, PY + 18, hex('#3a2a1a')); R.rect(PX, PY, PX + 26, PY + 16, K); R.rect(PX + 1, PY + 1, PX + 25, PY + 15, hex('#c8e0f0')); R.numero('+1', PX + 14, PY + 12, { tam: 8, centro: true }); R.disco(PX + 13, PY + 1, 1, hex('#3a6ad8'));
  // la X roja que tacha el +1 a «won't»
  const x1 = lin(t, no, no + 0.2), x2 = lin(t, no + 0.22, no + 0.42);
  for (let k = 0; k <= 22 * x1; k++) R.rect(PX + 2 + k, PY + 2 + Math.round(k * 0.5), PX + 3 + k, PY + 3 + Math.round(k * 0.5), hex('#e02828'));
  for (let k = 0; k <= 22 * x2; k++) R.rect(PX + 24 - k, PY + 2 + Math.round(k * 0.5), PX + 25 - k, PY + 3 + Math.round(k * 0.5), hex('#e02828'));
  // la escalera de tijera, entera por detrás de la fan: las patas de atrás, los largueros, los peldaños, la tapa de arriba
  // y la bandeja de la izquierda
  const ma = hex('#8a6038'), md = hex('#5a3a22'), mc = hex('#b08050');
  R.linea(194, 121, 212, 160, K); R.linea(195, 121, 213, 160, md); R.linea(197, 141, 206, 141, md);
  R.linea(179, 121, 173, 160, K); R.linea(180, 121, 174, 160, ma); R.linea(181, 121, 175, 160, mc);
  R.linea(197, 121, 203, 160, K); R.linea(196, 121, 202, 160, ma);
  for (const y of [132, 143, 154]) { const xa = Math.round(180 - (y - 121) * 6 / 39), xb = Math.round(196 + (y - 121) * 6 / 39); R.rect(xa, y, xb, y + 2, K); R.rect(xa + 1, y, xb - 1, y, mc); R.rect(xa + 1, y + 1, xb - 1, y + 1, ma); }
  R.rect(177, 118, 199, 121, K); R.rect(178, 118, 198, 119, mc); R.rect(178, 120, 198, 120, ma);
  R.linea(177, 129, 159, 129, K); R.rect(159, 130, 177, 131, ma); R.rect(159, 130, 177, 130, mc); R.rect(159, 132, 177, 132, K); R.linea(163, 133, 175, 139, md);
  for (const x of [172, 204, 213]) R.rect(x - 1, 160, x + 2, 161, hex('#2a1a10'));
  // el reloj de arena en la bandeja: a «every year» la fan le da la vuelta y la arena empieza a correr
  const gira = lin(t, cadaAno - 0.05, cadaAno + 0.35), cy = 121, hx0 = 168, sq = Math.abs(Math.cos(gira * Math.PI));
  { const hh = Math.max(1, Math.round(7 * sq)); R.rect(hx0 - 6, cy - hh - 1, hx0 + 6, cy - hh, hex('#6a4224')); R.rect(hx0 - 6, cy + hh, hx0 + 6, cy + 1 + hh, hex('#6a4224'));
    R.rect(hx0 - 5, cy - hh, hx0 - 5, cy + hh, hex('#4a2a14')); R.rect(hx0 + 5, cy - hh, hx0 + 5, cy + hh, hex('#4a2a14'));
    for (let j = -hh + 1; j < hh; j++) { const w = Math.max(1, Math.round(Math.abs(j) / hh * 4)); R.rect(hx0 - w, cy + j, hx0 + w, cy + j, hex('#d8eef8')); R.pset(hx0 - w, cy + j, hex('#ffffff')); }
    if (gira >= 1) { const corre = lin(t, cadaAno + 0.35, cadaAno + 6); for (let j = -hh + 1; j < 0; j++) { const w = Math.max(0, Math.round(Math.abs(j) / hh * 4) - 1); if (-j < (1 - corre) * hh) R.rect(hx0 - w, cy + j, hx0 + w, cy + j, hex('#e8b830')); }
      for (let j = 1; j < hh; j++) { const w = Math.max(0, Math.round(j / hh * 4) - 1); if (hh - j < corre * hh + 1) R.rect(hx0 - w, cy + j, hx0 + w, cy + j, hex('#e8b830')); } if (parp(t, 20)) R.linea(hx0, cy, hx0, cy + 6, hex('#e8b830')); }
    else for (let j = 1; j < hh; j++) { const w = Math.max(0, Math.round(j / hh * 4) - 1); R.rect(hx0 - w, cy + j, hx0 + w, cy + j, hex('#e8b830')); } }
  // la fan, de pie en el primer peldaño y por delante de la escalera: sube la ficha y la clava; saca el móvil cuando
  // vibra; se vuelve a la izquierda a tachar el +1 con el rotulador y a dar la vuelta al reloj
  const sube = suave(lin(t, P3 + 0.2, enMarcha - 0.2)), movil = t > aunque - 0.1 && t < avisa + 0.2, tacha = t > avisa + 0.2 && t < no + 0.45, gira2 = t > no + 0.45 && t < cadaAno + 0.5;
  const izq = tacha || gira2 || t > no + 0.45;
  const objetivo = !clava ? [212, Math.round(lerp(132, 116, sube))] : movil ? true : tacha ? [172, 108 + Math.round(lin(t, no, no + 0.42) * 2)] : gira2 ? [172, 121] : undefined;
  const f = R.actor(EL.adolescente, 181, 132, t, { dir: izq ? -1 : 1, sostiene: objetivo,
    dedo: t > enMarcha && t < enMarcha + 0.3, sorpresa: t > aunque + 0.1 && t < avisa + 0.1, triste: t > cadaAno + 0.5, sonrisa: t > enMarcha + 0.3 && t < aunque });
  if (!clava) { const [hx, hy] = f.mano; ficha2(hx - 4, hy - 26); }
  if (tacha) { const [hx, hy] = f.mano; R.linea(hx, hy, hx - 6, hy - 5, K); R.linea(hx - 1, hy, hx - 5, hy - 4, hex('#e02828')); R.pset(hx - 6, hy - 5, hex('#e02828')); }
  if (movil) { const [hx, hy] = f.mano, vx = hx - 1 + (parp(t, 40) && t < avisa ? 1 : 0); R.rect(vx, hy - 6, vx + 3, hy, K); R.rect(vx + 1, hy - 5, vx + 2, hy - 1, hex('#6ab0f0')); if (t < avisa) R.bocadillo?.(196, 96, { icono: '!' }); }
};

const efectos = [[pequeno + 0.2, 'carro'], [gastado + 0.1, 'campana'], [dolares, 'brillo'], [mitad + 0.3, 'tic'], [dos - 0.02, 'toc'], [camara, 'cerrojo'], [enMarcha, 'golpecito'], [aunque + 0.05, 'zumbido'], [no, 'lapiz'], [cadaAno + 0.2, 'tic']];
T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3]], { efectos, año: 2026 });
</script>
