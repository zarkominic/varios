// Prueba de identidad · dibujo a mano (a partir de estilos/14-dibujo-a-mano.html).
// Página de cuaderno pautada: lápiz azul de construcción, grafito, tinta, lápiz rojo, lápiz marrón
// para el pelo y un toque de rotulador fluorescente. Los trazos tienen presión, se dibujan solos y
// «hierven» a 12 fps (como en el demo); al final se quedan quietos. La regla de potencias de diez
// está en una tira de papel pegada con cinta a la derecha.
// [hola] Atom bota y saluda con un electrón. [atom] crece sobre un círculo de fluorescente, rayos
// rojos y electrones acelerados. [bloques] cinco átomos llegan y se dibujan los enlaces de un anillo.
// [explico] se dibuja una pizarrita con «?»; [escuela] la goma lo borra y se escribe «!» en rojo.
// [saltos]→[pelo] cuatro zooms ×10: alrededor del destino se dibuja un círculo de detalle, dentro se
// dibuja el nivel siguiente y la cámara se zambulle en él (persona → mano → piel con vello → pelo que
// sale de la piel → el pelo como un tronco). [decima]→[milimetro] cota roja de lado a lado del pelo.

// ---------- tiempos (todo sale de las marcas) ----------
const T = {

T.quieto = DUR - 0.6;
T.calma0 = Math.min(T.mmF, T.quieto - 0.25);
T.d = (T.pelo - T.saltos) / 4;

// ---------- utilidades ----------

const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

const mat = (s, x, y, rot = 0) => [Math.cos(rot) * s, Math.sin(rot) * s, -Math.sin(rot) * s, Math.cos(rot) * s, x, y];

const fromPts = (L) => { const P = new Float32Array(L.length * 2); L.forEach(([x, y], i) => { P[2 * i] = x; P[2 * i + 1] = y; }); return P; };

function svgPts(d, n = 10) {

    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], d = Math.hypot(x1 - x0, y1 - y0);

// ---------- trazo con presión + boiling (del demo; con matriz, recorte y descarte) ----------

let EN_CACHE = false;

    let x = P[2 * i], y = P[2 * i + 1];
    if (m) { const xx = m[0] * x + m[2] * y + m[4]; y = m[1] * x + m[3] * y + m[5]; x = xx; }
    if (i) L += Math.hypot(x - px, y - py);

    if (x < xa) xa = x; if (x > xb) xb = x; if (y < ya) ya = y; if (y > yb) yb = y;
  }
  if (L < 0.8) return;
  const mg = o.w + 6;
  if (CAJA && (xb < CAJA[0] - mg || xa > CAJA[2] + mg || yb < CAJA[1] - mg || ya > CAJA[3] + mg)) return;

  if (prog < 1) {
    const Lv = L * prog;
    for (let i = 1; i < n; i++) {
      if (BS[i] >= Lv) {
        const u = (Lv - BS[i - 1]) / Math.max(1e-6, BS[i] - BS[i - 1]);
        BX[i] = BX[i - 1] + (BX[i] - BX[i - 1]) * u; BY[i] = BY[i - 1] + (BY[i] - BY[i - 1]) * u; BS[i] = Lv;
        k = i + 1; break;

    }
  }

  const f1 = TAU / (55 + 120 * hsh(sd, b * 8 + 1)), f2 = TAU / (55 + 120 * hsh(sd, b * 8 + 2));

const seqP = (t, t0, t1, i, n, ov = 0.6) => seg(t, t0 + (t1 - t0) * i / n, t0 + (t1 - t0) * Math.min(1, (i + 1 + ov) / n));
// texto manuscrito (con matriz: se escala y se mueve con el dibujo)
function write(g, str, x, y, o) {
  const prog = o.prog === undefined ? 1 : o.prog;
  if (prog <= 0) return;
  const m = o.m || ID, sc = Math.hypot(m[0], m[1]);
  const [X, Y] = ap(m, x, y);

  if (fs < 2) return;

  g.font = `${o.weight || 700} ${size * S}px ${FONT}`; const w10 = g.measureText('10').width / S;
  g.font = `${o.weight || 700} ${size * 0.62 * S}px ${FONT}`; const sE = (exp < 0 ? '-' : '') + Math.abs(exp), wE = g.measureText(sE).width / S;

// Papel de cuaderno: grano, fibras, pauta azul y margen rojo

function ultimaLlegada(t) { let L = null; for (let j = 0; j < 4; j++) if (t >= T.llegada[j]) L = { j, tau: t - T.llegada[j] }; return L; }
const RC = 112;   // radio del círculo de detalle (×10 cubre la página)
function aparece(k) { return k === 1 ? T.saltos - 0.3 : T.saltos + (k - 1) * T.d - 0.02; }   // cuándo empieza a dibujarse el nivel k
let NIV = [];
// Cachés: cada nivel ya dibujado se guarda como imagen (el 0 y el 4, en tres variantes que se
// alternan: el «boiling» clásico de dos o tres dibujos). Se usan mientras el nivel no está muy
// ampliado; ampliado, se dibuja en vectorial (y ya solo se ve un trozo).
let CACHE = [];
function patronesEn(ox, oy) {
  const k = Math.max(0.42, Math.min(1, S));
  for (const p of Object.values(PAT)) if (p && p.setTransform) p.setTransform(new DOMMatrix([k, 0, 0, k, ox, oy]));
  PAPERPAT.setTransform(new DOMMatrix([1, 0, 0, 1, ox, oy]));
}
const EXT = { x0: -280, y0: -640, x1: W + 280, y1: H + 640 }, CRES = 0.8;
let CACHE_EXT = [];
function construirCaches() {
  CACHE = []; CACHE_EXT = [];
  const s0 = S, ox = OX, oy = OY; EN_CACHE = true;
  OX = 0; OY = 0; patronesEn(0, 0); CAJA = [-40, -40, W + 40, H + 40];
  for (let k = 0; k <= 4; k++) {

    if (k === 0 || k === 4) for (let v = 0; v < 3; v++) { const c = mk(W * S, H * S); dibuja(c.getContext('2d'), NIV[k], ID, 1, 1, 7001 + v * 17); vs.push(c); }
    CACHE.push(vs);

  for (let k = 0; k <= 4; k++) {

    const c = mk((EXT.x1 - EXT.x0) * S, (EXT.y1 - EXT.y0) * S); dibuja(c.getContext('2d'), NIV[k], ID, 1, 1, 7001); CACHE_EXT.push(c);
  }
  S = s0; EN_CACHE = false; OX = ox; OY = oy; patronesEn(OX, OY); CAJA = [-40, -40, W + 40, H + 40];
}
function pintaCache(g, c, m, alta, ext) {

  if (ext) { const A = [m[0] / CRES, m[1] / CRES, m[2] / CRES, m[3] / CRES], [ex, ey] = ap(m, EXT.x0, EXT.y0); g.setTransform(A[0], A[1], A[2], A[3], ex * S + OX, ey * S + OY); }

}
function pintaNivel(g, k, t, b, m, sc) {

  const quieto = Math.abs(sc - 1) < 1e-3;
  if (p >= 1 && quieto && CACHE[k].length) pintaCache(g, CACHE[k][((b % 3) + 3) % 3], m, false, false);
  else if (p >= 1 && k === 0 && sc <= 1.5) pintaCache(g, CACHE[0][0], m, false, false);
  else if (p >= 1 && k > 0 && sc <= 1.15) pintaCache(g, CACHE_EXT[k], m, sc < 0.75, true);
  else dibuja(g, NIV[k], m, sc, p, b);
  if (k === 0) nivel0dyn(g, t, b, m, sc);
  if (k === 4 && sc > 0.99) cota(g, t, b);
}

function dibujar(tIn) {
  tIn = Math.max(0, tIn);
  const st = Math.min(Math.floor(tIn * FPS + 1e-6), Math.floor(T.quieto * FPS));
  const t = Math.min(tIn, Math.floor(tIn * FPS + 1e-6) / FPS), b = st;
  const g = ctx;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.fillStyle = rgba(COL.paper, 1); g.fillRect(0, 0, cw, ch);
  g.drawImage(PAPER, OX, OY);
  // golpe en cada llegada: el dibujo da una sacudida
  const L = ultimaLlegada(t);
  let sx = 0, sy = 0;
  if (L && L.tau < 0.6) { const a = 12 * Math.exp(-L.tau * 9); sx = a * Math.sin(L.tau * 83); sy = a * 0.7 * Math.cos(L.tau * 67); }
  const SH = [1, 0, 0, 1, sx, sy];
  const cam = camara(t), k = cam.k, s = Math.pow(10, cam.z), F = k < 4 ? FS[k] : PC;
  const Mk = mul(SH, zoomM(F, s));
  CAJA = [-40, -40, W + 40, H + 40];
  pintaNivel(g, k, t, b, Mk, s);
  // círculo de detalle con el nivel siguiente
  const pop = k < 4 ? (k === 0 && cam.salto < 0 ? (t >= T.saltos - 0.3 ? eback(seg(t, T.saltos - 0.3, T.saltos - 0.04), 1.6) : 0) : cam.salto >= 0 ? eback(seg(cam.u, 0, 0.2), 1.6) : 0) : 0;
  if (pop > 0.001) {
    const Q = QS[k], [cx, cy] = ap(Mk, Q.x, Q.y), r = RC * s * pop;
    // líneas de velocidad hacia el círculo
    const v = cam.salto >= 0 ? velZoom(cam) : 0;
    if (v > 0.08) for (let i = 0; i < 26; i++) {
      const a = (i + hsh(i, b)) / 26 * TAU, r0 = r * 1.12 + 30 * hsh(i, b + 1), r1 = r0 + (90 + 220 * hsh(i, b + 2)) * v;
      stroke(g, lineP(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0, cx + Math.cos(a) * r1, cy + Math.sin(a) * r1, 8), { w: 2.2, fill: PAT.graphite, alpha: 0.75 * v, seed: 900 + i, b, amp: 0.6, tin: 4, tout: 40 });
    }
    g.save();
    g.beginPath(); g.arc(cx * S + OX, cy * S + OY, r * S, 0, TAU); g.fillStyle = PAPERPAT; g.fill(); g.clip();
    const Mi = mul(Mk, [pop / 10, 0, 0, pop / 10, Q.x - PC.x * pop / 10, Q.y - PC.y * pop / 10]);
    CAJA = [cx - r - 20, cy - r - 20, cx + r + 20, cy + r + 20];
    pintaNivel(g, k + 1, t, b, Mi, s * pop / 10);
    CAJA = [-40, -40, W + 40, H + 40];
    g.restore();
    // el círculo a lápiz (se dibuja al aparecer)
    const pc = k === 0 ? seg(t, T.saltos - 0.3, T.saltos - 0.08) : seg(cam.u, 0, 0.25);
    stroke(g, arcP(cx, cy, r + 2, r + 2, -1.2, -1.2 + TAU + 0.35, 0, 120), { w: 3, fill: COL.ink, alpha: 0.9, prog: pc, seed: 950 + k, b, amp: 1.2, press: 0.45, tin: 20, tout: 40 });
    stroke(g, arcP(cx + 2, cy - 1, r + 7, r + 5, 0.4, 0.4 + TAU * 0.6, 0, 80), { w: 1.4, fill: PAT.blue, alpha: 0.6, prog: pc, seed: 960 + k, b, amp: 1 });
  }
  // Atom (no se amplía: viaja con la cámara)
  dibujarAtom(g, t, b, SH);
  regla(g, t, b);
}

function estadoAtom(t) {
  const P = posAtom(t);
  let sc = A_SC * (1 + 0.32 * eback(seg(t, T.atom - 0.26, T.atom), 2.2) * (1 - eio(seg(t, T.atom + 0.55, T.atom + 1.25))));
  if (t >= T.saltos) { let n = 0; for (let j = 0; j < 4; j++) n += eio(seg(t, T.saltos + j * T.d + T.d * 0.55, T.saltos + (j + 1) * T.d + 0.05)); sc = A_SC * Math.pow(A_SC_FIN / A_SC, n / 4); }
  const mano = sstep(T.hola - 0.24, T.hola - 0.02, t) * (1 - sstep(T.holaF + 0.22, T.atom - 0.14, t));
  const manoAng = -PI / 2 + 0.5 + 0.55 * Math.sin((t - T.hola + 0.12) * 12.5);
  const vel = 1 + 2 * sstep(T.atom - 0.28, T.atom, t) * (1 - sstep(T.atom + 0.4, T.atom + 1.4, t)) + 1.2 * sstep(T.saltos, T.saltos + 0.2, t) * (1 - sstep(T.pelo, T.pelo + 0.5, t));

}
function dibujarAtom(g, t, b, SH) {
  const A = estadoAtom(t);
  A.x += SH[4]; A.y += SH[5];
  const r = ORX * A.sc;
  // presentación: círculo de fluorescente y rayos rojos
  const br = seg(t, T.atom - 0.24, T.atom) * (1 - seg(t, T.atom + 0.9, T.atom + 1.25));
  if (br > 0) {
    stroke(g, arcP(A.x, A.y, r * 0.95, r * 0.9, -2.6, -2.6 + TAU * 1.05, 0.1, 70), { w: 46, fill: PAT.yellow, alpha: 0.55 * br, prog: seg(t, T.atom - 0.24, T.atom - 0.04), seed: 990, b, amp: 2, tin: 20, tout: 40, press: 0.3, minw: 0.4 });

    if (v > 150) { const ux = vx / Math.hypot(vx, vy), uy = vy / Math.hypot(vx, vy); for (const k of [-0.6, 0, 0.6]) stroke(g, lineP(A.x - ux * r * 0.7 - uy * k * r * 0.6, A.y - uy * r * 0.7 + ux * k * r * 0.6, A.x - ux * (r * 0.7 + Math.min(240, v * 0.25)) - uy * k * r * 0.6, A.y - uy * (r * 0.7 + Math.min(240, v * 0.25)) + ux * k * r * 0.6, 8), { w: 2.2, fill: PAT.graphite, alpha: 0.8 * cl((v - 150) / 500), seed: 1030 + (k > 0 ? 2 : k < 0 ? 1 : 0), b, amp: 0.6, tin: 40, tout: 4 }); }
  }

}

// ---------- arranque ----------
function layout() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = Math.max(1, Math.round(window.innerWidth * dpr)); ch = Math.max(1, Math.round(window.innerHeight * dpr));

  S = Math.min(cw / W, ch / H); OX = Math.round((cw - W * S) / 2); OY = Math.round((ch - H * S) / 2);

  const k = Math.max(0.42, Math.min(1, S));

const link = document.getElementById('fuentes');
if (!link.sheet) await new Promise((r) => { link.addEventListener('load', r, { once: true }); link.addEventListener('error', r, { once: true }); setTimeout(r, 8000); });
try { await document.fonts.load(`700 116px Caveat`, '10 m ?!-01234'); await document.fonts.load(`600 52px Caveat`, '10 m -01234'); await document.fonts.ready; } catch (e) { /* reserva */ }
buildPatterns();
construirNucleo();
NIV = [construirNivel0(), construirNivel1(), construirNivel2(), construirNivel3(), construirNivel4()];
SOCIO_L = construirSocio(); PIZ_L = orden(construirPizarra(), 0, 1); REGLA_L = construirRegla();
