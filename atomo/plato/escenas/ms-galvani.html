// 1. el cuarto congelado (p12): Atom al doble entra, niega en «poets' fantasy» («X»), «1780» en «1780s»;
// 2. los retratos de sus padres congelados (p7, Mary recién entrada por la izquierda; otro cuarto, no el salón): Atom
//    saca la mesa de Galvani (T.pausa 'galvani') con una vela encendida delante del retrato de la madre; en «discovered»

// 3. el vestíbulo congelado (p9): Atom llega a su sitio y la tarjeta del mapa de Europa sube desde abajo (mapa antiguo:

//    en «spark of life» la chispa sube y se vuelve un corazón.
import * as T from '/atomo/plato/escenas/ms-comun.js';

R.ICONOS.rayo = ['..##.', '.##..', '####.', '..##.', '.##..', '##...'];

// ── texturas y piezas de la casa (Villa Diodati, 1816) ──

const NUB_G = [pal('#5a6272', '#6e7684', '#848c98'), pal('#6a7282', '#828a96', '#9aa0aa'), pal('#7e8692', '#9aa0aa', '#b8bcc4')];
// papel pintado de damasco (rombos con su flor y rayas finas); la esquina de Atom (x > 268, y < 50) queda lisa y en sombra
const damasco = (x0, y0, x1, y1, cols, sem = 0, luz = null) => {
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const cx = ((x + 9) % 18) - 9, cy = ((y + 12 + ((Math.floor((x + 9) / 18) & 1) ? 12 : 0)) % 24) - 12, d = Math.abs(cx) + Math.abs(cy) * 0.72;
    const sombra = (y - y0) / (y1 - y0 + 1) * -0.5 + (luz ? luz(x, y) : 0);
    let v = 1.4 + sombra + hh(x >> 1, y >> 1, sem) * 0.35;
    if (!(x > 266 && y < 52)) { if ((d > 5 && d < 6.3) || d < 1.6 || (Math.abs(cx) < 1 && Math.abs(cy) > 7.5) || (Math.abs(cy) < 1 && Math.abs(cx) > 6.5 && Math.abs(cx) < 8.5)) v += 1.25; if (cx === -9) v -= 0.7; }

// madera con vetas (hor: vetas a lo largo de x)
const madera = (x0, y0, x1, y1, cols, sem = 0, hor = true, base = 1.6) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
  const a = hor ? x : y, b = hor ? y : x, n = Math.sin(b * 0.9 + Math.sin(a * 0.031 + sem + b * 0.07) * 2.6 + hh(a >> 4, b >> 2, sem) * 2.2);
  R.pset(x, y, tono(cols, base + n * 0.55 + (n > 0.93 ? 1 : 0) + hh(x, y, sem) * 0.4, x, y)); } };
// tarima: tablas horizontales de alto h con juntas al tresbolillo y vetas
const tarima = (y0, y1, cols, h = 6, sem = 0, x0 = 0, x1 = 319) => { for (let y = y0; y <= y1; y++) { const fila = Math.floor((y - y0) / h), jy = (y - y0) % h === 0;
  for (let x = x0; x <= x1; x++) { const L = 34 + (fila % 3) * 9, junta = (x + fila * 23) % L === 0, n = Math.sin(x * 0.21 + fila * 2 + Math.sin(x * 0.05 + fila) * 2);
    R.pset(x, y, jy || junta ? cols[0] : tono(cols, 1.5 + n * 0.5 + hh(x >> 2, fila, sem) * 0.8 + (y - y0) / (y1 - y0 + 1) * 0.6, x, y)); } } };
// zócalo de paneles de nogal (paneles de ancho w con su moldura)
const zocalo = (x0, y0, x1, y1, cols, w = 40, sem = 0) => { madera(x0, y0, x1, y1, cols, sem, true, 1.5);

const marco = (x0, y0, x1, y1, g = 3) => { R.rect(x0 - 1, y0 - 1, x1 + 1, y0 - 1, K); R.rect(x0 - 1, y1 + 1, x1 + 1, y1 + 1, K); R.rect(x0 - 1, y0 - 1, x0 - 1, y1 + 1, K); R.rect(x1 + 1, y0 - 1, x1 + 1, y1 + 1, K);
  for (let k = 0; k < g; k++) { const c = k === 0 ? LATON[1] : k === g - 1 ? LATON[1] : LATON[2]; R.rect(x0 + k, y0 + k, x1 - k, y0 + k, k === 1 ? LATON[3] : c); R.rect(x0 + k, y1 - k, x1 - k, y1 - k, LATON[1]); R.rect(x0 + k, y0 + k, x0 + k, y1 - k, k === 1 ? LATON[3] : c); R.rect(x1 - k, y0 + k, x1 - k, y1 - k, LATON[1]); }
  for (let x = x0 + 2; x < x1 - 1; x += 4) R.pset(x, y0 + 1, LATON[4]); R.rect(x0 + g, y0 + g, x1 - g, y0 + g, K); R.rect(x0 + g, y0 + g, x0 + g, y1 - g, K); };
// un cuadro de un lago con luna (pintado al óleo)
const cuadroLago = (x0, y0, x1, y1, sem = 0) => { const H = y1 - y0;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const u = (y - y0) / H, m = y0 + H * 0.55 - Math.abs(Math.sin(x * 0.11 + sem)) * H * 0.25;
    R.pset(x, y, u > 0.68 ? tono(pal('#101a24', '#1a2a38', '#2a4458'), 1 + hh(x >> 1, y, sem) * 1.2 + (Math.abs(x - x0 - (x1 - x0) * 0.7) < 2 ? 1.3 : 0), x, y) : y > m ? tono(pal('#141e1a', '#1e2c26'), hh(x, y, sem) * 1.6, x, y) : tono(pal('#1a2438', '#26344c', '#3a4c66'), u * 2.6 + hh(x >> 2, y >> 1, sem) * 0.6, x, y)); }

// una hoja de papel con n renglones escritos (rayitas de tinta); n puede ser fraccionario (el último a medias)
const hoja = (x0, y0, x1, y1, n = 0, sem = 0, c = PAPEL[3]) => { R.rect(x0 - 1, y0 - 1, x1 + 1, y1 + 1, K); R.rect(x0, y0, x1, y1, c); R.rect(x0, y1, x1, y1, PAPEL[1]); R.rect(x1, y0, x1, y1, PAPEL[2]);

// una vela en su palmatoria (x el centro, yb la base de la vela, h su alto); o.apagada: humo; o.s: tamaño de la llama

  if (t > TG.BODY) for (const [k, hx] of [[0, 150], [1, 208], [2, 244]]) globo(hx, y0 + 70 + dy, '!', tramo(t, TG.BODY + k * 0.12, TG.BODY + k * 0.12 + 0.25), hex('#c83a3a'));
  atomG(62, 176, t, { pose: t > TG.EVEN && t < TG.CRIMINAL ? 'brazos' : 'senala', dir: 1, cara: t > TG.EVEN && t < TG.CRIMINAL ? 'sorpresa' : t > TG.CRIMINAL ? 'triste' : 'normal' });
};
// la botella de Leyden grande, de pie en el suelo (x centro, yb la base; c la carga 0–1): el frasco de vidrio que deja
// ver el cuarto (velo celeste con su brillo a la izquierda, el canto en sombra a la derecha y el reflejo de la boca), el
// forro de estaño por fuera hasta la mitad (con sus arrugas y su luz), la tapa de madera con vetas, la varilla de latón
// con su bola brillante y, por dentro, la cadena que baja hasta el estaño. Devuelve la bola [x, y]
const leydenG = (x, yb, t, c = 0) => { x = ri(x); yb = ri(yb); const w = 13, h = 38, ym = yb - 18;
  for (let i = -w - 3; i <= w + 3; i++) { tine(x + i + 2, yb + 1, K, 0.4); if (Math.abs(i) < w) tine(x + i + 2, yb + 2, K, 0.25); }   // la sombra en el suelo
  // el vidrio: deja ver lo de detrás con un velo celeste, más denso en los cantos
  for (let y = yb - h; y <= yb; y++) for (let i = -w; i <= w; i++) { const borde = Math.abs(i) >= w - 1 || y >= yb - 1; tine(x + i, y, hex('#a8d4e4'), borde ? 0.8 : 0.4 + (i > w - 5 ? 0.2 : 0)); }
  // la cadena por dentro: eslabones alternos desde la tapa hasta el fondo del estaño, que se mecen un poco
  for (let k = 0; k < 11; k++) { const yy = yb - h + 3 + k * 2, xx = x + ri(Math.sin(t * 1.5 + k * 0.4) * (k / 11) * 1.5); R.pset(xx, yy, k % 2 ? LATON[1] : LATON[3]); }
  // el forro de estaño por fuera, de la base a la mitad: bandas de luz a la izquierda y sombra a la derecha, arrugas
  for (let y = ym; y <= yb - 1; y++) for (let i = -w + 1; i <= w - 1; i++) { const v = 2.6 - (i + w) / (2 * w) * 1.8 + (hh(x + i, y >> 1, 91) - 0.5) * 0.5 + (i === -w + 3 ? 1 : 0);
    R.pset(x + i, y, tono(pal('#4a525e', '#6a7480', '#8e98a4', '#b4bcc6', '#dce2ea'), v, x + i, y)); }
  for (let i = -w + 1; i <= w - 1; i++) R.pset(x + i, ym, hh(i, 1, 92) < 0.5 ? pal('#dce2ea')[0] : pal('#8e98a4')[0]);   // el filo recortado del estaño
  // el contorno del frasco y los hombros redondeados
  R.rect(x - w - 1, yb - h, x - w - 1, yb, K); R.rect(x + w + 1, yb - h, x + w + 1, yb, K); R.rect(x - w, yb + 1, x + w, yb + 1, K);
  R.rect(x - w + 2, yb - h + 6, x - w + 2, ym - 3, hex('#ffffff')); R.rect(x - w + 3, yb - h + 8, x - w + 3, yb - h + 14, hex('#e8f6fc'));   // el brillo del vidrio
  R.pset(x - w + 2, ym + 4, hex('#ffffff')); R.pset(x - w + 2, ym + 5, hex('#ffffff'));   // y su reflejo sobre el estaño
  // la tapa de madera (un poco más ancha), con sus vetas y el canto claro
  R.rect(x - w - 2, yb - h - 4, x + w + 2, yb - h, K); R.rect(x - w - 1, yb - h - 3, x + w + 1, yb - h - 1, NOGAL[3]); R.rect(x - w - 1, yb - h - 3, x + w + 1, yb - h - 3, NOGAL[5]);
  for (let i = -w; i <= w; i += 4) R.pset(x + i, yb - h - 2, NOGAL[2]); R.rect(x - w - 1, yb - h - 1, x + w + 1, yb - h - 1, NOGAL[1]);
  // la varilla de latón y la bola, que brilla más con la carga
  R.rect(x - 1, yb - h - 18, x + 1, yb - h - 4, K); R.rect(x, yb - h - 17, x, yb - h - 4, LATON[3]);
  const bx = x, by = yb - h - 21; R.disco(bx, by, 4, K); R.disco(bx, by, 3, LATON[2]); R.disco(bx - 1, by - 1, 2, LATON[3]); R.pset(bx - 1, by - 2, hex('#ffffff'));
  if (c > 0) { halo(bx, by, 16, hex('#a8d0ff'), 0.55 * c * (0.75 + 0.25 * Math.sin(t * 19)));
    if (Math.floor(t * 11) % 3 === 0) { const a = hh(ri(t * 11), 1, 93) * 6.28; R.linea(bx + ri(Math.cos(a) * 4), by + ri(Math.sin(a) * 4), bx + ri(Math.cos(a) * 8), by + ri(Math.sin(a) * 8), hex('#e0f0ff')); } }
  return [bx, by]; };
// ── 5 · la mesilla congelada: la botella de Leyden de pie en el suelo junto a la cama; Atom llega andando, la mira con la
//      mano en la barbilla («convinced»), en «electricity» acerca la mano a la bola, salta la chispa a sus dedos y da un
//      respingo hacia atrás («!»); en «spark of life» la chispa sube de la bola y se vuelve un corazón que late ──
const q5 = (t) => {
  congela(fz11);
  const carga = tramo(t, TG.PLENTY, TG.ELECTRICITY), cor = tramo(t, TG.SPARK2 - 0.1, TG.SPARK2 + 0.3);
  const [kx, ky] = leydenG(150, 176, t, carga * (1 - 0.6 * tramo(t, TG.ELECTRICITY, TG.ELECTRICITY + 0.3)) + cor);
  // Atom: llega andando, piensa, acerca la mano, la chispa le salta a los dedos y da un respingo; luego sonríe
  const anda = tramo(t, TG.PLENTY + 0.1, TG.CONVINCED - 0.2), acerca = tramo(t, TG.ELECTRICITY - 0.45, TG.ELECTRICITY), salto = tramo(t, TG.ELECTRICITY + 0.02, TG.ELECTRICITY + 0.55);
  const ax = ri(lerp(66, 112, ease(anda)) + ease(acerca) * 8 - ease(Math.min(1, salto * 1.6)) * 12), ay = 176 - ri(Math.sin(salto * Math.PI) * 10);
  const pose = anda > 0 && anda < 1 ? 'camina' : salto > 0 && salto < 1 ? 'brazos' : t > TG.ELECTRICITY - 0.45 && t < TG.ELECTRICITY + 0.02 ? 'senala' : cor > 0 ? 'brazos' : t > TG.CONVINCED - 0.1 && t < TG.ELECTRICITY - 0.45 ? 'piensa' : 'quieto';
  const ra = atomG(ax, ay, t, { pose, dir: 1, cara: salto > 0 && salto < 1 ? 'sorpresa' : cor > 0 ? 'sonrisa' : t > TG.ELECTRICITY ? 'sorpresa' : 'normal' });
  // la chispa salta de la bola a la mano en «electricity»
  if (t > TG.ELECTRICITY - 0.05 && t < TG.ELECTRICITY + 0.3) { const [mx, my] = ra?.mano ?? [ax + 14, ay - 26]; chispa(kx - 3, ky, mx + 2, my, t, 1 - tramo(t, TG.ELECTRICITY + 0.1, TG.ELECTRICITY + 0.3)); halo(mx, my, 10, hex('#ffffff'), 0.6); }
  if (salto > 0.05 && salto < 1) globo(ax - 2, ay - 56, '!', 1, hex('#c83a3a'));
  // en «spark of life» la chispa sube de la bola y se vuelve un corazón que late
  if (cor > 0) { const sube = ease(Math.min(1, cor * 2)), lat = 1 + (Math.sin(t * 8) > 0.6 ? 0.15 : 0), s = ri(3 * ease(cor) * lat) || 1, hx = kx - 3 * s, hy = ri(ky - 12 - sube * 14) - 7 * s;
    if (cor < 0.6) chispa(kx, ky - 4, kx, hy + 4 * s, t, 1 - cor);
    halo(kx, hy + 3 * s, 34, hex('#ff8aa0'), 0.5 * cor);
    ['.kk.kk.', 'kcckcck', 'kcccccl', 'kccccck', '.kccck.', '..kck..', '...k...'].forEach((f, j) => [...f].forEach((ch, i) => { if (ch === '.') return; R.rect(hx + i * s, hy + j * s, hx + i * s + s - 1, hy + j * s + s - 1, ch === 'k' ? K : ch === 'l' ? hex('#ffb8c8') : hex('#e8506a')); }));
    for (let k = 0; k < 6; k++) { const a = t * 2 + k * 1.05; R.pset(ri(kx + Math.cos(a) * 20), ri(hy + 10 + Math.sin(a) * 12), hex('#ffe0e8')); } }
};
const efectos = [[0.35, 'pasos'], [TG.BECAUSE + 0.1, 'golpecito'], [TG.N1780, 'pop'], [TG.THE + 0.1, 'whoosh'], [TG.DISCOVERED + 0.4, 'zumbido'], [TG.SPARK, 'interruptor'], [TG.LEGS, 'boing'], [TG.TWITCH + 0.15, 'boing'],
  [TG.AND + 0.1, 'papel'], [TG.ALDINI, 'golpecito'], [TG.TOURED + 0.2, 'carro'], [TG.PUBLIC - 0.1, 'golpecito'], [TG.ON, 'papel'], [TG.ANIMALS, 'zumbido'], [TG.EVEN, 'flash'], [TG.BODY + 0.1, 'publico'],
  [TG.ELECTRICITY, 'zumbido'], [TG.SPARK2, 'brillo']];
T.rodar(E, R, [[0, q1], [TG.THE, q2], [TG.AND, q3], [TG.ON, q4], [TG.PLENTY, q5]], { efectos, año: (t) => t < TG.N1780 - 0.1 ? 1816 : t < TG.AND ? 1780 : 1803 });
