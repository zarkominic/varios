<title>Sueno · ep9</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// AG-SUENO (frases 38–41). B después de la cena: la familia bosteza delante del sofá. La molécula de triptófano, átomo a
// átomo («27»); un muslo de pavo y unos nuggets con el mismo número. La familia se queda dormida uno a uno. A: un
// peregrino y un wampanoag dormidos junto a la mesa de 1621.
import { preparar, rodar, comedor, plymouth, triptofano, C, EL } from '/atomo/plato/escenas/ag-comun.js';
const { E, R, M } = await preparar('ag-sueno');
const { tramo } = R;
const m = { su: M('sueno', 0.5), tr: M('triptofano', 6), ca: M('cantidad', 14), pe: M('peregrino', 19) };
const familia = (t, dormidos) => {
  comedor(R, t, { epoca: 'hoy', sofa: true, mesa: 1, recogida: true, noche: true });
  [[EL.senor30, 46], [EL.senora30, 72], [EL.chico, 98]].forEach(([d, x], k) => R.actor(d, x, 145, t + k, { parpadea: dormidos > k, habla: dormidos <= k && Math.sin(t * 2 + k) > 0.8, salto: dormidos > k ? 0 : 0 }));
};
const bostezo = (t) => familia(t, 0);
const muslo = (x, y) => { R.disco(x, y, 6, C.k); R.disco(x, y, 5, C.ocreS); R.disco(x - 1, y - 1, 3, C.ocre); R.rect(x + 4, y + 3, x + 9, y + 5, C.k); R.rect(x + 5, y + 4, x + 8, y + 4, C.blanco); R.rect(x + 9, y + 2, x + 11, y + 6, C.blanco); };
const nugget = (x, y) => { R.disco(x, y, 3, C.k); R.disco(x, y, 2, C.ocre); R.pset(x - 1, y - 1, C.oroL); };
const molecula = (t) => {
  const u = t - m.tr, L = m.ca - m.tr;
  R.rect(0, 0, 319, 179, R.hex('#1c2350'));
  if (u < 0.55 * L) { triptofano(R, 130, 84, t, tramo(u, 0.1 * L, 0.45 * L), 1.6); if (u > 0.4 * L) R.numero('27', 160, 160, { centro: true, tam: 16 }); }
  else { muslo(100, 90); for (let k = 0; k < 5; k++) nugget(206 + (k % 3) * 9, 86 + Math.floor(k / 3) * 8); R.numero('=', 160, 96, { centro: true, tam: 16, color: C.oroL }); triptofano(R, 92, 140, t, 1, 0.5); triptofano(R, 206, 140, t, 1, 0.5); }
};
const dormidos = (t) => familia(t, Math.floor(tramo(t - m.ca, 0.2, 3.2) * 3.2));
const peregrino = (t) => { plymouth(R, t, { estacion: 'otono', mesa: 1, mayflower: false, tarde: true }); R.actor(EL.peregrino, 120, 145, t, { parpadea: true }); R.actor(EL.wampanoag, 190, 145, t + 1, { dir: -1, parpadea: true }); };
rodar(E, R, [[0, bostezo], [m.tr - 0.2, molecula], [m.ca - 0.2, dormidos], [m.pe - 0.2, peregrino]], { año: (t) => (t < m.pe ? 2026 : 1621) });
</script>
