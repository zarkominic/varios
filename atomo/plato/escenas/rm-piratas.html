<title>Piratas · ep5</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// RM-PIRATAS (frases 22–23). Cartela «44». Un general de capa roja delante del Senado: crece y su sombra tapa el
// edificio. Luego un barco pirata: el joven César, sentado y tranquilo, sube el precio con la mano; en la caja, el
// rescate pasa de «20» a «50».
import { preparar, rodar } from '/atomo/plato/escenas/rm-comun.js';
const { E, R, M } = await preparar('rm-piratas');
const { PALA, PR, ELENCO, tramo, lerp } = R;
const m = { gen: M('generales', 1.5), pir: M('piratas', 7) };
const general = (t) => {
  R.cieloR(t, 'dia', { hor: 132 }); R.templo(160, 132, 150, 60, { n: 8 }); R.suelo(132, PALA.MARMOL, { losas: true });
  const g = tramo(t, m.gen + 1.5, m.gen + 4.5), h = lerp(44, 92, g);
  for (let y = 40; y < 132; y++) for (let x = 60; x < 260; x++) if (R.b4(x, y) < g * 0.6 * (1 - Math.abs(x - 160) / 120)) R.pset(x, y, PALA.CONTORNO);
  R.personaje(160, 174, h, { ...ELENCO.legionario, sombrero: 'no', peinado: 'corto', pelo: PALA.PELO_NEGRO, capa: PALA.ROJO, t, pose: 'manos_cintura', ceño: true });
};
const barco = (t) => {
  R.cieloR(t, 'dia', { hor: 118, nubes: { n: 4 } });
  R.mar(t, { hor: 118 });
  R.trirreme(170, 140, t, { esc: 2.4, vela: PALA.NEGRO });
  const cesar = { ...ELENCO.cesar, sombrero: 'no', capa: null, pelo: PALA.PELO_NEGRO };
  R.personaje(170, 124, 34, { ...cesar, t, pose: 'sentado', brazoD: t > m.pir + 4 ? 'arriba' : 'abajo', sonrisa: true });
  for (const [x, c, d] of [[120, PALA.VERDE, 1], [222, PALA.ROJO, -1]]) R.personaje(x, 126, 36, { ...ELENCO.barbaro, chaqueta: c, camisa: c, capa: null, barba: 'poblada', pelo: PALA.PELO_NEGRO, t, dir: d, pose: t > m.pir + 5 ? 'brazos' : 'senala', objeto: t > m.pir + 5 ? undefined : 'gladio', ceño: t < m.pir + 5 });
};
rodar(E, R, [[0, general], [m.pir - 0.2, barco]], { cartela: '44', caja: (t, e) => R.caja(t, t > m.pir + 2 ? tramo(t, m.pir + 2, m.pir + 2.4) : 0, (x, y) => R.numero(t > m.pir + 5.4 ? '50' : '20', x + 8, y + 12), { energia: e }) });
</script>
</body>
