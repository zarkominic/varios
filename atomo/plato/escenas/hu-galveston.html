<script type="module">
// HU-GALVESTON (frases 12–13), 1900, cartela «1900». Seis planos, todos con acción y vida de fondo:
// 1. la playa de Galveston una mañana de septiembre: una pareja llega por la arena con su perro y posa muy tiesa ante un
//    fotógrafo de trípode, que les hace señas, les habla, se mete bajo la tela y levanta la bandeja del magnesio; el
//    perro se sienta muy digno delante. El destello cae en «storms»: la pareja se queda deslumbrada y se ríe, el perro
//    salta y ladra («!») y corre a olisquear el trípode; el fotógrafo sale de la tela y enseña la placa, y ellos van a
//    verla mientras el humo sube. Detrás pasa el heladero con su carrito, y están los bañistas, la cometa y la casa de baños;
// 2. «September 1900, to Galveston, Texas»: la calle de las casas victorianas; el tranvía entra frenando y para en
//    «Galveston»; baja una señora con su sombrerera y se va por la acera; el niño de los periódicos vocea («!»); un
//    caballero de chistera llega, le lanza una moneda que brilla en «richest» (y un «$» que sube), el niño da un saltito,
//    le da el periódico y el caballero se va leyéndolo; el tranvía arranca en «state»; una dama de sombrilla pasa por delante;
// 3. «built on a sand island»: la isla vista desde el golfo; un destello recorre la franja de arena, la marca roja cae en
//    «highest point», se trazan el nivel del mar y lo más alto de la isla y la cota «8.7» sale en «nine feet»; delante,
//    un pescador rema hacia el puerto (se inclina con cada palada), descansa los remos y se vuelve a mirar la isla en
//    «highest point», sigue remando; un pelícano llega, se tira en picado junto al bote en «the sea» y sale con un pez, y
//    el pescador se ríe;
// 4. la oficina del Weather Bureau: Cline apunta en su libreta y se toca el sombrero en «Isaac Cline»; dos bocadillos,
//    un satélite y un radar, se tachan con una X roja en «satellites» y «radar»; se encoge de hombros, va deprisa hasta el
//    barómetro y le da dos golpecitos con el lápiz en «barometer»: el mercurio baja (flecha roja) y se asusta; mientras,
//    el ayudante archiva papeles, oye el telégrafo, que empieza a sonar, y acude a copiar el telegrama; Cline se vuelve;
// 5. «telegrams from Washington»: la azotea; Cline sale por la puerta de la escalera leyendo el telegrama y hace una
//    seña a su ayudante, que iza la bandera roja del aviso de tormenta; Cline va hacia el pretil, mira el golfo con su
//    catalejo («the swell rolling in»), se sobresalta en «water rising» («!») y vuelve corriendo hacia la escalera;
// 6. «by his own account»: la playa gris con el mar subiendo; sus huellas por la arena, de arriba abajo, con un «?»
//    discreto; Cline llega a toda prisa y avisa a una madre con su niño, que dejan el castillo de arena y se van; sigue
//    hasta la pareja de la foto, que miraba las olas con el perro, y los avisa («!», «warning people»); en «higher
//    ground» les señala la ciudad; ellos se van deprisa con el perro delante, a ella el viento le da la vuelta a la
//    sombrilla (gag), y él sigue playa arriba.
import * as T from '/atomo/plato/escenas/hu-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hu-galveston');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const C = T.C;
const lin = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
const entre = (t, a, b) => t >= a && t < b;
const parpadeo = (t, v = 6) => Math.sin(t * v) > 0;
const hh = (a, b, k = 0) => { const s = Math.sin(a * 127.1 + b * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const frena = (u) => 1 - (1 - u) ** 3;
// dónde lleva algo un personaje: la mano que cuelga (delante), la de atrás y la levantada (con dedo)
const enMano = (x, suelo, dir) => [dir > 0 ? x + 11 : x - 5, suelo - 9];
const manoAtras = (x, suelo, dir) => [dir > 0 ? x + 1 : x + 13, suelo - 8];
const manoArriba = (x, suelo, dir) => [dir > 0 ? x + 16 : x - 2, suelo - 19];
// lo que va detrás de una pieza del decorado: guarda esos rectángulos, dibuja y los repone encima
const detras = (rects, dibuja) => {
  const g = rects.map(([x0, y0, x1, y1]) => { const v = []; for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) v.push(R.pget(x, y)); return v; });
  dibuja();
  rects.forEach(([x0, y0, x1, y1], k) => { let i = 0; for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) R.pset(x, y, g[k][i++]); });
};
const mezcla = (p, [cr, cg, cb], a) => { const r = p & 255, g = (p >> 8) & 255, b = (p >> 16) & 255; return (0xff000000 | (Math.round(b + (cb - b) * a) << 16) | (Math.round(g + (cg - g) * a) << 8) | Math.round(r + (cr - r) * a)) >>> 0; };
// recorrido por fotogramas clave [t, x, suelo]: dónde está, si anda y hacia dónde mira (null antes de empezar)
const ruta = (t, kf, desde = true) => {
  if (t < kf[0][0]) return desde ? null : { x: kf[0][1], s: kf[0][2], mv: false, d: Math.sign(kf[1][1] - kf[0][1]) || 1 };
  let d = 1; for (let i = 0; i + 1 < kf.length; i++) { const [t0, x0, s0] = kf[i], [t1, x1, s1] = kf[i + 1]; if (x1 !== x0) d = x1 < x0 ? -1 : 1;
    if (t < t1) { const u = (t - t0) / (t1 - t0); return { x: Math.round(lerp(x0, x1, u)), s: Math.round(lerp(s0, s1, u)), mv: x1 !== x0 || s1 !== s0, d }; } }
  const [, x, s] = kf[kf.length - 1]; return { x, s, mv: false, d };
};
// figura con contorno de 1 px: rectángulos [x0, y0, x1, y1, color]; el contorno envuelve a todos juntos
const figura = (rs) => {
  for (const [x0, y0, x1, y1] of rs) R.rect(Math.min(x0, x1) - 1, Math.min(y0, y1) - 1, Math.max(x0, x1) + 1, Math.max(y0, y1) + 1, C.k);
  for (const [x0, y0, x1, y1, c] of rs) if (c != null) R.rect(Math.min(x0, x1), Math.min(y0, y1), Math.max(x0, x1), Math.max(y0, y1), c);
};
// la sombrilla de 1900 en la mano de atrás (el mango no cruza la cara): media luna de 15 px a rayas con su festón
const sombrilla = (hx, hy, tela = hex('#f4eef0'), raya = hex('#e87a9a')) => {
  const cx = hx + 1, cy = hy - 20;
  R.linea(hx, hy, cx, cy, C.k);
  for (let i = -7; i <= 7; i++) { const a = Math.round(Math.sqrt(49 - i * i) * 0.6); R.rect(cx + i, cy - a, cx + i, cy, C.k); }
  for (let i = -6; i <= 6; i++) { const a = Math.round(Math.sqrt(49 - i * i) * 0.6) - 1; if (a > 0) R.rect(cx + i, cy - a, cx + i, cy - 1, Math.floor((i + 7) / 3) % 2 ? tela : raya); }
  for (let i = -7; i <= 7; i += 2) R.pset(cx + i, cy, Math.floor((i + 7) / 3) % 2 ? tela : raya);
  R.pset(cx, cy - 5, C.k); R.pset(cx - 2, cy - 3, C.blanco);
};
// la misma sombrilla, vuelta del revés por una ráfaga: la tela en copa hacia arriba, las varillas a la vista, que tiemblan
const sombrillaVuelta = (hx, hy, t, tela = hex('#f4eef0'), raya = hex('#e87a9a')) => {
  const cx = hx + 1, cy = hy - 15, tb = Math.round(Math.sin(t * 19)), borde = (i) => cy - 8 + (Math.abs(i) > 5 ? tb : 0) + (i % 2 ? 1 : 0);
  R.linea(hx, hy, cx, cy, C.k);
  R.poligono([[cx - 8, cy - 9], [cx + 9, cy - 9], [cx + 1, cy + 1]], C.k);
  for (let i = -7; i <= 7; i++) { const y0 = borde(i), y1 = cy - Math.round((7 - Math.abs(i)) * 0.15) - Math.round(Math.abs(i) * 1.05) + 1; for (let y = y0; y <= Math.max(y0, y1); y++) R.pset(cx + i, y, Math.floor((i + 7) / 3) % 2 ? tela : raya); R.pset(cx + i, y0 - 1, C.k); }
  for (const i of [-6, -2, 2, 6]) R.linea(cx, cy, cx + i, borde(i), hex('#6a6a72'));
};
// el perro del gag, de lado y a la escala de los personajes (unos 18 × 17 px): o.dir, o.pose 'pie' | 'sentado' |
// 'tumbado', o.anda (patas alternas), o.digno (la cabeza y el hocico arriba, la cola tiesa), o.cabeza (−1: mira arriba)
const PERRO = { D: hex('#d89a4a'), s: hex('#a86a2a'), l: hex('#f0c070') };
const perrito = (x, suelo, t, o = {}) => {
  const d = o.dir ?? 1, X = (i) => Math.round(x + i * d), q = (a, b, j0, j1, c) => [Math.min(X(a), X(b)), Math.round(suelo + j0), Math.max(X(a), X(b)), Math.round(suelo + j1), c];
  const fill = (a, b, j0, j1, c) => { const r = q(a, b, j0, j1); R.rect(r[0], r[1], r[2], r[3], c); }, px = (i, j, c) => R.pset(X(i), Math.round(suelo + j), c);
  const { D, s, l } = PERRO, pose = o.pose ?? 'pie', cab = o.digno ? -2 : (o.cabeza ?? 0);
  if (pose === 'sentado') {
    figura([q(-3, -1, -2, -1, D), q(0, 6, -9, -1, D), q(5, 7, -7, -1, D), q(3, 8, -12, -6, D), q(5, 10, -17 + cab, -11 + cab, D), q(10, 13, -14 + cab - (o.digno ? 1 : 0), -12 + cab - (o.digno ? 1 : 0), l)]);
    fill(0, 3, -6, -2, s); fill(1, 5, -9, -9, l); fill(5, 6, -17 + cab, -13 + cab, s); px(9, -15 + cab, C.k); px(13, -14 + cab - (o.digno ? 1 : 0), C.k);
    fill(4, 7, -11, -10, C.rojo); px(6, -9, C.oroL); px(7, -1, s);
    return;
  }
  const paso = o.anda ? Math.floor(t * (o.digno ? 4 : 9)) % 2 : -1, alzo = o.digno ? 1 : 0;
  const pata = (a, alza) => q(a, a + 1, -4, alza ? -2 : -1, D);
  const cola = o.digno ? q(-2, -1, -14, -9, D) : (Math.sin(t * 14) > 0 ? q(-3, -2, -11, -8, D) : q(-4, -3, -10, -8, D));
  figura([cola, q(0, 9, -9, -4, D), pata(0, paso === 0), pata(3, paso === 1), pata(6, paso === 1), pata(8, paso === 0), q(8, 13, -14 + cab, -8 + cab, D), q(13, 16, -11 + cab - alzo, -9 + cab - alzo, l)]);
  fill(1, 8, -4, -4, s); fill(1, 7, -9, -9, l); fill(8, 10, -14 + cab, -10 + cab, s); px(12, -12 + cab, C.k); px(16, -11 + cab - alzo, C.k);
  fill(8, 9, -8 + Math.min(0, cab + 1), -7, C.rojo); px(9, -6, C.oroL);
};
// la pareja de la foto (vuelve en el plano 6 y en hu-muro, paseando con el perro): él de azul, ella de rosa
const SENOR = { C: hex('#3e4a6a'), c: hex('#2c3650'), F: hex('#4a4a56'), W: hex('#f2eee2'), o: hex('#a83a3a') };
const SENORA = { C: hex('#b85a7a'), c: hex('#8e4060'), W: hex('#ecd0da'), L: hex('#2a2430') };

const g = (f) => en('galveston', f), c = (f) => en('cline', f);
// los cortes, en la palabra que toca: «go back», «built», «The city's», «Telegrams from», «by his own account»
const P2 = g(0.312), P3 = g(0.673), P4 = c(0), P5 = c(0.356), P6 = c(0.698);
const tormentas = g(0.236), galv = g(0.432), texas = g(0.476), ricas = g(0.548), estado = g(0.636);
const arena = g(0.713), alto = g(0.780), menos = g(0.864), nueve = g(0.904), mar = g(0.975);
const cline = c(0.083), noSat = c(0.144), sat = c(0.165), noRad = c(0.209), rad = c(0.225), solo = c(0.245), baro = c(0.285);
const wash = c(0.38), oleaje = c(0.45), sube = c(0.655);
const cuenta = c(0.705), va = c(0.765), avisa = c(0.86), mueve = c(0.925);

// ── 1 · la foto en la playa ─────────────────────────────────────────────────────────────────────────────────────
const FOTOGRAFO = { C: hex('#5a4a3a'), c: hex('#443828'), F: hex('#3a3a46'), W: hex('#f2eee2'), o: hex('#2a2430') };
const HELADERO = { C: hex('#f2eee2'), c: hex('#c8c0b0'), F: hex('#e8e4dc'), W: hex('#f2eee2'), o: hex('#c83a3a') };
const camaraFoto = (x, s) => {   // el trípode y la cámara de fuelle; la lente mira a la izquierda
  for (const [dx, col] of [[-7, C.maderaS], [5, C.maderaS], [-1, C.madera]]) R.linea(x, s - 19, x + dx, s - 1, col);
  figura([[x - 5, s - 28, x + 5, s - 20, C.madera], [x - 10, s - 27, x - 6, s - 21, hex('#2e2a30')], [x - 13, s - 26, x - 11, s - 22, C.oro]]);
  R.rect(x - 4, s - 28, x + 4, s - 28, C.maderaL); R.rect(x - 4, s - 21, x + 4, s - 20, C.maderaS);
  for (let i = x - 9; i <= x - 7; i += 2) R.rect(i, s - 27, i, s - 21, hex('#4a4450'));
  R.pset(x - 13, s - 24, hex('#8ac0e0')); R.pset(x + 4, s - 27, C.oroL); R.pset(x - 4, s - 27, C.oroL);
};
const telaFoto = (x, s, bajo) => {   // la tela negra: sobre la cabeza del fotógrafo o colgando detrás de la cámara
  if (bajo) {
    R.poligono([[x + 3, s - 30], [x + 18, s - 31], [x + 21, s - 13], [x + 15, s - 11], [x + 4, s - 16]], C.k);
    R.poligono([[x + 4, s - 29], [x + 17, s - 30], [x + 20, s - 14], [x + 15, s - 12], [x + 5, s - 17]], hex('#2a2430'));
    for (const fx of [x + 9, x + 14]) R.linea(fx, s - 29, fx + 1, s - 14, hex('#4a4050'));
  } else { R.rect(x + 5, s - 28, x + 8, s - 17, C.k); R.rect(x + 6, s - 27, x + 7, s - 18, hex('#2a2430')); }
};
// el carrito del heladero (x: la punta de la izquierda; s: el suelo): la caja a rayas, la tapa de latón, dos ruedas y
// la sombrilla, que se mece al rodar
const carritoHelado = (x, s, t) => {
  const b = Math.round(Math.sin(t * 9) * 0.6);
  figura([[x, s - 13 + b, x + 18, s - 5 + b, hex('#f2eee2')]]);
  for (let i = x + 2; i < x + 18; i += 4) R.rect(i, s - 12 + b, i + 1, s - 6 + b, hex('#e87a9a'));
  R.rect(x + 1, s - 13 + b, x + 17, s - 13 + b, hex('#e8c060')); R.rect(x + 3, s - 15 + b, x + 15, s - 14 + b, C.k); R.rect(x + 4, s - 15 + b, x + 14, s - 15 + b, C.oroL);
  for (const wx of [x + 4, x + 14]) { R.disco(wx, s - 2, 3, C.k); R.disco(wx, s - 2, 2, hex('#8a6a4a')); R.pset(wx + Math.round(Math.cos(t * 9)), s - 2 + Math.round(Math.sin(t * 9)), hex('#c8a870')); }
  R.rect(x + 9, s - 28, x + 9, s - 15, C.k);
  for (let i = -9; i <= 9; i++) { const a = Math.round(Math.sqrt(81 - i * i) * 0.45); R.rect(x + 9 + i, s - 29 - a + b, x + 9 + i, s - 29 + b, C.k); if (a > 1) R.rect(x + 9 + i, s - 28 - a + b, x + 9 + i, s - 29 + b, Math.floor((i + 9) / 3) % 2 ? hex('#f4f0e8') : hex('#3e8a7a')); }
  R.rect(x + 18, s - 13 + b, x + 20, s - 12 + b, C.k);   // el asa por donde empuja
};
const llegan = [1.3, 3.1], posan = 3.2, flashT = tormentas + 0.02, tapa = [2.95, flashT + 0.4], alzaPan = 3.6;
const sale = flashT + 0.42, placa = [sale + 0.12, P2], aVer = [flashT + 0.55, P2 + 0.15], perroCorre = [flashT + 0.45, flashT + 1.05];
const p1 = (t) => {
  T.galveston(R, t, { encuadre: 'playa' });
  const s = 160, cx = 200, fx = cx + 4;
  // detrás, el heladero cruza la arena mojada empujando su carrito
  { const hx = Math.round(lerp(350, -60, lin(t, 0.9, P2 + 0.35))), hs = 141; carritoHelado(hx - 21, hs, t); R.actor(EL.vecino, hx, hs, t, { dir: -1, anda: true, pal: HELADERO, tocado: 'gorra', sonrisa: true }); }
  const u = lin(t, llegan[0], llegan[1]), v = lin(t, aVer[0], aVer[1]), xs = Math.round(lerp(30, 104, u) + lerp(0, 30, v));
  // las huellas de la pareja y del perro en la arena
  for (let x = 24; x < xs; x += 5) { R.pset(x + 4, s + 1 + ((x / 5) % 2), hex('#c8a878')); R.pset(x + 20, s + 2 - ((x / 5) % 2), hex('#c8a878')); if (x % 10 === 4) R.pset(x + 38, s + 8, hex('#c8a878')); }
  // la pareja llega, posa muy tiesa, el destello la deslumbra, se ríe y va a ver la foto
  const anda = (u > 0 && u < 1) || (v > 0 && v < 1), tieso = t > posan && t < flashT, ciega = entre(t, flashT, flashT + 0.55);
  R.actor(EL.vecino, xs, s, t, { dir: 1, anda, quieto: tieso, pal: SENOR, sorpresa: ciega, sonrisa: !ciega && t > flashT, habla: entre(t, flashT + 0.6, flashT + 1.3) && parpadeo(t, 8), dedo: entre(t, flashT + 0.6, flashT + 1.2) });
  R.actor(EL.vecina, xs + 16, s + 1, t, { dir: 1, anda, quieto: tieso, pal: SENORA, sorpresa: ciega, sonrisa: !ciega });
  { const [hx, hy] = manoAtras(xs + 16, s + 1, 1); sombrilla(hx, hy); }
  // el perro: llega trotando, posa sentado y muy digno, salta y ladra con el destello y corre a olisquear el trípode
  { const salta = entre(t, flashT, flashT + 0.35), corre = lin(t, perroCorre[0], perroCorre[1]), px = Math.round(lerp(xs + 34, 168, corre)), py = 168 - (salta ? Math.round(Math.sin((t - flashT) / 0.35 * Math.PI) * 5) : 0);
    const sentado = t > posan - 0.1 && t < flashT, pie = !sentado;
    perrito(px, py, t, { dir: 1, pose: pie ? 'pie' : 'sentado', anda: (u > 0 && u < 1) || (corre > 0 && corre < 1), digno: sentado, cabeza: t > perroCorre[1] && Math.sin(t * 5) > 0 ? -1 : 0 });
    if (entre(t, flashT + 0.05, flashT + 0.6)) R.bocadillo(px + 10, py - 20); }
  // el fotógrafo: los llama, les habla, se mete bajo la tela, levanta el magnesio, sale contento y enseña la placa
  const bajo = entre(t, tapa[0], tapa[1]), conPan = entre(t, alzaPan, tapa[1]), ensena = entre(t, placa[0], placa[1]);
  R.actor(EL.vecino, fx, s, t, { dir: -1, pal: FOTOGRAFO, dedo: conPan || entre(t, 1.6, 2.2) || ensena, habla: (entre(t, 2.25, 2.85) || entre(t, placa[0] + 0.3, placa[0] + 0.9)) && parpadeo(t, 8), sonrisa: t > sale });
  camaraFoto(cx, s); telaFoto(cx, s, bajo);
  if (conPan) { const [hx, hy] = manoArriba(fx, s, -1); R.rect(hx, hy - 5, hx, hy - 1, C.maderaS); R.rect(hx - 3, hy - 7, hx + 3, hy - 6, C.k); R.rect(hx - 2, hy - 7, hx + 2, hy - 7, C.metalL); if (t < flashT) { R.pset(hx - 1, hy - 8, C.blanco); R.pset(hx + 1, hy - 8, C.blanco); } }
  if (ensena) { const [hx, hy] = manoArriba(fx, s, -1); R.rect(hx - 3, hy - 8, hx + 3, hy - 1, C.k); R.rect(hx - 2, hy - 7, hx + 2, hy - 2, hex('#3a3440')); R.rect(hx - 1, hy - 6, hx + 1, hy - 3, hex('#8a8090')); R.pset(hx - 1, hy - 6, hex('#c8c0d0')); }
  if (entre(t, 2.25, 2.85)) R.bocadillo(fx - 2, s - 30);
  // el destello del magnesio y su humo, que sube y se lo lleva la brisa

// ── 5 · la azotea: el telegrama y la bandera ─────────────────────────────────────────────────────────────────────
const AYUDANTE = { C: hex('#e8e4dc'), c: hex('#c0bcb4'), F: hex('#4a4a5a'), W: hex('#e8e4dc'), o: hex('#3a3a4a'), H: hex('#8a5428'), h: hex('#a8703a') };

// ── 6 · la playa: avisa a la gente ───────────────────────────────────────────────────────────────────────────────
const RUTA = [[6, 172], [80, 164], [150, 172], [226, 164], [300, 171]];
const MADRE = { C: hex('#4a7a6a'), c: hex('#36604f'), W: hex('#e8e4d4'), L: hex('#2a2430') };

const castillo = (x, s, t) => {   // el castillo de arena con su banderita y el cubo (x: la esquina de la izquierda)

const cubo = (x, y) => { R.rect(x - 1, y - 4, x + 4, y, C.k); R.rect(x, y - 3, x + 3, y - 1, hex('#3a8ac8')); R.rect(x, y - 3, x + 3, y - 3, hex('#6ab0e8')); R.linea(x, y - 5, x + 3, y - 5, C.k); };

const p6 = (t) => {
  T.galveston(R, t, { encuadre: 'playa', cielo: 'gris', oleaje: 1, agua: lerp(0.3, 0.75, lin(t, P6, E.duracion)) });

  const hu = lin(t, cuenta - 0.05, cuenta + 0.8), apaga = lin(t, va + 0.1, va + 0.7);

    let hecho = 0; for (let i = 0; i < segs.length; i++) { for (let d = 0; d < segs[i]; d += 6) { if ((hecho + d) / total > hu) break; const f = d / segs[i], x = Math.round(lerp(RUTA[i][0], RUTA[i + 1][0], f)), y = Math.round(lerp(RUTA[i][1], RUTA[i + 1][1], f)), lado = Math.floor((hecho + d) / 6) % 2 ? 1 : -1; if (hh(x, y, 5) < apaga) continue; R.rect(x, y + lado, x + 1, y + lado, hex('#7a6444')); R.rect(x, y + lado + 1, x + 1, y + lado + 1, hex('#e8d8b0')); } hecho += segs[i]; }

  const avisando = entre(t, avisa - 0.25, mueve - 0.1), senala = entre(t, mueve - 0.05, mueve + 0.85);

  const oye1 = t > t1 + 0.05, m1 = ruta(t, [[t1 + 0.7, 92, 166], [t1 + 2.9, -30, 166]], false), n1 = ruta(t, [[t1 + 0.8, 110, 169], [t1 + 2.9, -12, 169]], false);

  [P4 + 0.4, 'lapiz'], [sat + 0.08, 'pop'], [rad + 0.06, 'pop'], [toca[0] + 0.05, 'golpecito'], [toca[0] + 0.3, 'golpecito'], [P5 - 0.55, 'tic'], [P5 - 0.3, 'tic'],
  [P5 + 0.02, 'puerta'], [P5 + 0.8, 'papel'], [wash + 0.3, 'rafaga'], [oleaje + 0.1, 'ola'], [sube, 'pop'],
  [P6 + 0.2, 'ola'], [t1 + 0.1, 'pop'], [va + 0.3, 'rafaga'], [avisa, 'pop'], [avisa + 0.25, 'guau'], [mueve + 0.6, 'whoosh'], [mueve + 1.2, 'ola']];
T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3], [P4, p4], [P5, p5], [P6, p6]], { cartela: '1900', efectos, año: 1900 });
