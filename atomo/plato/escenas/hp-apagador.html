<script type="module">
// HP-APAGADOR (frase 24), sin cartela, 1997 en la barra (el libro). Cuatro planos:
// 1. Privet Drive de noche: un coche pasa por la calzada con los faros encendidos (por delante); Dumbledore entra por la acera, levanta el apagador y hace clic: las cuatro farolas se apagan
//    de una en una (la más lejana primero) y cada luz vuela, con su estela, a meterse en el aparato; el gato lo mira desde la
//    tapia y una lechuza cruza el cielo y se posa en un tejado a mirar, girando la cabeza con cada farola. Corta en
//    «the Put-Outer».
// 2. El bosque de noche (el último libro): Ron anda a oscuras por el sendero; cruje una rama (se sobresalta) y mira a los
//    lados; una ráfaga arrastra hojas secas entre los troncos; murciélagos revolotean; saca el mismo apagador, clic en «Ron», y sale una bolita de luz azulada que flota delante
//    y le alumbra: un conejo huye a saltos por el sendero; él sonríe y la sigue. Corta en «And».
// 3. La casa de los reptiles del zoo: un niño da golpecitos al cristal y se aburre; a la izquierda, un cuidador friega el
//    suelo junto a su cono de «!» y su cubo; Harry llega a la barandilla, le habla a la boa («talks to a snake», siseo) y se encoge
//    de hombros («without knowing what he's doing»), mientras el cuidador mete la fregona en el cubo (salpica). Corta en «That's».
// 4. El cristal de cerca: Harry habla, la boa le guiña un ojo y en «Parseltongue» le contesta con un siseo (ondas verdes
//    de la boca de la boa hacia Harry); un brillo recorre el cristal y lo deja
//    hecho chispas (el cristal que desaparece, insinuado); Harry da un paso atrás con «!» y al final mira con «?».
import * as T from '/atomo/plato/escenas/hp-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hp-apagador');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const mix = (c, d, a) => { const ch = (s) => Math.round(((c >>> s) & 255) * (1 - a) + ((d >>> s) & 255) * a); return ((255 << 24) | (ch(16) << 16) | (ch(8) << 8) | ch(0)) >>> 0; };
// un halo de luz tramado alrededor de (x, y): aclara hacia col en la proporción a, que cae hacia el borde
const halo = (x, y, r, col, a) => { for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) { const d = Math.hypot(i, j); if (d > r) continue; const X = Math.round(x + i), Y = Math.round(y + j); if (X < 0 || X > 319 || Y < 0 || Y > 179) continue; R.pset(X, Y, mix(R.pget(X, Y), col, a * (1 - d / r))); } };
// una bolita de luz con su halo, su brillo y una estela de tres puntos
const bola = (x, y, col, r = 2, est = null) => { halo(x, y, r * 4, col, 0.6); R.disco(Math.round(x), Math.round(y), r, col); R.pset(Math.round(x) - 1, Math.round(y) - 1, hex('#ffffff')); if (est) for (let k = 1; k <= 3; k++) R.pset(Math.round(x - est[0] * k * 3), Math.round(y - est[1] * k * 3), mix(col, hex('#ffffff'), 0.3)); };
const brilla = (x, y, t, col = hex('#fff6c8')) => { if (Math.sin(t * 9 + x) > -0.2) { R.pset(x, y - 2, col); R.pset(x, y + 2, col); R.pset(x - 2, y, col); R.pset(x + 2, y, col); R.pset(x, y, hex('#ffffff')); } };
const K = hex('#14111a');
// un coche familiar de noche, de lado y hacia la derecha (x: el centro, s: donde apoyan las ruedas), con los faros que
// alumbran la calzada por delante, los pilotos rojos y los tapacubos que giran
const cocheNoche = (x, s, col, t) => {
  x = Math.round(x);
  const sh = mix(col, K, 0.45), li = mix(col, hex('#ffffff'), 0.28), luz = hex('#fff2c0');
  // el haz de los faros: un cono tramado que se abre por delante y la mancha de luz en el asfalto
  for (let i = 2; i <= 46; i++) { const w = 1 + i * 0.16; for (let j = -Math.round(w); j <= Math.round(w * 0.6); j++) { const X = x + 22 + i, Y = s - 8 + j; if (X < 0 || X > 319 || Y > 179 || ((X + Y) & 1)) continue; R.pset(X, Y, mix(R.pget(X, Y), luz, 0.32 * (1 - i / 48))); } }
  halo(x + 52, s - 1, 13, luz, 0.3); halo(x - 23, s - 8, 5, hex('#ff3a3a'), 0.45);
  // la sombra bajo el coche
  for (let i = -24; i <= 24; i++) { const X = x + i; if (X >= 0 && X <= 319) { R.pset(X, s + 1, mix(R.pget(X, s + 1), K, 0.55)); if (s + 2 < 180) R.pset(X, s + 2, mix(R.pget(X, s + 2), K, 0.3)); } }
  // la carrocería: la caja con su luz arriba y su sombra abajo, y la cabina
  R.rect(x - 22, s - 11, x + 22, s - 3, K); R.rect(x - 21, s - 10, x + 21, s - 4, col); R.rect(x - 21, s - 10, x + 21, s - 10, li); R.rect(x - 21, s - 5, x + 21, s - 4, sh);
  R.rect(x - 13, s - 18, x + 11, s - 11, K); R.rect(x - 12, s - 17, x + 10, s - 11, col); R.rect(x - 12, s - 17, x + 10, s - 17, li);
  // las ventanillas oscuras con un reflejo de la farola, el montante, las puertas y sus tiradores
  R.rect(x - 11, s - 16, x - 2, s - 12, hex('#161e34')); R.rect(x, s - 16, x + 9, s - 12, hex('#161e34')); R.pset(x - 9, s - 15, hex('#5a6a8a')); R.pset(x - 8, s - 14, hex('#3a4a6a')); R.pset(x + 2, s - 15, hex('#5a6a8a'));
  R.linea(x - 1, s - 10, x - 1, s - 5, sh); R.linea(x - 12, s - 10, x - 12, s - 5, sh); R.pset(x - 5, s - 8, li); R.pset(x + 5, s - 8, li);
  // parachoques, faros y pilotos
  R.rect(x + 21, s - 6, x + 23, s - 4, hex('#8a8a92')); R.rect(x - 23, s - 6, x - 21, s - 4, hex('#8a8a92'));
  R.rect(x + 21, s - 9, x + 22, s - 8, luz); R.pset(x + 22, s - 9, hex('#ffffff')); R.rect(x - 22, s - 9, x - 21, s - 8, hex('#e83a3a'));
  // las ruedas, con el tapacubos que gira
  for (const wx of [x - 13, x + 13]) { R.disco(wx, s - 2, 4, K); R.disco(wx, s - 2, 2, hex('#5a5a64')); const an = t * 14; R.pset(Math.round(wx + Math.cos(an) * 2), Math.round(s - 2 + Math.sin(an) * 2), hex('#c8c8d2')); R.pset(wx, s - 2, hex('#2a2a30')); }
};
const PIEZAS_HP = T.PIEZAS_HP;

const a = (f) => en('apagador', f);
const P2 = a(0.246), P3 = a(0.477), P4 = a(0.703);
const SODIO = hex('#ffc860'), AZUL = hex('#bfe4ff');
// el plano 1: los instantes en que se apaga cada farola (la más lejana primero) y su luz vuela al aparato
const ORDEN = [38, 296, 124, 210];   // de la más lejana al anciano (x 167) a la más cercana
const c0 = a(0.107), c1 = a(0.225), apaga = (k) => c0 + (k + 1) / 4 * (c1 - c0) - 0.12;
const p1 = (t) => {
  const u = tramo(t, c0, c1), dx = Math.round(lerp(236, 160, tramo(t, 0.2, a(0.07))));
  const g = T.muggle(R, t, { encuadre: 'calle', farolas: 1 - u, aparato: 167 });
  // la lechuza: cruza el cielo por encima de los tejados y se posa en el caballete de un tejado; mira cada farola que se apaga
  { const v = tramo(t, 0.3, 1.9), cx = 232, cy = 52;
    const ox = v < 1 ? Math.round(lerp(330, cx, v)) : cx, oy = v < 1 ? Math.round(lerp(62, cy, v) - Math.sin(v * Math.PI) * 8) : cy;
    const mira = ORDEN.reduce((m, fx, k) => (t > apaga(k) - 0.1 ? fx : m), 200);
    PIEZAS_HP.lechuza(R, ox, oy, { vuela: v < 1, t, dir: v < 1 ? -1 : mira < cx ? -1 : 1 }); }
  T.tinte(R, 0, 179, [8, 10, 30], 0.3 * tramo(t, c0 + 0.3, c1 + 0.3));
  // polillas alrededor de las farolas encendidas
  for (const f of g.farolas ?? []) if (f.encendida) for (let k = 0; k < 3; k++) { const an = t * (3 + k) + k * 2.1 + f.x; R.pset(Math.round(f.x + Math.cos(an) * (5 + k)), Math.round(f.y + 2 + Math.sin(an * 1.3) * 4), hex('#f8eed0')); }
  const anda = t < a(0.07), levanta = t > a(0.08) && t < c1 + 0.6;
  const ac = R.actor(EL.dumbledore, dx, 138, t, { dir: -1, anda, sostiene: levanta ? [dx - 4, 104] : false, sonrisa: t > c1 + 0.2, habla: !anda && !levanta && t < a(0.08) });
  const [mx, my] = ac.mano;
  // las luces que vuelan de cada farola al apagador (orden: de la más lejana a la más cercana)
  const FX = ORDEN;
  FX.forEach((fx, k) => { const v = tramo(t, apaga(k), apaga(k) + 0.55); if (v <= 0 || v >= 1) return; const e = v * v * (3 - 2 * v), x = lerp(fx, mx, e), y = lerp(69, my - 6, e) - Math.sin(v * Math.PI) * 18; bola(x, y, SODIO, 3, [(mx - fx) / 300, 0]); });
  if (levanta) PIEZAS_HP.apagador(R, mx, my + 4, { luz: FX.some((fx, k) => t > apaga(k) + 0.5 && t < apaga(k) + 0.75) });
  // el clic: un destello pequeño en el botón
  FX.forEach((fx, k) => { if (t > apaga(k) - 0.05 && t < apaga(k) + 0.12) brilla(mx + 3, my - 5, 1, hex('#ffffff')); });
  // el coche que pasa por la calzada antes del primer clic (va por delante de todo lo de la acera)
  { const u = tramo(t, 0.05, 1.95); if (u > 0 && u < 1) cocheNoche(lerp(-48, 372, u), 174, hex('#3a5a7a'), t); }
  T.muggleDelante(R, t, { encuadre: 'calle' });
};
// el plano 2: Ron en el bosque, con la bolita de luz que le guía
const clic2 = a(0.378), sigue = a(0.415);
const p2 = (t) => {
  T.exterior(R, t, { encuadre: 'bosque' });
  T.tinte(R, 0, 179, [6, 10, 26], 0.45 - 0.2 * tramo(t, clic2 + 0.1, clic2 + 0.9));
  const w = tramo(t, P2 + 0.1, a(0.35)), z = tramo(t, sigue, P3 + 0.2);
  const rx = Math.round(lerp(18, 112, w) + lerp(0, 70, z));
  // la bolita: sale del aparato, sube y se queda flotando delante; luego tira hacia el sendero
  const salir = tramo(t, clic2 + 0.05, clic2 + 0.8);
  const bx = lerp(rx + 22, 170, salir) + lerp(0, 70, z) + Math.sin(t * 2.4) * 3, by = lerp(138, 118, salir) + Math.sin(t * 3.1) * 3;
  if (salir > 0) { halo(bx, by, 46, AZUL, 0.32 * Math.min(1, salir * 2)); halo(bx, 168, 34, AZUL, 0.25 * Math.min(1, salir * 2)); }
  // dos murciélagos que revolotean entre los troncos
  for (let k = 0; k < 2; k++) { const u = (t * 0.18 + k * 0.5) % 1, mx = Math.round(-10 + u * 340), my = Math.round(52 + k * 22 + Math.sin(t * 4 + k) * 8), al = Math.sin(t * 22 + k * 2) > 0;
    R.pset(mx, my, hex('#0c0a14')); R.pset(mx + 1, my, hex('#0c0a14')); R.pset(mx - 1, my + (al ? -1 : 1), hex('#0c0a14')); R.pset(mx + 2, my + (al ? -1 : 1), hex('#0c0a14')); R.pset(mx - 2, my + (al ? -2 : 1), hex('#16121e')); R.pset(mx + 3, my + (al ? -2 : 1), hex('#16121e')); }
  // una ráfaga arrastra hojas secas entre los troncos, de izquierda a derecha, dando vueltas
  { const u = tramo(t, P2 + 0.1, P2 + 2.6); if (u > 0 && u < 1) for (let k = 0; k < 8; k++) { const v = u * 1.4 - k * 0.05; if (v <= 0 || v >= 1) continue;
    const x = Math.round(lerp(-12, 334, v) + Math.sin(k * 2.3) * 24), y = Math.round(84 + k * 9 + Math.sin(v * 10 + k) * 7 + v * 14), c = hex(['#d8b868', '#ecd088', '#c09448'][k % 3]), cs = mix(c, K, 0.45), fase = Math.floor(t * 8 + k) % 3;
    // la hoja da vueltas: de plano (3×2), de canto (1×3) y en diagonal
    if (fase === 0) { R.rect(x - 1, y, x + 1, y + 1, c); R.pset(x + 1, y + 1, cs); R.pset(x - 2, y + 1, cs); }
    else if (fase === 1) { R.rect(x, y - 1, x, y + 1, c); R.pset(x, y + 1, cs); }
    else { R.pset(x - 1, y - 1, c); R.pset(x, y, c); R.pset(x + 1, y + 1, cs); R.pset(x + 1, y, c); } } }
  // la rama que cruje bajo el pie: se sobresalta y luego mira a los lados
  const cruje = a(0.335), susto = t > cruje && t < cruje + 0.5;
  if (t > cruje - 0.05 && t < cruje + 0.35) { const qx = rx + 6; R.linea(qx - 5, 167, qx + 5, 166, hex('#5a4630')); R.pset(qx, 165, hex('#8a7050')); R.pset(qx + 1, 164, hex('#c8b090')); R.pset(qx - 1, 164, hex('#c8b090')); }
  const mira = t > cruje + 0.5 && t < clic2 - 0.25;
  const ac = R.actor(EL.ronJersey, rx, 166, t, { dir: mira && Math.sin(t * 3) > 0 ? -1 : 1, anda: !susto && ((w > 0 && w < 1) || (z > 0 && z < 1)), salto: susto ? Math.round(Math.sin(tramo(t, cruje, cruje + 0.3) * Math.PI) * 2) : 0, sostiene: t > clic2 - 0.6 && t < sigue + 0.3 ? [rx + 22, 140] : false, sonrisa: salir > 0.6, sorpresa: susto || (salir > 0 && salir <= 0.6) });
  if (susto) R.icono('!', rx + 5, 134, hex('#fff0a0'), K);
  // el conejo que estaba en el sendero huye de la luz a saltos
  { const u = tramo(t, clic2 + 0.15, clic2 + 1.4), cx = Math.round(lerp(214, 336, u)), cy = 166 - Math.round(Math.abs(Math.sin(u * Math.PI * 4)) * 5 * (u > 0 && u < 1 ? 1 : 0)), co = hex('#6a5a4a'), cl = hex('#9a8670');
    if (u < 1) { R.rect(cx - 3, cy - 4, cx + 2, cy - 1, co); R.rect(cx - 2, cy - 4, cx + 1, cy - 3, cl); R.rect(cx + 2, cy - 6, cx + 4, cy - 3, co); R.pset(cx + 3, cy - 8, co); R.pset(cx + 3, cy - 7, cl); R.pset(cx + 4, cy - 5, K); R.pset(cx - 4, cy - 3, hex('#e8e0d0')); if (u === 0 && Math.sin(t * 3) > 0.5) R.pset(cx + 5, cy - 4, hex('#c88a8a')); } }

  if (t > clic2 - 0.6 && t < sigue + 0.3) { const [mx, my] = ac.mano; PIEZAS_HP.apagador(R, mx, my + 4, { luz: salir > 0 && salir < 0.3 }); if (t > clic2 - 0.05 && t < clic2 + 0.12) brilla(mx + 2, my - 5, 1, hex('#ffffff')); }
  if (salir > 0) bola(bx, by, AZUL, 3);
  // luciérnagas que se acercan a la luz
  if (salir > 0.5) for (let k = 0; k < 4; k++) { const an = t * 1.7 + k * 1.57; R.pset(Math.round(bx + Math.cos(an) * (12 + k * 3)), Math.round(by + Math.sin(an) * 7), hex('#d8f070')); }
  T.exteriorDelante(R, t, { encuadre: 'bosque' });
};
// el plano 3: el zoo, Harry le habla a la boa
const llega = a(0.528), hablaA = a(0.539), encoge = a(0.6);
const p3 = (t) => {
  const g = T.muggle(R, t, { encuadre: 'zoo' });
  // un niño (el primo, de espaldas al reflejo) da golpecitos en el cristal y se va aburrido
  const toc = t < a(0.525), vete = tramo(t, a(0.53), a(0.6)), nx = Math.round(lerp(196, 262, vete));
  R.actor(EL.chico, nx, 160, t, { dir: vete > 0 ? 1 : -1, dedo: toc && Math.sin(t * 14) > 0, anda: vete > 0 && vete < 1, enfado: vete > 0 });
  // el cuidador friega el suelo a la izquierda, con su cubo y el cono de suelo mojado (un «!»); al final escurre la fregona
  { const cx = 58, fr = t < a(0.6), mo = fr ? Math.sin(t * 5) * 7 : 0, mx = cx - 14 + mo;
    R.rect(cx + 12, 152, cx + 20, 160, K); R.rect(cx + 13, 153, cx + 19, 159, hex('#5a7aa8')); R.rect(cx + 13, 153, cx + 19, 154, hex('#8aa8d0')); R.rect(cx + 14, 155, cx + 18, 155, hex('#9ac8e8')); R.linea(cx + 12, 151, cx + 16, 148, hex('#3a3a3a')); R.linea(cx + 16, 148, cx + 20, 151, hex('#3a3a3a'));
    const cuid = R.actor(EL.conserje, cx, 160, t, { dir: -1, sostiene: fr ? [cx - 8 + Math.round(mo * 0.3), 144] : [cx + 12, 146], sonrisa: !fr });
    const [hx0, hy0] = cuid.mano, fx = fr ? Math.round(mx) : cx + 16, fy = fr ? 159 : 152;
    R.linea(hx0, hy0, fx, fy - 2, hex('#8a6a3a')); R.rect(fx - 3, fy - 2, fx + 3, fy, hex('#d8d0b8')); R.pset(fx - 3, fy, hex('#a8a090')); R.pset(fx + 3, fy, hex('#a8a090'));
    // al acabar, mete la fregona en el cubo: salpica unas gotas
    { const v = tramo(t, a(0.6), a(0.6) + 0.5); if (v > 0 && v < 1) for (let k = 0; k < 5; k++) { const gx = cx + 16 + Math.round((k - 2) * (1 + v * 3)), gy = Math.round(151 - Math.sin(v * Math.PI) * (5 + (k % 2) * 3) + v * 4); R.pset(gx, gy, hex('#9ac8e8')); if (k % 2) R.pset(gx, gy - 1, hex('#e0f4ff')); } }
    // el brillo del suelo mojado detrás de la fregona
    for (let k = 0; k < 6; k++) { const wx = cx - 24 + k * 4 + (k & 1); R.pset(wx, 161 + (k % 3), mix(R.pget(wx, 161 + (k % 3)), hex('#cfe8ff'), 0.5)); }
    // el cono amarillo con su «!»
    const ox = 18; R.poligono([[ox - 5, 160], [ox + 5, 160], [ox, 146]], hex('#e8b830')); R.linea(ox - 5, 160, ox + 5, 160, K); R.linea(ox - 5, 160, ox, 146, K); R.linea(ox + 5, 160, ox, 146, K); R.rect(ox - 3, 154, ox + 3, 155, hex('#f8f0d0')); R.pset(ox, 150, K); R.pset(ox, 151, K); R.pset(ox, 153, K); }
  const hx = Math.round(lerp(30, 136, tramo(t, P3 + 0.15, llega)));
  const habla = t > hablaA && t < a(0.592);
  R.actor(EL.harryCalle, hx, 160, t, { dir: 1, anda: t < llega, habla: habla && Math.sin(t * 11) > -0.3, sorpresa: t > encoge && t < a(0.64), sonrisa: t > a(0.64), brazos: t > encoge && t < a(0.625) });
  if (t > encoge) R.icono('?', hx + 5, 126 - Math.round(tramo(t, encoge, encoge + 0.3) * 4), hex('#f8f0d0'), K);
  // ondas de voz hacia la boa mientras habla
  if (habla) for (let k = 0; k < 3; k++) { const f = (t * 1.2 + k / 3) % 1, cx = hx + 16 + f * 22, cy = 136 - f * 30, r = 2 + f * 4; for (let q = -3; q <= 3; q++) { const an = -0.8 + q * 0.25; R.pset(Math.round(cx + Math.cos(an) * r), Math.round(cy + Math.sin(an) * r), mix(hex('#d8ffd0'), hex('#3a6a3a'), f * 0.6)); } }
  T.muggleDelante(R, t, { encuadre: 'zoo' });
};
// el plano 4: el cristal de cerca, el guiño y el cristal que se deshace en chispas
const guina = a(0.722), sisea = a(0.74), barre = a(0.79), atras = a(0.84);
const p4 = (t) => {
  const gu = tramo(t, guina, guina + 0.15) - tramo(t, guina + 0.7, guina + 0.85);
  const g = T.muggle(R, t, { encuadre: 'zoo', camara: 'cristal', guiño: gu, guino: gu });
  // el guiño: una estrellita que destella junto al ojo que se cierra
  if (gu > 0.3) { const sx = 214 + Math.round(Math.sin(t * 0.7) * 4), sy = 118, L = 2 + Math.round(gu * 2); halo(sx, sy, 8, hex('#fff6c8'), 0.5); for (let k = -L; k <= L; k++) { R.pset(sx + k, sy, hex('#fff6c8')); R.pset(sx, sy + k, hex('#fff6c8')); } R.pset(sx - 1, sy - 1, hex('#ffffff')); R.pset(sx + 1, sy + 1, hex('#ffffff')); R.pset(sx, sy, hex('#ffffff')); }
  // el brillo que barre el cristal de izquierda a derecha y lo deja en chispas
  const b = tramo(t, barre, barre + 1.1);
  if (b > 0) {
    const [x0, y0, x1, y1] = g.cristal ?? [14, 12, 306, 162], bx = Math.round(lerp(x0 - 30, x1 + 30, b));
