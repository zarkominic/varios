<script type="module">
// HP-APAGADOR (frase 24), sin cartela, 1997 en la barra (el libro). Cuatro planos:
// 1. Privet Drive de noche: un coche pasa por la calzada con los faros encendidos (por delante); Dumbledore entra por la acera, levanta el apagador y hace clic: las cuatro farolas se apagan
//    de una en una (la más lejana primero) y cada luz vuela, con su estela, a meterse en el aparato; el gato lo mira desde la
//    tapia y una lechuza cruza el cielo y se posa en un tejado a mirar, girando la cabeza con cada farola. Corta en
//    «the Put-Outer».
// 2. El bosque de noche (el último libro), con decorado propio de la escena para no repetir hp-bosque: la orilla de un
//    arroyo bajo las copas, con un hueco de cielo (luna y nubes de tres tonos), la luna reflejada en el agua que corre, una
//    cascadita, bruma, juncos, una lechuza parda en la rama y un ciervo que bebe en la otra orilla, alza la cabeza con el
//    crujido y huye cuando sale la luz; delante, el tronco grande con hiedra y los helechos. Ron anda a oscuras por el sendero; cruje una rama (se sobresalta) y mira a los
//    lados; una ráfaga arrastra hojas secas entre los troncos; murciélagos revolotean; saca el mismo apagador, clic en «Ron», y sale una bolita de luz azulada que flota delante
//    y le alumbra: un conejo huye a saltos por el sendero; él sonríe y la sigue. Corta en «And».
// 3. La casa de los reptiles del zoo: un niño da golpecitos al cristal y se aburre; a la izquierda, un cuidador friega el
//    suelo junto a su cono de «!» y su cubo; Harry llega a la barandilla, le habla a la boa («talks to a snake», siseo) y se encoge
//    de hombros («without knowing what he's doing»), mientras el cuidador mete la fregona en el cubo (salpica). Corta en «That's».
// 4. El cristal de cerca: Harry habla, la boa le guiña un ojo y en «Parseltongue» le contesta con un siseo (ondas verdes
//    de la boca de la boa hacia Harry); un brillo recorre el cristal y lo deja
//    hecho chispas (el cristal que desaparece, insinuado); Harry da un paso atrás con «!» y al final mira con «?».
import * as T from '/atomo/plato/escenas/hp-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hp-apagador');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const mix = (c, d, a) => { const ch = (s) => Math.round(((c >>> s) & 255) * (1 - a) + ((d >>> s) & 255) * a); return ((255 << 24) | (ch(16) << 16) | (ch(8) << 8) | ch(0)) >>> 0; };
// un halo de luz tramado alrededor de (x, y): aclara hacia col en la proporción a, que cae hacia el borde
const halo = (x, y, r, col, a) => { for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) { const d = Math.hypot(i, j); if (d > r) continue; const X = Math.round(x + i), Y = Math.round(y + j); if (X < 0 || X > 319 || Y < 0 || Y > 179) continue; R.pset(X, Y, mix(R.pget(X, Y), col, a * (1 - d / r))); } };
// una bolita de luz con su halo, su brillo y una estela de tres puntos
const bola = (x, y, col, r = 2, est = null) => { halo(x, y, r * 4, col, 0.6); R.disco(Math.round(x), Math.round(y), r, col); R.pset(Math.round(x) - 1, Math.round(y) - 1, hex('#ffffff')); if (est) for (let k = 1; k <= 3; k++) R.pset(Math.round(x - est[0] * k * 3), Math.round(y - est[1] * k * 3), mix(col, hex('#ffffff'), 0.3)); };
const brilla = (x, y, t, col = hex('#fff6c8')) => { if (Math.sin(t * 9 + x) > -0.2) { R.pset(x, y - 2, col); R.pset(x, y + 2, col); R.pset(x - 2, y, col); R.pset(x + 2, y, col); R.pset(x, y, hex('#ffffff')); } };
const K = hex('#14111a');
// un coche familiar de noche, de lado y hacia la derecha (x: el centro, s: donde apoyan las ruedas), con los faros que
// alumbran la calzada por delante, los pilotos rojos y los tapacubos que giran
const cocheNoche = (x, s, col, t) => {
  x = Math.round(x);
  const sh = mix(col, K, 0.45), li = mix(col, hex('#ffffff'), 0.28), luz = hex('#fff2c0');
  // el haz de los faros: un cono tramado que se abre por delante y la mancha de luz en el asfalto
  for (let i = 2; i <= 46; i++) { const w = 1 + i * 0.16; for (let j = -Math.round(w); j <= Math.round(w * 0.6); j++) { const X = x + 22 + i, Y = s - 8 + j; if (X < 0 || X > 319 || Y > 179 || ((X + Y) & 1)) continue; R.pset(X, Y, mix(R.pget(X, Y), luz, 0.32 * (1 - i / 48))); } }
  halo(x + 52, s - 1, 13, luz, 0.3); halo(x - 23, s - 8, 5, hex('#ff3a3a'), 0.45);
  // la sombra bajo el coche
  for (let i = -24; i <= 24; i++) { const X = x + i; if (X >= 0 && X <= 319) { R.pset(X, s + 1, mix(R.pget(X, s + 1), K, 0.55)); if (s + 2 < 180) R.pset(X, s + 2, mix(R.pget(X, s + 2), K, 0.3)); } }
  // la carrocería: la caja con su luz arriba y su sombra abajo, y la cabina
  R.rect(x - 22, s - 11, x + 22, s - 3, K); R.rect(x - 21, s - 10, x + 21, s - 4, col); R.rect(x - 21, s - 10, x + 21, s - 10, li); R.rect(x - 21, s - 5, x + 21, s - 4, sh);
  R.rect(x - 13, s - 18, x + 11, s - 11, K); R.rect(x - 12, s - 17, x + 10, s - 11, col); R.rect(x - 12, s - 17, x + 10, s - 17, li);
  // las ventanillas oscuras con un reflejo de la farola, el montante, las puertas y sus tiradores
  R.rect(x - 11, s - 16, x - 2, s - 12, hex('#161e34')); R.rect(x, s - 16, x + 9, s - 12, hex('#161e34')); R.pset(x - 9, s - 15, hex('#5a6a8a')); R.pset(x - 8, s - 14, hex('#3a4a6a')); R.pset(x + 2, s - 15, hex('#5a6a8a'));
  R.linea(x - 1, s - 10, x - 1, s - 5, sh); R.linea(x - 12, s - 10, x - 12, s - 5, sh); R.pset(x - 5, s - 8, li); R.pset(x + 5, s - 8, li);
  // parachoques, faros y pilotos
  R.rect(x + 21, s - 6, x + 23, s - 4, hex('#8a8a92')); R.rect(x - 23, s - 6, x - 21, s - 4, hex('#8a8a92'));
  R.rect(x + 21, s - 9, x + 22, s - 8, luz); R.pset(x + 22, s - 9, hex('#ffffff')); R.rect(x - 22, s - 9, x - 21, s - 8, hex('#e83a3a'));
  // las ruedas, con el tapacubos que gira
  for (const wx of [x - 13, x + 13]) { R.disco(wx, s - 2, 4, K); R.disco(wx, s - 2, 2, hex('#5a5a64')); const an = t * 14; R.pset(Math.round(wx + Math.cos(an) * 2), Math.round(s - 2 + Math.sin(an) * 2), hex('#c8c8d2')); R.pset(wx, s - 2, hex('#2a2a30')); }
};
const PIEZAS_HP = T.PIEZAS_HP;

const a = (f) => en('apagador', f);
const P2 = a(0.246), P3 = a(0.477), P4 = a(0.703);
const SODIO = hex('#ffc860'), AZUL = hex('#bfe4ff');
// el plano 1: los instantes en que se apaga cada farola (la más lejana primero) y su luz vuela al aparato
const ORDEN = [38, 296, 124, 210];   // de la más lejana al anciano (x 167) a la más cercana
const c0 = a(0.107), c1 = a(0.225), apaga = (k) => c0 + (k + 1) / 4 * (c1 - c0) - 0.12;
const p1 = (t) => {
  const u = tramo(t, c0, c1), dx = Math.round(lerp(236, 160, tramo(t, 0.2, a(0.07))));
  const g = T.muggle(R, t, { encuadre: 'calle', farolas: 1 - u, aparato: 167 });
  // la lechuza: cruza el cielo por encima de los tejados y se posa en el caballete de un tejado; mira cada farola que se apaga
  { const v = tramo(t, 0.3, 1.9), cx = 232, cy = 52;
    const ox = v < 1 ? Math.round(lerp(330, cx, v)) : cx, oy = v < 1 ? Math.round(lerp(62, cy, v) - Math.sin(v * Math.PI) * 8) : cy;
    const mira = ORDEN.reduce((m, fx, k) => (t > apaga(k) - 0.1 ? fx : m), 200);
    PIEZAS_HP.lechuza(R, ox, oy, { vuela: v < 1, t, dir: v < 1 ? -1 : mira < cx ? -1 : 1 }); }
  T.tinte(R, 0, 179, [8, 10, 30], 0.3 * tramo(t, c0 + 0.3, c1 + 0.3));
  // polillas alrededor de las farolas encendidas
  for (const f of g.farolas ?? []) if (f.encendida) for (let k = 0; k < 3; k++) { const an = t * (3 + k) + k * 2.1 + f.x; R.pset(Math.round(f.x + Math.cos(an) * (5 + k)), Math.round(f.y + 2 + Math.sin(an * 1.3) * 4), hex('#f8eed0')); }
  const anda = t < a(0.07), levanta = t > a(0.08) && t < c1 + 0.6;
  const ac = R.actor(EL.dumbledore, dx, 138, t, { dir: -1, anda, sostiene: levanta ? [dx - 4, 104] : false, sonrisa: t > c1 + 0.2, habla: !anda && !levanta && t < a(0.08) });
  const [mx, my] = ac.mano;
  // las luces que vuelan de cada farola al apagador (orden: de la más lejana a la más cercana)
  const FX = ORDEN;
  FX.forEach((fx, k) => { const v = tramo(t, apaga(k), apaga(k) + 0.55); if (v <= 0 || v >= 1) return; const e = v * v * (3 - 2 * v), x = lerp(fx, mx, e), y = lerp(69, my - 6, e) - Math.sin(v * Math.PI) * 18; bola(x, y, SODIO, 3, [(mx - fx) / 300, 0]); });
  if (levanta) PIEZAS_HP.apagador(R, mx, my + 4, { luz: FX.some((fx, k) => t > apaga(k) + 0.5 && t < apaga(k) + 0.75) });
  // el clic: un destello pequeño en el botón
  FX.forEach((fx, k) => { if (t > apaga(k) - 0.05 && t < apaga(k) + 0.12) brilla(mx + 3, my - 5, 1, hex('#ffffff')); });
  // el coche que pasa por la calzada antes del primer clic (va por delante de todo lo de la acera)
  { const u = tramo(t, 0.05, 1.95); if (u > 0 && u < 1) cocheNoche(lerp(-48, 372, u), 174, hex('#3a5a7a'), t); }
  T.muggleDelante(R, t, { encuadre: 'calle' });
};
// ── el decorado propio del plano 2: la orilla de un arroyo en el bosque, de noche (no repite el bosque de hp-bosque 2
// ni el claro de hp-bosque 1 y hp-cierre). Tres términos: los troncos lejanos azulados por la bruma con la orilla de
// enfrente (y su ciervo), el arroyo con la luna reflejada y una cascadita; el sendero de la orilla de acá; y delante el
// tronco grande de la izquierda y los helechos de la derecha. Arriba, las copas con un hueco de cielo (luna y nubes).
const hs = (x, y, s) => { let n = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s, 1442695041)) | 0; n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };
const rn = (x, y, sc, s) => { const X = x / sc, Y = y / sc, x0 = Math.floor(X), y0 = Math.floor(Y), fx = X - x0, fy = Y - y0, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  return (hs(x0, y0, s) * (1 - u) + hs(x0 + 1, y0, s) * u) * (1 - v) + (hs(x0, y0 + 1, s) * (1 - u) + hs(x0 + 1, y0 + 1, s) * u) * v; };
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], umb = (x, y) => B4[(y & 3) * 4 + (x & 3)] / 16;
const LUNA = [222, 24];
const hueco = (x, y) => ((x - 200) / 64) ** 2 + ((y + 4) / 54) ** 2 + (rn(x, y, 7, 11) - 0.5) * 0.5;   // < 1: se ve el cielo
const orilla = (x) => 118 + Math.round(rn(x, 0, 12, 15) * 6) + (x > 250 && x < 266 ? 4 : 0);       // el borde de la orilla de enfrente
const TR_MED = [[42, 54, 1], [98, 106, 2], [176, 181, 3], [236, 246, 4], [292, 304, 5]];          // los troncos de en medio (orilla de enfrente)
// un tronco con corteza: vetas verticales, la sombra a un lado, el filo de luna al otro, nudos y raíces
const tronco = (x0, x1, y0, y1, [cS, c, cV, cL], k, luzDcha = true, raiz = true) => {
  const w = x1 - x0;
  for (let y = Math.max(0, y0); y <= Math.min(179, y1); y++) for (let x = Math.max(0, x0); x <= Math.min(319, x1); x++) {
    const u0 = (x - x0) / Math.max(1, w), u = luzDcha ? u0 : 1 - u0, v = rn(x * 3, y * 0.4, 6, 20 + k);
    let p = u < 0.28 ? cS : v > 0.62 ? cV : c; if (u > 0.86) p = cL; else if (u > 0.76 && v > 0.45) p = cL; if (hs(x, (y / 3) | 0, 30 + k) < 0.05) p = cS; R.pset(x, y, p); }
  for (let i = 0; i < 3; i++) { const ny = y0 + 12 + Math.floor(hs(i, 1, 40 + k) * Math.max(1, y1 - y0 - 30)), nx = x0 + 2 + Math.floor(hs(i, 2, 40 + k) * Math.max(1, w - 4)); R.disco(nx, ny, 1.4, cS); R.pset(nx + (luzDcha ? 1 : -1), ny - 1, cV); }
  if (raiz) for (const d of [-1, 1]) { const bx = d < 0 ? x0 + 1 : x1 - 1, L = Math.max(4, w * 0.8); R.poligono([[bx, y1 - 8], [bx + d * L, y1 + 2], [bx + d * L * 0.5, y1 + 3], [bx - d * 2, y1 + 1]], (x, y) => ((x + y) % 3 === 0 ? cS : c)); R.linea(bx, y1 - 7, bx + d * L, y1 + 2, d > 0 === luzDcha ? cL : cS); }
};
// una hoja de helecho que sale de (x, y) hacia dir, de largo L, con sus foliolos (m: lo que se mece)
const helecho = (x, y, L, dir, col, colL, m = 0) => {
  let px = x, py = y;
  for (let i = 1; i <= L; i++) { const s = i / L, nx = x + dir * i * 0.9 + m * s * s * 4, ny = y - Math.sin(s * Math.PI * 0.75) * L * 0.55 + s * s * L * 0.25; R.linea(Math.round(px), Math.round(py), Math.round(nx), Math.round(ny), col);
    if (i % 2 === 0) { const f = Math.max(1, Math.round((1 - s) * 5)); R.linea(Math.round(nx), Math.round(ny), Math.round(nx - dir), Math.round(ny + f), col); R.linea(Math.round(nx), Math.round(ny), Math.round(nx + dir * f * 0.6), Math.round(ny - f * 0.5), colL); }
    px = nx; py = ny; }
};
// el fondo fijo: cielo, luna, troncos lejanos, la orilla de enfrente, el agua, la orilla de acá y el sendero
const pintaFondo2 = () => {
  const P = R.pset;
  const SK = [hex('#080d28'), hex('#0c1434'), hex('#121c44'), hex('#18244f'), hex('#1e2c5a')];
  for (let y = 0; y < 100; y++) for (let x = 0; x < 320; x++) { const f = Math.min(3.999, y / 18), i = Math.floor(f); P(x, y, SK[f - i > umb(x, y) ? i + 1 : i]); }
  for (let i = 0; i < 70; i++) { const x = 130 + Math.floor(hs(i, 1, 50) * 140), y = Math.floor(hs(i, 2, 50) * 50); P(x, y, i % 6 ? hex('#7a8ac0') : hex('#ffffff')); }
  // dos filas de troncos lejanos, cada vez más azulados
  for (let i = 0; i < 30; i++) { const x = Math.floor(hs(i, 1, 51) * 330) - 5, w = 2 + Math.floor(hs(i, 2, 51) * 3); tronco(x, x + w, 20, 116, [hex('#24305a'), hex('#2a3864'), hex('#303f6c'), hex('#3e4e80')], 60 + i, x < LUNA[0], false); }
  // la bruma de abajo: el aire se aclara hacia la orilla de enfrente
  for (let y = 70; y < 122; y++) for (let x = 0; x < 320; x++) if (umb(x, y) < (y - 70) / 52 * 0.45) P(x, y, mix(R.pget(x, y), hex('#4a5a8a'), 0.35));
  for (let i = 0; i < 16; i++) { const x = Math.floor(hs(i, 1, 52) * 330) - 5, w = 3 + Math.floor(hs(i, 2, 52) * 4); tronco(x, x + w, 12, 118, [hex('#141c3a'), hex('#1a2448'), hex('#202c54'), hex('#34427a')], 80 + i, x < LUNA[0], false); }
  // la luna (por delante de los troncos lejanos, que en el hueco son solo bruma) con su halo tramado, sus mares y el filo
  for (let j = -18; j <= 18; j++) for (let i = -18; i <= 18; i++) { const d = Math.hypot(i, j), X = LUNA[0] + i, Y = LUNA[1] + j; if (d > 7 && d < 18 && umb(X, Y) < 0.5 * (1 - (d - 7) / 11)) P(X, Y, mix(R.pget(X, Y), hex('#8a9ad8'), 0.45)); }
  R.disco(LUNA[0], LUNA[1], 7, hex('#e8ecf8')); R.disco(LUNA[0] + 1, LUNA[1] + 1, 6, hex('#d8dcf0')); R.disco(LUNA[0] - 2, LUNA[1] - 1, 2, hex('#b8c0dc')); R.disco(LUNA[0] + 3, LUNA[1] + 2, 1.4, hex('#b8c0dc')); P(LUNA[0] - 3, LUNA[1] - 4, hex('#ffffff'));
  // el sotobosque de la otra orilla en silueta, con matas
  for (let x = 0; x < 320; x++) { const a = 104 + Math.round(rn(x, 0, 8, 53) * 12 - Math.abs(Math.sin(x * 0.23)) * 4); for (let y = a; y < 124; y++) P(x, y, y === a ? hex('#2a3c56') : rn(x, y, 3, 54) > 0.6 ? hex('#1a2842') : hex('#142036')); }
  // la orilla de enfrente: tierra con musgo arriba y su borde de luz, piedras
  for (let x = 0; x < 320; x++) { const o = orilla(x); for (let y = o; y < 130; y++) { const q = rn(x, y, 3, 55); let c = y - o < 2 ? (q > 0.5 ? hex('#3a5a4a') : hex('#2e4a3e')) : q > 0.6 ? hex('#2a2420') : hex('#1e1a18'); if (y - o === 0 && x > 120) c = hex('#5a7a6a'); if (hs(x, y, 56) < 0.04) c = hex('#4a3e30'); P(x, y, c); } }
  // el agua: oscura, con vetas horizontales y el reflejo de los troncos de en medio
  for (let y = 124; y < 147; y++) for (let x = 0; x < 320; x++) { if (y < orilla(x) + 6) continue; const q = rn(x * 0.4, y * 3, 5, 57), d = (y - 124) / 22;
    let c = q > 0.66 ? hex('#22345e') : q > 0.4 ? hex('#18284c') : hex('#12203e'); if (TR_MED.some(([a, b]) => x >= a && x <= b)) c = mix(c, hex('#060810'), 0.5);
    if (Math.abs(x - LUNA[0]) < 10 - d * 4 && umb(x, y) < 0.35) c = mix(c, hex('#a8b8e8'), 0.35); if (y === orilla(x) + 6) c = hex('#0c1428'); P(x, y, c); }
  // las piedras de la cascadita, a la derecha
  for (const [x, y, r] of [[248, 124, 5], [270, 125, 6], [258, 134, 3], [242, 138, 2]]) { R.disco(x, y, r, hex('#2a2c3a')); R.disco(x - 1, y - 1, r - 1.5, hex('#3e4252')); R.linea(x - r + 2, y - r + 1, x + 1, y - r, hex('#7a8098')); }
  // la orilla de acá: hierba con borde irregular sobre el agua, piedras redondas
  for (let x = 0; x < 320; x++) { const b = 145 + Math.round(rn(x, 0, 6, 58) * 5); for (let y = b; y < 158; y++) { const q = rn(x, y, 3, 59), hq = hs(x, y, 60); let c = y === b ? hex('#3e5a48') : q > 0.6 ? hex('#2a3e30') : q > 0.3 ? hex('#22342a') : hex('#1a2a22'); if (hq > 0.95) c = hex('#4e6e54'); else if (hq < 0.04) c = hex('#121c16'); P(x, y, c); } }
  for (let i = 0; i < 9; i++) { const x = 30 + Math.floor(hs(i, 1, 61) * 270), y = 150 + Math.floor(hs(i, 2, 61) * 5); R.disco(x, y, 2, hex('#2e3040')); P(x - 1, y - 1, hex('#7a8098')); P(x, y - 2, hex('#5a6078')); }
  // el sendero: tierra apisonada con roderas, hojarasca ocre, guijarros, la luz de luna en la parte de la derecha
  for (let y = 156; y < 180; y++) for (let x = 0; x < 320; x++) { const top = 155 + Math.round(rn(x, 1, 7, 62) * 3), bot = 174 + Math.round(rn(x, 2, 9, 63) * 4); if (y < top) continue;
    const q = rn(x, y, 4, 64), hq = hs(x, y, 65), sen = y < bot; let c;
    if (sen) { c = q > 0.62 ? hex('#4a4440') : q > 0.35 ? hex('#3c3834') : hex('#322e2c'); if (Math.abs(y - 164 - Math.sin(x * 0.05)) < 1 || Math.abs(y - 171 + Math.sin(x * 0.04)) < 1) c = hex('#2a2624'); }
    else c = q > 0.55 ? hex('#1e1c18') : hex('#161412');
    if (hq > 0.965) c = hex(['#8a6a3a', '#a87e44', '#6a4a2a'][Math.floor(hq * 1000) % 3]); else if (hq < 0.025) c = hex('#5a5a62');
    const dl = ((x - 216) / 52) ** 2 + ((y - 166) / 9) ** 2; if (sen && dl < 1 && umb(x, y) < (1 - dl) * 0.5) c = mix(c, hex('#a8b8e8'), 0.28);
