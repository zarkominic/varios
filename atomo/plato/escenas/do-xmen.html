// DO-XMEN (frase 41), sin cartela; año 2026. Dos planos, los dos dibujados aquí (no repiten los encuadres de la mansión de do-fox):

const efectos = [[0.4, 'viento', { dur: 1.3 }], [ABRE, 'puerta'], [MAG - 0.7, 'zumbido'], [CIC, 'flash'], [MIS - 0.3, 'brillo'], [NOC, 'pop'], [BES, 'boing'], [MISMOS, 'palmada']];
T.rodar(E, R, [[0, p1], [P2, p2]], { efectos, año: 2026 });
