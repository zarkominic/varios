// LF-INTERIOR (frases 21–23, acto 6 «La montaña que no existe»), 2026, sin cartela. Trece planos:

//    ciervo («hunting»), el pescador de la barca lanza a la derecha (el sedal nunca cruza el cartel) y salta un pez

//    topógrafo abre el trípode, se inclina al nivel y la burbuja se centra en «flat» (en grande en la lupa); la visual

// 11. (britton/capas) «when the sea dropped»: más cúmulos de tres tonos; el mar con crestas, cabrilleo y dos delfines;

// 13. (LOCAL: la mesa con el mapa) «the hills of Georgia and the Carolinas… Florida has gained a mountain»: en el mapa

import * as T from '/atomo/plato/escenas/lf-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('lf-interior');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const A = (s) => en('ambrosia', (s - 0.9) / 19.951), K = (s) => en('kalaga', (s - 22.256) / 15.784), L = (s) => en('plana', (s - 39.895) / 22.585);
const P2 = A(3.81), P3 = A(8.45), P4 = A(14.77), P5 = A(18.41), P6 = K(22.26), P7 = K(27.95), P8 = K(32.89), P9 = L(39.9), P10 = L(45.21), P11 = L(49.19), P12 = L(53.31), P13 = L(57.83);
// ── utilidades ──
const VAC = 0, CAPAS = {};
const capa = (k, fn) => { if (!CAPAS[k]) { const b = R.nuevo(); b.fill(VAC); const prev = R.usar(b); fn(); R.usar(prev); CAPAS[k] = b; } return CAPAS[k]; };
const pegar = (b) => { const d = R.buf; for (let i = 0; i < 57600; i++) { const c = b[i]; if (c !== VAC) d[i] = c; } };

// Atom en el decorado: el resplandor tramado y el átomo

  for (let j = -rr; j <= rr; j++) for (let i = -rr; i <= rr; i++) { const g = 1 - Math.hypot(i, j) / rr; if (g > 0.3 && ((i + j) & 1 || g > 0.6)) R.pset(ax + i, ay + j, g > 0.7 ? R.PAL.GLOW[1] : R.PAL.GLOW[0]); }

const fueraDeEsquina = (a, b) => { const orig = R.companero; R.companero = (t, e) => { if (t >= a && t < b) return; orig(t, e); }; };
// la bandera de barras y estrellas en su mástil (pie en x, suelo)

    for (let j = 0; j < 10; j++) { const c = i < 7 && j < 5 ? (((i + j) & 1) && j % 2 ? BL : hex('#2a3a7a')) : (Math.floor(j / 1.43) % 2 ? BL : ROJO); R.pset(x + 1 + i, suelo - alto + 1 + j + dy, c); } }

// ── piezas pequeñas ──
const pez = (x, y, dir, c, cs) => { x = Math.round(x); y = Math.round(y); R.rect(x - 2, y - 1, x + 2, y + 1, c); R.pset(x - 3, y, c); R.pset(x + 3, y, c); R.rect(x - 2, y + 1, x + 2, y + 1, cs);

const vaca = (x, suelo, dir, t, mira = 0) => { x = Math.round(x); const X = (i) => (dir > 0 ? x + i : x + 13 - i), y = suelo;
  const N = hex('#2a2430'), W = hex('#f2eee2'), Ws = hex('#c8c0b0'), RS = hex('#e8a0a0');

  R.pset(X(0), y - 7 + Math.round(Math.sin(t * 3 + x)), N); };

  for (let i = 0; i <= 9; i++) for (let j = 0; j < 4; j++) R.pset(X(i), y - 9 + j, j === 3 ? Ms : M);
  R.pset(X(-1), y - 9, Bc); R.pset(X(-1), y - 8, Bc); R.rect(Math.min(X(9), X(10)), y - 13, Math.max(X(9), X(10)), y - 9, M); R.rect(Math.min(X(10), X(12)), y - 14, Math.max(X(10), X(12)), y - 12, M); R.pset(X(12), y - 13, K0); R.pset(X(11), y - 15, Ms);
  const L1 = fase ? [[1, -3], [8, 3]] : [[2, 0], [7, 0]];

const jeep = (x, y, t, bote) => { x = Math.round(x); y = Math.round(y - bote); const V = hex('#3a6a3a'), Vs = hex('#2a4a2a'), Vl = hex('#5a8a4a');
  R.rect(x, y - 9, x + 19, y - 3, V); R.rect(x, y - 9, x + 19, y - 9, Vl); R.rect(x + 3, y - 15, x + 13, y - 10, K0); R.rect(x + 4, y - 14, x + 12, y - 10, hex('#9ac0e8')); R.rect(x + 8, y - 14, x + 8, y - 10, K0);
  R.rect(x + 1, y - 16, x + 15, y - 15, Vs); R.rect(x, y - 3, x + 19, y - 3, Vs); R.pset(x + 19, y - 7, AMA); R.rect(x - 2, y - 7, x - 1, y - 4, K0);
  for (const wx of [x + 4, x + 15]) { R.disco(wx, y - 1, 3, K0); R.disco(wx, y - 1, 1.4, hex('#8a8a94')); R.pset(wx + Math.round(Math.cos(t * 12) * 2), y - 1 + Math.round(Math.sin(t * 12) * 2), hex('#4a4a52')); } };
const barca = (x, y, c = hex('#c8603a')) => { x = Math.round(x); y = Math.round(y); R.poligono([[x - 14, y - 5], [x + 14, y - 5], [x + 10, y + 1], [x - 11, y + 1]], c); R.linea(x - 14, y - 5, x + 14, y - 5, BL); R.linea(x - 10, y + 1, x + 10, y + 1, K0); R.linea(x - 12, y - 2, x + 12, y - 2, hex('#9a4024')); };
const ondas = (x, y, w, t, c) => { for (let i = -w; i <= w; i += 3) if (Math.sin(t * 3 + i * 0.6) > 0.2) R.pset(Math.round(x + i), y, c); };

// ── 1. el mapa de papel: de la costa al interior ──
// El mapa se acerca al sur de Florida (del lago a Miami) para que la pick-up y su ruta se lean; encima del detalle del
// decorado, la escena estampa una vez su capa de la tierra: la trama del papel, las parcelas de caña al sur del lago, las

// de la barra del año.
const Z1 = 12, C1 = [-80.75, 26.42];
let TIERRA1 = null;
const tierra1 = (P) => { if (TIERRA1) return TIERRA1;
  const tmp = R.nuevo(), prev = R.usar(tmp); T.mapa(R, 0, { zoom: Z1, centro: C1, vida: false, detalle: false });
  const B = R.buf, es = new Uint8Array(57600); for (let i = 0; i < 57600; i++) { const c = B[i], r = c & 255, g = (c >>> 8) & 255, b = (c >>> 16) & 255; if (r > 170 && g > 150 && r - b > 25) es[i] = 1; }
  R.usar(prev);
  const libre = (x, y) => x >= 24 && x < 296 && y >= 18 && y < 166 && !(x >= 268 && y <= 50) && !(x >= 16 && x <= 176 && y <= 24) && es[y * 320 + x] === 1;
  const idx = [], col = [], hecho = new Map(), pon = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (!libre(x, y)) return; const i = y * 320 + x; if (hecho.has(i)) { col[hecho.get(i)] = c; return; } hecho.set(i, idx.length); idx.push(i); col.push(c); };
  const PX = (q) => P(q).map(Math.round);
  // la trama del papel: fibras cortas y motas

  // los pinares a motas y los potreros de la tierra baja al oeste y al este del lago (antes que canales y carreteras)
  for (let k = 0; k < 260; k++) { const [x, y] = PX([-82.1 + h(k, 1, 57) * 1.05, 26.35 + h(k, 2, 57) * 0.85]); if (h(k, 3, 57) > 0.4) { pon(x, y - 1, hex('#4a7a3a')); pon(x - 1, y, hex('#3a6a32')); pon(x, y, hex('#3a6a32')); pon(x + 1, y, hex('#3a6a32')); pon(x, y + 1, hex('#6a4a2a')); } else { pon(x, y, hex('#b8c87a')); pon(x + 1, y, hex('#a8b86a')); } }
  for (const [lo0, la0, lo1, la1] of [[-81.75, 26.75, -81.5, 26.95], [-81.45, 26.45, -81.2, 26.62], [-80.55, 26.95, -80.3, 27.15]]) { const [x0, y0] = PX([lo0, la1]), [x1, y1] = PX([lo1, la0]); for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const bx_ = x === x0 || x === x1 || y === y0 || y === y1; pon(x, y, bx_ ? ((x + y) & 1 ? hex('#8a6a4a') : hex('#c8b890')) : (h(x, y, 58) > 0.88 ? hex('#7aa04a') : (x + y) % 4 ? hex('#c0cc84') : hex('#aabc70'))); } }
  // el relieve suave: rayitas de sombra a la derecha de las lomas del norte
  for (let k = 0; k < 90; k++) { const [x, y] = PX([-81.5 + h(k, 1, 51) * 1.4, 27.0 + h(k, 2, 51) * 0.8]); pon(x, y, hex('#c8a878')); pon(x + 1, y + 1, hex('#c8a878')); }
  // las manchas de pantano: matas de hierba de sierra y charcos, al sur y al oeste
  for (let k = 0; k < 140; k++) { const [x, y] = PX([-81.5 + h(k, 3, 52) * 1.1, 25.75 + h(k, 4, 52) * 0.55]); if (h(k, 5, 52) > 0.3) { pon(x, y, hex('#5a8a4a')); pon(x - 1, y + 1, hex('#5a8a4a')); pon(x + 1, y + 1, hex('#86ac62')); } else { pon(x, y, hex('#5a90c4')); pon(x + 1, y, hex('#7ab0d8')); } }
  // las parcelas de caña al sur del lago: rectángulos de surcos, verde tierno (el oro llega con la pick-up)
  const [ax, ay] = PX([-80.98, 26.72]), [bx, by] = PX([-80.45, 26.42]);
  for (let y = ay; y <= by; y++) for (let x = ax; x <= bx; x++) { const px = Math.floor((x - ax) / 9), py = Math.floor((y - ay) / 7), bx_ = (x - ax) % 9, by_ = (y - ay) % 7; if (bx_ === 0 || by_ === 0) { pon(x, y, hex('#b8a070')); continue; } pon(x, y, (y & 1) ? ((px + py) % 3 === 0 ? hex('#a8c070') : hex('#98b864')) : hex('#c8d08a')); }
  // los canales rectos del lago al mar y los ríos
  for (const L of [[[-80.72, 26.68], [-80.38, 26.2], [-80.16, 26.1]], [[-80.82, 26.68], [-80.5, 26.1], [-80.3, 25.8]], [[-80.64, 26.72], [-80.07, 26.71]], [[-81.08, 26.78], [-81.85, 26.6]], [[-80.9, 27.2], [-81.1, 27.6]]]) for (let q = 0; q + 1 < L.length; q++) { const [x0, y0] = P(L[q]), [x1, y1] = P(L[q + 1]), n = Math.ceil(Math.hypot(x1 - x0, y1 - y0)); for (let k = 0; k <= n; k++) { const x = lerp(x0, x1, k / n), y = lerp(y0, y1, k / n); pon(x, y, hex('#3a6aa0')); pon(x, y + 1, hex('#7ab0d8')); } }

  for (const L of [[[-80.93, 26.75], [-80.62, 26.4], [-80.45, 26.0], [-80.35, 25.78]], [[-80.2, 25.6], [-80.15, 26.1], [-80.1, 26.6], [-80.12, 27.1]], [[-81.75, 26.15], [-80.4, 26.15]], [[-80.83, 27.24], [-80.93, 26.75], [-81.2, 26.7]]]) for (let q = 0; q + 1 < L.length; q++) { const [x0, y0] = P(L[q]), [x1, y1] = P(L[q + 1]), n = Math.ceil(Math.hypot(x1 - x0, y1 - y0)); for (let k = 0; k <= n; k++) { const x = lerp(x0, x1, k / n), y = lerp(y0, y1, k / n); pon(x, y, (k >> 1) % 3 === 2 ? hex('#f2e2b8') : hex('#8a7058')); pon(x + 1, y + 1, hex('#b89a78')); } }
