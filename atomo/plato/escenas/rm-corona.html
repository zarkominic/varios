<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Corona · ep5</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// RM-CORONA (frase 52). De vuelta al salón de mármol del principio: Odoacro mete la corona en un cofre y lo cierra.
// Luego el cofre viaja en un trirreme hacia el este, hacia el sol que sale sobre las cúpulas de Constantinopla.
import { preparar, rodar } from '/atomo/plato/escenas/rm-comun.js';
const { E, R, M } = await preparar('rm-corona');
const { PALA, PR, ELENCO, tramo, lerp } = R;
const m0 = M('odoacro', 0.5), dur = E.duracion ?? 14, tb = m0 + (dur - m0) * 0.45;
const S = R.SUELO_SALON;
const salon = (t) => {
  R.salon(t);
  const u = t - m0, guarda = u > 3.5;
  R.personaje(120, S + 26, 40, { ...ELENCO.emperadorNino, sombrero: 'no', t, ceño: true });
  R.cofre(224, S + 26, t, { w: 20, abierto: u < 4.6 });
  R.personaje(196, S + 28, 50, { ...ELENCO.odoacro, t, dir: guarda ? 1 : -1, pose: guarda && u < 4.6 ? 'ofrece' : 'pie', objeto: u < 4.4 ? 'corona' : undefined, ceño: true });
};
const viaje = (t) => {
  R.cieloR(t, 'tarde', { hor: 118, sol: [290, 104, 12] });
  for (const [x, r] of [[270, 9], [300, 12], [250, 6]]) { R.disco(x, 108, r, PALA.PURPURA[1]); R.rect(x - r, 108, x + r, 118, PALA.PURPURA[1]); R.rect(x - 1, 108 - r - 5, x, 108 - r, PALA.PURPURA[1]); }
  R.mar(t, { hor: 118 });
  const p = tramo(t, tb, dur);
  R.trirreme(lerp(40, 220, p), 136, t, { esc: 1.3, vela: PALA.PURPURA });
};
rodar(E, R, [[0, salon], [tb, viaje]], { caja: (t, e) => R.caja(t, t > tb + 0.5 ? tramo(t, tb + 0.5, tb + 0.9) : 0, (x, y) => { R.icono('corona', x + 4, y + 4, PALA.ORO[4], undefined, 2); R.icono('flecha', x + 20, y + 5, undefined, undefined, 2); }, { energia: e }) });
</script>
</body>
</html>
