<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Corona · ep5</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// RM-CORONA (frases 37–38). El salón del principio, ahora vacío y en penumbra: el chaval solo, Odoacro guarda la corona
// en un cofre y un trirreme se la lleva al este, hacia las cúpulas de Constantinopla. Luego la villa junto al mar con
// el chaval jubilado y una bolsa de monedas; y al decir su nombre, tres estatuas: Rómulo con la loba, Augusto con el
// laurel y el chaval con su corona; una luz señala al chaval, luego a Rómulo y luego a Augusto.
import { preparar, rodar } from '/atomo/plato/escenas/rm-comun.js';
const { E, R, M } = await preparar('rm-corona');
const { PALA, PR, ELENCO, tramo, lerp } = R;
const m = { odo: M('odoacro', 0.5), nom: M('nombre', 15) };
const S = R.SUELO_SALON;
const tb = m.odo + (m.nom - m.odo) * 0.62;
const salon = (t) => {
  R.salon(t);
  const u = t - m.odo, guarda = u > 6;
  R.personaje(116, S + 22, 30, { ...ELENCO.emperadorNino, t, sombrero: u < 4 ? 'corona' : 'no', ceño: true });
  R.cofre(226, S + 22, t, { w: 14, abierto: u < 7.4 });
  R.personaje(guarda ? 206 : lerp(160, 190, tramo(t, m.odo + 4.6, m.odo + 5.6)), S + 23, 36, { ...ELENCO.odoacro, t, dir: guarda ? 1 : -1, pose: u > 3.6 && u < 4.4 ? 'ofrece' : 'pie', objeto: u > 4 && u < 7.2 ? 'corona' : undefined, ceño: true });
};
const viaje = (t) => {
  R.cieloR(t, 'tarde', { hor: 118, sol: [290, 104, 12] });
  for (const [x, r] of [[270, 9], [300, 12], [250, 6]]) { R.disco(x, 108, r, PALA.PURPURA[1]); R.rect(x - r, 108, x + r, 118, PALA.PURPURA[1]); }
  R.mar(t, { hor: 118 });
  R.trirreme(lerp(40, 220, tramo(t, tb, m.nom)), 136, t, { esc: 1, vela: PALA.PURPURA });
};
const villa = (t) => {
  R.cieloR(t, 'dia', { hor: 112, sol: [260, 30, 8] });
  R.mar(t, { hor: 112, y1: 132 }); R.suelo(132, PR.PAJA, { luz: 2.8 });
  R.rect(30, 80, 120, 132, PALA.MARMOL[3]); R.rect(30, 80, 33, 132, PALA.MARMOL[4]); for (let k = 0; k < 4; k++) R.rect(40 + k * 20, 92, 47 + k * 20, 106, PALA.CONTORNO);
  R.poligono([[24, 80], [75, 64], [126, 80]], (x, y) => R.tone(PALA.TERRACOTA, 2.6 - (y - 64) * 0.05, x, y));
  for (const x of [12, 140]) for (let y = 0; y < 40; y++) { const w = Math.round(3.5 * Math.sin(Math.PI * y / 40) + 0.5); R.rect(x - w, 132 - y, x + w, 132 - y, PR.HIERBA[y % 5 === 0 ? 2 : 0]); }
  R.rect(176, 156, 214, 158, PR.MADERA[2]); R.rect(178, 158, 180, 164, PR.MADERA[1]); R.rect(210, 158, 212, 164, PR.MADERA[1]);
  R.personaje(196, 160, 26, { ...ELENCO.emperadorNino, sombrero: 'no', capa: null, t, pose: 'sentado', objeto: 'bolsa', sonrisa: true, sombra: false });
};
const marmol = { piel: PALA.MARMOL, pelo: PALA.MARMOL, chaqueta: PALA.MARMOL, camisa: PALA.MARMOL, falda: PALA.MARMOL, pantalon: PALA.MARMOL, botas: PALA.MARMOL, faja: PALA.MARMOL, banda: PALA.MARMOL, capa: PALA.MARMOL, antebrazo: PALA.MARMOL, colorLaurel: PALA.MARMOL, luz: undefined, sombra: false };
const estatuas = (t) => {
  R.salon(t, { trono: false, estatua: false, cortina: false });
  const u = t - m.nom - 4.6, foco = u < 0.6 ? -1 : u < 2.2 ? 2 : u < 3.6 ? 0 : 1;   // su nombre → el primer rey → el primer emperador
  [[70, 'romulo'], [160, 'augusto'], [250, 'nino']].forEach(([x, k], i) => {
    if (foco === i || u > 5.2) R.halo(x, 120, 34, [PALA.AMARILLO[1], PALA.AMARILLO[2]], 0.9);
    R.rect(x - 18, 150, x + 18, 168, PALA.MARMOL[2]); R.rect(x - 20, 148, x + 20, 150, PALA.MARMOL[3]);
    R.personaje(x + (k === 'romulo' ? 8 : 0), 148, k === 'nino' ? 28 : 32, { ...ELENCO.cesar, ...marmol, sombrero: k === 'augusto' ? 'laurel' : k === 'nino' ? 'corona' : 'no', tamSombrero: k === 'nino' ? 1.35 : 1, peinado: k === 'nino' ? 'rizos' : 'corto', t: 0 });
    if (k === 'romulo') R.loba(x - 8, 148, 0, { rampa: PALA.MARMOL, esc: 0.6 });
  });
};
rodar(E, R, [[0, salon], [tb, viaje], [m.nom - 0.2, villa], [m.nom + 4.6, estatuas]], { año: 476, caja: (t, e) => R.caja(t, t > tb + 0.5 && t < m.nom - 0.2 ? tramo(t, tb + 0.5, tb + 0.9) : 0, (x, y) => { R.icono('corona', x + 4, y + 4, PALA.ORO[4], undefined, 2); R.icono('flecha', x + 20, y + 5, undefined, undefined, 2); }, { energia: e }) });
</script>
</body>
</html>
