<script type="module">
// PR-GALIPOLI (frase 7), 1465–1500. Cuatro planos:
// 1. el puerto de Galípoli: el niño Piri cruza el muelle corriendo, espanta a una gaviota que picotea un pescado, se para
//    junto a la galera y la señala en «Gallipoli»; da un salto de alegría en «Dardanelles»; el pescador le saluda y un
//    mozo con un saco pasa por delante (corta en «As a boy»);
// 2. a bordo de la galera, otra cámara: la borda roja con el portalón, los remos alzados, el palo con la jarcia y la
//    entena aferrada delante; el muelle, el arsenal de arcadas (con su fragua) y el pueblo detrás. Kemal Reis cruza el
//    muelle y sube por la pasarela de frente, hacia nosotros; en «Kemal Reis» pisa la cubierta, se vuelve y llama al
//    niño, que esperaba al pie y sube detrás; un mozo deja su saco en el montón; marineros y mozo vitorean en «corsair»
//    y en «admirals», y el niño salta (corta en «With him»);
// 3. un mapa del Mediterráneo sobre la mesa: la ruta roja de la galera se dibuja desde Galípoli hasta España
//    («sailing across the whole Mediterranean») y en «battle… battle» estallan dos batallas (corta en «learning»);
// 4. de noche en la galera: Kemal enseña al niño las estrellas (se unen en una constelación), el viento («winds») y las
//    luces de los puertos de la costa («harbors»); las ráfagas del viento cruzan solo el cielo bajo y el mar (recortadas,
//    sin pisar la popa ni la zona de Atom); en «by heart» el niño sonríe y señala él también.
import * as T from '/atomo/plato/escenas/pr-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('pr-galipoli');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const h = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const mez = (a, b, k) => { let r = 0; for (const s of [0, 8, 16]) r |= Math.round(((a >>> s) & 255) * (1 - k) + ((b >>> s) & 255) * k) << s; return (r | 0xff000000) >>> 0; };
const CAPAS = {};
// un fondo fijo en su búfer (se pinta una vez y se copia entero en cada fotograma)
const capa = (k, dib) => { if (!CAPAS[k]) { const b = R.nuevo(), prev = R.usar(b); dib(); R.usar(prev); CAPAS[k] = b; } R.copiar(CAPAS[k]); };
// una pieza fija con transparencia (se pinta una vez y luego se calca píxel a píxel, con un desplazamiento dy)
const SPR = {};
const sprite = (k, dib, dx = 0, dy = 0) => { if (!SPR[k]) { const b = R.nuevo(), prev = R.usar(b); dib(); R.usar(prev); const L = []; for (let i = 0; i < b.length; i++) if (b[i]) L.push(i, b[i]); SPR[k] = L; } const L = SPR[k]; for (let j = 0; j < L.length; j += 2) R.pset(L[j] % 320 + dx, ((L[j] / 320) | 0) + dy, L[j + 1]); };
const tin = (x, y, c, a) => { x = Math.round(x); y = Math.round(y); if (x < 0 || x > 319 || y < 0 || y > 179) return; R.pset(x, y, mez(R.pget(x, y), c, a)); };
const K = hex('#1a1420');
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
// franjas tramadas (cielo o mar) entre y0 e y1 con los colores cols, de arriba abajo
const tramado = (y0, y1, cols) => { for (let y = y0; y < y1; y++) { const u = (y - y0) / (y1 - y0) * (cols.length - 1); for (let x = 0; x < 320; x++) { const k = Math.min(cols.length - 1, Math.floor(u + BAY[(y & 3) * 4 + (x & 3)] / 16)); R.pset(x, y, cols[k]); } } };
// nube de tres tonos (sombra, cuerpo, luz)
const BOLAS = [[-14, 2, 5], [-7, -1, 7], [2, -3, 8], [11, 0, 6], [18, 2, 4], [-19, 3, 3]];
const nube = (cx, cy, s, tonos) => tonos.forEach((c, k) => { for (const [dx, dy, r] of BOLAS) R.disco(cx + dx * s, cy + dy * s - k * 1.5 * s, Math.max(1, r * s - k * 1.25 * s), c); });
// tres capas de nubes a tres velocidades (las lejanas más azuladas)
const TONOS = [[hex('#8aa4c4'), hex('#aec2da'), hex('#cad8ea')], [hex('#a4b8d0'), hex('#d2dcea'), hex('#eef2f8')], [hex('#b4c4d8'), hex('#e2e8f2'), hex('#ffffff')]];
const nubes = (t, ys, sem = 0) => { for (let k = 0; k < 7; k++) { const c = k % 3, v = [1.6, 3.4, 6][c], s = [0.55, 0.8, 1.1][c], x = ((k * 113 + sem * 37 + t * v) % 420) - 50; nube(Math.round(x), ys[c] + (k * 7) % 9, s, TONOS[c]); } };
// el rollito de cartas atado con su cinta (lo que se lleva en la mano)
const rollito = (x, y) => { R.rect(x - 6, y - 3, x + 5, y + 2, K); R.rect(x - 5, y - 2, x + 4, y + 1, hex('#e8d4a4')); R.rect(x - 5, y + 1, x + 4, y + 1, hex('#b89a64')); R.rect(x - 4, y - 2, x + 2, y - 2, hex('#fff4d8')); R.rect(x - 1, y - 3, x, y + 2, hex('#a83224')); R.pset(x - 6, y - 1, hex('#c8a870')); R.pset(x + 5, y - 1, hex('#c8a870')); };

const P2 = en('galipoli', .289), P3 = en('galipoli', .6312), P4 = en('galipoli', .8649);
const gali = en('galipoli', .1449), darda = en('galipoli', .2289), kem = en('galipoli', .398), cors = en('galipoli', .4607), almi = en('galipoli', .5834);
const medi = en('galipoli', .751), bat1 = en('galipoli', .808), bat2 = en('galipoli', .8346);
const costas = en('galipoli', .8736), vientos = en('galipoli', .9142), puertos = en('galipoli', .9441), memoria = en('galipoli', .976);

// ── 1 · el puerto ──
const GAV = ['.kkk.....', 'kWWWk....', 'YkWWWkkkk', '.kWWGGGGk', '..kWWGGk.', '...kkkk..', '....k.k..'];
const PGAV = { k: hex('#2a2a34'), W: hex('#f4f4f0'), G: hex('#9aa4b4'), Y: hex('#e8b030') };
const saco = (x, y) => { R.rect(x - 5, y - 8, x + 4, y + 1, K); R.rect(x - 4, y - 7, x + 3, y, hex('#c8a870')); R.rect(x - 4, y - 2, x + 3, y, hex('#a88850')); R.pset(x - 2, y - 5, hex('#e8d4a0')); R.pset(x + 1, y - 3, hex('#a88850')); R.rect(x - 1, y - 10, x, y - 8, K); };
const red = (x0, y0) => {
  const N = hex('#9a7a4c'), Ns = hex('#5a4228');
  for (let j = 0; j < 7; j++) for (let i = 0; i < 28 - j * 3; i++) { const x = x0 + i + Math.round(j * 1.5), y = y0 - j; R.pset(x, y, (i + j) % 2 ? N : Ns); }
  R.linea(x0 - 1, y0 + 1, x0 + 28, y0 + 1, hex('#3a2a1a'));
  for (const [dx, dy] of [[6, -2], [14, -5], [22, -1]]) { R.disco(x0 + dx, y0 + dy, 1.8, hex('#d8562e')); R.pset(x0 + dx - 1, y0 + dy - 1, hex('#f4a070')); }
};
const p1 = (t) => {
  T.galipoli(R, t, { encuadre: 'puerto' });
  // el pescador remienda la red y saluda al niño
  red(64, 160);
  const sal = t > 2.7 && t < 3.9;
  R.actor(EL.marineroOtomano2, 46, 160, t, { dir: 1, dedo: sal, sonrisa: t > 2.7, habla: sal && Math.sin(t * 9) > 0 });
  // la gaviota picotea un pescado y echa a volar cuando llega el niño
  const v = tramo(t, 2.75, 5.4);
  R.rect(143, 158, 150, 159, hex('#9ab4c8')); R.rect(144, 157, 148, 157, hex('#c4d8e4')); R.pset(142, 157, hex('#9ab4c8')); R.pset(142, 159, hex('#9ab4c8')); R.pset(149, 158, K);
  if (v === 0) R.dibujo(GAV, 151, 153 + (Math.sin(t * 6) > 0.3 ? 1 : 0), 1, PGAV);
  else R.gaviota(Math.round(lerp(155, 60, v)), Math.round(lerp(150, 32, v) + Math.sin(v * 10) * 3), t, 3);
  // el niño cruza corriendo, se para junto a la galera y la señala; salta de alegría
  const u = tramo(t, 0.4, 3.3), x = Math.round(lerp(292, 190, u));
  const sj = tramo(t, darda, darda + 0.5), salto = sj > 0 && sj < 1 ? Math.round(Math.sin(sj * Math.PI) * 6) : 0;
  R.actor(EL.piriNino, x, 160, t, { dir: -1, anda: u > 0 && u < 1, dedo: t > gali - 0.1 && t < P2 - 0.4, sonrisa: t > gali - 0.3, sorpresa: t > 2.75 && t < 3.3, salto });
  // un mozo con un saco al hombro pasa por delante
  const m = tramo(t, 0.2, P2 + 0.3), mx = Math.round(lerp(334, -24, m));
  const a = R.actor(EL.marineroOtomano1, mx, 178, t, { dir: -1, anda: m > 0 && m < 1, sostiene: [mx - 2, 152] });
  saco(a.mano[0], a.mano[1]);
  T.galipoliDelante(R, t, { encuadre: 'puerto' });
};

// ── 2 · desde la cubierta de la galera: Kemal sube por la pasarela de frente y el niño detrás ──
// (otra cámara que el plano 1: estamos a bordo, con la borda, los remos alzados y el palo delante, y el muelle, el
// arsenal y el pueblo al fondo; la pasarela llega de frente al portalón de la borda)
const hy = (x) => Math.round(38 + 6 * Math.sin(x * 0.021 + 0.8) + 3 * Math.sin(x * 0.067) + Math.max(0, x - 230) * 0.12);
const ARCOS = [...Array(11)].map((_, k) => 15 + k * 30);
const fondoCielo2 = () => { tramado(0, 180, [hex('#3a74bc'), hex('#5690d0'), hex('#78a8dc'), hex('#9cc0e6'), hex('#c0d8ee')]); };
// la loma con el pueblo, el arsenal de arcadas y el muelle de losas (fijo, con transparencia: el cielo queda detrás)
const fondoMuelle2 = () => {
  for (let x = 0; x < 320; x++) { const y0 = hy(x); for (let y = y0; y < 64; y++) { const n = h(x >> 1, y >> 1, 11); R.pset(x, y, y === y0 ? hex('#a4c060') : y < y0 + 2 ? hex('#88a64a') : n > 0.84 ? hex('#4a6628') : n > 0.56 ? hex('#6a8a38') : hex('#5e7e32')); } }
  for (let k = 0; k < 46; k++) { const x = Math.round(h(k, 1, 12) * 316), y = hy(x) + 3 + Math.round(h(k, 2, 12) * 14); if (y > 59) continue; R.disco(x, y, 1.6, hex('#3e5a26')); R.pset(x - 1, y - 1, hex('#86a650')); R.pset(x, y + 2, hex('#2e4220')); }
  // casas encaladas con tejado rojo, ventanucos y su sombra
  const casa = (x, w, hh, d) => { const y = Math.min(61, hy(x + (w >> 1)) + hh + 5 + d);
    R.rect(x, y - hh, x + w, y, hex('#e8dcc4')); R.rect(x + w - 1, y - hh, x + w, y, hex('#c2b292')); R.rect(x, y, x + w + 1, y, hex('#7a8a4a'));
    R.rect(x - 1, y - hh - 2, x + w + 1, y - hh - 1, hex('#b4523a')); R.rect(x, y - hh - 3, x + w, y - hh - 3, hex('#d07a52')); R.rect(x - 1, y - hh, x + w + 1, y - hh, hex('#6a2a1c'));
    for (let i = x + 2; i < x + w - 1; i += 4) R.rect(i, y - hh + 2, i + 1, y - hh + 3, hex('#4a3a30')); R.pset(x + 1, y - 2, hex('#7a4a2a')); R.pset(x + 1, y - 1, hex('#7a4a2a')); };
  for (const [x, w, hh, d] of [[4, 9, 6, 2], [18, 8, 5, 6], [32, 10, 6, 0], [48, 7, 5, 5], [60, 9, 6, 1], [76, 8, 5, 4], [136, 9, 6, 2], [150, 8, 5, 6], [164, 10, 6, 0], [182, 7, 5, 4], [196, 8, 5, 1], [252, 9, 5, 1], [266, 8, 4, 3]]) casa(x, w, hh, d);
  // cipreses
  for (const x of [28, 72, 130, 178, 210, 246, 272]) { const y = Math.min(60, hy(x) + 12); for (let j = 0; j < 13; j++) { const r = j < 2 ? 0.6 : Math.min(2.2, 0.6 + j * 0.25) - Math.max(0, j - 10) * 0.6; R.linea(Math.round(x - r), y - 13 + j, Math.round(x + r), y - 13 + j, j % 3 === 0 ? hex('#4a6a30') : hex('#2a4420')); } R.pset(x, y + 1, hex('#5a3a20')); }
  // la mezquita con su cúpula de plomo y el alminar
  { const x = 104, y = 58; R.rect(x - 11, y - 11, x + 11, y, hex('#ece4d2')); R.rect(x + 8, y - 11, x + 11, y, hex('#c4b896')); R.disco(x, y - 12, 7, hex('#8e98a8')); R.disco(x - 1, y - 13, 5.5, hex('#aeb6c4')); R.disco(x - 3, y - 15, 2, hex('#d8dee8')); R.rect(x - 11, y - 12, x + 11, y - 11, hex('#7a8494'));
    for (let i = x - 9; i < x + 9; i += 4) { R.rect(i, y - 8, i + 1, y - 5, hex('#5a4a3a')); R.pset(i, y - 9, hex('#5a4a3a')); } R.linea(x, y - 20, x, y - 22, hex('#d8a840'));
    const m = 122; R.rect(m - 2, 24, m + 2, y, hex('#f0eadc')); R.rect(m + 1, 24, m + 2, y, hex('#c8c0ae')); R.rect(m - 3, 31, m + 3, 32, hex('#d8d0be')); R.rect(m - 3, 33, m + 3, 33, hex('#8a8272')); R.pset(m, 38, hex('#5a4a3a')); R.pset(m, 46, hex('#5a4a3a'));
    R.poligono([[m - 2, 24], [m + 2, 24], [m, 18]], hex('#6a7890')); R.pset(m, 17, hex('#d8a840')); }
  // la torre vieja con almenas y saeteras
  { const x0 = 220, x1 = 238; for (let y = 30; y < 62; y++) for (let x = x0; x <= x1; x++) R.pset(x, y, (y % 4 === 0) || ((x + (y >> 2) * 3) % 7 === 0 && y % 4) ? hex('#a8946c') : x > x1 - 3 ? hex('#b4a07a') : h(x, y, 14) > 0.85 ? hex('#c0ac84') : hex('#d4c09a'));
    for (let x = x0; x <= x1; x += 4) R.rect(x, 26, x + 2, 29, hex('#d4c09a')); R.rect(x0, 29, x1, 30, hex('#8a7a58')); for (const [sx, sy] of [[226, 38], [232, 46], [226, 52]]) R.rect(sx, sy, sx, sy + 3, hex('#3a2c20')); }
  // el tejado del arsenal: tejas con sus canales, cumbrera y alero con sombra
  for (let y = 57; y < 65; y++) for (let x = 0; x < 320; x++) R.pset(x, y, y === 57 ? hex('#6a3020') : y === 64 ? hex('#3a2418') : x % 4 === 0 ? hex('#7a3820') : x % 4 === 1 ? hex('#c8704a') : (y + (x >> 2)) % 3 === 0 ? hex('#a04a2c') : hex('#b45a38'));
  R.rect(138, 50, 145, 57, hex('#b8a27c')); R.rect(143, 50, 145, 57, hex('#8a7656')); R.rect(137, 49, 146, 50, hex('#6a5a44'));
  // la pared de sillares del arsenal
  for (let y = 65; y < 100; y++) for (let x = 0; x < 320; x++) { const f = (y - 65) >> 2, j = (y - 65) % 4 === 3 || (x + f * 5) % 11 === 0, n = h(((x + f * 5) / 11) | 0, f, 15);
    let c = j ? hex('#a89270') : n > 0.75 ? hex('#dccaa4') : n < 0.25 ? hex('#c8b48a') : hex('#d4c096'); if (y < 68) c = mez(c, hex('#4a3420'), 0.35 - (y - 65) * 0.1); R.pset(x, y, c); }
  // las arcadas: dovelas, impostas y el interior en penumbra con lo que guarda cada una
  for (const [k, xc] of ARCOS.entries()) {
    for (let y = 70; y < 100; y++) for (let x = xc - 13; x <= xc + 13; x++) { const dy = Math.max(0, 81 - y), d = Math.hypot(x - xc, dy * 1.05);
      if (d <= 11) R.pset(x, y, mez(hex('#1c140e'), hex('#463626'), Math.min(1, (y - 70) / 30) * 0.8 + (Math.abs(x - xc) / 11) * 0.15));
      else if (d <= 13 && y < 83) R.pset(x, y, Math.round(Math.atan2(dy, x - xc) * 4) % 2 ? hex('#e0d0ae') : hex('#bca680')); }
    R.rect(xc - 13, 81, xc - 11, 82, hex('#e6d8b6')); R.rect(xc + 11, 81, xc + 13, 82, hex('#e6d8b6')); R.rect(xc - 1, 68, xc + 1, 70, hex('#e6d8b6'));
    const tipo = k % 4;
    if (tipo === 0) { for (let i = 0; i < 6; i++) { const x = xc - 8 + i * 3; R.linea(x, 99, x + (i < 3 ? 1 : -1), 86 + Math.abs(i - 2.5), hex('#8a6038')); } R.linea(xc - 9, 98, xc + 8, 98, hex('#a87848')); }
    else if (tipo === 1) { for (const [bx, by] of [[xc - 6, 99], [xc + 1, 99], [xc - 3, 91]]) { R.rect(bx, by - 7, bx + 5, by, hex('#6a4224')); R.rect(bx, by - 5, bx + 5, by - 5, hex('#2a1a10')); R.rect(bx, by - 2, bx + 5, by - 2, hex('#2a1a10')); R.pset(bx + 1, by - 6, hex('#9a6a3a')); } }
    else if (tipo === 2) { for (let i = 0; i < 4; i++) R.linea(xc - 7 + i * 4, 99, xc - 3 + i * 4, 75, i % 2 ? hex('#b08858') : hex('#987040')); }
    else { R.disco(xc - 3, 97, 3.5, hex('#8a6a40')); R.disco(xc - 3, 97, 1.5, hex('#3a2a1a')); R.rect(xc + 2, 92, xc + 9, 99, hex('#7a5a34')); R.rect(xc + 2, 95, xc + 9, 95, hex('#4a3420')); }
  }
  R.rect(0, 98, 319, 99, hex('#9a8462'));
  // el muelle: losas que se agrandan hacia delante, con juntas, brillos, grietas y algo de verdín; el canto al agua
  const FILAS = [100, 104, 109, 115, 121];
  for (let r = 0; r < 4; r++) { const y0 = FILAS[r], y1 = FILAS[r + 1], w = 14 + r * 5, of = r * 7;
    for (let y = y0; y < y1; y++) for (let x = 0; x < 320; x++) { const s = Math.floor((x + of) / w), n = h(s, r, 16), jx = (x + of) % w === 0;
      R.pset(x, y, y === y0 || jx ? hex('#8a7c60') : y === y0 + 1 ? hex('#e2d6b8') : h(x, y, 17) > 0.94 ? hex('#a89a7a') : n > 0.7 ? hex('#c6b896') : n < 0.25 ? hex('#d8cca8') : hex('#cfc2a0')); } }
  for (let x = 0; x < 320; x++) { R.pset(x, 121, hex('#6a5a44')); R.pset(x, 122, hex('#4a3e30')); if (h(x, 3, 18) > 0.8) R.pset(x, 120, hex('#7a8a4a')); }
  R.rect(40, 116, 58, 118, hex('#9ab4c8')); R.rect(43, 116, 52, 116, hex('#c8dce8')); R.rect(214, 112, 228, 113, hex('#9ab4c8'));
  // lo que hay en el muelle: barriles, sacos, cajas, un ancla apoyada, bitas con su cabo y un rollo de cabo
  for (const bx of [94, 103]) { R.rect(bx, 94, bx + 7, 104, K); R.rect(bx + 1, 95, bx + 6, 103, hex('#8a5a30')); R.rect(bx + 1, 97, bx + 6, 97, hex('#4a3020')); R.rect(bx + 1, 101, bx + 6, 101, hex('#4a3020')); R.rect(bx + 2, 95, bx + 2, 103, hex('#b07a44')); }
  for (const [sx, sy] of [[126, 106], [134, 106], [130, 101]]) { R.disco(sx, sy - 3, 4, K); R.disco(sx, sy - 3, 3, hex('#c8a870')); R.pset(sx - 1, sy - 5, hex('#e8d4a0')); R.pset(sx + 1, sy - 1, hex('#a88850')); }
  for (const [cx, cy, w] of [[262, 104, 12], [276, 104, 10], [266, 94, 10]]) { R.rect(cx, cy - 10, cx + w, cy, K); R.rect(cx + 1, cy - 9, cx + w - 1, cy - 1, hex('#a87a44')); R.linea(cx + 1, cy - 9, cx + w - 1, cy - 1, hex('#7a5430')); R.rect(cx + 1, cy - 9, cx + w - 1, cy - 9, hex('#c89a5a')); }
  { const ax = 208; R.rect(ax, 80, ax + 1, 101, hex('#3a3a44')); R.rect(ax - 4, 80, ax + 5, 81, hex('#3a3a44')); R.linea(ax - 6, 96, ax, 102, hex('#3a3a44')); R.linea(ax + 7, 96, ax + 1, 102, hex('#3a3a44')); R.pset(ax, 81, hex('#6a6a78')); R.disco(ax, 78, 2, hex('#3a3a44')); R.disco(ax, 78, 1, hex('#d4c096')); }
  for (const [bx, by] of [[62, 114], [236, 116]]) { R.rect(bx - 2, by - 7, bx + 2, by, K); R.rect(bx - 1, by - 6, bx + 1, by, hex('#4a4a54')); R.rect(bx - 3, by - 8, bx + 3, by - 7, K); R.pset(bx - 1, by - 5, hex('#8a8a98')); R.linea(bx + 2, by - 4, bx + 14, by + 4, hex('#b89a64')); }
  for (let r = 4; r > 0; r--) { R.disco(20, 113, r + 0.5, K); R.disco(20, 113, r, r % 2 ? hex('#c8a870') : hex('#9a7a4c')); }
};
// la galera en primer plano, vista en escorzo (la borda baja y grande a la izquierda, más alta y pequeña hacia proa a
// la derecha): la borda roja con su portalón, la cubierta de tablas que fugan, los remos alzados, el palo con la jarcia
