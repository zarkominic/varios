<!doctype html>
<html lang="es">

<title>El gancho · ep46</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// LT-GANCHO (frases 1–3), sin año. Doce planos, cortados en la voz inglesa:
// 1. (0) el puente de la boda de lado y de lejos: la procesión avanza con el carro; en el mirador una pareja lo señala y
//    en «monster» (EL GOLPE del gancho) la cámara se echa encima de la cara del gusano (1 → 1,8 en 0,15 s), el ocaso se
//    apaga hacia el violeta, los ojos destellan, la onda sacude el aire, todo tiembla, los pájaros huyen del puente y la
//    pareja salta con dos «!»; campanas de boda al empezar;
// 2. («Picture») el río desde la orilla por la mañana, el puente altísimo; un pescador y su hija; ella señala el puente en
//    «high bridge»; pica un pez en «river»; en «wedding day» se sueltan palomas y caen guirnaldas de flores;
// 3. («with people») sobre el tablero: la gente asomada a los pretiles saluda, la procesión viene de frente; una niña corre
//    al pretil y salta para ver en «railings»; su madre señala la procesión; el padre tira pétalos;
// 4. («In the middle») de lado y de cerca: el carro enorme entra rodando entre Habladoras y se planta en el centro en
//    «enormous cart»; la gente del pretil de atrás saluda al pasar; en «alive» el gusano mira a la gente y luego a nosotros;
// 5. («3,500») la nave de la Ciudadela: el gusano en su estrado; el «3500» sube como un contador hasta «years»; un
//    peregrino sube por la alfombra y se queda boquiabierto en «enormous body»; una Habladora entra con un cuenco de
//    incienso y alza los brazos en «years»; el guardia de la izquierda se vuelve;
// 6. («Bigger») desde el agua, bajo el arco: el gusano asoma sobre la balaustrada; un guardia llega a su lado y le llega
//    por la cintura; una trucha salta bajo el arco; en «human face» la cara nos mira y en «looks down» baja los ojos;
// 7. («the water») el agua de cerca: su cara reflejada al doble, temblando; las manitas en el pretil; caen pétalos y se
//    abren círculos; en «frightens» las manchas oscuras (truchas) pasan por debajo y el reflejo se rompe;
// 8. («That being») el desierto de día: dos niños pelirrojos de la mano bajan por la duna; Atom luciérnaga llega; en
//    «Paul Atreides' son» Leto se para y señala el horizonte; un tóptero cruza el cielo a lo lejos;
// 9. («one of the twins») el cuarto de las cunas: en «twins» aparece la segunda cuna con un destello; la fremen mece las dos;
//    un fremen entra por la cortina, se sorprende y sonríe;
// 10. («the movie») el globo de escritorio: una mano deja una entrada de cine con el «18» en «December 18th» y el globo se
//    vuelve de arena en «already see him»; una polilla ronda la lámpara;
// 11. («Today») la boca de Jacurutu al ocaso: Leto camina hacia la entrada, se para en el umbral en «what comes after» y se
//    vuelve a mirarnos en «no movie»; Atom luciérnaga alumbra la entrada;
// 12. («how that child») desde la roca: Leto llega al borde; en «came to be this» la loma enorme se mueve bajo la arena; en
//    «chose it himself» él da un paso y alza la mano; Atom a su lado.
import * as T from '/atomo/plato/escenas/lt-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('lt-gancho');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const K = hex('#1a1424'), ease = (u) => u * u * (3 - 2 * u), voz = (t) => E.energia(t);
const hh = (a, b, c = 0) => { let n = (a * 374761393 + b * 668265263 + c * 1442695041) | 0; n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
const BAY = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const tono = (cols, v, x, y) => { const n = cols.length - 1; v = Math.max(0, Math.min(n, v)); let l = Math.floor(v); if (v - l > BAY[y & 3][x & 3] / 16) l++; return cols[Math.min(n, l)]; };
const pal = (...a) => a.map(hex);
const capas = {};
const capa = (k, f) => { if (!capas[k]) { const b = R.nuevo(); const prev = R.usar(b); f(); R.usar(prev); capas[k] = b; } return capas[k]; };
// pega una capa con transparencia (los píxeles a 0 no se pintan), entre y0 e y1
const pegar = (b, y0 = 0, y1 = 179) => { const D = R.buf; for (let i = y0 * 320; i < (y1 + 1) * 320; i++) { const c = b[i]; if (c) D[i] = c; } };
// un pájaro pequeño que aletea (V de 5 px)
const pajaro = (x, y, t, c = K, f = 0) => { x = Math.round(x); y = Math.round(y); const a = Math.sin(t * 14 + f) > 0; R.pset(x, y, c); R.pset(x - 1, y - (a ? 1 : 0), c); R.pset(x + 1, y - (a ? 1 : 0), c); R.pset(x - 2, y - (a ? 2 : -1) * (a ? 1 : 0), c); R.pset(x + 2, y - (a ? 2 : 0), c); };
// una paloma blanca (6 px) que bate las alas
const paloma = (x, y, t, f = 0) => { x = Math.round(x); y = Math.round(y); const a = Math.sin(t * 16 + f) > 0, B = hex('#f8f4ec'), S = hex('#b8b4c8');
  R.pset(x, y, B); R.pset(x + 1, y, B); R.pset(x + 2, y - 1, B); R.pset(x - 1, y, S); R.pset(x + 3, y - 1, hex('#e8a040'));
  if (a) { R.pset(x, y - 1, B); R.pset(x - 1, y - 2, B); R.pset(x + 1, y - 2, S); } else { R.pset(x, y + 1, B); R.pset(x - 1, y + 2, S); } };
// nubes de tres tonos (bolitas) que derivan; cada nube: [x0, y, ancho, vel]
const nube = (x, y, w, cols, t, k) => { for (let i = 0; i < Math.max(3, Math.round(w / 6)); i++) { const cx = Math.round(x + i * w / Math.max(3, Math.round(w / 6))), r = 3 + Math.round(hh(k, i, 7) * 3);
  R.disco(cx, y + 1, r, cols[0]); } for (let i = 0; i < Math.max(3, Math.round(w / 6)); i++) { const cx = Math.round(x + i * w / Math.max(3, Math.round(w / 6))), r = 3 + Math.round(hh(k, i, 7) * 3); R.disco(cx, y, r - 1, cols[1]); R.disco(cx - 1, y - 1, Math.max(1, r - 2), cols[2]); } };
// pétalos que caen (rosas y blancos) en un rectángulo
const petalos = (t, x0, y0, x1, y1, n, sem = 0) => { const P = pal('#f8c8d8', '#ffffff', '#f0a0b8', '#f8e0a0');
  for (let k = 0; k < n; k++) { const H = y1 - y0, y = y0 + ((hh(k, 1, sem) * H + t * (8 + hh(k, 2, sem) * 10)) % H), x = x0 + ((hh(k, 3, sem) * (x1 - x0) + Math.sin(t * 1.6 + k) * 6 + t * 3) % (x1 - x0));
    const c = P[k % 4]; R.pset(Math.round(x), Math.round(y), c); if (Math.sin(t * 5 + k) > 0) R.pset(Math.round(x) + 1, Math.round(y), c); } };
// el cartel de destripes (sin letras): tarjeta blanca con un ojo tapado por una venda
const cartel = (x0, y0, w, h) => {
  R.rect(x0, y0, x0 + w, y0 + h, K); R.rect(x0 + 1, y0 + 1, x0 + w - 1, y0 + h - 1, hex('#fbf6e8')); R.rect(x0 + 1, y0 + h - 2, x0 + w - 1, y0 + h - 1, hex('#e0d6bc'));
  const cx = x0 + Math.round(w / 2), cy = y0 + Math.round(h / 2) + 1, rx = Math.round(w * 0.34), ry = Math.max(2, Math.round(h * 0.24));
  for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++) { const e = (x / rx) ** 2 + (y / ry) ** 2; if (e <= 1) R.pset(cx + x, cy + y, e > 0.62 ? K : hex('#ffffff')); }
  R.disco(cx, cy, Math.max(1, ry - 1), hex('#3a7ad8')); R.pset(cx, cy, K);
  for (let k = -2; k <= 2; k++) R.linea(cx + k * Math.round(rx / 2.5), cy - ry - 1, cx + k * Math.round(rx / 2.2), cy - ry - 3, K);
  const bh = Math.max(2, Math.round(h * 0.18)); R.rect(x0 + 2, cy - Math.floor(bh / 2), x0 + w - 2, cy + Math.ceil(bh / 2) - 1, hex('#2a2a36'));
  R.rect(x0 + 2, cy - Math.floor(bh / 2), x0 + w - 2, cy - Math.floor(bh / 2), hex('#4a4a5a'));
  R.linea(x0 + w - 3, cy + 1, x0 + w - 1, cy + 4, hex('#2a2a36')); R.linea(x0 + w - 4, cy + 1, x0 + w - 5, cy + 4, hex('#2a2a36'));
};

const g = (f) => en('giro', f), p = (f) => en('puente', f), l = (f) => en('leto', f);
const P2 = p(0), P3 = p(0.138), P4 = p(0.3345), P5 = p(0.5323), P6 = p(0.7228), P7 = p(0.8727);
const P8 = l(0), P9 = l(0.1788), P10 = l(0.4301), P11 = l(0.6682), P12 = l(0.8414);
const monster = g(0.547), son = g(0.207);
// ── fondos locales del puente (al ocaso, como 'boda') ──
const CIELO = pal('#2e2450', '#46306a', '#6a3a72', '#9a4a70', '#c85e66', '#e8805a', '#f4a860', '#f8cc80');
const PIEDRA = pal('#4a3a3a', '#6a5650', '#8a7266', '#a88e7c', '#c4aa92', '#dcc4a8', '#f0dcc0');
const NUBES = [pal('#6a3a6a', '#a8587a', '#f0a080'), pal('#5a3a6a', '#8a4a76', '#d07a7a'), pal('#7a4a7a', '#c86a7a', '#f8b890')];
const cieloOcaso = (y0, y1, sol) => { for (let y = y0; y <= y1; y++) for (let x = 0; x < 320; x++) {
  const d = sol ? Math.hypot(x - sol[0], (y - sol[1]) * 1.4) : 999; R.pset(x, y, d < sol?.[2] ? (d < sol[2] - 2 ? hex('#fff0c0') : hex('#ffd890')) : tono(CIELO, (y - y0) / (y1 - y0) * 7 + (d < 60 ? (60 - d) / 40 : 0) + (hh(x >> 3, y >> 2) - 0.5) * 0.3, x, y)); } };
const nubesVivas = (t, ymax, sem = 0) => { [[30, 16, 34, 2], [170, 30, 44, 4], [250, 52, 30, 7], [90, 44, 26, 5], [200, 12, 22, 3]].forEach(([x0, y, w, v], k) => {
  if (y > ymax) return; const x = ((x0 + t * v + sem * 37) % 400) - 60; if (x > 250 && y < 46) return; nube(x, y, w, NUBES[k % 3], t, k + sem); }); };
const piedra = (x, y, v) => tono(PIEDRA, v + (hh(x, y, 3) - 0.5) * 0.9 + ((x * 7 + y * 13) % 23 === 0 ? -1.2 : 0), x, y);

// 1 · el puente de la boda, de lado y de lejos: «monster»
const p1 = (t) => {
  const o = { encuadre: 'boda', avance: 0.17 + 0.11 * tramo(t, 0, P2) };
  const gp = T.puente(R, t, o);
  const [cx, cy] = gp.carro, golpe = tramo(t, monster, monster + 0.6);
  const lg = T.letoGusano(R, cx, cy, t, { s: 0.5, giro: t * 2.2, mira: golpe > 0 ? [40, 150] : [cx + 30, 140] });
  // el destello de los ojos y la onda que sacude el aire en «monster»
  if (golpe > 0 && golpe < 1) { const [fx, fy] = lg.cara, r = Math.round(4 + golpe * 40);
    for (let a = 0; a < 64; a++) { const an = a / 64 * Math.PI * 2, x = Math.round(fx + Math.cos(an) * r), y = Math.round(fy + Math.sin(an) * r * 0.7); if (hh(a, 3) > golpe * 0.8) R.pset(x, y, mez(R.pget(x, y), hex('#a8e0ff'), 0.7 - golpe * 0.5)); }
    if (golpe < 0.35) { R.pset(fx - 1, fy - 1, hex('#ffffff')); R.pset(fx + 2, fy - 1, hex('#ffffff')); R.disco(fx, fy - 1, 3, mez(R.pget(fx, fy - 1), hex('#c8f0ff'), 0.5)); } }
  // los pájaros que huyen del puente en «monster»
  if (t > monster) { const u = t - monster; for (let k = 0; k < 9; k++) { const x = cx - 20 + k * 6 + u * (k % 2 ? 26 : -22) * (1 + k * 0.1), y = 82 - u * (22 + k * 4) + Math.sin(u * 3 + k) * 2; if (y > 24) pajaro(x, y, t, hex('#2a1e30'), k); } }
  // en el mirador: él señala el carro en «son»; en «monster» los dos se asustan; luego ella lo coge del brazo
  const susto = t > monster && t < monster + 1.2;
  R.actor(EL.ciudadanaLT, 16, 166, t, { dir: 1, habla: t < son && Math.sin(t * 12) > 0, sorpresa: susto, salto: susto && t < monster + 0.3 ? 2 : 0, sostiene: t > monster + 1.2 ? [30, 152] : undefined, triste: t > monster + 1.2 });
  R.actor(EL.ciudadanoLT, 36, 166, t, { dir: 1, dedo: t > son && t < monster, sorpresa: susto, salto: susto && t < monster + 0.3 ? 3 : 0 });
  T.puenteDelante(R, t, o);
  // la onda del golpe: dos anillos claros que se abren desde la cara y un temblor de cámara
  if (golpe > 0 && golpe < 1) { const [fx, fy] = lg.cara; for (const rr of [golpe * 70, golpe * 70 - 14]) if (rr > 2) for (let a = 0; a < 120; a++) { const an = a / 120 * Math.PI * 2, x = Math.round(fx + Math.cos(an) * rr), y = Math.round(fy + Math.sin(an) * rr * 0.6); R.pset(x, y, mez(R.pget(x, y), hex('#d8f4ff'), 0.85 * (1 - golpe))); }
    if (golpe < 0.3) R.disco(fx, fy - 1, 5, mez(R.pget(fx, fy), hex('#e8faff'), 0.6)); }
  // el susto: dos «!» saltan sobre la pareja del mirador
  if (susto) { const sb = Math.round(Math.abs(Math.sin((t - monster) * 9)) * 2); R.icono('!', 20, 134 - sb, hex('#ffe080'), K, 2); R.icono('!', 40, 132 - sb, hex('#ffe080'), K, 2); }
  // EL GOLPE de «monster» (el gancho): la cámara se echa encima de la cara (de 1 a 1,8 en 0,15 s y vuelve en 0,9 s),
  // tiembla y el ocaso se apaga un instante hacia el violeta; todo en un solo recorrido de la pantalla
  const zi = ease(tramo(t, monster - 0.04, monster + 0.12)) * (1 - ease(tramo(t, monster + 0.55, monster + 1.45)));
  const tb = tramo(t, monster, monster + 0.5), osc = zi * 0.55;
  if (zi > 0.001 || (tb > 0 && tb < 1)) {
    const z = 1 + 0.8 * zi, [fx, fy] = lg.cara, dx = tb > 0 && tb < 1 ? Math.round(Math.sin(t * 90) * 3 * (1 - tb)) : 0;
    const ox = Math.max(0, Math.min(320 - 320 / z, fx - 160 / z)), oy = Math.max(0, Math.min(180 - 180 / z, fy - 90 / z));
    const D = R.buf, C0 = D.slice(), V = hex('#2a1438');
    for (let y = 0; y < 180; y++) { const sy = Math.min(179, Math.floor(oy + y / z)) * 320;
      for (let x = 0; x < 320; x++) { const c = C0[sy + Math.max(0, Math.min(319, Math.floor(ox + (x - dx) / z)))];
        D[y * 320 + x] = osc > 0.02 ? mez(c, V, osc * (0.35 + 0.65 * Math.min(1, Math.hypot(x - 160, y - 90) / 150))) : c; } }
  }
};

// 2 · el río desde la orilla, por la mañana: el puente altísimo; palomas y guirnaldas en «wedding day»
const alto2 = p(0.0222), rio2 = p(0.0687), boda2 = p(0.1047);
const p2 = (t) => {
  const o = { encuadre: 'rio', hora: 'manana', roto: false };
  T.puente(R, t, o);
  // las guirnaldas que bajan por el pretil en «wedding day» (dentro del puente, x 84–236)
  const gu = tramo(t, boda2, boda2 + 0.8);
  if (gu > 0) { const F = pal('#f8c8d8', '#ffffff', '#f0d070', '#e86a8a');
    for (let k = 0; k < 7; k++) { const x0 = 84 + k * 22, x1 = x0 + 21, caida = Math.round(7 * ease(gu));
      for (let x = x0; x <= x1; x++) { const s = (x - x0) / (x1 - x0), y = Math.round(36 + Math.sin(s * Math.PI) * caida + Math.sin(t * 2 + k) * 0.6 * gu); R.pset(x, y, hex('#2a6a2a')); R.pset(x, y + 1, hex('#1a4a1e')); if ((x + k) % 2 === 0) R.pset(x, y - 1, F[(x + k) % 4]); if ((x + k) % 4 === 1) R.pset(x, y + 2, F[(x + k + 2) % 4]); }
      R.disco(x0, 36, 1, hex('#f8e0a0')); } }
  // palomas que salen del puente en «wedding day»
  if (t > boda2) { const u = t - boda2; for (let k = 0; k < 7; k++) { const x = 150 + k * 5 + u * (k % 2 ? 30 : -24) * (0.8 + k * 0.08), y = 40 - u * (12 + k * 2) + Math.sin(u * 4 + k) * 3; if (y > 22 && x < 270 && x > 30) paloma(x, y, t, k); } }
  // pétalos que caen del puente al agua
  if (t > boda2 + 0.3) petalos(t, 100, 64, 220, 146, 14, 2);
  // el pescador con su caña; la boya se hunde en «river»
  const pico = tramo(t, rio2, rio2 + 0.25) - tramo(t, rio2 + 0.9, rio2 + 1.3);
  const r = R.actor(EL.ciudadanoLT, 92, 152, t, { dir: 1, sostiene: [106, 138], sorpresa: pico > 0.5, sonrisa: t > boda2 });
  if (r?.mano) { const [mx, my] = r.mano.map(Math.round), bx = 150, by = 132 + Math.round(pico * 3);
    R.linea(mx, my, mx + 26, my - 30, hex('#6a4a2a')); R.linea(mx - 1, my + 1, mx - 4, my + 4, hex('#6a4a2a'));
    for (let k = 0; k <= 20; k++) { const u = k / 20, x = Math.round(lerp(mx + 26, bx, u)), y = Math.round(lerp(my - 30, by, u) + Math.sin(u * Math.PI) * 6); R.pset(x, y, hex('#e8e8f0')); }
    R.pset(bx, by - 1, hex('#e83a3a')); R.pset(bx, by, hex('#ffffff')); R.pset(bx - 2 - Math.round(t * 3) % 3, by + 1, hex('#a8d0e8')); R.pset(bx + 2 + Math.round(t * 3) % 3, by + 1, hex('#a8d0e8'));
    if (pico > 0) for (let a = 0; a < 16; a++) { const an = a / 16 * Math.PI * 2, rr = 3 + pico * 4; R.pset(Math.round(bx + Math.cos(an) * rr), Math.round(by + 1 + Math.sin(an) * rr * 0.35), hex('#d8ecf8')); } }
  // su hija corre por la orilla y señala el puente en «high bridge»; salta con las palomas
  const v = tramo(t, P2 + 0.1, alto2 + 0.3), hx = Math.round(lerp(26, 70, ease(v)));
  R.actor(EL.guiaLT, hx, 152, t, { dir: 1, anda: v > 0 && v < 1, dedo: t > alto2 + 0.3 && t < boda2, salto: t > boda2 && t < boda2 + 0.6 ? Math.round(Math.abs(Math.sin((t - boda2) * 10)) * 3) : 0, sonrisa: t > boda2 });
  T.puenteDelante(R, t, o);
};

// 3 · sobre el tablero: la gente asomada a los pretiles y la procesión que viene de frente
const raila = p(0.187), proc = p(0.2283), lento = p(0.2508);
const p3 = (t) => {
  const o = { encuadre: 'boda', camara: 'tablero', avance: 0.05 + 0.6 * tramo(t, P3, P4) };
  T.puente(R, t, o);
  // la madre, a la izquierda, junto al pretil: señala la procesión en «procession»
  R.actor(EL.ciudadanaLT, 58, 150, t, { dir: 1, dedo: t > proc && t < proc + 1.6, sonrisa: t > proc + 1.6, habla: t > P3 + 0.3 && t < raila && Math.sin(t * 11) > 0 });
  // la niña corre al pretil de la derecha y salta para ver por encima en «railings»
  const v = tramo(t, P3 + 0.2, raila), nx = Math.round(lerp(90, 246, ease(v)));
  R.actor(EL.guiaLT, nx, 156, t, { dir: 1, anda: v > 0 && v < 1, salto: t > raila && t < raila + 2.4 ? Math.round(Math.abs(Math.sin((t - raila) * 6)) * 4) : 0, brazos: t > lento && Math.sin(t * 6) > 0, sonrisa: t > raila });
  // el padre tira pétalos al paso de la procesión
  const tira = tramo(t, lento, lento + 0.5);
  const r = R.actor(EL.ciudadanoLT, 270, 150, t, { dir: -1, sostiene: tira > 0 && tira < 1 ? [256, 120] : [258, 136], sonrisa: true });
  if (t > lento) { const u = t - lento; for (let k = 0; k < 14; k++) { const x = 256 - u * (10 + k * 3) + Math.sin(u * 3 + k) * 4, y = 120 - u * 18 + u * u * 9 + hh(k, 2) * 10; if (y < 150 && x > 40) R.pset(Math.round(x), Math.round(y), pal('#f8c8d8', '#ffffff', '#f0a0b8')[k % 3]); } }
  else if (r?.mano) { const [mx, my] = r.mano.map(Math.round); R.disco(mx, my - 2, 2, hex('#f0a0b8')); R.pset(mx - 1, my - 3, hex('#ffffff')); }

  for (let i = 0; i < 18; i++) { const ond = Math.round(Math.sin(t * 6 - i * 0.5) * (i / 7)); for (let j = 0; j < 6 - i * 0.25; j++) R.pset(54 + i, 50 + j + ond, j < 3 ? hex('#2a6a3a') : hex('#1a1a20')); }
};

// 7 · el agua de cerca: su cara reflejada, que se rompe en «frightens»
const agua7 = p(0.879), miedo = p(0.9706);
const ESPEJO = { b: null };
const p7 = (t) => {
  // el gusano en un lienzo aparte, para reflejarlo (al doble, del revés y temblando)
  const B0 = R.nuevo(), prev = R.usar(B0); const lg = T.letoGusano(R, 100, 150, t, { s: 1, sombra: false, mira: [141, 170] }); R.usar(prev);
  const D = R.buf, tiembla = tramo(t, miedo - 0.1, miedo + 0.4) * (1 - tramo(t, miedo + 1.2, E.duracion)) * 3 + 0.6;
  const AGUA = pal('#0e2230', '#14303e', '#1c3e4a', '#285058', '#3a6466');
  for (let y = 0; y < 180; y++) { const dx = Math.round(Math.sin(y * 0.45 + t * 3.2) * tiembla);
    for (let x = 0; x < 320; x++) {
      let c = tono(AGUA, 1.2 + (y / 180) * 2.4 + Math.sin(x * 0.08 + y * 0.6 + t * 1.5) * 0.35 + (y < 24 ? -1 : 0), x, y);
      // el reflejo del cielo del ocaso en franjas, arriba
      if (y > 24 && y < 60 && Math.sin(x * 0.11 + y * 0.9 - t * 2) > 0.7) c = mez(c, hex('#e88a6a'), 0.35);
      // el reflejo del gusano: x de 70 a 250 ↔ x de 100 a 190 del lienzo; y 30–150 ↔ 150..90 (del revés)
      const sx = Math.round(141 + (x - 160 - dx) / 2), sy = Math.round(101 - (y - 92) / 2);
      if (sx >= 100 && sx <= 162 && sy >= 78 && sy <= 126) { const s = B0[sy * 320 + sx]; if (s) { const b = Math.min(1, Math.min(sx - 100, 162 - sx, sy - 78, 126 - sy) / 7); c = mez(s, c, 0.3 + 0.7 * (1 - b)); } }
      D[y * 320 + x] = c; } }
  // la sombra del puente arriba (el pretil) y sus balaustres reflejados
  for (let x = 0; x < 320; x++) for (let y = 0; y < 22; y++) { const bal = x % 10 < 4 && y > 10; D[y * 320 + x] = mez(D[y * 320 + x], hex('#06101a'), bal ? 0.8 : 0.55); }
  // las manchas oscuras (truchas) que pasan por debajo
  for (let k = 0; k < 5; k++) { const u = tramo(t, P7 + 0.5 + k * 0.3, miedo + 0.6 + k * 0.2), x = Math.round(lerp(-30 + k * 20, 140 + k * 14, u) + Math.sin(t * 2 + k) * 3), y = 110 + k * 12;
    if (u > 0) for (let a = -12; a <= 12; a++) for (let b = -4; b <= 4; b++) if (a * a / 144 + b * b / 16 <= 1) { const px = x + a + Math.round(Math.sin(t * 6 + a * 0.4) * (Math.abs(a) > 8 ? 1 : 0)), py = y + b; R.pset(px, py, mez(R.pget(px, py), hex('#04080c'), b === -4 || Math.abs(a) > 10 ? 0.4 : 0.7)); }
    if (u > 0 && Math.sin(t * 9 + k) > 0.6) R.pset(x + 3, y - 1, hex('#c8e8f0')); }
  // pétalos flotando y círculos que se abren donde cae uno en «water below»
  for (let k = 0; k < 10; k++) { const x = Math.round((hh(k, 4) * 320 + t * (3 + k % 3)) % 330) - 5, y = Math.round(30 + hh(k, 5) * 130 + Math.sin(t + k) * 2); R.pset(x, y, pal('#f8c8d8', '#ffffff', '#f0a0b8')[k % 3]); R.pset(x + 1, y, pal('#f8c8d8', '#ffffff', '#f0a0b8')[k % 3]); }
  if (t > agua7) { const u = t - agua7; for (let r = 0; r < 3; r++) { const rr = u * 18 - r * 6; if (rr > 0 && rr < 46) for (let a = 0; a < 48; a++) { const an = a / 48 * Math.PI * 2; const x = Math.round(220 + Math.cos(an) * rr), y = Math.round(70 + Math.sin(an) * rr * 0.45); R.pset(x, y, mez(R.pget(x, y), hex('#c8e0e8'), 0.6 - rr / 90)); } } }
  for (let k = 0; k < 12; k++) if (Math.sin(t * 4 + k * 2.3) > 0.8) R.pset(Math.round(hh(k, 8) * 320), Math.round(28 + hh(k, 9) * 140), hex('#f8e0b0'));
  // el pretil de piedra abajo, con las dos manitas del gusano agarradas (se aprietan en «frightens»)
  for (let y = 162; y < 180; y++) for (let x = 0; x < 320; x++) R.pset(x, y, y === 162 ? hex('#1a1414') : piedra(x, y, y < 165 ? 5.4 : 3.8 - (y - 165) * 0.08));
  for (let k = 0; k < 9; k++) R.pset(Math.round(hh(k, 2, 9) * 319), 166 + Math.round(hh(k, 3, 9) * 12), k % 2 ? hex('#5a7a3a') : hex('#f8c8d8'));
  const ap = t > miedo && t < miedo + 1 ? 1 : 0;
  T.mano(R, 138 + ap, 170, 1, '#8a8a94', { sinManga: true }); T.mano(R, 184 - ap, 170, -1, '#8a8a94', { sinManga: true });
};

// 8 · el desierto de día: dos niños pelirrojos de la mano; Atom luciérnaga los mira
const leto = l(0.0409), hijo = l(0.1162);
// un tóptero pequeño (diseño nuestro: cabina de cristal, cuerpo de libélula y dos pares de alas que baten), de lado
const toptero = (x, y, t) => { x = Math.round(x); y = Math.round(y); const B = hex('#6a6070'), L = hex('#a8a0b0'), a = Math.sin(t * 40) > 0;
  R.rect(x - 6, y, x + 4, y + 2, K); R.rect(x - 5, y, x + 3, y + 1, B); R.rect(x - 5, y, x + 3, y, L); R.rect(x + 4, y - 1, x + 7, y + 2, K); R.rect(x + 5, y, x + 6, y + 1, hex('#8ad0f0'));
  R.linea(x - 6, y + 1, x - 13, y, K); R.pset(x - 13, y - 1, B); R.linea(x - 3, y + 3, x - 5, y + 5, K); R.linea(x + 2, y + 3, x + 4, y + 5, K);
  for (const ax of [x - 3, x + 1]) { if (a) { R.linea(ax, y - 1, ax - 4, y - 5, hex('#d8d4e0')); R.linea(ax, y - 1, ax + 3, y - 5, hex('#d8d4e0')); } else { R.linea(ax, y - 1, ax - 5, y - 2, hex('#b8b4c4')); R.linea(ax, y - 1, ax + 4, y - 2, hex('#b8b4c4')); } } };
const p8 = (t) => {
  const o = { encuadre: 'desierto', hora: 'dia', t0: P8 };
  T.planeta(R, t, o);
  const v = tramo(t, P8 + 0.1, hijo - 0.2), x = Math.round(lerp(40, 148, ease(v)));
  // las huellas que dejan en la arena
  for (let k = 0; k < 12; k++) { const hx = x - 12 - k * 8; if (hx > 30) { R.pset(hx, 151 + (k % 2), hex('#b8763a')); R.pset(hx + 1, 151 + (k % 2), hex('#c88a48')); } }
  const anda = v > 0 && v < 1;
  R.actor(EL.ghanimaLT, x - 14, 150, t, { dir: 1, anda, sostiene: [x - 4, 141], sonrisa: t > leto });
  R.actor(EL.letoNinoLT, x, 150, t, { dir: 1, anda, dedo: t > hijo, sonrisa: t > leto && t < hijo });
  T.planetaDelante(R, t, o);
  // un tóptero cruza el cielo lejos, de derecha a izquierda, y la sombra corre por la arena (Ghanima lo mira)
  { const u = tramo(t, P8 + 0.3, P9 - 0.2), tx = lerp(250, -20, u), ty = 62 + Math.sin(t * 1.5) * 2; toptero(tx, ty, t);
    const sx = Math.round(tx + 30); for (let i = -6; i <= 6; i++) { const yy = 112 + Math.round(Math.abs(i) / 4); R.pset(sx + i, yy, mez(R.pget(sx + i, yy), hex('#8a5a30'), 0.35)); } }
  const w = tramo(t, P8 + 0.6, leto + 0.4);
  T.AT.luciernaga(R, Math.round(lerp(300, 196, ease(w)) + Math.sin(t * 0.9) * 4), Math.round(lerp(70, 116, ease(w)) + Math.sin(t * 2.2) * 3), t, { dir: -1, brillo: 0.6, cara: t > hijo ? 'sonrisa' : 'normal' });
};

// 9 · el cuarto de las cunas: «one of the twins»
const gemelos = l(0.1985), libro = l(0.3215);
const p9 = (t) => {
  const o = { encuadre: 'cuarto', cunas: 2, segunda: tramo(t, gemelos - 0.05, gemelos + 0.6), bebes: true };
  T.sietch(R, t, o);
  // la fremen mece la primera cuna, se sorprende con la segunda y luego arropa a los dos
  const v = tramo(t, gemelos + 0.9, gemelos + 2.2), fx = Math.round(lerp(140, 228, ease(v)));
  R.actor(EL.fremenMujer, fx, 150, t, { dir: v > 0 && v < 1 ? 1 : v >= 1 ? -1 : 1, anda: v > 0 && v < 1, sorpresa: t > gemelos && t < gemelos + 0.9, sonrisa: t > gemelos + 0.9,
    sostiene: v === 0 ? [fx + 12, 140 + Math.round(Math.sin(t * 3) * 2)] : v >= 1 && t < libro ? [fx - 14, 140 + Math.round(Math.sin(t * 3) * 2)] : undefined });
  // un fremen entra por la cortina de la izquierda, se sorprende al ver dos cunas y sonríe
  { const u = tramo(t, gemelos + 0.4, gemelos + 1.6), gx = Math.round(lerp(-12, 62, ease(u)));
    R.actor(EL.fremen, gx, 150, t, { dir: 1, anda: u > 0 && u < 1, sorpresa: u >= 1 && t < gemelos + 2.2, sonrisa: t > gemelos + 2.2, habla: t > libro && Math.sin(t * 8) > 0.2 }); }
  T.sietchDelante(R, t, o);
};

// 10 · el globo de escritorio: la entrada de cine del «18» y el globo que se vuelve de arena
const dic = l(0.4863), ve = l(0.5486);
const p10 = (t) => {
  const o = { encuadre: 'orbita', camara: 'globo', arena: tramo(t, ve - 0.2, ve + 1.4), t0: P10 };
  T.planeta(R, t, o);
  const ent = tramo(t, P10 + 0.2, dic + 0.2), deja = t > dic + 0.5, va = tramo(t, dic + 0.6, dic + 1.4);
  const tx = Math.round(lerp(340, 238, ease(ent))), ty = 116;
  const entrada = (x, y) => { R.rect(x - 22, y - 12, x + 22, y + 12, K); R.rect(x - 21, y - 11, x + 21, y + 11, hex('#f6ecd2')); R.rect(x - 21, y - 11, x - 14, y + 11, hex('#c83a3a'));
    for (let j = y - 10; j <= y + 10; j += 3) R.pset(x - 14, j, hex('#f6ecd2')); R.pset(x - 18, y - 6, hex('#f8d870')); R.pset(x - 18, y, hex('#f8d870')); R.pset(x - 18, y + 6, hex('#f8d870'));
    R.numero('18', x + 4, y + 8, { tam: 16, centro: true }); R.rect(x - 11, y + 9, x + 19, y + 9, hex('#d8cca8')); };
  if (!deja) { entrada(tx, ty); T.brazo(R, Math.round(tx + 70), 150, tx + 22, ty + 4, '#3a5a8a', -1, { codo: [tx + 48, ty + 22] }); }
  else { entrada(238, 120); if (va < 1) T.brazo(R, 330, 150, Math.round(lerp(262, 340, va)), Math.round(lerp(124, 140, va)), '#3a5a8a', -1, { codo: [Math.round(lerp(300, 360, va)), 142] }); }
  T.planetaDelante(R, t, o);
  // una polilla da vueltas a la lámpara de banquero (debajo de la zona de Atom)
  { const a = t * 3.1, mx = Math.round(268 + Math.cos(a) * 9), my = Math.round(64 + Math.sin(a * 1.7) * 5), ab = Math.sin(t * 30) > 0;
    R.pset(mx, my, hex('#d8c8a8')); R.pset(mx - 1, my - (ab ? 1 : 0), hex('#f0e4c8')); R.pset(mx + 1, my - (ab ? 1 : 0), hex('#f0e4c8')); }
};

// 11 · la boca de Jacurutu al ocaso: «what comes after»
const despues = l(0.7396), peli = l(0.7929);
const p11 = (t) => {
  const o = { encuadre: 'cueva', camara: 'boca' };
  T.jacurutu(R, t, o);
  // la luz de la luciérnaga dentro de la entrada
  const w = tramo(t, P11 + 0.3, despues);
  if (w > 0) for (let y = 102; y < 150; y++) for (let x = 82; x < 113; x++) { const d = Math.hypot(x - 97, y - 128) / 30; if (d < 1) R.pset(x, y, mez(R.pget(x, y), hex('#f8e8a0'), (1 - d) * 0.35 * w)); }
  const v = tramo(t, P11 + 0.1, despues), x = Math.round(lerp(230, 104, ease(v)));
  R.actor(EL.letoNinoLT, x, 150, t, { dir: t > peli ? 1 : -1, anda: v > 0 && v < 1, triste: t > peli + 0.8 });
  T.jacurutuDelante(R, t, o);
  T.AT.luciernaga(R, Math.round(lerp(250, 96, ease(w)) + Math.sin(t * 1.3) * 3), Math.round(lerp(96, 122, ease(w)) + Math.sin(t * 2.4) * 2), t, { dir: -1, brillo: 0.9, cara: t > peli ? 'triste' : 'normal' });
};

// 12 · desde la roca: la loma enorme bajo la arena; «why he chose it himself»
const esto = l(0.8695), elige = l(0.9448);
const p12 = (t) => {
  const o = { encuadre: 'desierto', camara: 'roca', hora: 'ocaso', silueta: tramo(t, esto - 0.6, esto + 0.6), t0: P12 };
  T.planeta(R, t, o);
  const v = tramo(t, P12, esto - 0.3), x = Math.round(lerp(54, 112, ease(v)) + 6 * tramo(t, elige, elige + 0.5));
  R.actor(EL.letoNinoLT, x, 131, t, { dir: 1, anda: (v > 0 && v < 1) || (t > elige && t < elige + 0.5), sorpresa: t > esto && t < elige, dedo: t > elige + 0.5 });
  T.planetaDelante(R, t, o);
  T.AT.luciernaga(R, Math.round(x + 30 + Math.sin(t * 1.1) * 4), Math.round(104 + Math.sin(t * 2) * 3), t, { dir: -1, brillo: 0.8, cara: t > esto && t < elige ? 'sorpresa' : t > elige ? 'triste' : 'normal' });
};

const efectos = [[0.15, 'campana', { lejos: true }], [son, 'publico', { dur: 1.6 }], [monster - 0.05, 'boom'], [monster + 0.1, 'pajaros'], [monster + 0.2, 'whoosh'],
  [rio2, 'chof'], [boda2, 'campana'], [boda2 + 0.05, 'pajaros'], [P3 + 0.3, 'pasos', { n: 6, ritmo: 0.2 }], [raila - 0.6, 'publico', { dur: 3 }], [lento + 0.1, 'whoosh'],
  [P4 + 0.1, 'carro', { largo: 2.6 }], [enorme + 0.4, 'publico', { dur: 2.4, ola: 1 }], [vivo, 'brillo'],
  [anos - 0.3, 'brillo'], [anos, 'campana', { lejos: true }], [P6 + 0.2, 'pasos'], [hombre + 0.3, 'chof'], [P7 + 0.2, 'ola'], [agua7, 'chof'], [miedo, 'burbujas'],
  [P8 + 0.2, 'viento', { dur: 3.5 }], [P8 + 0.5, 'zumbido'], [gemelos, 'brillo'], [gemelos + 0.5, 'pasos', { n: 4 }], [P10 + 0.2, 'tic'], [P10 + 1.2, 'tic'], [dic + 0.5, 'papel'], [ve, 'whoosh'],
  [P11 + 0.3, 'pasos'], [esto - 0.4, 'avalancha']];
T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3], [P4, p4], [P5, p5], [P6, p6], [P7, p7], [P8, p8], [P9, p9], [P10, p10], [P11, p11], [P12, p12]], { efectos });
</script>
