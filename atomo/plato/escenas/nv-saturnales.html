<script type="module">
// NV-SATURNALES (frase 13), 354. Tres planos:
// 1. (calle) la calle en Saturnales de noche: dos romanos con píleo se cruzan y él le regala una figurita de barro; un
//    pregonero entra con el calendario en su pértiga y los días del 17 al 23 se marcan en rojo («17th» … «23rd»);
// 2. (banquete) corta en «and most historians»: el banquete; llega el tercero y se sienta, brindan en «feasts» (a la copa se

//    La tercera guirnalda se cuelga corta de un clavo (x 276) para dejar lisa la esquina de Atom; el mantel lleva pliegues,
//    luz de vela que tiembla, sombras de la vajilla, manchas de vino y cera, migas y el bajo festoneado;

import * as T from '/atomo/plato/escenas/nv-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('nv-saturnales');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const H = (c) => hex(c), K = hex('#1a1420');
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255; return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], umbral = (x, y) => (BAY[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
const capas = new Map();
const capa = (clave, dibuja) => { let b = capas.get(clave); if (!b) { b = R.nuevo(); const prev = R.usar(b); dibuja(); R.usar(prev); capas.set(clave, b); } return b; };
const fondo = (clave, dibuja) => R.copiar(capa(clave, dibuja));
// halo: mezcla col sobre lo que ya hay, más fuerte en el centro
const halo = (cx, cy, r, col, a) => { for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) { const d = Math.hypot(i, j) / r; if (d < 1) { const x = cx + i, y = cy + j; R.pset(x, y, mez(R.pget(x, y), col, a * (1 - d) ** 1.4)); } } };
// nube de tres tonos (sombra, medio, luz)
const nube3 = (x, y, w, cs) => { x = Math.round(x); const n = Math.max(2, Math.round(w / 7));
  for (let i = 0; i < n; i++) { const r = 3 + Math.round(3 * Math.sin((i + 0.5) / n * Math.PI)); R.disco(x + i * 7, y + 2, r, cs[0]); }
  for (let i = 0; i < n; i++) { const r = 2 + Math.round(3 * Math.sin((i + 0.5) / n * Math.PI)); R.disco(x + i * 7, y, r, cs[1]); }
  for (let i = 0; i < n; i++) { const r = Math.round(2 * Math.sin((i + 0.5) / n * Math.PI)); if (r > 0) R.disco(x + i * 7 - 1, y - 2, r, cs[2]); } };
const pajaro = (x, y, t, k, c) => { const a = Math.sin(t * 11 + k) > 0; x = Math.round(x); y = Math.round(y); R.pset(x, y, c); R.pset(x - 1, y - (a ? 1 : 0), c); R.pset(x + 1, y - (a ? 1 : 0), c); R.pset(x - 2, y - (a ? 2 : -1), c); R.pset(x + 2, y - (a ? 2 : -1), c); };
// madera con vetas, nudos y juntas (tablas horizontales de alto h)
const madera = (x0, y0, x1, y1, h, base, veta, luz, junta, k = 0) => { R.rect(x0, y0, x1, y1, base);
  for (let y = y0; y <= y1; y++) { const tabla = Math.floor((y - y0) / h), dy = (y - y0) % h; if (dy === 0) { R.rect(x0, y, x1, y, junta); continue; } if (dy === 1) { R.rect(x0, y, x1, y, luz); continue; }
    for (let x = x0; x <= x1; x++) { const v = Math.sin(x * 0.045 + tabla * 7 + Math.sin(x * 0.013 + tabla) * 3 + dy * 0.9); if (v > 0.93) R.pset(x, y, veta); else if (hh(x >> 1, y, k + tabla) < 0.05) R.pset(x, y, veta); } }
  for (let n = 0; n < (x1 - x0) / 40; n++) { const nx = x0 + Math.round(hh(n, 1, k) * (x1 - x0)), ny = y0 + Math.round(hh(n, 2, k) * (y1 - y0)); R.disco(nx, ny, 2, veta); R.pset(nx, ny, junta); } };
// estrella de cinco puntas grande (relleno y contorno)
const estrella5 = (cx, cy, r, col, borde) => { const P = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; P.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); }

const Q2 = en('saturnales', 0.3828), Q3 = en('saturnales', 0.8129);
const figurita = (x, y, s = 1) => { // figurita de barro (sigillaria) con la base en (x, y)
  const p = (i, j, c) => R.rect(x + i * s, y - j * s, x + i * s + s - 1, y - j * s + s - 1, c);
  for (let j = 0; j < 9; j++) for (let i = -2; i <= 2; i++) { const dentro = j < 2 ? true : j < 6 ? Math.abs(i) <= 1 : j < 8 ? Math.abs(i) <= 1 : Math.abs(i) <= 0; if (dentro) p(i, j, i < 0 ? H('#d8844a') : H('#b8603a')); }

// ── 1 · la calle ──
const p1 = (t) => { const g = T.roma(R, t, { encuadre: 'calle' });
  const u = tramo(t, en('saturnales', -0.0126), en('saturnales', 0.1137)), v = tramo(t, en('saturnales', 0.0063), en('saturnales', 0.1263)), xA = Math.round(lerp(-14, 100, u)), xB = Math.round(lerp(330, 122, v));
  const da = tramo(t, en('saturnales', 0.1516), en('saturnales', 0.1895)), regalo = t > en('saturnales', 0.1421);
  const a = R.actor(EL.romanoPileo, xA, g.suelo, t, { dir: 1, anda: u > 0 && u < 1, sonrisa: u >= 1, sostiene: regalo && da < 1 ? [xA + 22, g.suelo - 14] : undefined, habla: u >= 1 && t < en('saturnales', 0.1453) && Math.sin(t * 9) > 0 });

  const w = tramo(t, en('saturnales', 0.1958), en('saturnales', 0.2527)), xP = Math.round(lerp(336, 214, w)), marca = Math.floor(tramo(t, en('saturnales', 0.2628), en('saturnales', 0.331)) * 6.999);
  const p = R.actor(EL.romanoPileo2, xP, g.suelo, t, { dir: -1, anda: w > 0 && w < 1, sostiene: [xP - 4, g.suelo - 20], habla: w >= 1 && Math.sin(t * 8) > 0, dedo: t > en('saturnales', 0.3411) });
  const [hx, hy] = p.mano; R.rect(hx, hy - 18, hx + 1, hy + 2, H('#5a3a20')); R.pset(hx, hy - 18, H('#8a5a30'));
  T.PIEZAS_NV.calendario(R, hx + 1, hy - 16, { s: 2, marca: t > en('saturnales', 0.2628) ? [17, 17 + marca] : [0, -1] });
  if (t > en('saturnales', 0.2628)) { const x0 = hx + 1 - 21, y0 = hy - 16 - 44; for (let d = 17; d <= 17 + marca; d++) { const c = (d - 1) % 7, f = Math.floor((d - 1) / 7), cx = x0 + (4 + c * 2) * 2, cy = y0 + (8 + f * 2) * 2; R.rect(cx - 1, cy - 1, cx + 2, cy + 2, H('#d8201a')); } }
  if (marca === 6 && t < en('saturnales', 0.3663)) halo(hx + 1, hy - 38, 22, H('#ffd0a0'), 0.3);
};
// el friso del banquete en la esquina de Atom: se repinta el estuco (x 248–319, y 19–44) y la tercera guirnalda se cuelga
// más corta, de un clavo en x 276, con su lámpara en x 263; así la esquina de Atom queda lisa de estuco tramado
const friso = (t) => { let base = 0, lum = -1; for (const [x, y] of [[2, 41], [3, 42], [6, 42], [7, 43], [1, 40]]) { const c = R.pget(x, y), l = (c & 255) + ((c >>> 8) & 255) + ((c >>> 16) & 255); if (l > lum) { lum = l; base = c; } }
  const osc = mez(base, K, 0.15), ocre = R.pget(3, 44), vena = mez(base, H('#c8a878'), 0.35);
  for (let y = 19; y <= 44; y++) for (let x = 248; x < 320; x++) { if (y === 44) { R.pset(x, y, ocre); continue; }
    let c = hh(x >> 2, y >> 2, 471) < 0.22 && umbral(x, y) < 0.45 ? osc : base; if (hh(x >> 3, y >> 1, 9) < 0.05 && (x & 1)) c = vena; R.pset(x, y, c); }
  const hS = H('#1a4420'), hM = H('#2e6a32'), hL = H('#5a9a4a'), mi = H('#b8302a'), br = H('#b8863a'), brL = H('#e8c070'), brS = H('#7a5424');
  const sw = Math.sin(t * 1.1 + 2) * 1.2, x0 = 250, x1 = 276;
  for (let x = x0; x <= x1; x++) { const u = (x - x0) / (x1 - x0), y = Math.round(22 + u * 2 + Math.sin(u * Math.PI) * (9 + sw)); R.pset(x, y, hS); R.pset(x, y - 1, (x & 1) ? hM : hS); R.pset(x, y + 1, x % 3 ? hM : hL); if (x % 7 === 0) R.pset(x, y + 2, mi); }
  // el clavo de bronce y la cinta que cuelga y se mece (no baja de y 34 ni pasa de x 277)
  R.rect(275, 22, 277, 24, K); R.pset(276, 23, brL);
  const cs = Math.round(Math.sin(t * 1.7) * 1); for (let j = 0; j < 9; j++) { const xx = 276 + (j > 4 ? cs : 0); R.pset(Math.min(277, xx), 25 + j, j % 3 === 2 ? H('#8a2020') : mi); }
  R.pset(275, 25, hL); R.pset(277, 26, hM); R.pset(274, 26, hS);
  // la lámpara colgada en el centro de este tramo
  const lx = Math.round(263 + sw * 1.5), ly = 33 + Math.round(sw); R.linea(263, 31, lx, ly, K); R.rect(lx - 3, ly, lx + 3, ly + 2, br); R.rect(lx - 3, ly, lx + 3, ly, brL); R.rect(lx - 2, ly + 3, lx + 2, ly + 3, brS);
  const f = Math.sin(t * 11 + 4.6) * 0.5 + Math.sin(t * 17.3 + 2) * 0.5, al = Math.max(2, Math.round(3 + f)); for (let j = 0; j <= al; j++) { const w = j < al * 0.6 ? 1 : 0; R.rect(lx + 3 - w, ly - 1 - j, lx + 3 + w, ly - 1 - j, j < al * 0.5 ? H('#ffe08a') : H('#ff9a30')); }
  halo(lx + 1, ly + 2, 14, H('#ffe08a'), 0.22); };
// el mantel del banquete con vida: pliegues sombreados, luz de las velas que tiembla, sombras de la vajilla, manchas de vino y
// de cera, migas, el bajo festoneado, y en «feasts» la copa que se derrama y deja una mancha que crece
const TELA = [H('#9c907a'), H('#b4a890'), H('#c8bca4'), H('#d8ccb4'), H('#e4d8c0'), H('#ece2cc'), H('#f4ecd8'), H('#fbf5e6')];
const ES_TELA = new Set([H('#ece2cc'), H('#d8ccb4'), H('#f4ecd8'), H('#e4d8c0'), H('#c8bca4'), H('#b8ac94')]);
const SOMBRAS = [[41, 7], [62, 7], [78, 7], [94, 9], [120, 3], [135, 5], [161, 16], [190, 8], [222, 3], [236, 5], [260, 11], [280, 3], [296, 5]];
const MANCHAS = [[104, 157, 2.6, 1], [226, 158, 2.2, 2], [151, 159, 1.8, 3], [72, 158, 1.5, 4]];
const mantel = (t, xc) => { const luzV = (x) => 0.2 * Math.exp(-(((x - 41) / 46) ** 2)) * (1 + 0.12 * Math.sin(t * 7)) + 0.17 * Math.exp(-(((x - 296) / 40) ** 2)) * (1 + 0.12 * Math.sin(t * 6.3 + 1)) + 0.08 * Math.exp(-(((x - 135) / 70) ** 2));
  const vino = H('#8a2a3a'), cera = H('#f4e4a8');
  // derrame en «feasts»: la gota cae de la copa y la mancha crece donde cae
  const cae = tramo(t, en('saturnales', 0.6372), en('saturnales', 0.6513)), crece = tramo(t, en('saturnales', 0.6513), en('saturnales', 0.6853));
  const gx = xc;
  for (let y = 153; y < 180; y++) { const frente = y >= 161;
    for (let x = 0; x < 320; x++) { const c0 = R.pget(x, y); const cenefa = y >= 167 && y <= 171;
      if (!ES_TELA.has(c0) && !(frente && cenefa)) continue;
      const pl = Math.sin(x * 0.25 + Math.sin(x * 0.05) * 2), pl2 = Math.sin(x * 0.09 + 1.3);
      let v = frente ? 0.5 + 0.26 * pl + 0.1 * pl2 - (y - 161) * 0.006 : 0.66 - (y - 153) * 0.012 + 0.04 * pl2 + ((x + (y >> 1)) % 4 === 0 ? 0.05 : 0) + (hh(x >> 2, y, 5) - 0.5) * 0.08;
      v += luzV(x) - (x < 24 ? (24 - x) * 0.01 : 0) - (x > 300 ? (x - 300) * 0.01 : 0);
      if (!frente) { if (x % 53 === 0) v += 0.08; else if (x % 53 === 1) v -= 0.07; for (const [sx, w] of SOMBRAS) if (Math.abs(x - sx - 2) <= w && y <= 155) v -= 0.24 * (1 - (y - 153) / 3); }
      if (cenefa) { R.pset(x, y, v < 0.4 ? mez(c0, K, 0.3) : v > 0.72 ? mez(c0, H('#fff0d0'), 0.18) : c0); continue; }
      const iv = Math.max(0, Math.min(TELA.length - 1, Math.floor(v * TELA.length + umbral(x, y) - 0.5))); let c = TELA[iv];
      if (luzV(x) > 0.12 && umbral(x, y) < 0.3) c = mez(c, H('#ffd8a0'), 0.25);
      // el bajo festoneado con flecos
      if (y >= 176) { const fe = (x % 8), arco = 177 + Math.round(Math.abs(fe - 3.5) / 3.5 * 2); if (y > arco) c = mez(c, K, 0.35); else if (y === arco) c = TELA[1]; if (y === 179 && fe === 0) c = H('#a87a18'); }
      R.pset(x, y, c); } }
  // manchas de vino viejas y la que crece, con borde irregular (solo sobre tela)
  const mancha = (cx, cy, r, k, a) => { for (let j = -4; j <= 4; j++) for (let i = -5; i <= 5; i++) { const d = Math.hypot(i, j * 1.6) / (r + hh(i, j, k) * 1.2); if (d < 1) { const c = R.pget(cx + i, cy + j); if (cy + j >= 153 && (ES_TELA.has(c) || TELA.includes(c))) R.pset(cx + i, cy + j, mez(c, vino, a * (d > 0.7 ? 0.6 : 1))); } } };
  for (const [x, y, r, k] of MANCHAS) mancha(x, y, r, k, 0.55);
  // el reguero de vino que baja por el borde delantero y la cera que gotea de las velas
  for (let j = 0; j < 5; j++) { R.pset(228, 161 + j, mez(R.pget(228, 161 + j), vino, 0.45 - j * 0.06)); if (j < 3) R.pset(229, 161 + j, mez(R.pget(229, 161 + j), vino, 0.3)); }
  for (const [cx, n] of [[42, 3], [297, 2]]) { for (let i = -n; i <= n; i++) { R.pset(cx + i, 154, cera); if (Math.abs(i) < n) R.pset(cx + i, 155, mez(cera, K, 0.12)); } R.pset(cx - 1, 154, H('#fffbe8')); }
  { const g = 1 + Math.floor(((t * 0.35) % 1) * 4); for (let j = 0; j < g; j++) R.pset(296, 161 + j, j === g - 1 ? mez(cera, K, 0.15) : cera); }

// ── 2 · el banquete ──
const p2 = (t) => { const g = T.roma(R, t, { encuadre: 'calle', camara: 'banquete' }), [s1, s2, s3] = g.sitios; friso(t);
  const u = tramo(t, Q2 + 0.1, en('saturnales', 0.4927)), x3 = Math.round(lerp(330, s3, u));

  if (brinda) { const [mx, my] = a.mano; R.rect(mx - 2, my - 6, mx + 2, my, K); R.rect(mx - 1, my - 5, mx + 1, my - 1, H('#b8603a')); R.pset(mx, my - 5, H('#7a1a2a')); }

  const c = R.actor(EL.romanoPileo2, x3, g.suelo, t, { dir: -1, anda: u > 0 && u < 1, sonrisa: rien || pasa >= 1, sostiene: pasa >= 1 ? true : undefined, sorpresa: pasa > 0.6 && pasa < 1 });

// ── 3 · la mesa: Saturnales ≠ Navidad ──
const mesa = () => { const { rect, pset, disco, linea } = R;
  madera(0, 0, 319, 179, 30, H('#8a5a34'), H('#6a4224'), H('#a26c40'), H('#3a2414'), 31);
  // el paño de las Saturnales (rojo con greca) a la izquierda y el de la Navidad (verde con cenefa) a la derecha
  rect(10, 26, 146, 168, H('#3a1410')); rect(11, 27, 145, 167, H('#9a2a24')); for (let y = 27; y < 168; y++) for (let x = 11; x < 146; x++) if (hh(x, y, 32) < 0.07) pset(x, y, H('#82201c'));
  for (let x = 14; x < 142; x += 8) { rect(x, 30, x + 5, 30, H('#e0b040')); rect(x + 5, 30, x + 5, 33, H('#e0b040')); rect(x + 2, 33, x + 5, 33, H('#e0b040')); rect(x, 163, x + 5, 163, H('#e0b040')); rect(x, 160, x, 163, H('#e0b040')); rect(x, 160, x + 3, 160, H('#e0b040')); }
  rect(174, 26, 310, 168, H('#0e2a16')); rect(175, 27, 309, 167, H('#1e5a32')); for (let y = 27; y < 168; y++) for (let x = 175; x < 310; x++) if (hh(x, y, 33) < 0.07) pset(x, y, H('#174a28'));
