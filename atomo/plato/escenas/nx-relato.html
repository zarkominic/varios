<script type="module">
// NX-RELATO (frases 7–8), sin fecha (la barra sigue en 2026: lo cuenta Atom hoy). A Noé NO se le dibuja: no hay
// ninguna figura humana en toda la escena; el barco, los animales y el cielo llevan la acción. Seis planos:
// 1. el libro antiguo en su atril, a la luz de las velas y nada más (ni filos de luz, ni motas doradas: ningún libro
//    recibe más luz que otro): cerrado, una polilla deja su vela y se posa en la tapa; el libro da dos respingos (cae
//    polvo viejo del canto), la polilla huye y el libro se abre solo en «what does the story say?» con una nube de
//    polvo gris en los cantos; sale un «?» en un globo; la otra polilla sigue en su vela;
// 2. el astillero vacío: el barco se levanta solo, tabla a tabla (cada golpe, un «toc» y su polvo); en «a flood is
//    coming» el frente de tormenta entra y cae un relámpago lejano; los pájaros huyen;
// 3. la medida: la regla se tiende bajo el arca en «three hundred cubits» y la cifra late; luego bajan las cosas de hoy
//    para comparar y un cursor recorre el campo de punta a punta;
// 4. gag 3: las parejas suben por la rampa… y la fila entera se para y se vuelve a mirar al caracol, el último, que
//    avanza milímetro a milímetro con sus puntos suspensivos; empieza a llover;
// 5. el diluvio: el barco solo en el agua; un marcador cuenta 1…40 con su sol y su luna; el agua se calma, asoman las
//    cumbres y la paloma sale del ventanuco y se aleja;
// 6. el cielo que escampa: la paloma vuelve de cerca, dibujada a píxel nativo (unos 42 px de punta a punta, sin
//    escalar: cuerpo, cola en abanico, dos alas que baten en cuatro poses, pico, ojo y la RAMITA de olivo de dos hojas
//    en el pico, con su destello); el arcoíris se traza de lado a lado y la paloma se da la vuelta y baja a posarse
//    en el barco (al alejarse pasa a un tamaño medio, también nativo, y al final a la pieza pequeña del kit).
import * as T from '/atomo/plato/escenas/nx-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('nx-relato');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const a = (s) => en('relato', (s - 0.9) / 14.524), b = (s) => en('lluvia', (s - 15.924) / 14.053);   // s: el segundo de la voz inglesa
const K = T.C.k, PZ = T.PIEZAS_NX, BL = hex('#f6f2e6'), ROJO = hex('#d23a2e'), ORO = hex('#ffd86a');
const P2 = a(4.19), P3 = a(9.75), P4 = b(15.924), P5 = b(20.01), P6 = b(24.58);
const sua = (u) => u * u * (3 - 2 * u);
const mez = (x, y, c, f) => { x = Math.round(x); y = Math.round(y); if (x < 0 || x > 319 || y < 0 || y > 179) return; const p = R.pget(x, y); const m = (s) => Math.round(((p >>> s) & 255) * (1 - f) + ((c >>> s) & 255) * f); R.pset(x, y, (0xff000000 | (m(16) << 16) | (m(8) << 8) | m(0)) >>> 0); };
// un globo redondo con su pico y un símbolo dentro (rebota al salir)
const globo = (x, y, t0, t, pinta) => { if (t < t0) return; const d = t - t0, dy = -Math.round(Math.max(0, 5 * Math.sin(d * 11) * Math.exp(-d * 5))); y += dy;
  R.disco(x, y, 12, K); R.poligono([[x - 8, y + 8], [x - 13, y + 19], [x - 1, y + 11]], K); R.disco(x, y, 11, BL); R.poligono([[x - 7, y + 8], [x - 11, y + 16], [x - 2, y + 10]], BL);
  for (let i = -8; i <= 8; i++) R.pset(x + i, y + 10 - Math.round(Math.abs(i) * 0.4), hex('#d8d2c0')); pinta(x, y); };
const destello = (x, y, r, c = hex('#ffffff')) => { for (let i = -r; i <= r; i++) { R.pset(x + i, y, c); R.pset(x, y + i, c); } if (r > 2) { R.pset(x - 1, y - 1, c); R.pset(x + 1, y - 1, c); R.pset(x - 1, y + 1, c); R.pset(x + 1, y + 1, c); } };
const POLVO = hex('#c4b494'), POLVO2 = hex('#94866e');
// la polilla que se posa en el libro, algo mayor que las de las velas: cuerpo oscuro y dos alas pardas que baten
// (posada, abiertas y casi quietas)
const polillaG = (x, y, t, posada) => { x = Math.round(x); y = Math.round(y); const al = posada ? (Math.floor(t * 2.2) % 3 ? 0 : 1) : Math.floor(t * 14) % 2, A = hex('#ece0c4'), B = hex('#bca884'), Kp = hex('#3a2e24');
  for (const d of [-1, 1]) { if (!posada) { const h = al ? -1 : 1; for (let k = 1; k <= 4; k++) { R.pset(x + d * k, y - h * (k - 1), A); R.pset(x + d * k, y - h * k, k > 2 ? B : A); if (k < 4) R.pset(x + d * k, y - h * (k + 1), B); } }
    else for (let j = -2; j <= 2; j++) for (let k = 1; k <= Math.min(5, j + 4 - al); k++) R.pset(x + d * k, y + j, k >= j + 3 - al || j === 2 ? B : k === 2 && j > -1 ? Kp : A); }
  for (let j = -2; j <= 2; j++) R.pset(x, y + j, Kp); R.pset(x - 1, y - 3, Kp); R.pset(x + 1, y - 3, Kp); R.pset(x - 2, y - 4, Kp); R.pset(x + 2, y - 4, Kp); };
// LA PALOMA de cerca, a píxel nativo: se dibuja en una rejilla propia por pose (0 alas arriba … 3 alas abajo) y tamaño
// (f 1: ~40 × 30 px; f 0,58: la media), con el ala de detrás en sombra, el cuerpo y la cola en blanco con dos tonos de
// sombra, el ala de delante encima, pico, ojo y la ramita de olivo; el contorno, de un píxel, sale solo. Mira a la
// derecha; dir −1 la vuelve. Devuelve dónde queda la ramita
const PAL = { W: hex('#ffffff'), w: hex('#dde5f2'), s: hex('#b0bdd4'), k: hex('#34405a'), N: hex('#f2a436'), n: hex('#c07a22'), G: hex('#96d444'), g: hex('#4c9c30'), d: hex('#1c5424'), o: hex('#161a28') };
const ALAS = [[[4, -3], [2, -14], [-5, -24], [-10, -19], [-7, -3]], [[4, -3], [-1, -10], [-13, -17], [-18, -13], [-7, -2]], [[5, -2], [-3, -5], [-17, -3], [-18, 2], [-6, 2]], [[4, 0], [1, 10], [-6, 20], [-10, 15], [-7, 1]]];
const PALOMAS = new Map();
const palomaForma = (pose, f, hoja) => { const cl = pose + '/' + f + '/' + hoja; if (PALOMAS.has(cl)) return PALOMAS.get(cl);
  const GW = 80, GH = 60, OX = 40, OY = 30, col = new Uint32Array(GW * GH), cap = new Uint8Array(GW * GH), q = (v) => Math.round(v * f);
  const set = (u, v, c, L) => { const x = OX + u, y = OY + v; if (x < 1 || y < 1 || x > GW - 2 || y > GH - 2) return; col[y * GW + x] = PAL[c]; cap[y * GW + x] = L; };
  const poli = (pts, c, L) => { const P = pts.map(([u, v]) => [u * f, v * f]); let u0 = 99, u1 = -99, v0 = 99, v1 = -99; for (const [u, v] of P) { u0 = Math.min(u0, u); u1 = Math.max(u1, u); v0 = Math.min(v0, v); v1 = Math.max(v1, v); }
    for (let v = Math.floor(v0); v <= Math.ceil(v1); v++) for (let u = Math.floor(u0); u <= Math.ceil(u1); u++) { let d = false; for (let i = 0, j = P.length - 1; i < P.length; j = i++) { const [ui, vi] = P[i], [uj, vj] = P[j]; if ((vi > v) !== (vj > v) && u < (uj - ui) * (v - vi) / (vj - vi) + ui) d = !d; } if (d) set(u, v, c, L); } };
  const raya = (u0, v0, u1, v1, c, L, solo) => { u0 *= f; v0 *= f; u1 *= f; v1 *= f; const n = Math.max(1, Math.ceil(Math.max(Math.abs(u1 - u0), Math.abs(v1 - v0)))); for (let i = 0; i <= n; i++) { const u = Math.round(u0 + (u1 - u0) * i / n), v = Math.round(v0 + (v1 - v0) * i / n); if (!solo || cap[(OY + v) * GW + OX + u] === solo) set(u, v, c, L); } };
  const elip = (cu, cv, ru, rv, L, tono) => { cu *= f; cv *= f; ru *= f; rv *= f; for (let v = Math.floor(cv - rv); v <= Math.ceil(cv + rv); v++) for (let u = Math.floor(cu - ru); u <= Math.ceil(cu + ru); u++) { const a = (u - cu) / ru, b = (v - cv) / rv; if (a * a + b * b <= 1) set(u, v, tono(a, b), L); } };
  const ala = (pts, L, c, cr) => { poli(pts, c, L); const [A, E, D, C, B] = pts, m = (p, r, k) => [p[0] + (r[0] - p[0]) * k, p[1] + (r[1] - p[1]) * k];
    raya(B[0], B[1], C[0], C[1], cr, L, L); raya(C[0], C[1], D[0], D[1], cr, L, L);   // el borde de salida y la punta, en sombra
    if (f === 1) for (let k = 1; k <= 3; k++) { const a = m(B, C, k / 4 + 0.1), b = m(E, D, k / 4), c2 = m(a, b, 0.62); raya(a[0], a[1], c2[0], c2[1], cr, L, L); }   // las plumas largas
    if (f === 1) { const a = m(A, B, 0.55), b = m(E, m(D, C, 0.5), 0.5), c2 = m(a, b, 0.85); raya(m(a, b, 0.3)[0], m(a, b, 0.3)[1], c2[0], c2[1], cr, L, L); } };   // las cobertoras
  const dx = pose === 2 ? 3 : 4, dy = pose === 2 ? -2 : pose === 3 ? 0 : -1;
  ala(ALAS[pose].map(([u, v]) => [u + dx, v + dy]), 1, 'w', 's');   // el ala de detrás
  // la cola en abanico, el cuerpo, el pecho y la cabeza
  poli([[-8, -3], [-21, -5], [-23, -1], [-22, 3], [-8, 3]], 'W', 2); raya(-10, -1, -22, -3, 'w', 2, 2); raya(-10, 1, -22, 0, 'w', 2, 2); raya(-9, 3, -22, 3, 's', 2, 2); raya(-22, -4, -23, 2, 'w', 2, 2);
  elip(1, 0, 12, 5.6, 2, (a, b) => b > 0.72 ? 's' : b > 0.3 ? 'w' : 'W'); elip(7, 0.4, 6.6, 5.8, 2, (a, b) => b > 0.78 ? 's' : b > 0.42 ? 'w' : 'W');
  elip(13, -4, 4, 4, 2, (a, b) => b > 0.5 && a < 0.3 ? 'w' : 'W');
  set(q(-1), q(6), 'n', 2); set(q(-2), q(6), 'N', 2);   // las patas, recogidas
  ala(ALAS[pose], 3, 'W', 'w');   // el ala de delante
  // el pico, el ojo y la ramita de olivo: el tallo y dos hojas, una hacia arriba y otra hacia abajo
  const bx = q(13) + Math.round(4 * f) + 1, by = q(-4); set(bx, by, 'N', 4); set(bx + 1, by, 'N', 4); set(bx, by + 1, 'n', 4); set(q(14), q(-5), 'o', 2);
  if (hoja) { const h = (pts, c, L) => { const sv = poli; return sv(pts.map(([u, v]) => [(bx + 1 + u * f) / f, (by + v * f) / f]), c, L); };
    h([[1, 0], [4, -5], [10, -6], [8, -1], [4, 1]], 'G', 5); h([[1, 1], [4, 2], [9, 6], [5, 7], [2, 4]], 'g', 5);
    if (f === 1) { for (let i = 0; i < 6; i++) set(bx + 4 + i, by - 1 - Math.round(i * 0.7), 'g', 5); for (let i = 0; i < 5; i++) set(bx + 4 + i, by + 3 + Math.round(i * 0.6), 'G', 5); }
    set(bx + 2, by, 'd', 5); set(bx + 2, by + 1, 'd', 5); }
  // las costuras (donde un ala pisa el cuerpo) y el contorno fino de fuera
  const V = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  for (let y = 1; y < GH - 1; y++) for (let x = 1; x < GW - 1; x++) { const i = y * GW + x, L = cap[i]; if (L === 2 || L === 1) for (const [a, b] of V) { const L2 = cap[i + b * GW + a]; if ((L === 2 && L2 === 3) || (L === 1 && L2 === 2)) { col[i] = PAL.s; break; } } }
  for (let y = 1; y < GH - 1; y++) for (let x = 1; x < GW - 1; x++) { const i = y * GW + x; if (cap[i]) continue; let v = 0; for (const [a, b] of V) v = Math.max(v, cap[i + b * GW + a] & 127); if (v) { col[i] = v === 5 ? PAL.d : PAL.k; cap[i] |= 128; } }
  const r = { GW, GH, OX, OY, col, rama: [bx + Math.round(6 * f), by] }; PALOMAS.set(cl, r); return r; };
const palomaCerca = (x, y, t, dir, f = 1) => { const c = Math.floor(t * 11) % 6, pose = c < 4 ? c : 6 - c, F = palomaForma(pose, f, true); y += pose === 0 ? 1 : pose === 3 ? -1 : 0;
  for (let j = 0; j < F.GH; j++) for (let i = 0; i < F.GW; i++) { const cc = F.col[j * F.GW + i]; if (!cc) continue; const X = x + dir * (i - F.OX), Y = y + j - F.OY; if (X >= 0 && X < 320 && Y >= 0 && Y < 180) R.pset(X, Y, cc); }
  return [x + dir * F.rama[0], y + F.rama[1]]; };
const polilla = (x, y, t) => { x = Math.round(x); y = Math.round(y); const al = Math.floor(t * 14) % 2; R.pset(x, y, hex('#5a4a3a')); R.pset(x - 1, y - al, hex('#e8dcc0')); R.pset(x + 1, y - al, hex('#e8dcc0')); R.pset(x - 2, y - al * 2, hex('#c8b890')); R.pset(x + 2, y - al * 2, hex('#c8b890')); };

// ── 1 · el libro se abre ──
const p1 = (t) => {
  const ABRE = a(2.55), ab = t < ABRE ? 0 : lerp(0.03, 1, tramo(t, ABRE, ABRE + 0.45) * 0.28 + sua(tramo(t, ABRE + 0.45, P2)) * 0.72);
  const o = { encuadre: 'libro', abierto: ab };
  const g = T.insertos(R, t, o);
  // sin luz propia: solo la de las velas. La vida de antes de abrirse es física: dos respingos del libro (sube un
  // píxel y vuelve) que sueltan polvo viejo del canto de abajo
  const RESP = [ABRE - 0.95, ABRE - 0.45]; let salto = 0;
  for (const r of RESP) { const d = t - r; if (d < 0 || d > 0.7) continue;
    if (d < 0.14) { const n = d < 0.09 ? 2 : 1; salto = n; for (let y = 58; y < 139; y++) for (let x = 100; x <= 220; x++) R.pset(x, y, R.pget(x, y + n)); }
    for (let k = 0; k < 18; k++) { const x0 = 108 + ((k * 37 + Math.round(r * 50)) % 104), dk = d - (k % 3) * 0.04; if (dk < 0 || dk > 0.6) continue;
      const x = Math.round(x0 + Math.sin(k * 1.7) * dk * 9), y = Math.round(137 + dk * 5 + dk * dk * 36); R.pset(x, y, k % 2 ? POLVO : POLVO2); if (k % 3 === 0 && dk < 0.35) R.pset(x + 1, y, POLVO2); } }
  // al abrirse: el polvo salta de los cantos de las tapas, hacia fuera, y cae
  if (t >= ABRE) for (let k = 0; k < 28; k++) { const d = t - ABRE - (k % 4) * 0.05; if (d < 0 || d > 0.85) continue; const lado = k % 2 ? 1 : -1, hw = 56 + Math.min(1, d / 0.3) * 24;
    const x = Math.round(160 + lado * (hw + d * (6 + (k % 5) * 4))), y = Math.round(70 + (k * 13) % 64 - d * 10 + d * d * 46); R.pset(x, y, k % 3 ? POLVO : POLVO2); if (k % 4 === 0 && d < 0.4) R.pset(x, y + 1, POLVO2); }
  // dos polillas: la de la derecha ronda su llama; la de la izquierda deja la suya, se posa en la tapa, salta con cada
  // respingo y huye a su vela cuando el libro se abre
  { const va = sua(tramo(t, ABRE * 0.16, ABRE * 0.5)), vu = sua(tramo(t, ABRE - 0.06, ABRE + 0.5)), w = va * (1 - vu), ox = 38 + Math.sin(t * 2.3) * 13, oy = 48 + Math.cos(t * 3.1) * 8;
    const px = lerp(ox, 146, w), py = lerp(oy, 80, w) - Math.sin(w * Math.PI) * 14 - (w > 0.98 ? salto * 2 : 0);
    polillaG(px, py, t, w > 0.98 && !salto); }
  polilla(282 + Math.cos(t * 1.9) * 12, 56 + Math.sin(t * 2.7) * 9, t + 0.3);
  T.insertosDelante(R, t, o);

};

// ── 2 · el astillero: el barco se levanta solo ──
const GOLPES = [4.55, 5.25, 5.9, 6.6, 7.25, 7.9];
const p2 = (t) => {
  const ob = lerp(0.2, 1, tramo(t, P2, a(9.2))), nb = sua(tramo(t, a(7.6), a(9.5)));
  const o = { encuadre: 'astillero', obra: ob, nubes: nb };
  T.relato(R, t, o);
  // cada tabla que encaja: polvo de serrín en el costado
  GOLPES.forEach((s, k) => { const d = t - a(s); if (d < 0 || d > 0.5) return; const x = 70 + ((k * 67) % 190), y = 84 + ((k * 23) % 44);
    for (let j = 0; j < 7; j++) { const an = j * 0.9 + k, r = 3 + d * 22; R.pset(Math.round(x + Math.cos(an) * r), Math.round(y + Math.sin(an) * r * 0.6 + d * d * 20), j % 2 ? hex('#f0d8a0') : hex('#c8a060')); }
    if (d < 0.12) destello(x, y, 3, hex('#fff2c0')); });
  // el aviso: un relámpago lejano en el frente de tormenta
  const dr = t - a(9.02);
  if (dr >= 0 && dr < 0.42 && (dr < 0.1 || (dr > 0.2 && dr < 0.3))) { const pts = [[26, 22], [30, 38], [24, 42], [31, 60], [26, 64], [33, 86]];
    for (let i = 1; i < pts.length; i++) { R.linea(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1], hex('#ffffff')); R.linea(pts[i - 1][0] + 1, pts[i - 1][1], pts[i][0] + 1, pts[i][1], hex('#fff0a0')); }
    for (let y = 16; y < 100; y += 1) for (let x = (y % 2); x < 120; x += 2) mez(x, y, hex('#ffffff'), 0.16 * (1 - x / 120)); }
  // los pájaros huyen del frente (de izquierda a derecha, bajos)
  const hu = tramo(t, a(8.3), P3 + 0.5);
  if (hu > 0) for (let k = 0; k < 6; k++) { const x = Math.round(-10 + hu * 250 - k * 17 + (k % 2) * 6), y = Math.round(40 + (k * 7) % 22 - hu * 14 + Math.sin(t * 3 + k) * 2), al = Math.floor(t * 9 + k) % 2;
    if (x < 2 || x > 270) continue; R.pset(x, y, K); R.pset(x - 1, y - (al ? 1 : -1), K); R.pset(x + 1, y - (al ? 1 : -1), K); R.pset(x - 2, y - (al ? 2 : -1), K); R.pset(x + 2, y - (al ? 2 : -1), K); }
  T.relatoDelante(R, t, o);
};

// ── 3 · la medida ──
const p3 = (t) => {
  const rg = lerp(0, 0.95, sua(tramo(t, a(10.0), a(12.0)))) + 0.05 * tramo(t, a(12.0), a(12.1)), cp = sua(tramo(t, a(13.3), a(14.3)));

  const g = T.insertos(R, t, o);
  // mientras se tiende: la punta brilla y una etiqueta cuenta los codos (0…300)
  if (rg > 0.01 && rg < 0.96 && g.reglaPunta) { const x = Math.round(g.reglaPunta[0]), y = Math.round(g.reglaPunta[1]), n = Math.round(rg / 0.95 * 30) * 10, tx = Math.min(236, Math.max(70, x));

    R.rect(tx - 15, 113, tx + 15, 127, K); R.rect(tx - 14, 114, tx + 14, 126, BL); R.poligono([[tx - 3, 113], [tx + 3, 113], [tx, 109]], K); R.numero(String(n), tx, 124, { centro: true, sombra: false, color: ROJO }); }
  // «300»: un subrayado que se abre bajo la cifra y dos marcas que bajan de proa y popa a la regla
  const d3 = t - a(12.1);
  if (d3 >= 0) { const w = Math.round(sua(Math.min(1, d3 / 0.35)) * 22); if (t < a(13.7)) R.rect(105, 127, 105 + w, 128, ROJO);
    for (const x of [53, 233]) for (let y = 98 + Math.floor(t * 6) % 2; y < 104; y += 2) R.pset(x, y, ROJO); }
  // «140»: el otro lado de la cuenta
  const d4 = t - a(13.87);
  if (d4 >= 0 && d4 < 1.2) { const w = Math.round(sua(Math.min(1, d4 / 0.3)) * 22); R.rect(158, 127, 158 + w, 128, hex('#2e5a8a')); }
  // un cursor recorre el campo de punta a punta: la misma longitud
  const cu = tramo(t, a(14.3), P4 - 0.2);
  if (cp >= 1) { const x = Math.round(lerp(30, 171, sua(cu))); for (let i = 30; i < x; i += 2) R.rect(i, 145, i, 146, ROJO); R.poligono([[x - 4, 151], [x + 4, 151], [x, 144]], K); R.poligono([[x - 2, 150], [x + 2, 150], [x, 146]], ORO); }
  T.insertosDelante(R, t, o);
};
