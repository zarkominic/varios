<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ep40 · short 1 · miniatura</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// AK-SHORT1-MINIATURA · ep40, vertical: lo que cuenta en la columna central (x 110–210). Con chibis, sin palabras.
import { crearRoma } from '/atomo/plato/kits/pixel-roma.js';
import { conChibi, ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
import { fondo, fondoDelante } from '/atomo/plato/escenas/ak-comun.js';
import { figura, grado, halo, cifra, desplazar } from '/atomo/plato/escenas/mini-chibi.js';
const R = conChibi(await crearRoma(document.getElementById('lienzo')));
const dibujar = (t) => {
  const o = { encuadre: 'naufragio', camara: 'terron', brillo: 1 };
  fondo(R, t, o); fondoDelante(R, t, o); desplazar(R, -30);
  grado(R, { cx: 150, cy: 112, tinte: '#06141c', f: 0.2, desde: 0.4, max: 0.78 });
  halo(R, 142, 112, 66, 50, '#ffd27a', 0.32);
  halo(R, 142, 112, 36, 28, '#ffe6a0', 0.7);
  halo(R, 142, 114, 18, 14, '#fffbe8', 0.75);
  figura(R, EL.stadiatisAK, 184, 176, t, { dir: -1, sorpresa: true }, 2);
};
window.__frame = async (t) => { dibujar(t); R.presentar(); };
window.__listo = true;
</script>
</body>
</html>
