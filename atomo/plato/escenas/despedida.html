<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Despedida · plastilina</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
// Despedida (plastilina, 4,8 s). El átomo se despide: se balancea de lado a lado y uno de sus
// electrones sale de la órbita con un brazo de churro y se convierte en una mano de plastilina
// que saluda. [tema]: a su lado brota un bocadillo de plastilina con una «?» (¿qué explico
// ahora?). [comentarios]: la «?» da un bote. Después, todo quieto.
import { escena } from '/atomo/plato/escena.js';
import { crearPlato, calma, cl, mix, prog, ss, eio, eoc, muelle, brote, COLOR } from '/atomo/plato/kits/plastilina.js';

const E = await escena('despedida');
const M = (k) => E.marca(k);
const P = await crearPlato({
  piezas: ['bocadillo', 'glifo:?'], mano: true,
  camara: { pos: [0, 3.8, 14], mira: [0, 2.3, 0], fov: 28, desenfoque: 30 },
});

const ATOMO = [-1.4, 2.12, 0.5], A_ESC = 0.95;
const BOCA = [1.95, 3.85, 0.4];

function dibujar(t) {
  const n = P.fotograma(t, E.duracion), ts = n / 12;
  const tz = calma(ts, E.duracion);          // reloj del reposo: frena y se para al final
  const en = E.energia(ts);
  P.limpiar();
  const tq = M('tema'), tc = M('comentarios');

  // ---------- el átomo saluda ----------
  const ola = ss(0.15, 0.45, ts) * (1 - ss(tq - 0.35, tq + 0.1, ts));     // intensidad del saludo
  const fase = Math.max(0, ts - 0.15) * 2 * Math.PI * 1.3;
  const vaiven = Math.sin(fase) * ola;
  const salto = Math.abs(Math.sin(fase)) * ola;
  const gira = ss(tq - 0.3, tq + 0.15, ts);                                  // se vuelve hacia el bocadillo
  // el electrón 0 sale de su órbita con un brazo de churro y se vuelve una mano que saluda
  // (coordenadas locales del átomo); al final vuelve a su órbita
  const mano = ss(0.05, 0.4, ts) * (1 - ss(tq - 0.25, tq + 0.3, ts));
  const ang = 0.8 + 0.7 * Math.sin(fase + 0.6) * ss(0.25, 0.55, ts);
  const electrones = [{
    pos: [2.7 * Math.cos(ang), 2.7 * Math.sin(ang), 0.3], mezcla: eio(mano),
    brazo: ss(0.25, 0.75, mano), grosor: 0.1, mano: ss(0.3, 0.9, mano), tamMano: 0.3,
  }];
  const k = 0.07 * salto - 0.05 * muelle(ts - (tq + 0.15), 2.4, 6) * gira - 0.04 * muelle(ts - tc, 2.4, 6) * ss(tc - 0.1, tc, ts);
  P.atomo({
    pos: [ATOMO[0] + 0.05 * vaiven, ATOMO[1] + 0.12 * salto + 0.03 * Math.sin(tz * 2.1) + 0.04 * en, ATOMO[2]],
    escala: A_ESC, yaw: mix(-0.15, 0.32, gira), pitch: 0.06, roll: -0.3 * vaiven - 0.06 * gira,
    sq: [1 - 0.5 * k, 1 + k, 1 - 0.5 * k], energia: en, ts: tz, electrones, toque: ola > 0.05 || (ts > tq - 0.3 && ts < tq + 0.3) || (ts > tc - 0.2 && ts < tc + 0.3),
  });

  // ---------- el bocadillo con la «?» ----------
  const kb = brote(ts, tq, 0.25, 0.14);
  if (kb > 0) {
    const u = prog(ts, tq - 0.25, tq);
    const st = 0.2 * Math.sin(Math.PI * u) - 0.1 * muelle(ts - tq, 2.4, 6);
    P.pieza(0, {
      pos: [mix(BOCA[0] - 0.9, BOCA[0], eoc(u)), mix(BOCA[1] - 0.8, BOCA[1], eoc(u)) + 0.03 * Math.sin(tz * 1.4), BOCA[2]],
      escala: 1.3 * kb, sq: [1 - 0.3 * st, 1 + st, 1], rot: [-0.08, -0.18, 0.05 * Math.sin(tz * 1.1)],
      puntos: 0, toque: ts < tq + 0.45,
    });
    // la «?» brota dentro del bocadillo y da un bote en [comentarios]
    const kq = brote(ts, tq + 0.2, 0.25, 0.18);
    if (kq > 0) {
      const bote = ss(tc - 0.25, tc, ts) * (1 - ss(tc, tc + 0.35, ts));
      const sq = 0.25 * Math.sin(Math.PI * prog(ts, tc - 0.25, tc + 0.35)) - 0.1 * muelle(ts - (tc + 0.35), 2.4, 6) * ss(tc, tc + 0.35, ts);
      P.pieza(1, {
        pos: [BOCA[0] + 0.05, BOCA[1] + 0.12 + 0.28 * bote + 0.03 * Math.sin(tz * 1.4), BOCA[2] + 0.55],
        escala: 0.95 * kq, sq: [1 - 0.4 * sq, 1 + sq, 1], rot: [-0.08, -0.18, 0.05 * Math.sin(tz * 1.1)],
        color: COLOR.TERRACOTA, toque: ts < tq + 0.5 || (ts > tc - 0.3 && ts < tc + 0.5),
      });
    }
  }

  P.render(n);
}

E.iniciar(dibujar, { paso: 1 / 12 });
</script>
</body>
</html>
