// LA-HOLA (frase 6), hoy. Un plano, con encuadre propio (no repite los del río de la-gancho ni la-cierre): el río tóxico
// visto desde la orilla de enfrente, río abajo, de día. Al fondo, colinas en dos términos y la mansión pequeña a la
// izquierda en su colina (torre torcida con el arco de la antena, torrecilla con sombrero de bruja, chimenea que humea y
// una antena parabólica de hoy); la máquina queda fuera de cuadro, a la izquierda: solo se ve su humo verde. El lodo cruza
// de lado a lado con ondas, espuma, reflejos de la mansión y de las colinas, un bidón y una botella que bajan, una rana
// de tres ojos en su nenúfar y un pez que salta. En la orilla de acá: un embarcadero con su barca amarrada, una caña con
// el corcho que pica, juncos y espadañas en primer término. El tentáculo verde da un saltito y saluda a Atom («Atom»);
// el morado, con sus bracitos nuevos, le hace burla sacando la lengua («school didn't teach you»); en «Let's find out»
// los dos se van saltando hacia la izquierda, río arriba, hacia la máquina.
import * as T from '/atomo/plato/escenas/la-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('la-hola');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const mez = (c, d, a) => { const r = c & 255, g = (c >> 8) & 255, b = (c >> 16) & 255, r2 = d & 255, g2 = (d >> 8) & 255, b2 = (d >> 16) & 255;
  return (0xff000000 | (Math.round(b + (b2 - b) * a) << 16) | (Math.round(g + (g2 - g) * a) << 8) | Math.round(r + (r2 - r) * a)) >>> 0; };
const h1 = (a, b = 0) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
const tr4 = (x, y) => [0, 0.5, 0.125, 0.625, 0.75, 0.25, 0.875, 0.375, 0.1875, 0.6875, 0.0625, 0.5625, 0.9375, 0.4375, 0.8125, 0.3125][(y & 3) * 4 + (x & 3)];

// cuánto destella un relámpago que cae en t0 (dos golpes de luz)
const luzRayo = (t, t0) => { const d = t - t0; return d < 0 ? 0 : d < 0.07 ? 0.55 : d < 0.13 ? 0.1 : d < 0.2 ? 0.35 : d < 0.45 ? 0.35 * (1 - (d - 0.2) / 0.25) : 0; };
// el rayo en zigzag de (x, y0) a y1, con ramitas, entre xmin y xmax

  while (py < y1) { const nx = Math.max(xmin, Math.min(xmax, px + Math.round((h1(py, k) - 0.5) * 12))), ny = Math.min(y1, py + 5 + Math.round(h1(py, k + 1) * 6));

// una burbuja de lodo que crece y revienta en salpicaduras (u 0–1)

  if (u < 0.7) { const r = rMax * Math.sin(u / 0.7 * Math.PI / 2); R.disco(x, y, r + 1, hex('#1a5a1a')); R.disco(x, y, r, hex('#5ad84a')); R.disco(x - r * 0.3, y - r * 0.3, r * 0.45, hex('#9af88a')); R.pset(Math.round(x - r * 0.45), Math.round(y - r * 0.5), hex('#ffffff')); }
  else { const v = (u - 0.7) / 0.3; for (let k = 0; k < 10; k++) { const a = k * 0.628 + 0.3, d = rMax * (0.6 + v * 1.4); R.rect(Math.round(x + Math.cos(a) * d), Math.round(y - Math.abs(Math.sin(a)) * d * 1.3 + v * v * 8), Math.round(x + Math.cos(a) * d) + 1, Math.round(y - Math.abs(Math.sin(a)) * d * 1.3 + v * v * 8) + 1, k % 2 ? hex('#8af87a') : hex('#3aa83a')); }
    R.anillo(x, y, rMax * (0.5 + v), hex('#9af88a'), 2); } };
// un bocadillo de cómic redondo con un pictograma dentro (dibuja(R, cx, cy)); cola hacia (qx, qy); a 0–1 lo hace crecer
const bocata = (R, cx, cy, w, hh, qx, qy, a, dibuja) => { if (a <= 0) return; const s = Math.min(1, a * 1.6), W = Math.round(w * s), Hh = Math.round(hh * s);

const A = (f) => en('hola', f);

  { const tx = 178, yb = Math.round(c1(178)) + 2; for (let y = yb - 14; y < yb; y++) { const w = Math.round((y - yb + 14) * 0.25); R.pset(tx - w, y, hex('#4a5490')); R.pset(tx + w, y, hex('#4a5490')); if (y % 3 === 0) R.linea(tx - w, y, tx + w, y, hex('#5a64a0')); } R.linea(tx - 5, yb - 11, tx + 5, yb - 11, hex('#4a5490')); }

  for (let k = 0; k < 60; k++) { const x = Math.floor(h1(k, 3) * 320), y = Math.round(c2(x)) + 2 + Math.floor(h1(k, 5) * Math.max(1, rioA(x) - c2(x) - 3)); R.pset(x, y, hex('#3a5a3a')); R.pset(x + 1, y - 1, hex('#8aa868')); R.pset(x - 1, y, hex('#3a5a3a')); }

    R.linea(mx - 24, my - 35, mx - 26, my - 41, hex('#3a3040')); R.linea(mx - 20, my - 35, mx - 18, my - 41, hex('#3a3040')); R.pset(mx - 26, my - 42, hex('#e8e0a0')); R.pset(mx - 18, my - 42, hex('#e8e0a0'));
    // el cuerpo de tablas salmón, cornisa de dentículos y ventanas

    R.linea(mx - 14, my - 18, mx + 13, my - 18, hex('#f8dccc')); for (let x = mx - 13; x <= mx + 12; x += 2) R.pset(x, my - 17, hex('#8a3a3a'));
    for (let i = 0; i < 4; i++) for (const wy of [my - 14, my - 8]) { const wx = mx - 11 + i * 6 + (i > 1 ? 1 : 0); if (i === 2 && wy === my - 8) continue; R.rect(wx, wy, wx + 2, wy + 3, hex('#2a2440')); R.pset(wx, wy, hex('#a8c8e8')); R.linea(wx - 1, wy + 4, wx + 3, wy + 4, hex('#fff0e0')); }

    for (let y = my - 25; y <= my - 19; y++) for (let x = mx - 15; x <= mx + 14; x++) { if (R.pget(x, y) !== hex('#6a3a9a')) continue; if ((x + (y % 2) * 2) % 4 === 0) R.pset(x, y, hex('#4a2478')); else if (y === my - 25 || (x + (y % 2) * 2) % 4 === 1) R.pset(x, y, hex('#9a6ac8')); }
