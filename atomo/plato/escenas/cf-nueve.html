<script type="module">
// CF-NUEVE (frase 26), hoy. Cuatro planos:
// 1. hoy/mapa (o.encontrados 3; 2.ª vez): una mano (T.brazo) entra por la esquina de abajo y, en «nine», da un toque en la
//    nota del «9 ?»: los nueve interrogantes saltan como palomitas (gag 7, o.dudas); otro toque, marca el compás y se va;
//    en «agree on several» una línea roja de puntos se traza sola alrededor de las del este. Corta en «New York».
// 2. (LOCAL) T.mapa, la mitad este (zoom 1,15): una lupa de latón que amplía al doble llega del mar y salta de ciudad en
//    ciudad dejando un rastro de puntos; bajo ella cae cada chincheta, grande y con rebote, al nombrarla (Nueva York,
//    Houston, Milwaukee, San Agustín, Nueva Orleans, Montreal) y de cada una salta su «?» grande; las tres verdes ya
//    están; un velero y dos gaviotas en el Atlántico. Corta en «Roanoke».
// 3. (LOCAL) dos postales sujetas con chincheta: la isla de dunas de Roanoke (la chincheta cae en «Roanoke») y la fila de
//    casas de colores de Charleston (en «Charleston»); en «the exact spot is disputed» la X salta de un sitio a otro
//    con un «?». Corta en «and San Francisco».
// 4. (LOCAL) San Francisco: el puente rojo entre la niebla que pasa, el faro que barre, un carguero; en «mystery», un gran
//    «?» asoma en la niebla.
import * as T from '/atomo/plato/escenas/cf-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('cf-nueve');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const K = T.C.k, PZ = T.PIEZAS_CF;
const h = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const BY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const RA = (...c) => c.map(hex);
const tono = (r, v, x, y) => r[Math.max(0, Math.min(r.length - 1, Math.floor(v + BY[(y & 3) * 4 + (x & 3)] / 16)))];
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const sua = (u) => u * u * (3 - 2 * u);
// lo fijo de un plano se pinta una vez en su búfer y se copia en cada fotograma
const fijo = (pinta) => { let b = null; return () => { if (!b) { b = R.nuevo(); const prev = R.usar(b); pinta(); R.usar(prev); } R.copiar(b); }; };
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
const baña = (x0, y0, x1, y1, col, a, f = null) => { for (let y = Math.max(0, y0 | 0); y <= Math.min(179, y1 | 0); y++) for (let x = Math.max(0, x0 | 0); x <= Math.min(319, x1 | 0); x++) { const k = f ? f(x, y) : 1; if (k > 0) R.pset(x, y, mez(R.pget(x, y), col, a * k)); } };
// una sombra o una luz en elipse (centro, radios)
const elipse = (cx, cy, rx, ry, col, a) => baña(cx - rx, cy - ry, cx + rx, cy + ry, col, a, (x, y) => { const d = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2; return d < 1 ? 1 - d * d : 0; });
const relleno = (x0, y0, x1, y1, r, v0, amp = 0.6, k = 0) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) R.pset(x, y, tono(r, v0 + (h(x >> 1, y >> 1, k) - 0.5) * amp, x, y)); };
// madera con vetas (tablas horizontales de alto ht)
const madera = (x0, y0, x1, y1, r, ht = 12, k = 0) => { for (let y = y0; y <= y1; y++) { const tb = Math.floor((y - y0) / ht), fy = (y - y0) % ht;
  for (let x = x0; x <= x1; x++) { const v = 1.6 + Math.sin(x * 0.045 + tb * 1.7 + Math.sin(y * 0.55 + tb) * 1.4) * 0.8 + (h(x >> 2, y, k + tb) - 0.5) * 0.5 - (fy === 0 ? 1.6 : 0) + (fy === 1 ? 0.6 : 0);
    R.pset(x, y, tono(r, v, x, y)); }
  if (fy === 0) for (let x = x0 + ((tb * 53) % 70); x <= x1; x += 70 + (tb % 3) * 9) R.pset(x, y + 4, r[0]); } };
// cuarterón de madera en relieve (paneles de pared)
const cuarteron = (x0, y0, x1, y1, r) => { R.rect(x0, y0, x1, y1, r[1]); R.rect(x0, y0, x1, y0, r[3]); R.rect(x0, y0, x0, y1, r[3]); R.rect(x0, y1, x1, y1, r[0]); R.rect(x1, y0, x1, y1, r[0]);
  for (let y = y0 + 2; y < y1 - 1; y++) for (let x = x0 + 2; x < x1 - 1; x++) R.pset(x, y, tono(r, 1.4 + Math.sin(y * 0.3 + x * 0.02) * 0.5 + (h(x, y >> 1, 7) - 0.5) * 0.4, x, y)); };
// nube de tres tonos
const nube3 = (cx, cy, w, c) => { const B = [[0, 0, .32], [-.32, .06, .24], [.3, .05, .26], [-.1, -.12, .26], [.14, -.08, .22]];
  for (const [dx, dy, r] of B) R.disco(Math.round(cx + dx * w), Math.round(cy + dy * w + 1), Math.round(r * w), c[0]);
  for (const [dx, dy, r] of B) R.disco(Math.round(cx + dx * w), Math.round(cy + dy * w), Math.round(r * w), c[1]);
  for (const [dx, dy, r] of B) R.disco(Math.round(cx + dx * w - 1), Math.round(cy + dy * w - 2), Math.round(r * w * 0.7), c[2]); };
const ORO = hex('#f0c040'), OROL = hex('#f6e08a'), OROS = hex('#9a7420'), BL = hex('#f6f6f6'), ROJO = hex('#d8303a'), ROJOL = hex('#f0606a'), VERDE = hex('#3ac85a');
// un anillo que se abre y se apaga (un pulso sobre lo que se nombra)
const pulso = (t, x, y, t0, c, r0 = 6, r1 = 20, d = 0.7) => { const v = tramo(t, t0, t0 + d); if (v > 0 && v < 1) { const r = Math.round(lerp(r0, r1, v)); R.anillo(x, y, r, c, v > 0.6 ? 2 : 0); R.anillo(x, y, r - 1, c, v > 0.3 ? 2 : 0); } };
// un destello en cruz que late
const chispa = (x, y, t, k = 0, c = BL) => T.b_destello(R, x, y, 0.5 + 0.5 * Math.sin(t * 7 + k * 2.1), c);
// una hoja de otoño que cae o rueda
const hoja = (x, y, k, t) => { const c = RA('#e08a2a', '#c85a24', '#e8b83a')[k % 3]; x = Math.round(x); y = Math.round(y); R.pset(x, y, c); R.pset(x + 1, y, c); R.pset(x + (Math.sin(t * 5 + k) > 0 ? 1 : 0), y - 1, c); R.pset(x - 1, y + 1, K); };
// un trozo de cerámica crema con un resto de cenefa azul (w × hh, pico según k)
const trozo = (x, y, w, hh, k = 0) => { x = Math.round(x); y = Math.round(y); const P = k % 3 === 0 ? [[x, y + hh], [x + 1, y + 1], [x + w - 2, y], [x + w, y + hh - 2], [x + w - 3, y + hh]] : k % 3 === 1 ? [[x, y + 2], [x + w - 1, y], [x + w, y + hh], [x + 3, y + hh - 1]] : [[x + 2, y], [x + w, y + 3], [x + w - 2, y + hh], [x, y + hh - 2]];
  R.poligono(P.map(([a, b]) => [a + 1, b + 1]), K); R.poligono(P.map(([a, b]) => [a - 1, b - 1]), K); R.poligono(P.map(([a, b]) => [a + 1, b - 1]), K); R.poligono(P.map(([a, b]) => [a - 1, b + 1]), K);
  R.poligono(P, hex('#f0e6cc')); R.linea(x + 2, y + hh - 1, x + w - 2, y + hh - 1, hex('#cdbd96')); R.linea(x + 2, y + 2 + (k % 2), x + w - 3, y + 1 + (k % 2), hex('#3a6ab0')); R.pset(x + 2, y + 1, BL); };

const n = (f) => en('nueve', f);
const P2 = n(.229), P3 = n(.516), P4 = n(.848);
const nueve = n(.017), cazadores = n(.074), acuerdo = n(.111), varias = n(.150), NY = n(.244), HOU = n(.280), MIL = n(.321), AGU = n(.368), ORL = n(.424), MON = n(.471);
const ROA = n(.522), CAR = n(.592), CHA = n(.672), aunque = n(.730), disputa = n(.820), SF = n(.878), misterio = n(.965);
// un «?» que salta como una palomita en (x, y) desde t0
const palomita = (t, x, y, t0, k = 0) => { const v = tramo(t, t0, t0 + 0.35); if (v <= 0) return; const bot = v < 1 ? Math.sin(v * Math.PI) * 9 : Math.abs(Math.sin(t * 3.4 + k * 1.3)) * 2, py = Math.round(y - 12 * v - bot);
  R.disco(x, py + 1, 6, K); R.disco(x - 3, py - 2, 3, K); R.disco(x + 3, py - 1, 3, K); R.disco(x - 3, py - 2, 2, hex('#fff6d8')); R.disco(x + 3, py - 1, 2, hex('#f4dc9a')); R.disco(x, py + 1, 5, hex('#fff0c0')); R.icono('?', x - 2, py - 2, hex('#a82c28'), hex('#f4dc9a')); };
// ── 1: los nueve interrogantes (gag 7) ──
const MANGA1 = '#3a6ab0';
const p1 = (t) => {
  const g = T.hoy(R, t, { encuadre: 'mapa', encontrados: 3, dudas: tramo(t, nueve, nueve + 2.3) * 0.85 });
  const [nx, ny] = g.nota;
  // la línea de puntos roja que se traza sola alrededor de las del este en «agree on several», con su punta que chispea
  const ro = tramo(t, acuerdo, varias + 0.5), RX = 214, RY = 88, RA1 = 62, RB1 = 66;
  if (ro > 0) { for (let k = 0; k < 200 * ro; k++) { const a = -Math.PI / 2 + k / 200 * Math.PI * 2; if ((k + Math.floor(t * 8)) % 6 < 2) continue; const x = Math.round(RX + Math.cos(a) * RA1), y = Math.round(RY + Math.sin(a) * RB1); R.rect(x, y, x + 1, y + 1, ROJO); R.pset(x + 1, y + 2, hex('#7a1e26')); }
    if (ro < 1) { const a = -Math.PI / 2 + ro * Math.PI * 2, x = Math.round(RX + Math.cos(a) * RA1), y = Math.round(RY + Math.sin(a) * RB1); R.disco(x, y, 3, K); R.disco(x, y, 2, ROJOL); T.b_destello(R, x, y, 0.5 + 0.5 * Math.sin(t * 22), BL); } }
  // la mano entra por la esquina de abajo y da dos toques en la nota del «9 ?»: con el primero («nine») empiezan a saltar
  // los interrogantes; se queda marcando el compás y se va cuando la línea empieza a trazarse
  const entra = sua(tramo(t, 0.15, nueve - 0.06)), sale = sua(tramo(t, acuerdo + 0.1, acuerdo + 0.6));
  const toque = (t0) => { const v = (t - t0) / 0.3; return v > 0 && v < 1 ? Math.sin(v * Math.PI) : 0; };
  const sube = Math.max(toque(nueve + 0.02), toque(nueve + 0.62), toque(nueve + 1.25) * 0.6) * 5 + (t > nueve + 1.6 && sale <= 0 ? Math.max(0, Math.sin(t * 5)) * 1.5 : 0);
  const mx = lerp(lerp(336, nx + 26, entra), 338, sale), my = lerp(lerp(186, ny + 11, entra), 192, sale) - sube;
  if (t > nueve - 0.03 && t < nueve + 0.45) pulso(t, nx, ny, nueve - 0.03, OROL, 12, 26, 0.45);
  if (t > nueve + 0.6 && t < nueve + 1.0) pulso(t, nx, ny, nueve + 0.6, OROL, 12, 22, 0.4);
  // las rayitas del toque, junto al dedo
  for (const t0 of [nueve, nueve + 0.6]) { const v = (t - t0) / 0.25; if (v > 0 && v < 1) for (const [dx, dy] of [[-5, -5], [-7, 0], [-3, -8]]) R.linea(Math.round(mx - 12 + dx), Math.round(my + dy), Math.round(mx - 12 + dx * (1 + v)), Math.round(my + dy * (1 + v)), K); }
  if (sale < 1) T.brazo(R, Math.round(mx + 16), Math.round(my + 24), Math.round(mx), Math.round(my), MANGA1, -1, { codo: [Math.round(mx + 12), Math.round(my + 9)] });
};

// ── 2: la mitad este, de cerca (LOCAL: T.mapa) ──
const NOMBRADAS = [['nuevaYork', NY, 16, -3], ['houston', HOU, -15, -15], ['milwaukee', MIL, 14, -18], ['sanAgustin', AGU, 17, -9], ['nuevaOrleans', ORL, 14, -17], ['montreal', MON, 18, -10]];
const LL = Object.fromEntries(T.F_CIUDADES.map(([k, lon, lat]) => [k, [lon, lat]]));
// una chincheta grande (cabeza de 4 px de radio) que cae desde arriba, rebota y se queda; v < 0: aún no ha salido
const pin2 = (x, y, t, t0) => { const v = (t - (t0 - 0.3)) / 0.3; if (v <= 0) return; const r1 = (t - t0) / 0.26, r2 = (t - t0 - 0.26) / 0.16;
  const alto = v < 1 ? Math.round((1 - v * v) * Math.min(46, y - 30)) : r1 < 1 ? Math.round(Math.sin(r1 * Math.PI) * 7) : r2 > 0 && r2 < 1 ? Math.round(Math.sin(r2 * Math.PI) * 2) : 0, hy = y - 9 - alto;
  R.disco(x + 2 + Math.round(alto / 4), y + 1, alto > 20 ? 1 : 2, hex('#4a4038'));   // la sombra, que se junta al caer
  R.linea(x, y - alto, x, hy + 2, K); R.linea(x + 1, y - 1 - alto, x + 1, hy + 2, hex('#b8bcc8'));
  R.disco(x, hy, 5, K); R.disco(x, hy, 4, ROJO); R.disco(x - 1, hy - 1, 2, ROJOL); R.pset(x - 2, hy - 2, BL); R.pset(x + 2, hy + 2, hex('#8a1e26'));
  if (r1 > 0 && r1 < 1) for (let k = 0; k < 6; k++) { const a = Math.PI + k / 5 * Math.PI, d = 4 + r1 * 8; R.pset(Math.round(x + Math.cos(a) * d), Math.round(y + 1 + Math.sin(a) * d * 0.5), k % 2 ? K : hex('#8a7a5a')); } };
// el «?» grande de cada una: salta de la chincheta a su sitio y se queda latiendo
const duda2 = (t, x, y, dx, dy, t0, k) => { const v = tramo(t, t0, t0 + 0.4); if (v <= 0) return; const bot = v < 1 ? Math.sin(v * Math.PI) * 10 : Math.abs(Math.sin(t * 3.4 + k * 1.3)) * 1.5, px = Math.round(x + dx * sua(v)), py = Math.round(y - 9 + (dy + 9) * v - bot), r = v < 0.5 ? 6 : 8;
  R.linea(x + Math.sign(dx) * 4, y - 9, px - Math.sign(dx) * (r - 1), py + 3, K);
  R.disco(px, py + 1, r + 1, K); R.disco(px - 4, py - 3, 4, K); R.disco(px + 4, py - 2, 4, K); R.disco(px - 4, py - 3, 3, hex('#fff6d8')); R.disco(px + 4, py - 2, 3, hex('#f4dc9a')); R.disco(px, py + 1, r, hex('#fff0c0')); R.disco(px + 2, py + 3, r - 3, hex('#fbe6ae'));
  if (v >= 0.5) R.icono('?', px - 4, py - 5, hex('#a82c28'), hex('#f4dc9a'), 2); else R.icono('?', px - 2, py - 2, hex('#a82c28'), hex('#f4dc9a')); };
// la lupa (radio r): amplía al doble lo que tiene debajo, con su cristal, su aro de latón, su mango (áng. am) y su sombra
const lupa2 = (lx, ly, r, am) => {
  const m = Math.ceil(r / 2) + 1, w = 2 * m + 1, src = new Uint32Array(w * w);
  for (let j = -m; j <= m; j++) for (let i = -m; i <= m; i++) src[(j + m) * w + i + m] = R.pget(cl(lx + i, 0, 319), cl(ly + j, 0, 179));
  baña(lx - r - 2, ly - r - 1, lx + r + 8, ly + r + 9, K, 0.3, (x, y) => { const d = Math.hypot(x - lx - 4, y - ly - 5); return d < r + 3 && Math.hypot(x - lx, y - ly) > r ? 1 : 0; });
  const ca = Math.cos(am), sa = Math.sin(am);
  for (const [d, c] of [[-3, K], [-2, hex('#7a5028')], [-1, hex('#b07e44')], [0, hex('#c89858')], [1, hex('#b07e44')], [2, hex('#7a5028')], [3, K]]) R.linea(Math.round(lx + ca * (r + 2) - sa * d), Math.round(ly + sa * (r + 2) + ca * d), Math.round(lx + ca * (r + 24) - sa * d), Math.round(ly + sa * (r + 24) + ca * d), c);
  for (const d of [-3, -2, -1, 0, 1, 2, 3]) { R.pset(Math.round(lx + ca * (r + 24) - sa * d), Math.round(ly + sa * (r + 24) + ca * d), K); R.pset(Math.round(lx + ca * (r + 5) - sa * d), Math.round(ly + sa * (r + 5) + ca * d), Math.abs(d) === 3 ? K : ORO); R.pset(Math.round(lx + ca * (r + 6) - sa * d), Math.round(ly + sa * (r + 6) + ca * d), Math.abs(d) === 3 ? K : OROS); }
  for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) { const d = Math.hypot(i, j); if (d > r + 0.5) continue;
    if (d > r - 1) R.pset(lx + i, ly + j, K); else if (d > r - 2.2) R.pset(lx + i, ly + j, i + j < 0 ? OROL : ORO); else if (d > r - 3.4) R.pset(lx + i, ly + j, i + j < 0 ? ORO : OROS); else if (d > r - 4.2) R.pset(lx + i, ly + j, K);
    else { let c = src[(Math.floor(j / 2) + m) * w + Math.floor(i / 2) + m]; if (d > r - 7) c = mez(c, hex('#bfe0f0'), 0.22); if (Math.abs(i + j + r * 0.9) < 2 && d < r - 6) c = mez(c, BL, 0.45); if (Math.abs(i + j + r * 0.9 - 5) < 1 && d < r - 8) c = mez(c, BL, 0.3); R.pset(lx + i, ly + j, c); } }
};
const VISTA2 = { zoom: 1.15, centro: [-80.5, 39.3], rosa: [270, 142] };
const p2 = (t) => {
  const P = T.mapa(R, t, VISTA2);
  const en2 = (k) => P(LL[k]).map(Math.round);
  // un velero que cruza el Atlántico y dos gaviotas
  { const bx = Math.round(236 + ((t - P2) * 3.2) % 60), by = 96 + Math.round(Math.sin(t * 1.3) * 1); R.linea(bx - 3, by, bx + 3, by, K); R.poligono([[bx, by - 1], [bx, by - 7], [bx + 4, by - 1]], BL); R.poligono([[bx - 1, by - 1], [bx - 1, by - 5], [bx - 3, by - 1]], hex('#e8e0c8')); for (let i = 1; i <= 3; i++) R.pset(bx - 4 - i * 2, by + 1 + (Math.floor(t * 3 + i) % 2), BL);
    for (let k = 0; k < 2; k++) { const gx = Math.round(222 + k * 26 + Math.sin(t * 0.5 + k * 2) * 12), gy = Math.round(118 + k * 22 + Math.cos(t * 0.7 + k) * 5), a = Math.floor(t * 5 + k) % 2; R.pset(gx, gy, K); R.pset(gx - 1, gy - 1 + a, K); R.pset(gx + 1, gy - 1 + a, K); R.pset(gx - 2, gy - a, K); R.pset(gx + 2, gy - a, K); } }
  // por dónde va la lupa: llega del mar a Nueva York y salta de una a otra, justo antes de que caiga cada chincheta
  const C2 = NOMBRADAS.map(([k]) => en2(k)), foco = (i) => [C2[i][0], Math.max(45, C2[i][1] - 6)], S0 = [foco(0)[0] + 62, foco(0)[1] + 58];
  const ida = (i) => (i === 0 ? sua(tramo(t, P2 - 0.25, NY - 0.12)) : sua(tramo(t, NOMBRADAS[i][1] - 0.52, NOMBRADAS[i][1] - 0.14)));
  const tramoL = (i, u) => { const A = i === 0 ? S0 : foco(i - 1), B = foco(i), cv = Math.sin(u * Math.PI) * (i % 2 ? -9 : 9), L = Math.hypot(B[0] - A[0], B[1] - A[1]) || 1; return [lerp(A[0], B[0], u) - (B[1] - A[1]) / L * cv, lerp(A[1], B[1], u) + (B[0] - A[0]) / L * cv]; };
  let lx = S0[0], ly = S0[1], iL = 0; for (let i = 0; i < 6; i++) { const u = ida(i); if (u > 0) { [lx, ly] = tramoL(i, u); iL = i; } }
  // el rastro de puntos que deja de una a otra
  for (let i = 1; i <= iL; i++) { const u = ida(i); for (let q = 0.1; q < Math.min(u, 0.92); q += 0.07) { const [x, y] = tramoL(i, q).map(Math.round); R.rect(x, y + 6, x + 1, y + 7, hex('#a8443a')); R.pset(x + 1, y + 8, hex('#6a5a40')); } }
  // las tres encontradas, en verde y con su marca; Roanoke y Charleston esperan en gris
  for (const [k, vx, vy] of [['chicago', -17, -4], ['cleveland', -5, -20], ['boston', 3, -19]]) { const [x, y] = en2(k); T.chincheta(R, x, y, t, VERDE); T.visto(R, x + vx, y + vy, 1); }
