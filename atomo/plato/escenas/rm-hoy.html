<canvas id="lienzo"></canvas>
<script type="module">
// RM-HOY (frase 58). Una calle de hoy: edificios, una farola y un coche que pasa. El asfalto se abre como una cremallera
// y debajo asoma la calzada romana. Luego un calendario con el «7» y el «8» resaltados, y al final una chica habla y
// en su bocadillo sale un laurel (el latín sigue en su boca).
import { preparar, rodar } from '/atomo/plato/escenas/rm-comun.js';
const { E, R, M } = await preparar('rm-hoy');
const { PALA, PR, ELENCO, tramo, lerp } = R;
const m0 = M('hoy', 0.5), dur = E.duracion ?? 14;
const tCal = m0 + (dur - m0) * 0.32, tHab = m0 + (dur - m0) * 0.62;
const calle = (t) => {
  R.cieloR(t, 'dia', { hor: 130 });
  [[0, 60, 80, PR.GRIS], [64, 50, 100, PALA.AZUL], [118, 70, 70, PALA.TERRACOTA], [192, 56, 96, PR.GRIS], [252, 70, 84, PALA.AMARILLO]].forEach(([x, w, h, rp]) => { R.rect(x, 130 - h, x + w, 130, rp[2]); R.rect(x, 130 - h, x + 1, 130, rp[3]); for (let y = 130 - h + 6; y < 124; y += 12) for (let xx = x + 6; xx < x + w - 6; xx += 12) R.rect(xx, y, xx + 6, y + 6, PR.DIA[3]); });
  R.rect(0, 130, R.W, 136, PR.GRIS[3]);
  const abre = tramo(t, m0 + 1, m0 + 3);
  for (let y = 136; y < R.H; y++) for (let x = 0; x < R.W; x++) {
    const centro = 160, ancho = abre * (40 + (y - 136) * 1.2);
    if (Math.abs(x - centro) < ancho) { const fila = Math.floor((y - 136) / 6), bx = Math.floor((x + (fila & 1) * 7) / 14); R.pset(x, y, R.tone(PR.ROCA, 2.4 + (R.hash2(bx, fila) - 0.5) + (((y - 136) % 6 === 0) || ((x + (fila & 1) * 7) % 14 === 0) ? -1.2 : 0), x, y)); }
    else R.pset(x, y, R.tone(PR.GRIS, 1 + (Math.abs(y - 156) < 1 && (x >> 3) % 2 === 0 ? 3 : 0), x, y));
  }
  const cx = lerp(-40, 360, ((t - m0) * 0.25) % 1);
  R.rect(cx - 20, 118, cx + 20, 128, PALA.ROJO[2]); R.rect(cx - 12, 110, cx + 10, 118, PALA.ROJO[2]); R.rect(cx - 9, 112, cx + 7, 117, PR.DIA[3]); R.disco(cx - 12, 129, 4, PALA.CONTORNO); R.disco(cx + 12, 129, 4, PALA.CONTORNO);
};
const calendario = (t) => {
  R.cieloR(t, 'dia', { hor: 180, nubes: { n: 3 } });
  R.rect(90, 30, 230, 150, PALA.BLANCO[3]); R.rect(90, 30, 230, 44, PALA.ROJO[2]); R.rect(88, 28, 232, 30, PALA.CONTORNO);
  for (let k = 0; k < 12; k++) { const x = 106 + (k % 4) * 32, y = 64 + Math.floor(k / 4) * 28, n = String(k + 1), on = k === 6 || k === 7; if (on && t > tCal + 1) R.rect(x - 10, y - 12, x + 12, y + 4, PALA.AMARILLO[2]); R.numero(n, x, y, { color: on ? PALA.ROJO[1] : PALA.NEGRO[1], sombra: false, centro: true }); }
  if (t > tCal + 1.4) { R.icono('laurel', 106 + 2 * 32 - 7, 104, PALA.LAUREL[1], undefined, 2); R.icono('laurel', 106 + 3 * 32 - 7, 104, PALA.LAUREL[1], undefined, 2); }
};
const habla = (t) => {
  R.cieloR(t, 'dia', { hor: 130 }); R.suelo(130, PR.GRIS, { losas: true, luz: 2.4 });
  R.personaje(130, 170, 46, { peinado: 'coleta', pelo: PALA.PELO_CASTANO, chaqueta: PALA.MORADO, camisa: PALA.BLANCO, pantalon: PALA.AZUL, botas: PALA.BLANCO, chaqueta_larga: false, t, habla: 1, pose: 'senala', sonrisa: true });
  R.personaje(200, 170, 46, { peinado: 'corto', pelo: PALA.PELO_NEGRO, piel: PALA.PIEL_OSCURA, chaqueta: PALA.VERDE, camisa: PALA.AMARILLO, pantalon: PALA.NEGRO, botas: PALA.BLANCO, chaqueta_larga: false, t, dir: -1, sonrisa: true });
  const p = tramo(t, tHab + 0.8, tHab + 1.3);
  if (p > 0) { R.disco(150, 70, Math.round(28 * p), PALA.BLANCO[3]); R.anillo(150, 70, Math.round(28 * p), PALA.CONTORNO); R.poligono([[140, 92], [146, 96], [136, 108]], PALA.BLANCO[3]); if (p >= 1) R.icono('laurel', 143, 62, PALA.LAUREL[2], undefined, 2); }
};
rodar(E, R, [[0, calle], [tCal, calendario], [tHab, habla]]);
</script>
