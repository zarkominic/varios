<script type="module">
// WO-OREJA (frases 4–5), 1956–1961, sin cartela. Siete planos, todos con acción y vida de fondo:
// 1. «a field in Ohio, near Delaware» (1956, fondo local): a ras del campo, a la tarde, el principio de la obra: la
//    zanja en perspectiva con sus encofrados y varillas, el caballón de tierra, los pórticos del plano en celosía (tres
//    enteros con sus correas, dos a medio levantar con su luz roja, dos zapatas solas), la granja con el molino que gira
//    y la camioneta por la carretera; una topadora empuja tierra al caballón y echa humo, las cintas de replanteo ondean;
//    un estudiante mira por el teodolito y a «Delaware» señala la zanja; dos obreros acarrean una chapa y la dejan en
//    los durmientes («Delaware», golpe); uno se gira a hablar y la otra señala la obra;
// 2. «between 1956 and 1961… engineer John Kraus and his students» (fondo local): LA CASETA DE OBRA POR DENTRO (la de
//    tablas del plano 3): estufa con el hervidor, estante, calendario, plano clavado, reloj, receptor, archivador. Por la
//    ventana (recortado) el curvo se va chapando con los años, el andamio se corre con sus obreros, la grúa gira y un
//    obrero cruza con una chapa sobre la cabeza; el calendario cambia de año con la barra (la hoja vieja cae). Un
//    estudiante toma café junto a la estufa; Kraus llega por fuera de la puerta, entra con el rollo y a «John Kraus» lo
//    despliega sobre la mesa de caballetes (el plano cae por el canto); a «his students» el del café va a la mesa y deja
//    la taza, y el otro entra y señala el plano;
// 3. «built a huge radio telescope… Big Ear»: el taller al pie del curvo a medio chapar (fondo local): dos estudiantes
//    remachan una chapa sobre los caballetes (chispas y golpes); el gancho de la grúa baja, a «built» la levantan entre
//    los dos y se la enganchan; la grúa la sube, balanceándose, hasta el hueco del curvo y encaja a «Big Ear» (destello);
//    Kraus deja el plano en la caja y señala; los estudiantes lo celebran;
// 4. «It didn't look like the dishes in the movies»: las antenas «de película» de hoy, con un equipo de rodaje diminuto:
//    la claqueta entra, se cierra a «movies» y todas las antenas giran a la vez, como en el cine; la claqueta se va;
// 5. «two metal walls, one flat and tilted, one curved»: el cianotipo del perfil sobre la mesa de dibujo (fondo local;
//    el papel empieza en y 46, bajo la zona de Atom; arriba, el compás, un lápiz y el rollo de planos):
//    la mano izquierda repasa el plano inclinado con el lápiz a «flat», la derecha el curvo a «curved»; vapor del café;
// 6. «an aluminum floor… bigger than three football fields… it didn't move»: la gran oreja desde el aire entre maizales
//    (fondo local), con las sombras de las nubes, los pájaros y un coche en la carretera; a «three», «football» y
//    «fields» caen tres campos de fútbol dentro del suelo de metal y sobra sitio;
// 7. «as the Earth turned, it carried the sky past… like a conveyor belt»: el esquema de la deriva: la Tierra gira y
//    el cielo pasa (o.u); por el borde de la Tierra corre una cinta de goma estriada, a la velocidad del cielo, entre
//    dos rodillos de acero con su caballete; encima viajan estrellas y una galaxia como la compra en la caja (al pasar
//    bajo el telescopio, un destello); una estrella grande va en la cinta desde el principio, llega al rodillo de la
//    derecha, se tambalea en el borde y a «conveyor belt» se cae por delante, salta por encima del reloj de arena,
//    rebota dos veces en la hierba y se queda tumbada y mareada (gag 2). La cinta pasa por detrás del reloj de arena.

import * as T from '/atomo/plato/escenas/wo-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('wo-oreja');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const C = T.C;
const H = (s) => hex(s);
const cols = (...a) => a.map(hex);
const lin = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
const suave = (v) => { v = Math.max(0, Math.min(1, v)); return v * v * (3 - 2 * v); };
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const bay = (x, y) => (BAY[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
const hs = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const mez = (a, b, k) => { let r = 0; for (const s of [0, 8, 16]) r |= Math.round(((a >>> s) & 255) * (1 - k) + ((b >>> s) & 255) * k) << s; return (r | 0xff000000) >>> 0; };
const tono = (cs, f, x, y) => cs[Math.max(0, Math.min(cs.length - 1, Math.floor(f * (cs.length - 1) + bay(x, y))))];
// la zona de Atom y la barra del año: ahí no se pinta detalle
const tranquila = (x, y) => (x >= 272 && y <= 48) || (x >= 14 && x <= 176 && y <= 22);
// lo fijo de cada plano se pinta una vez en su búfer y se copia en cada fotograma
const CAPAS = new Map();
const capa = (clave, dibuja) => { let b = CAPAS.get(clave); if (!b) { b = R.nuevo(); const prev = R.usar(b); dibuja(); R.usar(prev); CAPAS.set(clave, b); } R.copiar(b); };
// cielo tramado de arriba (y0) abajo (y1) con la rampa cs
const cieloT = (y0, y1, cs, x0 = 0, x1 = 319) => { for (let y = y0; y <= y1; y++) { const f = (y - y0) / Math.max(1, y1 - y0); for (let x = x0; x <= x1; x++) R.pset(x, y, tono(cs, f, x, y)); } };
// nube de tres tonos (cs = [luz, base, sombra]) centrada en (cx, cy), de ancho w; borde tramado; no entra en las zonas tranquilas
const BOLAS = [[0, 0, 0.5], [-0.3, 0.1, 0.32], [0.32, 0.08, 0.34], [-0.1, -0.2, 0.3], [0.16, -0.14, 0.3], [0.44, 0.16, 0.2]];
const nube = (cx, cy, w, cs, rec = null, masc = null) => {
  const h = Math.max(4, w * 0.36);
  for (let y = Math.floor(cy - h); y <= cy + h * 0.5; y++) for (let x = Math.floor(cx - w * 0.62); x <= cx + w * 0.62; x++) {
    if (x < 0 || x > 319 || tranquila(x, y)) continue;
    if (rec && (x < rec[0] || x > rec[2] || y < rec[1] || y > rec[3])) continue;
    if (masc && masc(x, y)) continue;
    let d = 9; for (const [bx, by, r] of BOLAS) { const dx = (x - (cx + bx * w)) / (r * w), dy = (y - (cy + by * w)) / (r * w * 0.7); d = Math.min(d, dx * dx + dy * dy); }
    if (d > 1 || y > cy + h * 0.45) continue; if (d > 0.8 && bay(x, y) < 0.5) continue;
    const v = (y - (cy - h)) / (h * 1.45); R.pset(x, y, y > cy + h * 0.32 ? cs[2] : tono(cs, v, x, y));
  }
};
// nubes que pasan a tres velocidades: lista de [x0, y, w, velocidad]
const nubes = (t, lista, cs, rec = null, masc = null) => { for (const [x0, y, w, v] of lista) nube(((x0 + t * v) % 420 + 420) % 420 - 50, y, w, cs, rec, masc); };
// un pájaro pequeño que aletea
const pajaro = (x, y, t, c) => { x = Math.round(x); y = Math.round(y); if (tranquila(x, y)) return; const a = Math.floor(t * 7 + x * 0.3) % 2; R.pset(x, y, c); R.pset(x - 1, y - a, c); R.pset(x + 1, y - a, c); R.pset(x - 2, y - 1 + 2 * a, c); R.pset(x + 2, y - 1 + 2 * a, c); };
// madera con vetas en tablas horizontales (cs = [oscuro, base, claro])
const madera = (x0, y0, x1, y1, cs, alto = 14, sem = 0) => {
  for (let y = y0; y <= y1; y++) { const tabla = Math.floor((y - y0) / alto), yy = (y - y0) % alto;
    for (let x = x0; x <= x1; x++) { const g = Math.sin(x * 0.06 + tabla * 3.1 + Math.sin(x * 0.017 + tabla * 1.7) * 3 + yy * 0.75 + sem);
      let c = cs[1]; if (g > 0.88) c = cs[0]; else if (g < -0.86) c = cs[2]; if (hs(x, y, sem) > 0.95) c = mez(c, cs[0], 0.5);
      if (yy === alto - 1) c = cs[0]; if (yy === 0) c = mez(c, cs[2], 0.4); R.pset(x, y, c); } }
};
// estrellas que titilan entre y0 e y1 (fuera de las zonas tranquilas y de la máscara fuera(x, y))
const estrellas = (t, n, y0, y1, sem = 0, fuera = null) => {
  for (let k = 0; k < n; k++) { const x = Math.floor(hs(k, 1, sem) * 320), y = Math.floor(y0 + hs(k, 2, sem) * (y1 - y0));
    if (tranquila(x, y) || (fuera && fuera(x, y))) continue; const b = Math.sin(t * (1.5 + hs(k, 3, sem) * 3) + k) ;
    R.pset(x, y, b > 0.6 ? H('#ffffff') : b > -0.2 ? H('#c8d4f0') : H('#7a88b8'));
    if (hs(k, 4, sem) > 0.86 && b > 0.3) { R.pset(x - 1, y, H('#8a98c8')); R.pset(x + 1, y, H('#8a98c8')); R.pset(x, y - 1, H('#8a98c8')); R.pset(x, y + 1, H('#8a98c8')); } }
};
// el vapor que sube de una taza
const vapor = (x, y, t, c = H('#f4f0e8')) => { for (let k = 0; k < 3; k++) { const u = (t * 0.6 + k / 3) % 1, xx = Math.round(x + Math.sin(u * 7 + k * 2) * 2), yy = Math.round(y - u * 14); if (u < 0.8 && bay(xx, yy) < 1 - u) { R.pset(xx, yy, c); if (u < 0.5) R.pset(xx, yy - 1, c); } } };
// una chapa de aluminio de canto (de (x0, y0) a (x1, y1), con su cara de arriba de g píxeles)
const chapa = (x0, y0, x1, y1, g = 3) => {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0)));
  for (let i = 0; i <= n; i++) { const x = Math.round(x0 + (x1 - x0) * i / n), y = Math.round(y0 + (y1 - y0) * i / n);
    R.pset(x, y - 1, C.k); R.pset(x, y, H('#f4f8fc')); for (let k = 1; k < g; k++) R.pset(x, y + k, i % 10 === 5 && k === 1 ? H('#6e7680') : k === g - 1 ? H('#8a929c') : H('#c4ccd4')); R.pset(x, y + g, C.k); }
  R.linea(x0, y0 - 1, x0, y0 + g, C.k); R.linea(x1, y1 - 1, x1, y1 + g, C.k);
};

const o1 = (f) => en('ohio', f), o2 = (f) => en('cinta', f);
const P2 = o1(0.248), P3 = o1(0.654), P4 = o1(1.06), P5 = o2(0.142), P6 = o2(0.397), P7 = o2(0.707);
const DELAWARE = o1(0.184), Y1956 = o1(0.301), Y1961 = o1(0.408), INGENIERO = o1(0.509), ESTUDIANTES = o1(0.605);
const CONSTRUYE = o1(0.732), ENORME = o1(0.779), BIGEAR = o1(0.939);
const PELIS = o2(0.051), MUROS = o2(0.170), PLANO = o2(0.250), CURVO = o2(0.341);
const TRES = o2(0.535), FUTBOL = o2(0.552), CAMPOS = o2(0.574), NOSEMUEVE = o2(0.651), CINTA = o2(0.948);

// ── 1 · 1956, a ras del campo: la zanja, las zapatas y los primeros pórticos del plano (fondo local) ─────────────
const VZ = [158, 98];                                                         // el punto de fuga de la obra
const eL = (y) => 168 + 46 * (y - 100) / 80, eR = (y) => 180 + 140 * (y - 100) / 80, eF = (y) => 178 + 112 * (y - 100) / 80;   // la zanja: borde izq., borde der. y pie de la pared iluminada
const sDe = (y) => Math.max(0.05, (y - 98) / 74);                             // escala a la altura y (1 en y 172)
const PORT = [0, 1, 2, 3, 4, 5, 6].map((k) => 1 / (1 + 0.6 * k));            // escala de cada pórtico, de cerca a lejos
const pie = (s) => [VZ[0] + (64 - VZ[0]) * s, VZ[1] + (172 - VZ[1]) * s];
const CENTINELA = 0xff030201 >>> 0;
const campoFondo = () => capa('campo1956', () => {
  // el cielo de la tarde, tramado, y el sol bajo con su halo
  cieloT(0, 98, cols('#2e2a5e', '#463a76', '#6e4686', '#a05480', '#d0706a', '#ec9460', '#f8bc70', '#fcdc98'));
  for (let y = 54; y <= 98; y++) for (let x = 92; x <= 150; x++) { const d = Math.hypot(x - 121, (y - 80) * 1.1);
    if (d < 7) R.pset(x, y, d < 5 ? H('#fffbe8') : H('#fff0b8')); else if (d < 26 && bay(x, y) < (26 - d) / 24) R.pset(x, y, mez(R.pget(x, y), H('#ffe6a0'), 0.45)); }
  // las lomas y la arboleda lejanas, malvas a contraluz
  for (let x = 0; x < 320; x++) { const h = Math.round(5 + 2.5 * Math.sin(x * 0.05) + 1.5 * Math.sin(x * 0.19 + 2) + (hs(x >> 2, 1) > 0.6 ? 3 : 0) * (x < 180 ? 1 : 0.4));
    for (let y = 98 - h; y <= 98; y++) R.pset(x, y, tono(cols('#8a6a8e', '#76608a', '#62567c', '#58506e'), (y - 98 + h) / (h + 1), x, y)); }
  // la granja a la derecha: la casa, el granero rojo con su tejado quebrado y el silo; los árboles
  for (const [x, y, r] of [[214, 90, 6], [222, 88, 7], [280, 90, 6], [290, 92, 5]]) { R.disco(x, y, r, H('#4e4462')); R.disco(x - 1, y - 1, r - 2, H('#5e5272')); }
  R.rect(226, 86, 238, 98, H('#c8a888')); R.rect(226, 86, 227, 98, H('#f0c8a0')); R.poligono([[224, 87], [232, 80], [240, 87]], H('#5a3a4a')); R.rect(230, 90, 232, 93, H('#ffd890')); R.rect(234, 91, 235, 98, H('#6a4a3a'));
  R.poligono([[244, 98], [244, 86], [248, 80], [258, 80], [262, 86], [262, 98]], H('#a83a32')); R.linea(244, 86, 248, 80, H('#e87a5a')); R.linea(244, 86, 244, 98, H('#e86a4a')); R.linea(248, 80, 258, 80, H('#5a2a2a'));
  R.rect(250, 89, 256, 98, H('#5a1e1e')); R.linea(250, 89, 256, 98, H('#e8d8c8')); R.linea(256, 89, 250, 98, H('#e8d8c8')); R.rect(251, 83, 255, 85, H('#e8d8c8'));
  R.rect(265, 70, 271, 98, H('#9a8a9a')); R.rect(265, 70, 266, 98, H('#e8c0a0')); R.disco(268, 70, 3, H('#8a7a8a')); R.pset(267, 68, H('#f0d0b0')); for (let y = 74; y < 98; y += 4) R.linea(266, y, 271, y, H('#7a6a7a'));
  // la carretera del horizonte con sus postes y el cable
  R.rect(0, 99, 319, 99, H('#d8a878')); R.rect(0, 100, 319, 100, H('#9a6a52'));
  for (let x = 176; x < 320; x += 24) { R.linea(x, 88, x, 99, H('#4a3a4a')); R.linea(x - 2, 89, x + 2, 89, H('#4a3a4a')); if (x + 24 < 320) for (let i = 0; i <= 24; i++) R.pset(x + i, 89 + Math.round(Math.sin(i / 24 * Math.PI) * 2), H('#3a2e3e')); }
  // el suelo: rastrojo lejano con surcos hacia la fuga y, cerca, la tierra raspada de la obra, con la luz baja de la izquierda
  for (let y = 101; y < 180; y++) for (let x = 0; x < 320; x++) { const v = (y - 98) / 82, ax = (x - VZ[0]) / (y - VZ[1] + 0.5);
    const lejos = v < 0.22 + (hs(x >> 3, y >> 2, 3) - 0.5) * 0.1;
    let c = lejos ? tono(cols('#c8a050', '#a88a46', '#8a7a40'), v * 3 + (hs(x, y, 1) - 0.5) * 0.3, x, y) : tono(cols('#d0905c', '#b07a4e', '#9a6842', '#845838', '#6e4a30'), (v - 0.2) * 1.2 + (hs(x >> 1, y >> 1, 4) - 0.5) * 0.35, x, y);
    if ((Math.floor(ax * 6 + 100)) % 2) c = mez(c, H('#3a2418'), 0.12);
    c = mez(c, H('#ffb070'), 0.16 * Math.max(0, 1 - x / 260));
    if (hs(x, y, 5) > 0.975) c = mez(c, H('#f8d0a0'), 0.6); else if (hs(x, y, 6) > 0.985) c = H('#4a3020');
    R.pset(x, y, c); }
  // las rodadas de los camiones, que se van hacia la fuga, y un charco con el cielo
  for (const [x0, k] of [[86, 0], [100, 1], [122, 0], [136, 1]]) R.linea(x0, 179, 150, 101, k ? H('#c89a6a') : H('#5a3a26'));
  for (let y = 150; y < 156; y++) for (let x = 108; x < 136; x++) if (((x - 122) / 14) ** 2 + ((y - 153) / 3) ** 2 < 1) R.pset(x, y, tono(cols('#fde0a0', '#f0a070', '#a06080'), (y - 150) / 6, x, y));
  // la zanja: el fondo en sombra y la pared de la derecha encendida, con sus estratos y piedras
  for (let y = 101; y < 180; y++) { const xl = Math.round(eL(y)), xf = Math.round(eF(y)), xr = Math.round(eR(y));
    for (let x = xl; x <= Math.min(319, xr); x++) { let c;
      if (x < xf) c = tono(cols('#5a3424', '#46281c', '#341c14'), (x - xl) / Math.max(1, xf - xl) * 0.6 + (hs(x, y, 7) - 0.5) * 0.3, x, y);
      else { c = tono(cols('#e89a62', '#c87a4e', '#a8603e', '#8a4e34'), (x - xf) / Math.max(1, xr - xf) + (hs(x >> 1, y, 8) - 0.5) * 0.2, x, y);
        if ((y + Math.round((x - xf) * 0.5)) % 6 === 0) c = mez(c, H('#6a3a24'), 0.4); if (hs(x, y, 9) > 0.97) c = H('#f8c890'); }
      R.pset(x, y, c); }
    R.pset(xl, y, H('#f0c088')); R.pset(xl - 1, y, H('#5a3a26')); }
  // los encofrados de madera en el fondo de la zanja, con las varillas que asoman
  for (const yy of [174, 150, 133, 121, 112, 106]) { const s = sDe(yy), x0 = Math.round(eL(yy) + 3 * s), x1 = Math.round(x0 + (eF(yy) - eL(yy)) * 0.75), h = Math.max(2, Math.round(7 * s));
    R.rect(x0, yy - h, x1, yy, C.k); R.rect(x0 + 1, yy - h + 1, x1 - 1, yy - 1, H('#c89a5a')); R.rect(x0 + 1, yy - h + 1, x1 - 1, yy - h + 1, H('#f0c080'));
    if (h > 3) R.rect(x0 + 1, yy - 1, x1 - 1, yy - 1, H('#8a5a30'));
    for (let x = x0 + 2; x < x1 - 1; x += Math.max(2, Math.round(6 * s))) R.linea(x, yy - h, x, yy - h - Math.max(1, Math.round(5 * s)), H('#8a4a3a')); }
  // el caballón de tierra sacada a la derecha de la zanja, con terrones
  R.poligono([[180, 101], [320, 181], [320, 150], [190, 95]], CENTINELA);
  for (let y = 94; y < 180; y++) for (let x = 178; x < 320; x++) if (R.pget(x, y) === CENTINELA) {
    const top = 95 + (x - 190) * 55 / 130, f = Math.max(0, Math.min(1, (y - top) / Math.max(2, eR(y) - x + 10)));
    let c = tono(cols('#f0a86a', '#d08a56', '#b06e44', '#8a5434'), 0.25 + f * 0.25 + (x - 180) / 400 + (hs(x >> 1, y >> 1, 11) - 0.5) * 0.3, x, y);
    if (hs(x, y, 12) > 0.94) { c = H('#f8c08a'); } else if (hs(x, y - 1, 12) > 0.94) c = H('#6a4028');
    R.pset(x, y, c); }
  for (let x = 190; x < 320; x++) { const y = Math.round(95 + (x - 190) * 55 / 130); R.pset(x, y, H('#ffd0a0')); }
  // su forma: los escalones de tierra que se han corrido, piedras con su sombra, matas en la cresta y una pala clavada
  for (const d of [6, 13, 22, 33]) for (let x = 186; x < 320; x++) { const y = Math.round(95 + (x - 190) * 55 / 130 + d * (0.4 + (x - 186) / 200) + Math.sin(x * 0.15 + d) * 1.5); if (R.pget(x, y) !== 0 && y > 96 && y < 180 && x > eR(y) + 1) { R.pset(x, y, H('#7a4a30')); R.pset(x, y - 1, H('#f8c48e')); } }

  // las sombras de las nubes que pasan por encima (más oscuras, tramadas)
  for (const [x0, y0, w, v] of [[-60, 40, 60, 11], [120, 110, 46, 8]]) { const cx2 = ((x0 + (t - P6) * v) % 440) - 60, cy2 = y0 + (t - P6) * v * 0.3;
    for (let y = Math.round(cy2 - w * 0.3); y <= cy2 + w * 0.3; y++) for (let x = Math.round(cx2 - w / 2); x <= cx2 + w / 2; x++) { if (x < 0 || x > 319 || y < 23 || y > 179) continue; const d = ((x - cx2) / (w / 2)) ** 2 + ((y - cy2) / (w * 0.3)) ** 2; if (d > 1 || (d > 0.7 && bay(x, y) > 0.5)) continue; R.pset(x, y, mez(R.pget(x, y), H('#0a1a10'), 0.22)); } }
  // los pájaros que cruzan por debajo de la cámara
  for (let k = 0; k < 4; k++) { const x = ((t - P6) * (22 + k * 4) + k * 26) % 360 - 20, y = 150 - k * 6 - (t - P6) * 3; const a = Math.floor(t * 6 + k) % 2; R.pset(Math.round(x), Math.round(y), H('#1e1a20')); R.pset(Math.round(x) - 1, Math.round(y) - 1 - a, H('#1e1a20')); R.pset(Math.round(x) + 1, Math.round(y) - 1 - a, H('#1e1a20')); R.pset(Math.round(x) - 2, Math.round(y) - 1 - a, H('#3a3438')); R.pset(Math.round(x) + 2, Math.round(y) - 1 - a, H('#3a3438')); }
};

// ── 7 · la Tierra gira y el cielo pasa como una cinta; una estrella se cae ──────────────────────────────────────
// la cinta corre por el borde de la Tierra (unos px por debajo del horizonte, para no pisar el telescopio del
// decorado), a la misma velocidad que el cielo (o.u · 240 px); dos rodillos de acero con su caballete en los extremos
const limbo = (x) => 107 + 31 * ((x - 160) / 160) ** 2;
const VCINTA = 240;
const rodillo = (x, y, t, off) => {
  // el caballete: dos patas de hierro clavadas en la hierba, con su travesaño y sus tornillos
  for (const d of [-5, 5]) { R.linea(x, y, x + d, 176, C.k); R.linea(x + 1, y, x + d + 1, 176, H('#5a626c')); }
  R.rect(x - 4, 166, x + 5, 167, H('#4a525c')); R.pset(x - 3, 166, H('#a8b0b8')); R.pset(x + 4, 166, H('#a8b0b8'));
  R.disco(x, y, 9, C.k); R.disco(x, y, 8, H('#5a626c')); R.disco(x, y, 7, H('#8a929c')); R.disco(x - 1, y - 1, 5, H('#a8b0b8'));
  for (let k = 0; k < 4; k++) { const a = off / 7 + k * Math.PI / 2; R.linea(x, y, Math.round(x + Math.cos(a) * 6), Math.round(y + Math.sin(a) * 6), H('#4a525c')); }
  R.disco(x, y, 2, H('#dce2e8')); R.pset(x, y, C.k); R.pset(x - 4, y - 5, H('#ffffff')); R.pset(x - 3, y - 6, H('#ffffff'));
};
// una estrella de cinco puntas (7 × 7) con su filo; e = 0–1 de estirada (se aplasta al rebotar)
const ESTR = ['...#...', '...#...', '.#####.', '#######', '.#####.', '.##.##.', '##...##'];
const estrella = (x, y, c1, c2, aplasta = 0, s = 1) => { x = Math.round(x); y = Math.round(y);
  ESTR.forEach((fl, j) => { for (let i = 0; i < 7; i++) if (fl[i] === '#') { const borde = j === 0 || i === 0 || i === 6 || j === 6 || ESTR[j - 1]?.[i] !== '#' || (s > 1 && (ESTR[j + 1]?.[i] !== '#' || fl[i - 1] !== '#' || fl[i + 1] !== '#'));
    const yy = aplasta ? y - 7 * s + 1 + Math.round(j * s * 0.7) + 2 * s : y - 7 * s + 1 + j * s, xx = x - 3 * s - (s > 1 ? 0 : 0) + i * s + (aplasta && i > 3 ? s : aplasta && i < 3 ? -s : 0);
    for (let a = 0; a < s; a++) for (let b = 0; b < (aplasta ? Math.max(1, s - 1) : s); b++) if (!detras(xx + a, yy + b)) R.pset(xx + a, yy + b, borde ? c2 : c1); } }); };
// el reloj de arena del decorado va delante de la cinta: lo que pasa por detrás de él no se pinta
const detras = (x, y) => x >= 276 && x <= 297 && y >= 127 && y <= 156;
const p7 = (t) => {
  const u = lin(t, P7, 35.6), off = u * VCINTA, o = { encuadre: 'cinta', u, cinta: true };
  T.oreja(R, t, o);
  // EL GAG: una estrella grande va en la cinta desde el principio; llega al rodillo, se tambalea en el borde y en
  // «conveyor belt» se cae por delante, rebota dos veces en la hierba y se queda tumbada y mareada
  const LLEGA = CINTA - 0.2, X0 = 304 - (LLEGA - P7) * VCINTA / (35.6 - P7);
  let x, y, aplasta = 0, mareo = false;
  if (t < LLEGA) { x = X0 + (t - P7) * VCINTA / (35.6 - P7); y = limbo(x) + 2; }
  else if (t < CINTA + 0.15) { x = 304 + Math.sin((t - LLEGA) * 30) * 1.5; y = limbo(304) + 2 - Math.abs(Math.sin((t - LLEGA) * 15)); }
  else { const g = t - CINTA - 0.15;
    if (g < 0.4) { const q = g / 0.4; x = lerp(304, 262, q); y = lerp(limbo(304) + 2, 152, q * q) - Math.sin(q * Math.PI) * 22; }
    else if (g < 0.7) { const q = (g - 0.4) / 0.3; x = lerp(262, 248, q); y = lerp(152, 158, q) - Math.sin(q * Math.PI) * 9; aplasta = q < 0.15 ? 1 : 0; }
    else if (g < 0.9) { const q = (g - 0.7) / 0.2; x = lerp(248, 240, q); y = lerp(158, 161, q) - Math.sin(q * Math.PI) * 3; aplasta = q < 0.2 ? 1 : 0; }
    else { x = 240; y = 161; mareo = true; aplasta = g < 1.0 ? 1 : 0; } }
  if (x > 20) {
    if (t > CINTA + 0.15 && t < CINTA + 0.55) for (let k = 1; k < 6; k++) { const q = Math.max(0, (t - CINTA - 0.15 - k * 0.025) / 0.4); R.pset(Math.round(lerp(304, 262, q)), Math.round(lerp(limbo(304) + 2, 152, q * q) - Math.sin(q * Math.PI) * 22) - 6, H('#e8c860')); }
    if (y > limbo(x) + 8) { R.linea(Math.round(x) - 6, 162, Math.round(x) + 6, 162, mez(H('#1a3a1a'), C.k, 0.3)); }   // su sombra en la hierba
    estrella(x, y, H('#fff4a0'), H('#e8a020'), aplasta, 2); R.pset(Math.round(x) - 2, Math.round(y) - 7, H('#ffffff')); R.pset(Math.round(x) - 1, Math.round(y) - 7, H('#ffffff'));
    const choque = (t > CINTA + 0.55 && t < CINTA + 0.65) || (t > CINTA + 0.85 && t < CINTA + 0.92);
    if (choque) for (let r = 0; r < 8; r++) { const a = r * Math.PI / 4; R.pset(Math.round(x + Math.cos(a) * 11), Math.round(y - 6 + Math.sin(a) * 8), H('#ffffff')); }
    if (mareo) for (let k = 0; k < 3; k++) { const a = t * 5 + k * 2.09; R.pset(Math.round(x + Math.cos(a) * 8), Math.round(y - 17 + Math.sin(a) * 2), H(k ? '#fff4a0' : '#ffffff')); }
  }
};

T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3], [P4, p4], [P5, p5], [P6, p6], [P7, p7]], {
  año: (t) => t < P2 ? 1956 : t < BIGEAR ? Math.round(lerp(1956, 1961, lin(t, Y1956, BIGEAR))) : 1961,
  efectos: [[DELAWARE, 'golpecito'], [INGENIERO + 0.5, 'papel'], [P3 + 0.3, 'toc'], [CONSTRUYE - 0.6, 'toc'], [BIGEAR - 0.1, 'brillo'],
    [PELIS - 0.05, 'palmada'], [PELIS + 0.2, 'motor'], [PLANO, 'lapiz'], [CURVO, 'lapiz'], [TRES, 'pop'], [CAMPOS, 'pop'], [CINTA + 0.55, 'boing'], [CINTA + 0.86, 'toc']],
});
</script>
