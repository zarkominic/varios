<script type="module">
// HP-BINNS (frase 18), 1991, sin cartela. Tres planos:
// 1. el pasillo ante la puerta del aula de Historia (decorado propio, no el aula): la campana de latón sobre la puerta
//    suena y amaina; en «classes begin» Harry cruza el umbral y entra, Ron se para a mirar, una alumna entra desde la
//    derecha y Hermione llega al caballete del horario (luna 9, caldero 10, varita 11, reloj de arena); la tiza blanca sale
//    de la repisa y dibuja un rollo de película en la fila del reloj de arena, Hermione la señala en «never appears», y la
//    tiza roja la tacha con una X en «in the movies»; la lechuza se posa en el alféizar y se va al tachar; la armadura
//    vuelve el yelmo, la señora Norris se sienta en su peana, el mago del retrato saluda y Neville llega tarde con su sapo;
// 2. la sala común junto al fuego, «Professor Binns»: el viejo profesor lee en la butaca con su manta y pasa la página;
//    una alumna baja por la escalera de caracol y se para junto al ajedrez (que juega solo); un tronco chasca (chispas y
//    una brasa que salta; él da un respingo); él se duerme en «fell asleep»
//    (el libro cae sobre la manta, zetas, la alumna sonríe), el fuego chisporrotea en «fire» y en «got up» su fantasma se
//    levanta y lo deja durmiendo (la alumna se asusta);
// 3. el aula polvorienta de Binns, desde el lado del atril (decorado propio): chimenea apagada con brasas, retrato que
//    dormita, el gran pergamino de la línea del tiempo (1289, 1612, 1689, 1750), ventana sucia con su haz de polvo,
//    vitrina empolvada, telarañas y una araña; el fantasma sale de la pared de la chimenea (neblina fría) en «without his
//    body», flota hasta el atril y da clase en «kept teaching» mientras cada fecha se ilumina; todos los alumnos, a la
//    derecha, dan cabezadas y se duermen uno a uno salvo Hermione, que toma apuntes; un ratón cruza el suelo.
import * as T from '/atomo/plato/escenas/hp-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hp-binns');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const b = (f) => en('binns', f);
const P2 = b(0.339), P3 = b(0.806);
const BEGIN = b(0.064), NEVER = b(0.190), MOVIES = b(0.283), PROF = b(0.461), ASLEEP = b(0.627), FIRE = b(0.695), GOT = b(0.782), TEACH = b(0.921);
const PZ = T.PIEZAS_HP, K = hex('#1a1424'), TIZA = hex('#f0f4e8');
const zeta = (x, y, c, e = 1) => { x = Math.round(x); y = Math.round(y); for (const [d, col] of [[1, K], [0, c]]) { R.rect(x + d, y + d, x + d + 3 * e, y + d + e - 1, col); R.rect(x + d + 2 * e, y + d + e, x + d + 3 * e - 1, y + d + 2 * e - 1, col); R.rect(x + d + e, y + d + 2 * e, x + d + 2 * e - 1, y + d + 3 * e - 1, col); R.rect(x + d, y + d + 3 * e, x + d + 3 * e, y + d + 4 * e - 1, col); } };
const zetas = (x, y, t0, t, n = 2) => { if (t < t0) return; for (let i = 0; i < n; i++) { const u = ((t - t0) * 0.7 + i / n) % 1; if (t - t0 > i * 0.5) zeta(x + u * 8 + Math.sin(u * 6) * 2, y - u * 16, hex('#b8d0f8'), u > 0.5 ? 2 : 1); } };
// una línea de tiza que se dibuja hasta la fracción u (2 px, con su polvo)
const mez = (c, d, a) => { const ch = (k) => Math.round(((c >>> k) & 255) * (1 - a) + ((d >>> k) & 255) * a); return ((255 << 24) | (ch(16) << 16) | (ch(8) << 8) | ch(0)) >>> 0; };
const halo = (cx, cy, r, a = 0.3) => { for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) { const d = Math.hypot(x - cx, (y - cy) * 0.8) / r; if (d < 1) { const p = R.pget(x, y); if (p) R.pset(x, y, mez(p, hex('#d8f0ff'), a * (1 - d))); } } };
const tiza = (x0, y0, x1, y1, u) => { if (u <= 0) return; const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0)); for (let i = 0; i <= n * Math.min(1, u); i++) { const x = Math.round(x0 + (x1 - x0) * i / n), y = Math.round(y0 + (y1 - y0) * i / n); R.pset(x, y, TIZA); if ((i * 7) % 5 < 3) R.pset(x + 1, y, hex('#c8d4c0')); } };

// lo que pinta una pieza de PIEZAS_HP (con R.rect) queda dentro de box = [x0, y0, x1, y1]
const enRecorte = (box, fn) => {
  const r0 = R.rect;
  R.rect = (a, b2, c, d, col) => { const x0 = Math.max(Math.min(a, c), box[0]), y0 = Math.max(Math.min(b2, d), box[1]), x1 = Math.min(Math.max(a, c), box[2]), y1 = Math.min(Math.max(b2, d), box[3]); if (x0 <= x1 && y0 <= y1) r0(x0, y0, x1, y1, col); };
  try { fn(); } finally { R.rect = r0; }
};

// ── utilidades para los dos decorados propios de esta escena (el pasillo del plano 1 y el aula de Binns del 3) ─────────
const HP = Object.fromEntries(Object.entries({
  pieJ: '#2a2832', pie: '#6a6672', pieL: '#87838e', pieS: '#524e5a', pieD: '#3a3744',
  caJ: '#3a2e28', ca: '#8a7666', caL: '#a8927e', caS: '#6c5a4e', caD: '#4c3e36',
  mad: '#6a3e22', madL: '#8c5634', madS: '#4a2a16', madD: '#2c180c', madV: '#5a321a',
  oro: '#d4a438', oroL: '#f6dc7a', oroS: '#9a6a1c', oroD: '#5a3a0e',
  cera: '#f4ecd2', ceraS: '#c8b892', llama: '#ffe27a', llamaL: '#fffbe2', fuego: '#ff9a2a', fuegoS: '#d8521a', glow: '#f0b860',
  hie: '#26242c', hieL: '#4c4a56', piz: '#283a32', pizL: '#34483e', pizS: '#1e2c26', tizaS: '#9aa69c', blanco: '#ffffff',
}).map(([k, v]) => [k, hex(v)]));
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], bay = (x, y) => (BAY[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
const rampa = (cols, v, x, y) => { const n = cols.length - 1, f = Math.max(0, Math.min(n, v * n)), i = Math.floor(f); return cols[Math.min(n, i + (f - i > bay(x, y) ? 1 : 0))]; };
const tinte = (x, y, col, a) => { const p = R.pget(x, y); if (p) R.pset(x, y, mez(p, col, a)); };
// brillo tramado alrededor de (cx, cy): mezcla lo que hay con col, más cuanto más cerca
const brillo = (cx, cy, r, col, a = 0.35) => { for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++) { const g = 1 - Math.hypot(x + 0.5 - cx, y + 0.5 - cy) / r; if (g > 0) tinte(x, y, col, g > bay(x, y) ? a * g + 0.04 : a * g * 0.45); } };
// muro de sillares a matajunta con canto de luz, sombra, motas, grietas y verdín (P = [junta, base, luz, sombra, oscuro])
const piedra = (x0, y0, x1, y1, P, k = 0, bw = 16, bh = 8, musgo = null) => {
  const [cJ, c, cL, cS, cD] = P, { rect, pset } = R; rect(x0, y0, x1, y1, cJ);
  for (let f = 0, y = y0 - Math.round(hh(k, 3, 409) * (bh - 2)); y <= y1; f++, y += bh) {
    let x = x0 - Math.round(hh(f, 1, 400 + k) * bw);
    while (x <= x1) {
      const w = Math.max(5, Math.round(bw * (0.65 + hh(x, f, 401 + k) * 0.7)));
      const xa = Math.max(x0, x + 1), xb = Math.min(x1, x + w - 1), ya = Math.max(y0, y + 1), yb = Math.min(y1, y + bh - 1);
      if (xb >= xa && yb >= ya) {
        const v = hh(x, f, 402 + k), base = v < 0.22 ? cS : v > 0.86 ? cL : c, luz = base === cL ? mez(cL, HP.blanco, 0.16) : cL, som = base === cS ? cD : cS;
        rect(xa, ya, xb, yb, base);
        if (ya === y + 1) rect(xa, ya, xb - 1, ya, luz);
        if (xa === x + 1) rect(xa, ya, xa, yb - 1, luz);
        if (yb === y + bh - 1) rect(xa + 1, yb, xb, yb, som);
        if (xb === x + w - 1) rect(xb, ya + 1, xb, yb, som);
        const n = Math.round((xb - xa + 1) * (yb - ya + 1) / 9);
        for (let i = 0; i < n; i++) pset(xa + 1 + Math.floor(hh(x + i, f, 403 + k) * Math.max(1, xb - xa - 1)), ya + 1 + Math.floor(hh(x - i, f, 404 + k) * Math.max(1, yb - ya - 1)), hh(i, x, 405 + k) < 0.62 ? som : luz);
        if (hh(x, f, 406 + k) < 0.1 && xb - xa > 6) { let gx = xa + 2 + Math.floor(hh(f, x, 407 + k) * (xb - xa - 4)); for (let gy = ya + 1; gy < yb; gy++) { pset(gx, gy, cD); if (hh(gx, gy, 408 + k) < 0.4) gx += hh(gy, gx, 409) < 0.5 ? -1 : 1; } }
        if (musgo && yb === y + bh - 1 && hh(x, f, 410 + k) < 0.22) for (let i = xa; i <= xb; i++) if (hh(i, f, 411 + k) < 0.5) pset(i, yb - (hh(i, f, 412) < 0.3 ? 1 : 0), musgo);
      }
      x += w;
    }
  }
};
// suelo en perspectiva hacia (vx, vy): 'losa' (losas a matajunta) o 'tabla' (tablas hacia el fondo con vetas); lo lejano se oscurece
const suelo = (x0, y0, x1, y1, vx, vy, W, tipo, P, k = 0, osc = 0.4) => {
  const [cJ, c, cL, cS, cD] = P, F = 180 - vy, losa = tipo === 'losa', NF = losa ? 6 : 2.2, fila = (y) => Math.floor(F / (y - vy) * NF);
  for (let y = y0; y <= y1; y++) {
    const s = (y - vy) / F, fi = fila(y), fiA = fila(y - 1), fiB = fila(y + 1), dk = osc * (1 - (y - y0) / (y1 - y0 + 1)) ** 1.5;
    for (let x = x0; x <= x1; x++) {
      const off = losa ? (fi & 1) * 0.5 : 0, cc = (x - vx) / (s * W) + off, ci = Math.floor(cc), ff = losa ? fi : Math.floor(F / (y - vy) * NF + hh(ci, 0, 430 + k) * 3);
      const ciR = Math.floor((x + 1 - vx) / (s * W) + off), ciL = Math.floor((x - 1 - vx) / (s * W) + off);
      let col;
      if (ciR !== ci) col = cD;
      else if (losa ? fiB !== fi : Math.floor(F / (y + 1 - vy) * NF + hh(ci, 0, 430 + k) * 3) !== ff) col = cJ;
      else {
        const v = hh(ci, ff, 420 + k); col = v < 0.25 ? cS : v > 0.84 ? cL : c;
        if ((losa ? fiA !== fi : Math.floor(F / (y - 1 - vy) * NF + hh(ci, 0, 430 + k) * 3) !== ff) || ciL !== ci) col = col === cL ? mez(cL, HP.blanco, 0.15) : cL;
        else if (losa) { const m = hh(x, y, 421 + k); if (m < 0.06) col = cS; else if (m > 0.985) col = cL; }
        else { const fp = cc - ci; if (Math.abs(Math.sin(fp * 11 + hh(ci, ff, 422 + k) * 6 + (1 / s) * 1.3)) < 0.1) col = cS; else if (hh(x, y, 423 + k) < 0.03) col = cD; }
      }
      R.pset(x, y, dk > 0.02 ? mez(col, cJ, dk) : col);
    }
  }
};
// ventana ojival: derrame de piedra, el cristal que pinta fc(x, y), parteluz y emplomado en rombos; devuelve dentro(x, y)
// (y .vidrio(x, y): el cristal sin plomos, para las nubes que pasan)
const ojiva = (x0, y0, x1, y1, fc, marco = [HP.pieL, HP.pieS, HP.pieD], rombo = 4) => {
  const w = x1 - x0, cx = (x0 + x1) / 2, aH = Math.min(w * 0.75, (y1 - y0) * 0.5);
  const dentro = (x, y, m = 0) => { if (x < x0 + m || x > x1 - m || y > y1 - m) return false; const q = (Math.abs(x - cx) + w * 0.25) / (w * 0.75 - m * 0.8); return q <= 1 && y >= y0 + m + aH * (1 - Math.sqrt(Math.max(0, 1 - q * q))); };
  const que = (x, y) => (Math.abs(x - cx) < 1 ? 1 : Math.abs(x - cx) < 1.6 ? 2 : y === Math.round(y0 + aH + 2) ? 2 : ((x - x0 + y) % rombo === 0) || ((x - x0 - y + 400) % rombo === 0) ? 3 : 0);
  for (let y = y0 - 3; y <= y1 + 3; y++) for (let x = x0 - 3; x <= x1 + 3; x++) {
    if (dentro(x, y, 2)) { const q = que(x, y), c = fc(x, y); R.pset(x, y, q === 1 ? marco[0] : q === 2 ? marco[1] : q === 3 ? mez(c, hex('#141018'), 0.6) : c); }
    else if (dentro(x, y, 0)) R.pset(x, y, x < cx ? marco[1] : marco[2]);
    else if (dentro(x + 1, y + 1, -2) || dentro(x - 1, y + 1, -2)) R.pset(x, y, y > y1 ? marco[1] : marco[0]);
  }
  const f = (x, y) => dentro(x, y, 2); f.vidrio = (x, y) => dentro(x, y, 2) && que(x, y) === 0; return f;
};
// antorcha de pared: soporte de hierro, tea y llama que baila con su brillo
const antorcha = (x, y, t, k) => {
  const f = hh(k, Math.floor(t * 10), 78), g = hh(k, Math.floor(t * 7) + 3, 79);
  brillo(x + 0.5, y - 5, 15, HP.glow, 0.26 + 0.04 * Math.sin(t * 8 + k));
  R.rect(x - 1, y, x + 1, y + 7, K); R.pset(x, y + 1, HP.madL); R.rect(x, y + 2, x, y + 6, HP.mad);
  R.rect(x - 2, y + 5, x + 2, y + 6, HP.hieL); R.rect(x - 1, y + 7, x + 1, y + 9, HP.hie); R.rect(x - 3, y + 9, x + 3, y + 10, HP.hie);
  const hg = Math.round(4 + f * 3), sx = g > 0.5 ? 1 : 0;
  for (let j = 0; j < hg; j++) { const w = Math.round((1 - j / hg) * 1.6); for (let i = -w; i <= w; i++) R.pset(x + i + (j > hg * 0.6 ? sx : 0), y - 1 - j, j < hg * 0.35 && Math.abs(i) < w ? HP.llamaL : j < hg * 0.6 ? HP.llama : HP.fuego); }
  if (f > 0.7) R.pset(x + sx * 2 - 1, y - hg - 2, HP.fuegoS);
};
// nube de tres tonos con la panza plana, solo donde mask(x, y)
const nube = (cx, cy, w, cols, mask) => {
  const r = Math.max(2, w * 0.28), B = [[-w * 0.36, 1.2, r * 0.72], [-w * 0.1, -0.8, r], [w * 0.2, 0, r * 0.88], [w * 0.4, 1.3, r * 0.6]], fondo = cy + r * 0.75;
  const disco = (ox, oy, rr, fc) => { for (let y = Math.floor(oy - rr); y <= oy + rr; y++) for (let x = Math.floor(ox - rr); x <= ox + rr; x++) { const d = Math.hypot(x + 0.5 - ox, y + 0.5 - oy); if (d <= rr && y <= fondo && mask(x, y)) R.pset(x, y, fc(x, y, d / rr)); } };
  for (const [dx, dy, rr] of B) disco(cx + dx, cy + dy + 1, rr, () => cols[2]);
  for (const [dx, dy, rr] of B) disco(cx + dx - 0.5, cy + dy - 0.5, rr * 0.86, (x, y) => (y > fondo - 1.5 && (x + y) & 1 ? cols[2] : cols[1]));
  for (const [dx, dy, rr] of B) disco(cx + dx - 1.2, cy + dy - 1.6, rr * 0.5, (x, y, d) => (d > 0.7 && (x + y) & 1 ? cols[1] : cols[0]));
};
// un cuarterón de madera: marco con luz arriba y a la izquierda, sombra abajo y a la derecha, y vetas
const cuarteron = (x0, y0, x1, y1, k) => {
  R.rect(x0, y0, x1, y1, HP.madS); R.rect(x0 + 1, y0 + 1, x1 - 1, y1 - 1, HP.mad); R.rect(x0 + 1, y0 + 1, x1 - 1, y0 + 1, HP.madL); R.rect(x0 + 1, y0 + 1, x0 + 1, y1 - 1, HP.madL);
  R.rect(x0 + 2, y1 - 1, x1 - 1, y1 - 1, HP.madD); R.rect(x1 - 1, y0 + 2, x1 - 1, y1 - 1, HP.madD);
  for (let x = x0 + 3; x < x1 - 2; x += 3) for (let y = y0 + 3; y < y1 - 2; y++) if (hh(x, y >> 2, 450 + k) < 0.45) R.pset(x + (hh(x, y, 451 + k) < 0.3 ? 1 : 0), y, HP.madV);
};
// la telaraña de una esquina (dx, dy: hacia dónde se abre)
const telarana = (x, y, dx, dy, r = 12, c = hex('#b8b8c0')) => {
  for (let i = 0; i < 4; i++) { const a = i / 3 * Math.PI / 2; R.linea(x, y, Math.round(x + Math.cos(a) * r * dx), Math.round(y + Math.sin(a) * r * dy), c); }
  for (let k = 1; k <= 3; k++) { const rr = r * k / 3.5; for (let i = 0; i < 3; i++) { const a = i / 3 * Math.PI / 2, b2 = (i + 1) / 3 * Math.PI / 2; R.linea(Math.round(x + Math.cos(a) * rr * dx), Math.round(y + Math.sin(a) * rr * dy), Math.round(x + Math.cos(b2) * rr * 0.9 * dx), Math.round(y + Math.sin(b2) * rr * 0.9 * dy), c); } }
};
// el fondo fijo de cada decorado propio: se pinta una vez en su búfer y en cada fotograma se copia entero
const capas = new Map();
const fijo = (clave, pinta) => { let bf = capas.get(clave); if (!bf) { bf = R.nuevo(); const prev = R.usar(bf); pinta(); R.recorte(null); R.usar(prev); capas.set(clave, bf); } R.copiar(bf); };
// un reloj de arena de tiza (o de tinta) de alto 2·a
const relojArena = (x, y, a, c) => { R.linea(x - a, y - a, x + a, y - a, c); R.linea(x - a, y + a, x + a, y + a, c); R.linea(x - a + 1, y - a, x + a - 1, y + a, c); R.linea(x + a - 1, y - a, x - a + 1, y + a, c); R.pset(x, y + a - 1, c); R.pset(x - 1, y + a - 1, c); R.pset(x + 1, y + a - 1, c); };

// 1 · el pasillo, ante la puerta del aula de Historia: suena la campana, entran los alumnos y la tiza del caballete
//     dibuja una película y la tacha
const PU = { x0: 118, x1: 170, cx: 144, cy: 70, r: 26, suelo: 128 };   // el hueco de la puerta: arco de medio punto
const enHueco = (x, y) => x >= PU.x0 && x <= PU.x1 && y <= PU.suelo && (y >= PU.cy || Math.hypot(x - PU.cx, y - PU.cy) <= PU.r);
let VEN1 = null;
const fondoPasillo = () => {
  const { rect, pset, linea } = R;
  // la bóveda de piedra oscura con los nervios y la cornisa con sus dentículos
  piedra(0, 0, 319, 19, [HP.pieJ, hex('#3e3a48'), hex('#4a4654'), hex('#34313e'), HP.pieJ], 31, 13, 6);
  for (const [xa, xb] of [[-40, 160], [160, 360]]) { const cx = (xa + xb) / 2, w = (xb - xa) / 2; for (let x = 0; x <= 319; x++) { if (x < xa || x > xb) continue; const u = (x - cx) / w, y = Math.round(19 - (1 - u * u) * 13); pset(x, y, hex('#5a5664')); pset(x, y + 1, hex('#46424f')); pset(x, y + 2, HP.pieJ); } }
  rect(0, 19, 319, 24, K); rect(0, 20, 319, 20, HP.pieL); rect(0, 21, 319, 22, HP.pie); rect(0, 23, 319, 23, HP.pieS); for (let x = 1; x < 320; x += 6) { rect(x, 24, x + 2, 26, K); rect(x, 24, x + 1, 25, HP.pieS); }
  // el muro de sillares grises, con verdín, y la sombra bajo la cornisa
  piedra(0, 27, 319, 127, [HP.pieJ, HP.pie, HP.pieL, HP.pieS, HP.pieD], 32, 18, 8, hex('#4e5e46'));
  for (let y = 27; y < 44; y++) for (let x = 0; x < 320; x++) if (bay(x, y) < (44 - y) / 22) tinte(x, y, K, 0.3);
  // el zócalo de cuarterones con su moldura
  rect(0, 104, 319, 107, K); rect(0, 104, 319, 104, HP.madL); rect(0, 105, 319, 106, HP.mad);
  for (let x = 0, i = 0; x < 320; x += 24, i++) cuarteron(x, 108, x + 23, 125, i);
  rect(0, 126, 319, 127, K); rect(0, 126, 319, 126, HP.madS);
  // el ventanal ojival: cielo de día, colinas y las torres lejanas del castillo; el alféizar
  const TOR = [[19, 58, 3], [38, 66, 3], [28, 74, 2]];
  VEN1 = ojiva(10, 30, 50, 94, (x, y) => {
