  piel: '#f6c290', pielS: '#d48a5a', rojo: '#d8303a', rojoS: '#8a1e26', rojoL: '#f06a5a',
  azul: '#3a6ad8', azulS: '#24449a', azulL: '#7a9ae8', oro: '#f0c040', oroS: '#a87a18', oroL: '#ffe890',
  gris: '#8a8c90', grisS: '#5e6064', grisL: '#b8bac0', grisD: '#3a3c44', acero: '#9aa0aa', aceroS: '#6e7480', aceroL: '#c4c8d0',
  pant0: '#0e1a2e', pant1: '#16284a', pant2: '#22406e', fos: '#5ae07a', fosS: '#2a8a4a',
  asf: '#55585f', asfS: '#44474e', asfL: '#686b72', acera: '#b8b8b0', aceraS: '#98988e',
  manila: '#e8c888', manilaS: '#c8a460', manilaL: '#f4dca8', nogal: '#6a4428', nogalS: '#4a2e1a',
  lluvia: '#9ab0c8', sodio: '#f0a040', sodioL: '#ffd890',

// un rectángulo con borde negro y relleno
const caja = (x0, y0, x1, y1, c, borde = Q.k) => { R.rect(x0, y0, x1, y1, borde); R.rect(x0 + 1, y0 + 1, x1 - 1, y1 - 1, c); };
// el bocadillo con un icono a doble tamaño (x, y = la punta de abajo)
const globo = (x, y, ic, col = Q.k) => { x = Math.round(x); y = Math.round(y); R.rect(x - 8, y - 20, x + 8, y - 3, Q.k); R.rect(x - 9, y - 19, x + 9, y - 4, Q.k); R.rect(x - 7, y - 19, x + 7, y - 4, Q.bl); R.rect(x - 8, y - 18, x + 8, y - 5, Q.bl); R.rect(x - 1, y - 3, x + 1, y - 2, Q.k); R.pset(x, y - 1, Q.k); R.pset(x, y - 3, Q.bl); R.icono(ic, x - (ic === '!' ? 3 : ic === 'coche' || ic === 'bichito' ? 7 : 5), y - 18, col, Q.bl, 2); };
// vapor que sube de una taza (x, y = el borde de la taza)
const vapor = (x, y, t, n = 3) => { for (let k = 0; k < n; k++) { const f = ((t * 0.7 + k / n) % 1), yy = y - 2 - f * 14, xx = x + Math.sin(t * 3 + k * 2 + f * 6) * 2; if (f < 0.85) tin(xx, yy, Q.bl, 0.55 * (1 - f)); tin(xx + 1, yy - 1, Q.bl, 0.35 * (1 - f)); } };
// gotas que resbalan por un cristal (dentro del rectángulo dado)
const gotas = (x0, y0, x1, y1, t, n = 10, c = Q.lluvia) => { for (let k = 0; k < n; k++) { const x = x0 + Math.floor(h(k, 3, 9) * (x1 - x0)), y = y0 + ((t * (14 + h(k, 5) * 20) + h(k, 7) * 80) % (y1 - y0)); R.pset(x, Math.round(y), c); R.pset(x, Math.round(y) - 1, mez(c, Q.k, 0.3)); } };
const rayasLluvia = (x0, y0, x1, y1, t, c = Q.lluvia, n = 26) => { for (let k = 0; k < n; k++) { const x = x0 + ((h(k, 1) * (x1 - x0) + t * 40) % (x1 - x0)), y = y0 + ((h(k, 2) * (y1 - y0) + t * 160) % (y1 - y0)); for (let j = 0; j < 4; j++) if (y + j <= y1) R.pset(Math.round(x - j * 0.5), Math.round(y + j), c); } };

const n = (f) => en('nombre', f);
const P2 = n(0.36), P3 = n(0.78);

// ── 1 · el tribunal de Nueva York ──────────────────────────────────────────────────────────────────────────────
const gta = n(0.26), auto = n(0.32), ley = n(0.39);
const cochePrueba = (x, y, s = 1) => T.PIEZAS_GT.cocheJuguete(R, x, y, { color: '#d8303a', s });
const p1 = (t) => {
  const o = { encuadre: 'tribunal' };

  caja(146, 150, 162, 160, hex('#5a3a22')); R.rect(147, 151, 161, 152, hex('#7a5232')); R.rect(152, 147, 156, 149, Q.k); R.rect(153, 155, 155, 156, Q.oro);
  caja(208, 148, 218, 160, Q.grisS); for (let y = 150; y < 160; y += 2) R.rect(209, y, 217, y, Q.grisD); R.disco(213, 147, 3, Q.bl);

  R.actor(EL.juezaGT, 148, 100, t, { dir: -1, sorpresa: t > auto && t < auto + 0.7, dedo: t > ley && t < ley + 1.3, habla: t > ley && t < ley + 1.2 && sin(t, 7) });

  const u = tramo(t, 0.2, gta - 0.6), fx = Math.round(lerp(60, 112, sube(u)));
  const alza = t > gta - 0.2 && t < ley + 1.5;
  const f = R.actor(EL.oficinista2, fx, 158, t, { dir: 1, anda: u > 0 && u < 1, sostiene: alza ? [fx + 22, 120] : true, habla: t > 1 && t < gta && sin(t, 6) });
  if (alza) cochePrueba(f.mano[0] + 2, f.mano[1] + 2); else cochePrueba(f.mano[0] + 4, f.mano[1] + 4);
  if (t > auto && t < auto + 0.25) for (let k = 0; k < 8; k++) { const an = k / 8 * 6.28; R.pset(Math.round(f.mano[0] + 2 + Math.cos(an) * 12), Math.round(f.mano[1] - 4 + Math.sin(an) * 8), Q.oroL); }

  const pe = R.actor(EL.periodista2GT, 16, 154, t, { dir: 1, sostiene: [34, 146 + (Math.floor(t * 4) % 2)], sorpresa: t > auto && t < auto + 0.6 });
  caja(pe.mano[0] - 2, pe.mano[1] - 1, pe.mano[0] + 6, pe.mano[1] + 4, Q.bl);
  T.nuevayorkDelante(R, t, o);
};

// ── 2 · el expediente de cerca en la mesa del secretario ────────────────────────────────────────────────────────
const sello = n(0.46), crimen = n(0.6), bueno = n(0.72);
const fondo2 = () => {
  // arriba, la pared del archivo: archivadores de acero gris con sus tiradores y etiquetas, y la ventana con Nueva York gris
  for (let y = 0; y < 72; y++) for (let x = 0; x < 320; x++) R.pset(x, y, tono([hex('#7a7e86'), hex('#8c9098'), hex('#9ea2aa')], 1.2 + h(x >> 1, y >> 1) * 0.6, x, y));
  for (let k = 0; k < 4; k++) { const x0 = 4 + k * 46; caja(x0, 18, x0 + 42, 72, Q.acero); for (let j = 0; j < 3; j++) { const y0 = 22 + j * 17; caja(x0 + 3, y0, x0 + 39, y0 + 14, Q.aceroL); R.rect(x0 + 15, y0 + 8, x0 + 27, y0 + 9, Q.grisD); caja(x0 + 16, y0 + 3, x0 + 26, y0 + 6, Q.bl); R.numero(String(k * 3 + j + 1), x0 + 21, y0 + 13, { fina: true, centro: true }) ; } }
  caja(196, 16, 264, 66, Q.grisS); R.rect(198, 18, 262, 64, hex('#b8c0cc'));
  for (const [x, w2, hh] of [[200, 12, 30], [214, 16, 40], [232, 10, 26], [244, 16, 36]]) { R.rect(x, 64 - hh, x + w2, 64, hex('#6a7080')); for (let j = 64 - hh + 3; j < 62; j += 4) for (let i = x + 2; i < x + w2 - 1; i += 4) R.rect(i, j, i + 1, j + 1, hex('#9aa2b0')); }
  R.rect(229, 18, 230, 64, Q.grisS); R.rect(198, 40, 262, 41, Q.grisS);
  R.rect(272, 62, 316, 72, Q.nogalS); R.rect(272, 62, 316, 63, Q.nogal); for (let k = 0; k < 5; k++) caja(276 + k * 8, 46 - (k % 2) * 4, 282 + k * 8, 62, [Q.rojoS, Q.azulS, Q.verdeS, Q.nogal, Q.oroS][k]);
  // la mesa de acero del secretario con su tapete verde, en ligera perspectiva
  for (let y = 72; y < 180; y++) for (let x = 0; x < 320; x++) R.pset(x, y, tono([Q.aceroS, Q.acero, Q.aceroL], 1 + h(x >> 2, y, 4) * 0.5 - (y - 72) / 200, x, y));
  R.rect(0, 72, 319, 74, Q.grisD); R.rect(0, 75, 319, 75, Q.aceroL);

  for (let y = 84; y < 172; y++) for (let x = 14; x < 306; x++) if (h(x, y, 6) > 0.93) tin(x, y, Q.k, 0.25);

  R.rect(80, 142, 120, 150, Q.k); R.numero('1995', 100, 149, { fina: true, centro: true, rampa: [Q.bl, Q.bl, Q.bl, Q.bl] });
  R.rect(132, 96, 134, 108, Q.aceroS); R.rect(130, 96, 136, 97, Q.aceroS);

  for (let k = 0; k < 7; k++) { const y = 104 + k * 7; R.rect(176 + k * 0.2, y, 250 - (k % 3) * 14, y, Q.lapiz); }
  for (let k = 0; k < 3; k++) { caja(178, 150 + 0 * k, 184, 156, Q.bl); }
  R.rect(232, 150, 262, 151, Q.k);

  R.poligono([[256, 156], [304, 156], [308, 170], [252, 170]], Q.nogalS); R.rect(254, 156, 306, 158, Q.nogal);

const iconoSello = (cx, cy, c, a2 = 1) => {   // el sello: un coche y la flecha que se lo lleva (robar un coche), dentro de un aro
  for (let an = 0; an < 6.28; an += 0.04) for (const r of [17, 18]) tin(cx + Math.cos(an) * r, cy + Math.sin(an) * r * 0.8, c, a2);
  for (let j = -4; j <= 3; j++) for (let i = -10; i <= 4; i++) { const dentro = (j >= -1 && i >= -10 && i <= 4) || (j >= -4 && j < -1 && i >= -6 && i <= 1); if (dentro) tin(cx + i, cy + j, c, a2); }
  for (const i of [-7, 1]) for (let dj = 0; dj < 2; dj++) for (let di = 0; di < 3; di++) tin(cx + i + di, cy + 4 + dj, c, a2);
  for (let i = 6; i <= 13; i++) tin(cx + i, cy, c, a2); for (let k = 1; k <= 3; k++) { tin(cx + 13 - k, cy - k, c, a2); tin(cx + 13 - k, cy + k, c, a2); }

const p2 = (t) => {
  capa('fondo2', fondo2);
  // la nieve que cae al otro lado de la ventana
  R.recorte([198, 18, 262, 64]); for (let k = 0; k < 18; k++) { const x = 198 + ((h(k, 1) * 64 + Math.sin(t + k) * 3) % 64), y = 18 + ((h(k, 2) * 46 + t * (8 + h(k, 3) * 6)) % 46); R.pset(Math.round(x), Math.round(y), Q.bl); } R.recorte(null);

  // el coche de juguete de la foto (guiña un faro en «the good guy»)

  // el sello estampado (aparece al levantar el tampón)
  if (t > sello + 0.15) iconoSello(228, 148, Q.rojo, 0.85);
  // la mano con el tampón: lo moja en la almohadilla de abajo, lo lleva a la hoja y estampa en «stealing a car»
  const ui = tramo(t, P2 + 0.3, sello - 0.35), uo = tramo(t, sello + 0.2, sello + 0.9);
  const baja = t < sello ? tramo(t, sello - 0.25, sello) : 1 - tramo(t, sello + 0.05, sello + 0.2);
  const moja = t < P2 + 0.3 ? 1 - tramo(t, P2, P2 + 0.25) : 0;
  let sx = lerp(198, 228, sube(ui)), sy = lerp(164, 133, sube(ui)) + baja * 12 + moja * 4;
  sx = lerp(sx, 260, sube(uo)); sy = lerp(sy, 196, sube(uo));
  if (uo < 1) {
    const X = Math.round(sx), Y = Math.round(sy);
    R.rect(X - 10, Y - 4, X + 10, Y + 2, Q.k); R.rect(X - 9, Y - 3, X + 9, Y + 1, Q.nogal); R.rect(X - 9, Y + 2, X + 9, Y + 3, Q.rojoS);
    R.rect(X - 2, Y - 14, X + 2, Y - 4, Q.k); R.rect(X - 1, Y - 13, X + 1, Y - 4, Q.nogal); R.disco(X, Y - 16, 4, Q.k); R.disco(X, Y - 16, 3, Q.nogal);
    T.brazo(R, X + 16, 200, X + 6, Y - 10, '#4a4e5a', -1, { codo: [X + 22, Y + 18] });
  }

  const m0 = tramo(t, crimen - 1.2, crimen - 0.5), golpe = t < crimen ? tramo(t, crimen - 0.45, crimen - 0.2) - tramo(t, crimen - 0.2, crimen) : 0, vuelve = tramo(t, crimen + 0.6, crimen + 1.4);
  const mx = Math.round(lerp(280, 286, m0)), my = Math.round(146 - golpe * 22 - vuelve * 0);
  const enMano = m0 > 0.95 && vuelve < 1;
  T.PIEZAS_GT.mazo(R, 278, 160 - (enMano ? Math.round(golpe * 20) : 0), { s: 2, base: false, dir: -1, arriba: enMano && golpe > 0.25 });
  if (t > crimen && t < crimen + 0.3) for (let k = 0; k < 10; k++) { const an = k / 10 * 6.28, r = 10 + (t - crimen) * 60; R.pset(Math.round(274 + Math.cos(an) * r), Math.round(160 + Math.sin(an) * r * 0.4), Q.oroL); }
  const hx = lerp(330, 296, m0) + vuelve * 40, hy = lerp(180, 150, m0) - (enMano ? golpe * 20 : 0);
  if (hx < 326) T.brazo(R, 340, 200, hx, hy, '#4a4e5a', -1, { codo: [hx + 30, hy + 36] });
};

// ── 3 · la cocina de DMA: los creadores se miran con media sonrisa ───────────────────────────────────────────
const sabian = n(0.87), hablar = n(0.93), desde = n(0.79);
const fondo3 = () => {
  // la pared de azulejos blancos de cocina hasta media altura y la pintura de arriba, con juntas
  // (azulejos: junta sombreada, canto de luz arriba e izquierda, canto oscuro abajo, brillo en diagonal del fluorescente,
  //  la luz de la ventana que baja por la pared y la sombra junto al suelo)
  const AZ = [hex('#aeb6ba'), hex('#c4ccd0'), hex('#d6dee0'), hex('#e4eaea'), hex('#f0f4f3'), hex('#fbfcfb')];
  const JU = [hex('#8a9296'), hex('#9ea6aa'), hex('#b0b8bc')];
  for (let y = 0; y < 158; y++) for (let x = 0; x < 320; x++) {
    if (y <= 70) { R.pset(x, y, tono([hex('#c8b890'), hex('#d8caa0'), hex('#e4d8b4')], 1 + h(x >> 1, y >> 1) * 0.6 - y / 200, x, y)); continue; }
    const jx = x % 10, jy = (y - 70) % 10, tx = (x / 10) | 0, ty = ((y - 70) / 10) | 0;
    const sombra = Math.max(0, (y - 128) / 30) + (x > 249 && x < 258 && y > 110 ? 1.2 : 0);
    if (jx === 0 || jy === 0) { R.pset(x, y, tono(JU, 1.6 + h(x, y, 3) * 0.6 - sombra * 1.2, x, y)); continue; }
    let v = 3 + h(tx, ty, 4) * 0.7 - (y - 70) / 120 - sombra * 1.4;
    if (jx === 1 || jy === 1) v += 1; else if (jx === 9 || jy === 9) v -= 0.9;
    if (h(tx, ty, 5) > 0.45 && jx - jy === 2 && jx > 3 && jx < 8) v += 1.6;          // el brillo del fluorescente
    if (x > 14 && x < 102 && y < 104) v += 0.5 * (1 - (y - 70) / 34);                   // la luz que entra por la ventana
    R.pset(x, y, tono(AZ, v, x, y));
  }
