<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ep42 · miniatura</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// LF-MINIATURA · ep42, con chibis. Una sola idea, la del título («The Real Florida Alligators Behind the Trailer»): un
// caimán enorme se pasea de madrugada por el pasillo de una tienda, delante de las patatas, bajo la luz de las neveras;
// el dependiente, al doble, se asoma por el mostrador con sorpresa. Sin palabras. Nada morboso: el caimán es gracioso.
import { crearRoma } from '/atomo/plato/kits/pixel-roma.js';
import { conChibi, ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
import { tienda, tiendaDelante, a_caiman } from '/atomo/plato/escenas/lf-comun.js';
import { figura, grado, halo, cifra } from '/atomo/plato/escenas/mini-chibi.js';
const R = conChibi(await crearRoma(document.getElementById('lienzo')));
const dibujar = (t) => {
  const o = { encuadre: 'tienda', puerta: 1 };
  tienda(R, t, o);
  grado(R, { cx: 165, cy: 135, tinte: '#06101c', f: 0.32, desde: 0.35, max: 0.85 });
  halo(R, 140, 162, 95, 24, '#fff2d0', 0.5);
  halo(R, 268, 128, 34, 26, '#d8f0ff', 0.22);
  a_caiman(R, 146, 176, t, { dir: 1, anda: 0, boca: 0.75, s: 4.3 });
  figura(R, EL.dependienteLF, 266, 148, t, { dir: -1, sorpresa: true }, 2);
  tiendaDelante(R, t, { ...o, cctv: 0 });
  cifra(R, '2018', 160, 22, 16);
};
window.__frame = async (t) => { dibujar(t); R.presentar(); };
window.__listo = true;
</script>
</body>
</html>
