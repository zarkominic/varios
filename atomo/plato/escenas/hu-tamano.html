<canvas id="lienzo"></canvas>
<script type="module">
// HU-TAMANO (frase 22), 1971 (la ciencia, con el año del relato). Tres planos (las marcas de la voz inglesa salen de las
// palabras medidas en la pista):
// 1. el mapa del golfo: un huracán enorme avanza por su trayectoria punteada desde el sur, girando; en «300 miles wide» una
//    mano entra por la derecha con la regla, la desliza hasta el ojo, de lado a lado de la espiral, y sale «300»; la mano
//    suelta la regla (que sigue al huracán), coge el rotulador rojo y en «last two weeks» tacha los catorce días del
//    calendario, uno tras otro (el antebrazo sube hacia el hombro, fuera de cuadro a la derecha: manga azul marino con
//    pliegues, luz arriba, sombra abajo y el puño blanco, y su sombra corrida sobre el papel; pasa por encima de la
//    tarjeta del calendario, que está pegada al papel); dos barcos se apartan y un avión de reconocimiento le da vueltas (la trayectoria, el
//    huracán y el avión se recortan al papel, sin cruzar el marco de madera); corta en «While»;
// 2. las llanuras con la luz verde de la tormenta: el granjero va al establo con su cubo y el perro trota delante; en el
//    camino picotean tres gallinas; en «tornado» el embudo toca tierra, como un hilo bajo la nube (la escena lo repinta
//    encima del de llanuras con bandas de giro en cuatro tonos que suben, el filo de luz y la sombra, y una nube de polvo
//    y escombros que gira en su base, con terrones que dan vueltas y polvo que entra a ras de suelo): las gallinas huyen
//    aleteando, el perro se para y corre a esconderse POR DETRÁS del amo (se recorta a los dos lados de su silueta: solo
//    asoma la cabeza por su derecha, temblando); el granjero, del susto, suelta el cubo de zinc (cae junto a su pie, rebota
//    y salpica; queda en el camino con su asa y su sombra), se vuelve y lo mira con los prismáticos; en «a few hundred
//    yards across» la cota se abre a ras de suelo, gruesa y con un halo oscuro para leerse contra el embudo y los cables,
//    con sus topes tocando los dos bordes del embudo y siguiendo su vaivén; en «lives for minutes» saca el reloj de bolsillo (el cronómetro corre en su bocadillo) y el embudo se recoge
//    hacia la nube; él respira y sonríe, y el perro sale moviendo el rabo; corta en «But»;
// 3. el laboratorio de Fujita: junto a la maqueta, gira el mando y el humo se retuerce en un embudo estrecho («inside that
//    narrow funnel»); el anemómetro está montado en la horquilla del soporte, tapado con una funda de lona; Fujita va
//    hasta él, coge el cordón y en «the wind» tira: la funda resbala y cae hecha un montón al pie del trípode, el
//    contador se enciende y el rotor de cazoletas gira con el viento de la maqueta; la becaria se acerca con su
//    tablilla; la aguja sube (el rotor gira cada vez más deprisa), deja atrás la marca del huracán más fuerte y se clava en «300» («even faster»): los dos se
//    sorprenden; en «strongest hurricane» Fujita señala la marca del huracán, que parpadea, y la becaria señala la aguja
//    y lo anota.
// Posiciones del decorado de las que depende: mapa 'golfo' (la proyección P_GOLFO); llanuras 'general' (el camino de y 137
// a 147, los pies en 144; la granja a la izquierda, x 0–160; el embudo de g_tornadoLl, de (214, 76) al horizonte y 99, y
// los tonos de su embudo, sus cables y sus pájaros con la luz verde; el granjero ocupa de gx+1 a gx+12); labFujita (la maqueta en x 12–54,
// el suelo de los pies y 150–166, la mesa de trabajo de x 234 a 318, la papelera en x 222–232 y el soporte del
// anemómetro en x 118: la horquilla con los brazos en x 104 y 132 y el travesaño en y 91; la esfera va centrada en (118, 77)).
import * as T from '/atomo/plato/escenas/hu-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
import { avionMapa } from '/atomo/plato/escenas/ov-mapas.js';
const { E, R, M } = await T.preparar('hu-tamano');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const C = T.C;
const lin = (t, a0, a1) => Math.max(0, Math.min(1, (t - a0) / (a1 - a0)));
const entre = (t, a0, a1) => t >= a0 && t < a1;
const suave = (u) => u * u * (3 - 2 * u);
const parpadeo = (t, v = 6) => Math.sin(t * v) > 0;
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], umbral = (x, y) => (B4[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
// mezcla dos colores del kit (ABGR) en la proporción a, y vela un píxel ya pintado con un color
const mezcla = (c1, c2, a) => { const f = (s) => ((c1 >>> s) & 255) + ((((c2 >>> s) & 255) - ((c1 >>> s) & 255)) * a); return (0xff000000 | (Math.round(f(16)) << 16) | (Math.round(f(8)) << 8) | Math.round(f(0))) >>> 0; };
const velo = (x, y, c, a) => { x = Math.round(x); y = Math.round(y); if (x < 0 || x > 319 || y < 0 || y > 179) return; R.pset(x, y, mezcla(R.pget(x, y), c, a)); };
// la mano que cuelga al andar: dónde lleva algo un personaje (x, suelo, dir)
const enMano = (x, suelo, dir) => [dir > 0 ? x + 11 : x - 5, suelo - 9];
// cifras diminutas de 3 × 5 (solo dígitos)
const DIG = ['111101101101111', '010110010010111', '111001111100111', '111001111001111', '101101111001001', '111100111001111', '111100111101111', '111001001001001', '111101111101111', '111101111001111'];
const cifras = (s, x, y, c) => { for (const ch of String(s)) { const d = DIG[+ch]; if (d) for (let j = 0; j < 5; j++) for (let i = 0; i < 3; i++) if (d[j * 3 + i] === '1') R.pset(x + i, y + j, c); x += 4; } };
// un destello en cruz que late
const destello = (x, y, r, c = C.blanco) => { R.pset(x, y, c); for (let k = 1; k <= r; k++) { R.pset(x + k, y, c); R.pset(x - k, y, c); R.pset(x, y + k, c); R.pset(x, y - k, c); } };

const tornadito = (x, y, t, k = 0, o = {}) => {
  const col = o.col ?? hex('#5a5e72'), luz = o.luz ?? hex('#a8aec0'), s = o.s ?? 1, alto = Math.round(10 * s);
  for (let j = 0; j < alto; j++) { const f = j / alto, w = Math.max(1, Math.round((5 - 4 * f) * s)), dx = Math.round(Math.sin(t * 7 + k + j * 0.6) * f * 1.4 * s), x0 = x - Math.floor(w / 2) + dx, yy = y - alto + j;
    R.rect(x0 - 1, yy, x0 + w, yy, C.k); R.rect(x0, yy, x0 + w - 1, yy, (j + Math.floor(t * 12 + k)) % 3 === 0 ? luz : col); if (w > 2) R.pset(x0, yy, luz); }
  R.rect(x - Math.round(2.5 * s) - 1, y - alto - 1, x + Math.round(2.5 * s) + 1, y - alto - 1, C.k);
  if (o.polvo !== false) for (let i = 0; i < 4; i++) { const a = t * 9 + i * 1.6 + k; R.pset(Math.round(x + Math.cos(a) * 3 * s), Math.round(y + Math.sin(a) * 0.8), o.polvoC ?? hex('#c8b896')); }
};

const espiral = (cx, cy, r, t, o = {}) => {
  const al = o.alfa ?? 1, rot = t * (o.giro ?? 0.9), ext = o.brazos ?? 1.5, N0 = hex('#ffffff'), N1 = hex('#e4e8f0'), N2 = hex('#b8c0d2'), N3 = hex('#8a94ac'), N4 = hex('#5e6884'), SOM = hex('#3e4a60');
  // q: la densidad de nube (el núcleo denso, la pared del ojo y dos bandas en espiral con huecos entre ellas)
  const v = (x, y) => { const dx = x + 0.5 - cx, dy = y + 0.5 - cy, d = Math.hypot(dx, dy) / r; if (d > ext) return [0, d, 0, 0, 0];
    const th = Math.atan2(dy, dx), br = Math.cos(2 * (th + rot) - 4.6 * Math.log(d + 0.05)), banda = br > 0.25 ? 1 : br > -0.05 ? (br + 0.05) / 0.3 : 0;
    const nucleo = d < 0.4 ? 1 : Math.max(0, 1 - (d - 0.4) * 4.5), lejos = Math.max(0, 1 - Math.max(0, d - 0.45) / (ext - 0.45));
    let q = Math.max(nucleo, banda * Math.min(1, lejos * 1.6)); if (d < 0.12) q = d < 0.07 ? 0 : q * 0.5; return [q * al, d, dx, dy, br]; };
  const x0 = Math.floor(cx - r * ext - 4), x1 = Math.ceil(cx + r * ext + 4), y0 = Math.floor(cy - r * ext - 4), y1 = Math.ceil(cy + r * ext + 4);
  // la sombra sobre el papel, corrida abajo a la derecha
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const [q] = v(x - 3, y - 3); if (q > 0.5 && umbral(x, y) < 0.75) velo(x, y, SOM, 0.3); }
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const [q, d, dx, dy, br] = v(x, y); if (q <= 0.2) continue; const u = umbral(x, y);
    if (q < 0.6 && u > (q - 0.2) / 0.4) continue;   // el borde deshilachado
    // la luz viene de arriba a la izquierda; las cimas de la coliflor brillan y el filo de cada banda queda en sombra
    const col = Math.sin(x * 0.9 + Math.sin(y * 0.7) * 2) * Math.sin(y * 0.8 + t * 0.5) * 0.12, luz = 0.55 + (-dx - dy) / (r * 2.6) + col + (d < 0.42 ? 0.25 : br * 0.18) - (q < 0.8 ? 0.2 : 0);
    R.pset(x, y, luz > 0.95 ? N0 : luz > 0.72 ? N1 : luz > 0.5 ? N2 : luz > 0.3 ? N3 : N4);
  }
  // el ojo: el papel de abajo se ve por el hueco, con la pared en sombra del lado de abajo a la derecha
  if (al > 0.5) { const re = Math.max(1.5, r * 0.1); for (let k = 0; k < 24; k++) { const g = k / 24 * Math.PI * 2; R.pset(Math.round(cx + Math.cos(g) * (re + 1)), Math.round(cy + Math.sin(g) * (re + 1)), Math.cos(g - 0.8) > 0 ? N4 : N2); } }
};

const a = (f) => en('tamano', f);
const P2 = a(0.2621), P3 = a(0.6098);
// ── 1 · el huracán sobre el mapa ────────────────────────────────────────────────────────────────────────────────
const regla = [a(0.062), a(0.115)], cifra = a(0.07), dosSemanas = [a(0.18), a(0.236)];
const RUTA = [[-83.4, 22.2], [-84.6, 23.6], [-85.8, 25.0], [-87.0, 26.4], [-88.0, 27.5], [-88.6, 28.0]];
const enRuta = (P, u) => { const pts = RUTA.map((p) => P(p)); const L = []; let tot = 0; for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); L.push(d); tot += d; }
  let q = tot * u; for (let i = 1; i < pts.length; i++) { if (q <= L[i - 1]) { const f = q / L[i - 1]; return [lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f), pts.slice(0, i)]; } q -= L[i - 1]; } const z = pts[pts.length - 1]; return [z[0], z[1], pts]; };
// el calendario de dos semanas, sobre el papel: catorce casillas que se tachan
// el calendario va abajo a la derecha, en (268, 134): así la regla y la manga de la mano no lo pisan; el centro de su casilla k
const CAL = [268, 134], celda = (k) => [CAL[0] + 3 + (k % 7) * 6 + 2, CAL[1] + 9 + Math.floor(k / 7) * 9 + 3];
const calendario = (x, y, t, u) => {
  R.rect(x + 2, y + 2, x + 46, y + 30, hex('#5a6a7e')); R.rect(x, y, x + 44, y + 28, C.k); R.rect(x + 1, y + 1, x + 43, y + 27, hex('#f8f4e8')); R.rect(x + 1, y + 1, x + 43, y + 6, hex('#c8463a')); R.rect(x + 1, y + 1, x + 43, y + 1, hex('#e8705a'));
  for (const rx of [x + 10, x + 34]) { R.rect(rx, y - 2, rx + 1, y + 2, C.k); R.pset(rx, y - 1, hex('#c8ccd4')); }
  for (let k = 0; k < 14; k++) { const cx = x + 3 + (k % 7) * 6, cy = y + 9 + Math.floor(k / 7) * 9; R.rect(cx, cy, cx + 4, cy + 6, hex('#d8d2c0')); R.rect(cx + 1, cy + 1, cx + 3, cy + 5, hex('#fffdf6'));
    if (u * 14 > k + 0.5) { R.linea(cx, cy + 1, cx + 4, cy + 5, hex('#c8282a')); R.linea(cx + 4, cy + 1, cx, cy + 5, hex('#c8282a')); } }
};
const barco = (x, y, t, d) => { const b = Math.round(Math.sin(t * 3 + x) * 0.6); R.icono('barco', Math.round(x), Math.round(y) + b, hex('#3a3a46'), hex('#7898b0')); for (let k = 1; k < 4; k++) R.pset(Math.round(x + 3 - d * (k * 3 + 4)), Math.round(y + 7) + b, hex('#a4c0d0')); };
// el mapa del golfo no se mueve: se pinta una vez en su búfer (con R.usar(prev) para que los fundidos no se rompan)
let capaGolfo = null, P_GOLFO = null;
const p1 = (t) => {
  if (!capaGolfo) { capaGolfo = R.nuevo(); const prev = R.usar(capaGolfo); P_GOLFO = T.mapa(R, 0, { zona: 'golfo' }); R.usar(prev); }
  R.copiar(capaGolfo); const P = P_GOLFO;
  for (const [lon, lat] of [[-95.4, 29.8], [-90.1, 29.95], [-82.5, 27.9]]) { const [x, y] = P([lon, lat]); T.chincheta(R, Math.round(x), Math.round(y), t, C.rojo, { pulso: true }); }
  // dos barcos que se apartan de la tormenta
  barco(lerp(124, 92, lin(t, 0, P2)), lerp(128, 120, lin(t, 0, P2)), t, -1); barco(lerp(206, 236, lin(t, 0, P2)), lerp(96, 88, lin(t, 0, P2)), t, 1);
  // la trayectoria punteada que deja atrás y el huracán que avanza por ella, girando
  const u = lerp(0.42, 1, lin(t, 0, P2 + 0.3)), [hx, hy, pasados] = enRuta(P, u), r = 24 * lerp(0.8, 1, suave(lin(t, 0.2, 1.4)));
  // lo que va sobre el papel se recorta a él (el marco de madera mide 6 px): la trayectoria, el huracán y el avión
  // no cruzan nunca el marco
  R.recorte([6, 6, 313, 173]);
  const ruta = [...pasados, [hx, hy]]; for (let i = 1; i < ruta.length; i++) { const [ax, ay] = ruta[i - 1], [bx, by] = ruta[i], n = Math.ceil(Math.hypot(bx - ax, by - ay)); for (let k = 0; k <= n; k += 3) { const x = Math.round(lerp(ax, bx, k / n)), y = Math.round(lerp(ay, by, k / n)); R.pset(x, y + 1, hex('#5a6a7e')); R.pset(x, y, hex('#c8463a')); } }
  for (let i = 0; i < ruta.length - 1; i++) { const [x, y] = ruta[i].map(Math.round); R.disco(x, y, 2, C.k); R.disco(x, y, 1, hex('#f8f4e8')); }
  espiral(Math.round(hx), Math.round(hy), r, t, { alfa: lin(t, 0, 0.6) * 0.5 + 0.5 });
  // un avión de reconocimiento que le da vueltas
  { const g = t * 0.9, ax = hx + Math.cos(g) * (r * 1.5 + 8), ay = hy + Math.sin(g) * (r * 1.5 + 6) * 0.8; avionMapa(R, Math.round(ax), Math.round(ay), g + Math.PI / 2, hex('#2a2a36')); }
  R.recorte(null);
  // «300 miles wide»: la mano trae la regla desde arriba a la derecha (por encima del calendario) y la deja de lado a lado
  // de la espiral por el ojo (con sus topes); la regla sigue luego al huracán; la cifra sale encima
  const ru = suave(lin(t, regla[0] - 0.4, regla[1])), w = Math.round(r * 1.3), y = Math.round(hy - 40 * (1 - ru)), x = Math.round(lerp(352 + w, hx, ru));
  if (ru > 0) { R.rect(x - w - 1, y - 2, x + w + 1, y + 1, C.k); R.rect(x - w, y - 1, x + w, y, C.blanco); R.rect(x - w, y, x + w, y, hex('#c8d0dc'));
    for (let k = -w + 4; k < w; k += 4) R.pset(x + k, y - 1, hex('#8a94a8'));
    for (const s of [-1, 1]) { R.rect(x + s * w - 1, y - 6, x + s * w + 1, y + 5, C.k); R.rect(x + s * w, y - 5, x + s * w, y + 4, C.blanco); for (const dy of [-1, 0]) { R.pset(x + s * (w - 2), y + dy - 2, C.k); R.pset(x + s * (w - 2), y + dy + 2, C.k); } } }
  const e = lin(t, cifra, cifra + 0.3); if (e > 0) R.numero('300', Math.round(hx), Math.round(hy - r * 1.5 - 3 + (1 - e) * 6), { tam: 16, centro: true });
  // «two weeks»: el calendario se tacha día a día
  const uc = lin(t, dosSemanas[0], dosSemanas[1] + 0.25);
  calendario(CAL[0], CAL[1], t, uc);
  // la mano: lleva la regla por su tope derecho; la suelta, coge el rotulador rojo y va al calendario; tacha la casilla
  // que toca en cada momento (la punta hace la cruz) y se va
  let mx, my, rotu = false;
  if (t < regla[1] + 0.1) { mx = x + w + 7; my = y + 3; }
  else if (t < dosSemanas[0]) { const u = suave(lin(t, regla[1] + 0.1, dosSemanas[0] - 0.05)), [cx, cy] = celda(0); mx = lerp(x + w + 7, cx + 14, u); my = lerp(y + 3, cy - 10, u) - Math.sin(u * Math.PI) * 10; rotu = u > 0.4; }
  else if (t < dosSemanas[1] + 0.3) { const k = Math.min(13, Math.floor(uc * 14 - 0.5) + 1), f = (uc * 14 - 0.5) % 1, [cx, cy] = celda(k); mx = cx + 14 + Math.round(Math.sin(f * Math.PI * 2) * 2); my = cy - 10 + Math.round(f * 4); rotu = true; }
  else { const u = suave(lin(t, dosSemanas[1] + 0.3, P2 - 0.02)), [cx, cy] = celda(13); mx = lerp(cx + 14, 350, u); my = lerp(cy - 10, 170, u); rotu = true; }
  if (rotu) { const px = Math.round(mx) - 14, py = Math.round(my) + 8; R.linea(px, py, px + 5, py - 6, C.k); R.linea(px + 1, py, px + 6, py - 6, hex('#c8282a')); R.linea(px + 2, py - 1, px + 6, py - 5, hex('#e84a3a')); R.pset(px, py, hex('#8a1a1e')); }
  // el brazo viene de fuera del cuadro (el hombro, abajo a la derecha y fuera): va después del calendario, así que pasa
  // POR ENCIMA de la tarjeta, que es papel pegado; con su sombra corrida sobre el papel, como el de hu-ojo
  brazoMapa(Math.round(mx), Math.round(my), t);
};
// el antebrazo que entra por la derecha (como manoTapon de hu-ojo): la mano canónica (T.mano, copiada de un búfer sin su
// manga recta) con el puño blanco de la camisa; la manga azul marino se ensancha hacia el hombro, con la luz arriba, la
// sombra abajo, tres pliegues que se mueven un poco y la trama de la tela; antes, su sombra corrida abajo a la derecha
// sobre el papel (y sobre la tarjeta), como la de la espiral. Solo se recorre la caja del brazo
const HOMBRO_M = [384, 108];
let MANO_M = null;
const brazoMapa = (hx, hy, t) => {
  if (hx > 334) return;
  const W = [hx + 2, hy], dx = HOMBRO_M[0] - W[0], dy = HOMBRO_M[1] - W[1], L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, nx = uy, ny = -ux;
  const ancho = (s) => 2.6 + Math.min(1, s / 40) * 1.4;
  const MG = hex('#2a4a7a'), MG_L = hex('#4a6ea8'), MG_LL = hex('#6a8cc4'), MG_S = hex('#1e3660'), MG_D = hex('#142644'), TRAMA = hex('#32558a'), PUNO = hex('#f6f2ea'), PUNO_S = hex('#c8c4bc'), SOMB = hex('#3a4458');
  const x0 = Math.max(0, Math.min(W[0], 320) - 8), y0 = Math.max(0, Math.min(W[1], HOMBRO_M[1]) - 8), y1 = Math.min(179, Math.max(W[1], HOMBRO_M[1]) + 10);
  const dentroBrazo = (x, y) => { const px = x + 0.5 - W[0], py = y + 0.5 - W[1], s = px * ux + py * uy, d = px * nx + py * ny; return s >= -0.5 && s <= L && Math.abs(d) <= ancho(s) + 1 ? [s, d] : null; };
  // 1) la sombra: el brazo corrido 3 a la derecha y 4 abajo, tramada, más la de la mano
  for (let y = y0; y <= Math.min(179, y1 + 4); y++) for (let x = x0; x <= 319; x++) { if (!dentroBrazo(x - 3, y - 4) || dentroBrazo(x, y)) continue; if (umbral(x, y) < 0.8) velo(x, y, SOMB, 0.32); }
  for (let j = -2; j <= 2; j++) for (let i = -6; i <= 4; i++) if ((i / 6.5) ** 2 + (j / 2.6) ** 2 <= 1 && umbral(hx + i, hy + 6 + j) < 0.8) velo(hx - 3 + i, hy + 6 + j, SOMB, 0.3);
  // 2) el antebrazo
  const PL = [12, 22, 33].map((f, k) => f + Math.sin(t * 2 + k * 1.7) * 0.6);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= 319; x++) {
