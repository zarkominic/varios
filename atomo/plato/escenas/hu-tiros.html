<script type="module">
// HU-TIROS (frase 17), 1960 → 1961, cartela «1960». Cuatro planos (4,0, 5,6, 4,1 y 5,0 s):
// 1. Cabo Cañaveral al amanecer del 1 de abril de 1960 (decorado propio): el cielo del alba tramado con nubes lilas que se
//    encienden por debajo, el sol que asoma en el mar, la torre de servicio roja retirada, el mástil umbilical, los focos,
//    el búnker, el depósito de agua, el faro de bandas y palmitos; el Thor-Able humea en la rampa y en «Then» se enciende,
//    en «eyes in the sky» despega entre nubes de humo iluminadas y sube hacia el este dejando su estela; en la duna, el
//    fotógrafo dispara su flash, el oficial mira con los prismáticos, el niño salta y señala y su madre se tapa los oídos;

//    los palmitos y de los postes) pasa un jeep, los pelícanos se espantan, la laguna refleja el alba (y las llamas) y el

// 2. la Tierra entera en 1960 («the first successful weather satellite»): la última etapa trae al TIROS-1 por detrás del
//    planeta y en «successful» lo suelta con un muelle (se aleja dando vueltas); el tambor gira, destella al sol en

// 3. la órbita baja en escorzo («the very next year»: la barra pasa a 1961 en «year»), dibujada en la escena y no con
//    T.orbita: el horizonte inclinado sube hacia la derecha, el sol bajo asoma por el borde a la izquierda y el terminador
//    cruza a la derecha, donde atardece sobre la costa de África (Dakar) y cae la noche con las luces de las ciudades;

//    nubes; las nubes van en bandas (calles de cúmulos de los alisios, racimos de tormentas del ecuador con relámpagos,
//    velos altos hacia el horizonte) en tres tonos, rosadas en el terminador; las islas de Cabo Verde; sin Luna. El
//    sucesor aparece pequeño junto al sol y se acerca girando hasta quedar en plano medio sobre el remolino, que crece
//    (centro en 132, 128); en «spots» el fogonazo y el visor lo fotografían y en «brewing hurricane» queda marcado con un
//    aro rojo que late y un «!» (en 88, 106); una estrella fugaz y otro satélite lejano cruzan arriba;
// 4. en alta mar (decorado C sin boya ni lancha): bajo un sol tranquilo, el pesquero cruza el cuadro hacia la derecha
//    (de x 120 a 174 la popa, ~10,8 px/s) dejando su estela en el agua (el surco y la uve, que se quedan en su sitio del
//    mar y se apagan), con la ropa tendida, el humo de la chimenea y el perro en la proa mirando adelante con la lengua
//    fuera; el marinero remienda la red silbando (notas) y el patrón toma café en la puerta de la caseta. Detrás, la torre
//    de nubes del huracán crece de verdad (de cúmulo alto a cumulonimbo con yunque, lluvia y relámpagos) y se oscurece
//    por debajo, su sombra se extiende por el mar, el yunque suelta cirros hacia fuera, arriba a la izquierda sale un
//    cielo aborregado y en el horizonte nacen tres torrecitas; en el mar de la izquierda corren rachas que rizan el agua
//    con borreguitos, flotan matas de sargazo y una tortuga saca la cabeza. En «before anyone» el patrón mira con los
//    prismáticos hacia delante y no ve nada; el perro (gag) se da la vuelta hacia la tormenta (a la izquierda), salta al
//    techo de la caseta y desde allí ladra hacia la torre en «anyone» (con su «!») y otra vez en «on the ground», sin que
//    nadie le haga caso; en «knows it exists» el patrón se encoge de hombros y vuelve a su café, y el perro baja las
//    orejas y la cabeza hacia él; una gaviota da vueltas y se posa en la cruceta.
import * as T from '/atomo/plato/escenas/hu-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hu-tiros');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const C = T.C;
const lin = (t, x, y) => Math.max(0, Math.min(1, (t - x) / (y - x)));
const entre = (t, x, y) => t >= x && t < y;
const parp = (t, v = 6) => Math.sin(t * v) > 0;
const suave = (u) => { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); };
const BY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
const by = (x, y) => BY[((y & 3) << 2) | (x & 3)];
const rampa = (s) => s.split(' ').map(hex);
const tono = (ram, v, x, y) => { let l = Math.floor(v); if (v - l > by(x, y)) l++; return ram[l < 0 ? 0 : l >= ram.length ? ram.length - 1 : l]; };
const hs = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const ruido = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hs(xi, yi, 9), b = hs(xi + 1, yi, 9), c = hs(xi, yi + 1, 9), d = hs(xi + 1, yi + 1, 9); return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy; };
const mezcla = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
const aclara = (x, y, c, a) => { if (x >= 0 && x < 320 && y >= 0 && y < 180) R.pset(x, y, mezcla(R.pget(x, y), c, a)); };
const FIJOS = new Map();
const fijo = (clave, dibuja) => { let b = FIJOS.get(clave); if (!b) { b = R.nuevo(); const prev = R.usar(b); dibuja(); R.usar(prev); FIJOS.set(clave, b); } R.copiar(b); };
const DIG = ['111101101101111', '010110010010111', '111001111100111', '111001111001111', '101101111001001', '111100111001111', '111100111101111', '111001001001001', '111101111101111', '111101111001111'];
const cifras = (txt, x, y, c, s = 1) => { for (const ch of String(txt)) { const g = DIG[ch.charCodeAt(0) - 48]; if (g) for (let j = 0; j < 5; j++) for (let i = 0; i < 3; i++) if (g[j * 3 + i] === '1') R.rect(x + i * s, y + j * s, x + i * s + s - 1, y + j * s + s - 1, c); x += 4 * s; } };
// lo que va detrás de una pieza del decorado: guarda esos rectángulos, dibuja y los repone encima
const detras = (rects, dibuja) => { const g = rects.map(([x0, y0, x1, y1]) => { const v = []; for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) v.push(R.pget(x, y)); return v; });
  dibuja(); rects.forEach(([x0, y0, x1, y1], k) => { let i = 0; for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) R.pset(x, y, g[k][i++]); }); };
// un dibujo de letras (cada letra, un color de pal; '.' transparente) en (x, y), con escala k
const pinta = (filas, x, y, pal, k = 1) => filas.forEach((f, j) => { for (let i = 0; i < f.length; i++) { const c = pal[f[i]]; if (c != null) R.rect(x + i * k, y + j * k, x + i * k + k - 1, y + j * k + k - 1, c); } });

const a = (f) => en('tiros', f);
// cortes: «the first» (5,28), la pausa antes de «And» (10,9) y «far» (15,0)
const P2 = a(0.213), P3 = a(0.529), P4 = a(0.760);
const enciende = a(0.0), despega = a(0.029), cieloW = a(0.060), a1960 = a(0.129);
const suelta = a(0.232), tirosW = a(0.337), fotos = a(0.427), nubesW = a(0.460), orbitaW = a(0.494);
const siguiente = a(0.573), anioW = a(0.5874), sucesor = a(0.629), ve = a(0.668), gesta = a(0.707), huracan = a(0.724);
const antes = a(0.829), nadie = a(0.849), sabe = a(0.919), existe = a(0.958);

// ── 1 · el despegue del TIROS-1 (Cabo Cañaveral, al amanecer) ────────────────────────────────────────────────────────
const HOR = 108, SX = 226, SY = 107;
const CIELO = rampa('#10142e #161b3e #1e234e #28295c #342f68 #443672 #583e7a #6e4680 #884e84 #a45884 #be6680 #d4787a #e48e76 #f0a874 #f8c27a #fcdc90 #fff0b8');
const MAR = rampa('#3a2e5e #4a386c #5e4478 #7a5282 #9c6086 #c07484 #e09480 #f4b682');
const NUBE = rampa('#2e2a54 #463868 #64467a #8a5684 #b46a86 #e08c82 #f8b48a #ffd8a0');
const MATO = rampa('#1c1a2c #262438 #302e40 #3a3a48 #4a4650 #5e5458 #786660');
const ARENA = rampa('#7a5c62 #94706e #ae8680 #c69c90 #dcb4a2 #ecc8b0 #f8dcc0');
const TORRE = rampa('#5a1e1a #7a2a1e #9e3a24 #c24c2a #e06838');
const nubeAlba = (cx, cy, w, hh, k) => {
  for (let y = Math.round(cy - hh); y <= cy + hh; y++) for (let x = Math.round(cx - w); x <= cx + w; x++) {
    const dx = (x - cx) / w, dy = (y - cy) / hh, d = dx * dx * (1 + 0.4 * Math.sin(y * 0.7 + k)) + dy * dy * 1.6 - ruido(x * 0.12 + k * 7, y * 0.3) * 0.55;
    if (d > 0.55 || y < 0 || y > HOR) continue;
    const abajo = (y - (cy - hh)) / (2 * hh), sol = Math.max(0, 1 - Math.abs(x - SX) / 260);
    R.pset(x, y, tono(NUBE, 0.6 + abajo * 4.4 + sol * 1.4 - d * 1.2, x, y));
  }
};
const palmito = (x, base, alto, t, k) => {
  for (let y = base - alto; y <= base; y++) { const xx = x + Math.round(Math.sin((base - y) * 0.04 + k) * 2); R.pset(xx - 1, y, MATO[0]); R.pset(xx, y, (y + k) % 3 ? MATO[1] : MATO[0]); R.pset(xx + 1, y, (y + k) % 3 === 1 ? MATO[2] : MATO[1]); R.pset(xx + 2, y, MATO[3]); }
  const cx = x + Math.round(Math.sin(alto * 0.04 + k) * 2), cy = base - alto, m = Math.sin(t * 1.3 + k) * 0.06;
  for (let f = 0; f < 15; f++) { const g = -Math.PI * 1.08 + f * Math.PI * 1.16 / 14 + m * (1 + f % 3), L = 12 + ((f * 7) % 5), sol = Math.cos(g) > 0.2;
    for (let i = 1; i < L; i++) { const px = Math.round(cx + Math.cos(g) * i), py = Math.round(cy + Math.sin(g) * i * 0.8 + i * i * 0.04); const ab = i > L - 5 ? 1 : 0;
      for (let q = -ab; q <= ab + (i < 4 ? 1 : 0); q++) R.pset(px - Math.round(Math.sin(g) * q), py + Math.round(Math.cos(g) * q * 0.5) + (q > 0 ? 1 : 0), MATO[q > 0 ? 0 : 1]);
      if (sol && i > 3) R.pset(px, py - 1, i % 2 ? MATO[6] : MATO[5]); } }
  R.disco(cx + 1, cy + 1, 2, MATO[0]); R.pset(cx + 2, cy, MATO[4]);
};
const caboFijo = () => {
  // el cielo del alba: tramado del índigo al oro, con el halo del sol
  for (let y = 0; y < HOR; y++) for (let x = 0; x < 320; x++) { const g = Math.max(0, 1 - Math.hypot((x - SX) * 0.48, (y - SY) * 1.3) / 120);
    R.pset(x, y, tono(CIELO, Math.pow(y / HOR, 1.15) * 13.2 + g * 4.2 + (ruido(x * 0.04, y * 0.15) - 0.5) * 0.5, x, y)); }
  // el sol que asoma (la mitad de arriba) con su borde encendido
  for (let y = SY - 9; y < HOR; y++) for (let x = SX - 10; x <= SX + 10; x++) { const d = Math.hypot(x - SX, y - SY); if (d < 9.5) R.pset(x, y, d > 8 ? hex('#ffd890') : y < SY - 5 ? hex('#fff8e0') : hex('#fff0c0')); }
  // el mar: una banda tras la costa, del lila al oro, con el camino del sol
  for (let y = HOR; y < 120; y++) for (let x = 0; x < 320; x++) { const g = Math.max(0, 1 - Math.abs(x - SX) / (40 + (y - HOR) * 10)); R.pset(x, y, tono(MAR, 4.6 - (y - HOR) * 0.32 + g * 2.8 + (ruido(x * 0.3, y) - 0.5) * 0.6, x, y)); }
  R.rect(0, HOR, 319, HOR, hex('#f0a880'));
  // la costa del cabo: el matorral lejano (oscuro, con el borde encendido por el alba), la laguna que refleja el cielo con
  // sus juncos, el monte bajo de palmitos con las puntas rosadas y el camino de arena
  for (let x = 0; x < 320; x++) { const top = 117 + Math.round(ruido(x * 0.15, 3) * 3 + Math.max(0, Math.sin(x * 0.07)) * 1.5), sol = Math.max(0, 1 - Math.abs(x - SX) / 160);
    for (let y = top; y < 125; y++) { let v = 0.9 + (ruido(x * 0.25, y * 0.4) - 0.5) * 1.6 + sol * 0.9; if (y === top) v = 5.2 + sol; else if (y === top + 1) v = 3.4; R.pset(x, y, tono(MATO, v, x, y)); }
    for (let y = 125; y < 133; y++) { const g = Math.max(0, 1 - Math.abs(x - SX) / (24 + (y - 125) * 5)); R.pset(x, y, tono(MAR, 3.4 - (y - 125) * 0.14 + g * 3.2 + (ruido(x * 0.2, y * 0.9) - 0.5) * 0.9, x, y)); }
    R.pset(x, 125, MATO[2]);
    for (let y = 133; y < 141; y++) R.pset(x, y, tono(MATO, 1.1 + (y - 133) * 0.22 + (ruido(x * 0.18, y * 0.3) - 0.5) * 2.2 + sol * 0.7, x, y)); }
  for (let k = 0; k < 70; k++) { const x = Math.round(hs(k, 5, 2) * 320), y = 127 + Math.round(hs(k, 6, 2) * 5), alto = 2 + Math.round(hs(k, 7, 2) * 3); for (let i = 0; i < alto; i++) R.pset(x + (i > 2 ? 1 : 0), y - i, i === alto - 1 ? MATO[4] : MATO[1]); }
  for (let k = 0; k < 34; k++) { const x = Math.round(hs(k, 8, 2) * 330) - 5, y = 134 + Math.round(hs(k, 9, 2) * 5), w = 4 + Math.round(hs(k, 10, 2) * 4);
    for (let f = 0; f < 6; f++) { const g = -Math.PI * 0.92 + f * Math.PI * 0.84 / 5; for (let i = 0; i < w; i++) { const px = Math.round(x + Math.cos(g) * i), py = Math.round(y + Math.sin(g) * i * 0.75); R.pset(px, py, i >= w - 2 && Math.cos(g) > -0.3 ? MATO[5] : i > w / 2 ? MATO[2] : MATO[1]); } } }
  // la pista de arena de detrás de la duna, entre el monte bajo, con sus rodadas
  for (let x = 0; x < 320; x++) { const y0 = 135 + Math.round(Math.sin(x * 0.03 + 1) * 0.6); for (let y = y0; y < y0 + 3; y++) R.pset(x, y, tono(ARENA, 1.4 + (y - y0) * 0.4 + (ruido(x * 0.4, y) - 0.5) * 1.2, x, y)); if (x % 5 < 3) R.pset(x, y0 + 1, ARENA[0]); }
  for (let x = 0; x < 320; x++) { const y0 = 140 + Math.round(Math.sin(x * 0.02) * 1.5); for (let y = y0; y < y0 + 5; y++) R.pset(x, y, tono(ARENA, 2.4 + (y - y0) * 0.3 + (ruido(x * 0.3, y) - 0.5), x, y)); if (x % 7 < 4) { R.pset(x, y0 + 1, ARENA[1]); R.pset(x, y0 + 3, ARENA[1]); } }
  // la torre de servicio retirada, roja, en celosía, con sus plataformas, sus focos y los raíles hasta la rampa
  R.rect(56, 120, 132, 121, hex('#3a3440')); R.rect(56, 120, 132, 120, hex('#8a7a88'));
  for (let y = 60; y <= 120; y++) for (const x of [64, 70, 78, 84]) R.pset(x, y, TORRE[x === 84 ? 1 : 3]);
  for (let y = 66; y <= 116; y += 9) { R.rect(63, y, 85, y, TORRE[4]); R.rect(63, y + 1, 85, y + 1, TORRE[1]); for (let i = 0; i < 6; i++) { R.pset(65 + i, y + 2 + i, TORRE[2]); R.pset(77 - i, y + 2 + i, TORRE[2]); R.pset(79 + i % 5, y + 2 + i, TORRE[1]); } }
  R.rect(58, 56, 90, 58, TORRE[3]); R.rect(58, 59, 90, 59, TORRE[0]); R.linea(90, 58, 98, 52, TORRE[2]); R.linea(98, 52, 98, 62, hex('#6a6070'));
  // el mástil umbilical gris junto a la rampa, la rampa de hormigón y el foso de las llamas
  for (let y = 84; y <= 121; y++) { R.pset(118, y, hex('#9a96a8')); R.pset(121, y, hex('#5e5a6c')); if (y % 4 === 0) { R.pset(119, y, hex('#7a7688')); R.pset(120, y + 1, hex('#7a7688')); } }
  R.rect(92, 119, 132, 123, hex('#2e2836')); R.rect(93, 119, 131, 121, hex('#c8b0b4')); R.rect(93, 119, 131, 119, hex('#f0d8d0')); R.rect(104, 121, 118, 123, hex('#1a1622'));
  // las torres de los focos, el búnker (cúpula de hormigón), el depósito de agua y el faro de bandas
  for (const x of [44, 150]) { R.rect(x, 72, x + 1, 121, hex('#4a4456')); R.pset(x, 72, hex('#8a8098')); for (let i = 0; i < 4; i++) R.rect(x - 3 + i * 2, 68, x - 2 + i * 2, 70, hex('#3a3444')); }
  for (let y = 111; y <= 121; y++) for (let x = 152; x <= 178; x++) { const e = ((x - 165) / 13) ** 2 + ((y - 121) / 10) ** 2; if (e < 1) R.pset(x, y, tono(rampa('#4a3c48 #7a6470 #a88a90 #d8b4b0 #f4d0c0'), 1 + (1 - e) * 1.6 + (x > 168 ? 1.2 : 0) - (y > 118 ? 0.8 : 0), x, y)); }
  R.rect(158, 118, 172, 118, hex('#1a1620'));
  { const x = 214; R.linea(x - 5, 121, x - 3, 104, MATO[2]); R.linea(x + 5, 121, x + 3, 104, MATO[2]); R.linea(x - 4, 113, x + 4, 113, MATO[2]); for (let y = 96; y <= 104; y++) for (let i = -7; i <= 7; i++) if ((i / 7) ** 2 + ((y - 100) / 4.5) ** 2 < 1) R.pset(x + i, y, tono(rampa('#3a3444 #6a5a68 #a88690 #e8bcb0'), 1 + (i > 2 ? 1.4 : 0) + (y < 98 ? 1 : 0), x + i, y)); }
  { const x = 238; for (let y = 88; y <= 121; y++) { const w = 2 + Math.round((y - 88) / 16); for (let i = -w; i <= w; i++) R.pset(x + i, y, (Math.floor((y - 88) / 5) % 2 ? hex('#2a2430') : hex('#e8dcd8'))); R.pset(x + w, y, hex('#1a1620')); }
    R.rect(x - 4, 86, x + 4, 87, hex('#2a2430')); R.rect(x - 2, 81, x + 2, 85, hex('#3a3440')); R.rect(x - 1, 82, x + 1, 84, hex('#f8e8a0')); R.rect(x - 2, 80, x + 2, 80, hex('#2a2430')); R.pset(x, 79, hex('#2a2430')); }
  for (const [x, h] of [[14, 14], [272, 11]]) { for (let y = 121 - h; y <= 121; y++) { R.pset(x, y, MATO[3]); R.pset(x + 4, y, MATO[3]); if (y % 3 === 0) R.rect(x, y, x + 4, y, MATO[3]); } }
  // los postes del teléfono a lo largo del camino, con sus hilos
  const postes = [-10, 76, 162, 248, 334];
  for (const x of postes) { R.rect(x, 114, x + 1, 143, MATO[1]); R.pset(x + 1, 114, MATO[5]); R.rect(x - 4, 116, x + 5, 116, MATO[1]); R.pset(x - 4, 115, MATO[4]); R.pset(x + 5, 115, MATO[4]); }
  for (let k = 0; k < postes.length - 1; k++) for (const dy of [116, 119]) for (let x = postes[k]; x <= postes[k + 1]; x++) { const u = (x - postes[k]) / 86; R.pset(x, Math.round(dy + Math.sin(u * Math.PI) * 4), hex('#2a2434')); }
  // la duna de delante con sus ondas, huellas y conchas
  for (let y = 146; y < 180; y++) for (let x = 0; x < 320; x++) { const v = 1.2 + (y - 146) * 0.13 + Math.max(0, 1 - Math.abs(x - SX) / 200) * 1.4 + (ruido(x * 0.06, y * 0.2) - 0.5) * 1.6 - (Math.sin(x * 0.18 + y * 0.9) > 0.92 ? 1 : 0); R.pset(x, y, tono(ARENA, v, x, y)); }

    po([[x, y], [x + 6, y], [x + 6 + sw, y + 7], [x + sw, y + 7]], c); li(x, y, x + sw, y + 7, C.k); }
  // la red amontonada a popa con sus boyas naranjas y las cajas de pescado
  for (let y = W - 32; y < W - 19; y++) for (let x = 176; x < 206; x++) { const d = ((x - 191) / 15) ** 2 + ((y - (W - 19)) / 13) ** 2; if (d < 1) ps(x, y, (x + y) % 3 === 0 ? hex('#2a4a3a') : (x - y) % 4 === 0 ? hex('#6a9a6a') : hex('#3e6a4e')); }
  for (const [x, y] of [[182, W - 29], [192, W - 31], [200, W - 27]]) { di(x, y, 2, C.k); di(x, y, 1.4, hex('#f08a2a')); ps(x - 1, y - 1, hex('#ffc080')); }
  re(222, W - 28, 234, W - 20, C.k); re(223, W - 27, 233, W - 21, hex('#a87a4a')); re(223, W - 24, 233, W - 24, hex('#7a5232'));
};
const casco = (W, o, t) => {
  const { ps, re, di } = mov(o);
  const S = 172, B = 312, borda = (x) => Math.round(W - 20 - Math.max(0, (x - 230) / 82) ** 1.6 * 9);
  for (let x = S; x <= B; x++) { const top = borda(x), bot = x > 300 ? Math.round(W - (x - 300) * 2.2) : x < 176 ? W - (176 - x) : W;
    for (let y = top; y <= bot; y++) { let col; if (y === top) col = hex('#e8e4d6'); else if (y === top + 1) col = hex('#123038'); else if (y >= bot - 1) col = hex('#a83a2a'); else col = tono(CASCO, 3 - (y - top) / 7 + (by(x, y) - 0.5) * 0.4, x, y); if (x === S || x === B) col = hex('#0e2228'); ps(x, y, col); } }
  for (let x = S; x <= B; x++) { ps(x, borda(x) + 4, hex('#3a7a88')); if (x % 23 === 5) for (let j = 6; j < 12; j++) ps(x, borda(x) + j, hex('#7a4a3a')); }
  for (const px of [292, 300]) { di(px, borda(px) + 8, 1.5, hex('#c8d0d8')); ps(px, borda(px) + 8, hex('#3a4a5a')); }
  re(303, borda(303) + 3, 306, borda(303) + 5, hex('#2a2a30'));
  // la espuma que levanta el casco a lo largo de la línea de flotación
  for (let x = S + 4; x < B - 4; x += 1) if (hs(x, Math.floor(t * 8), 61) < 0.18) ps(x, W + 1, hex('#e8f6fa'));
};
// la estela: espuma que el pesquero va dejando en el agua (en su sitio del mar, no pegada al barco): el surco del centro
// y los dos brazos de la uve, que se abren (el de arriba aplastado por la distancia) y se apagan
const estela = (t) => {
  const W0 = 165, Sx = (tt) => 170 + oBarco(tt);
  for (let i = 1; i < 96; i++) { const s = i / 15, x = Math.round(Sx(t - s)), apaga = 1 - s / 6.4; if (x < -6) break;
    const ondula = Math.sin(t * 3 + i * 0.9);
    // el surco revuelto del centro
    for (let j = 0; j < 3; j++) { const xx = x - j, yy = W0 + 1 + Math.round(ondula * 0.6 * Math.min(1, s)); if (by(xx, yy + i) < apaga * (s < 0.8 ? 1 : 0.7)) R.pset(xx, yy, s < 1.2 ? hex('#f4fbff') : hex('#cfe8f2')); }
    // los brazos de la uve
    const yUp = Math.round(W0 - 1 - s * 1.7), yDn = Math.round(W0 + 3 + s * 2.6);
    if (by(x, yUp) < apaga * 0.9) { R.pset(x, yUp, hex('#d8eef6')); R.pset(x - 1, yUp, hex('#a8d4e6')); }
    if (yDn < 180 && by(x, yDn) < apaga) { R.pset(x, yDn, hex('#eaf6fb')); R.pset(x - 1, yDn, hex('#bcdcea')); if (s > 1.5 && i % 3 === 0) R.pset(x, yDn + 1, hex('#5aa8c8')); } }
};
// la tormenta que crece: g (0–1) cuánto ha crecido
const crecida = (t) => suave(lin(t, P4, P4 + 4.8));
const NUBE5 = ['#4a5878', '#6a7c9e', '#93a5c0', '#bfcde0', '#e4ecf5'].map((c) => hex(c) >>> 0);
const OSCURO = ['#1c2234', '#262e46', '#323c58', '#4a5878', '#6a7c9e', '#93a5c0', '#bfcde0', '#e4ecf5'].map(hex);
const iTORRE = new Map(NUBE5.map((c, i) => [c, i + 3]));
// la panza de la nube se oscurece por debajo a medida que crece (sobre lo que ha pintado el decorado)
const oscurece = (t, c, g) => {
  const e = suave(c), alto = 14 + (102 - 36 - 14) * e, top = 102 - alto, BF = R.buf;
  for (let y = Math.max(16, Math.floor(top)); y <= 104; y++) { const v = (y - top) / alto; if (v < 0.25) continue; const k = g * 3.4 * ((v - 0.25) / 0.75) ** 1.3;
    for (let x = 40; x < 236; x++) { const p = y * 320 + x, i = iTORRE.get(BF[p] >>> 0); if (i === undefined) continue; let l = i - Math.floor(k + by(x, y) * 0.9); if (l < 0) l = 0; BF[p] = OSCURO[l]; } }
};
// el cielo de antes de la tormenta: cirros que el yunque escupe hacia fuera y un cielo aborregado arriba a la izquierda
const cieloAviso = (t, g) => {
  for (let k = 0; k < 6; k++) { const lado = k % 2 ? 1 : -1, y = 19 + k * 3, L = Math.round((16 + (k * 11) % 18) * (0.3 + 0.9 * g)), v = 2 + k * 0.5,
      x0 = 118 + lado * (30 + ((t * v + k * 23) % 40));
    for (let i = 0; i < L; i++) { const x = Math.round(x0 + lado * i), yy = y + Math.round(Math.sin(i * 0.15 + k) * 1.2 + i * 0.06 * lado * (k % 3 - 1));
      if (x < 0 || x > 319 || (x > 271 && yy < 48) || (x - 226) ** 2 + (yy - 30) ** 2 < 26 * 26 || hs(i >> 1, k, 78) < 0.3) continue;
      const a = Math.sin(i / L * Math.PI) * (0.35 + 0.45 * g); if (by(x, yy) < a) { aclara(x, yy, hex('#eef6fc'), 0.55); if (i % 5 === 0) aclara(x + lado, yy + 1, hex('#c4daee'), 0.4); } } }
  for (let j = 0; j < 4; j++) for (let i = 0; i < 12; i++) { const x = Math.round(8 + i * 7 + j * 3 + ((t * 0.8) % 7)), y = 19 + j * 5 + (i % 2); if (x > 100) continue; const a = (0.3 + 0.4 * g) * Math.sin((i + 0.5) / 12 * Math.PI);
    if (hs(i, j, 71) < a + 0.2) { aclara(x, y, hex('#f0f6fc'), 0.6 * a + 0.2); aclara(x + 1, y, hex('#f0f6fc'), 0.4 * a); aclara(x, y + 1, hex('#9cbcdc'), 0.4 * a); } }
  // tres torrecitas nuevas que nacen en la línea del horizonte, a la izquierda (las bandas que alimentan el huracán)
  for (let k = 0; k < 3; k++) { const cx = 20 + k * 26, hh = 2 + (4 + k * 2.5) * g + Math.sin(t * 0.7 + k) * 0.5, b = 109, S3 = [hex('#a6bcd4'), hex('#d8e4f0'), C.blanco];
    const bolas = [[-6, 0, 3], [0, 0, 3.5], [6, 0, 3], [-3, hh * 0.55, 3], [3, hh * 0.6, 3], [0, hh, 2.6]];
    for (let l = 0; l < 3; l++) for (const [dx, dy, r] of bolas) { const rr = Math.max(1, r * (0.7 + 0.3 * g) - l * 0.7 - (l === 2 ? 0.6 : 0)); R.disco(cx + dx + (l === 2 ? 1 : 0), Math.round(b - 3 - dy + (l === 0 ? 1 : l === 2 ? -1 : 0)), rr, S3[l]); }
    R.rect(cx - 9, b - 1, cx + 9, b - 1, hex('#8aa0bc')); }
};
// el mar de la izquierda: la sombra de la tormenta, rachas de viento que rizan el agua, borreguitos, sargazo y una tortuga
const marAviso = (t, g) => {
  const BF = R.buf;
  // la sombra de la tormenta sobre el agua, que se extiende al crecer
  for (let y = 113; y < 132; y++) { const ry = 19, w = (40 + 50 * g) * Math.sqrt(Math.max(0, 1 - ((y - 113) / ry) ** 2));
    for (let x = Math.max(0, Math.round(122 - w)); x < Math.min(320, Math.round(122 + w)); x++) if (by(x, y) < 0.25 + 0.45 * g) BF[y * 320 + x] = mezcla(BF[y * 320 + x], hex('#0c3a5a'), 0.35); }
  // rachas (zarpas de gato): manchas rizadas más oscuras que corren hacia la derecha, con algún borreguito
  for (let k = 0; k < 12; k++) { const f = 0.1 + hs(k, 1, 72) * 0.9, y0 = Math.round(118 + f * 56), x0 = ((hs(k, 2, 72) * 260 + t * (5 + 7 * f)) % 260) - 40, n = 6 + Math.round(f * 8);
    for (let i = 0; i < n; i++) { const x = Math.round(x0 + hs(k, i, 73) * (10 + 18 * f)), y = Math.round(y0 + (hs(k, i, 74) - 0.5) * (3 + 5 * f)); if (x < 0 || x > 175) continue;
      R.pset(x, y, hex('#145e82')); R.pset(x + 1, y, hex('#0f5276')); if (f > 0.5) R.pset(x + 2, y - 1, hex('#2a86b0')); }
    if (hs(k, Math.floor(t * 1.5), 75) < 0.25 + 0.5 * g) { const x = Math.round(x0 + 8), y = y0 - 1; if (x > 0 && x < 172) { R.rect(x, y, x + 2 + Math.round(f * 2), y, hex('#f2fbfc')); R.pset(x + 1, y - 1, hex('#ffffff')); } } }
  // matas de sargazo que flotan (quietas en el mar; el barco pasa por delante)
  for (const [x, y, s] of [[26, 146, 1], [84, 132, 0.7], [58, 168, 1.3], [146, 124, 0.6]]) { const b = Math.round(Math.sin(t * 2 + x) * 0.6);
    for (let i = 0; i < Math.round(9 * s); i++) { const dx = Math.round((hs(x, i, 76) - 0.5) * 14 * s), dy = Math.round((hs(y, i, 77) - 0.5) * 3 * s) + b;
      R.pset(x + dx, y + dy, i % 3 ? hex('#b08a2a') : hex('#6a5a1a')); R.pset(x + dx + 1, y + dy, hex('#d8b048')); }
    R.pset(x - Math.round(6 * s), y + 2 + b, hex('#0f5276')); R.pset(x + Math.round(6 * s), y + 2 + b, hex('#0f5276')); }
  // una tortuga que saca la cabeza a respirar y se vuelve a meter
  { const u = ((t - P4) % 3.6) / 1.6, x = 42, y = 156; if (u < 1) { const sube = Math.round(Math.sin(u * Math.PI) * 2.5);
      R.disco(x, y + 1, 4, hex('#3a5a3a')); R.rect(x - 3, y + 1, x + 3, y + 2, hex('#145e82')); R.pset(x - 1, y - 1, hex('#6a8a4a')); R.pset(x + 1, y, hex('#6a8a4a'));
      R.rect(x + 5, y - sube, x + 6, y + 1, hex('#5a7a4a')); R.pset(x + 6, y - sube, hex('#7a9a5a')); R.pset(x + 6, y - sube + 1, C.k);
      for (const d of [-6, 6]) R.pset(x + d + Math.round(u * 2 * Math.sign(d)), y + 2, hex('#f2fbfc')); } }
};
// el perro de la proa, de perfil (mirando a la derecha; se da la vuelta con el espejo). Colores: k contorno, H pelo,
// L lomo claro, O orejas, e ojo, R lengua, m boca, c collar
const PERRO_CUERPO = ['..kkkkkkkccHkk..', '..kLLLLLLHHHk...', '..kHHHHHHHHHk...', '..kHHkkkkkHHk...', '..kk.....kk.....'];
const PERRO_CABEZA = {
  alerta: ['..........kk....', '.........kOk....', '........kHHHkk..', '........kHeHHHHk', '........kHHHHHkk'],
  ladra: ['..........kk....', '.........kOk....', '........kHHHkk..', '........kHeHHHHk', '........kHHHkmmk'],
  vientoA: ['................', '................', '......kkkHHHkk..', '.....kOOkHeHHHHk', '........kHHHHHkR'],
  vientoB: ['................', '.......kk.......', '......kOkHHHkk..', '........kHeHHHHk', '........kHHHHHkR'],
};
const PERRO_TRISTE = ['................', '................', '................', '.........kkkk...', '........kHHHHkk.',
  '..kkkkkkOHeHHHHk', '..kLLLLLOHHHHHkk', '..kHHHHHHkkkk...', '..kHHkkkkkHHk...', '..kk.....kk.....'];
const PERRO_PAL = { k: hex('#2a1e18'), O: hex('#8a5a2a'), H: hex('#d8a05a'), L: hex('#f0c88a'), e: C.k, R: hex('#e87a8a'), m: hex('#7a2a2a'), c: hex('#c83a3a') };
const ladrido1 = nadie + 0.05, ladrido2 = a(0.8801) + 0.05;   // «anyone» y «on the ground»
const salta0 = antes + 0.12, salta1 = antes + 0.42;          // el salto de la proa al techo de la caseta
const p4 = (t) => {
  const g = crecida(t), c = lerp(0.45, 1, g);
  T.maquinaCalor(R, t, { crece: c, boya: false, barco: false });
  oscurece(t, c, g);
  cieloAviso(t, g);
  marAviso(t, g);
  const o = Math.round(oBarco(t)), W = 164 + Math.round(Math.sin(t * 1.7) * 1);
  estela(t);
  barca(t, W, o);
  // el perro (el gag): va en la proa mirando adelante con la lengua fuera y las orejas al viento; en «before anyone» se
  // da la vuelta hacia la tormenta (a la izquierda), salta al techo de la caseta y desde allí, recortado contra el cielo,
  // ladra hacia la torre de nubes en «anyone» (con su «!») y otra vez en «on the ground»; nadie le hace caso, y en «knows
  // it exists» baja las orejas y la cabeza y mira al patrón, que se encoge de hombros
  { const gira = t >= antes, triste = t > sabe + 0.2, ladra = entre(t, ladrido1, ladrido1 + 0.24) || entre(t, ladrido2, ladrido2 + 0.24);
    const u = suave(lin(t, salta0, salta1)), px = Math.round(lerp(288, 252, u)) + o, py = Math.round(lerp(W - 35, W - 70, u) - Math.sin(u * Math.PI) * 10);
    const cab = triste ? null : ladra ? PERRO_CABEZA.ladra : gira ? PERRO_CABEZA.alerta : (Math.floor(t * 6) % 2 ? PERRO_CABEZA.vientoA : PERRO_CABEZA.vientoB);
    let filas = triste ? PERRO_TRISTE : [...cab, ...PERRO_CUERPO];
    // en el aire, las patas estiradas
    if (u > 0 && u < 1) filas = [...filas.slice(0, 9), '.kk.......kk....'];
    if (gira) filas = filas.map((f) => [...f].reverse().join(''));
    pinta(filas, px, py, PERRO_PAL);

    { const m = Math.sin(t * (ladra ? 26 : gira ? 14 : 9)) > 0 ? 1 : 0, cx = gira ? px + 14 : px + 1;
      if (triste) { R.pset(cx, py + 7, PERRO_PAL.k); R.pset(cx + (gira ? 1 : -1), py + 8, PERRO_PAL.k); }
      else { R.pset(cx, py + 4 - m, PERRO_PAL.k); R.pset(cx + (gira ? 1 : -1), py + 3 - m, PERRO_PAL.O); } }
    // los ladridos: tres rayitas en abanico que salen de la boca hacia la tormenta, y el «!» de ese lado
    if (ladra) { const t0 = t < ladrido2 ? ladrido1 : ladrido2, e = Math.floor((t - t0) * 14) % 3;
      for (let k = 0; k < 3; k++) { const x0 = px - 1 - e, y0 = py + 1 + k * 2; R.linea(x0, y0, x0 - 3, y0 - 2 + k, C.blanco); R.linea(x0, y0 + 1, x0 - 3, y0 - 1 + k, hex('#2a1e18')); } }
    if (entre(t, ladrido1 - 0.05, ladrido1 + 0.8) || entre(t, ladrido2, ladrido2 + 0.6)) R.bocadillo(px + 5, py - 3 - Math.round(Math.sin(lin(t, ladrido1, ladrido1 + 0.2) * Math.PI) * 2), {}); }
  // el marinero remienda la red silbando (las notas suben); el patrón toma café en la puerta y mira con los prismáticos
  R.actor(EL.navegante, 190 + o, W - 15, t, { dir: 1, dedo: Math.sin(t * 5) > 0, sonrisa: true, pal: { C: hex('#3a5a8a'), c: hex('#2a4468'), W: hex('#3a5a8a') }, tocado: 'gorra' });
  for (let k = 0; k < 3; k++) { const u = ((t * 0.5 + k / 3) % 1), x = Math.round(206 + o + u * 12 + Math.sin(u * 8 + k) * 2), y = Math.round(W - 44 - u * 18); if (u > 0.85) continue; R.rect(x, y - 3, x, y, hex('#1e2a3a')); R.pset(x - 1, y, hex('#1e2a3a')); R.pset(x + 1, y - 3, hex('#1e2a3a')); R.pset(x + 2, y - 2, hex('#1e2a3a')); }
  const mira = entre(t, antes, sabe + 0.1), encoge = entre(t, sabe + 0.15, existe + 0.5), bebe = !mira && !encoge && (t % 2.4) < 0.9;
  const rp = R.actor(EL.oficial, 230 + o, W - 14, t, { dir: 1, dedo: mira || bebe, brazos: encoge, sonrisa: !mira, habla: entre(t, existe + 0.5, existe + 1.1) && parp(t, 8), pal: { C: hex('#e8e4d8'), c: hex('#c0bcb0'), W: hex('#e8e4d8'), F: hex('#3a3a4a') }, tocado: 'general' });
  { const [mx, my] = rp.mano; if (mira) { R.rect(mx - 1, my - 2, mx + 3, my + 1, C.k); R.pset(mx, my - 1, hex('#5a6a9a')); R.pset(mx + 2, my - 1, hex('#5a6a9a')); }
    else if (bebe) { R.rect(mx - 1, my - 2, mx + 2, my + 2, C.k); R.rect(mx, my - 1, mx + 1, my + 1, hex('#f0ece0')); } }

  // una gaviota que da vueltas sobre el barco y se posa en la cruceta
  { const pos = t < sabe ? [Math.round(200 + o + Math.cos(t * 1.4) * 30), Math.round(W - 108 + Math.sin(t * 2.8) * 6)] : [Math.round(lerp(200 + oBarco(sabe) + Math.cos(sabe * 1.4) * 30, 220 + o, lin(t, sabe, sabe + 0.8))), Math.round(lerp(W - 108 + Math.sin(sabe * 2.8) * 6, W - 87, lin(t, sabe, sabe + 0.8)))];
    if (t < sabe + 0.8) R.gaviota(pos[0], pos[1], t, 1); else { R.rect(219 + o, W - 88, 222 + o, W - 86, hex('#f4f4f0')); R.pset(223 + o, W - 88, hex('#e8a040')); R.pset(219 + o, W - 87, hex('#8a8a90')); } }
};

const efectos = [[enciende, 'boom'], [despega - 0.1, 'jet', { dur: 2.8 }], [despega + 0.55, 'flash'],
  [suelta, 'pop'], [tirosW, 'brillo'], [fotos, 'flash'], [nubesW, 'bip'], [nubesW + 0.35, 'bip'], [orbitaW, 'papel'],
  [P3 + 0.4, 'whoosh'], [ve, 'flash'], [ve + 0.85, 'bip'], [gesta, 'pop'],
  [P4 + 0.1, 'ola'], [P4 + 0.3, 'motor', { dur: 3.2 }], [ladrido1, 'guau'], [ladrido2, 'guau'], [sabe + 0.2, 'ola'], [existe + 0.4, 'tic']];
// la barra pasa a 1961 cuando la voz dice «the very next year»
T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3], [P4, p4]], { cartela: '1960', efectos, año: (t) => (t < anioW ? 1960 : 1961) });
