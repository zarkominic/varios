<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recuento · plastilina</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
// Recuento (plastilina, 5,2 s). Va justo después de marcador-6: empieza con la misma cámara, el
// mismo marcador (ya con sus seis veredictos) y el átomo en la misma postura. Mientras se dice
// «Recuento:» el marcador sube y se aleja un poco y el átomo baja, para dejar sitio a los totales.
// [verdades]: las tres fichas ✓ saltan, en ola, y debajo aparece «3 ✓».
// [mentiras]: saltan las tres ✗ y aparece «· 3 ✗».
// [cuantas]: el átomo se estira y sobre él brota una gran «?» de plastilina. Después, todo quieto.
import { escena } from '/atomo/plato/escena.js';
import { crearPlato, calma, reaccionMarcador, QUIETO, COLOR, cl, mix, prog, ss, eio, eoc, muelle, brote } from '/atomo/plato/kits/plastilina.js';

const E = await escena('recuento');
const M = (k) => E.marca(k);
const RES = E.resultados ?? ['✓', '✗', '✗', '✓', '✓', '✗'];
const P = await crearPlato({
  piezas: ['glifo:3', 'ficha', 'glifo:·', 'glifo:3', 'ficha', 'glifo:?'],
  tablero: true,
  camara: { pos: [0, 6, 13], mira: [0, 1.4, 0.6], fov: 28, desenfoque: 30 },   // la de marcador.html
});

// ---------- dónde acaba marcador-6 (marcador.html con n = 6) ----------
const TAB_M = { pos: [-0.85, 1.45, 0.8], escala: 1.06, inclinacion: 0.8, giro: 0.05 };
const ATOMO_M = [4.0, 2.0, 0.8], A_ESC = 0.5;
const DUR_M = 3.2;
const tsM = Math.floor((DUR_M - QUIETO) * 12 + 1e-6) / 12;       // su último fotograma (quieto)
const tzM = calma(tsM, DUR_M);
const rM = reaccionMarcador(tsM, tzM, RES[5] === '✓');
const yM = ATOMO_M[1] + 0.03 * Math.sin(tzM * 2.0) + rM.dy;

// ---------- composición del recuento ----------
const TAB_R = { pos: [-0.95, 2.55, -0.3], escala: 0.92, inclinacion: 0.75, giro: 0.05 };
const ATOMO_R = [4.0, 1.8, 0.8];
const Y_TOT = 0.9, Z_TOT = 2.0, ROT_TOT = [-0.32, 0.0, 0.0];
// los totales: «3 ✓ · 3 ✗»
const TOTALES = [
  { i: 0, marca: 'verdades', x: -3.4, escala: 0.95, color: COLOR.CREMA },
  { i: 1, marca: 'verdades', x: -2.32, escala: 1.15, variante: '✓', retraso: 0.08 },
  { i: 2, marca: 'mentiras', x: -0.9, escala: 0.9, color: COLOR.CREMA, retraso: -0.08 },
  { i: 3, marca: 'mentiras', x: 0.55, escala: 0.95, color: COLOR.CREMA },
  { i: 4, marca: 'mentiras', x: 1.63, escala: 1.15, variante: '✗', retraso: 0.08 },
];

function dibujar(t) {
  const n = P.fotograma(t, E.duracion), ts = n / 12;
  const tz = calma(ts, E.duracion);          // reloj del reposo: frena y se para al final
  const en = E.energia(ts);
  P.limpiar();
  const mov = eio(prog(ts, 0.5, 1.3));      // «Recuento:»: todo pasa a su sitio
  const moviendo = ts > 0.45 && ts < 1.35;

  // ---------- el marcador: se recoloca y las fichas saltan en ola cuando se nombran ----------
  const orden = { '✓': 0, '✗': 0 };
  const celdas = RES.map((v) => {
    const k = orden[v]++;                                  // 0, 1, 2 dentro de su grupo
    const m = M(v === '✓' ? 'verdades' : 'mentiras');
    const pico = m - 0.17 + 0.085 * k;                     // la última llega arriba con la palabra
    const u = prog(ts, pico - 0.25, pico + 0.25);
    const alto = 0.85 * Math.sin(Math.PI * u);
    const aire = u > 0 && u < 1 ? Math.sin(Math.PI * u) : 0;
    const golpe = muelle(ts - (pico + 0.25), 3, 7);
    const prep = Math.sin(Math.PI * prog(ts, pico - 0.42, pico - 0.25));
    return { tipo: v, alto, aplastar: -0.25 * aire + 0.35 * golpe + 0.25 * prep, giro: 0.25 * Math.sin(2 * Math.PI * u) * (k % 2 ? -1 : 1) };
  });
  const toca = (m) => ts > M(m) - 0.5 && ts < M(m) + 0.5;
  const posT = TAB_M.pos.map((v, i) => mix(v, TAB_R.pos[i], mov));
  posT[1] += 0.12 * Math.sin(Math.PI * mov);              // lo levantan un poco al llevarlo
  P.tablero({
    pos: posT, escala: mix(TAB_M.escala, TAB_R.escala, mov),
    inclinacion: mix(TAB_M.inclinacion, TAB_R.inclinacion, mov), giro: TAB_M.giro,
    roll: -0.03 * Math.sin(Math.PI * mov), celdas, toque: moviendo || toca('verdades') || toca('mentiras'),
  });

  // ---------- los totales ----------
  for (const p of TOTALES) {
    const tm = M(p.marca) + (p.retraso ?? 0);
    const k = brote(ts, tm, 0.25, 0.16);
    if (k <= 0) continue;
    const u = prog(ts, tm - 0.25, tm);
    const st = 0.25 * Math.sin(Math.PI * u) - 0.15 * muelle(ts - tm, 2.6, 7);
    P.pieza(p.i, {
      pos: [p.x, Y_TOT + 0.25 * (1 - eoc(u)) + 0.02 * Math.sin(tz * 1.6 + p.i), Z_TOT],
      escala: p.escala * k, sq: [1 - 0.5 * st, 1 + st, 1], rot: [ROT_TOT[0], 0.05 * Math.sin(tz * 0.9 + p.i), 0.04 * Math.sin(tz * 1.1 + p.i * 2)],
      variante: p.variante ?? 0, color: p.color ?? 0, toque: ts < tm + 0.3,
    });
  }

  // ---------- el átomo: sigue donde lo dejó el marcador, baja a su sitio y levanta la «?» ----------
  const tq = M('cuantas');
  const kq = brote(ts, tq, 0.3, 0.12);
  const prep = Math.sin(Math.PI * prog(ts, tq - 0.45, tq - 0.2));     // se agacha
  const sube = Math.sin(Math.PI * prog(ts, tq - 0.2, tq + 0.3));       // se estira hacia arriba
  const asen = muelle(ts - (tq + 0.3), 2.4, 6);
  const mira = ss(tq - 0.4, tq, ts);
  const tzA = tzM + tz;                                                // su reloj sigue el del marcador
  const ay = mix(yM - 0.03 * Math.sin(tzM * 2.0), ATOMO_R[1], mov) + 0.03 * Math.sin(tzA * 2.0)
    + 0.04 * en - 0.08 * prep + 0.07 * sube + 0.1 * Math.sin(Math.PI * mov);
  const k = 0.08 * sube - 0.14 * prep - 0.08 * asen;
  const sqM = rM.sq.map((v) => mix(v, 1, mov));
  P.atomo({
    pos: [mix(ATOMO_M[0], ATOMO_R[0], mov), ay, mix(ATOMO_M[2], ATOMO_R[2], mov)], escala: A_ESC,
    yaw: mix(rM.yaw, -0.05, mira) + 0.1 * Math.sin(tz * 0.8) * mov, pitch: 0.08,
    roll: mix(rM.roll, 0.0, mov) + 0.05 * Math.sin(tz * 1.2) * mov - 0.08 * mira,
    sq: [sqM[0] * (1 - 0.5 * k), sqM[1] * (1 + k), sqM[2] * (1 - 0.5 * k)],
    energia: en, ts: rM.tsE + tz, toque: moviendo || (ts > tq - 0.5 && ts < tq + 0.5),
  });
  // la «?» brota por encima del átomo, sin tocar sus órbitas
  if (kq > 0) {
    const u = prog(ts, tq - 0.3, tq);
    const st = 0.3 * Math.sin(Math.PI * u) - 0.12 * muelle(ts - tq, 2.4, 6);
    P.pieza(5, {
      pos: [ATOMO_R[0] + 0.05, mix(ATOMO_R[1] + 1.25, ATOMO_R[1] + 1.88, eoc(u)) + 0.03 * Math.sin(tz * 1.5), ATOMO_R[2] + 0.1],
      escala: 1.0 * kq, sq: [1 - 0.4 * st, 1 + st, 1], rot: [-0.25, -0.15 + 0.06 * Math.sin(tz * 0.8), 0.12 * (1 - eoc(u)) - 0.05 + 0.04 * Math.sin(tz * 1.3)],
      color: COLOR.TERRACOTA, toque: ts < tq + 0.3,
    });
  }

  P.render(n);
}

E.iniciar(dibujar, { paso: 1 / 12 });
</script>
</body>
</html>
