  const x0 = Math.max(0, Math.floor(cx - w / 2 - h)), x1 = Math.min(319, Math.ceil(cx + w / 2 + h)), y0 = Math.max(0, Math.floor(by - h * 1.9));
  for (let y = y0; y <= Math.min(179, by); y++) for (let x = x0; x <= x1; x++) {

    for (const [bx, byy, r] of B) { const dx = (x - bx) / r, dy = (y - byy) / r, q = dx * dx + dy * dy; if (q < qm) { qm = q; nx = dx; ny = dy; } }

// 1 · el Atlántico de perfil

const CAU1 = hex('#4e9ab4'), CAU2 = hex('#8ad0e2'), QUILLA = hex('#08202c'), PEZ_LEJ = hex('#1a4a5e'), ALGA0 = hex('#1e4a3c'), ALGA1 = hex('#2a6248'), ALGA2 = hex('#3a7a52');
const MOTA0 = hex('#2e6478'), MOTA1 = hex('#6aa8bc'), MOTA2 = hex('#b8e4f0'), PEZ_C = hex('#7aa8b8'), PEZ_O = hex('#4a7888'), PEZ_L = hex('#a8d0dc'), PEZ_B = hex('#ffffff');
const rot = (cx, cy, ang, s = 1) => ([x, y]) => [Math.round(cx + (x * Math.cos(ang) - y * Math.sin(ang)) * s), Math.round(cy + (x * Math.sin(ang) + y * Math.cos(ang)) * s)];

// la escolta del convoy: una corbeta pequeña, con su cañón a proa

  R.linea(x + 2, wl - 8, x + 2, wl - 17, k); R.linea(x - 14, wl - 4, x + 2, wl - 16, hex('#4a4c52')); R.linea(x + 2, wl - 16, x + 16, wl - 6, hex('#4a4c52'));

// el submarino de perfil, proa a la derecha: casco en tres tonos con juntas de chapa, remaches e imbornales, cubierta

// un avión de patrulla bimotor, de perfil (d = hacia dónde va); ladeado, en mitad del giro, se le ven las alas

// 1 · el Atlántico de perfil: la amenaza sin el golpe
const p1 = (t) => {
