<script type="module">
// AK-GANCHO (frases 1–2), sin cartela. Siete planos; golpe «maquina+12.6» = corte seco al plano de las ruedas en «gears»:
// 1. la terraza griega de día (antigua taller 'cielo'): Hiparco junto a la esfera armilar; el artesano entra con la caja
//    de la máquina («someone built a machine»); Hiparco señala al Sol y el eclipse oscurece todo («eclipses»): sorpresa;
// 2. corte en «1901»: el terrón verde en la arena del naufragio; el brazo de lona del buzo sale de la mata, con su codo
//    («divers pulled it out»),
//    tira de él, lo frota («lump of green») y el rayo descubre la rueda dorada («Inside it were»);
// 3. corte seco en «gears»: las ruedas dentro de la caja, girando; en «cut by hand» una mano con una lima repasa un diente;
// 4. «It's called the Antikythera mechanism»: el mecanismo entero de frente; el artesano, de pie en el escabel del apoyo,
//    coge el pomo y gira la manivela (el contador avanza); Hiparco entra por la izquierda, habla y señala la esfera, que
//    brilla en «computer»;
// 5. «sponge divers who saw people»: el puerto de Simi de día (fondo local; otra vista que las del mar de ak-buzos): el
//    pueblo de casas neoclásicas en la ladera, el campanario, los molinos, dos caíques amarrados, el burro de las esponjas;
//    Stadiatis llega corriendo por el muelle con su casco de cobre y cuenta lo que ha visto (bocadillo: estatuas de pie en
//    el fondo del mar); al de las esponjas se le escapa la que limpiaba, que cae al agua («chof»), y el capitán «!»;
// 6. «a scientist who counted teeth… an eight-ton machine squeezed into a museum»: la investigadora cuenta dientes en el
//    monitor (bocadillo con la rueda y la cifra que sube) y el escáner entra por la puerta con un píxel de margen; los dos
//    se apartan hacia atrás, contra la mesa, y el escáner rueda por delante de ellos hasta su sitio;
// 7. «a calendar for the Olympic Games»: Olimpia de cerca: la pista con tramos rastrillados, huellas, piedras, grietas y
//    rodadas; tres atletas, de pie en la línea de salida, arrancan y cruzan las calles de delante con su sombra y su polvo; el primero
//    entra en la meta, donde dos jueces de púrpura (figurantes) le esperan con la palma; dos espectadores los animan.
import * as T from '/atomo/plato/escenas/ak-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('ak-gancho');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const K = hex('#17151d'), BL = hex('#f6f2ea'), GUANTE = '#5a8ad0', LONA = '#c8bc98';
const ease = (u) => u * u * (3 - 2 * u);
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
// lo que pasa por detrás de una pieza del decorado (la borda): guarda esos rectángulos, dibuja y los repone
const detras = (rects, dibuja) => {
  const g = rects.map(([x0, y0, x1, y1]) => { const v = []; for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) v.push(R.pget(x, y)); return v; });
  dibuja();
  rects.forEach(([x0, y0, x1, y1], k) => { let i = 0; for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) R.pset(x, y, g[k][i++]); });
};
// un fondo fijo propio, en su búfer (se pinta una vez)
const CAPAS = new Map();
const capa = (clave, dibuja) => { let b = CAPAS.get(clave); if (!b) { b = R.nuevo(); const prev = R.usar(b); dibuja(); R.usar(prev); R.recorte(null); CAPAS.set(clave, b); } R.copiar(b); };
// una burbuja de aire (r 1–3) con su brillo
const burbuja = (x, y, r) => { x = Math.round(x); y = Math.round(y); if (r <= 1) { R.pset(x, y, hex('#d8f0ff')); return; } R.disco(x, y, r, hex('#a8d8f0')); R.disco(x, y, r - 1, hex('#3a7aa8')); R.pset(x - 1, y - 1, BL); };
// un chorro de burbujas que sube desde (x, y) hasta yTope
const chorro = (x, y, yTope, t, n = 9, k = 0) => { for (let i = 0; i < n; i++) { const f = ((t * 0.9 + i / n + hh(i, k, 3)) % 1), yy = lerp(y, yTope, f); burbuja(x + Math.sin(t * 5 + i * 2) * (2 + f * 3), yy, f < 0.3 ? 1 : 1 + (i % 3)); } };
// bocadillo blanco con un icono dentro (cx, cy: centro; hx, hy: hacia dónde apunta el piquito)
const bocadillo = (cx, cy, w, hgt, hx, hy) => {
  R.disco(cx - w / 2 + 4, cy, hgt / 2 + 1, K); R.disco(cx + w / 2 - 4, cy, hgt / 2 + 1, K); R.rect(cx - w / 2 + 4, cy - hgt / 2 - 1, cx + w / 2 - 4, cy + hgt / 2 + 1, K);
  R.poligono([[cx - 3, cy + hgt / 2 - 1], [cx + 3, cy + hgt / 2 - 1], [hx, hy]], K);
  R.disco(cx - w / 2 + 4, cy, hgt / 2, BL); R.disco(cx + w / 2 - 4, cy, hgt / 2, BL); R.rect(cx - w / 2 + 4, cy - hgt / 2, cx + w / 2 - 4, cy + hgt / 2, BL);
  R.poligono([[cx - 2, cy + hgt / 2 - 1], [cx + 2, cy + hgt / 2 - 1], [hx, hy - 2]], BL);
};
// la exclamación de susto sobre una cabeza (u 0–1 la hace saltar)
const susto = (x, y, u) => { if (u <= 0) return; const dy = Math.round(Math.sin(Math.min(1, u) * Math.PI) * -3); R.disco(x, y + dy, 6, K); R.disco(x, y + dy, 5, hex('#f6e04a')); R.icono('!', x - 2, y - 4 + dy, hex('#c83a2a'), hex('#f6e04a'), 1); };

const A = (s) => en('maquina', (s - 0.5) / 14.497), B = (s) => en('nombre', (s - 17.598) / 16.197);
const P2 = A(6.1), P3 = A(13.1), P4 = B(17.6), P5 = B(22.62), P6 = B(26.36), P7 = B(31.72);
// 1 · el eclipse
const p1 = (t) => {
  const e = ease(tramo(t, A(2.4), A(4.7)));
  const o = { encuadre: 'taller', camara: 'cielo', luz: 'dia', eclipse: e };
  T.antigua(R, t, o);
  const u = tramo(t, A(2.4), A(3.7)), xa = Math.round(lerp(-18, 104, ease(u)));
  const a = R.actor(EL.artesanoAK, xa, 160, t, { dir: 1, anda: u > 0 && u < 1, sostiene: true, sorpresa: e > 0.85, sonrisa: t > A(5.5) });
  // la caja de madera de la máquina, en sus manos: tablas, la esfera de bronce y la manivela
  const [mx, my] = a.mano; R.rect(mx - 5, my - 8, mx + 6, my + 2, K); R.rect(mx - 4, my - 7, mx + 5, my + 1, hex('#8a5a34')); R.rect(mx - 4, my - 7, mx + 5, my - 6, hex('#b07a48'));
  R.disco(mx, my - 3, 2, hex('#c8963a')); R.pset(mx, my - 3, hex('#f0c868')); R.rect(mx + 6, my - 4, mx + 7, my - 3, hex('#c8963a'));
  const apunta = t > A(3.75);
  R.actor(EL.hiparcoAK, 142, 160, t, { dir: 1, dedo: apunta, habla: !apunta && Math.sin(t * 6) > 0.3, sorpresa: e > 0.85 && t < A(5.6), sonrisa: t > A(5.6) });
  T.antiguaDelante(R, t, o);
  susto(150, 118, tramo(t, A(4.75), A(5.2)));
};
// 2 · el terrón en la arena del naufragio; el brazo del buzo
const p2 = (t) => {
  const b = tramo(t, A(11.3), A(12.95));
  const o = { camara: 'terron', brillo: b };
  T.fondo(R, t, o);
  // el chorro de burbujas de la escafandra (fuera de cuadro a la izquierda)
  chorro(70 + Math.sin(t) * 2, 150, 24, t, 10, 1);
  const ent = ease(tramo(t, A(7.25), A(8.0))), tira = tramo(t, A(7.9), A(8.25)) - tramo(t, A(8.25), A(8.7));
  const frota = t > A(9.7) && t < A(11.2) ? Math.round(Math.sin(t * 14) * 2) : 0, susp = ease(tramo(t, A(11.9), A(12.4)));
  const wx = Math.round(133 - tira * 5 - susp * 8), wy = Math.round(115 + frota + susp * 4);
  // el hombro, tapado por la mata (112, 150); el brazo sale de las algas con el codo arriba a la izquierda y el antebrazo
  // en diagonal hacia el terrón (dos tramos de ~21 px): se ven unos 25–30 px de manga, el arranque tapado por la mata
  const hx = 112, hy = 150, wx2 = Math.round(lerp(hx + 3, wx, ent)), wy2 = Math.round(lerp(hy - 5, wy, ent));
  if (ent > 0) {
    const dx = wx2 - hx, dy = wy2 - hy, d = Math.hypot(dx, dy) || 1, L = Math.min(21, d * 0.56 + 0.5), off = Math.sqrt(Math.max(0, L * L - d * d / 4));
    T.brazo(R, hx, hy, wx2, wy2, LONA, 1, { codo: [Math.round(hx + dx / 2 + dy / d * off), Math.round(hy + dy / 2 - dx / d * off)] });
  }
  // la mata de posidonia de la que sale el brazo (el buzo, detrás, fuera de cuadro)
  for (let k = 0; k < 14; k++) { let x = 99 + k * 2, y = 166; for (let q = 0; q < 22 + (k % 3) * 5; q++) { x += Math.sin(t * 2 + k + q * 0.25) * 0.45 + (k - 4) * 0.04; y -= 1; R.pset(Math.round(x), y, q > 16 ? hex('#6aaa4a') : k % 2 ? hex('#3a7a3a') : hex('#2a6a30')); R.pset(Math.round(x) + 1, y, hex('#1e4a24')); } }
  // la arena que levanta el tirón
  const nube = tramo(t, A(8.0), A(9.2)); if (nube > 0 && nube < 1) for (let k = 0; k < 14; k++) { const a = k * 0.45, r = 6 + nube * 16; R.pset(Math.round(160 + Math.cos(a) * r * 1.6), Math.round(132 - Math.abs(Math.sin(a)) * r * 0.5), mez(hex('#c8b898'), hex('#2a6a9a'), nube)); }
  T.fondoDelante(R, t, o);
};
// 3 · las ruedas por dentro (golpe) y la lima
const p3 = (t) => {
  const o = { encuadre: 'caja', camara: 'dentro', giro: (t - P3) * 0.22 + 0.3 };
  T.maquina(R, t, o);
  const u = ease(tramo(t, A(14.15), A(14.6))) - ease(tramo(t, B(17.0), B(17.5)));
  if (u > 0) {
    const lima = t > A(14.6) && t < B(16.9) ? Math.round(Math.sin(t * 13) * 3) : 0, wx = Math.round(lerp(340, 288, u)) + lima, wy = 78 + Math.round(lima * 0.3);
    // la lima: hoja de acero rayada que va de la mano al diente de la ruedecita m
    R.linea(wx - 8, wy, wx - 22, wy - 4, K); R.linea(wx - 8, wy + 1, wx - 22, wy - 3, hex('#8a8e98')); R.linea(wx - 8, wy + 2, wx - 22, wy - 2, K);
    for (let k = 0; k < 6; k++) R.pset(wx - 10 - k * 2, wy - 1 - Math.round(k * 0.6), hex('#c8ccd4'));
    T.brazo(R, 332, 104, wx, wy, '#8a5a34', -1, { codo: [314, 96] });
    if (lima) for (let k = 0; k < 3; k++) { const f = (t * 3 + k / 3) % 1; R.pset(Math.round(wx - 23 - f * 6 + k), Math.round(wy - 2 + f * 14), hex('#f0c868')); }
  }
  T.maquinaDelante(R, t, o);
};
// 4 · el mecanismo entero de frente: el artesano, de pie en el escabel, gira la manivela; Hiparco entra y señala la esfera
const p4 = (t) => {
  // la manivela está quieta hasta que el artesano la coge (B 18.3) y luego gira cada vez más deprisa hasta 0,3 vueltas/s
  const g0 = B(18.3), dg = Math.max(0, t - g0), giro = 1.2 + (dg < 0.8 ? 0.3 * dg * dg / 1.6 : 0.3 * (dg - 0.4));
  const o = { encuadre: 'caja', giro, fecha: true };
  const geo = T.maquina(R, t, o);
  const u = tramo(t, B(17.7), B(18.9)), xh = Math.round(lerp(-18, 30, ease(u)));
  R.actor(EL.hiparcoAK, xh, 160, t, { dir: 1, anda: u > 0 && u < 1, habla: t > B(19.2) && t < B(20.5) && Math.sin(t * 7) > 0, dedo: t > B(20.9) && t < B(22.0), sonrisa: t > B(21.4) });
  // el artesano en el escabel, con la mano en el pomo (geo.agarre) en cuanto empieza a girar; antes la tiene en el pecho
  const ap = geo.apoyo;
  R.actor(EL.artesanoAK, ap.x, ap.suelo, t, { dir: ap.dir, sostiene: t > g0 - 0.25 ? geo.agarre : true, sonrisa: t > B(20.8), habla: t > B(19.6) && t < B(20.4) && Math.sin(t * 6) > 0.2 });
  T.maquinaDelante(R, t, o);
  // el destello en la esfera cuando dice «computer»
  const d = tramo(t, B(21.1), B(21.7)); if (d > 0 && d < 1) for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2, r = 46 + d * 10; R.pset(Math.round(194 + Math.cos(a) * r), Math.round(84 + Math.sin(a) * r), hex('#f0c868')); }
};
// 5 · el puerto de Simi de día (fondo local: el pueblo y el muelle en su búfer). Stadiatis llega corriendo por el muelle
// con su casco de cobre, cuenta lo que ha visto (bocadillo: estatuas de pie en el fondo del mar) y los otros dos se asustan;
// al de las esponjas se le escapa la que limpiaba, que cae al agua («chof»)
const DITH = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const CIELO5 = ['#5a98d8', '#78b0e4', '#9cc8ec', '#c4def2', '#e2eef6'].map(hex), ES_CIELO = new Set(CIELO5);
const colinaI = (x) => Math.round(28 + x * 0.21 + Math.sin(x * 0.07) * 3 + Math.max(0, x - 185) * 1.3);   // la ladera del pueblo
const colinaD = (x) => Math.round(94 - (x - 222) * 0.46 + Math.sin(x * 0.09) * 2);   // la de los molinos
// una casa neoclásica de Simi: muro de color con su luz y su sombra, frontón de teja con cornisa blanca y ventanas con
// contraventanas (unas abiertas)
const casa = (x, yb, w, h, k) => {
  const muros = ['#e8b860', '#f2e4c0', '#e8a890', '#a8c8d8', '#f6f0e4', '#f0d070', '#d8906a', '#c8d8b0'];
  const c = hex(muros[k % muros.length]), cs = mez(c, K, 0.25), cl = mez(c, BL, 0.4);
  R.rect(x, yb - h, x + w - 1, yb, c); R.rect(x + w - 2, yb - h, x + w - 1, yb, cs); R.rect(x, yb - h, x, yb, cl);
  const tej = hh(k, 3, 1) < 0.5 ? hex('#b8643a') : hex('#a04a2c');
  R.poligono([[x - 1, yb - h], [x + w / 2, yb - h - 4], [x + w, yb - h]], tej); R.linea(x - 1, yb - h, x + w, yb - h, hex('#fffaf0'));
  R.pset(Math.round(x + w / 2), yb - h - 2, hex('#fffaf0')); R.linea(Math.round(x + w / 2) + 1, yb - h - 3, x + w - 1, yb - h - 1, mez(tej, K, 0.3));
  const pers = hh(k, 4, 1) < 0.5 ? hex('#3a7a6a') : hex('#3a62a0');
  for (let fx = x + 2; fx + 2 < x + w - 1; fx += 4) for (let fy = yb - h + 3; fy + 3 < yb; fy += 5) {
    const ab = hh(fx, fy, 5) < 0.6; R.rect(fx, fy, fx + 1, fy + 2, ab ? hex('#2a2a3a') : pers);
    if (ab) { R.pset(fx - 1, fy, pers); R.pset(fx - 1, fy + 1, pers); R.pset(fx + 2, fy, pers); R.pset(fx + 2, fy + 1, pers); } else R.pset(fx, fy + 1, mez(pers, K, 0.3));
  }
};
const symiFijo = () => {
  // el cielo tramado (trama ordenada entre cinco azules, sin franjas)
  for (let y = 0; y < 104; y++) for (let x = 0; x < 320; x++) { const f = Math.min(3.999, y / 92 * 4), i = Math.floor(f); R.pset(x, y, CIELO5[i + ((f - i) * 16 > DITH[(y & 3) * 4 + (x & 3)] ? 1 : 0)]); }
  // la bocana: el mar abierto con una isla lejana en la bruma
  for (let y = 84; y < 104; y++) for (let x = 170; x < 260; x++) R.pset(x, y, y === 84 ? hex('#cfe6f4') : hh(x >> 2, y, 6) < 0.2 ? hex('#5a9ac8') : hex('#3a82b0'));
  R.poligono([[188, 85], [196, 80], [205, 79], [214, 82], [222, 85]], hex('#9ab0bc')); R.linea(196, 80, 205, 79, hex('#b8ccd4'));
  // las dos laderas: roca ocre con matorral, piedras y sendas
  for (let x = 0; x < 320; x++) { const y0 = Math.min(colinaI(x), x > 200 ? colinaD(x) : 999);
    for (let y = Math.max(0, y0); y < 104; y++) { const n = hh(x >> 1, y >> 1, 7); R.pset(x, y, y === y0 ? hex('#7a8a4a') : n < 0.2 ? hex('#7a8a4a') : n < 0.33 ? hex('#98825e') : n > 0.92 ? hex('#ddd0ac') : hex('#b8a27e')); } }
  for (let k = 0; k < 9; k++) { let x = 20 + hh(k, 1, 8) * 180, y = colinaI(x) + 3; for (let i = 0; i < 22; i++) { R.pset(Math.round(x), Math.round(y), hex('#d8c8a0')); x += 1; y += 0.45; } }   // sendas
  // las casas del pueblo, en filas que suben por la ladera (de atrás adelante)
  let k = 0;
  for (let r = 0; r < 9; r++) { const yb = 46 + r * 6; for (let x = (r % 2) * 7 - 5; x < 214;) { const w = 10 + Math.floor(hh(x, r, 9) * 6), h = 8 + Math.floor(hh(x, r, 10) * 4);
    const top = yb - h - 4, cabe = top >= Math.max(colinaI(x), colinaI(x + w)) + 1 && (x > 176 || top >= 24) && x + w < 212;
    if (cabe && hh(x, r, 11) > 0.12) casa(x, yb, w, h, k++); x += w + 1 + (hh(x, r, 12) < 0.2 ? 4 : 0); } }
  // en la ladera de la derecha, unas pocas casas y dos molinos de viento (las aspas giran aparte)
  for (const [x, yb, w, h] of [[226, 96, 12, 9], [240, 92, 14, 10], [270, 96, 12, 8], [286, 90, 14, 10], [302, 94, 13, 9]]) casa(x, yb, w, h, k++);
  for (const [x, yb] of [[246, colinaD(246) + 2], [264, colinaD(264) + 2]]) { R.rect(x - 4, yb - 13, x + 4, yb, K); R.rect(x - 3, yb - 12, x + 3, yb, hex('#f6f0e4')); R.rect(x + 2, yb - 12, x + 3, yb, hex('#d8d0c0'));
    R.poligono([[x - 5, yb - 13], [x, yb - 18], [x + 5, yb - 13]], hex('#8a5a34')); R.rect(x - 1, yb - 4, x, yb, hex('#5a3a22')); R.pset(x - 2, yb - 9, hex('#2a2a3a')); }
  // la capilla de cúpula azul en la ladera y el campanario blanco del puerto
  { const x = 92, y = 58; R.rect(x - 7, y, x + 7, y + 10, hex('#f6f0e4')); R.rect(x + 5, y, x + 7, y + 10, hex('#d8d0c0')); R.disco(x, y, 6, K); R.disco(x, y, 5, hex('#3a62b0')); R.disco(x - 2, y - 2, 2, hex('#6a92d8')); R.rect(x - 7, y, x + 7, y, hex('#d8d0c0')); R.rect(x, y - 9, x, y - 6, K); R.rect(x - 1, y - 8, x + 1, y - 8, K); R.rect(x - 1, y + 5, x + 1, y + 10, hex('#5a3a22')); }
  { const x = 150; R.rect(x - 6, 58, x + 6, 99, K); R.rect(x - 5, 59, x + 5, 99, hex('#f6f0e4')); R.rect(x + 3, 59, x + 5, 99, hex('#d8d0c0'));
    for (const y of [70, 84]) R.rect(x - 6, y, x + 6, y, hex('#d8d0c0'));
    R.rect(x - 3, 62, x + 2, 68, hex('#2a2a3a')); R.disco(x, 62, 2, hex('#2a2a3a')); R.rect(x - 1, 63, x, 66, hex('#c8963a')); R.pset(x - 1, 63, hex('#f0c868'));
    R.disco(x, 57, 4, K); R.disco(x, 57, 3, hex('#3a62b0')); R.pset(x - 1, 55, hex('#6a92d8')); R.rect(x - 6, 57, x + 6, 58, hex('#d8d0c0')); R.rect(x, 49, x, 53, K); R.rect(x - 1, 51, x + 1, 51, K);
    R.rect(x - 2, 90, x + 1, 99, hex('#5a3a22')); R.disco(x, 90, 2, hex('#5a3a22')); }
