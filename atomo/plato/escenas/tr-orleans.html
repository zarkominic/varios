const suave = (k) => 0.5 - 0.5 * Math.cos(Math.PI * k);
const p4 = (t) => {
  FONDO4();
  const fl = Math.sin(t * 13) * 0.5 + Math.sin(t * 7.3) * 0.5;
  // el resplandor de la vela, que tiembla con la llama
  for (let y = 0; y < 124; y++) for (let x = 0; x < 112; x++) { const d = Math.hypot(x - 44, (y - 56) * 1.15); if (d > 66) continue; R.pset(x, y, mezC(R.pget(x, y), H('#ffcf80'), (1 - d / 66) * (0.2 + fl * 0.06))); }
  // la llama (base azul, corazón blanco), el hilo de humo y la polilla que ronda la luz
  { const fx = 44 + (fl > 0.6 ? 1 : fl < -0.6 ? -1 : 0), fh = 9 + Math.round(fl);
    for (let j = 0; j < fh; j++) { const w = Math.round(Math.sin(((j + 1) / (fh + 1)) * Math.PI) * 2.6), yy = 58 - j, dx = j > fh - 4 ? Math.round(fl) : 0; for (let i = -w; i <= w; i++) R.pset(fx + i + dx, yy, Math.abs(i) < w && j > 1 && j < fh - 3 ? H('#fffbe0') : j < 2 ? H('#5a7ae0') : H('#ffb030')); }
    for (let k = 0; k < 9; k++) { const u = (t * 0.55 + k / 9) % 1, y = Math.round(47 - u * 26), x = Math.round(44 + Math.sin(u * 9 + t * 1.5) * (1 + u * 3)); R.pset(x, y, mezC(R.pget(x, y), H('#c8c0b8'), 0.55 * (1 - u))); }
    const am = t * 4.5, mx = Math.round(44 + Math.cos(am) * 15), my = Math.round(48 + Math.sin(am * 1.3) * 8), al = Math.floor(t * 18) % 2;
    R.pset(mx, my, H('#6a5a4a')); R.pset(mx, my + 1, H('#4a3a2a')); R.pset(mx - 1, my - al, H('#d8c8a8')); R.pset(mx + 1, my - al, H('#d8c8a8')); R.pset(mx - 2, my - al, H('#b8a888')); R.pset(mx + 2, my - al, H('#b8a888')); }
  // el reloj de arena: baja el montón de arriba, crece el de abajo
  { const k = lin(t, P4 - 0.5, P4 + 5.2);
    for (let y = 102; y <= 125; y++) { const top = y <= 113, half = Math.round(1 + Math.abs(113.5 - y) * 0.3), nivel = top ? 104 + Math.round(k * 8) : 125 - Math.round(k * 7); for (let x = 308 - half; x <= 308 + half; x++) { const arena = top ? y >= nivel : y >= nivel; R.pset(x, y, arena ? ((x + y) % 3 ? H('#d8b060') : H('#b89040')) : Math.abs(x - 308) === half ? H('#8a9aa8') : H('#3a3038')); } }
    for (let y = 114; y < 125 - Math.round(k * 7); y++) if ((y + Math.floor(t * 20)) % 3) R.pset(308, y, H('#f0c870'));
    R.pset(306, 105, H('#e8f0ff')); R.pset(306, 119, H('#e8f0ff')); }
  // el ratón que llega por el canto de la mesa y roe el pan
  { const km = lin(t, P4 - 0.3, P4 + 1.1), x = Math.round(lerp(116, 140, km)), y = 41, anda = km > 0 && km < 1, roe = !anda && Math.sin(t * 9) > 0 ? 1 : 0, pa = Math.floor(t * 12) % 2;
    for (let i = 0; i < 7; i++) R.pset(x - 5 - i, y + Math.round(Math.sin(t * 4 + i * 0.7)), H('#c89890'));
    R.pset(anda ? x - 3 + pa : x - 3, y + 2, K); R.pset(anda ? x + 1 - pa : x + 1, y + 2, K);
    R.rect(x - 5, y - 2, x + 2, y + 1, K); R.rect(x - 4, y - 1, x + 1, y, H('#8a8490')); R.pset(x - 3, y - 1, H('#a8a4b0'));
    R.rect(x + 2, y - 1 + roe, x + 5, y + 1 + roe, K); R.rect(x + 3, y + roe, x + 4, y + roe, H('#8a8490')); R.pset(x + 6, y + roe, H('#e8a0a8')); R.pset(x + 1, y - 3, H('#d8a8a8')); R.pset(x + 2, y - 3, K); }
  // el poema: los renglones que la pluma va dejando y el corazón al final
  EST.kc = 6; EST.xc = 101;
  for (const [k, a, b, fin] of RENG) { if (t >= b) { EST.kc = k + 1; EST.xc = 101; } else if (t >= a) { EST.kc = k; EST.xc = Math.round(lerp(102, fin, lin(t, a, b))); } }
  EST.cor = t > CORAZON4 + 0.15;
  carta4(suave(lin(t, DOBLA0, DOBLA0E)), suave(lin(t, DOBLA1, DOBLA1E)));
  if (t > CORAZON4 && !EST.cor) { glifo('corazon', 194, 125, rebote(t, CORAZON4, 2), H('#c8203a'), 1, H('#6a1020')); }
  if (t > CORAZON4) chispas(t, CORAZON4, 201, 131, H('#ffb0c0'));
  if (t > SELLA) { glifo('corazon', 177, 119, rebote(t, SELLA, 2), H('#b8202a'), 1, H('#5a0a10')); chispas(t, SELLA, 184, 124, H('#ffd0a0')); }
  if (t > TINT) { R.linea(256, 125, 264, 108, H('#f4f4ec')); R.linea(257, 125, 265, 108, H('#c8c8c0')); R.pset(263, 110, H('#ffffff')); R.pset(266, 110, H('#d8d8d0')); }
  if (t < COGE) sello(204, 147, false);
  // la mano (brazo canónico desde abajo a la derecha, con la manga azul del jubón)
  let px, py; const conPluma = t < TINT;
  if (conPluma) { const escribe = RENG.some(([, a, b]) => t >= a && t < b); const [tx, ty] = tramos(PLUMA, t); px = Math.round(tx) + 3; py = Math.round(ty) - 5 + (escribe ? Math.round(Math.sin(t * 40)) : 0); }
  else { let fx, fy;
    if (t >= DOBLA0 && t < DOBLA0E) { const k = suave(lin(t, DOBLA0, DOBLA0E)); fx = 182 + 46 * Math.cos(Math.PI * k); fy = 132 - 7 * Math.sin(Math.PI * k); }
    else if (t >= DOBLA1 && t < DOBLA1E) { const k = suave(lin(t, DOBLA1, DOBLA1E)); fx = 138 - 46 * Math.cos(Math.PI * k); fy = 132 - 7 * Math.sin(Math.PI * k); }
    else [fx, fy] = tramos(DEDOS, t);
    px = Math.round(fx) + 1; py = Math.round(fy) - 2;
    if (t >= COGE) sello(px - 3, py + 7, true); }
  // brazo corto y doblado: el codo bien marcado dentro del cuadro (antebrazo de ~25 px) y el hombro que baja al borde
  T.brazo(R, px + 40, 192, px + 12, py + 1, '#2a4fa8', -1, { codo: [px + 30, Math.min(170, py + 18)] });
  if (conPluma) { R.linea(px + 2, py + 1, px - 3, py + 5, K); R.linea(px + 2, py, px + 9, py - 12, H('#f4f4ec')); R.linea(px + 3, py, px + 10, py - 12, H('#c8c8c0')); R.pset(px + 8, py - 10, H('#ffffff')); }
  // la sombra del que escribe: su cuerpo, fuera de cuadro, tapa la vela y hunde en penumbra el borde de abajo; la manga
  // se pierde en ella, así que de brazo con luz se ven unos 40 px (la mano y el codo, siempre a la luz)
  { const sx = px + 40, y0 = Math.max(142, py + 22);
    for (let y = y0; y < 180; y++) { const k = Math.min(1, Math.pow((y - y0) / 16, 0.8)) * 0.97;
      for (let x = Math.max(0, sx - 62); x <= Math.min(319, sx + 60); x++) { const d = Math.abs(x - sx - (y - y0) * 0.3) / 60, lat = d >= 1 ? 0 : Math.min(1, (1 - d * d) * 1.8);
        if (lat > 0) R.pset(x, y, mezC(R.pget(x, y), H('#100806'), k * lat)); } } }
};

T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3], [P4, p4]], {
  cartela: '1415',
  efectos: [[CORAZON1, 'brillo'], [VUELO, 'whoosh'], [PRESO + 0.05, 'toc'],
    [RESBALA, 'chof'], [CAPTURA, 'toc'], [LLEVAN + 0.2, 'chof'], [RAYO, 'trueno'],
    [C0, 'lapiz'], [C1, 'brillo'], [PALOMA - 0.5, 'whoosh'], [CERROJO, 'cerrojo'],
    [P4 + 0.3, 'lapiz'], [P4 + 1.3, 'lapiz'], [O(0.9532), 'brillo'], [DOBLA1, 'papel'], [SELLA, 'sello']],
  año: (t) => (t < P3 ? 1415 : t < P4 ? Math.round(lerp(1415, 1440, lin(t, C0, C1))) : 1440),
});
</script>
