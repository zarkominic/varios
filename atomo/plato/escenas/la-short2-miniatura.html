<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Miniatura · ep16 · Short 2</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// LA-SHORT2-MINIATURA · la miniatura vertical del Short 2 del ep16 (la regla de no morir y su única excepción). Todo
// lo que cuenta va en la columna central x 110–210 (el 9:16), que se recorta al capturar. Arriba, en el recuadro dorado,
// la calavera tachada y, a su lado, el asterisco dorado de la excepción, con su halo. Abajo, el fondo del mar: el
// aspirante a pirata al doble, sonriente, presume con el cronómetro en la mano mientras le suben las burbujas. Sin
// palabras ni nada morboso: solo el chiste de presumir.
import { crearRoma } from '/atomo/plato/kits/pixel-roma.js';
import { conChibi, ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
import { hex } from '/atomo/plato/kits/pixel-retro.js';
import * as T from '/atomo/plato/escenas/la-comun.js';
const R = conChibi(await crearRoma(document.getElementById('lienzo')));
const capa = R.nuevo(), VACIO = 0x01020304;
// un personaje dibujado aparte y pegado al doble (como en la-miniatura.html)
const doble = (pinta, sx0, sx1, sy0, sy1, dx, dy) => { const prev = R.usar(capa); capa.fill(VACIO); const r = pinta(); R.usar(prev);
  for (let y = sy0; y <= sy1; y++) for (let x = sx0; x <= sx1; x++) { const c = capa[y * 320 + x]; if (c === VACIO) continue; R.rect(dx + (x - sx0) * 2, dy + (y - sy0) * 2, dx + (x - sx0) * 2 + 1, dy + (y - sy0) * 2 + 1, c); } return r; };
const marco = (x0, y0, x1, y1) => { const oro = hex('#e8b830'), oroS = hex('#8a5a10'), fondo = hex('#1a1030');
  R.rect(x0 - 2, y0 - 2, x1 + 2, y1 + 2, T.C.k); R.rect(x0 - 1, y0 - 1, x1 + 1, y1 + 1, oroS); R.rect(x0, y0, x1, y1, oro); R.rect(x0 + 3, y0 + 3, x1 - 3, y1 - 3, fondo); return fondo; };
const calavera = (cx, cy, fondo) => { const hueso = hex('#f2eee2'), hS = hex('#a8a090');
  R.disco(cx, cy - 4, 11, hueso); R.rect(cx - 7, cy + 4, cx + 7, cy + 11, hueso); R.rect(cx - 7, cy + 10, cx + 7, cy + 11, hS);
  R.disco(cx - 5, cy - 4, 3.6, fondo); R.disco(cx + 5, cy - 4, 3.6, fondo); R.rect(cx - 1, cy + 2, cx + 1, cy + 4, fondo);
  for (let i = -1; i <= 1; i++) R.rect(cx + i * 4, cy + 8, cx + i * 4, cy + 11, fondo);
  const rojo = hex('#e83a3a'), rojoS = hex('#7a1010');
  for (let k = -16; k <= 16; k++) for (const [a, c] of [[-2, rojoS], [-1, rojo], [0, rojo], [1, rojo], [2, rojoS]]) R.pset(cx + k, cy + 1 + k + a, c); };
const dibujar = (t) => {
  T.isla(R, t, { encuadre: 'fondo' });
  for (let k = 0; k < 12; k++) { const f = (k * 0.083) % 1, by = 144 - f * 80, bx = 168 + Math.sin(k * 2.1) * 6 + (k % 3 - 1) * 5; R.anillo(bx, by, k % 3 === 0 ? 3 : 2, hex('#c8e8f8')); }
  const r = doble(() => R.actor(EL.aspirante, 40, 80, t, { dir: 1, sostiene: true, quieto: true, sonrisa: true }), 22, 62, 40, 81, 118, 90);
  // el cronómetro, también al doble, en la mano que sostiene
  const mx = 118 + (r.mano[0] - 22) * 2, my = 90 + (r.mano[1] - 40) * 2; R.disco(mx + 2, my, 7, T.C.k); R.disco(mx + 2, my, 5.6, hex('#e0e4ea'));
  R.rect(mx + 1, my - 4, mx + 2, my, hex('#c83a3a')); R.rect(mx, my - 10, mx + 4, my - 8, T.C.k); R.rect(mx + 1, my - 10, mx + 3, my - 9, hex('#c8a040'));
  const fondo = marco(120, 6, 200, 48); calavera(146, 26, fondo);
  const ax = 178, ay = 27; R.halo(ax, ay, 14, [hex('#e8cc80'), hex('#f0dc98'), hex('#f8eab8')], 1);
  for (let k = 0; k < 3; k++) { const an = k * Math.PI / 3 + Math.PI / 2, dx = Math.cos(an) * 10, dy = Math.sin(an) * 10;
    for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) R.linea(ax - dx + ox, ay - dy + oy, ax + dx + ox, ay + dy + oy, hex('#f8c830')); }
};
window.__frame = async (t) => { dibujar(t); R.presentar(); };
window.__listo = true;
</script>
</body>
</html>
