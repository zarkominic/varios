<script type="module">
// TS-RESUMEN (frase 25), hoy, 2026. Cuatro planos (en los tres primeros Atom está en el plano y la esquina queda tranquila):
// 1. «So, if you think about it… any video game»: la estantería de Atom de cerca; Atom entra volando con un libro rojo,
//    se para a pensar («?» en «think»), el libro se abre en «Tetris» y de sus páginas suben, una a una, el terminal de
//    corchetes, el disquete y la estrella roja en «strangest story»; abajo, los libros siguen cayendo y encajan;
// 2. corta en «A game»: la pizarra de cerca: Atom dibuja con su luz el terminal y, en «no pictures», los corchetes verdes
//    en su pantalla; al lado, un cuadro con montaña y sol que tacha con una «X» roja; en «a man» el hombrecillo con su
//    bombilla; en «didn't own it» la estrella roja y su flecha que se lleva el terminal, «?» sobre el hombrecillo; en
//    «carried out» la flecha discontinua hacia fuera;
// 3. corta en «floppy»: el rincón de la pizarra en el estudio, de lejos, con su caballete; Atom toca la pizarra y sale el
//    disquete, que cruza la alambrada de tiza en «out of the country»; en «Moscow office» se dibuja el edificio de la
//    estrella; en «told the truth» el hombrecillo del maletín y el visto bueno verde; el gato cruza por delante y se sienta;
// 4. corta en «And it all»: la mesa del estudio de cerca: la bandeja con la fila de bloques de madera a la que le falta
//    uno; en «one simple rule» un «1»; la mano trae el último bloque y lo encaja en «Complete»; la fila brilla en «row»,
//    desaparece en chispas en «disappears» y la fila de encima baja; la taza humea, el flexo, el reloj.
import * as T from '/atomo/plato/escenas/ts-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('ts-resumen');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const PZ = T.PIEZAS_TS;
const H = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const mez = (c, d, k) => { const r = (c & 255) * (1 - k) + (d & 255) * k, g = ((c >> 8) & 255) * (1 - k) + ((d >> 8) & 255) * k, b = ((c >> 16) & 255) * (1 - k) + ((d >> 16) & 255) * k; return (0xff000000 | (Math.round(b) << 16) | (Math.round(g) << 8) | Math.round(r)) >>> 0; };
const K = hex('#14101a'), BLANCO = hex('#ffffff'), ORO = hex('#ffe890'), ORO2 = hex('#f0b840');
const oscurece = (x0, y0, x1, y1, k, col = K) => { for (let y = Math.max(0, y0); y <= Math.min(179, y1); y++) for (let x = Math.max(0, x0); x <= Math.min(319, x1); x++) R.pset(x, y, mez(R.pget(x, y), col, k)); };
const capa = (() => { const m = {}; return (clave, dibuja) => { if (!m[clave]) { const b = R.nuevo(), prev = R.usar(b); dibuja(); R.usar(prev); m[clave] = b; } R.copiar(m[clave]); }; })();
// el papel pintado del estudio: rayas granates con su florecilla, y la sombra de arriba
const papel = (x0, y0, x1, y1) => {
  const A = hex('#7a4a3a'), B = hex('#6c4032'), L = hex('#8c5a46'), D = hex('#5e3628');
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const r = Math.floor(x / 9) % 2; let c = r ? B : A;
    if (x % 9 === 0) c = D; else if (r && (x % 9 === 4) && ((y + Math.floor(x / 18) * 7) % 14 === 0)) c = L;
    else if (r && (x % 9 === 3 || x % 9 === 5) && ((y + Math.floor(x / 18) * 7) % 14 === 1)) c = L;
    else if (H(x, y, 3) < 0.05) c = mez(c, K, 0.18);
    R.pset(x, y, c);
  }
};
// madera con vetas (tablas horizontales de alto «tabla»)
const madera = (x0, y0, x1, y1, base, k = 0, tabla = 0) => {
  const S = mez(base, K, 0.28), L = mez(base, BLANCO, 0.16), D = mez(base, K, 0.5);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const v = Math.sin(x * 0.07 + Math.sin(y * 0.55 + k) * 2.4 + y * 0.9 + k * 3);
    let c = v > 0.88 ? S : v < -0.93 ? L : base;
    if (tabla && (y - y0) % tabla === 0) c = D;
    if (H(Math.floor(x / 3), y, k + 9) < 0.02) c = S;
    R.pset(x, y, c);
  }
};
// el brillo de Atom: halo tramado, chispas si se mueve, y el átomo
const atomo = (ax, ay, t, o = {}) => {
  ax = Math.round(ax); ay = Math.round(ay); const rr = o.halo ?? 19;
  for (let j = -rr - 1; j <= rr + 1; j++) for (let i = -rr - 1; i <= rr + 1; i++) { const g = 1 - Math.hypot(i, j) / rr; if (g > 0.3 && ((i + j) & 1 || g > 0.6)) R.pset(ax + i, ay + j, g > 0.7 ? R.PAL.GLOW[1] : R.PAL.GLOW[0]); }
  if (o.chispas) for (let k = 0; k < 10; k++) { const an = k * Math.PI / 5 + t * 4, q = rr - 2 + Math.sin(t * 9) * 2; R.pset(Math.round(ax + Math.cos(an) * q), Math.round(ay + Math.sin(an) * q), hex('#c8f0ff')); }
  R.atomo(ax, ay, t, { r: o.r ?? 14, orbita: R.PAL.ATOM[7], energia: o.energia ?? 0.3 });
};
// el lomo de un libro de pie (x izquierda, base y, ancho w, alto h): tapa, luz, sombra, bandas doradas y tejuelo sin letras
const LIBROS = ['#8a2a2e', '#2e5a4e', '#2c3e6a', '#b07a2a', '#5a2e5a', '#3a6a7a', '#7a3a1e', '#4a5a2a', '#a84a3a', '#24304a'];
const libro = (x, yb, w, h, col, k = 0) => {
  const c = typeof col === 'string' ? hex(col) : col, L = mez(c, BLANCO, 0.25), S = mez(c, K, 0.35), y0 = yb - h;
  R.rect(x, y0, x + w - 1, yb, K); R.rect(x + 1, y0 + 1, x + w - 2, yb - 1, c); R.rect(x + 1, y0 + 1, x + 1, yb - 1, L); R.rect(x + w - 3, y0 + 1, x + w - 2, yb - 1, S);
  const banda = k % 3 === 0 ? ORO2 : mez(c, BLANCO, 0.45);
  for (const yy of [y0 + 4, y0 + 6, yb - 6]) R.rect(x + 2, yy, x + w - 4, yy, banda);
  if (h > 30) { const ty = y0 + Math.round(h * 0.3); R.rect(x + 3, ty, x + w - 5, ty + Math.min(10, Math.round(h * 0.15)), mez(c, BLANCO, k % 2 ? 0.6 : 0.3)); R.rect(x + 3, ty, x + w - 5, ty, S); }
};
// el gato gris del estudio: x = borde izquierdo, pie = y de las patas; o.anda, o.dir, o.salto, o.duerme
const GATO_C = ['...............k..k.', '..............kGkkGk', '..............kGGGGk', '.k............kGYGYk', 'kGk...........kGGPGk', 'kGk..kkkkkkkkkkGWWk.', '.kGkkGGGGGGGGGGGWWk.', '..kGGGGgGGGgGGGGWk..', '...kGGGGGGGGGGGGGk..', '...kGGgkkkkkkkGGgk..'];
const GATO_COLA = ['...............k..k.', '..............kGkkGk', '..............kGGGGk', '..............kGYGYk', '..k...........kGGPGk', '.kGk.kkkkkkkkkkGWWk.', '.kGkkGGGGGGGGGGGWWk.', '..kGGGGgGGGgGGGGWk..', '...kGGGGGGGGGGGGGk..', '...kGGgkkkkkkkGGgk..'];
const gato = (x, pie, t, o = {}) => {
  const fr = o.anda ? Math.floor(t * 8) % 2 : 0, y = Math.round(pie - 11 - (o.salto ?? 0));
  const patas = o.anda ? (fr ? ['....kGk.....kGk.....', '....kk......kk......'] : ['...kGk.......kGk....', '...kk........kk.....']) : ['...kGk......kGk.....', '...kk.......kk......'];
  const pg = { k: K, G: hex('#8a8a96'), g: hex('#5a5a66'), W: hex('#f2f2f2'), Y: (t * 1.3 + x * 0.01) % 3 < 0.1 ? hex('#5a5a66') : hex('#c8e040'), P: hex('#e88aa0') };
  if (!o.salto) for (let i = 4; i < 17; i++) R.pset(Math.round(x + i), Math.round(pie), mez(R.pget(Math.round(x + i), Math.round(pie)), K, 0.35));
  R.dibujo([...(Math.sin(t * 3 + x) > 0.3 && !o.anda ? GATO_COLA : GATO_C), ...patas], Math.round(x), y, o.dir ?? 1, pg);
};
// la tiza: un trazo de 2 px con grano; dash: discontinuo
const tizaPunto = (x, y, col, k = 0) => { x = Math.round(x); y = Math.round(y); for (const [dx, dy] of [[0, 0], [1, 0], [0, 1], [1, 1]]) if (H(x + dx, y + dy, k) > 0.16) R.pset(x + dx, y + dy, H(x + dx, y + dy, k + 1) < 0.25 ? mez(col, hex('#3a5448'), 0.35) : col); };
// un trazo hecho de tramos [[x, y], …] dibujado hasta la fracción u (0–1); devuelve la punta
const trazo = (pts, u, col, o = {}) => {
  let L = 0; const seg = []; for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(l); L += l; }
  let quedan = L * Math.max(0, Math.min(1, u)), punta = pts[0], d = 0;
  for (let i = 1; i < pts.length && quedan > 0; i++) {
    const l = seg[i - 1], f = Math.min(1, quedan / l), [ax, ay] = pts[i - 1], [bx, by] = pts[i];
    if (!o.salta || !o.salta.includes(i)) for (let s = 0; s <= l * f; s += 0.6) { d += 0.6; if (o.dash && Math.floor((d) / 5) % 2) continue; tizaPunto(ax + (bx - ax) * s / l, ay + (by - ay) * s / l, col, o.k ?? 0); }
    punta = [ax + (bx - ax) * f, ay + (by - ay) * f]; quedan -= l;
  }
  return punta;
};
const circuloPts = (cx, cy, r, n = 20) => Array.from({ length: n + 1 }, (_, i) => [cx + Math.cos(i / n * Math.PI * 2 - Math.PI / 2) * r, cy + Math.sin(i / n * Math.PI * 2 - Math.PI / 2) * r]);
const estrellaPts = (cx, cy, r) => Array.from({ length: 11 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.42 : r; return [cx + Math.cos(a) * q, cy + Math.sin(a) * q]; });
// un bloque de madera de cerca (lado l): un solo color, luz, sombra, veta y nudo
const bloque = (x, y, l, k = 0, brillo = 0) => {
  x = Math.round(x); y = Math.round(y);
  const B = hex('#d89a52'), Lz = hex('#f2c888'), S = hex('#a8682e'), V = hex('#b87a3a');
  R.rect(x, y, x + l - 1, y + l - 1, K); R.rect(x + 1, y + 1, x + l - 2, y + l - 2, B);
  R.rect(x + 1, y + 1, x + l - 2, y + 2, Lz); R.rect(x + 1, y + 1, x + 2, y + l - 2, Lz); R.rect(x + l - 3, y + 3, x + l - 2, y + l - 2, S); R.rect(x + 3, y + l - 3, x + l - 2, y + l - 2, S);
  for (let j = 4; j < l - 4; j += 4) for (let i = 4; i < l - 4; i++) if (Math.sin(i * 0.5 + j + k) > 0.6) R.pset(x + i, y + j, V);
  R.pset(x + 5 + (k % 5), y + 6 + (k % 4), V);
  if (brillo > 0) for (let j = 1; j < l - 1; j++) for (let i = 1; i < l - 1; i++) if ((i + j) % 2 || brillo > 0.6) R.pset(x + i, y + j, mez(R.pget(x + i, y + j), ORO, brillo * 0.8));
};

// Atom sale en el plano en los tres primeros: la esquina se queda tranquila
const comp0 = R.companero; let atomEn = false; R.companero = (t, e) => { if (!atomEn) comp0(t, e); };
const w = (s) => en('resumen', (s - 0.9) / 18.312);   // el instante de una palabra (segundos de linea.json, dentro de la escena)
const P2 = w(5.3), P3 = w(10.08), P4 = w(15.1);

// ── 1 · la estantería: el libro que se abre ───────────────────────────────────────────────────────
const piensa = w(1.28), abre = w(2.08), extra = w(2.86), historia = w(3.48), juego = w(4.62);
const ICONOS1 = [
  { t: extra, x: 118, y: 66, f: (x, y, t) => PZ.terminal(R, x, y + 25, { texto: 2, teclado: false, t, s: 2 }) },
  { t: extra + 0.42, x: 192, y: 56, f: (x, y) => PZ.disquete(R, x, y + 21, { s: 3 }) },
  { t: historia, x: 260, y: 66, f: (x, y) => { R.poligono(estrellaPts(x + 1, y + 1, 16), K); R.poligono(estrellaPts(x, y, 15), hex('#e8303a')); R.poligono(estrellaPts(x - 1, y - 2, 7), hex('#ff7a6a')); } },
];
const p1 = (t) => {
  atomEn = true;
  const o = { encuadre: 'estudio', camara: 'estanteria', balda: 3, encajan: tramo(t, w(3.2), P2 - 0.2) };
  T.hoy(R, t, o);
  // Atom entra con el libro, se para a pensar y lo abre
  const v = tramo(t, 0, piensa), ax = lerp(298, 252, v), ay = lerp(70, 114, v) + Math.sin(t * 2.6) * 2 - (t > piensa && t < abre ? Math.abs(Math.sin((t - piensa) * 5)) * 3 : 0);
  const bx = 196, by = 150, ab = tramo(t, abre, abre + 0.35);
  // el libro: cerrado colgando bajo Atom, después abierto y flotando delante de la estantería
  const lx = Math.round(lerp(ax - 12, bx, tramo(t, piensa, abre))), ly = Math.round(lerp(ay + 52, by, tramo(t, piensa, abre)));
  for (let j = -10; j <= 6; j++) for (let i = -40; i <= 40; i++) if ((i * i) / 1600 + (j * j) / 100 < 1 && ((i + j) & 1)) R.pset(lx + i, ly + 12 + j, mez(R.pget(lx + i, ly + 12 + j), K, 0.35));   // su sombra
  if (ab <= 0) { libro(lx - 12, ly, 24, 34, '#a8282e', 3); R.rect(lx - 9, ly - 26, lx + 8, ly - 18, hex('#f0c060')); R.icono('bloques', lx - 6, ly - 25, hex('#6a1a1e'), hex('#f0c060'), 1); }
  else {
    const half = Math.round(lerp(4, 30, ab));
    R.poligono([[lx - half - 2, ly - 32], [lx, ly - 28], [lx + half + 2, ly - 32], [lx + half + 2, ly + 2], [lx, ly + 5], [lx - half - 2, ly + 2]], hex('#6a1a1e'));
    R.poligono([[lx - half, ly - 33], [lx, ly - 30], [lx, ly + 2], [lx - half, ly - 1]], hex('#f6eedc'));
    R.poligono([[lx, ly - 30], [lx + half, ly - 33], [lx + half, ly - 1], [lx, ly + 2]], hex('#ece0c4'));
    R.linea(lx, ly - 30, lx, ly + 2, hex('#b8a888'));
    if (ab > 0.8) for (let k = 0; k < 7; k++) { const yy = ly - 26 + k * 4; R.linea(lx - half + 4, yy, lx - 4, yy + 2, hex('#c8bca0')); R.linea(lx + 4, yy + 2, lx + half - 4, yy, hex('#c8bca0')); }
    // la luz que sale de las páginas
    if (ab > 0.6) for (let j = 0; j < 40; j++) for (let i = -34 + j * 0.3; i <= 34 - j * 0.3; i++) if (H(i, j, Math.floor(t * 6)) < 0.18) R.pset(Math.round(lx + i), ly - 34 - j, mez(R.pget(Math.round(lx + i), ly - 34 - j), ORO, 0.5));
  }
  // los pictogramas suben del libro, uno a uno, con su halo, y se quedan en arco
  for (const ic of ICONOS1) {
    const u = tramo(t, ic.t, ic.t + 0.55); if (u <= 0) continue;
    const e = 1 - (1 - u) ** 3, x = Math.round(lerp(lx, ic.x, e)), y = Math.round(lerp(ly - 20, ic.y, e) + (u >= 1 ? Math.sin(t * 3 + ic.x) * 1.5 : 0));
    for (let j = -30; j <= 30; j++) for (let i = -38; i <= 38; i++) { const g = 1 - Math.hypot(i / 1.25, j) / 30; if (g > 0.15) R.pset(x + i, y + j, mez(R.pget(x + i, y + j), hex('#1a1220'), Math.min(0.75, g * 1.3))); }
    for (let k = 0; k < 8; k++) { const an = k * Math.PI / 4 + t * 2; if (u < 1 || Math.sin(t * 5 + k) > 0.3) R.pset(Math.round(x + Math.cos(an) * 30), Math.round(y + Math.sin(an) * 23), ORO); }
    ic.f(x, y, t);
  }
  if (t > piensa + 0.1 && t < abre) R.icono('?', Math.round(ax) + 14, Math.round(ay) - 30, ORO, K, 2);
  if (t > juego && t < P2) R.icono('!', Math.round(ax) + 14, Math.round(ay) - 30 - Math.round(tramo(t, juego, juego + 0.2) * 4), ORO, K, 2);
  atomo(ax, ay, t, { chispas: v > 0 && v < 1, energia: t > abre && t < abre + 0.6 ? 0.8 : 0.35 });
};

// ── 2 · la pizarra de cerca: Atom dibuja con su luz ──────────────────────────────────────────────────
const juegoA = w(5.34), sinDib = w(5.92), dibujos = w(6.14), inventa = w(6.66), hombre = w(7.76), noEra = w(8.16), suyo = w(8.6), saca = w(8.94);
const TZ = hex('#eef0e4'), TZV = hex('#8aec8a'), TZR = hex('#f0605a'), TZA = hex('#f6e070');
const TERM = [[46, 40], [108, 40], [108, 86], [46, 86], [46, 40], [52, 46], [102, 46], [102, 80], [52, 80], [52, 46], [52, 80], [70, 86], [68, 96], [86, 96], [84, 86], [84, 96], [110, 100], [116, 110], [38, 110], [44, 100], [84, 100]];
const CORCH = [];
for (let f = 0; f < 2; f++) for (let c = 0; c < 3; c++) { const x = 58 + c * 14, y = 54 + f * 13; CORCH.push([[x + 3, y], [x, y], [x, y + 8], [x + 3, y + 8]], [[x + 7, y], [x + 10, y], [x + 10, y + 8], [x + 7, y + 8]]); }
const CUADRO = [[124, 46], [154, 46], [154, 72], [124, 72], [124, 46], [126, 70], [136, 56], [143, 64], [147, 59], [152, 70]];
const HOMBRE = [...circuloPts(186, 58, 7, 18), [186, 65], [186, 88], [174, 76], [186, 72], [198, 76], [186, 72], [186, 88], [176, 104], [186, 88], [196, 104]];

  { pts: TERM, a: P2 + 0.1, b: sinDib, col: TZ },
  ...CORCH.map((pts, i) => ({ pts, a: sinDib + i * 0.05, b: sinDib + i * 0.05 + 0.05, col: TZV })),
  { pts: CUADRO, a: dibujos, b: dibujos + 0.4, col: TZ },
  { pts: [[122, 44], [156, 74]], a: dibujos + 0.42, b: dibujos + 0.52, col: TZR },
  { pts: [[156, 44], [122, 74]], a: dibujos + 0.52, b: inventa - 0.02, col: TZR },
  { pts: HOMBRE, a: inventa + 0.05, b: hombre, col: TZ },
  { pts: BOMBILLA, a: hombre, b: hombre + 0.3, col: TZA },
  { pts: ESTRELLA, a: noEra, b: suyo - 0.05, col: TZR },
  { pts: FLECHA_E, a: suyo - 0.05, b: saca - 0.05, col: TZR },
  { pts: FUERA, a: saca, b: P3 - 0.2, col: TZ, dash: true },
];
const pizarraFondo = () => {
  papel(0, 0, 319, 179);
  // el marco de madera
  madera(10, 16, 270, 146, hex('#7a4a2a'), 2);
  R.rect(10, 16, 270, 16, K); R.rect(10, 146, 270, 146, K); R.rect(10, 16, 10, 146, K); R.rect(270, 16, 270, 146, K);
  R.rect(11, 17, 269, 17, hex('#a8744a'));
  // la pizarra: verde de tiza, con borrones viejos y rastros
  for (let y = 22; y <= 134; y++) for (let x = 16; x <= 264; x++) {
    let c = R.tone4([hex('#2a4438'), hex('#30493d'), hex('#365246')], 0.9 + 0.8 * Math.sin(x * 0.02 + y * 0.03) + H(x, y, 1) * 0.6, x, y);
    const bor = Math.sin(x * 0.045 + Math.sin(y * 0.09) * 2) * Math.sin(y * 0.07 + 1);
    if (bor > 0.55 && H(x, y, 2) < 0.5) c = mez(c, hex('#6a8a7a'), 0.18);
    if (H(x, y, 4) < 0.012) c = hex('#5a7a6a');
    R.pset(x, y, c);
  }
  R.rect(15, 21, 265, 21, hex('#1c2c24')); R.rect(15, 21, 15, 134, hex('#1c2c24'));
  // los rastros de dibujos borrados
