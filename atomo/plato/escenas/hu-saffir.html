<title>La escala · ep12</title>

<body>
<canvas id="lienzo"></canvas>
<script type="module">
// HU-SAFFIR (frases 19–20), 1971, cartela «1971». Siete planos en el taller de Saffir (Coral Gables, Florida); las marcas
// de la voz inglesa salen de las palabras medidas en la pista (linea.json):
// 1. el taller entero: Saffir llega con la caja de herramientas, la deja a sus pies junto a la mesa de prueba y ajusta la
//    casita con el destornillador; delante del banco, el aprendiz barre a pasitos las virutas de teja de la última prueba;
//    tras el mostrador, la ayudante lee un papel de la bandeja; en «Herbert Saffir» él se vuelve, sonríe y se sube las
//    gafas, y el aprendiz se para, lo mira y lo saluda; fuera pasan coches y nubes, el gato del alféizar mueve la cola y un
//    fluorescente parpadea;
// 2. el banco de viento de cerca («studying how houses fail»): una mano llega desde la derecha, gira el mando (las aspas
//    arrancan, la cinta se estira) y va a la libreta a apuntar; en «fail» las primeras tejas aletean y salen volando, la
//    mano se para un instante y vuelve a escribir, y se va;
// 3. el taller («and Robert Simpson»): la puerta de la calle se abre y entra Simpson con el mapa doblado; Saffir y el
//    aprendiz se vuelven sorprendidos; la ayudante y el aprendiz le saludan al pasar; se dan la mano y en «Center» Simpson
//    despliega el mapa del Atlántico con la espiral (Saffir, «!»); el aprendiz vuelve a barrer;
// 4. el panel de la escala («a simple scale from one to five»): a la izquierda, el aprendiz vacía el recogedor en la
//    papelera; Saffir va al interruptor y Simpson da dos pasos hacia el panel; Saffir tira y en «one to five» se encienden
//    las cinco ventanillas una tras otra, con su icono de daños y su umbral (el aprendiz y Simpson se asombran); en «what to
//    expect» Saffir abre los brazos y Simpson asiente y señala; el aprendiz se va con el recogedor;
// 5. el mostrador (gag), categoría 1: Simpson se acerca al mostrador para ver el banco del fondo por el arco; allí, el
//    aprendiz enciende el ventilador en «category one» y las aspas arrancan; en «74» salta el número y Saffir y Simpson lo
//    señalan; en «peels shingles» las tejas de la casita se levantan, el aprendiz señala la que sale y cruza el taller, y
//    en «roofs» golpea la campanita junto a Simpson: da un brinco, se ríe y la señala, y Saffir se ríe;
// 6. el banco de cerca, categoría 5: la mano llega, gira el mando a tope en «blows», el contador y el «157» suben y ella va
//    a la libreta a apuntar; se van las tejas, los tableros y la armadura, y en «flatten» la casita se desmonta como una
//    maqueta (la mano da un respingo); en «neighborhoods» vuelve al mando y lo apaga: las aspas se paran y se va;
// 7. la mesa de dibujo (la explicación): en «each step up» la mano marca las cinco categorías y salen cinco casitas cada vez
//    más rotas; en «multiplies» saltan los «×» entre ellas; en «the force of the wind grows much faster» la mano traza la
//    curva roja de la fuerza, que se dispara, y en «than its speed» la recta azul de la velocidad, mucho más tendida; la
//    flecha marca la diferencia.
// Posiciones del decorado de las que depende: f_TALLER (general: Saffir en x 176, suelo 150; el mostrador x 220–280 con la
// bandeja de papeles en x 239–251, y 96–101; banco: el mando en (100, 109), la libreta en x 295–319, y 121–127; escala: el
// interruptor en x 262–274, y 98–112, la papelera en x 26–40, y 123–139; mostrador: el arco x 0–101, y 26–151, la campanita
// en (176, 111), lo de encima del mostrador entre y 103 y 111).
import * as T from '/atomo/plato/escenas/hu-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hu-saffir');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const C = T.C;
const lin = (t, x, y) => Math.max(0, Math.min(1, (t - x) / (y - x)));
const entre = (t, x, y) => t >= x && t < y;
const parp = (t, v = 6) => Math.sin(t * v) > 0;
const suave = (u) => { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); };
const BY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
const by = (x, y) => BY[((y & 3) << 2) | (x & 3)];
const rampa = (s) => s.split(' ').map(hex);
const tono = (ram, v, x, y) => { let l = Math.floor(v); if (v - l > by(x, y)) l++; return ram[l < 0 ? 0 : l >= ram.length ? ram.length - 1 : l]; };
const hs = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const ruido = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hs(xi, yi, 9), b = hs(xi + 1, yi, 9), c = hs(xi, yi + 1, 9), d = hs(xi + 1, yi + 1, 9); return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy; };
const mezcla = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
const aclara = (x, y, c, a) => { if (x >= 0 && x < 320 && y >= 0 && y < 180) R.pset(x, y, mezcla(R.pget(x, y), c, a)); };
const FIJOS = new Map();
const fijo = (clave, dibuja) => { let b = FIJOS.get(clave); if (!b) { b = R.nuevo(); const prev = R.usar(b); dibuja(); R.usar(prev); FIJOS.set(clave, b); } R.copiar(b); };
const DIG = ['111101101101111', '010110010010111', '111001111100111', '111001111001111', '101101111001001', '111100111001111', '111100111101111', '111001001001001', '111101111101111', '111101111001111'];
const cifras = (txt, x, y, c, s = 1) => { for (const ch of String(txt)) { const g = DIG[ch.charCodeAt(0) - 48]; if (g) for (let j = 0; j < 5; j++) for (let i = 0; i < 3; i++) if (g[j * 3 + i] === '1') R.rect(x + i * s, y + j * s, x + i * s + s - 1, y + j * s + s - 1, c); x += 4 * s; } };
// lo que va detrás de una pieza del decorado: guarda esos rectángulos, dibuja y los repone encima
const detras = (rects, dibuja) => { const g = rects.map(([x0, y0, x1, y1]) => { const v = []; for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) v.push(R.pget(x, y)); return v; });
  dibuja(); rects.forEach(([x0, y0, x1, y1], k) => { let i = 0; for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) R.pset(x, y, g[k][i++]); }); };
// un dibujo de letras (cada letra, un color de pal; '.' transparente) en (x, y), con escala k
const pinta = (filas, x, y, pal, k = 1) => filas.forEach((f, j) => { for (let i = 0; i < f.length; i++) { const c = pal[f[i]]; if (c != null) R.rect(x + i * k, y + j * k, x + i * k + k - 1, y + j * k + k - 1, c); } });

const s = (f) => en('saffir', f), c = (f) => en('categorias', f);
// cortes: «who» (5,49, en la pausa), «and Robert» (9,57), «Create» (13,78), «A Category» (18,92), «while» (24,53), «and each» (30,46)
const P2 = s(0.240), P3 = s(0.485), P4 = s(0.739), P5 = c(0), P6 = c(0.323), P7 = c(0.664);
const herbert = s(0.172), saffirW = s(0.191);
const estudia = s(0.296), fallan = s(0.370), fuertes = s(0.409);
const director = s(0.576), centro = s(0.670);
const escalaW = s(0.787), uno = s(0.831), cinco = s(0.854), gente = s(0.911), espera = s(0.932);
const cat1 = c(0.006), n74 = c(0.082), arranca = c(0.197), tejados = c(0.270);
const sopla = c(0.387), n157 = c(0.435), arrasa = c(0.550), barrios = c(0.591);
const escalon = c(0.670), multiplica = c(0.703), fuerza = c(0.828), rapido = c(0.919), suVel = c(0.945);
const CAMISA = '#f2eee2';
// el ángulo de las aspas cuando el viento cambia dentro del plano: la integral de su velocidad de giro (1,5 + 24 v rad/s)
const giroDe = (vf, t0, t) => { let g = 0.35; for (let x = t0; x < t; x += 1 / 30) { const v = vf(x); if (v > 0) g += (1.5 + 24 * v) / 30; } return g; };
// el número grande que salta (el umbral en mph) y se queda temblando un poco
const numeroSalta = (txt, x, base, t, t0, t1) => { if (t < t0 || t > t1) return; const u = lin(t, t0, t0 + 0.3), b = Math.round(Math.sin(u * Math.PI) * -6 + (u < 1 ? (1 - u) * 6 : 0));
  R.numero(txt, x, base + b, { tam: 16, centro: true }); if (u >= 1 && Math.sin(t * 9) > 0.6) for (const [dx, dy] of [[-22, -16], [22, -14], [0, -22]]) { R.pset(x + dx, base + dy, C.oroL); R.pset(x + dx + 1, base + dy, C.oroL); R.pset(x + dx, base + dy - 1, C.oroL); } };
// la ayudante tras el mostrador del taller (asoman la cabeza y los hombros; la bandeja de papeles le queda a la altura del
// cuello, nunca delante de la boca)
const ayudante = (t, o) => R.actor(EL.senora30, 240, 110, t, o);
// el aprendiz del taller: camisa de faena azul y pantalón marrón (barre, vacía el recogedor, enciende el banco del fondo)
const APRENDIZ = { ...EL.tecnico, pal: { ...EL.tecnico.pal, C: hex('#6a8ab0'), c: hex('#4e6a8e'), W: hex('#6a8ab0'), o: hex('#4e6a8e'), F: hex('#5a4a3a') } };
// el cepillo de nudo: el palo sale de la mano, por delante del cuerpo, y la cabeza va y viene por el suelo (barre 0–1);
// delante, el montoncito de virutas de teja que empuja
const cepillo = (x, suelo, t, dir, barre = 1) => {
  const v = Math.round(Math.sin(t * 11) * 2 * barre), hx = x + 7 + dir * 4, hy = suelo - 10, bx = x + 7 + dir * (15 + v), by = suelo;
  R.linea(hx, hy, bx, by - 2, C.k); R.linea(hx, hy + 1, bx - dir, by - 2, hex('#c8944a'));
  R.rect(bx - 4, by - 3, bx + 4, by - 1, C.k); R.rect(bx - 3, by - 3, bx + 3, by - 2, hex('#a8483a')); R.rect(bx - 3, by - 3, bx + 3, by - 3, hex('#c8684a'));
  for (let i = -3; i <= 3; i += 2) R.pset(bx + i, by, hex('#3a2a20'));
  for (let k = 0; k < 7; k++) R.pset(bx + dir * (6 + k * 2) + (k % 3) - 1, by - (k % 2), k % 3 ? hex('#6a5e56') : hex('#3a322c'));
};
// barre a pasitos: avanza 5 px en 0,35 s y barre el resto del segundo (desde x0 en t0, hacia dir)
const barriendo = (t, t0, x0, dir) => { const k = Math.max(0, t - t0), n = Math.floor(k), f = k - n; return { x: Math.round(x0 + dir * 5 * (n + suave(Math.min(1, f / 0.35)))), anda: t > t0 && f < 0.35, barre: f >= 0.35 ? 1 : 0 }; };
// el recogedor de chapa, de tres cuartos (la mano en x, y; dir: hacia dónde apunta la pala): el mango rojo y la pala gris
// con su hueco claro
const RECOGEDOR = ['kkk.........', 'kHHkkkkkkkk.', '.kkGGGGGGGGk', '...kGgggggGk', '....kGGGGGGk', '.....kkkkkkk'];
const recogedor = (x, y, dir) => { const pal = { k: C.k, H: hex('#c83a3a'), G: hex('#8a949e'), g: hex('#c8d0d8') };
  RECOGEDOR.forEach((fila, j) => { for (let i = 0; i < fila.length; i++) { const c = pal[fila[i]]; if (c != null) R.pset(x + dir * i, y - 2 + j, c); } }); };

// ── 1 · el taller y su ingeniero ─────────────────────────────────────────────────────────────────────────────────────
const p1 = (t) => {
  const lee = entre(t, s(0.024), s(0.12));
  T.tallerSaffir(R, t, { categoria: 0, viento: 0, marca: 0, detras: (tt) => ayudante(tt, { dir: tt > s(0.132) ? -1 : 1, dedo: lee, habla: entre(tt, s(0.138), s(0.186)) && parp(tt, 8), sonrisa: tt > s(0.132) }) });
  if (lee) { R.rect(256, 83, 263, 91, C.k); R.rect(257, 84, 262, 90, C.blanco); R.rect(258, 86, 261, 86, hex('#8a8a98')); R.rect(258, 88, 260, 88, hex('#8a8a98')); }
  // el aprendiz barre a pasitos las virutas de teja de la última prueba, delante del banco; en «Herbert Saffir» se para,
  // mira al jefe y le saluda
  { const mira = t > saffirW - 0.25, b = barriendo(Math.min(t, saffirW - 0.25), 1.2, 100, 1);
    R.actor(APRENDIZ, b.x, 147, t, { dir: 1, anda: !mira && b.anda, sonrisa: mira, habla: entre(t, saffirW, saffirW + 0.55) && parp(t, 8) });
    cepillo(b.x, 147, t, 1, mira ? 0 : b.barre); }
  // Saffir llega desde su mesa de dibujo con la caja de herramientas, la deja a sus pies, ajusta la casita con el
  // destornillador y en «Herbert Saffir» se vuelve, sonríe y se sube las gafas
  const llega = lin(t, s(0) - 0.15, s(0.084)), x = Math.round(lerp(212, 176, suave(llega))), suelo = Math.round(lerp(158, 150, suave(llega))), deja = t > s(0.093);
  const vuelve = t > herbert, ajusta = !vuelve && t > s(0.108) && Math.sin(t * 7) > -0.2;
  const caja = (cx, cy) => { R.rect(cx - 1, cy - 6, cx + 9, cy, C.k); R.rect(cx, cy - 5, cx + 8, cy - 1, hex('#c83a3a')); R.rect(cx, cy - 5, cx + 8, cy - 5, hex('#e86a5a')); R.rect(cx + 3, cy - 8, cx + 5, cy - 6, C.k); R.pset(cx + 4, cy - 3, hex('#e8e4d8')); };
  if (deja) { const u = suave(lin(t, s(0.093), s(0.093) + 0.18)); caja(Math.round(lerp(170, 163, u)), Math.round(lerp(143, 152, u))); }
  const r = R.actor(EL.saffir, x, suelo, t, { dir: vuelve || llega < 1 ? (llega < 1 ? -1 : 1) : -1, anda: llega > 0 && llega < 1, dedo: ajusta || entre(t, saffirW, saffirW + 0.5), sonrisa: t > saffirW - 0.1 || llega < 1, habla: entre(t, s(0.114), s(0.156)) && parp(t, 7) });
  if (!deja && llega > 0) caja(x - 6, suelo - 7);
  if (ajusta) { const [mx, my] = r.mano; R.linea(mx - 1, my, mx - 5, my - 2, C.k); R.pset(mx - 6, my - 2, hex('#c8ccd4')); R.rect(mx, my - 1, mx + 1, my + 1, hex('#c83a3a')); }
};

// ── 2 · el banco de viento: cómo fallan las casas ─────────────────────────────────────────────────────────────────────
const v2 = (t) => 0.6 * suave(lin(t, P2 + 0.7, fallan)) + 0.12 * lin(t, fallan, P3);
// la libreta del banco: el garabato de lo apuntado (n px, en cuatro renglones de 9 px de las dos páginas) y dónde va la punta
const RENGLON = [[297, 123], [297, 125], [309, 123], [309, 125]];
const garabato = (n) => { for (let i = 0; i < Math.min(36, Math.floor(n)); i++) { const [x0, y0] = RENGLON[Math.floor(i / 9)]; R.pset(x0 + (i % 9), y0 - ((i * 7) % 3 === 0 ? 1 : 0), hex('#3a3a4a')); } };
const puntaEn = (n) => { const i = Math.min(35, Math.max(0, Math.floor(n))), [x0, y0] = RENGLON[Math.floor(i / 9)]; return [x0 + (i % 9), y0]; };
// lo que se escribe a 7 px/s entre a y b, menos lo que dura la pausa [p0, p1]
const escrito = (t, a, b, p0 = 0, p1 = 0) => 7 * Math.max(0, Math.min(t, b) - a - Math.max(0, Math.min(t, p1) - Math.max(a, p0)));
const n2 = (t) => escrito(t, P2 + 1.5, P3 - 0.55, fallan, fallan + 0.45);
// el lápiz amarillo en la mano canónica: la mano en (hx, hy), la punta 14 px a la izquierda y 8 más abajo
const lapizMano = (hx, hy) => { const px = hx - 14, py = hy + 8; R.linea(px, py, px + 5, py - 6, C.k); R.linea(px + 1, py, px + 6, py - 6, hex('#f0c040')); R.pset(px, py, hex('#3a3a46')); T.mano(R, hx, hy, -1, CAMISA); };
const p2 = (t) => {
  T.tallerSaffir(R, t, { encuadre: 'banco', categoria: 1.3 * lin(t, estudia + 0.7, fuertes + 0.6), viento: v2(t), giro: giroDe(v2, P2, t), lapiz: false });
  garabato(n2(t));
  // una sola mano (con su lápiz): llega desde la derecha al mando, lo gira, va a la libreta y apunta; en «fail» se para y
  // se levanta un poco, vuelve a escribir y se va
  const M2 = [P2 + 0.05, P2 + 0.55, P2 + 1.0, P2 + 1.5, P3 - 0.55, P3 - 0.05];
  if (t < M2[0] || t > M2[5]) return;
  const [qx, qy] = puntaEn(n2(t)), z = t > M2[3] && t < M2[4] && !entre(t, fallan, fallan + 0.45);
  let hx, hy;
  if (t < M2[1]) { const u = suave(lin(t, M2[0], M2[1])); hx = lerp(340, 111, u); hy = lerp(134, 109, u); }
  else if (t < M2[2]) { hx = 111; hy = 109 + Math.round(Math.sin(lin(t, M2[1], M2[2]) * Math.PI * 2) * 2); }
  else if (t < M2[3]) { const u = suave(lin(t, M2[2], M2[3])); hx = lerp(111, qx + 14, u); hy = lerp(109, qy - 8, u) - Math.sin(u * Math.PI) * 10; }
  else if (t < M2[4]) { hx = qx + 14; hy = qy - 8 + (z ? Math.round(Math.sin(t * 31)) : -3); }
  else { const u = suave(lin(t, M2[4], M2[5])); hx = lerp(qx + 14, 345, u); hy = qy - 8 - u * 4; }
  lapizMano(Math.round(hx), Math.round(hy));
};

// ── 3 · llega Simpson con su mapa ────────────────────────────────────────────────────────────────────────────────────
const entraS = P3 + 0.45, llegaS = director + 0.85, despliega = centro;
const p3 = (t) => {
  // la ayudante saluda a Simpson cuando pasa por delante del mostrador
  T.tallerSaffir(R, t, { categoria: 1.3, viento: 0.12, marca: 0, puerta: lin(t, P3 + 0.02, P3 + 1.0), detras: (tt) => ayudante(tt, { dir: 1, dedo: entre(tt, entraS + 0.5, entraS + 1.3), sonrisa: tt > entraS + 0.4 }) });
  // el aprendiz sigue barriendo; al abrirse la puerta se para y mira, saluda a Simpson cuando pasa, vuelve a barrer y en
  // «Center» se para a mirar el mapa
  { const sigue = entraS + 1.6, te = Math.max(0, Math.min(t, P3 + 0.25) - P3) + Math.max(0, Math.min(t, despliega) - sigue), barre = t < P3 + 0.25 || entre(t, sigue, despliega);
    const b = barriendo(P3 + te, P3, 118, 1);
    R.actor(APRENDIZ, b.x, 147, t, { dir: 1, anda: barre && b.anda, sorpresa: entre(t, P3 + 0.3, P3 + 0.8), dedo: entre(t, entraS + 0.6, entraS + 1.4), sonrisa: entre(t, entraS + 0.5, sigue) || t > despliega + 0.2 });
    cepillo(b.x, 147, t, 1, barre ? b.barre : 0); }
  // Simpson entra por la puerta y cruza el taller en diagonal hasta Saffir; en «Center» despliega el mapa
  const u = lin(t, entraS, llegaS), x = Math.round(lerp(293, 204, u)), suelo = Math.round(lerp(138, 152, u)), anda = u > 0 && u < 1;
  const abre = lin(t, despliega, despliega + 0.5), ensena = lin(t, despliega + 0.5, despliega + 0.8);
  const saluda = entre(t, llegaS + 0.05, despliega - 0.05);
  if (t > entraS - 0.1) { R.actor(EL.simpson, x, suelo, t, { dir: -1, anda, habla: entre(t, llegaS, despliega) && parp(t, 8), sonrisa: t > llegaS, dedo: ensena > 0 });
    if (!saluda) T.f_mapaSimpson(R, x - 2, suelo - 9 - Math.round(ensena * 7), t, abre, -1); }
  // Saffir: se vuelve al oír la puerta, se sorprende, saluda, le da la mano y mira el mapa
  R.actor(EL.saffir, 176, 150, t, { dir: t > P3 + 0.15 ? 1 : -1, sorpresa: entre(t, P3 + 0.2, P3 + 0.8), dedo: entre(t, P3 + 0.9, P3 + 1.5) || t > despliega + 0.7, sonrisa: t > P3 + 0.8, habla: entre(t, llegaS - 0.4, llegaS + 0.3) && parp(t, 8) });
