<script type="module">
// HU-MOTOR (frase 8), sin año: el huracán como motor. Cuatro planos:
// 1. a bordo de la lancha, de cerca y de tres cuartos (proa hacia la nube): la cubierta antideslizante con la sombra del
//    techo de lona, la consola con su pantalla y el salvavidas, las cañas, el maletín, la nevera, la pescante, el
//    fueraborda y la espuma del costado; al fondo, la torre de nubes. Una gaviota llega planeando y se posa en el techo de
//    lona; el científico, sin la gorra que se le voló en hu-calor, mira la nube con pena; en «engine» se abre en la nube la
//    ventana de chapa remachada y los dos se asombran (él con los brazos en alto); en «runs» arrancan los pistones de nube,
//    el cigüeñal y el volante y la gaviota se espanta y se va; en «heat» el mar se enciende debajo y sale su gorra roja
//    montada en el pistón del medio, subiendo y bajando (gag): él la señala, ella se ríe; en «NOAA» ella saca la
//    calculadora y teclea, y él se asoma a mirar;
// 2. (corta en «An average one») el manómetro del motor de cerca, en su chapa remachada, con el ojo de buey que deja ver la
//    tormenta de fuera (una gaviota lucha contra el viento y relampaguea), y alrededor la chapa como en el plano 4: remaches
//    con su chorretón de óxido, manchas de aceite que gotean, gotas de condensación, un parche oxidado, el anillo remachado
//    del ojo de buey, el tubo de cobre con bridas que viene del borde y baja por la T a la válvula de vapor (con su volante
//    rojo) y sigue hasta el suelo, el tubo de acero que cruza y se mete en la chapa, la bajante de acero de la derecha, la
//    lámpara enjaulada que parpadea con el motor y echa su cerco de luz, el pictograma de calor, la caja eléctrica con sus
//    pilotos, las sombras de los tubos y el hollín de abajo: la mano canónica de la científica (T.mano,
//    con su manga plana de 5 px alargada hasta el borde) entra por la derecha y da dos golpecitos al cristal en «releases» (la aguja
//    salta y sube); en «rain» la lluvia corre por la chapa y la mano limpia el cristal; en «one hundred fifty» la aguja se
//    clava en el tope, la mano se aparta de golpe, salta un remache (gag), todo tiembla, la válvula escupe vapor y aparece
//    «×150»;
// 3. (corta en «fifty times») desde un muelle de madera, a la izquierda (farola, noray con su cabo, salvavidas, un cubo con
//    un pez que coletea y un pelícano en el duque de alba del final), con el motor de nube al fondo y el «×150» en el
//    cielo; al otro lado del agua, una lengua de tierra con palmeras, torres de alta tensión y una boya roja del canal
//    delante. Ella se lo cuenta a él; en «all the power plants» salen de la tierra una a una, con su saltito y su polvo,
//    la central de carbón (chimeneas a bandas y humo), dos torres de refrigeración con su vapor, la de gas con su luz
//    roja y el campo de placas solares; ella las cuenta tecleando en la calculadora y él las mira con los prismáticos; un
//    velero sale por detrás del cabo; en «planet» los dos se quedan boquiabiertos y por los cables corre la electricidad,
//    y en «produce» la calculadora se recalienta y echa humo (gag): ella la abanica y él se ríe;
// 4. (corta en «although») de cerca, el costado del motor que ruge y vibra en cada fotograma: la chapa remachada con
//    sus costuras, el óxido que chorrea de los remaches y del parche, las manchas de aceite que gotean, las dos tuberías
//    de arriba con sus bridas y la válvula roja, la rejilla que brilla cada vez más, la placa de latón (barras), la tubería
//    con su llave de palanca que baja al manómetro, las franjas de aviso, la rejilla del suelo encendida, el volante con
//    su cojinete y la zapata de freno que echa chispas, y vapor por las costuras del canto; su tobera de latón. Detrás,
//    desenfocado, el mar con olas que corren, nubes a dos velocidades, un mercante con su humo, gaviotas lejanas y
//    destellos del sol en el agua. Una gaviota baja y se posa en la tobera, que la hace temblar, y mira el motor; la mano
//    canónica de la científica (manga plana hasta el borde) entra por la derecha con un molinillo de papel; la tobera
//    tose (la gaviota da un salto) y en «tiny fraction» sale con una bocanadita un rizo de aire blanco con contorno, que
//    cruza despacio en arco mientras la gaviota lo sigue con la cabeza (la levanta cuando sube); en «wind» llega al
//    molinillo: da un cuarto de vuelta y se para; ella lo sacude y la gaviota se encoge de alas (gag).
import * as T from '/atomo/plato/escenas/hu-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
import { TOCADOS } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hu-motor');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const C = T.C;
const lin = (t, x, y) => Math.max(0, Math.min(1, (t - x) / (y - x)));
const entre = (t, x, y) => t >= x && t < y;
const suave = (u) => u * u * (3 - 2 * u);
const ruido = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const umbral = (x, y) => (B4[((y & 3) << 2) + (x & 3)] + 0.5) / 16;
// mezcla dos colores del lienzo (ABGR) y tiñe un píxel
const mezcla = (p, c, a) => { const r = p & 255, g = (p >> 8) & 255, b = (p >> 16) & 255; return (0xff000000 | (Math.round(b + (((c >> 16) & 255) - b) * a) << 16) | (Math.round(g + (((c >> 8) & 255) - g) * a) << 8) | Math.round(r + ((c & 255) - r) * a)) >>> 0; };
const tine = (x, y, c, a) => { x = Math.round(x); y = Math.round(y); if (x < 0 || x > 319 || y < 0 || y > 179) return; const B = R.buf, i = y * 320 + x; B[i] = mezcla(B[i], c, a); };
// la zona de Atom y la de la barra del año quedan como fondo tranquilo
const tranquilo = (x, y) => (x >= 274 && y <= 47) || (x <= 172 && y <= 15);
const destello = (x, y, r, c = C.blanco) => { for (let i = 0; i <= r; i++) { R.pset(x + i, y, c); R.pset(x - i, y, c); R.pset(x, y + i, c); R.pset(x, y - i, c); } };
const TMP = new Uint32Array(320 * 180);
// el desenfoque del fondo de un inserto, solo en la franja [x0, 319] (lo de la izquierda lo tapa el costado del motor):
// una pasada horizontal y otra vertical de tres tomas (1 2 1), suave para que el fondo se siga leyendo
const desenfoca = (x0 = 0) => {
  const B = R.buf, ch = (p, s) => (p >> s) & 255;
  const pasa = (hor) => {
    for (let y = 0; y < 180; y++) for (let x = x0; x < 320; x++) {
      const at = (d) => (hor ? B[y * 320 + Math.max(x0, Math.min(319, x + d))] : B[Math.max(0, Math.min(179, y + d)) * 320 + x]);
      const b = at(-1), m = B[y * 320 + x], c = at(1);
      const mix = (s) => (ch(b, s) + 2 * ch(m, s) + ch(c, s)) >> 2;
      TMP[y * 320 + x] = (0xff000000 | (mix(16) << 16) | (mix(8) << 8) | mix(0)) >>> 0;
    }
    for (let y = 0; y < 180; y++) for (let x = x0; x < 320; x++) B[y * 320 + x] = TMP[y * 320 + x];
  };
  pasa(true); pasa(false);
};
// el cuadro entero que tiembla (dx, dy px)
const sacude = (dx, dy) => { if (!dx && !dy) return; const B = R.buf; TMP.set(B); for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) B[y * 320 + x] = TMP[Math.min(179, Math.max(0, y - dy)) * 320 + Math.min(319, Math.max(0, x - dx))]; };
// la gaviota de cerca: de pie (x, y: entre las patas) o volando, con su contorno para que se lea sobre el cielo
const PAL_GAV = { k: C.k, W: hex('#f8f6f0'), w: hex('#d8dce4'), G: hex('#a8b0bc'), D: hex('#3a3e48'), Y: hex('#f0b030') };
const GAV_PIE = ['.......kkk..', '......kWWWk.', '......kWkWYY', '.....kWWWWk.', '.kkkkWWWWk..', 'kDGGGGWWWk..', '.kDGGGGwWk..', '..kkkkkkk...', '....Y..Y....', '....Y..Y....'];
// la misma, con las alas abiertas hacia arriba (se encoge de alas o va a echar a volar)
const GAV_ALAS = ['.k.........k', 'kGk.kkk..kGk', '.kGkWWWkkGk.', '..kGWkWYYk..', '...kWWWWk...', '..kWWWWk....', '..kWWwWk....', '...kkkkk....', '....Y..Y....', '....Y..Y....'];
const gaviotaPie = (x, y, dir = 1, salto = 0, alas = false) => R.dibujo(alas ? GAV_ALAS : GAV_PIE, Math.round(x - 6), Math.round(y - 10 - salto), dir, PAL_GAV);
const gaviotaVuela = (x, y, t, dir = 1) => {
  x = Math.round(x); y = Math.round(y); const al = Math.sin(t * 13) > 0 ? -1 : 1, P = [[-7, al * 3 - 1], [-3, -1], [0, 0], [3, -1], [7, al * 3 - 1]];
  for (let i = 1; i < P.length; i++) { R.linea(x + P[i - 1][0], y + P[i - 1][1] + 1, x + P[i][0], y + P[i][1] + 1, C.k); R.linea(x + P[i - 1][0], y + P[i - 1][1] - 1, x + P[i][0], y + P[i][1] - 1, C.k); }
  for (let i = 1; i < P.length; i++) R.linea(x + P[i - 1][0], y + P[i - 1][1], x + P[i][0], y + P[i][1], i === 1 || i === 4 ? PAL_GAV.G : PAL_GAV.W);
  R.pset(x - 7, y + al * 3 - 1, PAL_GAV.D); R.pset(x + 7, y + al * 3 - 1, PAL_GAV.D);
  R.rect(x - 2, y, x + 2, y + 2, C.k); R.rect(x - 1, y + 1, x + 1, y + 1, PAL_GAV.W); R.pset(x + dir * 3, y + 1, PAL_GAV.Y);
};

const m = (f) => en('motor', f);
// los cortes: «An (average one)», «fifty (times)», «although» (fracciones medidas con las pausas de la voz inglesa)
const M2 = m(0.267), M3 = m(0.521), M4 = m(0.799);
const motorT = m(0.054), corre = m(0.093), calorT = m(0.131), noaa = m(0.197), estima = m(0.211), libera = m(0.313), lluviaT = m(0.403), c150 = m(0.479);
const todas = m(0.625), centrales = m(0.651), planeta = m(0.719), produce = m(0.745), diminuta = m(0.855), fraccion = m(0.872), convierte = m(0.940), viento = m(0.979);
const AZUL = '#2a4a7a';   // la manga del polo azul marino de los científicos
const XA = 220, XB = 238;
const PALG = { X: hex('#d8463a'), w: hex('#f6f2ea') };
// la gorra roja del científico (la misma de hu-calor), aquí en pequeño: se le voló dentro de la nube y va montada en un pistón
TOCADOS.gorraRoja = [['...kkkkkkkk....', '..kXXXXXXXXk...', '.kXXXXXwXXXXk..', '.kkkkkkkkkkkkkk', '..........kkkk.'], -2];
const GORRITA = ['..kkkkk...', '.kXXXXXk..', 'kXXXwXXXk.', 'kkkkkkkkkk'];
const PAL_GORRA = { k: C.k, X: PALG.X, w: PALG.w };
// la gorra en el pistón del medio del motor (x 118): sube y baja con él, y de vez en cuando da media vuelta
const gorraPiston = (t) => {
  const ph = t * 3.4 + 2.094, yp = Math.round(73 + Math.sin(ph) * 8), dir = Math.sin(t * 1.7) > 0 ? 1 : -1;
  R.recorte([90, 57, 146, 95]); R.dibujo(GORRITA, 118 - 5, yp - 6, dir, PAL_GORRA); R.recorte(null);
};
// el brazo de la científica: la mano canónica (T.mano, 14 px) con su manga plana de 5 px, que se alarga igual de plana
// hasta el borde del cuadro (como manoLarga en th-pruebas del 11)
const manoLarga = (x, y, dir, manga) => {
  x = Math.round(x); y = Math.round(y); T.mano(R, x, y, dir, manga);
  const m = hex(manga), x0 = dir > 0 ? 0 : x + 43, x1 = dir > 0 ? x - 43 : 319;
  if (x1 >= x0) { R.rect(x0, y - 2, x1, y + 2, m); R.rect(x0, y - 3, x1, y - 3, C.k); R.rect(x0, y + 3, x1, y + 3, C.k); }
};
// la calculadora en las manos (delante del pecho): la pantalla verde con las cifras que cambian al teclear; quemada, la
// pantalla parpadea en rojo
const calculadora = (x, y, t, teclea = true, quema = false) => { R.rect(x, y, x + 5, y + 6, C.k); R.rect(x + 1, y + 1, x + 4, y + 5, hex('#3a3e48')); R.rect(x + 1, y + 1, x + 4, y + 2, quema ? (Math.floor(t * 8) % 2 ? hex('#f04a3a') : hex('#5a1a1a')) : hex('#7ac88a')); if (teclea && Math.floor(t * 9) % 2) R.pset(x + 2 + Math.floor(t * 5) % 2, y + 1, hex('#1a3a22')); R.pset(x + 2, y + 4, hex('#c8ccd4')); R.pset(x + 3, y + 4, hex('#d84a3a')); };
// los prismáticos delante de los ojos (dir: hacia dónde mira)
const prismaticos = (x, y, dir) => { const X = dir > 0 ? x + 9 : x - 1; R.rect(X, y, X + 6, y + 3, C.k); R.pset(dir > 0 ? X + 6 : X, y + 1, hex('#8ac8f0')); R.pset(dir > 0 ? X + 6 : X, y + 2, hex('#4a8ac0')); R.pset(X + 3, y + 1, hex('#5a5e6a')); };
// una bocanada de humo gris que sube y se deshace (u 0–1)
const bocanada = (x, y, u, r0 = 1, c = hex('#8a8e98')) => { const r = r0 + u * 3, px = x + u * 3 + Math.sin(u * 7) * 1.5, py = y - u * 12; for (let yy = Math.round(py - r); yy <= py + r; yy++) for (let xx = Math.round(px - r); xx <= px + r; xx++) if (Math.hypot(xx - px, yy - py) <= r && umbral(xx, yy) < (1 - u) * 0.95) tine(xx, yy, c, 0.75); };

// ── 1 · a bordo: la nube se abre y es un motor ───────────────────────────────────────────────────────────────────
// la lancha de investigación de cerca, de tres cuartos y un poco desde arriba, con la proa a la izquierda (hacia la
// nube): la borda de enfrente por dentro, la cubierta antideslizante, la regala y el costado de este lado con su franja
// azul, la consola con su parabrisas bajo el techo de lona, las cañas, la nevera, la pescante y el fueraborda
const LP = { casco: hex('#f2f0ea'), cascoS: hex('#c4c8d2'), cascoD: hex('#8a90a0'), franja: hex('#2a5aa8'), franjaS: hex('#1e4280'), anti: hex('#b83a2a'), borda: hex('#2e3646'),
  metal: hex('#e4e8ee'), metalS: hex('#9aa4b4'), metalD: hex('#5a6474'), lona: hex('#2a4a8a'), lonaS: hex('#1e365e'), lonaL: hex('#3a5ea8'), cristal: hex('#5a7ea0'), cristalL: hex('#bfe0f4'),
  cub: hex('#d6d2c4'), cubS: hex('#b6b2a6'), cubD: hex('#8e8a80'), cubL: hex('#ece8dc'), espuma: hex('#f2fbfc'), espumaS: hex('#bfe6ee'), motor: hex('#2a2e38'), motorL: hex('#5a6070'),
  naranja: hex('#f07a2a'), amarillo: hex('#f0c030'), amarilloS: hex('#b88a1a'), sombraMar: hex('#0c4a68') };
const PROA = 84, POPA = 300;
const sB = (x) => Math.max(0, Math.min(1, (x - PROA) / 98));
// la borda de enfrente (por dentro), la regala de este lado y la línea de flotación, según x
const bordaLejos = (x) => 133 + Math.round(17 * (1 - sB(x)) ** 2);
const bordaCerca = (x) => 167 - Math.round(17 * (1 - sB(x)) ** 2);
const flotacion = (x) => bordaCerca(x) + 10 + Math.round(5 * (1 - sB(x)));
const cabeceo = (t) => Math.round(Math.sin(t * 1.6) * 1.2);
// el pie de los personajes en la cubierta
const XA1 = 154, XB1 = 176, cubiertaY = (t) => 156 + cabeceo(t);
const lancha = (t) => {
  const { pset, linea, disco, poligono } = R, b = cabeceo(t);
  // la sombra del casco en el agua y la ola de proa
  for (let x = PROA - 4; x <= POPA + 2; x++) { const yw = flotacion(Math.min(POPA, Math.max(PROA, x))) + b; for (let y = yw - 1; y < Math.min(180, yw + 4); y++) if (umbral(x, y) < 0.55) tine(x, y, LP.sombraMar, 0.4); }
  // la borda de enfrente por dentro, con su regala, los portacañas y las cornamusas
  for (let x = PROA + 1; x < POPA; x++) {
    const yl = bordaLejos(x) + b, h = 1 + Math.round(4 * sB(x));
    pset(x, yl - 2, C.k); pset(x, yl - 1, x % 9 === 0 ? C.blanco : LP.metal);
    for (let i = 0; i <= h; i++) pset(x, yl + i, i === 0 ? LP.cascoS : i === h ? LP.cascoD : (umbral(x, yl + i) < 0.25 + i * 0.12 ? LP.cascoS : LP.casco));
    if (x % 17 === 0 && h > 3) { pset(x, yl + 1, LP.borda); pset(x, yl + 2, LP.borda); pset(x + 1, yl + 1, LP.metalS); }
  }
  // la cubierta antideslizante: más oscura junto a la borda (su sombra), la luz hacia este lado, la trama de puntitos,
  // el filo liso de gelcoat y la sombra del techo de lona y de la consola (el sol está arriba a la derecha)
  for (let x = PROA + 2; x < POPA; x++) {
    const y0 = bordaLejos(x) + b + 2 + Math.round(4 * sB(x)), y1 = bordaCerca(x) + b - 3;
    for (let y = y0; y <= y1; y++) {
      const d = y - y0, e = y1 - y;
      let c = d < 1 ? LP.cubD : d < 3 ? (umbral(x, y) < 0.6 ? LP.cubS : LP.cub) : e < 1 ? LP.cubL : (umbral(x, y) < (y - y0) / (y1 - y0 + 1) * 0.35 ? LP.cubL : LP.cub);
      if (d === 3 || e === 2) c = LP.cubL; else if (d > 3 && e > 2 && ((x + 2 * y) % 4 === 0) && ((x - y) & 1)) c = LP.cubS;
      const sx = x + (y - 138) * 0.7;
      if (sx > 206 && sx < 262 && y < 162 && umbral(x, y) < 0.8) c = mezcla(c, hex('#5a5a6a'), 0.32);
      pset(x, y, c);
    }
  }
  // la escotilla del pañol de proa con sus bisagras, y el cabo adujado
  { const hy = 145 + b; R.rect(100, hy, 116, hy + 7, LP.cubD); R.rect(101, hy + 1, 115, hy + 6, LP.cubL); R.rect(101, hy + 6, 115, hy + 6, LP.cubS); pset(103, hy + 1, LP.metalS); pset(113, hy + 1, LP.metalS); R.rect(106, hy + 4, 110, hy + 4, LP.cubS);
    for (let r = 0; r < 3; r++) for (let a = 0; a < 6.283; a += 0.12) pset(Math.round(128 + Math.cos(a) * (5 - r * 1.4)), Math.round(152 + b + Math.sin(a) * (2.2 - r * 0.6)), r % 2 ? hex('#c8a46a') : hex('#e8c88a')); pset(128, 152 + b, hex('#8a6a3a')); }
  // las dos cañas en sus portacañas de la borda de enfrente, que se mecen
  for (const [cx, k] of [[194, 0], [203, 1]]) { const yl = bordaLejos(cx) + b, sw = Math.round(Math.sin(t * 1.6 + k) * 1.2), tx = cx + 8 + sw, ty = yl - 19; linea(cx, yl + 2, tx, ty, hex('#3a3a44')); pset(cx + 1, yl - 2, hex('#c8ccd4')); pset(cx + 2, yl - 3, LP.metalS); pset(tx, ty, C.rojo);
    for (let i = 1; i < 7; i++) pset(tx + Math.round(i * 0.3), ty + i + Math.round(i * i * 0.08), hex('#e8eef4')); }
  // el cubo con la esponja y la bolsa de lona de los instrumentos, junto a la borda de enfrente
  { const y = 146 + b; R.rect(138, y - 6, 145, y, C.k); R.rect(139, y - 5, 144, y, hex('#e8e4d8')); R.rect(142, y - 5, 144, y, hex('#b8b4a8')); R.rect(139, y - 5, 144, y - 5, hex('#f8f6f0')); pset(140, y - 6, hex('#f0c030')); pset(141, y - 6, hex('#f0c030'));
    R.rect(208, y - 4, 218, y + 1, C.k); R.rect(209, y - 3, 217, y, hex('#5a6a3a')); R.rect(209, y - 3, 217, y - 3, hex('#7a8a52')); pset(213, y - 1, hex('#c8a46a')); }
  // los brillos del agua que corre por la cubierta
  for (let k = 0; k < 6; k++) { const x = Math.round(100 + ruido(k, 1, 78) * 190), y = Math.round((bordaLejos(x) + bordaCerca(x)) / 2 + (ruido(k, 2, 78) - 0.5) * 18) + b; if (Math.sin(t * 2.3 + k * 1.7) > 0.6) { pset(x, y, C.blanco); pset(x + 1, y, LP.cubL); } }
  // el maletín amarillo de los instrumentos, sobre la cubierta

  for (let k = 0; k < 6; k++) { const u = (t * 0.7 + k / 6) % 1, px = 112 + vib + u * 18, py = 34 - u * 14 + Math.sin(u * 7 + k) * 2, r = 1 + u * 4; for (let yy = Math.max(17, Math.round(py - r)); yy <= py + r; yy++) for (let xx = Math.round(px - r); xx <= px + r; xx++) if (Math.hypot(xx - px, yy - py) <= r && umbral(xx, yy) < (1 - u) * 0.85) tine(xx, yy, C.blanco, 0.6); }
  for (const [jy, f] of [[29, 0], [151, 0.5]]) { const on = ((t * 0.8 + f) % 1.6) < 0.9; if (!on) continue; for (let k = 0; k < 7; k++) { const u = (t * 1.6 + k / 7) % 1, px = 133 + vib + u * 26, py = jy + vy - u * 8 + Math.sin(u * 8 + k) * 1.5, r = 0.8 + u * 3.5; for (let yy = Math.round(py - r); yy <= py + r; yy++) for (let xx = Math.round(px - r); xx <= px + r; xx++) if (Math.hypot(xx - px, yy - py) <= r && umbral(xx, yy) < (1 - u) * 0.8) tine(xx, yy, C.blanco, 0.65); } }
  for (let k = 0; k < 5; k++) { const u = (t * 1.1 + k / 5) % 1, px = 4 + u * 14 + vib, py = 151 + vy - u * 10, r = 0.8 + u * 3; for (let yy = Math.round(py - r); yy <= py + r; yy++) for (let xx = Math.round(px - r); xx <= px + r; xx++) if (Math.hypot(xx - px, yy - py) <= r && umbral(xx, yy) < (1 - u) * 0.7) tine(xx, yy, C.blanco, 0.5); }
};
// el rizo de aire: una espiral blanca de 2 px con contorno azul oscuro y su estela ondulada
const rizo = (x, y, t, a = 1) => {
  const pts = []; for (let k = 0; k < 14; k++) { const an = -t * 7 + k * 0.5, r = 5.2 - k * 0.3; pts.push([x + Math.cos(an) * r, y + Math.sin(an) * r * 0.85]); }
  for (let i = 1; i <= 7; i++) pts.push([x - 5 - i * 2.2, y + 4 + Math.sin(t * 9 - i * 0.9) * 1.6]);
  const marca = new Set();
  for (const [px, py] of pts) for (let dy = -1; dy <= 2; dy++) for (let dx = -1; dx <= 2; dx++) { const X = Math.round(px) + dx, Y = Math.round(py) + dy, k = Y * 320 + X; if (!marca.has(k)) { marca.add(k); tine(X, Y, hex('#22305a'), 0.8 * a); } }
  for (const [px, py] of pts) { const X = Math.round(px), Y = Math.round(py); R.pset(X, Y, C.blanco); R.pset(X + 1, Y, C.blanco); R.pset(X, Y + 1, hex('#dff2ff')); R.pset(X + 1, Y + 1, hex('#bfe0f4')); }
};
const p4 = (t) => {
  const { pset } = R;
  T.maquinaCalor(R, t, { boya: false, barco: false, crece: 0.35 }); fondoP4(t); desenfoca(133); vidaP4(t);
  // la tobera tose justo antes del rizo: el motor da un tirón y la tobera se hincha
  const tos = entre(t, TOS, TOS + 0.3) ? Math.sin(lin(t, TOS, TOS + 0.3) * Math.PI) : 0;
  const vib = Math.round(Math.sin(t * 47) * (1 + tos)), vy = Math.round(Math.cos(t * 39) * 0.6);
  costado(t, vib, vy);
  // la tobera de latón que sale del costado y apunta a la derecha, con sus aros y su brillo
  const x0 = 128 + vib, x1 = 166 + vib, cy = 98 + vy;
  { for (let x = x0; x <= x1; x++) { const q = (x - x0) / (x1 - x0), hw = Math.round(5 + q * q * 8 + tos * 2 * Math.sin(q * Math.PI)); for (let y = cy - hw; y <= cy + hw; y++) { const v = (y - cy) / hw; pset(x, y, Math.abs(v) > 0.85 ? C.k : v < -0.6 ? (umbral(x, y) < 0.5 ? C.blanco : LATL) : v < -0.4 ? LATL : v > 0.45 ? LATS : LAT); } if ((x - x0) % 12 === 0) for (let y = cy - hw; y <= cy + hw; y++) pset(x, y, Math.abs(y - cy) >= hw - 1 ? C.k : LATS); }
    for (let y = cy - 12; y <= cy + 12; y++) { pset(x1, y, C.k); pset(x1 + 1, y, Math.abs(y - cy) < 11 ? hex('#1a1e2a') : C.k); }
    for (let k = 0; k < 4; k++) pset(x0 + 6 + k * 12, cy + 5 + Math.round(k * 0.6), hex('#6a4a1a')); }
  // el rizo de aire: sale a «tiny fraction» de la boca de la tobera (con una bocanadita), cruza despacio en arco y en
  // «wind» llega al molinillo
  const ri = lin(t, diminuta - 0.05, viento - 0.05), e = suave(ri);
  const acerca = suave(lin(t, M4 + 0.15, diminuta - 0.25)), sacudo = t > viento + 0.7 ? Math.round(Math.sin(t * 22) * 1.5 * (1 - lin(t, viento + 0.7, viento + 1.3))) : 0, mx = Math.round(lerp(345, 232, acerca)) + sacudo;
  const rx = lerp(x1 + 6, mx - 22, e), ry = lerp(cy, 80, e) - Math.sin(e * Math.PI) * 12 + Math.sin(ri * 11) * 2;
  { const u = lin(t, diminuta - 0.12, diminuta + 0.4); if (u > 0 && u < 1) bocanada(x1 + 4, cy + 2, u, 1.5, hex('#c8ccd4')); }
  if (ri > 0 && ri < 1) rizo(rx, ry, t);
  // la gaviota: baja desde arriba y se posa en la tobera (tiembla con ella); mira el motor que ruge, salta con la tos y
  // sigue el rizo con la cabeza (la levanta cuando sube); cuando el molinillo se para, se encoge de alas
  { const gxp = 146 + vib, gyp = cy - 7;
    if (t < P4_POSA) { const s = lin(t, P4_BAJA, P4_POSA); if (s > 0) gaviotaVuela(lerp(188, gxp, suave(s)), lerp(-8, gyp - 6, suave(s)) - Math.sin(s * Math.PI) * 4, t, -1); }
    else {
      const encoge = entre(t, viento + 0.75, viento + 1.15), salto = entre(t, P4_POSA, P4_POSA + 0.12) || entre(t, viento + 0.7, viento + 0.82) || (tos > 0.5) ? 1 + (tos > 0.5 ? 2 : 0) : 0;
      let dir = 1, arriba = false;
      if (t < TOS) dir = entre(t, P4_POSA + 0.45, P4_POSA + 0.95) ? -1 : 1;
      else if (ri > 0 && ri < 1) { dir = rx >= gxp ? 1 : -1; arriba = ry < gyp - 12; }
      else if (ri >= 1) arriba = true;
      if (encoge) gaviotaPie(gxp, gyp, 1, salto, true); else if (arriba) R.dibujo(GAV_MIRA, Math.round(gxp - 6), Math.round(gyp - 10 - salto), dir, PAL_GAV); else gaviotaPie(gxp, gyp, dir, salto); } }
  // el molinillo en la mano de la científica (la mano canónica, que entra por la derecha): da un cuarto de vuelta en
  // «wind» y se para; ella lo sacude
  const gira = suave(lin(t, viento - 0.1, viento + 0.6)) * Math.PI / 2 + Math.sin(t * 1.5) * 0.04;
  // (el palo pasa por detrás de los dedos: la mano lo agarra)
  molinillo(mx - 5, 74, gira + 0.3);
  manoLarga(mx, 106, -1, AZUL);
  if (t > viento + 0.1 && t < viento + 0.6) for (const [dx, dy] of [[-16, -8], [14, -12], [16, 6]]) pset(mx - 5 + dx, 74 + dy, C.blanco);
};
const efectos = [[0.4, 'whoosh'], [P1_POSA, 'golpecito'], [motorT, 'cerrojo'], [corre, 'motor'], [P1_VA + 0.05, 'whoosh'], [calorT + 0.3, 'boing'], [noaa - 0.3, 'tecleo'], [estima + 0.2, 'bip'],
  [M2 + 0.1, 'zumbido'], [TOQUES[0], 'toc'], [TOQUES[1], 'toc'], [lluviaT - 0.2, 'lluvia'], [lluviaT + 0.5, 'papel'], [c150, 'pop'], [c150 + 0.08, 'boing'], [c150 + 0.1, 'vapor'],
  [M3 + 0.05, 'brillo'], ...[todas - 0.1, ...sale.slice(2)].map((s) => [s + 0.05, 'pop']), [planeta + 0.2, 'zumbido'], [CALIENTA, 'pop'], [CALIENTA + 0.1, 'vapor'],
  [M4 + 0.05, 'motor'], [P4_POSA, 'golpecito'], [diminuta, 'whoosh'], [viento, 'tic'], [viento + 0.25, 'tic'], [viento + 0.75, 'papel']];
T.rodar(E, R, [[0, p1], [M2, p2], [M3, p3], [M4, p4]], { efectos });
</script>
