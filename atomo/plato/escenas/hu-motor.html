<title>El motor · ep12</title>

<body>
<canvas id="lienzo"></canvas>
<script type="module">
// HU-MOTOR (frase 8), sin año: el huracán como motor. Cuatro planos:
// 1. la lancha frente a la torre de nubes: una gaviota llega planeando y se posa en el techo de lona; el científico, sin
//    la gorra que se le voló en hu-calor, mira la nube con pena; en «engine» se abre en la nube la ventana de chapa
//    remachada y los dos se asombran (él con los brazos en alto); en «runs» arrancan los pistones de nube, el cigüeñal y el
//    volante y la gaviota se espanta y se va; en «heat» el mar se enciende debajo y sale su gorra roja montada en el pistón
//    del medio, subiendo y bajando (gag): él la señala, ella se ríe; en «NOAA» ella saca la calculadora y teclea, y él se
//    asoma a mirar;
// 2. (corta en «An average one») el manómetro del motor de cerca, en su chapa remachada, con el ojo de buey que deja ver la
//    tormenta de fuera (una gaviota lucha contra el viento y relampaguea): el brazo de la científica entra por la derecha y
//    da dos golpecitos al cristal en «releases» (la aguja salta y sube); en «rain» la lluvia corre por la chapa y la mano
//    limpia el cristal; en «one hundred fifty» la aguja se clava en el tope, la mano se aparta de golpe, salta un remache
//    (gag), todo tiembla, la válvula escupe vapor y aparece «×150»;
// 3. (corta en «fifty times») la lancha y el motor otra vez, con el «×150» en el cielo y la gorra que sigue en su pistón:
//    ella se lo cuenta a él; en «all the power plants» salen una a una las centrales eléctricas de la costa, cada una con su
//    saltito, ella las cuenta tecleando en la calculadora y él las mira con los prismáticos; un velero cruza despacio por
//    delante de la costa; en «planet» los dos se quedan boquiabiertos y por los cables corre la electricidad, y en «produce»
//    la calculadora se recalienta y echa humo (gag): ella la abanica y él se ríe;
// 4. (corta en «although») de cerca, el costado del motor que ruge (el volante enorme, chispas, vapor, todo vibra) y su
//    tobera de latón; una gaviota baja y se posa en la tobera, que la hace temblar; el brazo de la científica (entra por la
//    derecha) acerca un molinillo de papel; en «tiny fraction» sale un rizo de aire diminuto que la gaviota sigue con la
//    mirada, cruza despacio y en «wind» llega al molinillo: da un cuarto de vuelta y se para; ella lo sacude y la gaviota
//    se encoge de alas (gag).
import * as T from '/atomo/plato/escenas/hu-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
import { TOCADOS } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hu-motor');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const C = T.C;
const lin = (t, x, y) => Math.max(0, Math.min(1, (t - x) / (y - x)));
const entre = (t, x, y) => t >= x && t < y;
const suave = (u) => u * u * (3 - 2 * u);
const ruido = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const umbral = (x, y) => (B4[((y & 3) << 2) + (x & 3)] + 0.5) / 16;
// mezcla dos colores del lienzo (ABGR) y tiñe un píxel
const mezcla = (p, c, a) => { const r = p & 255, g = (p >> 8) & 255, b = (p >> 16) & 255; return (0xff000000 | (Math.round(b + (((c >> 16) & 255) - b) * a) << 16) | (Math.round(g + (((c >> 8) & 255) - g) * a) << 8) | Math.round(r + ((c & 255) - r) * a)) >>> 0; };
const tine = (x, y, c, a) => { x = Math.round(x); y = Math.round(y); if (x < 0 || x > 319 || y < 0 || y > 179) return; const B = R.buf, i = y * 320 + x; B[i] = mezcla(B[i], c, a); };
// la zona de Atom y la de la barra del año quedan como fondo tranquilo
const tranquilo = (x, y) => (x >= 274 && y <= 47) || (x <= 172 && y <= 15);
const destello = (x, y, r, c = C.blanco) => { for (let i = 0; i <= r; i++) { R.pset(x + i, y, c); R.pset(x - i, y, c); R.pset(x, y + i, c); R.pset(x, y - i, c); } };
const TMP = new Uint32Array(320 * 180);
// el desenfoque del fondo de un inserto, solo en la franja [x0, 319] (lo de la izquierda lo tapa el costado del motor):
// una pasada horizontal y otra vertical de cinco tomas (1 2 2 2 1)
const desenfoca = (x0 = 0) => {
  const B = R.buf, ch = (p, s) => (p >> s) & 255;
  const pasa = (hor) => {
    for (let y = 0; y < 180; y++) for (let x = x0; x < 320; x++) {
      const at = (d) => (hor ? B[y * 320 + Math.max(x0, Math.min(319, x + d))] : B[Math.max(0, Math.min(179, y + d)) * 320 + x]);
      const a = at(-2), b = at(-1), m = B[y * 320 + x], c = at(1), d = at(2);
      const mix = (s) => (ch(a, s) + 2 * ch(b, s) + 2 * ch(m, s) + 2 * ch(c, s) + ch(d, s)) >> 3;
      TMP[y * 320 + x] = (0xff000000 | (mix(16) << 16) | (mix(8) << 8) | mix(0)) >>> 0;
    }
    for (let y = 0; y < 180; y++) for (let x = x0; x < 320; x++) B[y * 320 + x] = TMP[y * 320 + x];
  };
  pasa(true); pasa(false);
};
// el cuadro entero que tiembla (dx, dy px)
const sacude = (dx, dy) => { if (!dx && !dy) return; const B = R.buf; TMP.set(B); for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) B[y * 320 + x] = TMP[Math.min(179, Math.max(0, y - dy)) * 320 + Math.min(319, Math.max(0, x - dx))]; };
// la gaviota de cerca: de pie (x, y: entre las patas) o volando, con su contorno para que se lea sobre el cielo
const PAL_GAV = { k: C.k, W: hex('#f8f6f0'), w: hex('#d8dce4'), G: hex('#a8b0bc'), D: hex('#3a3e48'), Y: hex('#f0b030') };
const GAV_PIE = ['.......kkk..', '......kWWWk.', '......kWkWYY', '.....kWWWWk.', '.kkkkWWWWk..', 'kDGGGGWWWk..', '.kDGGGGwWk..', '..kkkkkkk...', '....Y..Y....', '....Y..Y....'];
// la misma, con las alas abiertas hacia arriba (se encoge de alas o va a echar a volar)
const GAV_ALAS = ['.k.........k', 'kGk.kkk..kGk', '.kGkWWWkkGk.', '..kGWkWYYk..', '...kWWWWk...', '..kWWWWk....', '..kWWwWk....', '...kkkkk....', '....Y..Y....', '....Y..Y....'];
const gaviotaPie = (x, y, dir = 1, salto = 0, alas = false) => R.dibujo(alas ? GAV_ALAS : GAV_PIE, Math.round(x - 6), Math.round(y - 10 - salto), dir, PAL_GAV);
const gaviotaVuela = (x, y, t, dir = 1) => {
  x = Math.round(x); y = Math.round(y); const al = Math.sin(t * 13) > 0 ? -1 : 1, P = [[-7, al * 3 - 1], [-3, -1], [0, 0], [3, -1], [7, al * 3 - 1]];
  for (let i = 1; i < P.length; i++) { R.linea(x + P[i - 1][0], y + P[i - 1][1] + 1, x + P[i][0], y + P[i][1] + 1, C.k); R.linea(x + P[i - 1][0], y + P[i - 1][1] - 1, x + P[i][0], y + P[i][1] - 1, C.k); }
  for (let i = 1; i < P.length; i++) R.linea(x + P[i - 1][0], y + P[i - 1][1], x + P[i][0], y + P[i][1], i === 1 || i === 4 ? PAL_GAV.G : PAL_GAV.W);
  R.pset(x - 7, y + al * 3 - 1, PAL_GAV.D); R.pset(x + 7, y + al * 3 - 1, PAL_GAV.D);
  R.rect(x - 2, y, x + 2, y + 2, C.k); R.rect(x - 1, y + 1, x + 1, y + 1, PAL_GAV.W); R.pset(x + dir * 3, y + 1, PAL_GAV.Y);
};

const m = (f) => en('motor', f);
// los cortes: «An (average one)», «fifty (times)», «although» (fracciones medidas con las pausas de la voz inglesa)
const M2 = m(0.267), M3 = m(0.521), M4 = m(0.799);
const motorT = m(0.054), corre = m(0.093), calorT = m(0.131), noaa = m(0.197), estima = m(0.211), libera = m(0.313), lluviaT = m(0.403), c150 = m(0.479);
const todas = m(0.625), centrales = m(0.651), planeta = m(0.719), produce = m(0.745), diminuta = m(0.855), fraccion = m(0.872), convierte = m(0.940), viento = m(0.979);
const AZUL = '#2a4a7a';   // la manga del polo azul marino de los científicos
const XA = 220, XB = 238;
const PALG = { X: hex('#d8463a'), w: hex('#f6f2ea') };
// la gorra roja del científico (la misma de hu-calor), aquí en pequeño: se le voló dentro de la nube y va montada en un pistón
TOCADOS.gorraRoja = [['...kkkkkkkk....', '..kXXXXXXXXk...', '.kXXXXXwXXXXk..', '.kkkkkkkkkkkkkk', '..........kkkk.'], -2];
const GORRITA = ['..kkkkk...', '.kXXXXXk..', 'kXXXwXXXk.', 'kkkkkkkkkk'];
const PAL_GORRA = { k: C.k, X: PALG.X, w: PALG.w };
// la gorra en el pistón del medio del motor (x 118): sube y baja con él, y de vez en cuando da media vuelta
const gorraPiston = (t) => {
  const ph = t * 3.4 + 2.094, yp = Math.round(73 + Math.sin(ph) * 8), dir = Math.sin(t * 1.7) > 0 ? 1 : -1;
  R.recorte([90, 57, 146, 95]); R.dibujo(GORRITA, 118 - 5, yp - 6, dir, PAL_GORRA); R.recorte(null);
};
// la mano canónica con la manga que llega hasta el borde del cuadro (dir −1: el brazo entra por la derecha), para que no
// quede un brazo cortado en el aire
const manoLarga = (x, y, dir, manga) => { T.mano(R, x, y, dir, manga); x = Math.round(x); y = Math.round(y);
  const x0 = dir < 0 ? x + 43 : 0, x1 = dir < 0 ? 319 : x - 43; if (x1 < x0) return;
  R.rect(x0, y - 2, x1, y + 2, hex(manga)); R.rect(x0, y - 3, x1, y - 3, C.k); R.rect(x0, y + 3, x1, y + 3, C.k); R.rect(x0, y - 2, x1, y - 2, mezcla(hex(manga), C.blanco, 0.18)); };
// el mismo mar sin las centrales: tapa la costa de la derecha mientras no tocan (el modo motor las saca desde 0,4)
const SIN = R.nuevo();
const tapaCentrales = (t, o) => { const prev = R.usar(SIN); T.maquinaCalor(R, t, { ...o, motor: 0.001, barco: false }); R.usar(prev); const B = R.buf; for (let y = 36; y <= 128; y++) for (let x = 204; x < (y > 120 ? 247 : 320); x++) if (!(x >= 273 && x <= 283 && y >= 100)) B[y * 320 + x] = SIN[y * 320 + x]; };
// la calculadora en las manos (delante del pecho): la pantalla verde con las cifras que cambian al teclear
const calculadora = (x, y, t, teclea = true) => { R.rect(x, y, x + 5, y + 6, C.k); R.rect(x + 1, y + 1, x + 4, y + 5, hex('#3a3e48')); R.rect(x + 1, y + 1, x + 4, y + 2, hex('#7ac88a')); if (teclea && Math.floor(t * 9) % 2) R.pset(x + 2 + Math.floor(t * 5) % 2, y + 1, hex('#1a3a22')); R.pset(x + 2, y + 4, hex('#c8ccd4')); R.pset(x + 3, y + 4, hex('#d84a3a')); };
// los prismáticos delante de los ojos (dir: hacia dónde mira)
const prismaticos = (x, y, dir) => { const X = dir > 0 ? x + 9 : x - 1; R.rect(X, y, X + 6, y + 3, C.k); R.pset(dir > 0 ? X + 6 : X, y + 1, hex('#8ac8f0')); R.pset(dir > 0 ? X + 6 : X, y + 2, hex('#4a8ac0')); R.pset(X + 3, y + 1, hex('#5a5e6a')); };
// una bocanada de humo gris que sube y se deshace (u 0–1)
const bocanada = (x, y, u, r0 = 1, c = hex('#8a8e98')) => { const r = r0 + u * 3, px = x + u * 3 + Math.sin(u * 7) * 1.5, py = y - u * 12; for (let yy = Math.round(py - r); yy <= py + r; yy++) for (let xx = Math.round(px - r); xx <= px + r; xx++) if (Math.hypot(xx - px, yy - py) <= r && umbral(xx, yy) < (1 - u) * 0.95) tine(xx, yy, c, 0.75); };

// ── 1 · la nube se abre y es un motor ─────────────────────────────────────────────────────────────────────────────
const P1_POSA = 0.95, P1_VA = corre + 0.12;
const p1 = (t) => {
  const u = 0.001 + 0.319 * suave(lin(t, motorT - 0.1, motorT + 0.5)) + 0.18 * lin(t, corre - 0.1, calorT + 0.15), o = { motor: u, barco: true };
  T.maquinaCalor(R, t, o); tapaCentrales(t, o);
  if (entre(t, motorT - 0.05, motorT + 0.5)) { const k = lin(t, motorT - 0.05, motorT + 0.5); for (let i = 0; i < 14; i++) { const an = i / 14 * 6.283, r = 10 + k * 40; tine(118 + Math.cos(an) * r * 1.3, 76 + Math.sin(an) * r, C.blanco, 0.8 * (1 - k)); } }
  // la gorra roja del científico, montada en el pistón del medio (los pistones salen en «heat»)
  if (u >= 0.5) gorraPiston(t);
  // la gaviota: llega planeando por la derecha, se posa en el techo de lona, da un respingo con la ventana y se va al arrancar
  { const dy = Math.round(Math.sin(t * 1.6) * 1.2);
    if (t < P1_POSA) { const s = suave(lin(t, 0, P1_POSA)); gaviotaVuela(lerp(338, 254, s), lerp(72, 117, s) - Math.sin(s * Math.PI) * 8, t, -1); }
    else if (t < P1_VA) gaviotaPie(254, 125 + dy, -1, entre(t, P1_POSA, P1_POSA + 0.12) || entre(t, motorT + 0.05, motorT + 0.25) ? 1 : 0, entre(t, motorT + 0.05, motorT + 0.4));
    else { const s = lin(t, P1_VA, P1_VA + 1.1); if (s < 1) gaviotaVuela(lerp(254, 346, s), lerp(118, 62, s) + Math.sin(s * 9) * 2, t, 1); } }
  const y = T.c_cubiertaY(t);
  const teclea = entre(t, noaa - 0.35, M2 + 0.3), veGorra = calorT + 0.25;
  // ella: se asombra con la ventana, señala el motor, se ríe de la gorra y saca la calculadora
  R.actor(EL.pronosticadora, XA, y, t, { dir: -1, sorpresa: entre(t, motorT + 0.1, corre + 0.2), dedo: entre(t, corre, veGorra), sonrisa: entre(t, veGorra + 0.25, noaa - 0.3), habla: teclea && entre(t, estima - 0.1, estima + 0.6) && Math.floor(t * 7) % 2 === 0 });
  if (teclea) calculadora(XA - 2, y - 11, t);
  // él, sin gorra: mira la nube con pena, levanta los brazos con la ventana y señala su gorra en el pistón
  R.actor(EL.pronosticador, XB, y, t, { dir: -1, triste: t < motorT, brazos: entre(t, motorT + 0.15, corre + 0.5), sorpresa: entre(t, motorT + 0.1, calorT) || entre(t, veGorra, veGorra + 0.5), dedo: entre(t, veGorra, noaa - 0.2), enfado: entre(t, veGorra + 0.5, noaa - 0.2), sonrisa: t > estima + 0.2, pal: PALG });
};

// ── 2 · el manómetro: ×150 ────────────────────────────────────────────────────────────────────────────────────────
const CH = [hex('#262c40'), hex('#323a52'), hex('#3e4760'), hex('#4c566f'), hex('#5e6984'), hex('#76829c')];
const LAT = hex('#d8a83a'), LATS = hex('#9a6a1a'), LATL = hex('#f8d878'), COB = hex('#c87a4a'), COBS = hex('#8a4a2a'), COBL = hex('#f0a878');
const remache = (x, y) => { R.pset(x, y, CH[5]); R.pset(x + 1, y, CH[3]); R.pset(x, y + 1, CH[3]); R.pset(x + 1, y + 1, CH[0]); };
const angAguja = (v) => (225 - v / 160 * 270) * Math.PI / 180;
// los dos golpecitos al cristal en «releases»
const TOQUES = [libera - 0.05, libera + 0.22];
const aguja = (t) => {
  if (t > c150 + 0.06) return 163 + Math.sin(t * 38) * 2.5 * Math.max(0, 1 - (t - c150) / 1.4);
  const salto = TOQUES.reduce((s, k) => s + 7 * Math.max(0, 1 - Math.abs(t - k - 0.06) / 0.12), 0);
  return 10 + Math.sin(t * 9) * 1.5 + salto + 48 * suave(lin(t, libera + 0.1, libera + 0.7)) + 46 * suave(lin(t, lluviaT, lluviaT + 0.7)) + 58 * lin(t, c150 - 0.12, c150 + 0.06);
};
const GCX = 122, GCY = 90, GR = 54, OX = 256, OY = 116, ORR = 26;
// la gaviota que se ve por el ojo de buey, luchando contra el viento: aletea hacia la izquierda y la racha la devuelve
const gaviotaFuera = (t) => {
  const u = lin(t, M2 + 0.6, c150 + 0.3); if (u <= 0 || u >= 1) return;
  const x = OX + 26 - u * 34 + Math.sin(u * 11) * 6 + (u > 0.75 ? (u - 0.75) * 120 : 0), y = OY - 6 + Math.sin(t * 5) * 3 + Math.sin(u * 7) * 4, al = Math.sin(t * 16) > 0 ? -1 : 1;
  const P = [[-4, al * 2], [-3, al], [-2, 0], [-1, 0], [0, 1], [1, 0], [2, 0], [3, al], [4, al * 2]];
  for (const [dx, dy] of P) { const X = Math.round(x + dx), Y = Math.round(y + dy); if (Math.hypot(X - OX, Y - OY) < ORR - 6) tine(X, Y, hex('#e8ecf4'), 0.85); }
  if (Math.hypot(x - OX, y + 2 - OY) < ORR - 6) tine(x, y + 2, hex('#3a3e48'), 0.7);
};
const p2 = (t) => {
  const { rect, pset, disco, linea } = R, BF = R.buf;
  // la chapa: degradado tramado con la luz arriba a la izquierda, juntas con remaches, arañazos y manchas de grasa
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) { const v = 3.3 - x / 320 * 1.4 - y / 180 * 1.3 + Math.sin(x * 0.07 + y * 0.01) * 0.12, l = Math.floor(v) + (v - Math.floor(v) > umbral(x, y) ? 1 : 0); BF[y * 320 + x] = CH[Math.max(0, Math.min(5, l))]; }
  for (const jx of [44, 204, 312]) { rect(jx, 0, jx, 179, CH[0]); rect(jx + 1, 0, jx + 1, 179, CH[5]); for (let y = 5; y < 180; y += 9) { remache(jx - 4, y); remache(jx + 4, y); } }
  for (const jy of [16, 164]) { rect(0, jy, 319, jy, CH[0]); rect(0, jy + 1, 319, jy + 1, CH[5]); for (let x = 3; x < 320; x += 9) { remache(x, jy - 4); remache(x, jy + 4); } }
  for (let k = 0; k < 18; k++) { const x0 = Math.round(ruido(k, 1, 61) * 300), y0 = Math.round(ruido(k, 2, 61) * 170), L = 4 + Math.round(ruido(k, 3, 61) * 10); for (let i = 0; i < L; i++) pset(x0 + i, y0 + Math.round(i * (ruido(k, 4, 61) - 0.5)), CH[ruido(k, 5, 61) < 0.5 ? 5 : 1]); }
  for (let k = 0; k < 5; k++) { const cx = ruido(k, 6, 61) * 320, cy = ruido(k, 7, 61) * 180, r = 6 + ruido(k, 8, 61) * 9; for (let y = Math.round(cy - r); y < cy + r; y++) for (let x = Math.round(cx - r); x < cx + r; x++) if (Math.hypot(x - cx, (y - cy) * 1.4) < r && umbral(x, y) < 0.4) tine(x, y, hex('#141826'), 0.35); }
  // la placa de latón (sin letras) con sus cuatro tornillos, la tubería gruesa de abajo con su brida y las franjas de aviso
  { rect(190, 150, 236, 161, C.k); rect(191, 151, 235, 160, LATS); rect(191, 151, 235, 151, LATL); rect(192, 152, 234, 159, LAT); for (const [sx, sy] of [[194, 154], [232, 154], [194, 158], [232, 158]]) pset(sx, sy, LATS); rect(198, 155, 228, 155, LATS); rect(202, 157, 224, 157, LATS); }
  rect(0, 168, 319, 179, C.k); rect(0, 169, 319, 178, CH[3]); rect(0, 169, 319, 170, CH[5]); rect(0, 177, 319, 178, CH[0]); for (const fx of [60, 180, 290]) { rect(fx - 3, 166, fx + 3, 179, C.k); rect(fx - 2, 167, fx + 2, 179, CH[4]); pset(fx - 1, 168, CH[5]); }
  for (let x = 0; x < 320; x++) for (let y = 162; y < 166; y++) pset(x, y, Math.floor((x + y) / 5) % 2 ? hex('#e8c040') : hex('#1c1c24'));
  // el resplandor del calor que sube desde abajo, al ritmo del motor
  { const p = 0.55 + 0.35 * Math.sin(t * 6.8); for (let y = 140; y < 180; y++) for (let x = 0; x < 320; x++) if (umbral(x, y) < (y - 140) / 40 * p * 0.8) tine(x, y, hex('#f07a3a'), 0.35); }

    if (t < P4_POSA) { const s = lin(t, P4_BAJA, P4_POSA); if (s > 0) gaviotaVuela(lerp(188, gxp, suave(s)), lerp(-8, gyp - 6, suave(s)) - Math.sin(s * Math.PI) * 4, t, -1); }
    else { const encoge = entre(t, viento + 0.75, viento + 1.15), salto = entre(t, P4_POSA, P4_POSA + 0.12) || entre(t, viento + 0.7, viento + 0.82) ? 1 : 0; gaviotaPie(gxp, gyp, 1, salto, encoge); } }
  // el rizo de viento: diminuto, sale a «tiny fraction», cruza despacio y llega al molinillo en «wind»
  const ri = lin(t, diminuta - 0.1, viento - 0.05), rx = lerp(170, 220, suave(ri)), ry = 98 + Math.sin(ri * 9) * 3 - ri * 20;
  if (ri > 0 && ri < 1) { for (let k = 0; k < 9; k++) { const a = -t * 9 + k * 0.6, r2 = 3.2 - k * 0.3; pset(Math.round(rx + Math.cos(a) * r2), Math.round(ry + Math.sin(a) * r2), C.blanco); } for (let i = 1; i < 6; i++) { tine(rx - i * 2, ry + Math.sin(t * 10 - i) * 1.2, C.blanco, 0.7 - i * 0.12); tine(rx - i * 2, ry + 1 + Math.sin(t * 10 - i) * 1.2, hex('#6a8ab8'), 0.5 - i * 0.08); } }
  // el molinillo en la mano de la científica (el brazo entra por la derecha): da un cuarto de vuelta en «wind» y se para;
  // ella lo sacude
  const gira = suave(lin(t, viento - 0.1, viento + 0.6)) * Math.PI / 2 + Math.sin(t * 1.5) * 0.04;
  const acerca = suave(lin(t, M4 + 0.4, fraccion)), sacudo = t > viento + 0.7 ? Math.round(Math.sin(t * 22) * 1.5 * (1 - lin(t, viento + 0.7, viento + 1.3))) : 0, mx = Math.round(lerp(262, 232, acerca)) + sacudo;
  // (el palo pasa por detrás de los dedos: la mano lo agarra)
  molinillo(mx - 5, 74, gira + 0.3);
  manoLarga(mx, 106, -1, AZUL);
  if (t > viento + 0.1 && t < viento + 0.6) for (const [dx, dy] of [[-16, -8], [14, -12], [16, 6]]) pset(mx - 5 + dx, 74 + dy, C.blanco);
};
const efectos = [[0.4, 'whoosh'], [P1_POSA, 'golpecito'], [motorT, 'cerrojo'], [corre, 'motor'], [P1_VA + 0.05, 'whoosh'], [calorT + 0.3, 'boing'], [noaa - 0.3, 'tecleo'], [estima + 0.2, 'bip'],
  [M2 + 0.1, 'zumbido'], [TOQUES[0], 'toc'], [TOQUES[1], 'toc'], [lluviaT - 0.2, 'lluvia'], [lluviaT + 0.5, 'papel'], [c150, 'pop'], [c150 + 0.08, 'boing'], [c150 + 0.1, 'vapor'],
  [M3 + 0.05, 'brillo'], ...[todas - 0.1, ...sale.slice(2)].map((s) => [s + 0.05, 'pop']), [planeta + 0.2, 'zumbido'], [CALIENTA, 'pop'], [CALIENTA + 0.1, 'vapor'],
  [M4 + 0.05, 'motor'], [P4_POSA, 'golpecito'], [diminuta, 'whoosh'], [viento, 'tic'], [viento + 0.25, 'tic'], [viento + 0.75, 'papel']];
T.rodar(E, R, [[0, p1], [M2, p2], [M3, p3], [M4, p4]], { efectos });
