// 13. el cumpleaños: el bollo con la vela; Lenore le pasa el paquete con «gives him» y sale el pedernal con «flint»;
// 14. el pedernal de cerca (fondo local): se doran el pájaro («bird») y la serpiente («snake»); Atom lo golpea: chispa y

// 15. la tienda de los Donner: Haymitch paga, Maysilee le da la bolsa; con «hold on to those gumdrops» Atom se guarda una:

// 18. el lago al atardecer: la urna de la cosecha aparece sobre el sol con «reaping» y late con «sun» y «tomorrow»;
// 19. inserto (fondo local): la corteza del tronco al atardecer; la mano de Lenore trae la llave y abre el candado con
//     «key»; Atom al doble piensa, se sorprende y se entristece con «no proof» (corta en «that you»);
// 20. contraluz (fondo local): el sol se hunde detrás del bosque con «always happened before»; siluetas y ocas en fila.
import * as T from '/atomo/plato/escenas/hm-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hm-doce');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const FA = (f) => en('familia', f), FL = (f) => en('lenore', f), FB = (f) => en('burdock', f), FR = (f) => en('regalos', f), FP = (f) => en('prado', f);
// ── ayudas ──────────────────────────────────────────────────────────────────────────────────────────────────────
const K = hex('#1a1424');
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const vn = (x, y, k = 0) => { const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy); const p = hh(xi, yi, k), q = hh(xi + 1, yi, k), r = hh(xi, yi + 1, k), s = hh(xi + 1, yi + 1, k); return p + (q - p) * sx + (r - p) * sy + (p - q - r + s) * sx * sy; };
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const tr = (x, y, u) => u * 16 > B4[((y & 3) << 2) | (x & 3)] + 0.5;
const mezcla = (c1, c2, u) => (0xff000000 | (Math.round(((c1 >> 16) & 255) * (1 - u) + ((c2 >> 16) & 255) * u) << 16) | (Math.round(((c1 >> 8) & 255) * (1 - u) + ((c2 >> 8) & 255) * u) << 8) | Math.round((c1 & 255) * (1 - u) + (c2 & 255) * u)) >>> 0;
const P = (x, y, col) => R.pset(Math.round(x), Math.round(y), col);
const BF = {};
const horno = (k, f) => { if (!BF[k]) { const bb = R.nuevo(), prev = R.usar(bb); f(); R.usar(prev); BF[k] = bb; } R.copiar(BF[k]); };
const VOZ = [[FA(0), FA(1)], [FL(0), FL(1)], [FB(0), FB(1)], [FR(0), FR(1)], [FP(0), FP(1)]];
const voz = (t) => (VOZ.some(([p, q]) => t > p && t < q) ? 1 : 0);
const habla = (t, k = 0) => Math.sin(t * 13 + k) > 0;
const GUARDA = en('regalos', 0.7068);   // Atom se guarda la gominola: desde aquí lleva el electrón dorado (extra) hasta el final

// una caja de botellas (x, y = esquina de abajo a la izquierda; 14 × 9) con los cuellos y los tapones
const cajaBotellas = (x, y) => { R.rect(x, y - 8, x + 13, y, K); R.rect(x + 1, y - 7, x + 12, y - 1, hex('#9a6a3a')); R.rect(x + 1, y - 4, x + 12, y - 4, hex('#6a4424')); R.rect(x + 1, y - 7, x + 12, y - 7, hex('#c08a50')); for (let k = 0; k < 4; k++) { const bx = x + 2 + k * 3; R.rect(bx, y - 12, bx + 1, y - 8, hex('#b8ccc0')); P(bx, y - 12, hex('#8a5a30')); P(bx + 1, y - 12, hex('#8a5a30')); P(bx, y - 10, hex('#f0fff8')); } };
// la botella de licor (x centro, y la base): cristal verdoso, el licor claro y el corcho
const botella = (x, y, lleno = 1) => { const c0 = hex('#9ab8a8'), c1 = hex('#d8eee4'), li = hex('#f0e6c0'); R.rect(x - 3, y - 12, x + 3, y, K); R.rect(x - 2, y - 11, x + 2, y - 1, c0); R.rect(x - 1, y - 16, x + 1, y - 12, K); P(x, y - 15, c0); P(x, y - 14, c0); P(x, y - 13, c0); R.rect(x - 1, y - 18, x + 1, y - 16, hex('#8a5a30')); for (let j = y - 1; j >= y - 1 - Math.round(lleno * 8); j--) for (let i = x - 2; i <= x + 2; i++) P(i, j, li); P(x - 2, y - 10, c1); P(x - 2, y - 9, c1); P(x - 2, y - 8, hex('#ffffff')); };
// la bolsita de papel de las gominolas (x centro, y la base), con las gominolas de colores asomando
const GOMI = ['#e83a4a', '#f0c040', '#4ac06a', '#8a5ae0', '#f07a30'].map(hex);
const bolsita = (x, y, s = 1) => { const pp = hex('#d8b888'), ps = hex('#a88858'), pl = hex('#f0dcb0'); const w = 4 * s, h = 7 * s; R.rect(x - w - 1, y - h, x + w + 1, y, K); R.rect(x - w, y - h + 1, x + w, y - 1, pp); R.rect(x - w, y - h + 1, x - w + s - 1, y - 1, pl); R.rect(x + w - s + 1, y - h + 1, x + w, y - 1, ps); for (let k = 0; k < 3; k++) { const gx = x - w + s + k * (2 * s + 1), gy = y - h - s; R.rect(gx, gy, gx + s, gy + s, GOMI[k]); P(gx, gy, hex('#ffffff')); } R.rect(x - w, y - Math.round(h / 2), x + w, y - Math.round(h / 2), ps); };
// una gominola suelta (x, y = el centro), con su brillo y el azúcar
const gominola = (x, y, col, s = 1) => { const X = Math.round(x), Y = Math.round(y); if (s === 1) { R.rect(X - 1, Y - 1, X + 1, Y + 1, col); P(X - 1, Y - 1, hex('#ffffff')); P(X + 1, Y + 1, mezcla(col, K, 0.4)); return; } R.disco(X, Y, 2 * s, K); R.disco(X, Y, 2 * s - 1, col); R.rect(X - s, Y + s, X + s, Y + s, mezcla(col, K, 0.35)); P(X - s, Y - s, hex('#ffffff')); P(X - s + 1, Y - s, hex('#ffffff')); P(X + 1, Y - 1, mezcla(col, hex('#ffffff'), 0.6)); };
// una nota musical de color que sube (x, y, color)
const nota = (x, y, col) => { const X = Math.round(x), Y = Math.round(y); R.rect(X - 4, Y - 1, X + 1, Y + 2, K); R.rect(X - 1, Y - 8, X + 1, Y, K); R.rect(X + 1, Y - 8, X + 3, Y - 6, K); R.rect(X, Y - 7, X, Y, col); R.rect(X - 3, Y, X, Y + 1, col); P(X - 3, Y, hex('#ffffff')); R.rect(X + 1, Y - 7, X + 2, Y - 7, col); };
const COLNOTA = ['#e84a5a', '#f0c040', '#4aa8e8', '#8ad04a', '#c86ae0'].map(hex);
// el anillo robado: una órbita punteada (cx, cy) con su electrón, inclinada a
const orbitaSuelta = (cx, cy, t, a = 0.5) => { const ca = Math.cos(a), sa = Math.sin(a); for (let k = 0; k < 64; k++) { const p = k / 64 * Math.PI * 2, ex = 11 * Math.cos(p), ey = 4 * Math.sin(p), X = Math.round(cx + ex * ca - ey * sa), Y = Math.round(cy + ex * sa + ey * ca); P(X, Y + 1, K); P(X, Y, k % 3 ? hex('#bfe8ff') : AT_[7]); } const p = t * 6, X = cx + 11 * Math.cos(p) * ca - 4 * Math.sin(p) * sa, Y = cy + 11 * Math.cos(p) * sa + 4 * Math.sin(p) * ca; R.rect(Math.round(X) - 1, Math.round(Y), Math.round(X) + 1, Math.round(Y), AT_[5]); R.rect(Math.round(X), Math.round(Y) - 1, Math.round(X), Math.round(Y) + 1, AT_[5]); P(X, Y, AT_[4]); };
// silueta: lo que dibuja f dentro del recuadro se vuelve de un color (con un filo de luz hacia el sol)

// papel tramado de gris (todo lo que queda fuera del círculo r alrededor de cx, cy): el Distrito gris de antes de Lenore
const grisFuera = (cx, cy, r) => { const Bf = R.buf, r2 = r * r, r1 = (r - 7) * (r - 7); for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) { const dd = (x - cx) * (x - cx) + (y - cy) * (y - cy); if (dd < r1) continue; if (dd < r2 && tr(x, y, (Math.sqrt(dd) - r + 7) / 7) === false) continue; const i = y * 320 + x, c0 = Bf[i], l = 0.3 * (c0 & 255) + 0.59 * ((c0 >> 8) & 255) + 0.11 * ((c0 >> 16) & 255); Bf[i] = (0xff000000 | (Math.round(l * 0.86 + 14) << 16) | (Math.round(l * 0.84 + 12) << 8) | Math.round(l * 0.82 + 12)) >>> 0; } };

// ── 1 · LA VETA AL AMANECER: Haymitch (16) sale de casa; la madre y Sid le despiden ─────────────────────────────────
const O1 = { encuadre: 'calle', luz: 'amanecer' };
const p1 = (t) => {
  const g = T.distrito(R, t, O1), px = g.puerta[0] + 1, y0 = g.porche, sale = en('familia', 0.0340);

  const u = tramo(t, sale, en('familia', 0.1819)), hx = Math.round(lerp(px, 74, u)), hy = Math.round(lerp(y0, 162, Math.min(1, u * 1.25)));
  if (t > sale - 0.1) R.actor(EL.haymitch, hx, hy, t, { dir: u < 1 ? -1 : 1, anda: u > 0 && u < 1, dedo: u >= 1, sonrisa: u >= 1 });

  const e16 = tramo(t, en('familia', 0.0000), en('familia', 0.0146)) * (1 - tramo(t, en('familia', 0.1116), en('familia', 0.1261))); if (e16 > 0.05 && t > sale - 0.1) R.numero('16', hx + 8, hy - 30 - Math.round(e16 * 3), { centro: true });
  T.distritoDelante(R, t, O1);

// ── 2 · DENTRO DE CASA: la madre viuda sirve el cuenco; Sid (10) salta junto a la peonza ─────────────────────────────

  // la madre trae el cuenco de la cocina y lo deja en la mesa («mother»)

  const m = R.actor(EL.madreHaymitch, mx, 170, t, { dir: um < 1 ? 1 : -1, anda: um > 0 && um < 1, sostiene: !dejado ? true : undefined, sonrisa: t > en('familia', 0.2716), habla: t > en('familia', 0.2716) && t < en('familia', 0.3008) && habla(t, 1) });

  // Sid baja de la cama corriendo hasta la peonza y salta al oír su nombre; «10» sobre su cabeza
  const uh = tramo(t, en('familia', 0.3105), en('familia', 0.3590)), sx = Math.round(lerp(268, 238, uh)), sy = Math.round(lerp(150, 176, uh));
  const brinca = t > en('familia', 0.3677) && t < en('familia', 0.4075);

  const e10 = tramo(t, en('familia', 0.4123), en('familia', 0.4244)); if (e10 > 0) R.numero('10', sx + 8, sy - 24 - Math.round(e10 * 3), { centro: true });
  luc(lerp(150, sx - 12, tramo(t, en('familia', 0.3202), en('familia', 0.3735))), lerp(62, sy - 40, tramo(t, en('familia', 0.3202), en('familia', 0.3735))) + Math.sin(t * 2.4) * 2, t, { dir: 1, cara: t > en('familia', 0.3638) ? 'sonrisa' : 'normal' });
};

// ── 3 · LA DESTILERÍA DE HATTIE: Haymitch carga una caja de botellas; Hattie destila ─────────────────────────────────
const p3 = (t) => {
  const O3 = { encuadre: 'destileria', luz: 'dia', llena: 0.35 + 0.5 * tramo(t, en('familia', 0.4560), en('familia', 0.6888)) };

  if (t > en('familia', 0.6039) && t < en('familia', 0.6597)) for (let k = 0; k < 4; k++) { const v = ((t - en('familia', 0.6039)) * 1.6 + k / 4) % 1; P(220 + (k % 2) * 3, 154 - v * 14, hex('#ffffff')); }

};

// ── 4 · EL ALAMBIQUE: Haymitch mira la botella llena… y la guarda en la caja: no es para él ────────────────────────
const p4 = (t) => {
  const O4 = { encuadre: 'destileria', camara: 'alambique', luz: 'dia', llena: tramo(t, en('familia', 0.6937), en('lenore', -0.0274)) };
