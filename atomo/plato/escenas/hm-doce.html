<script type="module">
// HM-DOCE (frases 5–9), Juegos 50, sin cartela; ánimo: ternura. Veinte planos; Atom en cada uno (luciérnaga o de pie):
// 1. la Veta al amanecer: Haymitch («16») sale de casa; la madre y Sid le despiden desde el porche (corta en «with»);

// 3. la destilería de Hattie: Haymitch carga una caja de botellas; Hattie señala la jarra con «distills» (corta en «so»);
// 4. el alambique: Haymitch mira la botella con «never let go of a bottle»… y la guarda en la caja del suelo con «aren't for him»;
//    cielo con nubes de tres tonos y vencejos; en la cresta de los montes, pinos lejanos y el castillete de la Veta con su humo;
// 5. la puerta de la casa, todo gris: llega Lenore Dove y el color se abre a su alrededor con «color» (corta en «who comes»);
// 6. el Quemador: los Covey cantan; con «forced» entra un agente de la paz y señala el suelo (corta en «who sings»);
// 7. junto al lago: Lenore canta y los sinsajos le devuelven las notas; con «doesn't like» Haymitch y Atom miran alrededor;
// 8. el prado de las ocas: Lenore echa grano; una oca persigue a Atom y le roba una órbita (gag, «meadow»);
// 9. la boca de la mina (fondo local): sale Burdock tiznado; chocan la mano con «best friend»; sale una vagoneta;
// 10. el cuarto de lámparas (fondo local, lleno: tubería, ventanita con el castillete y un minero que pasa, tablón de
//     turnos, cargador de lámparas con pilotos, fiambreras y botas): Atom clava el pictograma del arco junto a la ficha
//     de Burdock con «Everdeen»; brilla con «Katniss»; Burdock deja su lámpara y lo ve (corta en «Almost»);
// 11. hoy, el cuarto de una lectora (sin barra del año): la línea del tiempo; con «24» el arco salta del 74 al 50 (corta en «a father»);
// 12. el corcho: se encienden las pistas con «father», «grandmother» y «story», y luego el hilo rojo (corta en «That morning»);
// 13. el cumpleaños (fondo local: la casa hacia la puerta abierta, con la luz de la mañana): Lenore entra con el paquete,
//     se lo da con «gives him» y él levanta el pedernal con «flint»; el bollo con la vela en la mesita;
// 14. el pedernal de cerca (fondo local): se doran el sinsajo («bird») y la serpiente («snake»); Atom lo golpea: chispa y
//     un electrón chamuscado (gag) (corta en «from»);
// 15. la tienda de los Donner: Haymitch llega al mostrador y deja la moneda; Maysilee llena la bolsa en el tarro y se la
//     pasa por encima del mostrador; él se vuelve con ella; con «hold on to those gumdrops» Atom se guarda una:
//     el electrón dorado (extra: true desde aquí) (corta en «because by the end»);
// 16. la manta (fondo local): la bolsa abierta; la mano de Lenore coge una gominola; Atom guiña con «mentioning them»;
// 17. el prado al atardecer, de cerca: los dos en el tronco, las ocas alrededor; con «tells her» él señala (corta en «reaping»);
// 18. el lago desde la orilla (fondo local): juncos y agua delante, el sol sobre el bosque; los dos en la orilla lo miran;
//     la urna de la cosecha aparece sobre el sol con «reaping» y late con «sun» y «tomorrow»;
// 19. inserto (fondo local): la corteza del tronco al atardecer; detrás, la loma con árboles, la alambrada, ocas y el
//     humo de la Veta, y el cielo con nubes y pájaros; la mano de Lenore trae la llave y abre el candado con
//     «key»; Atom al doble piensa, se sorprende y se entristece con «no proof» (corta en «that you»);
// 20. contraluz (fondo local): tres términos de montes y bosque, rayos, nubes con el filo encendido, bandada y estrellas;
//     el sol se hunde detrás del bosque con «always happened before»; siluetas, valla, matas y ocas en fila en la loma.
import * as T from '/atomo/plato/escenas/hm-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hm-doce');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const FA = (f) => en('familia', f), FL = (f) => en('lenore', f), FB = (f) => en('burdock', f), FR = (f) => en('regalos', f), FP = (f) => en('prado', f);
// ── ayudas ──────────────────────────────────────────────────────────────────────────────────────────────────────
const K = hex('#1a1424');
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const vn = (x, y, k = 0) => { const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy); const p = hh(xi, yi, k), q = hh(xi + 1, yi, k), r = hh(xi, yi + 1, k), s = hh(xi + 1, yi + 1, k); return p + (q - p) * sx + (r - p) * sy + (p - q - r + s) * sx * sy; };
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const tr = (x, y, u) => u * 16 > B4[((y & 3) << 2) | (x & 3)] + 0.5;
const mezcla = (c1, c2, u) => (0xff000000 | (Math.round(((c1 >> 16) & 255) * (1 - u) + ((c2 >> 16) & 255) * u) << 16) | (Math.round(((c1 >> 8) & 255) * (1 - u) + ((c2 >> 8) & 255) * u) << 8) | Math.round((c1 & 255) * (1 - u) + (c2 & 255) * u)) >>> 0;
const P = (x, y, col) => R.pset(Math.round(x), Math.round(y), col);
const BF = {};
const MARCA = 0xff00ff01 >>> 0;   // «aquí no hay nada»: en los búferes de primer término deja ver lo de detrás
const horno = (k, f) => { if (!BF[k]) { const bb = R.nuevo(), prev = R.usar(bb); f(); R.usar(prev); BF[k] = bb; } R.copiar(BF[k]); };
const VOZ = [[FA(0), FA(1)], [FL(0), FL(1)], [FB(0), FB(1)], [FR(0), FR(1)], [FP(0), FP(1)]];
const voz = (t) => (VOZ.some(([p, q]) => t > p && t < q) ? 1 : 0);
const habla = (t, k = 0) => Math.sin(t * 13 + k) > 0;
const GUARDA = en('regalos', 0.7068);   // Atom se guarda la gominola: desde aquí lleva el electrón dorado (extra) hasta el final
const atom = (x, s, t, o = {}) => T.AT.atom(R, x, s, t, { extra: t >= GUARDA, habla: voz(t), ...o });
const luc = (x, y, t, o = {}) => T.AT.luciernaga(R, x, y, t, { extra: t >= GUARDA, ...o });
const PZ = T.PIEZAS_JH, AT_ = R.PAL.ATOM;
// el electrón 0 de Atom (para la chispa del pedernal y el dorado): misma fórmula que atom-personaje.js
const electron = (cen, s, t, dorado) => { const p = dorado ? Math.PI * 2 * 0.7 * t + 3.4 : Math.PI * 2 * 0.9 * t; return [cen[0] + 8 * Math.cos(p) * s, cen[1] + 2.76 * Math.sin(p) * s, Math.sin(p) > 0]; };
// una caja de botellas (x, y = esquina de abajo a la izquierda; 14 × 9) con los cuellos y los tapones
const cajaBotellas = (x, y) => { R.rect(x, y - 8, x + 13, y, K); R.rect(x + 1, y - 7, x + 12, y - 1, hex('#9a6a3a')); R.rect(x + 1, y - 4, x + 12, y - 4, hex('#6a4424')); R.rect(x + 1, y - 7, x + 12, y - 7, hex('#c08a50')); for (let k = 0; k < 4; k++) { const bx = x + 2 + k * 3; R.rect(bx, y - 12, bx + 1, y - 8, hex('#b8ccc0')); P(bx, y - 12, hex('#8a5a30')); P(bx + 1, y - 12, hex('#8a5a30')); P(bx, y - 10, hex('#f0fff8')); } };
// la botella de licor (x centro, y la base): cristal verdoso, el licor claro y el corcho
const botella = (x, y, lleno = 1) => { const c0 = hex('#9ab8a8'), c1 = hex('#d8eee4'), li = hex('#f0e6c0'); R.rect(x - 3, y - 12, x + 3, y, K); R.rect(x - 2, y - 11, x + 2, y - 1, c0); R.rect(x - 1, y - 16, x + 1, y - 12, K); P(x, y - 15, c0); P(x, y - 14, c0); P(x, y - 13, c0); R.rect(x - 1, y - 18, x + 1, y - 16, hex('#8a5a30')); for (let j = y - 1; j >= y - 1 - Math.round(lleno * 8); j--) for (let i = x - 2; i <= x + 2; i++) P(i, j, li); P(x - 2, y - 10, c1); P(x - 2, y - 9, c1); P(x - 2, y - 8, hex('#ffffff')); };
// la bolsita de papel de las gominolas (x centro, y la base), con las gominolas de colores asomando
const GOMI = ['#e83a4a', '#f0c040', '#4ac06a', '#8a5ae0', '#f07a30'].map(hex);
const bolsita = (x, y, s = 1) => { const pp = hex('#d8b888'), ps = hex('#a88858'), pl = hex('#f0dcb0'); const w = 4 * s, h = 7 * s; R.rect(x - w - 1, y - h, x + w + 1, y, K); R.rect(x - w, y - h + 1, x + w, y - 1, pp); R.rect(x - w, y - h + 1, x - w + s - 1, y - 1, pl); R.rect(x + w - s + 1, y - h + 1, x + w, y - 1, ps); for (let k = 0; k < 3; k++) { const gx = x - w + s + k * (2 * s + 1), gy = y - h - s; R.rect(gx, gy, gx + s, gy + s, GOMI[k]); P(gx, gy, hex('#ffffff')); } R.rect(x - w, y - Math.round(h / 2), x + w, y - Math.round(h / 2), ps); };
// una gominola suelta (x, y = el centro), con su brillo y el azúcar
const gominola = (x, y, col, s = 1) => { const X = Math.round(x), Y = Math.round(y); if (s === 1) { R.rect(X - 1, Y - 1, X + 1, Y + 1, col); P(X - 1, Y - 1, hex('#ffffff')); P(X + 1, Y + 1, mezcla(col, K, 0.4)); return; } R.disco(X, Y, 2 * s, K); R.disco(X, Y, 2 * s - 1, col); R.rect(X - s, Y + s, X + s, Y + s, mezcla(col, K, 0.35)); P(X - s, Y - s, hex('#ffffff')); P(X - s + 1, Y - s, hex('#ffffff')); P(X + 1, Y - 1, mezcla(col, hex('#ffffff'), 0.6)); };
// una nota musical de color que sube (x, y, color)
const nota = (x, y, col) => { const X = Math.round(x), Y = Math.round(y); R.rect(X - 4, Y - 1, X + 1, Y + 2, K); R.rect(X - 1, Y - 8, X + 1, Y, K); R.rect(X + 1, Y - 8, X + 3, Y - 6, K); R.rect(X, Y - 7, X, Y, col); R.rect(X - 3, Y, X, Y + 1, col); P(X - 3, Y, hex('#ffffff')); R.rect(X + 1, Y - 7, X + 2, Y - 7, col); };
const COLNOTA = ['#e84a5a', '#f0c040', '#4aa8e8', '#8ad04a', '#c86ae0'].map(hex);
// el anillo robado: una órbita punteada (cx, cy) con su electrón, inclinada a
const orbitaSuelta = (cx, cy, t, a = 0.5) => { const ca = Math.cos(a), sa = Math.sin(a); for (let k = 0; k < 64; k++) { const p = k / 64 * Math.PI * 2, ex = 11 * Math.cos(p), ey = 4 * Math.sin(p), X = Math.round(cx + ex * ca - ey * sa), Y = Math.round(cy + ex * sa + ey * ca); P(X, Y + 1, K); P(X, Y, k % 3 ? hex('#bfe8ff') : AT_[7]); } const p = t * 6, X = cx + 11 * Math.cos(p) * ca - 4 * Math.sin(p) * sa, Y = cy + 11 * Math.cos(p) * sa + 4 * Math.sin(p) * ca; R.rect(Math.round(X) - 1, Math.round(Y), Math.round(X) + 1, Math.round(Y), AT_[5]); R.rect(Math.round(X), Math.round(Y) - 1, Math.round(X), Math.round(Y) + 1, AT_[5]); P(X, Y, AT_[4]); };
// silueta: lo que dibuja f dentro del recuadro se vuelve de un color (con un filo de luz hacia el sol)
const silueta = (x0, y0, x1, y1, f, col, filo, dx = -1) => { const Bf = R.buf, antes = Bf.slice(); f(); for (let y = Math.max(0, y0); y <= Math.min(179, y1); y++) for (let x = Math.max(0, x0); x <= Math.min(319, x1); x++) { const i = y * 320 + x; if (Bf[i] !== antes[i]) Bf[i] = col; } if (filo) for (let y = Math.max(1, y0); y <= Math.min(178, y1); y++) for (let x = Math.max(1, x0); x <= Math.min(318, x1); x++) { const i = y * 320 + x; if (Bf[i] === col && Bf[i + dx] !== col && Bf[i - 320] !== col) Bf[i] = filo; } };
// papel tramado de gris (todo lo que queda fuera del círculo r alrededor de cx, cy): el Distrito gris de antes de Lenore
const grisFuera = (cx, cy, r) => { const Bf = R.buf, r2 = r * r, r1 = (r - 7) * (r - 7); for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) { const dd = (x - cx) * (x - cx) + (y - cy) * (y - cy); if (dd < r1) continue; if (dd < r2 && tr(x, y, (Math.sqrt(dd) - r + 7) / 7) === false) continue; const i = y * 320 + x, c0 = Bf[i], l = 0.3 * (c0 & 255) + 0.59 * ((c0 >> 8) & 255) + 0.11 * ((c0 >> 16) & 255); Bf[i] = (0xff000000 | (Math.round(l * 0.86 + 14) << 16) | (Math.round(l * 0.84 + 12) << 8) | Math.round(l * 0.82 + 12)) >>> 0; } };

// nube de tres tonos (cx, cy, ancho w; cs = [sombra, cuerpo, luz]): cuatro lóbulos con la base plana; ok(x, y) dice si se
// puede pintar ese píxel (el cielo que queda detrás de montes, árboles o vapor); filo: la panza encendida por el sol bajo
const nube3 = (cx, cy, w, cs, ok = null, filo = null) => {
  const L = [[0, 0, w * 0.26], [-w * 0.27, w * 0.08, w * 0.19], [w * 0.27, w * 0.07, w * 0.2], [w * 0.1, -w * 0.12, w * 0.19], [-w * 0.12, -w * 0.06, w * 0.17]], base = cy + w * 0.17;
  const x0 = Math.max(0, Math.floor(cx - w * 0.5)), x1 = Math.min(319, Math.ceil(cx + w * 0.5)), y0 = Math.max(0, Math.floor(cy - w * 0.3)), y1 = Math.min(179, Math.ceil(base));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    let d = 9, rl = 0; for (const [lx, ly, r] of L) { const q = ((x - cx - lx) ** 2 + ((y - cy - ly) * 1.25) ** 2) / (r * r); if (q < d) { d = q; rl = ((y - cy - ly) * 1.25 + (x - cx - lx) * 0.35) / r; } }
    if (d > 1 || (d > 0.84 && !tr(x, y, (1 - d) * 6))) continue; if (ok && !ok(x, y)) continue;
    const v = (y - (cy - w * 0.27)) / (base - (cy - w * 0.27));
    let c = v > 0.8 || (v > 0.6 && tr(x, y, (v - 0.6) * 5)) ? cs[0] : rl < -0.45 || (rl < -0.2 && tr(x, y, (-0.2 - rl) * 4)) ? cs[2] : rl > 0.55 && tr(x, y, 0.5) ? cs[0] : cs[1];
    if (filo && y >= base - 1) c = filo;
    R.pset(x, y, c);
  }
};
// pájaros lejanos (una «m» de 5 px que aletea), en bandada en uve: n pájaros alrededor de (x, y); ok como en nube3
const pajaros = (t, n, x, y, col, ok = null, k = 0) => {
  for (let j = 0; j < n; j++) { const fila = Math.ceil(j / 2), lado = j % 2 ? 1 : -1, px = Math.round(x - fila * 7 + Math.sin(t * 1.3 + j) * 1.2), py = Math.round(y + fila * 4 * lado + Math.sin(t * 2 + j * 1.7 + k) * 1.5), a = Math.sin(t * 9 + j * 1.9 + k) > 0 ? 1 : 0;
    for (const [dx, dy] of [[0, 0], [-1, -a], [1, -a], [-2, -2 * a + (a ? 0 : 1)], [2, -2 * a + (a ? 0 : 1)]]) { const X = px + dx, Y = py + dy; if (X >= 0 && X < 320 && Y >= 15 && Y < 180 && (!ok || ok(X, Y))) R.pset(X, Y, col); } }
};

// ── 1 · LA VETA AL AMANECER: Haymitch (16) sale de casa; la madre y Sid le despiden ─────────────────────────────────
const O1 = { encuadre: 'calle', luz: 'amanecer' };
const p1 = (t) => {
  const g = T.distrito(R, t, O1), px = g.puerta[0] + 1, y0 = g.porche, sale = en('familia', 0.0340);
  // la madre en la puerta y Sid, que sale detrás y saluda desde el porche
  if (t > en('familia', 0.0776)) R.actor(EL.madreHaymitch, px, y0, t, { dir: 1, dedo: t > en('familia', 0.1067) && t < en('familia', 0.1843), sonrisa: true });
  const us = tramo(t, en('familia', 0.1116), en('familia', 0.1407)); if (t > en('familia', 0.1116)) R.actor(EL.hermanoHaymitch, Math.round(px + 16 * us), y0, t, { dir: 1, anda: us > 0 && us < 1, brazos: t > en('familia', 0.1455), sonrisa: true, salto: t > en('familia', 0.1455) && Math.sin(t * 9) > 0.6 ? 1 : 0 });
  // Haymitch baja del porche y echa a andar calle abajo, hacia la mina; al final se vuelve y saluda
  const u = tramo(t, sale, en('familia', 0.1819)), hx = Math.round(lerp(px, 74, u)), hy = Math.round(lerp(y0, 162, Math.min(1, u * 1.25)));
  if (t > sale - 0.1) R.actor(EL.haymitch, hx, hy, t, { dir: u < 1 ? -1 : 1, anda: u > 0 && u < 1, dedo: u >= 1, sonrisa: u >= 1 });
  // «16»: la edad, sobre su cabeza mientras la voz la dice
  const e16 = tramo(t, en('familia', 0.0000), en('familia', 0.0146)) * (1 - tramo(t, en('familia', 0.1116), en('familia', 0.1261))); if (e16 > 0.05 && t > sale - 0.1) R.numero('16', hx + 8, hy - 30 - Math.round(e16 * 3), { centro: true });
  T.distritoDelante(R, t, O1);
  luc(lerp(260, hx + 26, tramo(t, en('familia', 0.0097), en('familia', 0.1746))), lerp(78, hy - 34, tramo(t, en('familia', 0.0097), en('familia', 0.1746))) + Math.sin(t * 2.6) * 2, t, { dir: -1, cara: t > en('familia', 0.1649) ? 'sonrisa' : 'normal' });
};

// ── 2 · EL RINCÓN DEL FONDO (fondo local): la mesa y el cuenco en primer término; al fondo la escalera del altillo y el
// rincón de Sid. La madre viuda trae el cuenco y lo deja delante de Haymitch; Sid corre a su peonza y salta con «Sid» («10»)
// la pared y el suelo de la casa de la Veta (las mismas tablas grises que el decorado, para que sea la misma casa)
const paredCasa = (x0, y0, x1, y1, k = 0) => {
  for (let x = x0; x <= x1; x++) { const tb = Math.floor((x + k * 5) / 11), xx = (x + k * 5) % 11; for (let y = y0; y <= y1; y++) { const g0 = Math.sin((xx + vn(tb * 3 + k, y / 30, 51) * 6) * 1.7 + tb), v = vn(tb * 7 + k, y / 50, 52); let c = g0 > 0.88 ? hex('#5e524a') : g0 < -0.9 ? hex('#958676') : v > 0.62 ? hex('#7e7064') : v < 0.3 && tr(x, y, 0.6) ? hex('#665a50') : hex('#726658'); if (xx === 0) c = hex('#3a302a'); else if (xx === 1) c = hex('#8e8070'); R.pset(x, y, c); } }
  for (let q = 0; q < Math.round((x1 - x0) / 14); q++) { const x = x0 + Math.round(hh(q, 53 + k) * (x1 - x0)), y = y0 + Math.round(hh(q, 54 + k) * (y1 - y0)); R.disco(x, y, 1, hex('#4e443c')); R.pset(x + 1, y + 1, hex('#8e8070')); }
};
const sueloCasa = (y0, k = 0) => {
  let y = y0, f = 0; while (y < 180) { const h = 3 + f; for (let j = 0; j < h && y + j < 180; j++) for (let x = 0; x < 320; x++) { const xo = (x + f * 41 + k * 13) % (60 + f * 14); let c = j === 0 ? hex('#3a2e26') : xo === 0 ? hex('#3a2e26') : tr(x, y + j, vn(x / (14 + f * 3), f * 3 + j / h, 55)) ? hex('#6a5444') : hex('#5a4638'); if (j === 1 && x % 3 === 0) c = hex('#7a6252'); R.pset(x, y + j, c); } y += h; f++; }
};
const ALT = 62;   // el borde del altillo
const fondoRincon = () => {
  paredCasa(0, 0, 319, 122, 1); sueloCasa(122, 1);
  // la ventanita alta (de ella baja la luz de la mañana), con cortinilla de cuadros
