<script type="module">
// HP-DRACO (frase 16), 1997 (el libro). Tres planos:
// 1. la calle del callejón Diagon con la tienda de túnicas entre sus vecinas (decorado propio, en búfer): a la izquierda
//    la tienda de calderos (pirámide de calderos, uno echa vapor verde) con su rótulo y su cartel colgante; un pasadizo
//    con la calle de atrás al fondo por donde cruza gente pequeña; la tienda de túnicas (mirador arriba con una bruja que
//    pasa tras los vidrios, rótulo de trazos dorados con los pictogramas de la túnica y las tijeras —acaba en x 235—,
//    escaparate con maniquíes, cinta que flota y el reflejo de los paseantes de la otra acera, puerta con campanilla y
//    cartel colgante de la túnica que se mece); a la derecha la tienda de lechuzas (jaulas con lechuzas que parpadean y
//    aletean). Acera de losas con juntas, musgo, manchas, rejilla, charcos y la luz cálida de los escaparates; bordillo y
//    adoquines con relieve; el farol (por delante de la gente) con su llama y su halo. Hagrid y Harry llegan por la acera;
//    Hagrid señala la puerta («book»), Harry va hasta ella, la puerta se abre y suena la campanilla, y Hagrid se da la
//    vuelta hacia la heladería; por delante, en los adoquines, pasan un duende con su saco y una bruja (corta en «Harry»);
// 2. el probador: Harry sube de un salto a su taburete, mirando a la costurera, que se arrodilla con el acerico: los
//    alfileres vuelan uno a uno hasta el bajo y brillan al clavarse; la cinta métrica se desenrolla sola del suelo hasta
//    Draco; en «pale boy» Draco se vuelve entero hacia Harry y le habla con el dedo alzado; Harry se gira hacia él y
//    contesta en «Diagon Alley» (corta en «a»). En el espejo, un brillo que barre y el reflejo de clientes que pasan;
// 3. contraplano desde el fondo de la tienda (decorado propio): los dos niños de perfil en sus taburetes en primer
//    término a la izquierda, la costurera arrodillada, y al fondo el escaparate grande con la calle de enfrente (la
//    heladería del toldo a rayas, paseantes); llega Hagrid con dos helados y saluda; en «sneers» Draco lo señala con
//    desprecio y se ríe; en «Draco Malfoy» Harry se enfada; en «skips» Harry baja del taburete y va hacia la puerta (a la
//    izquierda, con su campanilla), que se abre, mientras Hagrid se acerca por fuera. Armario de casillas con telas a la
//    derecha, perchero, aplique, lámpara de globo, sol del escaparate en el suelo de tablas con motas de polvo.
import * as T from '/atomo/plato/escenas/hp-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hp-draco');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const at = (s) => en('tienda', (s - 0.5) / 13.451);
const P2 = at(4.24), P3 = at(8.46);
const llegan = at(0.3), senala = at(2.0), puerta = at(3.7), sube = at(4.3), palido = at(5.42), contesta = at(7.22);
const asoma = at(8.5), burla = at(9.1), draco = at(11.0), salta = at(12.55), abre3 = at(13.45);
const PIN = hex('#e8ecf4');

// ── utilidades: ruido, mezcla de colores, capas fijas en búfer ─────────────────────────────────────────────────────────
const hs = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
const capas = new Map();
const capa = (k, f) => { let b = capas.get(k); if (!b) { b = R.nuevo(); const prev = R.usar(b); f(R.buf); R.usar(prev); capas.set(k, b); } return b; };
// tiñe un píxel hacia c (respeta el recorte: va por pset)
const tinta = (x, y, c, a) => R.pset(x, y, mez(R.pget(x, y), c, a));
const K = T.C.k, BL = T.C.blanco, C2 = T.C;
const Q = Object.fromEntries(Object.entries({
  oro: '#e8c060', oroS: '#a87a28', oroL: '#fff0a0', calido: '#ffd890', calidoS: '#f0b060', luz: '#f0a850', plomo: '#3a2a20',
  viga: '#4a3020', vigaS: '#2e1c12', crema: '#cdb894', cremaS: '#a8946c', cremaL: '#e2d4b4',
  morado: '#5a2e4a', moradoS: '#3a1a30', moradoL: '#7a4a64', marco: '#2a1420', hoja: '#4a1a3a', hojaS: '#3a1230',
  verde: '#2a5a3a', verdeS: '#1e3a2a', verdeL: '#3a7a4e', azulP: '#4a5a6a', azulS: '#3a4858', azulL: '#5a6a7a', teal: '#1a2a30',
  losa: '#8a8478', losaS: '#4a4640', losaL: '#aaa498', musgo: '#4a5a34', charco: '#3a4250', charcoL: '#6a7488',
  adq0: '#6a6470', adq1: '#7a7268', adq2: '#5a5660', adq3: '#827a6c', junta: '#2e2a28', hierro: '#1e1e26', hierroL: '#4a4a56',
  peltre: '#7a7a86', peltreS: '#4a4a56', cobre: '#c8703a', cobreS: '#8a4a22', laton: '#c8a040', latonS: '#8a6a20',
  vapor: '#8ad87a', vaporL: '#c8f0b0', crim: '#8a1e2e', crimL: '#b03a48', piel: '#e8b890',
}).map(([k, v]) => [k, hex(v)]));

// el revoque de una pared: motas, desconchones y manchas suaves (k: semilla; calma: casi liso, para la esquina de Atom)
const revoque = (B, x0, y0, x1, y1, c, cs, cl, k, calma = false) => {
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const n = hs(x >> 1, y >> 1, k), m = Math.sin(x * 0.09 + y * 0.05 + k) + Math.sin(x * 0.031 - y * 0.07 + k);
    B[y * 320 + x] = calma ? (n < 0.03 ? mez(c, cs, 0.4) : m > 1.4 ? mez(c, cs, 0.15) : c) : n < 0.08 ? cs : n > 0.95 ? cl : m > 1.3 ? mez(c, cs, 0.35) : m < -1.5 ? mez(c, cl, 0.25) : c; }
};
// adoquines con relieve: filas de alto h0 → h1 (más altas cuanto más cerca), luz arriba, sombra abajo, esquinas redondas
const adoquines = (B, x0, y0, x1, y1, h0, h1, k) => {
  let y = y0, fila = 0;
  while (y <= y1) { const hh = Math.round(h0 + (h1 - h0) * (y - y0) / Math.max(1, y1 - y0)), w = hh * 2 + (fila % 2), off = (fila % 2) * (w >> 1) + fila * 3;
    for (let yy = y; yy < Math.min(y + hh, y1 + 1); yy++) for (let x = x0; x <= x1; x++) {
      const xx = x + off, i = Math.floor(xx / w), lx = xx - i * w, ly = yy - y, v = hs(i, fila, k);
      const base = v < 0.25 ? Q.adq0 : v < 0.5 ? Q.adq1 : v < 0.75 ? Q.adq2 : Q.adq3; let c;
      if (lx === 0 || ly === hh - 1) c = hs(x, yy, k + 1) < 0.18 ? Q.musgo : Q.junta;
      else if ((lx === 1 || lx === w - 1) && (ly === 0 || ly === hh - 2)) c = Q.junta;
      else if (ly === 0) c = mez(base, BL, 0.3);
      else if (ly === hh - 2 || lx === w - 1) c = mez(base, K, 0.3);
      else if (lx === 1) c = mez(base, BL, 0.12);
      else c = hs(x, yy, k + 2) < 0.07 ? mez(base, K, 0.18) : base;
      B[yy * 320 + x] = c; }
    y += hh; fila++; }
};
// un caldero (boca en y0 - r, culo en y0): luz a la izquierda, sombra a la derecha, borde y patas
const caldero = (cx, y0, r, c, cs) => {
  const { pset, rect } = R;
  for (let j = 0; j <= r; j++) for (let i = -r; i <= r; i++) if (i * i + j * j <= r * r + r) pset(cx + i, y0 - r + j, i < -r * 0.5 && j < r * 0.7 ? mez(c, BL, 0.3) : i > r * 0.35 || j > r * 0.75 ? cs : c);
  rect(cx - r - 1, y0 - r - 1, cx + r + 1, y0 - r, cs); rect(cx - r, y0 - r - 1, cx + r, y0 - r - 1, mez(c, BL, 0.35)); rect(cx - r + 2, y0 - r, cx + r - 2, y0 - r, K);
  pset(cx - r + 2, y0 + 1, cs); pset(cx + r - 2, y0 + 1, cs);
};
// una lechuza pequeña (pies en x, y): parpadea, gira la cabeza y de vez en cuando abre las alas
const lechuza = (x, y, t, k, c, cl) => {
  const { rect, pset, poligono } = R, aleta = Math.sin(t * 1.7 + k * 2.1) > 0.9, parp = (t * 0.8 + k * 0.37) % 2.4 < 0.14, g = Math.sin(t * 0.6 + k * 1.3) > 0.4 ? 1 : 0;
  if (aleta) { const a = Math.round(Math.abs(Math.sin(t * 14)) * 3); poligono([[x - 3, y - 7], [x - 7, y - 9 - a], [x - 6, y - 3]], mez(c, K, 0.2)); poligono([[x + 3, y - 7], [x + 7, y - 9 - a], [x + 6, y - 3]], mez(c, K, 0.2)); }
  rect(x - 3, y - 7, x + 3, y - 1, c); rect(x - 2, y - 11, x + 2, y - 7, c); pset(x - 3, y - 11, c); pset(x + 3, y - 11, c); pset(x - 3, y - 10, c); pset(x + 3, y - 10, c);
  rect(x - 1, y - 5, x + 1, y - 2, cl); pset(x, y - 4, mez(cl, K, 0.25));
  if (parp) { rect(x - 2 + g, y - 9, x - 1 + g, y - 9, K); rect(x + 1 + g, y - 9, x + 2 + g, y - 9, K); }
  else { pset(x - 2 + g, y - 9, Q.oro); pset(x - 1 + g, y - 9, K); pset(x + 1 + g, y - 9, K); pset(x + 2 + g, y - 9, Q.oro); }
  pset(x + g, y - 8, Q.oroS); pset(x - 1, y, Q.oroS); pset(x + 1, y, Q.oroS);
};
// un paseante diminuto del fondo (pies en x, y; alto ~11): túnica, cabeza y sombrero puntiagudo; anda con un pie y otro
const paseante = (x, y, t, c, sombrero = true) => {
  const { pset } = R, X = Math.round(x), p = Math.floor(t * 6 + x) % 2;
  for (let j = 0; j < 7; j++) for (let i = -1 - (j >> 2); i <= 1 + (j >> 2); i++) pset(X + i, y - 1 - j, j === 0 && Math.abs(i) === 2 - p ? Q.losaL : c);
  pset(X, y - 9, Q.piel); pset(X + 1, y - 9, Q.piel); pset(X, y - 8, Q.piel); pset(X + 1, y - 8, mez(Q.piel, K, 0.2));
  if (sombrero) { for (let i = -2; i <= 2; i++) pset(X + i, y - 10, mez(c, K, 0.4)); pset(X, y - 11, mez(c, K, 0.4)); pset(X + 1, y - 11, mez(c, K, 0.4)); pset(X, y - 12, mez(c, K, 0.4)); }
};
// un alfiler que vuela del acerico (a) al bajo (b) entre t0 y t0 + 0,45 s; al llegar, un destello
const alfiler = (t, t0, a, b) => {
  const u = tramo(t, t0, t0 + 0.45); if (u <= 0) return;
  if (u < 1) { const x = Math.round(lerp(a[0], b[0], u)), y = Math.round(lerp(a[1], b[1], u) - Math.sin(Math.PI * u) * 10); R.linea(x - 1, y + 1, x + 1, y - 1, PIN); R.pset(x + 1, y - 1, T.C.rojo); return; }
  const d = t - t0 - 0.45; if (d < 0.35) { const r = d < 0.15 ? 2 : 1; R.pset(b[0], b[1], BL); for (let s = 1; s <= r; s++) { R.pset(b[0] - s, b[1], Q.oroL); R.pset(b[0] + s, b[1], Q.oroL); R.pset(b[0], b[1] - s, Q.oroL); R.pset(b[0], b[1] + s, Q.oroL); } }
};
// el pictograma de una túnica (centro x, y): cuerpo acampanado, mangas anchas y el cuello en pico
const tunica = (x, y, c, cl, fondo) => { R.poligono([[x - 3, y - 4], [x + 3, y - 4], [x + 5, y + 5], [x - 5, y + 5]], c); R.poligono([[x - 3, y - 4], [x - 7, y + 2], [x - 5, y + 3], [x - 2, y - 1]], c); R.poligono([[x + 3, y - 4], [x + 7, y + 2], [x + 5, y + 3], [x + 2, y - 1]], c);
  R.pset(x, y - 4, fondo); R.pset(x, y - 3, fondo); R.linea(x - 2, y - 4, x + 2, y - 4, cl); R.linea(x - 4, y + 5, x + 4, y + 5, cl); };
// el acerico en la mano (x, y)
const acerico = (x, y) => { R.disco(x, y - 2, 3, hex('#a82a2a')); R.disco(x - 1, y - 3, 1, hex('#d84a4a')); R.linea(x - 2, y - 5, x - 3, y - 7, PIN); R.linea(x + 1, y - 5, x + 2, y - 8, PIN); R.pset(x + 2, y - 8, T.C.amarillo); R.pset(x - 3, y - 7, T.C.rojo); };
// una costurera arrodillada (la falda abierta en el suelo y): sostiene el acerico; devuelve la mano
const arrodillada = (x, y, t, dir, o = {}) => {
  R.recorte([0, 0, 319, y - 1]); const a = R.actor(EL.costurera, x, y + 6, t, { dir, sostiene: o.sostiene, sorpresa: o.sorpresa, pal: o.pal }); R.recorte(null);
  const c = o.pal?.C ?? hex('#b07ab0'), cs = mez(c, K, 0.3);
  R.poligono([[x - 2, y - 1], [x + 16, y - 1], [x + 18, y + 2], [x - 4, y + 2]], c); R.linea(x - 4, y + 2, x + 18, y + 2, cs); R.linea(x + 4, y, x + 3, y + 2, cs); R.linea(x + 10, y, x + 11, y + 2, cs);
  R.linea(x - 3, y + 3, x + 17, y + 3, mez(Q.junta, K, 0.2));
  if (o.sostiene) acerico(a.mano[0], a.mano[1]);
  return a.mano;
};

// ── 1 · la calle ───────────────────────────────────────────────────────────────────────────────────────────────────────
const VIDRIO_T = [107, 69, 185, 117], VIDRIO_C = [6, 68, 73, 116], VIDRIO_L = [247, 69, 313, 117], FONDO_P = [86, 60, 95, 118];
const calle = () => capa('draco-calle', (B) => {
  const { rect, pset, linea, poligono, disco } = R;
  // los aleros de los pisos de arriba (madera oscura con las cabezas de las vigas): tranquilos bajo la barra del año
  for (let y = 0; y < 8; y++) for (let x = 0; x < 320; x++) B[y * 320 + x] = y === 7 ? Q.vigaS : (x % 16 === 0 && y > 3) ? Q.vigaS : hs(x >> 2, y, 3) < 0.12 ? mez(Q.vigaS, Q.viga, 0.5) : mez(Q.viga, Q.vigaS, 0.35);
  // ─ la tienda de calderos (x 0–79): piso de entramado, rótulo verde, escaparate de calderos
  revoque(B, 0, 8, 79, 50, Q.crema, Q.cremaS, Q.cremaL, 11);
  rect(0, 8, 79, 10, Q.viga); rect(0, 48, 79, 50, Q.viga); for (const px of [0, 26, 52, 77]) rect(px, 10, px + 2, 48, Q.viga);
  for (let k = 0; k < 2; k++) { linea(3 + k, 46, 24 + k, 12, Q.viga); linea(55 + k, 12, 75 + k, 46, Q.viga); }
  rect(29, 22, 50, 44, Q.vigaS); for (let y = 24; y <= 42; y++) for (let x = 31; x <= 48; x++) pset(x, y, (x - 31) % 6 === 0 || (y - 24) % 6 === 0 ? Q.plomo : y < 29 + (x % 3) ? Q.calido : hs(x, y, 4) < 0.2 ? Q.calido : Q.calidoS);
  rect(27, 43, 52, 46, hex('#6a3a1e')); rect(27, 43, 52, 43, hex('#8a5a2e'));
  rect(3, 52, 76, 63, K); rect(4, 53, 75, 62, Q.verdeS); rect(4, 53, 75, 53, Q.oroS); rect(4, 62, 75, 62, Q.oroS);
  caldero(14, 61, 4, Q.peltre, Q.peltreS); pset(13, 54, Q.vapor); pset(15, 55, Q.vapor); pset(12, 55, Q.vaporL);
  for (let x = 26; x < 71; x++) { if ((x - 26) % 12 > 9) continue; const v = Math.sin(x * 0.9) * 1.6 + Math.sin(x * 0.31); pset(x, 58 + Math.round(v), Q.oro); if (x % 5 === 0) pset(x, 56 + Math.round(v * 0.5), Q.oroL); }
  rect(3, 65, 76, 118, Q.verde); rect(4, 66, 75, 66, Q.verdeL); rect(5, 67, 74, 117, Q.verdeS);
  for (let y = 68; y <= 116; y++) for (let x = 6; x <= 73; x++) { const g = (y - 68) / 48; B[y * 320 + x] = hs(x >> 1, y >> 1, 6) < 0.1 ? mez(hex('#3a2416'), hex('#7a4a26'), g * 0.4) : mez(hex('#2a1a10'), hex('#6a4422'), g * 0.55); }
  rect(6, 112, 73, 116, hex('#4a2e18')); rect(6, 112, 73, 112, hex('#6a4426'));
  for (const [cx, y0, r, c, cs] of [[18, 111, 7, Q.peltre, Q.peltreS], [38, 111, 7, Q.cobre, Q.cobreS], [58, 111, 7, Q.laton, Q.latonS], [28, 101, 6, Q.cobre, Q.cobreS], [48, 101, 6, Q.peltre, Q.peltreS], [38, 92, 5, Q.laton, Q.latonS]]) caldero(cx, y0, r, c, cs);
  rect(6, 72, 73, 72, Q.hierroL); for (const [cx, l] of [[14, 6], [64, 8]]) { linea(cx, 72, cx, 72 + l, Q.hierroL); caldero(cx, 76 + l, 3, Q.peltre, Q.peltreS); }
  for (let i = 0; i < 2; i++) for (let k = 0; k < [3, 2][i]; k++) linea([12, 46][i] + k, 116, [12, 46][i] + k + 20, 68, mez(R.pget([12, 46][i] + k + 10, 92), BL, 0.18));
  rect(39, 67, 40, 117, Q.verde); rect(5, 80, 74, 80, Q.verde);
  rect(3, 119, 76, 123, Q.verdeS); for (let x = 6; x < 74; x += 17) { rect(x, 120, x + 14, 122, Q.verde); rect(x, 120, x + 14, 120, Q.verdeL); }
  rect(76, 8, 79, 123, Q.viga);
  // ─ el pasadizo (x 80–101): los pisos se inclinan y casi se tocan; al fondo, la calle de atrás iluminada
  for (let y = 8; y <= 123; y++) for (let x = 80; x <= 101; x++) { let c;
    if (y < 56) c = (y % 7 === 0) ? hex('#140a08') : mez(hex('#2a1a14'), K, 0.2 + hs(x, y >> 1, 7) * 0.2);
    else if (x < 86 - Math.round((y - 56) * 0.0)) c = mez(hex('#4a3a34'), K, 0.35 + (x - 80) * 0.04 + (hs(x, y >> 1, 8) < 0.15 ? 0.1 : 0));
    else if (x > 95) c = mez(hex('#5a4840'), K, 0.3 + (101 - x) * 0.04 + (hs(x, y >> 1, 9) < 0.15 ? 0.1 : 0));
    else if (y < 106) c = y < 62 ? mez(hex('#e8d8b0'), hex('#9ab8d0'), (62 - y) / 6) : hs(x, y >> 1, 10) < 0.12 ? hex('#c8a868') : hex('#e0c488');
    else if (y < 110) c = Q.losaL; else c = (x + y) % 3 ? Q.adq1 : Q.adq3;
    B[y * 320 + x] = c; }
  rect(87, 82, 93, 92, hex('#4a2a18')); rect(88, 83, 92, 91, hex('#7ab0c8')); rect(90, 83, 90, 91, hex('#4a2a18')); rect(86, 100, 95, 101, hex('#a87a48')); rect(86, 56, 95, 59, hex('#2a1a14'));
  for (let x = 80; x <= 101; x++) { const d = Math.abs(x - 90.5) / 11; for (let y = 118; y <= 123; y++) B[y * 320 + x] = mez(Q.adq2, K, 0.2 + d * 0.3 + ((x + y) % 4 === 0 ? 0.15 : 0)); }
  // ─ la tienda de túnicas (x 102–237)
  revoque(B, 102, 8, 237, 50, Q.morado, Q.moradoS, Q.moradoL, 21);
  poligono([[112, 19], [164, 19], [160, 15], [116, 15]], hex('#2a1a24')); for (let x = 117; x < 160; x += 3) pset(x, 17, hex('#4a3040'));
  rect(114, 19, 162, 46, Q.marco); for (let y = 21; y <= 41; y++) for (let x = 117; x <= 159; x++) pset(x, y, (x - 117) % 7 === 0 || (y - 21) % 7 === 0 ? Q.plomo : hs(x >> 1, y >> 1, 12) < 0.25 ? Q.calido : Q.calidoS);
  for (const cx of [117, 155]) { rect(cx, 21, cx + 4, 41, Q.crim); for (let y = 21; y <= 41; y += 2) pset(cx + 1 + (y % 4 ? 1 : 0), y, Q.crimL); }
  rect(112, 42, 164, 46, hex('#4a2a3a')); rect(112, 42, 164, 42, Q.moradoL); for (const cx of [118, 158]) { rect(cx - 2, 47, cx + 2, 49, hex('#3a1a2a')); }
