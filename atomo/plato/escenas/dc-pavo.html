<canvas id="lienzo"></canvas>
<script type="module">
// DC-PAVO (frase 11), años cincuenta. Seis planos:
// 1. «the British had a cold problem»: el despacho de Londres; entra un técnico tiritando con una caja escarchada; el otro,
//    detrás de la mesa, se sorprende («?»);
// 2. (corta en «a nuclear landmine») el taller frío: la mina enorme en su carro, colgada de la báscula de cadena; la aguja
//    sube y sale un «7» («seven tons»); el otro técnico cuelga la chapa con la pluma del pavo real («Blue Peacock»);
// 3. (corta en «in Germany») el campo alemán nevado: uno echa nieve con la pala sobre la mina («bury»); el otro mira el
//    termómetro, que baja en «so cold», y tirita («!»). Encima del decorado: el cielo tramado con sol velado, nubes de tres
//    tonos a tres velocidades, la bandada, el humo de la caseta y copos; en la nieve, manchas de sombra azul, ondas del
//    viento, roderas hondas con barro, huellas, sombras de pinos y camión, ventisqueros, piedras y matas que se mecen
//    (también en el primer término, delante de la valla);
// 4. (corta en «electronics») por dentro de la mina: las válvulas brillan, la escarcha crece desde los bordes y todo se
//    apaga en «stop working»; en «proposed solutions» asoma una gallina por la escotilla, recortada al disco del cristal
//    (en la barra del año y en la zona de Atom la escarcha es un velo liso);
// 5. (corta en «put live chickens») el plano azul: el lápiz, inclinado, repasa las gallinas por abajo con su comedero y
//    su bebedero, y salen las rayitas del calor («body heat»); del brazo asoman ≤ 44 px;
// 6. (corta en «would keep it warm») gag 4: en la nieve, una gallina llega dejando sus huellas, sube a la mina y se echa a
//    empollar encima, tan tranquila; la escarcha se derrite a su alrededor y el técnico del fondo levanta el dedo. Cielo
//    tramado con nubes de tres tonos y cuervos; al fondo medio el camión oliva y la caseta de troncos con humo; la mina con
//    chapa manchada, juntas, remaches, dos tapas atornilladas, escarcha que destella y su sombra azul en la nieve.
import * as T from '/atomo/plato/escenas/dc-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('dc-pavo');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const P = T.PIEZAS_DC, k = T.C.k;
const hh = (x, y, s = 0) => { const v = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453; return v - Math.floor(v); };
const mez = (a, b, u) => { const A = hex(a), B = hex(b); const c = (s) => Math.round(((A >>> s) & 255) + (((B >>> s) & 255) - ((A >>> s) & 255)) * u); return (0xff000000 | (c(16) << 16) | (c(8) << 8) | c(0)) >>> 0; };
// pinta algo en un búfer aparte y lo copia solo dentro del hueco [x0, y0, x1, y1] (ventanas, escotillas)
const enHueco = (dibuja, huecos) => { const b = R.nuevo(), prev = R.usar(b); dibuja(); R.usar(prev); for (const [x0, y0, x1, y1] of huecos) for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const c = b[y * 320 + x]; if (c) R.pset(x, y, c); } };
// lo mismo con un hueco redondo de centro (cx, cy) y radio r (la escotilla): recorte de disco
const enDisco = (dibuja, cx, cy, r) => { const b = R.nuevo(), prev = R.usar(b); dibuja(); R.usar(prev); for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) { if ((x - cx) ** 2 + (y - cy) ** 2 > r * r + r * 0.4) continue; const c = b[y * 320 + x]; if (c) R.pset(x, y, c); } };
// un fondo fijo pintado una vez en su búfer y puesto en pantalla de un recorrido
const capas = new Map();
const fondo = (clave, dibuja) => { let b = capas.get(clave); if (!b) { b = R.nuevo(); const prev = R.usar(b); dibuja(); R.usar(prev); capas.set(clave, b); } const d = R.usar(b); R.usar(d); d.set(b); };
// los auriculares de escuchar sobre la cabeza que devuelve R.actor
const cascos = ([cx, cy]) => { const Z = hex('#3a3a44'), z = hex('#6a6a78'); for (let i = -6; i <= 6; i++) { const y = cy + 1 + Math.round((i * i) / 9); R.pset(cx + i, y - 1, k); R.pset(cx + i, y, Z); } for (const s of [-1, 1]) { R.rect(cx + s * 7 - 1, cy + 4, cx + s * 7 + 1, cy + 9, k); R.rect(cx + s * 7 - (s < 0 ? 0 : 0), cy + 5, cx + s * 7, cy + 8, z); } };
// cifras de 3 × 5 (las fechas de una etiqueta o de un papel: números, no letras)
const CIF = { 0: ['###', '#.#', '#.#', '#.#', '###'], 1: ['.#.', '##.', '.#.', '.#.', '###'], 2: ['###', '..#', '###', '#..', '###'], 4: ['#.#', '#.#', '###', '..#', '..#'], 5: ['###', '#..', '###', '..#', '###'], 6: ['###', '#..', '###', '#.#', '###'], 7: ['###', '..#', '.#.', '.#.', '.#.'], 3: ['###', '..#', '.##', '..#', '###'], 8: ['###', '#.#', '###', '#.#', '###'], 9: ['###', '#.#', '###', '..#', '###'] };
const cifras = (s, x, y, c, e = 1) => String(s).split('').forEach((d, n) => (CIF[d] || []).forEach((f, j) => { for (let i = 0; i < 3; i++) if (f[i] === '#') R.rect(x + (n * 4 + i) * e, y + j * e, x + (n * 4 + i) * e + e - 1, y + j * e + e - 1, c); }));
// la paloma que picotea cuando la escena quiere (la pieza decide la pose con su t: se le da uno que cae en «pica»)
const palomaPica = (x, y, t, pica, o = {}) => P.paloma(R, x, y, { ...o, t: pica ? (0.05 - x) / 3 : 1.4 - x / 3, picotea: pica });
// el vaho del aliento en el frío: nubecitas que salen de la boca y se deshacen
const vaho = (x, y, t, dir, fase = 0) => { const u = ((t + fase) % 1.4) / 1.4; if (u > 0.7) return; const r = 1 + u * 3, cx = Math.round(x + dir * (2 + u * 9)), cy = Math.round(y - u * 5); R.disco(cx, cy, r, u < 0.35 ? hex('#f4f8fc') : hex('#d8e2ec')); };

// el cielo de nieve tramado: cinco grises azulados con trama ordenada 4 × 4 y vetas suaves (de arriba, y = 0, a y1)
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], bay = (x, y) => BAYER[(y & 3) * 4 + (x & 3)] / 16;
const CIELO_N = ['#7e889e', '#929cb0', '#a8b0c2', '#bec5d2', '#d4d9e2'].map((c) => hex(c));
const cieloTram = (x, y, y1) => { const u = Math.min(0.999, Math.max(0, y / y1 + (hh(x >> 4, y >> 2, 50) - 0.5) * 0.08)) * (CIELO_N.length - 1), i = Math.floor(u); return CIELO_N[Math.min(CIELO_N.length - 1, u - i > bay(x, y) ? i + 1 : i)]; };
// nubes de nieve de tres tonos (la luz arriba, el cuerpo y la panza en sombra) en capas a distintas velocidades;
// ok(x, y) dice dónde hay cielo. Cada capa: [y de la base, alto, ancho, velocidad, cuántas, [luz, cuerpo, sombra], semilla]
const nubes = (t, ok, capas) => { for (const [yb, al, an, v, n, tonos, s] of capas) { const [L, Cu, S] = tonos.map((c) => hex(c)), per = 320 + an * 2;
  for (let c = 0; c < n; c++) { const w = Math.round(an * (0.7 + hh(c, 1, s) * 0.6)), hg = Math.round(al * (0.7 + hh(c, 2, s) * 0.5)), y0 = yb + Math.round((hh(c, 3, s) - 0.5) * al * 0.8);
    const x0 = Math.round(((hh(c, 4, s) * 60 + c * per / n + t * v) % per) - an), nb = 4 + Math.floor(hh(c, 5, s) * 3), bl = [];
    for (let b = 0; b < nb; b++) { const u = (b + 0.5) / nb, sn = Math.sin(u * Math.PI); bl.push([x0 + u * w, y0 - hg * (0.25 + 0.45 * sn) * (0.7 + hh(c, 6 + b, s) * 0.3), w / nb * 0.95 + 2, hg * (0.4 + 0.45 * sn)]); }
    const den = (x, y) => { if (y > y0) return false; for (const [bx, by, rx, ry] of bl) if (((x - bx) / rx) ** 2 + ((y - by) / ry) ** 2 <= 1) return true; return false; };
    for (let y = Math.max(0, y0 - hg - 3); y <= y0; y++) for (let x = Math.max(0, x0 - 6); x <= Math.min(319, x0 + w + 6); x++) { if (!den(x, y) || !ok(x, y)) continue;
      R.pset(x, y, !den(x + 1, y - 2) ? L : y > y0 - 1 - hg * 0.3 + bay(x, y) * 2.5 ? S : Cu); } } } };
// una bandada pequeña que cruza batiendo las alas (nunca en la zona de Atom ni en la barra del año)
const pajaros = (t, ok, n, y0, v, s, col = '#24242c') => { const K = hex(col), pk = (x, y) => { if (x >= 0 && x < 320 && y > 16 && !(x > 274 && y < 48) && ok(x, y)) R.pset(x, y, K); };
  for (let i = 0; i < n; i++) { const x = Math.round(((t * v + hh(s, 1, 51) * 300) % 420) - 60 - i * 7), y = y0 + Math.abs(i - (n >> 1)) * 3 + Math.round(Math.sin(t * 2 + i) * 1.2), a = Math.floor(t * 7 + i * 1.7) % 2;
    pk(x, y); pk(x + 1, y); if (a) { pk(x - 1, y - 1); pk(x - 2, y - 2); pk(x + 2, y - 1); pk(x + 3, y - 2); } else { pk(x - 1, y); pk(x - 2, y + 1); pk(x + 2, y); pk(x + 3, y + 1); } } };
// la nieve del suelo (para tocar solo la nieve y no la mina, el hoyo, las personas o los postes)
const NIEVE = new Set(['#eef2f8', '#c4d0e2', '#ffffff', '#9eacc4'].map((c) => hex(c)));
// un ventisquero: un montón de nieve con la cresta iluminada, la cara de sombra azul y su sombra en el suelo
const monton = (cx, cy, rx, ry) => { const { pset } = R; for (let i = -rx; i <= Math.round(rx * 1.5); i++) { if (i > rx * 0.2) { pset(cx + i, cy + 1, i % 2 ? hex('#c4d0e2') : hex('#b4c2d8')); if (i < rx) pset(cx + i, cy + 2, hex('#c4d0e2')); } if (i > rx) continue;
  const hg = Math.round(Math.sqrt(1 - (i / rx) ** 2) * ry); for (let j = 0; j <= hg; j++) pset(cx + i, cy - j, j === hg ? hex('#ffffff') : i > rx * 0.25 && j < hg * 0.8 + bay(cx + i, cy - j) ? (j < 1 ? hex('#b4c2d8') : hex('#c8d4e6')) : hex('#f2f6fa')); } };
// una piedra que asoma de la nieve, con su gorro blanco y su sombra
const piedra = (x, y, r) => { const { pset, disco } = R; for (let i = 0; i <= r + 2; i++) pset(x + i, y + 1, hex('#9eacc4')); disco(x, y, r, hex('#3e424a')); disco(x, y, r - 1, hex('#5e626c')); pset(x - 1, y - 1, hex('#8a8e98')); pset(x - 2, y, hex('#7a7e88')); for (let i = -r + 1; i < r; i++) pset(x + i, y - r + (Math.abs(i) > r - 2 ? 1 : 0), hex('#ffffff')); for (let i = -r; i <= r; i++) pset(x + i, y + 1, hex('#eef2f8')); };
// una mata de hierba seca que asoma y se mece con el viento
const mata = (x, y, t, n = 5) => { const { linea, pset } = R; for (let i = 0; i < n; i++) { const bx = x + i * 2 - n, al = 4 + Math.round(hh(x, i, 52) * 4), sw = Math.round(Math.sin(t * 2.3 + x * 0.3 + i) * 1.2) - 1;
  linea(bx, y, bx + sw + (i - (n >> 1)), y - al, [hex('#8a7444'), hex('#a8905a'), hex('#6a5a34')][i % 3]); } for (let i = -n + 1; i < n - 1; i++) pset(x + i, y, hex('#ffffff')); pset(x - 1, y - 1, hex('#ffffff')); };

const m = (f) => en('peacock', f);
const P2 = m(0.1806), P3 = m(0.383), P4 = m(0.599), P5 = m(0.7686), P6 = m(0.9524);
const FRIO = m(0.052), SIETE = m(0.257), PAVO = m(0.314), ENTIERRA = m(0.368), INVIERNO = m(0.528), TANFRIO = m(0.558);
const PARA = m(0.648), SOLUCION = m(0.724), GALLINAS = m(0.792), COMIDA = m(0.864), AGUA = m(0.889), CALOR = m(0.924), TEMPLADA = m(0.969);

// la caja de la electrónica escarchada que lleva el técnico
const cajaFria = (x, y, t) => { const { rect, pset } = R; rect(x - 6, y - 8, x + 6, y, k); rect(x - 5, y - 7, x + 5, y - 1, hex('#5a6a5a')); rect(x - 5, y - 7, x + 5, y - 6, hex('#eef6fc')); for (const i of [-4, -1, 2, 4]) pset(x + i, y + 1, hex('#c8e4f0')); pset(x - 2, y - 4, Math.sin(t * 9) > 0 ? hex('#f8f8ff') : hex('#8ab0c0')); rect(x + 2, y - 4, x + 3, y - 3, hex('#3a8a3a')); };

// 1 · el despacho de Londres: el problema del frío
const p1 = (t) => {
  const g = T.hielo(R, t, { encuadre: 'londres42' });
  const entra = tramo(t, 0.1, FRIO - 0.2), x = Math.round(lerp(-18, 112, entra)) + (entra >= 1 ? Math.round(Math.sin(t * 40)) : 0);
  const b = R.actor(EL.tecnicoBritanico2, 168, 162, t, { dir: -1, sorpresa: t > FRIO + 0.2 && t < P2 - 1.2, habla: t > P2 - 1.2 && Math.sin(t * 8) > 0, dedo: t > P2 - 1.2 });
  const a = R.actor(EL.tecnicoBritanico, x, 164, t, { dir: 1, anda: entra > 0 && entra < 1, sostiene: t > FRIO ? [x + 22, 130] : true, triste: entra >= 1 });
  cajaFria(a.mano[0] + 2, a.mano[1] + 2, t);
  vaho(a.cabeza[0] + 5, a.cabeza[1] + 9, t, 1); vaho(b.cabeza[0] - 5, b.cabeza[1] + 9, t, -1, 0.7);
  // copos de nieve que entran con él y se derriten en el parqué
  for (let n = 0; n < 7; n++) { const u = tramo(t, 0.1 + n * 0.12, 1.6 + n * 0.12); if (u > 0 && u < 1) R.pset(Math.round(lerp(0, 60 + n * 12, u)), Math.round(110 + n * 6 + Math.sin(u * 9 + n) * 3 + u * 30), hex('#f4f8ff')); }
  T.hieloDelante(R, t, { encuadre: 'londres42' });
  if (t > FRIO + 0.2) R.bocadillo(b.cabeza[0] + 3, b.cabeza[1] - 4, { icono: '?' });
};

// 2 · el taller frío: la báscula marca 7 y la chapa del pavo real
const p2 = (t) => {
  const { rect, pset, linea, disco } = R;
  const o = { encuadre: 'tallerHielo', bloques: false };
  T.hielo(R, t, o);
  // la viga de hierro con su carro y la cadena hasta la báscula
  rect(0, 18, 200, 23, k); rect(0, 19, 200, 20, hex('#6a7078')); rect(0, 21, 200, 22, hex('#4a5058')); for (let x = 4; x < 200; x += 10) pset(x, 21, hex('#9aa0a8'));
  rect(92, 23, 108, 28, k); rect(93, 24, 107, 27, hex('#c8a030'));
  const iza = tramo(t, P2 + 0.2, SIETE - 0.2), alto = Math.round(iza * 3);
  for (let y = 29; y < 40; y += 2) { rect(99, y, 101, y + 1, k); pset(100, y, hex('#9aa0a8')); }
  disco(100, 52, 13, k); disco(100, 52, 12, hex('#f0ece0')); for (let a = -2.4; a <= 0.6; a += 0.4) pset(Math.round(100 + Math.cos(a) * 10), Math.round(52 + Math.sin(a) * 10), k);
  const ang = lerp(-2.4, -0.2, tramo(t, P2 + 0.3, SIETE)) + (t > SIETE ? Math.sin((t - SIETE) * 14) * 0.08 * Math.max(0, 1 - (t - SIETE)) : 0);
  linea(100, 52, Math.round(100 + Math.cos(ang) * 9), Math.round(52 + Math.sin(ang) * 9), hex('#c8303a')); disco(100, 52, 1, k);
  for (let y = 66; y < 76; y += 2) { rect(99, y, 101, y + 1, k); pset(100, y, hex('#9aa0a8')); }
  linea(100, 76, 70, 104 - alto, k); linea(100, 76, 130, 104 - alto, k); linea(101, 76, 71, 104 - alto, hex('#9aa0a8')); linea(99, 76, 129, 104 - alto, hex('#9aa0a8'));
  if (t > SIETE) { const u = tramo(t, SIETE, SIETE + 0.3); R.numero('7', 126, Math.round(lerp(66, 60, u)), { tam: 16 }); }
  // el carro y la mina
  rect(52, 150, 150, 155, k); rect(53, 151, 149, 153, hex('#5a6a3a')); for (const wx of [62, 138]) { disco(wx, 158, 4, k); disco(wx, 158, 2, hex('#6a6a6a')); }
  P.minaPeacock(R, 100, 150 - alto, { s: 2, escarcha: true });
  // la chapa del pavo real (la pluma con su ojo) que cuelga el técnico
  const cuelga = tramo(t, PAVO - 0.5, PAVO);
  const b = R.actor(EL.tecnicoBritanico, Math.round(lerp(168, 146, tramo(t, P2 + 0.5, PAVO - 0.6))), 162, t, { dir: -1, anda: t > P2 + 0.5 && t < PAVO - 0.6, sostiene: cuelga > 0 && cuelga < 1 ? [140, 118] : false, dedo: t > SIETE && t < PAVO - 0.6, sonrisa: t > PAVO });
  const chapa = (x, y) => { R.linea(x, y - 6, x, y - 2, k); rect(x - 5, y - 2, x + 5, y + 10, k); rect(x - 4, y - 1, x + 4, y + 9, hex('#f0e8d0')); disco(x, y + 4, 3, hex('#1a7ab8')); disco(x, y + 4, 2, hex('#2ac0a8')); disco(x, y + 4, 1, hex('#1a2a6a')); for (const i of [-3, 3]) pset(x + i, y + 8, hex('#3a8a4a')); };
  if (cuelga > 0 && cuelga < 1) chapa(b.mano[0], b.mano[1] + 2); else if (cuelga >= 1) chapa(134, 118 - alto);
  if (t > PAVO && t < PAVO + 0.8 && Math.floor(t * 10) % 2) for (const [dx, dy] of [[-8, -4], [8, 0], [0, 14]]) pset(134 + dx, 118 + dy, hex('#ffffff'));
  R.actor(EL.tecnicoBritanico2, 248, 158, t, { dir: -1, habla: t > SIETE && t < SIETE + 1 && Math.sin(t * 9) > 0, sorpresa: t > SIETE && t < SIETE + 0.6 });
  T.hieloDelante(R, t, o);
};

// 3 · el campo nevado: enterrarla en Alemania; el termómetro baja
// el cielo del campo se repinta encima del decorado, solo por encima de la cresta de las colinas lejanas (la misma
// curva que b_nieve): trama, sol velado, nubes de tres tonos a tres velocidades, la bandada, el humo y los copos
const CIMA3 = Array.from({ length: 320 }, (_, x) => Math.round(62 - 10 * (0.5 + 0.3 * Math.sin(x * 0.021) + 0.2 * Math.sin(x * 0.067))));
let CIELO3 = null;
const cielo3 = (t) => {
  const { pset } = R, ok = (x, y) => y < CIMA3[x];
  if (!CIELO3) { CIELO3 = new Uint32Array(320 * 64); for (let y = 0; y < 64; y++) for (let x = 0; x < 320; x++) { let c = cieloTram(x, y, 62); const d = Math.hypot(x - 236, y - 24); if (d < 6) c = hex('#eef0f4'); else if (d < 14 && (14 - d) / 8 > bay(x, y)) c = d < 9 ? hex('#e0e4ea') : hex('#cfd4dd'); CIELO3[y * 320 + x] = c; } }
  for (let x = 0; x < 320; x++) for (let y = 0; y < CIMA3[x]; y++) pset(x, y, CIELO3[y * 320 + x]);
  nubes(t, ok, [[48, 7, 34, 1.2, 5, ['#eceef2', '#d4d8e0', '#b0b8c6'], 53], [36, 10, 48, 2.8, 4, ['#f2f4f6', '#c8ced8', '#9098aa'], 54], [22, 13, 66, 5, 3, ['#f6f7f9', '#bcc3cf', '#7e869a'], 55]]);
  pajaros(t, ok, 5, 30, 13, 3);
  // el humo de la chimenea de la caseta, que se lleva el viento hacia la izquierda
  for (let n = 0; n < 7; n++) { const u = (t * 0.32 + n / 7) % 1, cx = 274 - u * 18 + Math.sin(u * 6 + n) * 2, cy = 70 - u * 34, r = 1.5 + u * 3.5, c = u < 0.4 ? hex('#a4aab4') : hex('#c8ccd4');
    for (let y = Math.round(cy - r); y <= cy + r; y++) for (let x = Math.round(cx - r); x <= cx + r; x++) if (x >= 0 && x < 278 && (x - cx) ** 2 + (y - cy) ** 2 <= r * r && ok(x, y) && (u < 0.7 || bay(x, y) > (u - 0.7) * 3)) pset(x, y, c); }
  // los copos sobre el cielo (el decorado pinta los suyos más abajo)
  for (let n = 0; n < 36; n++) { const capa = n % 3, x = Math.round((hh(n, 1, 56) * 340 + Math.sin(t * 0.9 + n) * (2 + capa) - t * (2 + capa * 2) + 3400) % 340) - 10, y = Math.round((hh(n, 2, 56) * 64 + t * [7, 12, 20][capa]) % 64);
    if (x < 0 || x > 319 || !ok(x, y) || (x > 274 && y < 48)) continue; pset(x, y, capa ? hex('#ffffff') : hex('#e4e8ee')); if (capa === 2 && ok(x + 1, y)) pset(x + 1, y, hex('#ffffff')); }
};
// la nieve del suelo: manchas de sombra azul tramadas, las roderas del camión hondas con barro, ondas del viento y
