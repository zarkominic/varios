<body>
<canvas id="lienzo"></canvas>
<script type="module">
// OI-CIERRE (frases 45–47), de 1795 a hoy. Cinco planos, música de cierre, sin prisas:
// 1. la boca del pozo en 1795 a la caída de la tarde: Daniel señala la polea del roble en «oak» y un amigo le habla; el
//    viento arranca las hojas; en «legend» todo se deshace con un fundido tramado de arriba abajo (primero el roble) y
//    queda la boca de 1909, sin roble: un cavador llega, busca el árbol y en «knows» le sale el «?» (la barra 1795 → 1909);
// 2. el pozo en corte, por la tarde (corta en «where»): el geólogo saca el dibujo viejo y señala el pozo; el contorno de
//    puntos dorados del agujero de 1795 con su placa «1795», que late en «hole» y luego va de un sitio a otro sin saber
//    dónde («?» en «anymore», el cavador se encoge de hombros); en «Dozens» aparecen las docenas de pozos y túneles y lo
//    borran (la barra corre de 1909 a 2026);
// 3. la isla desde el aire, hoy (corta en el silencio antes de «But the sea»): la marea entra en «in» y sale en «out», dos
//    veces, con las flechas de la corriente, los bajos de arena que salen y se tapan, la calzada con coches, la sombra de
//    las nubes y una barca langostera con su estela;
// 4. la bahía al atardecer, 1795 (corta en «Just as it did»): el muchacho rema desde las rocas de delante hacia la isla,
//    mira por encima del hombro en «teenager» y señala la isla en «to it»;
// 5. el fondo del pozo en corte, hoy (corta en «there's»): un operario en el andamio con su farol; en «gold» brilla algo
//    dorado en una cavidad bajo el fondo; en «Or maybe» se levanta el limo y lo tapa; en «nature opened» se abre una grieta
//    en la anhidrita y sale un cangrejo; en «curiosity» el operario baja el farol por la cuerda y la luz llega al fondo:
//    otra vez un brillo que no se distingue; en «close» vuelve el limo y queda el «?».
import * as T from '/atomo/plato/escenas/oi-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('oi-cierre');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const H = (s) => hex(s), K = hex('#1c1222');
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const mez = (c1, c2, a) => { a = Math.max(0, Math.min(1, a)); const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
const ease = (u) => u * u * (3 - 2 * u);
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], by4 = (x, y) => (BAY[((y & 3) << 2) | (x & 3)] + 0.5) / 16;
// rampa tramada: v de 0 a 1 sobre una lista de colores
const rampa = (cols, v, x, y) => { const f = Math.max(0, Math.min(cols.length - 1.001, v * (cols.length - 1))), i = Math.floor(f); return by4(x, y) < f - i ? cols[i + 1] : cols[i]; };
// ruido de valor suave
const vn = (x, y, k = 0) => { const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const a = hh(xi, yi, k), b = hh(xi + 1, yi, k), c = hh(xi, yi + 1, k), d = hh(xi + 1, yi + 1, k); return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy; };
// fondo fijo en un búfer (se pinta una vez y se copia en cada fotograma; R.usar(prev), nunca R.usar() a secas)
const FIJO = {};
const fijo = (clave, dibuja) => { if (!FIJO[clave]) { const b = R.nuevo(), prev = R.usar(b); dibuja(); R.usar(prev); FIJO[clave] = b; } R.copiar(FIJO[clave]); };
// zonas tranquilas: la de Atom y la barra del año
const tranquila = (x, y) => (x > 262 && y < 54) || (x > 14 && x < 176 && y < 18);
// nube de tres tonos (sombra, cuerpo, luz)
const nube = (cx, cy, w, c3) => { const b = [[0, 0, .32], [-.32, .07, .23], [.31, .06, .25], [-.12, -.12, .25], [.15, -.09, .22], [.5, .12, .14], [-.5, .12, .13]];
  for (const [dx, dy, r] of b) R.disco(Math.round(cx + dx * w), Math.round(cy + dy * w + 2), Math.round(r * w), c3[0]);
  for (const [dx, dy, r] of b) R.disco(Math.round(cx + dx * w), Math.round(cy + dy * w), Math.round(r * w), c3[1]);
  for (const [dx, dy, r] of b) if (dy <= 0.07) R.disco(Math.round(cx + dx * w - 1), Math.round(cy + dy * w - 2), Math.round(r * w * .7), c3[2]); };
// gaviotas en vuelo (una «v» que aletea); no entran en las zonas tranquilas
const aves = (t, lista, c) => { for (const [x0, y0, v, k] of lista) { const x = Math.round(((x0 + t * v) % 360 + 360) % 360 - 20), y = Math.round(y0 + 3 * Math.sin(t * 0.7 + k)); if (tranquila(x, y) || tranquila(x + 2, y - 2)) continue; const a = Math.sin(t * 8 + k) > 0;
  R.pset(x, y, c); R.pset(x - 1, y - (a ? 1 : 0), c); R.pset(x + 1, y - (a ? 1 : 0), c); R.pset(x - 2, y - (a ? 2 : 0), c); R.pset(x + 2, y - (a ? 2 : 0), c); } };
// barca de remos de perfil: x = popa, yW = línea del agua, L largo, H alto de la borda; d = 1 la proa a la derecha.
// mar: color del agua (para la obra viva). Devuelve la borda en el centro.
const barca = (x, yW, L, Hb, d, mar, o = {}) => {
  const X = (u) => Math.round(d > 0 ? x + u : x + L - u), KK = H('#2a1c14'), M = H(o.casco ?? '#8a5a34'), ML = H(o.cascoL ?? '#b07c4c'), MS = H(o.cascoS ?? '#5e3a20'), BO = H(o.borda ?? '#c89a64');
  const top = (u) => yW - Hb - Math.round(Hb * 0.32 * ((2 * u / L - 1) ** 2)) - (u > L * 0.85 ? Math.round((u - L * 0.85) / (L * 0.15) * Hb * 0.2) : 0);
  const bot = (u) => { const b = yW + Math.max(1, Math.round(Hb * 0.18)), r = Hb * 0.7; return u > L - r ? Math.round(top(u) + (b - top(u)) * Math.max(0, (L - u) / r)) : u < Hb * 0.25 ? Math.round(top(u) + (b - top(u)) * Math.max(0.6, u / (Hb * 0.25))) : b; };
  for (let u = 0; u <= L; u++) { const y0 = top(u), y1 = bot(u), xx = X(u);
    for (let y = y0; y <= y1; y++) { const j = (y - y0) / Math.max(1, yW - y0); let c = y === y0 || y === y1 || u === 0 || u === L ? KK : y <= y0 + Math.max(1, Math.round(Hb * 0.12)) ? BO : (Math.round(j * 3 * 10) % 10 === 0 && j > 0.2) ? MS : j < 0.45 ? ML : M;
      if (c !== KK && hh(u, y, 9) < 0.08) c = MS; if (y > yW && c !== KK && mar != null) c = mez(c, mar, 0.55); R.pset(xx, y, c); } }
  return top(L / 2);
};
// un remo de perfil que bate (f fase): el pivote en la borda y la pala que entra en el agua
const remo = (px, py, yW, largo, f, d, c = '#c8a070') => { const bx = Math.round(px - d * (largo * 0.25) + d * largo * 0.55 * Math.cos(f)), by = Math.round(yW + 1 + 3 * Math.sin(f)), hx = Math.round(px + (px - bx) * 0.4), hy = Math.round(py - 3 - (by - py) * 0.25);
  R.linea(hx, hy, bx, by, H('#3a2818')); R.linea(hx, hy - 1, bx, by - 1, H(c)); R.disco(bx, by, 2, H('#7a5430')); R.pset(bx - 1, by - 1, H(c));
  return { bx, by, hx, hy, dentro: Math.sin(f) > 0 }; };
// placa con un número (para que se lea sobre un fondo con detalle)
const placa = (txt, cx, cy, borde = '#e8c060') => { const w = txt.length * 4 + 3; R.rect(cx - w - 1, cy - 6, cx + w + 1, cy + 5, K); R.rect(cx - w, cy - 5, cx + w, cy + 4, H('#2a2026')); R.rect(cx - w, cy - 5, cx + w, cy - 5, H(borde)); R.numero(txt, cx, cy + 3, { centro: true }); };

const r = (f) => en('roble', f), m = (f) => en('mar', f), q = (f) => en('quiza', f);
const P2 = r(0.3516), P3 = m(-0.0990), P4 = m(0.5293), P5 = q(0.0281);
const OAK = r(0.095), LEG = r(0.1425), KNOWS = r(0.2785), WHERE = r(0.3571), Y1795 = r(0.4502), HOLE = r(0.578), ANY = r(0.6474), DOZ = r(0.746), OUT = r(0.9597);
const IN = m(0.1552), OUTM = m(0.2512), TWICE = m(0.3443), TEEN = m(0.7241), ROW = m(0.8512), IT = m(0.9557);
const GOLD = q(0.0779), OR = q(0.2741), HOLEQ = q(0.4402), NAT = q(0.5126), OPEN = q(0.567), CUR = q(0.7088), CLOSE = q(0.9081);
const D0 = LEG - 0.05, D1 = LEG + 1.0;   // el fundido de 1795 a 1909

// ── 1 · la boca del pozo: el roble de la leyenda se deshace ─────────────────────────────────────────────────────────
const HOJAS = Array.from({ length: 46 }, (_, k) => [70 + hh(k, 1, 3) * 72, 22 + hh(k, 2, 3) * 40, OAK - 0.7 + hh(k, 3, 3) * 1.6, hh(k, 4, 3)]);
const hojas = (t) => { const cols = [H('#e8b030'), H('#d87a28'), H('#b8562a'), H('#c89a3a')];
  for (const [x0, y0, s, k] of HOJAS) { const d = t - s; if (d < 0) continue; const x = Math.round(x0 + d * (26 + k * 16) + Math.sin(d * 4 + k * 9) * 4), y = Math.round(y0 + d * (16 + k * 10));
    if (y > 178 || x > 318 || tranquila(x, y)) continue; const c = cols[Math.floor(k * 4)], g = Math.floor(d * 6 + k * 5) % 2; R.pset(x, y, c); R.pset(x + 1, y + g, c); R.pset(x + (g ? 0 : 1), y + 1, K); } };
const p1a = (t) => {
  T.pozo(R, t, { encuadre: 'boca', epoca: '1795', luz: 'tarde' });
  R.actor(EL.amigo1, 204, 166, t, { dir: -1, habla: t > 0.5 && t < OAK - 0.3 && Math.sin(t * 7) > 0, sonrisa: t > OAK + 0.3 });
  R.actor(EL.mcginnis, 106, 166, t, { dir: 1, dedo: t > OAK - 0.15, sonrisa: t < OAK - 0.15, sorpresa: t > LEG - 0.2 });
  hojas(t);
};
const p1b = (t) => {
  T.pozo(R, t, { encuadre: 'boca', epoca: '1909', luz: 'tarde' });
  R.actor(EL.capataz, 262, 166, t, { dir: -1, habla: t > D1 && Math.sin(t * 6) > 0.2 });
  const u = tramo(t, D1 - 0.3, KNOWS - 0.1), x = Math.round(lerp(-18, 80, ease(u))), mira = t > KNOWS - 0.1 && t < KNOWS + 0.4;
  R.actor(EL.cavador, x, 166, t, { dir: mira ? -1 : 1, anda: u > 0 && u < 1 });
  // la pala al hombro
  if (u < 1 || !mira) { R.linea(x + 3, 142, x + 14, 152, H('#6a4a2a')); R.rect(x + 1, 139, x + 4, 143, H('#8a8a96')); R.pset(x + 1, 139, K); }
  if (t > KNOWS) R.bocadillo(x + 8, 136, { icono: '?' });
};
let BX = null;
const p1 = (t) => {
  const u = tramo(t, D0, D1);
  if (u <= 0) { p1a(t); return; }
  if (u >= 1) { p1b(t); return; }
  BX = BX || R.nuevo(); const prev = R.usar(BX); p1b(t); R.usar(prev);
  p1a(t);
  // se deshace de arriba abajo: primero el roble, luego la gente y la tierra
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) { const v = (by4(x, y) * 0.55 + hh(x >> 2, y >> 2, 5) * 0.45) * 0.55 + (y / 180) * 0.45; if (v < u) R.pset(x, y, BX[y * 320 + x]); }
};

// ── 2 · el pozo en corte: nadie sabe dónde estaba el primer agujero ─────────────────────────────────────────────────
const p2 = (t) => {
  const pz = ease(tramo(t, DOZ, OUT + 0.2));
  T.pozo(R, t, { encuadre: 'corte', epoca: '1909', luz: 'tarde', pozos: pz, nivel: 0.5 });
  // el contorno de puntos del agujero de 1795: late en «hole», luego va de un sitio a otro; se borra con los pozos nuevos
  const vis = tramo(t, P2 + 0.3, P2 + 0.9) * (1 - tramo(t, DOZ + 0.4, OUT));
  if (vis > 0) {
    const sitios = [112, 146, 80, 128, 96], busca = tramo(t, HOLE + 0.5, DOZ + 0.4), k = Math.min(4, Math.floor(busca * 5)), kk = Math.min(4, k + 1), f = ease(Math.min(1, (busca * 5 - k) * 2.2));
    const cx = Math.round(busca > 0 ? lerp(sitios[k], sitios[kk], f) : 112), late = t > HOLE - 0.1 && t < HOLE + 0.6 ? Math.floor(t * 10) % 2 : 0;
    const oro = late ? H('#fff6c8') : H('#f0c858'), x0 = cx - 11, x1 = cx + 11, y0 = 53, y1 = 88, fase = Math.floor(t * 8);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (hh(x, y, 1) < vis) { const borde = x <= x0 + 1 || x >= x1 - 1 || y >= y1 - 1; if (borde && ((x + y + fase) % 6) < 4) R.pset(x, y, (x === x0 || x === x1 || y === y1) ? oro : K); else if (!borde && (x + y) % 3 === 0 && hh(x, y, 2) < 0.35) R.pset(x, y, mez(R.pget(x, y), H('#f0c858'), 0.4)); }
    // la placa «1795» colgada del contorno
    if (t > Y1795 && vis > 0.5) { const e = tramo(t, Y1795, Y1795 + 0.3); placa('1795', cx, Math.round(lerp(88, 100, e))); R.linea(cx, y1, cx, Math.round(lerp(88, 100, e)) - 6, oro); }
    if (t > ANY && t < DOZ + 0.4) R.bocadillo(cx, 66 - Math.round(Math.abs(Math.sin(t * 5)) * 2), { icono: '?' });
  }
  // en la superficie (suelo y = 52): el geólogo con el dibujo viejo; el cavador se encoge de hombros
  const gx = 128, sor = t > DOZ + 0.2 && t < OUT + 0.2;
  R.actor(EL.geologo, gx, 52, t, { dir: -1, dedo: t > WHERE - 0.1 && t < HOLE + 0.3, sorpresa: sor, triste: t > OUT + 0.2 });
  if (!(t > WHERE - 0.1 && t < HOLE + 0.3)) { const px = gx - 4, py = 37; R.rect(px - 1, py - 1, px + 7, py + 8, H('#6a5a3a')); R.rect(px, py, px + 6, py + 7, H('#e8dcb0')); R.disco(px + 3, py + 2, 2, H('#5a8a40')); R.linea(px + 3, py + 3, px + 3, py + 6, H('#6a4a24')); R.pset(px + 5, py + 4, H('#3a3030')); R.rect(px + 1, py + 6, px + 5, py + 6, H('#8a6a4a')); }
  R.actor(EL.cavador, 54, 52, t, { dir: 1, brazos: t > ANY && t < ANY + 0.9, habla: t > HOLE + 0.2 && t < ANY && Math.sin(t * 7) > 0, sorpresa: sor });
};

// ── 3 · la isla desde el aire, hoy: la marea entra y sale dos veces ─────────────────────────────────────────────────
let FLD = null;
const campo = () => {
  FLD = new Float32Array(57600);
  const G = [[150, 100, 50, 26, 1.25], [208, 90, 40, 29, 1.32], [112, 110, 26, 15, 1.0], [238, 104, 16, 12, 0.85], [178, 113, 30, 13, 0.8], [-40, 90, 85, 260, 1.6], [300, 170, 16, 9, 0.95], [64, 22, 14, 8, 0.7]];
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) { let v = 0; for (const [cx, cy, rx, ry, a] of G) { const dx = (x - cx) / rx, dy = (y - cy) / ry; v += a * Math.exp(-dx * dx - dy * dy); }
    FLD[y * 320 + x] = v + (vn(x / 14, y / 14, 1) - 0.5) * 0.26 + (vn(x / 5, y / 5, 2) - 0.5) * 0.09; }
};
const CLARO = [196, 88];
const enClaro = (x, y) => Math.hypot(x - CLARO[0], (y - CLARO[1]) * 1.2) < 11 + vn(x / 4, y / 4, 6) * 4;
const tierra = () => {
  const BOS = ['#22381e', '#2e4a2a', '#3e6234', '#5a8240', '#7aa04e'].map(H), OTO = H('#9a8a3a'), BAN = ['#7a6a48', '#a8946a', '#c8b48a'].map(H), TIE = ['#6a5038', '#8a6a48', '#a8845a'].map(H);
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) { const f = FLD[y * 320 + x]; if (f < 1) continue;
    let c = f < 1.05 ? rampa(BAN, vn(x / 3, y / 3, 3), x, y) : enClaro(x, y) ? rampa(TIE, vn(x / 3, y / 2, 4) * 0.8 + hh(x, y, 4) * 0.2, x, y) : rampa(BOS, 0.2 + vn(x / 6, y / 6, 5) * 0.5, x, y);
    R.pset(x, y, c); }
  // las copas de los árboles (sombra abajo a la derecha, luz arriba a la izquierda), y algún roble que ya amarillea
  const ok = (x, y) => x >= 0 && x < 320 && y >= 0 && y < 180 && FLD[y * 320 + x] >= 1.03 && !enClaro(x, y);
  const copa = (cx, cy, rr, c) => { for (let y = Math.floor(cy - rr); y <= cy + rr; y++) for (let x = Math.floor(cx - rr); x <= cx + rr; x++) if ((x - cx) ** 2 + (y - cy) ** 2 <= rr * rr && ok(x, y)) R.pset(x, y, c); };
  for (let k = 0; k < 1500; k++) { const x = hh(k, 1, 7) * 320, y = hh(k, 2, 7) * 180; if (!ok(Math.round(x), Math.round(y))) continue; const rr = 1.5 + hh(k, 3, 7) * 2.4, amar = hh(k, 4, 7) < 0.07;
    copa(x + 1, y + 1, rr, BOS[0]); copa(x, y, rr, amar ? OTO : BOS[2]); copa(x - 0.6, y - 0.6, rr * 0.55, amar ? H('#c8b048') : BOS[3]); if (rr > 2.6) R.pset(Math.round(x - 1), Math.round(y - 1), BOS[4]); }
  // el claro del Pozo del Dinero: hoyos, la grúa con su sombra, la torre, contenedores y casetas
  for (let k = 0; k < 16; k++) { const a = hh(k, 1, 8) * 6.28, d = hh(k, 2, 8) * 8, x = Math.round(CLARO[0] + Math.cos(a) * d), y = Math.round(CLARO[1] + Math.sin(a) * d * 0.8); R.pset(x, y, H('#1c140e')); R.pset(x + 1, y, H('#3a2a1e')); R.pset(x, y - 1, H('#b89a6a')); }
  R.linea(193, 97, 207, 83, H('#3a2a1e')); R.linea(190, 94, 204, 80, H('#e8b830')); R.linea(191, 94, 205, 80, H('#a87a18')); R.rect(187, 92, 191, 96, H('#e8b830')); R.rect(187, 96, 191, 96, H('#a87a18')); R.pset(188, 93, H('#2a3a4a'));
  R.rect(199, 85, 203, 89, H('#8a8a96')); R.linea(199, 85, 203, 89, H('#4a4a56')); R.linea(203, 85, 199, 89, H('#4a4a56')); R.rect(200, 90, 204, 90, H('#3a2a1e'));
  R.rect(183, 83, 188, 85, H('#3a6ab0')); R.rect(183, 85, 188, 85, H('#2a4a80')); R.rect(205, 92, 210, 94, H('#d86a2a')); R.rect(205, 94, 210, 94, H('#9a4a1e')); R.rect(186, 99, 193, 101, H('#f2eee2')); R.rect(186, 101, 193, 101, H('#a8a49a'));
  // el camino de tierra hacia la calzada, y casitas al oeste
  const cam = [[188, 94], [170, 97], [150, 101], [128, 105], [104, 109], [96, 110]];
  for (let i = 0; i + 1 < cam.length; i++) { R.linea(cam[i][0], cam[i][1] + 1, cam[i + 1][0], cam[i + 1][1] + 1, H('#6a5a3a')); R.linea(cam[i][0], cam[i][1], cam[i + 1][0], cam[i + 1][1], H('#c8aa78')); }
  for (const [x, y, c] of [[118, 98, '#b84a3a'], [126, 113, '#e8e4dc'], [138, 94, '#5a6a8a'], [160, 108, '#b84a3a']]) { R.rect(x + 1, y + 1, x + 5, y + 4, H('#1c2a1a')); R.rect(x, y, x + 4, y + 3, H(c)); R.rect(x, y, x + 4, y, mez(H(c), H('#ffffff'), 0.4)); }
};
const AGUA = ['#86d6c6', '#56b6b8', '#3492aa', '#287498', '#205c86', '#1a4a74', '#163e66'].map(H), ARENA = ['#c8b080', '#dcc694', '#e8d6a8'].map(H), MOJ = ['#8a7a64', '#a0927a', '#b4a890'].map(H);

  // el operario en el andamio: mira, se sorprende, se encoge; en «curiosity» deja correr la cuerda

  // y queda la duda
  if (t > CLOSE + 0.2) { const e = tramo(t, CLOSE + 0.2, CLOSE + 0.5); R.icono('?', CAV[0] - 7, Math.round(lerp(150, 136, e)), H('#f0c040'), K, 2); }
};
