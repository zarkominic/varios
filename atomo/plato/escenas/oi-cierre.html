// OI-CIERRE (frases 45–47), de 1795 a hoy. Cinco planos, música de cierre, sin prisas:
// 1. el claro desde lo alto, a la caída de la tarde (cámara alta en 3/4, sin cielo: el bosque arriba): en 1795 el roble
//    con la polea sobre la hondonada, el refugio de ramas, el fuego y un ciervo; Daniel señala la polea en «oak» y el viento
//    arranca hojas; en «legend» el roble se deshace en hojas y el fundido tramado se abre desde él hacia fuera: queda el
//    claro de 1909, pelado (tocones, barro, seis pozos con brocal, escombreras, pasarelas, el castillete, la casa de
//    máquinas con humo, la caseta, la vagoneta que empuja un peón, el torno que gira); del roble solo un charco: el cavador
//    llega, lo busca y en «knows» le sale el «?» (la barra 1795 → 1909);
// 2. el pozo en corte, por la tarde (corta en «where»): el geólogo saca el dibujo viejo y señala el pozo; el contorno de
//    puntos dorados del agujero de 1795 con su placa «1795», que late en «hole» y luego va de un sitio a otro sin saber
//    dónde («?» en «anymore», el cavador niega con la cabeza); en «Dozens» aparecen las docenas de pozos y túneles y lo
//    borran (la barra corre de 1909 a 2026);
// 3. la isla desde el aire, hoy (corta en el silencio antes de «But the sea»): la marea entra en «in» y sale en «out», dos
//    veces, con las flechas de la corriente, los bajos de arena que salen y se tapan, la calzada con coches, la sombra de
//    las nubes y una barca langostera con su estela;
// 4. la bahía al atardecer, 1795 (corta en «Just as it did»): el muchacho rema desde las rocas de delante hacia la isla,
//    mira por encima del hombro en «teenager» y señala la isla en «to it»;
// 5. el fondo del pozo en corte, hoy (corta en «there's»): un operario en el andamio con su farol; en «gold» brilla algo
//    dorado en una cavidad bajo el fondo; en «Or maybe» se levanta el limo y lo tapa; en «nature opened» se abre una grieta
//    en la anhidrita y sale de ella un cangrejo rojo con filo oscuro, pinzas en alto; se aparta por la roca clara; en
//    «curiosity» el operario baja el farol por la cuerda y la luz llega al fondo:
//    otra vez un brillo que no se distingue (el cangrejo se asusta y se vuelve a la grieta); en «close» vuelve el limo y queda el «?».
import * as T from '/atomo/plato/escenas/oi-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('oi-cierre');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const H = (s) => hex(s), K = hex('#1c1222');
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };

  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
const ease = (u) => u * u * (3 - 2 * u);
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], by4 = (x, y) => (BAY[((y & 3) << 2) | (x & 3)] + 0.5) / 16;
// rampa tramada: v de 0 a 1 sobre una lista de colores
const rampa = (cols, v, x, y) => { const f = Math.max(0, Math.min(cols.length - 1.001, v * (cols.length - 1))), i = Math.floor(f); return by4(x, y) < f - i ? cols[i + 1] : cols[i]; };
// ruido de valor suave
const vn = (x, y, k = 0) => { const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const a = hh(xi, yi, k), b = hh(xi + 1, yi, k), c = hh(xi, yi + 1, k), d = hh(xi + 1, yi + 1, k); return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy; };
// fondo fijo en un búfer (se pinta una vez y se copia en cada fotograma; R.usar(prev), nunca R.usar() a secas)
const FIJO = {};
const fijo = (clave, dibuja) => { if (!FIJO[clave]) { const b = R.nuevo(), prev = R.usar(b); dibuja(); R.usar(prev); FIJO[clave] = b; } R.copiar(FIJO[clave]); };
// zonas tranquilas: la de Atom y la barra del año
const tranquila = (x, y) => (x > 262 && y < 54) || (x > 14 && x < 176 && y < 18);
// nube de tres tonos (sombra, cuerpo, luz)
const nube = (cx, cy, w, c3) => { const b = [[0, 0, .32], [-.32, .07, .23], [.31, .06, .25], [-.12, -.12, .25], [.15, -.09, .22], [.5, .12, .14], [-.5, .12, .13]];
  for (const [dx, dy, r] of b) R.disco(Math.round(cx + dx * w), Math.round(cy + dy * w + 2), Math.round(r * w), c3[0]);
  for (const [dx, dy, r] of b) R.disco(Math.round(cx + dx * w), Math.round(cy + dy * w), Math.round(r * w), c3[1]);
  for (const [dx, dy, r] of b) if (dy <= 0.07) R.disco(Math.round(cx + dx * w - 1), Math.round(cy + dy * w - 2), Math.round(r * w * .7), c3[2]); };
// gaviotas en vuelo (una «v» que aletea); no entran en las zonas tranquilas
const aves = (t, lista, c) => { for (const [x0, y0, v, k] of lista) { const x = Math.round(((x0 + t * v) % 360 + 360) % 360 - 20), y = Math.round(y0 + 3 * Math.sin(t * 0.7 + k)); if (tranquila(x, y) || tranquila(x + 2, y - 2)) continue; const a = Math.sin(t * 8 + k) > 0;
  R.pset(x, y, c); R.pset(x - 1, y - (a ? 1 : 0), c); R.pset(x + 1, y - (a ? 1 : 0), c); R.pset(x - 2, y - (a ? 2 : 0), c); R.pset(x + 2, y - (a ? 2 : 0), c); } };
// barca de remos de perfil: x = popa, yW = línea del agua, L largo, H alto de la borda; d = 1 la proa a la derecha.
// mar: color del agua (para la obra viva). Devuelve la borda en el centro.
const barca = (x, yW, L, Hb, d, mar, o = {}) => {
  const X = (u) => Math.round(d > 0 ? x + u : x + L - u), KK = H('#2a1c14'), M = H(o.casco ?? '#8a5a34'), ML = H(o.cascoL ?? '#b07c4c'), MS = H(o.cascoS ?? '#5e3a20'), BO = H(o.borda ?? '#c89a64');
  const top = (u) => yW - Hb - Math.round(Hb * 0.32 * ((2 * u / L - 1) ** 2)) - (u > L * 0.85 ? Math.round((u - L * 0.85) / (L * 0.15) * Hb * 0.2) : 0);
  const bot = (u) => { const b = yW + Math.max(1, Math.round(Hb * 0.18)), r = Hb * 0.7; return u > L - r ? Math.round(top(u) + (b - top(u)) * Math.max(0, (L - u) / r)) : u < Hb * 0.25 ? Math.round(top(u) + (b - top(u)) * Math.max(0.6, u / (Hb * 0.25))) : b; };
  for (let u = 0; u <= L; u++) { const y0 = top(u), y1 = bot(u), xx = X(u);
    for (let y = y0; y <= y1; y++) { const j = (y - y0) / Math.max(1, yW - y0); let c = y === y0 || y === y1 || u === 0 || u === L ? KK : y <= y0 + Math.max(1, Math.round(Hb * 0.12)) ? BO : (Math.round(j * 3 * 10) % 10 === 0 && j > 0.2) ? MS : j < 0.45 ? ML : M;
      if (c !== KK && hh(u, y, 9) < 0.08) c = MS; if (y > yW && c !== KK && mar != null) c = mez(c, mar, 0.55); R.pset(xx, y, c); } }
  return top(L / 2);
};
// un remo de perfil que bate (f fase): el pivote en la borda y la pala que entra en el agua
const remo = (px, py, yW, largo, f, d, c = '#c8a070') => { const bx = Math.round(px - d * (largo * 0.25) + d * largo * 0.55 * Math.cos(f)), by = Math.round(yW + 1 + 3 * Math.sin(f)), hx = Math.round(px + (px - bx) * 0.4), hy = Math.round(py - 3 - (by - py) * 0.25);
  R.linea(hx, hy, bx, by, H('#3a2818')); R.linea(hx, hy - 1, bx, by - 1, H(c)); R.disco(bx, by, 2, H('#7a5430')); R.pset(bx - 1, by - 1, H(c));
  return { bx, by, hx, hy, dentro: Math.sin(f) > 0 }; };
// placa con un número (para que se lea sobre un fondo con detalle)
const placa = (txt, cx, cy, borde = '#e8c060') => { const w = txt.length * 4 + 3; R.rect(cx - w - 1, cy - 6, cx + w + 1, cy + 5, K); R.rect(cx - w, cy - 5, cx + w, cy + 4, H('#2a2026')); R.rect(cx - w, cy - 5, cx + w, cy - 5, H(borde)); R.numero(txt, cx, cy + 3, { centro: true }); };

const r = (f) => en('roble', f), m = (f) => en('mar', f), q = (f) => en('quiza', f);
const P2 = r(0.3516), P3 = m(-0.0990), P4 = m(0.5293), P5 = q(0.0281);
const OAK = r(0.095), LEG = r(0.1425), KNOWS = r(0.2785), WHERE = r(0.3571), Y1795 = r(0.4502), HOLE = r(0.578), ANY = r(0.6474), DOZ = r(0.746), OUT = r(0.9597);
const IN = m(0.1552), OUTM = m(0.2512), TWICE = m(0.3443), TEEN = m(0.7241), ROW = m(0.8512), IT = m(0.9557);
const GOLD = q(0.0779), OR = q(0.2741), HOLEQ = q(0.4402), NAT = q(0.5126), OPEN = q(0.567), CUR = q(0.7088), CLOSE = q(0.9081);
const D0 = LEG - 0.05, D1 = LEG + 1.0;   // el fundido de 1795 a 1909

// ── 1 · el claro desde lo alto: del roble de la leyenda no queda nada ──────────────────────────────────────────────
// Cámara alta en 3/4 (el claro entero, el bosque arriba, sin cielo). Luz de la tarde desde la izquierda: sombras largas a

const OX = 126, OY = 112, HX = 190, HY = 126;
const VERDE = ['#1a2c1a', '#243e22', '#32542a', '#446e32', '#5e8a3a', '#84a84a'].map(H);
const VERDEL = ['#1c281c', '#263826', '#32462c', '#405834', '#526a3a', '#687e44'].map(H);   // el bosque del fondo, más apagado
const GRAMA = ['#2e4a20', '#3c5e26', '#4e742e', '#648a36', '#7e9e40', '#9cb252'].map(H), TIER = ['#3a2a1c', '#4e3a26', '#664c32', '#806040', '#9a7a52'].map(H);
const BARRO = ['#2e2018', '#3e2c20', '#523a28', '#664a32', '#7c5c3e', '#94724c'].map(H);
const cl01 = (v) => Math.max(0, Math.min(1, v));
// copa vista desde arriba: luz arriba a la izquierda, sombra abajo a la derecha, racimos de hojas en el borde
const copa1 = (cx, cy, rx, ry, k, pal = VERDE) => {
  for (let y = Math.floor(cy - ry * 1.1 - 1); y <= cy + ry * 1.1 + 1; y++) for (let x = Math.floor(cx - rx * 1.1 - 1); x <= cx + rx * 1.1 + 1; x++) {
    if (x < 0 || x > 319 || y < 0 || y > 179) continue;
    const dx = (x - cx) / rx, dy = (y - cy) / ry, d = dx * dx + dy * dy;
    if (d > 0.8 + vn(x / 3, y / 3, k) * 0.38) continue;
    let v = 0.56 - dx * 0.22 - dy * 0.3 + (vn(x / 4, y / 4, k + 1) - 0.5) * 0.75 + (hh(x, y, k) - 0.5) * 0.14 - d * 0.12;
    if (tranquila(x, y)) v = 0.3 + (v - 0.3) * 0.3;
    R.pset(x, y, rampa(pal, cl01(v), x, y)); } };
// sombra tramada sobre lo ya pintado
const sombraE = (cx, cy, rx, ry, a = 0.5) => { for (let y = Math.floor(cy - ry); y <= cy + ry; y++) for (let x = Math.floor(cx - rx); x <= cx + rx; x++) { if (x < 0 || x > 319 || y < 0 || y > 179) continue;
  const d = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2; if (d < 1 && by4(x, y) < 0.9 - d * 0.5) R.pset(x, y, mez(R.pget(x, y), H('#0e140c'), a)); } };
// tronco en 3/4: corteza con grietas, luz a la izquierda, raíces en el pie
const tronco1 = (x, y0, y1, w) => { for (let y = y0; y <= y1; y++) for (let i = -w; i <= w; i++) { const u = (i + w) / (2 * w); let c = rampa([H('#6a4a30'), H('#4e3624'), H('#3a2618'), H('#2a1a10')], cl01(u * 0.9 + hh(x + i, y >> 1, 3) * 0.1), x + i, y);
    if ((x + i) % 3 === 0 && hh(x + i, y >> 2, 4) < 0.6) c = H('#22160e'); if (i === -w + 1 && hh(x, y, 5) < 0.5) c = H('#8a6a44'); R.pset(x + i, y, c); }
  for (const s of [-1, 1]) { R.linea(x + s * w, y1, x + s * (w + 4), y1 + 2, H('#2a1a10')); R.linea(x + s * w, y1 - 1, x + s * (w + 3), y1 + 1, H('#5a3e2a')); } };
const dSeg = (x, y, P) => { let m = 1e9; for (let i = 0; i + 1 < P.length; i++) { const [ax, ay] = P[i], [bx, by] = P[i + 1], vx = bx - ax, vy = by - ay, u = Math.max(0, Math.min(1, ((x - ax) * vx + (y - ay) * vy) / (vx * vx + vy * vy))); m = Math.min(m, Math.hypot(x - ax - vx * u, y - ay - vy * u)); } return m; };
// el bosque: una fila lejana arriba y árboles por los lados (con su tronco corto y su sombra)
const bosque1 = (fila2, lados) => {
  for (let k = 0; k < 36; k++) copa1(-8 + k * 9.5 + hh(k, 1, 40) * 5, 1 + hh(k, 2, 40) * 9, 8 + hh(k, 3, 40) * 5, 7 + hh(k, 4, 40) * 3, 41 + k, VERDEL);
  for (let k = 0; k < fila2; k++) { const cx = k * (330 / fila2) + hh(k, 1, 42) * 8, cy = 17 + hh(k, 2, 42) * 9, rx = 9 + hh(k, 3, 42) * 5, ry = 7 + hh(k, 4, 42) * 3; sombraE(cx + 6, cy + ry + 2, rx, 3.5, 0.4); copa1(cx, cy, rx, ry, 80 + k); }
  for (const [x, y, rr] of lados) { sombraE(x + 9, y + rr + 3, rr * 1.1, 4, 0.45); tronco1(x, y + Math.round(rr * 0.6), y + Math.round(rr * 0.6) + 5, 2); copa1(x, y, rr, rr * 0.8, 120 + x); } };
const LADOS95 = [[6, 46, 13], [16, 78, 11], [4, 108, 12], [300, 66, 12], [312, 96, 11], [296, 124, 10]];
const claro1795 = () => {
  const senda = [[-4, 172], [60, 160], [120, 150], [170, 140], [HX - 8, HY + 5]];
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) {
    let c = rampa(GRAMA, cl01(0.52 + (vn(x / 9, y / 6, 31) - 0.5) * 0.55 + (hh(x, y, 31) - 0.5) * 0.22 - Math.max(0, 44 - y) * 0.008), x, y);
    if (dSeg(x, y, senda) < 2.2 + vn(x / 5, y / 5, 32) * 3) c = rampa(TIER, cl01(0.5 + (vn(x / 3, y / 3, 33) - 0.5) * 0.6), x, y);
    const e = ((x - HX) / 17) ** 2 + ((y - HY) / 7) ** 2 + (vn(x / 3, y / 3, 34) - 0.5) * 0.25;
    if (e < 1) c = rampa(TIER, cl01(0.08 + e * 0.55 + (x - HX) / 17 * 0.22 + hh(x, y, 35) * 0.12), x, y);   // la hondonada: la tierra se hunde
    else if (e < 1.35 && by4(x, y) < 0.5) c = GRAMA[1];
    R.pset(x, y, mez(c, H('#f0a050'), 0.06 + Math.max(0, 200 - x) * 0.0005 + Math.max(0, y - 100) * 0.0004)); }
  // matas, flores y piedras
  for (let k = 0; k < 520; k++) { const x = Math.round(hh(k, 1, 36) * 320), y = Math.round(36 + hh(k, 2, 36) * 144); if (tranquila(x, y) || Math.abs(x - HX) < 20 && Math.abs(y - HY) < 9) continue;
    const c = hh(k, 3, 36); if (c < 0.7) { R.pset(x, y, GRAMA[5]); R.pset(x - 1, y - 1, GRAMA[4]); R.pset(x + 1, y - 1, GRAMA[3]); R.pset(x, y + 1, GRAMA[0]); }

  for (const [x, y] of [[150, 160], [58, 116], [262, 132], [204, 160], [116, 44]]) for (let k = -3; k <= 3; k++) { R.linea(x, y, x + k * 2, y - 4 + Math.abs(k), GRAMA[k < 0 ? 4 : 2]); R.pset(x + k * 2, y - 4 + Math.abs(k), GRAMA[5]); }
  sombraE(238, 84, 18, 2.5, 0.45); for (let i = 0; i < 26; i++) { const x = 220 + i, y = 80 + Math.round(i * 0.12); R.pset(x, y - 2, H('#8a6a44')); R.pset(x, y - 1, H('#6a4a30')); R.pset(x, y, H('#4a3220')); R.pset(x, y + 1, H('#2a1a10')); if (i % 5 === 2) R.pset(x, y - 1, H('#3a2818')); }
  R.disco(219, 80, 2, H('#c8a878')); R.pset(219, 80, H('#8a6a44')); R.pset(230, 79, H('#e8d8b0')); R.pset(231, 78, H('#c86a3a')); R.pset(237, 80, H('#e8d8b0'));
  // el roble: su sombra larga, el tronco, la rama de la polea y la copa

  tronco1(OX, 82, OY, 6);
  for (let i = 0; i < 3; i++) { R.linea(OX + 8, 76 + i, 186, 84 + i, i === 0 ? H('#7a5a3a') : i === 1 ? H('#4e3624') : H('#2a1a10')); }
  copa1(OX - 2, 56, 46, 29, 51);
  copa1(184, 78, 9, 6, 52);
  // el refugio de ramas, abajo a la izquierda, con su manta, y el fuego con su cerco de piedras
  sombraE(52, 152, 22, 4, 0.5);
  R.poligono([[26, 134], [60, 130], [66, 148], [30, 152]], H('#4a3422'));
  for (let i = 0; i < 40; i++) { const a = i / 40, x0 = Math.round(lerp(26, 60, a)), y0 = Math.round(lerp(134, 130, a)); R.linea(x0, y0, x0 + 5, y0 + 18, i % 3 === 0 ? H('#2a1c12') : i % 3 === 1 ? H('#7a5a3a') : H('#5e4228')); if (hh(i, 1, 37) < 0.5) { R.pset(x0 + 2, y0 + 6, GRAMA[3]); R.pset(x0 + 3, y0 + 7, GRAMA[2]); R.pset(x0 + 1, y0 + 11, H('#9a8a3a')); } }
  R.linea(25, 133, 61, 129, H('#8a6a44')); R.rect(31, 151, 64, 153, H('#140e0a')); R.rect(40, 151, 52, 152, H('#8a3a2a')); R.pset(41, 151, H('#c85a3a'));
  for (let k = 0; k < 9; k++) { const a = k / 9 * 6.28; R.disco(Math.round(84 + Math.cos(a) * 6), Math.round(160 + Math.sin(a) * 3), 1, H('#6a6a66')); R.pset(Math.round(84 + Math.cos(a) * 6) - 1, Math.round(160 + Math.sin(a) * 3) - 1, H('#a8a8a0')); }
  R.rect(80, 159, 88, 161, H('#1a1210')); R.linea(80, 162, 89, 158, H('#6a4a2a')); R.linea(81, 158, 88, 162, H('#5a3e22'));
  R.linea(66, 166, 76, 164, H('#3a2818')); R.linea(66, 165, 76, 163, H('#8a6a44'));   // un tronco para sentarse

  R.linea(212, 122, 220, 134, H('#6a4a2a')); R.rect(219, 133, 222, 136, H('#8a8a96')); R.pset(219, 133, H('#c8c8d0'));
  R.linea(206, 136, 214, 134, H('#6a4a2a')); R.linea(203, 133, 207, 139, H('#5a5a66')); R.pset(203, 133, H('#a8a8b0'));
