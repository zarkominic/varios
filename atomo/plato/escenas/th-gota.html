<html lang="es">

<meta charset="utf-8">

<title>Lo que cabe en una gota · ep11</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// TH-GOTA (frases 14–15). Seis planos: el brazo con la goma y la aguja; los tubos que se llenan y la cucharadita al lado;
// en el laboratorio, la cinta lleva los tubos a las máquinas, que cuentan azúcar, colesterol, hierro y hormonas (iconos
// que saltan de los analizadores); la máquina que cuenta moléculas de colores; la molécula rara que casi no se ve; y el
// gag del pajar: un granjero diminuto busca la aguja con una lupa enorme.
import * as T from '/atomo/plato/escenas/th-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('th-gota');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const a = (f) => en('tubos', f), b = (f) => en('moleculas', f);
const P2 = a(0.38), P3 = a(0.7), P4 = b(0), P5 = b(0.33), P6 = b(0.72);
const p1 = (t) => { T.insertoTubos(R, t, { tubos: 0 }); T.guante(R, 240, 96, -1); };
const p2 = (t) => T.insertoTubos(R, t, { tubos: tramo(t, P2 + 0.2, a(0.62)) * 3, cuchara: t > a(0.64) });
const p3 = (t) => { T.laboratorio(R, t); R.actor(EL.tecnica, 150, 164, t, { dir: 1, quieto: true }); R.actor(EL.tecnico, 100, 162, t, { dir: 1, anda: true });
  const iconos = [['gota', T.C.sangre], ['pila', T.C.amarilloT], ['corona', T.C.oro], ['luna', T.C.tealT]]; iconos.forEach(([n, c], k) => { const u = tramo(t, a(0.82) + k * 0.6, a(0.82) + k * 0.6 + 1); if (u <= 0) return; const x = 210 + (k % 2) * 60, y = Math.round(lerp(40, 22, u)); R.rect(x - 6, y - 6, x + 8, y + 8, T.C.k); R.rect(x - 5, y - 5, x + 7, y + 7, T.C.blanco); R.icono(n, x - 2, y - 2, c, T.C.k); }); };
const p4 = (t) => T.insertoMoleculas(R, t, {});
const p5 = (t) => T.insertoMoleculas(R, t, { rara: true });
const p6 = (t) => { T.pajar(R, t); const u = (t - P6) * 0.25 % 2, x = Math.round(u < 1 ? lerp(80, 220, u) : lerp(220, 80, u - 1)); R.actor(EL.brazel ?? EL.senor30, x, 168, t, { dir: u < 1 ? 1 : -1, anda: true }); T.lupa(R, x + (u < 1 ? 22 : -8), 150, 7); };
const efectos = [[P2 + 0.3, 'gluglu'], [a(0.64), 'golpecito'], [P3 + 0.3, 'zumbido'], [a(0.82), 'bip'], [a(0.88), 'bip'], [P4 + 0.2, 'burbujas'], [b(0.92), 'brillo']];
T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3], [P4, p4], [P5, p5], [P6, p6]], { efectos, año: 2014 });
</script>
</body>
