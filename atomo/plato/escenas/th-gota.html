<canvas id="lienzo"></canvas>
<script type="module">
// TH-GOTA (frases 14–15). Siete planos, todos con acción y vida de fondo:
// 1. la farmacia: la puerta automática se abre y entra un señor que se sienta en el sillón de extracción; la enfermera,
//    que ordenaba su carrito, le saluda, le pone la goma en el brazo y le pincha la vena (a «Theranos»): él se sorprende,
//    mira para otro lado y el tubito se llena; detrás del mostrador la farmacéutica coge una caja y se la da en una bolsa
//    a una clienta; delante, una señora con su cesta se para a mirar y se va hacia la puerta;
// 2. el inserto de los tubos: la mano de la enfermera trae el primer tubo; a «drop» cae una sola gota dentro; a «blood
//    drawn» el tubo se llena, y a «one or more tubes» se llenan el segundo y el tercero, con la mano que los sostiene y se
//    va; detrás pasan, desenfocados, dos clientes; el reloj de la pared corre;
// 3. la mesa de la cocina: una mano baja y da un golpecito en el tapón de cada tubo («milliliters», «each»): bajo cada
//    uno sale un «5»; luego señala la cucharadita («teaspoon»): «≈ 5»; el gato de la ventana mueve la cola, pasa una nube
//    y un pájaro, y la taza humea;
// 4. el laboratorio: el mensajero llega con la nevera («travels to a lab») y se la da a la técnica, que la lleva a la
//    cinta y pone los tubos, que entran en el analizador; el técnico pulsa su tableta («machines count») y de las
//    máquinas saltan los resultados: el azúcar (un terrón), el colesterol (una gotita amarilla), el hierro (un imán) y las
//    hormonas (una molécula), cada uno cuando la voz lo dice; el técnico los apunta; al fondo, un ayudante saca una
//    gradilla de la nevera y se la lleva;
// 5. el banco, de cerca: la pipeta toma plasma del tubo centrifugado y deja una porción en cada uno de los cuatro
//    pocillos, uno por prueba («its own portion»), con su icono encima; la bandeja entra en la máquina («the machine»),
//    que parpadea; detrás pasa un compañero desenfocado y corre el reloj;
// 6. la máquina por dentro: la mira del detector caza, una a una, las moléculas que busca y el contador sube («enough
//    molecules»); a «accurately» sale el visto bueno; a «some of those molecules» pasa una molécula dorada, rarísima, la
//    mira llega tarde y sale una «?»;
// 7. el gag del pajar: un granjero diminuto llega con una lupa enorme, busca paso a paso al pie del montón de heno (la
//    lupa enseña las pajas de cerca) y a «needle» la aguja brilla en la lente: salta y la levanta; una oveja mastica heno
//    y dos gallinas picotean.
import * as T from '/atomo/plato/escenas/th-comun.js';
import { manoBaja } from '/atomo/plato/escenas/ov-comun.js';
import { cordero, gallina } from '/atomo/plato/escenas/ag-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('th-gota');
const { tramo, lerp, hex } = R;
const C = T.C;
const en = (k, f) => T.momento(M, k, f);
const a = (f) => en('tubos', f), b = (f) => en('moleculas', f);
const P2 = a(0.2), P3 = a(0.48), P4 = a(0.72), P5 = b(0), P6 = b(0.33), P7 = b(0.72);
// lo que dice la voz inglesa, por la fracción de letras de cada frase
const teranos = a(0.14), gota = a(0.27), saca = a(0.33), vena = a(0.39), tubos = a(0.47), ml = a(0.52), cada = a(0.56), cuchara = a(0.65);
const lab = a(0.76), cuentan = a(0.82), analitos = [a(0.89), a(0.91), a(0.95), a(0.97)];
const pruebas = b(0.05), porcion = b(0.13), muestra = b(0.19), maquina = b(0.26), bastantes = b(0.34), bien = b(0.57), algunas = b(0.63);
const encontrar = b(0.79), aguja = b(0.92);
const lin = (t, a0, a1) => Math.max(0, Math.min(1, (t - a0) / (a1 - a0)));
const parpadeo = (t, v = 6) => Math.sin(t * v) > 0;

// ── piezas locales ──────────────────────────────────────────────────────────────────────────────────────────────
// lo que va detrás de una pieza del decorado: guarda esos rectángulos, dibuja y los repone encima
const detras = (rects, dibuja) => {
  const g = rects.map(([x0, y0, x1, y1]) => { const v = []; for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) v.push(R.pget(x, y)); return v; });
  dibuja();
  rects.forEach(([x0, y0, x1, y1], k) => { let i = 0; for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) R.pset(x, y, g[k][i++]); });
};
// los colores de un trozo de pared vacía (para dibujar luego solo sobre la pared: alFondo)
const fondoDe = (x0, y0, x1, y1) => { const s = new Set(); for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) s.add(R.pget(x, y)); return s; };
// (lo que se salga de la zona tampoco queda)
const alFondo = (fondo, x0, y0, x1, y1, dibuja) => {
  const v = new Array(320 * 180); for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) v[y * 320 + x] = R.pget(x, y);
  dibuja();
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) { const o = v[y * 320 + x]; if ((x < x0 || x > x1 || y < y0 || y > y1 || !fondo.has(o)) && R.pget(x, y) !== o) R.pset(x, y, o); }
};
// alguien que pasa por detrás, desenfocado (tramado): cabeza y hombros hasta el borde de abajo de la zona
const desenfocado = (x, y0, y1, col) => {
  for (let y = y0; y <= y1; y++) for (let xx = x - 16; xx <= x + 16; xx++) {
    if ((xx + y) % 2) continue; const cab = Math.hypot(xx - x, y - (y0 + 10)) < 10, cuerpo = y > y0 + 21 && Math.abs(xx - x) < 15 - Math.max(0, y0 + 27 - y);
    if (cab || cuerpo) R.pset(xx, y, col);
  }
};
// la mano canónica con la manga hasta el borde del plano (dir −1: entra por la derecha)
const brazo = (x, y, dir, manga) => {
  T.mano(R, x, y, dir, manga); const m = hex(manga), [x0, x1] = dir < 0 ? [x + 43, 319] : [0, x - 43];
  if (x1 >= x0) { R.rect(x0, y - 2, x1, y + 2, m); R.rect(x0, y - 3, x1, y - 3, C.k); R.rect(x0, y + 3, x1, y + 3, C.k); }
};
// dónde lleva algo un personaje en la mano que cuelga (x, suelo, dir)
const enMano = (x, suelo, dir) => [dir > 0 ? x + 11 : x - 5, suelo - 9];
// el reloj de pared, con el segundero que salta cada segundo
const reloj = (cx, cy, r, t) => {
  R.disco(cx, cy, r + 1, C.k); R.disco(cx, cy, r, C.blanco); for (let k = 0; k < 12; k++) { const an = k / 12 * Math.PI * 2; R.pset(Math.round(cx + Math.cos(an) * (r - 1)), Math.round(cy + Math.sin(an) * (r - 1)), C.grisL); }
  R.linea(cx, cy, cx - 3, cy - 2, C.k); R.linea(cx, cy, cx + 1, cy - r + 3, C.k); const s = Math.floor(t) / 60 * Math.PI * 2 - Math.PI / 2;
  R.linea(cx, cy, Math.round(cx + Math.cos(s) * (r - 2)), Math.round(cy + Math.sin(s) * (r - 2)), C.rojoW); R.pset(cx, cy, C.k);
};
// la cesta roja de la compra, con algún bote dentro (n)
const cesta = (x, y, n = 1) => {
  for (let k = 0; k < n; k++) { R.rect(x + 2 + k * 2, y - 3, x + 3 + k * 2, y, C.k); R.pset(x + 2 + k * 2, y - 2, [hex('#4a8ae8'), hex('#f0c040'), hex('#5ab85a')][k % 3]); }
  R.rect(x + 1, y - 3, x + 1, y, C.k); R.rect(x + 7, y - 3, x + 7, y, C.k); R.rect(x + 1, y - 3, x + 7, y - 3, C.k);
  R.rect(x, y, x + 8, y + 5, C.k); R.rect(x + 1, y + 1, x + 7, y + 4, C.rojoW); R.rect(x + 1, y + 3, x + 7, y + 3, hex('#a81e2c'));
};
// la nevera de transporte: blanca con la tapa azul y la cruz roja
const nevera = (x, y) => {
  R.rect(x, y, x + 12, y + 9, C.k); R.rect(x + 1, y + 1, x + 11, y + 8, C.blanco); R.rect(x + 1, y + 5, x + 11, y + 5, hex('#d8dce4'));
  R.rect(x + 5, y + 3, x + 7, y + 3, C.rojoW); R.rect(x + 6, y + 2, x + 6, y + 4, C.rojoW); R.rect(x - 1, y - 2, x + 13, y, C.k); R.rect(x, y - 1, x + 12, y - 1, hex('#3a6ac8')); R.rect(x + 4, y - 4, x + 8, y - 2, C.k);
};
// destello de cuatro puntas
const destello = (x, y, r = 3, col = C.blanco) => { R.pset(x, y, col); for (let i = 1; i <= r; i++) { R.pset(x + i, y, col); R.pset(x - i, y, col); R.pset(x, y + i, col); R.pset(x, y - i, col); } };
// los iconos de las cuatro pruebas (9 × 9, sin letras): el terrón de azúcar, la gotita de colesterol, el imán del hierro
// y la molécula de las hormonas; con marco blanco (x, y: centro)
const COL_PRUEBA = [hex('#e8eef8'), C.amarilloT, C.rojoW, hex('#8a5ad8')];
const iconoPrueba = (k, x, y, marco = true) => {
  if (marco) { R.rect(x - 7, y - 7, x + 7, y + 7, C.k); R.rect(x - 6, y - 6, x + 6, y + 6, C.blanco); R.rect(x - 6, y + 5, x + 6, y + 6, COL_PRUEBA[k]); }
  if (k === 0) { R.rect(x - 4, y - 3, x + 3, y + 4, C.k); R.rect(x - 3, y - 2, x + 2, y + 3, hex('#f8f8fc')); R.rect(x - 3, y - 2, x + 2, y - 1, hex('#ffffff')); R.rect(x + 1, y - 1, x + 2, y + 3, hex('#c8ccd8')); R.pset(x - 2, y + 1, hex('#dce0ea')); R.pset(x, y + 2, hex('#dce0ea')); }
  else if (k === 1) { R.disco(x, y + 1, 3, C.k); R.disco(x, y + 1, 2, C.amarilloT); R.pset(x, y - 3, C.k); R.pset(x, y - 2, C.amarilloT); R.pset(x - 1, y - 1, C.k); R.pset(x + 1, y - 1, C.k); R.pset(x - 1, y, hex('#fff4c0')); }
  else if (k === 2) { R.rect(x - 4, y - 3, x - 2, y + 3, C.k); R.rect(x + 2, y - 3, x + 4, y + 3, C.k); R.rect(x - 4, y + 2, x + 4, y + 4, C.k); R.rect(x - 3, y - 2, x - 3, y + 2, C.rojoW); R.rect(x + 3, y - 2, x + 3, y + 2, C.rojoW); R.rect(x - 3, y + 3, x + 3, y + 3, C.rojoW); R.pset(x - 3, y - 3, C.metalL); R.pset(x + 3, y - 3, C.metalL); }
  else { const P = [[0, -4], [3, -2], [3, 2], [0, 4], [-3, 2], [-3, -2]]; for (let i = 0; i < 6; i++) { const [x0, y0] = P[i], [x1, y1] = P[(i + 1) % 6]; R.linea(x + x0, y + y0, x + x1, y + y1, hex('#8a5ad8')); R.disco(x + x0, y + y0, 1, hex('#5a3a9a')); } R.pset(x, y, hex('#c8a8f0')); }
};

// ── 1 · la extracción de siempre, en la farmacia ─────────────────────────────────────────────────────────────────
const respaldo = (x, suelo) => { R.rect(x, suelo - 40, x + 7, suelo - 8, C.k); R.rect(x + 1, suelo - 39, x + 6, suelo - 9, C.tealT); R.rect(x + 1, suelo - 39, x + 2, suelo - 9, C.tealTS); R.rect(x + 3, suelo - 8, x + 5, suelo, C.metalD); };
// el carrito de la enfermera: bandeja con los tubos de tapón de color (quedan), la goma azul y la caja de gasas
const carrito = (x, suelo, quedan, goma) => {
  const y = suelo - 20;
  R.rect(x + 2, y + 2, x + 3, suelo - 3, C.metalD); R.rect(x + 19, y + 2, x + 20, suelo - 3, C.metalD); R.rect(x + 2, suelo - 10, x + 20, suelo - 9, C.metalD);
  R.rect(x + 6, suelo - 15, x + 16, suelo - 11, C.k); R.rect(x + 7, suelo - 14, x + 15, suelo - 12, C.blanco); R.rect(x + 10, suelo - 14, x + 12, suelo - 12, C.tealT);
  for (const dx of [3, 19]) { R.disco(x + dx, suelo - 1, 2, C.k); R.pset(x + dx, suelo - 1, C.metal); }
  R.rect(x, y, x + 22, y + 2, C.k); R.rect(x + 1, y, x + 21, y + 1, C.metalL);
  for (let k = 0; k < quedan; k++) { const tx = x + 3 + k * 4; R.rect(tx, y - 8, tx + 2, y - 1, C.k); R.pset(tx + 1, y - 7, C.blanco); R.rect(tx + 1, y - 6, tx + 1, y - 2, hex('#f4f8fc')); R.rect(tx, y - 10, tx + 2, y - 8, [C.rojoW, C.tealT, hex('#8a5ad8')][k]); }
  if (goma) { R.rect(x + 15, y - 3, x + 20, y - 1, C.k); R.rect(x + 16, y - 2, x + 19, y - 2, hex('#3a6ac8')); }
};
const p1 = (t) => {
  T.farmacia(R, t, { rincon: false, puerta: tramo(t, 0.1, 0.5) - tramo(t, 1.7, 2.1) });
  // detrás del mostrador: la farmacéutica cobra, se gira a por una caja del estante y se la da a la clienta en una bolsa
  const ida = tramo(t, 1.0, 1.7), vuelta = tramo(t, 2.4, 3.1), fx = lerp(158, 126, ida - vuelta), fanda = (ida > 0 && ida < 1) || (vuelta > 0 && vuelta < 1);
  detras([[110, 74, 214, 92], [139, 64, 149, 77], [175, 64, 185, 77]], () => R.actor(EL.tecnica, Math.round(fx), 82, t, { dir: t < 1.0 || t > 2.4 ? 1 : -1, anda: fanda, habla: t < 0.9 && parpadeo(t, 7), dedo: t > 1.75 && t < 2.3, sonrisa: t > 3.3 }));
  if (t > 1.9 && t < 3.3) { const hx = Math.round(fx) + (t < 2.4 ? -4 : 13); R.rect(hx, 61, hx + 5, 65, C.k); R.rect(hx + 1, 62, hx + 4, 64, hex('#a8c8e8')); }
  const bolsa = tramo(t, 3.3, 3.8); if (t > 3.3) { const bx = Math.round(lerp(172, 176, bolsa)), by = Math.round(lerp(64, 85, bolsa) - Math.sin(bolsa * Math.PI) * 6); R.rect(bx, by, bx + 6, by + 7, C.k); R.rect(bx + 1, by + 1, bx + 5, by + 6, C.blanco); R.rect(bx + 1, by + 1, bx + 5, by + 1, C.rojoW); }
  detras([[90, 92, 230, 140]], () => R.actor(EL.chica, 186, 102, t, { dir: -1, habla: t > 0.3 && t < 0.9 && !parpadeo(t, 7), sonrisa: t > 3.6, dedo: t > 3.9 && t < 4.5 }));
  // el sillón de extracción (el respaldo; el brazo y el asiento van por delante de quien se sienta)
  respaldo(150, 140);
  // el señor entra por la puerta, cruza la tienda y se sienta
  const w = tramo(t, 0.2, 2.7), z = tramo(t, 2.7, 3.0), sentado = z > 0.5;
  const px = Math.round(z > 0 ? lerp(140, 150, z) : lerp(-16, 140, w)), py = Math.round(z > 0 ? lerp(150, 134, z) : lerp(140, 150, w));
  const pincha = teranos + 0.05, aparta = pincha + 0.4;
  const señor = () => R.actor(EL.senor30, px, py, t, { dir: t > aparta && t < P2 - 0.2 ? -1 : 1, anda: w > 0 && w < 1 && z === 0, sonrisa: (t > 3.0 && t < 3.5) || t > P2 - 0.2, habla: t > 3.1 && t < 3.5 && parpadeo(t, 8), sorpresa: t > pincha && t < aparta });
  if (sentado) { señor(); T.sillonDelante(R, 150, 140); } else { T.sillonDelante(R, 150, 140); señor(); }
  // su brazo, apoyado: la goma («tourniquet») a 3,5 s, la aguja y el tubito que se llena
  const goma = t > 3.55, aguja = t > pincha, lleno = lin(t, pincha + 0.2, P2 - 0.1);
  if (sentado) {
    R.rect(161, 117, 167, 124, C.k); R.rect(162, 118, 166, 123, hex('#6a4a3a'));
    R.rect(166, 112, 184, 117, C.k); R.rect(167, 113, 170, 116, hex('#6a4a3a')); R.rect(171, 113, 183, 116, hex('#f6c290')); R.rect(171, 116, 183, 116, hex('#d48a5a'));
    R.disco(186, 114, 3, C.k); R.disco(186, 114, 2, hex('#f6c290')); R.pset(187, 115, hex('#d48a5a'));
    if (goma) { R.rect(172, 111, 174, 118, C.k); R.rect(173, 112, 173, 117, hex('#3a6ac8')); R.pset(174, 110, hex('#3a6ac8')); R.pset(175, 109, hex('#3a6ac8')); }
    if (aguja) { R.rect(178, 112, 180, 112, C.metalL); R.rect(176, 111, 177, 113, C.k); T.tubito(R, 177, 110, 1, lleno, C.rojoW); }
  }
  // la enfermera ordena el carrito; se gira, saluda, pone la goma, coge la aguja y pincha
  const deCara = t > 2.6;
  R.actor(EL.enfermera, 196, 145, t, { dir: deCara ? -1 : 1, dedo: (!deCara && Math.sin(t * 5) > 0.3) || (t > 3.25 && t < 3.6) || (t > pincha - 0.35 && t < pincha + 0.1), habla: t > 2.7 && t < 3.2 && parpadeo(t, 7), sonrisa: t > pincha + 0.5 });
  carrito(214, 146, t > pincha - 0.4 ? 2 : 3, t < 3.3);
  if (t > 3.25 && t < 3.55) { R.rect(188, 118, 193, 119, hex('#3a6ac8')); }   // la goma, en su mano
  // delante: una señora con su cesta se para a mirar y sigue hacia la puerta
  const s = tramo(t, 0.9, 3.0), s2 = tramo(t, pincha + 0.6, P2 + 0.6), sx = Math.round(s2 > 0 ? lerp(112, -24, s2) : lerp(336, 112, s)), sdir = s2 > 0 || s < 1 ? -1 : 1;
  R.actor(EL.senora30, sx, 174, t, { dir: sdir, anda: (s > 0 && s < 1) || (s2 > 0 && s2 < 1), sorpresa: t > pincha && t < pincha + 0.5, sonrisa: t > 3.1 && t < pincha });
  { const [cx, cy] = enMano(sx, 174, sdir); cesta(cx, cy, 2); }
};

// ── 2 · los tubos de vena se llenan ──────────────────────────────────────────────────────────────────────────────
const nTubos = (t) => tramo(t, saca, vena + 0.1) + tramo(t, vena + 0.25, tubos - 0.75) + tramo(t, tubos - 0.7, tubos);
const p2 = (t) => {
  const n = nTubos(t);
  T.insertoTubos(R, t, { tubos: n });
  const pared = fondoDe(100, 0, 175, 12);
  // dos clientes desenfocados pasan por detrás, por la pared
  alFondo(pared, 0, 0, 319, 129, () => { desenfocado(Math.round(lerp(-30, 350, lin(t, P2 - 0.3, P2 + 4.5))), 34, 129, hex('#d4dce6')); desenfocado(Math.round(lerp(360, -30, lin(t, P2 + 2.2, P3 + 0.4))), 40, 129, hex('#dcd4d8')); });
  reloj(140, 32, 9, t);
  // las rayitas de los mililitros en cada tubo
  for (let k = 0; k < 3; k++) for (let j = 0; j < 4; j++) R.rect(200 + k * 26 + 3, 72 + j * 14, 200 + k * 26 + 5, 72 + j * 14, C.metalS);
  // «drop»: una sola gota cae en el primer tubo y se queda en el fondo
  const g = lin(t, gota - 0.1, gota + 0.3); if (g > 0 && g < 1) { const gy = Math.round(lerp(58, 122, g * g)); R.disco(200, gy, 2, C.sangreS); R.pset(200, gy, C.sangre); R.pset(199, gy - 1, C.sangreL); }
  if (g >= 1 && n < 0.15) { R.rect(195, 123, 205, 124, C.sangre); if (t < gota + 0.6) for (const dx of [-4, -2, 2, 4]) R.pset(200 + dx, 120 - Math.abs(dx) / 2, C.sangreL); }
  // la mano de la enfermera: trae el tubo, lo sostiene mientras se llena (la del decorado) y se va
  if (n <= 0) brazo(Math.round(lerp(340, 218, tramo(t, P2 + 0.2, P2 + 1.0))), 92, -1, '#4aa8a0');
  else if (n < 3) { const x = 200 + Math.floor(n) * 26 + 18 + 43; if (x < 320) { R.rect(x, 90, 319, 94, hex('#4aa8a0')); R.rect(x, 89, 319, 89, C.k); R.rect(x, 95, 319, 95, C.k); } }
  else brazo(Math.round(lerp(274, 350, tramo(t, tubos + 0.05, tubos + 0.5))), 92, -1, '#4aa8a0');
  // las burbujitas que suben por el tubo que se está llenando
  if (n > 0 && n < 3) { const k = Math.floor(n), x = 200 + k * 26, top = Math.round(125 - 56 * (n - k)); for (let q = 0; q < 3; q++) { const y = top + 3 + Math.round(((t * 40 + q * 7) % 20)); if (y < 124) R.pset(x - 2 + q * 2, y, C.sangreL); } }
};

// ── 3 · la cucharadita ───────────────────────────────────────────────────────────────────────────────────────────
const toques = [ml, ml + 0.4, cada];
const p3 = (t) => {
