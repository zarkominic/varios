const REGLA = { pieza: I.REG, flecha: I.FLE, pos: en(1668, 528, 0.4), escala: 1.42, rot: [0, -0.12, 0], e: -9, ya: 0.375, lupa: 0.5, actual: -10, marca: -10 };
// Atom: su sitio de presentador (abajo a la izquierda, ~180 px)

// ---------------------------------------------------------------- capa 2D
const cont = document.getElementById('escena');

// una foto escalada s veces alrededor de (px, py), que va a parar a (qx, qy)
function fotoEscalada(f, s, [px, py], alfa = 1, [qx, qy] = [px, py], filtro = null, dc = g) {
  if (alfa <= 0.001) return;

}
function parpadeo(n) {

}

const CHISPA2D = (() => {

  gr.addColorStop(0, 'rgba(255,214,150,1)'); gr.addColorStop(0.3, 'rgba(250,170,90,0.35)'); gr.addColorStop(1, 'rgba(240,150,70,0)');

// ---------------------------------------------------------------- Atom
// el reloj de ep3-silla en su último fotograma (el mismo cálculo que allí: arranca del de ep3-casa)
const DC = CASA.duracion, QC = DC - 0.6, TSC = Math.floor((DC - 0.3) * 12 + 1e-6) / 12;
const calmaC = (t) => { const a = QC - 0.9; if (t <= a) return t; const u = Math.min(t - a, 0.9); return a + u - (u * u) / 1.8; };
const DT = 1 / 240;
function hacerReloj(dur, quieto) {
  const vel = (t) => ss(0.08, 0.8, t) * (1 - eio(prog(t, quieto - 0.9, quieto)));
  const R = [0];
  for (let i = 1; i * DT <= dur + 0.2; i++) R.push(R[i - 1] + vel((i - 0.5) * DT) * DT);
  return (t) => { const x = t / DT, i = Math.min(R.length - 2, Math.floor(x)); return mix(R[i], R[i + 1], x - i); };
}
const relojS = hacerReloj(D_S, QUIETO_S);
const A0 = calmaC(TSC) + relojS(TS_S);          // tz y ta de Atom en el último fotograma de ep3-silla
// el nuestro arranca parado (como acabó allí) y se para al final en un múltiplo de 10/3 s (sus electrones dan ±3 vueltas
// cada 10 s): en el último fotograma quedan donde los pone ts = 0 en ep3-proton
const relojM = hacerReloj(D, QUIETO);
const R_FIN = relojM(QUIETO);
const PER = 10 / 3;
let mFin = Math.round((A0 + R_FIN) / PER); if ((mFin * PER - A0) / R_FIN < 0.8) mFin++;
const K_RELOJ = (mFin * PER - A0) / R_FIN;
function atomo(ts) {
  const r = relojM(ts);

  const tz = A0 + r;                            // el balanceo, que se apaga al final (yaw −0,15 y sin bote, como ep3-proton)
  const w = 1 - ss(QUIETO - 1.4, QUIETO - 0.1, ts);
  const bote = 0.025 * Math.sin(tz * 1.1) * w;
  const en0 = ts < QUIETO ? E.energia(ts) : 0;

    energia: en0, ts: ta });
}
// el velo oscuro detrás de Atom (el de ep3-silla; en ep3-proton no hay)

}

// ---------------------------------------------------------------- A · la vista atómica de ep3-silla (2D)
// unidades: 1 = distancia entre átomos; el centro del hueco en y = 0 (y hacia abajo); arriba la persona, abajo la silla.
// Es la de ep3-silla en su estado final (los de atrás ya en la segunda capa, sin amontonarse), con más filas y columnas
// para poder alejarse.
const MI = { Z5: 240, HUECO: 0.32, RE: 0.1 };

const F_MAX = 6;
const ATOMOS = [];

  const x = i + (f % 2) * 0.5 + (lado > 0 ? 0.27 : 0) + 0.12 * (azar(i + 40, f + 5 + (lado > 0 ? 9 : 0)) - 0.5);
  ATOMOS.push({ x, y: lado * (Y_AT + f * 0.86), lado, f, sem: azar(i + 70, f + (lado > 0 ? 20 : 30)) });
}
const ELEC = [];
for (const lado of [-1, 1]) {

  for (let j = -46; j <= 45; j++) {
    const x = (j + 0.5) * 0.5 + dx;

  }
  for (let j = -46; j <= 45; j += 2) {
    const x = (j + 0.5) * 0.5 + dx;

  else for (let k = 0; k < 3; k++) ELEC.push({ tipo: 'orbita', lado: a.lado, cx: a.x, cy: a.y, r: 0.3 + 0.05 * k, fase: a.sem * 6.28 + k * 2.1, w: (0.3 + 0.2 * a.sem) * (k % 2 ? -1 : 1), f: a.f, sem: (a.sem + 0.37 * k) % 1 });
}
// el estado de ep3-silla sigue: su reloj (tz) y su número de fotograma (nz) continúan desde su QUIETO
const tzA = (ts) => TZ_S + ts, nzA = (n) => NZ_S + n;

const CUENTAS = [[], [], []];

const NUBES = { '-1': [], '1': [] };
const R_NUBE = 200;

// ---------------------------------------------------------------- los planos
function planoA(n, ts) {

  const u = eio(prog(ts, T.aparta[0], T.aparta[1]));

  }

  }

function planoE(n, ts) {
