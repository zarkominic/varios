// OI-SUMIDERO (frases 34–35), hoy. Cuatro planos:
// 1. el prado de la isla con hondonadas de yeso (una charca con pato y juncos, otra seca), el mar y el cabo blanco al
//    fondo, el bosque y la torre de los buscadores; en «sinkhole» el suelo junto al arbolito y la estaca se agrieta en
//    anillo y se comba, y en «opened up on its own» se hunde solo: un embudo con la tierra, la arcilla y el yeso en capas,
//    el arbolito y la estaca caen dentro, sube el polvo y el conejo sale corriendo; el geólogo lo explica y señala y el
//    buscador da un paso atrás;
// 2. corte en «and»: el sumidero en sección, a cámara rápida: los árboles del borde caen dentro uno tras otro y la tierra
//    los va enterrando en capas, uno cada diez pies (la regla marca 20–70); en el borde vuelven a brotar arbolitos;
// 3. corte en «But»: la zanja de la playa vista desde arriba, a pie de obra: el mar y la playa arriba (algas, nasa,
//    gaviota que picotea, cangrejo), la pared del fondo con la capa de fibra de coco que llora agua, y en el fondo los
//    cinco canales de piedra en abanico; una mano llega desde la arena de cerca, coge un mechón de fibra («coconut
//    fiber») y lo enseña; el agua de los canales destella («stone channels») y los dos del borde se encogen de hombros: «?»;
// 4. corte en «which»: unas salinas antiguas como las que algunos imaginan: balsas con muretes, agua salada que pasa
//    del verde al rosa y costra de sal; el salinero rastrilla (rayas y montoncito que crece) y el otro lleva el cesto
//    hasta el montón y lo vuelca; en «debate» cae un «?» limpio y en «still open» una gaviota llega y se posa encima.

import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';

const { tramo, lerp, hex } = R;

const K = hex('#1a1220'), BLANCO = hex('#ffffff');
const mz = (a, b, u) => { const r1 = a & 255, g1 = (a >>> 8) & 255, b1 = (a >>> 16) & 255; return (0xff000000 | (Math.round(b1 + (((b >>> 16) & 255) - b1) * u) << 16) | (Math.round(g1 + (((b >>> 8) & 255) - g1) * u) << 8) | Math.round(r1 + ((b & 255) - r1) * u)) >>> 0; };
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };

const osc = (x, y, u, c = K) => R.pset(x, y, mz(R.pget(x, y), c, u));

// degradado tramado (Bayer) de una lista de colores entre y0 e y1

// cirros quietos, nubes de tres tonos a tres alturas y tres velocidades, y gaviotas
const cirros = (y0, n, c) => { for (let k = 0; k < n; k++) { const x = (k * 97 + 13) % 300, y = y0 + (k * 13) % 12, w = 14 + (k * 7) % 18; for (let i = 0; i < w; i++) if (hh(x + i, y, 3) > 0.3) R.pset(x + i, y + (i > w / 2 ? 1 : 0), c); } };
const nubes = (t, ys, v = 1) => { [[0.7, 16, ys[0]], [1.5, 26, ys[1]], [2.6, 40, ys[2]]].forEach(([vel, w, y], k) => { for (let j = 0; j < 2; j++) { const x = ((j * 200 + k * 83 + t * vel * v) % 420) - 50; R.nube(Math.round(x), y + j * 4, w - j * 4); } }); };

  for (const [x0, y0, x1, y1] of segs) { if (q <= 0) break; const L = Math.hypot(x1 - x0, y1 - y0), f = Math.min(1, q / Math.max(0.01, L)), xe = x0 + (x1 - x0) * f, ye = y0 + (y1 - y0) * f; R.linea(x0, y0, xe, ye, c); if (gordo) R.linea(x0 + 1, y0, xe + 1, ye, c); q -= L; punta = [xe, ye]; }

    R.pset(x, y, hex('#2e5220')); R.pset(x, y + 1, hex('#4a7a30')); if (hh(x, 3, sem) > 0.6) R.pset(x, y - 1, hex('#5a8a3a')); if (hh(x, 4, sem) > 0.82) { R.pset(x, y - 2, hex('#7a5a3a')); R.pset(x, y - 3, hex('#5a3e28')); } } };
