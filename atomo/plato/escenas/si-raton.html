<script type="module">
// SI-RATON (frases 54–55), 1990, cartela «1990». Cuatro planos:
// 1. el estudio de 1990: el pintor, subido a una escalerilla pegada al caballete, da pinceladas que se quedan en la
//    esquina del lienzo; el técnico, sentado en su silla detrás de la mesa, teclea y en «changes the rules» pasa la
//    mano al ratón: el teclado se duerme (luna y burbujas); un compañero entra con su taza y se sorprende. En la
//    moqueta: la tela de pintor con su bote, la papelera, la regleta con sus cables, la caja de disquetes, una silla
//    con ruedas y la luz de la ventana con motas;
// 2. la mesa de cerca (corta en «No more typing»; fondo local): la mano deja de teclear y el teclado bosteza y se
//    duerme; en «you play with the mouse» la mano mueve el ratón, el cursor cruza la pantalla, clic, y el caballero de
//    16 colores anda hasta el cursor (la nube del juego, recortada a la pantalla, entra y sale por sus bordes);
// 3. el rincón del pintor (corta en «Its backgrounds»; fondo local): el pintor, en su banco alto junto al lienzo, acaba
//    a pinceladas cortas la franja derecha del bosque («painted by hand») y su compañera pulsa el escáner: la barra de
//    luz pasa y el cuadro aparece en el monitor («brought into the computer»);
// 4. los dos monitores (corta en «256»): la pantalla de 256 colores se enciende; el caballero, una silueta de píxeles
//    gordos, se vuelve suave y se mira las manos maravillado (gag 7); en «used sixteen» señala la de 16 y da un
//    saltito. El pintor retoca desde la escalerilla la esquina del lienzo original y luego se vuelve a mirar; en la
//    moqueta, la tela con salpicaduras y botes, la regleta, papeles y la caja de disquetes.
import * as T from '/atomo/plato/escenas/si-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('si-raton');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const k_ = T.C.k, BL = T.C.blanco;
const rgb = (r, g, b) => hex('#' + [r, g, b].map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''));
const grad = (a, b, n) => Array.from({ length: n }, (_, i) => rgb(...a.map((v, j) => v + (b[j] - v) * i / (n - 1))));
const hh = (x, y, s = 0) => { const v = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453; return v - Math.floor(v); };
const BAYER = [0, 0.5, 0.75, 0.25];
// tono tramado: elige en la rampa P con el valor v (0–1) y un tramado 2×2
const tono = (P, v, x, y) => { const f = Math.max(0, Math.min(0.999, v)) * (P.length - 1), i = Math.floor(f); return P[Math.min(P.length - 1, i + ((f - i) > BAYER[(x & 1) + 2 * (y & 1)] ? 1 : 0))]; };
// estrella de 7 px con contorno
const ESTR = ['...#...', '..###..', '#######', '.#####.', '..###..', '.##.##.', '##...##'];
const estrella = (x, y, c, cS) => { for (let j = 0; j < 7; j++) for (let i = 0; i < 7; i++) if (ESTR[j][i] === '#') for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) { const a = ESTR[j + dy]?.[i + dx]; if (a !== '#') R.pset(x - 3 + i + dx, y - 3 + j + dy, k_); }
  for (let j = 0; j < 7; j++) for (let i = 0; i < 7; i++) if (ESTR[j][i] === '#') R.pset(x - 3 + i, y - 3 + j, j > 3 || i > 4 ? cS : c); R.pset(x - 1, y - 1, BL); };
// bocadillo con ondas de voz (sin letras): esquina (x, y), w × h, la cola hacia (cx, cy)
const bocadillo = (x, y, w, h, t, cx, cy, col = hex('#3a6ac8')) => {
  const mx = Math.round(Math.max(x + 4, Math.min(x + w - 4, cx)));
  R.poligono([[mx - 3, y + h - 1], [mx + 3, y + h - 1], [cx, cy]], k_);
  R.rect(x + 1, y, x + w - 1, y + h, k_); R.rect(x, y + 1, x + w, y + h - 1, k_);
  R.rect(x + 1, y + 1, x + w - 1, y + h - 1, BL); R.rect(x + 2, y + h - 2, x + w - 2, y + h - 1, hex('#d8d4ca'));
  R.poligono([[mx - 2, y + h - 2], [mx + 2, y + h - 2], [cx + (cx < mx ? 1 : -1), cy - 2]], BL);
  const n = Math.max(1, Math.floor((h - 3) / 4));
  for (let q = 0; q < n; q++) { const yy = y + 3 + q * 4; for (let i = 3; i <= w - 3; i++) { const a = Math.sin(i * 0.9 - t * 14 + q * 1.7) * (1 - Math.abs(i - w / 2) / (w / 2)) * 1.6; R.pset(x + i, Math.round(yy + a), q === 1 ? col : k_); } }
};

const CIEL = grad([96, 150, 226], [250, 206, 168], 8), MONT = grad([150, 120, 190], [96, 80, 140], 5), COLI = grad([140, 200, 96], [52, 120, 64], 6);
const PRAD = grad([120, 186, 80], [56, 112, 48], 6), PINO = grad([60, 120, 80], [20, 60, 44], 5), CAMI = grad([236, 210, 150], [180, 140, 90], 5), CAST = grad([236, 232, 220], [150, 146, 156], 4);
const SOLC = grad([255, 250, 210], [255, 214, 140], 4), TEJ = grad([90, 120, 220], [50, 70, 150], 3), TRON = grad([140, 96, 60], [90, 60, 36], 3);
// el color del cuadro en (u, v) ∈ [0, 1]² (x, y para el tramado)
const pint = (u, v, x, y) => {
  const cam = 0.5 + 0.18 * (1 - v) * Math.sin(v * 5), ancho = 0.02 + 0.2 * Math.max(0, v - 0.62);
  if (v > 0.62 && Math.abs(u - cam) < ancho) return tono(CAMI, (u - cam + ancho) / (2 * ancho) * 0.6 + (v - 0.62), x, y);
  for (const [tu, tv, ts] of [[0.1, 0.88, 0.2], [0.86, 0.9, 0.24], [0.2, 0.7, 0.12], [0.72, 0.68, 0.1], [0.95, 0.6, 0.12]]) {   // pinos
    const al = ts, top = tv - al; if (v > top && v < tv + 0.04) { const w = (v - top) / al * ts * 0.36; if (Math.abs(u - tu) < w) return tono(PINO, 0.2 + (u - tu + w) / (2 * w) * 0.6 + ((v * 40) % 1 < 0.3 ? 0.2 : 0), x, y); }
    if (v >= tv && v < tv + 0.06 && Math.abs(u - tu) < 0.012) return tono(TRON, 0.5, x, y); }
  if (u > 0.28 && u < 0.4 && v > 0.36 && v < 0.5) {   // el castillo en su colina
    const torre = (u < 0.305 || u > 0.375) ? v > 0.36 : v > 0.41; if (torre) { if ((u < 0.305 || u > 0.375) && v < 0.39) return tono(TEJ, (v - 0.36) / 0.03, x, y); return tono(CAST, (u - 0.28) / 0.12 + (v > 0.45 && Math.abs(u - 0.34) < 0.01 ? 1 : 0), x, y); } }
  const mo = 0.4 + 0.06 * Math.sin(u * 7.3 + 1) + 0.03 * Math.sin(u * 19), co = 0.5 + 0.04 * Math.sin(u * 4.7 + 2.2), pr = 0.6 + 0.02 * Math.sin(u * 9);
  if (v > pr) return tono(PRAD, (v - pr) / (1 - pr) + hh(Math.floor(u * 30), Math.floor(v * 30)) * 0.15, x, y);
  if (v > co) return tono(COLI, (v - co) / (pr - co) * 0.8 + (u > 0.5 ? 0.1 : 0), x, y);
  if (v > mo) return tono(MONT, (v - mo) / (co - mo) + (Math.sin(u * 30) > 0.6 ? 0.2 : 0), x, y);
  const ds = Math.hypot(u - 0.76, (v - 0.17) * 1.3); if (ds < 0.06) return tono(SOLC, ds / 0.06, x, y); if (ds < 0.11) return tono(CIEL, 0.85 + (0.11 - ds) * 1.4, x, y);
  const nub = Math.sin(u * 9 + v * 3) + Math.sin(u * 23) * 0.4; if (v > 0.12 && v < 0.24 && nub > 1.05) return tono(grad([255, 255, 255], [214, 200, 220], 3), (v - 0.12) / 0.12, x, y);
  return tono(CIEL, v / mo, x, y);
};
const PINT = new Map();
const cuadro = (w, h) => { const kk = w + 'x' + h; if (!PINT.has(kk)) { const a = new Uint32Array(w * h); for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) a[y * w + x] = pint((x + 0.5) / w, (y + 0.5) / h, x, y); PINT.set(kk, a); } return PINT.get(kk); };

const a = (f) => en('raton', f), b = (f) => en('colores', f);
const P2 = a(0.583), P3 = b(-0.008), P4 = b(0.462);
// mezcla dos colores del lienzo (f: cuánto del segundo) y oscurece o aclara un óvalo del suelo
const mezcla = (c, d, f) => rgb(...[0, 8, 16].map((s) => ((c >> s) & 255) * (1 - f) + ((d >> s) & 255) * f));
const ovalo = (cx, cy, rx, ry, col, f) => { for (let j = -ry; j <= ry; j++) { const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (j / (ry + 0.5)) ** 2))); for (let x = cx - w; x <= cx + w; x++) R.pset(x, cy + j, mezcla(R.pget(x, cy + j), col, f)); } };
// la escalerilla de tijera de madera, de lado: dos patas abiertas del suelo y0 a la plataforma (x0–x1, yA), peldaños
// con su luz, la plataforma con su canto y unas gotas de pintura
const escalerilla = (x0, x1, yA, y0) => {
  for (const [a, b, c, d] of [[x0 - 3, y0, x0 + 1, yA], [x1 + 3, y0, x1 - 1, yA]]) { R.linea(a - 1, b, c - 1, d, k_); R.linea(a, b, c, d, T.C.madera); R.linea(a + 1, b, c + 1, d, T.C.maderaS); R.linea(a + 2, b, c + 2, d, k_); }
  const n = Math.max(1, Math.round((y0 - yA) / 13));
  for (let s = 1; s <= n; s++) { const y = Math.round(yA + (y0 - yA) * s / (n + 1)), f = (y - yA) / (y0 - yA), ia = Math.round(x0 + 2 - 4 * f), ib = Math.round(x1 - 2 + 4 * f); R.rect(ia, y - 1, ib, y + 1, k_); R.rect(ia + 1, y - 1, ib - 1, y, T.C.maderaL); }
  R.rect(x0 - 1, yA - 1, x1 + 1, yA + 2, k_); R.rect(x0, yA - 1, x1, yA, T.C.maderaL); R.rect(x0, yA + 1, x1, yA + 1, T.C.maderaS);
  for (const [px, py, c] of [[x0 + 2, yA + 9, '#3a8a4a'], [x1 - 1, yA + 17, '#c83a3a'], [x0 + 1, yA + 25, '#2a5aa8']]) if (py < y0 - 3) R.pset(px, py, hex(c));
  ovalo(x0 - 3, y0 + 1, 3, 1, k_, 0.4); ovalo(x1 + 3, y0 + 1, 3, 1, k_, 0.4);
};
// el bote de pintura (esquina de arriba a la izquierda; c: el color que gotea por el borde) con su asa
const bote = (x, y, c, t, k = 0) => { ovalo(x + 5, y + 11, 7, 1, k_, 0.45); R.rect(x, y, x + 9, y + 10, k_); R.rect(x + 1, y + 1, x + 8, y + 9, hex('#c8ccd8')); R.rect(x + 1, y + 1, x + 2, y + 9, hex('#e8ecf4')); R.rect(x + 7, y + 1, x + 8, y + 9, hex('#9a9eac'));
  R.rect(x + 1, y + 1, x + 8, y + 2, hex(c)); R.linea(x + 4, y + 2, x + 4, y + 3 + (Math.floor(t * 0.8 + k) % 4), hex(c)); R.rect(x + 2, y + 5, x + 7, y + 7, hex('#f2eee2')); R.rect(x + 3, y + 6, x + 6, y + 6, hex(c));
  R.linea(x + 1, y - 2, x + 8, y - 2, hex('#5a5a66')); R.pset(x, y - 1, hex('#5a5a66')); R.pset(x + 9, y - 1, hex('#5a5a66')); };
// la regleta con sus clavijas y el piloto rojo del interruptor
const regleta = (x, y, t) => { ovalo(x + 13, y + 6, 14, 1, k_, 0.35); R.rect(x, y, x + 26, y + 5, k_); R.rect(x + 1, y + 1, x + 25, y + 4, hex('#e8e4d8')); R.rect(x + 1, y + 4, x + 25, y + 4, hex('#b8b4a8'));
  for (let i = 0; i < 3; i++) { R.rect(x + 4 + i * 6, y + 1, x + 7 + i * 6, y + 3, hex('#3a3a44')); R.pset(x + 5 + i * 6, y + 2, hex('#5a5a66')); } R.rect(x + 22, y + 1, x + 24, y + 3, Math.sin(t * 2.2) > -0.6 ? hex('#ff4a3a') : hex('#8a2a24')); };
// la caja de disquetes abierta en el suelo, con los disquetes de pie (lomos de colores)
const cajaDiscos = (x, y) => { ovalo(x + 11, y + 12, 13, 1, k_, 0.45); R.rect(x, y, x + 22, y + 11, k_); R.rect(x + 1, y + 1, x + 21, y + 10, hex('#3a3e4a')); R.rect(x + 1, y + 1, x + 21, y + 2, hex('#5a5e6a'));
  ['#c83a3a', '#2a5aa8', '#e8c040', '#3a8a4a', '#e8e4d8'].forEach((c, q) => { const xx = x + 2 + q * 4; R.rect(xx, y - 5 + (q % 2), xx + 3, y + 1, k_); R.rect(xx + 1, y - 4 + (q % 2), xx + 2, y + 1, T.C.disco); R.rect(xx + 1, y - 4 + (q % 2), xx + 2, y - 3 + (q % 2), hex(c)); });
  R.rect(x + 6, y + 5, x + 16, y + 7, hex('#e8e4d8')); R.rect(x + 6, y + 5, x + 16, y + 5, hex('#c83a3a')); };
// la papelera de rejilla con bolas de papel
const papelera = (x, y, t) => { ovalo(x + 6, y + 15, 8, 1, k_, 0.45); R.poligono([[x, y], [x + 12, y], [x + 11, y + 14], [x + 1, y + 14]], k_); R.poligono([[x + 1, y + 1], [x + 11, y + 1], [x + 10, y + 13], [x + 2, y + 13]], hex('#5a5e6a'));
  for (let j = y + 3; j < y + 13; j += 3) R.linea(x + 2, j, x + 10, j, hex('#3a3e4a')); for (let i = x + 3; i < x + 11; i += 3) R.linea(i, y + 2, i, y + 12, hex('#7a7e8a'));
  for (const [dx, dy, r] of [[3, -1, 2], [7, -2, 3], [10, 0, 2]]) { R.disco(x + dx, y + dy, r, k_); R.disco(x + dx, y + dy, r - 1, T.C.papel); R.pset(x + dx - 1, y + dy - 1, BL); }
  const e = (t * 0.4) % 1; R.disco(x - 8 + Math.round(e * 2), y + 13, 2, k_); R.disco(x - 8 + Math.round(e * 2), y + 13, 1, T.C.papel); };
const p1 = (t) => {
  const coge = a(0.345), duerme = a(0.40);
  const ur = tramo(t, coge + 0.3, P2 - 0.1), ru = t < coge ? 0.3 : lerp(0.3, 0.78, ur), rv = t < coge ? 0.4 : lerp(0.4, 0.66, ur);
  T.estudio(R, t, { raton: [ru, rv], dormido: tramo(t, duerme, duerme + 0.9) });
  // ── la moqueta: la luz de la ventana con la sombra del parteluz y motas que suben en ella, la tela de pintor con
  // salpicaduras y su bote, la papelera, la regleta con los cables, la caja de disquetes y la silla con ruedas vacía
  for (let y = 160; y < 180; y++) { const d = (y - 160) * 0.7, xa = Math.round(132 + d), xb = Math.round(214 + d), xm = Math.round((xa + xb) / 2); for (let x = xa; x <= xb; x++) if (Math.abs(x - xm) > 1 && y !== 169 && ((x + y) & 1) === 0) R.pset(x, y, mezcla(R.pget(x, y), hex('#fff0c8'), 0.3)); }
  for (let q = 0; q < 6; q++) { const e = (t * 0.12 + q / 6) % 1; R.pset(Math.round(150 + q * 11 + Math.sin(t * 0.9 + q * 2) * 3 + e * 8), Math.round(178 - e * 18), hex('#fff4d8')); }
  R.poligono([[22, 160], [84, 159], [90, 176], [14, 177]], k_); R.poligono([[23, 161], [83, 160], [88, 175], [16, 176]], hex('#d8d0bc'));
  for (let x = 24; x < 84; x += 3) R.pset(x, 162 + (x % 2), hex('#b8b09a')); R.linea(30, 168, 52, 167, hex('#c4bca6')); R.linea(60, 171, 80, 170, hex('#c4bca6'));
  for (let q = 0; q < 30; q++) { const x = 20 + Math.floor(hh(q, 1, 21) * 64), y = 163 + Math.floor(hh(q, 2, 21) * 11), c = hex(['#c83a3a', '#3a8a4a', '#2a5aa8', '#e8c040', '#6a3a8a'][q % 5]); R.pset(x, y, c); if (q % 3 === 0) R.pset(x + 1, y, c); }
  bote(30, 162, '#3a8a4a', t); R.linea(46, 171, 58, 168, hex('#8a5a2a')); R.pset(59, 167, hex('#e8c040')); R.pset(60, 167, hex('#e8c040'));
  papelera(108, 162, t);
  R.linea(196, 158, 194, 166, k_); R.linea(194, 166, 186, 170, k_); R.linea(150, 158, 152, 168, k_); R.linea(152, 168, 186, 172, k_); R.linea(212, 172, 224, 168, k_); R.linea(224, 168, 236, 158, k_);
  regleta(186, 168, t);
  cajaDiscos(240, 164);
  T.silla(R, 300, 146, -1); ovalo(300, 159, 10, 1, k_, 0.35);
  // ── el pintor, subido a la escalerilla junto al caballete, da pinceladas en la esquina del lienzo que va acabando
  escalerilla(88, 100, 118, 158);
  const pin = (u) => [82 + Math.round(Math.sin(u * 2.4) * 1.5), 106 + Math.round(Math.sin(u * 4.1) * 2)];
  for (let q = 0; q < 26; q++) { const tk = 0.3 + q * 0.32; if (t < tk) break; const [hx, hy] = pin(tk), x = hx - 5 - Math.floor(hh(q, 3, 22) * 5), y = hy - 6 - Math.floor(hh(q, 4, 22) * 3), c = hex(['#3a8a4a', '#5ab04a', '#2a6a3a', '#e8c040', '#7ab86a'][q % 5]);
    if (x >= 66 && x <= 79 && y >= 90 && y <= 101) { R.pset(x, y, c); R.pset(x + 1, y, c); if (q % 2) R.pset(x + 1, y + 1, c); } }
  const pm = R.actor(EL.dibujante, 86, 118, t, { dir: -1, sostiene: pin(t), sonrisa: t > duerme + 1.2 }).mano;
  const tip = [pm[0] - 5, pm[1] - 6];
  R.linea(pm[0], pm[1], tip[0] + 1, tip[1] + 1, hex('#5a3418')); R.linea(pm[0] + 1, pm[1], tip[0] + 2, tip[1] + 1, hex('#8a5a2a'));
  R.rect(tip[0], tip[1], tip[0] + 1, tip[1] + 1, hex(['#3a8a4a', '#5ab04a', '#e8c040'][Math.floor(t * 1.5) % 3]));
  // ── el técnico, sentado en su silla detrás de la mesa: teclea y, en «changes the rules», pasa la mano al ratón.
  // El respaldo y su cuerpo quedan tapados por el tablero (se restaura lo de delante salvo el brazo)
  R.rect(119, 107, 129, 125, k_); R.rect(120, 108, 128, 125, hex('#2a3a6a')); R.rect(120, 108, 121, 125, hex('#3a4a8a')); R.rect(120, 108, 128, 109, hex('#4a5a9a')); for (let y = 112; y < 125; y += 4) R.linea(122, y, 127, y, hex('#22305a'));
  const QX0 = 118, QX1 = 152, QY0 = 126, QY1 = 136, ant = [];
  for (let y = QY0; y <= QY1; y++) for (let x = QX0; x <= QX1; x++) ant.push(R.pget(x, y));
  const tecl = t < coge, golpe = Math.floor(t * 8) % 2;
  const mx = Math.round(133 + (ru - 0.5) * 12), my = Math.round(129 + (rv - 0.72) * 6);
  const XT = 129, ST = 134, hom = [XT + 12, ST - 13 + 2];
  const tm = R.actor(EL.tecnico, XT, ST, t, { dir: 1, sostiene: tecl ? [148 + golpe * 4, 127] : [mx, my - 1], sonrisa: t > coge + 0.6, habla: false }).mano;
  { let k = 0; const dx = tm[0] - hom[0], dy = tm[1] - hom[1], L2 = dx * dx + dy * dy || 1;
    for (let y = QY0; y <= QY1; y++) for (let x = QX0; x <= QX1; x++, k++) { const u = Math.max(0, Math.min(1, ((x - hom[0]) * dx + (y - hom[1]) * dy) / L2)), d = Math.hypot(x - hom[0] - u * dx, y - hom[1] - u * dy); if (d > 2.6) R.pset(x, y, ant[k]); } }
  // la tecla que baja bajo el dedo
  if (tecl) R.rect(tm[0] - 1, tm[1] + 2, tm[0] + 1, tm[1] + 2, hex('#8a8474'));
  // el compañero entra con su taza y se sorprende al ver el teclado dormido
  const v = tramo(t, 1.4, coge), x2 = Math.round(lerp(330, 246, v));
  const cm = R.actor(EL.dibujante2, x2, 158, t, { dir: -1, anda: v > 0 && v < 1, sostiene: true, sorpresa: t > duerme + 0.4 && t < duerme + 1.3, sonrisa: t > duerme + 1.3 }).mano;
  R.rect(cm[0] - 3, cm[1] - 4, cm[0] + 1, cm[1] + 1, k_); R.rect(cm[0] - 2, cm[1] - 3, cm[0], cm[1], hex('#c83a3a')); R.pset(cm[0] + 2, cm[1] - 2, k_);
