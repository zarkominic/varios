// ── 1 · el coche cruza el desierto ─────────────────────────────────────────────────────────────────────────────

// ── 3 · bajan en la atracción ──────────────────────────────────────────────────────────────────────────────────

// ── 4 · el mapa: de costa a costa siguiendo las huellas ───────────────────────────────────────────────────────
const RUTA = [[-74.0, 40.7], [-80.0, 40.4], [-87.6, 41.9], [-93.2, 44.9], [-100.3, 44.4], [-105.0, 39.7], [-111.8, 36.2], [-118.3, 34.1]];
const ATRA = [[0.28, 'dino'], [0.5, 'ovillo'], [0.74, 'rosca']];

const p4 = (t) => {

// ── 5 · la feria: el Bigfoot y el disfraz ──────────────────────────────────────────────────────────────────────
// la piel del disfraz: ry el alto (9 suelta en el aire, con los agujeros de los ojos; g el giro); tirada: true la deja

const piel = (x, y, t, ry = 9, g = 0, tirada = false) => { x = Math.round(x); y = Math.round(y); const F = [hex('#2a160c'), hex('#4a2a16'), hex('#6e4424'), hex('#9a6a3a'), hex('#c08a50')];

    R.pset(x + 9, y - 1, hex('#f0ece0')); R.pset(x + 10, y - 1, hex('#b0aca0')); R.pset(x + 10, y, K);

    if (d < 1) R.pset(x + i, y + j + Math.round(Math.sin(i * 0.5 + t * 10 + g)), d > 0.8 ? F[0] : F[Math.min(3, 1 + Math.floor(hh(i, j, 3) * 2.2 + (j < 0 ? 0.6 : 0)))]); }

const p5 = (t) => {

  if (pe) { const susto = t > AMONG + 0.1 && t < WEIRD + 0.2; T.detective(R, pe.x, pe.s, t, { quien: 'perro', dir: susto || pe.mv && pe.d < 0 ? (pe.mv ? -1 : 1) : 1, anda: pe.mv, sorpresa: susto || (t > ESC && t < ESC + 0.6), habla: t > WEIRD + 0.6 && Math.sin(t * 9) > 0 }); }
  if (co) { const salta = t > WEIRD - 0.35 && t < WEIRD + 0.5, hy = salta ? Math.round(Math.sin(tramo(t, WEIRD - 0.35, WEIRD + 0.5) * Math.PI) * 34) : 0;
    // la piel: el conejo la arranca en lo alto del salto y la tiene un momento agarrada por el borde (se pinta antes que
    // él, para que su mano quede por delante); luego la lanza por encima del hombro, vuela dando vueltas y cae
    // arrugada en la arena, a su derecha, con un botecito y su sombra
    const AG = WEIRD + 0.3, LA = WEIRD + 0.75, PX = 236, PY = 167, hx = co.x - 15, hyP = co.s - hy - 14;
    if (quita && t < AG) piel(hx, hyP + Math.round(Math.sin(t * 20)), t, 9, t * 6);
    T.detective(R, co.x, co.s - hy, t, { quien: 'conejo', dir: t > ESC + 0.2 && t < AMONG ? 1 : -1, anda: co.mv, brazos: quita, sorpresa: t > AMONG && t < WEIRD });
    if (quita && t >= AG) { const u = tramo(t, AG, LA), y0 = co.s - 14 - Math.round(Math.sin(tramo(AG, WEIRD - 0.35, WEIRD + 0.5) * Math.PI) * 34);
      if (u < 1) piel(lerp(hx, PX, u), lerp(y0, PY - 4, u) - Math.sin(u * Math.PI) * 22, t, Math.max(5, 9 - u * 4), u * 14);
      else { const bote = tramo(t, LA, LA + 0.25); if (bote < 1) piel(PX, PY - Math.round(Math.sin(bote * Math.PI) * 3), t, 5); else piel(PX, PY, t, 4, 0, true); } } }

};
