// el penacho de plumas sobre la cabeza del caballo (rojo y oro, se mece)
const penacho = (x, y, t) => { const m = Math.round(Math.sin(t * 7 + x)); R.linea(x, y, x + m - 1, y - 5, hex('#c8301a')); R.linea(x + 1, y, x + m + 1, y - 6, hex('#ff6a1a')); R.pset(x + m, y - 6, hex('#ffd040')); R.pset(x + m - 1, y - 5, hex('#ffd040')); };
const p4 = (t) => {
