const p1 = (t) => {

    for (let y = cy - ry; y <= cy + ry; y++) for (let x = Math.round(cx - rx); x <= cx + rx; x++) { if (x < 0 || x > 319 || ((x + y) & 1)) continue; if (((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 < 1 && TIPO7[y * 320 + x] === 1) R.pset(x, y, mez(R.pget(x, y), hex('#0e3a5a'), 0.22)); } }
  // las nubes del cielo (entre la barra del año y la zona de Atom), de tres tamaños a tres velocidades, y dos gaviotas
  R.nube(196 + t * 0.9 % 20, 13, 24); R.nube(246 + (t * 1.6) % 10, 21, 16); R.nube(176 + (t * 2.4) % 14, 24, 10);
  for (let k = 0; k < 2; k++) { const gx = Math.round(((t * 14 + k * 9) % 120) + 180), gy = 10 + k * 4, a = Math.sin(t * 8 + k) > 0; if (gx < 270) { R.pset(gx, gy, hex('#5a6a7a')); R.pset(gx - 1, gy - (a ? 1 : 0), hex('#5a6a7a')); R.pset(gx + 1, gy - (a ? 1 : 0), hex('#5a6a7a')); } }
  // los pescadores del puente viejo lanzan la caña; el velero del fondo y los coches diminutos del último puente
  for (const [fx, k] of [[96, 0], [214, 1]]) { const fy = Math.round(yP7(fx) - 15) - 1, lan = (Math.sin(t * 1.3 + k * 2) + 1) / 2;
    R.pset(fx, fy - 1, hex('#e8b48a')); R.pset(fx, fy, hex(k ? '#e83a3a' : '#3a6ae8')); R.linea(fx + 1, fy - 1, fx + 4, fy - 4, hex('#3a3a3a')); R.linea(fx + 4, fy - 4, fx + 6 + Math.round(lan * 3), fy + 6, hex('#d8e0e8')); }
  { const vx = Math.round(170 + t * 1.5 % 40), vy = 44; R.linea(vx, vy, vx + 5, vy, BL); R.linea(vx + 2, vy - 1, vx + 2, vy - 5, hex('#8a8a8a')); R.poligono([[vx + 3, vy - 5], [vx + 3, vy - 1], [vx + 6, vy - 1]], BL); R.pset(vx - 1, vy, hex('#d8eef4')); }
  for (let k = 0; k < 2; k++) { const u = ((t * 0.09 + k * 0.5) % 1), x = Math.round(lerp(108, 58, u)), y = Math.round(lerp(53, 39, u)); R.pset(x, y, k ? hex('#e83a3a') : BL); }
  // una lancha cruza por delante del puente con su estela en uve (cuando Atom ya va lejos)
  { const u = tramo(t, P7 + 2.2, P8 + 0.6), lx = Math.round(lerp(340, -30, u)), ly = Math.round(lerp(150, 168, u));
    if (u > 0 && u < 1) { for (let i = 1; i < 30; i++) { const ex = lx + 9 + i, s = Math.round(i * 0.25); for (const yy of [ly - s, ly + 3 + s]) if (TIPO7[yy * 320 + ex] === 1 && h(ex, yy + Math.floor(t * 8), 4) > i / 34) R.pset(ex, yy, mez(R.pget(ex, yy), BL, 0.7)); }
      rc(lx, ly, lx + 9, ly + 3, K); rc(lx + 1, ly + 1, lx + 8, ly + 2, BL); R.linea(lx + 1, ly + 3, lx + 8, ly + 3, hex('#3a6ae8')); R.pset(lx + 4, ly, hex('#5a8ab8')); R.pset(lx + 5, ly, hex('#5a8ab8')); } }
  // Atom en bici por el puente nuevo, del cayo de abajo hacia el de la derecha (salta un poco en «islands»)
  const u = tramo(t, P7 + 0.2, P8 + 0.2), x = Math.round(lerp(-30, 236, u)), sueloA = Math.round(yP7(x + 10) + anP7(x + 10) * 0.25);
  const salto = t > islas && t < islas + 0.5 ? Math.round(Math.sin((t - islas) / 0.5 * Math.PI) * 4) : 0;
  // un coche por el carril de arriba, delante de Atom y en el mismo sentido (nunca se cruzan)
  { const cxx = Math.round(lerp(110, 340, tramo(t, P7, P8))), cy = Math.round(yP7(cxx + 5) - anP7(cxx + 5) * 0.2);
    rc(cxx, cy - 4, cxx + 10, cy, K); rc(cxx + 1, cy - 3, cxx + 9, cy - 1, hex('#f0f0f4')); rc(cxx + 3, cy - 3, cxx + 7, cy - 3, hex('#5a7a9a')); R.pset(cxx + 9, cy - 2, hex('#fff4b0')); R.linea(cxx + 1, cy, cxx + 9, cy, mez(hex('#5e5e6a'), K, 0.5)); }
  atomBici(x, sueloA, t, t, { salto });
  if (salto > 0) destello(x + 7, sueloA - 34, 3, hex('#fff6c0'));
  // en «islands», cada cayo echa un destello, uno tras otro, de cerca a lejos
  CAYOS7.forEach(([cx, cy, rx, ry], i) => { const e = tramo(t, islas + i * 0.18, islas + i * 0.18 + 0.45); if (e > 0 && e < 1) destello(Math.min(310, Math.max(8, cx + (i ? 0 : 24))), cy - ry - 2, Math.round(1 + Math.sin(e * Math.PI) * 3), hex('#fff6c0')); });
  // un pelícano planea de cerca, por encima del agua, con su sombra abajo
  { const pu = tramo(t, P7, P8), px = Math.round(lerp(340, -40, pu)), py = Math.round(78 + Math.sin(t * 1.2) * 2);
    if (pu > 0 && pu < 1) { for (let i = -6; i <= 6; i++) { const sx = px + i + 8, sy = py + 34; if (TIPO7[sy * 320 + sx] === 1) R.pset(sx, sy, mez(R.pget(sx, sy), hex('#0e3a5a'), 0.35)); }
      T.b_pelicano(R, px, py, t, { dir: -1, vuela: true, aleteo: Math.sin(t * 0.8) > 0.6 }); } }
};

// ── 8 · a pie de puente, gag 2: el pelícano le roba el bocadillo ──────────────────────────────────────────────────
const p8 = (t) => {
  // el pelícano despega del poste, se posa en la cesta (Atom frena), coge el bocadillo y se va por el cielo con él
  const despega = overseas + 0.3, posa = overseas + 0.85, roba = posa + 0.3, vuela = posa + 0.7;
  const o = { encuadre: 'puente', camara: 'barandilla', pelicano: false, coche: t > vuela + 0.25 ? tramo(t, vuela + 0.25, vuela + 1.45) : false };
  const g = T.cayos(R, t, o);
  // Atom pedalea hasta que el pelícano se le posa en la cesta: frena en seco
  const xPara = 176, v = (tt) => tt < posa ? lerp(-34, xPara, tramo(tt, P8 + 0.1, posa)) : xPara + 6 * ease(tramo(tt, posa, posa + 0.25));
  const x = Math.round(v(t)), para = t > posa;
  const PX = 230, PY = 132, cesta = [xPara + 6 + 25, g.suelo - 6 - 16];
  let pel; if (t < despega) pel = { x: PX, y: PY, posado: true };
  else if (t < posa) { const u = tramo(t, despega, posa); pel = { x: lerp(PX, cesta[0], u), y: lerp(PY - 14, cesta[1] - 4, u) - Math.sin(u * Math.PI) * 40 }; }
  else if (t < vuela) pel = { x: cesta[0], y: cesta[1], posado: true, lleva: t > roba };
  else { const u = tramo(t, vuela, vuela + 1.6); pel = { x: lerp(cesta[0], -40, ease(u)), y: lerp(cesta[1] - 6, 40, Math.min(1, u * 1.8)), lleva: true }; }
  atomBici(x, g.suelo, t, para ? posa + 0.25 : t, { lleva: t < roba, salto: t > vuela + 0.5 && t < vuela + 0.9 ? Math.round(Math.sin((t - vuela - 0.5) / 0.4 * Math.PI) * 5) : 0, e: para ? 0.9 : 0.45 });
  if (pel.posado) { T.b_pelicano(R, Math.round(pel.x), Math.round(pel.y), t, { dir: -1, buche: pel.lleva ? 1 : 0 }); if (pel.lleva) bocadillo(Math.round(pel.x) - 15, Math.round(pel.y) - 13); }
  else { const px = Math.round(pel.x), py = Math.round(pel.y);
    // las rayas de velocidad detrás
    for (let k = 0; k < 3; k++) R.linea(px + 14 + k * 2, py - 3 + k * 3, px + 22 + k * 3, py - 3 + k * 3, mez(R.pget(px + 18, py), BL, 0.7));
    T.b_pelicano(R, px, py, t, { dir: -1, vuela: true, aleteo: true, buche: pel.lleva ? 1 : 0 }); if (pel.lleva) bocadillo(px - 19, py - 1); }
  // el «!» de Atom cuando se le posa; el «?» cuando se va volando
  globoIcono('!', x + 7, g.suelo - 54, tramo(t, posa + 0.05, posa + 0.2) - tramo(t, vuela + 0.2, vuela + 0.3), 2);
  globoIcono('?', x + 7, g.suelo - 54, tramo(t, vuela + 0.35, vuela + 0.55), 2);
  T.cayosDelante(R, t, o);
};

// ── 9 · Cayo Hueso: Atom llega con la cesta vacía ─────────────────────────────────────────────────────────────────
const p9 = (t) => {
  const o = { encuadre: 'cayo' }; const g = T.cayos(R, t, o);
  const u = tramo(t, P9 + 0.1, keywest - 0.1), x = Math.round(lerp(-34, 196, ease(u))), llegado = t > keywest;

  atomBici(x, g.suelo, t, u < 1 ? t : keywest, { lleva: false, salto, e: llegado ? 0.8 : 0.45 });
  if (llegado && t < keywest + 1.4) { const e = tramo(t, keywest, keywest + 0.6); for (let k = 0; k < 6; k++) { const an = k * Math.PI / 3 + t; destello(x + 7 + Math.cos(an) * (10 + e * 8), g.suelo - 24 - salto + Math.sin(an) * (10 + e * 8), 1 + (k % 2), hex('#fff6c0')); } }
  T.cayosDelante(R, t, o);
};

// ── 10 · el muelle: las aguas más bonitas y más peligrosas ────────────────────────────────────────────────────────
const p10 = (t) => {
  const pica = tramo(t, peligrosas - 0.2, peligrosas + 0.6), o = { encuadre: 'cayo', camara: 'muelle', pelicano: false, oleaje: pica };
  const g = T.cayos(R, t, o);

  // el pelícano del pilote, con el bocadillo en el buche, se lo traga

  T.b_pelicano(R, 118, 101 - (susto ? Math.round(Math.sin((t - peligrosas - 0.1) / 0.9 * Math.PI) * 6) : 0), t, { dir: 1, buche: 1 - traga, vuela: susto, aleteo: susto });

  const atras = ease(tramo(t, peligrosas + 0.05, peligrosas + 0.5)), ax = Math.round(lerp(176, 108, atras)), ay = Math.round(128 - Math.sin(t * 2.4) * 2 - Math.sin(atras * Math.PI) * 18);

  const ola = tramo(t, peligrosas, peligrosas + 1.4); if (ola > 0 && ola < 1) { const alt = Math.sin(ola * Math.PI) * 46;

    for (let k = 0; k < 30; k++) { const f = (ola * 1.3 + h(k, 1, 2) * 0.3), gx = Math.round(130 + h(k, 3, 2) * 100 + (h(k, 4, 2) - 0.5) * 30 * f), gy = Math.round(140 - Math.sin(Math.min(1, f) * Math.PI) * (30 + h(k, 5, 2) * 40) + Math.max(0, f - 0.6) * 40); if (gy < 170) { R.pset(gx, gy, BL); R.pset(gx + 1, gy, hex('#bfeaf0')); } } }
