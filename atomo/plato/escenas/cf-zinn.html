<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zinn llama a Preiss · ep32</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// CF-ZINN (frase 14), 1984–1997. Tres planos:
// 1. D cleveland/biblioteca: «miles siguieron buscando»: dos buscadores comparan un mapa en la mesa de lectura («maps»), la
//    bibliotecaria llega al fichero con un libro y lo abre («libraries») y una mujer se sienta al ordenador, que carga un mapa línea a
//    línea («later, the Internet»); la barra del año corre de 1984 a 1996;
// 2. D cleveland/biblioteca/despacho («In 1997»): Zinn, de traje, deja de mirar el mapa de corcho, se sienta tras el
//    escritorio, duda («?»), descuelga («even called») y pregunta por las respuestas (bocadillo: llave y «?»);
// 3. A editorial/estudio/mesa (1997, «Preiss told him»): suena el teléfono, Preiss mayor contesta, niega con una sonrisa
//    (bocadillo: la llave tachada desde «told», ~0,6 s sola; en «hunt» el bocadillo crece y se suman la pala y el cofre,
//    con la llave tachada todavía al lado: respuestas no, la búsqueda sigue), cuelga y el cartero trae otra carta.
// En 2 y 3, mientras se habla, el teléfono del decorado va con o.descolgado (la base con las horquillas vacías) y el
// auricular lo pinta la escena en la oreja, con su cable hasta la base: sin parches de píxeles sobre el decorado.
import * as T from '/atomo/plato/escenas/cf-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('cf-zinn');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const Z = T.PIEZAS_CF, z = (f) => en('zinn', f), X = (s) => hex(s);
const K = { k: X('#1c1222'), papel: X('#f4ecd8'), papelS: X('#d0c4a4'), rojo: X('#d83a3a'), rojoS: X('#8e2222'), azul: X('#3a6ac8'), beige: X('#d8ccb0'), beigeS: X('#a89c80'), bl: X('#ffffff'),
  oro: X('#f0c040'), oroS: X('#a87818'), mar: X('#7ab0d8'), tierra: X('#e4d4a0'), verde: X('#3a8a5a'), gris: X('#5a5a6a'), noche: X('#1a2a5a') };
const P2 = z(0.412), P3 = z(0.868);
const maps = z(0.211), libs = z(0.253), later = z(0.314), internet = z(0.358), lawyer = z(0.562), zinnT = z(0.648), called = z(0.704), ask = z(0.769), answers = z(0.809), told = z(0.877), hunt = z(0.928), on = z(1);
// un bocadillo blanco con el pico hacia (px, py)
const globo = (x0, y0, x1, y1, px, py) => {
  const mx = Math.max(x0 + 6, Math.min(x1 - 6, px));
  R.poligono([[mx - 5, y1], [mx + 5, y1], [px, py]], K.k);
  R.rect(x0 - 1, y0 + 1, x1 + 1, y1 - 1, K.k); R.rect(x0 + 1, y0 - 1, x1 - 1, y1 + 1, K.k); R.rect(x0, y0, x1, y1, K.bl); R.rect(x0 + 1, y1, x1 - 1, y1, K.papelS);
  R.poligono([[mx - 3, y1 - 1], [mx + 3, y1 - 1], [px, py - 2]], K.bl);
};
// el auricular pegado a la oreja y su cable rizado hasta la base (tx, ty)
const auricular = (cab, dir, tx, ty, c, cS) => {
  const hx = cab[0] + dir * 7 - (dir > 0 ? 0 : 1), hy = cab[1] + 3;
  const n = Math.max(6, Math.abs(tx - hx) * 2); for (let i = 0; i <= n; i++) { const u = i / n, x = Math.round(hx + (tx - hx) * u), y = Math.round(hy + 9 + (ty - hy - 9) * u + Math.sin(u * Math.PI) * 5 + (i % 4 < 2 ? 0 : 1)); R.pset(x, y, K.gris); }
  R.rect(hx - 1, hy - 1, hx + 2, hy + 8, K.k); R.rect(hx, hy, hx + 1, hy + 7, c); R.rect(hx + (dir > 0 ? 1 : 0), hy + 2, hx + (dir > 0 ? 1 : 0), hy + 5, cS);
};
const mapita = (x, y) => { R.rect(x - 7, y - 6, x + 7, y + 5, K.k); R.rect(x - 6, y - 5, x + 6, y + 4, K.papel); R.rect(x - 6, y - 5, x - 2, y - 1, K.mar); R.rect(x - 6, y - 1, x - 4, y + 1, K.mar); R.linea(x - 4, y + 3, x + 1, y - 1, K.verde); R.linea(x + 1, y - 1, x + 5, y + 2, K.verde);
  R.linea(x + 1, y - 4, x + 5, y, K.rojo); R.linea(x + 5, y - 4, x + 1, y, K.rojo); R.rect(x, y - 5, x, y + 4, K.papelS); };
const librito = (x, y, abierto) => { if (abierto) { R.rect(x - 6, y - 4, x + 6, y + 3, K.k); R.rect(x - 5, y - 3, x + 5, y + 2, K.papel); R.rect(x, y - 3, x, y + 2, K.papelS); for (const i of [-4, 2]) { R.rect(x + i, y - 2, x + i + 2, y - 2, K.gris); R.rect(x + i, y, x + i + 2, y, K.gris); } }
  else { R.rect(x - 4, y - 5, x + 4, y + 3, K.k); R.rect(x - 3, y - 4, x + 3, y + 2, K.rojoS); R.rect(x - 3, y - 4, x - 3, y + 2, K.rojo); R.rect(x - 1, y - 2, x + 2, y - 1, K.oro); R.rect(x - 3, y + 2, x + 3, y + 2, K.papel); } };

// 1 · la biblioteca: mapas, libros y, más tarde, internet
const p1 = (t) => {
  const o = { encuadre: 'biblioteca', sinPantalla: true }, g = T.cleveland(R, t, o);
  const [a0, b0, a1, b1] = g.pantalla ?? [252, 95, 276, 107], enc = t >= later, carga = tramo(t, internet, P2 - 0.7), filas = Math.floor(carga * (b1 - b0 + 1));
  if (enc) for (let y = b0; y <= b1; y++) for (let x = a0; x <= a1; x++) {
    const hecho = y - b0 < filas, tierra = Math.sin(x * 0.55 + 1) + Math.cos(y * 0.8 + x * 0.2) > -0.2;
    R.pset(x, y, !hecho ? (y - b0 === filas ? K.bl : K.noche) : tierra ? K.tierra : K.mar);
  }
  if (enc && carga >= 1 && Math.floor(t * 4) % 2) { const cx = (a0 + a1) >> 1, cy = (b0 + b1) >> 1; R.linea(cx - 3, cy - 3, cx + 3, cy + 3, K.rojo); R.linea(cx - 3, cy + 3, cx + 3, cy - 3, K.rojo); }
  // el del fichero llega con un libro y lo abre («libraries»)
  const uc = tramo(t, 0.5, libs - 1.2), cx = Math.round(lerp(-16, 68, uc)), alza = t > libs - 0.2;
  const c = R.actor(EL.bibliotecaria, cx, 154, t, { dir: 1, anda: uc > 0 && uc < 1, sostiene: alza ? [cx + 18, 126] : true, sonrisa: alza });
  librito(c.mano[0] + 2, c.mano[1] - (alza ? 5 : 1), alza);
  // los dos de la mesa de lectura comparan el mapa («maps»)
  const antes = t < maps - 0.3, alto = t > maps - 0.25;
  const b = R.actor(EL.buscadorCF, 122, 150, t, { dir: 1, habla: antes && Math.sin(t * 7) > 0.2, sostiene: alto ? [142, 124] : undefined, sonrisa: alto });
  if (alto) mapita(b.mano[0] + 4, b.mano[1] - 6);
  R.actor(EL.clienta, 164, 150, t, { dir: -1, habla: antes && Math.sin(t * 7) <= -0.2, dedo: t > maps + 0.3 && t < later, sorpresa: alto && t < maps + 0.4, sonrisa: t > maps + 0.4 });
  // la del ordenador: llega, teclea y el mapa carga («later, the Internet»)
  const ud = tramo(t, later - 2.2, later - 0.2), dx = Math.round(lerp(326, 209, ud)), tecl = t > internet - 0.1;
  R.actor(EL.senora30, dx, 155, t, { dir: ud < 1 ? -1 : 1, anda: ud > 0 && ud < 1, sostiene: tecl && carga < 1 ? [dx + 18, 128 + (Math.floor(t * 9) % 2)] : undefined, sorpresa: carga >= 1, brazos: carga >= 1 && t > P2 - 0.5 });
  T.clevelandDelante(R, t, o);
  if (carga >= 1) R.icono('!', 262, 76 - (Math.floor(t * 6) % 2), K.oro, K.k, 2);
};

// 2 · el despacho de Zinn, 1997: descuelga y pregunta
const p2 = (t) => {
  const coge = called - 0.2, alTel = t > coge;
  // al descolgar, el decorado deja la base con las horquillas vacías (o.descolgado) y el auricular lo lleva Zinn
  const o = { encuadre: 'biblioteca', camara: 'despacho', descolgado: alTel }; T.cleveland(R, t, o);
  const uz = tramo(t, P2 + 0.7, lawyer - 0.1), sent = uz >= 1, zx = Math.round(lerp(254, 173, uz)), zs = sent ? 147 : Math.round(lerp(157, 147, Math.min(1, uz * 2.6)));
  const duda = sent && t > zinnT - 0.5 && !alTel;
  const zn = R.actor(EL.zinn, zx, zs, t, { dir: sent ? 1 : -1, anda: uz > 0 && uz < 1, sostiene: alTel ? [zx + 18, 132] : !sent, habla: alTel && t > ask - 0.25 && Math.sin(t * 8) > 0, sorpresa: duda && t < zinnT });
  if (!sent) librito(zn.mano[0] - 2, zn.mano[1] - 4, uz === 0);
  T.clevelandDelante(R, t, o);
  if (alTel) { auricular(zn.cabeza, 1, 204, 141, K.beige, K.beigeS); }
  if (duda) { const y0 = 96 - Math.round(2 * Math.abs(Math.sin(t * 5))); globo(171, y0, 190, y0 + 18, 181, 120); R.icono('?', 176, y0 + 2, K.rojo, K.papelS, 2); }
  // marca: los tonos salen del teléfono
  if (alTel && t < ask - 0.3) for (let k = 0; k < 3; k++) { const u = ((t - coge) * 2.2 + k * 0.33) % 1; R.rect(214 + k * 5, Math.round(132 - u * 12), 215 + k * 5, Math.round(133 - u * 12), u < 0.8 ? K.oro : K.oroS); }
  // pregunta por las respuestas: una llave y «?»
  if (t > ask - 0.2) { const s = Math.min(1, (t - ask + 0.2) / 0.2), y0 = Math.round(lerp(104, 92, s)); globo(196, y0, 242, y0 + 19, 190, 124); R.icono('llave', 201, y0 + 3, K.oroS, K.papelS, 2); if (t > answers - 0.1) R.icono('?', 222 + Math.round(Math.sin(t * 6)), y0 + 3, K.rojo, K.papelS, 2); }
};

// 3 · Preiss contesta: la búsqueda sigue
const p3 = (t) => {
  const coge = P3 + 0.2, cuelga = on + 0.3, alTel = t > coge && t < cuelga;   // descuelga enseguida: «Preiss told him» llega a los 0,13 s del corte
  const o = { encuadre: 'estudio', camara: 'mesa', epoca: 1997, suena: t < coge, descolgado: alTel }, g = T.editorial(R, t, o);
  const niega = t > told + 0.2 && t < hunt + 0.1 ? Math.round(Math.sin(t * 14)) : 0, fin = t > cuelga + 0.3;
  const pm = R.actor(EL.preissMayor, 153 + niega, g.detras ?? 138, t, { dir: 1, sostiene: alTel ? [172, 121] : undefined, habla: alTel && t > told - 0.15 && t < on && Math.sin(t * 9) > 0, sonrisa: t > hunt - 0.4, sorpresa: t < coge, dedo: fin && t > cuelga + 0.9 });
  T.editorialDelante(R, t, o);
  if (alTel) auricular(pm.cabeza, 1, 213, 139, K.beige, K.beigeS);   // el auricular, en la oreja: la base queda con las horquillas vacías (o.descolgado)
  // el cartero trae otra carta más
  const uc = tramo(t, cuelga - 0.1, cuelga + 1.2), kx = Math.round(lerp(326, 280, uc));
  if (uc > 0) { const ca = R.actor(EL.carteroCF, kx, 164, t, { dir: -1, anda: uc < 1, sostiene: true, sonrisa: uc >= 1 }); Z.sobre(R, ca.mano[0] - 3, ca.mano[1] + 4, {}); }
  // lo que dice: respuestas no (la llave tachada, sola ~0,6 s y luego se queda a la izquierda); a seguir buscando (el
  // bocadillo crece hacia la derecha en «hunt» con la pala, que cava, y el cofre). Dura hasta que cuelga.
  if (alTel && t > told + 0.12) { const s = Math.min(1, (t - told - 0.12) / 0.15), y0 = Math.round(lerp(104, 91, s)), dos = t > hunt + 0.05, w = tramo(t, hunt + 0.05, hunt + 0.2), x1 = Math.round(lerp(224, 248, w));
    globo(178, y0, x1, y0 + 19, 172, 118);
    R.icono('llave', 184, y0 + 3, K.oroS, K.papelS, 2); R.linea(181, y0 + 2, 199, y0 + 17, K.rojo); R.linea(182, y0 + 2, 200, y0 + 17, K.rojo); R.linea(199, y0 + 2, 181, y0 + 17, K.rojo); R.linea(200, y0 + 2, 182, y0 + 17, K.rojo);
    if (!dos) R.icono('X', 207, y0 + 5, K.rojo, K.papelS, 2);
    else if (w >= 1) { R.rect(203, y0 + 3, 203, y0 + 16, K.papelS); R.icono('pala', 207, y0 + 3 - (Math.floor(t * 6) % 2), K.gris, K.papelS, 2); R.icono('cofre', 228, y0 + 3, K.oroS, K.papelS, 2); } }
};
const efectos = [[maps - 0.2, 'papel'], [later, 'bip'], [internet, 'tecleo'], [zinnT - 0.5, 'pop'], [called - 0.15, 'bip'], [P3 + 0.05, 'ring'], [on + 0.3, 'cuelga']];
T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3]], { efectos, año: (t) => (t < P2 ? Math.round(lerp(1984, 1996, tramo(t, 0.4, P2 - 0.4))) : 1997) });
</script>
</body>
</html>
