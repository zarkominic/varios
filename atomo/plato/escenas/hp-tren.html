// HP-TREN (frases 10–11), 2026. «Imagina que eres Harry»: la cámara le sigue. Cuatro planos:

// 3. (corta en «The two friends») el compartimento visto desde el pasillo (fondo propio): por el cristal, Harry sentado a
//    la izquierda bajo la ventanilla del fondo con el campo que corre; por la puerta abierta, Ron enfrente con la rata
//    dormida en el regazo (burbujitas de sueño); el sapo de Neville cruza el pasillo a saltos y entra; en «Ron» Ron saluda

//    sacan un «?» uno tras otro; luego la lechuza se va volando y los tres siguen bajando hacia el lago.
import * as T from '/atomo/plato/escenas/hp-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('hp-tren');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const a = (f) => en('bajando', f), b = (f) => en('trio', f);
const P2 = a(0.515), P3 = b(0.133), P4 = b(0.736);
const pisa = a(0.325), tren_ = a(0.406), lot = a(0.637), intro = a(0.807), dom = b(0.011);
const amig = b(0.161), ron = b(0.457), arab = b(0.517), herm = b(0.666), kids = b(0.774), nadie = b(0.84), antes = b(0.944);
const C = T.C, P = T.PIEZAS_HP;
const halo = (cx, cy, r, c, k = 0, dens = 3) => { for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++) { const d = Math.hypot(x - cx, y - cy) / r; if (d < 1 && (((x * 374761 + y * 668265 + k * 1013) >>> 0) % 97) / 97 < (1 - d) * (1 - d) * dens * 0.25) R.pset(x, y, c); } };
const sube = (t, t0, d = 0.5) => { const u = tramo(t, t0, t0 + d); return u > 0 && u < 1 ? Math.round(Math.sin(u * Math.PI) * 6) : 0; };

const jaula = (r, t) => P.lechuza(R, r.mano[0], r.mano[1] + 17, { jaula: true, t });
const p1 = (t) => {
  const ll = tramo(t, 0, 2.2);

  if (vu > 0 && vu < 1) { const e = vu * vu * (3 - 2 * vu), x0 = hx + 14, y0 = 135, jx = Math.round(lerp(x0, 248, e) + Math.sin(e * Math.PI) * 10), jy = Math.round(lerp(y0, 31, e));

const pega = (b) => { const D = R.buf; for (let i = 0; i < D.length; i++) { const c = b[i]; if (c) D[i] = c; } };
const MD = { c: hex('#7a3420'), l: hex('#a0522e'), s: hex('#5a2414'), d: hex('#2e1008'), v: hex('#6a2a18'), b: hex('#8a3e24') };
const LT = { c: hex('#c89a3a'), l: hex('#f4d878'), s: hex('#7a5a18') };
const TP = { c: hex('#a8202c'), l: hex('#d84050'), s: hex('#701420'), d: hex('#4a0a10') };
// la caoba con su veta ondulada, un panel con bisel (luz arriba a la izquierda) y un marco de cuatro filetes

const tabla = (x0, y0, x1, y1, k = 0) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) R.pset(x, y, veta(x, y, k)); };
const cuart = (x0, y0, x1, y1, k = 0) => { tabla(x0, y0, x1, y1, k); R.rect(x0, y0, x1, y0, MD.l); R.rect(x0, y0, x0, y1, MD.l); R.rect(x0, y1, x1, y1, MD.d); R.rect(x1, y0, x1, y1, MD.d); R.rect(x0 + 2, y0 + 2, x1 - 2, y0 + 2, MD.s); R.rect(x0 + 2, y0 + 2, x0 + 2, y1 - 2, MD.s); R.rect(x0 + 3, y1 - 2, x1 - 2, y1 - 2, MD.b); R.rect(x1 - 2, y0 + 3, x1 - 2, y1 - 2, MD.b); };

// ── plano 3: el compartimento visto desde el pasillo ──────────────────────────────────────────────────────────────────
// Dos búferes: INT3, el compartimento por dentro (pared del fondo con la ventanilla, las cortinas, la mesita, las
// rejillas con el baúl y la bolsa de Ron, los dos bancos de perfil y la alfombra), y PARED3, la pared del pasillo con dos
// huecos a 0: el cristal grande (x 30–192, y 32–120) y la puerta corredera abierta (x 214–262, y 27–149). Se pinta INT3,
// luego lo de dentro (paisaje, jaula, Harry, Ron, la rata, los frentes de los asientos) y encima PARED3 (lo tapa todo menos

const pintaInterior = () => {

  for (let y = 129; y < 152; y++) for (let x = 0; x < 320; x++) { let c = (Math.abs(((x - 146) % 10 + 10) % 10 - 5) + Math.abs((y - 129) % 8 - 4)) === 4 ? hex('#8a3a3a') : hex('#5a1a20'); if ((x < 104 || x > 186) && um(x, y) < 0.55) c = mix(c, K, 0.5); R.pset(x, y, c); }

const pintaPared = () => {

  for (let y = 0; y <= 15; y++) for (let x = 0; x < 320; x++) { let c = y % 4 === 3 ? hex('#26120a') : hh(x >> 3, y >> 2, 21) < 0.5 ? hex('#4a2a1a') : hex('#54301c'); if (x % 40 < 3) c = x % 40 === 0 ? hex('#7a5a28') : hex('#5a4018'); R.pset(x, y, c); }
