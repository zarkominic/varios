<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barro · ep5</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// RM-BARRO (frases 11–12). La versión real: cabañas de pastores en colinas junto a un río, ovejas y barro que salpica
// al pasar un pastor. Luego reyes que se suceden en un trono de madera; al último, con cara de malo, le cae una patada y
// sale volando del cuadro.
import { preparar, rodar } from '/atomo/plato/escenas/rm-comun.js';
const { E, R, M } = await preparar('rm-barro');
const { PALA, PR, ELENCO, tramo, lerp, clamp } = R;
const m = { cab: M('cabanas', 0.5), rey: M('reyes', 7) };
const pastor = { peinado: 'corto', pelo: PALA.PELO_NEGRO, chaqueta: PALA.MARRON, camisa: PALA.MARRON, falda: PALA.MARRON, antebrazo: PALA.PIEL, pantalon: PALA.PIEL, sandalias: true, chaqueta_larga: false, faja: PALA.MARRON };
const aldea = (t) => {
  R.cieloR(t, 'dia', { hor: 110, nubes: { n: 4 } });
  R.colinas(104, { amp: 14, luz: 1.6, semilla: 2 }); R.colinas(120, { amp: 10, luz: 2.1, semilla: 5 });
  for (const [x, y, s] of [[60, 112, 0.7], [110, 106, 0.6], [200, 112, 0.75], [262, 118, 0.8]]) R.cabana(x, y, s, t, { humo: x === 200 });
  for (let y = 132; y < 142; y++) for (let x = 0; x < R.W; x++) R.pset(x, y, R.tone(PR.AGUA, 1.4 + (Math.sin(x * 0.2 + y - t * 3) > 0.85 ? 1.4 : 0), x, y));
  R.suelo(142, PR.TIERRA, { luz: 1.6 });
  for (let k = 0; k < 6; k++) for (let j = -2; j <= 2; j++) { const w = Math.round(9 * Math.sqrt(1 - (j / 3) ** 2)); R.rect(30 + k * 52 - w, 158 + (k % 2) * 8 + j, 30 + k * 52 + w, 158 + (k % 2) * 8 + j, j < 0 ? PR.TIERRA[0] : PR.TIERRA[1]); }
  [[90, 150], [130, 156], [230, 152]].forEach(([x, y], i) => R.oveja(x + Math.sin(t * 0.3 + i) * 6, y, t, { dir: i % 2 ? -1 : 1 }));
  const px = lerp(-20, 340, ((t - m.cab) / 9) % 1);
  R.personaje(px, 172, 42, { ...pastor, t, anda: t * 7, objeto: 'pala' });
  for (let k = 0; k < 6; k++) { const f = ((t * 3 + k / 6) % 1); R.pset(Math.round(px - 6 - f * 10 + k), Math.round(170 - Math.sin(f * Math.PI) * 10), PR.TIERRA[1]); }
};
const reyes = (t) => {
  R.cieloR(t, 'tarde', { hor: 130, sol: [270, 110, 9] });
  R.colinas(130, { amp: 8, luz: 1.4 }); R.suelo(146, PR.TIERRA, { luz: 2 });
  R.trono(160, 150, { tela: PALA.ROJO, esc: 1 });
  const u = t - m.rey, cambios = [0, 1.1, 2.2], i = cambios.filter((c) => u >= c).length - 1;
  const capas = [PALA.AZUL, PALA.VERDE, PALA.NEGRO], barbas = ['perilla', 'poblada', 'bigote'];
  const vuela = clamp((u - 4.6) / 1.4, 0, 1);
  if (vuela < 1) R.personaje(160 + vuela * 200, 160 - Math.sin(vuela * Math.PI) * 70 - vuela * 20, 44, { ...ELENCO.rey, peinado: 'corto', capa: capas[Math.max(0, i)], barba: barbas[Math.max(0, i)], pelo: [PALA.PELO_BLANCO, PALA.PELO_CASTANO, PALA.PELO_NEGRO][Math.max(0, i)], t, pose: vuela > 0 ? 'brazos' : 'sentado', ceño: i === 2 });
  if (u > 3.4) { const p = tramo(t, m.rey + 3.4, m.rey + 4.4); R.personaje(lerp(-20, 130, p), 166, 42, { ...pastor, pelo: PALA.PELO_RUBIO, t, anda: p < 1 ? t * 7 : null, pose: u > 4.5 && u < 5 ? 'senala' : 'pie', ceño: true }); }
  if (vuela > 0.6) for (const [x, c] of [[60, PALA.VERDE], [250, PALA.AZUL], [280, PALA.ROJO]]) R.personaje(x, 166, 38, { ...pastor, chaqueta: c, camisa: c, falda: c, t, pose: 'brazos', sonrisa: true, dir: x < 160 ? 1 : -1 });
};
rodar(E, R, [[0, aldea], [m.rey - 0.2, reyes]]);
</script>
</body>
</html>
