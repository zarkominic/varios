<script type="module">
// LT-AVISO (frase 4), sin año. Tres planos en el estudio de Atom:
// 1. el estudio entero: Atom entra por la puerta con el cartel del ojo tapado y lo alza en «warning»; en «two whole
//    books» escribe un «2» con tiza en la pizarra y dibuja dos libros;
// 2. la mesa de cerca: en «Children of Dune» cae un libro gordo y en «God Emperor» otro más gordo encima (Atom da un
//    respingo); en «read them first» levanta la tapa y mira dentro; en «save this video» deja el cartel encima y guiña;
// 3. la pizarra de cerca: en «image of the bridge» Atom dibuja el puente con sus arcos, el río y el carro; en «coming
//    back» una flecha que vuelve; en «end» lo rodea y lo señala.
import * as T from '/atomo/plato/escenas/lt-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('lt-aviso');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const K = hex('#1a1424'), ease = (u) => u * u * (3 - 2 * u), voz = (t) => E.energia(t);
const hh = (a, b, c = 0) => { let n = (a * 374761393 + b * 668265263 + c * 1442695041) | 0; n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };
const mez = (c1, c2, a) => { const r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
  return (0xff000000 | (Math.round(b1 + (((c2 >>> 16) & 255) - b1) * a) << 16) | (Math.round(g1 + (((c2 >>> 8) & 255) - g1) * a) << 8) | Math.round(r1 + ((c2 & 255) - r1) * a)) >>> 0; };
const BAY = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const tono = (cols, v, x, y) => { const n = cols.length - 1; v = Math.max(0, Math.min(n, v)); let l = Math.floor(v); if (v - l > BAY[y & 3][x & 3] / 16) l++; return cols[Math.min(n, l)]; };
const pal = (...a) => a.map(hex);
const capas = {};
const capa = (k, f) => { if (!capas[k]) { const b = R.nuevo(); const prev = R.usar(b); f(); R.usar(prev); capas[k] = b; } return capas[k]; };
// pega una capa con transparencia (los píxeles a 0 no se pintan), entre y0 e y1
const pegar = (b, y0 = 0, y1 = 179) => { const D = R.buf; for (let i = y0 * 320; i < (y1 + 1) * 320; i++) { const c = b[i]; if (c) D[i] = c; } };
// un pájaro pequeño que aletea (V de 5 px)
const pajaro = (x, y, t, c = K, f = 0) => { x = Math.round(x); y = Math.round(y); const a = Math.sin(t * 14 + f) > 0; R.pset(x, y, c); R.pset(x - 1, y - (a ? 1 : 0), c); R.pset(x + 1, y - (a ? 1 : 0), c); R.pset(x - 2, y - (a ? 2 : -1) * (a ? 1 : 0), c); R.pset(x + 2, y - (a ? 2 : 0), c); };
// una paloma blanca (6 px) que bate las alas
const paloma = (x, y, t, f = 0) => { x = Math.round(x); y = Math.round(y); const a = Math.sin(t * 16 + f) > 0, B = hex('#f8f4ec'), S = hex('#b8b4c8');
  R.pset(x, y, B); R.pset(x + 1, y, B); R.pset(x + 2, y - 1, B); R.pset(x - 1, y, S); R.pset(x + 3, y - 1, hex('#e8a040'));
  if (a) { R.pset(x, y - 1, B); R.pset(x - 1, y - 2, B); R.pset(x + 1, y - 2, S); } else { R.pset(x, y + 1, B); R.pset(x - 1, y + 2, S); } };
// nubes de tres tonos (bolitas) que derivan; cada nube: [x0, y, ancho, vel]
const nube = (x, y, w, cols, t, k) => { for (let i = 0; i < Math.max(3, Math.round(w / 6)); i++) { const cx = Math.round(x + i * w / Math.max(3, Math.round(w / 6))), r = 3 + Math.round(hh(k, i, 7) * 3);
  R.disco(cx, y + 1, r, cols[0]); } for (let i = 0; i < Math.max(3, Math.round(w / 6)); i++) { const cx = Math.round(x + i * w / Math.max(3, Math.round(w / 6))), r = 3 + Math.round(hh(k, i, 7) * 3); R.disco(cx, y, r - 1, cols[1]); R.disco(cx - 1, y - 1, Math.max(1, r - 2), cols[2]); } };
// pétalos que caen (rosas y blancos) en un rectángulo
const petalos = (t, x0, y0, x1, y1, n, sem = 0) => { const P = pal('#f8c8d8', '#ffffff', '#f0a0b8', '#f8e0a0');
  for (let k = 0; k < n; k++) { const H = y1 - y0, y = y0 + ((hh(k, 1, sem) * H + t * (8 + hh(k, 2, sem) * 10)) % H), x = x0 + ((hh(k, 3, sem) * (x1 - x0) + Math.sin(t * 1.6 + k) * 6 + t * 3) % (x1 - x0));
    const c = P[k % 4]; R.pset(Math.round(x), Math.round(y), c); if (Math.sin(t * 5 + k) > 0) R.pset(Math.round(x) + 1, Math.round(y), c); } };
// el cartel de destripes (sin letras): tarjeta blanca con un ojo tapado por una venda
const cartel = (x0, y0, w, h) => {
  R.rect(x0, y0, x0 + w, y0 + h, K); R.rect(x0 + 1, y0 + 1, x0 + w - 1, y0 + h - 1, hex('#fbf6e8')); R.rect(x0 + 1, y0 + h - 2, x0 + w - 1, y0 + h - 1, hex('#e0d6bc'));
  const cx = x0 + Math.round(w / 2), cy = y0 + Math.round(h / 2) + 1, rx = Math.round(w * 0.34), ry = Math.max(2, Math.round(h * 0.24));
  for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++) { const e = (x / rx) ** 2 + (y / ry) ** 2; if (e <= 1) R.pset(cx + x, cy + y, e > 0.62 ? K : hex('#ffffff')); }
  R.disco(cx, cy, Math.max(1, ry - 1), hex('#3a7ad8')); R.pset(cx, cy, K);
  for (let k = -2; k <= 2; k++) R.linea(cx + k * Math.round(rx / 2.5), cy - ry - 1, cx + k * Math.round(rx / 2.2), cy - ry - 3, K);
  const bh = Math.max(2, Math.round(h * 0.18)); R.rect(x0 + 2, cy - Math.floor(bh / 2), x0 + w - 2, cy + Math.ceil(bh / 2) - 1, hex('#2a2a36'));
  R.rect(x0 + 2, cy - Math.floor(bh / 2), x0 + w - 2, cy - Math.floor(bh / 2), hex('#4a4a5a'));
  R.linea(x0 + w - 3, cy + 1, x0 + w - 1, cy + 4, hex('#2a2a36')); R.linea(x0 + w - 4, cy + 1, x0 + w - 5, cy + 4, hex('#2a2a36'));
};

const a = (f) => en('aviso', f);
const Q2 = a(0.2659), Q3 = a(0.6943);
const aviso = a(0.007), dos = a(0.1256), libro1 = a(0.2659), libro2 = a(0.3317), leer = a(0.4903), guarda = a(0.5756), puente = a(0.7368), vuelve = a(0.8934), fin = a(0.9712);
// 1 · el estudio entero
const q1 = (t) => {
  const pizarra = (R, t, [x0, y0, x1, y1]) => {
    const u = tramo(t, dos, dos + 0.6), tiza = hex('#e8f0e0');
    if (u > 0) R.numero('2', x0 + 20, y0 + 30, { tam: 16, centro: true, n: Math.ceil(u * 20), color: tiza });
    const v = tramo(t, dos + 0.6, dos + 1.6);
    for (const [bx, gr] of [[x0 + 40, 7], [x0 + 58, 11]]) { const L = [[bx, y1 - 14, bx + gr, y1 - 14], [bx + gr, y1 - 14, bx + gr, y1 - 40], [bx + gr, y1 - 40, bx, y1 - 40], [bx, y1 - 40, bx, y1 - 14], [bx + 2, y1 - 36, bx + gr - 2, y1 - 36]];
      const n = Math.floor(v * 5 * (gr === 7 ? 1 : 1)); for (let k = 0; k < Math.min(5, n); k++) R.linea(...L[k], tiza); }
    if (v >= 1) { R.disco(x0 + 62, y1 - 26, 3, hex('#f8d870')); R.disco(x0 + 62, y1 - 26, 1, hex('#2a4a3a')); }
  };
  const o = { pizarra };
  const ge = T.estudio(R, t, o);
  const ida = tramo(t, 0.05, dos - 0.2), x = Math.round(lerp(64, 132, ease(ida)));
  const alza = tramo(t, aviso, aviso + 0.25), escribe = t > dos - 0.1 && t < dos + 1.8;
  const r = T.AT.atom(R, x, 160, t, { s: 2, dir: 1, pose: ida > 0 && ida < 1 ? 'camina' : escribe ? 'senala' : 'sostiene', cara: t < aviso + 0.6 ? 'sorpresa' : 'sonrisa', habla: voz(t) });
  if (!escribe && r?.mano) { const [mx, my] = r.mano.map(Math.round), cy = Math.round(my - 26 - alza * 8); R.rect(mx - 1, cy + 20, mx, my, hex('#7a5230')); cartel(mx - 14, cy, 30, 22); }
  if (escribe) { R.rect(112, 146, 113, 160, hex('#7a5230')); cartel(100, 132, 26, 18); if (r?.mano) { const [mx, my] = r.mano.map(Math.round); R.rect(mx, my - 3, mx + 1, my, hex('#f4f4ee')); } }
  T.estudioDelante(R, t, o);
};
// 2 · la mesa de cerca: los dos libros gordos
const LIBRO = (x, yb, w, h, tapa, lomo, sim, abre = 0) => {
  // un libro gordo tumbado, en tres cuartos: el lomo de frente (con bandas de oro y su emblema), la tapa arriba en
  // escorzo y el canto de las hojas a la derecha; abre 0–1 levanta la tapa y deja ver las hojas
  const d = 7, T0 = hex(tapa), L0 = hex(lomo), CL = mez(T0, hex('#ffffff'), 0.25), OR = hex('#f0c050');
  // el canto de las hojas (derecha)
  for (let i = 0; i <= d; i++) for (let y = yb - h - i; y <= yb - i; y++) R.pset(x + w + 1 + i, y, (y - yb) % 2 === 0 ? hex('#d8ccb0') : hex('#f4ecd6'));
  for (let i = 0; i <= d; i++) { R.pset(x + w + 1 + i, yb - i + 1, K); R.pset(x + w + 1 + i, yb - h - i - 1, K); } R.linea(x + w + d + 2, yb - h - d, x + w + d + 2, yb - d, K);
  // la tapa de arriba (o las hojas si está abierta)
  const sube = Math.round(abre * 16);
  for (let i = 0; i <= d; i++) R.linea(x + i, yb - h - i, x + w + i, yb - h - i, abre > 0 ? hex('#f4ecd6') : i === d ? CL : T0);
  R.linea(x, yb - h, x + d, yb - h - d, K); R.linea(x + d, yb - h - d - 1, x + w + d + 1, yb - h - d - 1, K);
  if (abre > 0) { for (let i = 0; i <= d; i++) R.linea(x + i, yb - h - i - Math.round(sube * i / d), x + w + i, yb - h - i - Math.round(sube * i / d), i === d ? CL : T0);
    R.linea(x + d, yb - h - d - sube - 1, x + w + d, yb - h - d - sube - 1, K); for (let k = 0; k < 3; k++) R.pset(x + 10 + k * 14, yb - h - 3, hex('#fff8d0')); }
  // el lomo de frente
  R.rect(x, yb - h, x + w, yb, K); R.rect(x + 1, yb - h + 1, x + w - 1, yb - 1, L0); R.rect(x + 1, yb - h + 1, x + w - 1, yb - h + 1, mez(L0, hex('#ffffff'), 0.3));
  for (const f of [0.22, 0.78]) { const y = Math.round(yb - h + h * f); R.rect(x + 1, y, x + w - 1, y + 1, OR); R.rect(x + 1, y + 1, x + w - 1, y + 1, hex('#a87a2a')); }
  const cx = x + Math.round(w / 2), cy = yb - Math.round(h / 2);
  if (sim === 'gemelos') { R.disco(cx - 4, cy, 2, OR); R.disco(cx + 4, cy, 2, OR); R.pset(cx - 4, cy, L0); R.pset(cx + 4, cy, L0); }
  else { for (let a = 0; a < 20; a++) { const an = a / 20 * Math.PI * 2; R.pset(Math.round(cx + Math.cos(an) * 4), Math.round(cy + Math.sin(an) * 3), OR); } R.disco(cx, cy, 1, hex('#3a7ad8')); }
};
const q2 = (t) => {
  const pizarra = (R, t, [x0, y0, x1, y1]) => { const tiza = hex('#e8f0e0'); R.numero('2', x0 + 18, y1 - 2, { color: tiza });
    for (const [bx, gr] of [[x0 + 36, 7], [x0 + 52, 11]]) { R.linea(bx, y1 - 2, bx + gr, y1 - 2, tiza); R.linea(bx, y1 - 2, bx, y1 - 14, tiza); R.linea(bx + gr, y1 - 2, bx + gr, y1 - 14, tiza); R.linea(bx, y1 - 14, bx + gr, y1 - 14, tiza); } };
  const o = { camara: 'mesa', pizarra };
  T.estudio(R, t, o);
  // los libros caen: el primero en «Children of Dune», el segundo (más gordo) encima en «God Emperor»
  const c1 = tramo(t, libro1 - 0.25, libro1 + 0.05), c2 = tramo(t, libro2 - 0.25, libro2 + 0.05);
  const bota = (c, t0) => c >= 1 ? Math.round(Math.max(0, Math.sin((t - t0) * 18) * 3 * Math.exp(-(t - t0) * 6))) : 0;
  const y1 = Math.round(lerp(-30, 146, c1 * c1)) - bota(c1, libro1 + 0.05);
  const abre = tramo(t, leer, leer + 0.4) - tramo(t, guarda - 0.4, guarda - 0.1);
  if (c1 > 0) LIBRO(112, y1, 50, 16, '#d8a860', '#9a4a2a', 'gemelos');
  const y2 = Math.round(lerp(-40, y1 - 17, c2 * c2)) - bota(c2, libro2 + 0.05);
  if (c2 > 0) LIBRO(110, y2, 54, 22, '#3a7a4a', '#1e4a2e', 'anillo', abre);
  // el polvo al caer
  for (const [c, t0, yy] of [[c1, libro1 + 0.05, 146], [c2, libro2 + 0.05, 130]]) if (c >= 1 && t - t0 < 0.6) { const u = (t - t0) / 0.6; for (let k = 0; k < 8; k++) { const x = Math.round(140 + (k - 3.5) * (8 + u * 14)), y = Math.round(yy - u * 6 - (k % 2) * 2); R.pset(x, y, mez(R.pget(x, y), hex('#f8f0e0'), 0.7 - u * 0.6)); } }
  // Atom: respingo con el segundo libro; levanta la tapa y mira; deja el cartel encima y guiña
  const resp = t > libro2 + 0.05 && t < libro2 + 0.5 ? Math.round(Math.abs(Math.sin((t - libro2) * 12)) * 6) : 0;
  const va = tramo(t, leer - 0.5, leer), ax = Math.round(lerp(206, 190, ease(va)));
  const conCartel = t > guarda - 0.6 && t < guarda + 0.2, puesto = t >= guarda + 0.2;
  const r = T.AT.atom(R, ax, 150 - resp, t, { s: 2, dir: -1, pose: va > 0 && va < 1 ? 'camina' : conCartel ? 'sostiene' : t > leer && t < guarda - 0.6 ? 'piensa' : puesto ? 'senala' : 'quieto',
    cara: resp > 0 || (t > libro2 && t < libro2 + 1) ? 'sorpresa' : t > guarda + 0.8 ? 'guino' : t > leer && t < guarda ? 'normal' : 'sonrisa', habla: voz(t) });
  if (conCartel && r?.mano) { const [mx, my] = r.mano.map(Math.round); cartel(mx - 30, my - 20, 30, 22); }
  if (puesto) { const s = t - guarda - 0.2, dy = Math.round(Math.max(0, 6 - s * 30)); cartel(124, y2 - 22 - 26 - 6 - dy, 34, 24); }
  T.estudioDelante(R, t, o);
};
// 3 · la pizarra de cerca: el puente
const PIZ = [18, 22, 266, 146];
const fondoPizarra = () => capa('pizarra', () => {
  // la pared de ladrillo
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) { const f = Math.floor(y / 7), j = (y % 7 === 0) || ((x + (f % 2) * 8) % 16 === 0);
    R.pset(x, y, j ? hex('#2a1a1a') : tono(pal('#4a2622', '#5e322a', '#7a4232', '#8e5238'), 1.4 + hh(Math.floor((x + (f % 2) * 8) / 16), f) * 1.4 + hh(x, y) * 0.4 - (x > 268 && y < 50 ? 0.4 : 0), x, y)); }
  // el marco de roble y la pizarra verde con restos de borrador
  const [x0, y0, x1, y1] = PIZ;
  for (let y = y0 - 6; y <= y1 + 6; y++) for (let x = x0 - 6; x <= x1 + 6; x++) { const borde = x < x0 || x > x1 || y < y0 || y > y1;
    if (borde) R.pset(x, y, (x === x0 - 6 || x === x1 + 6 || y === y0 - 6 || y === y1 + 6) ? K : tono(pal('#5a3418', '#7a4a22', '#9a6430', '#c08448'), 1.6 + Math.sin(x * 0.9 + y * 0.15) * 0.6 + (y < y0 ? 0.8 : 0) - (x > x1 ? 0.6 : 0), x, y));
    else { const borra = Math.sin(x * 0.07 + y * 0.03) * Math.sin(y * 0.11 - x * 0.02) > 0.45; R.pset(x, y, tono(pal('#1a3226', '#22402e', '#2c4e38', '#3a5e46'), 1.3 + (borra ? 0.9 : 0) + hh(x >> 1, y >> 1) * 0.5, x, y)); } }
  // fantasmas de dibujos borrados (círculos, una flecha, rayitas de cuenta) y una regla apoyada
  const fant = hex('#4a6a56');
  for (let i = 0; i < 60; i++) { const an = i / 60 * Math.PI * 2; if (i % 7 < 5) R.pset(Math.round(62 + Math.cos(an) * 16), Math.round(48 + Math.sin(an) * 13), fant); }
  for (let i = 0; i < 40; i++) { const an = i / 40 * Math.PI * 2; if (i % 5 < 3) R.pset(Math.round(214 + Math.cos(an) * 10), Math.round(118 + Math.sin(an) * 10), fant); }
  for (let k = 0; k < 6; k++) R.linea(196 + k * 4, 32, 197 + k * 4, 40, fant); R.linea(194, 38, 220, 34, fant);
  R.linea(30, 132, 80, 128, fant); R.linea(80, 128, 76, 125, fant); R.linea(80, 128, 76, 131, fant);
  for (let y = 60; y <= 146; y++) { R.pset(262 - Math.round((y - 60) * 0.06), y, hex('#d8b868')); R.pset(263 - Math.round((y - 60) * 0.06), y, (y % 6 === 0) ? K : hex('#b8984a')); }
  // la repisa con tizas y borrador
  for (let y = y1 + 7; y <= y1 + 11; y++) for (let x = x0 - 10; x <= x1 + 10; x++) R.pset(x, y, y === y1 + 11 ? K : tono(pal('#5a3418', '#7a4a22', '#9a6430', '#c08448'), y === y1 + 7 ? 3 : 1.6, x, y));
  [[40, '#f4f4ee'], [52, '#f8d870'], [60, '#f0a0b8'], [70, '#a8d8f0']].forEach(([x, c]) => R.rect(x, y1 + 5, x + 7, y1 + 6, hex(c)));
  R.rect(220, y1 + 2, 240, y1 + 6, K); R.rect(221, y1 + 3, 239, y1 + 4, hex('#c8a878')); R.rect(221, y1 + 5, 239, y1 + 5, hex('#3a3a46'));
  // una hoja clavada con una chincheta y su dibujo (un sol) y el polvo de tiza en la repisa
  R.rect(232, 30, 256, 56, K); R.rect(233, 31, 255, 55, hex('#f4ecd8')); R.disco(244, 31, 1, hex('#e83a3a')); R.disco(244, 44, 4, hex('#f0c050'));
  for (let k = 0; k < 30; k++) R.pset(30 + Math.round(hh(k, 1, 4) * 230), y1 + 6 - (k % 2), hex('#d8dcd0'));
});
const q3 = (t) => {
  R.copiar(fondoPizarra());
  const tiza = hex('#eef2e8'), am = hex('#f8d870'), ro = hex('#f0a0b8');
  R.recorte(PIZ);
  // el puente: tablero y pilas, luego los cinco arcos, el río y el carro
  const u1 = tramo(t, puente - 0.1, puente + 0.6), u2 = tramo(t, puente + 0.5, puente + 1.4), u3 = tramo(t, puente + 1.3, puente + 1.8), u4 = tramo(t, puente + 1.8, vuelve - 0.2);
  let cursor = null;
  if (u1 > 0) { const xe = Math.round(lerp(48, 232, u1)); R.linea(48, 66, xe, 66, tiza); R.linea(48, 60, xe, 60, tiza); for (let x = 52; x < xe; x += 6) R.linea(x, 60, x, 66, tiza); cursor = [xe, 64]; }
  const C5 = [66, 103, 140, 177, 214];
  if (u2 > 0) for (let k = 0; k < 5; k++) { const v = Math.max(0, Math.min(1, u2 * 5 - k)); if (v <= 0) continue; const cx = C5[k];
    for (let i = 0; i <= 24 * v; i++) { const an = Math.PI + i / 24 * Math.PI; R.pset(Math.round(cx + Math.cos(an) * 16), Math.round(92 + Math.sin(an) * 18), tiza); }
    R.linea(cx - 16, 92, cx - 16, 116, tiza); if (v >= 1) R.linea(cx + 16, 92, cx + 16, 116, tiza); cursor = [cx + 16, 92]; }
  if (u3 > 0) for (let k = 0; k < Math.round(u3 * 9); k++) { const x = 44 + k * 22; R.linea(x, 120, x + 5, 118, hex('#a8d8f0')); R.linea(x + 5, 118, x + 10, 120, hex('#a8d8f0')); cursor = [x + 10, 120]; }
  if (u4 > 0) { const n = Math.round(u4 * 4), cx = 140; const L = [[cx - 14, 58, cx + 12, 58], [cx - 14, 58, cx - 12, 52], [cx - 12, 52, cx + 8, 50], [cx + 8, 50, cx + 12, 44]]; for (let k = 0; k < n; k++) R.linea(...L[k], tiza); if (u4 >= 1) { R.disco(cx + 13, 42, 3, tiza); R.pset(cx + 12, 42, hex('#3a7ad8')); R.pset(cx + 14, 42, hex('#3a7ad8')); } cursor = [cx + 12, 44]; }
  // la flecha que vuelve en «coming back» y el círculo en «end»
  const u5 = tramo(t, vuelve - 0.1, vuelve + 0.7), u6 = tramo(t, fin - 0.3, fin + 0.3);
  if (u5 > 0) { for (let i = 0; i <= 40 * u5; i++) { const an = -0.4 + i / 40 * 4.6; R.pset(Math.round(250 - 4 + Math.cos(an) * 12), Math.round(84 + Math.sin(an) * 22), am); } if (u5 >= 1) { R.linea(236, 104, 232, 98, am); R.linea(236, 104, 242, 102, am); } cursor = [236, 104]; }
  if (u6 > 0) { for (let i = 0; i <= 80 * u6; i++) { const an = i / 80 * Math.PI * 2 - 1.6; R.pset(Math.round(140 + Math.cos(an) * 112), Math.round(88 + Math.sin(an) * 50), ro); } }
  R.recorte(null);
  // el polvo de tiza que cae del trazo
  if (cursor && t < fin) for (let k = 0; k < 5; k++) { const u = ((t * 2 + k / 5) % 1); R.pset(cursor[0] + (k % 3) - 1, Math.round(cursor[1] + u * 14), mez(R.pget(cursor[0], cursor[1] + Math.round(u * 14)), tiza, 0.6 - u * 0.5)); }
  // Atom, al doble, delante de la pizarra con la tiza: dibuja, luego señala y guiña
  const r = T.AT.atom(R, 292, 170, t, { s: 2, dir: -1, pose: t > fin - 0.2 ? 'senala' : t > puente - 0.2 && t < vuelve + 0.8 ? 'senala' : 'quieto', cara: t > fin ? 'guino' : t > vuelve ? 'sonrisa' : 'normal', habla: voz(t) });
  if (r?.mano && t < fin - 0.2) { const [mx, my] = r.mano.map(Math.round); R.rect(mx - 3, my - 1, mx, my, hex('#f4f4ee')); }
};
const efectos = [[aviso, 'aviso'], [0.1, 'puerta'], [dos, 'lapiz'], [libro1 + 0.05, 'toc'], [libro2 + 0.05, 'golpecito'], [leer, 'papel'], [guarda + 0.2, 'toc'], [puente, 'lapiz'], [vuelve, 'lapiz'], [fin - 0.2, 'brillo']];
T.rodar(E, R, [[0, q1], [Q2, q2], [Q3, q3]], { efectos });
