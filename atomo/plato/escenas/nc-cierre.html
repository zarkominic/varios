// NC-CIERRE (frase 27), sin cartela, 2026. Dos planos:

import * as T from '/atomo/plato/escenas/nc-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';

const { E, R, M } = await T.preparar('nc-cierre');

const en = (k, f) => T.momento(M, k, f);
const PZ = T.PIEZAS_NC;
const K = hex('#140f1a'), BL = hex('#fbf6ea'), BS = hex('#c8c0b0'), BLX = hex('#ffffff');
const rp = (...a) => a.map((s) => hex(s));
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };

  return (0xff000000 | (Math.round(b + (b2 - b) * a) << 16) | (Math.round(g + (g2 - g) * a) << 8) | Math.round(r + (r2 - r) * a)) >>> 0; };
const lin = (t, a0, a1) => Math.max(0, Math.min(1, (t - a0) / Math.max(1e-6, a1 - a0)));

// pinta el cerebro en (x0, y0); clip [x0, y0, x1, y1] opcional (se respeta a mano)

  R.rect(x0 + 2, y1 - 1, x1 - 1, y1 - 1, ORO[1]); R.rect(x1 - 1, y0 + 2, x1 - 1, y1 - 1, ORO[1]); R.rect(x0 + 2, y0 + 2, x1 - 2, y1 - 2, ORO[0]);

const CREP = rp('#2a2050', '#4a2c6a', '#8a3c74', '#d0606a', '#f09060', '#f8c080');

  // la feria al anochecer: la noria que gira, la carpa de rayas y la guirnalda de bombillas

    for (let k = 0; k < 6; k++) if (Math.sin(t * 3 + k * 2) > 0) R.pset(X + Math.round(hh(k, 1, 5) * W), Y + Math.round(hh(k, 2, 5) * H * 0.3), BL);
