<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El error de Colón · ep4</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// EP4-TAMANO (frases 30–32).
//  pequena  en la sala de los sabios, el globo encoge entre las manos de Colón; los sabios niegan con la cabeza.
//  japon    el mapa de Colón: Canarias a la derecha y Japón muy cerca, a la izquierda, con una ruta corta; luego el
//           mapa real se estira: Japón se va lejos y la ruta crece. «×4» en la caja.
//  suerte   de noche, en la niebla, las carabelas van hacia el oeste y de la niebla sale una costa enorme: casi chocan.
import { escena } from '/atomo/plato/escena.js';
import { crearAventura, PALA, ELENCO } from '/atomo/plato/kits/pixel-aventura.js';
const E = await escena('ep4-tamano', 'ep04');
const R = await crearAventura(document.getElementById('lienzo'));
const { PAL, tramo, lerp, sale } = R;
const M = (k, d) => E.marca(k, d);
const m = { pequena: M('pequena', 0.5), japon: M('japon', 4.5), suerte: M('suerte', 11.5) };
const real = (E.marca('japon_fin', m.japon + 6) + m.japon) / 2;

const encoge = (t) => {
  R.interior(t, { luces: [[160, 50]], suelo: 140, radio: 170 });
  R.estandarte(36, 16, 14, 44, PALA.ROJO, t); R.estandarte(270, 16, 14, 44, PALA.AZUL, t);
  R.vela(110, 70, t); R.vela(210, 70, t);
  const r = lerp(30, 16, tramo(t, m.pequena + 0.6, m.pequena + 2.2));
  R.globo(160, 86, r, 60 + t * 20, { pergamino: true, meridianos: true });
  R.personaje(124, 152, 48, { ...ELENCO.colon, t, pose: 'ofrece', habla: 1 });
  const niega = t > m.pequena + 1.6 ? Math.round(Math.sin(t * 9)) : 0;
  R.personaje(220, 152, 46, { ...ELENCO.sabio2, t, dir: niega > 0 ? 1 : -1, ceño: true });
  R.personaje(252, 152, 44, { ...ELENCO.sabio1, t, dir: niega < 0 ? 1 : -1, ceño: true, pose: 'manos_cintura' });
};
const mapa = (t) => {
  R.mesa(t, { luz: [260, 20] });
  R.pergamino(14, 22, 306, 146, { luz: [260, 20], semilla: 19 });
  // el estiramiento: Japón pasa de cerca (x = 196) a lejos (x = 34)
  const s = tramo(t, real, real + 1.8);
  const canX = 262, japX = lerp(196, 34, s);
  // Europa y África a la derecha
  R.costa([[306, 40], [286, 46], [276, 60], [280, 76], [290, 80], [272, 92], [270, 112], [284, 140], [306, 140]], { tierra: 2.4 });
  R.disco(canX + 0.5, 104.5, 2, PAL.PERG[1]); R.pset(canX + 4, 106, PAL.PERG[1]);
  // Japón
  R.costa([[japX - 6, 74], [japX - 2, 66], [japX + 4, 60], [japX + 6, 64], [japX + 2, 72], [japX - 2, 80], [japX - 6, 84]], { tierra: 2.4 });
  // la ruta de Colón (punteada) y la carabela
  R.linea(canX - 4, 102, japX + 6, 74, PAL.ROJO, 4);
  const b = (t * 0.25) % 1;
  R.barco(lerp(canX - 8, japX + 14, b), lerp(102, 76, b) + 3, t, { tipo: 'carabela', esc: 0.3, dir: -1, espuma: false, bob: 0.3 });
  R.rosa(60, 120, 10);
};
const costaNiebla = (t) => {
  R.cielo(t, { hor: 118, semilla: 31, nubes: { bandas: [[60, 12, 1]], densidad: 0.1 } });
  R.mar(t, { hor: 118 });
  // la costa sale de la niebla a la izquierda
  const sale_ = tramo(t, m.suerte + 0.6, m.suerte + 2.4);
  const x1 = lerp(-40, 110, sale_);
  R.poligono([[-10, 128], [-10, 70], [x1 - 70, 76], [x1 - 40, 86], [x1 - 10, 96], [x1, 112], [x1 + 6, 128]], PAL.FGC[2]);
  for (let k = 0; k < 6; k++) R.pset(x1 - 60 + k * 9, 84 + (k % 2) * 5, PAL.FGC[4]);
  R.niebla(t, 70, 132, 1.3, 7);
  const frena = tramo(t, m.suerte + 1.2, m.suerte + 3.2);
  const dx = lerp(0, -40, sale(frena));
  R.barco(200 + dx, 138, t, { tipo: 'carabela', esc: 1, dir: -1, farol: false });
  R.barco(260 + dx * 0.8, 130, t, { tipo: 'carabela', esc: 0.7, dir: -1, fase: 1.4 });
};

E.iniciar((t) => {
  R.secuencia(t, [[0, encoge], [m.japon - 0.2, mapa], [m.suerte - 0.2, costaNiebla]]);
  const e = E.energia(t);
  R.caja(t, t > real && t < m.suerte - 0.2 ? tramo(t, real + 1.6, real + 2) : 0, (x, y) => R.numero('×4', x + 6, y + 12), { energia: e });
  R.companero(t, e);
  R.presentar();
});
</script>
</body>
</html>
