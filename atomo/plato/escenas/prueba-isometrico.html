// Prueba de identidad visual · ISOMÉTRICO (low-poly pastel sobre rejilla oscura, 30 fps).
// Los mismos 12 s que el resto de estilos (atomo/plato/prueba-identidad/ENCARGO.md):
//  0        persona low-poly sobre su peana, regla de potencias de diez a la derecha, Atom junto al hombro
//  hola     Atom da un bote · atom: crece, se enciende (halo y onda) y sus electrones aceleran
//  bloques  tres átomos llegan con su varilla y encajan: una molécula · explico: aparece una pizarrita «?»
//  escuela  la pizarrita gira y enseña «!»
//  saltos → pelo  cuatro saltos ×10 con visor: se abre un recuadro en el punto del zoom con el nivel
//           siguiente (mano → bloque de piel con vello → un pelo saliendo de su folículo → el pelo
//           como un tronco con su cutícula); el marcador de la regla baja 10⁰ → 10⁻⁴ m
//  decima → milimetro  cota de lado a lado del pelo con «10⁻⁴ m» · después todo queda quieto
// Cada nivel es su propia escena 3D (sin problemas de precisión); la cámara isométrica se encuadra en
// cada una. El renderizado es propio (el del kit más una pasada recortada para el visor del salto).
import { escena } from '/atomo/plato/escena.js';
import * as K from '/atomo/plato/kits/isometrico.js';
const { THREE, P, S, vR, vU, vW, vF, Y, seg, eio, eo, ei, eob, sstep, clamp01, lerp, lam, basic, prng } = K;
const TAU = Math.PI * 2, PI = Math.PI;

const E = await escena('prueba-isometrico', 'prueba');
const M = (n) => E.marca(n);
await K.cargarFuentes();

// ---------------------------------------------------------------- tiempos
const m = {
  hola: M('hola'), atom: M('atom'), bloques: M('bloques'), explico: M('explico'), escuela: M('escuela'),
  saltos: M('saltos'), pelo: M('pelo'), decima: M('decima'), milimetro: M('milimetro'),
};
const QUIETO = E.duracion - 0.6;
const JS = (m.pelo - m.saltos) * 0.8 / 4;
const SALTO = [0, 1, 2, 3].map((k) => { const a = m.saltos + k * (m.pelo - m.saltos - JS) / 3; return [a, a + JS]; });
function calma(t, t1 = QUIETO, d = 0.9) { const a = t1 - d; if (t <= a) return t; const u = Math.min(t - a, d); return a + u - (u * u) / (2 * d); }
// tiempo «del átomo»: corre más deprisa en «atom» (electrones acelerados) y se para al final
const DT = 1 / 240, TA = [0];
const velA = (t) => (1 + 2.6 * eio(seg(t, m.atom - 0.25, m.atom)) * (1 - eio(seg(t, m.atom + 0.8, m.atom + 1.7)))) * (1 - eio(seg(t, QUIETO - 0.9, QUIETO)));
for (let i = 1; i * DT <= E.duracion + 0.2; i++) TA.push(TA[i - 1] + velA((i - 0.5) * DT) * DT);
const tAtomo = (t) => { const x = t / DT, i = Math.min(TA.length - 2, Math.floor(x)); return lerp(TA[i], TA[i + 1], x - i); };

// ---------------------------------------------------------------- plató y escenas por nivel
const plato = K.crearPlato({ centro: [0.46, 0.5], estrellas: 90, libre: [[1540, 100, 1800, 940]] });
const R = plato.renderer, cam = plato.camera;
function nuevaEscena() {
  const sc = new THREE.Scene();
  sc.add(new THREE.HemisphereLight('#ece8ff', '#2d2b58', 2.25));
  const sun = new THREE.DirectionalLight('#fff4e6', 2.45); sun.position.set(0.55, 1, 0.1).multiplyScalar(1000); sc.add(sun);
  return sc;
}
const NIV = [0, 1, 2, 3, 4].map(() => ({ scene: nuevaEscena(), T: new THREE.Vector3(), F: new THREE.Vector3() }));
const COL = {
  jersey: '#ee8778', jerseyD: '#d9705f', jerseyDD: '#c25f58', pelo: '#9a6650', peloD: '#7c4e3d', peloL: '#b88468',
  piel: P.skin, pielD: '#e8b9a0', una: '#fae6dc', epi: '#f7d3bd', dermis: '#f2aa98', grasa: '#f4d9a0',
};

// ---------------------------------------------------------------- utilidades 3D
// tubo que se afina a lo largo de una polilínea (pelos)
function tubo(pts, r0, r1, radial = 6) {
  const n = pts.length, pos = [], idx = [];
  const t = new THREE.Vector3(), nx = new THREE.Vector3(), ny = new THREE.Vector3(), aux = new THREE.Vector3();
  for (let i = 0; i < n; i++) {
    t.subVectors(pts[Math.min(n - 1, i + 1)], pts[Math.max(0, i - 1)]).normalize();
    aux.set(0, 0, 1); if (Math.abs(t.z) > 0.9) aux.set(1, 0, 0);
    nx.crossVectors(t, aux).normalize(); ny.crossVectors(t, nx).normalize();
    const r = lerp(r0, r1, Math.pow(i / (n - 1), 0.85));
    for (let j = 0; j < radial; j++) {
      const a = j / radial * TAU, c = Math.cos(a) * r, s = Math.sin(a) * r;
      pos.push(pts[i].x + nx.x * c + ny.x * s, pts[i].y + nx.y * c + ny.y * s, pts[i].z + nx.z * c + ny.z * s);
    }
  }
  for (let i = 0; i < n - 1; i++) for (let j = 0; j < radial; j++) {
    const a = i * radial + j, b = i * radial + (j + 1) % radial, c = a + radial, d = b + radial;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  return g;
}
const curva = (a, b, c, n = 10) => { const q = new THREE.QuadraticBezierCurve3(a, b, c); return q.getPoints(n); };
function varilla(mat) {   // cilindro unitario que se coloca entre dos puntos
  const geo = new THREE.CylinderGeometry(1, 1, 1, 7); geo.translate(0, 0.5, 0);
  const m = new THREE.Mesh(geo, mat);
  m.poner = (a, b, r) => {
    const d = new THREE.Vector3().subVectors(b, a), L = d.length();
    m.visible = L > 0.5 && r > 0.01; if (!m.visible) return;
    m.position.copy(a); m.quaternion.setFromUnitVectors(Y, d.normalize()); m.scale.set(r, L, r);
  };
  return m;
}
function texturaLienzo(w, h, dibujar) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  dibujar(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const marcarAO = (g, k, s) => K.bakeAO(g, k, s);

// =====================================================================================
// LA MANO (nivel 1 a tamaño real; en la persona, la misma a 1/10)
// =====================================================================================
function crearMano({ manga = true, vello = true } = {}) {
  const g = new THREE.Group();
  const mPiel = lam(COL.piel), mPielD = lam(COL.pielD), mUna = lam(COL.una);
  // dorso: rectángulo redondeado extruido
  const sh = new THREE.Shape(); const w = 330, h = 300, r = 80;
  sh.moveTo(-w / 2 + r, -h / 2); sh.lineTo(w / 2 - r, -h / 2); sh.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
  sh.lineTo(w / 2 - 6, h / 2 - r); sh.quadraticCurveTo(w / 2 - 10, h / 2, w / 2 - r, h / 2); sh.lineTo(-w / 2 + r, h / 2);
  sh.quadraticCurveTo(-w / 2 + 10, h / 2, -w / 2 + 6, h / 2 - r); sh.lineTo(-w / 2, -h / 2 + r); sh.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
  const palmaG = new THREE.ExtrudeGeometry(sh, { depth: 70, bevelEnabled: true, bevelThickness: 16, bevelSize: 16, bevelSegments: 2, curveSegments: 4 });
  palmaG.translate(0, 20, -35);
  g.add(new THREE.Mesh(palmaG, mPiel));
  // dedos (cápsulas) con uña
  const dedos = [[-118, 37, 262, 0.05], [-40, 39, 300, 0.015], [40, 37, 280, -0.02], [116, 32, 214, -0.07]];
  for (const [x, rr, L, a] of dedos) {
    const piv = new THREE.Group(); piv.position.set(x, -96, 0); piv.rotation.z = a; g.add(piv);
    const d = new THREE.Mesh(new THREE.CapsuleGeometry(rr, L, 3, 7), x > 100 ? mPielD : mPiel); d.position.y = -L / 2 - 10; piv.add(d);
    const una = new THREE.Mesh(new THREE.CapsuleGeometry(rr * 0.55, rr * 0.7, 2, 6), mUna); una.scale.z = 0.35;
    una.position.set(0, -L - 10 - rr * 0.1, rr * 0.86); piv.add(una);
    for (const k of [0.36, 0.66]) {   // pliegues de los nudillos
      const p = new THREE.Mesh(new THREE.TorusGeometry(rr * 0.5, 2.2, 3, 8, PI * 0.8), basic('#d79e85'));
      p.position.set(0, -10 - L * k, rr * 0.97); p.rotation.z = PI * 1.1; piv.add(p);
    }
    const nud = new THREE.Mesh(new THREE.IcosahedronGeometry(rr * 0.7, 1), mPiel); nud.position.set(0, -2, 34); nud.scale.set(1, 0.7, 0.6); piv.add(nud);
  }
  // pulgar
  const pul = new THREE.Group(); pul.position.set(-150, 40, 0); pul.rotation.z = -0.68; g.add(pul);
  const pd = new THREE.Mesh(new THREE.CapsuleGeometry(40, 190, 3, 7), mPielD); pd.position.y = -110; pul.add(pd);
  const pu = new THREE.Mesh(new THREE.CapsuleGeometry(22, 26, 2, 6), mUna); pu.scale.z = 0.35; pu.position.set(0, -200, 34); pul.add(pu);
  // muñeca y manga
  const mun = new THREE.Mesh(new THREE.CylinderGeometry(138, 148, 120, 9), mPiel); mun.scale.z = 0.5; mun.position.y = 200; g.add(mun);
  if (manga) {
    const mg = new THREE.Mesh(new THREE.CylinderGeometry(178, 172, 1700, 10), lam(COL.jersey)); mg.scale.z = 0.72; mg.position.y = 1130; g.add(mg);
    const pn = new THREE.Mesh(new THREE.CylinderGeometry(186, 186, 130, 26), lam(COL.jerseyD)); pn.scale.z = 0.76; pn.position.y = 300; g.add(pn);
  }
  if (vello) {
    const rnd = prng(31), mPelo = lam(COL.pelo, { side: THREE.DoubleSide });
    for (let i = 0; i < 26; i++) {
      const x = -140 + rnd() * 280, y = -100 + rnd() * 250, L = 55 + rnd() * 45, a = -0.5 + rnd() * 0.5;
      if (Math.hypot(x - 30, y - 40) < 34) continue;
      const p0 = new THREE.Vector3(x, y, 52), p2 = new THREE.Vector3(x + Math.sin(a) * L, y - Math.cos(a) * L, 60 + rnd() * 10);
      const p1 = p0.clone().lerp(p2, 0.5).add(new THREE.Vector3(0, 0, 12));
      g.add(new THREE.Mesh(tubo(curva(p0, p1, p2, 6), 2.6, 0.6, 4), mPelo));
    }
    const p0 = new THREE.Vector3(30, 40, 52);
    g.add(new THREE.Mesh(tubo(curva(p0, new THREE.Vector3(32, 10, 66), new THREE.Vector3(34, -26, 74), 6), 3, 1.2, 4), mPelo));
  }
  return g;
}

const N0 = NIV[0];
const suelo0 = K.crearSuelo({ scene: N0.scene }, { y: -300, centro: [940, 840], radio: 1350 });

  const mP = lam(P.pants), mS = lam(P.shoe), mJ = lam(COL.jersey), mJD = lam(COL.jerseyD), mJDD = lam(COL.jerseyDD), mSk = lam(COL.piel, { emissive: '#3c2622' }), mH = lam(COL.pelo);
  for (const s of [-1, 1]) {

    const shoe = new THREE.Mesh(new THREE.BoxGeometry(7.4, 4, 11), mS); shoe.position.set(s * 4.6, 2, 1.8); cuerpo.add(shoe);
  }
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(10.4, 10.9, 29, 8), mJ); torso.position.y = 48.5; cuerpo.add(torso);
  const bajo = new THREE.Mesh(new THREE.CylinderGeometry(11.2, 11.2, 3.4, 8), mJD); bajo.position.y = 35.6; cuerpo.add(bajo);
  for (let i = -2; i <= 2; i++) {   // rombos del jersey
    const r = new THREE.Mesh(new THREE.OctahedronGeometry(1.5, 0), basic('#f8c3b4')); r.scale.z = 0.25;
    const a = i * 0.32; r.position.set(Math.sin(a) * 10.75, 50, Math.cos(a) * 10.75); r.rotation.y = a; cuerpo.add(r);

  const collar = new THREE.Mesh(new THREE.CylinderGeometry(5.4, 6.8, 2.6, 8), mJD); collar.position.y = 63.4; cuerpo.add(collar);
  const cuello = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 3.6, 4, 7), mSk); cuello.position.y = 65; cuerpo.add(cuello);
  const cabeza = new THREE.Group(); cabeza.position.y = 66; cuerpo.add(cabeza);
  const head = new THREE.Mesh(new THREE.IcosahedronGeometry(9.2, 1), mSk); head.position.y = 8.6; cabeza.add(head);
  const pelo = new THREE.Mesh(new THREE.SphereGeometry(9.9, 9, 5, 0, TAU, 0, PI * 0.5), mH); pelo.position.y = 9.4; pelo.rotation.x = -0.2; cabeza.add(pelo);
  const tupe = new THREE.Mesh(new THREE.IcosahedronGeometry(3.4, 0), mH); tupe.position.set(1.5, 18.4, 3.2); tupe.scale.set(1.3, 0.8, 1); cabeza.add(tupe);
  for (const s of [-1, 1]) { const o = new THREE.Mesh(new THREE.IcosahedronGeometry(2.2, 0), mSk); o.position.set(s * 9.2, 8.4, 0); o.scale.set(0.6, 1, 1); cabeza.add(o); }
  const ojos = [];
  for (const s of [-1, 1]) {
    const e = new THREE.Mesh(new THREE.IcosahedronGeometry(1.35, 1), basic('#2a2748')); e.position.set(s * 3.3, 10.2, 8.4); e.scale.set(1, 1.2, 0.7); cabeza.add(e); ojos.push(e);
    const mj = new THREE.Mesh(new THREE.CircleGeometry(1.25, 10), basic('#f3a497', { transparent: true, opacity: 0.7 })); mj.position.set(s * 5.4, 7, 8.1); mj.rotation.y = s * 0.5; cabeza.add(mj);
  }
  const boca = new THREE.Mesh(new THREE.TorusGeometry(1.7, 0.36, 4, 10, PI * 0.9), basic('#8a4a52')); boca.position.set(0, 5.9, 8.85); boca.rotation.z = PI * 1.05; cabeza.add(boca);
  // brazos: la mano es la del nivel 1 a 1/10
  const brazos = [];
  for (const s of [-1, 1]) {
    const piv = new THREE.Group(); piv.position.set(s * 11.6, 61.2, 0); piv.rotation.z = s * 0.1; cuerpo.add(piv);
    const arm = new THREE.Mesh(new THREE.BoxGeometry(5.8, 22, 6.8), mJD); arm.position.y = -11; piv.add(arm);
    const hom = new THREE.Mesh(new THREE.IcosahedronGeometry(3.2, 1), mJD); hom.position.y = -1.6; hom.scale.set(1, 0.8, 1.05); piv.add(hom);
    const pun = new THREE.Mesh(new THREE.BoxGeometry(6.4, 2.6, 7.4), mJDD); pun.position.y = -21.6; piv.add(pun);
    const mano = crearMano({ manga: false, vello: false }); mano.scale.setScalar(0.1 / u); mano.position.set(0, -23 - 200 * 0.1 / u, 0);

  g.position.copy(PIE); g.rotation.y = PI / 4 + 0.32;
  return { g, cabeza, ojos, brazos, torso };
})();
N0.scene.add(persona.g);
suelo0.sombra(0, PIE.x, PIE.z, 120, 0.35);
N0.scene.updateMatrixWorld(true);
N0.F.copy(persona.brazos[1].mano.localToWorld(new THREE.Vector3(0, 10, 0)));

// pizarrita (dos placas espalda con espalda: «?» delante y «!» detrás)
function caraPizarra(signo) {
  return K.crearPlaca({ ancho: 300, alto: 214, radio: 22, grosor: 10, base: '#2e4b52', lado: '#8fdcc6', res: 768, dibujar(x, w, h) {
    x.fillStyle = '#2b4750'; x.fillRect(0, 0, w, h);
    x.strokeStyle = '#8fdcc6'; x.lineWidth = 10; x.beginPath(); K.roundRectPath(x, 9, 9, w - 18, h - 18, 16); x.stroke();
    x.strokeStyle = 'rgba(245,239,227,0.07)'; x.lineWidth = 16;
    for (let i = 0; i < 4; i++) { x.beginPath(); x.moveTo(30 + i * 60, 50 + i * 30); x.lineTo(110 + i * 50, 40 + i * 34); x.stroke(); }
    x.fillStyle = P.cream; x.font = '700 150px "Space Grotesk"'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(signo, w / 2, h / 2 + 6);

  } });
}
const pizarra = (() => {
  const g = new THREE.Group(), giro = new THREE.Group(); g.add(giro);
  const a = caraPizarra('?'), b = caraPizarra('!');
  a.g.position.z = 5.5; b.g.position.z = -5.5; b.g.rotation.y = PI;
  giro.add(a.g, b.g);
  const halo = K.brillo('#8fdcc6', 0, 520); halo.position.z = -40; g.add(halo);
  K.orientPlaca(g, 0.18);
  g.position.copy(S(1190, 330, 150));
  N0.scene.add(g);

})();
function nivel0(t) {
  // cabeza: mira a Atom, luego a la pizarrita y, antes de saltar, a su mano
  const u1 = eio(seg(t, m.explico - 0.4, m.explico)), u2 = eio(seg(t, m.saltos - 0.8, m.saltos - 0.35));
  persona.cabeza.rotation.y = lerp(lerp(0.12, -0.18, u1), 0.05, u2);
  persona.cabeza.rotation.x = lerp(-0.3, 0.18, u2);

  persona.torso.scale.set(1, 1 + 0.008 * Math.sin(calma(t) * 2.4), 1);
  // pizarrita: aparece en «explico», gira en «escuela»
  const k = eob(seg(t, m.explico - 0.32, m.explico + 0.08), 2.2);
  pizarra.g.visible = k > 0.002;
  pizarra.g.scale.setScalar(Math.max(0.001, k));
  pizarra.g.position.copy(S(1190, 330 + 6 * Math.sin(calma(t) * 1.4), 150));
  const fl = eio(seg(t, m.escuela - 0.26, m.escuela + 0.04)), reb = t > m.escuela + 0.04 ? 0.18 * Math.exp(-5 * (t - m.escuela - 0.04)) * Math.sin(12 * (t - m.escuela - 0.04)) : 0;
  pizarra.giro.rotation.y = PI * fl + reb;
  pizarra.halo.material.opacity = 0.25 * K.latido(t, m.explico, 0.9, 0.2) + 0.32 * K.latido(t, m.escuela, 0.9, 0.15);
}

// =====================================================================================
// NIVEL 2 · PIEL CON VELLO (10⁻² m): bloque de piel cortado, con sus pelos
// =====================================================================================
const N2 = NIV[2];
const B2 = { a: 330, alto: 250 };
const pelos2 = (() => {

{

    const ky = h / H;
    const capas = [[0, 26, COL.epi], [26, 190, COL.dermis], [190, H, COL.grasa]];

  if (capas[1]) {
    const x0 = Math.max(0, ventana[0]), y0 = Math.max(0, ventana[1]), x1 = Math.min(W, ventana[2]), y1 = Math.min(H, ventana[3]);
    if (x1 > x0 && y1 > y0) {
      R.setScissor(vp.x + x0 * s, vp.y + (H - y1) * s, (x1 - x0) * s, (y1 - y0) * s);
      R.render(plato.fondoScene, plato.hudCam); R.clearDepth();
      capas[1].enc(); R.render(capas[1].scene, cam); R.clearDepth();
      R.setScissor(vp.x, vp.y, vp.w, vp.h);
    }
  }
  R.render(plato.fija, plato.camFija); R.clearDepth();
  R.render(plato.hud, plato.hudCam);
}
const pantallaEstatica = (n, P0) => { const d = P0.clone().sub(NIV[n].T); return { x: W / 2 + d.dot(vR), y: H / 2 - d.dot(vU) }; };

// =====================================================================================
// FOTOGRAMA
// =====================================================================================
const animaNivel = [nivel0, () => {}, () => {}, () => {}, nivel4];
function nivel4(t) {
  const yC = 110, a = new THREE.Vector3(0, yC, 0).addScaledVector(vF, R4 + 40), r = R4 + 14;
  const A = a.clone().addScaledVector(vR, -r), B = a.clone().addScaledVector(vR, r);
  const kC = eio(seg(t, m.decima - 0.22, m.milimetro - 0.05)), kT = eob(seg(t, m.decima - 0.25, m.decima), 2);
  cota.poner(A, B, kC, vU, kT);
  const c = pantallaEstatica(4, a), kE = eob(seg(t, m.milimetro - 0.3, m.milimetro + 0.02), 2.2);
  rotCota.poner(c.x, c.y - 70, clamp01(kE * 1.4), Math.max(0.001, kE));
}
function dibujar(t0) {
  const t = Math.min(t0, QUIETO);
  plato.titilar(calma(t));
  fija(t);
  let k = -1, u = 0, n = 0;
  SALTO.forEach(([a, b], i) => { if (t >= b) n = i + 1; if (t >= a && t < b) { k = i; u = (t - a) / (b - a); } });
  if (k < 0) {
    animaNivel[n](t);
    if (n !== 4) rotCota.poner(0, 0, 0, 0);
    visor.poner(null, 0);
    pintar([{ scene: NIV[n].scene, enc: () => plato.encuadre(NIV[n].T, 1) }]);
    return;
  }
  // salto k: el nivel k se acerca a su foco; en el foco se abre un visor con el nivel k+1
  animaNivel[k](t); animaNivel[k + 1](t); rotCota.poner(0, 0, 0, 0);
  const F0 = pantallaEstatica(k, NIV[k].F);
  const pu = eio(clamp01(u / 0.8)), px = lerp(F0.x, W / 2, pu), py = lerp(F0.y, H / 2, pu);
  const w = eio(seg(u, 0.0, 0.62)), sO = Math.pow(10, 0.55 * eio(clamp01(u / 0.7)));
  const sN = lerp(0.3, 1, eob(seg(u, 0.12, 1), 1.6));
  const ancho = lerp(70, 2 * Math.max(px, W - px) + 40, w), alto = ancho * 9 / 16 + lerp(0, 2 * Math.abs(py - H / 2) + 40, w);
  const ventana = [px - ancho / 2, py - alto / 2, px + ancho / 2, py + alto / 2];
  const cubre = ventana[0] <= 0 && ventana[1] <= 0 && ventana[2] >= W && ventana[3] >= H;
  visor.poner(cubre ? null : ventana, 1);
  const viejo = { scene: NIV[k].scene, enc: () => encuadrar(NIV[k].F, px, py, sO) };
  const nuevo = { scene: NIV[k + 1].scene, enc: () => encuadrar(NIV[k + 1].T, px, py, sN) };
  if (cubre) pintar([nuevo]);
  else pintar([viejo, nuevo], ventana);
}
// precalentado: compila los sombreadores de todas las escenas antes del primer fotograma
for (const N of NIV) { plato.encuadre(N.T, 1); R.compile(N.scene, cam); }
R.compile(plato.fija, plato.camFija); R.compile(plato.hud, plato.hudCam);
for (const t of [SALTO[0][0] + JS * 0.4, SALTO[1][0] + JS * 0.4, SALTO[2][0] + JS * 0.4, SALTO[3][0] + JS * 0.4, m.milimetro, 0]) dibujar(t);
{ const gl = R.getContext(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4)); }   // espera a la GPU
E.iniciar(dibujar);
</script>
