<script type="module">
// DO-MASCARA (frases 3–4), 2024 → 2026. Cinco planos:
// 1. «Five years later, in July 2024, in a hall packed with fans in San Diego»: el pabellón de la Comic-Con entero, la
//    pantalla gigante con la máscara; los fans de pie saltan y agitan los brazos en «packed with fans»; el presentador
//    habla en el escenario y en «San Diego» señala al lateral, por donde asoma el hombre de la capa verde; corta en «A man»;
// 2. otra cámara: entre bastidores, desde la hombrera izquierda (la pata de terciopelo, el muro de ladrillo con su luz
//    azul, la escalera, las bolsas de contrapeso que se mecen, el baúl de gira y la regidora con su tableta); el
//    escenario de tablas en diagonal y, al fondo, el patio de butacas y el anfiteatro con cientos de cabezas y móviles.
//    La luz de entrada pasa de roja a verde y el hombre de la capa sale del bastidor y cruza hasta el centro («walks onto
//    the stage»), con el cañón de seguimiento del anfiteatro encima; el presentador le espera en el proscenio con el
//    micrófono y una cámara de televisión en su pedestal (piloto rojo, operador) lo sigue. En «takes off the mask» se la
//    quita: es el actor, con la máscara en la mano; destello, la luz verde de la pantalla (a nuestra espalda) parpadea
//    en el suelo, el público se levanta con los brazos arriba y saltan flashes; la regidora levanta los brazos; corta
//    en la pausa antes de «and it's»;
// 3. el público visto desde el escenario (fondo local): las gradas con cientos de cabezas y móviles (el sector alto de la
//    derecha, cerrado y a oscuras, deja la zona de Atom tranquila; la salida y la banderola verde, más a la izquierda); las tres filas se
//    levantan en ola en «the same actor» con los brazos arriba; en «Robert Downey Jr.» un señor salta y se le cae el
//    refresco (dos asientos vacíos a su lado y un foco sobre él): el vaso vuela y se derrama con hielo en el pasillo
//    (gag 4); corta en «The man who saved»;
// 4. Latveria al atardecer: Iron Man entra en la plaza; en «coming back as Dr. Doom» un remolino verde lo envuelve y sale
//    convertido en Doom, con capa; los vecinos se asustan y las palomas salen volando; en «the villain» levanta los brazos
//    con rayos verdes y en «Doomsday» truena y el cielo se oscurece; corta en «which hits»;
// 5. el espacio: tres Tierras (616, 828 y 10005, esta con océanos de añil, atmósfera lila y una luna que gira); en «December 18th» cae una hoja de calendario con el 12 y un 18
//    dorado enorme que rebota; en «heroes» llegan al risco Thor, Reed y Lobezno, uno de cada mundo, y en «three
//    different universes» cada Tierra se ilumina a su turno.
import * as T from '/atomo/plato/escenas/do-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('do-mascara');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const C = T.C;
const hh = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const BY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], by = (x, y) => BY[(y & 3) * 4 + (x & 3)] / 16;
const rampa = (lista) => lista.map(hex);
// degradado tramado por filas (cielos, fondos): v 0–1 de y0 a y1, con la rampa de colores
const degradado = (x0, y0, x1, y1, ram, k = 0) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
  const v = (y - y0) / Math.max(1, y1 - y0) * (ram.length - 1) + by(x, y) - 0.5 + (hh(x >> 3, y >> 2, k) - 0.5) * 0.5;
  R.pset(x, y, ram[Math.max(0, Math.min(ram.length - 1, Math.round(v)))]); } };
// una nube de humo de tres tonos (bolas que se solapan), en (x, y), tamaño s
const humo = (x, y, s, c0, c1, c2) => { for (const [dx, dy, k] of [[0, 0, 1], [-1.1, 0.2, 0.75], [1.1, 0.25, 0.8], [-0.5, -0.6, 0.7], [0.6, -0.55, 0.65]]) R.disco(x + dx * s, y + dy * s, s * k + 1, c2);
  for (const [dx, dy, k] of [[0, 0, 1], [-1.1, 0.2, 0.75], [1.1, 0.25, 0.8], [-0.5, -0.6, 0.7], [0.6, -0.55, 0.65]]) R.disco(x + dx * s, y + dy * s - 1, s * k, c1);
  for (const [dx, dy, k] of [[-0.3, -0.5, 0.55], [0.5, -0.45, 0.45], [-1.1, 0, 0.4]]) R.disco(x + dx * s - 1, y + dy * s - 2, s * k, c0); };
// lágrimas que caen de los ojos de un chibi (cabeza = la .cabeza que devuelve R.actor)
const lagrimas = (cab, t, dir = 1) => { for (const ex of [-2, 2]) { const f = ((t * 1.6 + (ex > 0 ? 0.5 : 0)) % 1); const x = cab[0] + ex + (dir > 0 ? 1 : 0), y = Math.round(cab[1] + 7 + f * 7);
  R.pset(x, y, hex('#8ad8ff')); R.pset(x, y + 1, hex('#4aa8e8')); } };

const a = (f) => en('mascara', f), b = (f) => en('doom', f);
const P2 = a(0.409), P3 = a(0.763), P4 = b(0), P5 = b(0.466);
const LLENO = a(0.251), DIEGO = a(0.337), SUBE = a(0.579), ESCENARIO = a(0.622), QUITA = a(0.699), MISMO = a(0.816), ROBERT = a(0.911);
const VUELVE = b(0.069), DOOM = b(0.092), VILLANO = b(0.223), DIA = b(0.389), DICIEMBRE = b(0.592), DIECIOCHO = b(0.625), HEROES = b(0.745), TRES = b(0.835);

// ── 1 · el pabellón entero ──
const p1 = (t) => {
  const ov = 0.18 * (tramo(t, LLENO, LLENO + 0.4) - tramo(t, LLENO + 1.4, LLENO + 2));
  T.escenario(R, t, { pantalla: 'mascara', ovacion: ov });
  // el presentador habla y señala al lateral; el hombre de la capa asoma
  const pr = R.actor(EL.feige, 192, 106, t, { dir: -1, habla: t < DIEGO && Math.sin(t * 8) > 0, dedo: t > DIEGO, sonrisa: t > DIEGO });
  const e = tramo(t, DIEGO + 0.3, P2 + 0.1); if (e > 0) R.actor(EL.doom, Math.round(lerp(78, 108, e)), 106, t, { dir: 1, anda: e < 1 });
  // fans de pie entre el público: saltan y agitan los brazos en «packed with fans»
  const s1 = Math.abs(Math.sin((t - LLENO) * 7)) * tramo(t, LLENO, LLENO + 0.3) * (1 - tramo(t, LLENO + 2.2, LLENO + 2.5));
  R.actor(EL.fanCuernos, 52, 178, t, { dir: 1, salto: Math.round(s1 * 5), brazos: s1 > 0.1, sonrisa: true });
  R.actor(EL.fanArana, 252, 178, t, { dir: -1, salto: Math.round(Math.abs(Math.sin((t - LLENO) * 7 + 1)) * 4 * tramo(t, LLENO + 0.2, LLENO + 0.5)), brazos: t > LLENO + 0.2, sonrisa: true });
  T.escenarioDelante(R, t, { ovacion: ov });
};

// ── 2 · desde la hombrera izquierda (entre bastidores): se quita la máscara ──

    R.linea(sx, y, sx + 14, y, hex('#1c2240')); R.linea(sx, y + 7, sx + 14, y + 7, hex('#070810')); R.linea(sx + 14, y, sx + 14, y + 7, hex('#070810')); }

  for (const x of [128, 156, 184, 212, 240]) { R.rect(x - 2, 32, x + 2, 37, hex('#24242e')); R.pset(x - 1, 33, hex('#4a4a58')); R.linea(x - 2, 37, x + 2, 37, hex('#6a6a78')); }
  // el anfiteatro: dos filas de butacas, su antepecho de madera con apliques y la cabina del cañón de seguimiento
  for (const y of [49, 54]) for (let x = 106; x < 320; x += 4) { R.rect(x, y, x + 2, y + 2, (x >> 2) % 2 ? hex('#3a1824') : hex('#4a2030')); }
  R.rect(104, 57, 319, 63, hex('#3a2418')); R.linea(104, 57, 319, 57, hex('#7a5034')); R.linea(104, 63, 319, 63, hex('#1a0e0a'));
  for (let x = 104; x < 320; x++) for (let y = 58; y < 63; y++) if (hh(x >> 2, y, 4) > 0.72) R.pset(x, y, hex('#4a3020'));
  for (let x = 116; x < 320; x += 22) { R.pset(x, 59, hex('#f8d890')); R.pset(x, 60, hex('#c89850')); R.pset(x - 1, 60, hex('#6a4a2a')); R.pset(x + 1, 60, hex('#6a4a2a')); }

  R.rect(248, 49, 260, 53, hex('#3a3a46')); R.rect(244, 50, 248, 52, hex('#5a5a68')); R.pset(259, 50, hex('#8a8a98'));
  // el patio de butacas: filas que bajan hacia el escenario, respaldos rojos con brillo en el canto
  for (let r = 0; r < 7; r++) for (let x = 106; x < 320; x++) { const y = Math.round(filaY(r, x)) + 3; if (y >= LABIO(x) - 3) continue;
    R.pset(x, y, (x + r) % 4 === 0 ? hex('#2a0e16') : hex('#5a1e2c')); R.pset(x, y + 1, hex('#3a121c')); if (x % 4 === 1) R.pset(x, y - 1, hex('#8a3446')); }
  // el foso: la sombra entre el escenario y la primera fila
  for (let x = 104; x < 320; x++) { const y = Math.round(LABIO(x)); for (let k = 1; k <= 3; k++) R.pset(x, y - k, k === 1 ? hex('#05050a') : hex('#0a0a12')); }
  // las dos salidas con su pictograma (un hombrecito y una flecha, sin letras)
  for (const [x, y] of [[112, 68], [304, 76]]) { R.rect(x, y, x + 9, y + 5, hex('#0e5a2a')); R.rect(x + 1, y + 1, x + 8, y + 4, hex('#2ac864'));
    R.pset(x + 2, y + 1, hex('#e8fff0')); R.linea(x + 2, y + 2, x + 2, y + 3, hex('#e8fff0')); R.linea(x + 4, y + 2, x + 7, y + 2, hex('#e8fff0')); R.pset(x + 6, y + 1, hex('#e8fff0')); R.pset(x + 6, y + 3, hex('#e8fff0')); }
  // el fondo del bastidor: el muro de ladrillo pintado de negro, con su luz de trabajo azul, una escalera y el cuadro de varas
  for (let y = 14; y < 104; y++) for (let x = 40; x < 92; x++) { const fila = y >> 2, jx = (x + (fila & 1) * 4) % 8, junta = (y & 3) === 3 || jx === 7;
    const luz = Math.max(0, 1 - Math.hypot(x - 62, y - 30) / 46); let v = junta ? 0 : 1 + (hh(fila, (x + (fila & 1) * 4) >> 3, 13) > 0.6 ? 1 : 0) + (by(x, y) < luz * 0.8 ? 1 : 0);
    R.pset(x, y, rampa(['#07080e', '#12141e', '#1c2030', '#2a3048'])[Math.min(3, v)]); }
  R.rect(58, 22, 66, 26, hex('#1a1a24')); R.rect(59, 26, 65, 27, hex('#8ab0e8')); R.linea(62, 17, 62, 22, hex('#3a3a48'));
  for (let y = 28; y < 60; y++) for (let x = 50; x < 76; x++) if (by(x, y) < 0.12 * (1 - Math.abs(x - 62) / 14) * (1 - (y - 28) / 34) * 2) R.pset(x, y, hex('#3a4a78'));
  for (const x of [74, 84]) R.linea(x, 40, x + 2, 104, hex('#6a6a5a')); for (let y = 46; y < 104; y += 7) R.linea(74 + (y - 40) / 32, y, 84 + (y - 40) / 32, y, hex('#8a8a74'));
  R.rect(42, 64, 52, 100, hex('#2a2418')); R.linea(42, 64, 52, 64, hex('#5a4a30')); for (let y = 68; y < 98; y += 4) { R.pset(44, y, hex('#a89870')); R.pset(48, y, hex('#a89870')); R.linea(45, y, 47, y, hex('#6a5a3a')); }
  // el suelo del escenario: tablas que corren hacia el público, con vetas, juntas y el desgaste de las marcas
  const tabla = rampa(['#2a1a10', '#3a2416', '#4c301c', '#5e3c22', '#704a2a']);
  for (let y = 100; y < 180; y++) for (let x = 0; x < 320; x++) { if (y <= LABIO(x)) continue;

    let v = 1.4 + (y - 110) / 50 + (veta - 0.5) * 1.2 + by(x, y) - 0.5 + (hh(x >> 1, y, pl) > 0.93 ? -1 : 0);

    R.pset(x, y, tabla[Math.max(0, Math.min(4, Math.round(v)))]); }
  // marcas de cinta (cruces fosforescentes) y la lista de canciones pegada al suelo (barras, sin letras)
  for (const [x, y] of [[150, 124], [206, 117], [118, 146]]) { R.linea(x - 2, y, x + 2, y, hex('#e8e070')); R.linea(x, y - 1, x, y + 1, hex('#e8e070')); }
  R.poligono([[128, 166], [146, 164], [148, 175], [130, 177]], hex('#e8e4d8'));
  for (let k = 0; k < 4; k++) R.linea(131, 168 + k * 2, 140 - (k % 2) * 3, 167 + k * 2, hex('#5a5a68'));
  R.rect(127, 165, 130, 166, hex('#a8a8b8')); R.rect(144, 174, 147, 175, hex('#a8a8b8'));
  // la manguera de cables que va del bastidor al proscenio
  for (let s = 0; s <= 1; s += 0.004) { const x = lerp(lerp(96, 150, s), lerp(150, 236, s), s), y = lerp(lerp(178, 150, s), lerp(150, 114, s), s); R.disco(x, y, 1.6 - s * 0.6, hex('#14141a')); R.pset(x, y - 1, hex('#3a3a48')); }
  // la bambalina de arriba y la pata de terciopelo del fondo (más allá, el público)
  const pliegue = (x0, x1, y0, y1, base) => { for (let x = x0; x <= x1; x++) { const f = Math.sin((x - x0) * 0.9) * 0.5 + 0.5; const c = f > 0.7 ? base[2] : f > 0.3 ? base[1] : base[0]; R.linea(x, y0, x, y1, c);
    for (let y = y0; y <= y1; y += 3) if (hh(x, y, 11) > 0.8) R.pset(x, y, base[Math.max(0, Math.min(2, (f > 0.5 ? 1 : 0) + (hh(x, y, 12) > 0.5 ? 1 : -1)))]); } };
  const NEGRO = rampa(['#07070c', '#12121c', '#1e1e2c']), GRANATE = rampa(['#2a0a12', '#4a1220', '#6a1c2e']);
  pliegue(0, 272, 0, 12, GRANATE); R.linea(0, 13, 272, 13, hex('#1a060c')); for (let x = 2; x < 272; x += 9) R.pset(x, 12, hex('#c8a040'));
  pliegue(90, 104, 13, 108, NEGRO); R.linea(104, 13, 104, 110, hex('#3a3a52'));

  pliegue(0, 40, 0, 179, NEGRO); for (let y = 0; y < 180; y++) { R.pset(40, y, hex('#4a4a66')); R.pset(41, y, hex('#2a2a3a')); }

  R.rect(72, 166, 114, 179, hex('#16161e')); R.rect(70, 161, 116, 166, hex('#2a2a36'));
  R.linea(70, 161, 116, 161, hex('#8a8e9c')); R.linea(72, 167, 114, 167, hex('#a8acb8')); R.linea(72, 172, 114, 172, hex('#6a6e7c'));

  for (const x of [84, 100]) { R.rect(x, 168, x + 3, 170, hex('#d8dce8')); R.pset(x + 1, 169, hex('#5a5e6a')); }

  for (let k = 0; k < 3; k++) { R.anillo?.(98, 158 + k * 0.5, 5 - k, hex('#0a0a10')); }
  R.disco(98, 159, 4, hex('#1a1a24')); R.disco(98, 159, 2, hex('#2a2a36')); R.pset(96, 156, hex('#5a5a68')); R.pset(101, 157, hex('#4a4a58'));
  R.usar(prev); return bf;
};
const PELOS2 = rampa(['#2a1c14', '#5a3418', '#a8743c', '#e0b860', '#1c1424', '#7a7a8a', '#c84a2a']), PIELES2 = rampa(['#c8946a', '#a46a44', '#6a442c', '#b88860']);
const p2 = (t) => {
  const quita = t > QUITA + 0.15, ov = tramo(t, QUITA + 0.2, QUITA + 0.9);
  const glitch = tramo(t, QUITA, QUITA + 0.2) - tramo(t, QUITA + 0.5, QUITA + 0.8);
  if (!fondo2) fondo2 = pintaFondo2(); R.copiar(fondo2);
  // el público al fondo: cabezas en penumbra que se levantan en la ovación, móviles que graban y flashes
  for (let r = -2; r < 7; r++) { const bal = r < 0, ch = r < 3 && !bal ? 3 : 2;
    for (let x = 108 + (r & 1) * 2; x < 318; x += bal ? 4 : 5) { if (bal && x > 236 && x < 270) continue; const k = hh(x, r, 5); if (k < 0.07) continue;
      const y0 = bal ? (r === -2 ? 48 : 53) : Math.round(filaY(r, x)) - 1, sube = Math.round(ov * (1 + (hh(x, r, 6) > 0.5 ? 1 : 0)) * Math.max(0, Math.sin(t * 9 + x * 0.3) * 0.5 + 0.7));
      const y = y0 - sube; if (!bal && y + ch >= LABIO(x) - 3) continue;
      R.rect(x, y, x + ch - 1, y + ch - 1, PIELES2[Math.floor(hh(x, r, 2) * 4)]); R.rect(x, y - 1, x + ch - 1, y - 1, PELOS2[Math.floor(k * 7)]);
      if (ov > 0.3 && hh(x, r, 8) > 0.55) { const ay = y - 2 - Math.round(Math.abs(Math.sin(t * 10 + x)) * 2); R.pset(x - 1, ay, PIELES2[0]); R.pset(x - 1, ay + 1, PIELES2[1]); R.pset(x + ch, ay, PIELES2[0]); R.pset(x + ch, ay + 1, PIELES2[1]); }
      const movil = hh(x, r, 3) > (quita ? 0.7 : 0.88); if (movil) { R.pset(x + ch, y - 2, hex('#a8d8ff')); R.pset(x + ch, y - 1, hex('#5a8ac8')); }
      if (quita && hh(x, r, Math.floor(t * 7)) > 0.985) { R.disco(x + 1, y - 2, 2, hex('#ffffff')); R.pset(x - 2, y - 2, hex('#e8f0ff')); R.pset(x + 4, y - 2, hex('#e8f0ff')); } } }
  // la tira de luz del proscenio, que corre
  for (let x = 106; x < 320; x += 3) { const y = Math.round(LABIO(x)); R.pset(x, y, ((x / 3 + Math.floor(t * 12)) % 7) < 2 ? hex('#8ae8ff') : hex('#2a6a8a')); }
  // las bolsas de contrapeso de las varas, colgadas de sus cuerdas, que se mecen un poco
  for (const [x, y, f] of [[48, 70, 0], [58, 86, 1.7], [66, 62, 3.1]]) { const dx = Math.round(Math.sin(t * 1.3 + f) * 1.2);
    R.linea(x, 14, x + dx, y, hex('#8a7a5a')); R.rect(x + dx - 2, y, x + dx + 2, y + 6, hex('#5a4a34')); R.linea(x + dx - 2, y, x + dx + 2, y, hex('#8a7454')); R.pset(x + dx - 1, y + 2, hex('#3a2e20')); R.pset(x + dx + 1, y + 4, hex('#3a2e20')); }
  // los haces de las cabezas móviles de la cercha barren el escenario entre la bruma
  for (const [x0, f] of [[156, 0], [212, 2.2]]) { const xb = x0 + Math.sin(t * 0.9 + f) * 34, col = f ? hex('#8ab0ff') : hex('#c8a8ff');
    for (let y = 38; y < 120; y++) { const s = (y - 38) / 82, cx = lerp(x0, xb, s), w = 1 + s * 7; for (let x = Math.round(cx - w); x <= cx + w; x++) if (by(x, y) < 0.16 - Math.abs(x - cx) / w * 0.1) R.pset(x, y, col); } }

};

// ── 5 · tres Tierras y el 18 de diciembre ──
const p5 = (t) => {

    const nube = R.vnoise(lon * 3.5 + t * 0.12 + 20, lat * 7 + 3) * 0.85 + hh(x, y, 9) * 0.15;

      c = luz < 0.2 ? (hh(x, y, 4) > 0.86 && Math.sin(t * 4 + x * 3 + y) > -0.4 ? '#ffd870' : '#1a2a1e') : luz < 0.45 ? (ocre ? '#8a6a3a' : '#2e6a32') : ocre ? '#c8a060' : n > 0.66 ? '#5a9a3a' : '#7ab048'; }
    else c = luz < 0.2 ? '#0e1838' : luz < 0.45 ? '#1e3a8a' : luz > 0.92 ? '#9ad0ff' : n > 0.47 ? '#4a8ad0' : '#2a5ab8';
    if (d2 > 0.8 && luz > 0.25 && by(x, y) < (d2 - 0.8) * 4) c = '#c8c0ff';
    R.pset(x, y, hex(c)); }
  luna(true);
  R.rect(cx - 23, cy + r + 2, cx + 23, cy + r + 15, hex('#8a80d8')); R.rect(cx - 22, cy + r + 3, cx + 22, cy + r + 14, hex('#1a1014')); R.rect(cx - 21, cy + r + 4, cx + 21, cy + r + 13, hex('#2a2440')); R.numero('10005', cx, cy + r + 12, { centro: true });
  // las tres se iluminan a su turno en «three different universes»
  const luces = [[g.planetas[0].x, g.planetas[0].y, g.planetas[0].r], [cx, cy, r], [g.planetas[1].x, g.planetas[1].y, g.planetas[1].r]];
  luces.forEach(([px, py, pr], k) => { const f = tramo(t, TRES + k * 0.25, TRES + k * 0.25 + 0.7); if (f > 0 && f < 1) { const g2 = k === 1 ? 0.7 : 1; R.anillo(px, py, pr + 2 + f * 8 * g2, hex('#fff0a0')); R.anillo(px, py, pr + 4 + f * 10 * g2, hex('#f8c040'), 3); } });
  // la hoja del calendario: el 12 arriba y el 18 dorado enorme, que cae y rebota
  const c = tramo(t, DICIEMBRE, DIECIOCHO + 0.1), bote = c >= 1 ? Math.round(Math.abs(Math.sin((t - DIECIOCHO - 0.1) * 9)) * 6 * Math.max(0, 1 - (t - DIECIOCHO - 0.1) * 1.4)) : 0;
  if (c > 0) { const y0 = Math.round(lerp(-70, 82, c * c)) - bote, x0 = 128;
    R.rect(x0 - 1, y0 - 1, x0 + 65, y0 + 57, hex('#1a1014')); R.rect(x0, y0, x0 + 64, y0 + 56, hex('#f6f2ea')); R.rect(x0, y0, x0 + 64, y0 + 13, hex('#c8303a')); R.rect(x0, y0 + 13, x0 + 64, y0 + 13, hex('#8a1e28'));
    for (const rx of [x0 + 14, x0 + 50]) { R.rect(rx - 1, y0 - 4, rx + 1, y0 + 2, hex('#1a1014')); R.pset(rx, y0 - 3, hex('#c0c4d4')); }
    R.numero('12', x0 + 32, y0 + 11, { centro: true, rampa: [hex('#ffffff'), hex('#ffffff'), hex('#f2eee2'), hex('#f2eee2')] });

      const dx = x0 + 33 - 22, dy = y0 + 50 - 30;

    for (let y = y0 + 52; y < y0 + 56; y++) for (let x = x0 + 1; x < x0 + 64; x++) if (by(x, y) < 0.3) R.pset(x, y, hex('#d8d0c4'));
    if (c >= 1 && Math.sin(t * 5) > 0.3) { const sx = x0 + 56, sy = y0 + 22; R.pset(sx, sy, hex('#ffffff')); R.pset(sx - 1, sy, hex('#fff0a0')); R.pset(sx + 1, sy, hex('#fff0a0')); R.pset(sx, sy - 1, hex('#fff0a0')); R.pset(sx, sy + 1, hex('#fff0a0')); } }

  [[EL.thor, 6], [EL.reed, 36], [EL.lobezno, 66]].forEach(([d, x1], k) => { const u = tramo(t, HEROES - 0.3 + k * 0.25, HEROES + 0.9 + k * 0.25), x = Math.round(lerp(-22 - k * 12, x1, u));

const año = (t) => t < P4 ? 2024 : 2026;
const efectos = [[0.6, 'publico'], [DIEGO + 0.4, 'whoosh'], [QUITA + 0.15, 'flash'], [QUITA + 0.5, 'publico'], [MISMO + 0.2, 'palmada'], [ROBERT + 0.65, 'chof'], [DOOM, 'brillo'], [DIA, 'trueno'], [DIECIOCHO + 0.1, 'golpecito'], [TRES, 'brillo']];
T.rodar(E, R, [[0, p1], [P2, p2], [P3, p3], [P4, p4], [P5, p5]], { efectos, año });
