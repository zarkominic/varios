<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Miniatura vertical · ep47 Short 1</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// MS-SHORT1-MINIATURA · ep47, vertical: lo que cuenta en la columna central (x 110–210). Con chibis, sin palabras.
// El gancho: la noche de 1816 en la casita del lago, MARY (18) abajo, sola, alzando su palmatoria hacia la ventana; arriba,
// en lo oscuro del cristal, dos ojos amarillos y acuosos que la miran (la criatura NO se ve; nada de las películas).
import { crearRoma } from '/atomo/plato/kits/pixel-roma.js';
import { conChibi } from '/atomo/plato/kits/pixel-chibi.js';
import { hex } from '/atomo/plato/kits/pixel-retro.js';
import { lago, lagoDelante, MS } from '/atomo/plato/escenas/ms-comun.js';
import { figura, grado, halo } from '/atomo/plato/escenas/mini-chibi.js';
const R = conChibi(await crearRoma(document.getElementById('lienzo')));
const K = hex('#1a1020');
// la palmatoria de latón con su vela (en el búfer de la figura, a escala 1: crece con ella)
const palmatoria = (R, [hx, hy]) => { hx = Math.round(hx); hy = Math.round(hy);
  R.rect(hx - 3, hy + 1, hx + 3, hy + 1, hex('#8a6420')); R.rect(hx - 2, hy, hx + 2, hy, hex('#c89a40')); R.pset(hx + 3, hy, hex('#8a6420'));
  R.rect(hx - 1, hy - 6, hx, hy - 1, hex('#f0e8d0')); R.pset(hx, hy - 5, hex('#c8bea6')); R.pset(hx - 1, hy - 3, hex('#fffbe8'));
  R.pset(hx, hy - 7, K); R.pset(hx, hy - 8, hex('#fff4c0')); R.pset(hx - 1, hy - 8, hex('#ffb040')); R.pset(hx, hy - 9, hex('#ffd870')); };
// la barbilla de Mary, limpia y a la luz de la vela (la misma corrección que ms-miniatura: al triple, el contorno de la
// mandíbula se leía como barba)
const caraLimpia = (R) => {
  const piel = hex('#f6c290'), pelo = hex('#a8703e'), boca = hex('#b0584a'), filo = hex('#7a4630');
  const sombra = hex('#d8986a');
  R.pset(69, 74, piel); R.pset(70, 74, piel); R.pset(71, 74, boca); R.pset(72, 74, filo);
  R.pset(64, 74, pelo); R.pset(64, 75, pelo); R.pset(65, 75, pelo); R.pset(71, 75, sombra); R.pset(72, 75, filo);
  R.pset(64, 76, hex('#8a5a32')); R.pset(65, 76, hex('#8a5a32')); for (let x = 66; x <= 71; x++) R.pset(x, 76, sombra);
  R.pset(69, 73, hex('#f8d0a8')); R.pset(70, 72, hex('#f8d0a8'));
};
// dos ojos amarillos y acuosos en lo oscuro (como los de ms-cierre y ms-miniatura), algo mayores para el móvil
const ojos = (ox, oy, sep) => {
  halo(R, ox + sep / 2, oy, 40, 20, '#c89a20', 0.5);
  for (const dx of [0, sep]) { const al = 3;
    for (let i = -7; i <= 7; i++) for (let j = -al - 1; j <= al + 1; j++) if (Math.abs(i) / 7.5 + Math.abs(j) / (al + 1.3) <= 1.02) R.pset(ox + dx + i, oy + j, Math.abs(j) >= al ? hex('#b08010') : hex('#f8e050'));
    R.rect(ox + dx, oy - 2, ox + dx + 1, oy + 2, K); R.pset(ox + dx - 3, oy - 1, hex('#fffbe0')); R.pset(ox + dx - 2, oy - 1, hex('#fff4a0')); R.pset(ox + dx - 4, oy, hex('#fff4a0'));
    R.pset(ox + dx + 3, oy + 4, hex('#a8c8e8')); R.pset(ox + dx + 3, oy + 5, hex('#7a98c0')); R.pset(ox + dx + 4, oy + 4, hex('#c8e0f0')); R.pset(ox + dx + 3, oy + 6, hex('#5a7aa0')); }
};
const mezcla = (a, b, f) => { let r = 0; for (const sh of [0, 8, 16]) r |= (Math.round(((a >>> sh) & 255) * (1 - f) + ((b >>> sh) & 255) * f) & 255) << sh; return (0xff000000 | r) >>> 0; };
const MX = 127, OX = 149, OY = 66;
const dibujar = (t) => {
  const o = { encuadre: 'lago', camara: 'ventana', tormenta: 1 };
  lago(R, t, o);
  // fuera es noche cerrada: el cristal se oscurece mucho alrededor de los ojos
  const B = R.buf, NOCHE = hex('#03050c');
  for (let y = 22; y <= 144; y++) for (let x = 76; x <= 244; x++) { const v = 0.66 + 0.24 * Math.max(0, 1 - Math.hypot((x - OX - 11) / 70, (y - OY) / 45)); B[y * 320 + x] = mezcla(B[y * 320 + x], NOCHE, v); }
  ojos(OX, OY, 22);
  // Mary sola, abajo, con la palmatoria alzada hacia el cristal
  const m = figura(R, MS.maryMS, MX, 184, t, { dir: 1, sostiene: [78, 72], cosa: (R, mano) => { caraLimpia(R); palmatoria(R, mano); } }, 3);
  lagoDelante(R, t, o);
  // la vela es la única luz del cuarto: lo demás cae a la penumbra (los ojos siguen brillando)
  const [lx, ly] = m && m.mano ? [m.mano[0] + 1, m.mano[1] - 25] : [MX + 40, 130];
  for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) { const d = Math.hypot((x - lx) / 1.15, y - ly);
    if (Math.hypot((x - OX - 11) / 30, (y - OY) / 11) < 1) continue;
    const f = Math.min(0.7, Math.max(0, (d - 30) / 120)); if (f > 0) B[y * 320 + x] = mezcla(B[y * 320 + x], NOCHE, f); }
  halo(R, MX - 6, 150, 18, 40, '#5a6a9a', 0.25);   // un filo frío de la ventana que la recorta
  halo(R, lx - 10, ly + 24, 60, 60, '#ffc870', 0.42);
  halo(R, lx, ly, 20, 20, '#ffe8a0', 0.5);
  halo(R, lx, ly, 7, 8, '#fffbe8', 0.6);
  grado(R, { cx: 160, cy: 100, rx: 80, ry: 120, tinte: '#060a14', f: 0.2, desde: 0.55, max: 0.8 });
};
window.__frame = async (t) => { dibujar(t); R.presentar(); };
window.__listo = true;
</script>
</body>
</html>
