<canvas id="lienzo"></canvas>
<script type="module">
// PR-TALLER (frase 9), 1511–1513. Cuatro planos:
// 1. 1511: de noche, el temporal; la galera de Kemal sube, baja y escora entre olas enormes; nubarrones de tres tonos con
//    el filo encendido y jirones que el viento arrastra, petreles, relámpago en «1511» que enciende el casco; el timonel
//    pelea con la caña, un marinero achica con el cubo por la borda, y Kemal, agarrado al palo, aprieta contra el pecho el
//    rollo de cartas, que brilla en «those charts» (sin hundimientos ni nadie en el agua);
// 2. el taller de Galípoli: un marinero entra con el rollo y se lo da a Piri («passed to his nephew»), que lo recibe
//    serio; en «Two years later» (1513) Piri cruza el taller, se sienta a la mesa en «sat down» y extiende la carta;
// 3. la mesa desde arriba: la mano de Piri dibuja la costa mientras cuatro cartas de estilos distintos llegan volando
//    («gather in a single map») y en «everything» se unen con hilos de oro a la rosa del centro;
// 4. inserto de cerca: la esquina del bastidor vista en ángulo, con la ventana al estrecho, la repisa, el candil y la
//    mesita de tinteros y plumas delante; la mano alisa la piel («gazelle skin»), dibuja una rosa grande que echa sus
//    rumbos («compass roses»), dos naos («ships»), un loro en la costa verde y una torre en la isla («little drawings»),
//    escribe tres notas que se unen con un hilo de puntos a las cartas clavadas en el listón («where each piece came
//    from») y moja la pluma en el tintero.
import * as T from '/atomo/plato/escenas/pr-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('pr-taller');
const { tramo, lerp, hex } = R;
const en = (k, f) => T.momento(M, k, f);
const h = (x, y, k = 0) => { const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const mez = (a, b, k) => { let r = 0; for (const s of [0, 8, 16]) r |= Math.round(((a >>> s) & 255) * (1 - k) + ((b >>> s) & 255) * k) << s; return (r | 0xff000000) >>> 0; };
const CAPAS = {};
// un fondo fijo en su búfer (se pinta una vez y se copia entero en cada fotograma)
const capa = (k, dib) => { if (!CAPAS[k]) { const b = R.nuevo(), prev = R.usar(b); dib(); R.usar(prev); CAPAS[k] = b; } R.copiar(CAPAS[k]); };
// una pieza fija con transparencia (se pinta una vez y luego se calca píxel a píxel, con un desplazamiento dy)
const SPR = {};
const sprite = (k, dib, dx = 0, dy = 0) => { if (!SPR[k]) { const b = R.nuevo(), prev = R.usar(b); dib(); R.usar(prev); const L = []; for (let i = 0; i < b.length; i++) if (b[i]) L.push(i, b[i]); SPR[k] = L; } const L = SPR[k]; for (let j = 0; j < L.length; j += 2) R.pset(L[j] % 320 + dx, ((L[j] / 320) | 0) + dy, L[j + 1]); };
const tin = (x, y, c, a) => { x = Math.round(x); y = Math.round(y); if (x < 0 || x > 319 || y < 0 || y > 179) return; R.pset(x, y, mez(R.pget(x, y), c, a)); };
const K = hex('#1a1420');
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
// franjas tramadas (cielo o mar) entre y0 e y1 con los colores cols, de arriba abajo
const tramado = (y0, y1, cols) => { for (let y = y0; y < y1; y++) { const u = (y - y0) / (y1 - y0) * (cols.length - 1); for (let x = 0; x < 320; x++) { const k = Math.min(cols.length - 1, Math.floor(u + BAY[(y & 3) * 4 + (x & 3)] / 16)); R.pset(x, y, cols[k]); } } };
// nube de tres tonos (sombra, cuerpo, luz)
const BOLAS = [[-14, 2, 5], [-7, -1, 7], [2, -3, 8], [11, 0, 6], [18, 2, 4], [-19, 3, 3]];
const nube = (cx, cy, s, tonos) => tonos.forEach((c, k) => { for (const [dx, dy, r] of BOLAS) R.disco(cx + dx * s, cy + dy * s - k * 1.5 * s, Math.max(1, r * s - k * 1.25 * s), c); });
// tres capas de nubes a tres velocidades (las lejanas más azuladas)
const TONOS = [[hex('#8aa4c4'), hex('#aec2da'), hex('#cad8ea')], [hex('#a4b8d0'), hex('#d2dcea'), hex('#eef2f8')], [hex('#b4c4d8'), hex('#e2e8f2'), hex('#ffffff')]];
const nubes = (t, ys, sem = 0) => { for (let k = 0; k < 7; k++) { const c = k % 3, v = [1.6, 3.4, 6][c], s = [0.55, 0.8, 1.1][c], x = ((k * 113 + sem * 37 + t * v) % 420) - 50; nube(Math.round(x), ys[c] + (k * 7) % 9, s, TONOS[c]); } };
// el rollito de cartas atado con su cinta (lo que se lleva en la mano)
const rollito = (x, y) => { R.rect(x - 6, y - 3, x + 5, y + 2, K); R.rect(x - 5, y - 2, x + 4, y + 1, hex('#e8d4a4')); R.rect(x - 5, y + 1, x + 4, y + 1, hex('#b89a64')); R.rect(x - 4, y - 2, x + 2, y - 2, hex('#fff4d8')); R.rect(x - 1, y - 3, x, y + 2, hex('#a83224')); R.pset(x - 6, y - 1, hex('#c8a870')); R.pset(x + 5, y - 1, hex('#c8a870')); };

const P2 = en('taller', .1630), P3 = en('taller', .4236), P4 = en('taller', .712);
const a1511 = en('taller', .0761), sobrino = en('taller', .2256), dos = en('taller', .265), gal = en('taller', .3103), sienta = en('taller', .3774);
const reunir = en('taller', .5033), unico = en('taller', .5496), todo = en('taller', .5667), mundo = en('taller', .649);
const gacela = en('taller', .7149), rosas = en('taller', .7647), barcos = en('taller', .8073), dibujos = en('taller', .8589), escribe = en('taller', .907), pieza = en('taller', .955);

// ── 1 · el temporal de 1511 ──
// encima del cielo del decorado: los nubarrones de tres tonos, más claros y con el filo de arriba encendido, y jirones
// de nube baja que el viento arrastra a la izquierda (sin tocar la galera: solo se repintan los colores del cielo)
const CIELO = new Set(['#0a0d16', '#10151f', '#171e2a', '#1f2734', '#283140', '#1a2230', '#3a4660', '#2a3242'].map(hex));
const NUB = new Map([['#161b26', '#1c2232'], ['#222a3a', '#313b56'], ['#38425a', '#56648a'], ['#121620', '#1a2030'], ['#1e2534', '#2e3852'], ['#333d54', '#5e6c94'], ['#0e121a', '#151b28'], ['#1a2030', '#283249'], ['#2e3850', '#52608a']].map(([a, b]) => [hex(a), hex(b)]));
const FILO = new Set(['#38425a', '#333d54', '#2e3850', '#222a3a', '#1e2534', '#1a2030'].map(hex));
const FILA = new Uint32Array(320);
const cieloVivo = (t) => {
  const B = R.buf, j1 = hex('#222a3a'), j2 = hex('#2c3548'), j3 = hex('#3a4560'), fl = hex('#7a88b0'), fl2 = hex('#46527a');
  FILA.fill(0);
  for (let y = 0; y < 100; y++) for (let x = 0; x < 320; x++) {
    const i = y * 320 + x, c = B[i], arriba = FILA[x]; FILA[x] = c;
    const za = Math.max(274 - x, y - 46);
    if (za < 0) continue;
    const n = NUB.get(c);
    if (n !== undefined) { const v = y > 0 && CIELO.has(arriba) && FILO.has(c) ? (c === hex('#38425a') || c === hex('#333d54') || c === hex('#2e3850') ? fl : fl2) : n; B[i] = za < 18 ? mez(c, v, za / 18) : v; continue; }
    if (!CIELO.has(c) || za < 10) continue;
    const s = Math.sin(x * 0.047 + t * 2.3 + Math.sin(y * 0.31 + x * 0.008) * 1.6) * 0.55 + Math.sin(x * 0.017 - y * 0.11 + t * 0.9) * 0.45, d = BAY[(y & 3) * 4 + (x & 3)] / 16;
    if (s > 0.86 + d * 0.1) B[i] = j3; else if (s > 0.62 + d * 0.2) B[i] = j2; else if (s > 0.42 + d * 0.25 && y > 20) B[i] = j1;
  }
};
// los petreles que capean el viento al fondo (solo sobre el cielo, por detrás de la jarcia)
const petreles = (t) => { const B = R.buf; for (let k = 0; k < 3; k++) { const x = Math.round(((40 + k * 90 - t * (9 + k * 3)) % 340 + 340) % 340 - 10), y = Math.round(54 + k * 9 + Math.sin(t * 1.7 + k) * 5), a = Math.sin(t * 9 + k * 2) > 0 ? -1 : 1;
  for (const [dx, dy] of [[0, 0], [1, 0], [-1, a], [-2, a], [2, a], [3, a], [-3, a + (a < 0 ? 0 : 1)], [4, a + (a < 0 ? 0 : 1)]]) { const px = x + dx, py = y + dy; if (px < 0 || px > 319 || py < 0 || py > 179 || (px > 274 && py < 46)) continue; if (CIELO.has(B[py * 320 + px]) || NUB.has(B[py * 320 + px])) R.pset(px, py, dx === 0 || dx === 1 ? hex('#c8d0e0') : hex('#8a96ac')); } } };
// el cubo de achicar (madera con su aro de hierro); vuelca: 0 derecho, 1 boca abajo hacia la borda
const cubo = (x, y, vuelca) => { const d = Math.round(vuelca * 2); R.poligono([[x - 3, y - 2 + d], [x + 3, y - 2 - d], [x + 2, y + 3 - d], [x - 2, y + 3 + d]], K); R.poligono([[x - 2, y - 1 + d], [x + 2, y - 1 - d], [x + 1, y + 2 - d], [x - 1, y + 2 + d]], hex('#8a5a30')); R.pset(x - 1, y + d, hex('#b07a44')); R.linea(x - 2, y + 1 + d, x + 2, y + 1 - d, hex('#4a4a52')); };
const p1 = (t) => {
  const g = T.mar(R, t, { encuadre: 'costa', camara: 'tormenta', rayo: 1.68 }), c = g.galera.cubierta;
  if (g.rayo <= 0) { petreles(t); cieloVivo(t); }
  const [mx, my] = c(10), [ax, ay] = c(-40), [sx, sy] = c(-66), [bx, by] = c(-14), gi = g.galera.giro;
  // el punto del palo (que se inclina con la escora) a la altura de la mano de Kemal, y Kemal pegado a él
  const palo = (hh) => [Math.round(mx + Math.sin(gi) * hh), Math.round(my - Math.cos(gi) * hh)], [kx, ky] = c(19 + Math.round(Math.sin(gi) * 14));
  // el palo, que se lee claro donde Kemal se agarra (madera mojada con su brillo)
  { const [x0, y0] = palo(0), [x1, y1] = palo(34); R.linea(x0 - 1, y0, x1 - 1, y1, K); R.linea(x0, y0, x1, y1, hex('#5a4030')); R.linea(x0 + 1, y0, x1 + 1, y1, hex('#2a1e18')); const [zx, zy] = palo(26); R.linea(zx - 1, zy, zx + 1, zy, hex('#8a7050')); }
  // el timonel lucha con la caña del timón: tira y empuja contra la mar
  const tim = Math.round(Math.sin(t * 2.2) * 3 + Math.sin(t * 5.1) * 1);
  const a = R.actor(EL.marineroOtomano1, ax - 7 + Math.round(tim * 0.3), ay, t, { dir: -1, sostiene: [ax - 15 + tim, ay - 11], sorpresa: g.rayo > 0.3 || (t > a1511 && t < a1511 + 0.6) });
  R.linea(a.mano[0] - 1, a.mano[1], sx, sy - 6, K); R.linea(a.mano[0] - 1, a.mano[1] - 1, sx, sy - 7, hex('#7a5a3a')); R.linea(a.mano[0] - 1, a.mano[1] + 1, sx, sy - 5, hex('#3a2818')); R.disco(sx, sy - 6, 1.6, hex('#4a3420'));
  // el marinero achica: llena el cubo en cubierta, lo sube y lo vuelca por la borda (el agua cae por el costado al mar)
  const ci = (t * 0.85 + 0.3) % 1, sube = ci < 0.35 ? 0 : ci < 0.6 ? (ci - 0.35) / 0.25 : 1, vu = ci < 0.6 ? 0 : Math.min(1, (ci - 0.6) / 0.15);
  const b = R.actor(EL.marineroOtomano2, bx - 7, by, t, { dir: 1, sostiene: [bx + 11, Math.round(by - 5 - sube * 9)], triste: true });
  cubo(b.mano[0] + 2, b.mano[1] + 2, vu);
  if (ci > 0.62) { const u = (ci - 0.62) / 0.38; for (let i = 0; i < 26; i++) { const v = u - (i >> 1) * 0.03; if (v <= 0) continue; const px = b.mano[0] + 4 + v * 5 + (h(i, 1) - 0.5) * 5, py = b.mano[1] + 4 + v * 8 + v * v * 40 + h(i, 2) * 3; R.pset(Math.round(px), Math.round(py), i % 3 ? hex('#a8c0d8') : hex('#f0f6fc')); R.pset(Math.round(px) + 1, Math.round(py) + 1, hex('#6a8098')); } }
  // Kemal se agarra al palo con una mano y con la otra aprieta el rollo contra el pecho; se encoge con cada golpe de mar
  const enc = Math.round(Math.max(0, Math.sin(t * 2.6)) * 1.5);
  const k = R.actor(EL.kemal, kx - 7, ky + enc, t, { dir: -1, sostiene: palo(17 - enc), triste: t > 2.6, sorpresa: g.rayo > 0.5 });
  const [rx, ry] = [k.cabeza[0] + 1, k.cabeza[1] + 14];
  rollito(rx, ry); R.rect(rx + 3, ry - 1, rx + 5, ry + 1, hex('#f6c290')); R.pset(rx + 5, ry - 1, K); R.pset(rx + 5, ry + 1, K);
  const gl = tramo(t, 2.75, 3.3) * (1 - tramo(t, 3.6, 4.1)); if (gl > 0) { for (let j = -9; j <= 9; j++) for (let i = -11; i <= 11; i++) { const d = Math.hypot(i / 1.2, j); if (d < 9) tin(rx + i, ry + j, hex('#ffe8a0'), gl * 0.45 * (1 - d / 9)); } }
  // el agua que barre la cubierta a los pies y las gotas que rebotan
  for (let i = 0; i < 10; i++) { const u = (t * 1.3 + i * 0.1) % 1, [dx, dy] = c(-50 + i * 11); R.pset(dx + Math.round(u * 6), dy - Math.round(Math.sin(u * Math.PI) * 3), u < 0.5 ? hex('#c8d4e4') : hex('#7a8aa0')); }
  T.marDelante(R, t, { encuadre: 'costa', camara: 'tormenta' });
};

// ── 2 · el taller: el rollo llega a manos de Piri, que se sienta a la mesa ──
const p2 = (t) => {
  T.galipoli(R, t, {});
  // el marinero entra con el rollo, se lo da y se va
  const s1 = tramo(t, P2 + 0.1, sobrino - 0.4), s2 = tramo(t, dos - 0.6, dos + 0.9);
  const sx = Math.round(s2 > 0 ? lerp(44, -22, s2) : lerp(-18, 44, s1));
  const da = t < sobrino + 0.1;
  const sm = R.actor(EL.marineroOtomano2, sx, 168, t, { dir: s2 > 0 ? -1 : 1, anda: (s1 > 0 && s1 < 1) || (s2 > 0 && s2 < 1), sostiene: da ? [sx + 20, 152] : false, habla: t > sobrino - 0.6 && t < sobrino && Math.sin(t * 8) > 0, triste: true });
  if (da) rollito(sm.mano[0] + 2, sm.mano[1]);
  // Piri: recibe el rollo, cruza el taller y se sienta detrás de la mesa
  const w1 = tramo(t, dos + 0.15, gal + 0.3), w2 = tramo(t, gal + 0.3, sienta - 0.1), si = tramo(t, sienta - 0.1, sienta + 0.2);
  let px = 72, py = 168; if (w2 > 0) { px = lerp(132, 192, w2); py = lerp(168, 145, w2); } else if (w1 > 0) px = lerp(72, 132, w1);
  py += si * 4;
  const deja = tramo(t, sienta + 0.35, sienta + 0.7), lleva = t > sobrino - 0.05 && deja < 1;
  const pi = R.actor(EL.piri, Math.round(px), Math.round(py), t, { dir: w1 > 0 ? 1 : -1, anda: (w1 > 0 && w1 < 1) || (w2 > 0 && w2 < 1), sostiene: (t > sobrino - 0.3 && t < sobrino + 0.1) ? [px - 6, 152] : lleva ? true : false, triste: t > sobrino && t < dos, sonrisa: t > sienta + 0.4, habla: t > sienta + 0.4 && Math.sin(t * 6) > 0.3 });
  // el rollo en la mano va detrás de la mesa mientras Piri está detrás; al dejarlo, encima del tablero
  const rx = pi.mano[0] + (deja > 0 ? Math.round(deja * 14) : 1), ry = pi.mano[1] - Math.round(Math.sin(deja * Math.PI) * 4);
  if (lleva && t > sobrino + 0.1 && deja === 0) rollito(rx, ry);
  T.galipoliDelante(R, t, {});
  if (lleva && deja > 0) rollito(rx, ry);
  // la carta se extiende sobre la mesa
  const ex = tramo(t, sienta + 0.7, sienta + 1.0);
  if (ex > 0) { const x0 = 206, x1 = Math.round(206 + ex * 30); R.poligono([[x0, 136], [x1, 136], [x1 + 3, 140], [x0 + 3, 140]], hex('#ecd8a8')); R.linea(x0, 136, x1, 136, K); R.linea(x0 + 3, 140, x1 + 3, 140, hex('#b89a64')); if (ex > 0.6) { R.linea(x0 + 6, 137, x0 + 10, 139, hex('#3a6a3a')); R.pset(x0 + 18, 138, hex('#c03020')); R.linea(x0 + 22, 137, x0 + 27, 138, hex('#2a2018')); } }
};

// ── 3 · la mesa desde arriba: las cartas de todo el mundo llegan a la piel ──
const CARTAS = [['ptolomeo', -30, 30, 66, 40, reunir], ['arabe', 140, -24, 136, 28, reunir + 0.35], ['portugues', 350, 70, 232, 42, unico], ['colon', 352, 160, 236, 124, unico + 0.35]];
const p3 = (t) => {
  const tr = lerp(0.12, 0.62, tramo(t, P3 + 0.2, P4 - 0.2));
  T.galipoli(R, t, { camara: 'mesa', trazo: tr });
  for (const [est, x0, y0, x1, y1, t0] of CARTAS) {
    const u = tramo(t, t0, t0 + 0.8); if (u <= 0) continue; const e = 1 - (1 - u) ** 3;
    const x = Math.round(lerp(x0, x1, e)), y = Math.round(lerp(y0, y1, e) - Math.sin(u * Math.PI) * 10);
    T.c_carta(R, x, y, est, { levanta: u < 1 ? 0.6 : Math.max(0, Math.sin(t * 2 + x) * 0.3) });
    const v = tramo(t, todo + (x1 > 160 ? 0.3 : 0), mundo); if (v > 0) { const tx = 166, ty = 92, dx = tx - x1, dy = ty - y1, n = Math.hypot(dx, dy), m = Math.round(v * (n - 16));
      for (let s = 16; s < 16 + m; s++) if (s % 4 < 2) { const px = Math.round(x1 + dx * s / n), py = Math.round(y1 + dy * s / n); R.pset(px, py, hex('#ffd860')); R.pset(px + 1, py + 1, hex('#8a5a10')); }
      if (v >= 1 && Math.sin(t * 10 + x1) > 0) for (const [ix, iy] of [[-16, -12], [15, -12], [-16, 11], [15, 11]]) R.pset(x1 + ix, y1 + iy, hex('#fff4b0')); }
  }
  T.galipoliDelante(R, t, { camara: 'mesa', trazo: tr });
};

// ── 4 · inserto: la esquina de arriba a la izquierda del bastidor, vista en ángulo y de cerca (fondo local) ──
// el listón de arriba baja hacia la derecha y el de la izquierda se abre hacia abajo; la piel, atada con cordones, no llega
// a los listones (por el hueco se ve la pared en sombra). En la piel, de cerca: una isla ocre (donde nace la torre), la
// costa verde de abajo a la derecha (donde nace el loro), el mar con una rosa vieja y sus rumbos. Detrás, la pared con la
// ventana en arco al estrecho, la hornacina de rollos y el candil colgado; delante, a la izquierda, la mesita con el bote
// de plumas, la salvadera, la tinta roja y el tintero negro donde Piri moja la pluma.
const yT = (x) => 52 + (x - 70) * 0.056, gT = (x) => 10 - (x - 70) * 0.012, xL = (y) => 78 - (y - 52) * 0.11;
const eT = (x) => 9 + 2.5 * Math.sin(x * 0.08) + 1.5 * Math.sin(x * 0.23 + 1), eL = (y) => 9 + 2.5 * Math.sin(y * 0.09 + 2) + 1.5 * Math.sin(y * 0.27);
const ISLA = [[236, 100], [252, 90], [272, 89], [288, 96], [296, 108], [284, 120], [252, 123], [236, 113]];
const VERDE = [[244, 182], [248, 162], [260, 148], [282, 141], [302, 140], [322, 134], [322, 182]];
const ISL = [[[110, 92], [120, 90], [124, 95], [114, 97]], [[204, 76], [212, 75], [213, 79], [205, 80]]];
const dentro = (x, y, P) => { let c = false; for (let i = 0, j = P.length - 1; i < P.length; j = i++) { const [xi, yi] = P[i], [xj, yj] = P[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; };
const S = new Uint8Array(320 * 180);   // 0 fuera de la piel, 1 mar, 2 tierra verde, 3 isla ocre
for (let y = 0; y < 180; y++) for (let x = 0; x < 320; x++) { if (y <= yT(x) + eT(x) || x <= xL(y) + eL(y)) continue; if (x < 100 && y < 80 && Math.hypot(x - 100, y - 80) > 17 + Math.sin(x * 0.7) * 0.8) continue;
  S[y * 320 + x] = dentro(x, y, VERDE) || ISL.some((I) => dentro(x, y, I)) ? 2 : dentro(x, y, ISLA) ? 3 : 1; }

// la torre con almenas, su puerta, una ventanita y la bandera; y = el pie

// las tres notas (garabatos de tinta en dos renglones) y la carta clavada en el listón de la que sale cada una

const PLUMA = [[P4, 200, 132], [gacela + 0.4, 128, 136], [gacela + 0.85, 196, 126], [rosas, 140, 120], [rosas + 0.6, 140, 120], [barcos - 0.1, 188, 138], [barcos + 0.4, 188, 138], [barcos + 0.5, 226, 148], [barcos + 0.85, 226, 148], [dibujos - 0.15, 290, 150], [dibujos + 0.4, 290, 150], [dibujos + 0.5, 264, 108], [dibujos + 0.8, 264, 108], [escribe - 0.05, 238, 116], [escribe + 0.4, 252, 116], [escribe + 0.6, 204, 100], [escribe + 1.0, 226, 100], [escribe + 1.2, 200, 124], [escribe + 1.6, 218, 124], [escribe + 2.0, 100, 147], [escribe + 2.3, 100, 147], [escribe + 3.0, 150, 184]];
const pluma = (t) => { let i = 0; while (i + 1 < PLUMA.length && PLUMA[i + 1][0] < t) i++; const a = PLUMA[i], b = PLUMA[Math.min(i + 1, PLUMA.length - 1)]; const u = b[0] > a[0] ? Math.max(0, Math.min(1, (t - a[0]) / (b[0] - a[0]))) : 0, e = u * u * (3 - 2 * u); return [lerp(a[1], b[1], e), lerp(a[2], b[2], e)]; };

const p4 = (t) => {
  capa('piel', fondoPiel);
  ventana(t); sprite('marco', marcoVentana);

  for (const [i, [cx, cy, est]] of CLAVADAS.entries()) { T.c_carta(R, cx, cy, est, { levanta: Math.max(0, Math.sin(t * 1.6 + i * 2)) * 0.35 }); R.disco(cx, cy - 10, 1.5, hex('#c8302a')); R.pset(cx - 1, cy - 11, hex('#ff8070')); }
  rosaNueva(tramo(t, rosas - 0.05, rosas + 0.6));
  barco(188, 142, tramo(t, barcos - 0.05, barcos + 0.35)); barco(226, 152, tramo(t, barcos + 0.5, barcos + 0.85));
  loro(290, 156, tramo(t, dibujos - 0.1, dibujos + 0.4)); torre(264, 114, tramo(t, dibujos + 0.5, dibujos + 0.8));

  for (const [i, [x, y, n]] of NOTAS.entries()) { const t0 = escribe + i * 0.6, u = tramo(t, t0, t0 + 0.4), m = Math.round(n * 1.6 * u);
    for (let k = 0; k < m; k++) { const r = k < n ? 0 : 1, kk = r ? k - n : k; R.pset(x + kk, y - 1 + r * 3 + Math.round(Math.sin(kk * 1.2 + r) * 1.3), hex('#2a2018')); if (kk % 5 === 2) R.pset(x + kk, y - 2 + r * 3, hex('#2a2018')); }
    const [cx, cy] = CLAVADAS[i], v = tramo(t, pieza + i * 0.2, pieza + i * 0.2 + 0.5); if (v > 0) { const sx = x + 2, sy = y - 3, tx = cx, ty = cy + 12, dx = tx - sx, dy = ty - sy, L = Math.hypot(dx, dy); for (let s = 0; s < L * v; s += 3) { const px = Math.round(sx + dx * s / L), py = Math.round(sy + dy * s / L); R.pset(px, py, hex('#c03424')); R.pset(px + 1, py, hex('#7a1a14')); }
      if (v >= 1 && Math.sin(t * 9 + i) > 0) for (const [ix, iy] of [[-16, -12], [15, -12], [-16, 11], [15, 11]]) R.pset(cx + ix, cy + iy, hex('#fff4b0')); } }

  let [px0, py0] = pluma(t); const ur = tramo(t, rosas, rosas + 0.6); if (ur > 0 && ur < 1) { const a = ur * Math.PI * 2 - Math.PI / 2; px0 = ROSA[0] + Math.cos(a) * 10; py0 = ROSA[1] + 2 + Math.sin(a) * 10; }
  const trazando = (t > barcos && t < barcos + 0.85) || (t > dibujos && t < dibujos + 0.8) || (t > escribe && t < escribe + 1.6);
  const px = Math.round(px0 + (trazando ? Math.sin(t * 17) * 1.2 : 0)), py = Math.round(py0 + (trazando ? Math.cos(t * 13) * 0.8 : 0) + (moja(t) ? Math.abs(Math.sin(t * 14)) * 2 : 0));

const año = (t) => t < dos ? 1511 : 1513;
