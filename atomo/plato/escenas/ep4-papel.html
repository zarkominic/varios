<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Corsario o pirata · ep4</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// EP4-PAPEL (frases 42–45).
//  heroe     pantalla partida: a la izquierda, Drake en sombra con una calavera; a la derecha, Drake de rodillas en
//            cubierta y la reina con una espada sobre su hombro.
//  papel     un papel con sello de lacre rojo cae, girando, por la línea que separa las dos mitades.
//  corsario  dos barcos idénticos; el papel cae sobre uno y su bandera cambia de calavera a estandarte; corona y
//            monedas en la caja.
//  papeleo   el papel vuela de un barco al otro y las banderas cambian con él: mismos barcos, mismos cañones.
import { escena } from '/atomo/plato/escena.js';
import { crearAventura, PALA, ELENCO } from '/atomo/plato/kits/pixel-aventura.js';
const E = await escena('ep4-papel', 'ep04');
const R = await crearAventura(document.getElementById('lienzo'));
const { PAL, tramo, lerp, clamp } = R;
const M = (k, d) => E.marca(k, d);
const m = { heroe: M('heroe', 0.5), papel: M('papel', 7), corsario: M('corsario', 9.5), papeleo: M('papeleo', 18) };

const carta = (x, y, giro, s = 1) => {
  const w = 9 * s, h = 12 * s;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const u = i - w / 2, v = j - h / 2, xx = Math.round(x + u * Math.cos(giro) - v * Math.sin(giro)), yy = Math.round(y + u * Math.sin(giro) + v * Math.cos(giro));
    const sello = Math.hypot(i - w / 2, j - h * 0.75) < 2 * s;
    R.pset(xx, yy, sello ? PAL.ROJO : j % 3 === 1 && i > 1 && i < w - 2 ? PAL.PERG[2] : PAL.MOON[3]);
  }
};
const partida = (t) => {
  // izquierda: sombra roja, Drake como pirata
  for (let y = 0; y < R.H; y++) for (let x = 0; x < 160; x++) R.pset(x, y, R.tone([PAL.INK, PAL.OBS[3], PAL.OBS[2]], 0.6 + 1.2 * Math.exp(-Math.hypot(x - 80, y - 90) / 50), x, y));
  R.personaje(80, 152, 54, { ...ELENCO.drake, t, objeto: 'espada', pose: 'senala', ceño: true });
  R.icono('calavera', 76, 30, PAL.MOON[3]);
  // derecha: cubierta a la luz de faroles, la reina y Drake de rodillas
  for (let y = 0; y < R.H; y++) for (let x = 160; x < R.W; x++) R.pset(x, y, R.tone(PAL.HULL, 1 + 2.8 * Math.exp(-Math.hypot(x - 240, y - 70) / 70), x, y));
  for (let y = 150; y < R.H; y++) for (let x = 160; x < R.W; x++) R.pset(x, y, R.tone(PAL.HULL, 2.2 + (x % 16 === 0 ? -1 : 0), x, y));
  R.vela(300, 60, t);
  R.personaje(214, 156, 46, { ...ELENCO.drake, t, pose: 'rodilla' });
  const toca = Math.sin(t * 2) > 0;
  R.personaje(268, 152, 54, { ...ELENCO.reina, t, dir: -1, pose: 'ofrece', objeto: 'espada' });
  if (toca) R.icono('corona', 232, 30, PAL.ORO[4]);
  R.rect(159, 0, 160, R.H, PAL.UI[5]);
  // el papel cae por la raya
  if (t > m.papel - 0.3) { const p = tramo(t, m.papel - 0.3, m.corsario - 0.2); carta(160 + 6 * Math.sin(p * 9), lerp(-10, 150, p), p * 8); }
};
const dosBarcos = (t) => {
  R.cielo(t, { luna: [160, 34, 12], semilla: 53 });
  R.mar(t, { luzX: 160 });
  // ¿qué barco lleva el papel? primero el de la izquierda; en «papeleo», va y viene
  const salto = t > m.papeleo + 0.2 ? Math.floor((t - m.papeleo - 0.2) / 1.2) % 2 : 0;
  const conPapel = salto === 0 ? 0 : 1;
  const llega = tramo(t, m.corsario + 0.3, m.corsario + 1.6);
  R.barco(90, 138, t, { tipo: 'galeon', esc: 0.8, farol: true, bandera: llega >= 1 && conPapel === 0 ? 'estandarte' : 'pirata' });
  R.barco(230, 138, t, { tipo: 'galeon', esc: 0.8, farol: true, dir: -1, fase: 0.4, bandera: llega >= 1 && conPapel === 1 ? 'estandarte' : 'pirata' });
  if (llega < 1) carta(lerp(160, 92, llega), lerp(-10, 70, llega), llega * 6);
  else {
    const f = t > m.papeleo + 0.2 ? ((t - m.papeleo - 0.2) / 1.2) % 1 : 1;
    const de = conPapel === 0 ? 228 : 92, a = conPapel === 0 ? 92 : 228;
    const x = f < 0.6 ? lerp(de, a, f / 0.6) : a, y = f < 0.6 ? 70 - 30 * Math.sin(Math.PI * f / 0.6) : 70;
    if (t > m.papeleo + 0.2) carta(x, y, f < 0.6 ? f * 10 : 0); else carta(92, 70, 0);
  }
};

E.iniciar((t) => {
  R.secuencia(t, [[0, partida], [m.corsario - 0.2, dosBarcos]]);
  const e = E.energia(t);
  R.caja(t, t > m.corsario + 1.6 && t < m.papeleo ? tramo(t, m.corsario + 1.6, m.corsario + 2) : 0, (x, y) => {
    R.icono('corona', x + 4, y + 6, PAL.ORO[4]); R.numero('+', x + 14, y + 12); R.icono('factura', x + 24, y + 4, PAL.UI[5]);
  }, { energia: e });
  R.companero(t, e);
  R.presentar();
});
</script>
</body>
</html>
