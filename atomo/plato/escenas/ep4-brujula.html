<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brújula · ep4</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// EP4-BRUJULA (frases 24–25), cartela 1275.
//  brujula     un puerto mediterráneo de noche con farolillos; luego, a la luz de una vela, una aguja imantada flota
//              en un cuenco de agua y gira hasta señalar la N.
//  portulanos  un portulano en la mesa: el Mediterráneo con sus costas y una red de líneas que salen de rosas de los
//              vientos; una galera pequeña sigue una de esas líneas.
import { escena } from '/atomo/plato/escena.js';
import { crearRetro } from '/atomo/plato/kits/pixel-retro.js';
const E = await escena('ep4-brujula', 'ep04');
const R = await crearRetro(document.getElementById('lienzo'));
const { PAL, tramo, lerp, clamp, sale } = R;
const M = (k, d) => E.marca(k, d);
const m = { brujula: M('brujula', 1.5), port: M('portulanos', 10) };
const cuenco = m.brujula + (m.port - m.brujula) * 0.4;

const puerto = (t) => {
  R.cielo(t, { luna: [250, 30, 9], hor: 120, semilla: 21 });
  // colina con casas blancas y farolillos
  R.poligono([[0, 120], [0, 70], [40, 60], [90, 76], [130, 100], [150, 120]], PAL.MIDC[1]);
  const rnd = R.mulberry32(5);
  for (let k = 0; k < 26; k++) {
    const x = Math.floor(rnd() * 130), y = Math.floor(70 + rnd() * 45);
    if (y < 64 + x * 0.3 - (x > 90 ? (x - 90) * 0.6 : 0)) continue;
    R.rect(x, y, x + 5, y + 4, PAL.MIDC[3]); R.rect(x, y - 1, x + 5, y - 1, PAL.FARC[3]);
    if (rnd() < 0.6) R.pset(x + 2, y + 2, PAL.FIRE[2 + (Math.sin(t * 5 + k) > 0.6 ? 1 : 0)]);
  }
  R.mar(t, { hor: 120, luzX: 250 });
  R.rect(110, 118, 200, 122, PAL.HULL[2]);  // muelle
  for (let x = 120; x < 200; x += 16) { R.rect(x, 110, x, 118, PAL.HULL[3]); R.halo(x, 108, 6, [PAL.FIRE[0], PAL.FIRE[1]]); R.pset(x, 108, PAL.FIRE[4]); }
  R.barco(240, 136, t, { tipo: 'carabela', esc: 0.9, farol: true, dir: -1 });
};
const aguja = (t) => {
  R.mesa(t, { luz: [100, 40] });
  R.vela(70, 50, t, { r: 26 });
  const cx = 170, cy = 96;
  R.disco(cx, cy, 44, (x, y, d) => R.tone(PAL.HULL, 4.4 - d * 1.6, x, y));
  R.disco(cx, cy, 38, (x, y, d) => R.tone(PAL.WATER, 3.6 - d * 1.2 + 0.5 * Math.sin((x - cx) * 0.3 + t * 2), x, y));
  // la aguja (sobre un trocito de corcho) gira y se asienta apuntando al norte
  const a0 = 2.1, p = sale(clamp((t - cuenco - 0.2) / 2.2, 0, 1));
  const a = lerp(a0, -Math.PI / 2, p) + 0.15 * Math.sin(t * 6) * (1 - p) + 0.03 * Math.sin(t * 2.3);
  const L = 26;
  for (let k = -L; k <= L; k++) { const x = cx + Math.cos(a) * k, y = cy + Math.sin(a) * k; R.pset(x, y, k > 0 ? PAL.ROJO : PAL.PLATA[2]); }
  R.disco(cx + 0.5, cy + 0.5, 3, PAL.ORO[1]);
  if (p > 0.95) R.numero('N', cx, cy - 46, { centro: true });
};
// el Mediterráneo (agua) y sus islas, a mano (lon, lat)
const MED = [[-5.6, 36.1], [-4.5, 36.7], [-2, 36.8], [-0.5, 38.3], [0.2, 39.5], [-0.3, 40.2], [1, 41], [3.2, 41.9], [3.1, 43], [4.5, 43.4], [6.5, 43.1], [8.5, 44.4], [10, 44], [10.5, 43], [12.3, 41.7], [14, 40.8], [15.6, 40], [15.8, 38.5], [16.6, 38.4], [17.1, 39], [16.5, 39.8], [17.2, 40.5], [18.5, 40.1], [18, 40.6], [16, 41.9], [14, 42.6], [12.4, 44.2], [12.3, 45.4], [13.7, 45.6], [15, 44.5], [17, 43.4], [19, 42], [19.5, 40.5], [20.5, 39.3], [21.1, 38.3], [22.5, 36.5], [23, 37.5], [24, 38.3], [22.9, 40.5], [24, 40.9], [26, 40.8], [26.3, 40.1], [26.5, 39], [27.2, 37.9], [28.2, 36.7], [30.5, 36.8], [32.8, 36.1], [36, 36.8], [35.9, 35], [35, 33], [34.3, 31.3], [32.3, 31.2], [30, 31.4], [25, 31.8], [20, 32], [20, 30.4], [19, 30.3], [15.6, 31.6], [11.5, 33.1], [10.2, 34.2], [11, 35.2], [10.2, 36.9], [9.8, 37.3], [8, 36.9], [3, 36.8], [0, 35.8], [-2, 35.1], [-5.4, 35.9]];
const NEGRO = [[28, 41.2], [29, 41.3], [31, 41.1], [33, 42], [36, 41.7], [38, 41], [40, 41], [41.5, 41.6], [41.6, 42.6], [39.5, 44], [38, 44.6], [37, 45.3], [35, 45], [33.5, 44.5], [32.5, 45.4], [31, 46.6], [30, 45.8], [29.7, 45], [28.6, 44], [28, 43]];
const ATLANTICO = [[-12, 28], [-12, 48], [-4.5, 48], [-1.5, 46.5], [-1.3, 44], [-1.8, 43.4], [-8, 43.7], [-9.3, 43], [-8.8, 41], [-9.5, 38.8], [-8.9, 37], [-7, 37.2], [-6.3, 36.8], [-5.6, 36.1], [-5.4, 35.9], [-6.8, 34], [-9.6, 30.5], [-9.8, 28]];
const ISLAS = [
  [[12.4, 38.1], [13.3, 38.2], [15.6, 38.3], [15.1, 37.3], [15.1, 36.7], [14.3, 37], [12.5, 37.6]],
  [[8.4, 39.1], [8.2, 40.6], [9.2, 41.2], [9.8, 40.9], [9.6, 39.2], [9, 39]],
  [[8.6, 41.4], [8.6, 42.5], [9.4, 43], [9.6, 42.2], [9.2, 41.4]],
  [[23.5, 35.3], [24.5, 35.6], [26.3, 35.3], [25, 35], [23.6, 35.2]],
  [[32.3, 34.7], [34.6, 35.6], [34, 34.6], [32.8, 34.6]],
  [[2.4, 39.5], [3.2, 39.95], [3.4, 39.6], [2.8, 39.3]],
];
const portulano = (t) => {
  R.mesa(t, { luz: [40, 20] });
  R.pergamino(24, 12, 296, 150, { luz: [40, 20], semilla: 15 });
  const pj = R.proyector(30, 18, 290, 144, -12, 42, 28, 48);
  const agua = [MED, NEGRO, ATLANTICO].map((p) => p.map(([a, b]) => pj(a, b)));
  const islas = ISLAS.map((p) => p.map(([a, b]) => pj(a, b)));
  R.recorte([30, 18, 290, 144]);
  // tierra donde no hay agua (o donde hay isla)
  for (let y = 18; y <= 144; y++) for (let x = 30; x <= 290; x++) {
    const mar = agua.some((p) => R.dentro(p, x + 0.5, y + 0.5)) && !islas.some((p) => R.dentro(p, x + 0.5, y + 0.5));
    if (!mar) R.pset(x, y, R.tone(PAL.PERG, 2.5 + 0.5 * (R.vnoise(x * 0.3, y * 0.3) - 0.5), x, y));
  }
  // rosas de los vientos y la red del portulano (solo sobre el agua)
  const rosas = [[112, 75], [184, 100]];
  const sobreAgua = (col) => (x, y) => agua.some((p) => R.dentro(p, x + 0.5, y + 0.5)) && !islas.some((p) => R.dentro(p, x + 0.5, y + 0.5)) ? col : null;
  for (const [rx, ry] of rosas) for (let k = 0; k < 16; k++) {
    const a = k / 16 * Math.PI * 2;
    R.linea(rx, ry, rx + Math.cos(a) * 300, ry + Math.sin(a) * 300, sobreAgua(k % 4 === 0 ? PAL.ROJO : k % 2 ? PAL.PERG[2] : PAL.TINTA), k % 4 === 0 ? 0 : 3);
  }
  for (const p of [...agua, ...islas]) R.costa(p, { relleno: false });
  R.recorte(null);
  for (const [rx, ry] of rosas) R.rosa(rx, ry, 9);
  // la galera sigue una línea de rumbo (hacia el este desde la primera rosa)
  const p = tramo(t, m.port + 1.2, m.port + 6);
  R.barco(112 + 6 + p * 60, 75 + 3, t, { tipo: 'carabela', esc: 0.3, espuma: false, bob: 0.3 });
};

E.iniciar((t) => {
  R.secuencia(t, [[0, (t) => R.cartela(t, '1275')], [1.2, puerto], [cuenco, aguja], [m.port - 0.2, portulano]]);
  if (t > 1.3) R.companero(t, E.energia(t));
  R.presentar();
});
</script>
</body>
</html>
