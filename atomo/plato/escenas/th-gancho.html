<canvas id="lienzo"></canvas>
<script type="module">
// TH-GANCHO (frases 1–3), 2013, cartela «2013». Ocho planos, todos con acción y vida de fondo:
// 1. la farmacia: la puerta automática se abre y entra la clienta; la enfermera ordena tubitos y luego la llama con la
//    mano; detrás del mostrador la farmacéutica cobra y coge una caja del estante; una señora coge un bote y se va a pagar;
//    un señor entra con su cesta;
// 2. la clienta se sienta en el sillón («sits down») y charla con la enfermera; a «needle» la enfermera señala el carrito
//    de siempre (jeringa grande y tres tubos de vena: la clienta se asusta), lo empuja fuera del plano y vuelve con la
//    lanceta; la clienta sonríe aliviada; detrás, la farmacéutica atiende y el señor se va a los estantes;
// 3. el inserto: la lanceta pica («prick»), brota la gota, la mano de la enfermera acerca el tubito y lo llena («drops»,
//    «tube»), lo levanta para enseñarlo («fingernail») y lo deja en la bandeja; la otra mano pone la tirita; detrás,
//    desenfocados, pasan clientes;
// 4. la promesa: la enfermera se la explica a la clienta y de la gota salen decenas de pruebas («dozens»: la clienta
//    alucina), la etiqueta del precio que baja («cheaper») y el reloj que corre («within hours»);
// 5. la sede: Holmes destapa su máquina tirando de la tela («machine»), la máquina se enciende, «29» sobre ella, se gira
//    a explicar y un foco la ilumina («black turtleneck»); detrás de los cristales trabajan empleados; el guardia habla por
//    la radio y vigila la puerta;
// 6. la sede a oscuras: el contador gira como una tragaperras hasta $9,000,000,000 («nine billion»); abajo, Holmes posa
//    entre dos fotógrafos con sus flashes; al llegar a la cifra, confeti dorado;
// 7. la farmacia: la clienta se levanta, se despide con la mano y sale por la puerta, contenta (no sabe nada); la
//    enfermera mete el tubito en la nevera de transporte y la cierra; el mensajero entra, la recoge y se la lleva;
// 8. el laboratorio: el técnico llega con la nevera, mira atrás («out of sight») y pone el tubito en la cinta de las
//    máquinas grandes de otras marcas («equipment»); una Edison del banco echa humo y la técnica, tras abanicarlo, se
//    encoge de hombros y señala las otras máquinas («other companies»: sus placas parpadean); la puerta se cierra (golpe).
import * as T from '/atomo/plato/escenas/th-comun.js';
import { manoBaja } from '/atomo/plato/escenas/ov-comun.js';
import { ELENCO_CHIBI as EL } from '/atomo/plato/kits/pixel-chibi.js';
const { E, R, M } = await T.preparar('th-gancho');
const { tramo, lerp, hex } = R;
const C = T.C;
const en = (k, f) => T.momento(M, k, f);
const a = (f) => en('farmacia', f), b = (f) => en('promesa', f), c = (f) => en('secreto', f);
const P2 = a(0.3), P3 = a(0.64), P4 = b(0), P5 = b(0.34), P6 = b(0.76), P7 = c(0), P8 = c(0.46);
const sienta = a(0.36), aguja = a(0.54), tubos = a(0.58), pica = a(0.69), gotas = a(0.85), tubo = a(0.89), una = a(0.94);
const decenas = b(0.13), barato = b(0.2), horas = b(0.28), maquina = b(0.355), veintinueve = b(0.45), jersey = b(0.64), nueve = b(0.91), dolares = b(0.97);
const noSabe = c(0.1), noFunciona = c(0.27), dicen = c(0.37), lab = c(0.52), escondidas = c(0.56), equipo = c(0.78), otras = c(0.91);
const lin = (t, a0, a1) => Math.max(0, Math.min(1, (t - a0) / (a1 - a0)));
const parpadeo = (t, v = 6) => Math.sin(t * v) > 0;

// ── piezas locales ──────────────────────────────────────────────────────────────────────────────────────────────
// lo que va detrás de una pieza del decorado: guarda esos rectángulos, dibuja y los repone encima
const detras = (rects, dibuja) => {
  const g = rects.map(([x0, y0, x1, y1]) => { const v = []; for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) v.push(R.pget(x, y)); return v; });
  dibuja();
  rects.forEach(([x0, y0, x1, y1], k) => { let i = 0; for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) R.pset(x, y, g[k][i++]); });
};
// lo que se ve a través de un cristal: lo dibujado en la caja se mezcla con el color del cristal
const trasCristal = (x0, y0, x1, y1, col, al, dibuja) => {
  const v = []; for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) v.push(R.pget(x, y));
  dibuja(); const cr = col & 255, cg = (col >> 8) & 255, cb = (col >> 16) & 255; let i = 0;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const p = R.pget(x, y); if (p !== v[i++]) { const r = p & 255, g = (p >> 8) & 255, bb = (p >> 16) & 255; R.pset(x, y, (0xff000000 | (Math.round(bb + (cb - bb) * al) << 16) | (Math.round(g + (cg - g) * al) << 8) | Math.round(r + (cr - r) * al)) >>> 0); } }
};
// la mano que cuelga al andar: dónde lleva algo un personaje (x, suelo, dir)
const enMano = (x, suelo, dir) => [dir > 0 ? x + 11 : x - 5, suelo - 9];
// la cesta roja de la compra, con algún bote dentro (n)
const cesta = (x, y, n = 1) => {
  for (let k = 0; k < n; k++) { R.rect(x + 2 + k * 2, y - 3, x + 3 + k * 2, y, C.k); R.pset(x + 2 + k * 2, y - 2, [hex('#4a8ae8'), hex('#f0c040'), hex('#5ab85a')][k % 3]); }
  R.rect(x + 1, y - 3, x + 1, y, C.k); R.rect(x + 7, y - 3, x + 7, y, C.k); R.rect(x + 1, y - 3, x + 7, y - 3, C.k);
  R.rect(x, y, x + 8, y + 5, C.k); R.rect(x + 1, y + 1, x + 7, y + 4, C.rojoW); R.rect(x + 1, y + 3, x + 7, y + 3, hex('#a81e2c'));
};
// la nevera de transporte: blanca con la tapa azul (tapa: 0 cerrada – 1 abierta)
const nevera = (x, y, tapa = 0) => {
  R.rect(x, y, x + 12, y + 9, C.k); R.rect(x + 1, y + 1, x + 11, y + 8, C.blanco); R.rect(x + 1, y + 5, x + 11, y + 5, hex('#d8dce4')); R.pset(x + 6, y + 3, C.rojoW); R.rect(x + 5, y + 3, x + 7, y + 3, C.rojoW); R.rect(x + 6, y + 2, x + 6, y + 4, C.rojoW);
  if (tapa < 0.5) { R.rect(x - 1, y - 2, x + 13, y, C.k); R.rect(x, y - 1, x + 12, y - 1, hex('#3a6ac8')); R.rect(x + 4, y - 4, x + 8, y - 2, C.k); }
  else { R.rect(x - 2, y - 13, x, y, C.k); R.rect(x - 1, y - 12, x - 1, y - 1, hex('#3a6ac8')); }
};
// el carrito del análisis de siempre: bandeja de acero con la jeringa grande y la gradilla con tres tubos de vena
const carrito = (x, suelo, brilla = 0) => {
  const { rect, disco, pset } = R, y = suelo - 16;
  rect(x, y, x + 24, y + 2, C.k); rect(x + 1, y + 1, x + 23, y + 1, C.metalL);
  rect(x + 2, y + 3, x + 3, suelo - 3, C.metalD); rect(x + 21, y + 3, x + 22, suelo - 3, C.metalD); rect(x + 2, suelo - 8, x + 22, suelo - 7, C.metalD);
  for (const dx of [3, 21]) { disco(x + dx, suelo - 1, 2, C.k); const an = x * 0.45; pset(Math.round(x + dx + Math.cos(an)), Math.round(suelo - 1 + Math.sin(an)), C.metal); }
  rect(x - 1, y - 4, x + 1, y - 1, C.k); rect(x + 1, y - 3, x + 3, y - 2, C.metalD);   // el émbolo
  rect(x + 3, y - 5, x + 12, y, C.k); rect(x + 4, y - 4, x + 11, y - 1, hex('#e8f4fc')); for (let i = 5; i < 12; i += 2) pset(x + i, y - 4, hex('#9ab0c8')); rect(x + 4, y - 2, x + 7, y - 1, C.sangreL);
  rect(x + 13, y - 3, x + 18, y - 3, C.metalD); pset(x + 12, y - 3, C.k);   // la aguja
  if (brilla) { const gx = x + 18, gy = y - 3; for (let r = 1; r < 4; r++) { pset(gx + r, gy, C.blanco); pset(gx, gy - r, C.blanco); pset(gx, gy + r, C.blanco); } }
  for (let k = 0; k < 3; k++) { const tx = x + 14 + k * 3; rect(tx, y - 12, tx + 2, y - 1, C.k); rect(tx + 1, y - 11, tx + 1, y - 2, C.blanco); rect(tx + 1, y - 7, tx + 1, y - 2, C.sangre); rect(tx, y - 14, tx + 2, y - 12, [C.rojoW, C.tealT, hex('#8a5ad8')][k]); }
  rect(x + 13, y - 5, x + 23, y - 4, C.metalD);   // la gradilla
};
// la tela que tapa la máquina: tapada (u = 0), recogida en la mano de Holmes (0.5) y caída a sus pies (1)
const telaMaquina = (u) => {
  const A = [[166, 134], [170, 110], [194, 105], [218, 110], [222, 134]], B = [[158, 146], [161, 136], [165, 134], [170, 138], [168, 148]], Cc = [[144, 159], [147, 154], [156, 152], [166, 154], [170, 159]];
  const p = u < 0.5 ? A.map(([x, y], i) => [lerp(x, B[i][0], u * 2), lerp(y, B[i][1], u * 2)]) : B.map(([x, y], i) => [lerp(x, Cc[i][0], (u - 0.5) * 2), lerp(y, Cc[i][1], (u - 0.5) * 2) + Math.sin((u - 0.5) * Math.PI * 2) * -3]);
  const q = p.map(([x, y]) => [Math.round(x), Math.round(y)]);
  R.poligono(q.map(([x, y]) => [x, y + 1]), C.k); R.poligono(q, hex('#e4e2f0'));
  for (let k = 1; k < 4; k++) { const f = k / 4, x0 = Math.round(lerp(q[1][0], q[3][0], f)), y0 = Math.round(lerp(q[1][1], q[3][1], f)), x1 = Math.round(lerp(q[0][0], q[4][0], f)), y1 = Math.round(lerp(q[0][1], q[4][1], f)); R.linea(x0, y0 + 2, x1, y1 - 1, hex('#c4c2d4')); }
};
// la farmacéutica de bata blanca detrás del mostrador (no se le ven las piernas) y quien espera al otro lado, del que
// solo asoman la cabeza y los hombros por encima del panel de Theranos
const mostrador = (t, bx, bdir, bo = {}, cliente = null) => {
  detras([[110, 74, 214, 92], [139, 64, 149, 77], [175, 64, 185, 77]], () => R.actor(EL.tecnica, Math.round(bx), 82, t, { dir: bdir, ...bo }));
  if (cliente) detras([[90, 92, 230, 140]], () => R.actor(cliente.def, cliente.x, 102, t, { dir: cliente.dir ?? -1, ...cliente.o }));
};
// los clientes desenfocados que pasan por detrás del inserto (solo sobre la pared clara)
const desenfocado = (t, x, col) => {
  for (let y = 8; y < 92; y++) for (let xx = x - 16; xx <= x + 16; xx++) {
    if ((xx + y) % 2) continue; const cab = Math.hypot(xx - x, y - 30) < 10, cuerpo = y > 40 && Math.abs(xx - x) < 15 - (y < 46 ? 46 - y : 0);
    if (!cab && !cuerpo) continue; const p = R.pget(xx, y), r = p & 255, g = (p >> 8) & 255, bb = (p >> 16) & 255; if (r < 214 || g < 206 || bb < 196) continue; R.pset(xx, y, col);
  }
};

// ── 1 · la clienta entra en la farmacia ──────────────────────────────────────────────────────────────────────────
const p1 = (t) => {
  const u = tramo(t, 1.7, P2 - 0.4), v = tramo(t, 3.0, P2 + 0.2);
  T.farmacia(R, t, { puerta: tramo(t, 1.3, 1.8) - tramo(t, P2 - 2, P2 - 1.4) });
  // la farmacéutica cobra en la caja, se gira, coge una caja del estante y vuelve
  const ida = tramo(t, 3.5, 4.3), vuelta = tramo(t, 5.0, 5.8), bx = lerp(156, 124, ida - vuelta), anda = (ida > 0 && ida < 1) || (vuelta > 0 && vuelta < 1);
  mostrador(t, bx, t < 3.5 || t > 5.0 ? 1 : -1, { anda, dedo: t > 4.35 && t < 4.9, habla: t < 3.2 && parpadeo(t, 7) }, { def: EL.chica, x: 184, o: { habla: t > 1.8 && t < 3.2 && !parpadeo(t, 7), sonrisa: t > 5.9, dedo: t > 2.4 && t < 2.9 } });
  if (t > 4.6 && t < 5.9) { const [hx, hy] = [Math.round(bx) + (t < 5.0 ? -4 : 13), t < 4.9 ? 56 : 64]; R.rect(hx, hy, hx + 5, hy + 4, C.k); R.rect(hx + 1, hy + 1, hx + 4, hy + 3, hex('#a8c8e8')); }
  if (t >= 5.9) { R.rect(196, 70, 201, 74, C.k); R.rect(197, 71, 200, 73, hex('#a8c8e8')); }
  // la señora del fondo coge un bote del estante, lo echa a la cesta y se va a pagar
  const s = tramo(t, 4.6, 6.6), sx = Math.round(lerp(252, 336, s));
  R.actor(EL.senora30, sx, 156, t, { dir: t < 2.4 ? -1 : 1, dedo: t > 2.6 && t < 3.3, anda: s > 0 && s < 1, sonrisa: t > 3.4 });
  { const [cx, cy] = enMano(sx, 156, t < 2.4 ? -1 : 1); cesta(cx, cy, t > 3.3 ? 2 : 1); }
  // la enfermera ordena la bandeja de tubitos y, cuando la clienta se acerca, la llama con la mano
  R.actor(EL.enfermera, 196, 146, t, { dir: t < 4.0 ? 1 : -1, dedo: (t > 2.2 && t < 2.8) || (u > 0.72 && u < 1), sonrisa: u > 0.55, habla: u > 0.85 && parpadeo(t, 7) });
  R.actor(EL.clienta, Math.round(lerp(4, 132, u)), 152, t, { dir: 1, anda: u > 0 && u < 1, sonrisa: u > 0.75 });
  // un señor entra con su cesta por la derecha, mirando los estantes
  const vx = Math.round(lerp(336, 214, v)); R.actor(EL.senor30, vx, 170, t, { dir: -1, anda: v > 0 && v < 1 }); { const [cx, cy] = enMano(vx, 170, -1); cesta(cx, cy, 0); }
};
// ── 2 · se sienta; el carrito de siempre se va ───────────────────────────────────────────────────────────────────
const empuja = P3 - 1.3;
const p2 = (t) => {
  T.farmacia(R, t);
  mostrador(t, 158, 1, { habla: t > 7.5 && t < 9 && parpadeo(t, 7), dedo: t > 9.6 && t < 10.4 }, { def: EL.chica, x: 184, o: { sonrisa: t > 10.2, dedo: t > 9.8 && t < 10.4 } });
  if (t > 9.6 && t < 10.3) { const hx = Math.round(lerp(176, 186, tramo(t, 9.6, 10.2))); R.rect(hx, 62, hx + 6, 70, C.k); R.rect(hx + 1, 63, hx + 5, 69, C.blanco); }   // la bolsa de papel que pasa por encima del mostrador
  // la clienta llega al sillón y se sienta
  const w = tramo(t, P2 + 0.1, sienta - 0.1), z = tramo(t, sienta - 0.1, sienta + 0.2), sentada = z > 0.5;
  const cx = Math.round(z > 0 ? lerp(146, 150, z) : lerp(132, 146, w)), cy = Math.round(z > 0 ? lerp(142, 134, z) : lerp(152, 142, w));
  const susto = t > aguja - 0.1 && t < empuja + 0.4, alivio = t > empuja + 0.6;
  const clienta = () => R.actor(EL.clienta, cx, cy, t, { dir: 1, anda: w > 0 && w < 1 && z === 0, sorpresa: susto, sonrisa: alivio || (t > sienta + 0.5 && t < 9.0), habla: t > 9.0 && t < 10.0 && parpadeo(t, 8) });
  if (sentada) { clienta(); T.sillonDelante(R, 150, 140); } else { T.sillonDelante(R, 150, 140); clienta(); }
  // la enfermera charla, señala el carrito de siempre («needle», «tubes»), lo empuja fuera y vuelve con la lanceta
  const mira = t > aguja - 0.6 && t < P3 - 0.5, conLanceta = t > P3 - 0.5;
  R.actor(EL.enfermera, 182, 146, t, { dir: mira ? 1 : -1, habla: t > sienta + 0.3 && t < 9.0 && parpadeo(t, 7), dedo: (mira && t > aguja - 0.2) || conLanceta, sonrisa: t > 9.0 && !mira });
  if (conLanceta) { R.rect(179, 117, 183, 125, C.k); R.rect(180, 118, 182, 124, C.tealT); R.rect(180, 118, 182, 119, C.verdeT); }
  const rueda = Math.max(0, (t - empuja) / 0.75), kx = Math.round(200 + 150 * Math.min(1, rueda) ** 2);
  if (kx < 330) carrito(kx, 150, t > aguja && t < aguja + 0.35);
  if (t > tubos && t < tubos + 0.4 && kx < 330) for (let k = 0; k < 3; k++) { R.pset(kx + 15 + k * 3, 117, C.blanco); R.pset(kx + 15 + k * 3, 116, C.blanco); }   // los tres tubos brillan a «tubes»
  // el señor de la cesta se va hacia los estantes de la izquierda (va por delante: está más cerca)
  const v = tramo(t, P2 + 0.4, P2 + 4.2), vx = Math.round(lerp(214, 56, v)); R.actor(EL.senor30, vx, 170, t, { dir: -1, anda: v > 0 && v < 1, dedo: t > P2 + 4.6 && t < P2 + 5.3 }); { const [qx, qy] = enMano(vx, 170, -1); cesta(qx, qy, t > P2 + 5.3 ? 1 : 0); }
};
// ── 3 · el inserto del pinchazo ──────────────────────────────────────────────────────────────────────────────────
const lleva = gotas - 0.9, llena = [gotas, tubo + 0.1], ensena = [una - 0.6, una], aBandeja = [una + 0.3, una + 1.2], tirita = [una + 0.1, una + 1.0];
const p3 = (t) => {
  const crece = tramo(t, pica + 0.15, pica + 1.0), seca = lin(t, llena[0], llena[1]);
  T.insertoDedo(R, t, { pica: t < pica ? tramo(t, pica - 0.7, pica) : 1 + tramo(t, pica, pica + 0.8) * 0.8, gota: crece * (1 - seca), recoge: 0 });
  // por detrás, desenfocados, pasan dos clientes
  desenfocado(t, Math.round(lerp(-30, 350, lin(t, P3, P4 + 2))), hex('#d6cfc6')); desenfocado(t, Math.round(lerp(360, -40, lin(t, P3 + 2.5, P4 + 4))), hex('#d2d6dc'));
  // la mano de la enfermera trae el tubito vacío, recoge la gota, lo enseña y lo deja en la bandeja
  const llega = tramo(t, lleva, gotas - 0.1), sube = tramo(t, ensena[0], ensena[1]), deja = tramo(t, aBandeja[0], aBandeja[1]);
  const hx = Math.round(deja > 0 ? lerp(178, 272, deja) : lerp(340, 178, llega)), hy = Math.round(deja > 0 ? lerp(90, 142, deja) : 104 - 14 * sube);
  if (t < aBandeja[1] + 0.05) { T.tubito(R, hx - 12, hy + 4, 1, seca); T.mano(R, hx, hy, -1, '#4aa8a0'); if (sube > 0.6 && deja === 0 && Math.sin(t * 9) > 0) for (let r = 2; r < 5; r++) { R.pset(hx - 12 + r, hy - 6, C.blanco); R.pset(hx - 12 - r, hy - 6, C.blanco); R.pset(hx - 12, hy - 6 - r, C.blanco); } }
  else { T.tubito(R, 260, 146, 1, 1, C.verdeT); T.mano(R, Math.round(lerp(272, 340, tramo(t, aBandeja[1], aBandeja[1] + 0.6))), 142, -1, '#4aa8a0'); }
  // la otra mano baja con la tirita y la pega en la yema
  const ti = tramo(t, tirita[0], tirita[1] - 0.4), va = tramo(t, tirita[1] - 0.3, tirita[1] + 0.3);
  if (ti > 0 && va < 1) { const ty = Math.round(lerp(-20, 99, ti) - lerp(0, 130, va)); if (ti < 1) { R.rect(156, ty + 4, 165, ty + 7, C.k); R.rect(157, ty + 5, 164, ty + 6, hex('#e8c8a0')); } manoBaja(R, 214, -16, 160, ty + 2, '#4aa8a0'); }
  if (ti >= 1) { R.rect(156, 102, 165, 106, C.k); R.rect(157, 103, 164, 105, hex('#e8c8a0')); R.rect(159, 103, 162, 105, hex('#f4e0c8')); }
};
// ── 4 · la promesa ───────────────────────────────────────────────────────────────────────────────────────────────
const ICONOS = ['gota', 'reloj', 'balanza', '?', 'corona', 'pila', 'luna', 'factura'], COLS = [C.tealT, C.verdeT, C.amarilloT, hex('#e8a8b8')];
const sale0 = P4 + 0.3, sale1 = decenas + 1.2;
const p4 = (t) => {
  T.promesa(R, t, { u: 0 });
  for (let k = 0; k < 30; k++) {
    const t0 = sale0 + (sale1 - sale0) * ((k * 11) % 30) / 30, f = tramo(t, t0, t0 + 0.55); if (f <= 0) continue;
    const an = -Math.PI + (k + 0.5) / 30 * Math.PI, r = 40 + (k % 3) * 17 + Math.sin(t * 2 + k) * 1.5, X = 160 + Math.cos(an) * r * 1.65, Y = 90 + Math.sin(an) * r * 0.95;
    const x = Math.round(lerp(160, X, f)), y = Math.round(lerp(84, Y, f) - Math.sin(f * Math.PI) * 10), col = COLS[k % 4];
    R.rect(x - 6, y - 6, x + 6, y + 6, C.k); R.rect(x - 5, y - 5, x + 5, y + 5, col); if (ICONOS[k % 8] === 'gota') R.disco(x, y, 2, C.sangre); else R.icono(ICONOS[k % 8], x - 3, y - 3, C.k, col);
