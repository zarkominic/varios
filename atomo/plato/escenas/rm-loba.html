<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Loba · ep5</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// RM-LOBA (frase 8). Cartela «753». El mapa de Italia con Roma como un punto (el acto empieza en el mapa). Luego, de
// noche, siete colinas junto al río: una loba se acerca a una cesta con dos bebés y la husmea.
import { preparar, rodar } from '/atomo/plato/escenas/rm-comun.js';
const { E, R, M } = await preparar('rm-loba');
const { PALA, PR, tramo, lerp } = R;
const m0 = M('loba', 1.5);
const mapa = (t) => R.mapaAño(t, -753, { vista: R.VISTAS.italia, tiber: 1, colinas: 1 });
const noche = (t) => {
  R.ambiente({ luz: { lado: 1, color: PR.NIEVE[2] }, sombra: PALA.CONTORNO });
  R.cielo(t, { luna: [250, 30, 10], hor: 120, semilla: 75 });
  for (let k = 0; k < 7; k++) R.colinas(108 + (k % 3) * 6, { amp: 9, frec: 0.05 + k * 0.004, semilla: k * 1.7, luz: 0.6 + k * 0.15, rampa: PR.HIERBA, hasta: 140 });
  for (let y = 140; y < 152; y++) for (let x = 0; x < R.W; x++) R.pset(x, y, R.tone(PR.AGUA, 1 + (Math.sin(x * 0.25 + y - t * 3) > 0.85 ? 1.5 : 0) + (y - 140) * 0.05, x, y));
  for (let x = 236; x < 264; x++) if (R.b4(x, 145) < 0.5) R.pset(x, 141 + (x % 3), PR.NIEVE[3]);
  R.suelo(152, PR.HIERBA, { luz: 1.2 });
  R.cesta(190, 160, t);
  const p = tramo(t, m0 + 2.8, m0 + 6);
  R.loba(lerp(-20, 170, p), 166, t, { anda: p > 0 && p < 1, cabeza: p >= 1 ? 3 + Math.sin(t * 4) : 0, esc: 0.8 });
};
rodar(E, R, [[0, mapa], [m0 + 2.2, noche]], { cartela: '753', año: -753 });
</script>
</body>
</html>
