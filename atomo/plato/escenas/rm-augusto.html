<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Augusto · ep5</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// RM-AUGUSTO (frases 20–21). Cartela «27». El mapa con Roma alrededor del Mediterráneo. Octavio rechaza la corona de
// rey que le ofrecen y se pone el laurel; los senadores aplauden sin ganas; «1» en la caja (el primer ciudadano). Luego
// la ciudad en paz al atardecer y «200» años en la caja.
import { preparar, rodar } from '/atomo/plato/escenas/rm-comun.js';
const { E, R, M } = await preparar('rm-augusto');
const { PALA, PR, ELENCO, tramo, lerp } = R;
const m = { aug: M('augusto', 1.5), emp: M('emperador', 14) };
const octavio = { ...ELENCO.cesar, pelo: PALA.PELO_RUBIO, peinado: 'corto', capa: null };
const S = R.SUELO_SALON;
const mapa = (t) => R.mapaAño(t, -27);
const rechaza = (t) => {
  R.salon(t, { trono: false, estatua: false, cortina: false });
  const u = t - m.aug - 2.4, niega = u > 0.6 && u < 2.8, pone = u > 3.2;
  R.personaje(118, S + 22, 30, { ...octavio, sombrero: pone ? 'laurel' : 'no', t, dir: niega && Math.sin(t * 10) > 0 ? -1 : 1, sonrisa: pone });
  R.personaje(160, S + 22, 28, { ...ELENCO.senador, pelo: PALA.PELO_BLANCO, t, dir: -1, pose: u < 3.4 ? 'ofrece' : 'pie', objeto: u < 3.4 ? 'corona' : undefined });
  for (let k = 0; k < 4; k++) R.personaje(200 + k * 24, S + 26 + (k & 1) * 4, 26, { ...ELENCO.senador, pelo: [PALA.PELO_BLANCO, PALA.PELO_CASTANO][k & 1], peinado: k === 2 ? 'calvo' : 'corto', t: t + k, dir: -1, pose: u > 5 && Math.sin(t * 3 + k) > 0.3 ? 'brazos' : 'pie', ceño: true });
};
const paz = (t) => {
  R.cieloR(t, 'tarde', { sol: [240, 110, 12] });
  R.skyline(124, { semilla: 11, esc: 1.3 }); R.templo(110, 124, 60, 30, { rampa: [PALA.PURPURA[0], PALA.PURPURA[1], PALA.PURPURA[1], PALA.PURPURA[2], PALA.PURPURA[2]] });
  R.colinas(150, { amp: 6, luz: 1.2 });
  R.personaje(200, 168, 28, { ...ELENCO.cesar, pelo: PALA.PELO_RUBIO, peinado: 'corto', t, pose: 'manos_cintura', sonrisa: true });
  for (let k = 0; k < 4; k++) { const x = (k * 80 + t * 6) % 340 - 10; R.pset(Math.round(x), 50 + k * 6, PALA.CONTORNO); R.pset(Math.round(x) - 1, 49 + k * 6, PALA.CONTORNO); R.pset(Math.round(x) + 1, 49 + k * 6, PALA.CONTORNO); }
};
rodar(E, R, [[0, mapa], [m.aug + 2.4, rechaza], [m.emp - 0.2, paz]], { cartela: '27', año: (t) => (t < m.emp ? -27 : Math.round(lerp(-27, 180, tramo(t, m.emp + 1, m.emp + 4)))), caja: (t, e) => R.caja(t, t > m.aug + 7 && t < m.emp - 0.2 ? tramo(t, m.aug + 7, m.aug + 7.4) : t > m.emp + 1 ? tramo(t, m.emp + 1, m.emp + 1.4) : 0, (x, y) => { if (t < m.emp) { R.icono('persona', x + 4, y + 2, undefined, undefined, 2); R.numero('1', x + 22, y + 12); } else R.numero(String(Math.round(200 * tramo(t, m.emp + 1.4, m.emp + 4))), x + 8, y + 12); }, { energia: e }) });
</script>
</body>
</html>
