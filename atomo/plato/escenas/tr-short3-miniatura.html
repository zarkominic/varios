<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Miniatura vertical · ep23 Short 3</title>
<style>html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; } canvas { display: block; position: fixed; inset: 0; }</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script type="module">
// TR-SHORT3-MINIATURA · miniatura vertical del Short 3 del ep23, «La canción de cumpleaños cobraba 2 millones al año», en
// el estilo noir aprobado (ayudas en noir-mini.js). Un juzgado a oscuras: al fondo, el estrado de madera y la balanza de
// la justicia en la pared, con las sombras de la persiana; en la mesa, en el único charco de luz, un pastel de cumpleaños
// de verdad (nata, glaseado de chocolate que gotea, velas encendidas en ámbar, sin cara); en primer plano, el mazo de
// madera junto a su base, que pilla la luz de las velas. Humo de las velas, grano y viñeta. Arriba, «$2» en blanco hueso.
// Todo lo que cuenta va en la columna central x 110–210 (lo que queda en 9:16). Sin palabras: solo cifras y símbolos.
import { preparar } from '/atomo/plato/escenas/noir-mini.js';
const N = await preparar(document.getElementById('lienzo'));
const { W, H, K, hex, set, get, hh, tinte, mez, trama, poligono, elipse, halo, linea } = N;

const dibujar = () => {
  // 1 · la pared del fondo: paneles de madera oscura y la luz fría de una ventana alta que entra por la persiana
  const MAD = [hex('#0e0a0a'), hex('#140e0c'), hex('#1a1210')];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const panel = (x % 40 === 0 || x % 40 === 39 || y === 30) ? hex('#080606') : MAD[Math.floor(hh(x >> 4, y >> 3, 2) * 2.4)]; set(x, y, panel); }
  for (let y = 0; y < 100; y++) for (let x = 0; x < W; x++) { const d = Math.hypot((x - 230) / 140, (y - 30) / 70); if (d < 1) tinte(x, y, hex('#3a4a78'), 0.32 * (1 - d)); }
  N.persiana({ paso: 12, ancho: 5, pendiente: -0.45, fFuera: 0.55, luz: '#5a6a98', fLuz: 0.1, y1: 100 });
  // 2 · la balanza de la justicia en la pared, en relieve oscuro con el filo de la ventana; y el estrado
  { const BZ = hex('#060404'), FB = hex('#4a5a8a');
    for (let y = 50; y < 88; y++) { set(159, y, BZ); set(160, y, BZ); set(161, y, y < 70 ? FB : BZ); }
    poligono([[150, 86], [170, 86], [166, 82], [154, 82]], BZ);
    elipse(160, 49, 2.4, 2.4, BZ); set(161, 48, FB);
    for (let x = 136; x <= 184; x++) { const y = Math.round(54 + (x - 160) * 0.06); set(x, y, BZ); set(x, y + 1, BZ); set(x, y - 1, FB); }
    for (const [px, py] of [[137, 53], [183, 56]]) { linea(px, py, px - 7, py + 18, BZ); linea(px, py, px + 7, py + 18, BZ);
      for (let x = px - 9; x <= px + 9; x++) { const u = (x - px) / 9; set(x, Math.round(py + 18 + (1 - u * u) * 3), BZ); set(x, Math.round(py + 17 + (1 - u * u) * 3), x > px ? FB : BZ); } } }
  poligono([[0, 88], [320, 88], [320, 140], [0, 140]], (x, y) => ((x % 32 === 0 || y === 96) ? hex('#060404') : (hh(x >> 2, y >> 1, 7) > 0.75 ? hex('#1a1210') : hex('#130d0b'))));
  for (let x = 0; x < W; x++) { set(x, 88, hex('#2e2018')); set(x, 89, hex('#1e1410')); }
  // 3 · la mesa de delante, con el charco de luz de las velas
  poligono([[0, 140], [320, 140], [320, 180], [0, 180]], (x, y) => (hh(x >> 3, y, 2) > 0.5 ? hex('#22160e') : hex('#1a110b')));
  for (let x = 0; x < W; x++) set(x, 140, hex('#3a2818'));
  for (let y = 80; y < H; y++) for (let x = 70; x < 250; x++) { const d = Math.hypot((x - 160) / 72, (y - 138) / 44); if (d < 1) tinte(x, y, N.AMBAR, 0.5 * (1 - d) ** 1.3); }
  // 4 · el pastel: plato, cuerpo cilíndrico de nata, el chocolate que gotea, ribete y las velas
  const CX = 160, TOP = 112, BASE = 136, RX = 24, RY = 6;
  elipse(CX, BASE + 2, RX + 7, RY + 1.5, hex('#3a3430')); elipse(CX, BASE + 1, RX + 5, RY, hex('#8a7e70'));
  for (let t = 0.2; t < 2.9; t += 0.02) set(Math.round(CX + Math.cos(t) * (RX + 6)), Math.round(BASE + 2 + Math.sin(t) * (RY + 1.2)), hex('#e8d0a0'));
  const NATA = ['#3a2c26', '#5e4a40', '#8a7466', '#b8a08a', '#e0cbb0', '#fbefd8'].map(hex);
  for (let y = TOP; y <= BASE; y++) for (let x = CX - RX; x <= CX + RX; x++) { const u = (x - CX) / RX; if (Math.abs(u) > 1) continue; const yb = BASE + Math.sqrt(1 - u * u) * RY; if (y > yb) continue;
    const l = 0.25 + 0.55 * Math.sqrt(1 - u * u) + 0.15 * u - (y - TOP) / (BASE - TOP) * 0.25; set(x, y, NATA[Math.max(0, Math.min(5, Math.floor(l * 5.4 + trama(x, y) - 0.4)))]); }
  for (let x = CX - RX; x <= CX + RX; x++) { const u = (x - CX) / RX, yb = Math.round(BASE + Math.sqrt(Math.max(0, 1 - u * u)) * RY); set(x, yb, NATA[1]); }
  // el glaseado de chocolate de arriba, que gotea por el borde
  const GLA = hex('#2a140c'), GLA2 = hex('#4a2614'), GLA3 = hex('#a8683a');
  elipse(CX, TOP, RX, RY, (x, y) => (y < TOP - 2 ? GLA2 : GLA));
  for (let x = CX - RX + 1; x < CX + RX; x++) { const u = (x - CX) / RX, yb = TOP + Math.sqrt(Math.max(0, 1 - u * u)) * RY, largo = Math.round(hh(x >> 1, 3, 4) ** 2 * 9); for (let y = Math.floor(yb); y < yb + largo; y++) set(x, y, y > yb + largo - 2 ? GLA2 : GLA); }
  for (let t = 3.4; t < 6.0; t += 0.03) set(Math.round(CX + Math.cos(t) * (RX - 3)), Math.round(TOP + Math.sin(t) * (RY - 1.5)), GLA3);
  // el ribete de nata en la base, en bolitas
  for (let x = CX - RX + 2; x <= CX + RX - 2; x += 3) { const u = (x - CX) / RX, y = BASE + Math.sqrt(1 - u * u) * RY - 1; elipse(x, y, 1.6, 1.4, NATA[4]); set(x - 1, Math.round(y) - 1, NATA[5]); }
  // las velas, con sus rayas, y las llamas
  // (las velas: rayas en rojo, el único acento además del ámbar de las llamas)
  const VELAS = [[-15, 1], [-8, -2], [0, -3], [8, -2], [15, 1], [-4, 3], [5, 3]];
  for (const [dx, dy] of VELAS) { const vx = CX + dx, vy = TOP + dy; for (let y = vy - 9; y < vy; y++) { set(vx, y, (y + dx) % 3 === 0 ? hex('#c8303a') : hex('#f4ecdc')); set(vx + 1, y, (y + dx) % 3 === 0 ? hex('#7a1820') : hex('#b8ac98')); } set(vx, vy - 10, hex('#2a1a10')); }
  for (const [dx, dy] of VELAS) N.llama(CX + dx + 0.5, TOP + dy - 11, 0.9, { halo: 0.16, rh: 14 });
  halo(CX, TOP - 14, 40, 26, N.AMBAR, 0.18, 1.4);
  N.humo({ x: CX, y: TOP - 22, alto: 50, deriva: 10, amp: 4, color: '#a08a70', f: 0.28, f2: 0.14, n: 50 });
  // 5 · el mazo en primer plano, tumbado en diagonal, con la base redonda: madera que pilla la luz de las velas
  const MZ = ['#120a06', '#24140a', '#3e2412', '#5e3a1c', '#8a5a2c', '#c08848'].map(hex);
  // la base, un disco grueso
  elipse(114, 172, 20, 6, MZ[1]); elipse(114, 169, 20, 6, (x, y) => (Math.hypot((x - 122) / 20, (y - 166) / 6) < 0.6 ? MZ[4] : MZ[3]));
  for (let t = 3.3; t < 6.1; t += 0.02) set(Math.round(114 + Math.cos(t) * 19.5), Math.round(169 + Math.sin(t) * 5.6), MZ[5]);
  // la cabeza del mazo: un cilindro girado, con sus anillos, y el mango hacia la derecha
  const capsula = (x0, y0, x1, y1, r, pal) => { const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    for (let y = Math.floor(Math.min(y0, y1) - r - 1); y <= Math.max(y0, y1) + r + 1; y++) for (let x = Math.floor(Math.min(x0, x1) - r - 1); x <= Math.max(x0, x1) + r + 1; x++) {
      const px = x - x0, py = y - y0, t = Math.max(0, Math.min(L, px * ux + py * uy)), qx = px - t * ux, qy = py - t * uy, d = Math.hypot(qx, qy); if (d > r) continue;
      const v = (qx * -uy + qy * ux) / r, l = Math.max(0, 0.2 + 0.8 * Math.max(0, -v) + 0.15 * (1 - Math.abs(v))); set(x, y, pal[Math.max(0, Math.min(pal.length - 1, Math.floor(l * pal.length + trama(x, y) - 0.5)))]); } };
  capsula(130, 156, 204, 171, 2.6, MZ);                               // el mango, que sale del centro de la cabeza
  capsula(131.8, 145.5, 128.2, 166.5, 7.5, MZ);                       // la cabeza, perpendicular al mango
  for (const k of [0.2, 0.8]) { const x = 131.8 - 3.6 * k, y = 145.5 + 21 * k; for (let j = -7; j <= 7; j++) set(Math.round(x + j * 0.98), Math.round(y + j * 0.17), MZ[0]); }
  // 6 · el «$2»
  N.cifra('$2', 160, 34, { tam: 24 });
  // 7 · grano y viñeta, centrados en la columna
  N.granoVineta({ cx: 160, cy: 110, rx: 150, ry: 120, desde: 0.5 });
};
N.listo(dibujar);
</script>
</body>
</html>
