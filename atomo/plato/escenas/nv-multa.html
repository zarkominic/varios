  for (const x of [122, 192]) { rect(x - 2, 62, x + 2, 63, hex('#b8903a')); rect(x - 1, 54, x + 1, 61, hex('#d8a83a')); rect(x - 1, 46, x + 1, 53, hex('#f2ead6')); pset(x - 1, 47, hex('#fffaf0')); halo(x, 42, 7, t, x); llama(x, 46, t, x); }
  for (const x of [134, 180]) { disco(x, 59, 3, hex('#2a4a7a')); rect(x - 1, 54, x + 1, 56, hex('#2a4a7a')); pset(x - 1, 58, hex('#6a8ac0')); rect(x - 2, 62, x + 2, 63, hex('#1e3a5a')); }
  // la lámpara de aceite del escritorio, con su pantalla verde, encendida
  rect(300, 100, 306, 103, hex('#b8903a')); rect(302, 92, 304, 99, hex('#d8a83a')); R.poligono([[296, 84], [310, 84], [312, 92], [294, 92]], hex('#2a7a4a')); linea(296, 84, 310, 84, hex('#5ac07a')); rect(294, 92, 312, 92, hex('#1a4a2a'));
  for (let j = 0; j < 14; j++) for (let i = -10 - j; i <= 10 + j; i++) { const x = 303 + i, y = 93 + j; if ((x + y) % 2 === 0) pset(x, y, mez(R.pget(x, y), hex('#ffe6a0'), 0.25 * (1 - j / 14))); }
  // la gata dormida junto al fuego
  T.gato(R, 196, 154, t, { dir: -1 });
  // el caballero de 1856 cruza hasta el calendario y en «legal holiday» lo señala; la casilla del 25 se rodea en verde
  const nav = CELDA(3, 3), cx = nav[0] + 3, cy = nav[1] + 3;
  const v = tramo(t, P3 + 0.2, festivo - 0.5), sx = Math.round(lerp(118, 230, suave(v)));
  R.actor(EL.senor1857, sx, 164, t, { dir: v < 1 || t < ano56 ? 1 : -1, anda: v > 0 && v < 1, dedo: t > festivo - 0.3 && t < ano56, habla: t > ano56 && Math.sin(t * 8) > 0, sonrisa: t > festivo });
  // la dama, junto a la ventana, alza la ramita de acebo y aplaude
  const ar = t > festivo + 0.1 && t < ano56 + 0.8, dama = R.actor(EL.dama1857, 42, 172, t, { dir: 1, habla: t < festivo - 0.6 && Math.sin(t * 6) > 0.3, sostiene: ar ? [62, 136 - Math.round(Math.abs(Math.sin(t * 8)) * 2)] : true, sonrisa: t > festivo, salto: ar && t < ano56 ? Math.round(Math.abs(Math.sin(t * 8)) * 2) : 0 });
  { const [hx, hy] = dama.mano; for (const [i, j] of [[-2, -2], [-1, -3], [1, -3], [2, -2], [0, -4]]) pset(hx + i, hy + j, T.C.acebo); pset(hx - 1, hy - 4, T.C.aceboS); pset(hx, hy - 2, T.C.rojoN); pset(hx + 1, hy - 1, T.C.rojoN); }
  // el chico de los recados entra por la derecha con el periódico; en «1856» lo alza y salta
  const ch = suave(tramo(t, P3 + 0.3, festivo - 0.2)), cx2 = Math.round(lerp(336, 274, ch)), alza = t > ano56 - 0.2;
  const chico = R.actor(EL.ninoVictoriano, cx2, 176, t, { dir: -1, anda: ch > 0 && ch < 1, sostiene: alza ? [cx2 - 8, 142] : true, sonrisa: t > festivo, sorpresa: t > festivo - 0.2 && t < festivo + 0.3, salto: alza && t < ano56 + 1.0 ? Math.round(Math.abs(Math.sin((t - ano56) * 9)) * 3) : 0 });
  { const [hx, hy] = chico.mano; rect(hx - 6, hy - 8, hx + 3, hy + 2, K); rect(hx - 5, hy - 7, hx + 2, hy + 1, hex('#ece6d4')); rect(hx - 4, hy - 6, hx + 1, hy - 5, hex('#3a3a42'));
    for (let k = 0; k < 3; k++) linea(hx - 4, hy - 3 + k * 2, hx + 1, hy - 3 + k * 2, hex('#9a968a')); }
  // el aro verde alrededor del 25 en «legal holiday», el 25 que sube y el 1856 que se estampa
  if (t > festivo) { const u = tramo(t, festivo, festivo + 0.6); for (const [c, g] of [[K, 1], [hex('#3ac85a'), 0]]) for (let i = 0; i < 80 * u; i++) { const a = i / 80 * Math.PI * 2 - Math.PI / 2, x = Math.round(cx + Math.cos(a) * 6), y = Math.round(cy + Math.sin(a) * 7); rect(x - g, y - g, x + g, y + g, c); }
    if (u >= 1) R.numero('25', cx, Math.round(cy - 12 - Math.min(1, (t - festivo - 0.6) * 4) * 4), { tam: 8, centro: true, color: hex('#2a8a3a') });
    if (u >= 1 && t < festivo + 1.2) destello(cx + 8, cy - 8, 4); }
  if (t > ano56) { const e = tramo(t, ano56, ano56 + 0.15); R.numero('1856', 157, Math.round(46 - (1 - e) * 6), { tam: 16, centro: true }); }
};

// ── 4 · Glasgow, años 50: a trabajar el día de Navidad ──
const p4 = (t) => {
  const g = T.siglo17(R, t, { encuadre: 'escocia', bus: tramo(t, P4 + 0.3, P4 + 3.6) });
  const a = tramo(t, P4, dia - 0.3), b = tramo(t, P4 + 0.2, dia - 0.3);
  R.actor(EL.obreroEscoces, Math.round(lerp(-16, 130, a)), 168, t, { dir: 1, anda: a > 0 && a < 1, habla: t > dia - 0.2 && Math.sin(t * 8) > 0, sonrisa: t > dia - 0.3 });
  R.actor(EL.obreraEscocesa, Math.round(lerp(300, 156, b)), 170, t, { dir: -1, anda: b > 0 && b < 1, dedo: t > dia && t < dia + 0.8, sonrisa: t > dia - 0.3 });
  const c = tramo(t, P4 + 0.6, P5 + 0.4);
  R.actor(EL.obreroEscoces, Math.round(lerp(250, 186, c) + (t > dia ? 0 : 0)), 166, t, { dir: -1, anda: c > 0 && c < 1, pal: { C: hex('#4a4e5a'), c: hex('#34363e'), u: hex('#8a2a2a') } });
  T.siglo17Delante(R, t, { encuadre: 'escocia' });
};

// ── 5 · La parada: el autobús de las 7 llega en «late 1950s» y para junto al poste; la cola sube por la plataforma ──
// el camino de la cola (x es el borde izquierdo del actor): la acera hasta el poste, en diagonal hasta el bordillo junto
// a la plataforma de atrás, el escalón y, ya dentro, hacia la izquierda, tapados por el costado del autobús
const CAMINO = [[120, 168], [192, 168], [218, 136], [216, 126], [194, 126]];
const LARGOS = CAMINO.slice(1).map(([x, y], i) => Math.hypot(x - CAMINO[i][0], y - CAMINO[i][1]));
const enCamino = (d) => { for (let i = 0; i < LARGOS.length; i++) { if (d <= LARGOS[i] || i === LARGOS.length - 1) { const u = Math.min(1, d / LARGOS[i]); return { x: lerp(CAMINO[i][0], CAMINO[i + 1][0], u), y: lerp(CAMINO[i][1], CAMINO[i + 1][1], u), tramo: i }; } d -= LARGOS[i]; } };
const FIN = LARGOS.reduce((a, b) => a + b, 0);
const p5 = (t) => {
  // el autobús frena con la plataforma junto al poste (x 214): se pide su x y se traduce al 0–1 del decorado
  const llega = suave(tramo(t, P5 + 0.1, cincuenta + 0.3)), bxQ = lerp(420, 182, llega);
  const g = T.siglo17(R, t, { encuadre: 'escocia', camara: 'parada', bus: 1 - Math.sqrt(Math.max(0, 1 - (420 - bxQ) / 300)) });
  const x0 = g.bus - 49, platL = x0 + 87;   // el costado del autobús (de 97 px) y el borde de su plataforma de atrás
  const cola = [[EL.obreraEscocesa, 0, null], [EL.obreroEscoces, 1.3, null], [EL.obreroEscoces, 2.1, { C: hex('#5a4a3a'), c: hex('#3e3428'), u: hex('#2a4a7a') }], [EL.obreraEscocesa, 0.7, { C: hex('#7a3a4a'), c: hex('#5a2a36'), u: hex('#e0c060') }]];
  const gente = cola.map(([def, f, pal], k) => { const sale = cincuenta + 0.25 + k * 0.2, d = 72 - 22 * k + Math.max(0, t - sale) * 40; return { def, f, pal, k, d, anda: t > sale, ...enCamino(Math.min(d, FIN)) }; })
    .filter((p) => p.d < FIN).sort((a, b) => a.y - b.y);
  for (const p of gente) {
    const x = Math.round(p.x), y = Math.round(p.y), dentro = p.tramo === 3;
    // ya en la plataforma, hacia dentro: se guarda el costado del autobús y se repinta encima (lo tapa)
    let guardado = null;
    if (dentro) { guardado = []; for (let yy = 70; yy <= 132; yy++) for (let xx = x0; xx < platL; xx++) guardado.push(R.pget(xx, yy)); }
    R.actor(p.def, x, y, t, { dir: dentro ? -1 : 1, anda: p.anda, salto: !p.anda && t < cincuenta && Math.sin(t * 5 + p.f * 3) > 0.85 ? 1 : 0, sonrisa: t > cincuenta, sorpresa: t > cincuenta - 0.2 && t < cincuenta + 0.4 && p.k === 0, ...(p.pal ? { pal: p.pal } : {}) });
    if (guardado) { let i = 0; for (let yy = 70; yy <= 132; yy++) for (let xx = x0; xx < platL; xx++) R.pset(xx, yy, guardado[i++]); }
    // el vaho del aliento en el frío, mientras esperan
    if (!p.anda) { const u = ((t * 0.8 + p.k * 0.33) % 1); if (u < 0.6) R.disco(x + 16 + Math.round(u * 8), 147 - Math.round(u * 6), 1 + u * 2, mez(hex('#dce6f0'), hex('#9aa6b4'), u)); }
  }
  T.siglo17Delante(R, t, { encuadre: 'escocia', camara: 'parada' });
};
