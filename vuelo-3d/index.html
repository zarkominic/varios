<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vuelo 3D · prueba local</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>
<style>
  html,body{margin:0;height:100%;background:#0b1020;font:15px/1.5 system-ui,sans-serif;color:#e8eef7}
  #mapa{position:absolute;inset:0}
  .panel{position:absolute;left:24px;bottom:24px;z-index:2;background:rgba(10,14,28,.92);
         border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:18px 22px;max-width:430px;
         backdrop-filter:blur(8px);box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .panel h1{margin:0 0 4px;font-size:19px;font-weight:650}
  .panel p{margin:0;color:#9fb0c9;font-size:14px}
  .panel .precio{color:#1bc9a0;font-weight:650}
  .pasos{position:absolute;left:24px;top:24px;z-index:2;display:flex;flex-direction:column;gap:8px}
  /* ⚠ SIN CAJA, Y EL LOGO A LA VISTA (Zarko, 16/09: «así grande está bien sin
     fondo negro»). Salió de un accidente —una expresión regular se comió estas
     reglas— y quedó mejor que lo que había: el logo limpio sobre el mapa y los
     avisos como texto, sin tres rectángulos negros tapando el barrio. Se deja
     así a propósito, con el logo algo más pequeño. La sombra es lo que los
     hace legibles sobre cualquier zona del mapa, clara u oscura. */
  /* Las marcas del mapa: casita para la vivienda, número para cada comparable.
     Los colores son los de Templo —verde #00af93 y azul #10263c—, no una
     paleta inventada: están en tokens.css. */
  .marca{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;
         font:700 14px/1 system-ui,sans-serif;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.5);
         opacity:0;transform:translateY(8px) scale(.9);transition:opacity .5s,transform .5s;
         pointer-events:none;cursor:pointer}
  .marca.on{opacity:1;transform:none;pointer-events:auto}
  .marca--tuya{width:38px;height:38px;background:#00af93;border:2.5px solid #e6f7f3;font-size:19px}
  .marca--comp{background:#10263c;border:2px solid #1bc9a0;color:#eef3f8}
  .leyenda{position:absolute;right:24px;top:24px;z-index:2;width:270px;
           background:rgba(10,14,28,.92);border:1px solid rgba(255,255,255,.12);
           border-radius:14px;padding:14px 16px;backdrop-filter:blur(8px);
           box-shadow:0 12px 40px rgba(0,0,0,.5);opacity:0;transition:opacity .6s}
  .leyenda.on{opacity:1}
  .leyenda h2{margin:0 0 10px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
              color:#8fa3bf;font-weight:650}
  .ley{display:flex;align-items:center;gap:10px;padding:7px 0;
       border-top:1px solid rgba(255,255,255,.08)}
  .ley:first-of-type{border-top:0}
  /* Los mismos círculos que el mapa: si el 1 es azul allí, es azul aquí. */
  .ley__n{flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:50%;
          font:700 12.5px/1 system-ui,sans-serif;background:#10263c;
          border:2px solid #1bc9a0;color:#eef3f8}
  .ley--tuya .ley__n{background:#00af93;border:2px solid #e6f7f3;font-size:15px}
  /* En gris, el comparable cuyo anuncio no publica el número de la calle: no
     se pinta en el mapa porque inventarle un punto sugeriría una cercanía que
     nadie ha comprobado. Mismo criterio que el mapa plano desde el 12/09. */
  .ley--sin .ley__n{background:rgba(255,255,255,.08);color:#7d8ea6;
                    border:1px dashed rgba(255,255,255,.25)}
  .ley--sin .ley__t b{color:#9fb0c9}
  .leyenda .nota{margin:10px 0 0;padding-top:9px;border-top:1px solid rgba(255,255,255,.08);
                 font-size:11.5px;color:#7d8ea6;line-height:1.45}
  .ley__t{flex:1;min-width:0}
  .ley__t b{display:block;font-size:14px;font-weight:650}
  .ley__t span{display:block;font-size:12px;color:#8fa3bf;white-space:nowrap;
               overflow:hidden;text-overflow:ellipsis}
  .paso{font-size:14px;font-weight:600;color:#fff;white-space:nowrap;
        text-shadow:0 2px 10px rgba(0,0,0,.85),0 0 24px rgba(0,0,0,.6);
        opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s}
  .paso.on{opacity:1;transform:none}
  .pasos{gap:6px}
  .marca-templo{margin:0 0 14px}
  .marca-templo img{display:block;height:54px;width:auto;
                    filter:drop-shadow(0 3px 14px rgba(0,0,0,.7))}

  /* ⚠ MÓVIL (Zarko, 16/09: «en PC perfecto, ¿hay como adaptarlo a móvil?»).
     En el iPhone la leyenda ocupaba media pantalla, tapaba el mapa y dejaba el
     logo y los avisos debajo. Aquí baja al pie, como una tarjeta que se lee
     deslizando, y el mapa se queda con la pantalla entera. Lo de arriba a la
     izquierda se encoge para no competir con nada. */
  @media (max-width: 760px){
    .leyenda{position:absolute;left:12px;right:12px;top:auto;bottom:12px;width:auto;
             max-height:44vh;overflow-y:auto;padding:12px 14px;border-radius:16px;
             -webkit-overflow-scrolling:touch}
    .leyenda h2{margin-bottom:6px}
    .ley{padding:6px 0}
    .ley__t b{font-size:15px}
    .ley__t span{font-size:12.5px;white-space:normal}   /* que no corte la calle */
    .leyenda .nota{font-size:11.5px}
    /* El panel de la dirección se funde con la leyenda: iría encima. */
    .panel{position:static;margin:0 0 10px;padding:0;background:none;border:0;
           box-shadow:none;backdrop-filter:none;max-width:none}
    .panel h1{font-size:16px}
    .panel p{font-size:12.5px}
    .marca-templo img{height:38px}
    .paso{font-size:12.5px}
    .pasos{gap:3px}
    /* Los mandos, arriba a la derecha: abajo los taparía la leyenda. */
    .mandos{top:16px;right:12px;bottom:auto;flex-direction:column}
    .mandos button{padding:7px 12px;font-size:12.5px}
  }
</style>
</head>
<body>
<div id="mapa"></div>
<div class="pasos">
  <div class="marca-templo"><img src="logo-templo.png" alt="Templo Consulting"></div>
  <div class="paso" id="p1">Situando el inmueble…</div>
  <div class="paso" id="p2">Buscando comparables…</div>
  <div class="paso" id="p3">Ubicación confirmada</div>
</div>
<div class="panel">
  <h1 id="titulo">Calle de Alfredo Marquerie 55</h1>
  <p id="sub">28034 Madrid · <span class="precio">715.000 €</span> de publicación</p>
</div>
<div class="leyenda" id="leyenda">
  <div id="hueco-panel"></div>
  <h2>En esta zona</h2>
  <div id="leyenda-filas"></div>
</div>
<div class="mandos">
  <button id="otra">Volver a volar</button>
  <button id="girar">Girar / parar</button>
</div>
<script>
const TOKEN = new URLSearchParams(location.search).get('t') || '';
if(!TOKEN){ document.getElementById('sub').textContent =
  'Falta el token: abre la página con ?t=TU_TOKEN'; }
mapboxgl.accessToken = TOKEN;

// Datos reales del reporte de prueba. En el informe vendrán del servidor.
// ⚠ EL PUNTO DEL PORTAL, NO EL DE LA PARCELA (Zarko, 16/09: «pintó pero el
// 53»). El Catastro devuelve el CENTRO DE LA PARCELA, y en una manzana grande
// eso cae más cerca del edificio vecino: por eso se iluminaba el 53. Se probó
// a coger el edificio más próximo y seguía fallando, porque el error está en
// el punto, no en la elección. Mapbox geocodifica la dirección y devuelve el
// portal: para Marquerie 55, a 24 m del punto del Catastro — justo la
// diferencia. Las coordenadas del Catastro se conservan como respaldo.
const TUYA = {lat: 40.4856705948679, lon: -3.70633018453754,
              titulo: 'Alfredo Marquerie 55', precio: 715000,
              direccion: 'Calle de Alfredo Marquerie 55, Madrid'};

window.TUYA = TUYA;   // diagnóstico local
async function afinarPunto(){
  if (!TUYA.direccion) return;
  try {
    const q = encodeURIComponent(TUYA.direccion);
    const r = await fetch('https://api.mapbox.com/search/geocode/v6/forward?q=' + q +
                          '&country=es&limit=1&access_token=' + TOKEN);
    const d = await r.json();
    const c = d.features && d.features[0] && d.features[0].geometry.coordinates;
    if (!c) return;
    // Solo se acepta si está CERCA: si el geocodificador se va lejos, es que
    // no ha entendido la dirección y vale más el punto del Catastro.
    const m = Math.hypot((c[1] - TUYA.lat) * 111320,
                         (c[0] - TUYA.lon) * 111320 * Math.cos(TUYA.lat * Math.PI / 180));
    if (m < 150) { TUYA.lat = c[1]; TUYA.lon = c[0]; }
  } catch (e) {}
}
const COMPARABLES = [
  {lat: 40.48546, lon: -3.70605, precio: 690000, m2: 120, eur_m2: 5750, calle: 'Alfredo Marquerie'},
  {lat: 40.48897, lon: -3.70849, precio: 735000, m2: 138, eur_m2: 5326, calle: 'Valencia de Don Juan'},
  // ⚠ SIN POSICIÓN FIABLE: el portal publicó la calle pero no el número. En el
  // mapa plano estos van «a una esquina, en gris», y el pie lo explica. Aquí no
  // hay esquina: van SOLO a la leyenda, en gris y con su aviso. Inventarles un
  // punto cerca del inmueble sugeriría una cercanía que nadie ha comprobado.
  {lat: null, lon: null, precio: 705000, m2: 128, eur_m2: 5508, calle: 'Ginzo de Limia'}
];

const mapa = new mapboxgl.Map({
  container: 'mapa', style: 'mapbox://styles/mapbox/standard',
  center: [TUYA.lon, TUYA.lat], zoom: 1.2, pitch: 0, bearing: 0,
  antialias: true, projection: 'globe',
  // ⚠ LOS COLORES VAN AQUÍ, EN `config`, NO CON setConfigProperty (16/09).
  // Ese fue el fallo: se llamaba después y el edificio nunca se teñía. Y
  // `show3dLandmarks: false` es obligatorio según la documentación —un
  // edificio que Mapbox trae como modelo 3D no admite este coloreado—.
  config: {basemap: {colorBuildingSelect: '#00af93',
                     colorBuildingHighlight: '#1bc9a0',
                     show3dLandmarks: false}}
});

window.__m = mapa;   // solo para diagnóstico local
mapa.on('style.load', () => {
  try {
    mapa.setConfigProperty('basemap', 'lightPreset', 'night');
    mapa.setConfigProperty('basemap', 'showPointOfInterestLabels', true);
  } catch(e) {}
  mapa.setFog({'space-color':'#050914','star-intensity':0.5,
               'color':'#0b1020','high-color':'#12203c'});
  // Primero se afina el punto, y luego se pinta: si no, la casita y el halo
  // se quedarían en las coordenadas viejas.
  afinarPunto().then(() => { pintar(); leyenda(); volar(); });
});

const eur = n => new Intl.NumberFormat('es-ES').format(Math.round(n)) + ' €';

function leyenda(){
  const caja = document.getElementById('leyenda-filas');
  caja.innerHTML =
    `<div class="ley ley--tuya"><div class="ley__n">\u2302</div><div class="ley__t">
       <b>${eur(TUYA.precio)}</b><span>Tu vivienda · precio de publicación</span></div></div>` +
    COMPARABLES.map((c, i) => {
      const sitio = c.lat != null && c.lon != null;
      return `<div class="ley${sitio ? '' : ' ley--sin'}"><div class="ley__n">${i + 1}</div>
        <div class="ley__t"><b>${eur(c.precio)}</b>
        <span>${c.calle} · ${c.m2} m² · ${new Intl.NumberFormat('es-ES').format(c.eur_m2)} €/m²${sitio ? '' : ' · sin número'}</span>
      </div></div>`;
    }).join('');
  const sinSitio = COMPARABLES.filter(c => c.lat == null || c.lon == null).length;
  caja.insertAdjacentHTML('beforeend', sinSitio
    ? `<p class="nota">${sinSitio === 1 ? 'Uno de los anuncios no publica' :
        'Algunos anuncios no publican'} el número de la calle, así que no ${
        sinSitio === 1 ? 'aparece' : 'aparecen'} en el mapa. ${
        sinSitio === 1 ? 'Su precio cuenta igual' : 'Sus precios cuentan igual'} en la valoración.</p>`
    : '');
}

function pintar(){
  // El inmueble: halo verde Templo y su etiqueta con el precio.
  mapa.addSource('tuya', {type:'geojson', data:{type:'Feature', properties:{},
    geometry:{type:'Point', coordinates:[TUYA.lon, TUYA.lat]}}});
  mapa.addLayer({id:'tuya-halo', type:'circle', source:'tuya',
    paint:{'circle-radius':['interpolate',['linear'],['zoom'],14,10,18,46],
           'circle-color':'#1bc9a0','circle-opacity':0.3,'circle-blur':0.8}});
  const eTuya = document.createElement('div');
  eTuya.className = 'marca marca--tuya';
  eTuya.textContent = '\u2302';          // la casita
  eTuya.title = 'Tu vivienda';
  new mapboxgl.Marker({element:eTuya}).setLngLat([TUYA.lon, TUYA.lat]).addTo(mapa);

  // Los comparables, con su precio a la vista y el detalle al pulsar.
  COMPARABLES.forEach((c, i) => {
    if (c.lat == null || c.lon == null) return;   // sin sitio: solo en la leyenda
    const el = document.createElement('div');
    el.className = 'marca marca--comp';
    el.textContent = (i + 1);
    // Los comparables cuelgan por ENCIMA de su punto, y los que caen muy cerca
    // del inmueble suben un poco más para no taparlo.
    const cerca = Math.hypot((c.lat-TUYA.lat)*111320, (c.lon-TUYA.lon)*84000) < 90;
    new mapboxgl.Marker({element:el, offset:[0, cerca ? -46 : -18]})
      .setLngLat([c.lon, c.lat])
      .setPopup(new mapboxgl.Popup({offset:14}).setHTML(
        `<b>${c.calle}</b><br>${eur(c.precio)} · ${c.m2} m²<br>` +
        `<span style="color:#9fb0c9">${new Intl.NumberFormat('es-ES').format(c.eur_m2)} €/m²</span>`))
      .addTo(mapa);
  });
}

// ⚠ EL ENCUADRE LO DECIDEN LOS DATOS, NO UN ZOOM FIJO. Medido en los reportes
// reales: la distancia máxima a un comparable es de unos 420 m de mediana,
// pero un caso raro puede tenerlos lejos y con zoom fijo se saldrían del mapa.
// `fitBounds` mete al inmueble y a TODOS los comparables, y luego se limita el
// zoom para que nunca quede ni tan lejos que no se vea el edificio ni tan
// cerca que no se vea el entorno.
// ⚠ SE PINTA EL EDIFICIO DE VERDAD, NO UN PRISMA ENCIMA (Zarko, 16/09:
// «parece un edificio fantasma encima»). El primer intento fue teñirlo con
// `queryRenderedFeatures` —no funciona: en Standard los edificios vienen en un
// basemap importado— y el segundo, levantar una columna propia, que es lo que
// se veía como fantasma.
//
// Lo correcto está en la documentación del estilo Standard: expone un
// FEATURESET llamado `buildings` con estados `highlight` y `select`, y dos
// propiedades de configuración para el color. Así se ilumina EL edificio, con
// su forma y su altura reales.
function iluminarEdificio(){
  if (iluminado) return;
  // ⚠ EL MÁS CERCANO AL PUNTO, NO EL PRIMERO QUE DEVUELVA LA CONSULTA (Zarko,
  // 16/09: «pintó pero el 53»). Las coordenadas del Catastro apuntan al CENTRO
  // DE LA PARCELA, no al portal, así que dentro del cuadro de búsqueda caen
  // varios edificios y el primero de la lista puede ser el vecino. Se calcula
  // el centro de cada uno y se queda el que esté más cerca del punto.
  const p = mapa.project([TUYA.lon, TUYA.lat]);
  const r = 22;
  const cerca = mapa.queryRenderedFeatures(
    [[p.x - r, p.y - r], [p.x + r, p.y + r]],
    {target: {featuresetId: 'buildings', importId: 'basemap'}});
  if (!cerca || !cerca.length) return;

  const centro = f => {                    // centro aproximado del polígono
    let x = 0, y = 0, n = 0;
    const anillos = f.geometry.type === 'MultiPolygon'
      ? f.geometry.coordinates.flat() : f.geometry.coordinates;
    (anillos || []).forEach(a => (a || []).forEach(c => { x += c[0]; y += c[1]; n++; }));
    return n ? [x / n, y / n] : null;
  };
  let mejor = null, menor = Infinity;
  cerca.forEach(f => {
    const c = centro(f);
    if (!c) return;
    const d = Math.hypot(c[0] - TUYA.lon, c[1] - TUYA.lat);
    if (d < menor) { menor = d; mejor = f; }
  });
  if (mejor) {
    mapa.setFeatureState(mejor, {select: true});
    iluminado = true;
  }
}

function encuadre(){
  const b = new mapboxgl.LngLatBounds([TUYA.lon, TUYA.lat], [TUYA.lon, TUYA.lat]);
  COMPARABLES.forEach(c => { if (c.lat != null) b.extend([c.lon, c.lat]); });
  const cam = mapa.cameraForBounds(b, {padding:{top:120,bottom:150,left:80,right:80},
                                       pitch:62, bearing:-28});
  // En móvil se cierra un poco más y se inclina más: en una pantalla estrecha
  // el mismo encuadre deja la cámara casi plana y se pierde el volumen, que es
  // justo lo que hace que esto valga la pena.
  const movil = window.matchMedia('(max-width: 760px)').matches;
  return {center: cam.center,
          zoom: Math.min(Math.max(cam.zoom, movil ? 15.6 : 14.5), movil ? 17.6 : 17.2),
          pitch: movil ? 66 : 62, bearing: -28};
}

let girando = false, ultimo = 0, iluminado = false;
Object.defineProperty(window,'iluminado',{get:()=>iluminado});
function bucle(t){
  if(girando){ if(ultimo) mapa.setBearing(mapa.getBearing() + (t-ultimo)*0.004); ultimo = t; }
  else ultimo = t;
  requestAnimationFrame(bucle);
}
requestAnimationFrame(bucle);
const paso = (id, ms) => setTimeout(() => document.getElementById(id).classList.add('on'), ms);

function volar(){
  ['p1','p2','p3'].forEach(i => document.getElementById(i).classList.remove('on'));
  document.querySelectorAll('.marca').forEach(el => el.classList.remove('on'));
  document.getElementById('leyenda').classList.remove('on');
  girando = false;
  mapa.jumpTo({center:[TUYA.lon, TUYA.lat], zoom:1.2, pitch:0, bearing:0});
  setTimeout(() => mapa.flyTo({...encuadre(), duration:7000, curve:1.5, essential:true}), 400);
  paso('p1', 1200); paso('p2', 3400); paso('p3', 6200);
  // ⚠ CUANDO EL MAPA ESTÁ QUIETO, NO A LOS N SEGUNDOS (16/09). Se probó con
  // un `setTimeout` y fallaba: a los 6,3 s el vuelo aún dibujaba y la consulta
  // no encontraba el edificio. `idle` es el momento en que Mapbox ya ha pintado
  // todo lo visible; ahí sí está. Se reintenta un par de veces por si la
  // tesela del edificio llega con retraso.
  // ⚠ CUANDO EL VUELO HA TERMINADO DE VERDAD (16/09). Se probó con `once('idle')`
  // y fallaba: ese idle salta ANTES de que el vuelo empiece —la cámara aún
  // está en el globo— y allí no hay ningún edificio que teñir. `moveend` es el
  // final del `flyTo`; a partir de ahí se reintenta hasta que la tesela del
  // edificio esté dibujada.
  let intentos = 0;
  const probar = () => {
    try { iluminarEdificio(); } catch(e) {}
    if (!iluminado && ++intentos < 8) setTimeout(probar, 700);
  };
  mapa.once('moveend', () => setTimeout(probar, 300));
  setTimeout(() => {
    document.querySelectorAll('.marca').forEach((el, i) =>
      setTimeout(() => el.classList.add('on'), i * 200));
    document.getElementById('leyenda').classList.add('on');
  }, 6600);
  setTimeout(() => { girando = true; }, 7800);
}

// ⚠ EN MÓVIL, LA DIRECCIÓN VA DENTRO DE LA LEYENDA (16/09): son dos tarjetas
// que en una pantalla estrecha se estorban, y juntas se leen de una vez.
if (window.matchMedia('(max-width: 760px)').matches) {
  const panel = document.querySelector('.panel'), hueco = document.getElementById('hueco-panel');
  if (panel && hueco) hueco.appendChild(panel);
}

document.getElementById('otra').onclick = volar;
document.getElementById('girar').onclick = () => { girando = !girando; };
['mousedown','touchstart','wheel'].forEach(e => mapa.on(e, () => { girando = false; }));
</script>
</body>
</html>
