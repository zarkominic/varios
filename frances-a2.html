<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Francés A2 · 3º ESO — Estudio y Práctica</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449;
    --accent:#38bdf8; --accent2:#818cf8;
    --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b;
    --text:#e2e8f0; --muted:#94a3b8; --line:#334155;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}
  header{padding:28px 18px;text-align:center;background:linear-gradient(135deg,#1e3a8a,#5b21b6)}
  header h1{margin:0 0 6px;font-size:1.5rem}
  header p{margin:0;color:#cbd5e1;font-size:.95rem}
  .wrap{max-width:920px;margin:0 auto;padding:18px}
  .progress-bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
  .pbar-track{height:10px;background:var(--card2);border-radius:99px;overflow:hidden}
  .pbar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
  .pbar-label{font-size:.8rem;color:var(--muted);margin-top:4px;text-align:center}
  nav.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
  nav.tabs button{background:var(--card);color:var(--text);border:1px solid var(--line);padding:8px 12px;border-radius:99px;cursor:pointer;font-size:.85rem;transition:.2s}
  nav.tabs button:hover{border-color:var(--accent)}
  nav.tabs button.active{background:var(--accent);color:#0b1120;font-weight:600;border-color:var(--accent)}
  section.topic{display:none;animation:fade .3s}
  section.topic.show{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  .theory{background:var(--card);border-left:4px solid var(--accent2);border-radius:10px;padding:16px 18px;margin-bottom:18px}
  .theory h2{margin:0 0 10px;font-size:1.2rem;color:var(--accent)}
  .theory h3{margin:14px 0 6px;font-size:1rem;color:var(--accent2)}
  .theory table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.9rem}
  .theory td,.theory th{border:1px solid var(--line);padding:6px 9px;text-align:left}
  .theory th{background:var(--card2)}
  .theory .tip{background:#0c4a6e33;border:1px solid #0ea5e955;padding:8px 12px;border-radius:8px;margin-top:10px;font-size:.88rem}
  .ex{background:var(--card);border-radius:10px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line)}
  .ex .q{margin-bottom:8px;font-size:.97rem}
  .ex .hint{font-size:.8rem;color:var(--muted);font-style:italic;margin-bottom:8px}
  .ex input[type=text]{background:var(--bg);border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:7px;font-size:.95rem;width:180px;margin:2px}
  .ex input.correct{border-color:var(--ok);background:#052e1633}
  .ex input.incorrect{border-color:var(--bad);background:#450a0a33}
  .opts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .opts button{background:var(--card2);color:var(--text);border:1px solid var(--line);padding:6px 12px;border-radius:7px;cursor:pointer;font-size:.9rem}
  .opts button.sel{border-color:var(--accent);background:#0c4a6e}
  .opts button.correct{background:#052e16;border-color:var(--ok);color:#bbf7d0}
  .opts button.incorrect{background:#450a0a;border-color:var(--bad);color:#fecaca}
  .ex .check{margin-top:10px;background:var(--accent2);color:#0b1120;border:none;padding:7px 16px;border-radius:7px;cursor:pointer;font-weight:600}
  .feedback{margin-top:9px;font-size:.88rem;padding:8px 10px;border-radius:7px;display:none}
  .feedback.ok{display:block;background:#052e1655;border:1px solid var(--ok);color:#bbf7d0}
  .feedback.bad{display:block;background:#450a0a55;border:1px solid var(--bad);color:#fecaca}
  .ex .sol{font-weight:600;color:#fde68a}
  footer{text-align:center;padding:30px 18px;color:var(--muted);font-size:.85rem}
  .topic-score{font-size:.85rem;color:var(--muted);margin-bottom:14px}
  .reset{background:transparent;border:1px solid var(--line);color:var(--muted);padding:5px 12px;border-radius:7px;cursor:pointer;font-size:.8rem;margin-left:8px}
  code{background:var(--card2);padding:1px 5px;border-radius:4px;font-size:.88em}
</style>
</head>

 id:'poss', title:'Posesivos',
 theory:`<h2>2 · Adjetivos y pronombres posesivos</h2>
   <h3>Adjetivos posesivos</h3>
   <p>Van <b>delante del nombre</b> y concuerdan con la cosa poseída (no con el dueño).</p>
   <table>
     <tr><th>Dueño</th><th>masc. sing.</th><th>fem. sing.</th><th>plural</th></tr>
     <tr><td>je</td><td>mon</td><td>ma</td><td>mes</td></tr>
     <tr><td>tu</td><td>ton</td><td>ta</td><td>tes</td></tr>
     <tr><td>il/elle</td><td>son</td><td>sa</td><td>ses</td></tr>
     <tr><td>nous</td><td>notre</td><td>notre</td><td>nos</td></tr>
     <tr><td>vous</td><td>votre</td><td>votre</td><td>vos</td></tr>
     <tr><td>ils/elles</td><td>leur</td><td>leur</td><td>leurs</td></tr>
   </table>
   <h3>Pronombres posesivos</h3>
   <p>Sustituyen al nombre y llevan artículo: <b>le mien, le tien, le sien…</b></p>
   <table>
     <tr><th></th><th>masc.</th><th>fem.</th><th>m. plural</th><th>f. plural</th></tr>

     <tr><td>il/elle</td><td>le sien</td><td>la sienne</td><td>les siens</td><td>les siennes</td></tr>
     <tr><td>nous</td><td>le nôtre</td><td>la nôtre</td><td colspan="2">les nôtres</td></tr>
     <tr><td>vous</td><td>le vôtre</td><td>la vôtre</td><td colspan="2">les vôtres</td></tr>
     <tr><td>ils/elles</td><td>le leur</td><td>la leur</td><td colspan="2">les leurs</td></tr>

  {type:'fill', q:'C’est ton chien ou ______ ? (el mío)', hint:'pronombre m.', answers:['le mien']},
 ]
},
{
 id:'demo', title:'Demostrativos',
 theory:`<h2>3 · Pronombres demostrativos</h2>
   <p>Sustituyen a un nombre ya mencionado. Concuerdan en género y número. Se añade <b>-ci</b> (cercano, "este") o <b>-là</b> (lejano, "ese/aquel").</p>

{
 id:'imp', title:'Imparfait',
 theory:`<h2>4 · L’imparfait</h2>
   <p>Tiempo del pasado para <b>descripciones, costumbres y acciones en curso</b> ("antes…", "siempre…", "cuando era pequeño…").</p>
   <h3>Formación</h3>
   <p>Raíz de la 1ª persona del plural del presente (<code>nous</code>) sin <code>-ons</code> + terminaciones:</p>
   <table>
     <tr><th>Pronombre</th><th>Terminación</th><th>Ej. parler</th></tr>
     <tr><td>je</td><td>-ais</td><td>parlais</td></tr>
     <tr><td>tu</td><td>-ais</td><td>parlais</td></tr>
     <tr><td>il/elle</td><td>-ait</td><td>parlait</td></tr>
     <tr><td>nous</td><td>-ions</td><td>parlions</td></tr>
     <tr><td>vous</td><td>-iez</td><td>parliez</td></tr>
     <tr><td>ils/elles</td><td>-aient</td><td>parlaient</td></tr>
   </table>
   <div class="tip">💡 Único irregular en la raíz: <b>être → ét-</b> (j’étais, tu étais, il était, nous étions, vous étiez, ils étaient). <code>avoir → av-</code>, <code>aller → all-</code>, <code>prendre → pren-</code>, <code>faire → fais-</code>.</div>`,
 ex:[
  {type:'fill', q:'Quand j’(être) ______ petite…', hint:'je, être', answers:['étais','etais']},
  {type:'fill', q:'…j’(aller) ______ à l’école en bus.', hint:'je, aller', answers:['allais']},
  {type:'fill', q:'Avant, il (prendre) ______ toujours un croissant.', hint:'il, prendre', answers:['prenait']},

 id:'pcimp', title:'Passé composé / Imparfait',
 theory:`<h2>5 · Passé composé vs Imparfait</h2>
   <table>
     <tr><th>Imparfait</th><th>Passé composé</th></tr>
     <tr><td>Descripción / decorado del pasado<br>(C’était l’automne, il pleuvait)</td><td>Acción puntual y acabada<br>(On a décidé, on a pris)</td></tr>
     <tr><td>Costumbre / acción repetida<br>(les oiseaux jouaient)</td><td>Hecho que hace avanzar la historia<br>(on est rentrés)</td></tr>
     <tr><td>Acción en curso / fondo</td><td>Acción que interrumpe</td></tr>
   </table>
   <div class="tip">💡 Truco: el <b>imparfait</b> pone el "telón de fondo" (tiempo, lugar, ambiente, lo habitual); el <b>passé composé</b> son las "acciones concretas" que pasaron una vez. <br>P. ej.: « Il <b>pleuvait</b> (fondo) quand on <b>a décidé</b> (acción) de sortir. »</div>
   <p>Elige la opción correcta en cada frase.</p>`,

 id:'fut', title:'Futur simple',
 theory:`<h2>6 · Le futur simple</h2>
   <p>Para acciones futuras ("mañana", "el año que viene"). Se forma sobre el <b>infinitivo</b> + terminaciones (¡las mismas que avoir en presente!).</p>
   <table>
     <tr><th>Pronombre</th><th>Terminación</th><th>Ej. parler</th></tr>
     <tr><td>je</td><td>-ai</td><td>parlerai</td></tr>
     <tr><td>tu</td><td>-as</td><td>parleras</td></tr>
     <tr><td>il/elle</td><td>-a</td><td>parlera</td></tr>
     <tr><td>nous</td><td>-ons</td><td>parlerons</td></tr>
     <tr><td>vous</td><td>-ez</td><td>parlerez</td></tr>
     <tr><td>ils/elles</td><td>-ont</td><td>parleront</td></tr>
   </table>
   <h3>Raíces irregulares (memorízalas)</h3>
   <p><code>être→ser-</code>, <code>avoir→aur-</code>, <code>aller→ir-</code>, <code>faire→fer-</code>, <code>venir→viendr-</code>, <code>voir→verr-</code>, <code>pouvoir→pourr-</code>, <code>vouloir→voudr-</code>, <code>devoir→devr-</code>, <code>envoyer→enverr-</code>.</p>
   <div class="tip">💡 Los verbos en <code>-er</code> regulares conservan la <b>e</b> del infinitivo: essayer → j’essaierai / j’essayerai (ambas válidas).</div>`,

     <tr><td><b>où</b></td><td>lugar o tiempo</td><td>la ville <b>où</b> j’habite</td></tr>
     <tr><td><b>dont</b></td><td>sustituye a <b>de</b> (de qui/de quoi)</td><td>un sport <b>dont</b> tout le monde parle</td></tr>
   </table>
   <div class="tip">💡 Truco rápido: si después viene un <b>verbo</b> → <b>qui</b>. Si después viene un <b>sujeto</b> (je, tu, les médecins…) → <b>que</b>. Si la frase original llevaría <b>de</b> → <b>dont</b>. Lugar/tiempo → <b>où</b>.</div>`,

/* ============================================================
   RENDER + LÓGICA
   ============================================================ */
const state = {}; // id -> Set índices correctos
TOPICS.forEach(t=>state[t.id]=new Set());

const tabsEl=document.getElementById('tabs');
const contentEl=document.getElementById('content');

TOPICS.forEach((t,i)=>{
  const b=document.createElement('button');
  b.textContent=t.title;
  b.onclick=()=>showTopic(t.id,b);
  if(i===0)b.classList.add('active');
  tabsEl.appendChild(b);

  const sec=document.createElement('section');
  sec.className='topic'+(i===0?' show':'');
  sec.id='sec-'+t.id;
  let html=`<div class="theory">${t.theory}</div>`;
  html+=`<div class="topic-score" id="score-${t.id}"></div>`;
  t.ex.forEach((e,idx)=>{
    html+=renderEx(t.id,e,idx);
  });
  sec.innerHTML=html;
  contentEl.appendChild(sec);
});

function renderEx(tid,e,idx){
  const eid=`${tid}-${idx}`;
  let inner=`<div class="q"><b>${idx+1}.</b> ${e.q}</div>`;
  if(e.hint) inner+=`<div class="hint">pista: ${e.hint}</div>`;
  if(e.type==='fill'){
    inner+=`<input type="text" id="in-${eid}" autocomplete="off" spellcheck="false">`;
    inner+=`<button class="check" onclick="checkFill('${tid}',${idx})">Comprobar</button>`;
  } else if(e.type==='multi'){
    inner+=`<div class="opts" id="opts-${eid}">`;
    e.options.forEach((o,oi)=>{
      inner+=`<button onclick="selOpt('${eid}',${oi},this)">${o}</button>`;
    });
    inner+=`</div>`;
    inner+=`<button class="check" onclick="checkMulti('${tid}',${idx})">Comprobar</button>`;
  }
  inner+=`<div class="feedback" id="fb-${eid}"></div>`;
  return `<div class="ex" id="ex-${eid}">${inner}</div>`;
}

let selections={}; // eid -> texto opción seleccionada
function selOpt(eid,oi,btn){
  const cont=document.getElementById('opts-'+eid);
  [...cont.children].forEach(c=>c.classList.remove('sel'));
  btn.classList.add('sel');
  selections[eid]=btn.textContent;
}

function checkFill(tid,idx){
  const e=TOPICS.find(t=>t.id===tid).ex[idx];
  const eid=`${tid}-${idx}`;
  const inp=document.getElementById('in-'+eid);
  const fb=document.getElementById('fb-'+eid);
  const val=norm(inp.value);
  const ok=e.answers.some(a=>norm(a)===val);
  applyResult(tid,idx,ok,inp,fb,e.answers[0]);
}

function checkMulti(tid,idx){
  const e=TOPICS.find(t=>t.id===tid).ex[idx];
  const eid=`${tid}-${idx}`;
  const fb=document.getElementById('fb-'+eid);
  const sel=selections[eid];
  if(sel===undefined){fb.className='feedback bad';fb.textContent='Elige una opción primero.';return;}
  const ok=norm(sel)===norm(e.answer);
  const cont=document.getElementById('opts-'+eid);
  [...cont.children].forEach(c=>{
    c.classList.remove('correct','incorrect');
    if(norm(c.textContent)===norm(e.answer))c.classList.add('correct');
    else if(norm(c.textContent)===norm(sel))c.classList.add('incorrect');
  });
  if(ok){fb.className='feedback ok';fb.textContent='✅ Correct !';}
  else{fb.className='feedback bad';fb.innerHTML=`❌ Incorrect. Réponse : <span class="sol">${e.answer}</span>`;}
  recordResult(tid,idx,ok);
}

function applyResult(tid,idx,ok,inp,fb,sol){
  inp.classList.remove('correct','incorrect');
  inp.classList.add(ok?'correct':'incorrect');
  if(ok){fb.className='feedback ok';fb.textContent='✅ Correct !';}
  else{fb.className='feedback bad';fb.innerHTML=`❌ Réponse : <span class="sol">${sol}</span>`;}
  recordResult(tid,idx,ok);
}

function recordResult(tid,idx,ok){
  if(ok)state[tid].add(idx); else state[tid].delete(idx);
  updateScores();
}

function updateScores(){
  let total=0,correct=0;
  TOPICS.forEach(t=>{
    total+=t.ex.length;
    correct+=state[t.id].size;
    const s=document.getElementById('score-'+t.id);
    if(s)s.textContent=`Aciertos en este tema: ${state[t.id].size} / ${t.ex.length}`;
  });
  document.getElementById('pcount').textContent=correct;
  document.getElementById('pbar').style.width=(total?correct/total*100:0)+'%';
}

function showTopic(id,btn){
  document.querySelectorAll('section.topic').forEach(s=>s.classList.remove('show'));
  document.getElementById('sec-'+id).classList.add('show');
  [...tabsEl.children].forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

function resetAll(){
  if(!confirm('¿Reiniciar todos los ejercicios?'))return;
  location.reload();
}

updateScores();
</script>
